# Revisa los avisos de Marcos (en su gist de sincronización) y los manda a su cel como notificación.
# Disparador principal: cron-job.org llama cada pocos minutos a workflow_dispatch (ver docs/avisos-cron-job.md),
# porque el cron de GitHub se retrasa o se salta corridas. El schedule de abajo queda solo de respaldo.
# No hay avisos duplicados: avisos.js anota cada aviso enviado y la concurrencia evita dos corridas a la vez.
name: Avisos al cel
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: read
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools-push
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # versiones fijas (package-lock.json) y sin correr scripts de instalación de terceros
      - run: cd tools-push && npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools-push/avisos.js
        env:
          MED_SYNC: ${{ secrets.MED_SYNC }}
