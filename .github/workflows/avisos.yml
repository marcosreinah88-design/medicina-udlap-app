# Cada 10 minutos revisa los avisos de Marcos (en su gist de sincronización) y los manda a su cel como notificación
name: Avisos al cel
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tools-push
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # versiones fijas (package-lock.json) y sin correr scripts de instalación de terceros
      - run: cd tools-push && npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools-push/avisos.js
        env:
          MED_SYNC: ${{ secrets.MED_SYNC }}
