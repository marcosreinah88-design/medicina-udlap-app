# Freno de mano: si por error se sube una clave (firma Ed25519, clave ghp_/github_pat_ de GitHub,
# clave de Gemini AIza…) o un archivo que no debe ir al repo público, este paso falla y lo avisa.
# No usa servicios de terceros ni secretos; solo revisa el código del commit.
name: Revisar que no haya claves
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Buscar claves y archivos prohibidos
        run: |
          set -u
          fallo=0
          if git grep -I -lE \
              -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' \
              -e 'gh[pousr]_[A-Za-z0-9]{36}' \
              -e 'github_pat_[A-Za-z0-9_]{50,}' \
              -e 'AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::Hay algo que parece una clave en los archivos de arriba. Quítala y cámbiala (rotar) en GitHub/Google."
            fallo=1
          fi
          if git ls-files | grep -iE '(\.pem|\.key|\.p12|\.env|seed-cto\.json)$'; then
            echo "::error::Estos archivos no deben estar en el repo público (claves o datos privados)."
            fallo=1
          fi
          exit $fallo
