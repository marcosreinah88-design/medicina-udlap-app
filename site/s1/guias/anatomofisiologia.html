<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatomofisiología</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: temas divididos en subtemas con diagramas de flujo, cifras clave, conceptos para revelar,
   mnemotecnias, tablas con autoexamen, alto rendimiento, correlación clínica, mini-quiz por tema y progreso; tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#0f6f6a; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:22px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc .tg{margin-bottom:2px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.toc .tg.ok>a span{color:var(--ok)}
.toc .tg.ok>a span::before{content:"✓"}
.toc .tg.ok>a span i{display:none}
.toc .sl{display:none;margin:2px 0 6px 30px;border-left:2px solid var(--c-soft)}
.toc .tg.on .sl{display:block}
.toc .sl a{font-size:.82rem;padding:3px 10px;color:var(--muted)}
.toc .sl a:hover{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:20px}
.tools .pg{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0;font-size:.85rem;color:var(--muted)}
.tools .pg i{flex:1;height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;min-width:60px}
.tools .pg i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--hy));border-radius:9px;transition:width .4s}
.tools .pg strong{color:var(--ink);font-family:var(--f-m);font-weight:600}
.tg-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.tg-btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tg-btn:hover{border-color:var(--c)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:26px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.tema.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.thead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:start;padding:22px 24px 18px;background:linear-gradient(135deg,var(--c-soft),var(--paper) 70%);border-bottom:1px solid var(--line)}
.thead .bn{grid-row:span 3;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1.5rem var(--f-d);box-shadow:0 8px 18px -10px var(--c)}
.tema.ok .thead .bn{background:var(--ok)}
.tema .num{font:500 .72rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:2px 0 4px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0}
.schips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.schips a{font-size:.78rem;font-weight:600;text-decoration:none;color:var(--c-ink);background:var(--paper);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:999px;padding:3px 10px}
.schips a:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tbody{padding:8px 24px 20px}
details.sub{border-bottom:1px dashed var(--line);padding:6px 0}
details.sub:last-of-type{border-bottom:0}
details.sub>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0 6px}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary .sn{font:600 .8rem var(--f-m);color:#fff;background:var(--c);border-radius:7px;padding:2px 7px;flex:none}
details.sub>summary h3{margin:0;font:700 1.18rem/1.25 var(--f-d);flex:1}
details.sub>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 3px;transition:transform .2s}
details.sub:not([open])>summary::after{transform:rotate(-45deg)}
.sub .si{color:var(--muted);margin:0 0 6px;font-style:italic}
.sub ul{margin:6px 0;padding-left:1.15em}
.sub li{margin:5px 0}
.sub li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid}
.box h4{margin:0 0 4px;font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase}
.box ul{margin:0}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h4{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h4{color:var(--cl)}
.box h4::before{margin-right:6px}
.box.hy h4::before{content:"★"}
.box.cl h4::before{content:"✚"}
/* tabla con autoexamen */
.tblw{margin:12px 0}
.tblw .tbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--c-soft);font-weight:700}
tbody tr:hover td{background:color-mix(in srgb,var(--c) 6%,transparent)}
td:first-child{font-weight:600}
.tblw.quiz td:not(:first-child){cursor:pointer}
.tblw.quiz td:not(:first-child):not(.shown){color:transparent;background:repeating-linear-gradient(-45deg,var(--sunk) 0 6px,transparent 6px 12px)}
.tblw.quiz td:not(:first-child):not(.shown) *{color:transparent}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--c)}
.mini[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
/* diagrama de flujo */
.flow{margin:14px 0;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.flow .fh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flow .fh b{font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0;counter-reset:f}
.flow li{counter-increment:f;display:flex;align-items:center}
.flow li .st{position:relative;background:var(--paper);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:12px;padding:8px 12px 8px 36px;font-size:.88rem;line-height:1.35;max-width:240px;min-height:100%;display:flex;align-items:center;transition:opacity .25s,transform .25s}
.flow li .st::before{content:counter(f);position:absolute;left:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font:600 .7rem/20px var(--f-m);text-align:center}
.flow li+li::before{content:"→";flex:none;width:26px;text-align:center;color:var(--c);font:700 1.1rem/1 var(--f-b)}
.flow.step li.dim .st{opacity:.15;transform:scale(.97)}
.flow.step li.dim::before{opacity:.2}
.flow li.cur .st{box-shadow:0 0 0 3px color-mix(in srgb,var(--hy) 45%,transparent);border-color:var(--hy)}
@media (max-width:640px){.flow ol{flex-direction:column;align-items:stretch;gap:0}.flow li{flex-direction:column;align-items:stretch}.flow li+li::before{content:"↓";width:auto;text-align:left;padding:2px 0 2px 14px}.flow li .st{max-width:none}}
/* cifras clave */
.stats-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:linear-gradient(160deg,var(--c-soft),var(--paper));border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));border-radius:14px;padding:12px 14px}
.stat .v{display:block;font:700 1.5rem/1.1 var(--f-d);color:var(--c-ink)}
.stat .l{display:block;font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.35}
/* conceptos para revelar */
.terms{margin:14px 0}
.terms .th{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.terms .th b{font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.terms .tgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.term{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px;transition:border-color .2s,background .2s}
.term:hover{border-color:var(--c)}
.term .w{font:700 1.02rem/1.25 var(--f-d)}
.term .d{font-size:.86rem;line-height:1.4;color:var(--ink)}
.term .h{font:500 .68rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:auto}
.term[aria-expanded="false"] .d{display:none}
.term[aria-expanded="true"]{background:var(--c-soft);border-color:var(--c)}
.term[aria-expanded="true"] .h{display:none}
/* mnemotecnia */
.mn{margin:12px 0;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;border:2px dashed color-mix(in srgb,var(--hy) 55%,var(--line));background:color-mix(in srgb,var(--hy) 6%,var(--paper))}
.mn .mi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--hy);color:#fff;font:700 1rem var(--f-d)}
.mn b.mm{display:block;font:700 1.08rem/1.3 var(--f-d);color:var(--ink)}
.mn span{font-size:.88rem;color:var(--muted)}
/* palabras clave ocultas */
body.hidekw .sub li b:not(.shown),body.hidekw .sub td b:not(.shown){color:transparent;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 30%,transparent) 0 5px,color-mix(in srgb,var(--c) 14%,transparent) 5px 10px);border-radius:4px;cursor:pointer}
/* ponte a prueba */
.pp{margin:6px 24px 0;padding:16px 18px;border-radius:14px;background:var(--sunk)}
.pp h4{margin:0 0 10px;font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.pq+.pq{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pq p{margin:0 0 8px;font-weight:600}
.pq .po{display:grid;gap:6px}
.pq .po button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer;font-size:.92rem}
.pq .po button:hover:not(:disabled){border-color:var(--c)}
.pq .po button.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--paper))}
.pq .po button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.pq .po button:disabled{cursor:default}
.pq .pe{margin-top:8px;font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--cl-soft)}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 24px 22px}
.tfoot button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.tfoot button:hover{border-color:var(--c)}
.tfoot .dom{margin-left:auto;background:var(--paper);border-color:var(--ok);color:var(--ok)}
.tfoot .dom[aria-pressed="true"]{background:var(--ok);color:#fff}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:minmax(0,1fr)}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.toc .sl{display:none!important}.thead{padding:18px 16px 14px;gap:4px 12px}.thead .bn{width:42px;height:42px;font-size:1.2rem;border-radius:12px}.schips{grid-column:1/-1}.tbody{padding:4px 16px 16px}.pp{margin:6px 16px 0}.tfoot{padding:14px 16px 18px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="hero gut" data-code="AF"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div>
      <div class="tools" role="toolbar" aria-label="Herramientas de estudio">
        <div class="pg"><span>Dominados</span><i><b id="pgBar"></b></i><strong id="pgTxt"></strong></div>
        <button class="tg-btn" id="kwBtn" type="button" aria-pressed="false" title="Oculta las palabras en negritas; tócalas para revelarlas">Ocultar palabras clave</button>
        <button class="tg-btn" id="foldBtn" type="button" aria-pressed="false">Contraer subtemas</button>
      </div>
      <div id="temas"></div>
    </div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>

<script>

   if(!f.classList.contains("step")){f.classList.add("step");f.dataset.k=0}else f.dataset.k=+f.dataset.k+1;
   const k=+f.dataset.k;if(k>=li.length){f.classList.remove("step");li.forEach(x=>x.classList.remove("dim","cur"));b.textContent="Paso a paso ▶";return}
   li.forEach((x,n)=>{x.classList.toggle("dim",n>k);x.classList.toggle("cur",n===k)});b.textContent=k+1<li.length?`Siguiente (${k+1}/${li.length}) ▶`:"Ver todo ✓";return}
 if(b.parentElement.classList.contains("po")){const q=b.closest(".pq"),a=+q.dataset.a,ok=+b.dataset.n===a;q.querySelectorAll(".po button").forEach(x=>{x.disabled=true;if(+x.dataset.n===a)x.classList.add("good")});if(!ok)b.classList.add("wrong");const pe=q.querySelector(".pe");pe.hidden=false;pe.innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+pe.innerHTML;return}
 if(b.dataset.d!==undefined){const i=+b.dataset.d,on=!dom.has(i);on?dom.add(i):dom.delete(i);saveDom();b.setAttribute("aria-pressed",on);b.textContent=on?"✓ Dominado":"Marcar como dominado";b.closest(".tema").classList.toggle("ok",on);prog();return}
 if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}
});
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
