<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatomofisiología</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#0f6f6a; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="AF"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"anatomofisiologia","title":"Anatomofisiología","kicker":"Primer semestre · Anatomofisiología","desc":"Recorrido por los aparatos y sistemas del cuerpo: cómo están hechos y cómo funcionan, con los datos que conectan la estructura con la clínica.","nota":"","temas":[{"t":"Organización del cuerpo y homeostasis","res":["<b>Posición anatómica<\/b>: de pie, mirando al frente, brazos a los lados con las palmas hacia adelante, pies juntos.","Planos: <b>sagital<\/b> (derecha/izquierda; el mediosagital divide en mitades iguales), <b>coronal o frontal<\/b> (anterior/posterior), <b>transversal o axial<\/b> (superior/inferior).","Términos: medial/lateral, proximal/distal (extremidades), superficial/profundo, craneal/caudal, ipsilateral/contralateral.","Cavidades: dorsal (craneal y vertebral) y ventral (torácica: pleurales y mediastino; abdominopélvica). Abdomen en <b>9 regiones<\/b> o 4 cuadrantes.","<b>Homeostasis<\/b>: mantener el medio interno estable. Componentes: receptor → centro integrador → efector. <b>Retroalimentación negativa<\/b> (la mayoría: temperatura, glucemia, presión) vs <b>positiva<\/b> (amplifica: parto con oxitocina, coagulación, pico de LH).","Líquidos corporales: agua ≈ 60 % del peso (regla 60-40-20): 40 % intracelular, 20 % extracelular (15 % intersticial, 5 % plasma)."],"hy":["Ejemplos de retroalimentación positiva: oxitocina en el parto, cascada de coagulación, pico de LH en la ovulación y lactancia.","Regla 60-40-20 del agua corporal total, intracelular y extracelular."],"cl":["La exploración y la imagen se describen con estos términos: un corte axial de tomografía se ve como si se mirara desde los pies del paciente.","Dolor en el cuadrante inferior derecho → apéndice; en el hipocondrio derecho → vesícula biliar."],"cards":[{"f":"Plano que divide en anterior y posterior","b":"Coronal (frontal)."},{"f":"Ejemplo clásico de retroalimentación positiva","b":"Oxitocina durante el parto (también coagulación y pico de LH)."},{"f":"Porcentaje de agua corporal y su distribución","b":"60 % del peso: 40 % intracelular y 20 % extracelular."},{"f":"Componentes de un asa de control homeostático","b":"Receptor (sensor), centro integrador y efector."}],"quiz":[{"q":"¿Qué proceso usa retroalimentación positiva?","o":["Contracciones uterinas en el parto","Regulación de la glucemia","Termorregulación","Control de la presión arterial por barorreceptores"],"a":0,"e":"La oxitocina aumenta la contracción, que a su vez libera más oxitocina hasta la expulsión."},{"q":"Un paciente de 70 kg tiene aproximadamente cuánta agua en el espacio extracelular:","o":["3.5 L","28 L","42 L","14 L"],"a":3,"e":"20 % de 70 kg ≈ 14 L (60 % total = 42 L)."}],"intro":"Niveles: químico → celular → tisular → órgano → sistema → organismo."},{"t":"Sistema esquelético y articulaciones","res":["Funciones: sostén, protección, movimiento, reserva de calcio y fósforo, hematopoyesis (médula roja).","Esqueleto <b>axial<\/b> (cráneo, columna, costillas, esternón) y <b>apendicular<\/b> (cinturas y extremidades).","Tipos de hueso: largos (fémur), cortos (carpo), planos (esternón, cráneo), irregulares (vértebras), sesamoideos (rótula).","Hueso largo: <b>diáfisis<\/b>, <b>epífisis<\/b>, <b>metáfisis<\/b> con la placa de crecimiento, periostio, cavidad medular.","Articulaciones: <b>fibrosas<\/b> (suturas, sindesmosis), <b>cartilaginosas<\/b> (sínfisis del pubis, discos) y <b>sinoviales<\/b> (libre movimiento: cápsula, membrana sinovial, cartílago hialino, líquido sinovial).","Sinoviales según forma: esferoidea (hombro, cadera), troclear o bisagra (codo), trocoide o pivote (atlantoaxoidea, radioulnar proximal), condílea (radiocarpiana), en silla de montar (carpometacarpiana del pulgar), plana (intercarpianas)."],"hy":["La articulación del hombro es la más móvil y la que más se luxa (generalmente anterior).","El calcio sérico se regula por PTH (lo sube), calcitriol (lo sube) y calcitonina (lo baja)."],"cl":["Las fracturas en niños pueden afectar la placa de crecimiento (clasificación de Salter-Harris).","<b>Osteoartrosis<\/b>: desgaste del cartílago articular; <b>artritis reumatoide<\/b>: inflamación autoinmune de la sinovial."],"cards":[{"f":"Número de huesos del adulto","b":"206."},{"f":"Ejemplo de articulación en silla de montar","b":"Carpometacarpiana del pulgar."},{"f":"Articulación tipo pivote","b":"Atlantoaxoidea (C1–C2) y radioulnar proximal."},{"f":"Partes de la articulación sinovial","b":"Cápsula, membrana sinovial, líquido sinovial y cartílago articular hialino."}],"quiz":[{"q":"¿Qué tipo de articulación es la sínfisis del pubis?","o":["Cartilaginosa","Sinovial plana","Fibrosa","Sinovial esferoidea"],"a":0,"e":"Las sínfisis tienen fibrocartílago entre los huesos."},{"q":"El hueso sesamoideo más grande del cuerpo es:","o":["El escafoides","El pisiforme","El calcáneo","La rótula"],"a":3,"e":"La rótula se forma dentro del tendón del cuádriceps."}],"intro":"206 huesos en el adulto: esqueleto axial y apendicular."},{"t":"Sistema muscular","res":["Partes: vientre, tendones; <b>origen<\/b> (inserción fija, proximal) e <b>inserción<\/b> (móvil, distal).","Por función: <b>agonista<\/b> (motor principal), <b>antagonista<\/b>, <b>sinergista<\/b>, fijador.","<b>Unión neuromuscular<\/b>: la motoneurona libera <b>acetilcolina<\/b> → receptor nicotínico de la placa → potencial de acción muscular → Ca²⁺ → contracción. La <b>acetilcolinesterasa<\/b> termina la señal.","<b>Unidad motora<\/b>: una motoneurona + todas las fibras que inerva (pocas en músculos finos como los oculares; muchas en el cuádriceps).","Tipos de fibra: <b>I<\/b> (lentas, oxidativas, rojas, resistentes: postura) y <b>II<\/b> (rápidas, glucolíticas, blancas: fuerza).","Contracción <b>isotónica<\/b> (cambia la longitud) e <b>isométrica<\/b> (cambia la tensión, longitud igual)."],"hy":["<b>Miastenia gravis<\/b>: anticuerpos contra el receptor nicotínico de acetilcolina → debilidad que empeora con el uso, ptosis y diplopía; mejora con anticolinesterásicos.","Unidades motoras pequeñas = control fino; grandes = fuerza."],"cl":["<b>Toxina botulínica<\/b>: impide la liberación de acetilcolina → parálisis flácida descendente (y uso terapéutico).","<b>Rabdomiólisis<\/b>: CK muy elevada y mioglobinuria → riesgo de lesión renal aguda."],"cards":[{"f":"Neurotransmisor de la unión neuromuscular","b":"Acetilcolina sobre receptores nicotínicos."},{"f":"Fibras musculares de la postura","b":"Tipo I (lentas, oxidativas, rojas)."},{"f":"Definición de unidad motora","b":"Una motoneurona y todas las fibras musculares que inerva."},{"f":"Contracción isométrica","b":"Aumenta la tensión sin cambiar la longitud del músculo."}],"quiz":[{"q":"Paciente con ptosis y diplopía que empeoran al final del día. Blanco del autoanticuerpo:","o":["Acetilcolinesterasa","Receptor nicotínico de acetilcolina","Canal de calcio presináptico","Receptor muscarínico M2"],"a":1,"e":"Miastenia gravis. (Contra el canal de calcio presináptico es Lambert-Eaton, que mejora con el uso.)"},{"q":"La toxina botulínica causa parálisis porque:","o":["Inhibe la acetilcolinesterasa","Impide la liberación de acetilcolina en la terminal","Bloquea el receptor nicotínico","Destruye la mielina"],"a":1,"e":"Escinde proteínas SNARE necesarias para la exocitosis."}],"intro":"Unos 600 músculos esqueléticos producen movimiento, postura y calor."},{"t":"Sistema nervioso: organización","res":["Encéfalo: <b>cerebro<\/b> (lóbulos frontal, parietal, temporal, occipital, ínsula), <b>diencéfalo<\/b> (tálamo, hipotálamo), <b>tronco<\/b> (mesencéfalo, puente, bulbo) y <b>cerebelo<\/b>.","Funciones de lóbulos: frontal (motor, área de Broca, juicio), parietal (sensibilidad), temporal (audición, área de Wernicke, memoria), occipital (visión).","<b>Meninges<\/b>: duramadre, aracnoides (espacio subaracnoideo con LCR) y piamadre. El LCR se produce en los <b>plexos coroideos<\/b> (~500 mL/día) y se reabsorbe en las granulaciones aracnoideas.","Médula espinal: termina en <b>L1–L2<\/b> (cono medular) en el adulto; 31 pares de nervios espinales. Sustancia gris en H (asta anterior motora, posterior sensitiva).","<b>Sistema nervioso autónomo<\/b>: <b>simpático<\/b> (toracolumbar T1–L2; \"lucha o huida\"; noradrenalina en el efector) y <b>parasimpático<\/b> (craneosacro: NC III, VII, IX, X y S2–S4; \"reposo y digestión\"; acetilcolina).","12 pares craneales: I olfatorio, II óptico, III motor ocular común, IV troclear, V trigémino, VI abducens, VII facial, VIII vestibulococlear, IX glosofaríngeo, X vago, XI accesorio, XII hipogloso."],"hy":["La punción lumbar se hace en <b>L3–L4 o L4–L5<\/b> (debajo del cono medular); la línea que une las crestas ilíacas pasa por L4.","Afasia de <b>Broca<\/b> (frontal): no fluente, comprensión conservada. <b>Wernicke<\/b> (temporal): fluente sin sentido, comprensión alterada."],"cl":["<b>Evento vascular cerebral<\/b> de la arteria cerebral media izquierda: hemiparesia derecha de predominio facio-braquial y afasia.","Hidrocefalia: exceso de LCR por obstrucción o mala reabsorción."],"cards":[{"f":"Dónde termina la médula espinal en el adulto","b":"L1–L2 (cono medular)."},{"f":"Nivel de la punción lumbar","b":"L3–L4 o L4–L5 (crestas ilíacas = L4)."},{"f":"Origen del simpático y del parasimpático","b":"Simpático toracolumbar (T1–L2); parasimpático craneosacro (NC III, VII, IX, X y S2–S4)."},{"f":"Dónde se produce el LCR","b":"Plexos coroideos de los ventrículos."},{"f":"Par craneal que inerva al recto lateral","b":"VI, abducens."}],"quiz":[{"q":"Paciente que entiende lo que se le dice pero habla con esfuerzo y frases cortas. Lesión en:","o":["Lóbulo occipital","Lóbulo temporal superior (Wernicke)","Lóbulo frontal inferior izquierdo (Broca)","Cerebelo"],"a":2,"e":"Afasia de Broca: expresión no fluente con comprensión conservada."},{"q":"¿Qué par craneal lleva la mayor parte del parasimpático a vísceras torácicas y abdominales?","o":["IX, glosofaríngeo","X, vago","III, motor ocular común","VII, facial"],"a":1,"e":"El vago inerva corazón, pulmones y tubo digestivo hasta el ángulo esplénico del colon."}],"intro":"Central (encéfalo y médula) y periférico (nervios craneales y espinales, ganglios)."},{"t":"Sistema cardiovascular","res":["Corazón en el mediastino medio; 4 cavidades. Circulación <b>pulmonar<\/b> (VD → arteria pulmonar → pulmones → venas pulmonares → AI) y <b>sistémica<\/b> (VI → aorta → tejidos → venas cavas → AD).","Válvulas: auriculoventriculares (<b>tricúspide<\/b> derecha, <b>mitral<\/b> izquierda) y semilunares (pulmonar, aórtica). R1 = cierre AV; R2 = cierre semilunar.","Sistema de conducción: <b>nodo sinusal<\/b> (marcapasos, 60–100 lpm) → aurículas → <b>nodo AV<\/b> (retraso) → haz de His → ramas → fibras de Purkinje.","Coronarias: la <b>coronaria izquierda<\/b> (descendente anterior y circunfleja) y la <b>derecha<\/b> (irriga el nodo sinusal y AV en la mayoría).","Gasto cardiaco = <b>frecuencia cardiaca × volumen sistólico<\/b> (≈ 5 L/min). Presión arterial = gasto cardiaco × resistencia periférica.","Vasos: arterias elásticas (aorta), musculares (distribución), <b>arteriolas<\/b> (resistencia), capilares (intercambio), venas (capacitancia, contienen ~65 % del volumen)."],"hy":["La <b>descendente anterior<\/b> es la arteria que más se ocluye en el infarto (\"la que hace viudas\"); irriga la cara anterior y 2/3 anteriores del tabique.","Las arteriolas determinan la resistencia vascular periférica; las venas guardan la mayor parte del volumen sanguíneo."],"cl":["<b>Infarto agudo de miocardio<\/b>: oclusión coronaria → necrosis; elevación del ST en las derivaciones de la cara afectada.","<b>Hipertensión arterial<\/b>: PA ≥ 130/80 (ACC/AHA) o ≥ 140/90 (otras guías); daña corazón, riñón, cerebro y retina."],"cards":[{"f":"Fórmula del gasto cardiaco","b":"Frecuencia cardiaca × volumen sistólico (≈ 5 L/min)."},{"f":"Marcapasos normal del corazón","b":"Nodo sinoauricular (60–100 lpm)."},{"f":"¿Qué produce el primer ruido cardiaco?","b":"Cierre de las válvulas mitral y tricúspide."},{"f":"Vasos de resistencia","b":"Arteriolas."},{"f":"Arteria coronaria más ocluida en el infarto","b":"Descendente anterior (rama de la coronaria izquierda)."}],"quiz":[{"q":"La sangre oxigenada regresa al corazón por:","o":["Las venas pulmonares a la aurícula izquierda","Las arterias pulmonares","El seno coronario","La vena cava superior"],"a":0,"e":"Las venas pulmonares son las únicas venas (posnatales) con sangre oxigenada."},{"q":"Frecuencia cardiaca 70 lpm y volumen sistólico 80 mL. Gasto cardiaco:","o":["150 L/min","5.6 L/min","0.875 L/min","8 L/min"],"a":1,"e":"70 × 80 = 5600 mL/min."}],"intro":"Bomba (corazón) + tubos (arterias, capilares, venas) + líquido (sangre)."},{"t":"Sistema respiratorio","res":["Vía aérea superior (nariz, faringe, laringe) e inferior (tráquea, bronquios, bronquiolos). La tráquea se bifurca en la <b>carina (T4–T5)<\/b>.","El <b>bronquio principal derecho<\/b> es más corto, ancho y vertical → los cuerpos extraños aspirados van más a la derecha.","Pulmón derecho: 3 lóbulos (2 cisuras); izquierdo: 2 lóbulos y língula (escotadura cardiaca).","Alvéolos: <b>neumocitos I<\/b> (intercambio, 95 % de la superficie) y <b>neumocitos II<\/b> (producen <b>surfactante<\/b>, que reduce la tensión superficial; se regeneran).","Mecánica: inspiración activa (<b>diafragma<\/b>, nervio frénico C3–C5, e intercostales externos); espiración en reposo pasiva (retroceso elástico).","Intercambio por difusión según gradientes de presión parcial (PAO₂ ≈ 100 mmHg; PvO₂ ≈ 40 mmHg). El O₂ viaja 98 % unido a hemoglobina; el CO₂ principalmente como bicarbonato."],"hy":["\"<b>C3, 4, 5 keep the diaphragm alive<\/b>\": nervio frénico.","El surfactante aparece hacia la semana 24–28 y madura hacia la 35; su déficit causa el síndrome de dificultad respiratoria del prematuro."],"cl":["<b>Aspiración de cuerpo extraño<\/b>: más frecuente en el bronquio derecho (lóbulo inferior derecho en bipedestación).","<b>Neumotórax<\/b>: aire en la pleura → colapso pulmonar; el a tensión se descomprime de urgencia."],"cards":[{"f":"Nivel de la carina","b":"T4–T5 (ángulo esternal)."},{"f":"Células que producen surfactante","b":"Neumocitos tipo II."},{"f":"Raíces del nervio frénico","b":"C3, C4 y C5."},{"f":"Lóbulos de cada pulmón","b":"Derecho 3; izquierdo 2 (con língula)."},{"f":"Forma principal de transporte del CO₂","b":"Bicarbonato en el plasma."}],"quiz":[{"q":"Un niño aspira un cacahuate. ¿A dónde es más probable que llegue?","o":["Bronquio principal izquierdo","Esófago","Bronquio principal derecho","Língula"],"a":2,"e":"El bronquio derecho es más vertical, corto y ancho."},{"q":"El músculo principal de la inspiración en reposo es:","o":["Recto abdominal","Esternocleidomastoideo","Diafragma","Intercostales internos"],"a":2,"e":"Al contraerse desciende y aumenta el volumen torácico."}],"intro":"Conducción (nariz a bronquiolos terminales) e intercambio (bronquiolos respiratorios y alvéolos)."},{"t":"Sistema digestivo","res":["Pared del tubo: <b>mucosa, submucosa (plexo de Meissner), muscular externa (plexo de Auerbach), serosa/adventicia<\/b>.","Boca (digestión mecánica, amilasa salival) → faringe → esófago (25 cm) → <b>estómago<\/b> (HCl y factor intrínseco de células <b>parietales<\/b>; pepsinógeno de células <b>principales<\/b>) → <b>duodeno<\/b> (recibe bilis y jugo pancreático) → yeyuno e íleon (absorción; el <b>íleon terminal<\/b> absorbe <b>B12 y sales biliares<\/b>) → colon (agua y electrolitos) → recto y ano.","<b>Hígado<\/b>: metabolismo de nutrientes, síntesis de albúmina y factores de coagulación, detoxificación, producción de bilis; irrigación dual (vena porta ≈ 75 % y arteria hepática ≈ 25 %).","<b>Páncreas<\/b> exocrino (enzimas: amilasa, lipasa, proteasas; bicarbonato) y endocrino (islotes: β insulina, α glucagón, δ somatostatina).","Hormonas: <b>gastrina<\/b> (secreción ácida), <b>CCK<\/b> (vesícula y enzimas pancreáticas), <b>secretina<\/b> (bicarbonato pancreático)."],"hy":["El <b>hierro<\/b> se absorbe en duodeno; el <b>folato<\/b> en yeyuno; la <b>B12<\/b> y sales biliares en el <b>íleon terminal<\/b>.","CCK contrae la vesícula (respuesta a grasa); secretina libera bicarbonato (respuesta a ácido)."],"cl":["Resección ileal o enfermedad de Crohn ileal → déficit de B12 y malabsorción de grasas.","<b>Cirrosis<\/b>: hipoalbuminemia, coagulopatía (↑ INR), hipertensión portal.","<b>Úlcera péptica<\/b>: H. pylori y AINE son las causas principales."],"cards":[{"f":"Células gástricas que producen HCl y factor intrínseco","b":"Células parietales."},{"f":"Sitio de absorción de la vitamina B12","b":"Íleon terminal."},{"f":"Hormona que contrae la vesícula biliar","b":"Colecistocinina (CCK)."},{"f":"Plexo nervioso entre las capas musculares","b":"Mientérico de Auerbach (motilidad)."},{"f":"Proporción de flujo hepático de la vena porta","b":"≈ 75 %."}],"quiz":[{"q":"Paciente con resección de íleon terminal. ¿Qué deficiencia es más probable?","o":["Ácido fólico","Hierro","Vitamina B12","Calcio"],"a":2,"e":"El complejo B12–factor intrínseco se absorbe en el íleon terminal."},{"q":"¿Qué hormona estimula la secreción de bicarbonato pancreático?","o":["Somatostatina","Colecistocinina","Secretina","Gastrina"],"a":2,"e":"La secretina la liberan las células S del duodeno ante el ácido."}],"intro":"Tubo de la boca al ano más glándulas anexas: salivales, hígado, vesícula y páncreas."},{"t":"Sistema urinario","res":["Riñones retroperitoneales (T12–L3; el derecho un poco más bajo por el hígado). Hilio: vena (anterior), arteria, pelvis (posterior).","<b>Nefrona<\/b> (≈ 1 millón por riñón): corpúsculo renal (glomérulo + cápsula de Bowman) → túbulo contorneado proximal → asa de Henle → túbulo contorneado distal → túbulo colector.","Funciones: filtrar desechos, regular agua y electrolitos, equilibrio ácido-base, <b>eritropoyetina<\/b>, <b>renina<\/b>, activación de vitamina D (1-α-hidroxilasa).","<b>TCP<\/b>: reabsorbe ~65 % del Na⁺ y agua, toda la glucosa y aminoácidos. <b>Asa ascendente gruesa<\/b>: NKCC2 (blanco de furosemida), impermeable al agua. <b>TCD<\/b>: NCC (blanco de tiazidas). <b>Colector<\/b>: aldosterona (Na⁺/K⁺) y ADH (acuaporinas).","<b>Tasa de filtración glomerular<\/b> normal ≈ 120 mL/min; se estima con la creatinina sérica.","Sistema <b>renina-angiotensina-aldosterona<\/b>: ↓ presión de perfusión → renina (aparato yuxtaglomerular) → angiotensina I → (ECA, pulmón) → angiotensina II (vasoconstricción, aldosterona, sed, ADH)."],"hy":["La glucosa aparece en orina cuando supera el umbral renal (~180–200 mg/dL).","Angiotensina II contrae la <b>arteriola eferente<\/b> → mantiene la filtración; por eso los IECA pueden bajarla."],"cl":["<b>Insuficiencia renal crónica<\/b>: anemia (↓ EPO), hiperfosfatemia, hiperpotasemia, acidosis y osteodistrofia (↓ calcitriol).","<b>Litiasis renal<\/b>: cólico irradiado a la ingle; la mayoría son de oxalato de calcio."],"cards":[{"f":"Unidad funcional del riñón","b":"Nefrona."},{"f":"Filtración glomerular normal","b":"≈ 120 mL/min (180 L/día)."},{"f":"Segmento donde actúa la furosemida","b":"Asa de Henle ascendente gruesa (cotransportador NKCC2)."},{"f":"Hormona renal que estimula la eritropoyesis","b":"Eritropoyetina."},{"f":"Dónde se convierte la angiotensina I en II","b":"Pulmón, por la enzima convertidora (ECA)."}],"quiz":[{"q":"¿En qué segmento se reabsorbe la mayor parte del sodio filtrado?","o":["Túbulo distal","Túbulo contorneado proximal","Túbulo colector","Asa descendente"],"a":1,"e":"El TCP reabsorbe ~65 % del Na⁺ y del agua filtrados."},{"q":"Paciente con insuficiencia renal crónica y hemoglobina de 8 g/dL. Causa principal de la anemia:","o":["Hemólisis","Hiperesplenismo","Déficit de B12","Déficit de eritropoyetina"],"a":3,"e":"El riñón dañado produce poca EPO; la anemia es normocítica normocrómica."}],"intro":"Riñones que filtran ~180 L de plasma al día y producen 1–2 L de orina."},{"t":"Sistemas endocrino y reproductor","res":["<b>Hipotálamo<\/b> controla la <b>adenohipófisis<\/b> por hormonas liberadoras (sistema porta) y produce ADH y oxitocina que se guardan en la <b>neurohipófisis<\/b>.","Adenohipófisis: <b>FLAT PiG<\/b> → FSH, LH, ACTH, TSH, prolactina, GH. La prolactina está bajo inhibición tónica por <b>dopamina<\/b>.","Tiroides: T4 y T3 (metabolismo basal); calcitonina (células C). Paratiroides: PTH (↑ calcio).","Suprarrenal: corteza <b>GFR<\/b> → glomerular (aldosterona, sal), fasciculada (cortisol, azúcar), reticular (andrógenos, sexo); médula (adrenalina y noradrenalina). \"Sal, azúcar y sexo: cuanto más profundo, más dulce\".","Páncreas endocrino: insulina (β) y glucagón (α).","Reproductor masculino: testículos (espermatogénesis en túbulos seminíferos; <b>células de Sertoli<\/b> = FSH, <b>células de Leydig<\/b> = LH → testosterona), epidídimo, conducto deferente, vesículas seminales, próstata.","Reproductor femenino: ovarios, trompas (fecundación en la <b>ampolla<\/b>), útero, vagina. Ciclo de 28 días: fase folicular (estrógenos), <b>pico de LH<\/b> (ovulación ≈ día 14), fase lútea (progesterona del cuerpo lúteo)."],"hy":["Leydig = LH = testosterona; Sertoli = FSH = espermatogénesis e inhibina.","La ovulación ocurre tras el pico de LH; la fase lútea dura ~14 días constantes."],"cl":["<b>Hipotiroidismo<\/b>: cansancio, intolerancia al frío, aumento de peso, bradicardia; TSH alta con T4 libre baja (primario).","<b>Prolactinoma<\/b>: galactorrea, amenorrea e infertilidad; se trata con agonistas dopaminérgicos (cabergolina).","<b>Embarazo ectópico<\/b>: implantación fuera del útero, más frecuente en la ampolla de la trompa."],"cards":[{"f":"Hormonas de la adenohipófisis (mnemotecnia)","b":"FLAT PiG: FSH, LH, ACTH, TSH, prolactina, GH."},{"f":"Hormonas que libera la neurohipófisis","b":"ADH (vasopresina) y oxitocina (producidas en el hipotálamo)."},{"f":"Capas de la corteza suprarrenal y sus productos","b":"Glomerular (aldosterona), fasciculada (cortisol) y reticular (andrógenos)."},{"f":"Célula testicular que produce testosterona","b":"Célula de Leydig (estimulada por LH)."},{"f":"Sitio habitual de la fecundación","b":"Ampolla de la trompa uterina."}],"quiz":[{"q":"¿Qué hormona hipofisaria está bajo inhibición tónica del hipotálamo?","o":["TSH","Prolactina","LH","ACTH"],"a":1,"e":"La dopamina hipotalámica la inhibe; si se corta el tallo hipofisario, la prolactina sube."},{"q":"Mujer con ciclos de 28 días. ¿Qué evento dispara la ovulación?","o":["Pico de LH","Caída de estrógenos","Caída de FSH","Pico de progesterona"],"a":0,"e":"El aumento sostenido de estrógenos produce retroalimentación positiva y el pico de LH."}],"intro":"Hormonas que viajan por la sangre a órganos diana; ejes hipotálamo-hipófisis."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
