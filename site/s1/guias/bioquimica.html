<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bioquímica Clínica</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#b0680a; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="BQ"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"bioquimica","title":"Bioquímica Clínica","kicker":"Primer semestre · Bioquímica Clínica","desc":"Metabolismo de principio a fin con las enzimas limitantes, sus reguladores y las enfermedades que salen en examen, más la lectura de una química sanguínea.","nota":"","temas":[{"t":"Agua, pH y amortiguadores","res":["pH = −log[H⁺]. Ácido = donador de H⁺ (Brønsted); base = aceptor. pKa = pH al que el ácido está 50 % disociado.","<b>Henderson-Hasselbalch<\/b>: pH = pKa + log([A⁻]/[HA]). Para la sangre: <b>pH = 6.1 + log(HCO₃⁻ / 0.03 × PaCO₂)<\/b>.","Un amortiguador funciona mejor a pH = pKa ± 1. Sistemas: <b>bicarbonato/ácido carbónico<\/b> (extracelular, abierto: el pulmón elimina CO₂ y el riñón regula HCO₃⁻), <b>fosfatos<\/b> (intracelular y orina), <b>proteínas y hemoglobina<\/b> (histidina, intracelular).","<b>Anhidrasa carbónica<\/b> (zinc): CO₂ + H₂O ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻.","Valores normales de gasometría arterial: pH 7.35–7.45, <b>PaCO₂ 35–45 mmHg<\/b>, <b>HCO₃⁻ 22–26 mEq/L<\/b>."],"hy":["Brecha aniónica = Na⁺ − (Cl⁻ + HCO₃⁻), normal ≈ 8–12. Acidosis con brecha elevada: cetoacidosis, acidosis láctica, insuficiencia renal, metanol, etilenglicol, salicilatos.","Si el pH y la PaCO₂ se mueven en direcciones opuestas → origen respiratorio; en la misma dirección → metabólico."],"cl":["<b>Cetoacidosis diabética<\/b>: acidosis metabólica con brecha aniónica elevada y respiración de Kussmaul (compensación respiratoria).","Vómito persistente → pérdida de HCl → <b>alcalosis metabólica<\/b> hipoclorémica e hipopotasémica."],"tabla":["Trastorno¦Primario¦Compensación","Acidosis metabólica¦↓ HCO₃⁻¦Hiperventilación (↓ PaCO₂)","Alcalosis metabólica¦↑ HCO₃⁻¦Hipoventilación (↑ PaCO₂)","Acidosis respiratoria¦↑ PaCO₂¦Riñón retiene HCO₃⁻","Alcalosis respiratoria¦↓ PaCO₂¦Riñón elimina HCO₃⁻"],"cards":[{"f":"Ecuación de Henderson-Hasselbalch para la sangre","b":"pH = 6.1 + log(HCO₃⁻ / 0.03 × PaCO₂)."},{"f":"Amortiguador principal del líquido extracelular","b":"Bicarbonato/ácido carbónico."},{"f":"Fórmula de la brecha aniónica","b":"Na⁺ − (Cl⁻ + HCO₃⁻); normal ≈ 8–12 mEq/L."},{"f":"Compensación de una acidosis metabólica","b":"Hiperventilación que baja la PaCO₂ (respiración de Kussmaul)."},{"f":"Metal de la anhidrasa carbónica","b":"Zinc."}],"quiz":[{"q":"Gasometría: pH 7.28, PaCO₂ 28 mmHg, HCO₃⁻ 13 mEq/L. ¿Qué trastorno es?","o":["Alcalosis metabólica","Acidosis metabólica con compensación respiratoria","Acidosis respiratoria compensada","Alcalosis respiratoria"],"a":1,"e":"pH bajo y HCO₃⁻ bajo (misma dirección) = metabólico; la PaCO₂ baja es la compensación."},{"q":"¿Cuál causa acidosis metabólica con brecha aniónica elevada?","o":["Intoxicación por metanol","Diarrea","Vómito","Acidosis tubular renal"],"a":0,"e":"Metanol forma ácido fórmico (anión no medido). La diarrea da acidosis hiperclorémica con brecha normal."},{"q":"Un amortiguador es más eficaz cuando:","o":["pH = 7.0 siempre","No hay base conjugada","pH muy por arriba del pKa","pH ≈ pKa"],"a":3,"e":"Con pH = pKa hay la misma cantidad de ácido y base conjugada."}],"intro":"El pH de la sangre se mantiene entre 7.35 y 7.45; el bicarbonato es el amortiguador principal del líquido extracelular."},{"t":"Aminoácidos, proteínas y hemoglobina","res":["Aminoácidos <b>esenciales<\/b> (no se sintetizan): <b>PVT TIM HaLL<\/b> → fenilalanina, valina, treonina, triptófano, isoleucina, metionina, histidina, leucina, lisina (arginina condicional en el crecimiento).","Básicos: lisina, arginina, histidina (la histidina amortigua a pH fisiológico). Ácidos: aspartato y glutamato.","Niveles de estructura: <b>primaria<\/b> (secuencia, enlace peptídico), <b>secundaria<\/b> (hélice α y lámina β, puentes de hidrógeno), <b>terciaria<\/b> (plegamiento 3D, puentes disulfuro, interacciones hidrofóbicas), <b>cuaternaria<\/b> (varias subunidades: hemoglobina).","<b>Hemoglobina A<\/b>: α₂β₂, 4 grupos hemo con Fe²⁺. Curva de disociación <b>sigmoidea<\/b> (cooperatividad); mioglobina: hiperbólica (un solo hemo, mayor afinidad).","Desplazamiento a la <b>derecha<\/b> (↓ afinidad, libera O₂ en tejidos): ↑ CO₂, ↑ H⁺ (efecto Bohr), ↑ temperatura, ↑ 2,3-BPG, ejercicio. A la izquierda: HbF, CO, ↓ temperatura, alcalosis.","Proteínas plasmáticas: albúmina (presión oncótica, transporte), globulinas (α, β, γ = inmunoglobulinas), fibrinógeno."],"hy":["Mnemotecnia de la curva a la derecha: \"<b>CADET, face Right<\/b>\" → CO₂, Ácido, 2,3-DPG, Ejercicio, Temperatura.","<b>HbF<\/b> (α₂γ₂) une menos 2,3-BPG → mayor afinidad por O₂ → toma oxígeno de la sangre materna."],"cl":["<b>Anemia de células falciformes<\/b>: Glu→Val en la posición 6 de la cadena β (HbS); polimeriza en desoxigenación → crisis vasooclusivas.","<b>Intoxicación por CO<\/b>: el CO une al hemo con afinidad ~200 veces mayor y desplaza la curva a la izquierda; la saturación por oxímetro de pulso sale falsamente normal.","<b>Hipoalbuminemia<\/b> (cirrosis, síndrome nefrótico, desnutrición) → edema por baja presión oncótica."],"cards":[{"f":"Aminoácidos esenciales (mnemotecnia)","b":"PVT TIM HaLL: fenilalanina, valina, treonina, triptófano, isoleucina, metionina, histidina, leucina, lisina."},{"f":"Mutación de la HbS","b":"Ácido glutámico → valina en la posición 6 de la cadena β."},{"f":"Efecto Bohr","b":"↑ H⁺ y CO₂ disminuyen la afinidad de la Hb por O₂ (curva a la derecha) para liberar O₂ en tejidos."},{"f":"Composición de la HbF","b":"α₂γ₂; menor unión a 2,3-BPG y mayor afinidad por O₂."},{"f":"Enlace que estabiliza la estructura secundaria","b":"Puentes de hidrógeno del esqueleto peptídico."}],"quiz":[{"q":"¿Qué desplaza la curva de disociación de la Hb a la izquierda?","o":["Acidosis","Aumento de 2,3-BPG","Fiebre","Monóxido de carbono"],"a":3,"e":"El CO aumenta la afinidad de los hemos restantes y dificulta la entrega de O₂ (curva a la izquierda)."},{"q":"¿Por qué la curva de la hemoglobina es sigmoidea?","o":["Porque no une CO₂","Por cooperatividad entre sus cuatro subunidades","Porque tiene un solo grupo hemo","Por su hierro en estado férrico"],"a":1,"e":"La unión de O₂ a un hemo facilita la unión a los demás (estado T → R)."},{"q":"¿Qué aminoácido amortigua a pH fisiológico por su grupo imidazol?","o":["Leucina","Lisina","Glicina","Histidina"],"a":3,"e":"El imidazol de la histidina tiene pKa ≈ 6, útil para amortiguar en proteínas y Hb."}],"intro":"20 aminoácidos forman proteínas; su estructura define la función."},{"t":"Enzimas y cinética","res":["<b>Michaelis-Menten<\/b>: v = Vmax[S] / (Km + [S]). <b>Km<\/b> = [S] a la que v = ½ Vmax; Km bajo = alta afinidad.","<b>Lineweaver-Burk<\/b> (dobles recíprocos): intersección en Y = 1/Vmax; en X = −1/Km.","Inhibición <b>competitiva<\/b>: compite por el sitio activo, se vence con más sustrato → <b>↑ Km, Vmax igual<\/b>. <b>No competitiva<\/b>: se une a otro sitio → <b>Km igual, ↓ Vmax<\/b>. <b>Irreversible<\/b>: unión covalente (aspirina sobre COX, organofosforados sobre acetilcolinesterasa).","Enzimas <b>alostéricas<\/b>: curva sigmoidea, controlan pasos limitantes (fosfofructocinasa-1, etc.).","Cofactores: iones metálicos; coenzimas derivadas de vitaminas (NAD⁺ de B3, FAD de B2, TPP de B1, PLP de B6, CoA de B5).","Isoenzimas y enzimas clínicas: <b>troponinas<\/b> (miocardio), <b>CK-MB<\/b>, <b>ALT<\/b> (más específica de hígado), <b>AST<\/b>, <b>fosfatasa alcalina<\/b> (vía biliar, hueso), <b>GGT<\/b> (vía biliar, alcohol), <b>amilasa y lipasa<\/b> (páncreas; lipasa más específica), <b>LDH<\/b> (hemólisis, lisis tumoral)."],"hy":["Competitivo: \"Comparten sitio, Km cambia\". No competitivo: \"baja el techo (Vmax)\".","Las enzimas no modifican la constante de equilibrio ni la ΔG; solo aceleran el alcance del equilibrio."],"cl":["Metanol y etilenglicol: el <b>fomepizol<\/b> (o etanol) inhibe competitivamente a la alcohol deshidrogenasa.","Relación AST/ALT &gt; 2 sugiere hepatopatía alcohólica; ALT &gt; AST en hepatitis viral.","Lipasa &gt; 3 veces el límite superior apoya pancreatitis aguda."],"tabla":["Inhibición¦Km¦Vmax¦¿Se revierte con más sustrato?","Competitiva¦↑¦=¦Sí","No competitiva¦=¦↓¦No","Acompetitiva¦↓¦↓¦No"],"cards":[{"f":"Definición de Km","b":"Concentración de sustrato a la que la velocidad es la mitad de la Vmax; inversa a la afinidad."},{"f":"Efecto de un inhibidor competitivo","b":"↑ Km aparente, Vmax sin cambio."},{"f":"Efecto de un inhibidor no competitivo","b":"Km igual, ↓ Vmax."},{"f":"Aminotransferasa más específica del hígado","b":"ALT."},{"f":"Enzima pancreática más específica","b":"Lipasa."},{"f":"Coenzima derivada de la tiamina","b":"Pirofosfato de tiamina (TPP)."}],"quiz":[{"q":"En una gráfica de Lineweaver-Burk, un inhibidor desplaza la intersección en X hacia el origen sin cambiar la de Y. Es:","o":["No competitivo","Acompetitivo","Competitivo","Irreversible"],"a":2,"e":"Misma Vmax (misma 1/Vmax en Y) con mayor Km (−1/Km más cerca de cero)."},{"q":"¿Por qué se usa fomepizol en la intoxicación por metanol?","o":["Inhibe competitivamente la alcohol deshidrogenasa","Aumenta la eliminación renal de formato","Es un quelante","Activa la aldehído deshidrogenasa"],"a":0,"e":"Evita la formación de formaldehído y ácido fórmico."},{"q":"Una enzima con Km de 1 mM comparada con otra de Km 10 mM para el mismo sustrato:","o":["No se puede saturar","Tiene mayor afinidad","Tiene menor afinidad","Tiene mayor Vmax"],"a":1,"e":"Km bajo = se alcanza ½ Vmax con poco sustrato = alta afinidad."}],"intro":"Las enzimas bajan la energía de activación; no cambian el equilibrio ni la ΔG de la reacción."},{"t":"Carbohidratos: glucólisis, gluconeogénesis y glucógeno","res":["<b>Glucólisis<\/b> (citosol, todas las células): glucosa → 2 piruvato + <b>2 ATP netos<\/b> + 2 NADH. Enzima limitante: <b>fosfofructocinasa-1 (PFK-1)<\/b>; activa: AMP, fructosa-2,6-bifosfato; inhibe: ATP, citrato.","Hexocinasa (tejidos, Km bajo, inhibida por G6P) vs <b>glucocinasa<\/b> (hígado y célula β, Km alto, inducida por insulina = sensor de glucosa).","Destino del piruvato: aerobio → acetil-CoA (<b>piruvato deshidrogenasa<\/b>: B1, B2, B3, B5, ácido lipoico); anaerobio → <b>lactato<\/b> (LDH, regenera NAD⁺; único destino en eritrocitos).","<b>Gluconeogénesis<\/b> (hígado &gt; riñón): a partir de lactato, alanina, glicerol. Enzimas propias: <b>piruvato carboxilasa<\/b> (mitocondria, requiere biotina), PEPCK, <b>fructosa-1,6-bisfosfatasa<\/b> (limitante), glucosa-6-fosfatasa. Los ácidos grasos de cadena par <b>no<\/b> forman glucosa.","Glucógeno: síntesis por <b>glucógeno sintasa<\/b> (insulina), degradación por <b>glucógeno fosforilasa<\/b> (glucagón, adrenalina). El glucógeno hepático mantiene la glucemia; el muscular solo sirve al músculo (no tiene glucosa-6-fosfatasa).","Vía de las pentosas: produce <b>NADPH<\/b> (glutatión reducido, síntesis de lípidos) y ribosa-5-P; enzima limitante <b>glucosa-6-fosfato deshidrogenasa (G6PD)<\/b>."],"hy":["Enzimas limitantes: glucólisis = PFK-1; gluconeogénesis = fructosa-1,6-bisfosfatasa; glucogénesis = glucógeno sintasa; glucogenólisis = glucógeno fosforilasa; pentosas = G6PD.","El eritrocito depende solo de la glucólisis anaerobia (no tiene mitocondrias)."],"cl":["<b>Deficiencia de G6PD<\/b>: sin NADPH no se regenera glutatión → hemólisis con oxidantes (primaquina, sulfas, habas); cuerpos de Heinz y células mordidas.","<b>Deficiencia de tiamina<\/b> (alcoholismo): falla la piruvato deshidrogenasa → acidosis láctica y encefalopatía de Wernicke; dar tiamina antes que glucosa.","Galactosemia (galactosa-1-fosfato uridiltransferasa): cataratas, hepatomegalia, ictericia y sepsis por E. coli en el lactante."],"tabla":["Enfermedad¦Enzima¦Dato clave","Von Gierke (I)¦Glucosa-6-fosfatasa¦Hipoglucemia grave, acidosis láctica, hepatomegalia","Pompe (II)¦α-1,4-glucosidasa lisosomal¦Cardiomegalia en lactantes","Cori (III)¦Enzima desramificante¦Como Von Gierke, más leve, lactato normal","McArdle (V)¦Fosforilasa muscular¦Calambres y mioglobinuria con ejercicio"],"cards":[{"f":"Enzima limitante de la glucólisis","b":"Fosfofructocinasa-1 (PFK-1)."},{"f":"Vitamina que necesita la piruvato carboxilasa","b":"Biotina (B7)."},{"f":"¿Por qué el músculo no libera glucosa a la sangre?","b":"No tiene glucosa-6-fosfatasa."},{"f":"Producto principal de la vía de las pentosas","b":"NADPH (y ribosa-5-fosfato)."},{"f":"Enfermedad de Pompe","b":"Déficit de α-1,4-glucosidasa lisosomal; cardiomegalia en el lactante."},{"f":"Rendimiento neto de ATP de la glucólisis","b":"2 ATP por glucosa (más 2 NADH)."}],"quiz":[{"q":"Lactante con hipoglucemia grave en ayuno, hepatomegalia, acidosis láctica e hiperuricemia. Enzima deficiente:","o":["Enzima desramificante","α-1,4-glucosidasa lisosomal","Glucógeno fosforilasa muscular","Glucosa-6-fosfatasa"],"a":3,"e":"Enfermedad de Von Gierke: el hígado no libera glucosa ni desde glucógeno ni desde gluconeogénesis."},{"q":"Paciente con hemólisis tras recibir primaquina. ¿Qué vía está afectada?","o":["Glucólisis (piruvato cinasa)","Vía de las pentosas fosfato (G6PD)","Ciclo de la urea","Gluconeogénesis"],"a":1,"e":"Sin NADPH no hay glutatión reducido para neutralizar oxidantes."},{"q":"¿Qué sustrato NO puede convertirse en glucosa?","o":["Lactato","Ácidos grasos de cadena par","Glicerol","Alanina"],"a":1,"e":"Producen acetil-CoA, que no puede convertirse en piruvato (la piruvato deshidrogenasa es irreversible)."}],"intro":"La glucosa es el combustible universal; el hígado mantiene la glucemia en ayuno."},{"t":"Ciclo de Krebs, cadena respiratoria y fosforilación oxidativa","res":["<b>Ciclo de Krebs<\/b> (matriz mitocondrial): acetil-CoA + oxalacetato → citrato... Por vuelta: <b>3 NADH, 1 FADH₂, 1 GTP, 2 CO₂<\/b>. Enzima limitante: <b>isocitrato deshidrogenasa<\/b> (inhibida por ATP y NADH).","α-cetoglutarato deshidrogenasa: mismos cofactores que la piruvato deshidrogenasa (B1, B2, B3, B5, lipoato).","<b>Cadena de transporte de electrones<\/b> (membrana interna): complejos I (NADH), II (succinato deshidrogenasa, FADH₂), coenzima Q, III, citocromo c, IV (citocromo c oxidasa → O₂ a H₂O). El gradiente de protones mueve la <b>ATP sintasa<\/b> (complejo V).","Rendimiento: NADH ≈ 2.5 ATP, FADH₂ ≈ 1.5 ATP; glucosa completa ≈ <b>30–32 ATP<\/b>.","<b>Inhibidores<\/b>: rotenona (I), antimicina A (III), <b>cianuro, CO y azida<\/b> (IV), oligomicina (ATP sintasa). <b>Desacopladores<\/b>: 2,4-dinitrofenol, termogenina (UCP-1), salicilatos en dosis altas → calor sin ATP."],"hy":["El cianuro bloquea el complejo IV: los tejidos no usan O₂ → acidosis láctica, sangre venosa \"arterializada\" (rojo brillante), olor a almendras amargas.","Desacopladores: ↑ consumo de O₂, ↓ ATP, ↑ temperatura."],"cl":["<b>Intoxicación por cianuro<\/b> (humo de incendios, nitroprusiato): tratamiento con hidroxocobalamina.","Miopatías mitocondriales (herencia materna): fibras rojas rasgadas en la biopsia muscular (MELAS, MERRF)."],"cards":[{"f":"Productos de una vuelta del ciclo de Krebs","b":"3 NADH, 1 FADH₂, 1 GTP y 2 CO₂."},{"f":"Enzima limitante del ciclo de Krebs","b":"Isocitrato deshidrogenasa."},{"f":"Complejo inhibido por el cianuro","b":"Complejo IV (citocromo c oxidasa)."},{"f":"Qué hace un desacoplador","b":"Disipa el gradiente de H⁺: más consumo de O₂ y calor, menos ATP."},{"f":"Complejo que es también enzima del ciclo de Krebs","b":"Complejo II (succinato deshidrogenasa)."}],"quiz":[{"q":"Bombero rescatado de un incendio con acidosis láctica grave y saturación venosa de O₂ alta. Sospecha:","o":["Intoxicación por cianuro","Deficiencia de tiamina","Anemia aguda","Hipoventilación"],"a":0,"e":"El cianuro impide usar el O₂ (complejo IV): la sangre venosa conserva O₂ y se produce lactato."},{"q":"El 2,4-dinitrofenol produce pérdida de peso e hipertermia porque:","o":["Inhibe la glucólisis","Bloquea la ATP sintasa","Desacopla la cadena respiratoria de la síntesis de ATP","Inhibe el complejo I"],"a":2,"e":"La energía del gradiente se libera como calor."},{"q":"¿Cuántos ATP rinde aproximadamente la oxidación completa de una glucosa?","o":["30–32","2","12","129"],"a":0,"e":"2 de glucólisis + 2 GTP de Krebs + los obtenidos de 10 NADH y 2 FADH₂ en la cadena respiratoria."}],"intro":"En la mitocondria el acetil-CoA se oxida a CO₂ y la energía de NADH y FADH₂ produce ATP."},{"t":"Lípidos: oxidación, cetonas, colesterol y lipoproteínas","res":["<b>Síntesis de ácidos grasos<\/b> (citosol, hígado): acetil-CoA → malonil-CoA por <b>acetil-CoA carboxilasa<\/b> (limitante; requiere biotina; insulina la activa). Necesita NADPH.","<b>β-oxidación<\/b> (mitocondria): los ácidos grasos de cadena larga entran con la <b>carnitina<\/b> (carnitina palmitoiltransferasa I, inhibida por malonil-CoA). Cada vuelta: 1 FADH₂, 1 NADH, 1 acetil-CoA.","<b>Cuerpos cetónicos<\/b> (hígado, ayuno prolongado/diabetes): acetoacetato y β-hidroxibutirato; los usan cerebro (en ayuno) y músculo; el hígado no los usa.","Colesterol: enzima limitante <b>HMG-CoA reductasa<\/b> (inhibida por estatinas). Derivados: hormonas esteroideas, ácidos biliares, vitamina D.","Lipoproteínas: <b>quilomicrones<\/b> (lípidos de la dieta, apoB-48, apoC-II), <b>VLDL<\/b> (triglicéridos del hígado, apoB-100), <b>LDL<\/b> (colesterol a tejidos, apoB-100 → receptor LDL), <b>HDL<\/b> (transporte inverso de colesterol, apoA-I). <b>Lipoproteína lipasa<\/b> (endotelio, activada por apoC-II) hidroliza triglicéridos."],"hy":["Malonil-CoA (síntesis) inhibe la carnitina palmitoiltransferasa I (oxidación): no se sintetiza y oxida a la vez.","Hipercolesterolemia familiar: defecto del receptor de LDL (autosómica dominante) → xantomas tendinosos e infarto temprano."],"cl":["<b>Estatinas<\/b>: inhiben la HMG-CoA reductasa; efectos adversos: miopatía (CK elevada) y elevación de transaminasas.","<b>Cetoacidosis diabética<\/b>: sin insulina, la lipólisis libera ácidos grasos que el hígado convierte en cetonas → acidosis con aliento afrutado.","Deficiencia de carnitina o de MCAD: hipoglucemia <b>hipocetósica<\/b> en ayuno."],"tabla":["Lipoproteína¦Lleva¦Apo clave","Quilomicrón¦Triglicéridos de la dieta¦B-48, C-II, E","VLDL¦Triglicéridos hepáticos¦B-100, C-II, E","LDL¦Colesterol a tejidos¦B-100","HDL¦Colesterol de vuelta al hígado¦A-I"],"cards":[{"f":"Enzima limitante de la síntesis de colesterol","b":"HMG-CoA reductasa (blanco de las estatinas)."},{"f":"Enzima limitante de la síntesis de ácidos grasos","b":"Acetil-CoA carboxilasa (biotina)."},{"f":"Transportador de ácidos grasos a la mitocondria","b":"Carnitina (CPT-I, inhibida por malonil-CoA)."},{"f":"Órgano que produce cetonas pero no las usa","b":"Hígado."},{"f":"Apolipoproteína que activa la lipoproteína lipasa","b":"ApoC-II."},{"f":"Apolipoproteína de la HDL","b":"ApoA-I."}],"quiz":[{"q":"Niño con hipoglucemia en ayuno sin cetonas en orina tras una gastroenteritis. Sospecha:","o":["Diabetes tipo 1","Enfermedad de McArdle","Defecto de la oxidación de ácidos grasos (MCAD/carnitina)","Exceso de glucagón"],"a":2,"e":"Si no se oxidan ácidos grasos, no hay acetil-CoA para cetonas ni energía para la gluconeogénesis."},{"q":"Paciente con xantomas en el tendón de Aquiles y LDL de 320 mg/dL. Defecto más probable:","o":["Receptor de LDL","ApoA-I","ApoC-II","Lipoproteína lipasa"],"a":0,"e":"Hipercolesterolemia familiar: el LDL no se capta en el hígado."},{"q":"¿Qué transporta los triglicéridos de la dieta desde el intestino?","o":["LDL","HDL","Quilomicrones","VLDL"],"a":2,"e":"Se forman en el enterocito con apoB-48 y viajan por la linfa."}],"intro":"Los ácidos grasos son la mayor reserva de energía; el colesterol forma membranas, hormonas y bilis."},{"t":"Aminoácidos y ciclo de la urea","res":["<b>Transaminación<\/b>: el amino pasa al α-cetoglutarato → glutamato (ALT, AST; requieren <b>piridoxal fosfato, B6<\/b>).","<b>Ciclo de la urea<\/b> (hígado; mitocondria + citosol): enzima limitante <b>carbamoil fosfato sintetasa I<\/b> (activada por N-acetilglutamato). Urea = 1 N del amonio + 1 N del aspartato.","Amoniaco tóxico para el cerebro: se transporta como glutamina (tejidos) y alanina (músculo, ciclo glucosa-alanina).","Aminoácidos <b>glucogénicos<\/b> vs <b>cetogénicos<\/b> (solo cetogénicos: <b>leucina y lisina<\/b>).","Derivados: tirosina → dopamina, noradrenalina, adrenalina, melanina, tiroxina; triptófano → serotonina, melatonina, niacina; histidina → histamina; glicina → hemo (con succinil-CoA); arginina → óxido nítrico."],"hy":["En la fenilcetonuria la tirosina se vuelve esencial; se detecta con el <b>tamiz neonatal<\/b> y se trata con dieta sin fenilalanina (evitar aspartame).","Hiperamonemia: asterixis, vómito, encefalopatía, edema cerebral. Deficiencia de ornitina transcarbamilasa (ligada al X) eleva el <b>ácido orótico<\/b> sin anemia megaloblástica."],"cl":["<b>Encefalopatía hepática<\/b>: el hígado cirrótico no forma urea; se trata con lactulosa (atrapa NH₄⁺ en el colon) y rifaximina.","BUN bajo en hepatopatía grave; BUN alto en insuficiencia renal o sangrado digestivo alto (proteína digerida)."],"tabla":["Enfermedad¦Defecto¦Clave","Fenilcetonuria¦Fenilalanina hidroxilasa (o BH4)¦Discapacidad intelectual, olor a ratón, piel clara","Alcaptonuria¦Homogentisato oxidasa¦Orina negra al reposar, ocronosis","Jarabe de arce¦α-cetoácido deshidrogenasa de cadena ramificada¦Orina con olor a azúcar quemado","Homocistinuria¦Cistationina β-sintasa¦Luxación del cristalino hacia abajo, trombosis"],"cards":[{"f":"Enzima limitante del ciclo de la urea","b":"Carbamoil fosfato sintetasa I (activada por N-acetilglutamato)."},{"f":"Vitamina de las transaminasas","b":"Piridoxina (B6) como piridoxal fosfato."},{"f":"Aminoácidos solo cetogénicos","b":"Leucina y lisina."},{"f":"Precursores del grupo hemo","b":"Glicina + succinil-CoA (enzima ALA sintasa, requiere B6)."},{"f":"Neurotransmisor derivado del triptófano","b":"Serotonina (también melatonina y niacina)."}],"quiz":[{"q":"Recién nacido con olor a ratón en la orina, piel y cabello claros y retraso del desarrollo. Enzima deficiente:","o":["Fenilalanina hidroxilasa","Cistationina β-sintasa","Tirosinasa","Homogentisato oxidasa"],"a":0,"e":"Fenilcetonuria: se acumulan fenilcetonas; la tirosina (precursor de melanina) disminuye."},{"q":"¿Cómo viaja el amoniaco desde el músculo al hígado?","o":["Como creatinina","Como alanina (ciclo glucosa-alanina)","Como amoniaco libre unido a albúmina","Como urea"],"a":1,"e":"El músculo transamina piruvato a alanina; el hígado regresa el nitrógeno a la urea y el carbono a glucosa."},{"q":"Paciente cirrótico con confusión y asterixis. ¿Qué sustancia se acumula?","o":["Urea","Creatinina","Ácido úrico","Amoniaco"],"a":3,"e":"El hígado no detoxifica el amonio por el ciclo de la urea."}],"intro":"El nitrógeno se elimina como urea en el hígado; los esqueletos de carbono dan energía o glucosa."},{"t":"Vitaminas y coenzimas","res":["<b>B1 tiamina<\/b> (TPP): piruvato DH, α-cetoglutarato DH, transcetolasa. Déficit: beriberi, <b>Wernicke-Korsakoff<\/b>.","<b>B2 riboflavina<\/b> (FAD, FMN): queilosis, estomatitis angular. <b>B3 niacina<\/b> (NAD⁺): <b>pelagra<\/b> (dermatitis, diarrea, demencia). <b>B5<\/b> (CoA). <b>B6<\/b> (PLP): transaminación, síntesis de neurotransmisores y hemo; déficit con isoniazida (neuropatía, anemia sideroblástica).","<b>B9 folato<\/b> y <b>B12 cobalamina<\/b>: síntesis de ADN → anemia <b>megaloblástica<\/b>. B12 da además daño neurológico (degeneración combinada subaguda) y ↑ ácido metilmalónico; el folato no.","<b>Vitamina C<\/b>: hidroxilación de colágeno, absorción de hierro → escorbuto.","<b>A<\/b>: visión (rodopsina), epitelios → ceguera nocturna, xeroftalmia. <b>D<\/b>: absorción de Ca²⁺ → raquitismo/osteomalacia. <b>E<\/b>: antioxidante → anemia hemolítica, neuropatía. <b>K<\/b>: carboxilación de factores <b>II, VII, IX, X<\/b>, proteína C y S → sangrado (recién nacido)."],"hy":["B12 vs folato: ambos dan anemia megaloblástica con ↑ homocisteína; <b>solo B12<\/b> eleva el ácido metilmalónico y da síntomas neurológicos.","Al recién nacido se le aplica vitamina K porque su intestino es estéril y la leche materna tiene poca."],"cl":["<b>Ácido fólico preconcepcional<\/b> (0.4 mg/día) reduce defectos del tubo neural.","Anemia perniciosa: anticuerpos contra factor intrínseco/células parietales → déficit de B12.","La warfarina antagoniza la vitamina K (inhibe la epóxido reductasa)."],"cards":[{"f":"Vitamina deficiente en Wernicke","b":"Tiamina (B1)."},{"f":"Tríada de la pelagra","b":"Dermatitis, diarrea y demencia (déficit de niacina, B3)."},{"f":"Factores que dependen de la vitamina K","b":"II, VII, IX y X, más proteínas C y S."},{"f":"Diferencia de laboratorio entre déficit de B12 y de folato","b":"El ácido metilmalónico solo se eleva en el déficit de B12."},{"f":"Vitamina que se agota con isoniazida","b":"Piridoxina (B6)."}],"quiz":[{"q":"Alcohólico con confusión, oftalmoplejía y ataxia. ¿Qué das primero?","o":["Tiamina intravenosa","Vitamina B12","Glucosa al 50 %","Ácido fólico"],"a":0,"e":"Encefalopatía de Wernicke: dar tiamina antes que glucosa evita empeorarla."},{"q":"Paciente con anemia megaloblástica, parestesias y pérdida de la sensibilidad vibratoria. Déficit de:","o":["Ácido fólico","Hierro","Vitamina B12","Vitamina B6"],"a":2,"e":"La B12 se requiere para la mielina (metilmalonil-CoA mutasa); el folato no da síntomas neurológicos."},{"q":"La ceguera nocturna es el signo temprano del déficit de:","o":["Vitamina D","Vitamina E","Vitamina K","Vitamina A"],"a":3,"e":"El retinal forma la rodopsina de los bastones."}],"intro":"Hidrosolubles (complejo B y C) se eliminan en orina; liposolubles (A, D, E, K) se almacenan."},{"t":"Integración metabólica y química sanguínea","res":["<b>Estado alimentado<\/b> (insulina): glucólisis, glucogénesis, síntesis de ácidos grasos y proteínas; entrada de glucosa por <b>GLUT4<\/b> a músculo y tejido adiposo.","<b>Ayuno temprano<\/b> (glucagón, adrenalina): glucogenólisis hepática (reservas para ~24 h). <b>Ayuno prolongado<\/b>: gluconeogénesis (lactato, alanina, glicerol), lipólisis y cetogénesis; el cerebro adapta su uso de cetonas.","Transportadores: GLUT1 (eritrocito, BHE), GLUT2 (hígado, célula β, riñón, intestino; bidireccional), GLUT3 (neuronas), GLUT4 (músculo y adiposo, dependiente de insulina).","Valores de referencia (adulto, aproximados): <b>glucosa en ayuno 70–99 mg/dL<\/b>; <b>urea/BUN 7–20 mg/dL<\/b>; <b>creatinina 0.6–1.2 mg/dL<\/b>; <b>ácido úrico 3.5–7 mg/dL<\/b>; <b>colesterol total &lt; 200 mg/dL<\/b>; <b>triglicéridos &lt; 150 mg/dL<\/b>; <b>HbA1c &lt; 5.7 %<\/b>.","Diagnóstico de diabetes (ADA): glucosa en ayuno <b>≥ 126 mg/dL<\/b>, HbA1c <b>≥ 6.5 %<\/b>, glucosa 2 h poscarga de 75 g <b>≥ 200 mg/dL<\/b> o glucosa al azar ≥ 200 con síntomas. Prediabetes: ayuno 100–125, HbA1c 5.7–6.4 %."],"hy":["La insulina es la única hormona hipoglucemiante; glucagón, adrenalina, cortisol y GH son contrarreguladoras.","GLUT4 es el único transportador que depende de insulina."],"cl":["HbA1c refleja la glucemia promedio de ~3 meses (vida del eritrocito); falla en anemias hemolíticas.","Gota: hiperuricemia por exceso de producción o baja excreción; cristales de urato monosódico con birrefringencia negativa."],"cards":[{"f":"Transportador de glucosa dependiente de insulina","b":"GLUT4 (músculo y tejido adiposo)."},{"f":"Criterio de diabetes por glucosa en ayuno","b":"≥ 126 mg/dL (en dos ocasiones)."},{"f":"HbA1c diagnóstica de diabetes","b":"≥ 6.5 %."},{"f":"Fuente de glucosa en las primeras 24 h de ayuno","b":"Glucogenólisis hepática."},{"f":"Hormonas contrarreguladoras de la insulina","b":"Glucagón, adrenalina, cortisol y hormona de crecimiento."}],"quiz":[{"q":"Paciente con glucosa en ayuno de 112 mg/dL y HbA1c de 6.0 %. Clasificación:","o":["Prediabetes","Diabetes mellitus","Normal","Diabetes gestacional"],"a":0,"e":"Ayuno 100–125 mg/dL y HbA1c 5.7–6.4 % definen prediabetes."},{"q":"En el ayuno de 3 días, ¿cuál es la principal fuente de glucosa?","o":["Glucógeno hepático","Glucógeno muscular","Ácidos grasos de cadena par","Gluconeogénesis hepática"],"a":3,"e":"El glucógeno hepático se agota en ~24 h; después domina la gluconeogénesis."},{"q":"¿En qué paciente la HbA1c puede salir falsamente baja?","o":["Anemia ferropénica sin tratamiento","Esplenectomía reciente","Insuficiencia renal crónica con eritrocitos longevos","Anemia hemolítica"],"a":3,"e":"Eritrocitos de vida corta tienen menos tiempo para glucosilarse."}],"intro":"Insulina (alimentado) y glucagón (ayuno) deciden qué vías se encienden."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
