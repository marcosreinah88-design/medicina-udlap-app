<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Embriología y Genética</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#3d63b3; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="EG"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"embriologia-genetica","title":"Embriología y Genética","kicker":"Primer semestre · Embriología y Genética","desc":"Del gameto al feto semana por semana, los derivados de cada capa germinal, los teratógenos y la genética clínica: patrones de herencia y cromosomopatías.","nota":"","temas":[{"t":"Gametogénesis y fecundación","res":["<b>Meiosis I<\/b> (reduccional: separa homólogos; entrecruzamiento en profase I) y <b>meiosis II<\/b> (ecuacional: separa cromátidas).","<b>Espermatogénesis<\/b>: inicia en la pubertad, ~64–74 días; 1 espermatocito primario → <b>4 espermatozoides<\/b>. Capacitación en el tracto femenino; reacción acrosómica al contactar la zona pelúcida.","<b>Ovogénesis<\/b>: los ovocitos primarios se forman antes del nacimiento y quedan detenidos en <b>profase I<\/b> hasta la pubertad; en cada ciclo uno completa la meiosis I (ovocito secundario + 1.er cuerpo polar) y se detiene en <b>metafase II<\/b> hasta la fecundación. Resultado: 1 óvulo + cuerpos polares.","<b>Fecundación<\/b> en la <b>ampolla<\/b> de la trompa: paso de la corona radiada → zona pelúcida (ZP3) → fusión de membranas → <b>reacción cortical<\/b> (bloqueo de la polispermia) → el ovocito termina la meiosis II → pronúcleos → cigoto (2n)."],"hy":["Ovocito detenido en <b>profase I<\/b> desde la vida fetal hasta la ovulación, y en <b>metafase II<\/b> hasta la fecundación.","La no disyunción materna en meiosis I aumenta con la edad (mayoría de los casos de trisomía 21)."],"cl":["Edad materna avanzada (≥ 35 años) → más riesgo de aneuploidías; se ofrece tamizaje prenatal.","La fecundación in vitro con ICSI se usa en infertilidad masculina grave."],"cards":[{"f":"Fase en que se detiene el ovocito primario","b":"Profase I (diploteno) hasta la pubertad."},{"f":"Fase en que se detiene el ovocito secundario","b":"Metafase II hasta la fecundación."},{"f":"Sitio habitual de fecundación","b":"Ampolla de la trompa uterina."},{"f":"Evento que impide la polispermia","b":"Reacción cortical (y de zona)."},{"f":"Duración aproximada de la espermatogénesis","b":"64–74 días."}],"quiz":[{"q":"¿Cuántos gametos funcionales produce un ovocito primario?","o":["Uno","Dos","Ocho","Cuatro"],"a":0,"e":"Las divisiones son asimétricas: un óvulo y cuerpos polares."},{"q":"La mayoría de las trisomías 21 se deben a:","o":["No disyunción materna en meiosis I","No disyunción paterna en meiosis II","Mosaicismo","Translocación robertsoniana"],"a":0,"e":"El riesgo aumenta con la edad materna."}],"intro":"La meiosis reduce los cromosomas a 23 y mezcla la información genética."},{"t":"Primera y segunda semanas: segmentación, implantación y disco bilaminar","res":["<b>Segmentación<\/b>: blastómeras → <b>mórula<\/b> (16 células, día 3) → <b>blastocisto<\/b> (día 4–5): <b>embrioblasto<\/b> (masa celular interna → embrión) y <b>trofoblasto<\/b> (→ placenta).","<b>Implantación<\/b> inicia el día <b>6–7<\/b> en la pared posterior/superior del útero (endometrio en fase secretora).","Semana 2 (\"regla de los dos\"): trofoblasto → <b>citotrofoblasto<\/b> y <b>sincitiotrofoblasto<\/b> (invade y produce <b>hCG<\/b>); embrioblasto → <b>epiblasto<\/b> e <b>hipoblasto<\/b> (disco bilaminar); 2 cavidades: <b>amniótica<\/b> y saco vitelino; mesodermo extraembrionario.","La <b>hCG<\/b> mantiene el cuerpo lúteo (progesterona) hasta que la placenta toma el relevo (~semana 10–12); se detecta en sangre ~día 8–10 tras la fecundación."],"hy":["Sincitiotrofoblasto = hCG; la prueba de embarazo detecta su subunidad β.","El epiblasto da origen a las tres capas germinales del embrión."],"cl":["<b>Embarazo ectópico<\/b>: implantación fuera del útero (95 % en trompa, sobre todo ampolla); dolor, sangrado y hCG que no se duplica.","<b>Enfermedad trofoblástica (mola)<\/b>: proliferación del trofoblasto con hCG muy elevada."],"cards":[{"f":"Día de la implantación","b":"Día 6–7 tras la fecundación."},{"f":"Capa que produce hCG","b":"Sincitiotrofoblasto."},{"f":"Componentes del disco bilaminar","b":"Epiblasto e hipoblasto."},{"f":"Función de la hCG","b":"Mantener el cuerpo lúteo y su producción de progesterona."}],"quiz":[{"q":"Mujer con amenorrea de 7 semanas, dolor abdominal y sangrado; útero vacío en ultrasonido y hCG positiva. Diagnóstico más probable:","o":["Mola hidatiforme","Embarazo normal temprano","Embarazo ectópico","Aborto completo"],"a":2,"e":"Con hCG suficientemente alta y útero vacío hay que descartar ectópico (sitio más común: ampolla)."},{"q":"¿Qué estructura del blastocisto forma al embrión?","o":["Trofoblasto","Sincitiotrofoblasto","Embrioblasto (masa celular interna)","Zona pelúcida"],"a":2,"e":"El trofoblasto forma la parte fetal de la placenta."}],"intro":"Semana 1: del cigoto al blastocisto. Semana 2: \"semana de los dos\"."},{"t":"Tercera semana: gastrulación y neurulación","res":["<b>Línea primitiva<\/b> (día 15) en el epiblasto: las células migran y forman <b>endodermo<\/b>, <b>mesodermo<\/b> y el resto queda como <b>ectodermo<\/b> (gastrulación).","<b>Notocorda<\/b> (del nodo primitivo): induce la placa neural y da el <b>núcleo pulposo<\/b> del disco intervertebral.","<b>Neurulación<\/b>: placa neural → pliegues → <b>tubo neural<\/b> (cierre del neuroporo craneal ~día 25 y caudal ~día 27–28). <b>Crestas neurales<\/b> migran y forman múltiples derivados.","Mesodermo: paraxial (<b>somitas<\/b>: esclerotomo → vértebras; miotomo → músculo; dermatomo → dermis), intermedio (aparato urogenital) y lateral (somático y esplácnico: serosas, corazón, vasos)."],"hy":["<b>Defectos del tubo neural<\/b> por falta de cierre: espina bífida, anencefalia; <b>α-fetoproteína elevada<\/b> en líquido amniótico y suero materno. Prevención: <b>ácido fólico<\/b>.","La notocorda persiste como el <b>núcleo pulposo<\/b>."],"cl":["<b>Teratoma sacrococcígeo<\/b>: restos de la línea primitiva.","<b>Enfermedad de Hirschsprung<\/b>: falla de migración de la cresta neural al colon distal (sin ganglios) → megacolon y retraso en la expulsión del meconio."],"tabla":["Capa¦Derivados principales","Ectodermo superficial¦Epidermis, pelo, uñas, cristalino, esmalte dental, adenohipófisis","Neuroectodermo¦Encéfalo, médula, retina, neurohipófisis","Cresta neural¦Melanocitos, médula suprarrenal, ganglios, células de Schwann, odontoblastos, huesos de la cara","Mesodermo¦Músculo, hueso, cartílago, corazón, vasos, sangre, riñón, gónadas, corteza suprarrenal","Endodermo¦Epitelio del tubo digestivo y respiratorio, hígado, páncreas, tiroides, vejiga"],"cards":[{"f":"Evento que define la semana 3","b":"Gastrulación (formación de las tres capas germinales a partir del epiblasto)."},{"f":"Derivado adulto de la notocorda","b":"Núcleo pulposo del disco intervertebral."},{"f":"Capa que forma la médula suprarrenal","b":"Cresta neural."},{"f":"Capa que forma el epitelio del tubo digestivo","b":"Endodermo."},{"f":"Marcador elevado en defectos del tubo neural","b":"α-fetoproteína."},{"f":"Componentes de la somita","b":"Esclerotomo (vértebras), miotomo (músculo) y dermatomo (dermis)."}],"quiz":[{"q":"¿Qué estructura deriva de la cresta neural?","o":["Cristalino","Retina","Adenohipófisis","Melanocitos"],"a":3,"e":"Melanocitos, médula suprarrenal, ganglios periféricos, células de Schwann y huesos faciales vienen de la cresta neural."},{"q":"Recién nacido sin expulsión de meconio a las 48 h; biopsia rectal sin células ganglionares. Mecanismo:","o":["Defecto del cierre del tubo neural","Falla de migración de la cresta neural","Atresia del endodermo","Persistencia de la notocorda"],"a":1,"e":"Enfermedad de Hirschsprung (aganglionosis)."}],"intro":"Semana 3: \"semana de los tres\" → tres capas germinales."},{"t":"Semanas 4 a 8: periodo embrionario","res":["<b>Plegamiento<\/b> cefalocaudal y lateral: el embrión toma forma cilíndrica; se forman intestino anterior, medio y posterior.","Semana 4: el <b>corazón late<\/b> (~día 22); arcos faríngeos; esbozos de extremidades superiores. Semana 5–6: extremidades inferiores; formación de la cara. Semana 8: rasgos humanos reconocibles.","<b>Arcos faríngeos<\/b> (1, 2, 3, 4, 6) con cartílago, músculo, nervio y arteria: 1.º trigémino (V, músculos de la masticación, martillo y yunque), 2.º facial (VII, músculos de la expresión, estribo), 3.º glosofaríngeo (IX), 4.º y 6.º vago (X, laringe).","Bolsas faríngeas: 1.ª oído medio; 2.ª amígdala palatina; 3.ª <b>timo y paratiroides inferiores<\/b>; 4.ª paratiroides superiores y células C.","Circulación fetal: el oxígeno llega por la <b>vena umbilical<\/b> → conducto venoso → VCI → AD → <b>foramen oval<\/b> → AI; y de la arteria pulmonar por el <b>conducto arterioso<\/b> a la aorta."],"hy":["Periodo embrionario (semanas 3–8) = organogénesis = máxima sensibilidad a teratógenos.","El <b>síndrome de DiGeorge<\/b> (deleción 22q11) afecta la 3.ª y 4.ª bolsa: sin timo (inmunodeficiencia T) ni paratiroides (hipocalcemia) más cardiopatía."],"cl":["<b>Labio y paladar hendido<\/b>: falla de fusión de procesos faciales.","<b>Persistencia del conducto arterioso<\/b>: soplo continuo en \"maquinaria\"; se cierra con indometacina; se mantiene abierto con prostaglandina E1."],"cards":[{"f":"Día en que empieza a latir el corazón","b":"≈ día 22 (semana 4)."},{"f":"Nervio del 1.er arco faríngeo","b":"Trigémino (V)."},{"f":"Derivados de la 3.ª bolsa faríngea","b":"Timo y paratiroides inferiores."},{"f":"Fármaco para cerrar el conducto arterioso","b":"Indometacina (o ibuprofeno)."},{"f":"Derivado adulto del conducto arterioso","b":"Ligamento arterioso."}],"quiz":[{"q":"Lactante con hipocalcemia, infecciones recurrentes y tronco arterioso. Estructuras afectadas:","o":["Cresta neural del tronco","3.ª y 4.ª bolsas faríngeas","1.er y 2.º arcos","Notocorda"],"a":1,"e":"Síndrome de DiGeorge (22q11.2)."},{"q":"¿Por dónde pasa la sangre de la aurícula derecha a la izquierda en el feto?","o":["Foramen oval","Arterias umbilicales","Conducto arterioso","Conducto venoso"],"a":0,"e":"Se cierra funcionalmente al nacer por el aumento de la presión en la aurícula izquierda."}],"intro":"Organogénesis: el periodo de mayor susceptibilidad a teratógenos."},{"t":"Periodo fetal, placenta y anexos","res":["Periodo fetal: crecimiento rápido; movimientos fetales percibidos ~semanas 16–20; surfactante desde ~24–28 semanas; viabilidad ~22–24 semanas.","<b>Placenta<\/b>: parte fetal (corion frondoso) + parte materna (<b>decidua basal<\/b>). Barrera: sincitiotrofoblasto, citotrofoblasto (disminuye), tejido conjuntivo y endotelio fetal.","Funciones: intercambio de gases y nutrientes, hormonas (<b>hCG, lactógeno placentario, progesterona, estrógenos<\/b>), paso de <b>IgG<\/b> materna (inmunidad pasiva).","<b>Cordón umbilical<\/b>: <b>2 arterias<\/b> (sangre desoxigenada hacia la placenta) y <b>1 vena<\/b> (sangre oxigenada al feto), en gelatina de Wharton.","<b>Líquido amniótico<\/b>: protección y desarrollo pulmonar; se recicla por deglución fetal y orina fetal."],"hy":["Arteria umbilical única se asocia a malformaciones renales y cardiacas.","<b>Oligohidramnios<\/b> → problema renal fetal (agenesia renal, secuencia de Potter); <b>polihidramnios<\/b> → el feto no deglute (atresia esofágica, anencefalia)."],"cl":["La IgG cruza la placenta: protege al recién nacido, pero también causa enfermedad hemolítica (anti-D) o lupus neonatal.","<b>Placenta previa<\/b> (sangrado indoloro) vs <b>desprendimiento de placenta<\/b> (sangrado doloroso con útero hipertónico)."],"cards":[{"f":"Vasos del cordón umbilical","b":"2 arterias y 1 vena."},{"f":"Inmunoglobulina que cruza la placenta","b":"IgG."},{"f":"Causa clásica de oligohidramnios","b":"Agenesia renal bilateral (secuencia de Potter)."},{"f":"Causa clásica de polihidramnios","b":"Atresia esofágica o anencefalia (el feto no deglute)."},{"f":"Componente materno de la placenta","b":"Decidua basal."}],"quiz":[{"q":"¿Qué vaso lleva sangre oxigenada al feto?","o":["Arterias umbilicales","Vena cava superior","Vena umbilical","Arteria pulmonar"],"a":2,"e":"La vena umbilical va de la placenta al feto (al hígado y conducto venoso)."},{"q":"Ultrasonido con polihidramnios en el 3.er trimestre. Malformación a buscar:","o":["Atresia esofágica","Valvas uretrales posteriores","Agenesia renal","Hipoplasia pulmonar"],"a":0,"e":"Si el feto no deglute, el líquido amniótico se acumula."}],"intro":"De la semana 9 al nacimiento: crecimiento y maduración."},{"t":"Teratología","res":["Semanas 1–2: \"todo o nada\" (muerte o recuperación completa). Semanas <b>3–8<\/b>: malformaciones mayores. Periodo fetal: alteraciones funcionales y de crecimiento.","Infecciones <b>TORCH<\/b>: toxoplasma, otros (sífilis, varicela, parvovirus, zika), rubéola, citomegalovirus, herpes."],"hy":["El alcohol es la principal causa prevenible de discapacidad intelectual.","En embarazo, cambiar warfarina por heparina; los IECA están contraindicados."],"cl":["Antes de prescribir isotretinoína se exige prueba de embarazo negativa y anticoncepción.","El <b>citomegalovirus<\/b> congénito es la causa infecciosa más común de sordera neurosensorial."],"tabla":["Teratógeno¦Efecto","Alcohol¦Síndrome alcohólico fetal: filtrum liso, labio superior delgado, microcefalia, discapacidad intelectual","Isotretinoína (vitamina A)¦Malformaciones craneofaciales, cardiacas y del SNC","Talidomida¦Focomelia","Valproato¦Defectos del tubo neural","Warfarina¦Hipoplasia nasal, epífisis punteadas","IECA¦Lesión renal fetal, oligohidramnios","Tetraciclinas¦Tinción de dientes, alteración ósea","Litio¦Anomalía de Ebstein","Rubéola¦Cataratas, sordera, persistencia del conducto arterioso","Citomegalovirus¦Calcificaciones periventriculares, sordera (infección congénita más común)","Toxoplasma¦Hidrocefalia, calcificaciones difusas, coriorretinitis"],"cards":[{"f":"Teratógeno que causa focomelia","b":"Talidomida."},{"f":"Teratógeno que causa anomalía de Ebstein","b":"Litio."},{"f":"Infección congénita más común","b":"Citomegalovirus."},{"f":"Periodo de \"todo o nada\"","b":"Semanas 1–2 tras la fecundación."},{"f":"Rasgos faciales del síndrome alcohólico fetal","b":"Filtrum liso, labio superior delgado, fisuras palpebrales cortas, microcefalia."}],"quiz":[{"q":"Recién nacido con cataratas, sordera y soplo continuo. Infección materna más probable:","o":["Rubéola","Toxoplasmosis","Citomegalovirus","Sífilis"],"a":0,"e":"Tríada de rubéola congénita: cataratas, sordera y cardiopatía (conducto arterioso)."},{"q":"Mujer epiléptica que desea embarazarse. ¿Qué fármaco aumenta el riesgo de espina bífida?","o":["Fenobarbital en dosis bajas","Levetiracetam","Ácido valproico","Lamotrigina"],"a":2,"e":"El valproato es el antiepiléptico más teratógeno (tubo neural); se da ácido fólico en dosis altas."}],"intro":"Agentes que alteran el desarrollo; el momento de exposición define el efecto."},{"t":"Herencia mendeliana y patrones","res":["Conceptos: <b>gen<\/b>, <b>alelo<\/b>, <b>locus<\/b>, <b>genotipo<\/b> vs <b>fenotipo<\/b>, homocigoto/heterocigoto, <b>penetrancia<\/b> (proporción de portadores que expresan), <b>expresividad variable<\/b> (grado de expresión), <b>pleiotropía<\/b> (un gen, muchos efectos), <b>anticipación<\/b> (más grave en cada generación: expansión de tripletes).","<b>Autosómica dominante<\/b>: afecta a ambos sexos, aparece en todas las generaciones, 50 % de riesgo para cada hijo de un afectado. Suelen ser defectos de proteínas estructurales.","<b>Autosómica recesiva<\/b>: padres portadores sanos, 25 % de riesgo; consanguinidad; suelen ser defectos enzimáticos.","<b>Recesiva ligada al X<\/b>: casi solo varones; no hay transmisión de padre a hijo; las hijas de un varón afectado son portadoras.","<b>Dominante ligada al X<\/b>: un padre afectado transmite a todas sus hijas y a ningún hijo (raquitismo hipofosfatémico).","<b>Mitocondrial<\/b>: solo la madre transmite; heteroplasmia.","<b>Imprinting<\/b>: deleción 15q11-13 paterna = Prader-Willi; materna = Angelman."],"hy":["Expansión de tripletes con anticipación: <b>Huntington (CAG)<\/b>, distrofia miotónica (CTG), X frágil (CGG), ataxia de Friedreich (GAA, sin anticipación por ser recesiva).","Fibrosis quística: gen <b>CFTR<\/b> (cromosoma 7), mutación más común <b>ΔF508<\/b>; prueba de cloruro en sudor."],"cl":["El <b>asesoramiento genético<\/b> calcula riesgos: dos portadores de una AR tienen 25 % de hijos afectados y 2/3 de probabilidad de portador en un hijo sano.","<b>Tamiz neonatal<\/b> en México detecta fenilcetonuria, hipotiroidismo congénito, galactosemia, hiperplasia suprarrenal congénita, fibrosis quística, entre otras."],"tabla":["Patrón¦Ejemplos","Autosómico dominante¦Marfan, acondroplasia, neurofibromatosis, Huntington, hipercolesterolemia familiar, poliquistosis renal del adulto","Autosómico recesivo¦Fibrosis quística, anemia falciforme, fenilcetonuria, hemocromatosis, enfermedad de Wilson","Recesivo ligado al X¦Hemofilia A y B, Duchenne, deficiencia de G6PD, daltonismo","Mitocondrial¦Neuropatía óptica de Leber, MELAS, MERRF"],"cards":[{"f":"Herencia de la fibrosis quística","b":"Autosómica recesiva (gen CFTR, cromosoma 7, ΔF508)."},{"f":"Herencia de la hemofilia A","b":"Recesiva ligada al X (factor VIII)."},{"f":"Definición de penetrancia incompleta","b":"No todos los portadores del genotipo expresan el fenotipo."},{"f":"Herencia mitocondrial: quién transmite","b":"Solo la madre a todos sus hijos."},{"f":"Prader-Willi vs Angelman","b":"Deleción 15q11-13 paterna = Prader-Willi; materna = Angelman (imprinting)."},{"f":"Enfermedad por expansión CAG con anticipación","b":"Huntington."}],"quiz":[{"q":"Un varón con hemofilia A y una mujer no portadora tienen hijos. ¿Qué esperas?","o":["Todos los hijos afectados","25 % de hijos de ambos sexos afectados","50 % de hijos afectados","Todas las hijas portadoras y ningún hijo afectado"],"a":3,"e":"El padre da su X a las hijas y su Y a los hijos."},{"q":"Dos padres sanos tienen un hijo con fibrosis quística. Riesgo para el siguiente embarazo:","o":["50 %","0 %","100 %","25 %"],"a":3,"e":"Ambos son portadores heterocigotos: ¼ afectado, ½ portador, ¼ sano."},{"q":"Un rasgo afecta a varias generaciones, a ambos sexos y hay transmisión de padre a hijo varón. Patrón:","o":["Mitocondrial","Recesivo ligado al X","Autosómico recesivo","Autosómico dominante"],"a":3,"e":"La transmisión varón-varón descarta herencia ligada al X."}],"intro":"Cómo se transmite un rasgo según el gen esté en un autosoma o en el cromosoma X."},{"t":"Cromosomas y alteraciones cromosómicas","res":["<b>Cariotipo<\/b>: análisis de cromosomas en metafase (bandeo G). <b>FISH<\/b> para deleciones pequeñas; <b>microarreglos<\/b> para variantes de número de copias.","Alteraciones numéricas (<b>aneuploidías<\/b>) por <b>no disyunción<\/b>; estructurales: deleciones, duplicaciones, inversiones, translocaciones (recíprocas y <b>robertsonianas<\/b>, entre acrocéntricos 13, 14, 15, 21, 22).","<b>Trisomía 21 (Down)<\/b>: la más frecuente compatible con la vida; discapacidad intelectual, fisuras palpebrales oblicuas, pliegue palmar único, <b>defecto del canal auriculoventricular<\/b>, atresia duodenal, leucemia, Alzheimer temprano. Tamiz del 1.er trimestre: ↑ translucencia nucal, ↑ β-hCG, ↓ PAPP-A.","<b>Trisomía 18 (Edwards)<\/b>: puños cerrados con dedos superpuestos, pies en mecedora, micrognatia. <b>Trisomía 13 (Patau)<\/b>: labio/paladar hendido, polidactilia, holoprosencefalia, microftalmia.","<b>Turner (45,X)<\/b>: talla baja, cuello alado, linfedema neonatal, <b>coartación aórtica<\/b>, válvula aórtica bicúspide, disgenesia gonadal (amenorrea primaria), riñón en herradura.","<b>Klinefelter (47,XXY)<\/b>: varón alto, testículos pequeños, ginecomastia, infertilidad (azoospermia), hipogonadismo hipergonadotrópico."],"hy":["Translocación robertsoniana 14;21 en un padre → riesgo de Down familiar, independiente de la edad materna.","<b>Corpúsculo de Barr<\/b> = X inactivo: hay uno en Klinefelter (XXY) y ninguno en Turner (45,X)."],"cl":["Síndrome de <b>X frágil<\/b>: causa hereditaria más común de discapacidad intelectual; macroorquidismo, orejas grandes, mandíbula prominente.","<b>Cri du chat<\/b> (deleción 5p): llanto como de gato, microcefalia y discapacidad intelectual."],"cards":[{"f":"Cariotipo del síndrome de Turner","b":"45,X."},{"f":"Cardiopatía típica del síndrome de Down","b":"Defecto del canal auriculoventricular (tabique AV)."},{"f":"Cardiopatía típica del síndrome de Turner","b":"Coartación de la aorta (y aorta bicúspide)."},{"f":"Tamiz del 1.er trimestre en Down","b":"↑ translucencia nucal, ↑ β-hCG libre, ↓ PAPP-A."},{"f":"Causa hereditaria más común de discapacidad intelectual","b":"Síndrome de X frágil."},{"f":"Cromosomas que participan en translocaciones robertsonianas","b":"Acrocéntricos: 13, 14, 15, 21 y 22."}],"quiz":[{"q":"Recién nacida con linfedema de manos y pies y cuello alado. Prueba diagnóstica:","o":["Cariotipo","Tamiz metabólico","Electroforesis de hemoglobina","Prueba de sudor"],"a":0,"e":"Sospecha de Turner (45,X); se confirma con cariotipo."},{"q":"Recién nacido con puños cerrados con dedos superpuestos, pies en mecedora y micrognatia. Diagnóstico probable:","o":["Monosomía X","Trisomía 21","Trisomía 13","Trisomía 18"],"a":3,"e":"Edwards: puños cerrados con dedos superpuestos y pies en mecedora."},{"q":"Varón de 17 años, alto, con ginecomastia y testículos pequeños. FSH y LH altas. Cariotipo esperado:","o":["47,XXY","45,X","46,XY con deleción del Y","47,XYY"],"a":0,"e":"Klinefelter: hipogonadismo hipergonadotrópico."}],"intro":"El cariotipo humano normal es 46,XX o 46,XY."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
