<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Histología</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#8a3b78; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="HIS"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"histologia","title":"Histología","kicker":"Primer semestre · Histología","desc":"Los cuatro tejidos básicos y sus variantes, con las tinciones, las estructuras que se preguntan en el práctico y su correlación con la patología.","nota":"","temas":[{"t":"Métodos de estudio y tinciones","res":["Secuencia de la técnica histológica: <b>obtención → fijación → deshidratación → aclaramiento → inclusión en parafina → corte (micrótomo, 5–10 µm) → tinción → montaje<\/b>.","Fijador de rutina: <b>formol (formaldehído) al 10 % amortiguado<\/b>; forma enlaces cruzados entre proteínas. El glutaraldehído se usa para microscopía electrónica.","<b>Hematoxilina<\/b> (básica) tiñe estructuras <b>basófilas<\/b> (ácidas): núcleo, heterocromatina, RER, ribosomas → azul-morado.","<b>Eosina<\/b> (ácida) tiñe estructuras <b>acidófilas/eosinófilas<\/b> (básicas): citoplasma, mitocondrias, colágeno → rosa.","Tinciones especiales: <b>PAS<\/b> (glucógeno, mucinas, membranas basales → magenta), <b>tricrómico de Masson<\/b> (colágeno azul/verde), <b>impregnación argéntica<\/b> (fibras reticulares, tipo III → negras), <b>orceína/Verhoeff<\/b> (fibras elásticas), <b>Sudán/aceite rojo O<\/b> (lípidos, requiere corte por congelación), <b>azul de toluidina<\/b> (metacromasia de mastocitos y cartílago).","Microscopía: óptica (resolución ≈ 0.2 µm), electrónica de transmisión (ultraestructura, ≈ 1 nm), de barrido (superficies en 3D), de fluorescencia e inmunohistoquímica (antígeno–anticuerpo marcado)."],"hy":["Basófilo = afinidad por colorante básico (hematoxilina) porque la estructura es <b>ácida<\/b> (ADN, ARN). Es la confusión más frecuente.","Los lípidos se disuelven en la técnica de parafina: los adipocitos se ven \"vacíos\" en H&amp;E; para verlos se usa corte por congelación + Sudán."],"cl":["Biopsia transoperatoria: corte por <b>congelación (criostato)<\/b> para diagnóstico rápido mientras el paciente sigue en quirófano.","La <b>inmunohistoquímica<\/b> clasifica tumores por sus proteínas (p. ej. citoqueratinas en carcinomas, vimentina en sarcomas†)."],"tabla":["Tinción¦Qué demuestra¦Color","H&amp;E¦Núcleo / citoplasma¦Azul-morado / rosa","PAS¦Glucógeno, moco neutro, membrana basal¦Magenta","Tricrómico de Masson¦Colágeno (fibrosis)¦Azul o verde","Plata (reticulina)¦Colágeno III¦Negro","Sudán / aceite rojo O¦Lípidos¦Rojo-naranja"],"cards":[{"f":"¿Qué tiñe la hematoxilina y por qué?","b":"Estructuras basófilas (ácidas): núcleo, ADN, ARN, ribosomas y RER. Es un colorante básico."},{"f":"Fijador de rutina en histología","b":"Formol amortiguado al 10 % (enlaces cruzados de proteínas)."},{"f":"Tinción para glucógeno y membrana basal","b":"PAS (ácido peryódico de Schiff): magenta."},{"f":"Tinción para fibras reticulares (colágeno III)","b":"Impregnación argéntica (plata): negras."},{"f":"¿Por qué el adipocito se ve vacío en H&amp;E?","b":"Los solventes del procesamiento en parafina disuelven los lípidos."}],"quiz":[{"q":"¿Qué estructura es característicamente basófila en H&amp;E?","o":["El RER de una célula plasmática","Las fibras de colágeno I","Las mitocondrias","El citoplasma de un eritrocito"],"a":0,"e":"El RER y los ribosomas tienen ARN (ácido), por eso captan hematoxilina; la basofilia citoplasmática de la célula plasmática es un clásico."},{"q":"Necesitas demostrar lípidos en una biopsia. ¿Qué haces?","o":["Inclusión en parafina y PAS","Corte por congelación y tinción con Sudán","Impregnación argéntica","Tricrómico de Masson"],"a":1,"e":"La parafina exige solventes que disuelven la grasa; el corte en congelación la conserva."},{"q":"La tinción PAS es positiva en:","o":["Lípidos neutros","Glucógeno y membranas basales","Colágeno tipo I","Fibras elásticas"],"a":1,"e":"PAS marca carbohidratos (glucógeno, mucinas neutras, glucoproteínas de la membrana basal)."}],"intro":"Cómo pasa un órgano a una laminilla y qué color toma cada estructura."},{"t":"Tejido epitelial","res":["Características: <b>polaridad<\/b> (apical, lateral, basal), <b>avascular<\/b> (se nutre por difusión desde el conectivo), apoyado en <b>membrana basal<\/b> (lámina basal + lámina reticular), alta capacidad de renovación.","Clasificación por <b>número de capas<\/b> (simple, estratificado, seudoestratificado) y <b>forma de la capa superficial<\/b> (plano, cúbico, cilíndrico). Transicional = urotelio.","Especializaciones apicales: <b>microvellosidades<\/b> (actina; borde en cepillo/chapa estriada → absorción), <b>estereocilios<\/b> (microvellosidades largas: epidídimo, oído), <b>cilios<\/b> (axonema 9+2 de microtúbulos con dineína → movimiento).","Uniones laterales (de apical a basal): <b>zónula occludens<\/b> (unión estrecha: claudinas y ocludinas, barrera), <b>zónula adherens<\/b> (cadherinas + actina), <b>desmosoma<\/b> (cadherinas desmogleína/desmocolina + filamentos intermedios), <b>unión comunicante/gap<\/b> (conexinas, paso de iones). Basal: <b>hemidesmosoma<\/b> (integrinas, a la lámina basal).","Glándulas: exocrinas (con conducto) vs endocrinas (a la sangre). Secreción <b>merocrina<\/b> (exocitosis: páncreas, salivales), <b>apocrina<\/b> (pierde porción apical: mama), <b>holocrina<\/b> (la célula entera: glándula sebácea)."],"hy":["Unión estrecha = barrera (ocludinas/claudinas); desmosoma = resistencia mecánica (filamentos intermedios); hemidesmosoma = anclaje a la membrana basal (integrinas).","Cilios: 9 pares + 2 centrales (9+2) y dineína; cuerpo basal y centriolo: 9 tripletes (9+0)."],"cl":["<b>Metaplasia<\/b>: cambio de un epitelio maduro por otro; en fumadores el epitelio respiratorio pasa a plano estratificado; en el <b>esófago de Barrett<\/b> el plano estratificado pasa a cilíndrico con células caliciformes (riesgo de adenocarcinoma).","<b>Síndrome de Kartagener<\/b> (discinesia ciliar primaria): falta de brazos de dineína → bronquiectasias, sinusitis, infertilidad y situs inversus.","<b>Pénfigo vulgar<\/b>: anticuerpos contra desmogleína 3 (desmosomas) → ampollas intraepidérmicas flácidas; <b>penfigoide ampolloso<\/b>: contra hemidesmosomas → ampollas subepidérmicas tensas."],"tabla":["Epitelio¦Localización típica","Plano simple¦Endotelio, mesotelio, alvéolo, asa de Henle","Cúbico simple¦Folículo tiroideo, túbulos renales, conductos pequeños","Cilíndrico simple¦Estómago, intestino, vesícula biliar","Seudoestratificado cilíndrico ciliado¦Tráquea y bronquios (epitelio respiratorio)","Plano estratificado no queratinizado¦Boca, esófago, vagina, córnea","Plano estratificado queratinizado¦Epidermis","Transicional (urotelio)¦Pelvis renal, uréter, vejiga"],"cards":[{"f":"Epitelio de la tráquea","b":"Seudoestratificado cilíndrico ciliado con células caliciformes."},{"f":"Epitelio de la vejiga","b":"Transicional (urotelio), con células en paraguas."},{"f":"Proteínas de la unión estrecha","b":"Claudinas y ocludinas (zónula occludens)."},{"f":"Estructura del axonema de un cilio","b":"9 pares periféricos + 2 microtúbulos centrales (9+2), con dineína."},{"f":"Secreción holocrina: ejemplo","b":"Glándula sebácea (se libera la célula completa)."},{"f":"Pénfigo vs penfigoide","b":"Pénfigo: anticuerpos contra desmosomas (desmogleína) → ampolla intraepidérmica. Penfigoide: contra hemidesmosomas → ampolla subepidérmica."}],"quiz":[{"q":"¿Qué epitelio reviste el esófago normal?","o":["Seudoestratificado ciliado","Plano estratificado no queratinizado","Cilíndrico simple con caliciformes","Plano estratificado queratinizado"],"a":1,"e":"El esófago soporta fricción: plano estratificado no queratinizado. Si cambia a cilíndrico con caliciformes es esófago de Barrett."},{"q":"La unión que impide el paso de solutos entre células epiteliales es:","o":["Unión gap","Zónula occludens","Desmosoma","Hemidesmosoma"],"a":1,"e":"La unión estrecha sella el espacio intercelular (vía paracelular)."},{"q":"Paciente con infertilidad, bronquiectasias y dextrocardia. ¿Qué proteína falla?","o":["Colágeno III","Dineína ciliar","Distrofina","Espectrina"],"a":1,"e":"Síndrome de Kartagener: discinesia ciliar por defecto de los brazos de dineína."},{"q":"La glándula mamaria secreta lípidos por un mecanismo:","o":["Endocrino","Holocrino","Merocrino exclusivo","Apocrino"],"a":3,"e":"Las gotas de lípido salen con una porción de la membrana apical (apocrina)."}],"intro":"Láminas de células unidas con poca matriz, sobre una membrana basal y sin vasos."},{"t":"Tejido conjuntivo","res":["Células <b>residentes<\/b>: fibroblasto (sintetiza fibras y matriz), adipocito, macrófago (histiocito), mastocito (heparina, histamina; IgE en su superficie). <b>Transitorias<\/b>: plasmocitos, linfocitos, neutrófilos, eosinófilos.","Fibras: <b>colágeno<\/b> (resistencia a la tracción), <b>reticulares<\/b> (colágeno III, armazón de órganos linfoides, hígado, médula ósea), <b>elásticas<\/b> (elastina + fibrilina; aorta, pulmón, piel).","Sustancia fundamental: glucosaminoglucanos (ácido hialurónico, condroitín sulfato, heparán sulfato), proteoglucanos y glucoproteínas de adhesión (fibronectina, laminina).","Síntesis de colágeno: en el RER se hidroxilan prolina y lisina (<b>requiere vitamina C<\/b>) → triple hélice (procolágeno) → se exocita → peptidasas cortan los extremos (tropocolágeno) → <b>lisil oxidasa<\/b> forma enlaces cruzados (requiere cobre).","Clasificación: conjuntivo laxo (areolar), denso irregular (dermis), denso regular (tendones, ligamentos), especializados: adiposo (blanco unilocular / pardo multilocular con UCP-1, termogénesis), reticular, cartílago, hueso y sangre."],"hy":["Escorbuto: sin vitamina C no se hidroxila la prolina → colágeno débil: encías sangrantes, hemorragias perifoliculares, mala cicatrización.","Síndrome de Marfan = fibrilina-1 (fibras elásticas): talla alta, aracnodactilia, subluxación del cristalino hacia arriba, dilatación/disección aórtica."],"cl":["<b>Osteogénesis imperfecta<\/b>: colágeno I defectuoso → fracturas múltiples, escleras azules, sordera.","<b>Ehlers-Danlos<\/b>: colágeno (III en la forma vascular) → piel hiperelástica, articulaciones hiperlaxas, rotura arterial.","<b>Síndrome de Alport<\/b>: colágeno IV → nefritis hereditaria, sordera neurosensorial y alteraciones oculares."],"tabla":["Colágeno¦Dónde¦Recuerda","I¦Hueso, tendón, piel, cicatriz madura¦El más abundante","II¦Cartílago hialino y elástico, humor vítreo¦\"Car-two-lage\"","III¦Fibras reticulares, vasos, útero, cicatriz inicial¦Ehlers-Danlos vascular","IV¦Lámina basal¦Alport, Goodpasture"],"cards":[{"f":"Colágeno de la lámina basal","b":"Tipo IV."},{"f":"Colágeno del cartílago hialino","b":"Tipo II."},{"f":"Cofactor para hidroxilar prolina y lisina","b":"Vitamina C (ácido ascórbico)."},{"f":"Proteína alterada en Marfan","b":"Fibrilina-1 (microfibrillas de las fibras elásticas)."},{"f":"Grasa parda: proteína clave","b":"Termogenina (UCP-1): desacopla la fosforilación oxidativa para producir calor."},{"f":"Célula que libera histamina y heparina","b":"Mastocito (receptor de IgE)."}],"quiz":[{"q":"Un paciente con escleras azules y fracturas recurrentes tiene alterado el colágeno:","o":["Tipo II","Tipo III","Tipo I","Tipo IV"],"a":2,"e":"Osteogénesis imperfecta: colágeno I, principal del hueso, escleras y dentina."},{"q":"¿Qué enzima forma los enlaces cruzados del colágeno y qué cofactor requiere?","o":["Lisil oxidasa; vitamina C","Prolil hidroxilasa; cobre","Lisil oxidasa; cobre","Colagenasa; zinc"],"a":2,"e":"La hidroxilación requiere vitamina C; el entrecruzamiento por lisil oxidasa requiere cobre (enfermedad de Menkes)."},{"q":"Las fibras reticulares que sostienen el bazo están formadas por:","o":["Elastina","Fibrilina","Colágeno III","Colágeno I"],"a":2,"e":"Colágeno III, argirófilo (se ve con plata)."}],"intro":"Células dispersas en abundante matriz extracelular: fibras + sustancia fundamental."},{"t":"Cartílago y hueso","res":["Cartílago: condrocitos en <b>lagunas<\/b> (grupos isógenos), matriz de colágeno II + agrecano; nutrición por difusión desde el <b>pericondrio<\/b> (excepto cartílago articular y fibrocartílago, sin pericondrio).","<b>Hialino<\/b> (articular, costal, tráquea, placa epifisaria), <b>elástico<\/b> (pabellón auricular, epiglotis; fibras elásticas), <b>fibrocartílago<\/b> (discos intervertebrales, sínfisis del pubis, meniscos; colágeno I, sin pericondrio).","Hueso: matriz orgánica (osteoide, colágeno I) + inorgánica (<b>hidroxiapatita<\/b>). Células: <b>osteoprogenitoras<\/b>, <b>osteoblastos<\/b> (forman osteoide, fosfatasa alcalina), <b>osteocitos<\/b> (en lagunas, conectados por canalículos), <b>osteoclastos<\/b> (multinucleados, origen monocito-macrófago; borde en cepillo, fosfatasa ácida resistente a tartrato; laguna de Howship).","Hueso compacto: <b>osteona (sistema de Havers)<\/b> = conducto de Havers central + laminillas concéntricas; conductos de <b>Volkmann<\/b> perpendiculares. Hueso esponjoso: trabéculas sin osteonas.","Osificación <b>intramembranosa<\/b> (huesos planos del cráneo, clavícula) vs <b>endocondral<\/b> (huesos largos, sobre molde de cartílago hialino). Placa epifisaria: zonas de reposo → proliferación → hipertrofia → calcificación → osificación.","Regulación: <b>RANKL<\/b> (osteoblasto) se une a <b>RANK<\/b> (osteoclasto) → resorción; <b>osteoprotegerina<\/b> bloquea RANKL. PTH estimula resorción (vía osteoblastos); calcitonina inhibe osteoclastos."],"hy":["Osteoclasto: célula multinucleada de origen <b>monocito-macrófago<\/b>, no mesenquimal. Marca: fosfatasa ácida resistente a tartrato (TRAP).","El crecimiento en longitud del hueso largo depende de la <b>zona de proliferación<\/b> de la placa epifisaria."],"cl":["<b>Acondroplasia<\/b>: mutación activadora de FGFR3 → menos proliferación en la placa epifisaria → enanismo de extremidades cortas con tronco normal.","<b>Osteoporosis<\/b>: menos masa ósea con mineralización normal; <b>raquitismo/osteomalacia<\/b>: falla de mineralización por déficit de vitamina D (exceso de osteoide).","<b>Denosumab<\/b> (anticuerpo anti-RANKL) trata la osteoporosis imitando a la osteoprotegerina."],"cards":[{"f":"Cartílago sin pericondrio","b":"Fibrocartílago y cartílago articular."},{"f":"Cartílago de la epiglotis","b":"Elástico."},{"f":"Unidad estructural del hueso compacto","b":"Osteona o sistema de Havers."},{"f":"Origen del osteoclasto","b":"Línea monocito-macrófago (médula ósea)."},{"f":"Osificación de la clavícula y huesos planos del cráneo","b":"Intramembranosa."},{"f":"Señal que activa a los osteoclastos","b":"RANKL (del osteoblasto) sobre RANK; la osteoprotegerina la bloquea."}],"quiz":[{"q":"¿Qué tipo de cartílago forma los discos intervertebrales?","o":["Elástico","Hialino con pericondrio","Fibrocartílago","Hialino"],"a":2,"e":"Fibrocartílago: colágeno I, resiste compresión y tensión, sin pericondrio."},{"q":"Niño con extremidades cortas, tronco normal y macrocefalia. ¿Qué zona de la placa epifisaria está alterada?","o":["Osificación por colágeno I defectuoso","Calcificación por falta de vitamina D","Reposo por exceso de PTH","Proliferación (por FGFR3 activado)"],"a":3,"e":"Acondroplasia: FGFR3 frena la proliferación de condrocitos; es autosómica dominante, casi siempre mutación nueva."},{"q":"¿Qué conectan los conductos de Volkmann?","o":["Grupos isógenos","Lagunas de osteocitos","Conductos de Havers entre sí y con el periostio","Laminillas intersticiales"],"a":2,"e":"Son perpendiculares al eje del hueso y llevan vasos entre osteonas."}],"intro":"Conectivos especializados de sostén: el cartílago es avascular; el hueso, muy vascularizado y mineralizado."},{"t":"Tejido muscular","res":["<b>Esquelético<\/b>: fibras multinucleadas con núcleos periféricos, estriado, voluntario; envolturas: epimisio → perimisio (fascículo) → endomisio (fibra). Células satélite = regeneración.","<b>Sarcómero<\/b> (de línea Z a línea Z): banda <b>A<\/b> (miosina, longitud constante), banda <b>I<\/b> (solo actina), <b>zona H<\/b> (solo miosina), <b>línea M<\/b> (centro). En la contracción se acortan <b>I y H<\/b>; A no cambia.","<b>Tríada<\/b> del esquelético: túbulo T + 2 cisternas terminales del retículo sarcoplásmico (en la unión A-I). Receptor de dihidropiridina (sensor de voltaje) acoplado a <b>receptor de rianodina<\/b> (libera Ca²⁺).","<b>Cardiaco<\/b>: estriado, 1–2 núcleos centrales, ramificado, <b>discos intercalares<\/b> (uniones gap + desmosomas + fascias adherentes), díada (túbulo T + 1 cisterna, en la línea Z); casi sin regeneración.","<b>Liso<\/b>: fusiforme, núcleo central, sin estrías, cuerpos densos (equivalentes a Z), contracción regulada por <b>calmodulina → cinasa de cadena ligera de miosina<\/b>; puede dividirse."],"hy":["En la contracción: <b>H e I se acortan, A permanece igual<\/b> (\"HIZ se acorta; A no\").","Distrofina une el citoesqueleto de actina a la matriz extracelular; su ausencia → distrofia muscular de Duchenne (ligada al X)."],"cl":["<b>Duchenne<\/b>: deleción en el gen de distrofina → debilidad proximal, signo de Gowers, seudohipertrofia de pantorrillas, CK muy elevada.","<b>Infarto<\/b>: el miocardio no se regenera; cicatriza con colágeno. Las troponinas I y T son los marcadores de lesión miocárdica.","<b>Hipertermia maligna<\/b>: mutación del receptor de rianodina → liberación masiva de Ca²⁺ con anestésicos halogenados/succinilcolina; tratamiento con dantroleno."],"tabla":["¦Esquelético¦Cardiaco¦Liso","Núcleos¦Muchos, periféricos¦1–2 centrales¦1 central","Estrías¦Sí¦Sí¦No","Unión¦—¦Discos intercalares¦Uniones gap","Ca²⁺ se une a¦Troponina C¦Troponina C¦Calmodulina","Regeneración¦Células satélite¦Mínima (fibrosis)¦Alta"],"cards":[{"f":"Bandas que se acortan en la contracción","b":"Banda I y zona H (la banda A no cambia)."},{"f":"Componentes del disco intercalar","b":"Uniones gap, desmosomas y fascias adherentes."},{"f":"Tríada del músculo esquelético","b":"Túbulo T + dos cisternas terminales del retículo sarcoplásmico."},{"f":"En el músculo liso el Ca²⁺ se une a","b":"Calmodulina, que activa la cinasa de la cadena ligera de miosina."},{"f":"Células madre del músculo esquelético","b":"Células satélite."}],"quiz":[{"q":"¿Qué banda del sarcómero mantiene su longitud durante la contracción?","o":["Banda I","Banda A","Zona H","Distancia Z-Z"],"a":1,"e":"La banda A corresponde a la longitud de los filamentos gruesos de miosina, que no cambian."},{"q":"Niño de 5 años que se levanta del suelo apoyándose en sus muslos y tiene pantorrillas grandes. ¿Qué proteína falta?","o":["Troponina C","Titina","Distrofina","Nebulina"],"a":2,"e":"Distrofia de Duchenne: signo de Gowers y seudohipertrofia; herencia recesiva ligada al X."},{"q":"¿Qué característica distingue al músculo cardiaco en un corte?","o":["Cuerpos densos citoplásmicos","Discos intercalares y núcleos centrales","Núcleos periféricos múltiples","Ausencia de estrías"],"a":1,"e":"Los discos intercalares son exclusivos del miocardio."}],"intro":"Células alargadas (fibras) especializadas en contraer gracias a actina y miosina."},{"t":"Tejido nervioso","res":["Neurona: soma con <b>cuerpos de Nissl<\/b> (RER, basófilos), dendritas (reciben), axón (conduce; nace del cono axónico, sin Nissl). Tipos: multipolar (motoneurona), bipolar (retina, epitelio olfatorio), seudounipolar (ganglio de la raíz dorsal).","Glía del SNC: <b>astrocitos<\/b> (barrera hematoencefálica, GFAP, cicatriz glial), <b>oligodendrocitos<\/b> (mielina de muchos axones), <b>microglía<\/b> (macrófagos, origen mesodérmico/monocito), <b>ependimocitos<\/b> (revisten ventrículos; plexos coroideos).","Glía del SNP: <b>células de Schwann<\/b> (mielina de un solo internodo de un axón; permiten regeneración) y células satélite (ganglios).","Mielina: aumenta la velocidad por <b>conducción saltatoria<\/b> entre <b>nodos de Ranvier<\/b> (canales de Na⁺ concentrados).","Nervio periférico: <b>endoneuro<\/b> (cada fibra) → <b>perineuro<\/b> (fascículo, barrera) → <b>epineuro<\/b> (nervio completo).","Barrera hematoencefálica: uniones estrechas del endotelio + membrana basal + pies de astrocitos."],"hy":["Esclerosis múltiple daña <b>oligodendrocitos<\/b> (SNC); Guillain-Barré daña <b>células de Schwann<\/b> (SNP).","Microglía es la única glía de origen mesodérmico; en VIH forma células gigantes multinucleadas."],"cl":["<b>Esclerosis múltiple<\/b>: placas de desmielinización en sustancia blanca, bandas oligoclonales en LCR; neuritis óptica, oftalmoplejía internuclear.","<b>Guillain-Barré<\/b>: polirradiculoneuropatía desmielinizante aguda tras infección (Campylobacter), debilidad ascendente y arreflexia.","Tumores: <b>GFAP<\/b> positivo en tumores astrocíticos; schwannoma vestibular (neurinoma del acústico) en neurofibromatosis tipo 2."],"tabla":["Célula¦Origen¦Función clave","Oligodendrocito¦Neuroectodermo¦Mielina en SNC (varios axones)","Schwann¦Cresta neural¦Mielina en SNP (1 internodo)","Astrocito¦Neuroectodermo¦BHE, sostén, cicatriz (GFAP)","Microglía¦Mesodermo (saco vitelino)¦Fagocitosis"],"cards":[{"f":"Cuerpos de Nissl","b":"Retículo endoplásmico rugoso del soma neuronal (basófilo); no hay en el axón."},{"f":"Mielina en SNC vs SNP","b":"SNC: oligodendrocitos (varios axones). SNP: células de Schwann (un internodo)."},{"f":"Marcador de astrocitos","b":"GFAP (proteína ácida fibrilar glial)."},{"f":"Neurona del ganglio de la raíz dorsal","b":"Seudounipolar."},{"f":"Capa del nervio que forma barrera","b":"Perineuro."}],"quiz":[{"q":"En la esclerosis múltiple la célula dañada es:","o":["Astrocito","Célula de Schwann","Oligodendrocito","Microglía"],"a":2,"e":"Es una enfermedad desmielinizante del SNC, donde la mielina la forma el oligodendrocito."},{"q":"¿Qué glía tiene origen mesodérmico?","o":["Microglía","Oligodendrocito","Astrocito","Ependimocito"],"a":0,"e":"La microglía deriva de precursores del saco vitelino (línea monocito-macrófago)."},{"q":"La conducción saltatoria se debe a:","o":["Concentración de canales de Na⁺ en los nodos de Ranvier","Mayor diámetro del soma","Ausencia de canales de K⁺","Uniones gap entre axones"],"a":0,"e":"La mielina aísla los internodos y el potencial \"salta\" de nodo en nodo."}],"intro":"Neuronas que conducen impulsos y glía que las sostiene, aísla y defiende."},{"t":"Sangre y hematopoyesis","res":["Plasma ≈ 55 % del volumen (agua, albúmina, globulinas, fibrinógeno). Suero = plasma sin factores de coagulación.","<b>Eritrocito<\/b>: disco bicóncavo, 7.5 µm, sin núcleo ni organelos, vida ≈ 120 días; citoesqueleto con <b>espectrina<\/b> y anquirina.","<b>Neutrófilo<\/b> (50–70 %): núcleo de 3–5 lóbulos, gránulos específicos; primera línea contra bacterias. <b>Eosinófilo<\/b> (1–4 %): núcleo bilobulado, gránulos rojos (proteína básica mayor); parásitos y alergia. <b>Basófilo<\/b> (&lt;1 %): gránulos azules con histamina.","<b>Linfocito<\/b> (20–40 %): núcleo redondo, poco citoplasma (T, B, NK). <b>Monocito<\/b> (2–8 %): núcleo arriñonado; en tejidos se vuelve macrófago.","<b>Plaquetas<\/b>: fragmentos de megacariocito, 2–3 µm, vida 7–10 días; gránulos α y densos.","Hematopoyesis: saco vitelino → hígado (y bazo) fetal → <b>médula ósea<\/b> desde el final del periodo fetal. Célula madre hematopoyética <b>CD34+<\/b>. EPO (riñón) estimula eritropoyesis; TPO (hígado) a megacariocitos."],"hy":["Orden de frecuencia de leucocitos: \"<b>Nunca Llames Mal A Bob<\/b>\" → neutrófilos &gt; linfocitos &gt; monocitos &gt; eosinófilos &gt; basófilos.","Reticulocitos (eritrocitos jóvenes con ARN residual) reflejan la respuesta de la médula: ↑ en hemólisis o hemorragia."],"cl":["<b>Esferocitosis hereditaria<\/b>: defecto de espectrina/anquirina → esferocitos, anemia hemolítica, esplenomegalia.","<b>Eosinofilia<\/b>: parasitosis por helmintos, alergias, asma, insuficiencia suprarrenal†.","Biometría hemática: la neutrofilia con bandas sugiere infección bacteriana; la linfocitosis, infección viral."],"cards":[{"f":"Vida media del eritrocito","b":"≈ 120 días."},{"f":"Leucocito más abundante","b":"Neutrófilo (50–70 %)."},{"f":"Proteína del citoesqueleto del eritrocito alterada en esferocitosis","b":"Espectrina (o anquirina)."},{"f":"Marcador de la célula madre hematopoyética","b":"CD34."},{"f":"Sitio principal de hematopoyesis en el feto del 2º trimestre","b":"Hígado."}],"quiz":[{"q":"Paciente con helmintiasis intestinal. ¿Qué leucocito esperas elevado?","o":["Monocito","Basófilo","Neutrófilo","Eosinófilo"],"a":3,"e":"Los eosinófilos liberan proteína básica mayor contra helmintos."},{"q":"¿Qué célula da origen a las plaquetas?","o":["Megacariocito","Eritroblasto","Monocito","Mieloblasto"],"a":0,"e":"Las plaquetas son fragmentos citoplásmicos del megacariocito."}],"intro":"Tejido conjuntivo líquido: plasma + elementos formes."},{"t":"Piel y anexos","res":["Capas de la epidermis (de profundo a superficial): <b>basal<\/b> (germinativa, células madre), <b>espinosa<\/b> (desmosomas), <b>granulosa<\/b> (gránulos de queratohialina), <b>lúcida<\/b> (solo piel gruesa: palmas y plantas), <b>córnea<\/b>. \"<b>Buenos Estudiantes Ganan Lugares Cómodos<\/b>\".","Células: queratinocitos (≈ 90 %), <b>melanocitos<\/b> (capa basal, cresta neural; producen melanina y la transfieren), <b>células de Langerhans<\/b> (presentadoras de antígeno, gránulos de Birbeck), <b>células de Merkel<\/b> (mecanorreceptores, tacto fino).","Dermis: papilar (conectivo laxo, asas capilares, <b>corpúsculos de Meissner<\/b>) y reticular (denso irregular, <b>corpúsculos de Pacini<\/b> para vibración y presión).","Anexos: folículo piloso, glándula sebácea (holocrina), sudoríparas <b>ecrinas<\/b> (todo el cuerpo, termorregulación, inervación simpática colinérgica) y <b>apocrinas<\/b> (axila, ingle; desembocan en folículo)."],"hy":["El color de la piel depende de la <b>cantidad de melanina<\/b> producida y transferida, no del número de melanocitos.","Meissner = tacto fino en dermis papilar; Pacini = vibración/presión profunda en dermis reticular e hipodermis."],"cl":["<b>Vitiligo<\/b>: destrucción autoinmune de melanocitos; <b>albinismo<\/b>: melanocitos presentes pero sin tirosinasa funcional.","<b>Carcinoma basocelular<\/b> (el cáncer de piel más común), <b>espinocelular<\/b> y <b>melanoma<\/b> (de melanocitos, el más letal; criterios ABCDE).","<b>Psoriasis<\/b>: hiperproliferación con paraqueratosis (núcleos en la capa córnea)."],"cards":[{"f":"Capa que solo existe en piel gruesa","b":"Estrato lúcido."},{"f":"Célula presentadora de antígeno de la epidermis","b":"Célula de Langerhans (gránulos de Birbeck)."},{"f":"Origen embrionario del melanocito","b":"Cresta neural."},{"f":"Receptor de vibración","b":"Corpúsculo de Pacini."},{"f":"Glándula sudorípara de la termorregulación","b":"Ecrina."}],"quiz":[{"q":"Una persona de piel oscura y otra de piel clara tienen:","o":["Número similar de melanocitos con distinta producción de melanina","Más melanocitos en la piel oscura","Melanocitos en distintas capas","Ausencia de melanocitos en piel clara"],"a":0,"e":"La diferencia es de actividad de los melanocitos y transferencia de melanosomas."},{"q":"¿En qué estrato de la epidermis se encuentran las células madre?","o":["Basal","Granuloso","Espinoso","Córneo"],"a":0,"e":"El estrato basal (germinativo) contiene las células que se dividen y los melanocitos."}],"intro":"El órgano más grande: epidermis (epitelio) + dermis (conectivo) + hipodermis."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
