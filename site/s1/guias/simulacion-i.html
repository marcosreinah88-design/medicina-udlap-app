<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio de Simulación I</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#c4142f; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="SIM I"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"simulacion-i","title":"Laboratorio de Simulación I","kicker":"Primer semestre · Simulación","desc":"Soporte vital básico (BLS) y atención prehospitalaria: seguridad de la escena, evaluación primaria, RCP de alta calidad, DEA, atragantamiento, posición de recuperación, control de hemorragias, inmovilización y traslado.","nota":"Temario según tu programa: BLS y atención extrahospitalaria (algoritmos de la AHA 2020 y PHTLS).","temas":[{"t":"Atención extrahospitalaria: escena y evaluación inicial","res":["<b>Seguridad de la escena<\/b>: tráfico, fuego, electricidad, gases, violencia, materiales peligrosos. Si no es segura, no entras: llamas y esperas a los servicios especializados.","<b>Bioseguridad<\/b>: guantes y protección ocular; mascarilla de bolsillo para ventilar.","<b>Impresión general<\/b> en segundos: ¿responde?, ¿respira?, ¿sangra mucho?, mecanismo de lesión.","<b>Activar el sistema de emergencias<\/b>: en México <b>911<\/b> (Cruz Roja 065 en algunas ciudades). Informar: dónde, qué pasó, cuántos pacientes, su estado y qué se está haciendo; no colgar primero.","Evaluación primaria <b>XABCDE<\/b> (trauma): <b>X<\/b> hemorragia exanguinante, <b>A<\/b> vía aérea con control de columna cervical, <b>B<\/b> ventilación, <b>C<\/b> circulación y control de sangrado, <b>D<\/b> déficit neurológico (AVDI o Glasgow), <b>E<\/b> exposición y prevención de hipotermia.","<b>AVDI<\/b>: Alerta, responde a la Voz, responde al Dolor, Inconsciente.","Evaluación secundaria (cuando el paciente está estable): <b>SAMPLE<\/b> → Signos y síntomas, Alergias, Medicamentos, Pasado médico, Última comida (Last meal), Eventos previos."],"hy":["Primero tu seguridad: un rescatista lesionado se convierte en otro paciente.","En trauma, la hemorragia exanguinante (X) se controla antes que la vía aérea."],"cl":["La <b>hora dorada<\/b> del trauma: la atención y traslado oportunos a un hospital adecuado reducen la mortalidad.","Una <b>llamada temprana al 911<\/b> es el primer eslabón para que llegue el desfibrilador y la ambulancia."],"cards":[{"f":"Primer paso al llegar a una emergencia","b":"Verificar que la escena sea segura."},{"f":"Significado de XABCDE","b":"Hemorragia exanguinante, vía aérea con control cervical, ventilación, circulación, déficit neurológico y exposición."},{"f":"Escala AVDI","b":"Alerta, responde a la voz, responde al dolor, inconsciente."},{"f":"Mnemotecnia SAMPLE","b":"Signos y síntomas, alergias, medicamentos, pasado médico, última comida y eventos previos."},{"f":"Número de emergencias en México","b":"911."}],"quiz":[{"q":"Llegas a un accidente de auto con cables eléctricos caídos sobre el vehículo. ¿Qué haces?","o":["Revisas pulso con guantes de látex","Mueves los cables con una rama seca","No te acercas, llamas al 911 y esperas a que aseguren la escena","Sacas al paciente rápido"],"a":2,"e":"Una escena insegura no se aborda; los guantes no protegen de la electricidad."},{"q":"Motociclista con sangrado arterial a chorro en el muslo y que habla. ¿Qué atiendes primero?","o":["El Glasgow (D)","La ventilación (B)","La vía aérea (A)","El sangrado (X)"],"a":3,"e":"En XABCDE la hemorragia exanguinante va antes de la vía aérea."}],"intro":"Antes de tocar al paciente: que la escena sea segura para ti, tu equipo y el paciente."},{"t":"Cadena de supervivencia y reconocimiento del paro","res":["<b>Cadena de supervivencia extrahospitalaria (AHA 2020)<\/b>: 1) activar el sistema de emergencias, 2) <b>RCP de alta calidad<\/b>, 3) <b>desfibrilación<\/b>, 4) reanimación avanzada, 5) cuidados posparo, 6) <b>recuperación<\/b>.","Reconocimiento: tocar los hombros y preguntar en voz alta \"¿se encuentra bien?\". Si no responde: pedir ayuda, que alguien llame al 911 y traiga un <b>DEA<\/b>.","Revisar <b>respiración y pulso carotídeo a la vez<\/b> en <b>5–10 segundos<\/b>. Las <b>respiraciones agónicas (jadeo/gasping)<\/b> NO son respiración normal.","Si hay pulso pero no respira normalmente: <b>ventilación de rescate<\/b> 1 cada <b>6 segundos<\/b> (10/min) y revisar pulso cada 2 minutos.","El público general sin entrenamiento: RCP <b>solo con las manos<\/b> (compresiones continuas) guiada por el operador del 911."],"hy":["Jadeo (gasping) = paro cardiaco: empezar RCP.","Máximo 10 segundos para revisar pulso; ante la duda, comprimir."],"cl":["La mayoría de los paros extrahospitalarios del adulto son de origen cardiaco con ritmo inicial de <b>fibrilación ventricular<\/b>: la desfibrilación temprana es lo que más salva vidas.","Cada minuto sin RCP ni desfibrilación baja la supervivencia ~7–10 %."],"cards":[{"f":"Eslabones de la cadena de supervivencia extrahospitalaria","b":"Activar emergencias, RCP de alta calidad, desfibrilación, soporte avanzado, cuidados posparo y recuperación."},{"f":"¿Las respiraciones agónicas cuentan como respiración?","b":"No: son un signo de paro cardiaco."},{"f":"Tiempo para revisar pulso y respiración","b":"5 a 10 segundos, al mismo tiempo."},{"f":"Ventilación de rescate (pulso presente, sin respiración)","b":"1 ventilación cada 6 segundos (10/min) en el adulto."}],"quiz":[{"q":"Adulto que no responde, con jadeos ocasionales y sin pulso palpable. Conducta:","o":["Dar solo ventilaciones","Esperar a que respire mejor","Colocarlo en posición de recuperación","Iniciar compresiones torácicas"],"a":3,"e":"El gasping no es respiración eficaz: es paro."},{"q":"Paciente sin respiración normal pero con pulso carotídeo claro. ¿Qué haces?","o":["Descarga con el DEA","Nada, tiene pulso","Compresiones 30:2","Ventilación de rescate: 1 cada 6 segundos y revisar pulso cada 2 min"],"a":3,"e":"Es un paro respiratorio; si pierde el pulso, inicias RCP."}],"intro":"Paro cardiaco = no responde, no respira normalmente (o solo jadea) y no tiene pulso."},{"t":"RCP de alta calidad en el adulto","res":["Posición: paciente boca arriba en superficie firme; talón de la mano en la <b>mitad inferior del esternón<\/b> (centro del pecho), la otra mano encima, brazos rectos, hombros sobre las manos.","<b>Frecuencia 100–120/min<\/b>, <b>profundidad 5–6 cm<\/b>, permitir la <b>expansión completa<\/b> del tórax, <b>minimizar interrupciones<\/b> (fracción de compresión &gt; 60 %, ideal &gt; 80 %), evitar ventilación excesiva.","<b>30:2<\/b> con uno o dos reanimadores en el adulto. Cada ventilación de <b>1 segundo<\/b> que eleve visiblemente el tórax.","Abrir la vía aérea: <b>inclinación de la cabeza y elevación del mentón<\/b>; si se sospecha lesión cervical, <b>tracción mandibular<\/b>.","Dispositivos: mascarilla de bolsillo; <b>bolsa-válvula-mascarilla (BVM)<\/b> con técnica <b>C-E<\/b> (dos reanimadores es lo ideal).","Cambiar al compresor cada <b>2 minutos<\/b> (5 ciclos) o antes si se cansa, en &lt; 5 segundos.","Con vía aérea avanzada: compresiones continuas y 1 ventilación cada 6 s."],"hy":["100–120/min, 5–6 cm, expansión completa, mínimas interrupciones: los cuatro pilares de la RCP de alta calidad.","En niños y lactantes con dos reanimadores la relación cambia a <b>15:2<\/b>."],"cl":["Fracturas costales durante la RCP son frecuentes y no son motivo para dejar de comprimir.","La ventilación excesiva aumenta la presión intratorácica y reduce el retorno venoso (y el gasto que generan las compresiones)."],"tabla":["Parámetro¦Adulto¦Niño (1 año–pubertad)¦Lactante (&lt; 1 año)","Profundidad¦5–6 cm¦≈ 5 cm (⅓ AP)¦≈ 4 cm (⅓ AP)","Relación (1 reanimador)¦30:2¦30:2¦30:2","Relación (2 reanimadores)¦30:2¦15:2¦15:2","Técnica¦Dos manos¦Una o dos manos¦Dos pulgares rodeando el tórax (o 2 dedos)","Pulso¦Carotídeo¦Carotídeo o femoral¦Braquial"],"cards":[{"f":"Sitio de las compresiones en el adulto","b":"Mitad inferior del esternón (centro del pecho)."},{"f":"Frecuencia y profundidad en el adulto","b":"100–120/min y 5–6 cm."},{"f":"Relación compresión:ventilación en lactante con dos reanimadores","b":"15:2."},{"f":"Maniobra para abrir la vía aérea con sospecha de lesión cervical","b":"Tracción mandibular."},{"f":"Pulso que se revisa en el lactante","b":"Braquial."},{"f":"Técnica de la bolsa-válvula-mascarilla","b":"Sello en C-E (pulgar e índice en \"C\" sobre la mascarilla; tres dedos en \"E\" en la mandíbula)."}],"quiz":[{"q":"¿Qué error reduce más la eficacia de la RCP?","o":["Comprimir 5.5 cm","Comprimir a 110/min","Rotar al compresor cada 2 minutos","Interrupciones largas de las compresiones"],"a":3,"e":"Cada pausa hace caer la presión de perfusión coronaria y tarda en recuperarse."},{"q":"RCP en lactante con dos reanimadores. Relación y técnica:","o":["5:1 con dos dedos","30:2 con el talón de la mano","15:2 con dos pulgares rodeando el tórax","15:2 con dos manos"],"a":2,"e":"Dos reanimadores en pediatría = 15:2; en lactantes, técnica de dos pulgares."}],"intro":"Compresiones fuertes, rápidas, con descompresión completa y sin pausas."},{"t":"Desfibrilador externo automático (DEA)","res":["Usarlo <b>en cuanto llegue<\/b>: encender → colocar parches en el pecho desnudo y seco (<b>anterolateral<\/b>: infraclavicular derecho y lateral izquierdo bajo la axila; o anteroposterior) → conectar → <b>\"nadie toque al paciente\"<\/b> durante el análisis → si indica, <b>descarga<\/b> con todos alejados → <b>reanudar RCP de inmediato<\/b> por 2 minutos (sin revisar pulso).","Ritmos desfibrilables: <b>fibrilación ventricular<\/b> y <b>taquicardia ventricular sin pulso<\/b>. No desfibrilables: <b>asistolia<\/b> y <b>actividad eléctrica sin pulso<\/b> (solo RCP).","Situaciones especiales: <b>pecho mojado<\/b> (secar), <b>mucho vello<\/b> (rasurar o retirar un parche para depilar), <b>marcapasos o desfibrilador implantado<\/b> (parche a ≥ 2.5 cm del dispositivo), <b>parches de medicamento<\/b> (retirar y limpiar), agua (sacar al paciente; la nieve o una superficie mojada pequeña no impiden).","Niños &lt; 8 años y lactantes: <b>parches pediátricos<\/b> o atenuador; si no hay, usar los de adulto (sin que se toquen, anteroposterior)."],"hy":["Tras la descarga: <b>compresiones de inmediato<\/b>, no revisar pulso.","Durante el análisis y la descarga nadie toca al paciente."],"cl":["Los <b>programas de acceso público a la desfibrilación<\/b> (DEA en aeropuertos, escuelas, estadios) aumentan la supervivencia del paro extrahospitalario."],"cards":[{"f":"Ritmos desfibrilables","b":"Fibrilación ventricular y taquicardia ventricular sin pulso."},{"f":"Qué hacer inmediatamente después de una descarga","b":"Reanudar compresiones por 2 minutos sin revisar pulso."},{"f":"Posición anterolateral de los parches","b":"Uno bajo la clavícula derecha y otro en el costado izquierdo bajo la axila."},{"f":"DEA en paciente con marcapasos","b":"Colocar el parche al menos 2.5 cm del dispositivo."},{"f":"DEA en lactante sin parches pediátricos","b":"Usar los de adulto en posición anteroposterior sin que se toquen."}],"quiz":[{"q":"El DEA indica \"descarga recomendada\". ¿Qué haces justo después de darla?","o":["Quitar los parches","Revisar pulso 10 segundos","Reiniciar compresiones de inmediato","Dar 2 ventilaciones y esperar"],"a":2,"e":"Reanudar RCP sin demora; el DEA volverá a analizar en 2 minutos."},{"q":"Paciente rescatado de una alberca con el pecho mojado. Antes de colocar los parches:","o":["Colocarlos sin secar","Sacarlo del agua y secar el pecho","No usar el DEA","Solo dar ventilaciones"],"a":1,"e":"El agua conduce la corriente y desvía la descarga."}],"intro":"Analiza el ritmo y descarga si encuentra uno desfibrilable."},{"t":"Obstrucción de la vía aérea por cuerpo extraño","res":["<b>Leve<\/b>: animar a toser, no golpear la espalda; vigilar.","<b>Grave en adulto o niño consciente<\/b>: <b>compresiones abdominales (maniobra de Heimlich)<\/b>: desde atrás, puño por arriba del ombligo y por debajo del xifoides, empujes hacia adentro y arriba hasta que salga el objeto o pierda la conciencia.","<b>Embarazadas avanzadas u obesos<\/b>: <b>compresiones torácicas<\/b> (mitad inferior del esternón).","<b>Lactante consciente<\/b>: <b>5 golpes en la espalda<\/b> (entre las escápulas, cabeza más baja que el tronco) alternados con <b>5 compresiones torácicas<\/b>; <b>nunca<\/b> compresiones abdominales.","<b>Si pierde la conciencia<\/b>: bajarlo al suelo, llamar al 911, <b>iniciar RCP<\/b> (empezando por compresiones); antes de ventilar, abrir la boca y <b>retirar el objeto solo si se ve<\/b> (no hacer barrido a ciegas)."],"hy":["Lactante: golpes en la espalda + compresiones torácicas; Heimlich solo en mayores de 1 año.","Nada de barrido digital a ciegas: puede empujar el objeto más adentro."],"cl":["Tras una maniobra de Heimlich exitosa el paciente debe ser valorado médicamente (riesgo de lesiones internas).","Causas típicas: carne en adultos (a menudo con alcohol o prótesis dental), uvas, salchichas, monedas y juguetes pequeños en niños."],"cards":[{"f":"Signo universal de asfixia","b":"Manos en el cuello sin poder hablar ni toser."},{"f":"Maniobra en adulto consciente con obstrucción grave","b":"Compresiones abdominales (Heimlich)."},{"f":"Maniobra en lactante consciente","b":"5 golpes en la espalda alternados con 5 compresiones torácicas."},{"f":"Maniobra en embarazada avanzada","b":"Compresiones torácicas."},{"f":"Si el paciente atragantado pierde la conciencia","b":"RCP comenzando por compresiones; retirar el objeto solo si se ve."}],"quiz":[{"q":"Adulto en un restaurante que se lleva las manos al cuello, no puede hablar ni toser. Conducta:","o":["Darle agua","Golpes en la espalda solamente","Compresiones abdominales hasta expulsar el objeto o que pierda la conciencia","Barrido digital a ciegas"],"a":2,"e":"Obstrucción grave en adulto consciente: Heimlich."},{"q":"Lactante de 8 meses consciente que no puede llorar ni toser tras meterse un objeto. Maniobra:","o":["Compresiones abdominales","Esperar a que tosa","Barrido digital","5 golpes en la espalda y 5 compresiones torácicas, alternando"],"a":3,"e":"En menores de 1 año no se hacen compresiones abdominales por riesgo de lesión hepática."}],"intro":"Obstrucción leve: tose y habla. Grave: no puede toser, hablar ni respirar (signo universal de asfixia)."},{"t":"Posición de recuperación y emergencias médicas frecuentes","res":["<b>Posición de recuperación (lateral de seguridad)<\/b>: de lado, cabeza ligeramente extendida, boca hacia abajo para drenar vómito; vigilar la respiración. No usar si se sospecha lesión de columna (salvo que la vía aérea esté en riesgo).","<b>Síncope<\/b>: acostar, elevar las piernas, aflojar ropa; si no recupera pronto la conciencia, evaluar como paro.","<b>Crisis convulsiva<\/b>: proteger la cabeza, retirar objetos, <b>no meter nada en la boca<\/b>, no sujetar; cronometrar; al terminar, posición de recuperación. Llamar al 911 si dura &gt; 5 min, se repite o es la primera.","<b>Hipoglucemia<\/b> en paciente consciente que puede tragar: <b>15–20 g de glucosa<\/b> oral (jugo, tabletas).","<b>Anafilaxia<\/b>: autoinyector de <b>adrenalina<\/b> IM en la cara anterolateral del muslo; repetir en 5–15 min si no mejora.","<b>Sospecha de infarto<\/b>: dar <b>ácido acetilsalicílico<\/b> 160–325 mg masticado si no es alérgico ni hay sangrado.","<b>Sospecha de evento vascular cerebral<\/b>: reconocer con <b>FAST<\/b> (Face/cara caída, Arm/brazo débil, Speech/habla alterada, Time/hora de inicio) y trasladar rápido.","<b>Sobredosis de opioides<\/b>: <b>naloxona<\/b> intranasal o IM si está disponible, además de RCP si no respira."],"hy":["Nunca meter objetos en la boca durante una convulsión.","FAST: anotar la <b>hora<\/b> en que se vio al paciente bien por última vez (define el tratamiento trombolítico)."],"cl":["El tiempo es cerebro: el EVC isquémico puede recibir trombólisis dentro de ventanas de pocas horas desde el inicio.","La adrenalina en anafilaxia no se retrasa por dudas: es el tratamiento de primera línea."],"cards":[{"f":"Posición para paciente inconsciente que respira y tiene pulso","b":"Posición lateral de seguridad (de recuperación)."},{"f":"Qué no hacer durante una convulsión","b":"Meter objetos en la boca o sujetar al paciente."},{"f":"Escala prehospitalaria para EVC","b":"FAST: cara, brazo, habla y tiempo."},{"f":"Primer fármaco en anafilaxia","b":"Adrenalina IM en el muslo anterolateral."},{"f":"Fármaco que se puede dar en sospecha de infarto","b":"Ácido acetilsalicílico masticado (si no hay contraindicación)."}],"quiz":[{"q":"Paciente con crisis convulsiva tónico-clónica de 2 minutos en la calle. ¿Qué haces?","o":["Sujetar brazos y piernas","Proteger la cabeza, retirar objetos y cronometrar","Introducir un objeto entre los dientes","Dar agua"],"a":1,"e":"Se protege de golpes; la mayoría de las crisis cede sola en &lt; 5 min."},{"q":"Señor con desviación de la comisura labial, debilidad de un brazo y habla arrastrada desde hace 30 minutos. Dato clave a reportar:","o":["Su tipo de sangre","La hora de inicio de los síntomas","Su última vacuna","Su peso exacto"],"a":1,"e":"La hora de inicio define si es candidato a trombólisis o trombectomía."}],"intro":"Paciente inconsciente que respira con pulso: proteger la vía aérea mientras llega la ayuda."},{"t":"Trauma prehospitalario: hemorragia, inmovilización y traslado","res":["<b>Control de hemorragias<\/b> (escalonado): <b>presión directa<\/b> firme → <b>empaquetamiento<\/b> de heridas profundas (unión de extremidad) → <b>torniquete<\/b> en extremidades si la presión no basta: 5–7 cm por arriba de la herida (no sobre articulación), apretar hasta que pare el sangrado y <b>anotar la hora<\/b>; no aflojarlo en campo.","<b>Choque<\/b>: piel pálida, fría, sudorosa, taquicardia, llenado capilar &gt; 2 s, ansiedad; acostar, controlar el sangrado, cubrir para evitar <b>hipotermia<\/b>.","<b>Restricción del movimiento de la columna<\/b>: indicada en mecanismo de riesgo con dolor cervical, déficit neurológico, alteración de conciencia, intoxicación o lesión distractora; <b>collarín cervical<\/b> y tabla/camilla de cuchara; <b>alineación manual<\/b> mientras tanto.","<b>Fracturas<\/b>: inmovilizar la articulación de arriba y la de abajo; revisar <b>pulso, sensibilidad y movilidad distal<\/b> antes y después de inmovilizar. Fractura expuesta: cubrir con gasa estéril húmeda, no reintroducir el hueso.","<b>Quemaduras<\/b>: enfriar con agua corriente a temperatura ambiente 20 min (no hielo), retirar anillos, cubrir con plástico limpio; regla de los 9 para la superficie.","<b>Triage de víctimas múltiples (START)<\/b>: <b>verde<\/b> (camina), <b>rojo<\/b> (FR &gt; 30, llenado capilar &gt; 2 s o no sigue órdenes), <b>amarillo<\/b> (no camina pero estable), <b>negro<\/b> (no respira tras abrir la vía aérea).","<b>Traslado<\/b>: comunicar al hospital receptor (edad, mecanismo, lesiones, signos vitales, tratamiento: formato <b>MIST<\/b> o SBAR) y elegir el hospital con la capacidad que el paciente necesita."],"hy":["Torniquete: alto y apretado, con la hora escrita; no se afloja en campo.","START: si camina → verde; si no respira tras abrir la vía aérea → negro."],"cl":["Las hemorragias en extremidades son la principal causa de muerte prevenible en trauma: un torniquete a tiempo salva vidas.","La <b>hipotermia<\/b> empeora la coagulopatía del trauma (tríada letal: hipotermia, acidosis y coagulopatía)."],"cards":[{"f":"Primer paso para controlar una hemorragia externa","b":"Presión directa firme."},{"f":"Dónde se coloca el torniquete","b":"5–7 cm por arriba de la herida, sin ponerlo sobre una articulación, y se anota la hora."},{"f":"Qué revisar antes y después de inmovilizar una fractura","b":"Pulso, sensibilidad y movilidad distales."},{"f":"Categoría START de quien camina","b":"Verde (leve)."},{"f":"Primer manejo de una quemadura térmica","b":"Enfriar con agua corriente a temperatura ambiente unos 20 minutos."},{"f":"Tríada letal del trauma","b":"Hipotermia, acidosis y coagulopatía."}],"quiz":[{"q":"Herida en el antebrazo que sigue sangrando abundantemente pese a presión directa firme. Siguiente paso:","o":["Elevar el brazo y esperar","Colocar un torniquete por arriba de la herida y anotar la hora","Aplicar hielo","Retirar la gasa para revisar"],"a":1,"e":"En extremidades, si la presión falla, el torniquete es el siguiente escalón."},{"q":"En un accidente masivo, un paciente no camina, respira 34 veces por minuto. Categoría START:","o":["Verde","Rojo (inmediato)","Amarillo","Negro"],"a":1,"e":"FR &gt; 30 clasifica como rojo."},{"q":"¿Cómo enfrías una quemadura térmica en campo?","o":["Agua corriente a temperatura ambiente unos 20 minutos","Pasta dental","Hielo directo","Mantequilla"],"a":0,"e":"El hielo produce más daño tisular e hipotermia."}],"intro":"Detener el sangrado, proteger la columna cuando está indicado y trasladar al lugar adecuado."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
