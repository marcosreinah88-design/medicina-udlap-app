<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio de Simulación I</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: temas divididos en subtemas con diagramas de flujo, cifras clave, conceptos para revelar,
   mnemotecnias, tablas con autoexamen, alto rendimiento, correlación clínica, mini-quiz por tema y progreso; tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#c4142f; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:22px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc .tg{margin-bottom:2px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.toc .tg.ok>a span{color:var(--ok)}
.toc .tg.ok>a span::before{content:"✓"}
.toc .tg.ok>a span i{display:none}
.toc .sl{display:none;margin:2px 0 6px 30px;border-left:2px solid var(--c-soft)}
.toc .tg.on .sl{display:block}
.toc .sl a{font-size:.82rem;padding:3px 10px;color:var(--muted)}
.toc .sl a:hover{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:20px}
.tools .pg{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0;font-size:.85rem;color:var(--muted)}
.tools .pg i{flex:1;height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;min-width:60px}
.tools .pg i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--hy));border-radius:9px;transition:width .4s}
.tools .pg strong{color:var(--ink);font-family:var(--f-m);font-weight:600}
.tg-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.tg-btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tg-btn:hover{border-color:var(--c)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:26px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.tema.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.thead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:start;padding:22px 24px 18px;background:linear-gradient(135deg,var(--c-soft),var(--paper) 70%);border-bottom:1px solid var(--line)}
.thead .bn{grid-row:span 3;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1.5rem var(--f-d);box-shadow:0 8px 18px -10px var(--c)}
.tema.ok .thead .bn{background:var(--ok)}
.tema .num{font:500 .72rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:2px 0 4px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0}
.schips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.schips a{font-size:.78rem;font-weight:600;text-decoration:none;color:var(--c-ink);background:var(--paper);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:999px;padding:3px 10px}
.schips a:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tbody{padding:8px 24px 20px}
details.sub{border-bottom:1px dashed var(--line);padding:6px 0}
details.sub:last-of-type{border-bottom:0}
details.sub>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0 6px}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary .sn{font:600 .8rem var(--f-m);color:#fff;background:var(--c);border-radius:7px;padding:2px 7px;flex:none}
details.sub>summary h3{margin:0;font:700 1.18rem/1.25 var(--f-d);flex:1}
details.sub>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 3px;transition:transform .2s}
details.sub:not([open])>summary::after{transform:rotate(-45deg)}
.sub .si{color:var(--muted);margin:0 0 6px;font-style:italic}
.sub ul{margin:6px 0;padding-left:1.15em}
.sub li{margin:5px 0}
.sub li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid}
.box h4{margin:0 0 4px;font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase}
.box ul{margin:0}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h4{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h4{color:var(--cl)}
.box h4::before{margin-right:6px}
.box.hy h4::before{content:"★"}
.box.cl h4::before{content:"✚"}
/* tabla con autoexamen */
.tblw{margin:12px 0}
.tblw .tbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--c-soft);font-weight:700}
tbody tr:hover td{background:color-mix(in srgb,var(--c) 6%,transparent)}
td:first-child{font-weight:600}
.tblw.quiz td:not(:first-child){cursor:pointer}
.tblw.quiz td:not(:first-child):not(.shown){color:transparent;background:repeating-linear-gradient(-45deg,var(--sunk) 0 6px,transparent 6px 12px)}
.tblw.quiz td:not(:first-child):not(.shown) *{color:transparent}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--c)}
.mini[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
/* diagrama de flujo */
.flow{margin:14px 0;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.flow .fh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flow .fh b{font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0;counter-reset:f}
.flow li{counter-increment:f;display:flex;align-items:center}
.flow li .st{position:relative;background:var(--paper);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:12px;padding:8px 12px 8px 36px;font-size:.88rem;line-height:1.35;max-width:240px;min-height:100%;display:flex;align-items:center;transition:opacity .25s,transform .25s}
.flow li .st::before{content:counter(f);position:absolute;left:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font:600 .7rem/20px var(--f-m);text-align:center}
.flow li+li::before{content:"→";flex:none;width:26px;text-align:center;color:var(--c);font:700 1.1rem/1 var(--f-b)}
.flow.step li.dim .st{opacity:.15;transform:scale(.97)}
.flow.step li.dim::before{opacity:.2}
.flow li.cur .st{box-shadow:0 0 0 3px color-mix(in srgb,var(--hy) 45%,transparent);border-color:var(--hy)}
@media (max-width:640px){.flow ol{flex-direction:column;align-items:stretch;gap:0}.flow li{flex-direction:column;align-items:stretch}.flow li+li::before{content:"↓";width:auto;text-align:left;padding:2px 0 2px 14px}.flow li .st{max-width:none}}
/* cifras clave */
.stats-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:linear-gradient(160deg,var(--c-soft),var(--paper));border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));border-radius:14px;padding:12px 14px}
.stat .v{display:block;font:700 1.5rem/1.1 var(--f-d);color:var(--c-ink)}
.stat .l{display:block;font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.35}
/* conceptos para revelar */
.terms{margin:14px 0}
.terms .th{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.terms .th b{font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.terms .tgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.term{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px;transition:border-color .2s,background .2s}
.term:hover{border-color:var(--c)}
.term .w{font:700 1.02rem/1.25 var(--f-d)}
.term .d{font-size:.86rem;line-height:1.4;color:var(--ink)}
.term .h{font:500 .68rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:auto}
.term[aria-expanded="false"] .d{display:none}
.term[aria-expanded="true"]{background:var(--c-soft);border-color:var(--c)}
.term[aria-expanded="true"] .h{display:none}
/* mnemotecnia */
.mn{margin:12px 0;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;border:2px dashed color-mix(in srgb,var(--hy) 55%,var(--line));background:color-mix(in srgb,var(--hy) 6%,var(--paper))}
.mn .mi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--hy);color:#fff;font:700 1rem var(--f-d)}
.mn b.mm{display:block;font:700 1.08rem/1.3 var(--f-d);color:var(--ink)}
.mn span{font-size:.88rem;color:var(--muted)}
/* palabras clave ocultas */
body.hidekw .sub li b:not(.shown),body.hidekw .sub td b:not(.shown){color:transparent;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 30%,transparent) 0 5px,color-mix(in srgb,var(--c) 14%,transparent) 5px 10px);border-radius:4px;cursor:pointer}
/* ponte a prueba */
.pp{margin:6px 24px 0;padding:16px 18px;border-radius:14px;background:var(--sunk)}
.pp h4{margin:0 0 10px;font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.pq+.pq{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pq p{margin:0 0 8px;font-weight:600}
.pq .po{display:grid;gap:6px}
.pq .po button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer;font-size:.92rem}
.pq .po button:hover:not(:disabled){border-color:var(--c)}
.pq .po button.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--paper))}
.pq .po button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.pq .po button:disabled{cursor:default}
.pq .pe{margin-top:8px;font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--cl-soft)}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 24px 22px}
.tfoot button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.tfoot button:hover{border-color:var(--c)}
.tfoot .dom{margin-left:auto;background:var(--paper);border-color:var(--ok);color:var(--ok)}
.tfoot .dom[aria-pressed="true"]{background:var(--ok);color:#fff}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:minmax(0,1fr)}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.toc .sl{display:none!important}.thead{padding:18px 16px 14px;gap:4px 12px}.thead .bn{width:42px;height:42px;font-size:1.2rem;border-radius:12px}.schips{grid-column:1/-1}.tbody{padding:4px 16px 16px}.pp{margin:6px 16px 0}.tfoot{padding:14px 16px 18px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v3: portada de la guía, mapa del temario, color por tema, buscador ===== */
.readbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;background:linear-gradient(90deg,var(--c),var(--hy));transition:width .1s linear}
header.hero{padding-bottom:34px}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(120deg,transparent 30%,#000 90%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000 90%)}
.hgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px 48px;align-items:center}
.sbox4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28)}
.sbox4 div{padding:10px 12px 9px;border-left:1px solid rgba(255,255,255,.28)}
.sbox4 div:first-child{border-left:0;padding-left:0}
.sbox4 small{display:block;font:500 .66rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.sbox4 b{display:block;font:600 1.7rem/1.15 var(--f-m)}
.hact{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.hact button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;cursor:pointer;transition:background .15s,transform .15s}
.hact button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.hact button.pri{background:#fff;color:color-mix(in srgb,var(--c) 80%,#000);border-color:#fff}
.hact button.pri:hover{background:#fff}

<script>
const GUIA={"id":"simulacion-i","title":"Laboratorio de Simulación I","kicker":"Primer semestre · Simulación","desc":"Soporte vital básico (BLS) y atención prehospitalaria: seguridad de la escena, evaluación primaria, RCP de alta calidad en adulto, niño y lactante, DEA, atragantamiento, emergencias médicas, control de hemorragias, inmovilización, triage y traslado.","nota":"Temario según tu programa: BLS y atención extrahospitalaria. Algoritmos de la AHA (guías 2020, con los cambios de la actualización 2025 marcados) y principios de PHTLS.","temas":[{"t":"Atención extrahospitalaria: la escena y el sistema de emergencias","subs":[{"t":"Seguridad de la escena y bioseguridad","b":[{"k":"ul","x":["<b>Riesgos a buscar<\/b>: tráfico, fuego, humo, electricidad, gases, agua, estructuras inestables, violencia y materiales peligrosos.","Si la escena <b>no es segura, no entras<\/b>: te alejas, llamas y esperas a los servicios especializados (bomberos, protección civil, policía).","<b>Bioseguridad<\/b>: guantes y protección ocular siempre; mascarilla de bolsillo o bolsa-válvula-mascarilla para ventilar.","<b>Impresión general<\/b> en segundos: ¿responde?, ¿respira?, ¿sangra mucho?, ¿cuál fue el mecanismo de lesión?, ¿cuántos pacientes hay?"]},{"k":"hy","x":["Primero tu seguridad: un rescatista lesionado se convierte en otro paciente."]}]},{"t":"Activar el sistema de emergencias médicas (SEM)","b":[{"k":"ul","x":["En México el número único de emergencias es el <b>911<\/b>."]},{"k":"fl","x":["Qué decir al llamar","Dónde estás (dirección y referencias)","Qué pasó","Cuántos pacientes y su estado","Qué estás haciendo","No colgar hasta que te lo indiquen"]},{"k":"ul","x":["El operador puede <b>guiar la RCP por teléfono<\/b> (RCP asistida por el operador): pon el teléfono en altavoz junto al paciente."]},{"k":"cl","x":["Una <b>llamada temprana<\/b> es el primer eslabón para que lleguen el desfibrilador y la ambulancia."]}]},{"t":"Signos vitales de referencia en el adulto","b":[{"k":"st","x":[{"v":"60–100 lpm","l":"frecuencia cardiaca en reposo"},{"v":"12–20 rpm","l":"frecuencia respiratoria"},{"v":"≥ 94 %","l":"saturación de oxígeno esperada"},{"v":"&lt; 2 s","l":"llenado capilar normal"},{"v":"36.5–37.5 °C","l":"temperatura corporal"},{"v":"15 / 15","l":"Glasgow de un paciente alerta y orientado"}]}]}],"cards":[{"f":"Primer paso al llegar a una emergencia","b":"Verificar que la escena sea segura."},{"f":"Número de emergencias en México","b":"911."},{"f":"Qué informar al 911","b":"Ubicación, qué pasó, número y estado de pacientes y lo que se está haciendo; no colgar primero."},{"f":"Llenado capilar normal","b":"Menor de 2 segundos."}],"quiz":[{"q":"Llegas a un accidente de auto con cables eléctricos caídos sobre el vehículo. ¿Qué haces?","o":["Revisas el pulso con guantes de látex","Mueves los cables con una rama seca","No te acercas, llamas al 911 y esperas a que aseguren la escena","Sacas al paciente rápido"],"a":2,"e":"Una escena insegura no se aborda; los guantes no protegen de la electricidad."},{"q":"Al llamar al 911, ¿cuál es el dato más importante para que llegue la ayuda?","o":["Su tipo de sangre","El nombre completo del paciente","La ubicación exacta con referencias","Sus antecedentes"],"a":2,"e":"Sin ubicación la ambulancia no puede llegar; lo demás se informa después."}],"intro":"Antes de tocar al paciente: que la escena sea segura para ti, tu equipo y el paciente."},{"t":"Evaluación del paciente: primaria y secundaria","subs":[{"t":"Evaluación primaria XABCDE (trauma)","b":[{"k":"fl","x":["XABCDE","X · hemorragia exanguinante","A · vía aérea con control de columna cervical","B · ventilación y respiración","C · circulación y control de sangrado","D · déficit neurológico","E · exposición y control de temperatura"]},{"k":"ul","x":["<b>X<\/b>: controlar primero el sangrado masivo de extremidades (presión directa o torniquete).","<b>A<\/b>: ¿habla? Si no, abrir la vía aérea con <b>tracción mandibular<\/b> si hay mecanismo de trauma; alinear manualmente la cabeza.","<b>B<\/b>: ver, oír y sentir; frecuencia, simetría del tórax, esfuerzo respiratorio.","<b>C<\/b>: pulso (radial, carotídeo), color, temperatura y humedad de la piel, llenado capilar.","<b>D<\/b>: nivel de conciencia con <b>AVDI<\/b> o <b>Glasgow<\/b>, pupilas.","<b>E<\/b>: exponer para buscar lesiones y luego <b>cubrir<\/b> para evitar la hipotermia."]},{"k":"hy","x":["En trauma, la hemorragia exanguinante (X) se controla antes que la vía aérea."]}]},{"t":"Nivel de conciencia","b":[{"k":"tm","x":[{"w":"AVDI","d":"Alerta, responde a la Voz, responde al Dolor, Inconsciente. Escala rápida prehospitalaria."},{"w":"Escala de Glasgow","d":"Apertura ocular (1–4), respuesta verbal (1–5) y respuesta motora (1–6); total de 3 a 15."},{"w":"Glasgow ≤ 8","d":"Coma: el paciente no protege su vía aérea; requiere manejo avanzado."}]},{"k":"mn","x":[{"m":"\"Ocho, intubo\"","s":"Un Glasgow de 8 o menos indica necesidad de asegurar la vía aérea."}]}]},{"t":"Evaluación secundaria (paciente estable)","b":[{"k":"ul","x":["Exploración de cabeza a pies y entrevista dirigida."]},{"k":"mn","x":[{"m":"SAMPLE","s":"Signos y síntomas · Alergias · Medicamentos · Pasado médico · Última comida (Last meal) · Eventos previos."},{"m":"OPQRST (para el dolor)","s":"Onset (inicio) · Provocación/alivio · Quality (calidad) · Radiación · Severidad (0–10) · Tiempo de evolución."}]},{"k":"cl","x":["La <b>hora dorada<\/b> del trauma: la atención y el traslado oportunos a un hospital adecuado reducen la mortalidad."]}]}],"cards":[{"f":"Significado de XABCDE","b":"Hemorragia exanguinante, vía aérea con control cervical, ventilación, circulación, déficit neurológico y exposición."},{"f":"Escala AVDI","b":"Alerta, responde a la voz, responde al dolor, inconsciente."},{"f":"Mnemotecnia SAMPLE","b":"Signos y síntomas, alergias, medicamentos, pasado médico, última comida y eventos previos."},{"f":"Componentes de la escala de Glasgow","b":"Ocular (1–4), verbal (1–5) y motora (1–6); de 3 a 15."},{"f":"Maniobra para abrir la vía aérea en trauma","b":"Tracción mandibular con alineación manual de la cabeza."}],"quiz":[{"q":"Motociclista con sangrado arterial a chorro en el muslo y que habla. ¿Qué atiendes primero?","o":["El Glasgow (D)","La ventilación (B)","La vía aérea (A)","El sangrado (X)"],"a":3,"e":"En XABCDE la hemorragia exanguinante va antes de la vía aérea."},{"q":"Paciente que solo abre los ojos y retira la mano al estímulo doloroso. En la escala AVDI es:","o":["D (responde al dolor)","V (responde a la voz)","I (inconsciente)","A (alerta)"],"a":0,"e":"Solo reacciona al dolor."},{"q":"¿Cuál es el puntaje mínimo de la escala de Glasgow?","o":["3","0","1","8"],"a":0,"e":"Cada componente vale al menos 1 punto."}],"intro":"Un orden fijo para no olvidar lo que mata primero."},{"t":"Paro cardiaco: reconocimiento y cadena de supervivencia","subs":[{"t":"Por qué cada minuto cuenta","b":[{"k":"ul","x":["El paro cardiaco súbito del adulto suele ser de <b>origen cardiaco<\/b>, con ritmo inicial de <b>fibrilación ventricular (FV)<\/b>: el corazón tiembla pero no bombea.","Sin flujo, el cerebro empieza a sufrir <b>daño irreversible a los 4–6 minutos<\/b>.","Las <b>compresiones<\/b> generan flujo hacia el cerebro y el corazón; la <b>desfibrilación<\/b> es lo que revierte la FV."]},{"k":"st","x":[{"v":"4–6 min","l":"sin perfusión para que empiece el daño cerebral irreversible"},{"v":"7–10 %","l":"cae la supervivencia por cada minuto sin RCP ni desfibrilación"}]},{"k":"cl","x":["Los <b>programas de acceso público a la desfibrilación<\/b> (DEA en aeropuertos, escuelas, estadios) aumentan la supervivencia del paro extrahospitalario."]}]},{"t":"Reconocimiento y primeros pasos","b":[{"k":"fl","x":["Algoritmo inicial (adulto)","Escena segura","Tocar los hombros y preguntar fuerte \"¿Se encuentra bien?\"","Pedir ayuda: que llamen al 911 y traigan un DEA","Revisar respiración y pulso carotídeo a la vez (5–10 s)","Sin pulso: iniciar RCP 30:2"]},{"k":"ul","x":["Las <b>respiraciones agónicas (jadeo o gasping)<\/b> NO son respiración normal: indican paro.","Si <b>hay pulso pero no respira normalmente<\/b>: ventilación de rescate, <b>1 cada 6 segundos<\/b> (10/min), y revisar pulso cada 2 minutos.","El público sin entrenamiento hace RCP <b>solo con las manos<\/b> (compresiones continuas) guiada por el operador del 911."]},{"k":"hy","x":["Jadeo (gasping) = paro cardiaco: empezar RCP.","Máximo 10 segundos para revisar el pulso; ante la duda, comprimir."]}]},{"t":"Cadena de supervivencia extrahospitalaria (AHA 2020)","b":[{"k":"fl","x":["Eslabones","Activar el sistema de emergencias","RCP de alta calidad","Desfibrilación","Reanimación avanzada","Cuidados posparo","Recuperación"]},{"k":"ul","x":["La <b>cadena intrahospitalaria<\/b> empieza antes: vigilancia y <b>prevención<\/b> del paro (equipos de respuesta rápida)."]}]}],"cards":[{"f":"Eslabones de la cadena de supervivencia extrahospitalaria","b":"Activar emergencias, RCP de alta calidad, desfibrilación, soporte avanzado, cuidados posparo y recuperación."},{"f":"¿Las respiraciones agónicas cuentan como respiración?","b":"No: son un signo de paro cardiaco."},{"f":"Tiempo para revisar pulso y respiración","b":"5 a 10 segundos, al mismo tiempo."},{"f":"Ventilación de rescate en el adulto (pulso presente, sin respiración)","b":"1 ventilación cada 6 segundos (10/min)."},{"f":"Ritmo inicial más frecuente del paro súbito del adulto","b":"Fibrilación ventricular."}],"quiz":[{"q":"Adulto que no responde, con jadeos ocasionales y sin pulso palpable. Conducta:","o":["Dar solo ventilaciones","Esperar a que respire mejor","Colocarlo en posición de recuperación","Iniciar compresiones torácicas"],"a":3,"e":"El gasping no es respiración eficaz: es paro."},{"q":"Paciente sin respiración normal pero con pulso carotídeo claro. ¿Qué haces?","o":["Descarga con el DEA","Nada, tiene pulso","Compresiones 30:2","Ventilación de rescate: 1 cada 6 segundos y revisar pulso cada 2 min"],"a":3,"e":"Es un paro respiratorio; si pierde el pulso, inicias RCP."},{"q":"¿Qué intervención revierte la fibrilación ventricular?","o":["La desfibrilación","La posición de recuperación","Las ventilaciones","El masaje del seno carotídeo"],"a":0,"e":"Las compresiones mantienen el flujo; la descarga eléctrica termina la FV."}],"intro":"Paro cardiaco = no responde, no respira normalmente (o solo jadea) y no tiene pulso."},{"t":"RCP de alta calidad en el adulto","subs":[{"t":"Técnica de las compresiones","b":[{"k":"ul","x":["Paciente boca arriba en <b>superficie firme<\/b>; tórax descubierto.","Talón de la mano en la <b>mitad inferior del esternón<\/b> (centro del pecho), la otra mano encima, brazos rectos y hombros sobre las manos."]},{"k":"st","x":[{"v":"100–120 / min","l":"frecuencia de compresiones"},{"v":"5–6 cm","l":"profundidad en el adulto"},{"v":"&gt; 80 %","l":"fracción de compresión ideal (mínimo 60 %)"},{"v":"&lt; 10 s","l":"pausa máxima para ventilar o analizar"}]},{"k":"ul","x":["Permitir la <b>expansión completa<\/b> del tórax entre compresiones (no apoyarse).","Cambiar al compresor cada <b>2 minutos<\/b> (5 ciclos) o antes si se cansa, en menos de 5 segundos."]},{"k":"hy","x":["Los cuatro pilares: 100–120/min, 5–6 cm, expansión completa y mínimas interrupciones; además, evitar ventilar en exceso."]}]},{"t":"Vía aérea y ventilación","b":[{"k":"ul","x":["Sin trauma: <b>inclinación de la cabeza y elevación del mentón<\/b>. Con sospecha de lesión cervical: <b>tracción mandibular<\/b>.","Cada ventilación dura <b>1 segundo<\/b> y debe <b>elevar visiblemente el tórax<\/b>.","<b>Bolsa-válvula-mascarilla (BVM)<\/b>: sello con la técnica <b>C-E<\/b>; lo ideal es usarla entre dos reanimadores."]},{"k":"tm","x":[{"w":"Técnica C-E","d":"Pulgar e índice forman una \"C\" sobre la mascarilla; los otros tres dedos forman una \"E\" que levanta la mandíbula."},{"w":"Relación 30:2","d":"30 compresiones y 2 ventilaciones en el adulto, con uno o dos reanimadores."},{"w":"Vía aérea avanzada","d":"Con tubo o dispositivo supraglótico: compresiones continuas y 1 ventilación cada 6 segundos."}]},{"k":"cl","x":["La <b>ventilación excesiva<\/b> aumenta la presión dentro del tórax, reduce el retorno venoso y el flujo que generan las compresiones; además infla el estómago (vómito y broncoaspiración)."]}]},{"t":"Errores frecuentes","b":[{"k":"ul","x":["Comprimir demasiado lento o poco profundo.","Apoyarse sobre el tórax (no deja que se expanda).","Pausas largas para revisar pulso, ventilar o cambiar de reanimador.","Manos en el lugar equivocado (xifoides o costillas)."]},{"k":"cl","x":["Las <b>fracturas costales<\/b> durante la RCP son frecuentes y no son motivo para dejar de comprimir."]}]}],"cards":[{"f":"Sitio de las compresiones en el adulto","b":"Mitad inferior del esternón (centro del pecho)."},{"f":"Frecuencia y profundidad en el adulto","b":"100–120/min y 5–6 cm."},{"f":"Duración de cada ventilación","b":"1 segundo, con elevación visible del tórax."},{"f":"Maniobra para abrir la vía aérea sin trauma","b":"Inclinación de la cabeza y elevación del mentón."},{"f":"Cada cuánto se rota al compresor","b":"Cada 2 minutos (5 ciclos de 30:2)."},{"f":"Técnica de la bolsa-válvula-mascarilla","b":"Sello en C-E."}],"quiz":[{"q":"¿Qué error reduce más la eficacia de la RCP?","o":["Comprimir 5.5 cm","Comprimir a 110/min","Rotar al compresor cada 2 minutos","Interrupciones largas de las compresiones"],"a":3,"e":"Cada pausa hace caer la presión de perfusión coronaria y tarda en recuperarse."},{"q":"¿Por qué se evita ventilar en exceso durante la RCP?","o":["Aumenta la presión intratorácica y reduce el retorno venoso","Porque descarga el DEA","Porque baja la frecuencia de compresiones a 140/min","Porque produce hipoglucemia"],"a":0,"e":"Menos retorno venoso = menos sangre que las compresiones pueden expulsar."},{"q":"Paciente con vía aérea avanzada durante la RCP. Ventilación correcta:","o":["1 cada 6 segundos con compresiones continuas","1 cada 15 compresiones","1 cada 2 segundos","2 ventilaciones cada 30 compresiones"],"a":0,"e":"Con vía aérea avanzada ya no se pausa para ventilar."}],"intro":"Compresiones fuertes, rápidas, con descompresión completa y sin pausas."},{"t":"Desfibrilador externo automático (DEA)","subs":[{"t":"Cómo se usa","b":[{"k":"fl","x":["Uso del DEA","Encender","Colocar los parches en el pecho desnudo y seco","Conectar","\"¡Nadie toque al paciente!\" mientras analiza","Descarga si la indica, con todos alejados","Reanudar RCP de inmediato por 2 minutos"]},{"k":"ul","x":["Posición <b>anterolateral<\/b>: un parche bajo la clavícula derecha y otro en el costado izquierdo bajo la axila. Alternativa: <b>anteroposterior<\/b>.","Usarlo <b>en cuanto llegue<\/b>; mientras tanto, RCP."]},{"k":"hy","x":["Tras la descarga: <b>compresiones de inmediato<\/b>, sin revisar pulso.","Durante el análisis y la descarga nadie toca al paciente."]}]},{"t":"Ritmos","b":[{"k":"tb","x":["Ritmo¦¿Desfibrilable?¦Qué hace el DEA","Fibrilación ventricular¦Sí¦Indica descarga","Taquicardia ventricular sin pulso¦Sí¦Indica descarga","Asistolia¦No¦\"Descarga no indicada\": continuar RCP","Actividad eléctrica sin pulso¦No¦\"Descarga no indicada\": continuar RCP"]}]},{"t":"Situaciones especiales","b":[{"k":"ul","x":["<b>Pecho mojado<\/b>: secar; sacar al paciente del agua (un piso húmedo o la nieve no lo impiden).","<b>Mucho vello<\/b>: rasurar o usar un juego de parches para depilar y luego otro nuevo.","<b>Marcapasos o desfibrilador implantado<\/b>: no poner el parche encima; separarlo.","<b>Parches de medicamento<\/b> (nitroglicerina, nicotina): retirarlos y limpiar.","<b>Niños menores de 8 años<\/b>: parches pediátricos o atenuador; si no hay, usar los de adulto sin que se toquen (anteroposterior)."]}]}],"cards":[{"f":"Ritmos desfibrilables","b":"Fibrilación ventricular y taquicardia ventricular sin pulso."},{"f":"Qué hacer inmediatamente después de una descarga","b":"Reanudar compresiones por 2 minutos sin revisar pulso."},{"f":"Posición anterolateral de los parches","b":"Uno bajo la clavícula derecha y otro en el costado izquierdo bajo la axila."},{"f":"DEA en paciente con marcapasos","b":"No poner el parche sobre el dispositivo."},{"f":"DEA en lactante sin parches pediátricos","b":"Usar los de adulto en posición anteroposterior sin que se toquen."}],"quiz":[{"q":"El DEA indica \"descarga recomendada\". ¿Qué haces justo después de darla?","o":["Quitar los parches","Revisar pulso 10 segundos","Reiniciar compresiones de inmediato","Dar 2 ventilaciones y esperar"],"a":2,"e":"Reanudar RCP sin demora; el DEA volverá a analizar en 2 minutos."},{"q":"Paciente rescatado de una alberca con el pecho mojado. Antes de colocar los parches:","o":["Colocarlos sin secar","Sacarlo del agua y secar el pecho","No usar el DEA","Solo dar ventilaciones"],"a":1,"e":"El agua conduce la corriente y desvía la descarga."},{"q":"El DEA dice \"descarga no indicada\" en un paciente sin pulso. ¿Qué ritmo puede tener?","o":["Taquicardia ventricular sin pulso","Ritmo sinusal normal con pulso","Fibrilación ventricular","Asistolia o actividad eléctrica sin pulso"],"a":3,"e":"Los ritmos no desfibrilables se tratan con RCP (y fármacos en el soporte avanzado)."}],"intro":"Analiza el ritmo y descarga solo si encuentra uno desfibrilable."},{"t":"BLS pediátrico: niño y lactante","subs":[{"t":"Diferencias clave con el adulto","b":[{"k":"ul","x":["<b>Lactante<\/b>: menor de 1 año. <b>Niño<\/b>: de 1 año a la pubertad.","Causa típica: <b>hipoxia<\/b> (asfixia, ahogamiento, infecciones respiratorias), no la FV.","Si la <b>FC es menor de 60 lpm con signos de mala perfusión<\/b> pese a ventilar: <b>iniciar compresiones<\/b>.","Ventilación de rescate en niños (con pulso): <b>1 cada 2–3 segundos<\/b> (20–30/min)."]},{"k":"tb","x":["Parámetro¦Adulto¦Niño (1 año a pubertad)¦Lactante (menor de 1 año)","Profundidad¦5–6 cm¦≈ 5 cm (1/3 del tórax)¦≈ 4 cm (1/3 del tórax)","Relación con 1 reanimador¦30:2¦30:2¦30:2","Relación con 2 reanimadores¦30:2¦15:2¦15:2","Técnica¦Dos manos¦Una o dos manos¦Dos pulgares rodeando el tórax","Pulso¦Carotídeo¦Carotídeo o femoral¦Braquial"]},{"k":"hy","x":["En niños y lactantes con <b>dos reanimadores<\/b> la relación cambia a <b>15:2<\/b>.","Actualización AHA 2025: en el lactante ya no se recomienda la técnica de dos dedos; se usa la de <b>dos pulgares<\/b> rodeando el tórax (o el talón de una mano)."]}]},{"t":"¿Llamo primero o hago RCP primero?","b":[{"k":"ul","x":["<b>Colapso súbito presenciado<\/b> (probable causa cardiaca): llamar al 911 y traer el DEA primero.","<b>Colapso no presenciado<\/b> y estás solo sin teléfono: <b>2 minutos de RCP<\/b> y luego ir a activar el SEM."]},{"k":"cl","x":["El ahogamiento y la asfixia son causas frecuentes de paro pediátrico: la ventilación temprana es esencial."]}]}],"cards":[{"f":"Edad del lactante en BLS","b":"Menor de 1 año."},{"f":"Relación compresión:ventilación en niño con dos reanimadores","b":"15:2."},{"f":"Pulso que se revisa en el lactante","b":"Braquial."},{"f":"Indicación de compresiones en un niño con pulso","b":"FC menor de 60 lpm con signos de mala perfusión pese a ventilar."},{"f":"Ventilación de rescate en el niño con pulso","b":"1 cada 2–3 segundos (20–30/min)."}],"quiz":[{"q":"RCP en lactante con dos reanimadores. Relación y técnica:","o":["5:1 con dos dedos","30:2 con el talón de la mano","15:2 con dos pulgares rodeando el tórax","15:2 con las dos manos"],"a":2,"e":"Dos reanimadores en pediatría = 15:2; en lactantes, técnica de dos pulgares."},{"q":"Encuentras sola a una niña de 4 años que no responde ni respira; nadie vio qué pasó y no tienes teléfono. Conducta:","o":["Solo ventilar 5 minutos","Esperar a que llegue alguien","Ir a llamar primero y regresar","2 minutos de RCP y luego activar el SEM"],"a":3,"e":"En el paro no presenciado del niño la causa suele ser hipóxica: RCP primero."},{"q":"Lactante con FC de 50 lpm, pálido y sin respuesta pese a ventilaciones adecuadas. Conducta:","o":["Colocarlo de lado","Seguir solo con ventilaciones","Esperar a que suba la frecuencia","Iniciar compresiones torácicas"],"a":3,"e":"FC &lt; 60 con mala perfusión se trata como paro."}],"intro":"En los niños el paro suele ser respiratorio: primero falla la ventilación y después el corazón."},{"t":"Obstrucción de la vía aérea por cuerpo extraño (OVACE)","subs":[{"t":"Reconocer la gravedad","b":[{"k":"tb","x":["Obstrucción¦Signos¦Qué hacer","Leve¦Tose con fuerza, puede hablar o llorar¦Animar a toser y vigilar; no golpear","Grave¦No tose ni habla, estridor, cianosis, manos al cuello¦Maniobras de desobstrucción inmediatas"]}]},{"t":"Adulto y niño consciente","b":[{"k":"ul","x":["<b>Compresiones abdominales (maniobra de Heimlich)<\/b>: desde atrás, puño por arriba del ombligo y por debajo del xifoides, empujes hacia adentro y arriba hasta que salga el objeto o pierda la conciencia.","<b>Embarazadas avanzadas u obesos<\/b>: <b>compresiones torácicas<\/b> en la mitad inferior del esternón."]},{"k":"hy","x":["Actualización AHA 2025: en adultos y niños se alternan <b>5 golpes en la espalda y 5 compresiones abdominales<\/b>."]}]},{"t":"Lactante consciente","b":[{"k":"fl","x":["Lactante que se ahoga","Boca abajo sobre tu antebrazo, cabeza más baja que el tronco","5 golpes en la espalda entre las escápulas","Voltear boca arriba","5 compresiones torácicas","Repetir hasta que salga el objeto o pierda la conciencia"]},{"k":"hy","x":["Lactante: golpes en la espalda + compresiones torácicas; <b>nunca<\/b> compresiones abdominales (riesgo de lesión del hígado)."]}]},{"t":"Si pierde la conciencia","b":[{"k":"ul","x":["Bajarlo al suelo, llamar al 911 e <b>iniciar RCP comenzando por compresiones<\/b>.","Antes de ventilar, abrir la boca y <b>retirar el objeto solo si se ve<\/b>."]},{"k":"hy","x":["Nada de barrido digital a ciegas: puede empujar el objeto más adentro."]},{"k":"cl","x":["Tras una desobstrucción exitosa, el paciente debe ser valorado médicamente (posibles lesiones internas).","Causas típicas: carne en adultos (a menudo con alcohol o prótesis dental); uvas, salchichas, cacahuates, monedas y juguetes pequeños en niños."]}]}],"cards":[{"f":"Signo universal de asfixia","b":"Manos en el cuello sin poder hablar ni toser."},{"f":"Maniobra en adulto consciente con obstrucción grave","b":"Compresiones abdominales (Heimlich); desde 2025 la AHA las alterna con golpes en la espalda."},{"f":"Maniobra en lactante consciente","b":"5 golpes en la espalda alternados con 5 compresiones torácicas."},{"f":"Maniobra en embarazada avanzada","b":"Compresiones torácicas."},{"f":"Si el paciente atragantado pierde la conciencia","b":"RCP comenzando por compresiones; retirar el objeto solo si se ve."}],"quiz":[{"q":"Adulto en un restaurante que se lleva las manos al cuello, no puede hablar ni toser. Conducta:","o":["Barrido digital a ciegas","Darle agua","Maniobras de desobstrucción (compresiones abdominales) hasta expulsar el objeto o que pierda la conciencia","Esperar a que tosa"],"a":2,"e":"Obstrucción grave en adulto consciente: desobstrucción inmediata."},{"q":"Lactante de 8 meses consciente que no puede llorar ni toser tras meterse un objeto. Maniobra:","o":["Compresiones abdominales","Esperar a que tosa","Barrido digital","5 golpes en la espalda y 5 compresiones torácicas, alternando"],"a":3,"e":"En menores de 1 año no se hacen compresiones abdominales."},{"q":"Adulto atragantado que tose con fuerza y puede hablar. Conducta:","o":["Compresiones abdominales","Golpes en la espalda","Animarlo a toser y vigilar","Iniciar RCP"],"a":2,"e":"Es una obstrucción leve: la tos es el mecanismo más eficaz."}],"intro":"Leve: tose y habla. Grave: no puede toser, hablar ni respirar (signo universal de asfixia)."},{"t":"Emergencias médicas frecuentes fuera del hospital","subs":[{"t":"Posición de recuperación","b":[{"k":"ul","x":["Para el paciente <b>inconsciente que respira y tiene pulso<\/b>: de lado, cabeza ligeramente extendida, boca hacia abajo para que drene el vómito; vigilar la respiración.","Evitarla si se sospecha lesión de columna, salvo que la vía aérea esté en riesgo."]}]},{"t":"Síncope y convulsiones","b":[{"k":"ul","x":["<b>Síncope<\/b>: acostar, elevar las piernas, aflojar la ropa; si no recupera pronto la conciencia, evaluar como paro.","<b>Crisis convulsiva<\/b>: proteger la cabeza, retirar objetos, <b>no meter nada en la boca<\/b>, no sujetar; cronometrar; al terminar, posición de recuperación.","Llamar al 911 si dura <b>más de 5 minutos<\/b>, se repite, es la primera o hay lesión o embarazo."]},{"k":"hy","x":["Nunca meter objetos en la boca durante una convulsión."]}]},{"t":"Hipoglucemia, anafilaxia y opioides","b":[{"k":"ul","x":["<b>Hipoglucemia<\/b> en paciente consciente que puede tragar: <b>15–20 g de glucosa<\/b> oral (tabletas, jugo, refresco regular); si está inconsciente, nada por la boca.","<b>Anafilaxia<\/b>: autoinyector de <b>adrenalina<\/b> IM en la cara anterolateral del muslo; si no mejora, una segunda dosis a los 5–15 minutos.","<b>Sobredosis de opioides<\/b> (pupilas puntiformes, respiración lenta): <b>naloxona<\/b> intranasal o IM si está disponible, además de ventilar o hacer RCP."]},{"k":"tm","x":[{"w":"Adrenalina IM","d":"Tratamiento de primera línea de la anafilaxia; no se retrasa por dudas."},{"w":"Naloxona","d":"Antagonista de los opioides; revierte la depresión respiratoria."}]}]},{"t":"Infarto y evento vascular cerebral","b":[{"k":"ul","x":["<b>Sospecha de infarto<\/b> (dolor opresivo, sudoración, náusea, irradiado a brazo o mandíbula): reposo, llamar al 911 y dar <b>ácido acetilsalicílico<\/b> masticado si no es alérgico ni hay sangrado.","<b>Sospecha de EVC<\/b>: reconocer con <b>FAST<\/b> y anotar la <b>hora<\/b> en que se vio bien por última vez."]},{"k":"mn","x":[{"m":"FAST","s":"Face (cara caída) · Arm (brazo débil) · Speech (habla alterada) · Time (hora de inicio y llamar ya)."}]},{"k":"cl","x":["El tiempo es cerebro: el EVC isquémico puede recibir trombólisis o trombectomía solo dentro de ventanas de pocas horas."]}]}],"cards":[{"f":"Posición para paciente inconsciente que respira y tiene pulso","b":"Posición lateral de seguridad (de recuperación)."},{"f":"Qué no hacer durante una convulsión","b":"Meter objetos en la boca o sujetar al paciente."},{"f":"Escala prehospitalaria para EVC","b":"FAST: cara, brazo, habla y tiempo."},{"f":"Primer fármaco en anafilaxia","b":"Adrenalina IM en el muslo anterolateral."},{"f":"Glucosa oral en hipoglucemia (consciente)","b":"15–20 g."},{"f":"Fármaco que se puede dar en sospecha de infarto","b":"Ácido acetilsalicílico masticado (si no hay contraindicación)."}],"quiz":[{"q":"Paciente con crisis convulsiva tónico-clónica de 2 minutos en la calle. ¿Qué haces?","o":["Sujetar brazos y piernas","Proteger la cabeza, retirar objetos y cronometrar","Introducir un objeto entre los dientes","Dar agua"],"a":1,"e":"Se protege de golpes; la mayoría de las crisis ceden solas en menos de 5 min."},{"q":"Señor con desviación de la comisura labial, debilidad de un brazo y habla arrastrada. Dato clave a reportar:","o":["Su tipo de sangre","Su peso exacto","Su última vacuna","La hora de inicio de los síntomas"],"a":3,"e":"La hora de inicio define si es candidato a trombólisis o trombectomía."},{"q":"Joven con urticaria, sibilancias e hipotensión tras una picadura de abeja. Primer tratamiento:","o":["Adrenalina IM en el muslo","Agua con azúcar","Posición de recuperación sin más","Antihistamínico oral y observar"],"a":0,"e":"Es anafilaxia: la adrenalina es la primera línea."}],"intro":"Reconocer pronto y actuar con lo que se tiene a la mano."},{"t":"Trauma prehospitalario: hemorragia, choque, columna y fracturas","subs":[{"t":"Control de hemorragias","b":[{"k":"fl","x":["Control escalonado","Presión directa firme","Empaquetar heridas profundas (unión de la extremidad, cuello)","Torniquete en extremidades si la presión no basta"]},{"k":"ul","x":["<b>Torniquete<\/b>: 5–7 cm por arriba de la herida (no sobre una articulación); apretar hasta que <b>pare el sangrado<\/b> y <b>anotar la hora<\/b>; no aflojarlo en campo."]},{"k":"hy","x":["Torniquete: alto y apretado, con la hora escrita; no se afloja en campo."]},{"k":"cl","x":["Las hemorragias de extremidades son la principal causa de muerte prevenible en trauma: un torniquete a tiempo salva vidas."]}]},{"t":"Choque","b":[{"k":"ul","x":["Signos: piel <b>pálida, fría y sudorosa<\/b>, taquicardia, llenado capilar &gt; 2 s, ansiedad o confusión; la hipotensión es un signo <b>tardío<\/b>.","Manejo básico: acostar, controlar el sangrado, oxígeno si se tiene, <b>cubrir para evitar la hipotermia<\/b> y trasladar rápido."]},{"k":"mn","x":[{"m":"Tríada letal del trauma","s":"Hipotermia · Acidosis · Coagulopatía (cada una empeora a las otras)."}]}]},{"t":"Restricción del movimiento de la columna","b":[{"k":"ul","x":["Indicada con mecanismo de riesgo y: dolor o deformidad cervical, déficit neurológico, alteración de la conciencia, intoxicación o lesión distractora.","<b>Alineación manual<\/b> de la cabeza → <b>collarín cervical<\/b> → camilla de cuchara o tabla para mover en bloque."]}]},{"t":"Fracturas y quemaduras","b":[{"k":"ul","x":["<b>Fracturas<\/b>: inmovilizar la articulación de arriba y la de abajo; revisar <b>pulso, sensibilidad y movilidad distal<\/b> antes y después.","<b>Fractura expuesta<\/b>: cubrir con gasa estéril húmeda; no reintroducir el hueso.","<b>Quemaduras<\/b>: enfriar con <b>agua corriente a temperatura ambiente unos 20 minutos<\/b> (no hielo), retirar anillos y ropa no adherida, cubrir con plástico limpio."]},{"k":"tm","x":[{"w":"Regla de los 9 (adulto)","d":"Cabeza 9 %, cada brazo 9 %, tórax y abdomen anterior 18 %, espalda 18 %, cada pierna 18 %, periné 1 %."},{"w":"Regla de la palma","d":"La palma del paciente (con los dedos) equivale a cerca del 1 % de su superficie corporal."}]}]}],"cards":[{"f":"Primer paso para controlar una hemorragia externa","b":"Presión directa firme."},{"f":"Dónde se coloca el torniquete","b":"5–7 cm por arriba de la herida, no sobre una articulación, y se anota la hora."},{"f":"Qué revisar antes y después de inmovilizar una fractura","b":"Pulso, sensibilidad y movilidad distales."},{"f":"Primer manejo de una quemadura térmica","b":"Enfriar con agua corriente a temperatura ambiente unos 20 minutos."},{"f":"Tríada letal del trauma","b":"Hipotermia, acidosis y coagulopatía."},{"f":"Signo tardío del choque","b":"La hipotensión."}],"quiz":[{"q":"Herida en el antebrazo que sigue sangrando abundantemente pese a presión directa firme. Siguiente paso:","o":["Elevar el brazo y esperar","Colocar un torniquete por arriba de la herida y anotar la hora","Aplicar hielo","Retirar la gasa para revisar"],"a":1,"e":"En extremidades, si la presión falla, el torniquete es el siguiente escalón."},{"q":"¿Cómo enfrías una quemadura térmica en campo?","o":["Agua corriente a temperatura ambiente unos 20 minutos","Pasta dental","Hielo directo","Mantequilla"],"a":0,"e":"El hielo produce más daño tisular e hipotermia."},{"q":"Paciente atropellado, pálido, frío, con FC de 125 y TA aún normal. Interpretación:","o":["Ansiedad sin importancia","Hipotermia aislada","Choque compensado: la hipotensión aparece tarde","Paciente estable"],"a":2,"e":"La taquicardia y la piel fría aparecen antes que la hipotensión."}],"intro":"Detener el sangrado, proteger la columna cuando está indicado y evitar la hipotermia."},{"t":"Incidentes con múltiples víctimas y traslado","subs":[{"t":"Triage START","b":[{"k":"fl","x":["START, en este orden","¿Camina? Sí: VERDE","¿Respira tras abrir la vía aérea? No: NEGRO","¿FR &gt; 30? Sí: ROJO","¿Sin pulso radial o llenado &gt; 2 s? Sí: ROJO","¿No obedece órdenes simples? Sí: ROJO","Pasó todo lo anterior: AMARILLO"]},{"k":"tb","x":["Color¦Prioridad¦Ejemplo","Rojo¦Inmediata¦FR &gt; 30, llenado capilar &gt; 2 s o no obedece órdenes","Amarillo¦Diferida¦No camina pero respira, perfunde y obedece","Verde¦Leve¦Camina por su propio pie","Negro¦Fallecido o sin posibilidad¦No respira tras abrir la vía aérea"]},{"k":"hy","x":["START: si camina → verde; si no respira tras abrir la vía aérea → negro."]}]},{"t":"Comunicación y traslado","b":[{"k":"ul","x":["Elegir el hospital con la <b>capacidad que el paciente necesita<\/b> (trauma, hemodinamia, EVC), no siempre el más cercano.","Comunicar al hospital receptor de forma estructurada."]},{"k":"mn","x":[{"m":"MIST","s":"Mecanismo · Injuries (lesiones) · Signos vitales · Tratamiento dado."},{"m":"SBAR","s":"Situación · Antecedentes (Background) · Evaluación (Assessment) · Recomendación."}]},{"k":"cl","x":["Una entrega estructurada reduce errores y pérdida de información en el cambio de turno o de equipo."]}]}],"cards":[{"f":"Categoría START de quien camina","b":"Verde (leve)."},{"f":"Categoría START de quien respira 34 por minuto","b":"Rojo (inmediato)."},{"f":"Formato MIST","b":"Mecanismo, lesiones, signos vitales y tratamiento."},{"f":"Qué significa SBAR","b":"Situación, antecedentes, evaluación y recomendación."}],"quiz":[{"q":"En un accidente masivo, un paciente no camina y respira 34 veces por minuto. Categoría START:","o":["Amarillo","Negro","Rojo (inmediato)","Verde"],"a":2,"e":"FR &gt; 30 clasifica como rojo."},{"q":"Víctima que no camina, respira 18/min, tiene pulso radial y obedece órdenes. Categoría START:","o":["Verde","Negro","Amarillo","Rojo"],"a":2,"e":"Respira, perfunde y obedece, pero no camina."},{"q":"Paciente con sospecha de infarto en una ciudad con dos hospitales: uno a 5 minutos sin hemodinamia y otro a 20 minutos con hemodinamia. ¿A dónde lo trasladas?","o":["Al que elija el familiar","Al más cercano siempre","Al que tiene hemodinamia","A casa"],"a":2,"e":"Se elige el hospital que puede dar el tratamiento definitivo."}],"intro":"Hacer el mayor bien para el mayor número de pacientes."}]};

<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"Temas"],[T.reduce((n,t)=>n+t.subs.filter(s=>s.t).length,0),"Subtemas"],[allC.length,"Tarjetas"],[allQ.length,"Preguntas"]].map(([n,l])=>`<div><small>${l}</small><b>${n}</b></div>`).join("");
$("#brand").textContent=GUIA.title;
const PAL=[["#c2410c","#fb8a5a"],["#6d28d9","#b69cff"],["#0f766e","#4fd1c0"],["#b45309","#f2b14c"],["#be123c","#ff7c98"],["#1d4ed8","#7aa7ff"],["#15803d","#6edb8f"],["#a21caf","#ec8cf6"],["#0e7490","#5cc9e6"],["#9a3412","#ff9f6e"],["#4d7c0f","#a7d65a"],["#7c3aed","#c4a8ff"]];
const tcol=i=>`--tc:${PAL[i%PAL.length][0]};--tcd:${PAL[i%PAL.length][1]}`;
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
const LSD="s12-dominado-"+GUIA.id;let dom=new Set();try{dom=new Set(JSON.parse(localStorage.getItem(LSD)||"[]"))}catch(e){}
const saveDom=()=>{try{localStorage.setItem(LSD,JSON.stringify([...dom]))}catch(e){}};
const named=t=>t.subs.filter(s=>s.t);
$("#toc").innerHTML=T.map((t,i)=>`<div class="tg" data-i="${i}"><a href="#t${i+1}"><span><i>${String(i+1).padStart(2,"0")}</i></span>${esc(t.t)}</a>${named(t).length?`<div class="sl">${named(t).map((s,j)=>`<a href="#t${i+1}-${j+1}">${s.t}</a>`).join("")}</div>`:""}</div>`).join("");
const list=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const R={
 ul:x=>list(x),
 hy:x=>`<div class="box hy"><h4>Alto rendimiento para examen</h4>${list(x)}</div>`,
 cl:x=>`<div class="box cl"><h4>Correlación clínica</h4>${list(x)}</div>`,
 tb:x=>{const rows=x.map(r=>r.split("¦"));return `<div class="tblw"><div class="tbar"><button class="mini" type="button" data-tq aria-pressed="false">Ponme a prueba con la tabla</button></div><div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`},
 fl:x=>`<div class="flow"><div class="fh"><b>${x[0]||"Secuencia"}</b><button class="mini" type="button" data-fl>Paso a paso ▶</button></div><ol>${x.slice(1).map(p=>`<li><div class="st">${p}</div></li>`).join("")}</ol></div>`,
 st:x=>`<div class="stats-g">${x.map(o=>`<div class="stat"><span class="v">${o.v}</span><span class="l">${o.l}</span></div>`).join("")}</div>`,
 tm:x=>`<div class="terms"><div class="th"><b>Conceptos clave · toca para revelar</b><button class="mini" type="button" data-tm>Mostrar todos</button></div><div class="tgr">${x.map(o=>`<button class="term" type="button" aria-expanded="false"><span class="w">${o.w}</span><span class="d">${o.d}</span><span class="h">¿Qué es? →</span></button>`).join("")}</div></div>`,
 mn:x=>x.map(o=>`<div class="mn"><div class="mi">M</div><div><b class="mm">${o.m}</b><span>${o.s}</span></div></div>`).join("")
};
const ppQ=(q,i,k)=>`<div class="pq" data-a="${q.a}"><p>${q.q}</p><div class="po">${q.o.map((o,n)=>`<button type="button" data-n="${n}">${o}</button>`).join("")}</div><div class="pe" hidden>${q.e||""}</div></div>`;
const KD={fl:"Diagrama",tb:"Tabla",tm:"Conceptos",mn:"Mnemotecnia",st:"Cifras"};
const kinds=s=>[...new Set(s.b.map(b=>b.k))].filter(k=>KD[k]).map(k=>`<i>${KD[k]}</i>`).join("");
$("#mapaN").textContent=`${T.length} temas · toca uno para ir`;
$("#mgrid").innerHTML=T.map((t,i)=>`<a class="mc${dom.has(i)?" ok":""}" href="#t${i+1}" data-i="${i}" style="${tcol(i)}"><span class="n">${i+1}</span><b>${esc(t.t)}</b><small>${named(t).length} subtemas · ${(t.quiz||[]).length} preguntas</small><span class="ck" aria-label="${dom.has(i)?"dominado":"pendiente"}"></span></a>`).join("");
$("#temas").innerHTML=T.map((t,i)=>{let j=0;const ns=named(t);return `<article class="tema${dom.has(i)?" ok":""}" id="t${i+1}" data-i="${i}" style="${tcol(i)}">
 <div class="thead"><div class="bn">${i+1}</div><span class="num">Tema ${i+1} de ${T.length}${ns.length?` · ${ns.length} subtemas`:""}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
 ${ns.length?`<div class="schips">${ns.map((s,k)=>`<a href="#t${i+1}-${k+1}">${i+1}.${k+1} ${s.t}</a>`).join("")}</div>`:""}</div>
 <div class="tbody">${t.subs.map(s=>{const body=(s.i?`<p class="si">${s.i}</p>`:"")+s.b.map(b=>R[b.k](b.x)).join("");if(!s.t)return `<div class="sub lead">${body}</div>`;j++;return `<details class="sub" open id="t${i+1}-${j}"><summary><span class="sn">${i+1}.${j}</span><h3>${s.t}</h3><span class="kd">${kinds(s)}</span></summary>${body}</details>`}).join("")}</div>
 ${(t.quiz||[]).length?`<div class="pp"><h4>Ponte a prueba</h4>${t.quiz.slice(0,2).map((q,k)=>ppQ(q,i,k)).join("")}</div>`:""}
 <div class="tfoot">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">Examen del tema (${t.quiz.length})</button>`:""}<button type="button" class="dom" data-d="${i}" aria-pressed="${dom.has(i)}">${dom.has(i)?"✓ Dominado":"Marcar como dominado"}</button></div>
</article>`}).join("");
const LSE="s12-examen-"+GUIA.id;
function prog(){const n=dom.size,p=Math.round(n/T.length*100);$("#pgBar").style.width=p+"%";$("#pgTxt").textContent=n+" / "+T.length;document.querySelectorAll(".toc .tg").forEach(g=>g.classList.toggle("ok",dom.has(+g.dataset.i)));
 document.querySelectorAll(".mc").forEach(m=>m.classList.toggle("ok",dom.has(+m.dataset.i)));
 $("#ringV").classList.toggle("z",!p);$("#ringV").setAttribute("stroke-dasharray",`${(p/100*263.9).toFixed(1)} 264`);$("#ringN").textContent=p+"%";$("#ringT").textContent=`${n} de ${T.length} temas dominados`;
 const nx=T.findIndex((t,i)=>!dom.has(i));$("#nextT").innerHTML=nx<0?`<small>¡Terminaste!</small><b>Haz un examen de toda la materia →</b>`:`<small>${n?"Sigue con":"Empieza por"}</small><b>${nx+1}. ${esc(T[nx].t)} →</b>`;$("#nextT").setAttribute("href",nx<0?"#":"#t"+(nx+1));$("#nextT").dataset.nx=nx;
 let le=null;try{le=JSON.parse(localStorage.getItem(LSE)||"null")}catch(e){}$("#lastEx").textContent=le?`Último examen: ${le.p}% (${le.g} de ${le.n})`:"Aún no haces un examen de esta materia."}
prog();
$("#nextT").addEventListener("click",e=>{if(+e.currentTarget.dataset.nx<0){e.preventDefault();$("#qSel").value="all";tab("examen")}});
document.querySelectorAll(".hact button").forEach(b=>b.addEventListener("click",()=>{tab(b.dataset.go);if(b.dataset.go==="estudiar"){const m=$("#mapa");window.scrollTo({top:m.getBoundingClientRect().top+scrollY-70,behavior:"smooth"})}}));
/* lectura y volver arriba */
const onScroll=()=>{const h=document.documentElement,max=h.scrollHeight-h.clientHeight;$("#readbar").style.width=(max>0?scrollY/max*100:0)+"%";$("#totop").classList.toggle("on",scrollY>900)};
addEventListener("scroll",onScroll,{passive:true});onScroll();
$("#totop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
/* buscador */
const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const subsEl=[...document.querySelectorAll("#temas .sub")];subsEl.forEach(d=>d.dataset.tx=norm(d.textContent));
let fT;$("#find").addEventListener("input",e=>{clearTimeout(fT);fT=setTimeout(()=>{const q=norm(e.target.value.trim());let hits=0;
 document.querySelectorAll("#temas .tema").forEach(a=>{let any=false;a.querySelectorAll(".sub").forEach(d=>{const ok=!q||q.length<2||d.dataset.tx.includes(q);d.hidden=!ok;if(ok&&q.length>=2){any=true;hits++;if(d.tagName==="DETAILS")d.open=true}});a.hidden=q.length>=2&&!any;a.querySelectorAll(".pp,.tfoot").forEach(x=>x.hidden=q.length>=2)});
 $("#mapa").hidden=q.length>=2;$("#findN").textContent=q.length>=2?`${hits} ${hits===1?"subtema":"subtemas"}`:"";$("#nores").hidden=!(q.length>=2&&!hits)},150)});
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const i=e.target.dataset.i;document.querySelectorAll(".toc .tg").forEach(g=>{const on=g.dataset.i===i;g.classList.toggle("on",on);g.firstElementChild.classList.toggle("on",on)})}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
$("#kwBtn").addEventListener("click",e=>{const on=!document.body.classList.contains("hidekw");document.body.classList.toggle("hidekw",on);e.currentTarget.setAttribute("aria-pressed",on);document.querySelectorAll(".sub b.shown").forEach(b=>b.classList.remove("shown"))});
$("#foldBtn").addEventListener("click",e=>{const fold=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",fold);e.currentTarget.textContent=fold?"Expandir subtemas":"Contraer subtemas";document.querySelectorAll("details.sub").forEach(d=>d.open=!fold)});
document.querySelectorAll('.toc a[href*="-"],.schips a').forEach(a=>a.addEventListener("click",()=>{const d=document.querySelector(a.getAttribute("href"));if(d&&d.tagName==="DETAILS")d.open=true}));
$("#temas").addEventListener("click",e=>{
 const kw=e.target.closest("b");if(kw&&document.body.classList.contains("hidekw")&&kw.closest(".sub")&&!kw.closest("summary")){kw.classList.add("shown");return}
 const td=e.target.closest(".tblw.quiz td");if(td){td.classList.toggle("shown");return}
 const term=e.target.closest(".term");if(term){term.setAttribute("aria-expanded",term.getAttribute("aria-expanded")!=="true");return}
 const b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-tq")){const w=b.closest(".tblw"),on=!w.classList.contains("quiz");w.classList.toggle("quiz",on);b.setAttribute("aria-pressed",on);b.textContent=on?"Mostrar la tabla":"Ponme a prueba con la tabla";w.querySelectorAll("td.shown").forEach(x=>x.classList.remove("shown"));return}
 if(b.hasAttribute("data-tm")){const g=b.closest(".terms"),all=[...g.querySelectorAll(".term")],open=all.some(x=>x.getAttribute("aria-expanded")!=="true");all.forEach(x=>x.setAttribute("aria-expanded",open));b.textContent=open?"Ocultar todos":"Mostrar todos";return}
 if(b.hasAttribute("data-fl")){const f=b.closest(".flow"),li=[...f.querySelectorAll("li")];
   if(!f.classList.contains("step")){f.classList.add("step");f.dataset.k=0}else f.dataset.k=+f.dataset.k+1;
   const k=+f.dataset.k;if(k>=li.length){f.classList.remove("step");li.forEach(x=>x.classList.remove("dim","cur"));b.textContent="Paso a paso ▶";return}
   li.forEach((x,n)=>{x.classList.toggle("dim",n>k);x.classList.toggle("cur",n===k)});b.textContent=k+1<li.length?`Siguiente (${k+1}/${li.length}) ▶`:"Ver todo ✓";return}
 if(b.parentElement.classList.contains("po")){const q=b.closest(".pq"),a=+q.dataset.a,ok=+b.dataset.n===a;q.querySelectorAll(".po button").forEach(x=>{x.disabled=true;if(+x.dataset.n===a)x.classList.add("good")});if(!ok)b.classList.add("wrong");const pe=q.querySelector(".pe");pe.hidden=false;pe.innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+pe.innerHTML;return}
 if(b.dataset.d!==undefined){const i=+b.dataset.d,on=!dom.has(i);on?dom.add(i):dom.delete(i);saveDom();b.setAttribute("aria-pressed",on);b.textContent=on?"✓ Dominado":"Marcar como dominado";b.closest(".tema").classList.toggle("ok",on);prog();return}
 if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}
});
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  try{localStorage.setItem(LSE,JSON.stringify({p,g:good,n:Q.length}))}catch(e){}prog();
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
