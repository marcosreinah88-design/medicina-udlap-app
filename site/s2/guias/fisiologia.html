<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fisiología</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#c2410c; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="FIS"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"fisiologia","title":"Fisiología","kicker":"Segundo semestre · Fisiología","desc":"Los mecanismos que más se preguntan: potenciales, ciclo cardiaco, Frank-Starling, ventilación-perfusión, filtración glomerular y ejes hormonales, siempre con su traducción clínica.","nota":"","temas":[{"t":"Membrana, transporte y potencial de reposo","res":["Transporte <b>pasivo<\/b>: difusión simple (O₂, CO₂, lípidos), difusión facilitada por canales o transportadores (GLUT), ósmosis (acuaporinas). <b>Activo primario<\/b>: usa ATP (Na⁺/K⁺-ATPasa, Ca²⁺-ATPasa, H⁺/K⁺-ATPasa). <b>Activo secundario<\/b>: usa el gradiente de Na⁺ (SGLT, intercambiador Na⁺/Ca²⁺).","<b>Na⁺/K⁺-ATPasa<\/b>: saca 3 Na⁺ y mete 2 K⁺ por ATP (electrogénica); la inhibe la <b>digoxina<\/b>.","Concentraciones: K⁺ intracelular ~140 mM / extracelular ~4 mM; Na⁺ intracelular ~12 mM / extracelular ~140 mM; Ca²⁺ intracelular ~0.0001 mM.","<b>Ecuación de Nernst<\/b>: potencial de equilibrio de un ion (E_K ≈ −90 mV; E_Na ≈ +65 mV; E_Ca ≈ +120 mV). <b>Goldman-Hodgkin-Katz<\/b>: potencial de membrana según la permeabilidad de todos los iones.","Potencial de reposo neuronal ≈ <b>−70 mV<\/b> (muscular ≈ −90 mV), cercano a E_K porque en reposo la membrana es más permeable al K⁺."],"hy":["<b>Hiperpotasemia<\/b> despolariza el potencial de reposo (lo acerca a 0) → inactiva canales de Na⁺ → arritmias; <b>hipopotasemia<\/b> lo hiperpolariza.","Ósmosis: el agua va hacia donde hay más osmolalidad; osmolalidad plasmática ≈ 2 Na⁺ + glucosa/18 + BUN/2.8 ≈ 285–295 mOsm/kg."],"cl":["La <b>digoxina<\/b> inhibe la Na⁺/K⁺-ATPasa → ↑ Na⁺ intracelular → menos salida de Ca²⁺ por el intercambiador → ↑ contractilidad; la hipopotasemia aumenta su toxicidad.","En hiperpotasemia se da <b>gluconato de calcio<\/b> para estabilizar la membrana, y luego insulina con glucosa para meter K⁺ a la célula."],"cards":[{"f":"Estequiometría de la Na⁺/K⁺-ATPasa","b":"Saca 3 Na⁺ y mete 2 K⁺ por cada ATP."},{"f":"Ion que determina principalmente el potencial de reposo","b":"Potasio (K⁺)."},{"f":"Potencial de equilibrio del K⁺","b":"≈ −90 mV."},{"f":"Ejemplo de transporte activo secundario","b":"Cotransportador Na⁺-glucosa (SGLT) o intercambiador Na⁺/Ca²⁺."},{"f":"Fórmula de la osmolalidad plasmática calculada","b":"2 × Na⁺ + glucosa/18 + BUN/2.8."}],"quiz":[{"q":"¿Qué ocurre con el potencial de reposo en la hiperpotasemia?","o":["Se despolariza (se vuelve menos negativo)","No cambia","Se invierte a +30 mV","Se hiperpolariza"],"a":0,"e":"Al bajar el gradiente de K⁺, sale menos K⁺ y la membrana queda más cerca de cero."},{"q":"La digoxina aumenta la contractilidad porque:","o":["Activa los receptores β1","Abre canales de Ca²⁺ tipo L","Inhibe la Na⁺/K⁺-ATPasa y eleva el Ca²⁺ intracelular","Inhibe la fosfodiesterasa"],"a":2,"e":"El Na⁺ intracelular alto frena el intercambiador Na⁺/Ca²⁺."},{"q":"Paciente con Na⁺ 140, glucosa 180 mg/dL y BUN 28 mg/dL. Osmolalidad calculada:","o":["≈ 348 mOsm/kg","≈ 140 mOsm/kg","≈ 300 mOsm/kg","≈ 280 mOsm/kg"],"a":2,"e":"2(140) + 180/18 + 28/2.8 = 280 + 10 + 10 = 300."}],"intro":"El potencial de reposo depende sobre todo del K⁺ y lo mantiene la bomba Na⁺/K⁺-ATPasa."},{"t":"Potencial de acción y sinapsis","res":["Fases: estímulo → <b>umbral (~−55 mV)<\/b> → apertura de canales de <b>Na⁺ dependientes de voltaje<\/b> (despolarización, pico ~+30 mV) → inactivación de Na⁺ + apertura de <b>K⁺<\/b> (repolarización) → <b>hiperpolarización<\/b> posterior → reposo.","<b>Periodo refractario absoluto<\/b> (canales de Na⁺ inactivados: no hay nuevo PA) y <b>relativo<\/b> (se necesita estímulo mayor).","Velocidad de conducción aumenta con <b>mielina<\/b> y <b>mayor diámetro<\/b> del axón.","<b>Sinapsis química<\/b>: PA en la terminal → apertura de canales de <b>Ca²⁺<\/b> → exocitosis de neurotransmisor (SNARE) → receptores postsinápticos: <b>ionotrópicos<\/b> (rápidos) o <b>metabotrópicos<\/b> (proteína G).","Potencial postsináptico <b>excitador<\/b> (PEPS; glutamato, entrada de Na⁺) e <b>inhibidor<\/b> (PIPS; GABA y glicina, entrada de Cl⁻). Sumación temporal y espacial."],"hy":["Tetrodotoxina (pez globo) y anestésicos locales (lidocaína) bloquean los canales de Na⁺ → no hay potencial de acción.","La liberación del neurotransmisor depende de la entrada de <b>Ca²⁺<\/b> en la terminal presináptica."],"cl":["<b>Anestésicos locales<\/b>: bloquean primero las fibras delgadas (dolor y temperatura), después tacto y al final motoras.","<b>Benzodiacepinas<\/b> potencian al receptor GABA-A (más frecuencia de apertura del canal de Cl⁻); los barbitúricos aumentan la duración."],"cards":[{"f":"Ion responsable de la despolarización","b":"Entrada de Na⁺ por canales dependientes de voltaje."},{"f":"Ion que dispara la liberación del neurotransmisor","b":"Ca²⁺ que entra a la terminal presináptica."},{"f":"Neurotransmisor inhibidor principal del cerebro","b":"GABA (en la médula también glicina)."},{"f":"Factores que aumentan la velocidad de conducción","b":"Mielinización y mayor diámetro del axón."},{"f":"Periodo refractario absoluto","b":"Lapso en que los canales de Na⁺ están inactivados y ningún estímulo genera otro PA."}],"quiz":[{"q":"La lidocaína produce anestesia porque:","o":["Bloquea canales de Na⁺ dependientes de voltaje","Inhibe la acetilcolinesterasa","Abre canales de K⁺","Bloquea receptores de glutamato"],"a":0,"e":"Sin corriente de Na⁺ no se genera ni propaga el potencial de acción."},{"q":"¿Qué se pierde primero con un anestésico local?","o":["Propiocepción","Fuerza motora","Tacto discriminativo","Dolor y temperatura"],"a":3,"e":"Las fibras pequeñas (Aδ y C) son las más sensibles al bloqueo."}],"intro":"Señal todo o nada: entrada de Na⁺ (despolarización) y salida de K⁺ (repolarización)."},{"t":"Fisiología muscular","res":["<b>Esquelético<\/b>: PA → túbulo T → receptor de dihidropiridina (sensor) → <b>receptor de rianodina<\/b> libera Ca²⁺ del retículo sarcoplásmico → Ca²⁺ se une a <b>troponina C<\/b> → tropomiosina se desplaza → miosina une actina (puente cruzado). El <b>ATP<\/b> se requiere para <b>soltar<\/b> la miosina de la actina y para recaptar Ca²⁺ (SERCA).","<b>Cardiaco<\/b>: el Ca²⁺ que entra por canales tipo L dispara la liberación de Ca²⁺ del retículo (\"liberación de Ca²⁺ inducida por Ca²⁺\").","<b>Liso<\/b>: Ca²⁺ + <b>calmodulina<\/b> → activa la <b>cinasa de la cadena ligera de miosina (MLCK)<\/b> → contracción; la fosfatasa de miosina relaja. El NO (vía GMPc) relaja.","Relación <b>longitud-tensión<\/b>: hay una longitud óptima de sarcómero con máxima superposición útil de filamentos.","Sumación y <b>tetania<\/b> en el esquelético (no ocurre en el cardiaco por su periodo refractario largo)."],"hy":["<b>Rigor mortis<\/b>: sin ATP la miosina queda unida a la actina.","El miocardio no puede tetanizarse: su periodo refractario dura casi toda la contracción."],"cl":["<b>Nitratos<\/b> y sildenafil aumentan GMPc en el músculo liso vascular → vasodilatación (combinados causan hipotensión grave).","<b>Bloqueadores de canales de Ca²⁺<\/b> (amlodipino, verapamilo) relajan el músculo liso vascular y reducen la contractilidad cardiaca (los no dihidropiridínicos)."],"cards":[{"f":"Proteína que une Ca²⁺ en el músculo esquelético","b":"Troponina C."},{"f":"Proteína que une Ca²⁺ en el músculo liso","b":"Calmodulina (activa MLCK)."},{"f":"Para qué se necesita ATP en la contracción","b":"Para separar la miosina de la actina y para recaptar Ca²⁺ (SERCA)."},{"f":"Por qué el corazón no tetaniza","b":"Su periodo refractario es largo (dura casi toda la contracción)."},{"f":"Mecanismo de liberación de Ca²⁺ en el miocardio","b":"Liberación de Ca²⁺ inducida por Ca²⁺ (canal L → receptor de rianodina)."}],"quiz":[{"q":"¿Qué explica el rigor mortis?","o":["Exceso de ATP","Destrucción de la troponina","Falta de ATP para liberar la miosina de la actina","Bloqueo de la acetilcolina"],"a":2,"e":"Sin ATP los puentes cruzados quedan fijos."},{"q":"La nitroglicerina relaja el músculo liso vascular a través de:","o":["Aumento de AMPc en el miocito cardiaco","Aumento de GMPc","Bloqueo de canales de Na⁺","Activación de receptores α1"],"a":1,"e":"Libera NO, que activa la guanilato ciclasa."}],"intro":"Acoplamiento excitación-contracción: el Ca²⁺ conecta el potencial de acción con los puentes cruzados."},{"t":"Fisiología cardiaca","res":["<b>Potencial de acción ventricular<\/b>: fase 0 (entrada rápida de Na⁺), 1 (salida transitoria de K⁺), <b>2 meseta (entrada de Ca²⁺ por canales L)<\/b>, 3 (salida de K⁺), 4 (reposo).","<b>Células marcapaso<\/b> (nodo SA): fase 4 con despolarización espontánea por <b>corriente funny (If, Na⁺)<\/b>; fase 0 por <b>Ca²⁺<\/b>. El simpático aumenta la pendiente de fase 4; el vago la disminuye.","ECG: <b>P<\/b> despolarización auricular; <b>PR<\/b> (0.12–0.20 s) conducción AV; <b>QRS<\/b> (&lt; 0.12 s) despolarización ventricular; <b>T<\/b> repolarización ventricular; <b>QT<\/b> sístole eléctrica.","<b>Ciclo cardiaco<\/b>: contracción isovolumétrica (todas las válvulas cerradas) → eyección → relajación isovolumétrica → llenado (rápido, lento, sístole auricular). R1 al cerrar AV; R2 al cerrar semilunares.","<b>Gasto cardiaco<\/b> = FC × VS. <b>Volumen sistólico<\/b> depende de <b>precarga<\/b>, <b>poscarga<\/b> y <b>contractilidad<\/b>. Fracción de eyección normal <b>≥ 55 %<\/b>.","<b>Ley de Frank-Starling<\/b>: a mayor llenado (volumen telediastólico), mayor fuerza de contracción y volumen sistólico."],"hy":["Precarga ≈ volumen telediastólico; poscarga ≈ presión aórtica/resistencia contra la que eyecta; contractilidad = inotropismo (sube con simpático y digoxina).","QT largo predispone a <b>torsades de pointes<\/b> (hipopotasemia, hipomagnesemia, macrólidos, antipsicóticos, ondansetrón)."],"cl":["<b>Insuficiencia cardiaca con FE reducida<\/b> (&lt; 40 %): curva de Frank-Starling aplanada; congestión y bajo gasto.","Tercer ruido (S3): llenado rápido en ventrículo dilatado (insuficiencia cardiaca); cuarto ruido (S4): contracción auricular contra ventrículo rígido (hipertrofia)."],"cards":[{"f":"Ion de la meseta del PA ventricular","b":"Ca²⁺ por canales tipo L."},{"f":"Corriente responsable del automatismo del nodo SA","b":"Corriente funny (If), de Na⁺."},{"f":"Ley de Frank-Starling","b":"A mayor volumen telediastólico, mayor volumen sistólico (hasta un límite)."},{"f":"Fracción de eyección normal","b":"≥ 55 % (VS / volumen telediastólico)."},{"f":"Qué representa el intervalo PR","b":"Conducción auricular y retraso en el nodo AV (0.12–0.20 s)."},{"f":"Significado de S3 en el adulto","b":"Sobrecarga de volumen o insuficiencia cardiaca."}],"quiz":[{"q":"¿En qué fase del ciclo cardiaco todas las válvulas están cerradas y la presión ventricular sube?","o":["Contracción isovolumétrica","Llenado rápido","Eyección rápida","Sístole auricular"],"a":0,"e":"Tras el cierre de las AV y antes de abrirse las semilunares."},{"q":"Volumen telediastólico 120 mL y telesistólico 50 mL. Fracción de eyección:","o":["≈ 70 %","≈ 58 %","≈ 24 %","≈ 42 %"],"a":1,"e":"VS = 70 mL; FE = 70/120 ≈ 0.58."},{"q":"La estimulación vagal reduce la frecuencia cardiaca porque:","o":["Aumenta la entrada de Ca²⁺","Disminuye la pendiente de la fase 4 del nodo SA","Bloquea canales de Na⁺ rápidos","Prolonga la meseta ventricular"],"a":1,"e":"La acetilcolina abre canales de K⁺ y reduce If: la despolarización espontánea tarda más."}],"intro":"El corazón como bomba eléctrica y mecánica."},{"t":"Hemodinamia y control de la presión arterial","res":["<b>Presión arterial media<\/b> ≈ diastólica + ⅓ (sistólica − diastólica). Presión de pulso = sistólica − diastólica.","<b>Ley de Poiseuille<\/b>: la resistencia es proporcional a la viscosidad y longitud e <b>inversamente proporcional a r⁴<\/b> → pequeños cambios de radio cambian mucho el flujo.","Flujo = ΔP / R. Resistencias en serie se suman; en paralelo se reducen (por eso la resistencia sistémica total es baja comparada con cada órgano).","<b>Barorreceptores<\/b> (seno carotídeo → IX; arco aórtico → X): ↑ PA → ↑ disparo → ↓ simpático y ↑ vago → baja FC y resistencia (control rápido).","Control a largo plazo: <b>riñón<\/b> (volumen) y <b>SRAA<\/b>; ADH; péptido natriurético auricular (↑ natriuresis).","<b>Fuerzas de Starling<\/b> en el capilar: presión hidrostática capilar y oncótica intersticial sacan líquido; oncótica plasmática (albúmina) e hidrostática intersticial lo retienen."],"hy":["Disminuir el radio a la mitad aumenta la resistencia 16 veces (r⁴).","Edema por: ↑ presión hidrostática (insuficiencia cardiaca), ↓ presión oncótica (hipoalbuminemia), ↑ permeabilidad (sepsis, quemaduras) u obstrucción linfática."],"cl":["<b>Masaje del seno carotídeo<\/b>: activa barorreceptores → reflejo vagal que puede terminar una taquicardia supraventricular.","<b>Ortostatismo<\/b>: al ponerse de pie baja el retorno venoso; si falla el reflejo barorreceptor (disautonomía, diabetes, fármacos) hay hipotensión ortostática."],"cards":[{"f":"Fórmula de la presión arterial media","b":"PAM ≈ PAD + ⅓ (PAS − PAD)."},{"f":"Variable con mayor efecto sobre la resistencia vascular","b":"Radio del vaso (a la cuarta potencia)."},{"f":"Nervio aferente del seno carotídeo","b":"Glosofaríngeo (IX)."},{"f":"Fuerza que retiene líquido en el capilar","b":"Presión oncótica plasmática (albúmina)."},{"f":"Respuesta barorreceptora a una caída de PA","b":"↓ disparo → ↑ simpático: taquicardia, vasoconstricción, ↑ contractilidad."}],"quiz":[{"q":"Paciente con PA de 130/70 mmHg. Presión arterial media aproximada:","o":["100 mmHg","60 mmHg","90 mmHg","115 mmHg"],"a":2,"e":"70 + (60/3) = 90."},{"q":"Paciente con síndrome nefrótico y edema generalizado. Mecanismo principal:","o":["Disminución de la presión oncótica plasmática","Aumento de la presión oncótica intersticial","Aumento de la permeabilidad por histamina","Obstrucción linfática"],"a":0,"e":"La pérdida de albúmina en orina baja la presión oncótica."},{"q":"Si el radio de una arteriola se duplica, la resistencia:","o":["Aumenta 4 veces","Disminuye 16 veces","No cambia","Disminuye a la mitad"],"a":1,"e":"R ∝ 1/r⁴: (2)⁴ = 16."}],"intro":"PA media = gasto cardiaco × resistencia periférica total."},{"t":"Fisiología respiratoria","res":["Volúmenes: volumen corriente ~500 mL; <b>capacidad residual funcional<\/b> (VRE + VR); <b>capacidad vital<\/b> (VRI + VC + VRE); <b>capacidad pulmonar total<\/b>. El <b>volumen residual<\/b> no se mide con espirometría.","<b>Espirometría<\/b>: <b>obstructivo<\/b> (asma, EPOC) → ↓ FEV1/FVC (&lt; 0.70); <b>restrictivo<\/b> (fibrosis, obesidad, enfermedad neuromuscular) → FEV1/FVC normal o ↑ con ↓ capacidad pulmonar total.","Ventilación alveolar = (VC − espacio muerto) × FR. Espacio muerto anatómico ~150 mL.","<b>Distensibilidad<\/b> (compliance) ↓ en fibrosis, ↑ en enfisema. El surfactante reduce la tensión superficial (ley de Laplace: P = 2T/r).","<b>Ventilación/perfusión<\/b>: ápice con V/Q alto, base con V/Q bajo. V/Q = 0 → <b>cortocircuito<\/b> (shunt: no corrige con O₂ al 100 %); V/Q = ∞ → <b>espacio muerto<\/b> (tromboembolia pulmonar).","<b>Vasoconstricción pulmonar hipóxica<\/b>: la hipoxia alveolar contrae arteriolas pulmonares (al revés que en la circulación sistémica).","Control: quimiorreceptores <b>centrales<\/b> (bulbo; responden al ↑ CO₂/H⁺ del LCR) y <b>periféricos<\/b> (cuerpos carotídeos y aórticos; responden a PaO₂ &lt; 60 mmHg)."],"hy":["El estímulo principal para respirar es la <b>PaCO₂<\/b> (vía H⁺ en LCR); en hipoxemia grave (PaO₂ &lt; 60) actúan los periféricos.","Gradiente A-a normal (5–15 mmHg) en hipoventilación; elevado en V/Q, shunt y difusión."],"cl":["<b>Asma/EPOC<\/b>: patrón obstructivo; en asma mejora el FEV1 ≥ 12 % y 200 mL con broncodilatador.","<b>Tromboembolia pulmonar<\/b>: espacio muerto, taquipnea, hipoxemia con gradiente A-a aumentado."],"cards":[{"f":"Volumen que no mide la espirometría","b":"Volumen residual (y por eso tampoco CRF ni CPT)."},{"f":"Índice de obstrucción","b":"FEV1/FVC &lt; 0.70."},{"f":"Qué es un cortocircuito (shunt)","b":"Perfusión sin ventilación (V/Q = 0); no corrige con O₂ al 100 %."},{"f":"Estímulo principal de la ventilación","b":"PaCO₂ elevada (H⁺ en el LCR, quimiorreceptores centrales)."},{"f":"Respuesta vascular pulmonar a la hipoxia alveolar","b":"Vasoconstricción (desvía flujo a zonas ventiladas)."}],"quiz":[{"q":"Espirometría con FEV1/FVC de 0.88 y capacidad pulmonar total disminuida. Patrón:","o":["Mixto obstructivo predominante","Restrictivo","Normal","Obstructivo"],"a":1,"e":"Relación conservada o alta con volúmenes pequeños = restricción."},{"q":"Paciente cuya hipoxemia no mejora con oxígeno al 100 %. Mecanismo:","o":["Desequilibrio V/Q leve","Altitud","Hipoventilación","Cortocircuito (shunt)"],"a":3,"e":"La sangre que pasa por alvéolos no ventilados no entra en contacto con el O₂ suplementario."},{"q":"En la base del pulmón de pie, la relación V/Q es:","o":["Baja (más perfusión que ventilación)","Igual a cero","Infinita","Alta"],"a":0,"e":"La gravedad aumenta más la perfusión que la ventilación en las bases."}],"intro":"Ventilación, difusión, perfusión y transporte de gases."},{"t":"Fisiología renal","res":["<b>Tasa de filtración glomerular (TFG)<\/b> ≈ 120 mL/min; depende de las fuerzas de Starling en el glomérulo. <b>Fracción de filtración<\/b> = TFG / flujo plasmático renal ≈ 20 %.","<b>Depuración (clearance)<\/b> = (U × V) / P. <b>Inulina<\/b> = TFG exacta; <b>creatinina<\/b> = estimación (sobreestima un poco porque se secreta); <b>PAH<\/b> = flujo plasmático renal efectivo.","Arteriola <b>aferente<\/b> dilatada (prostaglandinas) y <b>eferente<\/b> contraída (angiotensina II) ↑ TFG. AINE (contraen aferente) e IECA/ARA II (dilatan eferente) ↓ TFG.","<b>Autorregulación<\/b>: respuesta miógena y <b>retroalimentación tubuloglomerular<\/b> (mácula densa).","<b>ADH<\/b>: inserta <b>acuaporina 2<\/b> en el colector (V2) → orina concentrada. <b>Aldosterona<\/b>: en la célula principal ↑ ENaC y Na⁺/K⁺-ATPasa → reabsorbe Na⁺, secreta K⁺ y H⁺.","<b>Mecanismo contracorriente<\/b>: el asa de Henle crea un intersticio medular hiperosmolar (hasta ~1200 mOsm/kg) que permite concentrar la orina."],"hy":["Combinar AINE + IECA + diurético (\"triple whammy\") en un paciente deshidratado puede causar lesión renal aguda.","Glucosa: se reabsorbe por SGLT2 en el TCP; los <b>inhibidores SGLT2<\/b> (dapagliflozina) causan glucosuria."],"cl":["<b>Diabetes insípida<\/b>: central (falta ADH) o nefrogénica (no responde; litio); orina abundante y diluida.","<b>SIADH<\/b>: exceso de ADH → hiponatremia euvolémica con orina concentrada (cáncer pulmonar de células pequeñas, fármacos)."],"tabla":["Diurético¦Sitio¦Efecto clave","Acetazolamida¦TCP¦Inhibe anhidrasa carbónica, acidosis","Furosemida¦Asa ascendente gruesa (NKCC2)¦El más potente, hipopotasemia, hipocalcemia","Tiazidas¦TCD (NCC)¦Hipopotasemia, hipercalcemia","Espironolactona¦Colector¦Antagoniza aldosterona, hiperpotasemia"],"cards":[{"f":"Fórmula de la depuración","b":"Concentración urinaria × flujo urinario / concentración plasmática."},{"f":"Sustancia que mide exactamente la TFG","b":"Inulina."},{"f":"Efecto de la angiotensina II sobre las arteriolas glomerulares","b":"Contrae sobre todo la eferente (mantiene la TFG)."},{"f":"Dónde actúa la ADH","b":"Túbulo colector, receptor V2, inserta acuaporina 2."},{"f":"Fracción de filtración normal","b":"≈ 20 %."},{"f":"Diurético que causa hipercalcemia","b":"Tiazidas (las de asa, en cambio, aumentan la pérdida urinaria de calcio)."}],"quiz":[{"q":"Paciente con lesión renal aguda tras iniciar ibuprofeno en dosis altas. Mecanismo:","o":["Obstrucción tubular por cristales","Glomerulonefritis aguda","Vasoconstricción de la arteriola aferente por menos prostaglandinas","Dilatación de la eferente"],"a":2,"e":"Las prostaglandinas mantienen dilatada la aferente cuando hay hipoperfusión."},{"q":"Hiponatremia euvolémica con osmolalidad urinaria alta en un fumador. Sospecha:","o":["Polidipsia psicógena","Insuficiencia suprarrenal primaria con hipovolemia","SIADH por cáncer pulmonar de células pequeñas","Diabetes insípida central"],"a":2,"e":"La ADH ectópica concentra la orina y diluye el plasma."},{"q":"¿Qué diurético puede causar hiperpotasemia?","o":["Furosemida","Espironolactona","Hidroclorotiazida","Acetazolamida"],"a":1,"e":"Al antagonizar la aldosterona disminuye la secreción de K⁺."}],"intro":"Filtración, reabsorción y secreción para mantener volumen, osmolalidad y electrolitos."},{"t":"Equilibrio ácido-base","res":["El riñón <b>reabsorbe<\/b> casi todo el HCO₃⁻ filtrado (85 % en TCP) y <b>genera<\/b> HCO₃⁻ nuevo excretando H⁺ como <b>acidez titulable<\/b> (fosfato) y <b>amonio<\/b> (NH₄⁺, el principal y el que más se adapta).","Abordaje de la gasometría: 1) pH (acidemia/alcalemia), 2) trastorno primario (PaCO₂ vs HCO₃⁻), 3) compensación esperada, 4) brecha aniónica en acidosis metabólica.","<b>Fórmula de Winter<\/b> (acidosis metabólica): PaCO₂ esperada = 1.5 × HCO₃⁻ + 8 ± 2. Si la PaCO₂ real es mayor → hay además acidosis respiratoria.","Compensación respiratoria aguda vs crónica: en la acidosis respiratoria el HCO₃⁻ sube 1 mEq/L por cada 10 mmHg de PaCO₂ (aguda) y 3.5 (crónica).","Potasio y pH: la <b>acidosis<\/b> saca K⁺ de las células (hiperpotasemia); la <b>alcalosis<\/b> lo mete (hipopotasemia)."],"hy":["Winter: PaCO₂ = 1.5 × HCO₃⁻ + 8 (± 2).","Acidosis con brecha aniónica normal (hiperclorémica): diarrea y acidosis tubular renal."],"cl":["<b>EPOC<\/b> con retención crónica de CO₂: acidosis respiratoria compensada con HCO₃⁻ alto.","<b>Crisis de ansiedad<\/b>: alcalosis respiratoria aguda con parestesias peribucales (↓ calcio ionizado)."],"cards":[{"f":"Fórmula de Winter","b":"PaCO₂ esperada = 1.5 × HCO₃⁻ + 8 ± 2."},{"f":"Forma principal en que el riñón excreta ácido","b":"Como amonio (NH₄⁺)."},{"f":"Efecto de la acidosis sobre el potasio sérico","b":"Lo eleva (salida de K⁺ de las células)."},{"f":"Causas de acidosis con brecha aniónica normal","b":"Diarrea y acidosis tubular renal."}],"quiz":[{"q":"Acidosis metabólica con HCO₃⁻ de 12 mEq/L y PaCO₂ de 34 mmHg. Interpretación:","o":["Acidosis metabólica con acidosis respiratoria agregada","Acidosis metabólica bien compensada","Acidosis respiratoria pura","Alcalosis respiratoria agregada"],"a":0,"e":"Esperada: 1.5(12) + 8 = 26 ± 2; 34 es mayor → retención de CO₂ adicional."},{"q":"Paciente con crisis de ansiedad, hormigueo peribucal y espasmo carpopedal. Gasometría esperada:","o":["pH alto con PaCO₂ baja","pH bajo con HCO₃⁻ bajo","pH alto con HCO₃⁻ alto","pH bajo con PaCO₂ alta"],"a":0,"e":"Alcalosis respiratoria aguda por hiperventilación."}],"intro":"Tres defensas: amortiguadores (segundos), pulmón (minutos-horas) y riñón (días)."},{"t":"Fisiología endocrina","res":["Hormonas <b>peptídicas<\/b> (receptores de membrana: segundos mensajeros AMPc, IP₃/Ca²⁺) vs <b>esteroideas y tiroideas<\/b> (receptores intracelulares/nucleares que modifican la transcripción).","Eje <b>tiroideo<\/b>: TRH → TSH → T4 (mayor cantidad) y T3 (activa; la T4 se convierte en tejidos por desyodasas). Efectos: ↑ metabolismo basal, ↑ receptores β1, termogénesis, desarrollo del SNC.","Eje <b>suprarrenal<\/b>: CRH → ACTH → <b>cortisol<\/b> (ritmo circadiano, máximo matutino): gluconeogénesis, ↑ glucosa, antiinflamatorio, inmunosupresor, permisivo para catecolaminas.","<b>Aldosterona<\/b>: regulada por angiotensina II y K⁺ sérico (poco por ACTH).","<b>GH<\/b>: pulsátil, en el sueño; actúa vía <b>IGF-1<\/b> hepático; la inhibe la somatostatina. <b>Prolactina<\/b>: inhibida por dopamina.","<b>Calcio<\/b>: PTH (↑ resorción ósea, ↑ reabsorción renal de Ca²⁺, ↓ reabsorción de fosfato, ↑ 1-α-hidroxilasa) y calcitriol (↑ absorción intestinal de Ca²⁺ y fosfato).","<b>Insulina<\/b> (receptor tirosina cinasa; ↑ GLUT4) vs <b>glucagón<\/b> (receptor acoplado a Gs, AMPc)."],"hy":["Hipotiroidismo <b>primario<\/b>: TSH alta, T4 libre baja. <b>Central<\/b>: TSH baja o normal con T4 baja.","Cushing: la prueba de supresión con dexametasona distingue el origen (hipofisario suprime con dosis alta; ectópico no)."],"cl":["<b>Enfermedad de Graves<\/b>: anticuerpos que estimulan el receptor de TSH → hipertiroidismo con bocio difuso y oftalmopatía; TSH suprimida.","<b>Insuficiencia suprarrenal primaria (Addison)<\/b>: hiperpigmentación (↑ ACTH), hiponatremia, hiperpotasemia, hipotensión."],"cards":[{"f":"Hormona tiroidea activa","b":"T3 (la T4 se convierte en tejidos)."},{"f":"Mediador de los efectos de la GH","b":"IGF-1 (somatomedina C) del hígado."},{"f":"Reguladores principales de la aldosterona","b":"Angiotensina II y potasio sérico."},{"f":"Acciones de la PTH en el riñón","b":"↑ reabsorción de Ca²⁺, ↓ reabsorción de fosfato, ↑ síntesis de calcitriol."},{"f":"Receptor de la insulina","b":"Tirosina cinasa."},{"f":"Por qué hay hiperpigmentación en Addison","b":"El ACTH elevado (y MSH) estimula a los melanocitos."}],"quiz":[{"q":"TSH 12 mU/L y T4 libre baja. Diagnóstico:","o":["Hipotiroidismo primario","Hipertiroidismo primario","Eutiroideo enfermo","Hipotiroidismo central"],"a":0,"e":"La tiroides falla y la hipófisis responde elevando la TSH."},{"q":"Paciente con hiperpigmentación, hipotensión, Na⁺ bajo y K⁺ alto. ¿Qué hormonas faltan?","o":["Cortisol y aldosterona","Solo hormonas tiroideas","Solo cortisol por falta de ACTH","Insulina"],"a":0,"e":"Addison destruye la corteza: sin aldosterona hay hiperpotasemia; la ACTH alta pigmenta."},{"q":"Las hormonas esteroideas actúan principalmente:","o":["Abriendo canales iónicos","A través de AMPc","Mediante tirosina cinasas de membrana","Sobre receptores intracelulares que regulan la transcripción"],"a":3,"e":"Son liposolubles y atraviesan la membrana."}],"intro":"Ejes hipotálamo-hipófisis-glándula con retroalimentación negativa."},{"t":"Fisiología digestiva","res":["<b>Sistema nervioso entérico<\/b>: plexo mientérico (Auerbach, motilidad) y submucoso (Meissner, secreción). Vago estimula; simpático inhibe.","Fases de la secreción gástrica: <b>cefálica<\/b> (vago), <b>gástrica<\/b> (distensión, gastrina) e <b>intestinal<\/b>.","<b>Célula parietal<\/b>: secreta HCl por la <b>H⁺/K⁺-ATPasa<\/b> (bomba de protones, blanco del omeprazol); la estimulan acetilcolina (M3), <b>gastrina<\/b> (CCK-B) e <b>histamina<\/b> (H2). Somatostatina la inhibe. Marea alcalina posprandial.","Hormonas: <b>gastrina<\/b> (células G del antro; ↑ ácido), <b>CCK<\/b> (células I; vesícula y enzimas pancreáticas, ↓ vaciamiento gástrico), <b>secretina<\/b> (células S; HCO₃⁻ pancreático), <b>GIP<\/b> (incretina; ↑ insulina), <b>motilina<\/b> (complejo motor migratorio en ayuno).","Digestión: carbohidratos (amilasa → disacaridasas del borde en cepillo), proteínas (pepsina, tripsina activada por <b>enterocinasa<\/b>), grasas (lipasa pancreática con <b>sales biliares<\/b> que forman micelas).","Absorción de glucosa y galactosa por <b>SGLT1<\/b>; fructosa por <b>GLUT5<\/b> (facilitada).","<b>Circulación enterohepática<\/b> de sales biliares: se reabsorben en el <b>íleon terminal<\/b> (~95 %)."],"hy":["Las tres vías que estimulan el ácido gástrico: acetilcolina, gastrina e histamina; la vía final común es la bomba de protones.","La enterocinasa activa la tripsina, que activa el resto de las proenzimas pancreáticas."],"cl":["<b>Síndrome de Zollinger-Ellison<\/b>: gastrinoma → úlceras múltiples o atípicas y diarrea.","<b>Intolerancia a la lactosa<\/b>: déficit de lactasa → diarrea osmótica y distensión tras lácteos.","La <b>solución de rehidratación oral<\/b> aprovecha el cotransporte Na⁺-glucosa (SGLT1), que se conserva en la diarrea secretora."],"cards":[{"f":"Enzima blanco del omeprazol","b":"H⁺/K⁺-ATPasa de la célula parietal."},{"f":"Hormona que libera bicarbonato pancreático","b":"Secretina."},{"f":"Enzima que activa la tripsina","b":"Enterocinasa (enteropeptidasa) del duodeno."},{"f":"Transportador de glucosa del enterocito apical","b":"SGLT1 (Na⁺-glucosa)."},{"f":"Fundamento del suero oral","b":"Cotransporte Na⁺-glucosa que arrastra agua aun con diarrea secretora."}],"quiz":[{"q":"Paciente con úlceras duodenales múltiples, diarrea y gastrina muy elevada. Sospecha:","o":["Úlcera por AINE","Gastritis atrófica","Infección aislada por H. pylori","Síndrome de Zollinger-Ellison"],"a":3,"e":"Un gastrinoma produce hipersecreción ácida intensa."},{"q":"¿Por qué el suero oral con glucosa funciona en el cólera?","o":["La glucosa inhibe la toxina","La glucosa bloquea el AMPc","El cotransporte Na⁺-glucosa sigue funcionando y arrastra agua","Aumenta la motilidad"],"a":2,"e":"La toxina activa la secreción de Cl⁻, pero SGLT1 permanece intacto."}],"intro":"Motilidad, secreción, digestión y absorción coordinadas por nervios y hormonas."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
