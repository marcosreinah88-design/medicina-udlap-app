<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio de Simulación II</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: resumen por tema (temario, alto rendimiento, correlación clínica), tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#c4142f; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:26px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tema .num{font:500 .74rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:4px 0 6px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0 0 12px}
.tema h3{font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
.tema ul{margin:0;padding-left:1.15em}
.tema li{margin:4px 0}
.tema li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px 12px 16px;margin-top:14px;border-left:4px solid}
.box h3{margin-top:0!important}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h3{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h3{color:var(--cl)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--c-soft);font-weight:700}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tmeta button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.tmeta button:hover{border-color:var(--c)}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:1fr}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.tema{padding:18px 16px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="hero gut" data-code="SIM II"><div class="in">
  <p class="kick" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
  <p class="nota" id="nota" hidden></p>
</div></header>
<nav class="tabs gut" role="tablist" aria-label="Modos"><div class="in">
  <button role="tab" id="tab-estudiar" aria-controls="panel-estudiar" aria-selected="true">Estudiar</button>
  <button role="tab" id="tab-tarjetas" aria-controls="panel-tarjetas" aria-selected="false">Tarjetas</button>
  <button role="tab" id="tab-examen" aria-controls="panel-examen" aria-selected="false">Examen</button>
</div></nav>
<main class="gut"><div class="in">
  <section id="panel-estudiar" role="tabpanel" class="study">
    <aside class="toc"><p>Temario</p><div class="lst" id="toc"></div></aside>
    <div id="temas"></div>
  </section>
  <section id="panel-tarjetas" role="tabpanel" class="pane" hidden>
    <div class="bar"><select id="cSel" aria-label="Tema de las tarjetas"></select><button class="btn" id="cMix" type="button">Revolver</button><button class="btn" id="cRep" type="button">Solo las de repasar</button><span class="count" id="cCount"></span></div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="Voltear tarjeta">
      <div class="face front" id="cFront"><div class="lbl" id="cLbl"></div><div class="txt" id="cF"></div></div>
      <div class="face back" id="cBack" hidden><div class="lbl">Respuesta</div><div class="txt" id="cB"></div></div>
    </div>
    <p class="hint">Toca la tarjeta o la barra espaciadora para voltearla.</p>
    <div class="cnav"><button class="btn" id="cPrev" type="button">← Anterior</button><button class="btn no" id="cNo" type="button">Repasar</button><button class="btn ok" id="cOk" type="button">Me la sé</button><button class="btn" id="cNext" type="button">Siguiente →</button></div>
  </section>
  <section id="panel-examen" role="tabpanel" class="pane" hidden>
    <div id="qStart" class="qbox">
      <p class="qtxt">Examen de práctica</p>
      <div class="bar"><select id="qSel" aria-label="Tema del examen"></select><select id="qN" aria-label="Número de preguntas"><option value="10">10 preguntas</option><option value="20">20 preguntas</option><option value="0">Todas</option></select><button class="btn pri" id="qGo" type="button">Comenzar</button></div>
      <p class="hint" style="text-align:left">Opción múltiple con explicación de cada respuesta. Las preguntas y opciones salen en otro orden cada vez.</p>
    </div>
    <div id="qRun" class="qbox" hidden>
      <div class="qtop"><span id="qPos"></span><span id="qTema"></span></div><div class="prog"><i id="qBar"></i></div>
      <p class="qtxt" id="qQ"></p><div class="opts" id="qO"></div><div class="exp" id="qE" hidden></div>
      <div class="cnav"><button class="btn pri" id="qNext" type="button" hidden>Siguiente →</button></div>
    </div>
    <div id="qEnd" class="qbox res" hidden></div>
  </section>
</div></main>
<footer class="gut"><div class="in" id="foot"></div></footer>
<script>
const GUIA={"id":"simulacion-ii","title":"Laboratorio de Simulación II","kicker":"Segundo semestre · Simulación","desc":"Técnicas de exploración y procedimientos básicos para la estación práctica: cómo auscultar, qué se escucha, cómo inyectar y canalizar, y RCP de alta calidad.","nota":"El temario sigue los contenidos habituales de una segunda simulación clínica (no se encontró el programa publicado de UDLAP). Para SVB a detalle también está la guía de Soporte vital básico en Otros materiales.","temas":[{"t":"Técnicas de exploración física","res":["Preparación: higiene de manos, presentarse, explicar, pedir consentimiento, privacidad, buena luz, paciente descubierto solo en la zona a explorar, explorar desde el <b>lado derecho<\/b> del paciente.","<b>Inspección<\/b>: general (facies, actitud, marcha, estado de conciencia) y regional (simetría, color, cicatrices, movimientos).","<b>Palpación<\/b>: superficial y profunda; con la palma (vibraciones/frémito), dorso de la mano (temperatura), yemas (detalles). Iniciar lejos de la zona dolorosa.","<b>Percusión<\/b>: digito-digital. Sonidos: <b>resonante/claro pulmonar<\/b> (pulmón normal), <b>mate<\/b> (hígado, derrame, consolidación), <b>timpánico<\/b> (estómago, intestino, neumotórax), <b>hiperresonante<\/b> (enfisema, neumotórax).","<b>Auscultación<\/b>: diafragma del estetoscopio para tonos <b>altos<\/b> (R1, R2, soplos de insuficiencia aórtica, ruidos respiratorios); campana para tonos <b>bajos<\/b> (R3, R4, estenosis mitral) apoyada suavemente.","Orden en abdomen: <b>inspección → auscultación → percusión → palpación<\/b> (palpar primero altera los ruidos intestinales)."],"hy":["Diafragma = agudos; campana = graves (S3, S4, retumbo mitral).","Abdomen: auscultar antes de palpar."],"cl":["<b>Matidez<\/b> a la percusión con frémito disminuido = derrame pleural; con frémito aumentado = consolidación (neumonía).","<b>Hiperresonancia<\/b> unilateral con ruidos ausentes y desviación traqueal = neumotórax a tensión."],"cards":[{"f":"Orden de exploración del abdomen","b":"Inspección, auscultación, percusión y palpación."},{"f":"Parte del estetoscopio para tonos graves","b":"Campana (apoyada suavemente)."},{"f":"Sonido de percusión del pulmón normal","b":"Resonante (claro pulmonar)."},{"f":"Sonido de percusión en un derrame pleural","b":"Mate."},{"f":"Lado desde el que se explora","b":"Lado derecho del paciente."}],"quiz":[{"q":"Matidez en la base derecha, frémito disminuido y ruidos respiratorios abolidos. Hallazgo más probable:","o":["Neumotórax","Neumonía con consolidación","Derrame pleural","Enfisema"],"a":2,"e":"El líquido aísla la transmisión de vibraciones (frémito ↓) y es mate."},{"q":"¿Por qué se ausculta el abdomen antes de palparlo?","o":["La palpación puede modificar los ruidos intestinales","Porque la auscultación duele menos","No importa el orden","Para no contaminar el estetoscopio"],"a":0,"e":"La manipulación estimula o altera la peristalsis."}],"intro":"Inspección, palpación, percusión y auscultación (en el abdomen, auscultar antes de palpar)."},{"t":"Exploración cardiaca: focos, ruidos y soplos","res":["Focos: <b>aórtico<\/b> (2.º espacio intercostal paraesternal derecho), <b>pulmonar<\/b> (2.º EIC paraesternal izquierdo), <b>tricuspídeo<\/b> (4.º–5.º EIC paraesternal izquierdo), <b>mitral<\/b> (5.º EIC línea medioclavicular izquierda, ápex). Punto de Erb: 3.er EIC izquierdo.","<b>R1<\/b>: cierre de mitral y tricúspide (inicio de la sístole; coincide con el pulso carotídeo); más fuerte en el ápex. <b>R2<\/b>: cierre aórtico y pulmonar; más fuerte en la base. <b>Desdoblamiento fisiológico de R2<\/b> en inspiración.","<b>R3<\/b> (galope ventricular): llenado rápido en ventrículo con sobrecarga de volumen; normal en niños, jóvenes y embarazo. <b>R4<\/b>: contracción auricular contra ventrículo rígido (hipertrofia, isquemia).","Soplos <b>sistólicos<\/b>: estenosis aórtica (eyectivo, crescendo-decrescendo, irradia a carótidas), insuficiencia mitral (holosistólico, irradia a axila), CIV. <b>Diastólicos<\/b>: insuficiencia aórtica (decrescendo, borde esternal izquierdo), estenosis mitral (chasquido de apertura + retumbo, con campana en el ápex). Los diastólicos siempre son patológicos.","Intensidad de soplos: grados I–VI (IV en adelante con frémito).","Maniobras: <b>inspiración<\/b> aumenta los soplos del lado derecho; <b>Valsalva y ponerse de pie<\/b> disminuyen casi todos, excepto miocardiopatía hipertrófica y prolapso mitral, que aumentan."],"hy":["Para distinguir sístole de diástole, palpa el pulso carotídeo: R1 coincide con su inicio.","Todo soplo diastólico es patológico."],"cl":["<b>Estenosis aórtica<\/b> del adulto mayor: angina, síncope e insuficiencia cardiaca; soplo eyectivo que irradia a cuello.","<b>Estenosis mitral<\/b> suele ser secuela de fiebre reumática."],"tabla":["Soplo¦Momento¦Foco/irradiación","Estenosis aórtica¦Sistólico eyectivo¦Aórtico → carótidas","Insuficiencia mitral¦Holosistólico¦Ápex → axila","Insuficiencia aórtica¦Diastólico temprano¦Borde esternal izquierdo","Estenosis mitral¦Diastólico con chasquido de apertura¦Ápex, con campana, decúbito lateral izquierdo"],"cards":[{"f":"Foco aórtico","b":"2.º espacio intercostal, borde esternal derecho."},{"f":"Foco mitral","b":"5.º espacio intercostal, línea medioclavicular izquierda (ápex)."},{"f":"Qué produce R2","b":"Cierre de las válvulas aórtica y pulmonar."},{"f":"Soplo que irradia a la axila","b":"Insuficiencia mitral (holosistólico)."},{"f":"Soplos que aumentan con Valsalva","b":"Miocardiopatía hipertrófica obstructiva y prolapso de la válvula mitral."}],"quiz":[{"q":"Adulto mayor con síncope de esfuerzo y soplo sistólico eyectivo en el 2.º EIC derecho que irradia al cuello. Diagnóstico probable:","o":["Insuficiencia aórtica","Estenosis aórtica","Insuficiencia mitral","Estenosis mitral"],"a":1,"e":"Soplo crescendo-decrescendo en foco aórtico con irradiación carotídea."},{"q":"¿Con qué parte del estetoscopio y en qué posición escuchas mejor la estenosis mitral?","o":["Diafragma en el foco pulmonar acostado","Diafragma en el foco aórtico sentado e inclinado","Campana en el foco tricuspídeo de pie","Campana en el ápex con el paciente en decúbito lateral izquierdo"],"a":3,"e":"El retumbo es de tono bajo y se acerca el ápex a la pared."}],"intro":"Cuatro focos clásicos y la diferencia entre sístole y diástole."},{"t":"Exploración pulmonar y ruidos respiratorios","res":["Ruidos normales: <b>murmullo vesicular<\/b> (periferia; inspiración más larga que espiración), <b>bronquial/traqueal<\/b> (sobre la tráquea; espiración más larga y fuerte), broncovesicular.","Ruidos agregados: <b>estertores crepitantes<\/b> (finos, discontinuos, \"velcro\": neumonía, edema pulmonar, fibrosis), <b>estertores gruesos/roncus<\/b> (secreciones en vías grandes; cambian con la tos), <b>sibilancias<\/b> (continuos, agudos, espiratorios: asma, EPOC), <b>estridor<\/b> (inspiratorio, obstrucción de vía aérea superior: urgencia), <b>frote pleural<\/b> (pleuritis).","<b>Frémito táctil<\/b> (decir \"treinta y tres\"): ↑ en consolidación; ↓ en derrame, neumotórax, atelectasia obstructiva.","Signos de consolidación: matidez, frémito aumentado, <b>soplo tubárico<\/b>, egofonía, pectoriloquia áfona.","Inspección: frecuencia, uso de músculos accesorios, tiraje, cianosis, acropaquias."],"hy":["Estridor = obstrucción alta y urgencia de vía aérea; sibilancia = obstrucción de vías pequeñas.","Crepitantes que no cambian con la tos = alveolares (neumonía, edema); roncus que cambian con la tos = secreciones."],"cl":["<b>Neumonía lobar<\/b>: fiebre, tos productiva, crepitantes y soplo tubárico en la zona consolidada.","<b>Edema agudo pulmonar<\/b>: crepitantes bilaterales basales que suben conforme empeora."],"tabla":["Hallazgo¦Consolidación¦Derrame¦Neumotórax","Percusión¦Mate¦Mate¦Hiperresonante","Frémito¦Aumentado¦Disminuido¦Disminuido","Ruidos¦Soplo tubárico, crepitantes¦Abolidos¦Abolidos","Tráquea¦Central¦Desviada al lado contrario (si es grande)¦Desviada al lado contrario (a tensión)"],"cards":[{"f":"Ruido agregado típico de la neumonía","b":"Estertores crepitantes (finos) y soplo tubárico."},{"f":"Ruido de la obstrucción de vía aérea superior","b":"Estridor (inspiratorio)."},{"f":"Frémito en una consolidación","b":"Aumentado."},{"f":"Ruido continuo agudo espiratorio del asma","b":"Sibilancias."}],"quiz":[{"q":"Paciente con fiebre, matidez y frémito aumentado en la base derecha con soplo tubárico. Diagnóstico:","o":["Neumonía con consolidación","Derrame pleural","Neumotórax","Asma"],"a":0,"e":"La consolidación transmite mejor el sonido y la vibración."},{"q":"Niño con estridor inspiratorio y tiraje. Esto indica:","o":["Edema pulmonar","Derrame pleural","Obstrucción de la vía aérea superior","Broncoespasmo de vías pequeñas"],"a":2,"e":"El estridor se genera en laringe o tráquea; es urgencia."}],"intro":"Comparar siempre ambos lados, de arriba abajo."},{"t":"Vías de administración y cálculo de dosis","res":["<b>Correctos<\/b>: paciente, medicamento, dosis, vía, hora (más registro, caducidad, alergias, educación).","<b>Intradérmica<\/b>: ángulo <b>10–15°<\/b>, bisel hacia arriba, forma una pápula (PPD/tuberculina, pruebas de alergia). <b>Subcutánea<\/b>: <b>45°<\/b> (90° si hay tejido suficiente); insulina, heparina de bajo peso molecular, vacunas como la triple viral. <b>Intramuscular<\/b>: <b>90°<\/b>; deltoides (≤ 2–3 mL), ventroglúteo (sitio preferido en adultos), vasto lateral (lactantes), dorsoglúteo cuadrante superoexterno. <b>Intravenosa<\/b>: efecto inmediato.","Técnica en Z para IM con fármacos irritantes. Aspirar no es necesario en la mayoría de los sitios (OMS†).","<b>Cálculo de dosis<\/b>: regla de tres; mg/kg; concentración (mg/mL).","<b>Goteo<\/b>: gotas/min = volumen (mL) × factor de goteo / tiempo (min). Macrogotero 20 gotas/mL (equipo estándar); microgotero 60 microgotas/mL (microgotas/min = mL/h)."],"hy":["Ángulos: intradérmica 10–15°, subcutánea 45°, intramuscular 90°.","En lactantes la IM va en el <b>vasto lateral<\/b> del muslo (no en glúteo)."],"cl":["La <b>adrenalina en anafilaxia<\/b> se aplica <b>IM en la cara anterolateral del muslo<\/b>: 0.01 mg/kg de la solución 1 mg/mL (1:1000), máximo 0.5 mg en adultos.","La <b>insulina<\/b> es subcutánea; rotar sitios evita lipodistrofia."],"cards":[{"f":"Ángulo de la inyección intradérmica","b":"10–15°, bisel hacia arriba."},{"f":"Sitio IM en lactantes","b":"Vasto lateral del muslo."},{"f":"Fórmula de gotas por minuto","b":"Volumen (mL) × factor de goteo / tiempo (min)."},{"f":"Equivalencia del microgotero","b":"60 microgotas = 1 mL; microgotas/min = mL/h."},{"f":"Dosis de adrenalina IM en anafilaxia del adulto","b":"0.5 mg (0.5 mL de 1 mg/mL) en el muslo anterolateral."}],"quiz":[{"q":"Debes pasar 1000 mL de solución en 8 horas con un normogotero (20 gotas/mL). ¿Cuántas gotas por minuto?","o":["≈ 60 gotas/min","≈ 21 gotas/min","≈ 125 gotas/min","≈ 42 gotas/min"],"a":3,"e":"1000 × 20 / 480 min ≈ 41.7."},{"q":"Niño de 20 kg necesita paracetamol a 15 mg/kg. Jarabe de 160 mg/5 mL. ¿Cuántos mL?","o":["≈ 9.4 mL","≈ 15 mL","≈ 3 mL","≈ 20 mL"],"a":0,"e":"15 × 20 = 300 mg; 300 / 32 mg por mL ≈ 9.4 mL."},{"q":"La prueba de tuberculina (PPD) se aplica por vía:","o":["Intramuscular","Intravenosa","Subcutánea","Intradérmica"],"a":3,"e":"Se busca una pápula en la dermis para leer la induración a las 48–72 h."}],"intro":"Los \"correctos\" de la medicación evitan errores."},{"t":"Venopunción y acceso venoso periférico","res":["Sitios: venas del dorso de la mano y antebrazo para catéter; <b>fosa antecubital<\/b> (vena mediana cubital) para muestras. Evitar el brazo con fístula arteriovenosa, linfedema o del lado de una mastectomía con disección axilar.","Técnica: identificar paciente, higiene de manos, guantes, <b>torniquete<\/b> 7–10 cm arriba del sitio (&lt; 1 min), antisepsia con alcohol 70 % o clorhexidina <b>sin volver a tocar<\/b>, fijar la vena con tracción de la piel, bisel hacia arriba a <b>15–30°<\/b>, observar reflujo, avanzar el catéter y retirar la guía, <b>soltar el torniquete<\/b>, fijar y rotular.","Calibre del catéter (gauge): <b>menor número = mayor diámetro<\/b>. 14–16 G trauma y reposición rápida; 18 G transfusión; 20–22 G uso general; 24 G pediatría.","<b>Orden de llenado de tubos<\/b> (vacutainer, CLSI): hemocultivos → <b>azul<\/b> (citrato, coagulación) → <b>rojo/amarillo<\/b> (suero, química) → <b>verde<\/b> (heparina) → <b>lila<\/b> (EDTA, biometría hemática) → <b>gris<\/b> (fluoruro, glucosa/lactato).","Complicaciones: hematoma, flebitis, infiltración, extravasación, infección."],"hy":["Menor gauge = catéter más grueso: para reanimar se usan dos catéteres cortos y gruesos (14–16 G).","Biometría hemática = tubo lila (EDTA); coagulación = tubo azul (citrato) lleno hasta la marca."],"cl":["Torniquete prolongado causa hemoconcentración y falsas elevaciones de potasio.","En choque hipovolémico la vía intraósea es alternativa rápida si no se logra acceso IV."],"cards":[{"f":"Tubo para biometría hemática","b":"Lila (EDTA)."},{"f":"Tubo para pruebas de coagulación","b":"Azul (citrato de sodio)."},{"f":"Calibre para reanimación con volumen","b":"14–16 G (cortos y gruesos)."},{"f":"Ángulo de inserción del catéter periférico","b":"15–30°, bisel hacia arriba."},{"f":"Efecto de un torniquete prolongado","b":"Hemoconcentración y potasio falsamente elevado."}],"quiz":[{"q":"Paciente politraumatizado en choque. ¿Qué acceso venoso eliges primero?","o":["Dos catéteres periféricos cortos de 14–16 G","Un catéter de 24 G en la mano","Vía subcutánea","Catéter venoso central de lumen triple"],"a":0,"e":"El flujo depende del radio y la longitud: corto y grueso es lo más rápido."},{"q":"¿Qué tubo se llena antes que el lila en una venopunción múltiple?","o":["El azul de citrato","Da igual el orden","El gris de fluoruro","Ninguno, el lila va primero"],"a":0,"e":"El EDTA del tubo lila puede contaminar a los siguientes; el citrato va antes."}],"intro":"Toma de muestras y canalización con técnica limpia y segura."},{"t":"Soporte vital básico (RCP del adulto)","res":["Secuencia: <b>seguridad de la escena<\/b> → verificar respuesta → <b>pedir ayuda y un DEA<\/b> (activar el sistema de emergencias) → revisar respiración y pulso carotídeo (<b>≤ 10 segundos<\/b>) → si no hay pulso: <b>C-A-B<\/b>.","<b>RCP de alta calidad<\/b>: frecuencia <b>100–120/min<\/b>, profundidad <b>5–6 cm<\/b> en adultos, permitir la <b>expansión completa<\/b>, minimizar interrupciones (&lt; 10 s), evitar ventilación excesiva.","Relación compresión:ventilación <b>30:2<\/b> (sin vía aérea avanzada); con vía aérea avanzada: compresiones continuas y 1 ventilación cada <b>6 segundos<\/b> (10/min).","<b>DEA<\/b>: encenderlo y seguir instrucciones; nadie toca al paciente durante el análisis y la descarga; reanudar compresiones de inmediato tras la descarga. Ritmos desfibrilables: <b>fibrilación ventricular y taquicardia ventricular sin pulso<\/b>.","Cambiar al compresor cada <b>2 minutos<\/b> (o 5 ciclos).","Obstrucción de vía aérea por cuerpo extraño en adulto consciente: <b>compresiones abdominales (Heimlich)<\/b>; si pierde la conciencia: RCP.","Niños: profundidad ≈ ⅓ del diámetro anteroposterior (≈ 5 cm niño, ≈ 4 cm lactante); 30:2 con un reanimador y 15:2 con dos."],"hy":["100–120 compresiones por minuto, 5–6 cm, 30:2, cambiar cada 2 minutos.","Asistolia y actividad eléctrica sin pulso <b>no<\/b> son desfibrilables."],"cl":["Cada minuto sin RCP ni desfibrilación reduce la supervivencia del paro por FV entre 7 y 10 %.","En paro de origen respiratorio (ahogamiento, niños) la ventilación cobra más importancia."],"cards":[{"f":"Frecuencia y profundidad de compresiones en el adulto","b":"100–120 por minuto y 5–6 cm."},{"f":"Relación compresión:ventilación sin vía aérea avanzada","b":"30:2."},{"f":"Ritmos desfibrilables","b":"Fibrilación ventricular y taquicardia ventricular sin pulso."},{"f":"Tiempo máximo para buscar pulso","b":"10 segundos."},{"f":"Cada cuánto se rota el compresor","b":"Cada 2 minutos."},{"f":"Maniobra para atragantamiento en adulto consciente","b":"Compresiones abdominales (Heimlich)."}],"quiz":[{"q":"Encuentras a un adulto inconsciente que no respira normalmente y sin pulso. Ya pediste ayuda. ¿Qué sigue?","o":["Colocarlo en posición de recuperación","Iniciar compresiones torácicas","Dar 5 ventilaciones de rescate","Buscar pulso durante 1 minuto"],"a":1,"e":"En adultos la secuencia es C-A-B: compresiones primero."},{"q":"El DEA indica \"descarga no recomendada\" y el paciente sigue sin pulso. Conducta:","o":["Reanudar de inmediato la RCP","Revisar pulso durante 1 minuto","Retirar los parches","Esperar a que el DEA analice otra vez sin hacer nada"],"a":0,"e":"Probablemente asistolia o AESP: RCP y reanalizar a los 2 minutos."},{"q":"Con vía aérea avanzada colocada, la ventilación se da:","o":["1 cada 6 segundos con compresiones continuas","Solo cuando el compresor se cansa","1 cada 2 segundos","2 cada 30 compresiones"],"a":0,"e":"10 ventilaciones por minuto sin pausar las compresiones."}],"intro":"Cadena de supervivencia: reconocimiento, llamada, RCP de alta calidad y desfibrilación temprana."}]};
</script>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=GUIA.temas,LS="s12-repasar-"+GUIA.id;
const allC=[],allQ=[];T.forEach((t,i)=>{(t.cards||[]).forEach(c=>allC.push({...c,ti:i}));(t.quiz||[]).forEach(q=>allQ.push({...q,ti:i}))});
document.title=GUIA.title;
$("#kick").textContent=GUIA.kicker;$("#ttl").textContent=GUIA.title;$("#lede").textContent=GUIA.desc;
$("#stats").innerHTML=[[T.length,"temas"],[allC.length,"tarjetas"],[allQ.length,"preguntas"]].map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
$("#toc").innerHTML=T.map((t,i)=>`<a href="#t${i+1}" data-i="${i}"><span>${String(i+1).padStart(2,"0")}</span>${esc(t.t)}</a>`).join("");
const list=(a)=>a&&a.length?`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
const tbl=t=>{if(!t||!t.length)return"";const rows=t.map(r=>r.split("¦"));return `<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
$("#temas").innerHTML=T.map((t,i)=>`<article class="tema" id="t${i+1}">
  <span class="num">Tema ${i+1} de ${T.length}</span><h2>${esc(t.t)}</h2>${t.intro?`<p class="intro">${t.intro}</p>`:""}
  ${t.res&&t.res.length?`<h3>Temario y conceptos</h3>${list(t.res)}`:""}${tbl(t.tabla)}
  ${t.hy&&t.hy.length?`<div class="box hy"><h3>Alto rendimiento para examen</h3>${list(t.hy)}</div>`:""}
  ${t.cl&&t.cl.length?`<div class="box cl"><h3>Correlación clínica</h3>${list(t.cl)}</div>`:""}
  <div class="tmeta">${(t.cards||[]).length?`<button type="button" data-c="${i}">${t.cards.length} tarjetas de este tema</button>`:""}${(t.quiz||[]).length?`<button type="button" data-q="${i}">${t.quiz.length} preguntas de este tema</button>`:""}</div>
</article>`).join("");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-30% 0px -60% 0px"}):null;
if(io)document.querySelectorAll(".tema").forEach(a=>io.observe(a));
/* pestañas */
function tab(id){document.querySelectorAll("nav.tabs button").forEach(b=>{const on=b.id==="tab-"+id;b.setAttribute("aria-selected",on);$("#"+b.getAttribute("aria-controls")).hidden=!on});window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>tab(b.id.slice(4))));
$("#temas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c){$("#cSel").value=b.dataset.c;tab("tarjetas");deck()}else if(b.dataset.q){$("#qSel").value=b.dataset.q;tab("examen")}});
const opts='<option value="all">Todos los temas</option>'+T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.t)}</option>`).join("");
$("#cSel").innerHTML=opts;$("#qSel").innerHTML=opts;
/* tarjetas */
let rep=new Set();try{rep=new Set(JSON.parse(localStorage.getItem(LS)||"[]"))}catch(e){}
const key=c=>c.f.slice(0,60);
const save=()=>{try{localStorage.setItem(LS,JSON.stringify([...rep]))}catch(e){}};
let D=[],ci=0,onlyRep=false;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(mix){const v=$("#cSel").value;D=allC.filter(c=>(v==="all"||c.ti==+v)&&(!onlyRep||rep.has(key(c))));if(mix)D=shuf(D);ci=0;showC()}
function showC(){const c=D[ci];$("#cBack").hidden=true;$("#cFront").hidden=false;
  if(!c){$("#cLbl").textContent="";$("#cF").textContent=onlyRep?"No hay tarjetas marcadas para repasar.":"Sin tarjetas.";$("#cCount").textContent="0 / 0";return}
  $("#cLbl").textContent=T[c.ti].t+(rep.has(key(c))?" · repasar":"");$("#cF").innerHTML=c.f;$("#cB").innerHTML=c.b;$("#cCount").textContent=(ci+1)+" / "+D.length}
function flip(){if(!D[ci])return;const b=$("#cBack").hidden;$("#cBack").hidden=!b;$("#cFront").hidden=b}
$("#card").addEventListener("click",flip);
$("#card").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
$("#cSel").addEventListener("change",()=>deck());
$("#cMix").addEventListener("click",()=>deck(true));
$("#cRep").addEventListener("click",()=>{onlyRep=!onlyRep;$("#cRep").classList.toggle("pri",onlyRep);deck()});
$("#cPrev").addEventListener("click",()=>{if(D.length){ci=(ci-1+D.length)%D.length;showC()}});
$("#cNext").addEventListener("click",()=>{if(D.length){ci=(ci+1)%D.length;showC()}});
$("#cOk").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.delete(key(c));save();if(onlyRep){deck()}else{ci=(ci+1)%D.length;showC()}});
$("#cNo").addEventListener("click",()=>{const c=D[ci];if(!c)return;rep.add(key(c));save();ci=(ci+1)%D.length;showC()});
document.addEventListener("keydown",e=>{if($("#panel-tarjetas").hidden||e.target.closest("select"))return;if(e.key==="ArrowRight")$("#cNext").click();if(e.key==="ArrowLeft")$("#cPrev").click()});
deck();
/* examen */
let Q=[],qi=0,good=0,miss=[];
$("#qGo").addEventListener("click",()=>{const v=$("#qSel").value,n=+$("#qN").value;Q=shuf(allQ.filter(q=>v==="all"||q.ti==+v));if(n)Q=Q.slice(0,n);qi=0;good=0;miss=[];if(!Q.length)return;$("#qStart").hidden=true;$("#qEnd").hidden=true;$("#qRun").hidden=false;showQ()});
function showQ(){const q=Q[qi];$("#qPos").textContent=`Pregunta ${qi+1} de ${Q.length}`;$("#qTema").textContent=T[q.ti].t;$("#qBar").style.width=(qi/Q.length*100)+"%";
  $("#qQ").innerHTML=q.q;$("#qE").hidden=true;$("#qNext").hidden=true;
  const ord=shuf(q.o.map((t,i)=>({t,i})));$("#qO").innerHTML=ord.map((o,k)=>`<button class="opt" type="button" data-i="${o.i}"><span>${"ABCDE"[k]}</span><div>${o.t}</div></button>`).join("")}
$("#qO").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[qi],ok=+b.dataset.i===q.a;
  document.querySelectorAll("#qO .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("good")});if(!ok){b.classList.add("wrong");miss.push(q)}else good++;
  $("#qE").hidden=false;$("#qE").innerHTML=(ok?"<b>Correcto.</b> ":"<b>Incorrecto.</b> ")+(q.e||"");$("#qNext").hidden=false;$("#qNext").textContent=qi+1<Q.length?"Siguiente →":"Ver resultado";$("#qNext").focus()});
$("#qNext").addEventListener("click",()=>{qi++;if(qi<Q.length)return showQ();$("#qRun").hidden=true;const p=Math.round(good/Q.length*100);
  $("#qEnd").hidden=false;$("#qEnd").innerHTML=`<div class="big">${p}%</div><p>${good} de ${Q.length} correctas · ${p>=75?"aprobado con la mínima UDLAP (7.5)":"aún por debajo de 7.5: repasa los temas de abajo"}</p>${miss.length?`<h3 style="font-family:var(--f-d)">Para repasar</h3><ul>${miss.map(q=>`<li><b>${esc(T[q.ti].t)}:</b> ${q.q}<br><small>Respuesta: ${q.o[q.a]}</small></li>`).join("")}</ul>`:""}<div class="cnav"><button class="btn pri" type="button" id="qAgain">Otro examen</button></div>`;
  $("#qAgain").addEventListener("click",()=>{$("#qEnd").hidden=true;$("#qStart").hidden=false})});
})();
</script>
</body></html>
