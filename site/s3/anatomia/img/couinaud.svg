<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="Helvetica,Arial,sans-serif"><rect width="700" height="460" fill="#fff"/><path d="M60,200 Q60,70 260,60 Q480,50 620,110 Q700,150 640,200 Q560,280 380,330 Q200,360 100,300 Q60,260 60,200Z" fill="#c9805e" stroke="#7a3b22" stroke-width="3"/><line x1="330" y1="55" x2="300" y2="345" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/><text x="335.0" y="48.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Línea de Cantlie (vesícula → VCI)</text><line x1="470" y1="70" x2="520" y2="270" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/><line x1="150" y1="90" x2="200" y2="330" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/><line x1="70" y1="200" x2="330" y2="185" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/><line x1="500" y1="175" x2="650" y2="160" stroke="#fff" stroke-width="2" stroke-dasharray="4 5"/><circle cx="110" cy="144" r="22" fill="#fff" fill-opacity=".9"/><text x="110.0" y="150.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">VII</text><circle cx="140" cy="259" r="22" fill="#fff" fill-opacity=".9"/><text x="140.0" y="265.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">VI</text><circle cx="245" cy="129" r="22" fill="#fff" fill-opacity=".9"/><text x="245.0" y="135.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">VIII</text><circle cx="245" cy="264" r="22" fill="#fff" fill-opacity=".9"/><text x="245.0" y="270.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">V</text><circle cx="400" cy="124" r="22" fill="#fff" fill-opacity=".9"/><text x="400.0" y="130.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">IVa</text><circle cx="395" cy="254" r="22" fill="#fff" fill-opacity=".9"/><text x="395.0" y="260.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">IVb</text><circle cx="560" cy="124" r="22" fill="#fff" fill-opacity=".9"/><text x="560.0" y="130.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">II</text><circle cx="560" cy="209" r="22" fill="#fff" fill-opacity=".9"/><text x="560.0" y="215.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">III</text><circle cx="330" cy="194" r="22" fill="#fff" fill-opacity=".9"/><text x="330.0" y="200.0" font-size="17" fill="#5a2410" text-anchor="middle" font-weight="bold">I</text><text x="200.0" y="390.0" font-size="15" fill="#7a3b22" text-anchor="middle" font-weight="bold">Hígado derecho: V–VIII</text><text x="500.0" y="390.0" font-size="15" fill="#7a3b22" text-anchor="middle" font-weight="bold">Hígado izquierdo: II–IV</text><text x="350.0" y="420.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">I = lóbulo caudado (drena directo a la VCI). Vista anterior esquemática. Cada segmento tiene su propia rama portal, arterial y biliar, y se reseca por separado.</text><text x="350.0" y="435.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Las venas suprahepáticas (líneas finas) separan los sectores; el plano portal separa arriba (VII, VIII, IVa, II) de abajo (VI, V, IVb, III).</text></svg>