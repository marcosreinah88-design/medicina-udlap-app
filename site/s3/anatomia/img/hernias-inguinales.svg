<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 535" width="680" height="535" font-family="Helvetica,Arial,sans-serif"><rect width="680" height="535" fill="#fff"/><text x="330.0" y="30.0" font-size="14" fill="#555" text-anchor="middle" font-weight="bold">Pared abdominal anterior vista desde dentro (lado derecho)</text><path d="M60,330 Q330,380 600,330" stroke="#b08850" stroke-width="7" fill="none"/><text x="330.0" y="385.0" font-size="13" fill="#7a5a20" text-anchor="middle" font-weight="normal">Ligamento inguinal</text><rect x="70" y="60" width="90" height="270" fill="#f3c7b8" stroke="#c0604a" stroke-width="2"/><text x="115" y="200" font-size="14" fill="#8a3324" text-anchor="middle" transform="rotate(-90 115 200)">Borde del recto abdominal</text><path d="M330,330 Q300,200 260,60" stroke="#c0392b" stroke-width="6" fill="none"/><text x="300.0" y="52.0" font-size="13" fill="#b3261e" text-anchor="middle" font-weight="normal">Vasos epigástricos inferiores</text><path d="M160,330 L160,150 Q230,250 318,330 Z" fill="#2b6cb0" fill-opacity=".14" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 4"/><text x="205.0" y="275.0" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Triángulo</text><text x="205.0" y="291.2" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">de Hesselbach</text><ellipse cx="420" cy="300" rx="34" ry="22" fill="#fff" stroke="#00573c" stroke-width="3"/><text x="420.0" y="250.0" font-size="13" fill="#00573c" text-anchor="middle" font-weight="bold">Anillo inguinal</text><text x="420.0" y="266.2" font-size="13" fill="#00573c" text-anchor="middle" font-weight="bold">profundo</text><line x1="545.0" y1="250.0" x2="461.3" y2="289.0" stroke="#f26b21" stroke-width="3" stroke-linecap="round"/><path d="M455.0,292.0 L461.7,284.6 L465.0,291.6Z" fill="#f26b21"/><text x="565.0" y="190.0" font-size="13" fill="#f26b21" text-anchor="middle" font-weight="bold">Hernia indirecta:</text><text x="565.0" y="206.2" font-size="13" fill="#f26b21" text-anchor="middle" font-weight="bold">lateral a los vasos,</text><text x="565.0" y="222.5" font-size="13" fill="#f26b21" text-anchor="middle" font-weight="bold">entra por el anillo profundo</text><line x1="110.0" y1="420.0" x2="200.2" y2="325.1" stroke="#7b3fa0" stroke-width="3" stroke-linecap="round"/><path d="M205.0,320.0 L201.5,329.4 L195.8,324.0Z" fill="#7b3fa0"/><text x="110.0" y="440.0" font-size="13" fill="#7b3fa0" text-anchor="start" font-weight="bold">Hernia directa: medial a los vasos,</text><text x="110.0" y="456.2" font-size="13" fill="#7b3fa0" text-anchor="start" font-weight="bold">empuja la fascia transversalis (Hesselbach)</text><text x="330.0" y="500.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Hesselbach = borde del recto (medial) · vasos epigástricos inferiores (lateral) · ligamento inguinal (inferior).</text><text x="330.0" y="515.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Femoral: por debajo del ligamento inguinal, medial a la vena femoral (más en mujeres).</text></svg>