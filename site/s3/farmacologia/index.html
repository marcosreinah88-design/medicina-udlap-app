<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Farmacología Básica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../fonts/g457e47a285.css">
<style>
/* Layout: a study bench. Fixed unit index on the left (chips on phones), one unit open at a time
   with three modes (Resumen / Tarjetas / Quiz). Each unit header reads like a pharmacy label. */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFED; --ink:#122A2C; --muted:#526A6B; --line:#D3DEDB;
  --amber:#B1530C; --amber-soft:#FBEADB; --teal:#1C6B66; --teal-soft:#DCEEEB;
  --good:#1D7A43; --good-soft:#DDF2E4; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(18,42,44,.06), 0 6px 18px rgba(18,42,44,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D1516; --surface:#142021; --surface-2:#1B2A2C; --ink:#E1EBE9; --muted:#93A8A7; --line:#27393B;
  --amber:#EE9A55; --amber-soft:#3A2414; --teal:#62BDB3; --teal-soft:#16302E;
  --good:#5CC58A; --good-soft:#15301F; --bad:#F2877C; --bad-soft:#3A1915;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0D1516; --surface:#142021; --surface-2:#1B2A2C; --ink:#E1EBE9; --muted:#93A8A7; --line:#27393B;
  --amber:#EE9A55; --amber-soft:#3A2414; --teal:#62BDB3; --teal-soft:#16302E;
  --good:#5CC58A; --good-soft:#15301F; --bad:#F2877C; --bad-soft:#3A1915;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
a{color:var(--teal)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 60px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:6px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex:1 1 280px;min-width:0}
.brand .rx{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--amber);letter-spacing:-.02em}
.brand h1{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.015em}
.brand small{display:block;color:var(--muted);font-size:13px;font-family:var(--f-body)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{width:140px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:inherit;color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}

/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
.index .grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px 10px}
.index button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:14.5px}
.index button:hover{background:var(--surface-2)}
.index button[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.index .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:30px}
.index .tick{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.index .tick.on{background:var(--good);border-color:var(--good)}
.index .tick.on::after{content:"";display:block;width:5px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translate(4.5px,2px) rotate(45deg)}
.index .special{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}

/* unit label */
.label{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.label-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 18px;background:var(--teal);color:var(--surface);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
:root[data-theme="dark"] .label-top{color:#0D1516}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .label-top{color:#0D1516} }
.label-top .sp{flex:1}
.label-body{padding:18px 18px 16px;display:grid;gap:10px}
.label-body h2{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.label-body p.lead{margin:0;color:var(--muted);max-width:68ch}
.label-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px dashed var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:99px;cursor:pointer;font-family:var(--f-body);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.btn{font-family:var(--f-body);border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn.on{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}

/* content */
.key{background:var(--amber-soft);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.key h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.key ul{margin:0;padding-left:20px;display:grid;gap:4px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.sec-body{padding:0 18px 18px;max-width:none}
.sec-body p,.sec-body li{max-width:75ch}
.sec-body ul,.sec-body ol{padding-left:22px;margin:8px 0;display:grid;gap:4px}
.sec-body h4{font-size:15px;margin:16px 0 4px;color:var(--teal)}
.mark{background:var(--amber-soft);padding:0 4px;border-radius:4px}
.def{border-left:3px solid var(--teal);background:var(--teal-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.note{font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
.note b{color:var(--ink)}
.mono{font-family:var(--f-mono);font-size:.92em}
.formula{font-family:var(--f-mono);background:var(--surface-2);padding:10px 14px;border-radius:8px;display:inline-block;margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:10px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);min-width:0}
.tile h5{margin:0 0 4px;font-family:var(--f-display);font-size:15.5px}
.tile p{margin:0;font-size:14.5px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:13.5px}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--teal-soft);color:var(--teal)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.g{background:var(--good-soft);color:var(--good)}
.dose{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:5px;white-space:nowrap}

/* tools */
.tool{border:2px solid var(--teal);border-radius:12px;padding:14px 16px;margin:14px 0;background:var(--surface)}
.tool h4{margin:0 0 8px;color:var(--teal);font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:140px}
.out{font-family:var(--f-mono);font-size:15px;background:var(--teal-soft);border-radius:8px;padding:10px 12px;margin-top:10px}
.meter{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px;display:flex}
.meter i{display:block;height:100%}
.ex{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--paper)}
.ex p{margin:0 0 8px}
.sol{margin-top:8px;font-family:var(--f-mono);font-size:13.5px;white-space:pre-wrap;background:var(--surface);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
.nq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--surface);font-weight:700}

/* flashcards */
.fc-wrap{display:grid;gap:14px;justify-items:center}
.fc{width:min(620px,100%);min-height:240px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;padding:28px;text-align:center;font-size:19px;overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--teal-soft);font-size:16.5px;text-align:left;place-items:center start}
.fc-face .tag{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fc-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.fc-count{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:70px;text-align:center}

/* quiz */
.quiz{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.q .qh{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.q .qt{font-weight:700;font-size:16.5px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;cursor:pointer;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;font-size:14.5px;color:var(--muted)}
.expl b{color:var(--ink)}
.score{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.score strong{font-family:var(--f-display);font-size:22px}
.src{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

/* search results */
.results{display:grid;gap:8px}
.res{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer}
.res b{font-family:var(--f-display)}
.res span{display:block;font-size:13.5px;color:var(--muted)}
mark{background:var(--amber-soft);color:var(--ink);border-radius:3px;padding:0 2px}

/* home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ucard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.ucard:hover{border-color:var(--teal)}
.ucard .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.ucard h3{font-size:18px}
.ucard p{margin:0;font-size:13.5px;color:var(--muted)}
.hero-note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:18px}
.hero-note p{margin:6px 0 0;color:var(--muted);max-width:70ch}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.index{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
  .index .grp{display:none}
  .index button{width:auto;flex:none;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .index .tick{margin-left:4px}
  .index .num{min-width:0}
  .index .special{margin:0;border:0;padding:0;display:flex;gap:6px}
  .hero-note{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="rx" aria-hidden="true">℞</span><div><h1>Farmacología Básica</h1><small>Resumen interactivo de las 13 presentaciones del curso</small></div></div>
    <div class="progress" title="Unidades marcadas como estudiadas"><div class="bar"><i id="pbar" style="width:0"></i></div><span id="ptext">0 de 13 estudiadas</span></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar: pKa, Naranjo, atropina…" aria-label="Buscar en el resumen"></label>
  </header>
  <div class="layout">
    <nav class="index" id="index" aria-label="Unidades"></nav>
    <main id="main" aria-live="polite"></main>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const T=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const UL=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const D=(t)=>`<div class="def">${t}</div>`;
const N=(t)=>`<div class="note">${t}</div>`;
const tiles=a=>`<div class="grid2">${a.map(([h,p])=>`<div class="tile"><h5>${h}</h5><p>${p}</p></div>`).join("")}</div>`;
const dose=t=>`<span class="dose">${t}</span>`;

/* ---------- content ---------- */
const UNITS=[
{ id:"generalidades", n:"1", title:"Generalidades de la farmacología", group:"Bases", slides:50,
  lead:"Qué estudia la farmacología, cómo se clasifican los fármacos, formas farmacéuticas e historia de la disciplina.",
  key:["Farmacología: del griego <i>pharmakos</i> (droga) y <i>logos</i> (estudio). Es una ciencia experimental.",
       "Farmacodinamia = lo que el fármaco le hace al organismo; Farmacocinética = procesos LADME.",
       "Acciones farmacológicas: estimulación, depresión, irritación, reemplazo y antiinfecciosas.",
       "Paracelso, patriarca de la farmacología: «solo la dosis convierte a una cosa en veneno»."],
  sections:[
   ["Definición y conceptos",`
    <p><b>Etimología:</b> <i>pharmakos</i> = droga, <i>logos</i> = estudio.</p>
    ${D("<b>Farmacología:</b> ciencia experimental que estudia los cambios experimentados por los seres vivos a causa de sustancias químicamente activas (con excepción de los alimentos) usadas con propósito terapéutico.")}
    ${tiles([["Drogas","Fármacos de abuso."],["Venenos o tóxicos","Sustancias dañinas sin efecto terapéutico ni diagnóstico; también medicamentos en dosis altas."],["Farmacodinamia","Acciones y efectos sobre los distintos sistemas y su mecanismo de acción."],["Farmacocinética","Estudia los procesos LADME: liberación, absorción, distribución, metabolismo y eliminación."]])}
    ${N("<b>Fármaco vs. medicamento:</b> la diapositiva deja la pregunta abierta para la clase. Complemento de libro: el <i>fármaco</i> es el principio activo; el <i>medicamento</i> es el fármaco ya formulado (con excipientes) en una forma farmacéutica lista para administrarse.")}`],
   ["Formas farmacéuticas",`
    ${D("<b>Forma farmacéutica:</b> presentación en la que se encuentra elaborado un fármaco para facilitar su suministro al organismo por las diferentes vías de administración.")}
    ${T(["Sólidas","Semisólidas","Líquidas","Gaseosas"],[["Cápsulas (duras o blandas), comprimidos, tabletas, polvos, granulados, liofilizados, óvulos, supositorios, píldoras","Pastas dérmicas, cremas, ungüentos, geles, pomadas, jaleas, emplastos","Soluciones, jarabes, gotas, emulsiones, suspensiones, inyecciones, colirios","Gases medicinales, espumas, nebulizadores, inhaladores de polvo, aerosoles"]])}
    <h4>Sistemas de liberación modificada</h4>
    ${UL(["<b>Parche cutáneo:</b> el fármaco difunde a través de una membrana que controla la velocidad de absorción por la piel.","<b>Comprimido de liberación modulada:</b> núcleo recubierto por una membrana semipermeable; el agua entra y la solución del fármaco sale por pequeños orificios."])}`],
   ["Clasificación de la farmacología y de los fármacos",`
    <p><b>Farmacología:</b> preclínica o experimental (animales, laboratorio) y clínica (humanos).</p>
    <h4>Clasificación de fármacos</h4>
    ${UL(["<b>Acciones moleculares:</b> según el sitio de acción (p. ej. IECA y ARA II en el sistema renina-angiotensina; antibióticos según actúen sobre pared, ADN, ribosomas, etc.).","<b>Acciones farmacoterapéuticas:</b> antibióticos, diuréticos, laxantes, analgésicos.","<b>Acciones farmacológicas</b> (ver tabla).","<b>Otras:</b> origen, efecto sobre la enfermedad, venta o distribución."])}
    ${T(["Acción farmacológica","Qué hace","Ejemplo de clase"],[["Estimulación","Aumenta funciones","Algunos hipoglucemiantes"],["Depresión","Disminuye funciones","Omeprazol"],["Irritación","Estimulación violenta: reacción inflamatoria y caída del tejido","Queratolíticos"],["Reemplazo","Sustituye un compuesto que falta en el organismo","Insulina"],["Antiinfecciosa","Elimina o atenúa microorganismos o parásitos","Antibióticos"]])}
    ${tiles([["Por origen","Naturales, sintéticos, semisintéticos."],["Por efecto sobre la enfermedad","Curativos, paliativos, preventivos."],["Por venta o distribución","Restrictivos a farmacias (sin receta / con receta) y otros establecimientos."]])}`],
   ["Medicina alternativa y «farmacia de la naturaleza»",`
    <p>Se mencionan: acupuntura, homeopatía, ayurveda (doshas Vata, Pitta, Kapha), drenaje linfático y fitoterapia.</p>
    <p>La sección «farmacia de la naturaleza» presenta alimentos que se parecen al órgano que supuestamente benefician: jitomate (licopeno) y corazón, nuez y cerebro, frijol y riñón, apio/ruibarbo/col china y hueso, aguacate/berenjena/pera y útero, higos y fertilidad masculina, camote y páncreas, cítricos y glándula mamaria, cebolla y células.</p>
    ${N("Estas diapositivas son ejemplos populares para discutir en clase; no son evidencia farmacológica.")}`],
   ["Historia de la farmacología",`
    ${T(["Etapa","Hitos"],[
      ["<b>Empírica</b>","<b>Código de Hammurabi</b> (castigo a la mala praxis). <b>Papiro de Ebers</b>: enfermedades curables e incurables, ~700 remedios con su preparación e indicación (los egipcios ya usaban pan mohoso; Fleming describe la penicilina en 1928)."],
      ["<b>Científica y técnica</b>","<b>Hipócrates</b>: «Más vale prevenir que curar»; teoría de los humores (sangre, flema, bilis amarilla, bilis negra). <b>Árabes</b>: separan la farmacología de la medicina y otras ciencias. <b>Galeno</b>: libros con flores secas, medicamentos naturistas."],
      ["<b>Edad media</b>","<b>Paracelso</b>, patriarca de la farmacología: «Todas las cosas son venenosas porque no existe nada sin esta cualidad; solo la dosis es lo que convierte a una cosa en veneno.» Intercambio de remedios con América."],
      ["<b>Ciencia (1840…)</b>","Farmacología experimental: aspirina (Bayer), antibióticos (Fleming), modelos animales."],
      ["<b>Tecnología genética</b>","Fármacos biotecnológicos (tabla siguiente)."]])}
    ${T(["Grupo","Ejemplos"],[["Insulinas","Aspart, lispro, glargina"],["Factores de coagulación","Factor VII, factor IX"],["Fibrinolíticos","Alteplasa, reteplasa"],["Hormonas y factores de crecimiento","Somatotropina, becaplermina, tasonermina (TNF-1α)"],["Citocinas","Interferón alfa-2b, IFN beta-1a, beta-1b, gamma-1b"],["Anticuerpos","Infliximab, etanercept"]])}`],
   ["Primeros fármacos (línea de tiempo)",`
    ${T(["Año","Fármaco"],[["1849","Nitroglicerina"],["1899","Ácido acetilsalicílico"],["1903","Fenobarbital"],["1936","Insulina; quimioterapéuticos contra infecciones bacterianas"],["1940–46","Antihistamínicos H1"],["1944","Estreptomicina (tuberculostático)"],["1945","Cloroquina (antimalárico)"],["1954","Nistatina (antimicótico)"],["1956","Carbutamida (antidiabético oral)"],["1958","Imipramina (antidepresivo)"],["1960","Penicilinas semisintéticas; clordiazepóxido (benzodiacepinas)"],["1963","Clofibrato (hipolipemiante)"],["1964","Cefalotina (cefalosporina parenteral)"],["1971","Miconazol (antimicótico)"],["1976","Nifedipino (antagonista del calcio)"],["1980","Captopril (IECA)"],["1981","Aciclovir (antiherpético)"],["1982","Insulina humana recombinante"],["1984","Enalapril (IECA)"],["1987","Lovastatina; zidovudina (inhibidor de transcriptasa reversa del VIH)"],["1989","Omeprazol (inhibidor de la bomba de protones)"],["1992","Didanosina (antirretroviral)"],["1994","Losartán (antagonista de angiotensina II)"],["1996","Saquinavir (inhibidor de proteasa del VIH-1)"]])}
    <h4>Efectos secundarios que dieron origen a nuevos fármacos</h4>
    ${T(["Fármaco original","Efecto secundario","Fármaco desarrollado"],[["Sulfonamidas antibacterianas","Baja la glucosa sanguínea","Antidiabéticos orales"],["Sulfonamidas antibacterianas","Diuresis","Hidroclorotiazida (diurético)"],["Amrinona (inotrópico +)","Erecciones","Sildenafil, vardenafil"]])}
    <p><b>Historias de medicamentos para exponer:</b> insulina, vacuna de la viruela (Jenner, 1789: las lecheras que contraían la viruela de las vacas no enfermaban de viruela; fue la primera vacuna), captopril y curares.</p>
    <p><b>Actividad de vías de administración</b> (IM, inhalatoria, rectal, SC, IV, ótica, intraósea, tópica, sublingual, oftálmica): procedimiento correcto, ventajas, desventajas y medicamentos que se usan con más frecuencia.</p>`]
  ],
  cards:[["¿De dónde viene la palabra farmacología?","Del griego <i>pharmakos</i> (droga) + <i>logos</i> (estudio)."],["Define veneno o tóxico","Sustancia dañina sin efecto terapéutico ni diagnóstico; también un medicamento en dosis altas."],["¿Qué estudia la farmacocinética?","Los procesos LADME: liberación, absorción, distribución, metabolismo y eliminación."],["Acción farmacológica de reemplazo: ejemplo","Insulina: sustituye un compuesto que falta en el organismo."],["Acción farmacológica de depresión: ejemplo","Omeprazol (disminuye funciones)."],["¿Qué aportó el Papiro de Ebers?","Clasificó enfermedades en curables e incurables y reunió ~700 remedios con su preparación e indicación."],["¿Quién es el patriarca de la farmacología?","Paracelso: «solo la dosis convierte a una cosa en veneno»."],["Sulfonamidas → ¿qué fármacos surgieron de sus efectos secundarios?","Antidiabéticos orales (hipoglucemia) e hidroclorotiazida (diuresis)."],["¿De qué efecto secundario de la amrinona surgió el sildenafil?","Erecciones."],["Clasificación por efecto sobre la enfermedad","Curativos, paliativos y preventivos."]],

   {q:"¿Qué pueblo separó la farmacología de la medicina?",o:["Egipcios","Griegos","Árabes","Babilonios"],a:2,e:"Los árabes la separaron de la medicina y otras ciencias."},
   {q:"El omeprazol se introdujo en:",o:["1976","1984","1989","1996"],a:2,e:"1989, inhibidor de la bomba de protones."},

{ id:"farmacocinetica", n:"2", title:"Farmacocinética", group:"Bases", slides:47,
  lead:"Factores que determinan la concentración del fármaco en cada punto del organismo: absorción, distribución, metabolismo y excreción.",
  key:["Biodisponibilidad: fracción del fármaco que llega a la circulación sistémica sin modificaciones químicas.","pKa: pH en el que el 50 % del fármaco está ionizado; cuanto más bajo, más ácido. Solo la forma no ionizada cruza membranas por difusión.","El efecto de primer paso hepático reduce lo que llega a circulación sistémica; por eso se buscan otras vías o profármacos.","Fase I (oxidación, reducción, hidrólisis; CYP450) y fase II (conjugación).","PM < 300 se excreta por riñón; PM > 500 por bilis."],
  sections:[
   ["Concepto y vías de administración",`
    ${D("<b>Farmacocinética:</b> estudia los factores que determinan la concentración de los fármacos en distintos puntos del organismo (ADME).")}
    ${T(["Grupo","Vías"],[["Enteral / mucosas","Oral, sublingual"],["Tópica","Dérmica; instilaciones e irrigaciones (ótica, nasal, ocular, rectal, vaginal); inhalatoria"],["Parenteral","Intradérmica, subcutánea, intramuscular, intravenosa"]])}`],
   ["Absorción y transporte a través de membranas",`
    ${D("<b>Absorción:</b> transferencia del fármaco desde el sitio en que se administra hasta el torrente sanguíneo.")}
    <p>El fármaco puede (1) actuar en el sitio de aplicación (<b>efecto local</b>) o (2) alcanzar la sangre (<b>efecto sistémico</b>).</p>
    ${tiles([["Difusión pasiva","A favor de gradiente, por un poro acuoso (hidrosolubles) o disuelto en los lípidos de la membrana (liposolubles)."],["Difusión facilitada","Usa un transportador, sin gasto de energía."],["Transporte activo","Transportador con gasto de ATP, puede ir contra gradiente."],["Endocitosis","Para fármacos de gran tamaño (p. ej. vitamina B12)."]])}
    <h4>Factores del medicamento</h4>
    ${UL(["Tamaño molecular y lipofilia/hidrofilia","pKa (grado de ionización)","Galénica (forma farmacéutica)"])}
    <h4>Factores fisiológicos</h4>
    ${UL(["Superficie de absorción","pH","Motilidad gastrointestinal (tiempo de paso)","Componentes de la alimentación","Otros fármacos","Enfermedades","Flora bacteriana"])}
    <p><b>¿Con o sin alimentos?</b> Las tabletas de D-penicilamina alcanzan concentraciones mucho más altas con el estómago vacío que después de comer.</p>`],
   ["pKa y ecuación de Henderson-Hasselbalch",`
    ${D("<b>Henderson-Hasselbalch:</b> determina la cantidad de fármaco que se encuentra a cada lado de la membrana.")}
    <div class="formula">Ácidos: pH = pKa + log [A⁻]/[HA]</div><br><div class="formula">Bases: pH = pKa + log [B]/[BH⁺]</div>
    ${UL(["<b>Grado de ionización:</b> fuerza que tienen las moléculas de disociarse.","<b>pKa = −log Ka</b>: potencia de interacción entre un compuesto y un protón.","pKa = pH en el cual el 50 % del fármaco está ionizado. <b>Entre más bajo el pKa, más ácido.</b>","Ácido débil: HA ⇌ H⁺ + A⁻. Base débil: BH⁺ ⇌ B + H⁺. Solo HA y B (no ionizadas) atraviesan la membrana lipídica."])}
    <p><b>Ejemplo de clase, naproxeno (pKa 5.0):</b> en jugo gástrico (pH 2) por cada 1 de HA hay 0.001 de A⁻ (total 1.001); en plasma (pH 7.4) por cada 1 de HA hay 251 de A⁻ (total 252). Los fármacos ácidos se concentran en la circulación.</p>
    <div class="tool" id="hh"></div>
    <p class="src">pKa de la tabla de clase: amoxicilina 2.4 · ampicilina 2.5 · aspirina 3.5 · ácido salicílico 3.0 · warfarina 5.0 · tolbutamida 5.3 · fenitoína 8.3 · teofilina 8.8 | bases: pilocarpina 6.9 · morfina 7.9 · lidocaína 7.9 · codeína 8.2 · metadona 8.4 · imipramina 9.5 · atropina 9.7 · anfetamina 9.8 · metoprolol 9.8</p>`],
   ["Primer paso, profármacos y biodisponibilidad",`
    <p><b>Efecto del primer paso:</b> lo absorbido por vía oral pasa por la circulación portal al hígado antes de llegar a la circulación sistémica; disminuye la cantidad que llega. Consecuencia: búsqueda de vías alternas de administración (sublingual, IV) y de <b>profármacos</b> (inactivos hasta metabolizarse; p. ej. <b>pivampicilina → ampicilina</b>).</p>
    ${D("<b>Biodisponibilidad:</b> fracción de fármaco administrado que logra acceder a la circulación sistémica sin modificaciones químicas.")}
    <p>En vía <b>SC/IM</b> la biodisponibilidad está limitada por la degradación del fármaco en el tejido.</p>`],
   ["Distribución y barreras",`
    ${D("<b>Distribución:</b> proceso por el cual un compuesto deja el torrente sanguíneo y entra a las células o al tejido intersticial. Una vez en el organismo puede distribuirse en cualquier compartimento.")}
    ${T(["Factor","Qué recordar"],[["1. Flujo sanguíneo","Mayor hacia cerebro, hígado y riñón que hacia músculo esquelético; el tejido adiposo recibe aún menos. Velocidad variable por la distribución desigual del gasto cardiaco."],["2. Estructura del fármaco","Capacidad de cruzar membranas: pH, pKa, carácter hidrofílico o hidrofóbico."],["3. Permeabilidad capilar","Barreras (abajo)."],["4. Unión a proteínas plasmáticas","Albúmina, globulinas, hemoglobina. El fármaco unido no difunde y su salida del compartimento vascular se retrasa."]])}
    ${T(["Barrera","Permeabilidad"],[["Intestino delgado","Membrana lipídica con poros: pasan partículas lipófilas, muy poco las hidrófilas."],["Placenta","Membrana lipídica con muchos poros pequeños: poco traspasable por moléculas grandes; las de 250 a 500 de peso molecular sí atraviesan."],["Hematoencefálica","Solo moléculas lipófilas, no ionizadas. Transportadores especiales para glucosa y aminoácidos."],["Sangre-leche","Membrana lipídica con poros: pasan lipófilas e hidrófilas; las lipófilas se acumulan."]])}
    ${N("La diapositiva de placenta dice «250 a 500 kDa»; en los libros este límite se expresa en daltons (Da), no en kilodaltons.")}
    <p><b>Contraindicados en lactancia:</b> ciclosporina, ergotamina, metotrexato, drogas de abuso.</p>`],
   ["Metabolismo (biotransformación) y CYP450",`
    ${D("<b>Biotransformación:</b> transformaciones metabólicas que sufre el fármaco a lo largo de su paso por el organismo.")}
    <p><b>Factores que la afectan:</b> edad; sexo (las mujeres son más sensibles al etanol); raza (acetiladores rápidos y lentos de isoniazida; acetiladores rápidos: esquimales ~50 %, británicos 13 %, finlandeses 13 %); condición fisiológica.</p>
    ${T(["Fase I (no sintética)","Fase II (sintética, conjugación)"],[["Cambios en la estructura: oxidación, reducción, hidrólisis. Puede <b>activar o inactivar</b>. Oxidasas y oxigenasas; la oxigenasa más importante es el <b>citocromo P450</b> (monooxigenasas).","Conjugación con ácido glucurónico, glutatión (citosol, microsomas), sulfato, acetilación, glicina (mitocondrias; p. ej. ácido salicílico). Los conjugados se excretan por hígado, intestino y riñón."]])}
    <h4>Citocromo P450: superfamilia de hemoproteínas</h4>
    ${T(["Isoenzima","Sustratos","Inhibidores","Inductores"],[["CYP1A2","Teofilina, cafeína, verapamilo, clozapina, imipramina, propranolol, haloperidol, mexiletina","Fluoroquinolonas, cimetidina, fluvoxamina, verapamilo","Omeprazol, humo de tabaco"],["CYP2C8","Tolbutamida, verapamilo","Verapamilo","Rifampicina"],["CYP2C9","Warfarina, fenitoína, tolbutamida, diclofenaco, piroxicam, ibuprofeno, tamoxifeno, torasemida, carbamazepina, ciclofosfamida","Verapamilo, fluconazol, isoniazida","Rifampicina"],["CYP2C19","Mefenitoína, omeprazol, lansoprazol, diazepam, proguanil","Cimetidina","Rifampicina, prednisona"],["CYP2E1","Etanol, enflurano, halotano","Disulfiram","Isoniazida, etanol"],["CYP3A4","Ciclosporina, claritromicina, eritromicina, verapamilo, midazolam, diltiazem, nifedipino, felodipino, lidocaína, astemizol","Ketoconazol, fluconazol, itraconazol, eritromicina, claritromicina, amiodarona, cimetidina","Rifampicina, fenitoína, carbamazepina, barbitúricos"]])}`],
   ["Excreción",`
    ${UL(["<b>PM &lt; 300 → riñón</b>; <b>PM &gt; 500 → bilis</b> (vesícula).","El riñón es el principal órgano de eliminación; la eliminación se correlaciona con su capacidad funcional.","Otras vías: respiratoria, sudor, leche materna.","<b>Eliminación hepática</b> depende de la perfusión sanguínea y de la masa celular hepática funcional.","Hacia la bilis van fármacos polares (por naturaleza o por biotransformación) y de PM elevado (&gt; 500–600, p. ej. conjugados)."])}`]
  ],
  cards:[["Define absorción","Transferencia del fármaco desde su sitio de administración hasta el torrente sanguíneo."],["Define biodisponibilidad","Fracción del fármaco administrado que llega a la circulación sistémica sin modificaciones químicas."],["¿Qué es el pKa?","El pH en el que el 50 % del fármaco está ionizado (−log Ka). Más bajo = más ácido."],["Ecuación de H-H para ácidos","pH = pKa + log [A⁻]/[HA]"],["¿Dónde se concentra un ácido débil como el naproxeno (pKa 5)?","En el plasma (pH 7.4), donde se ioniza y queda atrapado: 252 vs 1.001 en jugo gástrico."],["Ejemplo de profármaco visto en clase","Pivampicilina → ampicilina."],["¿Qué barrera solo deja pasar moléculas lipófilas no ionizadas?","La barrera hematoencefálica (con transportadores para glucosa y aminoácidos)."],["4 fármacos contraindicados en lactancia","Ciclosporina, ergotamina, metotrexato y drogas de abuso."],["Reacciones de fase I","Oxidación, reducción, hidrólisis (activan o inactivan)."],["Inductor clásico de casi todos los CYP en la tabla","Rifampicina."],["Inhibidores de CYP3A4","Ketoconazol, fluconazol, itraconazol, eritromicina, claritromicina, amiodarona, cimetidina."],["Regla de peso molecular para la excreción","PM < 300 → riñón; PM > 500 → bilis."]],
  quiz:[
   {q:"Un fármaco con pKa más bajo es:",o:["Más básico","Más ácido","Más liposoluble siempre","Menos ionizable"],a:1,e:"Entre más bajo el pKa, más ácido."},
   {q:"¿Qué proceso NO usa transportador?",o:["Difusión facilitada","Transporte activo","Difusión pasiva","Ninguno"],a:2,e:"La difusión pasiva va a favor de gradiente, por poros o a través de lípidos."},
   {q:"El humo del tabaco es inductor de:",o:["CYP2E1","CYP1A2","CYP3A4","CYP2C9"],a:1,e:"CYP1A2: inductores omeprazol y humo de tabaco."},
   {q:"El disulfiram inhibe la isoenzima:",o:["CYP2E1","CYP2C19","CYP3A4","CYP1A2"],a:0,e:"CYP2E1 (sustratos: etanol, enflurano, halotano)."},
   {q:"Un fármaco de PM 650 se excreta principalmente por:",o:["Riñón","Bilis","Pulmón","Sudor"],a:1,e:"PM > 500 → bilis."},
   {q:"¿Hacia qué tejido es menor el flujo sanguíneo?",o:["Cerebro","Riñón","Músculo esquelético","Tejido adiposo"],a:3,e:"El adiposo recibe aún menos flujo que el músculo."},
   {q:"La conjugación con glicina ocurre en:",o:["Citosol","Mitocondrias","Microsomas","Núcleo"],a:1,e:"Glicina en mitocondrias (ác. salicílico); glutatión en citosol y microsomas."}]
},
{ id:"farmacodinamia", n:"3", title:"Farmacodinamia", group:"Bases", slides:28,
  lead:"Qué hacen los fármacos sobre el organismo: dianas, receptores, curvas dosis-respuesta, eficacia, potencia y tipos de antagonismo.",
  key:["Secuencia: interacción fármaco-receptor → transducción de señal → efecto farmacológico.","KD: concentración de fármaco libre a la que el 50 % de los receptores están ocupados; mide la afinidad.","Eficacia = efecto máximo (lo más importante en terapia). Potencia = EC50 (menos importante).","Agonista estimula; antagonista bloquea; agonista parcial no alcanza el efecto máximo aunque ocupe todos los receptores."],
  sections:[
   ["Concepto y dianas terapéuticas",`
    ${D("<b>Farmacodinamia:</b> estudia qué hacen los fármacos sobre el organismo; acciones y efectos sobre los distintos sistemas y su mecanismo de acción.")}
    <p>Estudiar las acciones de fármacos como AAS, captopril, penicilina, furosemida o codeína <b>permite elegir el fármaco</b>.</p>
    <p><b>Pasos:</b> 1. Interacción fármaco-receptor → 2. Transducción de señal → 3. Efecto farmacológico.</p>
    <p><b>Dianas terapéuticas:</b> enzimas, receptores, metabolitos, ADN, proteínas estructurales. Los receptores pueden estar en membrana externa, citoplasma o núcleo.</p>`],
   ["Tipos de receptores",`
    ${tiles([["1. Asociados a canal iónico","Señalización rápida."],["2. Con actividad enzimática","Normalmente con sitio extracelular para la unión."],["3. Asociados a proteína G","Regulan indirectamente la actividad de una enzima o canal en la membrana."]])}
    ${T(["Grupo","Ejemplos","Canal","Efecto","Indicación"],[["Antagonistas del Ca²⁺","Verapamilo, nifedipino, diltiazem","Canales de Ca²⁺","Inhibición","Corazón, circulación"],["Antidiabéticos orales","Tolbutamida, carbutamida, glibenclamida","Canales de K⁺ ATP-dependientes","Inhibición","Diabetes mellitus"],["Benzodiacepinas","Diazepam, flunitrazepam","Canales de Cl⁻ activados por GABA","Estimulación","Miedos, ansiedad, problemas de sueño"],["Anestésicos locales y antiarrítmicos","Lidocaína, procainamida, quinidina","Canales de Na⁺","Bloqueo","Anestesia local, problemas de ritmo cardiaco"],["Relajantes musculares","Tubocurarina, pancuronio","Canales activados por ACh","Bloqueo","Relajación muscular"],["Diuréticos","Amilorida, triamtereno","Canales epiteliales de Na⁺","Bloqueo","Edema"]])}`],
   ["Especificidad y tipos de unión",`
    ${D("<b>Especificidad:</b> selectividad con la que un fármaco se une a un receptor determinado y no a otro. Es recíproca. Ningún fármaco tiene una acción totalmente específica: puede actuar sobre varias dianas (de ahí efectos adversos, pero también nuevos usos).")}
    ${T(["Uniones reversibles","Uniones irreversibles"],[["Interacciones iónicas (cargas opuestas), puentes de hidrógeno, interacciones hidrofóbicas, fuerzas de Van der Waals (dipolo-dipolo)","Enlaces covalentes: citostáticos (teratógenos, cancerígenos, inmunógenos)"]])}`],
   ["Afinidad, curvas dosis-respuesta, eficacia y potencia",`
    <div class="formula">KD = [P]·[R] / [complejo P-R]</div>
    ${UL(["<b>KD (constante de disociación):</b> concentración de fármaco libre a la cual la mitad de los receptores están ocupados. Es la medida de la afinidad (a menor KD, mayor afinidad).","Ecuación del efecto: <span class='mono'>E = Emax · C / (EC50 + C)</span>; ED50 = dosis efectiva 50.","La curva concentración-respuesta es una <b>hipérbola</b>; con log de la concentración se vuelve <b>sigmoide</b>."])}
    ${T(["","Eficacia","Potencia"],[["Qué mide","Fuerza del efecto; efecto máximo","Cantidad necesaria para el efecto; se mide con la EC50"],["Importancia terapéutica","Importante","Menos importante"]])}
    <p><b>Seguridad (pendiente de la curva):</b> indica cuánto hay que variar la dosis para modificar la respuesta. Una pendiente pronunciada significa que un pequeño incremento de dosis produce un gran cambio en la respuesta.</p>`],
   ["Agonistas, antagonistas y sinergismo",`
    ${tiles([["Agonista","Produce un efecto estimulando al receptor."],["Antagonista","Bloquea al receptor; reduce o elimina el efecto de los agonistas."],["Agonista parcial","El receptor tiene dos conformaciones (R y R'). Aunque ocupe todos los receptores, el efecto es menor al máximo."]])}
    <h4>Tipos de antagonismo</h4>
    ${UL(["<b>Competitivo</b>","<b>No competitivo:</b> funcional/fisiológico, químico, alostérico, farmacocinético"])}
    <h4>Sinergismo</h4>

{ id:"rams", n:"4", title:"Reacciones adversas a medicamentos (RAM)", group:"Seguridad", slides:25,
  lead:"Definición de RAM, efecto secundario vs colateral, reacciones idiosincrásicas y alérgicas, susceptibilidad y teratogenicidad.",
  key:["RAM (OMS): reacción nociva no intencionada a dosis normalmente usadas en humanos.","Efecto secundario: por la acción primaria del fármaco. Efecto colateral: parte de la acción farmacológica, en otro órgano o sistema.","Categorías FDA en embarazo: A (sin riesgo), B, C, D, X (contraindicado).","Warfarina: máxima sensibilidad entre las semanas 6 y 12; talidomida (1957) es el ejemplo histórico."],
  sections:[
   ["Definición",`
    ${D("<b>RAM:</b> «Respuesta nociva y no intencionada a un medicamento».<br><b>OMS:</b> «Cualquier reacción nociva no intencionada que aparece a <span class='mark'>dosis normalmente usadas</span> en el ser humano para profilaxis, diagnóstico, tratamiento o para modificar funciones fisiológicas».")}
    ${UL(["La mayoría son evitables.","No hay medicamentos exentos de riesgos.","Siempre se hace una evaluación riesgo-beneficio.","Mecanismos: farmacocinéticos (lo que el cuerpo hace al fármaco) o farmacodinámicos (lo que el fármaco hace al cuerpo)."])}`],
   ["Tipos de reacción",`
    ${T(["Tipo","Definición"],[["Efecto secundario","Se produce por la <b>acción primaria</b> del fármaco. Representa un daño temporal o permanente durante y/o después del efecto curativo. Negativo."],["Efecto colateral","Forma parte de la <b>acción farmacológica</b> del medicamento y suele manifestarse en <b>otro órgano o sistema</b> (ejemplo de clase: aspirina)."],["Reacción idiosincrásica","Factores genéticos: respuesta anormal de ciertos individuos."],["Reacción alérgica","El fármaco o sus metabolitos adquieren carácter antigénico."]])}
    <h4>Susceptibilidad</h4>
    <p>Edad, género, embarazo, factores farmacogenéticos, comorbilidad (hígado, riñón) y comedicación.</p>
    <h4>Dosis</h4>
    ${T(["Dosis","Tipo de reacción"],[["Supraterapéutica","Tóxica"],["Terapéutica","Reacción adversa: efecto secundario (no acción farmacológica) o colateral (acción farmacológica)"],["Subterapéutica","Hipersensibilidad"]])}
    <p><b>Tiempo:</b> reacciones tiempo-dependientes y tiempo-independientes.</p>`],
   ["Teratogenicidad",`
    ${D("<b>Teratogenicidad:</b> alteración morfológica, bioquímica o funcional inducida en el embarazo, detectada en la gestación.<br><b>Teratógeno:</b> agente que interfiere en el desarrollo normal del feto.")}
    <p>El periodo embrionario (semanas 3 a 8) concentra la mayor susceptibilidad a malformaciones mayores; en el periodo fetal predominan defectos fisiológicos y menores. Caso histórico: <b>talidomida (1957)</b>.</p>
    ${T(["Categoría FDA","Significado"],[["<span class='pill g'>A</span>","Sin riesgo aparente: estudios en los tres trimestres sin riesgo para embrión o feto. Pueden emplearse."],["<span class='pill g'>B</span>","Sin estudios en humanos; estudios en animales sin riesgo fetal, no extrapolables. Probablemente seguro."],["<span class='pill a'>C</span>","No descarta riesgo: no producen malformaciones orgánicas pero pueden causar alteraciones funcionales; en animales indican riesgo. Usar solo si el beneficio justifica el riesgo."],["<span class='pill r'>D</span>","Pruebas de riesgo: mayor incidencia de malformaciones. Sopesar riesgo/beneficio; evitar si hay alternativas."],["<span class='pill r'>X</span>","Contraindicados: riesgo elevado de malformaciones; no administrar ni siquiera en edad fértil."]])}`],
   ["Fármacos teratógenos",`
    ${T(["Agente","Efectos"],[["Aminopterina (antineoplásico)","Antagonista del ácido fólico; inhibe la mitosis de células de división rápida. Muerte intrauterina; 20–30 % sobrevive con malformaciones."],["Alcohol","Síndrome alcohólico fetal: retraso mental, alteraciones craneofaciales, retraso del crecimiento."],["Cocaína","Teratógeno de abuso."],["Anfetaminas (dextroanfetamina)","Malformaciones de brazos, piernas, genitourinarias, cardiacas y del aparato digestivo."],["Anticonvulsivantes (trimetadiona, ácido valproico, difenilhidantoína)","Alteran la transferencia de grupos metilo y la síntesis de ARN: cejas en V, orejas bajas, labio leporino, anomalías cardiacas, genitourinarias y de extremidades, retraso mental."],["Warfarina","Máxima sensibilidad entre las semanas 6 y 12: hemorragias en embrión o feto, anomalías del SNC, hipoplasia del cartílago nasal."],["Andrógenos y gestágenos","Virilización del feto femenino."],["Talidomida","Malformaciones de extremidades, oídos y órganos internos."],["Retinoides (isotretinoína)","Malformaciones del SNC, craneofaciales, cardiacas."],["Dietilestilbestrol","Adenosis y carcinoma vaginal en hijas."],["Tetraciclinas","Coloración y anomalías de los dientes."],["Litio","Malformaciones cardiacas."]])}`]
  ],
  cards:[["Definición de RAM según la OMS","Reacción nociva no intencionada a dosis normalmente usadas en humanos para profilaxis, diagnóstico, tratamiento o modificar funciones fisiológicas."],["Efecto secundario","Se produce por la acción primaria del fármaco; daño temporal o permanente."],["Efecto colateral","Parte de la acción farmacológica, aparece en otro órgano o sistema."],["Reacción idiosincrásica","Respuesta anormal de ciertos individuos por factores genéticos."],["Categoría FDA X","Contraindicado en el embarazo y en edad fértil."],["Ventana de máxima sensibilidad a warfarina","Semanas 6 a 12: hemorragias, anomalías del SNC, hipoplasia nasal."],["Aminopterina","Antagonista del folato: muerte intrauterina; 20–30 % sobrevive con malformaciones."],["Factores de susceptibilidad a RAM","Edad, género, embarazo, farmacogenética, comorbilidad, comedicación."]],
  quiz:[
   {q:"Una reacción adversa por dosis subterapéuticas sugiere:",o:["Toxicidad","Hipersensibilidad","Efecto colateral","Tolerancia"],a:1,e:"Subterapéutica → hipersensibilidad."},
   {q:"Fármaco sin estudios en humanos y estudios en animales sin riesgo fetal:",o:["Categoría A","Categoría B","Categoría C","Categoría D"],a:1,e:"Categoría B: probablemente seguro."},
   {q:"Cejas en V, orejas bajas y labio leporino se asocian a:",o:["Warfarina","Anticonvulsivantes","Tetraciclinas","Litio"],a:1,e:"Trimetadiona, ácido valproico, difenilhidantoína."},
   {q:"La hipoplasia del cartílago nasal es típica de:",o:["Warfarina","Alcohol","Talidomida","Andrógenos"],a:0,e:"Warfarina, sobre todo semanas 6–12."},
   {q:"El efecto colateral se caracteriza por:",o:["Ser siempre alérgico","Aparecer en otro órgano o sistema como parte de la acción farmacológica","Darse solo con sobredosis","Depender de factores genéticos"],a:1,e:"Forma parte de la acción farmacológica y se manifiesta en otro órgano."}]
},
{ id:"farmacovigilancia", n:"5", title:"Farmacovigilancia", group:"Seguridad", slides:40,
  lead:"Detección, evaluación y prevención de riesgos de los medicamentos ya comercializados: clasificación de RAM, NOM-220 y algoritmo de Naranjo.",
  key:["Farmacovigilancia: detección, evaluación y prevención de riesgos de los medicamentos una vez comercializados (fase IV).","Para detectar 1 caso de una RAM con incidencia 1/n con 95 % de probabilidad se necesitan unos 3n pacientes.","Clasificación de Rawlings y Thompson: A aumentada (80 %), B bizarra, C crónica, D retrasada, E fin de uso, F falla.","Severidad: leve, moderada, grave, letal. NOM-220-SSA1-2002 regula la farmacovigilancia en México."],
  sections:[
   ["Fases de los ensayos clínicos",`
    ${T(["Fase","Descripción","Finalidad"],[["1","Administración a voluntarios sanos","Identificar acciones farmacológicas y RAM dosis-dependientes; perfil farmacocinético y farmacodinámico preliminar"],["2","Poblaciones seleccionadas de pacientes","Datos de eficacia y seguridad para una indicación; establecer dosis para la siguiente fase"],["3","Control exhaustivo antes de la aprobación","Seguimiento detallado de todos los efectos adversos, en especial gravedad y duración"],["4","Estudios postcomercialización","Identificar nuevas señales de seguridad; probar hipótesis"]])}`],
   ["Definición y por qué hace falta",`
    ${D("<b>Farmacovigilancia:</b> disciplina que se ocupa de la detección, evaluación y prevención de los riesgos asociados a los medicamentos una vez comercializados. Vigilancia continua del uso de medicamentos en humanos para detectar RAM, identificar factores de riesgo y prevenir sus riesgos.")}
    ${T(["Incidencia de la RAM","Pacientes que hay que exponer"],[["1/100","300"],["1/500","1 500"],["1/1 000","3 000"],["1/5 000","15 000"],["1/10 000","30 000"],["1/50 000","150 000"]])}
    <p class="src">Número de pacientes para hallar un caso con 95 % de probabilidad (siempre 3 × el denominador).</p>`],
   ["Clasificación por mecanismo (Rawlings y Thompson)",`
    ${T(["Tipo","Inglés","Características","Ejemplos"],[["<b>A</b>","Augmented","Aumentada, dosis-dependiente. Amplifica la acción farmacológica; predecible, frecuente (80 % de las RAM), poco grave, baja mortalidad; se identifica en ensayos clínicos","Hemorragia por anticoagulantes; irritación gástrica por AINE"],["<b>B</b>","Bizarre","Bizarra, dosis-independiente. Depende del paciente; poco frecuente, imprevisible, suele ser grave. Hipersensibilidad o idiosincrasia","Erupciones, vasculitis, anafilaxia"],["<b>C</b>","Chronic","Crónica, dosis y tiempo-dependiente. Tratamientos prolongados aumentan el riesgo de una enfermedad; difícil de relacionar","Resistencia a quimioterapia (topoisomerasa II)"],["<b>D</b>","Delayed","Retrasada, tiempo-dependiente; difícil de diagnosticar","Teratogénesis y carcinogénesis: metotrexato (tubo neural), IECA en embarazo"],["<b>E</b>","End of use","Fin de uso, por suspensión o abstinencia; incidencia baja","Opiáceos, antidepresivos, anticonvulsivantes"],["<b>F</b>","Failure","Falla inesperada de la farmacoterapia; dosis-dependiente, incidencia alta","Resistencia bacteriana a antibióticos"]])}`],
   ["Clasificación por severidad",`
    ${T(["Severidad","Criterios"],[["<span class='pill g'>Leve</span>","Signos y síntomas tolerados; normalmente sin tratamiento; no prolonga hospitalización ni afecta la actividad cotidiana. Puede o no requerir suspender el fármaco."],["<span class='pill a'>Moderada</span>","Sintomatología marcada, órganos vitales moderadamente afectados; interfiere con actividades sin amenazar la vida. Requiere tratamiento; puede requerir suspensión, hospitalización o urgencias."],["<span class='pill r'>Grave</span>","Pone en peligro la vida o disminuye sus expectativas; requiere o prolonga hospitalización; invalidez o incapacidad; malformaciones en el recién nacido."],["<span class='pill r'>Letal</span>","Contribuye directa o indirectamente a la muerte. Se reporta inmediatamente, aun sin relación causal establecida."]])}`],
   ["NOM-220-SSA1-2002 y causalidad",`
    <p><b>NOM-220-SSA1-2002, instalación y operación de la farmacovigilancia:</b> de observancia obligatoria en México para instituciones y profesionales de la salud, titulares del registro sanitario, comercializadores de medicamentos y remedios herbolarios, y unidades de investigación clínica.</p>
    ${T(["Causalidad","Criterio"],[["Cierta","No se explica por la evolución natural, otra patología u otros fármacos; respuesta clínicamente evidente a la suspensión o reexposición."],["Probable","Difícilmente atribuible a otras causas; secuencia temporal razonable; respuesta razonable al suspender."],["Posible","También podría atribuirse a la enfermedad, otras patologías u otros fármacos; falta información sobre la suspensión."],["Dudosa","Relación improbable (no imposible); se explica mejor por otras causas."],["Condicional / inclasificable","Requiere más datos o están en análisis."],["No evaluable / inclasificable","Información insuficiente o contradictoria."]])}
    <p>Los reportes se envían en el formato de COFEPRIS (www.cofepris.gob.mx).</p>`],
   ["Algoritmo de Naranjo (calculadora)",`<div class="tool" id="naranjo"></div>
    ${N("Puntos de corte tal como vienen en la diapositiva: definitiva &gt; 9, probable 5–8, posible 1–4, dudosa &lt; 0. En la versión original de Naranjo son ≥ 9 y ≤ 0, así que un 9 cuenta como definitiva y un 0 como dudosa.")}`]
  ],
  cards:[["Define farmacovigilancia","Detección, evaluación y prevención de los riesgos de los medicamentos una vez comercializados."],["RAM tipo A","Aumentada, dosis-dependiente, predecible; 80 % de las RAM (p. ej. hemorragia por anticoagulantes)."],["RAM tipo B","Bizarra, dosis-independiente, imprevisible, grave (hipersensibilidad o idiosincrasia)."],["RAM tipo E","Fin de uso: aparece al suspender (opiáceos, antidepresivos, anticonvulsivantes)."],["RAM tipo F","Falla inesperada de la terapia (resistencia bacteriana)."],["¿Cuántos pacientes para detectar una RAM 1/10 000?","30 000 (3 × el denominador)."],["Norma mexicana de farmacovigilancia","NOM-220-SSA1-2002."],["RAM letal: ¿cuándo se reporta?","Inmediatamente, aunque no se haya establecido la relación causal."],["Naranjo: puntuación de RAM probable","5 a 8 puntos."]],
  quiz:[

{ id:"interacciones", n:"6", title:"Interacciones farmacológicas", group:"Seguridad", slides:25,
  lead:"Cómo un fármaco, alimento o alcohol modifica la acción de otro: interacciones farmacocinéticas, farmacodinámicas, con alimentos y con etanol.",
  key:["Interacción: modificación de la acción de un fármaco en magnitud o duración por la administración previa o concomitante de otra sustancia.","Más riesgo con fármacos de alta unión a proteínas (> 95 %) y estrecho margen terapéutico.","Alcalinizar la orina aumenta la eliminación de ácidos (salicilatos, barbitúricos); acidificarla, la de bases (anfetaminas, morfina).","Efecto antabús: metronidazol, cefalosporinas, ketoconazol, disulfiram con alcohol."],
  sections:[
   ["Definición y tipos",`
    ${D("<b>Interacción farmacológica:</b> modificación de la acción de un fármaco en magnitud o en duración debido a la administración previa o concomitante de otra sustancia.")}
    <p>La <b>politerapia</b> (sobre todo en adultos mayores) multiplica las interacciones. Pueden ser <b>positivas</b> (buscadas) o <b>negativas</b>, y por mecanismo <b>farmacocinéticas</b> o <b>farmacodinámicas</b> (en el receptor: agonista, antagonista).</p>
    ${T(["Enfermedad","Combinación","Efecto (positivo)"],[["Hipertensión arterial","Tiazida + β-bloqueante","Potencia el efecto antihipertensivo"],["Infecciones urinarias","Sulfametoxazol + trimetoprima","Mayor espectro"],["Asma bronquial","Salbutamol + beclometasona","Potencia la acción farmacológica"]])}`],
   ["Interacciones farmacocinéticas",`
    ${T(["Proceso","Mecanismo"],[["Absorción","pH e ionización; formación de quelatos; motilidad intestinal (alteraciones del peristaltismo). Los antiácidos dificultan la absorción de fármacos ácidos (p. ej. aspirina)."],["Distribución","Formación de complejos inactivos; desplazamiento de proteínas plasmáticas. Peligro con alta unión (&gt; 95 %) y estrecho margen terapéutico."],["Metabolismo","Autoinducción, heteroinducción, inhibición enzimática (CYP)."],["Excreción","Alteración de la circulación enterohepática, de la reabsorción o secreción tubular, y del pH urinario."]])}
    ${tiles([["Orina alcalina favorece eliminación de","Salicilatos, penicilinas, tiazidas, antidepresivos, metotrexato, barbitúricos."],["Orina ácida aumenta eliminación de","Anfetaminas, metformina, morfina."]])}
    <h4>Alimentos y metabolismo</h4>
    ${T(["Alimento","Efecto","Fármacos afectados"],[["Aguacate, brócoli, coliflor","Inducción enzimática","Acenocumarol, warfarina"],["Toronja / jugo de toronja","Inhibición enzimática","Alprazolam, amlodipino, astemizol, carbamazepina, ciclosporina, cisaprida, nifedipino, midazolam, saquinavir, tacrolimus, terfenadina"],["Soya","Inhibición enzimática","AINE, cafeína, clozapina, fenitoína, haloperidol, olanzapina, warfarina, zafirlukast"]])}`],
   ["Horarios respecto a los alimentos",`
    ${T(["Indicación","Significa"],[["En ayunas","1 h antes de comer o 2 h después de terminar de comer"],["Antes de comer","20–30 min antes"],["Durante las comidas","Durante o inmediatamente después de ingerir alimento"],["Después de las comidas","30–45 min después"]])}`],
   ["Interacciones medicamento-alimento",`
    ${T(["Alimento","Medicamento","Interacción"],[["Espinacas, coles de Bruselas, brócoli","Warfarina (antitrombótico)","Contienen vitamina K: disminuye la eficacia (antagonismo) <span class='pill r'>negativa</span>"],["Alimentos en general, ricos en grasa","Captopril, furosemida, hidroclorotiazida","Alteran la biodisponibilidad <span class='pill r'>negativa</span>"],["Leche","Penicilinas, dicloxacilina, ampicilina-sulbactam, amoxicilina-clavulanato, cefadroxilo, cotrimoxazol","Disminuye su biodisponibilidad <span class='pill r'>negativa</span>"],["Alimentos en general","Aspirina, AINE, metformina","Se recomienda tomarlos con alimentos <span class='pill g'>positiva</span>"]])}
    ${T(["Medicamento","Efecto sobre el alimento/nutriente"],[["Anticonceptivos","Inhiben el metabolismo del café"],["Bisacodilo","Inhibe la absorción del calcio"],["Colestiramina","Inhibe la absorción de vitaminas A, D, E, K y complejo B"],["Furosemida, hidroclorotiazida","Pérdida de Na, K, Cl, Mg (calambres)"],["Fenitoína","Inhibe la absorción del complejo B"]])}`],
   ["Interacciones con alcohol (etanol)",`
    <p>El etanol se metaboliza en el hígado: alcohol deshidrogenasa → acetaldehído → aldehído deshidrogenasa → ácido acético. El <b>disulfiram</b> bloquea la aldehído deshidrogenasa; se acumula acetaldehído.</p>
    ${D("<b>Efecto antabús (disulfiram):</b> síntomas al ingerir alcohol tras ciertos fármacos que interfieren con su metabolismo y acumulan acetaldehído: rubicundez facial, cefalea, vértigo, náuseas, diaforesis, taquicardia, hipotensión, síncope. Fármacos: disulfiram, metronidazol, cloranfenicol, isoniazida, ketoconazol, nitrofurantoína, sulfonamidas, tolbutamida, cefalosporinas (cefamandol, cefoperazona, cefotetán).")}
    ${T(["Alcohol +","Consecuencia"],[["Ácido acetilsalicílico","Mayor riesgo de lesión de la mucosa gástrica"],["Paracetamol","Riesgo de hepatotoxicidad"],["Analgésicos opioides","Depresión respiratoria y del SNC"],["Antihistamínicos","Sedación; altera la función motora"],["Barbitúricos","Potencia la depresión del SNC y respiratoria"],["Benzodiacepinas","Sedación, depresión respiratoria"],["Biguanidas","Posible hipoglucemia"],["Cimetidina, ranitidina","Riesgo de intoxicación etílica / mayor embriaguez"],["Fenitoína, fenobarbital","Aumentan sus niveles séricos: riesgo de toxicidad"],["Ketoconazol","Efecto antabús y hepatotoxicidad"],["Metronidazol, cefalosporinas","Efecto antabús"],["Doxiciclina, penicilina G, rifampicina, warfarina","Disminuye su actividad"],["Anticonceptivos","Sedación"]])}
    <p>Para buscar interacciones se usan softwares de biblioteca, gratuitos o de paga.</p>`]
  ],

{ id:"antiinflamatorios", n:"7", title:"Antiinflamatorios y analgésicos", group:"Fármacos", slides:94,
  lead:"Farmacología del dolor e inflamación: mediadores, AINE (COX-1 y COX-2), paracetamol, glucocorticoides y analgésicos opioides.",
  key:["AINE inhiben la ciclooxigenasa; corticoides inhiben la fosfolipasa A2 (bloquean prostaglandinas y leucotrienos).","COX-1 es constitutiva (mucosa gástrica, plaquetas, riñón); COX-2 es inducible en la inflamación.","Coxibs: contraindicados en enfermedad cardiovascular por riesgo de IAM e ictus.","AAS en niños con infección viral: síndrome de Reye.","Receptor μ: analgesia, depresión respiratoria, estreñimiento, euforia, sedación, dependencia. Antídoto: naloxona."],
  sections:[
   ["Inflamación y mediadores",`
    <p><b>Agentes inflamatorios:</b> biológicos; los que producen necrosis: físicos (radiaciones, frío, calor), químicos (venenos, toxinas), traumatismos y cuerpos extraños; alteraciones inmunitarias (hipersensibilidad).</p>
    <p><b>Mediadores:</b> químicos, celulares y plasmáticos.</p>
    ${T(["Mediador químico","Ejemplo"],[["Aminas","Histamina"],["Lípidos","Prostaglandinas, leucotrienos"],["Péptidos pequeños","Bradicinina (BK)"],["Péptidos grandes","Linfocinas: IL-1"]])}
    <h4>Cascada del ácido araquidónico</h4>
    <p>Fosfolípidos de membrana → (<b>fosfolipasa A2</b>, inhibida por <b>corticoides</b>) → ácido araquidónico →</p>
    ${UL(["<b>Ciclooxigenasa</b> (COX-1 fisiológica, COX-2; inhibida por <b>AINE</b>) → PGG2/PGH2 → PGE2 (fiebre, dolor, función renal, protección gástrica), PGD2 (quimiotáctico), PGF2α (cérvix), PGI2/prostaciclina (antiagregante), tromboxano A2 (vasoconstricción, agregación plaquetaria).","<b>Lipooxigenasa</b> → leucotrieno B4 (quimiotáctico); C4, D4, E4 (broncoconstricción, aumentan permeabilidad vascular); lipoxinas A4, B4 (inhiben la inflamación)."])}
    <h4>Acciones de las prostaglandinas (mediadores locales)</h4>
    ${UL(["PGE2 estimulada por infección o hipersensibilidad: fiebre y dolor.","PGE2 y PGF2α: síntesis de moco protector en estómago e intestino.","PGI2: inhibe la secreción ácida gástrica.","TXA2 promueve la agregación plaquetaria; PGI2 la inhibe."])}`],
   ["AINE: COX-1 vs COX-2",`
    ${T(["","COX-1","COX-2"],[["Expresión","Constitutiva: mayoría de tejidos, mucosa gástrica, plaquetas, riñón","Inducible durante la inflamación (también constitutiva en SNC y riñón)"],["Funciones","Protección gástrica, agregación plaquetaria, función renal, homeostasis vascular","Genera PGI2 en endotelio (cardioprotectora, vasodilatadora, antiagregante); dolor e inflamación"],["Al inhibirla","Mayor toxicidad gastrointestinal, menor agregación plaquetaria, afecta función renal","Analgesia principalmente; riesgos cardiovasculares"],["Gen","Cromosoma 9","Cromosoma 1"]])}
    <p>El AAS bloquea la COX plaquetaria durante 5–7 días: las plaquetas no tienen núcleo y no pueden producir más COX.</p>
    ${D("<b>Recuerda:</b> los coxibs (celecoxib, etoricoxib; valdecoxib y rofecoxib retirados) están contraindicados en pacientes con enfermedad cardiovascular, por riesgo de infarto agudo de miocardio (IAM) e ictus.")}
    ${T(["Grupo químico","Fármacos","Ventaja / desventaja"],[["Salicilatos","Aspirina, salicilatos, diflunisal","Bajo costo, larga historia de seguridad / trastornos GI altos frecuentes"],["Pirazolonas","Fenilbutazona, metamizol","Potentes / toxicidad"],["Ácidos indolacéticos","Indometacina, sulindaco, tolmetina","Muy potentes; usar solo si otros fallan; trastornos del SNC frecuentes"],["Ácidos propiónicos","Ibuprofeno, naproxeno, ketoprofeno, fenoprofeno","Menor toxicidad y mejor aceptación"],["Oxicams","Piroxicam, meloxicam","Vida media larga: 1–2 dosis diarias"],["Fenamatos","Ácido mefenámico, meclofenamato","—"],["Inhibidores COX-2","Celecoxib, etoricoxib","Menos daño GI / riesgo cardiovascular"]])}`],
   ["Paracetamol, ketorolaco y AINE en situaciones especiales",`
    ${tiles([["Paracetamol (acetaminofén)","Analgésico y antipirético fuerte, antiinflamatorio débil (no ácido, paraaminofenol). Dosis tóxica: metabolito NAPQI por CYP2E1/1A2/3A4 → hepatotoxicidad; antídoto N-acetilcisteína. Nivel 1 de dolor crónico: permite terapia a largo plazo."],["Metamizol (pirazolona)","«La mejor alternativa» analgésica; riesgo de agranulocitosis y anemia aplásica."],["Ketorolaco","Uso continuo limitado a 3–5 días; algunos expertos no lo recomiendan más de 2 días seguidos ni más de 150 mg totales (c/ampolleta = 30 mg)."],["Ibuprofeno en embarazo","Contraindicado desde la semana 24 (puede cerrar prematuramente el conducto arterioso y reducir líquido amniótico); antes de la semana 24, uso repetido puede afectar los óvulos de un feto femenino."]])}
    ${D("<b>Síndrome de Reye:</b> AAS en infecciones virales (niños) → hígado graso con encefalopatía, hepatitis fulminante, edema cerebral. Síntomas: diarrea, taquicardia, vómitos, fatiga, confusión, convulsiones, pérdida del conocimiento.")}
    <p><b>AINE y riñón:</b> en estados que elevan los vasoconstrictores (enfermedad renal o cardiovascular, cirrosis, nefrosis, insuficiencia cardiaca, diuréticos) las PG antagonizan la vasoconstricción intrarrenal. Al inhibir las PG, los AINE dejan la vasoconstricción sin oposición: menos eliminación de Na⁺ y cambio del tono vascular.</p>
    <p><b>Interacciones de salicilatos:</b> antiácidos ↓ absorción de aspirina; con heparina o anticoagulantes orales → hemorragia; con probenecid (uricosúrico) y sulfinpirazona ↓ excreción de urato (contraindicado en gota); desplazan bilirrubina, fenitoína, naproxeno, tiopental, tiroxina → mayor concentración, vida media y toxicidad.</p>
    <p><b>¿Cuál AINE dar?</b> Para dolor osteoarticular conviene iniciar con paracetamol. Diclofenaco: artritis, episodios graves, migraña. Paracetamol: cefalea, fiebre. Ibuprofeno: dolor muscular.</p>`],
   ["Fichas de AINE",`
    ${T(["Fármaco","Datos clave de clase"],[["Diclofenaco","Inhibe la síntesis de PG por inactivación reversible de la COX. Artritis reumatoide, osteoartritis, espondilitis, gota aguda, cólico renal. Adultos VO 50–100 mg inicial, mantenimiento 50 mg c/8–12 h, máx. 200 mg/día; rectal 100 mg/día; IM (cólico nefrítico) 75 mg. Niños 1–12 años: 2–3 mg/kg/día c/12 h. RAM: dispepsia, pirosis, hepatotoxicidad, cefalea, vértigo; hipersensibilidad (asma, pólipos nasales). Sobredosis: lavado gástrico, carbón activado."],["Celecoxib","Inhibidor COX-2. Artritis, espondilitis, dolor agudo, dismenorrea. VO 50–400 mg; osteoartritis 200 mg/día; artritis reumatoide 100–200 mg c/12 h. Toxicidad: letargo, náusea, dolor epigástrico; carbón activado 4 h tras ingerir."],["Paracetamol","VO/IV, T-A 4–6–8 h. Tóxico: NAPQI hepático; N-acetilcisteína. Contraindicado en hepatopatía."],["Ketorolaco","Potente analgésico; máximo 3–5 días."],["Tarea de exposición","AAS, celecoxib, diclofenaco, ibuprofeno, ketorolaco, meloxicam, naproxeno, paracetamol, piroxicam: presentaciones, indicaciones, dosis, efectos adversos, contraindicaciones, interacciones, categoría en embarazo, mecanismo."]])}`],
   ["Glucocorticoides",`
    <p><b>Eje hipotálamo-hipófisis-suprarrenal:</b> CRH → ACTH → corteza suprarrenal. Zona glomerular → mineralocorticoides (aldosterona: Na⁺/K⁺); fascicular → glucocorticoides (cortisol: metabolismo); reticular → andrógenos (DHEA). Médula → adrenalina y noradrenalina.</p>
    ${T(["Efecto","Detalle"],[["Metabólico","Favorecen gluconeogénesis, catabolismo de proteínas y lipólisis; antiinsulínicos (hiperglucemia)."],["Células sanguíneas","↓ eosinófilos, monocitos, linfocitos; ↑ hemoglobina, plaquetas, eritrocitos."],["Resistencia al estrés","Elevan glucosa (energía) y moderadamente la presión arterial."],["Antiinflamatorio e inmunosupresor","Inhiben la fosfolipasa A2 (bloquean PG y leucotrienos); ↓ linfocitos y macrófagos periféricos; inhiben activación, migración y proliferación de células T, citocinas y anticuerpos."]])}
    ${T(["Acción","Duración","Fármacos (potencia)"],[["Corta","8–12 h","Hidrocortisona, cortisona (baja potencia)"],["Intermedia","12–36 h","Prednisona, prednisolona, metilprednisolona, triamcinolona, deflazacort (intermedia)"],["Prolongada","&gt; 36 h","Dexametasona, betametasona, parametasona (alta potencia)"]])}
    ${T(["Glucocorticoide","Potencia gluco","Potencia mineralo","Dosis equivalente (mg)"],[["Cortisol / hidrocortisona","0.8","0.8","25"],["Cortisona","1","1","20"],["Prednisona / prednisolona","4","0.25","5"],["Metilprednisolona","5","&lt; 0.01","4"],["Triamcinolona","5","0","4"],["Betametasona","30–40","&lt; 0.01","0.75"],["Dexametasona","25","&lt; 0.01","0.6"]])}
    <h4>Farmacocinética</h4>
    ${UL(["Oral: la mayoría se absorbe bien (~30 min); elección en tratamientos crónicos.","IV: elección en emergencias (asma, choque séptico).","IM: absorción lenta, efecto de semanas (triamcinolona).","Local: intraarticular, tópica (lipofílicos; atrofia dérmica, estrías), inhalada (fluticasona, beclometasona; asma/EPOC).","Metabolismo hepático 99 %, excreción renal 1 %."])}
    <h4>Usos</h4>
    <p><b>Reemplazo</b> (Addison, hiperplasia suprarrenal congénita, extirpación glandular) y <b>paliativo</b> (inflamación crónica, fenómenos inmunes): agudos (descompensación de asma/EPOC, anafilaxia, choque, SDRA, edema cerebral) y crónicos (enfermedades reumáticas, respiratorias, alérgicas, trasplante, neoplasias). Dexametasona/betametasona: maduración pulmonar fetal. También lupus, artritis, psoriasis, colitis ulcerosa, Crohn, leucemias, linfoma, mieloma, anemia hemolítica, hepatitis.</p>
    <h4>Efectos adversos</h4>
    ${UL(["<b>Supresión brusca:</b> agravamiento de la enfermedad, insuficiencia suprarrenal aguda, síndrome de supresión (mialgia, artralgia, fiebre, malestar).","<b>Dosis crónicas:</b> 2 semanas de dosis suprafisiológicas alteran el eje HHS.","Hiperglucemia y glucosuria, supresión del crecimiento, úlcera péptica, efectos oculares (cataratas, glaucoma), edema e hipopotasemia, redistribución de grasa (síndrome de Cushing), infecciones, estrías, acné, osteoporosis, HTA."])}
    <p><b>Interacciones:</b> con AINE potencian efectos GI; inhiben a IECA y ARA II; con diuréticos mayor pérdida de K⁺.</p>
    <p><b>Prednisona (ficha):</b> 5, 20, 50 mg VO. Asma, Addison, enfermedades inmunoalérgicas e inflamatorias, síndrome nefrótico. Adultos 40–60 mg/día en 1–2 tomas por 3–10 días. Rifampicina, fenitoína y fenobarbital aumentan su metabolismo; antiácidos ↓ absorción; con digitálicos ↑ arritmias. Puede reactivar tuberculosis; evitar contacto con varicela o sarampión.</p>
    <p class="src">Tarea: betametasona, cortisona, dexametasona, mometasona, metilprednisolona.</p>`],
   ["Analgésicos opioides",`
    <p><b>Papaver somniferum</b> (euforia, analgesia, sueño, antidiarreico): morfina (analgésico, antidiarreico, espasmógeno), codeína (analgésico, antitusígeno), noscapina (antitusígeno).</p>
    <p>Receptores de membrana en SNC, terminaciones nerviosas periféricas y células digestivas: μ, κ, δ (y σ). Acoplados a proteína Gi: ↓ AMPc, cierran canales de Ca²⁺ presinápticos (menos glutamato) y abren canales de K⁺ postsinápticos (hiperpolarización) entre la 1.ª y 2.ª neurona nociceptiva.</p>
    ${T(["Receptor","Efectos"],[["μ (mu)","Analgesia supraespinal y espinal, depresión respiratoria, estreñimiento, euforia, sedación, dependencia"],["δ (delta)","Analgesia, proconvulsionante; modulación de hormonas"],["κ (kappa)","Analgesia espinal, sedación, disforia, alucinaciones (psicotomiméticos)"]])}
    ${T(["Clase","Fármacos"],[["Agonistas puros","Morfina, codeína, oxicodona, hidromorfona, metadona, fentanilo, meperidina, tramadol, loperamida"],["Agonista-antagonista","Nalbufina, pentazocina, butorfanol"],["Agonista parcial","Buprenorfina"],["Antagonistas puros","Naloxona, naltrexona"]])}
    ${T(["Fármaco","Clave"],[["Morfina","Analgesia, depresión respiratoria, supresión de la tos, miosis. Absorción oral lenta, gran primer paso; IM, SC, IV. Atraviesa todos los tejidos (incluido feto). Eliminación renal."],["Metadona","Oral, IV, SC, rectal. Menos euforia, duración prolongada. Síndrome de abstinencia en adictos a heroína o morfina (reducción paulatina)."],["Fentanilo","80–100 veces más potente que morfina. Anestesia; acción rápida, efecto breve (15–30 min). IV, epidural (posoperatorio, parto), oral transmucoso (cáncer), parches transdérmicos."],["Oxicodona","Agonista puro μ, κ, δ: analgésico, ansiolítico, sedante. Oral, SC, IV. Dolor intenso por cáncer."],["Tramadol","Receptor μ. Dolor moderado a moderadamente intenso; menor depresión respiratoria. En ancianos bajar dosis (eliminación renal)."],["Heroína","Morfina acetilada; muy liposoluble, cruza la BHE: euforia intensa. Se transforma en morfina; dura 50 % más. Ningún uso médico autorizado."]])}
    <h4>Antagonistas</h4>
    ${UL(["<b>Naloxona:</b> revierte coma y depresión respiratoria por sobredosis; desplaza al opioide (10 veces más afín); actúa en 30 s por vía IV. Sobredosis masiva: "+dose("0.8 mg IV c/2–3 min")+" o infusión de 2 mg en 500 ml. Menos severa: "+dose("0.2 mg IV + 0.1 mg c/2 min")+".","<b>Naltrexona:</b> dura más (48 h); programas de mantenimiento en dependientes a opioides. Hepatotóxica."])}
    <p><b>Toxíndrome opioide (tríada):</b> depresión respiratoria, depresión del sensorio, miosis puntiforme (también bradicardia, hipotermia, ruidos intestinales disminuidos).</p>
    <h4>Escalera analgésica</h4>
    ${T(["Escalón","Tratamiento"],[["I","Analgésicos no opioides (paracetamol, AINE, metamizol) ± coanalgésicos"],["II","Opioides débiles (codeína, tramadol) ± coanalgésicos ± escalón I"],["III","Opioides potentes (morfina, oxicodona, fentanilo, metadona, buprenorfina, hidromorfona)"],["IV","Métodos invasivos ± coanalgésicos"]])}
    <p><b>Techo analgésico:</b> los opioides fuertes no tienen efecto techo; los débiles sí (al igual que ibuprofeno y AAS/paracetamol).</p>
    <p><b>Farmacocinética:</b> A: SC, IM, oral (primer paso), mucosa oral, insuflación nasal. D: tejidos perfundidos; músculo esquelético como reservorio. M: hepático. E: renal.</p>
    <p><b>Interacciones:</b> con IMAO ↑ síndrome serotoninérgico; inductores CYP3A4 (rifampicina) ↓ efecto; inhibidores (ritonavir, ketoconazol, fluconazol) y BZD, alcohol, antihistamínicos ↑ efecto. Agonista + agonista-antagonista se antagonizan.</p>
    ${T(["Término","Definición"],[["Tolerancia","Necesidad de dosis mayores para mantener el efecto"],["Dependencia psíquica","Necesidad de consumir el opioide para obtener sus efectos o evitar los negativos de la privación"],["Dependencia física","Estado adaptativo fármaco-receptor con abstinencia al suspender"],["Adicción","Trastorno neurobiológico crónico: uso aberrante con comportamiento social inadaptado"],["Síndrome de abstinencia","Estado transitorio con alteraciones de conciencia, cognición, percepción, afecto y respuestas fisiológicas"]])}
    <p class="src">Tarea: buprenorfina, fentanilo, tramadol, morfina.</p>`]
  ],
  cards:[["¿Qué enzima inhiben los corticoides?","Fosfolipasa A2 (bloquean PG y leucotrienos)."],["¿Qué enzima inhiben los AINE?","Ciclooxigenasa (COX-1 y/o COX-2)."],["Efectos de inhibir COX-1","Toxicidad GI, menor agregación plaquetaria, afectación renal."],["¿Por qué el efecto antiagregante del AAS dura 5–7 días?","Las plaquetas no tienen núcleo y no sintetizan más COX."],["Contraindicación de coxibs","Enfermedad cardiovascular (riesgo de IAM e ictus)."],["Síndrome de Reye","AAS + infección viral en niños: hígado graso con encefalopatía."],["Metabolito tóxico del paracetamol y antídoto","NAPQI; N-acetilcisteína."],["Ketorolaco: duración máxima","3–5 días (algunos: no más de 2 días ni 150 mg totales)."],["Corticoides de acción prolongada","Dexametasona y betametasona (> 36 h, alta potencia)."],["Efectos del receptor μ","Analgesia, depresión respiratoria, estreñimiento, euforia, sedación, dependencia."],["Potencia del fentanilo","80–100 veces la de la morfina."],["Naloxona en sobredosis masiva","0.8 mg IV, repetir c/2–3 min."],["Tríada del toxíndrome opioide","Depresión respiratoria, depresión del sensorio, miosis puntiforme."],["Opioide para síndrome de abstinencia","Metadona (con reducción paulatina)."]],
  quiz:[
   {q:"El celecoxib inhibe selectivamente:",o:["Fosfolipasa A2","COX-1","COX-2","Lipooxigenasa"],a:2,e:"Celecoxib es inhibidor de COX-2."},
   {q:"Un niño con varicela recibe aspirina. ¿Qué riesgo existe?",o:["Síndrome de Cushing","Síndrome de Reye","Agranulocitosis","Síndrome serotoninérgico"],a:1,e:"Reye: AAS + infección viral."},
