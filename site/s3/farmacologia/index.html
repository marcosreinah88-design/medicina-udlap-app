{ id:"colinergicos", n:"8", title:"Colinérgicos y anticolinérgicos", group:"Fármacos", slides:57,
  lead:"Neurotransmisión autónoma, receptores muscarínicos y nicotínicos, agonistas directos e indirectos, antimuscarínicos y bloqueantes.",
  key:["Parasimpático: «descanso, alimentación, estudio». Simpático: «lucha o huida».","M1 SNC/gástrico; M2 corazón (↓ función cardiaca); M3 músculo liso y glándulas (contracción y secreción; dilata vasos vía NO).","Agonistas indirectos = anticolinesterasas: fisostigmina, neostigmina, piridostigmina; organofosforados irreversibles.","Intoxicación colinérgica: DUMBELS → antídoto atropina. Exceso anticolinérgico → fisostigmina."],
  sections:[
   ["Neurotransmisión y sistema nervioso autónomo",`
    ${T(["Grupo","Neurotransmisores"],[["Ésteres","Acetilcolina"],["Aminas","Dopamina, noradrenalina, adrenalina, serotonina"],["Aminoácidos","GABA"],["Péptidos","Péptidos opiáceos"]])}
    ${T(["","Simpático","Parasimpático"],[["Fisiología","«Lucha o huida», estrés","«Descanso, alimentación, estudio»"],["Fármacos (+)","Simpaticomiméticos, adrenérgicos","Parasimpaticomiméticos, colinérgicos (agonistas muscarínicos)"],["Fármacos (−)","Simpaticolíticos, antagonistas adrenérgicos, β-bloqueantes","Parasimpaticolíticos, antagonistas colinérgicos"],["Ojo","Dilata la pupila","Contrae la pupila"],["Corazón","Acelera","Reduce el latido"],["Bronquios","Relaja","Contrae"],["Digestivo","Inhibe","Estimula; estimula vesícula biliar"],["Vejiga","Relaja","Contrae"]])}
    <p><b>Síntesis de ACh:</b> colina + acetil-CoA (colina acetiltransferasa, ChAT) → ACh, almacenada en vesículas; liberación dependiente de Ca²⁺. La <b>acetilcolinesterasa</b> la degrada a acetato + colina (la colina se recapta). Los agonistas <b>directos</b> actúan en el receptor; los <b>indirectos</b> inhiben la acetilcolinesterasa.</p>`],
   ["Receptores colinérgicos",`
    ${T(["Receptor","Ubicación","Función"],[["M1","Tejido gástrico, SNC","Secreción gástrica, memoria"],["M2","Corazón, músculo liso, SNC","Disminuye la función cardiaca (↓ frecuencia, ↓ inotropismo)"],["M3","Músculo liso, glándulas","Contracción y secreción; en vasos, vasodilatación (vía NO)"],["M4 / M5","SNC","Aprendizaje, memoria"],["Nn","Ganglios autónomos, médula suprarrenal","Transmisión ganglionar"],["Nm","Placa neuromuscular (músculo estriado)","Contracción muscular"]])}
    <p><b>Efectos parasimpáticos (M):</b> miosis, ↑ lágrimas y salivación, ↓ frecuencia e inotropismo, vasodilatación, broncoconstricción, ↑ secreción y motilidad GI, producción y vaciamiento biliar, vaciamiento vesical y relajación de esfínteres.</p>
    <p><b>Indicaciones de parasimpaticomiméticos:</b> íleo posoperatorio, atonía gástrica, esofagitis por reflujo, retención urinaria no obstructiva, xerostomía, miosis, glaucoma, intoxicación por antimuscarínicos, Alzheimer.</p>`],
   ["Agonistas de acción directa",`
    ${T(["Grupo","Fármacos"],[["Ésteres de colina","Acetilcolina, carbacol, betanecol, metacolina"],["Alcaloides naturales","Pilocarpina, muscarina"]])}
    ${T(["Fármaco","Uso y dosis de clase"],[["Acetilcolina","Metabolismo rápido: carece de relevancia terapéutica."],["Betanecol","Muscarínico intenso (M3); solo actúa en muscarínicos. Estimula el detrusor, relaja el esfínter vesical, ↑ motilidad gástrica e intestinal. Retención urinaria no obstructiva (posoperatoria, posparto, vejiga neurógena), íleo paralítico, gastroparesia, megacolon no obstructivo. Adultos "+dose("10–50 mg VO 3–4 veces/día antes de comidas")+", máx. 50 mg/dosis."],["Carbacol","Muscarínico y nicotínico, más potente, más efectos adversos. Miosis para cirugía intraocular: "+dose("0.05–0.5 ml")+" (tópico)."],["Pilocarpina","Glaucoma de ángulo estrecho o crónico (contrae músculo ciliar M3 → ↓ presión intraocular), síndrome de Sjögren, prueba del sudor. "+dose("1–2 gotas al 2 % o 4 % c/4–12 h")+". Emergencia de ángulo estrecho: "+dose("1 gota 2 % c/5–10 min, 3–6 dosis")+", luego c/1–3 h hasta controlar la presión."],["Metacolina","Pruebas de hiperreactividad bronquial: excesiva contracción del músculo bronquial, marcador diagnóstico de asma."]])}
    <p><b>Glaucoma:</b> el crónico hoy se trata con otros fármacos (β-bloqueantes); en el de ángulo agudo se inicia pilocarpina + otros.</p>
    <p><b>Contraindicaciones de los agonistas colinérgicos:</b> broncoespasmo (evitar en EPOC y asma) y aumento de secreción ácida (evitar en úlcera péptica).</p>`],
   ["Agonistas indirectos (anticolinesterasas)",`
    ${T(["Duración","Fármacos"],[["Corta (alcoholes simples, ~12 min)","Edrofonio (reversible)"],["Intermedia (carbamatos, ~6 h)","Piridostigmina, neostigmina, fisostigmina (reversibles)"],["Prolongada (ésteres de fósforo, ~30 días)","Organofosforados (irreversibles)"],["Anti-Alzheimer","Rivastigmina, donepezilo, galantamina"]])}
    ${UL(["<b>Fisostigmina y neostigmina:</b> sustratos reversibles; efectos muscarínicos y nicotínicos. Trastornos posoperatorios e intoxicación por anticolinérgicos. Fisostigmina en intoxicación: "+dose("0.5–2 mg IV lento")+" con monitorización (frecuencia cardiaca). La fisostigmina (terciaria) cruza la BHE; las cuaternarias no.","<b>Neostigmina:</b> miastenia, falta de tono vesical "+dose("15–375 mg/día")+"; íleo posoperatorio "+dose("0.04–0.07 mg/kg")+"; revierte el bloqueo neuromuscular de la anestesia.","<b>Miastenia grave:</b> enfermedad autoinmune que destruye receptores nicotínicos; se trata con piridostigmina + inmunosupresores."])}
    ${D("<b>Síndrome colinérgico (intoxicación por organofosforados, raticidas): DUMBELS</b><br>D diaforesis y diarrea · U incontinencia urinaria · M miosis · B broncorrea, broncoespasmo, bradicardia · E emesis · L lagrimeo · S salivación. Nicotínicos: síndrome adrenérgico y parálisis. Antídoto: <b>atropina</b>.")}`],
   ["Antagonistas colinérgicos: antimuscarínicos",`
    <p>Clasificación: <b>antimuscarínicos</b> (atropina, ipratropio, escopolamina), <b>bloqueantes ganglionares</b> (mecamilamina, trimetafán) y <b>bloqueantes neuromusculares</b> (atracurio, mivacurio, pancuronio, rocuronio, tubocurarina, vecuronio; succinilcolina).</p>
    ${T(["Fármaco","Uso y datos de clase"],[["Atropina","Alcaloide de la belladona, antagonista competitivo. Ojo: midriasis (mejor tropicamida). Digestivo: antiespasmódico, intestino irritable. Secreciones: bloquea glándulas salivales, sudoríparas y lagrimales. Cardio: revierte bradicardia sinusal, arritmias e intoxicación colinérgica. Intoxicación por organofosforados "+dose("0.5–5 mg IV")+"; preanestesia 0.3–0.6 mg; bradicardia 0.5–1 mg; RCP/bradicardia 0.5 mg, no rebasar 10 mg. Categoría C."],["Tropicamida","Exámenes de retina y refracción; gotas, efecto en 15–30 min, acción breve (ciclopentolato es de acción más duradera)."],["Butilhioscina (escopolamina)","Espasmos del tracto GI, biliar y genitourinario. VO "+dose("10–20 mg c/6–8 h")+"; parenteral "+dose("20–40 mg")+", máx. 100 mg/día. Categoría B."],["Escopolamina","Atraviesa la BHE y bloquea el centro del vómito: náuseas, vértigo y cinetosis; antiemético por citostáticos; facilita endoscopia. Borra memoria a corto plazo. Altamente tóxica; transdérmica sin superar 330 µg/día. Sobredosis: delirio, psicosis, parálisis, estupor, muerte."],["Ipratropio / tiotropio","Inhiben broncoconstricción y secreción de moco (EPOC). Ipratropio "+dose("1–2 disparos de 20 µg, 2–4 veces/día")+", máx. 16 disparos. No es primera elección en broncoespasmo: 1.º corticoides, 2.º β2 adrenérgicos, 3.º anticolinérgicos."],["Oxibutinina, tolterodina, darifenacina, trospio, propiverina","Relajan el detrusor y contraen el esfínter: vejiga hiperactiva, incontinencia de urgencia, enuresis. Oxibutinina "+dose("5 mg VO 3 veces/día")+", máx. 20 mg; &gt; 5 años: 3–5 mg 2 veces/día."],["Benztropina, trihexifenidilo","Temblor en Parkinson (restablecen el balance dopamina-ACh)."]])}
    <h4>Dosis-respuesta de la atropina</h4>
    ${T(["Dosis","Efecto"],[["0.5 mg","Deprime saliva, secreción bronquial y sudoración"],["1 mg","Taquicardia, sed, dilatación pupilar"],["2 mg","Dificultad de acomodación, palpitaciones"],["5 mg","Inhibe micción y motilidad intestinal; disartria, fatiga, cefalea"],["10 mg","Pulso filiforme, visión escasa, piel seca y ruborosa, ataxia, alucinaciones, delirio, coma"]])}
    <p><b>Efectos adversos antimuscarínicos:</b> visión borrosa, confusión, retención urinaria, midriasis, estreñimiento, taquicardia, hipertermia, sequedad de boca, piel y ojos. Contraindicación: glaucoma de ángulo estrecho. Para la boca seca: tomar ½ h antes de comidas, raciones pequeñas, mucho líquido y fibra.</p>`],
   ["Bloqueantes ganglionares y neuromusculares",`
    <p><b>Bloqueantes ganglionares:</b> pocos usos. <b>Trimetafán:</b> reduce la activación simpática: hipotensión controlada en anestesia (rápida y temporal) y emergencia hipertensiva.</p>
    <p><b>Succinilcolina</b> (bloqueante neuromuscular despolarizante; los curares derivan del «curare»): relaja músculo abdominal en inducción de anestesia general y cirugía, intubación endotraqueal, terapia electroconvulsiva. ${dose("IV 1 mg/kg")}, acción rápida (1 min).</p>
    <p><b>Secuencia de relajación muscular</b> (de dosis bajas a altas): cara y ojos → dedos → cuello → tronco e intercostales → diafragma.</p>`]
  ],
  cards:[["Función de M2","Corazón: disminuye frecuencia e inotropismo."],["Función de M3","Contracción de músculo liso y secreción glandular; vasodilatación vía NO."],["Betanecol: indicación principal","Retención urinaria no obstructiva y atonía gastrointestinal (íleo, gastroparesia)."],["Pilocarpina: indicación","Glaucoma (ángulo estrecho/crónico), síndrome de Sjögren."],["Metacolina","Prueba de hiperreactividad bronquial (diagnóstico de asma)."],["Anticolinesterásico que cruza la BHE","Fisostigmina (terciaria)."],["Tratamiento de miastenia grave","Piridostigmina + inmunosupresores."],["DUMBELS","Diaforesis/diarrea, Urinaria, Miosis, Broncorrea/bradicardia, Emesis, Lagrimeo, Salivación."],["Antídoto de intoxicación por organofosforados","Atropina (0.5–5 mg IV)."],["Antídoto del exceso anticolinérgico","Fisostigmina."],["Escopolamina: usos","Cinetosis, náusea y vértigo, antiemético; facilita endoscopia."],["Orden en broncoespasmo","1.º corticoides, 2.º β2 agonistas, 3.º anticolinérgicos (ipratropio)."],["Succinilcolina: dosis","IV 1 mg/kg, acción en 1 min."],["Último músculo en relajarse con bloqueantes","Diafragma."]],
  quiz:[
   {q:"Un paciente posoperado con retención urinaria no obstructiva: ¿qué fármaco?",o:["Atropina","Betanecol","Oxibutinina","Trimetafán"],a:1,e:"Betanecol estimula el detrusor y relaja el esfínter."},
   {q:"Agricultor con miosis, diarrea, broncorrea y bradicardia tras fumigar. Tratamiento:",o:["Fisostigmina","Neostigmina","Atropina","Pilocarpina"],a:2,e:"Síndrome colinérgico por organofosforados → atropina."},
   {q:"¿Qué antimuscarínico se prefiere para un examen de retina?",o:["Atropina","Tropicamida","Escopolamina","Ipratropio"],a:1,e:"Tropicamida: efecto en 15–30 min y breve."},
   {q:"La metacolina se usa para:",o:["Glaucoma","Diagnóstico de asma","Miastenia","Íleo"],a:1,e:"Prueba de hiperreactividad bronquial."},
   {q:"Contraindicación clásica de los antimuscarínicos:",o:["Asma","Glaucoma de ángulo estrecho","Bradicardia","Úlcera péptica"],a:1,e:"Glaucoma de ángulo estrecho."},
   {q:"Los organofosforados son anticolinesterasas de acción:",o:["Corta, reversible","Intermedia, reversible","Prolongada, irreversible","Directa"],a:2,e:"Ésteres de fósforo: ~30 días, irreversibles."},
   {q:"Con 10 mg de atropina se espera:",o:["Solo boca seca","Taquicardia y sed","Delirio, alucinaciones, piel seca y ruborosa","Bradicardia"],a:2,e:"10 mg: pulso filiforme, ataxia, alucinaciones, delirio, coma."}]
},
{ id:"galenico", n:"8b", title:"Desarrollo galénico de medicamentos", group:"Desarrollo de fármacos", slides:12,
  lead:"Cómo se fabrica la forma farmacéutica: tipos, buenas prácticas de fabricación, estabilidad, caducidad y fórmulas magistrales.",
  key:["Buenas prácticas de fabricación: NOM-241-SSA1-2012.","Riesgos principales: contaminación y confusión de mezclas.","Estabilidad: mantener las características físicas, químicas, microbiológicas y biológicas durante almacenamiento y uso.","Caducidad máxima: 5 años; se prueba con estabilidad acelerada. México: zona climática II."],
  sections:[
   ["Formas y procesos",`
    ${T(["Forma","Característica"],[["Tabletas","Producción rápida y barata; fáciles de almacenar y llevar"],["Cápsulas","Cubierta gelatinosa dura o suave; principio activo en polvo, líquido o semisólido"],["Ungüentos","Emulsiones"],["Inyectables","Esterilizados por luz UV, radiación, químicos o filtros"]])}
    <p>Cada sección (tabletas, cápsulas, inyectables, líquidos orales, ungüentos) sigue un diagrama de flujo propio que termina en inspección y empaque.</p>`],
   ["Buenas prácticas de fabricación",`
    ${UL(["Fabricar de forma uniforme y controlada, conforme a las NOM de calidad: <b>NOM-241-SSA1-2012</b>.","Riesgos: contaminación y confusión de mezclas.","Exigencias: personal calificado, instalaciones y espacios adecuados, equipamiento apropiado, rótulos, envases y materiales apropiados, instrucciones y procedimientos, transporte y depósito apropiados."])}
    <h4>¿Qué se le solicita a la industria?</h4>
    ${UL(["Registros de fabricación, distribución y lote.","Sistemas que permitan retirar el producto en cualquier etapa (distribución o venta).","Estudiar todo reclamo y adoptar las medidas necesarias."])}`],
   ["Estabilidad y caducidad",`
    ${D("<b>Estabilidad:</b> propiedad para mantener durante el almacenamiento y uso las características físicas, químicas, fisicoquímicas, microbiológicas y biológicas dentro de los límites especificados.")}
    <p><b>Zona II:</b> subtropical, humedad elevada 60 % ± 5, 25 °C ± 2.</p>
    <p><b>Fecha de caducidad:</b> periodo en el que el producto permanece dentro de especificaciones; máximo 5 años. Se estima con pruebas de estabilidad acelerada (condiciones exageradas de almacenamiento).</p>`],
   ["Medicamentos magistrales",`
    <p>Preparados en farmacia a partir de una receta (p. ej. gotas óticas de carbonato de potasio, agua y glicerina; concentrados para inhalación).</p>
    ${UL(["Tratamientos personalizados.","Número limitado de pacientes.","Dosis y formas que la industria no fabrica.","Controlar la automedicación.","Medicamentos poco estables."])}
    <p>Se documentan en un formato con nombre del producto, preparador, lote, fecha, fórmula (materia prima, calidad, cantidad, lote, certificado), procedimiento y fecha de caducidad.</p>`]
  ],
  cards:[["NOM de buenas prácticas de fabricación","NOM-241-SSA1-2012."],["Dos riesgos principales en la fabricación","Contaminación y confusión de mezclas."],["Define estabilidad","Mantener características físicas, químicas, fisicoquímicas, microbiológicas y biológicas dentro de límites durante almacenamiento y uso."],["Caducidad máxima","5 años."],["Condiciones de la zona II","Subtropical: 60 % ± 5 de humedad, 25 °C ± 2."],["¿Cuándo usar un medicamento magistral?","Tratamiento personalizado, pocos pacientes, dosis no fabricadas, controlar automedicación, fármacos poco estables."]],
  quiz:[
   {q:"Los inyectables se esterilizan con:",o:["Solo calor seco","Luz UV, radiación, químicos o filtros","Liofilización","Granulación"],a:1,e:"Luz UV, radiación, químicos, filtros."},
   {q:"La caducidad de un medicamento se estima con:",o:["Ensayos fase IV","Pruebas de estabilidad acelerada","Algoritmo de Naranjo","QSAR"],a:1,e:"Condiciones exageradas de almacenamiento."},
   {q:"¿Cuál NO es razón para un medicamento magistral?",o:["Tratamiento personalizado","Fármaco poco estable","Producción masiva barata","Dosis no fabricada por la industria"],a:2,e:"La producción masiva es industrial."}]
},
{ id:"desarrollo", n:"9", title:"Desarrollo preclínico y clínico", group:"Desarrollo de fármacos", slides:28,
  lead:"Estudios en animales (objetivos, 3 R, toxicidad) y fases clínicas en humanos con técnicas de ciego.",
  key:["Preclínica: 2 a 6 años, in vitro y en animales.","Principio de las 3 R (Russell y Burch, 1959): reemplazo, reducción, refinamiento.","Toxicidad aguda: dosis única, DL50; subaguda ≤ 10 % del ciclo de vida; crónica > 50 %, 6–12 meses; carcinogénesis 2 años.","Fase I: 15–30 sanos; fase II: 200–500 pacientes; fase III: 2 000–5 000, multicéntrico; fase IV: farmacovigilancia."],
  sections:[
   ["Desarrollo preclínico",`
    ${D("<b>Preclínica:</b> estudios in vitro y/o en animales de experimentación para obtener información farmacéutica, farmacocinética, farmacodinámica y toxicológica de sustancias con beneficio médico potencial. Duración: <b>2 a 6 años</b>.")}
    <p><b>Necesidad de usar animales:</b> el código de Núremberg exige que cualquier experimento en humanos se base en resultados de investigación animal; la declaración de Helsinki pide pruebas de laboratorio y experimentación animal adecuadas.</p>
    <h4>Objetivos</h4>
    <ol><li>Proteger al humano de efectos tóxicos.</li><li>Determinar seguridad en animales y disminuir riesgos de toxicidad y letalidad en voluntarios.</li><li>Justificar la continuidad de la investigación.</li></ol>
    <p>Se estudian la <b>farmacodinamia</b> (relación dosis-respuesta, selectividad, sitios y mecanismos de acción, eficacia) y la <b>farmacocinética</b> (biodisponibilidad, biotransformación, distribución, eliminación, dosificación, intervalos).</p>`],
   ["Principio de las 3 R",`

    <p>La elección del animal depende del objetivo del estudio (p. ej. presión arterial en perro, gato o rata hipertensa; diuresis en perro; efectos GI en rata; coagulación en conejo; actividad celular en células cultivadas o tejido aislado).</p>`],

    <p><b>Genotoxicidad/mutagénesis:</b> daño o alteraciones del material genético. <b>Fertilidad:</b> teratogénesis y ciclo reproductivo.</p>

{ id:"adrenergicos", n:"12", title:"Adrenérgicos y antiadrenérgicos", group:"Fármacos", slides:55,
  lead:"Catecolaminas, receptores α y β, simpaticomiméticos (adrenalina, α1, α2, β) y bloqueantes α y β.",
  key:["Síntesis: tirosina → DOPA → dopamina → noradrenalina → adrenalina. Degradación: MAO y COMT.","α1: vasoconstricción, midriasis, cierre del esfínter vesical. α2: inhibe liberación de NA. β1: corazón (+ inotropo y cronotropo). β2: relajación de músculo liso, broncodilatación.","Adrenalina: dosis baja efecto β, dosis alta efecto α; fármaco de elección en anafilaxia.","β-bloqueantes terminan en «-olol»; no suspender de golpe (arritmias)."],
  sections:[
   ["Catecolaminas: síntesis y metabolismo",`
    <p><b>Síntesis:</b> L-tirosina → (tirosina hidroxilasa) L-DOPA → (DOPA descarboxilasa) dopamina → (dopamina β-hidroxilasa) noradrenalina → (feniletanolamina N-metiltransferasa) adrenalina.</p>
    <p>Catecolaminas: noradrenalina, adrenalina, dopamina, isoprenalina (isoproterenol). La NA liberada se recapta (transportador NET) o se degrada por <b>MAO</b> (monoaminooxidasa) y <b>COMT</b> (catecol-O-metiltransferasa); los metabolitos se eliminan en orina.</p>
    <p><b>Simpático, «lucha o huida»:</b> ↑ frecuencia cardiaca, ↑ presión arterial, flujo sanguíneo al músculo, digestión más lenta.</p>
    <p><b>Afinidad:</b> en receptores α, adrenalina ≥ noradrenalina &gt;&gt; isoproterenol; en receptores β, isoproterenol &gt; adrenalina &gt; noradrenalina.</p>`],
   ["Receptores adrenérgicos",`
    ${T(["Receptor","Tejido","Acciones"],[["α1","Músculo liso vascular, dilatador de la pupila, pilomotor, trígono y esfínteres, próstata","Vasoconstricción, ↑ resistencia periférica y PA, midriasis, cierre del esfínter interno de la vejiga (retención urinaria), eyaculación, inhibe secreción nasal y bronquial"],["α2","Presináptico en SNC, plaquetas, terminales adrenérgicos, adipocitos","Inhibe la liberación de noradrenalina (retroalimentación negativa) y de insulina; agregante plaquetario"],["β1","Corazón, células yuxtaglomerulares","Inotropismo y cronotropismo positivos, ↑ lipólisis; libera renina (↑ retención de Na⁺ y agua → ↑ PA)"],["β2","Músculo liso bronquial, uterino, vascular; músculo esquelético; hígado; páncreas","Vasodilatación, broncodilatación, relajación uterina, glucogenólisis (↑ glucemia), liberación de glucagón/insulina, temblor muscular, captación de K⁺"],["β3","Adipocitos","Lipólisis"],["D1 / D2","Músculo liso vascular renal / terminal sináptica","Vasodilatación renal / modula liberación de neurotransmisores"]])}`],
   ["Adrenalina y agonistas α",`
    <h4>Adrenalina (epinefrina)</h4>
    ${UL(["<b>Acción según dosis:</b> dosis alta → efecto α (vasoconstricción); dosis baja → efecto β (↑ FC; broncodilatación; contracción de músculo esquelético).","Músculo liso GI se relaja; útero se relaja. Relaja el músculo bronquial (β2).","Metabolismo: ↑ consumo de O2 (25 %), glucogenólisis y lipólisis: hiperglucemia. SNC: ansiedad, debilidad.","No atraviesa la BHE. IV: ↑ PA proporcional a la dosis.","<b>Usos:</b> ataques agudos de asma, reacciones alérgicas y <b>choque anafiláctico</b> (revierte la hipotensión), paro cardiorrespiratorio (RCP), bradicardia inestable, prolonga la anestesia local (vasoconstrictor), hemostasia en endoscopia o cirugía. Vías: SC, IM, inhalada, IV. Categoría C.","Efectos adversos: midriasis, agitación, arritmia, angina, taquicardia, hipertensión, hipertermia, sudoración, convulsiones."])}
    <h4>Agonistas α1</h4>
    <p><b>Fenilefrina, oximetazolina, nafazolina:</b> vasoconstricción local de los vasos de la mucosa (descongestionantes nasales); fenilefrina también en hipotensión y como midriático. Midodrina: hipotensión ortostática. Efectos adversos: HTA, ictus, IAM.</p>
    <p><b>Pseudoefedrina (α y β):</b> alivio temporal de la congestión nasal en rinitis, catarro y gripe. Adultos y &gt; 12 años: cápsulas de liberación prolongada ${dose("120 mg c/12 h")}, máx. 240 mg/día. Aumenta FC y PA, broncodilata, cruza la BHE, midriasis.</p>
    <h4>Agonistas α2 (antiadrenérgicos centrales)</h4>
    <p><b>Clonidina, guanabenz, guanfacina:</b> inhiben la liberación de NA en el SNC: hipertensión, TDAH. Suspender bruscamente causa hipertensión de rebote; también hipotensión ortostática, sedación, fatiga, náusea. <b>Metildopa:</b> se convierte en el falso neurotransmisor metilnoradrenalina; segura en embarazo; efectos: somnolencia, toxicidad hepática, reacciones hemolíticas.</p>`],
   ["Agonistas β",`
    ${T(["Fármaco","Receptor","Uso y datos"],[["Isoproterenol","β1 y β2 (no selectivo)","Estimula el corazón (bradicardia, bloqueo AV); broncodilata (asma, hoy sustituido por β2 selectivos). RAM: taquicardia, palpitaciones, arritmias, angina, IAM."],["Salbutamol (albuterol), terbutalina","β2 selectivo, acción corta","Crisis de broncoespasmo, asma y EPOC; hiperpotasemia. Oral o inhalado: inicio 2–15 min, dura 3 h. RAM: temblor, ansiedad, taquicardia leve, hipopotasemia."],["Salmeterol, formoterol","β2 selectivo, acción prolongada","Duración 12 h; profilaxis y tratamiento de asma y EPOC."],["Ritodrina","β2 selectivo","Relajante uterino: amenaza de parto prematuro. IV, oral. Contraindicada en cardiopatías y diabetes gestacional; categoría X en las primeras 20 semanas. RAM: hiperglucemia, hipopotasemia, taquicardia, ↑ renina."],["Dobutamina","Agonista β1-β2, antagonista α1","Apoyo inotrópico en descompensación cardiaca por depresión de la contractilidad o tras cirugía cardiaca. En choque cardiogénico y séptico, la dopamina es de elección tras corregir la hipovolemia. Categoría C."]])}
    <p><b>Uso en emergencias:</b> crisis anafiláctica (1. adrenalina, 2. corticoides, 3. antihistamínicos), paro cardiorrespiratorio (desfibrilación, adrenalina, amiodarona o lidocaína), bradicardia inestable (atropina, marcapasos, dopamina, adrenalina), broncoespasmo (salbutamol + corticoides; MgSO4).</p>`],
   ["Bloqueantes α",`
    ${T(["Grupo","Fármacos"],[["α-bloqueadores","Doxazosina, fenoxibenzamina, fentolamina, prazosina, terazosina, tamsulosina (terminan en «-osina»)"]])}
    ${UL(["<b>Prazosina, terazosina, doxazosina:</b> antagonistas α1.","<b>Hipertensión:</b> la 1.ª dosis da hipotensión ortostática y síncope: tomarla con la cena, "+dose("1 mg 2 veces/día por 4 días")+"; mantenimiento 3–20 mg/día en 2 tomas.","<b>Hiperplasia prostática benigna:</b> ↓ tono del cuello vesical y la próstata, mejora el flujo urinario: "+dose("0.5 mg 2 veces/día por 3–7 días")+", mantenimiento 2 mg 2 veces/día (tamsulosina es α1A).","<b>Efectos adversos:</b> hipotensión ortostática, taquicardia refleja, vértigo, congestión nasal, cefalea, disfunción sexual (inhiben la eyaculación)."])}`],
   ["Bloqueantes β («-olol»)",`

    ${UL(["<b>Cardiovascular:</b> ↓ fuerza, trabajo y consumo de O2 cardiaco; inotrópico y cronotrópico negativo. ↓ perfusión renal y liberación de renina (sistema renina-angiotensina-aldosterona) pero ↑ retención de Na⁺.","<b>Efectos adversos:</b> hipotensión, bradicardia, somnolencia, fatiga, broncoconstricción (bloqueo β2), disfunción sexual, alteraciones del metabolismo de la glucosa, <b>arritmias y taquicardia de rebote si se suspenden de golpe</b>.","Historia: James Black (1960, Inglaterra) buscaba tratar el infarto: pronetalol, propranolol.","Usos («5 anti»): antihipertensivos, antiarrítmicos (clase II), anti-insuficiencia cardiaca, antianginosos, anti-IAM."])}`],

    ${D("<b>Exceso adrenérgico (mnemotecnia MATHS):</b> Midriasis · Agitación, arritmia, angina · Taquicardia · Hipertensión, hipertermia · Sudoración, convulsiones.")}`]
  ],
  cards:[["Orden de síntesis de catecolaminas","Tirosina → DOPA → dopamina → noradrenalina → adrenalina."],["Enzimas que degradan catecolaminas","MAO y COMT."],["Efectos α1","Vasoconstricción, ↑ PA, midriasis, cierre del esfínter vesical, eyaculación."],["Efecto α2 presináptico","Inhibe la liberación de noradrenalina."],["Efectos β1","Corazón: inotropismo y cronotropismo positivos; liberación de renina."],["Efectos β2","Broncodilatación, vasodilatación, relajación uterina, glucogenólisis, temblor."],["Adrenalina según dosis","Baja → β (↑ FC, broncodilatación); alta → α (vasoconstricción)."],["Fármaco de elección en choque anafiláctico","Adrenalina."],["Salbutamol vs salmeterol","Salbutamol: corto (3 h, crisis). Salmeterol: prolongado (12 h, profilaxis)."],["Ritodrina","β2 selectivo, relajante uterino para amenaza de parto prematuro."],["Primera dosis de prazosina: riesgo","Hipotensión ortostática y síncope (tomar con la cena)."],["β-bloqueantes cardioselectivos","Acebutolol, atenolol, metoprolol, esmolol."],["¿Por qué no suspender un β-bloqueante de golpe?","Arritmias / taquicardia de rebote."],["MATHS","Midriasis, Agitación-arritmia-angina, Taquicardia, Hipertensión-hipertermia, Sudoración-convulsiones (exceso adrenérgico)."],["Antídoto del exceso antiadrenérgico","Glucagón (y adrenérgicos)."]],

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem("farma:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("farma:"+k,JSON.stringify(v))}catch(e){}}};
let studied=store.get("studied",{});
let best=store.get("best",{});
let current=null, mode="resumen";
const groups=["Bases","Seguridad","Desarrollo de fármacos","Fármacos"];
const $=s=>document.querySelector(s);
const main=$("#main");

function renderIndex(){
  const nav=$("#index"); let h=`<div class="grp">Clases en orden</div><button data-go="inicio" ${current===null?'aria-current="true"':''}><span class="num">℞</span>Inicio</button>`;
  let lastG=null;
  UNITS.forEach(u=>{
    h+=`<button data-go="${u.id}" ${current===u.id?'aria-current="true"':''}><span class="num">${u.n}</span>${short(u.title)}<span class="tick ${studied[u.id]?"on":""}" aria-label="${studied[u.id]?"estudiada":"pendiente"}"></span></button>`;
  });
  h+=`<div class="special"><button data-go="repaso" ${current==="repaso"?'aria-current="true"':''}><span class="num">✎</span>Repaso general</button></div>`;
  nav.innerHTML=h;
  const c=Object.values(studied).filter(Boolean).length;
  $("#pbar").style.width=(c/UNITS.length*100)+"%"; $("#ptext").textContent=`${c} de ${UNITS.length} estudiadas`;
}
const short=t=>({"Generalidades de la farmacología":"Generalidades","Reacciones adversas a medicamentos (RAM)":"RAMs","Aislamiento y síntesis de nuevos principios activos":"Aislamiento y síntesis","Desarrollo galénico de medicamentos":"Desarrollo galénico","Colinérgicos y anticolinérgicos":"Colinérgicos","Adrenérgicos y antiadrenérgicos":"Adrenérgicos","Antiinflamatorios y analgésicos":"Antiinflamatorios y analgésicos"}[t]||t);

function go(id,push=true){
  if(id==="inicio"||!id){current=null;renderHome()}
  else if(id==="repaso"){current="repaso";renderReview()}
  else{const u=UNITS.find(x=>x.id===id); if(!u){current=null;renderHome()} else {current=id;mode="resumen";renderUnit(u)}}
  renderIndex(); store.set("last",current);
  if(push){try{history.replaceState(null,"",current?"#"+current:"#")}catch(e){}}
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderHome(){
  const c=Object.values(studied).filter(Boolean).length;
  main.innerHTML=`<div class="hero-note"><div><h2 style="font-size:clamp(24px,3.4vw,34px)">Tu repaso de farmacología, unidad por unidad</h2>
   <p>Cada unidad tiene un <b>resumen</b> con lo clave de las diapositivas, <b>tarjetas</b> para memorizar y un <b>quiz</b> con retroalimentación. Las calculadoras de pKa, dosis y Naranjo están dentro de sus unidades. Marca cada unidad como estudiada para llevar tu avance (se guarda en este navegador).</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-go="${UNITS.find(u=>!studied[u.id])?.id||"repaso"}">${c? "Continuar":"Empezar"}</button><button class="btn" data-go="repaso">Repaso general</button></div></div>
   ${groups.map(g=>`<h3 style="font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px">${g}</h3>
   <div class="home-grid">${UNITS.filter(u=>u.group===g).map(u=>`<button class="ucard" data-go="${u.id}"><span class="n"><span>Clase ${u.n}</span><span>${studied[u.id]?'<span class="pill g">estudiada</span>':(best[u.id]!=null?`quiz ${best[u.id]}%`:"")}</span></span><h3>${short(u.title)}</h3><p>${u.lead}</p></button>`).join("")}</div>`).join("")}`;
}

function renderUnit(u){
  const bestTxt=best[u.id]!=null?`mejor quiz: ${best[u.id]}%`:"quiz sin intentar";
  main.innerHTML=`<article class="label">
    <div class="label-top"><span>Clase ${u.n}</span><span>${u.group}</span><span class="sp"></span><span>${u.slidesLabel||u.slides+" diapositivas"}</span></div>
    <div class="label-body"><h2>${u.title}</h2><p class="lead">${u.lead}</p></div>
    <div class="label-foot"><div class="tabs" role="tablist">${[["resumen","Resumen"],["tarjetas",`Tarjetas · ${u.cards.length}`],["quiz",`Quiz · ${u.quiz.length}`]].map(([k,l])=>`<button role="tab" data-mode="${k}" aria-selected="${mode===k}">${l}</button>`).join("")}</div>
    <span>${bestTxt}</span>
    <button class="btn ${studied[u.id]?"on":""}" id="studyBtn">${studied[u.id]?"✓ Estudiada":"Marcar como estudiada"}</button></div>
  </article><section id="pane"></section>
  <div style="display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap">${navBtns(u)}</div>`;
  $("#studyBtn").onclick=()=>{studied[u.id]=!studied[u.id];store.set("studied",studied);renderUnit(u);renderIndex()};
  main.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderUnit(u)});
  const pane=$("#pane");
  if(mode==="resumen") renderSummary(u,pane); else if(mode==="tarjetas") renderCards(u.cards,pane,u.title); else renderQuiz(u.quiz,pane,u.id);
}
function navBtns(u){const i=UNITS.indexOf(u),p=UNITS[i-1],n=UNITS[i+1];
  return `${p?`<button class="btn" data-go="${p.id}">← ${short(p.title)}</button>`:"<span></span>"}${n?`<button class="btn" data-go="${n.id}">${short(n.title)} →</button>`:`<button class="btn primary" data-go="repaso">Repaso general →</button>`}`}

function renderSummary(u,pane){
  pane.innerHTML=`<div class="key"><h3>Lo que no puede faltar</h3><ul>${u.key.map(k=>`<li>${k}</li>`).join("")}</ul></div>
   <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px"><button class="btn" id="openAll">Abrir todo</button><button class="btn" id="closeAll">Cerrar todo</button></div>
   ${u.sections.map(([h,b],i)=>`<details class="sec" ${i===0?"open":""} id="s-${u.id}-${i}"><summary>${h}</summary><div class="sec-body">${b}</div></details>`).join("")}`;
  $("#openAll").onclick=()=>pane.querySelectorAll("details").forEach(d=>d.open=true);
  $("#closeAll").onclick=()=>pane.querySelectorAll("details").forEach(d=>d.open=false);
  if(pane.querySelector("#hh")) mountHH();
  if(pane.querySelector("#calc")) mountCalc();
  if(pane.querySelector("#exs")) mountExercises();
  if(pane.querySelector("#naranjo")) mountNaranjo();
}

/* ---------- flashcards ---------- */
function renderCards(cards,pane,title){
  let order=cards.map((_,i)=>i), i=0;
  const draw=()=>{const [q,a]=cards[order[i]];
    pane.innerHTML=`<div class="fc-wrap"><button class="fc" id="fc" aria-label="Voltear tarjeta"><div class="fc-in"><div class="fc-face"><span class="tag">Pregunta</span><div>${q}</div></div><div class="fc-face back"><span class="tag">Respuesta</span><div>${a}</div></div></div></button>
    <div class="fc-nav"><button class="btn" id="prev">← Anterior</button><span class="fc-count">${i+1} / ${cards.length}</span><button class="btn" id="next">Siguiente →</button><button class="btn" id="shuf">Barajar</button></div>
    <p class="src">Toca la tarjeta o pulsa espacio para voltear; flechas para avanzar.</p></div>`;
    const fc=$("#fc"); fc.onclick=()=>fc.classList.toggle("flip");
    $("#prev").onclick=()=>{i=(i-1+cards.length)%cards.length;draw()};
    $("#next").onclick=()=>{i=(i+1)%cards.length;draw()};
    $("#shuf").onclick=()=>{order.sort(()=>Math.random()-.5);i=0;draw()};
  };
  draw();
  pane._keys=e=>{if(!$("#fc"))return; if(e.key===" "&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#fc").classList.toggle("flip")} if(e.key==="ArrowRight")$("#next")?.click(); if(e.key==="ArrowLeft")$("#prev")?.click()};
}
document.addEventListener("keydown",e=>{const p=$("#pane")||$("#rpane"); if(p&&p._keys)p._keys(e)});

/* ---------- quiz ---------- */
function renderQuiz(qs,pane,uid,srcLabels){
  let answered=0, right=0;
  pane.innerHTML=`<div class="quiz">${qs.map((q,qi)=>`<div class="q" data-qi="${qi}"><div class="qh"><span class="qn">${String(qi+1).padStart(2,"0")}</span><span class="qt">${q.q}</span></div>
    ${srcLabels?`<div class="src" style="margin:-4px 0 8px">${srcLabels[qi]}</div>`:""}
    <div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${o}</button>`).join("")}</div><div class="expl" hidden></div></div>`).join("")}
    <div class="score" id="score"><span>Responde las ${qs.length} preguntas</span><strong id="scoreN">0 / ${qs.length}</strong><button class="btn" id="retry">Reiniciar</button></div></div>`;
  pane.querySelectorAll(".q").forEach(qel=>{
    const q=qs[+qel.dataset.qi];
    qel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const oi=+b.dataset.oi; qel.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.oi===q.a)x.classList.add("ok")});
      if(oi!==q.a)b.classList.add("no"); else right++;
      answered++; const ex=qel.querySelector(".expl"); ex.hidden=false; ex.innerHTML=`<b>${oi===q.a?"Correcto.":"Incorrecto."}</b> ${q.e}`;
      $("#scoreN").textContent=`${right} / ${qs.length}`;
      if(answered===qs.length){const pct=Math.round(right/qs.length*100);
        $("#score").firstElementChild.textContent=pct>=80?"¡Excelente! Dominas esta unidad.":pct>=60?"Bien. Repasa las que fallaste.":"Vuelve al resumen y a las tarjetas.";
        if(uid){ if(best[uid]==null||pct>best[uid]){best[uid]=pct;store.set("best",best)} }}
    });
  });
  $("#retry").onclick=()=>renderQuiz(qs,pane,uid,srcLabels);
}

/* ---------- review ---------- */
function renderReview(){
  main.innerHTML=`<article class="label"><div class="label-top"><span>Repaso</span><span>Todas las unidades</span></div>
   <div class="label-body"><h2>Repaso general</h2><p class="lead">Preguntas al azar de todas las clases. Elige cuántas y si quieres quiz o tarjetas.</p></div>
   <div class="label-foot"><div class="row"><label class="field">Preguntas<select id="rn"><option>10</option><option selected>20</option><option>40</option></select></label>
   <label class="field">Unidades<select id="ru"><option value="all">Todas</option>${groups.map(g=>`<option value="${g}">${g}</option>`).join("")}</select></label></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="rq">Nuevo quiz</button><button class="btn" id="rc">Tarjetas mezcladas</button></div></div></article><section id="rpane"></section>`;
  const pool=()=>{const g=$("#ru").value;return UNITS.filter(u=>g==="all"||u.group===g)};
  const quiz=()=>{const n=+$("#rn").value; let all=[];pool().forEach(u=>u.quiz.forEach(q=>all.push([q,u])));all.sort(()=>Math.random()-.5);all=all.slice(0,n);
    renderQuiz(all.map(x=>x[0]),$("#rpane"),null,all.map(x=>`Clase ${x[1].n} · ${short(x[1].title)}`))};
  $("#rq").onclick=quiz;
  $("#rc").onclick=()=>{let all=[];pool().forEach(u=>u.cards.forEach(c=>all.push([c[0]+`<div class="src" style="margin-top:10px">Clase ${u.n} · ${short(u.title)}</div>`,c[1]])));all.sort(()=>Math.random()-.5);renderCards(all,$("#rpane"))};
  quiz();
}

/* ---------- tools ---------- */
function mountHH(){
  const el=$("#hh");
  const presets=[["Naproxeno (ácido)",5.0,"a"],["Aspirina (ácido)",3.5,"a"],["Warfarina (ácido)",5.0,"a"],["Fenitoína (ácido)",8.3,"a"],["Morfina (base)",7.9,"b"],["Atropina (base)",9.7,"b"],["Lidocaína (base)",7.9,"b"],["Anfetamina (base)",9.8,"b"]];
  el.innerHTML=`<h4>Calculadora de ionización (Henderson-Hasselbalch)</h4>
   <div class="row"><label class="field">Fármaco de la tabla<select id="hhp">${presets.map((p,i)=>`<option value="${i}">${p[0]} · pKa ${p[1]}</option>`).join("")}<option value="x">Otro…</option></select></label>
   <label class="field">Tipo<select id="hht"><option value="a">Ácido débil</option><option value="b">Base débil</option></select></label>
   <label class="field">pKa<input id="hhk" type="number" step="0.1" value="5"></label>
   <label class="field">pH del medio<select id="hhs"><option value="2">Jugo gástrico · 2</option><option value="6.5">Intestino · 6.5</option><option value="7.4" selected>Plasma · 7.4</option><option value="5.5">Orina ácida · 5.5</option><option value="8">Orina alcalina · 8</option></select></label></div>
   <div class="out" id="hho"></div><div class="meter" aria-hidden="true"><i id="hhm1" style="background:var(--teal)"></i><i id="hhm2" style="background:var(--amber)"></i></div>
   <div class="src" style="margin-top:6px"><span style="color:var(--teal)">■</span> no ionizada (cruza membranas) &nbsp; <span style="color:var(--amber)">■</span> ionizada (queda atrapada)</div>`;
  const calc=()=>{const t=$("#hht").value,k=+$("#hhk").value,ph=+$("#hhs").value; if(isNaN(k))return;
    const r=t==="a"?Math.pow(10,ph-k):Math.pow(10,k-ph); const ion=r/(1+r)*100, non=100-ion;
    const fmt=v=>v>=1000?Math.round(v).toLocaleString("es-MX"):v>=10?v.toFixed(0):v>=0.01?v.toFixed(3):v.toExponential(1);
    $("#hho").innerHTML=`${t==="a"?"[A⁻]/[HA]":"[BH⁺]/[B]"} = 10^${t==="a"?`(${ph} − ${k})`:`(${k} − ${ph})`} = <b>${fmt(r)}</b> &nbsp;→&nbsp; ${ion.toFixed(ion>99.9||ion<0.1?3:1)} % ionizado, ${non.toFixed(non>99.9||non<0.1?3:1)} % no ionizado`;
    $("#hhm1").style.width=non+"%"; $("#hhm2").style.width=ion+"%";};
  $("#hhp").onchange=e=>{const v=e.target.value; if(v!=="x"){const p=presets[+v];$("#hhk").value=p[1];$("#hht").value=p[2]} calc()};
  ["#hht","#hhk","#hhs"].forEach(s=>$(s).addEventListener("input",calc)); calc();
}
function mountCalc(){
  $("#calc").innerHTML=`<h4>Calculadora de regla de tres</h4>
   <div class="row"><label class="field">D · dosis deseada (mg)<input id="cD" type="number" value="60"></label>
   <label class="field">T · dosis del envase (mg)<input id="cT" type="number" value="125"></label>
   <label class="field">V · en cuánto vehículo (ml)<input id="cV" type="number" value="5"></label></div>
   <div class="out" id="cO"></div>
   <h4 style="margin-top:14px">Dosis por peso</h4>
   <div class="row"><label class="field">Peso (kg)<input id="wK" type="number" value="12"></label>
   <label class="field">mg/kg por toma<input id="wM" type="number" value="15"></label>
   <label class="field">Cada (horas)<select id="wH"><option>4</option><option>6</option><option selected>8</option><option>12</option><option>24</option></select></label></div>
   <div class="out" id="wO"></div>`;
  const f=n=>(+n.toFixed(2)).toLocaleString("es-MX");
  const c=()=>{const D=+$("#cD").value,T=+$("#cT").value,V=+$("#cV").value; $("#cO").innerHTML=T>0?`X = ${D} × ${V} / ${T} = <b>${f(D*V/T)} ml</b>`:"Escribe la dosis del envase."};
  const w=()=>{const k=+$("#wK").value,m=+$("#wM").value,h=+$("#wH").value,dose=k*m,n=24/h; $("#wO").innerHTML=`${k} kg × ${m} mg/kg = <b>${f(dose)} mg por toma</b> · ${n} tomas al día = <b>${f(dose*n)} mg/día</b>`};
  ["#cD","#cT","#cV"].forEach(s=>$(s).addEventListener("input",c)); ["#wK","#wM","#wH"].forEach(s=>$(s).addEventListener("input",w)); c(); w();
}
function mountExercises(){
  const ex=[
   ["Ejercicio 1","Botella de cefaclor etiquetada 125 mg/5 ml. Si deben administrarse 60 mg, ¿cuántos ml se necesitan?","125 mg → 5 ml\n 60 mg → X ml\nX = (60 × 5) / 125 = 2.4 ml"],
   ["Ejercicio 2","Se administran 1 000 ml/día de suero glucosado al 5 %. ¿Cuántos mg de glucosa recibe al día?","5 % p/v = 5 g en 100 ml\n1 000 ml × 5 g / 100 ml = 50 g\n50 g = 50 000 mg de glucosa al día",
    "La diapositiva escribe «en 100 ml hay 5 mg»; por definición de % p/v son 5 g."],
   ["Ejercicio 3","Albúmina: 6 g por cada litro de líquido ascítico. Se obtienen 5 litros. Frascos de albúmina humana al 20 % de 50 ml. ¿Cuántos ml (y frascos) se administran?","Dosis: 6 g × 5 L = 30 g\nAlbúmina 20 % = 20 g en 100 ml\n30 g × 100 ml / 20 g = 150 ml\nCada frasco de 50 ml trae 10 g → 3 frascos"],
   ["Ejercicio 4","Niño de 12 kg con paracetamol 15 mg/kg VO cada 8 horas. ¿Cuántos mg recibe al día?","12 kg × 15 mg/kg = 180 mg por toma\nCada 8 h = 3 tomas al día\n180 × 3 = 540 mg/día"],
   ["Ejercicio 5","Se requieren 240 mg del fármaco D IV; presentación 150 mg/5 ml. ¿Cuántos ml? Si se pasa a 1 ml cada 30 s, ¿en cuánto tiempo pasa la dosis?","240 × 5 / 150 = 8 ml\n8 ml × 30 s = 240 s = 4 minutos"]];
  $("#exs").innerHTML=ex.map(([t,p,s,n],i)=>`<div class="ex"><p><b>${t}.</b> ${p}</p><button class="btn" data-sol="${i}">Ver solución</button><div class="sol" id="sol${i}" hidden>${s}</div>${n?`<div class="note" id="soln${i}" hidden><b>Ojo:</b> ${n}</div>`:""}</div>`).join("");
  $("#exs").querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>{const i=b.dataset.sol,s=$("#sol"+i),n=$("#soln"+i);s.hidden=!s.hidden;if(n)n.hidden=s.hidden;b.textContent=s.hidden?"Ver solución":"Ocultar solución"});
}
function mountNaranjo(){
  const Q=[["¿Existen estudios previos de esta reacción?",1,0],["¿Apareció la reacción después de administrar el medicamento?",2,-1],["¿Mejora al suspender el medicamento o al dar un antagonista específico?",1,0],["¿Reaparece al readministrar el medicamento?",2,-1],["¿Existen causas alternativas (no medicamentos) que podrían haberla causado?",-1,2],["¿Reaparece al administrar un placebo?",-1,1],["¿Se detectó el fármaco en sangre u otros fluidos en concentraciones tóxicas?",1,0],["¿Es más grave al aumentar la dosis y menos al disminuirla?",1,0],["¿Tuvo una reacción similar al mismo fármaco o a uno parecido antes?",1,0],["¿Se confirmó con alguna evidencia objetiva?",1,0]];
  const ans=Q.map(()=>null);
  const el=$("#naranjo");
  const draw=()=>{const tot=ans.reduce((s,a,i)=>s+(a==="s"?Q[i][1]:a==="n"?Q[i][2]:0),0);
    const cat=tot>=9?["Definitiva","r"]:tot>=5?["Probable","a"]:tot>=1?["Posible","a"]:["Dudosa","g"];
    el.innerHTML=`<h4>Algoritmo de Naranjo modificado</h4>${Q.map((q,i)=>`<div class="nq"><span>${i+1}. ${q[0]} <span class="src">(Sí ${q[1]>0?"+":""}${q[1]} · No ${q[2]>0?"+":""}${q[2]})</span></span>
     <span class="seg">${[["s","Sí"],["n","No"],["x","No sé"]].map(([k,l])=>`<button data-i="${i}" data-k="${k}" aria-pressed="${ans[i]===k}">${l}</button>`).join("")}</span></div>`).join("")}
     <div class="out">Puntuación: <b>${tot}</b> → <span class="pill ${cat[1]}">${cat[0]}</span> <span class="src">(${ans.filter(a=>a!==null).length}/10 respondidas)</span></div>
     <button class="btn" id="nreset" style="margin-top:10px">Reiniciar</button>`;
    el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ans[+b.dataset.i]=b.dataset.k;draw()});
    $("#nreset").onclick=()=>{ans.fill(null);draw()};
  };
  draw();
}

/* ---------- search ---------- */
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const INDEX=[];
UNITS.forEach(u=>{u.sections.forEach(([h,b],i)=>INDEX.push({u,i,h,t:strip(b)}));u.cards.forEach(([q,a])=>INDEX.push({u,i:-1,h:"Tarjeta",t:strip(q+" — "+a)}))});
let lastView=null;
$("#q").addEventListener("input",e=>{
  const v=e.target.value.trim(); if(!v){ if(lastView!==null){go(lastView,false);lastView=null} return }
  if(lastView===null) lastView=current||"inicio";
  const nv=norm(v); const hits=INDEX.filter(x=>norm(x.h+" "+x.t).includes(nv)).slice(0,40);
  const snip=t=>{const n=norm(t),p=n.indexOf(nv); const s=Math.max(0,p-60); let out=(s>0?"…":"")+t.slice(s,p+nv.length+90)+"…"; const re=new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); return out.replace(re,"<mark>$1</mark>")};
  main.innerHTML=`<h2 style="font-size:22px;margin-bottom:12px">${hits.length} resultado${hits.length===1?"":"s"} para «${v}»</h2><div class="results">${hits.map(x=>`<button class="res" data-u="${x.u.id}" data-s="${x.i}"><b>Clase ${x.u.n} · ${short(x.u.title)}</b> — ${x.h}<span>${snip(x.t)}</span></button>`).join("")||'<p class="src">Prueba con otra palabra (por ejemplo «CYP», «miosis», «fase III»).</p>'}</div>`;
  main.querySelectorAll(".res").forEach(b=>b.onclick=()=>{const u=b.dataset.u,s=+b.dataset.s;$("#q").value="";lastView=null;go(u);
    if(s>=0){setTimeout(()=>{const d=document.getElementById(`s-${u}-${s}`);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}},60)} else {mode="tarjetas";renderUnit(UNITS.find(x=>x.id===u))}});
});

/* ---------- boot ---------- */
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"); if(g){$("#q").value="";lastView=null;go(g.dataset.go)}});
const h=(location.hash||"").slice(1);
go(h||store.get("last",null)||"inicio",false);
</script>
