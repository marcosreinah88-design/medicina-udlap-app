<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fisiología Clínica</title>
<link rel="stylesheet" href="../../fonts/g973afc81ad.css">
<style>
/* Guía de estudio de 1º/2º semestre: temas divididos en subtemas con diagramas de flujo, cifras clave, conceptos para revelar,
   mnemotecnias, tablas con autoexamen, alto rendimiento, correlación clínica, mini-quiz por tema y progreso; tarjetas y examen. */
:root{
  --bg:#f5f3ee; --paper:#fff; --sunk:#ece8df; --ink:#17201c; --muted:#5d6762; --line:#ddd7cb;
  --c:#b3261e; --c-soft:color-mix(in srgb,var(--c) 11%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 82%,#000);
  --hy:#f26b21; --hy-soft:#fff1e8; --cl:#00573c; --cl-soft:#e6f2ec; --ok:#1d7a4c; --bad:#b3261e;
  --f-d:"Newsreader",Georgia,serif; --f-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --paper:#171e1b; --sunk:#1f2824; --ink:#e7eeea; --muted:#9daba4; --line:#2b3732;
  --c-soft:color-mix(in srgb,var(--c) 22%,var(--paper)); --c-ink:color-mix(in srgb,var(--c) 45%,#fff);
  --hy-soft:#3a2418; --cl:#7fd3a8; --cl-soft:#16302a; --ok:#6fd39c; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-b);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
b,strong{font-weight:700}
/* encabezado */
header.hero{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:26px;position:relative;overflow:hidden}
header.hero::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font:800 9rem/1 var(--f-d);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kick{font:500 .74rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.05 var(--f-d);margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:12px 0 0;max-width:62ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:20px;font-size:.88rem;opacity:.92}
.stats b{font:600 1.15rem var(--f-m);margin-right:6px}
.nota{margin:18px 0 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 13px;font-size:.88rem;max-width:80ch}
/* pestañas */
nav.tabs{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .in{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
/* estudiar */
.study{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:22px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:.9rem}
.toc p{font:600 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc .tg{margin-bottom:2px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.3}
.toc a span{font:500 .75rem var(--f-m);color:var(--c-ink);min-width:1.6em}
.toc a:hover,.toc a.on{background:var(--c-soft)}
.toc .tg.ok>a span{color:var(--ok)}
.toc .tg.ok>a span::before{content:"✓"}
.toc .tg.ok>a span i{display:none}
.toc .sl{display:none;margin:2px 0 6px 30px;border-left:2px solid var(--c-soft)}
.toc .tg.on .sl{display:block}
.toc .sl a{font-size:.82rem;padding:3px 10px;color:var(--muted)}
.toc .sl a:hover{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:20px}
.tools .pg{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0;font-size:.85rem;color:var(--muted)}
.tools .pg i{flex:1;height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;min-width:60px}
.tools .pg i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--hy));border-radius:9px;transition:width .4s}
.tools .pg strong{color:var(--ink);font-family:var(--f-m);font-weight:600}
.tg-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.tg-btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tg-btn:hover{border-color:var(--c)}
.tema{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:26px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.tema.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.thead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:start;padding:22px 24px 18px;background:linear-gradient(135deg,var(--c-soft),var(--paper) 70%);border-bottom:1px solid var(--line)}
.thead .bn{grid-row:span 3;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1.5rem var(--f-d);box-shadow:0 8px 18px -10px var(--c)}
.tema.ok .thead .bn{background:var(--ok)}
.tema .num{font:500 .72rem var(--f-m);letter-spacing:.1em;color:var(--c-ink);text-transform:uppercase}
.tema h2{font:700 1.6rem/1.15 var(--f-d);margin:2px 0 4px;text-wrap:balance}
.tema .intro{color:var(--muted);margin:0}
.schips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.schips a{font-size:.78rem;font-weight:600;text-decoration:none;color:var(--c-ink);background:var(--paper);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:999px;padding:3px 10px}
.schips a:hover{background:var(--c);color:#fff;border-color:var(--c)}
.tbody{padding:8px 24px 20px}
details.sub{border-bottom:1px dashed var(--line);padding:6px 0}
details.sub:last-of-type{border-bottom:0}
details.sub>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0 6px}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary .sn{font:600 .8rem var(--f-m);color:#fff;background:var(--c);border-radius:7px;padding:2px 7px;flex:none}
details.sub>summary h3{margin:0;font:700 1.18rem/1.25 var(--f-d);flex:1}
details.sub>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 3px;transition:transform .2s}
details.sub:not([open])>summary::after{transform:rotate(-45deg)}
.sub .si{color:var(--muted);margin:0 0 6px;font-style:italic}
.sub ul{margin:6px 0;padding-left:1.15em}
.sub li{margin:5px 0}
.sub li::marker{color:var(--c)}
.box{border-radius:12px;padding:12px 16px;margin:12px 0;border-left:4px solid}
.box h4{margin:0 0 4px;font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase}
.box ul{margin:0}
.box.hy{background:var(--hy-soft);border-color:var(--hy)}
.box.hy h4{color:var(--hy)}
.box.cl{background:var(--cl-soft);border-color:var(--cl)}
.box.cl h4{color:var(--cl)}
.box h4::before{margin-right:6px}
.box.hy h4::before{content:"★"}
.box.cl h4::before{content:"✚"}
/* tabla con autoexamen */
.tblw{margin:12px 0}
.tblw .tbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--c-soft);font-weight:700}
tbody tr:hover td{background:color-mix(in srgb,var(--c) 6%,transparent)}
td:first-child{font-weight:600}
.tblw.quiz td:not(:first-child){cursor:pointer}
.tblw.quiz td:not(:first-child):not(.shown){color:transparent;background:repeating-linear-gradient(-45deg,var(--sunk) 0 6px,transparent 6px 12px)}
.tblw.quiz td:not(:first-child):not(.shown) *{color:transparent}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;cursor:pointer}
.mini:hover{border-color:var(--c)}
.mini[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
/* diagrama de flujo */
.flow{margin:14px 0;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.flow .fh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flow .fh b{font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 0;counter-reset:f}
.flow li{counter-increment:f;display:flex;align-items:center}
.flow li .st{position:relative;background:var(--paper);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:12px;padding:8px 12px 8px 36px;font-size:.88rem;line-height:1.35;max-width:240px;min-height:100%;display:flex;align-items:center;transition:opacity .25s,transform .25s}
.flow li .st::before{content:counter(f);position:absolute;left:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font:600 .7rem/20px var(--f-m);text-align:center}
.flow li+li::before{content:"→";flex:none;width:26px;text-align:center;color:var(--c);font:700 1.1rem/1 var(--f-b)}
.flow.step li.dim .st{opacity:.15;transform:scale(.97)}
.flow.step li.dim::before{opacity:.2}
.flow li.cur .st{box-shadow:0 0 0 3px color-mix(in srgb,var(--hy) 45%,transparent);border-color:var(--hy)}
@media (max-width:640px){.flow ol{flex-direction:column;align-items:stretch;gap:0}.flow li{flex-direction:column;align-items:stretch}.flow li+li::before{content:"↓";width:auto;text-align:left;padding:2px 0 2px 14px}.flow li .st{max-width:none}}
/* cifras clave */
.stats-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:linear-gradient(160deg,var(--c-soft),var(--paper));border:1px solid color-mix(in srgb,var(--c) 25%,var(--line));border-radius:14px;padding:12px 14px}
.stat .v{display:block;font:700 1.5rem/1.1 var(--f-d);color:var(--c-ink)}
.stat .l{display:block;font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.35}
/* conceptos para revelar */
.terms{margin:14px 0}
.terms .th{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.terms .th b{font:700 .74rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.terms .tgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.term{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:84px;transition:border-color .2s,background .2s}
.term:hover{border-color:var(--c)}
.term .w{font:700 1.02rem/1.25 var(--f-d)}
.term .d{font-size:.86rem;line-height:1.4;color:var(--ink)}
.term .h{font:500 .68rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:auto}
.term[aria-expanded="false"] .d{display:none}
.term[aria-expanded="true"]{background:var(--c-soft);border-color:var(--c)}
.term[aria-expanded="true"] .h{display:none}
/* mnemotecnia */
.mn{margin:12px 0;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;border:2px dashed color-mix(in srgb,var(--hy) 55%,var(--line));background:color-mix(in srgb,var(--hy) 6%,var(--paper))}
.mn .mi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--hy);color:#fff;font:700 1rem var(--f-d)}
.mn b.mm{display:block;font:700 1.08rem/1.3 var(--f-d);color:var(--ink)}
.mn span{font-size:.88rem;color:var(--muted)}
/* palabras clave ocultas */
body.hidekw .sub li b:not(.shown),body.hidekw .sub td b:not(.shown){color:transparent;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 30%,transparent) 0 5px,color-mix(in srgb,var(--c) 14%,transparent) 5px 10px);border-radius:4px;cursor:pointer}
/* ponte a prueba */
.pp{margin:6px 24px 0;padding:16px 18px;border-radius:14px;background:var(--sunk)}
.pp h4{margin:0 0 10px;font:700 .78rem var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink)}
.pq+.pq{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pq p{margin:0 0 8px;font-weight:600}
.pq .po{display:grid;gap:6px}
.pq .po button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer;font-size:.92rem}
.pq .po button:hover:not(:disabled){border-color:var(--c)}
.pq .po button.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--paper))}
.pq .po button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.pq .po button:disabled{cursor:default}
.pq .pe{margin-top:8px;font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--cl-soft)}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 24px 22px}
.tfoot button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:600;cursor:pointer}
.tfoot button:hover{border-color:var(--c)}
.tfoot .dom{margin-left:auto;background:var(--paper);border-color:var(--ok);color:var(--ok)}
.tfoot .dom[aria-pressed="true"]{background:var(--ok);color:#fff}
.dag{color:var(--hy);font-weight:700}
/* tarjetas */
.pane{padding-block:26px 80px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.bar select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff}
.btn:hover{border-color:var(--c)}
.count{margin-left:auto;font:500 .85rem var(--f-m);color:var(--muted)}
.card{perspective:1200px;max-width:720px;margin:0 auto;cursor:pointer}
.card .face{min-height:260px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.card .lbl{font:500 .72rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink);margin-bottom:10px}
.card .txt{font:600 1.3rem/1.35 var(--f-d)}
.card .back{border-top:5px solid var(--c)}
.card .back .txt{font:400 1.05rem/1.55 var(--f-b)}
.cnav{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.no{border-color:var(--bad);color:var(--bad)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px}
/* examen */
.qbox{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:500 .8rem var(--f-m);color:var(--muted);margin-bottom:8px}
.prog{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--c);width:0}
.qtxt{font:600 1.2rem/1.4 var(--f-d);margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;gap:10px}
.opt span{font:600 .85rem var(--f-m);color:var(--c-ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--cl-soft);font-size:.95rem}
.res{text-align:center}
.res .big{font:700 3.4rem/1 var(--f-d);color:var(--c-ink)}
.res ul{text-align:left;margin:16px auto 0;max-width:620px}
footer{color:var(--muted);font-size:.82rem;padding-block:0 40px}
@media (max-width:820px){.study{grid-template-columns:minmax(0,1fr)}.toc{position:static;max-height:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
  .toc .lst{display:grid;grid-template-columns:1fr 1fr;gap:2px}.toc .sl{display:none!important}.thead{padding:18px 16px 14px;gap:4px 12px}.thead .bn{width:42px;height:42px;font-size:1.2rem;border-radius:12px}.schips{grid-column:1/-1}.tbody{padding:4px 16px 16px}.pp{margin:6px 16px 0}.tfoot{padding:14px 16px 18px}}
@media (max-width:480px){.toc .lst{grid-template-columns:1fr}.card .face{min-height:220px;padding:20px}.card .txt{font-size:1.15rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.toc a{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v3: portada de la guía, mapa del temario, color por tema, buscador ===== */
.readbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;background:linear-gradient(90deg,var(--c),var(--hy));transition:width .1s linear}
header.hero{padding-bottom:34px}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(120deg,transparent 30%,#000 90%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000 90%)}
.hgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px 48px;align-items:center}
.sbox4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28)}
.sbox4 div{padding:10px 12px 9px;border-left:1px solid rgba(255,255,255,.28)}
.sbox4 div:first-child{border-left:0;padding-left:0}
.sbox4 small{display:block;font:500 .66rem var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.sbox4 b{display:block;font:600 1.7rem/1.15 var(--f-m)}
.hact{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.hact button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;cursor:pointer;transition:background .15s,transform .15s}
.hact button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.hact button.pri{background:#fff;color:color-mix(in srgb,var(--c) 80%,#000);border-color:#fff}
.hact button.pri:hover{background:#fff}

const GUIA={"id":"fisiologia-clinica","title":"Fisiología Clínica","kicker":"Tercer semestre · Fisiología Clínica","desc":"Tus notas de Notion de Fisiología Clínica ordenadas por sistema: del electrocardiograma y las arritmias a la hipertensión, el choque, la EPOC y el asma, las enfermedades neurodegenerativas, el riñón y el tubo digestivo. Corregido y completado donde hacía falta.","nota":"Fuente: tus notas de Notion (Medicina › 3er semestre › Fisiología clínica). <b>Corrección<\/b> = estaba mal en tus notas; † = no venía y se agregó para completar el tema.","temas":[{"t":"Excitación rítmica del corazón","subs":[{"t":"Marcapasos y corriente funny","b":[{"k":"ul","x":["El sistema intrínseco del corazón (nodo sinusal, nodo AV, haz de His, Purkinje) está formado por <b>tejido muscular modificado<\/b>, no por nervios.","Al llegar al <b>potencial diastólico máximo<\/b> se abren los canales <b>funny (If)<\/b>, que dejan entrar Na⁺ y producen la despolarización lenta de la fase 4.","La frecuencia de descarga depende de 3 cosas: el <b>potencial diastólico máximo<\/b>, el <b>potencial umbral<\/b> y la <b>pendiente de despolarización<\/b> de la fase 4.","El potencial de acción del nodo sinusal y del nodo AV se parecen; el de <b>Purkinje<\/b> es distinto y tiene todas las corrientes (INa, ICa, IK, If).","El músculo auricular y el ventricular <b>no tienen If<\/b>."]},{"k":"fl","x":["Despolarización del marcapasos","Potencial diastólico máximo","Se abren canales funny (If, entra Na⁺)","Fase 4: despolarización lenta","Umbral","Entra Ca²⁺ (canales tipo L): potencial de acción","Repolarización por salida de K⁺"]},{"k":"cl","x":["Un <b>bloqueador de calcio<\/b> (verapamilo, diltiazem) frena el nodo sinusal y el AV: puede causar <b>bradicardia<\/b>."]},{"k":"hy","x":["Una arritmia significa, por lo general, que el ritmo no viene del nodo sinusal: el nodo se despolariza antes que los marcapasos de reserva y los suprime (salvo que haya un problema de conducción)."]}]},{"t":"Control autonómico","b":[{"k":"tb","x":["Sistema¦Neurotransmisor¦Receptor¦Segundo mensajero¦Efecto","Simpático (adrenérgico)¦Noradrenalina / adrenalina¦β1 (corazón), α (vasos)¦Proteína Gs → adenilato ciclasa → ↑AMPc¦↑ frecuencia, baja el umbral","Parasimpático (colinérgico)¦Acetilcolina¦Muscarínico M2¦Proteína Gi → ↓AMPc¦↓ frecuencia, hiperpolariza"]},{"k":"ul","x":["Los receptores adrenérgicos y muscarínicos son <b>metabotrópicos<\/b> (acoplados a proteína G).","Receptores colinérgicos: <b>nicotínicos<\/b> (ionotrópicos) y <b>muscarínicos<\/b> (el nombre viene del hongo *Amanita muscaria*).","El simpático <b>baja el umbral<\/b> y aumenta la pendiente de la fase 4 (despolarización más temprana); la acetilcolina <b>hiperpolariza<\/b> la célula."]},{"k":"tm","x":[{"w":"Retardo nodal","d":"Pausa de la conducción en el nodo AV para que la sangre pase de aurículas a ventrículos antes de que estos se contraigan."}]}]}],"cards":[{"f":"¿De qué tejido está hecho el sistema de conducción del corazón?","b":"De músculo cardiaco modificado, no de tejido nervioso."},{"f":"¿Qué corriente produce la fase 4 del nodo sinusal?","b":"La corriente funny (If): entrada de Na⁺ por canales HCN."},{"f":"¿Qué proteína G activa la acetilcolina en el corazón?","b":"Gi (inhibe la adenilato ciclasa y baja el AMPc)."}],"quiz":[{"q":"¿Cuál de estas células NO tiene corriente funny (If)?","o":["Fibras de Purkinje","Nodo sinusal","Nodo AV","Músculo ventricular"],"a":3,"e":"El músculo auricular y ventricular no tienen If; los marcapasos y Purkinje sí."},{"q":"La adrenalina aumenta la frecuencia cardiaca porque activa…","o":["Receptores β1 con proteína Gs y aumento de AMPc","Receptores M2 con proteína Gi","Receptores nicotínicos","Canales de K⁺ que hiperpolarizan"],"a":0,"e":"β1 → Gs → adenilato ciclasa → ↑AMPc → más If y más Ca²⁺."}],"intro":"El corazón se excita solo: su sistema de conducción es músculo modificado, no tejido nervioso."},{"t":"Electrocardiograma: cómo leerlo","subs":[{"t":"El papel","b":[{"k":"tb","x":["Cuadro¦Tiempo (horizontal)¦Voltaje (vertical)","Chico (1 mm)¦0.04 s¦0.1 mV","Grande (5 mm)¦0.20 s¦0.5 mV"]},{"k":"st","x":[{"v":"25 mm/s","l":"velocidad estándar: 5 cuadros grandes = 1 segundo"},{"v":"10 mm = 1 mV","l":"2 cuadros grandes de alto equivalen a 1 mV (calibración)"}]},{"k":"tm","x":[{"w":"Intervalo","d":"Desde el inicio de un evento hasta el inicio de otro (PR, QT)."},{"w":"Segmento","d":"Tramo de línea isoeléctrica entre dos ondas (PR, ST)."}]},{"k":"ul","x":["<b>Vector de despolarización<\/b>: punta positiva, cola negativa; si se acerca al electrodo se marca hacia arriba.","<b>Vector de repolarización<\/b>: al revés; por eso se marca hacia abajo si se acerca."]}]},{"t":"Derivaciones y caras del corazón","b":[{"k":"ul","x":["12 derivaciones: 6 <b>frontales<\/b> (DI, DII, DIII, aVR, aVL, aVF) y 6 <b>precordiales<\/b> (V1–V6). aVR, aVL y aVF son unipolares.","<b>aVR<\/b> es casi siempre negativa; <b>DI<\/b> predomina positiva; <b>V3–V4<\/b> son la zona de transición (isobifásicas)."]},{"k":"tb","x":["Derivaciones¦Cara","V1–V2¦Septal","V3–V4¦Anterior","V5–V6¦Lateral baja","DI y aVL¦Lateral alta","DII, DIII y aVF¦Inferior","V4R¦Ventrículo derecho","V7–V9¦Posterior"]},{"k":"hy","x":["<b>Corrección:<\/b> en tus notas DI–aVL dice «lateral baja»; es la <b>lateral alta<\/b>. V5–V6 son la lateral baja."]}]},{"t":"Frecuencia","b":[{"k":"ul","x":["Método de los cuadros grandes: si la segunda R cae en la 1.ª línea gruesa son <b>300<\/b>, luego <b>150, 100, 75, 60, 50<\/b>.","Más exacto: <b>1500 ÷ cuadros chicos<\/b> entre dos R (un minuto tiene 1500 cuadros chicos).","† Si el ritmo es irregular: cuenta los QRS en 6 segundos (30 cuadros grandes) y multiplica por 10."]},{"k":"st","x":[{"v":"60–100 lpm","l":"frecuencia normal en el adulto"}]},{"k":"fl","x":["Calcular la frecuencia","Busca una R sobre línea gruesa","Cuenta cuadros grandes hasta la siguiente R","300 / 150 / 100 / 75 / 60 / 50","Afina con 1500 ÷ cuadros chicos"]}]},{"t":"Ritmo e intervalos","b":[{"k":"ul","x":["<b>Sinusal<\/b>: onda P antes de cada QRS, positiva en DII y negativa en aVR.","<b>Nodal (de la unión)<\/b>: sin onda P (o P retrógrada).","<b>Idioventricular<\/b>: sin P, QRS ancho y frecuencia lenta (bradicardia)."]},{"k":"tb","x":["Medida¦Normal¦Si está alterado","PR¦0.12–0.20 s¦Corto: preexcitación (Wolff-Parkinson-White); largo: bloqueo AV de 1.er grado","QRS¦&lt; 0.12 s (≤ 3 cuadritos)¦≥ 0.12 s: bloqueo de rama o ritmo ventricular","QTc¦&lt; 0.44 s (hombre), &lt; 0.46 s (mujer)¦Prolongado: riesgo de arritmias (torsade de pointes)"]},{"k":"ul","x":["<b>QTc (Bazett) = QT ÷ √RR<\/b> (en segundos)."]},{"k":"hy","x":["<b>Corrección:<\/b> tus notas dicen que el QRS «debe durar 0.12»; 0.12 s ya es el límite <b>anormal<\/b>. Y la fórmula es QT entre raíz de RR (no QTc entre raíz de RR)."]}]},{"t":"Onda P, QRS, hipertrofia y ST","b":[{"k":"ul","x":["Onda P <b>alta<\/b> (&gt; 2.5 mm en DII, «P pulmonale») → crecimiento de <b>aurícula derecha<\/b>.","Onda P <b>ancha<\/b> (&gt; 0.12 s, bimodal, «P mitrale») → crecimiento de <b>aurícula izquierda<\/b>.","<b>Q patológica<\/b>: ≥ 25 % de la R (o ≥ 0.04 s de ancho) → necrosis (infarto antiguo).","<b>HVI (Sokolow-Lyon)<\/b>: S en V1 o V2 + R en V5 o V6 <b>≥ 35 mm<\/b>.","<b>HVD<\/b>: R/S &gt; 1 en V1 o S/R &gt; 1 en V6.","El segmento ST no debe desviarse más de <b>1 mm<\/b> de la línea isoeléctrica.","Causas de ST/T anormal: <b>isquemia<\/b> (infarto), <b>hiperkalemia<\/b> (T alta, picuda y simétrica), variantes de repolarización, QT largo y patrón de sobrecarga («strain»)."]},{"k":"st","x":[{"v":"K⁺ 3.5–5.0 mEq/L","l":"potasio normal; por arriba de ~6 aparecen T picudas"}]},{"k":"cl","x":["Elevación del ST en 2 derivaciones contiguas de la misma cara = infarto con elevación del ST hasta demostrar lo contrario."]},{"k":"mn","x":[{"m":"FRE-RI-EJE-HIPER-INTER","s":"Orden de lectura: frecuencia, ritmo, eje, hipertrofia, intervalos (y luego P, QRS, ST y T)."}]}]}],"cards":[{"f":"¿Cuánto vale un cuadro chico en tiempo y en voltaje?","b":"0.04 s y 0.1 mV."},{"f":"¿Qué cara ven DII, DIII y aVF?","b":"La inferior."},{"f":"¿Cómo se calcula la frecuencia con cuadros chicos?","b":"1500 ÷ número de cuadros chicos entre dos R."},{"f":"¿Qué indica una P ancha y bimodal?","b":"Crecimiento de aurícula izquierda (P mitrale)."},{"f":"Criterio de Sokolow-Lyon para HVI","b":"S en V1 o V2 + R en V5 o V6 ≥ 35 mm."}],"quiz":[{"q":"Hay 15 cuadros chicos entre dos ondas R. ¿Cuál es la frecuencia?","o":["150 lpm","75 lpm","100 lpm","60 lpm"],"a":2,"e":"1500 ÷ 15 = 100 lpm (equivale a 3 cuadros grandes: 300, 150, 100)."},{"q":"Elevación del ST en V3 y V4 sugiere afectación de la cara…","o":["Inferior","Posterior","Anterior","Lateral alta"],"a":2,"e":"V1–V2 septal, V3–V4 anterior, V5–V6 lateral baja."},{"q":"¿Cuál es un QRS normal?","o":["0.12 s","0.08 s","0.20 s","0.16 s"],"a":1,"e":"El QRS normal dura menos de 0.12 s; 0.12 s o más es QRS ancho."},{"q":"Onda T alta, picuda y simétrica en un paciente con insuficiencia renal sugiere…","o":["Hiperkalemia","Hipocalcemia","Hipokalemia","Pericarditis"],"a":0,"e":"La hiperkalemia da T picudas; si avanza, QRS ancho y riesgo de paro."}],"intro":"Papel, derivaciones y los 8 pasos: frecuencia, ritmo, eje, hipertrofia, intervalos, onda P, QRS, ST y T."},{"t":"Arritmias: cómo se producen","subs":[{"t":"Formación del impulso: automatismo","b":[{"k":"ul","x":["<b>Automatismo normal<\/b>: depende del umbral, del potencial diastólico y de la pendiente de la fase 4; lo modulan el sistema autónomo (catecolaminas y acetilcolina), fármacos (atropina, betabloqueadores) y factores metabólicos (hipoxia, hipokalemia). Produce taquicardia o bradicardia.","<b>Marcapasos latentes o ectópicos<\/b>: células que normalmente no se despolarizan solas y adquieren esa propiedad.","<b>Supresión por sobreestimulación<\/b>: tras disparar rápido, la bomba Na⁺/K⁺ se potencia y aplana la fase 4; la supresión y el tiempo de recuperación son proporcionales a la frecuencia y duración del estímulo. Mantiene el ritmo sinusal."]},{"k":"tb","x":["Situación¦Un latido¦Varios seguidos","El nodo sinusal se suprime¦Latido de escape¦Ritmo de escape","El nodo está bien pero un marcapasos latente se acelera¦Latido ectópico (prematuro)¦Ritmo ectópico"]},{"k":"ul","x":["<b>Automatismo anormal<\/b>: en tejido lesionado las membranas se vuelven permeables (fuga iónica) y despolarizan solas."]}]},{"t":"Actividad desencadenada (pospotenciales)","b":[{"k":"tm","x":[{"w":"Pospotencial precoz (PPP)","d":"Oscilación durante la meseta o la repolarización tardía; se favorece con un potencial de acción prolongado (QT largo)."},{"w":"Pospotencial tardío (PPT)","d":"Despolarización pequeña después de la repolarización completa, por sobrecarga de Ca²⁺."}]},{"k":"fl","x":["Pospotencial tardío","Se inhibe la bomba Na⁺/K⁺ (p. ej., digoxina)","Se invierte el intercambiador Na⁺/Ca²⁺","Entra Ca²⁺","Sobrecarga de Ca²⁺","Despolarización tras la repolarización"]}]},{"t":"Reentrada","b":[{"k":"ul","x":["El impulso vuelve a excitar tejido que ya salió de su periodo refractario. Puede ser <b>anatómica<\/b> (una estructura obliga al impulso a rodearla) o <b>funcional/fisiológica<\/b>.","Tipos que viste: <b>anisotrópica<\/b> (alteración de uniones gap, p. ej., por acidosis), <b>en 8<\/b> (dos frentes que chocan), <b>en espiral<\/b> y por reciclaje.","<b>Reentrada nodal<\/b>: el nodo AV tiene una vía que conduce lento y repolariza rápido y otra al revés; si una está refractaria, el impulso circula entre ambas → taquicardia con <b>P retrógrada<\/b> (pseudo-S en DII, DIII, aVF o pseudo-R′ en V1). La vía lenta está en el <b>triángulo de Koch<\/b>.","<b>Haz de Kent<\/b>: vía accesoria que facilita arritmias (Wolff-Parkinson-White)."]},{"k":"fl","x":["Condiciones de la reentrada","Dos vías con distinta velocidad y refractariedad","Bloqueo unidireccional en una","El impulso baja por la otra","Regresa por la vía bloqueada ya recuperada","Circuito que se repite"]}]},{"t":"Bradi y taquiarritmias","b":[{"k":"ul","x":["<b>Bradiarritmias<\/b>: el impulso no se forma (degeneración del nodo) o no se propaga completo (bloqueos).","<b>Taquiarritmias<\/b>: fisiológicas (compensación: fiebre, ejercicio) o inapropiadas.","Auriculares: taquicardia auricular focal (automatismo o reentrada), <b>flutter<\/b> típico y atípico, <b>fibrilación auricular<\/b>."]},{"k":"cl","x":["† Flutter típico: ondas F «en dientes de sierra» en DII, DIII y aVF a ~300 lpm. Fibrilación auricular: sin ondas P y R-R irregularmente irregular."]}]}],"cards":[{"f":"Dos mecanismos generales de las arritmias","b":"Alteración en la formación del impulso (automatismo, actividad desencadenada) o en su conducción (reentrada)."},{"f":"Diferencia entre latido de escape y latido ectópico","b":"Escape: el nodo sinusal falla y un marcapasos latente toma el control. Ectópico: el nodo está bien pero un foco latente dispara antes (prematuro)."},{"f":"¿Qué favorece los pospotenciales tardíos?","b":"La sobrecarga de calcio intracelular (p. ej., toxicidad por digoxina)."}],"quiz":[{"q":"La taquicardia por reentrada nodal se reconoce en el ECG por…","o":["Ondas F en dientes de sierra","QRS ancho &gt; 0.12 s","P que precede a cada QRS con PR largo","Ausencia de P visible o P retrógrada justo después del QRS"],"a":3,"e":"El circuito está en el nodo AV: aurículas y ventrículos se activan casi a la vez y la P queda escondida o sale retrógrada."},{"q":"Un QT prolongado favorece sobre todo…","o":["Reentrada anatómica","Pospotenciales tardíos","Pospotenciales precoces","Supresión por sobreestimulación"],"a":2,"e":"El potencial de acción prolongado permite oscilaciones en la meseta (PPP), base de la torsade de pointes."}],"intro":"Por alteración en la formación del impulso (automatismo, actividad desencadenada) o en su conducción (reentrada)."},{"t":"Hipertensión arterial","subs":[{"t":"Definición y regulación","b":[{"k":"ul","x":["Aumento de la presión arterial por arriba de <b>139/89 mmHg<\/b> en adultos (≥ 140/90). † Las guías de EUA (ACC/AHA 2017) ya llaman hipertensión a ≥ 130/80.","Influyen factores genéticos, ambientales, psicosociales y el estilo de vida.","<b>Gasto cardiaco<\/b> depende de: frecuencia, contractilidad, sodio, mineralocorticoides y péptido natriurético auricular.","<b>Resistencia periférica<\/b> depende de: vasoconstrictores y vasodilatadores (humorales y neurales) y factores locales (autorregulación, pH, hipoxia).","El <b>simpático<\/b> activa receptores del corazón y del músculo liso: ↑ frecuencia y vasoconstricción."]},{"k":"st","x":[{"v":"90–95 %","l":"de la hipertensión es primaria (esencial)"},{"v":"PA = GC × RVP","l":"la ecuación que explica todo"}]}]},{"t":"Sistema renina-angiotensina-aldosterona","b":[{"k":"fl","x":["SRAA","El riñón detecta PA baja (aparato yuxtaglomerular)","Libera renina","Angiotensinógeno","Angiotensina I","ECA (endotelio, sobre todo pulmonar)","Angiotensina II","Vasoconstricción (receptor AT1) y liberación de aldosterona","Retención de Na⁺ y agua, pérdida de K⁺","↑ volumen y ↑ PA"]},{"k":"ul","x":["El receptor <b>AT1<\/b> aumenta el Ca²⁺ intracelular y la contracción; el <b>AT2<\/b> produce vasodilatación (vía óxido nítrico).","Los <b>estrógenos<\/b> son vasodilatadores (favorecen la apertura de canales de K⁺).","El consumo de <b>sal<\/b> aumenta el volumen; el diámetro de los vasos se reduce por depósito de grasa en sus paredes."]},{"k":"hy","x":["<b>Corrección:<\/b> la aldosterona no es un vasoconstrictor; sube la PA porque retiene sodio y agua. El vasoconstrictor es la angiotensina II."]}]},{"t":"El endotelio","b":[{"k":"ul","x":["La célula endotelial es la más importante en el control del diámetro del vaso.","<b>Endotelio sano (estado basal)<\/b>: normotensión, flujo laminar, superficie no adhesiva y no trombogénica.","<b>Endotelio activado<\/b>: flujo turbulento, hipertensión, citocinas, complemento, productos bacterianos, lípidos, hipoxia, acidosis, virus, humo de cigarro → ↑ procoagulantes, moléculas de adhesión y factores proinflamatorios."]},{"k":"tm","x":[{"w":"Arterioesclerosis","d":"Engrosamiento y endurecimiento de las paredes arteriales."},{"w":"Ateroesclerosis","d":"Formación de placas de ateroma (lípidos, células inflamatorias y fibrosis) en la íntima."}]}]},{"t":"Factores de riesgo y causas secundarias","b":[{"k":"tb","x":["No modificables¦Modificables","Genética, etnia, edad, sexo¦Obesidad, sedentarismo, diabetes tipo 2, alcohol, tabaco, exceso de sodio, estrés, poco potasio y calcio"]},{"k":"ul","x":["<b>Causas secundarias<\/b>: renal (parenquimatosa y renovascular), endocrinas (hiperaldosteronismo, feocromocitoma, † Cushing, hipertiroidismo), inducida por fármacos, apnea del sueño y coartación de aorta."]},{"k":"hy","x":["<b>Corrección:<\/b> en tus notas los factores genéticos, etnia, edad y sexo aparecen como «modificables»; son <b>no modificables<\/b>."]}]},{"t":"Tratamiento","b":[{"k":"ul","x":["Primero <b>cambios de estilo de vida<\/b>; después monoterapia a dosis plena (o cambiar de fármaco) y luego combinación de 2 fármacos.","<b>ARA II (sartanes, bloquean AT1)<\/b>: azilsartán, candesartán, eprosartán, irbesartán, losartán, olmesartán, telmisartán, valsartán."]},{"k":"mn","x":[{"m":"«-SARTÁN»","s":"Todos los bloqueadores del receptor AT1 terminan en -sartán; los IECA terminan en -pril."}]},{"k":"cl","x":["† IECA y ARA II pueden subir el potasio y la creatinina: se vigilan a las 1–2 semanas de iniciar."]}]}],"cards":[{"f":"Ecuación de la presión arterial","b":"PA = gasto cardiaco × resistencia vascular periférica."},{"f":"¿Dónde se convierte la angiotensina I en II?","b":"En el endotelio (sobre todo pulmonar), por la enzima convertidora de angiotensina (ECA)."},{"f":"¿Qué hace la aldosterona?","b":"Retiene sodio y agua y elimina potasio en el túbulo colector → ↑ volumen."}],"quiz":[{"q":"¿Cuál es causa secundaria de hipertensión?","o":["Edad avanzada","Dieta alta en sodio","Feocromocitoma","Sedentarismo"],"a":2,"e":"El feocromocitoma (tumor que secreta catecolaminas) es endocrino; las otras son factores de riesgo de la HTA primaria."},{"q":"El losartán actúa…","o":["Bloqueando la aldosterona","Inhibiendo la renina","Inhibiendo la ECA","Bloqueando el receptor AT1 de angiotensina II"],"a":3,"e":"Los sartanes son antagonistas AT1; el aliskireno inhibe la renina y la espironolactona bloquea la aldosterona."}],"intro":"PA = gasto cardiaco × resistencia periférica; 90–95 % es primaria (idiopática)."},{"t":"Cardiopatía isquémica e insuficiencia cardiaca","subs":[{"t":"Perspectiva general de la enfermedad cardiaca","b":[{"k":"ul","x":["Insuficiencia de bombeo, obstrucción al flujo, regurgitación, flujo derivado (cortocircuito), trastornos de conducción y rotura del corazón o de un gran vaso."]}]},{"t":"Angina de pecho","b":[{"k":"tm","x":[{"w":"Angina estable","d":"Dolor con el esfuerzo por desequilibrio entre perfusión coronaria y demanda del miocardio; cede con reposo."},{"w":"Angina inestable","d":"Dolor más frecuente, prolongado o con mínimos esfuerzos, por ruptura de una placa o trombosis; puede evolucionar a infarto."}]}]},{"t":"Infarto agudo de miocardio","b":[{"k":"ul","x":["Muerte del músculo cardiaco por <b>isquemia grave y prolongada<\/b>.","Causas: oclusión coronaria por placa o trombo (la más común), vasoespasmo, émbolos e isquemia sin ateroesclerosis.","<b>Infarto transmural<\/b>: abarca todo el grosor de la pared.","Clínica: dolor torácico opresivo persistente, pulso rápido y débil, diaforesis, náusea y vómito, disnea; algunos (diabéticos, ancianos) cursan asintomáticos."]},{"k":"st","x":[{"v":"~20 min","l":"de isquemia bastan para empezar la necrosis: hay que actuar en minutos"}]},{"k":"fl","x":["Del infarto a la falla","Oclusión coronaria","Necrosis","↓ gasto cardiaco","Hipotensión","Insuficiencia cardiaca y respuesta inflamatoria (IL-1, IL-6)"]},{"k":"ul","x":["Tratamiento que anotaste: opiáceos (analgesia y vasodilatación), <b>ácido acetilsalicílico<\/b> (antiagregante), <b>heparina<\/b> (anticoagulante), <b>betabloqueadores<\/b> (bajan la demanda de O₂), antiarrítmicos, <b>IECA<\/b> (evitan la dilatación ventricular) y <b>angioplastia<\/b> (catéter con balón y a veces stent).","La ruptura de pared, septo o músculo papilar es una complicación grave."]},{"k":"hy","x":["† Reperfusión: en el infarto con elevación del ST la angioplastia primaria es de elección si se puede hacer en &lt; 120 min; si no, fibrinólisis."]}]},{"t":"Insuficiencia cardiaca","b":[{"k":"ul","x":["El corazón no bombea lo suficiente para las demandas de los tejidos, o solo lo logra con presiones de llenado altas.","<b>Frank-Starling<\/b>: con menor volumen de eyección el ventrículo no se vacía bien → ↑ volumen diastólico → mayor estiramiento → intenta aumentar la fuerza.","Mecanismos neurohumorales: noradrenalina (simpático), sistema renina-angiotensina y péptido natriurético.","Síntomas: disnea de esfuerzo progresiva, tos, <b>disnea paroxística nocturna<\/b>, <b>ortopnea<\/b> y dolor torácico en casos graves."]},{"k":"cl","x":["Aumentar el calcio disponible (inotrópicos como digoxina o dobutamina) mejora la contracción en la insuficiencia cardiaca."]}]}],"cards":[{"f":"Diferencia entre angina estable e inestable","b":"Estable: con esfuerzo y cede con reposo. Inestable: en reposo o con mínimo esfuerzo, más prolongada, por ruptura de placa."},{"f":"¿Por qué se dan betabloqueadores en el infarto?","b":"Bajan la frecuencia y la contractilidad → menor demanda de oxígeno del miocardio."}],"quiz":[{"q":"Paciente que despierta por la noche con falta de aire que mejora al sentarse. Esto es…","o":["Platipnea","Disnea paroxística nocturna","Disnea de esfuerzo","Apnea del sueño"],"a":1,"e":"Es típica de la insuficiencia cardiaca izquierda: al acostarse regresa líquido al pulmón."},{"q":"La causa más común de infarto agudo de miocardio es…","o":["Vasoespasmo coronario","Embolia","Ruptura de una placa de ateroma con trombosis","Anemia grave"],"a":2,"e":"La gran mayoría son por ateroesclerosis complicada con trombo."}],"intro":  anafiláctico, neurogénico"]},{"k":"ul","x":["<b>Hipovolémico<\/b>: ↓ retorno venoso → ↓ llenado ventricular → ↓ volumen de eyección → ↓ O₂. Manejo: controlar la hemorragia, restaurar volumen, optimizar el O₂ y vasopresores solo si persiste la hipotensión tras reponer volumen.","<b>Cardiogénico<\/b>: la causa más común es el infarto anterior extenso del VI. † La mortalidad histórica de ~80 % hoy es de ~40–50 % con reperfusión.","<b>Séptico<\/b>: infección con hipotensión (PAS &lt; 90 o caída &gt; 40 mmHg de la basal) y alteración de la perfusión. Fase caliente (vasodilatada) y fría (descompensada).","<b>Anafiláctico<\/b>: reexposición al antígeno → IgE unida a mastocitos y basófilos → vasodilatación, ↑ permeabilidad, broncoconstricción, moco. Manifestaciones cutáneas, estridor y sibilancias, colapso circulatorio.","<b>Neurogénico<\/b>: pérdida del tono simpático, casi siempre por lesión medular <b>por arriba de T6<\/b>; hipotensión con <b>bradicardia<\/b>, hipotermia, piel caliente y seca, parálisis flácida."]},{"k":"hy","x":["<b>Corrección:<\/b> la adrenalina en anafilaxia va <b>intramuscular<\/b> (0.3–0.5 mg de 1 mg/mL en el muslo), no IV como primera línea; IV solo en choque refractario y monitorizado."]},{"k":"ul","x":["Anafilaxia, además: vía aérea, difenhidramina 50 mg IV, corticoides, retirar el antígeno, cristaloides y vasopresores si hace falta.","Neurogénico: líquidos con cuidado, vasopresores alfa y atropina para la bradicardia († 1 mg en ACLS actual; en tus notas 0.5 mg)."]},{"k":"mn","x":[{"m":"Neurogénico = «caliente y lento»","s":"Es el único choque con bradicardia y piel caliente y seca."}]}]}],"cards":[{"f":"¿Qué es el choque?","b":"Falla del sistema circulatorio para perfundir adecuadamente los tejidos."},{"f":"¿Qué choque cursa con bradicardia?","b":"El neurogénico (pérdida del tono simpático por lesión medular alta)."},{"f":"Cuatro tipos de choque","b":"Hipovolémico, cardiogénico, obstructivo y distributivo."}],"quiz":[{"q":"Paciente con lesión medular en C6, PA 80/50, FC 48, piel caliente y seca. ¿Qué choque tiene?","o":["Séptico","Cardiogénico","Hipovolémico","Neurogénico"],"a":3,"e":"Hipotensión con bradicardia y piel caliente por pérdida del tono simpático."},{"q":"El primer fármaco en el choque anafiláctico es…","o":["Hidrocortisona IV","Adrenalina intramuscular","Difenhidramina IV","Salbutamol inhalado"],"a":1,"e":"Los antihistamínicos y corticoides son coadyuvantes; la adrenalina IM salva la vida."},{"q":"En el choque, ¿qué produce la acidosis metabólica?","o":["El ácido láctico del metabolismo anaerobio","La retención de CO₂","La hiperkalemia","La pérdida de bicarbonato por orina"],"a":0,"e":"Sin oxígeno la célula solo hace glucólisis anaerobia y acumula lactato."}],"intro":"Falla circulatoria que no perfunde los tejidos: hipoxia celular, metabolismo anaerobio y falla orgánica."},{"t":"Sistema respiratorio","subs":[{"t":"Lesión pulmonar aguda y SDRA","b":[{"k":"ul","x":["Lesión pulmonar aguda que evoluciona a <b>síndrome de dificultad respiratoria aguda<\/b>, con hipoxia.","Causas: sepsis, infecciones pulmonares difusas, neumonía vírica, aspiración gástrica, traumatismo y contusión pulmonar, ahogamiento, embolia grasa, quemaduras, radiación, toxicidad por oxígeno, humo y gases."]},{"k":"fl","x":["Fisiopatología del SDRA","Agresión","Secuestro de neutrófilos y macrófagos (proteasas, leucotrienos, PAF)","Daño de neumocitos I y II y del endotelio","Edema y fibrina (membranas hialinas)","Surfactante inactivado","Fibroblastos y procolágeno (fibrosis)"]}]},{"t":"EPOC: enfisema y bronquitis crónica","b":[{"k":"ul","x":["Casi siempre por <b>tabaco<\/b> (y contaminantes) más predisposición genética."]},{"k":"tm","x":[{"w":"Enfisema","d":"Aumento irreversible de los espacios aéreos distales al bronquiolo terminal (acinos) con destrucción de sus paredes, sin fibrosis evidente."},{"w":"Bronquitis crónica","d":"Tos productiva al menos 3 meses al año durante 2 años consecutivos, sin otra causa."}]},{"k":"tb","x":["Tipo de enfisema¦Dónde¦Asociación","Centroacinar¦Centro del acino, lóbulos superiores¦Tabaco (el más común)","Panacinar¦Todo el acino, zonas basales¦† Déficit de α1-antitripsina","† Paraseptal (acinar distal)¦Periferia, junto a la pleura¦Neumotórax espontáneo en jóvenes","Irregular¦Sin patrón, con fibrosis¦Cicatrices"]},{"k":"ul","x":["En tus notas: «me faltó uno» → es el <b>paraseptal<\/b>."]},{"k":"fl","x":["Enfisema","Tabaco + genética","Estrés oxidativo, apoptosis y senescencia","Inflamación","Desequilibrio proteasa-antiproteasa","Destrucción de la pared alveolar","Colapso alveolar y atrapamiento de aire"]},{"k":"ul","x":["Bronquitis crónica: hipersecreción de moco, hiperplasia de células caliciformes y glándulas submucosas, inflamación e infección."]},{"k":"st","x":[{"v":"10.2 %","l":"de la población mayor de 40 años tiene bronquitis crónica (dato de tus notas)"}]},{"k":"ul","x":["Tratamiento: broncodilatadores de corta y larga acción (LAMA, LAMA + LABA), corticoide inhalado en algunos casos, fisioterapia. La broncodilatación se logra por dos rutas: <b>β2 agonistas<\/b> o <b>anticolinérgicos<\/b> (bloqueo parasimpático)."]}]},{"t":"Asma","b":[{"k":"ul","x":["Reacción inmunitaria con <b>broncoconstricción<\/b> reversible ante estímulos (alérgenos, ejercicio, aire frío), hiperplasia de músculo liso, exceso de moco e inflamación.","Etiología: <b>atópica<\/b> (alérgica, la más común) y no atópica. Infecciones y daño epitelial facilitan la sensibilización.","Diagnóstico <b>clínico<\/b> con más de una de: sibilancias, tos seca, falta de aire, opresión torácica (peor de noche o al despertar), antecedentes familiares, patrón obstructivo y <b>mejoría con broncodilatador<\/b>."]},{"k":"tb","x":["Paso¦Tratamiento (como lo anotaste)","1¦Broncodilatador de acción corta cuando haga falta","2¦Tratamiento diario leve","3¦Diario + corticoide inhalado","4¦Dosis media + corticoide","5¦Dosis alta + corticoide; añadir anticolinérgico y/o teofilina"]},{"k":"ul","x":["<b>Control<\/  antihistamínicos"],"a":0,"e":"β2 agonistas relajan el músculo liso; los anticolinérgicos bloquean el tono vagal."}],"intro":"Lesión pulmonar aguda, EPOC (enfisema y bronquitis crónica), asma, cáncer de pulmón y fibrosis."},{"t":"Sistema nervioso: bases y depresión","subs":[{"t":"Organización y células","b":[{"k":"tb","x":["División¦Origen¦Ganglios¦Neurotransmisor","Simpático¦Toracolumbar¦Preganglionar corta, ganglio cerca de la médula¦Noradrenalina (adrenérgico)","Parasimpático¦Craneosacro¦Preganglionar larga, ganglio cerca del órgano¦Acetilcolina (colinérgico)","Entérico¦Pared intestinal¦Plexos¦«Segundo cerebro», casi tantas neuronas como la médula"]},{"k":"ul","x":["Neuronas <b>multipolares<\/b> (Purkinje del cerebelo, piramidales del hipocampo, motoras de la médula), <b>bipolares<\/b> (retina), <b>pseudounipolares<\/b> (ganglio de la raíz dorsal); las unipolares verdaderas son de invertebrados.","Funcionales: sensitivas, motoras e interneuronas.","<b>Neuroglía<\/b>: astrocitos, oligodendrocitos y células de Schwann (mielina), glía radial, ependimocitos y microglía."]},{"k":"st","x":[{"v":"~100 mil millones","l":"de neuronas en el encéfalo (en tus notas «100 billones»: en español son 100 mil millones)"},{"v":"10 000–20 000","l":"contactos sinápticos que puede recibir una neurona"}]}]},{"t":"Sinapsis","b":[{"k":"ul","x":["<b>Sinapsis tripartita<\/b>: la glía rodea la sinapsis y ayuda a que funcione bien.","El <b>complejo SNARE<\/b> fusiona la vesícula con la membrana para liberar el neurotransmisor.","<b>Toxina botulínica<\/b>: corta SNARE en la placa motora (parálisis flácida, efecto local). <b>Toxina tetánica<\/b>: actúa en neuronas inhibidoras (parálisis espástica).","Receptores <b>ionotrópicos<\/b> (canales que se abren al unirse el transmisor, no dependen de voltaje) y <b>metabotrópicos<\/b> (acoplados a proteína G)."]}]},{"t":"Embriología y corteza","b":[{"k":"tb","x":["Vesícula primaria¦Vesículas secundarias","Prosencéfalo¦Telencéfalo y diencéfalo","Mesencéfalo¦Mesencéfalo","Rombencéfalo¦Metencéfalo y mielencéfalo"]},{"k":"ul","x":["4 lóbulos más el <b>límbico<\/b> (respuestas básicas). <b>Neocorteza<\/b>: 6 capas. <b>Paleocorteza y arquicorteza<\/b> (hipocampo): 3–4 capas (memoria, aprendizaje, olfato). ~50 áreas de Brodmann."]}]},{"t":"Depresión","b":[{"k":"ul","x":["Tristeza excesiva, disforia, pérdida de apetito, alteraciones del sueño, llanto, cansancio, pérdida de ambición y de atención, dificultad para aprender."]},{"k":"st","x":[{"v":"7–15 %","l":"de las personas con depresión cometen suicidio"}]},{"k":"ul","x":["<b>Corteza prefrontal<\/b>: coordina y selecciona conductas hacia metas; en depresión su metabolismo está disminuido.","<b>Hipocampo<\/b>: adaptación al estrés y regulación del eje hipotálamo-hipófisis-suprarrenal; memoria y gran neurogénesis.","<b>Corteza cingulada subgenual<\/b>: modula estados afectivos negativos; proyecta a tallo, hipotálamo e ínsula.","<b>Núcleo accumbens<\/b>: recompensa y placer. <b>Amígdala<\/b>: emociones."]},{"k":"tb","x":["Neurotransmisor¦Dónde se produce","Serotonina¦Núcleos del rafe (tallo)","Dopamina¦Sustancia negra y área tegmental ventral","Noradrenalina¦Locus coeruleus"]}]}],"cards":[{"f":"¿Dónde se produce la serotonina?","b":"En los núcleos del rafe del tallo cerebral."},{"f":"¿Dónde se produce la noradrenalina?","b":"En el locus coeruleus."},{"f":"Diferencia entre toxina botulínica y tetánica","b":"Botulínica: bloquea la liberación de acetilcolina en la placa motora (parálisis flácida). Tetánica: bloquea neuronas inhibidoras (espasticidad)."}],"quiz":[{"q":"Neurona típica de la retina","o":["Bipolar","Multipolar de Purkinje","Unipolar verdadera","Pseudounipolar"],"a":0,"e":"Las bipolares están en la retina y el epitelio olfatorio; las pseudounipolares en los ganglios sensitivos."},{"q":"¿Qué estructura regula el eje hipotálamo-hipófisis-suprarrenal y la adaptación al estrés?","o":["Hipocampo","Núcleo accumbens","Locus coeruleus","Cerebelo"],"a":0,"e":"El hipocampo frena el eje HHS; el estrés crónico lo daña."}],"intro":"Organización del sistema nervioso, neuronas y glía, sinapsis, y los circuitos de la depresión."},{"t":"Enfermedades neurodegenerativas","subs":[{"t":"Qué son","b":[{"k":"ul","x":["Afectan al SNC de forma progresiva por <b>degeneración o muerte neuronal<\/b>. No son trastornos psiquiátricos, defectos anatómicos ni parte normal del envejecimiento.","En común: grupos específicos de neuronas, aparición sin explicación clara (genética o idiopática), progresión imparable, edad avanzada, y a menudo <b>agregados de proteínas<\/b> tóxicas."]},{"k":"tb","x":["Enfermedad¦Neuronas afectadas","Parkinson¦Dopaminérgicas (sustancia negra)","Alzheimer¦Colinérgicas (corteza temporal y núcleo basal)","Huntington¦GABAérgicas espinosas medianas (estriado)"]},{"k":"ul","x":["Mecanismos de daño: pérdida de función de una proteína, degeneración sináptica, toxicidad de la proteína mutante, inclusiones nucleares, <b>excitotoxicidad<\/b>, estrés oxidativo, falla de la proteólisis y apoptosis.","Clínica: movimiento (ataxia, atetosis, corea), cognición (atención, memoria, razonamiento, lenguaje) y problemas psicológicos (depresión, cambios de personalidad)."]}]},{"t":"Alzheimer","b":[{"k":"st","x":[{"v":"50–60 %","l":"de todas las demencias son Alzheimer"}]},{"k":"ul","x":["Disminución de neuronas colinérgicas en el lóbulo temporal (lateral y medial)."]},{"k":"fl","x":["Placa amiloide","Procesamiento alterado de la proteína precursora de amiloide (APP)","Se acumula el fragmento β-amiloide","Placas","Estrés oxidativo, inflamación y alteración iónica","Disfunción neuronal","Demencia"]},{"k":"ul","x":["<b>Tau<\/b>: mantiene los microtúbulos; al alterarse (hiperfosforilada) se desarman y forma ovillos tóxicos.","Genes: <b>APP, PSEN1, PSEN2<\/b> y <b>APOE ε4<\/b> (APP está en el cromosoma 21: por eso el Alzheimer precoz en trisomía 21).","Factores de riesgo: hipertensión, obesidad, diabetes, hipercolesterolemia, hiperhomocisteinemia, EVC, tabaco, depresión, soledad, alteraciones del sueño. Protectores: ejercicio, estimulación social y cognitiva, dieta con pescado, educación avanzada, propósito de vida.","Evolución: no detectable → memoria a corto plazo → funciones motoras y habla → memoria a largo plazo → desorientación → estado vegetativo → muerte (infección).","Tratamiento: <b>inhibidores de acetilcolinesterasa<\/b> (donepezilo, galantamina, rivastigmina), † memantina (antagonista NMDA); en investigación: moduladores de secretasas, antiagregantes, vacunas y anticuerpos anti-amiloide."]},{"k":"cl","x":["La pérdida del olfato puede anunciar un proceso neurodegenerativo."]},{"k":"hy","x":["<b>Corrección:<\/b> APOE no se relaciona con la trisomía 21; el que está en el cromosoma 21 es el gen <b>APP<\/b>."]}]},{"t":"Parkinson","b":[{"k":"ul","x":["Segundo trastorno neurodegenerativo más común; inicia a los 55–60 años (5–10 % antes de los 40); más en hombres.","Pérdida de neuronas dopaminérgicas de la <b>sustancia negra<\/b> (mesencéfalo) y <b>cuerpos de Lewy<\/b> (α-sinucleína). Los síntomas aparecen cuando se ha perdido el <b>70–80 %<\/b>.","La dopamina equilibra las vías <b>directa<\/b> (excitatoria) e <b>indirecta<\/b> (inhibitoria) de los ganglios basales; sin dopamina domina la indirecta → se frena el movimiento.","Clínica: <b>temblor de reposo 4–6 Hz<\/b>, <b>bradicinesia<\/b>, <b>rigidez<\/b> (en rueda dentada) e <b>inestabilidad postural<\/b>; dificultad para iniciar y detener la marcha, hipotensión, déficit cognitivo.","Síntomas previos (prodrómicos): estreñimiento, hipotensión ortostática, disfunción eréctil y urinaria, depresión y ansiedad (2–5 años antes), insomnio, pérdida del olfato.","Genes: α-sinucleína, parkina, DJ-1, PINK1.","Tratamiento: <b>levodopa<\/b> + inhibidor de dopa-descarboxilasa (carbidopa), inhibidores de COMT, agonistas dopaminérgicos. Con el tiempo pierde efecto y aparecen fluctuaciones y discinesias."]},{"k":"mn","x":[{"m":"TRAP","s":"Temblor de reposo, Rigidez, Acinesia/bradicinesia, inestabilidad Postural."}]},{"k":"hy","x":["<b>Corrección:<\/b> en tus notas «TBI (tuberculosis)»: TBI es *traumatic brain injury*, traumatismo craneoencefálico, que sí aumenta el riesgo. El tabaco y la cafeína tienen asociación inversa (estadística), no son recomendaciones."]}]},{"t":"Corea de Huntington","b":[{"k":"ul","x":["Autosómica dominante, gen <b>HTT<\/b> en el <b>cromosoma 4<\/b>: el triplete <b>CAG<\/b> se repite normalmente 10–35 veces; con <b>≥ 36<\/b> la huntingtina se vuelve tóxica.","Afecta neuronas GABAérgicas del caudado y putamen → atrofia del caudado y ventrículos ensanchados → predomina la vía excitatoria → <b>corea<\/b>.","Muerte por neumonía, broncoaspiración o suicidio. Tratamiento: antipsicóticos, depletores de dopamina (tetrabenazina), benzodiacepinas, antagonistas del glutamato."]},{"k":"hy","x":["<b>Corrección:<\/b> el triplete es <b>CAG<\/b> (no GAG)."]}]},{"t":"Epilepsia","b":[{"k":"ul","x":["Actividad eléctrica neuronal excesiva y sincronizada con <b>crisis recurrentes y espontáneas<\/b> y cambios en el EEG.","Primaria (idiopática) o secundaria (hipoxia-isquemia, infecciones, traumatismo, malformaciones, alteraciones metabólicas, neoplasias).","Crisis convulsivas o no convulsivas (ausencias, mioclónicas); descargas <b>focales<\/b> (un hemisferio; pueden generalizarse), multifocales o <b>generalizadas<\/b> (ambos hemisferios, con pérdida de conciencia).","Periodos: <b>ictal<\/b> (la crisis), <b>postictal<\/b> (confusión posterior) e <b>interictal<\/b> (entre crisis)."]},{"k":"tb","x":["Línea¦Fármacos","Primera¦Carbamazepina, valproato, lamotrigina","Segunda¦Levetiracetam, topiramato, pregabalina","Nuevos¦Zonisamida, eslicarbazepina, retigabina"]},{"k":"ul","x":["Quirúrgico: resección anteromesial del lóbulo temporal (epilepsia temporal refractaria)."]}]}],"cards":[{"f":"Tétrada del Parkinson","b":"Temblor de reposo, rigidez, bradicinesia e inestabilidad postural."},{"f":"¿Qué proteína forma los cuerpos de Lewy?","b":"α-sinucleína."},{"f":"¿Cuántas repeticiones CAG causan Huntington?","b":"36 o más."},{"f":"Tres periodos de la actividad epiléptica","b":"Ictal, postictal e interictal."}],"quiz":[{"q":"El donepezilo actúa…","o":["Inhibiendo la COMT","Inhibiendo la acetilcolinesterasa","Bloqueando receptores NMDA","Como precursor de dopamina"],"a":1,"e":"Aumenta la acetilcolina disponible, que está baja en el Alzheimer."},{"q":"En el Parkinson, ¿por qué se da carbidopa con la levodopa?","o":["Para bloquear la COMT central","Para evitar la tolerancia","Porque es agonista dopaminérgico","Para que la levodopa no se convierta en dopamina fuera del cerebro"],"a":3,"e":"La carbidopa inhibe la dopa-descarboxilasa periférica: más levodopa llega al cerebro y hay menos náusea."},{"q":"Neuronas que se pierden en la corea de Huntington","o":["Dopaminérgicas de la sustancia negra","Motoras de la médula","GABAérgicas del estriado","Colinérgicas del núcleo basal"],"a":2,"e":"La pérdida de las espinosas medianas del caudado y putamen libera el movimiento (corea)."}],"intro":"Progresivas, sin cura, por muerte de grupos específicos de neuronas: Alzheimer, Parkinson, Huntington."},{"t":"Enfermedad cerebrovascular","subs":[{"t":"Tipos","b":[{"k":"tb","x":["Isquémica (~85 %)¦Hemorrágica","Infarto lacunar¦Hemorragia intracerebral espontánea","Oclusión carotídea¦Hemorragia subaracnoidea","Oclusión vertebrobasilar¦Aneurisma intracraneal y malformación arteriovenosa"]},{"k":"ul","x":["Suele ser por ruptura de un ateroma. Puede dar coma, hemiplejía, paraplejía, monoplejía, alteraciones del habla, parestesias y pérdida sensitiva.","<b>Ataque isquémico transitorio (AIT)<\/b>: déficit de &lt; 24 h sin secuelas, pero anuncia un infarto."]}]},{"t":"Excitotoxicidad","b":[{"k":"fl","x":["Excitotoxicidad","Isquemia","Liberación masiva de glutamato","Receptores NMDA (ionotrópicos)","Entrada masiva de Ca²⁺","Daño mitocondrial","Necrosis neuronal"]},{"k":"ul","x":["Se ha intentado proteger con <b>bloqueadores NMDA<\/b>."]}]},{"t":"Factores de riesgo y manejo","b":[{"k":"ul","x":["Hipertensión (el principal), alteraciones cardiacas (HVI, dilatación, † fibrilación auricular), diabetes, dislipidemia, obesidad, tabaco, intolerancia a la glucosa, anticonceptivos orales (protrombóticos), edad &gt; 70 años.","Manejo: prevenir (controlar la hipertensión y los demás factores), detección y tratamiento tempranos, antitrombóticos y trombólisis o trombectomía."]},{"k":"hy","x":["† La trombólisis IV con alteplasa se da en las primeras 4.5 h del inicio de los síntomas, tras descartar hemorragia con TAC."]}]}],"cards":[{"f":"¿Qué porcentaje de las EVC son isquémicas?","b":"Alrededor del 85 %."},{"f":"¿Qué es un AIT?","b":"Déficit neurológico isquémico que dura menos de 24 h y no deja secuelas; aviso de un infarto cerebral."}],"quiz":[{"q":"¿Qué receptor media la excitotoxicidad en la isquemia cerebral?","o":["NMDA de glutamato","Muscarínico M1","GABA-A","Dopaminérgico D2"],"a":0,"e":"El glutamato abre los NMDA y entra calcio en exceso."},{"q":"El principal factor de riesgo modificable de EVC es…","o":["Obesidad","Anticonceptivos orales","Hipertensión arterial","Edad"],"a":2,"e":"La hipertensión es el factor más importante en ambos tipos."}],"intro":"Estenosis, oclusión o ruptura de un vaso: ~85 % son isquémicas."},{"t":"Nefrología","subs":[{"t":"Respuesta del glomérulo a la lesión","b":[{"k":"ul","x":["Engrosamiento de la membrana basal, hipercelularidad (proliferación mesangial o endotelial, infiltrado leucocitario), hialinosis y esclerosis glomerular."]}]},{"t":"Nefrítico vs nefrótico","b":[{"k":"tb","x":["Síndrome nefrítico¦Síndrome nefrótico","Hematuria (macro o microscópica) de inicio agudo¦Proteinuria masiva ≥ 3.5 g/día","Filtración glomerular reducida¦Hipoalbuminemia &lt; 3 g/dL","Proteinuria leve a moderada¦Edema generalizado","Hipertensión arterial¦Hiperlipidemia y lipiduria"]},{"k":"ul","x":["Nefrótico: por aumento de la permeabilidad de la pared glomerular a las proteínas. Causas: diabetes, amiloidosis, lupus, fármacos (naproxeno, ketorolaco, antibióticos), infecciones, cáncer.","Diagnóstico: examen general de orina (proteinuria, albuminuria, <b>eritrocitos dismórficos<\/b>, cilindros) y biopsia si hace falta."]},{"k":"hy","x":["<b>Corrección:<\/b> en tus notas dice «síndrome neurótico»: es síndrome <b>nefrótico<\/b>."]},{"k":"cl","x":["Paracetamol e ibuprofeno a dosis habituales son menos lesivos para el riñón que otros AINE, pero cualquier AINE puede causar lesión renal en deshidratación."]}]},{"t":"Lesión renal aguda y crónica","b":[{"k":"tm","x":[{"w":"Lesión renal aguda","d":"Caída rápida de la filtración glomerular con alteración hidroelectrolítica y retención de urea y creatinina (antes «insuficiencia renal aguda»)."},{"w":"Enfermedad renal crónica","d":"Filtrado &lt; 60 mL/min/1.73 m² o marcadores de daño (como albuminuria) durante al menos 3 meses."}]},{"k":"ul","x":["Riesgo de ERC: proteinuria, hipertensión, diabetes, enfermedad cardiovascular, tabaquismo, obesidad, AINE crónicos, obstrucción urinaria.","Tratamiento: prevenir el avance (peso, dieta, control de dislipidemia y PA); en etapa terminal <b>hemodiálisis<\/b>, <b>diálisis peritoneal<\/b> o <b>trasplante<\/b>."]},{"k":"st","x":[{"v":"&lt; 60 mL/min/1.73 m²","l":"por ≥ 3 meses define la enfermedad renal crónica"}]},{"k":"hy","x":["<b>Corrección:<\/b> basta el filtrado bajo <b>o<\/b> la albuminuria por 3 meses; no se necesitan los dos."]}]}],"cards":[{"f":"Proteinuria que define al síndrome nefrótico","b":"≥ 3.5 g en 24 horas."},{"f":"¿Qué hallazgo urinario sugiere origen glomerular de la hematuria?","b":"Eritrocitos dismórficos y cilindros eritrocitarios."}],"quiz":[{"q":"Niño con edema generalizado, albúmina 2.1 g/dL, colesterol alto y proteinuria de 5 g/día. Tiene…","o":["Infección urinaria","Síndrome nefrítico","Síndrome nefrótico","Lesión renal aguda prerrenal"],"a":2,"e":"Proteinuria masiva + hipoalbuminemia + edema + hiperlipidemia."},{"q":"Hematuria, hipertensión y edema leve tras una faringitis sugieren…","o":["Síndrome nefrítico","Litiasis renal","Síndrome nefrótico","Pielonefritis"],"a":0,"e":"Es el cuadro clásico de glomerulonefritis postestreptocócica."}],"intro":"Síndrome nefrítico, síndrome nefrótico, lesión renal aguda y crónica."},{"t":"Aparato digestivo","subs":[{"t":"Esófago","b":[{"k":"ul","x":["<b>Acalasia<\/b>: el esfínter esofágico inferior no se relaja bien. La <b>enfermedad de Chagas<\/b> destruye los plexos mientéricos (altera la peristalsis) y la imita.","Tratamiento: nitratos, bloqueadores de calcio, toxina botulínica A, dilatación neumática; quirúrgico: miotomía con funduplicatura o miotomía endoscópica peroral (POEM).","<b>ERGE<\/b>: reflujo del contenido gástrico (la hernia hiatal y las maniobras de Valsalva lo favorecen). Síntomas: pirosis, regurgitación, disfagia, dolor torácico (confundible con cardiopatía).","Diferencial de ERGE: cardiopatía, neoplasias, úlcera péptica, vía biliar, esofagitis, acalasia, trastornos de motilidad.","Tratamiento: <b>inhibidores de bomba de protones<\/b> (omeprazol, esomeprazol)."]},{"k":"tm","x":[{"w":"Esófago de Barrett","d":"Metaplasia del epitelio escamoso a columnar intestinal por reflujo crónico; es precursor de adenocarcinoma."}]}]},{"t":"Estómago","b":[{"k":"ul","x":["<b>Gastritis aguda<\/b> (distinta de gastropatía, que es daño sin inflamación): dolor epigástrico, náusea, vómito, erosión y úlcera de la mucosa, hemorragia (hematemesis, melena)."]}]},{"t":"Intestino","b":[{"k":"tb","x":["Enfermedad de Crohn¦Colitis ulcerosa (CUCI)","Cualquier parte del tubo digestivo (boca a ano), transmural, salteada¦Solo colon y recto, continua, mucosa","Diarrea crónica con dolor abdominal, fiebre, anorexia, pérdida de peso¦Diarrea con sangre","Abdomen doloroso a la palpación, † fístulas¦Dolor bajo tipo cólico que se alivia al defecar"]},{"k":"ul","x":["<b>Enfermedad de Hirschsprung<\/b> (megacolon agangliónico): ausencia de neuronas entéricas en un segmento distal → no se emite el <b>meconio<\/b> en las primeras 48 h, estreñimiento, distensión, vómito, diarrea (enterocolitis) y perforación."]}]}],"cards":[{"f":"¿Qué es la acalasia?","b":"Falta de relajación del esfínter esofágico inferior con pérdida de la peristalsis."},{"f":"¿Por qué el Barrett importa?","b":"Es metaplasia intestinal precursora de adenocarcinoma de esófago."},{"f":"Diferencia clave entre Crohn y CUCI","b":"Crohn: cualquier segmento, transmural y salteado. CUCI: solo colon, continuo y de mucosa."}],"quiz":[{"q":"Recién nacido que no expulsa meconio en 48 h y tiene distensión abdominal. Sospechas…","o":["Colitis ulcerosa","Estenosis pilórica","Acalasia","Enfermedad de Hirschsprung"],"a":3,"e":"Falta de células ganglionares en el colon distal."},{"q":"El tratamiento de primera línea de la ERGE es…","o":["Inhibidor de la bomba de protones","Miotomía","Toxina botulínica","Bloqueador de calcio"],"a":0,"e":"Omeprazol o esomeprazol; la cirugía (funduplicatura) es para casos seleccionados."}],"intro":"Acalasia, ERGE y Barrett, gastritis, enfermedad inflamatoria intestinal y Hirschsprung."}]};

<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#stats").innerHTML=[[T.length,"Temas"],[T.reduce((n,t)=>n+t.subs.filter(s=>s.t).length,0),"Subtemas"],[allC.length,"Tarjetas"],[allQ.length,"Preguntas"]].map(([n,l])=>`<div><small>${l}</small><b>${n}</b></div>`).join("");

const PAL=[["#c2410c","#fb8a5a"],["#6d28d9","#b69cff"],["#0f766e","#4fd1c0"],["#b45309","#f2b14c"],["#be123c","#ff7c98"],["#1d4ed8","#7aa7ff"],["#15803d","#6edb8f"],["#a21caf","#ec8cf6"],["#0e7490","#5cc9e6"],["#9a3412","#ff9f6e"],["#4d7c0f","#a7d65a"],["#7c3aed","#c4a8ff"]];
const tcol=i=>`--tc:${PAL[i%PAL.length][0]};--tcd:${PAL[i%PAL.length][1]}`;
if(GUIA.nota){$("#nota").hidden=false;$("#nota").innerHTML=GUIA.nota}
$("#foot").innerHTML=`Repositorio de Marcos David Reinah Guzmán · Médico Cirujano UDLAP · ${esc(GUIA.kicker)}. <span class="dag">†</span> = dato agregado para completar el tema.`;
/* estudiar */
const LSD="s12-dominado-"+GUIA.id;let dom=new Set();try{dom=new Set(JSON.parse(localStorage.getItem(LSD)||"[]"))}catch(e){}
