<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Farmacología II</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../fonts/gfcd122426d.css">
<style>
/* Layout: sticky toolbar (búsqueda + modos) · rail de temas a la izquierda (chips arriba en móvil) · tarjetas plegables por fármaco */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --surface-2:#eef2f0; --ink:#17231f; --muted:#5b6b65; --line:#d9e1dd;
  --accent:#0b7a62; --accent-ink:#ffffff; --accent-soft:#dff1eb;
  --c-bp:#5a6472; --c-atb:#2563a8; --c-tb:#b5651d; --c-hongos:#7a4fb0; --c-virus:#c0392b; --c-par:#2f7d32; --c-park:#0f7b8a; --c-dm:#b0306a; --c-tir:#8a7410; --c-ans:#3b4fa0;
  --good:#1f7a3f; --bad:#b3261e; --mark:#fff1a8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --surface-2:#1f2a26; --ink:#e4ece8; --muted:#9db0a8; --line:#2c3a35;
  --accent:#3fc7a3; --accent-ink:#06231b; --accent-soft:#183a31;
  --c-bp:#a3adbb; --c-atb:#6ea8ec; --c-tb:#e5a15e; --c-hongos:#b796e6; --c-virus:#f08074; --c-par:#7cc77f; --c-park:#5cc6d4; --c-dm:#f07fb0; --c-tir:#e0cc5a; --c-ans:#96a6f0;
  --good:#5fd08a; --bad:#ff8a80; --mark:#5c5214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --surface-2:#1f2a26; --ink:#e4ece8; --muted:#9db0a8; --line:#2c3a35;
  --accent:#3fc7a3; --accent-ink:#06231b; --accent-soft:#183a31;
  --c-bp:#a3adbb; --c-atb:#6ea8ec; --c-tb:#e5a15e; --c-hongos:#b796e6; --c-virus:#f08074; --c-par:#7cc77f; --c-park:#5cc6d4; --c-dm:#f07fb0; --c-tir:#e0cc5a; --c-ans:#96a6f0;
  --good:#5fd08a; --bad:#ff8a80; --mark:#5c5214; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .rx{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.4rem}
.brand small{color:var(--muted);font-size:.85rem}
.modes{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-left:auto}
.modes button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:.92rem;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.search input{flex:1;border:0;background:transparent;padding:9px 0;font:inherit;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}

.layout{max-width:1180px;margin:0 auto;padding-block:20px 60px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
nav.topics{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:4px}
nav.topics .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px 10px}
.tbtn{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--ink)}
.tbtn .dot{width:10px;height:10px;border-radius:3px;background:var(--tc);flex:none}
.tbtn .ct{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tbtn:hover{background:var(--surface-2)}
.tbtn[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--tc), 0 0 0 1px var(--line)}
main{min-width:0}

.thead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--tc)}
.thead h2{font-size:clamp(1.6rem,3.5vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.thead p{margin:0;color:var(--muted);max-width:68ch}

.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 26px;align-items:start}
.key{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.key h4{font-size:.95rem;margin-bottom:6px;color:var(--tc)}
.key ul{margin:0;padding-left:18px}
.key li{margin:2px 0}

.group{margin:0 0 28px}
.group > h3{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px;margin:0 0 10px}
.group > h3::before{content:"";width:18px;height:3px;border-radius:2px;background:var(--tc)}
.group > p.gnote{margin:-4px 0 10px;color:var(--muted);font-size:.95rem}
.cards{display:flex;flex-direction:column;gap:8px}

details.drug{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.drug[open]{border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
details.drug summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
details.drug summary::-webkit-details-marker{display:none}
summary .nm{font-weight:700;font-size:1.05rem}
summary .tag{font-size:.82rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
summary .chev{margin-left:auto;flex:none;transition:transform .15s;color:var(--muted)}
details[open] summary .chev{transform:rotate(90deg)}
.preg{flex:none;font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.body{padding:2px 16px 16px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;border-top:1px dashed var(--line);padding-top:12px}
.body dt{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:3px}
.body dd{margin:0;min-width:0}
.body dd.mono{font-family:var(--f-mono);font-size:.86rem;line-height:1.6}
.body dd.ram{color:var(--ink)}
.body dt.ci-t{color:var(--bad)}
.pearl{grid-column:1/-1;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:.95rem}
.pearl b{color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* Buenas prácticas */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:22px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.step .n{font-family:var(--f-mono);font-weight:600;color:var(--tc);font-size:.8rem}
.step b{font-family:var(--f-display);font-size:1.02rem}
.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:22px}
.case blockquote{margin:8px 0 12px;padding-left:12px;border-left:3px solid var(--tc);color:var(--muted);font-style:italic}
.tbl-wrap{overflow-x:auto;margin-bottom:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* Flashcards + examen */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flash{perspective:1200px;max-width:640px;margin:0 auto}
.fc{position:relative;min-height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer;border:0;background:none;width:100%;padding:0;text-align:left}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px rgb(0 0 0 / .06);overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .q{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,1.7rem);font-weight:700;margin:auto 0}
.face .a{font-size:1.08rem;margin:auto 0}
.face .meta{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--tc)}
.face .hint{font-size:.85rem;color:var(--muted)}
.fnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.counter{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.quiz{max-width:720px;margin:0 auto}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.qcard .stem{font-size:1.12rem;font-weight:600;margin:6px 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);padding:11px 14px;border-radius:10px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.95rem}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--accent)}
.note{font-size:.85rem;color:var(--muted);margin-top:24px;max-width:70ch}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:12px}
  nav.topics{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  nav.topics .lbl{display:none}
  .tbtn{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 10px}
  .tbtn .ct{display:none}
  .tbtn[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--tc)}
  .modes{margin-left:0;order:3;width:100%}
  .modes button{flex:1}
  .brand small{display:none}
  .body{grid-template-columns:minmax(0,1fr);gap:2px}
  .body dd{margin-bottom:8px}
  summary .tag{display:none}
}
@media (prefers-reduced-motion:reduce){.fc,summary .chev,.prog i{transition:none}}
</style>

<header class="top wrap">

<script>
const T = [
 {id:"bp", name:"Buenas prácticas de prescripción", short:"Prescripción", color:"--c-bp",
  intro:"Proceso de prescripción racional, selección de la farmacoterapia y cómo escribir la receta."},
 {id:"atb", name:"Antibióticos", short:"Antibióticos", color:"--c-atb",
  intro:"Sustancias elaboradas por microorganismos que actúan sobre otros: suprimen su crecimiento y multiplicación o provocan su destrucción. Base: toxicidad selectiva.",
  keys:[
   {h:"Clasificación de antimicrobianos",l:["Por efecto de acción","Por espectro","Por estructura química","Por mecanismo de acción"]},
   {h:"Bacteriostático vs bactericida",l:["<b>Bacteriostático:</b> frena crecimiento y replicación; el sistema inmunitario inmoviliza y elimina","<b>Bactericida:</b> lisis y muerte. β-lactámicos, quinolonas, aminoglucósidos, vancomicina"]},
   {h:"Espectro",l:["<b>Reducido:</b> 1 microorganismo o grupo limitado (isoniazida → micobacterias)","<b>Amplio:</b> Gram + y varios Gram − (ampicilina)","Terapéutica empírica cuando aún no se conoce el agente"]},
   {h:"Resistencia",l:["La Cmax tolerable ya no es eficaz","Mutaciones espontáneas","Enzimas (β-lactamasas)","Transferencia de bacterias resistentes y de genes R"]},
   {h:"Mecanismos (4 grandes grupos)",l:["Interfieren con el folato (antimetabolitos)","Síntesis de pared celular","Síntesis de proteínas (ribosoma)","Ácidos nucleicos (DNA girasa)"]}
  ]},
 {id:"tb", name:"Antimicobacterianos", short:"Antituberculosos", color:"--c-tb",
  intro:"Tuberculosis: infección intracelular y lenta, con gran resistencia. Tratamiento de 6 meses a 2 años, siempre combinado.",
  keys:[
   {h:"Primera línea: I R P E",l:["<b>I</b>soniacida · <b>R</b>ifampicina · <b>P</b>irazinamida · <b>E</b>tambutol"]},
   {h:"Esquema (6 meses)",l:["<b>Fase intensiva, 2 meses:</b> I + R + P","<b>Fase de continuación, 4 meses:</b> I + R","Dosis: INH 5 mg/kg · RIF 10 mg/kg · PZA 30 mg/kg"]},
   {h:"Zonas con resistencia",l:["Agregar <b>estreptomicina</b> 15 mg/kg (NO en embarazadas)","o <b>etambutol</b> 25 mg/kg (NO en niños ni sin control de agudeza visual)"]},
   {h:"Segunda línea",l:["Aminoglucósidos, fluoroquinolonas, macrólidos","Etionamida, cicloserina","Menos eficaces; para resistencia a la primera línea"]}
  ]},
 {id:"hongos", name:"Antimicóticos", short:"Antimicóticos", color:"--c-hongos",
  intro:"Dianas: ergosterol de la membrana (polienos, azoles, terbinafina), glucano de la pared (equinocandinas), DNA (flucitosina) y mitosis (griseofulvina).",
  keys:[
   {h:"Micosis sistémicas",l:["Anfotericina B","Flucitosina","Equinocandinas","Azoles: fluconazol, ketoconazol, itraconazol"]},
   {h:"Mucocutáneas",l:["Terbinafina (elección en tiñas y onicomicosis por dermatofitos)","Griseofulvina","Itraconazol (no dermatofitos)"]},
   {h:"Tópicos",l:["Nistatina (polieno)","Azoles: clotrimazol, miconazol (tioconazol, sulconazol, econazol)"]},
   {h:"Dónde actúa cada uno",l:["<b>Polienos:</b> forman poros en membrana (↑ permeabilidad)","<b>Azoles:</b> inhiben 14-α-desmetilasa de lanosterol (CYP450 fúngico)","<b>Terbinafina:</b> inhibe escualeno epoxidasa","<b>Equinocandinas:</b> inhiben síntesis de glucano","<b>Griseofulvina:</b> se une a microtúbulos, inhibe mitosis"]}
  ]},
 {id:"virus", name:"Antivirales", short:"Antivirales", color:"--c-virus",
  intro:"Actúan sobre las etapas del ciclo viral: adhesión, transcripción o translocación y ensamblaje. Cuatro bloques clínicos más COVID-19.",
  keys:[
   {h:"Bloques",l:["Infecciones respiratorias (influenza)","Herpes y citomegalovirus","VIH","Hepatitis B y C","COVID-19"]},
   {h:"Influenza: quién cubre qué",l:["<b>Solo A:</b> amantadina, rimantadina (canal M2)","<b>A y B:</b> oseltamivir, zanamivir, peramivir (neuraminidasa)","<b>Baloxavir:</b> endonucleasa, dosis única"]},
   {h:"VIH: familias",l:["Inhibidores de TI (nucleósidos y no nucleósidos)","Inhibidores de integrasa","Inhibidores de proteasa","Inhibidores de fusión"]}
  ]},
 {id:"par", name:"Antiparasitarios", short:"Antiparasitarios", color:"--c-par",
  intro:"Protozoarios (eucariontes unicelulares sin pared celular, ligados a condiciones sanitarias inadecuadas) y helmintos (nematodos, cestodos, trematodos).",
  keys:[
   {h:"Amebiasis (E. histolytica): elección según cuadro",l:["<b>Intestinal aguda:</b> metronidazol, diloxanida, metronidazol + yodoquinol, tinidazol, cloroquina, paromomicina","<b>Intestinal crónica:</b> diloxanida, metronidazol, yodoquinol","<b>Absceso hepático:</b> metronidazol, diloxanida","<b>Portador asintomático de quistes:</b> diloxanida"]},

   {h:"Helmintos",l:["<b>Nematodos:</b> mebendazol, pamoato de pirantel, ivermectina, (tiabendazol)","<b>Trematodos:</b> prazicuantel","<b>Cestodos:</b> niclosamida, prazicuantel, albendazol (cisticercosis)","Antihelmínticos: alteran la membrana (fagocitosis) e interrumpen el ciclo"]}
  ]},
 {id:"park", name:"Fármacos antiparkinsonianos", short:"Parkinson", color:"--c-park",

   {h:"Estrategia farmacológica",l:["<b>Aumentar la dopamina:</b> levodopa, agonistas dopaminérgicos, inhibidores de MAO-B y de COMT, amantadina","<b>Disminuir la ACh elevada:</b> antimuscarínicos"]},
   {h:"Tratamiento quirúrgico",l:["<b>Talamotomía:</b> lesión eléctrica permanente y pequeña en el tálamo; reduce temblor y rigidez","<b>Estimulación cerebral profunda:</b> electrodo y generador bajo la clavícula (tipo marcapasos) para temblor, rigidez o bradicinesia"]}
  ]},
 {id:"dm", name:"Insulina e hipoglucemiantes orales", short:"Diabetes", color:"--c-dm",

   <div class="step"><span class="n">HbA1c &gt; 8.5%</span><b>Según síntomas</b><span>Asintomático: metformina + segundo fármaco. Hiperglucemia sintomática: insulina + metformina.</span></div>

 fc:"Oral, tópico y parenteral. Buena distribución incluso LCR (cruza BHE). M: hígado, E: bilis, orina, leche.",
 ram:"<b>Mielosupresión → anemia aplásica</b>, infecciones oportunistas (Candida), confusión, depresión. Neonatos: no excretan el metabolito, se acumula en ribosomas mitocondriales → <b>síndrome del bebé gris</b>.",
 ci:"Lactantes, insuficiencia hepática, depresión de médula ósea.",
 clave:"Anemia aplásica y síndrome del bebé gris en neonatos"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Clindamicina",tag:"Lincosamida 50S · anaerobios",
 mec:"Lincosamida: subunidad ribosomal 50S.",
 esp:"Similar a eritromicina + <b>anaerobios (<i>B. fragilis</i>)</b>, Toxoplasma, Pneumocystis, estafilococo resistente a meticilina, Clostridium. Profilaxis de endocarditis en alérgicos a penicilina con valvulopatía antes de procedimientos dentales. Acné (tópica).",
 fc:"Oral, tópica y parenteral (espuma, gel, crema vaginal, óvulos). Buena distribución excepto LCR; atraviesa placenta y pasa a la leche.",
 ram:"GI, mal sabor de boca, erupciones, alergia, dolor en sitio de inyección, alteraciones hematológicas, <b>colitis pseudomembranosa</b>.",
 clave:"Profilaxis de endocarditis en alérgicos a penicilina antes de procedimientos dentales"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Aminoglucósidos (generalidades)",tag:"Solo aerobios Gram − · oto y nefrotóxicos",
 mec:"Inhiben la síntesis proteica. <b>Solo aerobios:</b> el O₂ transporta el antibiótico al interior. Acción dosis-dependiente. Bactericidas.",
 esp:"Infecciones graves por bacilos aerobios Gram − intestinales. Muy tóxicos: se suelen sustituir por cefalosporinas de 3ª y fluoroquinolonas.",
 fc:"Mala absorción oral (excepto neomicina): parenterales (IM, IV) o tópicos. No SNC. D: oído, riñón, placenta. Se excretan sin cambios por filtración glomerular. <b>Parenterales:</b> amikacina, estreptomicina, gentamicina, tobramicina. <b>Tópicos/orales:</b> neomicina, paromomicina.",
 ram:"<b>Ototoxicidad</b> (destrucción progresiva de células ciliadas, depende de dosis y tiempo), <b>nefrotoxicidad</b>, debilidad muscular / bloqueo neuromuscular (bloquean entrada de Ca²⁺ y liberación de ACh).",
 clave:"Necesitan oxígeno para entrar a la bacteria: solo sirven contra aerobios"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Amikacina",tag:"Nosocomiales Gram −",
 esp:"Bacilos aerobios Gram −. Infecciones nosocomiales: <i>E. coli</i>, Proteus, Pseudomonas. Vías urinarias resistentes. Se concentra en líquido sinovial y vías urinarias.",
 dosis:"15 mg/kg/día en 2 dosis por 7–10 días.",
 ci:"Insuficiencia renal aguda, lactancia.",
 clave:"Aminoglucósido para infecciones nosocomiales, 15 mg/kg/día"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Estreptomicina",tag:"Brucelosis, peste, tuberculosis",
 esp:"Brucelosis, peste, tuberculosis, micobacterias no tuberculosas.",
 dosis:"IM 0.5–1 g c/12 h (adultos); 10–20 mg/kg c/12 h (niños), para infecciones distintas de TB.",
 clave:"Aminoglucósido de brucelosis y peste"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Neomicina y kanamicina",tag:"Solo oral o tópica · encefalopatía hepática",
 esp:"Preparación intestinal antes de cirugía y <b>encefalopatía hepática</b> (reduce flora GI y producción de amoníaco).",
 fc:"Limitadas a oral o tópica por toxicidad. Neomicina: tópica, oral, rectal, irrigación vesical.",
 clave:"Reduce la producción de amoníaco en encefalopatía hepática"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Gentamicina, tobramicina, netilmicina",tag:"Gram − graves",
 esp:"Infecciones graves por bacilos Gram −: IVU complicadas, peritonitis por diálisis, endocarditis, otitis externa maligna (osteomielitis del temporal).",
 clave:"Otitis externa maligna y peritonitis por diálisis"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Tetraciclinas (generalidades)",tag:"Bacteriostáticos · dientes y fotosensibilidad",
 mec:"Inhiben la síntesis proteica. Bacteriostáticos de amplio espectro.",
 esp:"Gram +, Gram −, ciertos anaerobios; rickettsias, <i>Mycoplasma pneumoniae</i>, Chlamydia, Vibrio, <i>H. pylori</i>, acné. Tetraciclina, minociclina, doxiciclina, metaciclina, clortetraciclina, oxitetraciclina. Resistencia intrínseca: Pseudomonas, Proteus, Providencia.",
 fc:"Absorción oral incompleta. Eliminación 80% biliar.",
 ram:"Fotosensibilidad, oscurecimiento dental, quelatos en hueso, hepatotoxicidad, flebitis (pH ácido), vaginosis.",
 ci:"Embarazo.",
 preg:"C/D",
 clave:"Oscurecen los dientes, forman quelatos en hueso y dan fotosensibilidad"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Tetraciclina",tag:"Rickettsia, Chlamydia, Mycoplasma",
 esp:"<b>Elección para rickettsias, Chlamydia, Mycoplasma</b> y ETS. Acné vulgar inflamatorio; gonorrea y sífilis en alérgicos a penicilina.",
 dosis:"Tabletas o cápsulas de 250 mg; efecto 4–6 h. IV lento para no producir flebitis.",
 fc:"Leche, antiácidos y contenido gástrico disminuyen su absorción. Pasa a próstata, leche y placenta.",
 clave:"Su absorción baja con leche y antiácidos; elección para rickettsias"},
{t:"atb",g:"Inhibidores de la síntesis de proteínas",n:"Doxiciclina",tag:"Primera línea en cólera · segura en IR",
 esp:"<b>Tratamiento de primera línea del cólera</b> y profilaxis selectiva; diarrea del viajero, acné, cervicitis y uretritis no gonocócicas, Chlamydia, Trichomonas.",
 fc:"Oral con estómago vacío. Acción prolongada (12 h). <b>La más segura en insuficiencia renal</b>: se elimina por bilis y heces.",
 clave:"Tetraciclina más segura en insuficiencia renal; primera línea en cólera"},
// ── ácidos nucleicos
{t:"atb",g:"Inhibidores de ácidos nucleicos",n:"Quinolonas 1ª generación",tag:"Ácido nalidíxico · solo IVU",
 mec:"Inhiben la DNA girasa (topoisomerasa II): impiden relajar el DNA superenrollado para transcripción y replicación.",
 esp:"Bacilos Gram −; por su farmacocinética solo vías urinarias agudas y crónicas. Ácido nalidíxico, cinoxacina, ácido oxolínico, pipemídico, piromídico. No fluoradas, mucha resistencia.",
 fc:"Oral.",
 ram:"Gastrointestinales.",
 ci:"Lactancia, hipertensión intracraneal.",
 clave:"Quinolona no fluorada útil solo en vías urinarias"},
{t:"atb",g:"Inhibidores de ácidos nucleicos",n:"Fluoroquinolonas (generalidades)",tag:"Topoisomerasas II y IV · tendinitis, QT",
 mec:"Inhiben topoisomerasas II y IV.",
 esp:"Alternativa en alergia a penicilinas y cefalosporinas.",
 fc:"Oral, IV, tópica. Distribución a todos los tejidos (intracelular). Sin metabolismo; eliminación renal activa. Quelan metales por vía oral.",
 ram:"Síndrome confusional (psicosis, alucinaciones; desplazan al GABA), <b>tendinitis</b>, prolongan QT, fotosensibilidad.",
 ci:"<b>Niños:</b> artropatía (dañan el cartílago articular).",
 preg:"D",
 perla:"Interacción con <b>warfarina</b> (al matar bacterias productoras de vitamina K).",
 clave:"Tendinitis, artropatía en niños e interacción con warfarina"},
{t:"atb",g:"Inhibidores de ácidos nucleicos",n:"Ciprofloxacino (2ª gen.)",tag:"Gram − y Pseudomonas",
 esp:"Bacilos Gram −, Gram + moderado, <b>Pseudomonas</b>. Vías urinarias, prostatitis, Chlamydia, osteomielitis, Shigella, Salmonella; fiebre tifoidea, diarrea infecciosa, peritonitis; bronquitis aguda, fibrosis quística; hueso, articulación, piel (úlceras, quemaduras, abscesos); conjuntivitis tópica. <b>No sirve para sífilis.</b> Otras: norfloxacino, ofloxacino.",
 fc:"Oral, tópica e IV. M: hígado, E: orina y heces.",
 ram:"Toxicidad de cartílagos.",
 preg:"C",
 clave:"Fluoroquinolona de 2ª generación con actividad antipseudomonas; no sirve para sífilis"},
{t:"atb",g:"Inhibidores de ácidos nucleicos",n:"Levofloxacino (3ª gen.)",tag:"Bacterias resistentes · enterococo",
 esp:"Bacterias resistentes, enterococo (Gram +). Vías respiratorias, urinarias, piel, tejidos blandos y GI. Otras: gatifloxacina, lomefloxacina…",
 dosis:"500 mg c/24 h.",
 ram:"GI, somnolencia, fatiga, toxicidad de cartílagos.",
 clave:"Quinolona de 3ª generación que cubre enterococo, 500 mg c/24 h"},
{t:"atb",g:"Inhibidores de ácidos nucleicos",n:"Moxifloxacino (4ª gen.)",tag:"Anaerobios · TB multirresistente",
 esp:"Neumonía y bronquitis (no de primera línea), <b>tuberculosis multirresistente</b>, infecciones intraabdominales por <b>anaerobios</b>. También gatifloxacino.",
 ram:"Varias de esta generación se retiraron por daño hepático, cardiotoxicidad y toxicidad renal.",
 clave:"Fluoroquinolona con cobertura de anaerobios, usada en TB multirresistente"},
{t:"atb",g:"Otros",n:"Nitrofurantoína / nitrofurazona",tag:"IVU por E. coli · orina marrón",
 mec:"Bacteriostático: altera los ribosomas bacterianos por mecanismo desconocido.",
 esp:"No son de elección para ningún agente común. Profilaxis y tratamiento de IVU por <i>E. coli</i>. Nitrofurazona: infecciones locales (quemaduras, heridas, escaras, úlceras) en pomadas, óvulos, gotas.",
 fc:"Oral.",
 ram:"<b>Tiñe la orina de color marrón.</b>",
 clave:"Tiñe la orina de color marrón; profilaxis de IVU"},

// ── TUBERCULOSIS
{t:"tb",g:"Primera línea",n:"Isoniacida (INH)",tag:"Ácidos micólicos · hepatitis, neuropatía",
 mec:"Inhibe la síntesis de <b>ácidos micólicos</b> (pared celular).",
 esp:"Tuberculosis; tratamiento de la infección latente. Ejemplo clásico de espectro reducido.",
 dosis:"5 mg/kg (fase intensiva y de continuación).",
 fc:"Oral (también IM/IV), con alimentos. M: hígado. E: orina.",
 ram:"Dosis-dependientes: <b>hepatitis</b> con aumento de transaminasas (medir enzimas hepáticas), exantema, fiebre, ictericia, <b>parestesias (dar vitamina B6)</b>, riesgo de convulsiones, alteraciones psiquiátricas en predispuestos.",
 ci:"Embarazo solo si es necesario.",
 perla:"Interacción con azoles.",
 clave:"Parestesias que se previenen con vitamina B6"},
{t:"tb",g:"Primera línea",n:"Rifampicina",tag:"ARN polimerasa · anticonceptivos",
 mec:"Inhibe la <b>ARN polimerasa</b> procariota. Bactericida sobre microorganismos activos.",
 esp:"Tuberculosis, micobacterias atípicas (<i>M. leprae</i>), brucelosis, Legionella, osteomielitis grave por estafilococo.",
 dosis:"10 mg/kg.",
 fc:"Oral (IV). Atraviesa BHE y LCR. M: hígado. E: 30% orina, 65% heces.",
 ram:"Hepatotoxicidad (factor de riesgo: alcoholismo y hepatopatía). <b>Disminuye la eficacia de anticonceptivos.</b> Hemorragias en las últimas semanas de gestación y en el recién nacido.",
 clave:"Reduce la eficacia de los anticonceptivos; inhibe la ARN polimerasa"},
{t:"tb",g:"Primera línea",n:"Pirazinamida",tag:"Acorta a 6 meses · gota",
 mec:"Altera el pH intracelular, daña la membrana y afecta el metabolismo en medio ácido; inhibe la síntesis de ácidos micólicos. Bactericida débil.",
 esp:"Primeros 2 meses: <b>acorta el tratamiento a 6 meses</b>.",
 dosis:"30 mg/kg (solo fase intensiva).",
 fc:"Oral. Atraviesa BHE y LCR. M: hígado. E: orina.",
 ram:"Disminuye la eliminación de ácido úrico → <b>gota</b>; hepatitis, anorexia.",
 clave:"Eleva el ácido úrico (gota) y permite acortar el esquema a 6 meses"},
{t:"tb",g:"Primera línea",n:"Etambutol",tag:"Pared · ceguera a colores",
 mec:"Inhibe la síntesis de pared de micobacterias. <b>Bacteriostático.</b>",
 esp:"Cepas resistentes a INH y rifampicina. En combinación hasta conocer la sensibilidad; solo genera resistencia.",
 dosis:"25 mg/kg.",
 fc:"Oral.",
 ram:"<b>Alteraciones visuales: ceguera a los colores.</b>",
 ci:"Niños y pacientes sin control de agudeza visual.",
 clave:"Ceguera a los colores; requiere control de agudeza visual"},
{t:"tb",g:"Segunda línea",n:"Estreptomicina",tag:"Aminoglucósido · no en embarazo",
 esp:"Zonas con resistencia a la primera línea.",
 dosis:"15 mg/kg IM/IV.",
 ram:"Lesiones auditivas y vestibulares en el feto.",
 ci:"Embarazo.",
 clave:"Antituberculoso contraindicado en embarazo por daño auditivo fetal"},
{t:"tb",g:"Segunda línea",n:"Fluoroquinolonas en TB",tag:"Levofloxacino, cipro, oflox",
 esp:"Ciprofloxacino y ofloxacino: varias micobacterias. <b>Levofloxacino:</b> pacientes con TB resistente y VIH.",
 clave:"Levofloxacino en TB resistente con VIH"},
{t:"tb",g:"Segunda línea",n:"Etionamida",tag:"Síntesis proteica",
 mec:"Inhibe la síntesis de proteínas.",
 dosis:"Oral 10–20 mg/kg/día.",
 ci:"No usar en monoterapia.",
 clave:"Antituberculoso de 2ª línea que inhibe la síntesis proteica"},
{t:"tb",g:"Segunda línea",n:"Cicloserina",tag:"Pared bacteriana",
 mec:"Altera la síntesis de pared bacteriana.",
 dosis:"Oral 25 mg/kg.",
 clave:"Antituberculoso de 2ª línea que altera la pared, 25 mg/kg"},

// ── ANTIMICÓTICOS
{t:"hongos",g:"Micosis sistémicas",n:"Anfotericina B",tag:"Polieno · nefrotóxico",
 mec:"Polieno (macrólido): se une al ergosterol y forma poros. También se une a esteroles humanos, de ahí su toxicidad.",
 esp:"Amplio espectro (levaduras, mohos). Muy eficaz contra <i>Candida albicans</i>. Meningitis por Coccidioides (intrarraquídea), cistitis y esofagitis por Candida, úlceras micóticas, histoplasmosis, aspergilosis invasora, blastomicosis, <b>inicio en meningitis criptocócica</b>, profilaxis de recaídas en inmunocomprometidos.",
 fc:"IV y tópica (úlceras corneales, queratitis); intraarticular, subconjuntival. Oral: biodisponibilidad &lt;5% (solo micosis digestiva alta).",
 ram:"Dosis-dependientes: <b>nefrotoxicidad</b> (se acumula), broncoespasmo, necrosis tisular, anemia, flebitis, hipotensión. La forma liposomal es menos nefrotóxica pero cara.",
 preg:"C",
 perla:"Se da al inicio para sacar al paciente grave y luego se cambia a azoles. Potencia a la flucitosina.",
 clave:"Polieno nefrotóxico que se usa al inicio y luego se cambia a azoles"},
{t:"hongos",g:"Micosis sistémicas",n:"Flucitosina",tag:"Profármaco · compite con uracilo",
 mec:"Profármaco: inhibe la síntesis de DNA compitiendo con el uracilo.",
 esp:"Meningitis criptocócica, candidiasis generalizada.",
 fc:"Muy buena distribución en ojo, articulaciones, SNC.",
 ram:"Toxicidad medular: anemia, trombocitopenia, leucopenia.",
 ci:"No usar sola (resistencia): siempre con anfotericina.",
 preg:"C",
 clave:"Compite con el uracilo y siempre va con anfotericina B"},
{t:"hongos",g:"Micosis sistémicas",n:"Equinocandinas (caspofungina)",tag:"Inhiben glucano de la pared",
 mec:"Lipopéptidos: inhiben la síntesis de <b>glucano</b>, polímero que da estructura a la pared.",
 esp:"Candidiasis diseminada y mucocutánea. Tratamiento empírico en neutropénicos febriles con sospecha de Candida o Aspergillus; casos que no responden a anfotericina o resistentes a azoles. Otras: micafungina, anidulafungina.",
 fc:"IV. Unión a proteínas 97%. M: hepático. E: renal y heces.",
 ram:"GI, enrojecimiento de la piel.",
 ci:"Embarazo: bajo peso fetal y defectos de osificación.",
 preg:"C",
 clave:"Inhibe la síntesis de glucano de la pared fúngica"},
{t:"hongos",g:"Micosis sistémicas",n:"Azoles (generalidades)",tag:"14-α-desmetilasa · interacciones",
 mec:"Inhiben la lanosterol 14-α-desmetilasa (CYP450 fúngico) y con ello la síntesis de ergosterol.",
 esp:"Sistémicos y superficiales.",
 ram:"GI, somnolencia, <b>muchas interacciones</b> (inhiben CYP450). Voriconazol: visión borrosa.",
 clave:"Inhiben el CYP450 fúngico y por eso tienen muchas interacciones"},
{t:"hongos",g:"Micosis sistémicas",n:"Fluconazol",tag:"Ideal en meningitis · semivida 25 h",
 mec:"Azol.",
 esp:"Onicomicosis, dermatomicosis (tinea pedis, corporis, cruris), candidiasis genital y de mucosas, balanitis, histoplasmosis, blastomicosis, esporotricosis, criptococosis pulmonar o cutánea. <b>Ideal para meningitis criptocócica</b> (alcanza LCR).",
 fc:"Oral e IV. Semivida 25 h. Pasa a leche, esputo, saliva y LCR.",
 preg:"D",
 clave:"Azol que alcanza el LCR: ideal en meningitis criptocócica"},
{t:"hongos",g:"Micosis sistémicas",n:"Itraconazol",tag:"Micosis sistémicas y no dermatofitos",
 mec:"Azol.",
 esp:"Micosis sistémicas y tiñas. <b>Elección para hongos no dermatofitos (levaduras)</b>; alternativa a la terbinafina.",
 fc:"Oral.",
 ram:"Hepatotóxico, fotosensibilidad, inhibe la síntesis de testosterona (ginecomastia), recaídas frecuentes. IV: hipopotasemia, disnea, hepatitis, ictericia.",
 ci:"Embarazo, lactancia, disfunción ventricular.",
 preg:"C",
 clave:"Elección para hongos no dermatofitos; contraindicado en disfunción ventricular"},
{t:"hongos",g:"Mucocutáneas",n:"Terbinafina",tag:"Elección en tiñas y onicomicosis",
 mec:"Inhibe la <b>escualeno epoxidasa</b>: bloquea el paso de escualeno a ergosterol y el escualeno acumulado es tóxico para el hongo.",
 esp:"<b>Elección en tiñas y onicomicosis por dermatofitos.</b>",
 dosis:"250 mg/día en onicomicosis.",
 fc:"Se acumula en piel, uñas y grasa. Unión a proteínas 99%, t½ 12 h. M: hepático, E: renal.",
 preg:"B",
 clave:"Inhibe la escualeno epoxidasa; elección en onicomicosis por dermatofitos"},
{t:"hongos",g:"Mucocutáneas",n:"Griseofulvina",tag:"Microtúbulos · se fija a queratina",
 mec:"Se une a los microtúbulos e inhibe la mitosis (altera la quitina sintetasa).",
 esp:"Espectro reducido: dermatofitos (tiñas, pie de atleta).",
 fc:"Se concentra en el estrato córneo (se fija a la queratina). Tratamientos prolongados. M: hepático (tóxico). E: renal/heces.",
 ram:"Teratógena: malformaciones óseas, neurológicas, oculares y urogenitales.",
 ci:"Usar anticoncepción hasta 1 mes después del tratamiento.",
 preg:"C",
 clave:"Se fija a la queratina y exige anticoncepción hasta un mes después"},
{t:"hongos",g:"Tópicos",n:"Nistatina",tag:"Polieno solo tópico",
 mec:"Polieno.",
 esp:"Candidiasis bucofaríngea y vaginal.",
 fc:"Restringida a uso tópico por gran toxicidad sistémica. Solución oral con 95% de primer paso.",
 clave:"Polieno restringido a uso tópico en candidiasis oral y vaginal"},
{t:"hongos",g:"Tópicos",n:"Miconazol / clotrimazol",tag:"Azoles tópicos",
 mec:"Azoles. Clotrimazol además interfiere el transporte de aminoácidos al interior actuando en la membrana.",
 esp:"Miconazol: infecciones orales, del tubo digestivo y cutáneas. Micosis tópica u óvulos (grave toxicidad sistémica). Otros: tioconazol, sulconazol, econazol.",
 clave:"Azoles tópicos y en óvulos por su toxicidad sistémica"},

// ── ANTIVIRALES
{t:"virus",g:"Influenza",n:"Amantadina / rimantadina",tag:"Canal M2 · solo influenza A",
 mec:"Bloquean la proteína M2 (canal iónico) e impiden el desmantelamiento de la cubierta viral.",
 esp:"<b>Solo influenza A</b>, eficacia 70–90%. Profilácticos.",
 fc:"Oral, aerosol. Penetran SNC. E: renal.",
 ram:"Insomnio, mareo.",
 ci:"Embriotóxicas y teratógenas; no en lactancia. Precaución en psiquiátricos, nefrópatas, epilépticos.",
 preg:"C",
 clave:"Bloquea el canal M2; solo sirve para influenza A"},
{t:"virus",g:"Influenza",n:"Oseltamivir",tag:"Neuraminidasa · influenza A y B",
 mec:"Inhibe la <b>neuraminidasa</b> (que permite al virus salir de la célula).",
 esp:"Influenza A y B.",
 dosis:"Tratamiento: 75 mg c/12 h por 5 días · Profilaxis: 75 mg/día por 7 días.",
 ram:"GI. En niños puede producir delirio.",
 preg:"C",
 clave:"Inhibe la neuraminidasa; 75 mg dos veces al día por 5 días"},
{t:"virus",g:"Influenza",n:"Zanamivir",tag:"Neuraminidasa inhalada",
 mec:"Inhibe la neuraminidasa.",
 esp:"Profilaxis y tratamiento de influenza A y B.",
 dosis:"2 inhalaciones al día por 5 días.",
 fc:"Directo a vía respiratoria.",
 clave:"Inhibidor de neuraminidasa inhalado"},
{t:"virus",g:"Influenza",n:"Peramivir",tag:"Neuraminidasa IV unidosis",
 mec:"Inhibe la neuraminidasa.",
 esp:"Influenza aguda no complicada.",
 dosis:"Dosis única IV.",
 ram:"Alucinaciones, delirio, comportamiento anómalo.",
 clave:"Inhibidor de neuraminidasa en dosis única IV"},
{t:"virus",g:"Influenza",n:"Baloxavir marboxil",tag:"Endonucleasa · dosis única oral",
 mec:"Inhibe la <b>endonucleasa</b>: interfiere la transcripción del RNA viral y bloquea la replicación.",
 dosis:"Oral, dosis única (t½ 80 h). No tomar con lácteos.",
 clave:"Inhibe la endonucleasa viral; dosis única oral sin lácteos"},
{t:"virus",g:"Herpes y CMV",n:"Aciclovir",tag:"Análogo de purina · HSV y VZV",
 mec:"Análogo de purina: inhibe la DNA polimerasa viral.",
 esp:"HSV-1 y 2, VZV; Epstein-Barr débil; <b>no CMV</b> (muy resistente).",
 dosis:"Herpes genital 400 mg c/8 h × 7–10 días · Varicela 800 mg c/6 h × 5 días · Herpes zóster 800 mg 5 veces/día · Herpes labial: película 5 veces/día × 4 días · HSV grave 5 mg/kg c/8 h × 7–10 días · Inmunosuprimido 10 mg/kg c/8 h × 7 días",
 fc:"IV, oral, tópica. Biodisponibilidad 10–30%. E: renal.",
 ram:"Náusea, diarrea, cefalea; IV: toxicidad renal reversible; neurológicos (temblor, delirio, convulsiones). Sin teratogenicidad; en embarazo iniciar en semana 36.",
 clave:"Análogo de purina para HSV y VZV que no sirve contra CMV"},
{t:"virus",g:"Herpes y CMV",n:"Valaciclovir / famciclovir",tag:"Orales para herpes",
 mec:"Inhiben la DNA polimerasa viral.",
 esp:"Herpes/VZV. <b>Valaciclovir: embarazadas con herpes genital recurrente.</b>",

const FIELDS=[["mec","Mecanismo"],["esp","Espectro / usos"],["dosis","Dosis"],["fc","Farmacocinética"],["ram","RAM"],["ci","Contraindicaciones"]];
const $=s=>document.querySelector(s);
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const strip=s=>s.replace(/<[^>]+>/g,"");
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const topic=id=>T.find(t=>t.id===id);

function hl(html,q){
  if(!q) return html;
  const nq=norm(q); if(nq.length<2) return html;
  return html.replace(/(^|>)([^<]+)/g,(m,a,txt)=>{
    const n=norm(txt); let out="",i=0,idx;
    while((idx=n.indexOf(nq,i))!==-1){out+=txt.slice(i,idx)+"<mark>"+txt.slice(idx,idx+nq.length)+"</mark>";i=idx+nq.length}
    return a+out+txt.slice(i);
  });
}

function drugCard(d,q,open){
  const t=topic(d.t);
  let body="";
  for(const [k,l] of FIELDS){ if(d[k]) body+=`<dt class="${k==='ci'?'ci-t':''}">${l}</dt><dd class="${k==='dosis'?'mono':''}">${hl(d[k],q)}</dd>`; }
  if(d.perla) body+=`<div class="pearl"><b>Clave:</b> ${hl(d.perla,q)}</div>`;
  return `<details class="drug" style="--tc:var(${t.color})"${open?" open":""}>
    <summary><span class="nm">${hl(d.n,q)}</span><span class="tag">${hl(d.tag||"",q)}</span>${d.preg?`<span class="preg" title="Categoría en embarazo">Emb. ${d.preg}</span>`:""}
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></summary>
    <dl class="body">${body}</dl></details>`;
}

function renderTopic(t){
  if(t.id==="bp") return renderBP(t);
  const idx=T.indexOf(t)+1;
  let h=`<div class="thead" style="--tc:var(${t.color})"><span class="eyebrow">Tema ${idx}</span><h2>${t.name}</h2><p>${t.intro}</p></div>`;
  if(t.keys) h+=`<div class="keys" style="--tc:var(${t.color})">`+t.keys.map(k=>`<div class="key"><h4>${k.h}</h4><ul>${k.l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")+`</div>`;
  if(t.extra) h+=`<div style="--tc:var(${t.color})">${t.extra}</div>`;
  const groups=[...new Set(D.filter(d=>d.t===t.id).map(d=>d.g))];
  for(const g of groups){
    h+=`<section class="group" style="--tc:var(${t.color})"><h3>${g}</h3><div class="cards">`+D.filter(d=>d.t===t.id&&d.g===g).map(d=>drugCard(d,"",false)).join("")+`</div></section>`;
  }
  return h;
}

function renderSearch(q){
  const nq=norm(q);
  const hits=D.filter(d=>norm(strip([d.n,d.tag,d.g,d.mec,d.esp,d.dosis,d.fc,d.ram,d.ci,d.perla,d.preg].filter(Boolean).join(" "))).includes(nq));
  let h=`<div class="thead" style="--tc:var(--accent)"><span class="eyebrow">Búsqueda</span><h2>${hits.length} resultado${hits.length===1?"":"s"} para “${q.replace(/</g,"&lt;")}”</h2><p>Las coincidencias aparecen resaltadas dentro de cada tarjeta.</p></div>`;
  if(!hits.length) return h+`<div class="empty">Sin coincidencias. Prueba con un nombre de fármaco, una bacteria o una RAM.</div>`;
  for(const t of T){
    const th=hits.filter(d=>d.t===t.id); if(!th.length) continue;
    h+=`<section class="group" style="--tc:var(${t.color})"><h3>${t.name}</h3><div class="cards">${th.map(d=>drugCard(d,q,true)).join("")}</div></section>`;
  }
  return h;
}

let fc={pool:[],i:0,flip:false,filter:"all"};
function buildFlash(){
  const known=store.get("fx-known",{});
  let cards=[];
  for(const d of D){
    if(fc.filter!=="all"&&d.t!==fc.filter) continue;
    for(const [k,l] of [["mec","Mecanismo de acción"],["ram","Reacciones adversas"],["esp","Espectro / usos principales"]]){
      if(d[k]) cards.push({id:d.n+"|"+k,t:d.t,q:d.n,meta:l,a:d[k]});
    }
  }
  if(fc.filter==="all"||fc.filter==="bp") BPQ.forEach((b,i)=>cards.push({id:"bp"+i,t:"bp",q:b.s,meta:"Buenas prácticas",a:b.o[b.a]+". "+b.e}));
  fc.all=cards.length;
  fc.pool=shuffle(cards.filter(c=>!known[c.id]));
  fc.i=0;fc.flip=false;
}

  const known=store.get("fx-known",{});
  const chips=[["all","Todo"],...T.map(t=>[t.id,t.short])].map(([id,l])=>`<button class="chip" data-ff="${id}" aria-pressed="${fc.filter===id}">${l}</button>`).join("");
  let h=`<div class="thead" style="--tc:var(--accent)"><span class="eyebrow">Repaso activo</span><h2>Flashcards</h2><p>Toca la tarjeta para voltearla. Marca “La sé” para sacarla del mazo; “Repasar” la manda al final.</p></div><div class="toolbar">${chips}</div>`;
  if(!fc.pool.length){
    return h+`<div class="empty">Dominaste este mazo (${fc.all} tarjetas). <br><br><button class="btn primary" id="fc-reset">Reiniciar mazo</button></div>`;
  }
  const c=fc.pool[fc.i%fc.pool.length], t=topic(c.t);
  const done=fc.all-fc.pool.length;
  h+=`<div class="flash"><button class="fc${fc.flip?" flip":""}" id="fc-card" style="--tc:var(${t.color})" aria-label="Voltear tarjeta">
    <div class="face"><span class="meta">${t.short} · ${c.meta}</span><div class="q">${c.q}</div><span class="hint">Toca para ver la respuesta</span></div>
    <div class="face back"><span class="meta">${c.q}</span><div class="a">${c.a}</div></div></button>
   <div class="fnav"><button class="btn bad" id="fc-again">Repasar</button><span class="counter">${done} de ${fc.all} dominadas · quedan ${fc.pool.length}</span><button class="btn good" id="fc-know">La sé</button></div>
   <div class="prog"><i style="width:${fc.all?done/fc.all*100:0}%"></i></div></div>`;
  return h;
}

// ── Examen
let qz=null, qzFilter="all";
function buildQuiz(){
  let src=D.filter(d=>d.clave&&(qzFilter==="all"||d.t===qzFilter));
  let qs=shuffle(src).slice(0,qzFilter==="bp"?0:10).map(d=>{
    let pool=D.filter(x=>x.t===d.t&&x!==d&&x.g===d.g); if(pool.length<3) pool=D.filter(x=>x.t===d.t&&x!==d);
    const opts=shuffle([d,...shuffle(pool).slice(0,3)]);
    return {t:d.t,s:`¿Qué fármaco es? “${d.clave}”`,o:opts.map(x=>x.n),a:opts.indexOf(d),e:`<b>${d.n}:</b> ${d.tag}.`};
  });
  if(qzFilter==="all"||qzFilter==="bp"){
    const b=shuffle(BPQ).slice(0,qzFilter==="bp"?6:2).map(x=>{const o=shuffle(x.o.map((v,i)=>({v,i})));return {t:"bp",s:x.s,o:o.map(z=>z.v),a:o.findIndex(z=>z.i===x.a),e:x.e}});
    qs=shuffle(qs.concat(b));
  }
  qz={qs,i:0,score:0,ans:null};
}
function renderQuiz(){
  const chips=[["all","Todo"],...T.map(t=>[t.id,t.short])].map(([id,l])=>`<button class="chip" data-qf="${id}" aria-pressed="${qzFilter===id}">${l}</button>`).join("");
  let h=`<div class="thead" style="--tc:var(--accent)"><span class="eyebrow">Autoevaluación</span><h2>Examen rápido</h2><p>Preguntas al azar con pistas tomadas de tus diapositivas. Cada intento es distinto.</p></div><div class="toolbar">${chips}</div><div class="quiz">`;
  if(qz.i>=qz.qs.length){
    const best=store.get("fx-best",{}); const k=qzFilter; const pct=Math.round(qz.score/qz.qs.length*100);
    if(!best[k]||pct>best[k]){best[k]=pct;store.set("fx-best",best)}
    return h+`<div class="qcard" style="text-align:center"><div class="score">${qz.score}/${qz.qs.length}</div><p>${pct>=80?"Muy bien, dominas este bloque.":pct>=60?"Vas bien; repasa las que fallaste en modo Estudiar.":"Conviene repasar este tema con las flashcards."}</p><p class="counter">Mejor resultado en este filtro: ${best[k]}%</p><button class="btn primary" id="qz-new">Nuevo examen</button></div></div>`;
  }
  const q=qz.qs[qz.i], t=topic(q.t);
  h+=`<div class="qcard" style="--tc:var(${t.color})"><span class="eyebrow">${t.short} · pregunta ${qz.i+1} de ${qz.qs.length}</span><div class="stem">${q.s}</div><div class="opts">`+
   q.o.map((o,i)=>{let cls="";if(qz.ans!==null){if(i===q.a)cls="ok";else if(i===qz.ans)cls="ko"}return `<button class="opt ${cls}" data-o="${i}" ${qz.ans!==null?"disabled":""}>${o}</button>`}).join("")+`</div>`;
  if(qz.ans!==null) h+=`<div class="expl">${qz.ans===q.a?"✔ Correcto. ":"✘ Incorrecto. "}${q.e}</div><div class="fnav"><span class="counter">Aciertos: ${qz.score}</span><button class="btn primary" id="qz-next">${qz.i+1<qz.qs.length?"Siguiente":"Ver resultado"}</button></div>`;
  return h+`</div></div>`;
}

function render(){
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===state.mode));
  $("#nav").hidden = state.mode!=="study";
  document.querySelector(".layout").style.gridTemplateColumns = state.mode==="study"?"":"minmax(0,1fr)";
  renderNav();
  let h="";
  if(state.mode==="study") h = state.q ? renderSearch(state.q) : renderTopic(topic(state.topic));
  else if(state.mode==="flash") h=renderFlash();
  else h=renderQuiz();
  h+=`<p class="note">Resumen elaborado solo con el texto de tus diapositivas de Farmacología II (Dra. Erika Palacios Rosas). Las tablas que estaban como imagen pueden no estar completas; contrasta dosis con tu bibliografía.</p>`;
  $("#main").innerHTML=h;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.mode){state.mode=b.dataset.mode; if(state.mode==="flash"&&!fc.pool.length&&!fc.all) buildFlash(); if(state.mode==="quiz"&&!qz) buildQuiz(); render(); window.scrollTo(0,0); return}
  if(b.dataset.t){state.topic=b.dataset.t;state.q="";$("#q").value="";store.set("fx-topic",state.topic);render();window.scrollTo(0,0);return}
  if(b.dataset.ff){fc.filter=b.dataset.ff;buildFlash();render();return}
  if(b.id==="fc-card"){fc.flip=!fc.flip;b.classList.toggle("flip",fc.flip);return}
  if(b.id==="fc-know"){const k=store.get("fx-known",{});k[fc.pool[fc.i%fc.pool.length].id]=1;store.set("fx-known",k);fc.pool.splice(fc.i%fc.pool.length,1);fc.flip=false;render();return}
  if(b.id==="fc-again"){const c=fc.pool.splice(fc.i%fc.pool.length,1)[0];fc.pool.push(c);fc.flip=false;render();return}
  if(b.id==="fc-reset"){const k=store.get("fx-known",{});const ids=new Set();buildFlashIds(ids);for(const id of ids)delete k[id];store.set("fx-known",k);buildFlash();render();return}
  if(b.dataset.qf){qzFilter=b.dataset.qf;buildQuiz();render();return}
  if(b.dataset.o!==undefined&&qz.ans===null){qz.ans=+b.dataset.o;if(qz.ans===qz.qs[qz.i].a)qz.score++;render();return}
  if(b.id==="qz-next"){qz.i++;qz.ans=null;render();return}
  if(b.id==="qz-new"){buildQuiz();render();return}
});
function buildFlashIds(set){
  for(const d of D){ if(fc.filter!=="all"&&d.t!==fc.filter) continue; for(const k of ["mec","ram","esp"]) if(d[k]) set.add(d.n+"|"+k); }
  if(fc.filter==="all"||fc.filter==="bp") BPQ.forEach((b,i)=>set.add("bp"+i));
}
let deb;
$("#q").addEventListener("input",e=>{clearTimeout(deb);deb=setTimeout(()=>{state.q=e.target.value.trim();if(state.mode!=="study")state.mode="study";render()},140)});
buildFlash();
render();
</script>

</body></html>
