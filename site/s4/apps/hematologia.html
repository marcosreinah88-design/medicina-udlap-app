<div class="callout fix"><p>Varias correcciones. La <strong>hiperdiploidía alta es de buen pronóstico</strong> (no malo). La t(12;21) es <strong>ETV6‑RUNX1</strong> (TEL/AML1); la t(1;19) es <strong>TCF3‑PBX1</strong>. Filadelfia está en ~25‑30% de adultos con LLA, no 80%. MLL <strong>no</strong> codifica MDR1: la resistencia a quimioterapia por la bomba de expulsión es la glucoproteína P (gen ABCB1/MDR1), un fenómeno distinto. La antraciclina es <strong>doxorrubicina o daunorrubicina</strong> (no “doxaciclina”).</p></div>
<h3>Tratamiento (~2‑3 años en total)</h3>
<div class="flow"><span><strong>Inducción</strong> (4‑6 sem)</span><i>→</i><span><strong>Consolidación / intensificación</strong></span><i>→</i><span><strong>Mantenimiento</strong> (hasta completar 2‑3 años)</span></div>
<ul>
<li>Inducción: <strong>esteroide</strong> (prednisona o dexametasona) + <strong>vincristina</strong> + <strong>L‑asparaginasa</strong> (depleta asparagina, que el linfoblasto no sintetiza) ± antraciclina. Meta: remisión completa (&lt;5% blastos, recuperación de cuentas) y EMR negativa.</li>
<li>Consolidación: metotrexato a dosis altas, 6‑mercaptopurina, citarabina, ciclofosfamida, reinducción.</li>
<li>Mantenimiento oral: <strong>6‑mercaptopurina diaria + metotrexato semanal</strong>, pulsos de vincristina/esteroide.</li>
<li><strong>Profilaxis de SNC</strong> durante todo el tratamiento: quimioterapia <strong>intratecal</strong> (metotrexato ± citarabina + hidrocortisona). Santuarios: SNC y testículos.</li>
<li>Ph+: añadir <strong>inhibidor de tirosina cinasa</strong> (imatinib, dasatinib, ponatinib).</li>
</ul>
<div class="callout pearl"><p>La <strong>vincristina intratecal es mortal</strong> (encefalomielopatía ascendente): solo IV. Toxicidades típicas: vincristina = neuropatía y estreñimiento; asparaginasa = pancreatitis, trombosis, hipofibrinogenemia, alergia; antraciclinas = cardiotoxicidad; metotrexato = mucositis, hepatotoxicidad (rescate con leucovorina).</p></div>
<h3>Recaída y nuevas terapias</h3>
<ul><li><strong>Blinatumomab</strong>: anticuerpo biespecífico (BiTE) <strong>CD19 × CD3</strong> que acerca el linfocito T al blasto B. Infusión continua de 28 días. Hoy también se usa en consolidación.</li>
<li><strong>Inotuzumab ozogamicina</strong>: anti‑CD22 conjugado.</li>
<li><strong>CAR‑T anti‑CD19</strong> (tisagenlecleucel, brexucabtagene): linfocitos T autólogos modificados con vector lentiviral/retroviral.</li>
<li>Toxicidades: <strong>síndrome de liberación de citocinas</strong> (fiebre, hipotensión; tocilizumab) y <strong>neurotoxicidad (ICANS)</strong>.</li>
<li>TCPH alogénico en alto riesgo, EMR persistente o recaída.</li></ul>
`});

topic({id:"lma",b:"III",title:"Leucemia mieloide aguda",short:"FAB, genética, 7+3, venetoclax y LPA (M3)",html:`
<p class="lead">Leucemia aguda más frecuente del adulto (mediana ~68 años). Modelo de <strong>doble golpe</strong>: mutación clase I (ventaja proliferativa: FLT3, KIT, RAS) + clase II (bloqueo de diferenciación: RUNX1‑RUNX1T1, PML‑RARA, CEBPA).</p>
<ul><li>Factores: edad, benceno, radiación, quimioterapia previa (alquilantes, inhibidores de topoisomerasa II), SMD/NMP previos, Down, Fanconi.</li>
<li>Si solo hay ventaja proliferativa sin bloqueo → neoplasias mieloproliferativas. Si solo bloqueo → SMD.</li></ul>
<h3>FAB y genética</h3>
<div class="tbl"><table><tr><th>FAB</th><th>Nombre</th><th>Genética / pista</th></tr>
<tr><td>M0</td><td>Mínimamente diferenciada</td><td>MPO negativa por citoquímica, CD13/CD33+. Mal pronóstico</td></tr>
<tr><td>M1</td><td>Sin maduración</td><td>–</td></tr>
<tr><td>M2</td><td>Con maduración</td><td><strong>t(8;21) RUNX1‑RUNX1T1</strong> (AML1‑ETO): favorable; cloromas</td></tr>
<tr><td>M3</td><td><strong>Promielocítica</strong> (LPA)</td><td><strong>t(15;17) PML‑RARA</strong>; CID; ATRA</td></tr>
<tr><td>M4</td><td>Mielomonocítica</td><td>M4eo: <strong>inv(16)/t(16;16) CBFB‑MYH11</strong>: favorable</td></tr>
<tr><td>M5</td><td>Monoblástica / monocítica</td><td>KMT2A (11q23); <strong>hiperplasia gingival</strong>, leucemia cutis, SNC</td></tr>
<tr><td>M6</td><td>Eritroide</td><td>Hoy: LMA eritroide pura, asociada a TP53</td></tr>
<tr><td>M7</td><td>Megacarioblástica</td><td>Niños con <strong>Down</strong> (GATA1); mielofibrosis</td></tr></table></div>
<ul><li><strong>Favorables</strong>: t(8;21), inv(16), t(15;17), <strong>NPM1</strong> mutado sin FLT3‑ITD, CEBPA bZIP.</li>
<li><strong>Adversos</strong>: cariotipo complejo (≥3 alteraciones), −5/del(5q), −7, 17p/TP53, inv(3), t(6;9), KMT2A rearreglos (salvo t(9;11)), <strong>FLT3‑ITD</strong> (intermedio por ELN 2022), ASXL1, RUNX1.</li>
<li>Dato morfológico clásico: <strong>bastones de Auer</strong> (MPO+), patognomónicos de línea mieloide.</li></ul>
<div class="mini-cells"><figure>${cellById("auer").svg}<figcaption>Bastón de Auer</figcaption></figure><figure>${cellById("promielo").svg}<figcaption>Promielocito M3</figcaption></figure></div>
<div class="callout fix"><p>La <strong>midostaurina</strong> sí está aprobada para LMA FLT3+ (combinada con 7+3) y para mastocitosis sistémica; no es “para cáncer renal”. Gilteritinib se usa en LMA FLT3+ en recaída y quizartinib en FLT3‑ITD de novo. Cariotipo complejo = <strong>≥ 3</strong> alteraciones (ELN). La leucostasis suele aparecer con <strong>&gt; 100,000</strong> leucocitos (antes en monocíticas).</p></div>
<h3>Clínica</h3>
<ul><li>Falla medular; las cifras pueden ser menos llamativas que en la LLA y hay leucopenia en un tercio.</li>
<li><strong>Leucostasis</strong> (hiperleucocitosis &gt;100,000): disnea, hipoxemia, alteración neurológica. Urgencia: citorreducción con hidroxiurea, inicio rápido de QT; leucaféresis en casos selectos. Evitar transfundir eritrocitos (aumenta viscosidad).</li>
<li>Infiltración extramedular (monocíticas): encías, piel, SNC; <strong>sarcoma mieloide (cloroma)</strong>.</li>
<li>Síndrome de lisis tumoral al iniciar el tratamiento.</li></ul>
<h3>Tratamiento</h3>
<ul>
<li>Paciente apto: inducción <strong>“7+3”</strong>: <strong>citarabina 7 días en infusión continua + antraciclina 3 días</strong> (daunorrubicina o idarrubicina). Añadir midostaurina si FLT3+, gemtuzumab ozogamicina (anti‑CD33) si core‑binding factor, CPX‑351 en LMA secundaria.</li>
<li>Consolidación: <strong>citarabina a dosis altas</strong> (riesgo favorable) o <strong>TCPH alogénico</strong> (riesgo intermedio/adverso).</li>
<li>Paciente mayor o no apto: <strong>venetoclax (anti‑BCL‑2) + azacitidina</strong> (estudio VIALE‑A, 2020), con mejor supervivencia y tratamiento mayormente ambulatorio. Con azoles (posaconazol, voriconazol) se <strong>reduce la dosis de venetoclax</strong> por interacción CYP3A4.</li>
<li>Terapias dirigidas: inhibidores de IDH1 (ivosidenib) e IDH2 (enasidenib), FLT3 (gilteritinib), menina (revumenib, para KMT2A y NPM1).</li>
</ul>
<h3>LMA promielocítica (M3, LPA)</h3>
<ul>
<li>t(15;17) <strong>PML‑RARA</strong> bloquea la diferenciación en promielocito. Frecuente en latinos, adultos jóvenes.</li>
<li>Promielocitos hipergranulares con <strong>bastones de Auer en haces (células “faggot”)</strong>. Suele presentarse con <strong>pancitopenia</strong>; la variante hipogranular (M3v) cursa con leucocitosis.</li>
<li>Los gránulos liberan <strong>factor tisular</strong> y anexina II → <strong>CID con hiperfibrinólisis</strong>: epistaxis, gingivorragia, sangrado uterino, hemorragia intracraneal (principal causa de muerte temprana).</li>
<li>Es una <strong>urgencia</strong>: iniciar <strong>ATRA (ácido transretinoico, tretinoína)</strong> ante la sola sospecha, sin esperar la confirmación genética. Soporte agresivo: plaquetas &gt;30‑50,000, fibrinógeno &gt;150 mg/dL (crioprecipitado).</li>
<li>Bajo/intermedio riesgo (leucocitos ≤ 10,000): <strong>ATRA + trióxido de arsénico (ATO)</strong> sin quimioterapia (APL0406): curación &gt; 95%. Alto riesgo (&gt; 10,000): ATRA + ATO + antraciclina o ATRA + idarrubicina (<strong>AIDA</strong>).</li>
<li><strong>Síndrome de diferenciación</strong>: fiebre, disnea, infiltrados pulmonares, derrames, ganancia de peso, hipotensión, falla renal. Tratamiento: <strong>dexametasona 10 mg IV c/12 h</strong> y suspender temporalmente ATRA/ATO si es grave. Profilaxis con esteroide si leucocitos altos.</li>
<li>Es la LMA de <strong>mejor pronóstico</strong> una vez superada la fase de sangrado.</li>
</ul>
<div class="callout fix"><p>El trióxido de arsénico ya <strong>no es solo para la recaída</strong>: ATRA + ATO es la primera línea en LPA de riesgo bajo/intermedio. Lo que se ve en el promielocito son <strong>bastones de Auer</strong> (en tus notas, “bastones de agua”).</p></div>
`});

topic({id:"llc",b:"III",title:"Leucemia linfocítica crónica y tricoleucemia",short:"Inmunofenotipo, Rai/Binet, pronóstico, BTKi y venetoclax",html:`
<p class="lead">Neoplasia de linfocitos B maduros pequeños con <strong>falla de la apoptosis</strong> (BCL‑2 alto). La leucemia más frecuente del adulto en Occidente; mediana ~70 años; rara en población asiática y menos frecuente en México.</p>
<ul><li>Precursor: <strong>linfocitosis B monoclonal</strong> (&lt;5,000 B clonales/µL sin adenopatías); progresa a LLC ~1‑2% por año.</li>
<li>Diagnóstico: <strong>≥ 5,000 linfocitos B clonales/µL</strong> por ≥ 3 meses. Muchas veces hallazgo incidental. Frotis: linfocitos pequeños maduros y <strong>sombras de Gumprecht</strong>.</li>
<li>Asociaciones: <strong>AHAI caliente</strong>, PTI, aplasia pura de serie roja, hipogammaglobulinemia (infecciones).</li></ul>
<div class="mini-cells"><figure>${cellById("smudge").svg}<figcaption>Sombra de Gumprecht</figcaption></figure></div>
<h3>Inmunofenotipo (sangre periférica)</h3>
<p><strong>CD5+, CD19+, CD23+, CD200+, CD20 débil</strong>, Ig de superficie débil con restricción κ o λ. <strong>CD10 negativo</strong>, FMC7 negativo. (El score de Matutes ≥ 4 confirma.)</p>
<div class="callout fix"><p>En tus notas: “positivo a CD10, no expresa CD19”. Es lo contrario: la LLC <strong>expresa CD19</strong> y es <strong>CD10 negativa</strong>. CD5+ CD23− con ciclina D1 sugiere linfoma del manto. ZAP‑70 y CD38 son marcadores <strong>pronósticos</strong> (positivos = peor), no diagnósticos.</p></div>
<h3>Estadificación</h3>
<div class="tbl"><table><tr><th>Rai</th><th>Binet</th></tr>
<tr><td>0: solo linfocitosis (bajo riesgo)<br>I: + adenopatías<br>II: + hepato o esplenomegalia (intermedio)<br>III: Hb &lt; 11 g/dL<br>IV: plaquetas &lt; 100,000 (alto riesgo)</td>
<td>A: &lt; 3 áreas linfoides afectadas<br>B: ≥ 3 áreas<br>C: Hb &lt; 10 g/dL o plaquetas &lt; 100,000</td></tr></table></div>
<h3>Pronóstico genético</h3>
<ul><li>Bueno: <strong>IGHV mutado</strong>, del(13q) aislada.</li>
<li>Malo: <strong>IGHV no mutado</strong>, <strong>del(17p)/mutación TP53</strong> (resistencia a quimioinmunoterapia), del(11q) (ATM), cariotipo complejo.</li>
<li>Escala CLL‑IPI integra TP53, IGHV, β2‑microglobulina, estadio y edad.</li></ul>
<div class="callout fix"><p>La t(11;14) <strong>no</strong> es de LLC: es la translocación del <strong>linfoma de células del manto</strong> (ciclina D1). En LLC las alteraciones clave son deleciones (13q, 11q, 17p) y trisomía 12.</p></div>
<h3>¿Cuándo tratar?</h3>
<p>Estadios tempranos asintomáticos: <strong>“watch and wait”</strong> (tratar antes no mejora la supervivencia). Se trata con enfermedad activa (criterios iwCLL): síntomas B, falla medular progresiva (Rai III‑IV / Binet C), esplenomegalia o adenopatías masivas o sintomáticas, tiempo de duplicación linfocitaria &lt; 6 meses, citopenias autoinmunes refractarias.</p>
<h3>Tratamiento actual</h3>
<ul>
<li><strong>Inhibidores de BTK</strong> (la tirosina cinasa de Bruton, gen en el cromosoma X, esencial para la señal del BCR): ibrutinib (primera generación, más efectos fuera de diana: fibrilación auricular, sangrado, hipertensión), <strong>acalabrutinib</strong> y <strong>zanubrutinib</strong> (más selectivos), pirtobrutinib (no covalente). Uso continuo.</li>
<li><strong>Venetoclax + obinutuzumab</strong> (anti‑CD20 glicoingenierizado, tipo II) por <strong>12 meses</strong> fijos (CLL14). Riesgo de <strong>lisis tumoral</strong>: escalamiento semanal de dosis.</li>
<li>Venetoclax + ibrutinib por ~15 ciclos (duración fija, GLOW/CAPTIVATE).</li>
<li>Históricos: clorambucil ± prednisona en ancianos; <strong>FCR</strong> (fludarabina, ciclofosfamida, rituximab) en jóvenes con IGHV mutado.</li>
<li>Inhibidores de PI3Kδ (idelalisib): en desuso por toxicidad.</li>
<li>TCPH alogénico y CAR‑T solo en enfermedad refractaria a ambas clases.</li>
</ul>
<h3>Transformaciones</h3>
<ul><li><strong>Síndrome de Richter</strong> (2‑10%): transformación a <strong>linfoma B difuso de células grandes</strong> (o Hodgkin): crecimiento ganglionar rápido, DHL alta, síntomas B. Mal pronóstico.</li>
<li>Leucemia prolinfocítica B (cuando &gt; 55% prolinfocitos).</li></ul>
<h3>Tricoleucemia (leucemia de células peludas)</h3>
<ul>
<li>Varón de mediana edad con <strong>pancitopenia con monocitopenia</strong>, <strong>esplenomegalia</strong> marcada y pocas adenopatías.</li>
<li>Los tricoleucocitos se ven en sangre y <strong>infiltran la médula</strong>: el aspirado sale <strong>seco</strong> (fibrosis reticulínica), por eso se requiere <strong>biopsia</strong>.</li>
<li>Inmunofenotipo: <strong>CD11c, CD25, CD103, CD123</strong>, anexina A1. Mutación <strong>BRAF V600E</strong> en casi todos. La tinción TRAP es histórica.</li>
<li>Tratamiento: <strong>cladribina</strong> (2‑clorodesoxiadenosina) o <strong>pentostatina</strong> (desoxicoformicina), con o sin rituximab. Recaída: vemurafenib (anti‑BRAF), moxetumomab. Excelente pronóstico.</li>
</ul>
<div class="mini-cells"><figure>${cellById("peluda").svg}<figcaption>Tricoleucocito</figcaption></figure></div>
<div class="callout fix"><p>Las células peludas <strong>sí infiltran la médula</strong>; el problema es que no se aspiran (aspirado seco). Pancitopenia + esplenomegalia + aspirado seco puede ser tricoleucemia o mielofibrosis: la diferencia la dan los tricoleucocitos (CD103+) contra los dacriocitos con leucoeritroblastosis.</p></div>
`});

topic({id:"lmc",b:"III",title:"Leucemia mieloide crónica",short:"Filadelfia, fases, ITK y metas de respuesta",html:`
<p class="lead">Neoplasia mieloproliferativa definida por el <strong>cromosoma Filadelfia</strong>: <strong>t(9;22)(q34;q11)</strong> → gen de fusión <strong>BCR‑ABL1</strong> (proteína p210), tirosina cinasa constitutivamente activa.</p>
<ul>
<li>Adultos de 45‑55 años. Fatiga, saciedad temprana, pérdida de peso; <strong>esplenomegalia</strong> (puede ser masiva).</li>
<li>Laboratorio: <strong>leucocitosis</strong> (a menudo &gt; 100,000) con todos los estadios de maduración granulocítica (pico de mielocitos y segmentados), <strong>basofilia</strong>, eosinofilia, trombocitosis, anemia leve. Fosfatasa alcalina leucocitaria baja (vs. reacción leucemoide).</li>
<li>Diagnóstico: <strong>cariotipo</strong> (Ph), <strong>FISH</strong> o <strong>RT‑PCR</strong> para BCR‑ABL1 (la PCR cuantitativa sirve además para seguimiento).</li>
</ul>
<h3>Fases</h3>
<div class="flow"><span><strong>Crónica</strong> (~85% al diagnóstico; blastos &lt;10%)</span><i>→</i><span><strong>Acelerada</strong> (blastos 10‑19%, basófilos ≥20%, evolución clonal)</span><i>→</i><span><strong>Crisis blástica</strong> (≥20% blastos; 2/3 mieloide, 1/3 linfoide)</span></div>
<p class="muted">La OMS 2022 elimina la fase acelerada y habla de fase crónica de alto riesgo; el ICC la conserva.</p>
<h3>Tratamiento</h3>
<ul>
<li><strong>Imatinib</strong> (primer ITK): ocupa el sitio de unión del <strong>ATP</strong> en el dominio cinasa de ABL. Supervivencia casi normal en fase crónica.</li>
<li>Segunda generación: <strong>dasatinib, nilotinib, bosutinib</strong> (más rápidos y potentes).</li>
<li>Tercera generación: <strong>ponatinib</strong>, activo contra la mutación <strong>T315I</strong> (“gatekeeper”, resistente a los demás).</li>
<li><strong>Asciminib</strong>: inhibidor STAMP, se une al <strong>bolsillo del miristoilo</strong> (alostérico), no al sitio del ATP; activo contra T315I.</li>
<li>Hidroxiurea: solo para citorreducción mientras se confirma el diagnóstico.</li>
<li>TCPH alogénico: crisis blástica o resistencia a varios ITK.</li>
</ul>
<h3>Metas de respuesta (ELN, BCR‑ABL1 en escala internacional)</h3>
<div class="tbl"><table><tr><th>Tiempo</th><th>Óptima</th><th>Falla</th></tr>
<tr><td>3 meses</td><td class="mono">≤ 10%</td><td>&gt; 10% confirmado</td></tr>
<tr><td>6 meses</td><td class="mono">≤ 1%</td><td class="mono">&gt; 10%</td></tr>
<tr><td>12 meses</td><td class="mono">≤ 0.1% (respuesta molecular mayor)</td><td class="mono">&gt; 1%</td></tr></table></div>
<p>La respuesta hematológica completa (citometría normal, bazo no palpable) se espera en ~3 meses. Con respuesta molecular profunda sostenida (≥ 2 años de MR4) se puede intentar <strong>suspender el ITK</strong> bajo vigilancia estrecha.</p>
<div class="callout fix"><p>No se juzga la falla “si la biometría no se normaliza al mes”: la respuesta se evalúa por <strong>PCR cuantitativa a los 3, 6 y 12 meses</strong>. La mielofibrosis es una evolución posible pero poco frecuente con ITK; la evolución temida es la crisis blástica.</p></div>
`});

topic({id:"hodgkin",b:"III",title:"Linfoma de Hodgkin",short:"Reed‑Sternberg, Ann Arbor, síntomas B y ABVD/A‑AVD",html:`
<p class="lead">Neoplasia de origen <strong>linfocito B del centro germinal</strong> en la que las células malignas (Reed‑Sternberg) son minoría (~1%) dentro de un infiltrado inflamatorio reactivo.</p>
<div class="mini-cells"><figure>${cellById("rs").svg}<figcaption>Reed‑Sternberg</figcaption></figure></div>
<ul>
<li>Reed‑Sternberg clásica: binucleada en “ojos de búho”, inmunofenotipo <strong>CD15+, CD30+</strong>, CD45−, CD20 generalmente negativo, PAX5 débil.</li>
<li>Virus de <strong>Epstein‑Barr</strong> (entra al linfocito B por <strong>CD21</strong>) en ~40% (más en celularidad mixta y en VIH).</li>
<li>Escape inmune: amplificación <strong>9p24.1</strong> → sobreexpresión de <strong>PD‑L1/PD‑L2</strong>, que “apaga” a los T alrededor. Por eso responde tanto a los anti‑PD‑1.</li>
<li>Distribución <strong>bimodal</strong>: 15‑35 años y &gt; 55 años. Factores: nivel socioeconómico alto en la infancia, familias pequeñas, mononucleosis previa.</li>
</ul>
<h3>Clínica</h3>
<ul><li>Adenopatías <strong>cervicales o supraclaviculares</strong> indoloras, de consistencia ahulada, que se extienden por <strong>contigüidad</strong>. Masa mediastinal frecuente (esclerosis nodular).</li>
<li><strong>Síntomas B</strong>: fiebre &gt; 38 °C, <strong>diaforesis nocturna profusa</strong>, pérdida de &gt; 10% del peso en 6 meses.</li>
<li>Prurito, <strong>dolor ganglionar al ingerir alcohol</strong> (raro pero característico), fiebre de <strong>Pel‑Ebstein</strong> (ciclos de 1‑2 semanas).</li></ul>
<div class="callout fix"><p>Para clasificar como “B” basta con <strong>uno</strong> de los tres síntomas (no deben estar los tres). El prurito no cuenta como síntoma B.</p></div>
<h3>Diagnóstico</h3>
<ul><li><strong>Biopsia escisional</strong> del ganglio completo (preferida) o biopsia con aguja gruesa si no es accesible. <strong>No sirve la BAAF</strong> (se pierde la arquitectura).</li>
<li>Estadificación con <strong>PET‑CT</strong> (también evalúa la respuesta con la escala de Deauville). La biopsia de médula ya no es rutinaria con PET.</li>
<li>Diferenciales: LNH, mononucleosis (EBV, CMV), TB, toxoplasmosis, bartonelosis (arañazo de gato), Kikuchi‑Fujimoto, VIH, sarcoidosis, metástasis.</li></ul>
<h3>Subtipos (OMS)</h3>
<div class="tbl"><table><tr><th>Clásico (~95%)</th><th>Característica</th></tr>
<tr><td><strong>Esclerosis nodular</strong></td><td>El más frecuente (~70%); mujeres jóvenes, mediastino; células lacunares</td></tr>
<tr><td>Celularidad mixta</td><td>Hombres, EBV+, países en desarrollo y VIH</td></tr>
<tr><td>Rico en linfocitos</td><td>Buen pronóstico</td></tr>
<tr><td>Depleción linfocitaria</td><td>Ancianos, VIH; peor pronóstico</td></tr>
<tr><th>Predominio linfocítico nodular</th><th>Hoy “linfoma B de predominio linfocítico nodular”</th></tr>
<tr><td colspan="2">Células “palomita de maíz” (LP), <strong>CD20+</strong>, CD15− CD30−; curso indolente</td></tr></table></div>
<h3>Ann Arbor (modificación de Lugano)</h3>
<div class="diagram" aria-label="Estadios de Ann Arbor">${annArborSVG()}</div>
<ul><li>I: una región ganglionar. II: ≥ 2 regiones del <strong>mismo lado</strong> del diafragma. III: regiones a <strong>ambos lados</strong> del diafragma (el bazo cuenta como región). IV: afección <strong>extraganglionar difusa</strong> (hígado, médula, pulmón).</li>
<li>Sufijos: A/B (síntomas), E (extensión extraganglionar contigua), X (enfermedad voluminosa, “bulky” ≥ 10 cm).</li>
<li>La médula ósea afectada = estadio IV.</li></ul>
<div class="callout fix"><p>La médula ósea <strong>sí</strong> se considera: su infiltración es estadio IV.</p></div>
<h3>Tratamiento</h3>
<ul>
<li>Histórico: <strong>MOPP</strong> (mecloretamina, vincristina, procarbazina, prednisona): curaba, pero causaba esterilidad y leucemias secundarias.</li>
<li><strong>ABVD</strong>: <strong>A</strong>driamicina (doxorrubicina), <strong>B</strong>leomicina, <strong>V</strong>inblastina, <strong>D</strong>acarbazina. Estándar durante décadas; la bleomicina causa <strong>neumonitis/fibrosis pulmonar</strong> (por eso se suspende si el PET interino es negativo, estudio RATHL).</li>
<li>Temprano: 2‑4 ciclos de ABVD ± radioterapia de campo involucrado.</li>
<li>Avanzado: <strong>A‑AVD</strong> (brentuximab vedotina en lugar de bleomicina; ECHELON‑1) o <strong>N‑AVD</strong> (nivolumab + AVD; SWOG S1826, superior a A‑AVD en 2024); BEACOPP escalado/BrECADD en Europa.</li>
<li><strong>Brentuximab vedotina</strong>: anticuerpo anti‑CD30 conjugado con MMAE, un tóxico de <strong>microtúbulos</strong>. <strong>Nivolumab / pembrolizumab</strong>: anti‑PD‑1.</li>
<li>Recaída: quimioterapia de rescate (ICE, o nivolumab‑ICE) + <strong>trasplante autólogo</strong>.</li>
<li>Curación &gt; 80‑90% en estadios tempranos. Vigilar efectos tardíos: segundos cánceres (mama tras radioterapia), cardiopatía, hipotiroidismo, infertilidad.</li>
</ul>
<div class="callout fix"><p>Nivolumab es <strong>anti‑PD‑1</strong> (el receptor del linfocito T), no anti‑PD‑L1. La vinblastina va en ABVD (en tus notas “vintablastina”).</p></div>
`});

topic({id:"lnh",b:"III",title:"Linfomas no Hodgkin",short:"Clasificación, subtipos clave, urgencias e IPI",html:`
<p class="lead">Grupo heterogéneo (~90% B). A diferencia del Hodgkin: diseminación <strong>no contigua</strong>, afección extraganglionar frecuente y relación con inmunodeficiencias (VIH, trasplante), autoinmunidad e infecciones (EBV, H. pylori, VHC, HTLV‑1).</p>
<p>Evolución de las clasificaciones: Rappaport y Kiel (morfología) → <strong>Working Formulation</strong> (bajo, intermedio, alto grado) → <strong>REAL</strong> (B vs. T/NK, precursores vs. maduros) → <strong>OMS</strong> (5.ª ed., 2022) e ICC.</p>
<h3>Comportamiento</h3>
<ul><li><strong>Indolentes</strong> (incurables con QT convencional pero de larga evolución): folicular grado 1‑2, LLC/linfoma linfocítico pequeño, zona marginal, MALT.</li>
<li><strong>Agresivos</strong>: difuso de células grandes B, manto, T periféricos.</li>
<li><strong>Muy agresivos</strong>: Burkitt, linfoblástico.</li></ul>
<h3>Linfomas B</h3>
<div class="tbl"><table><tr><th>Linfoma</th><th>Clave</th></tr>
<tr><td><strong>Difuso de células grandes B (LDCGB)</strong></td><td>El LNH más frecuente (~30‑40%; en México algunas series ~50%). Extraganglionar más común: <strong>estómago</strong>; SNC primario en VIH. Subtipos de célula de origen (centro germinal vs. activado). “Doble hit”: MYC + BCL2. Tratamiento <strong>R‑CHOP</strong> (rituximab, ciclofosfamida, doxorrubicina, vincristina, prednisona) o <strong>Pola‑R‑CHP</strong>; curación ~60‑70%. Recaída: CAR‑T anti‑CD19, biespecíficos (glofitamab, epcoritamab)</td></tr>
<tr><td><strong>Folicular</strong></td><td><strong>t(14;18) IGH‑BCL2</strong>. Grados 1‑2 indolentes, 3B se trata como difuso. Watch and wait si no hay carga tumoral alta; rituximab ± bendamustina</td></tr>
<tr><td><strong>Células del manto</strong></td><td><strong>t(11;14) CCND1 → ciclina D1</strong>, CD5+, SOX11+. Varón mayor, poliposis linfomatoide intestinal, médula y sangre. Agresivo; BTKi en recaída</td></tr>
<tr><td>Zona marginal esplénica</td><td>Esplenomegalia, linfocitos vellosos (polares); aspirado <strong>no</strong> seco (vs. tricoleucemia); asociado a VHC</td></tr>
<tr><td><strong>MALT</strong> gástrico</td><td><strong>H. pylori</strong>: la erradicación cura la mayoría. t(11;18) predice falta de respuesta</td></tr>
<tr><td><strong>Burkitt</strong></td><td><strong>t(8;14) MYC</strong>, Ki‑67 ~100%, patrón en <strong>“cielo estrellado”</strong>. Endémico (África, EBV, mandíbula), esporádico (abdomen/ileocecal en niños) y asociado a inmunodeficiencia (VIH). Alto riesgo de lisis tumoral. QT intensiva corta (R‑CODOX‑M/IVAC, DA‑EPOCH‑R)</td></tr>
<tr><td>Linfoblástico</td><td>Mismo proceso que la LLA (≥ 25% blastos en médula = leucemia). Predomina T: masa mediastinal en adolescente</td></tr></table></div>
<div class="callout fix"><p>El Burkitt “no endémico” no está “todo relacionado a VIH”: existe el <strong>esporádico</strong> (niños, abdomen) y el <strong>asociado a inmunodeficiencia</strong>. El folicular expresa <strong>BCL‑2</strong> (no “bel‑2”) por la t(14;18). El dato de “sangre A+” en MALT no tiene respaldo sólido; omítelo.</p></div>
<h3>Linfomas T/NK</h3>
<ul>
<li><strong>T periférico NOS</strong>: el más común de los T; ganglionar, agresivo (CHOP ± etopósido).</li>
<li><strong>Linfoma NK/T extranodal, tipo nasal</strong>: necrosis destructiva de nariz y paladar en la línea media (“cara de Voldemort”). <strong>Siempre asociado a EBV</strong>. Resistente a antraciclinas (glucoproteína P); responde a esquemas con <strong>L‑asparaginasa</strong> (SMILE, P‑GemOx) + radioterapia; anti‑PD‑1 en recaída.</li>
<li><strong>Micosis fungoides</strong>: T cutáneo CD4+ con <strong>epidermotropismo</strong> (microabscesos de Pautrier). Etapas: parche → placa → tumor. No responde a antifúngicos. Tratamiento dirigido a piel: esteroides tópicos, fototerapia (UVB, PUVA), <strong>irradiación total de piel con haz de electrones</strong>. Avanzada: mogamulizumab, brentuximab.</li>
<li><strong>Síndrome de Sézary</strong>: eritrodermia + adenopatías + <strong>células de Sézary</strong> (núcleo cerebriforme) circulantes.</li>
<li>Otros: anaplásico de células grandes (CD30+, ALK), angioinmunoblástico, hepatoesplénico γδ (jóvenes con inmunosupresión, anti‑TNF), paniculítico subcutáneo, asociado a enteropatía (celíacos), leucemia/linfoma T del adulto (HTLV‑1, hipercalcemia).</li>
</ul>
<div class="callout fix"><p>“Leg type” es el <strong>linfoma B difuso de células grandes cutáneo primario, tipo pierna</strong>: es B, no T. El linfoma NK/T nasal es prácticamente siempre EBV+; no hay una variante “no ligada a EBV” que responda bien a quimioterapia.</p></div>
<h3>Urgencias oncohematológicas</h3>
<ul><li><strong>Síndrome de vena cava superior</strong>: masa mediastinal (linfoblástico, LDCGB mediastinal) → edema facial y de brazos, ingurgitación yugular, circulación colateral. Biopsiar rápido, esteroides, QT/RT, stent.</li>
<li><strong>Síndrome de lisis tumoral</strong>: <strong>hiperuricemia, hiperpotasemia, hiperfosfatemia e hipocalcemia</strong> → lesión renal aguda, arritmias. Criterios de Cairo‑Bishop. Prevención: <strong>hiperhidratación</strong> (2.5‑3 L/m²/día), <strong>alopurinol</strong> o <strong>rasburicasa</strong> (alto riesgo; contraindicada en déficit de G6PD). Diuréticos solo si hay sobrecarga de volumen.</li>
<li>Compresión medular, hipercalcemia, hiperviscosidad.</li></ul>
<h3>IPI (Índice Pronóstico Internacional), 1 punto cada uno</h3>
<div class="tbl"><table><tr><th>Factor (mnemotecnia APLES)</th></tr>
<tr><td><strong>A</strong>ge: edad &gt; 60 años</td></tr><tr><td><strong>P</strong>erformance: ECOG ≥ 2</td></tr><tr><td><strong>L</strong>DH elevada</td></tr><tr><td><strong>E</strong>xtranodal: &gt; 1 sitio</td></tr><tr><td><strong>S</strong>tage: Ann Arbor III‑IV</td></tr></table></div>
<p>Riesgo: bajo 0‑1 · intermedio‑bajo 2 · intermedio‑alto 3 · alto 4‑5. Calcúlalo en Calculadoras.</p>
<p><strong>ECOG</strong>: 0 asintomático · 1 síntomas, ambulatorio, trabajo ligero · 2 en cama &lt; 50% del día, se cuida solo · 3 en cama &gt; 50% · 4 postrado totalmente · 5 muerte.</p>
<div class="callout fix"><p>El corte de edad del IPI es <strong>&gt; 60 años</strong> (no 65). Supervivencia libre de enfermedad = tiempo vivo sin recaída; supervivencia global = tiempo vivo, con o sin enfermedad.</p></div>
`});

topic({id:"mieloma",b:"III",title:"Mieloma múltiple",short:"CRAB‑SLiM, MGUS, ISS y tratamiento con D‑VRd",html:`
<p class="lead">Neoplasia de <strong>células plasmáticas</strong> monoclonales en médula que producen una inmunoglobulina monoclonal (<strong>proteína M</strong>). Mediana ~65‑70 años; hombres &gt; mujeres; doble de frecuente en afrodescendientes. Siempre precedido por una <strong>GMSI (MGUS)</strong>.</p>
<ul><li>Tipo de proteína M: <strong>IgG (~50%) &gt; IgA (~20%) &gt; solo cadenas ligeras (~20%)</strong>; κ más frecuente que λ. IgD, IgE y no secretor son raros.</li>
<li>La <strong>IL‑6</strong> del estroma es el principal factor de crecimiento del plasmocito.</li></ul>
<div class="mini-cells"><figure>${cellById("plasmo").svg}<figcaption>Plasmocito</figcaption></figure><figure>${cellById("rouleaux").svg}<figcaption>Rouleaux</figcaption></figure></div>
<h3>Fisiopatología → CRAB</h3>
<ul>
<li><strong>Hueso</strong>: el plasmocito aumenta <strong>RANKL</strong> y baja OPG, e inhibe osteoblastos (DKK1) → lesiones <strong>puramente líticas</strong> en “sacabocados”, fracturas patológicas, <strong>dolor óseo</strong> (síntoma más frecuente, sobre todo lumbar) e hipercalcemia. El gammagrama óseo puede ser normal (no hay actividad osteoblástica); se usa TC de cuerpo entero a dosis baja, PET o RM.</li>
<li><strong>Riñón</strong>: <strong>nefropatía por cilindros de cadenas ligeras</strong> (riñón del mieloma), hipercalcemia, amiloidosis AL. Hidratación, evitar AINE y contraste.</li>
<li><strong>Anemia</strong> normocítica: infiltración medular, ↓EPO. Frotis con <strong>pilas de monedas (rouleaux)</strong>, VSG muy alta.</li>
<li>Infecciones (inmunoparesia de Ig policlonales), hiperviscosidad (más en IgA y Waldenström), brecha aniónica baja.</li>
</ul>
<div class="callout fix"><p>Las lesiones del mieloma son <strong>líticas</strong> (las blásticas sugieren otra cosa, p. ej. POEMS o metástasis de próstata). Los bisfosfonatos (ácido zoledrónico) y el <strong>denosumab</strong> (anti‑RANKL; preferible en falla renal) inhiben a los <strong>osteoclastos</strong>; no actúan “inhibiendo IL‑6 ni reduciendo colesterol”.</p></div>
<h3>Diagnóstico (IMWG)</h3>
<p>Plasmocitos clonales en médula <strong>≥ 10%</strong> o plasmocitoma demostrado por biopsia, <strong>más</strong> al menos un evento definitorio:</p>
<div class="tbl"><table><tr><th>CRAB</th><th>SLiM (biomarcadores)</th></tr>
<tr><td><strong>C</strong>alcio &gt; 11 mg/dL<br><strong>R</strong>enal: creatinina &gt; 2 mg/dL o TFG &lt; 40<br><strong>A</strong>nemia: Hb &lt; 10 g/dL o 2 g por debajo de lo normal<br><strong>B</strong>one: ≥ 1 lesión lítica</td>
<td><strong>S</strong>ixty: plasmocitos ≥ 60%<br><strong>Li</strong>ght chains: relación libre involucrada/no involucrada ≥ 100<br><strong>M</strong>RI: &gt; 1 lesión focal ≥ 5 mm</td></tr></table></div>
<div class="tbl"><table><tr><th>Entidad</th><th>Proteína M sérica</th><th>Plasmocitos</th><th>Daño orgánico</th></tr>
<tr><td>GMSI (MGUS)</td><td class="mono">&lt; 3 g/dL</td><td class="mono">&lt; 10%</td><td>No (progresa ~1%/año)</td></tr>
<tr><td>Mieloma latente (smoldering)</td><td class="mono">≥ 3 g/dL</td><td class="mono">10‑59%</td><td>No</td></tr>
<tr><td>Mieloma múltiple</td><td>Cualquiera</td><td class="mono">≥ 10%</td><td>CRAB o SLiM</td></tr></table></div>
<p>Estudios: electroforesis e <strong>inmunofijación</strong> en suero y orina (proteína de Bence Jones), cadenas ligeras libres en suero, aspirado/biopsia con FISH, β2‑microglobulina, albúmina, DHL, imagen.</p>
<div class="callout fix"><p>Tus criterios (IgG &gt; 3.5, IgA &gt; 2.5, plasmocitos &gt; 30%) corresponden a esquemas antiguos. El estándar actual son los criterios <strong>IMWG 2014 (CRAB + SLiM)</strong>.</p></div>
<h3>Estadificación ISS / R‑ISS</h3>
<div class="tbl"><table><tr><th>ISS</th><th>Criterio</th><th>Mediana de supervivencia (era antigua)</th></tr>
<tr><td>I</td><td>β2M <strong>&lt; 3.5 mg/L</strong> y albúmina ≥ 3.5 g/dL</td><td>~62 meses</td></tr>
<tr><td>II</td><td>Ni I ni III</td><td>~44 meses</td></tr>
<tr><td>III</td><td>β2M <strong>≥ 5.5 mg/L</strong></td><td>~29 meses</td></tr></table></div>
<p>El <strong>R‑ISS</strong> agrega DHL y citogenética de alto riesgo: <strong>del(17p), t(4;14), t(14;16)</strong> (y en R2‑ISS, 1q+). Con terapias actuales la supervivencia supera ampliamente estas cifras (mediana &gt; 8‑10 años en pacientes aptos).</p>
<h3>Tratamiento</h3>
<ul>
<li>Clases: inhibidores de proteasoma (<strong>bortezomib</strong>, carfilzomib), inmunomoduladores (talidomida, <strong>lenalidomida</strong>, pomalidomida), <strong>anti‑CD38</strong> (daratumumab, isatuximab), esteroides (dexametasona), alquilantes (melfalán).</li>
<li>Apto para trasplante: inducción <strong>D‑VRd</strong> (daratumumab + bortezomib + lenalidomida + dexametasona) → <strong>melfalán a dosis altas + trasplante autólogo</strong> → <strong>mantenimiento con lenalidomida</strong>.</li>
<li>No apto: DRd o D‑VRd sin trasplante.</li>
<li>Recaída: <strong>CAR‑T anti‑BCMA</strong> (ide‑cel, cilta‑cel) y <strong>biespecíficos</strong> (teclistamab, elranatamab: BCMA×CD3; talquetamab: GPRC5D×CD3).</li>
<li>Soporte: ácido zoledrónico o denosumab, profilaxis de trombosis con IMiD (aspirina o anticoagulante), aciclovir con bortezomib (herpes zóster), vacunas, radioterapia para dolor o compresión medular.</li>
</ul>
<div class="callout fix"><p>El esquema es <strong>VRd</strong> (bortezomib, <strong>lenalidomida</strong>, dexametasona), no “BRD con rividtalidomida”. Talidomida inhibe la angiogénesis y es teratógena; todos los IMiD aumentan el riesgo de trombosis.</p></div>
`});

topic({id:"nmp",b:"III",title:"Neoplasias mieloproliferativas (Ph negativas)",short:"Policitemia vera, trombocitemia esencial, mielofibrosis y otras",html:`
<p class="lead">Proliferación clonal de células mieloides que <strong>maduran</strong> (ventaja proliferativa sin bloqueo de diferenciación). Requisito: <strong>BCR‑ABL1 negativo</strong> (si es positivo, es LMC). Mutaciones conductoras: <strong>JAK2 V617F</strong>, <strong>CALR</strong>, <strong>MPL</strong>.</p>
<div class="tbl"><table><tr><th></th><th>JAK2 V617F</th><th>JAK2 exón 12</th><th>CALR</th><th>MPL</th></tr>
<tr><td>Policitemia vera</td><td class="mono">~95%</td><td class="mono">~3%</td><td>–</td><td>–</td></tr>
<tr><td>Trombocitemia esencial</td><td class="mono">~55%</td><td>–</td><td class="mono">~25%</td><td class="mono">~5%</td></tr>
<tr><td>Mielofibrosis primaria</td><td class="mono">~60%</td><td>–</td><td class="mono">~25%</td><td class="mono">~7%</td></tr></table></div>
<p>El 10‑15% de TE y MF son <strong>“triple negativas”</strong>. JAK2 es una cinasa citoplasmática asociada a los receptores de EPO, TPO y G‑CSF; la mutación la deja activa sin necesidad de ligando.</p>
<h3>Policitemia vera</h3>
<ul>
<li>Criterios OMS 2022: Hb <strong>&gt; 16.5 g/dL (♂) / &gt; 16 (♀)</strong> o Hto &gt; 49/48%, biopsia con panmielosis, JAK2 mutado; criterio menor: <strong>EPO sérica baja</strong>.</li>
<li>Clínica: rubicundez, cefalea, <strong>prurito acuagénico</strong> (tras el baño), <strong>eritromelalgia</strong> (ardor y eritema en manos y pies, responde a aspirina), esplenomegalia, <strong>trombosis</strong> arteriales y venosas (Budd‑Chiari), gota. Con frecuencia también leucocitosis y trombocitosis.</li>
<li>Tratamiento: <strong>flebotomías</strong> para Hto &lt; 45% + <strong>aspirina</strong> a dosis baja a todos. Citorreducción en alto riesgo (&gt; 60 años o trombosis previa): <strong>hidroxiurea</strong> o <strong>interferón pegilado (ropeginterferón alfa‑2b)</strong>; <strong>ruxolitinib</strong> (inhibidor JAK1/2) en intolerancia o resistencia.</li>
<li>Evolución: mielofibrosis post‑PV (~10‑20% a 15 años) y LMA (~5%).</li>
</ul>
<div class="tbl"><table><tr><th>Eritrocitosis</th><th>EPO</th><th>Ejemplos</th></tr>
<tr><td>Primaria (PV)</td><td class="down">Baja</td><td>JAK2</td></tr>
<tr><td>Secundaria por hipoxia</td><td class="up">Alta</td><td>EPOC, apnea del sueño (CPAP), cardiopatía cianógena, altura, tabaquismo</td></tr>
<tr><td>Secundaria por tumor</td><td class="up">Alta</td><td>Carcinoma renal, hepatocarcinoma, hemangioblastoma cerebeloso, miomas; también testosterona y SGLT2i</td></tr></table></div>
<div class="callout fix"><p>El umbral diagnóstico no es 19 g/dL: es <strong>&gt; 16.5 (♂) / &gt; 16 (♀)</strong>. El término es <strong>eritromelalgia</strong>. La hidroxiurea es citorreductora; el ruxolitinib controla síntomas, bazo y hematocrito, pero no es curativo. El TCPH no es la meta habitual en PV (sí en mielofibrosis de alto riesgo).</p></div>
<h3>Trombocitemia esencial</h3>
<ul><li>Plaquetas <strong>≥ 450,000</strong> persistentes, megacariocitos grandes e hiperlobulados, mutación conductora y <strong>exclusión</strong> de otras causas: <strong>ferropenia</strong>, inflamación, infección, esplenectomía, cáncer, LMC (BCR‑ABL1), SMD con del(5q).</li>
<li>Trombosis (más con JAK2 y edad &gt; 60) y, con plaquetas &gt; 1,000,000‑1,500,000, <strong>sangrado</strong> por von Willebrand adquirido.</li>
<li>Tratamiento: aspirina; hidroxiurea, anagrelida o interferón en alto riesgo.</li></ul>
<h3>Mielofibrosis primaria</h3>
<ul>
<li>Fase prefibrótica (trombocitosis, leucocitosis) → fase fibrótica (fibrosis reticulínica y colágena, grados MF‑0 a MF‑3 de la OMS; antes Bauermeister I‑IV).</li>
<li><strong>Esplenomegalia masiva</strong> por hematopoyesis extramedular, síntomas constitucionales, citopenias.</li>
<li>Frotis: <strong>dacriocitos</strong> + <strong>reacción leucoeritroblástica</strong>. Aspirado <strong>seco</strong>: el diagnóstico se hace por biopsia.</li>
<li>Pronóstico: DIPSS‑plus, MIPSS70.</li>
<li>Tratamiento: inhibidores de JAK (<strong>ruxolitinib</strong>, fedratinib, pacritinib si plaquetas bajas, <strong>momelotinib</strong> si anemia). Único curativo: <strong>TCPH alogénico</strong> en riesgo intermedio‑alto.</li>
</ul>
<div class="mini-cells"><figure>${cellById("dacrio").svg}<figcaption>Dacriocito</figcaption></figure></div>
<h3>Otras</h3>
<ul>
<li><strong>Leucemia neutrofílica crónica</strong>: neutrofilia madura persistente (&gt; 25,000), mutación <strong>CSF3R</strong>; Ph negativa.</li>
<li><strong>Neoplasias con eosinofilia</strong> y rearreglos de <strong>PDGFRA</strong> (FIP1L1‑PDGFRA, del 4q12, la más frecuente) o <strong>PDGFRB</strong> (t(5;12) ETV6‑PDGFRB): responden de forma espectacular a <strong>imatinib</strong>. Eosinófilos &gt; 1,500 con daño orgánico (miocarditis eosinofílica, fibrosis endomiocárdica, neuropatía, encefalopatía).</li>
<li><strong>Mastocitosis sistémica</strong>: mutación <strong>KIT D816V</strong>, mastocitos fusiformes que expresan <strong>CD25, CD2 y CD30</strong>, <strong>triptasa sérica &gt; 20 ng/mL</strong>. Urticaria pigmentosa (signo de Darier), anafilaxia, osteoporosis. Formas avanzadas: <strong>midostaurina, avapritinib</strong>.</li>
<li><strong>LMMC</strong>: neoplasia mixta SMD/NMP (ver Mielodisplasia).</li>
</ul>
<div class="callout fix"><p>La mastocitosis marca <strong>CD25 y CD2</strong> (no CD125) y se define por KIT D816V.</p></div>
`});

topic({id:"smd",b:"III",title:"Síndromes mielodisplásicos",short:"Displasia, citopenias, OMS 2022, IPSS‑R y tratamiento",html:`
<p class="lead">Neoplasias clonales de la CMH con <strong>hematopoyesis ineficaz</strong>: médula normo o <strong>hipercelular</strong> con <strong>citopenias</strong> periféricas, <strong>displasia</strong> (≥ 10% de una línea) y riesgo de progresar a LMA. Edad media ~70 años.</p>
<ul><li>Causas: edad (hematopoyesis clonal, CHIP), quimio y radioterapia previas (SMD relacionado con terapia), benceno, síndromes hereditarios.</li>
<li>Displasia típica: eritroblastos con núcleos irregulares y <strong>sideroblastos en anillo</strong>; neutrófilos <strong>hipogranulares e hiposegmentados (pseudo‑Pelger‑Huët)</strong>; micromegacariocitos.</li>
<li>Siempre descartar causas no clonales de displasia: déficit de B12/folato, cobre, alcohol, VIH, fármacos.</li></ul>
<div class="mini-cells"><figure>${cellById("sidero").svg}<figcaption>Sideroblasto en anillo</figcaption></figure></div>
<h3>Fisiopatología según riesgo</h3>
<ul><li><strong>Bajo riesgo</strong>: <strong>apoptosis aumentada</strong> de precursores en médula → citopenias; poca progresión.</li>
<li><strong>Alto riesgo</strong>: menos apoptosis, más mutaciones, <strong>acumulación de blastos</strong> → evolución a LMA.</li></ul>
<div class="callout fix"><p>En tus notas los grupos aparecen invertidos. El SMD de <strong>buen pronóstico</strong> es el que tiene <strong>apoptosis aumentada</strong> (por eso hay citopenias con médula llena). Cuando las células dejan de morir y sobreviven defectuosas, aumentan los blastos y el riesgo de leucemia.</p></div>
<h3>Clasificación OMS 2022 (lo esencial)</h3>
<div class="tbl"><table><tr><th>Grupo</th><th>Definición</th><th>Tratamiento típico</th></tr>
<tr><td>SMD con del(5q) aislada</td><td>Mujer mayor, anemia macrocítica, plaquetas normales o altas</td><td><strong>Lenalidomida</strong></td></tr>
<tr><td>SMD con mutación <strong>SF3B1</strong> (antes anemia refractaria con sideroblastos en anillo)</td><td>Sideroblastos en anillo ≥ 5% con SF3B1 (o ≥ 15%)</td><td>EPO; <strong>luspatercept</strong></td></tr>
<tr><td>SMD con bajo número de blastos</td><td>Blastos &lt; 5% en médula</td><td>Soporte, EPO, transfusiones, quelación</td></tr>
<tr><td>SMD hipoplásico</td><td>Celularidad baja</td><td>Puede responder a ATG/ciclosporina</td></tr>
<tr><td>SMD con aumento de blastos (SMD‑IB1 / IB2)</td><td>Blastos 5‑9% / <strong>10‑19%</strong></td><td><strong>Azacitidina o decitabina</strong>; TCPH alogénico si es apto</td></tr>
<tr><td>Mutación de <strong>TP53</strong> bialélica</td><td>Muy mal pronóstico</td><td>Ensayos clínicos, TCPH</td></tr></table></div>
<div class="callout fix"><p>LMA se define con <strong>≥ 20%</strong> de blastos (no 10%). La antigua AREB‑2 (10‑19%) es hoy SMD‑IB2 (OMS) o SMD/LMA (ICC). La combinación venetoclax + azacitidina <strong>no</strong> es estándar en SMD (el estudio VERONA no mostró beneficio); en SMD de alto riesgo el estándar es azacitidina y trasplante.</p></div>
<h3>Pronóstico</h3>
<p><strong>IPSS‑R</strong>: citogenética, % de blastos, Hb, plaquetas y neutrófilos. <strong>IPSS‑M</strong> añade mutaciones (TP53, ASXL1, RUNX1…). Bajo riesgo: el objetivo es corregir citopenias. Alto riesgo: modificar la historia natural.</p>
<h3>Leucemia mielomonocítica crónica (SMD/NMP)</h3>
<ul><li>Monocitosis persistente <strong>≥ 1,000/µL</strong> (OMS 2022 acepta ≥ 500 con apoyo clonal) y <strong>≥ 10%</strong> de los leucocitos. Mutaciones TET2, SRSF2, ASXL1.</li>
<li>Leucocitos &lt; 13,000 = <strong>LMMC displásica</strong>; ≥ 13,000 = <strong>proliferativa</strong> (más esplenomegalia y síntomas).</li>
<li>Tratamiento: hidroxiurea (proliferativa), hipometilantes; TCPH es el único curativo.</li></ul>
`});

topic({id:"tcph",b:"III",title:"Trasplante de células progenitoras hematopoyéticas",short:"Tipos, acondicionamiento, injerto y EICH",html:`
<h3>Tipos</h3>
<div class="tbl"><table><tr><th></th><th>Autólogo</th><th>Alogénico</th></tr>
<tr><td>Fuente</td><td>El propio paciente</td><td>Hermano HLA idéntico, donador no relacionado, <strong>haploidéntico</strong> (padre, hijo, hermano: 50%), sangre de cordón</td></tr>
<tr><td>Objetivo</td><td>Rescatar la médula tras QT a dosis altas</td><td>Reemplazar médula + efecto <strong>injerto contra leucemia</strong></td></tr>
<tr><td>Indicaciones</td><td><strong>Mieloma</strong>, linfomas en recaída (Hodgkin, LDCGB), algunas autoinmunes, tumores germinales</td><td>LMA de riesgo intermedio/alto, LLA alto riesgo, SMD alto riesgo, <strong>aplasia grave</strong>, mielofibrosis, hemoglobinopatías, inmunodeficiencias</td></tr>
<tr><td>EICH</td><td>No</td><td>Sí</td></tr>
<tr><td>Mortalidad por trasplante</td><td>&lt; 2‑5%</td><td>~10‑25%</td></tr></table></div>
<ul><li>Tipificación HLA de alta resolución (HLA‑A, ‑B, ‑C, ‑DRB1, ‑DQB1) desde sangre o hisopado bucal.</li>
<li>Hoy el haploidéntico con <strong>ciclofosfamida postrasplante</strong> (días +3 y +4, elimina T alorreactivos) logra resultados similares a donadores compatibles.</li></ul>
<h3>Etapas</h3>
<div class="flow"><span>Evaluación del comité (cardio, pulmón, odonto, psico, infecto)</span><i>→</i><span><strong>Movilización</strong> del donador</span><i>→</i><span><strong>Aféresis</strong></span><i>→</i><span><strong>Acondicionamiento</strong> del receptor</span><i>→</i><span>Día 0: infusión IV</span><i>→</i><span>Aplasia y soporte</span><i>→</i><span><strong>Injerto</strong></span></div>
<ul>
<li>Movilización con <strong>filgrastim</strong> 4‑5 días (± plerixafor); meta <strong>≥ 2 × 10⁶ CD34+/kg</strong> del receptor (ideal 4‑5 × 10⁶). El donador repone sus células madre en semanas.</li>
<li>Las células infundidas por un catéter venoso central “anidan” en la médula (<strong>homing</strong>, eje CXCR4/SDF‑1).</li>
<li>Acondicionamiento <strong>mieloablativo</strong> (BuCy: busulfán + ciclofosfamida; ciclofosfamida + irradiación corporal total), de <strong>intensidad reducida</strong> o no mieloablativo (fludarabina‑base) en mayores. Para autólogo en linfoma: <strong>BEAM</strong> (carmustina, etopósido, citarabina, melfalán); en mieloma: <strong>melfalán 200 mg/m²</strong>.</li>
<li>Autólogo: las células se <strong>criopreservan</strong> con <strong>DMSO</strong> (dimetilsulfóxido) a −80/−196 °C.</li>
</ul>
<h3>Injerto</h3>
<ul><li>Neutrofílico: <strong>&gt; 500 neutrófilos/µL por 3 días consecutivos</strong> (~día +10‑20). La monocitosis suele anunciarlo.</li>
<li>Plaquetario: <strong>&gt; 20,000/µL sin transfusión por 7 días</strong>.</li>
<li>El día +100 es un hito clásico de mortalidad relacionada con el trasplante.</li></ul>
<div class="callout fix"><p>La definición estándar de injerto plaquetario es <strong>&gt; 20,000</strong> sin transfusión por 7 días (algunos centros usan 50,000 como meta secundaria). El crioprotector es DMSO (no “DMSO4”).</p></div>
<h3>Enfermedad injerto contra huésped (EICH)</h3>
<ul>
<li>Los linfocitos T del donador atacan tejidos del receptor. Prevención: ciclosporina/tacrolimus + metotrexato, ciclofosfamida postrasplante, ATG.</li>
<li><strong>Aguda</strong>: <strong>piel</strong> (exantema maculopapular en palmas y plantas), <strong>hígado</strong> (bilirrubina) y <strong>tubo digestivo</strong> (diarrea). Grados I‑IV (Glucksberg/MAGIC).</li>
<li><strong>Crónica</strong>: parecida a enfermedades autoinmunes: esclerodermia‑like, síndrome seco, bronquiolitis obliterante, liquen oral, cualquier órgano.</li>
<li>Hoy se distinguen por las características clínicas más que por el día 100.</li>
<li>Tratamiento: grado I tópico; grados II‑IV <strong>metilprednisolona 2 mg/kg</strong>. Corticorresistente aguda: <strong>ruxolitinib</strong> (REACH2). Crónica: esteroides; refractaria: ruxolitinib, <strong>belumosudil</strong> (inhibidor ROCK2), ibrutinib, axatilimab.</li>
</ul>
`});

topic({id:"coag",b:"IV",title:"Hemostasia y coagulación",short:"Plaquetas, cascada, anticoagulantes naturales, pruebas y trastornos",html:`
<p class="lead">Sistema que mantiene la sangre líquida dentro de los vasos y forma un tapón cuando se rompen. La hemostasia primaria (plaquetas) y la secundaria (factores) ocurren a la vez.</p>
<h3>Hemostasia primaria</h3>
<div class="flow"><span>Vasoconstricción</span><i>→</i><span><strong>Adhesión</strong>: GPIb‑IX‑V ↔ FvW ↔ colágeno</span><i>→</i><span><strong>Activación</strong>: cambio de forma, liberación de ADP y TXA2</span><i>→</i><span><strong>Agregación</strong>: GPIIb/IIIa ↔ fibrinógeno</span></div>
<ul>
<li>El <strong>FvW</strong> se almacena en los <strong>cuerpos de Weibel‑Palade del endotelio</strong> (junto con P‑selectina) y en los gránulos α de las plaquetas. Además transporta y estabiliza al <strong>factor VIII</strong>.</li>
<li><strong>Bernard‑Soulier</strong> (AR): falta GPIb → falla la <strong>adhesión</strong>; trombocitopenia con <strong>plaquetas gigantes</strong>; no aglutina con ristocetina (no corrige con plasma).</li>
<li><strong>Trombastenia de Glanzmann</strong> (AR): falta GPIIb/IIIa → falla la <strong>agregación</strong>; plaquetas normales en número y tamaño; no agrega con ADP, colágeno ni epinefrina (sí con ristocetina).</li>
<li>Patrón clínico: defectos plaquetarios/FvW = <strong>sangrado mucocutáneo</strong> inmediato (petequias, epistaxis, menorragia). Defectos de factores = <strong>hemartrosis</strong>, hematomas musculares y sangrado tardío.</li>
</ul>
<div class="callout fix"><p>Los cuerpos de Weibel‑Palade están en las <strong>células endoteliales</strong>, no en la plaqueta, y no contienen factor VII. La plaqueta tiene gránulos α (FvW, fibrinógeno, factor V, PF4) y densos (ADP, Ca²⁺, serotonina).</p></div>
<h3>Cascada (modelo clásico para interpretar pruebas)</h3>
<div class="diagram" aria-label="Cascada de coagulación">${cascadeSVG()}</div>
<ul>
<li><strong>Extrínseca</strong> (inicio in vivo): lesión → <strong>factor tisular</strong> + <strong>VIIa</strong> → activa X (y IX).</li>
<li><strong>Intrínseca</strong> (amplificación): XII (contacto, con precalicreína y HMWK) → XI → IX. <strong>IXa + VIIIa</strong> + Ca²⁺ + fosfolípidos = <strong>tenasa intrínseca</strong> → X.</li>
<li><strong>Común</strong>: <strong>Xa + Va = protrombinasa</strong> → protrombina (II) → <strong>trombina</strong> → fibrinógeno (I) → fibrina; el <strong>XIIIa</strong> la entrecruza y estabiliza.</li>
<li>En el modelo celular: iniciación (FT‑VIIa), amplificación (trombina activa V, VIII, XI y plaquetas) y propagación sobre la superficie plaquetaria.</li>
</ul>
<div class="callout fix"><p>En tus notas la vía intrínseca “activa 8 y luego tenasa”, y la protrombina “por factor XIII”. Lo correcto: IXa (con VIIIa como cofactor) forma la tenasa, que activa X; Xa con Va forma la protrombinasa que convierte protrombina en trombina; el XIII solo estabiliza la fibrina.</p></div>
<h3>Anticoagulantes naturales y fibrinólisis</h3>
<ul>
<li><strong>Antitrombina</strong>: inhibe trombina y Xa (la heparina la potencia ~1,000 veces).</li>
<li><strong>Proteína C</strong> (activada por trombina unida a <strong>trombomodulina</strong>) + cofactor <strong>proteína S</strong>: degradan Va y VIIIa.</li>
<li><strong>TFPI</strong>: inhibe el complejo FT‑VIIa‑Xa.</li>
<li><strong>Fibrinólisis</strong>: el <strong>tPA</strong> (endotelio) y la uroquinasa convierten <strong>plasminógeno → plasmina</strong>, que degrada fibrina. Inhibidores: <strong>PAI‑1</strong>, α2‑antiplasmina, TAFI.</li>
<li>El <strong>dímero D</strong> es producto de degradación de la <strong>fibrina entrecruzada</strong> (por XIII): indica que se formó y se está lisando un coágulo. Muy sensible y poco específico: un valor normal ayuda a <strong>descartar</strong> TEP/TVP con probabilidad clínica baja.</li>
<li><strong>Ácido tranexámico</strong>: <strong>antifibrinolítico</strong> (bloquea la unión del plasminógeno a la fibrina). Útil en trauma (&lt; 3 h), hemorragia posparto, menorragia, cirugía.</li>
</ul>
<div class="callout fix"><p>El dímero D deriva de la <strong>fibrina</strong> (no del fibrinógeno). El ácido tranexámico no es procoagulante: es antifibrinolítico.</p></div>
<h3>Pruebas</h3>
<div class="tbl"><table><tr><th>Prueba</th><th>Evalúa</th><th>Se prolonga en</th></tr>
<tr><td>Cuenta plaquetaria</td><td>Número</td><td>–</td></tr>
<tr><td>Tiempo de sangrado / PFA‑100</td><td>Función plaquetaria y FvW</td><td>Trombocitopatías, von Willebrand, aspirina, uremia</td></tr>
<tr><td><strong>TP / INR</strong></td><td>Extrínseca + común: <strong>VII</strong>, X, V, II, fibrinógeno</td><td><strong>Warfarina</strong>, déficit de vitamina K, hepatopatía (primero, porque el VII tiene la vida media más corta), CID</td></tr>
<tr><td><strong>TTPa</strong></td><td>Intrínseca + común: XII, XI, <strong>IX, VIII</strong>, X, V, II</td><td><strong>Heparina no fraccionada</strong>, hemofilias A y B, von Willebrand (a veces), anticoagulante lúpico, déficit de XII (sin sangrado)</td></tr>
<tr><td>Tiempo de trombina</td><td>Fibrinógeno → fibrina</td><td>Hipo‑/disfibrinogenemia, heparina, dabigatrán</td></tr>
<tr><td>Fibrinógeno</td><td class="mono">200‑400 mg/dL</td><td>&lt; 150: riesgo de sangrado (CID, hepatopatía)</td></tr></table></div>
<p>Si un tiempo prolongado <strong>corrige al mezclar 1:1 con plasma normal</strong>, hay un déficit de factor; si <strong>no corrige</strong>, hay un inhibidor (anticoagulante lúpico, anti‑FVIII).</p>
<div class="callout pearl"><p>Factores <strong>dependientes de vitamina K</strong>: <strong>II, VII, IX, X</strong> y proteínas <strong>C y S</strong> (la vitamina K carboxila residuos de glutamato en el hígado). El fibrinógeno (I) <strong>no</strong> depende de vitamina K.</p></div>
<div class="callout fix"><p>En tus notas: “1, 2, 7, 9, 10 vitamina K dependientes”. El I no lo es. Para revertir warfarina o déficit de vitamina K: <strong>vitamina K IV</strong> + <strong>concentrado de complejo protrombínico (CCP)</strong> o plasma. El <strong>factor VIIa recombinante</strong> se usa sobre todo en hemofilia con inhibidores y Glanzmann, no como tratamiento de rutina en hepatopatía.</p></div>
<h3>Trastornos que debes dominar (complemento)</h3>
<div class="tbl"><table><tr><th>Trastorno</th><th>Plaquetas</th><th>TP</th><th>TTPa</th><th>Clave</th></tr>
<tr><td>PTI</td><td class="down">↓</td><td>N</td><td>N</td><td>Diagnóstico de exclusión; esteroides, IgIV si sangra; agonistas de TPO, rituximab, esplenectomía</td></tr>
<tr><td>Enfermedad de von Willebrand</td><td>N</td><td>N</td><td>N o ↑</td><td>La coagulopatía hereditaria <strong>más frecuente</strong>; tipo 1 (cuantitativa parcial). Desmopresina (DDAVP), concentrado FVIII/FvW</td></tr>
<tr><td>Hemofilia A / B</td><td>N</td><td>N</td><td class="up">↑</td><td>Ligadas al X; déficit de <strong>VIII</strong> / <strong>IX</strong>. Hemartrosis. Factor de reemplazo, <strong>emicizumab</strong> (imita al FVIIIa), terapia génica</td></tr>
<tr><td>Déficit de vitamina K / warfarina</td><td>N</td><td class="up">↑↑</td><td>N o ↑</td><td>Vitamina K, CCP</td></tr>
<tr><td>Hepatopatía</td><td>N o ↓</td><td class="up">↑</td><td>N o ↑</td><td>Factor VIII normal o alto (no es hepático)</td></tr>
<tr><td>CID</td><td class="down">↓</td><td class="up">↑</td><td class="up">↑</td><td>Fibrinógeno ↓, dímero D ↑↑</td></tr>
<tr><td>Bernard‑Soulier / Glanzmann</td><td>↓ gigantes / N</td><td>N</td><td>N</td><td>Adhesión / agregación</td></tr></table></div>
<h3>Trombofilias</h3>
<ul><li><strong>Factor V Leiden</strong> (la hereditaria más frecuente en caucásicos): mutación <strong>Arg506Gln</strong> en el sitio donde la proteína C activada corta al factor V → <strong>resistencia a la proteína C activada</strong>: el Va sigue activo y la protrombinasa no se apaga.</li>
<li>Mutación de protrombina G20210A, déficit de antitrombina, proteína C o S (necrosis cutánea por warfarina en déficit de proteína C).</li>
<li>Adquiridas: <strong>síndrome antifosfolípido</strong> (TTPa prolongado que no corrige, trombosis arteriales y venosas, pérdidas gestacionales), HPN, NMP, cáncer, embarazo, estrógenos, inmovilidad.</li></ul>
`});

function openTopic(id){
  const t=topicById(id)||T[0];curTopic=t.id;store.set("topic",t.id);

  const blk=BLOCKS.find(b=>b.id===t.b);
  $("#note").innerHTML=`<div class="eyebrow">Bloque ${t.b} · ${blk.name}</div><h2>${t.title}</h2>${t.html}

  <button class="btn small primary" data-fc="${t.id}">Flashcards de este tema</button>
  ${next?`<button class="btn small" data-t="${next.id}">${next.title.split(":")[0]} →</button>`:"<span></span>"}</div>`;
  $("#note").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{openTopic(b.dataset.t);window.scrollTo({top:0})});

  </div>`;
  $("#fc-topic").onchange=buildDeck;$("#fc-mode").onchange=buildDeck;
  $("#fc-shuffle").onclick=()=>{deck=shuffle(deck);di=0;drawCard()};
  $("#fc-reset").onclick=()=>{known=new Set();store.set("known",[]);buildDeck()};
  $("#fc").onclick=()=>$("#fc").classList.toggle("flipped");
  $("#fc-prev").onclick=()=>{di=(di-1+deck.length)%deck.length;drawCard()};
  $("#fc-next").onclick=()=>{di=(di+1)%deck.length;drawCard()};
  $("#fc-know").onclick=()=>{if(!deck.length)return;known.add(deck[di]);store.set("known",[...known]);di=(di+1)%deck.length;drawCard()};
  $("#fc-again").onclick=()=>{if(!deck.length)return;known.delete(deck[di]);store.set("known",[...known]);const c=deck.splice(di,1)[0];deck.splice(Math.min(di+3,deck.length),0,c);drawCard()};

function buildDeck(){
  const tp=$("#fc-topic").value,md=$("#fc-mode").value;
  deck=FC.map((f,i)=>i).filter(i=>(tp==="all"||FC[i][0]===tp)&&(md==="all"||!known.has(i)));di=0;drawCard();
}
function drawCard(){
  const fc=$("#fc");fc.classList.remove("flipped");
  const total=FC.filter((f,i)=>$("#fc-topic").value==="all"||f[0]===$("#fc-topic").value);
  const kn=FC.map((f,i)=>i).filter(i=>($("#fc-topic").value==="all"||FC[i][0]===$("#fc-topic").value)&&known.has(i)).length;
  $("#fc-bar").style.width=(total.length?kn/total.length*100:0)+"%";
  if(!deck.length){$("#fc-tag").textContent="";$("#fc-q").innerHTML="¡Dominaste todas las tarjetas de esta selección!";$("#fc-a").innerHTML="Cambia a “Todas” o reinicia el progreso para repasar de nuevo.";$("#fc-count").textContent=`${kn} de ${total.length} dominadas`;return}
  const [t,q,a]=FC[deck[di]];
  $("#fc-tag").textContent=topicById(t).title.split(":")[0]+(known.has(deck[di])?" · dominada":"");$("#fc-q").innerHTML=q;$("#fc-a").innerHTML=a;
  $("#fc-count").textContent=`Tarjeta ${di+1} de ${deck.length} · ${kn} de ${total.length} dominadas`;
}

/* ============ CASOS ============ */
function renderCases(){
  let h=`<div class="block-title"><h2>Casos clínicos</h2><span>Decide paso a paso; cada opción explica por qué es o no correcta</span></div><div class="case-list">`;
  CASES.forEach(c=>h+=`<button class="case-card" data-case="${c.id}"><span class="eyebrow">${topicById(c.topic).title.split(":")[0]}</span><h3>${c.title}</h3><p>${c.teaser}</p><span class="chip">${c.steps.length} decisiones</span></button>`);
  h+=`</div><div id="case-view"></div>`;
  $("#p-casos").innerHTML=h;
  $("#p-casos").querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>openCase(b.dataset.case));
}
function openCase(id){
  const c=CASES.find(x=>x.id===id);let step=0,score=0;
  const v=$("#case-view");
  v.innerHTML=`<div class="case-view"><div><span class="eyebrow">Caso clínico · ${topicById(c.topic).title.split(":")[0]}</span><h2>${c.title}</h2></div><p style="margin:0;max-width:70ch">${c.intro}</p><div class="vitals">${c.labs.map(([k,val,ab])=>`<span class="vital ${ab?"abn":""}">${k} <b>${val}</b></span>`).join("")}</div><div id="steps" style="display:grid;gap:16px"></div></div>`;
  v.scrollIntoView({behavior:"smooth",block:"start"});
  const box=$("#steps",v);
  function addStep(){
    const s=c.steps[step];const div=document.createElement("div");div.className="step";
    div.innerHTML=`<h4>Decisión ${step+1} de ${c.steps.length}: ${s.q}</h4><div class="opts">${shuffle(s.opts.map((o,i)=>[o,i])).map(([o,i])=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")}</div><div class="why" hidden></div>`;
    box.appendChild(div);
    div.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=s.opts[+b.dataset.i];
      div.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(s.opts[+x.dataset.i][1])x.classList.add("right")});
      if(!o[1])b.classList.add("wrong");else score++;
      const w=div.querySelector(".why");w.hidden=false;w.innerHTML=`<b>${o[1]?"Correcto":"No es la mejor opción"}</b>${o[2]}${o[1]?"":`<br><br><b>La respuesta correcta</b>${s.opts.find(x=>x[1])[2]}`}`;
      step++;
      if(step<c.steps.length){const nb=document.createElement("button");nb.className="btn small primary";nb.textContent="Siguiente decisión →";nb.style.justifySelf="start";nb.onclick=()=>{nb.remove();addStep()};div.appendChild(nb)}
      else{const end=document.createElement("div");end.className="callout pearl";end.innerHTML=`<p><strong>${score} de ${c.steps.length} decisiones correctas.</strong></p><p>${c.end}</p>`;box.appendChild(end);
        const r=document.createElement("div");r.className="toolbar";r.innerHTML=`<button class="btn small" id="cv-again">Repetir caso</button><button class="btn small" id="cv-notes">Leer el tema</button>`;box.appendChild(r);
        $("#cv-again").onclick=()=>openCase(id);$("#cv-notes").onclick=()=>{openTopic(c.topic);show("apuntes")}}
    });
  }
  addStep();
}

/* ============ QUIZ ============ */
let qs=[],qi=0,qscore=0,qwrong=[];
function renderQuizStart(){
  let o=`<option value="all">Todo el curso</option>`;BLOCKS.forEach(b=>o+=`<option value="b${b.id}">Bloque ${b.id}: ${b.name}</option>`);
  const best=store.get("best",null);
  $("#p-quiz").innerHTML=`<div class="quiz-box"><span class="eyebrow">Examen de práctica</span><h2 style="font-size:1.8rem">Pon a prueba lo que sabes</h2>
  <p class="muted" style="margin:0">Preguntas de opción múltiple estilo ENARM con explicación inmediata. ${best!==null?`Tu mejor resultado: <strong>${best}%</strong>.`:""}</p>
  <div class="field-row"><label class="f">Contenido<select id="qz-scope">${o}</select></label><label class="f">Número de preguntas<select id="qz-n"><option>10</option><option selected>20</option><option value="999">Todas</option></select></label></div>
  <button class="btn primary" id="qz-go" style="justify-self:start">Comenzar</button></div>`;
  $("#qz-go").onclick=()=>{const sc=$("#qz-scope").value,n=+$("#qz-n").value;
    qs=shuffle(QZ.filter(q=>sc==="all"||topicById(q[0]).b===sc.slice(1))).slice(0,n);qi=0;qscore=0;qwrong=[];drawQ()};
}
function drawQ(){
  if(qi>=qs.length)return quizEnd();
  const [t,q,opts,ans,exp]=qs[qi];
  $("#p-quiz").innerHTML=`<div class="quiz-box"><div class="quiz-head"><span>Pregunta ${qi+1} de ${qs.length} · ${topicById(t).title.split(":")[0]}</span><span>Aciertos: ${qscore}</span></div>
  <div class="fc-progress" style="width:100%"><div style="width:${qi/qs.length*100}%"></div></div>
  <div class="quiz-q">${q}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div class="why" hidden></div></div>`;
  const box=$("#p-quiz .quiz-box");
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===ans)x.classList.add("right")});
    if(i===ans)qscore++;else{b.classList.add("wrong");qwrong.push(qs[qi])}
    const w=box.querySelector(".why");w.hidden=false;w.innerHTML=`<b>${i===ans?"Correcto":"Respuesta: "+String.fromCharCode(65+ans)}</b>${exp}`;
    const nb=document.createElement("button");nb.className="btn primary small";nb.style.justifySelf="start";nb.textContent=qi+1<qs.length?"Siguiente →":"Ver resultado";nb.onclick=()=>{qi++;drawQ()};box.appendChild(nb);nb.focus();
  });
}
function quizEnd(){
  const pct=Math.round(qscore/qs.length*100);const best=store.get("best",0);if(pct>best)store.set("best",pct);
  const weak=[...new Set(qwrong.map(q=>q[0]))];
  $("#p-quiz").innerHTML=`<div class="quiz-box"><div class="score-ring"><span class="eyebrow">Resultado</span><b>${pct}%</b><span class="muted">${qscore} de ${qs.length} correctas</span></div>
  ${weak.length?`<div><p style="margin:.2em 0"><strong>Temas para repasar:</strong></p><div class="toolbar">${weak.map(id=>`<button class="btn small" data-t="${id}">${topicById(id).title.split(":")[0]}</button>`).join("")}</div></div>`:`<div class="callout add"><p>Sin errores. Excelente.</p></div>`}
  ${qwrong.length?`<details><summary style="cursor:pointer;font-weight:700">Revisar mis errores (${qwrong.length})</summary><div style="display:grid;gap:10px;margin-top:10px">${qwrong.map(([t,q,o,a,e])=>`<div class="why"><b>${q}</b>${o[a]}. ${e}</div>`).join("")}</div></details>`:""}
  <div class="toolbar"><button class="btn primary" id="qz-retry">Otro examen</button></div></div>`;
  $("#qz-retry").onclick=renderQuizStart;
  $("#p-quiz").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{openTopic(b.dataset.t);show("apuntes")});
}

/* ============ ATLAS ============ */
let aq=null;
function renderAtlas(){
  let h=`<div class="block-title"><h2>Atlas del frotis</h2><span>Ilustraciones esquemáticas con tinción de Wright</span></div>
  <div class="atlas-quiz" id="aq"></div><div class="atlas-grid">`;
  CELLS.forEach(c=>h+=`<div class="cell-card"><div class="scope">${c.svg}</div><div class="info"><span class="tag">${c.tag}</span><h3>${c.name}</h3><p>${c.where}</p></div></div>`);
  h+=`</div>`;$("#p-atlas").innerHTML=h;atlasQ();
}
function atlasQ(){
  const pool=CELLS.filter(c=>c.id!=="normal");aq=pool[Math.floor(Math.random()*pool.length)];
  const opts=shuffle([aq,...shuffle(pool.filter(c=>c!==aq)).slice(0,3)]);
  $("#aq").innerHTML=`<div class="scope">${aq.svg}</div><div style="display:grid;gap:10px;min-width:0"><span class="eyebrow">¿Qué ves al microscopio?</span><h3 style="font-size:1.3rem">Identifica la célula</h3><div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${o.name}</button>`).join("")}</div><div class="why" hidden></div></div>`;
  $("#aq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    $("#aq").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.id===aq.id)x.classList.add("right")});
    if(b.dataset.id!==aq.id)b.classList.add("wrong");
    const w=$("#aq .why");w.hidden=false;w.innerHTML=`<b>${aq.name} · ${aq.tag}</b>${aq.where}`;
    const nb=document.createElement("button");nb.className="btn small primary";nb.style.justifySelf="start";nb.textContent="Otra célula →";nb.onclick=atlasQ;w.after(nb);
  });
}

/* ============ CALCULADORAS ============ */
function renderTools(){
  $("#p-tools").innerHTML=`<div class="block-title"><h2>Calculadoras</h2><span>Con valores de ejemplo precargados; cámbialos con los de tu caso</span></div>
  <div class="tools">
  <div class="tool"><h3>Clasificador de anemia</h3><p class="sub">Une los tres apellidos y te da los diferenciales.</p>
   <div class="field-row"><label class="f">Sexo<select id="an-sex"><option value="f">Mujer</option><option value="m">Hombre</option></select></label><label class="f">Hb (g/dL)<input id="an-hb" type="number" step="0.1" value="9.1"></label><label class="f">VCM (fL)<input id="an-vcm" type="number" value="71"></label><label class="f">HCM (pg)<input id="an-hcm" type="number" value="22"></label><label class="f">Reticulocitos (%)<input id="an-ret" type="number" step="0.1" value="1.2"></label><label class="f">Hto (%)<input id="an-hto" type="number" value="29"></label></div>
   <div class="result" id="an-out"></div></div>
  <div class="tool"><h3>Reticulocitos corregidos e IPR</h3><p class="sub">Corregido = % × Hto/45. IPR = corregido / factor de maduración.</p>
   <div class="field-row"><label class="f">Reticulocitos (%)<input id="rt-r" type="number" step="0.1" value="4"></label><label class="f">Hto (%)<input id="rt-h" type="number" value="21"></label></div>
   <div class="result" id="rt-out"></div></div>
  <div class="tool"><h3>Neutrófilos absolutos</h3><p class="sub">Leucocitos × (% neutrófilos + % bandas).</p>
   <div class="field-row"><label class="f">Leucocitos/µL<input id="nt-l" type="number" value="1800"></label><label class="f">Neutrófilos %<input id="nt-n" type="number" value="22"></label><label class="f">Bandas %<input id="nt-b" type="number" value="3"></label></div>
   <div class="result" id="nt-out"></div></div>
  <div class="tool"><h3>Déficit de hierro (Ganzoni)</h3><p class="sub">Peso × (Hb meta − Hb actual) × 2.4 + reservas.</p>
   <div class="field-row"><label class="f">Peso (kg)<input id="gz-w" type="number" value="62"></label><label class="f">Hb actual<input id="gz-hb" type="number" step="0.1" value="8.5"></label><label class="f">Hb meta<input id="gz-t" type="number" step="0.1" value="13"></label><label class="f">Reservas (mg)<input id="gz-s" type="number" value="500"></label></div>
   <div class="result" id="gz-out"></div></div>
  <div class="tool"><h3>IPI (linfoma no Hodgkin)</h3><p class="sub">Un punto por factor.</p>
   <div class="checks">${["Edad > 60 años","ECOG ≥ 2","DHL elevada","Más de 1 sitio extranodal","Estadio Ann Arbor III‑IV"].map((x,i)=>`<label><input type="checkbox" id="ipi-${i}" ${i===2||i===4?"checked":""}> ${x}</label>`).join("")}</div>
   <div class="result" id="ipi-out"></div></div>
  <div class="tool"><h3>Índice de Mentzer</h3><p class="sub">VCM / eritrocitos (millones/µL) en anemia microcítica.</p>
   <div class="field-row"><label class="f">VCM (fL)<input id="mz-v" type="number" value="64"></label><label class="f">Eritrocitos (×10⁶)<input id="mz-e" type="number" step="0.1" value="5.8"></label></div>
   <div class="result" id="mz-out"></div></div>
  </div>`;
  const val=id=>parseFloat($("#"+id).value);
  function anemia(){
    const sex=$("#an-sex").value,hb=val("an-hb"),vcm=val("an-vcm"),hcm=val("an-hcm"),ret=val("an-ret"),hto=val("an-hto");
    const lim=sex==="f"?12:13.5;const out=$("#an-out");
    if([hb,vcm,ret,hto].some(isNaN)){out.className="result warn";out.textContent="Completa Hb, VCM, reticulocitos y Hto.";return}
    if(hb>=lim){out.className="result good";out.innerHTML=`<b class="big">Sin anemia</b>Hb ≥ ${lim} g/dL para ${sex==="f"?"mujer":"hombre"} (ajusta por altitud y embarazo).`;return}
    const size=vcm<80?"microcítica":vcm>100?"macrocítica":"normocítica",color=!isNaN(hcm)&&hcm<27?"hipocrómica":"normocrómica";
    const corr=ret*hto/45,mf=hto>=40?1:hto>=30?1.5:hto>=20?2:2.5,ipr=corr/mf,regen=ipr>=2?"regenerativa":"arregenerativa";
    const grade=hb>=10?"leve":hb>=8?"moderada":hb>=6.5?"grave":"muy grave (OMS: < 6.5)";
    let dd="";
    if(size==="microcítica")dd="Ferropenia (ferritina baja, ADE alto) · talasemia (Mentzer < 13, ADE normal, electroforesis) · enfermedad crónica (ferritina alta, transferrina baja) · sideroblástica · plomo.";
    else if(size==="macrocítica")dd=regen==="regenerativa"?"Reticulocitosis por hemólisis o sangrado agudo (los reticulocitos son grandes).":"Megaloblástica: B12 / folato (neutrófilos hipersegmentados, DHL alta) · no megaloblástica: alcohol, hepatopatía, hipotiroidismo, SMD, fármacos.";
    else dd=regen==="regenerativa"?"Hemólisis (bilirrubina indirecta, DHL, haptoglobina, Coombs, frotis) o hemorragia aguda.":"Enfermedad crónica/inflamación, ERC (EPO baja), aplasia, infiltración medular (leucemia, mieloma, metástasis), déficit mixto, endocrinopatías.";
    out.className="result";out.innerHTML=`<b class="big">Anemia ${size} ${color} ${regen}</b>Grado ${grade} · retic. corregidos ${corr.toFixed(2)}% · IPR ${ipr.toFixed(2)}<br><br><strong>Piensa en:</strong> ${dd}`;
  }
  function retic(){const r=val("rt-r"),h=val("rt-h"),o=$("#rt-out");if(isNaN(r)||isNaN(h)){o.textContent="Completa ambos valores.";return}
    const c=r*h/45,mf=h>=40?1:h>=30?1.5:h>=20?2:2.5,ipr=c/mf;o.className="result "+(ipr>=2?"good":"warn");
    o.innerHTML=`<b class="big">${c.toFixed(2)}%</b>Factor de maduración ${mf} → <strong>IPR ${ipr.toFixed(2)}</strong>: ${ipr>=2?"respuesta medular adecuada (hemólisis o sangrado)":"respuesta inadecuada (problema de producción)"}.`}
  function neut(){const l=val("nt-l"),n=val("nt-n"),b=val("nt-b")||0,o=$("#nt-out");if(isNaN(l)||isNaN(n)){o.textContent="Completa los valores.";return}
    const a=Math.round(l*(n+b)/100);let g,cls;if(a>=1500){g="Sin neutropenia";cls="good"}else if(a>=1000){g="Neutropenia leve";cls="warn"}else if(a>=500){g="Neutropenia moderada";cls="warn"}else{g="Neutropenia grave";cls="bad"}
    o.className="result "+cls;o.innerHTML=`<b class="big">${a.toLocaleString("es-MX")}/µL</b>${g}.${a<500?" Si hay fiebre: hemocultivos y β‑lactámico antipseudomonas IV en la primera hora.":""}`}
  function ganz(){const w=val("gz-w"),hb=val("gz-hb"),t=val("gz-t"),s=val("gz-s")||0,o=$("#gz-out");if([w,hb,t].some(isNaN)){o.textContent="Completa los valores.";return}
    const d=Math.max(0,Math.round(w*(t-hb)*2.4+s));o.className="result";o.innerHTML=`<b class="big">${d.toLocaleString("es-MX")} mg</b>Equivale a ~${Math.ceil(d/1000)} dosis de carboximaltosa férrica de 1,000 mg (máx. 20 mg/kg por dosis) o ~${Math.ceil(d/200)} dosis de hierro sacarosa de 200 mg.`}
  function ipi(){let s=0;for(let i=0;i<5;i++)if($("#ipi-"+i).checked)s++;const r=s<=1?["Bajo","good"]:s===2?["Intermedio‑bajo","warn"]:s===3?["Intermedio‑alto","warn"]:["Alto","bad"];
    const o=$("#ipi-out");o.className="result "+r[1];o.innerHTML=`<b class="big">${s} punto${s===1?"":"s"}</b>Riesgo ${r[0].toLowerCase()}.`}
  function mentz(){const v=val("mz-v"),e=val("mz-e"),o=$("#mz-out");if(isNaN(v)||isNaN(e)||!e){o.textContent="Completa los valores.";return}
    const m=v/e;o.className="result";o.innerHTML=`<b class="big">${m.toFixed(1)}</b>${m<13?"Sugiere <strong>talasemia</strong>: pide electroforesis de Hb.":"Sugiere <strong>ferropenia</strong>: pide ferritina."} Es orientativo; confirma con laboratorio.`}
  ["an-sex","an-hb","an-vcm","an-hcm","an-ret","an-hto"].forEach(i=>$("#"+i).addEventListener("input",anemia));
  ["rt-r","rt-h"].forEach(i=>$("#"+i).addEventListener("input",retic));
  ["nt-l","nt-n","nt-b"].forEach(i=>$("#"+i).addEventListener("input",neut));
  ["gz-w","gz-hb","gz-t","gz-s"].forEach(i=>$("#"+i).addEventListener("input",ganz));
  for(let i=0;i<5;i++)$("#ipi-"+i).addEventListener("change",ipi);
  ["mz-v","mz-e"].forEach(i=>$("#"+i).addEventListener("input",mentz));
  anemia();retic();neut();ganz();ipi();mentz();
}
