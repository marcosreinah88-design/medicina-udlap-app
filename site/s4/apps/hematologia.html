<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hematología: atlas de estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../fonts/g0ecd9eb689.css">
<style>
/* Layout: portaobjetos teñido con Wright. Barra de pestañas fija arriba, una columna de lectura, rejillas para tarjetas. */
:root{
  --bg:#f7f5fa;          /* vidrio del portaobjetos */
  --surface:#ffffff;
  --surface-2:#efeaf5;
  --ink:#231a2e;
  --ink-2:#5d5368;
  --line:#ddd4e6;
  --violet:#5a3a8c;      /* hematoxilina / azul de metileno */
  --violet-soft:#e9e1f5;
  --eosin:#b8325a;       /* eosina */
  --eosin-soft:#fbe4ec;
  --ok:#2e7d4f; --ok-soft:#e1f3e8;
  --warn:#9a6a00; --warn-soft:#fff2cf;
  --bad:#b3261e; --bad-soft:#fde3e1;
  --field:#f6e9ee;       /* fondo del campo microscópico */
  --rbc:#e58f9e; --rbc-pale:#f6c9d1; --nuc:#5b3f91; --nuc-dark:#3d2768; --cyto:#f3d9e3; --gran:#c25078;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121d; --surface:#211a29; --surface-2:#2b2235; --ink:#f0eaf6; --ink-2:#b9adc6; --line:#3b3047;
  --violet:#b79ce8; --violet-soft:#33274a; --eosin:#f07fa0; --eosin-soft:#3f2030;
  --ok:#7fd3a0; --ok-soft:#1d3528; --warn:#f0c560; --warn-soft:#3a2f12; --bad:#ff9a90; --bad-soft:#41201e;
  --field:#2c2230; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17121d; --surface:#211a29; --surface-2:#2b2235; --ink:#f0eaf6; --ink-2:#b9adc6; --line:#3b3047;
  --violet:#b79ce8; --violet-soft:#33274a; --eosin:#f07fa0; --eosin-soft:#3f2030;
  --ok:#7fd3a0; --ok-soft:#1d3528; --warn:#f0c560; --warn-soft:#3a2f12; --bad:#ff9a90; --bad-soft:#41201e;
  --field:#2c2230; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.15rem;white-space:nowrap}
.brand svg{flex:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:999px;white-space:nowrap;color:var(--ink-2);font-weight:700;font-size:.92rem}
nav.tabs button[aria-selected="true"]{background:var(--violet);color:var(--surface)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--surface-2);color:var(--ink)}

main{padding-block:28px 80px}
[hidden]{display:none!important}
section.panel{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.fc-stage > *{max-width:100%}

/* Hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem)}
.hero h1 em{font-style:normal;color:var(--eosin)}
.hero p{color:var(--ink-2);max-width:56ch;margin:.8em 0 0}
.hero-field{aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%, var(--field) 0 64%, color-mix(in srgb,var(--field) 60%, var(--ink)) 70%, var(--bg) 71%);overflow:hidden;position:relative}
.hero-field svg{width:100%;height:100%;display:block}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:400;color:var(--violet)}
.stat span{font-size:.82rem;color:var(--ink-2)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700}
.btn.primary{background:var(--eosin);border-color:var(--eosin);color:var(--surface)}
.btn:hover{border-color:var(--violet)}
.btn.small{padding:6px 12px;font-size:.88rem}

.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--eosin);font-weight:700}
.block-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:12px}
.block-title h2{font-size:1.6rem}
.block-title span{color:var(--ink-2);font-size:.92rem}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.topic-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;transition:transform .15s, border-color .15s}
.topic-card:hover{transform:translateY(-2px);border-color:var(--violet)}
.topic-card h3{font-size:1.05rem}
.topic-card p{margin:0;color:var(--ink-2);font-size:.88rem}
.topic-card .meta{display:flex;gap:8px;font-size:.75rem;color:var(--ink-2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface-2);font-size:.75rem;font-weight:700;color:var(--ink-2)}
.chip.fix{background:var(--warn-soft);color:var(--warn)}
.case-card .chip,.topic-card .chip{justify-self:start}

/* Apuntes */
.notes-layout{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 74px);max-height:calc(100vh - 100px);overflow:auto;display:grid;gap:2px;padding-right:4px}
.toc h4{font-family:var(--f-body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--eosin);margin:14px 0 4px;font-weight:700}
.toc button{text-align:left;background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--ink-2);font-size:.92rem}
.toc button[aria-current="true"]{background:var(--violet-soft);color:var(--ink);font-weight:700}
.toc-select{display:none;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;color:var(--ink)}
article.note{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px clamp(18px,4vw,40px)}
article.note > h2{font-size:clamp(1.6rem,3.5vw,2.2rem);margin:6px 0 4px}
article.note .lead{color:var(--ink-2);margin:0 0 18px;max-width:65ch}
article.note h3{font-size:1.25rem;margin:26px 0 8px;color:var(--violet)}
article.note p, article.note li{max-width:70ch}
article.note ul{padding-left:1.2em;margin:.4em 0}
article.note li{margin:.25em 0}
article.note strong{color:var(--ink)}
.callout{border-radius:12px;padding:12px 16px;margin:14px 0;border:1px solid var(--line);background:var(--surface-2)}
.callout.pearl{background:var(--violet-soft);border-color:transparent}
.callout.pearl::before{content:"Perla de examen";display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--violet);margin-bottom:4px}
.callout.fix{background:var(--warn-soft);border-color:transparent}
.callout.fix::before{content:"Corrección a tus notas";display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--warn);margin-bottom:4px}
.callout.add{background:var(--ok-soft);border-color:transparent}
.callout.add::before{content:"Complemento";display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ok);margin-bottom:4px}
.callout p{margin:.3em 0}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:420px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.mono, .tbl .mono{white-space:nowrap}
.up{color:var(--eosin);font-weight:700}.down{color:var(--violet);font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:.9rem}
.flow i{font-style:normal;color:var(--ink-2)}
.diagram{overflow-x:auto;margin:14px 0;background:var(--surface-2);border-radius:14px;padding:12px}
.diagram svg{display:block;min-width:620px;width:100%;height:auto}
.diagram svg text{fill:var(--ink);font-family:var(--f-body)}
.d-node{fill:var(--surface);stroke:var(--line)}
.d-node.v{fill:var(--violet-soft);stroke:var(--violet)}
.d-node.e{fill:var(--eosin-soft);stroke:var(--eosin)}
.d-line{stroke:var(--ink-2);stroke-width:1.5;fill:none}
.note-nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.mini-cells{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.mini-cells figure{margin:0;background:var(--field);border-radius:12px;padding:6px;width:110px;text-align:center}
.mini-cells figcaption{font-size:.75rem;color:var(--ink-2)}

/* Flashcards */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select{padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;color:var(--ink);max-width:100%}
.fc-stage{display:grid;place-items:center;gap:18px}
.fc{width:min(640px,100%);aspect-ratio:16/10;perspective:1400px;background:none;border:0;padding:0}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:26px clamp(18px,4vw,36px);display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);text-align:left;overflow:auto}
.fc-front{background:var(--surface)}
.fc-back{background:var(--violet-soft);transform:rotateY(180deg)}
.fc-face .eyebrow{position:absolute;top:16px;left:clamp(18px,4vw,36px)}
.fc-face .hint{position:absolute;bottom:14px;right:18px;font-size:.78rem;color:var(--ink-2)}
.fc-q{font-family:var(--f-display);font-size:clamp(1.2rem,3vw,1.7rem);line-height:1.3}
.fc-a{font-size:clamp(1rem,2.4vw,1.15rem)}
.fc-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fc-progress{width:min(640px,100%);height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.fc-progress div{height:100%;background:var(--eosin);transition:width .3s}
.fc-count{color:var(--ink-2);font-size:.9rem}
.btn.know{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.again{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

/* Casos */
.case-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.case-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.case-card:hover{border-color:var(--eosin)}
.case-card h3{font-size:1.1rem}
.case-card p{margin:0;color:var(--ink-2);font-size:.9rem}
.case-view{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px clamp(18px,4vw,36px);display:grid;gap:16px}
.case-view h2{font-size:1.7rem}
.vitals{display:flex;gap:8px;flex-wrap:wrap}
.vital{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.85rem}
.vital b{font-family:var(--f-mono);font-weight:600}
.vital.abn{background:var(--eosin-soft)}
.step{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.step h4{font-family:var(--f-body);font-weight:700;font-size:1rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);padding:10px 14px;border-radius:12px}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{border-radius:12px;padding:10px 14px;background:var(--surface-2);font-size:.95rem}
.why b{display:block;margin-bottom:2px}

/* Quiz */
.quiz-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px clamp(18px,4vw,36px);display:grid;gap:14px;max-width:760px;width:100%;margin:0 auto}
.quiz-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:.9rem}
.quiz-q{font-family:var(--f-display);font-size:1.35rem;line-height:1.35}
.score-ring{display:grid;place-items:center;gap:6px;text-align:center}
.score-ring b{font-family:var(--f-display);font-size:3rem;font-weight:400;color:var(--eosin)}

/* Atlas */
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.cell-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.cell-card .scope{background:radial-gradient(circle, var(--field) 62%, color-mix(in srgb,var(--field) 70%, var(--ink)) 100%);aspect-ratio:1/0.8;display:grid;place-items:center}
.cell-card .scope svg{width:78%;height:auto;max-height:100%}
.cell-card .info{padding:12px 14px;display:grid;gap:4px}
.cell-card h3{font-size:1.05rem}
.cell-card p{margin:0;font-size:.86rem;color:var(--ink-2)}
.cell-card .tag{font-size:.78rem;color:var(--eosin);font-weight:700}
.atlas-quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center}
.atlas-quiz .scope{background:radial-gradient(circle, var(--field) 62%, color-mix(in srgb,var(--field) 70%, var(--ink)) 100%);border-radius:50%;aspect-ratio:1;display:grid;place-items:center;max-width:240px;width:100%}
.atlas-quiz .scope svg{width:72%}

/* Herramientas */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start}
.tool h3{font-size:1.2rem}
.tool p.sub{margin:0;color:var(--ink-2);font-size:.88rem}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--ink-2);font-weight:700}
label.f input, label.f select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:var(--ink);width:100%;font-family:var(--f-mono)}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.result{border-radius:12px;background:var(--violet-soft);padding:12px 14px}
.result b.big{font-family:var(--f-display);font-weight:400;font-size:1.8rem;color:var(--violet);display:block}
.result.warn{background:var(--warn-soft)} .result.bad{background:var(--bad-soft)} .result.good{background:var(--ok-soft)}

.fix-list{display:grid;gap:10px}
.fix-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fix-item .was{color:var(--ink-2)} .fix-item .was::before{content:"En tus notas";display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);font-weight:700}
.fix-item .is::before{content:"Correcto";display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);font-weight:700}
.fix-item .where{grid-column:1/-1;font-size:.78rem;color:var(--eosin);font-weight:700}
.muted{color:var(--ink-2)}
footer{color:var(--ink-2);font-size:.82rem;padding-block:20px 40px;border-top:1px solid var(--line)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero-field{max-width:320px;margin:0 auto;width:100%}
  .notes-layout{grid-template-columns:1fr}
  .toc{display:none}
  .toc-select{display:block}
  .atlas-quiz{grid-template-columns:1fr;justify-items:center}
  .fix-item{grid-template-columns:1fr}
  .fc{aspect-ratio:auto;min-height:340px}
  .fc-inner{min-height:340px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="var(--rbc)"/><circle cx="20" cy="20" r="8" fill="var(--rbc-pale)"/></svg>
      Hematología
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="inicio" aria-selected="true">Inicio</button>

      <button role="tab" data-tab="casos">Casos clínicos</button>
      <button role="tab" data-tab="quiz">Examen</button>
      <button role="tab" data-tab="atlas">Atlas del frotis</button>
      <button role="tab" data-tab="tools">Calculadoras</button>
      <button role="tab" data-tab="fixes">Correcciones</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <section class="panel" id="p-inicio"></section>
  <section class="panel" id="p-apuntes" hidden></section>
  <section class="panel" id="p-flash" hidden></section>
  <section class="panel" id="p-casos" hidden></section>
  <section class="panel" id="p-quiz" hidden></section>
  <section class="panel" id="p-atlas" hidden></section>
  <section class="panel" id="p-tools" hidden></section>

</main>
<footer class="wrap">Basado en tus apuntes de Notion (4to semestre), revisados y complementados con OMS 2022/ICC, IMWG, NCCN y textos estándar (Williams, Harrison). Los valores de referencia cambian entre laboratorios: usa los de tu profesor en el examen.</footer>

<script>
/* ============ CÉLULAS EN SVG (atlas) ============ */
const C = {
rbc:(x=60,y=60,r=26)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--rbc)"/><circle cx="${x}" cy="${y}" r="${r*0.42}" fill="var(--rbc-pale)" opacity=".9"/>`,
};
const CELLS = [
 {id:"normal",name:"Eritrocito normal",tag:"Referencia",where:"Disco bicóncavo de ~7.5 µm, palidez central ≈ 1/3 del diámetro.",svg:`<svg viewBox="0 0 120 120">${C.rbc(60,60,34)}</svg>`},

topic({id:"hemato",b:"I",title:"Hematopoyesis y célula madre",short:"Sitios, hemoglobinas, CD34, nicho y señales",html:`
<p class="lead">Proceso fisiológico y regulado que produce eritrocitos, leucocitos y plaquetas (~10<sup>11</sup> células al día) a partir de una célula madre hematopoyética (CMH).</p>
<h3>Sitios a lo largo del desarrollo</h3>
<div class="flow"><span>Saco vitelino <small class="muted">(sem 3)</small></span><i>→</i><span>Región AGM <small class="muted">(aorta‑gónada‑mesonefros)</small></span><i>→</i><span>Hígado fetal <small class="muted">(principal, 2.º trimestre)</small> + bazo</span><i>→</i><span>Médula ósea <small class="muted">(desde ~7.º mes)</small></span></div>
<ul>
<li>En el saco vitelino ocurren juntas la <strong>eritropoyesis primitiva</strong> (eritroblastos nucleados) y la <strong>angiogénesis</strong> (hemangioblasto común).</li>
<li>Niño pequeño: médula roja en casi todos los huesos, incluidos los largos. Adulto: <strong>esqueleto axial</strong> (esternón, vértebras, costillas, pelvis/cresta ilíaca, cráneo) y extremos proximales de fémur y húmero.</li>
<li>Si la médula falla o se fibrosa, hígado y bazo retoman la función: <strong>hematopoyesis extramedular (metaplasia mieloide)</strong> → hepatoesplenomegalia, típica de la mielofibrosis.</li>
</ul>
<div class="callout fix"><p>Tus notas dicen que tras el saco vitelino “migra al mesonefros”. El sitio correcto es la región <strong>AGM</strong> (aorta‑gónada‑mesonefros), de donde salen las CMH definitivas que colonizan el hígado. La hemólisis fisiológica ocurre sobre todo en el <strong>bazo</strong>, no en el hígado.</p></div>
<h3>Hemoglobinas según la edad</h3>
<div class="tbl"><table><tr><th>Hb</th><th>Cadenas</th><th>Cuándo</th></tr>
<tr><td>Gower 1</td><td class="mono">ζ2ε2</td><td>Embrionaria</td></tr>
<tr><td>Gower 2</td><td class="mono">α2ε2</td><td>Embrionaria</td></tr>
<tr><td>Portland</td><td class="mono">ζ2γ2</td><td>Embrionaria</td></tr>
<tr><td>Fetal (HbF)</td><td class="mono">α2γ2</td><td>Predomina en el feto y al nacer (~70‑80%); alta afinidad por O₂ (poca unión a 2,3‑BPG)</td></tr>
<tr><td>A (HbA)</td><td class="mono">α2β2</td><td>Adulto ~95‑97%. El cambio γ→β empieza alrededor del nacimiento y se completa a los 6‑12 meses</td></tr>
<tr><td>A2</td><td class="mono">α2δ2</td><td>Adulto 2‑3.5% (sube en β‑talasemia menor)</td></tr></table></div>
<h3>Célula madre hematopoyética</h3>
<ul>
<li>Muy escasa (~1 de cada 10,000 células nucleadas de médula en la mayoría de los textos; tu profesor dio 1/1000). Morfológicamente parece un linfocito pequeño.</li>
<li>Propiedades: <strong>autorrenovación</strong>, <strong>diferenciación multilinaje</strong>, quiescencia (G0) y, en teoría, plasticidad.</li>
<li>Marcador: <strong>CD34</strong> (sialomucina). Se cuantifica para trasplante (meta ≥ 2 × 10⁶ CD34+/kg).</li>
<li>Anclaje al nicho: <strong>CXCR4</strong> (CMH) ↔ <strong>SDF‑1/CXCL12</strong> (estroma). Movilización: <strong>filgrastim (G‑CSF)</strong> y <strong>plerixafor</strong> (antagonista de CXCR4).</li>
<li>Hematopoyesis normal = <strong>policlonal</strong>. Un clon único que se expande = <strong>monoclonal</strong>, base de leucemias y otras neoplasias.</li>
</ul>
<h3>Microambiente (nicho) y señales</h3>
<ul>
<li>Estroma: fibroblastos/células reticulares, adipocitos, macrófagos, osteoblastos, células endoteliales de los sinusoides y linfocitos T.</li>
<li><strong>IL‑3</strong> (de linfocitos T) y <strong>SCF/kit‑ligando</strong>: actúan sobre progenitores tempranos de todas las líneas.</li>
<li>p53 (“guardián del genoma”) detiene el ciclo o induce apoptosis ante daño del ADN.</li>
</ul>
<div class="tbl"><table><tr><th>Línea</th><th>Factor principal</th></tr>
<tr><td>Todas (temprano)</td><td>IL‑3, SCF, GM‑CSF</td></tr>
<tr><td>Eritroide</td><td><strong>Eritropoyetina (EPO)</strong></td></tr>
<tr><td>Neutrófilos</td><td><strong>G‑CSF</strong>, GM‑CSF</td></tr>
<tr><td>Eosinófilos</td><td><strong>IL‑5</strong></td></tr>
<tr><td>Monocitos</td><td><strong>M‑CSF</strong>, GM‑CSF</td></tr>
<tr><td>Megacariocitos</td><td><strong>Trombopoyetina (TPO)</strong>, IL‑11</td></tr>
<tr><td>Linfocitos</td><td>IL‑7 (B y T), IL‑2, IL‑15 (NK)</td></tr></table></div>
<div class="callout fix"><p>En tus notas: “IL‑8 para granulocitos, IL‑9 para glóbulos rojos, IL‑1 para macrófagos”. La IL‑8 es <strong>quimiotáctica</strong> para neutrófilos, no su factor de producción (ese es el G‑CSF). Los eritrocitos dependen de la <strong>EPO</strong> (la IL‑9 tiene un papel menor). Los monocitos, del <strong>M‑CSF</strong>. “Enterocina 5” debe ser <strong>IL‑5</strong> (eosinófilos).</p></div>
<h3>Compatibilidad HLA</h3>
<p>El HLA (MHC humano) está en el <strong>brazo corto del cromosoma 6</strong>. Se hereda en bloque (haplotipo): un hermano tiene 25% de probabilidad de ser idéntico y padres e hijos son siempre haploidénticos (50%).</p>
<div class="callout pearl"><p>Médula sustituida por <strong>grasa</strong> = anemia <strong>aplásica</strong> (en tus notas aparecía “plástica”). Sustituida por <strong>fibrosis</strong> = mielofibrosis. Por <strong>blastos</strong> = leucemia aguda (falla medular + infiltración).</p></div>
<div class="diagram" aria-label="Árbol de la hematopoyesis">${treeSVG()}</div>
`});

topic({id:"mieloide",b:"I",title:"Linaje mieloide: granulocitos, eritroide, monocitos y megacariocitos",short:"Maduración, función del neutrófilo y metabolismo del eritrocito",html:`
<p class="lead">De la UFC‑GEMM (granulocito, eritrocito, monocito, megacariocito) salen todas las células mieloides.</p>
<h3>Granulopoyesis</h3>
<div class="flow"><span>Mieloblasto</span><i>→</i><span>Promielocito</span><i>→</i><span>Mielocito</span><i>→</i><span>Metamielocito</span><i>→</i><span>Banda</span><i>→</i><span>Segmentado</span></div>
<ul>
<li><strong>Gránulos primarios (azurófilos)</strong> aparecen en el promielocito: mieloperoxidasa (MPO), elastasa, defensinas. <strong>Secundarios (específicos)</strong> en el mielocito: lactoferrina, lisozima. <strong>Terciarios</strong>: gelatinasa (metaloproteinasas).</li>
<li>Se dividen hasta el <strong>mielocito</strong>; después solo maduran (compartimento de reserva medular).</li>
<li><strong>Reacción leucoeritroblástica</strong>: precursores mieloides y eritroblastos en sangre periférica. Indica infiltración medular (metástasis, mielofibrosis) o estrés grave (sepsis).</li>
</ul>
<h3>Neutrófilo en acción</h3>
<div class="flow"><span>Rodamiento <small class="muted">(selectinas)</small></span><i>→</i><span>Adhesión firme <small class="muted">(integrinas β2 ↔ ICAM‑1)</small></span><i>→</i><span>Diapédesis</span><i>→</i><span>Quimiotaxis <small class="muted">(IL‑8, C5a, LTB4)</small></span><i>→</i><span>Fagocitosis, estallido respiratorio, NETs</span></div>
<ul>
<li>La MPO convierte H₂O₂ + Cl⁻ en <strong>ácido hipocloroso (HOCl)</strong>, potente bactericida. La NADPH oxidasa genera el superóxido inicial (su defecto = enfermedad granulomatosa crónica).</li>
<li>Neutropenia prolongada es letal por infecciones bacterianas y fúngicas.</li>
</ul>
<div class="callout fix"><p>La MPO genera <strong>ácido hipocloroso</strong> (un hipohalito), no “haluro”.</p></div>
<h3>Eosinófilos, basófilos y mastocitos</h3>
<ul>
<li><strong>Eosinófilo</strong> (IL‑5): helmintos y alergia. Proteína básica mayor, proteína catiónica, neurotoxina derivada del eosinófilo. Eosinofilia sostenida → <strong>fibrosis endomiocárdica (endocarditis de Löffler)</strong> y daño neurológico.</li>
<li><strong>Basófilo</strong>: histamina, hipersensibilidad tipo I. La <strong>basofilia</strong> es una pista de <strong>LMC</strong>.</li>
</ul>
<h3>Eritropoyesis</h3>
<div class="flow"><span>BFU‑E</span><i>→</i><span>CFU‑E <small class="muted">(máx. receptores de EPO)</small></span><i>→</i><span>Proeritroblasto</span><i>→</i><span>Eritroblasto basófilo</span><i>→</i><span>Policromatófilo</span><i>→</i><span>Ortocromático <small class="muted">(expulsa núcleo)</small></span><i>→</i><span>Reticulocito <small class="muted">(1‑2 días en sangre)</small></span><i>→</i><span>Eritrocito</span></div>
<ul>
<li>La <strong>EPO</strong> se produce en las <strong>células intersticiales peritubulares (tipo fibroblasto) de la corteza renal</strong> en respuesta a hipoxia vía HIF; ~10% en hígado.</li>
<li>Eritrocito: ~7.5 µm, bicóncavo, vive ~120 días, debe deformarse para pasar capilares de ~3‑4 µm y los cordones esplénicos.</li>
<li>El eritrocito senescente se retira en el bazo (hemólisis <strong>extravascular</strong> fisiológica) y el hierro se recicla por los macrófagos.</li>
</ul>
<div class="callout fix"><p>La EPO <strong>no</strong> la producen las células yuxtaglomerulares (esas producen renina). Viene de las <strong>células intersticiales peritubulares</strong>.</p></div>
<h3>Metabolismo del eritrocito</h3>
<div class="tbl"><table><tr><th>Vía</th><th>Produce</th><th>Si falla</th></tr>
<tr><td>Glucólisis anaerobia (Embden‑Meyerhof), ~90%</td><td>ATP (bombas Na⁺/K⁺, forma)</td><td>Déficit de <strong>piruvato cinasa</strong>: hemólisis extravascular</td></tr>
<tr><td>Hexosa monofosfato (pentosas), ~10%</td><td><strong>NADPH</strong> → regenera glutatión reducido</td><td>Déficit de <strong>G6PD</strong>: hemólisis oxidativa</td></tr>
<tr><td>Shunt de Rapoport‑Luebering</td><td>2,3‑BPG</td><td>↑2,3‑BPG desplaza la curva a la derecha (libera O₂)</td></tr></table></div>
<div class="callout fix"><p>El eritrocito <strong>sí</strong> tiene catalasa, superóxido dismutasa y glutatión peroxidasa. Lo que no puede es fabricar más enzimas, y depende del <strong>NADPH</strong> de la vía de las pentosas para mantener el glutatión reducido. Por eso el déficit de G6PD lo deja indefenso.</p></div>
<h3>Monocito‑macrófago</h3>
<div class="flow"><span>Monoblasto</span><i>→</i><span>Promonocito</span><i>→</i><span>Monocito <small class="muted">(2‑10% de leucocitos, núcleo arriñonado)</small></span><i>→</i><span>Macrófago tisular</span></div>
<ul><li>Macrófagos fijos: Kupffer (hígado), alveolares, microglía, osteoclastos, células de Langerhans (piel, en realidad dendríticas). Presentan antígeno en HLA‑II.</li>
<li><strong>Monocitosis tras quimioterapia o trasplante</strong> anuncia recuperación medular: los neutrófilos vienen en camino.</li></ul>
<h3>Megacariocitos y plaquetas</h3>
<div class="callout add"><p>Tu página de Megacariocitos estaba vacía. Lo esencial:</p>
<ul><li>Megacarioblasto → promegacariocito → megacariocito. Hace <strong>endomitosis</strong> (replica ADN sin dividirse, hasta 64N): célula gigante y poliploide.</li>
<li>Estímulo: <strong>trombopoyetina</strong> (hígado), que actúa por el receptor <strong>MPL</strong>. Agonistas: eltrombopag, romiplostim.</li>
<li>Cada megacariocito emite proplaquetas hacia el sinusoide y libera ~1,000‑3,000 plaquetas. Vida plaquetaria: <strong>7‑10 días</strong>; ~1/3 queda secuestrada en el bazo.</li>
<li>Gránulos <strong>α</strong>: FvW, fibrinógeno, factor V, PF4, PDGF. Gránulos <strong>densos</strong>: ADP, ATP, Ca²⁺, serotonina.</li></ul></div>
`});

topic({id:"linfoide",b:"I",title:"Linaje linfoide e inmunoglobulinas",short:"Maduración B y T, NK, recombinación V(D)J, HLA, complemento",html:`
<p class="lead">De la CMH sale el progenitor linfoide común, que da linfocitos B, T y NK.</p>
<h3>NK</h3>
<ul><li>Linfocitos grandes y granulares. Matan sin sensibilización previa con <strong>perforina</strong> (poros) y <strong>granzima B</strong> (entra y activa caspasas → apoptosis).</li>
<li>Reconocen la <strong>ausencia de HLA‑I</strong> (“missing self”): células tumorales o infectadas por virus que esconden su HLA‑I para escapar de los CD8.</li></ul>
<h3>Maduración B: fase independiente de antígeno (médula)</h3>
<div class="flow"><span>Pro‑B</span><i>→</i><span>Pre‑B <small class="muted">(cadena μ citoplasmática)</small></span><i>→</i><span>B inmaduro <small class="muted">(IgM de superficie)</small></span><i>→</i><span>B maduro virgen <small class="muted">(IgM + IgD)</small></span></div>
<ul>
<li>La primera cadena pesada en expresarse es <strong>μ</strong> (IgM). Isotipos: <strong>G A M E D</strong>. Cadenas ligeras: <strong>κ</strong> o <strong>λ</strong> (κ:λ ≈ 2:1).</li>
<li>Cadena pesada (cromosoma 14) recombina segmentos <strong>V, D y J</strong>; cadenas ligeras (κ cromosoma 2, λ cromosoma 22) recombinan <strong>V y J</strong> (no tienen D).</li>
<li>La recombinasa la codifican <strong>RAG‑1 y RAG‑2</strong>. La <strong>TdT</strong> (desoxinucleotidil transferasa terminal) es otra enzima que añade nucleótidos N en las uniones y aumenta la diversidad. TdT es marcador de linfoblastos (LLA).</li>
<li>Un error en esta fase da la <strong>LLA de precursores B</strong>, la leucemia más frecuente en niños.</li>
</ul>
<h3>Fase dependiente de antígeno (ganglio, centro germinal)</h3>
<ul>
<li>El B activado entra al centro germinal y sufre <strong>hipermutación somática</strong> (mutaciones puntuales en la región variable para aumentar la afinidad) y <strong>cambio de clase</strong> (IgM → IgG, IgA, IgE). Ambas dependen de la enzima <strong>AID</strong> (desaminasa inducida por activación).</li>
<li>Los B de baja afinidad mueren por apoptosis; los seleccionados expresan antiapoptóticos (familia <strong>BCL‑2</strong>) y salen como <strong>célula plasmática</strong> o <strong>B de memoria</strong>.</li>
<li>Errores en el centro germinal originan la mayoría de los <strong>linfomas B</strong> (folicular, difuso de células grandes, Burkitt, Hodgkin).</li>
</ul>
<div class="callout fix"><p>Esta es tu “pregunta de examen”, y en las notas se mezclan tres procesos. <strong>RAG‑1/RAG‑2</strong> codifican la recombinasa V(D)J (no la TdT). La <strong>TdT</strong> añade nucleótidos en las uniones. La <strong>hipermutación somática</strong> ocurre después, en el centro germinal, mediada por <strong>AID</strong>. Familia BCL‑2: antiapoptóticos BCL‑2, BCL‑XL, MCL‑1; proapoptóticos <strong>BAX, BAK, BAD, BID</strong> (no “VID”).</p></div>
<h3>Complemento</h3>
<div class="flow"><span>Clásica: C1q‑r‑s <small class="muted">(Ag‑Ac)</small></span><i>→</i><span>C4, C2</span><i>→</i><span>C3 convertasa</span><i>→</i><span>C5 convertasa</span><i>→</i><span><strong>MAC C5b‑9</strong> → lisis osmótica</span></div>
<p>C3b opsoniza (fagocitosis por macrófagos); C3a y C5a son anafilotoxinas.</p>
<h3>Linfocito T (timo)</h3>
<ul>
<li>Pro‑T → pre‑T → timocito doble negativo → doble positivo (CD4+CD8+) → simple positivo. El <strong>TCR</strong> va siempre unido a <strong>CD3</strong> (marcador pan‑T; CD3 citoplasmático define la LLA‑T).</li>
<li>TCR αβ (~95%) o γδ.</li>
<li><strong>Selección positiva</strong>: sobreviven los que reconocen HLA propio (decide CD4 vs CD8). <strong>Selección negativa</strong>: mueren los que reconocen con fuerza autoantígenos (si falla → autoinmunidad).</li>
<li>El timo involuciona con la edad. El <strong>timoma</strong> se asocia a miastenia gravis y a <strong>aplasia pura de serie roja</strong>.</li>
</ul>
<h3>HLA y subpoblaciones</h3>
<div class="tbl"><table><tr><th></th><th>HLA clase I</th><th>HLA clase II</th></tr>
<tr><td>Estructura</td><td>Cadena α + <strong>β2‑microglobulina</strong></td><td>Cadenas α y β</td></tr>
<tr><td>Dónde</td><td>Todas las células nucleadas</td><td>Presentadoras: macrófago, dendrítica, B</td></tr>
<tr><td>Presenta</td><td>Péptidos intracelulares (virus, oncogenes)</td><td>Péptidos fagocitados</td></tr>
<tr><td>A quién</td><td><strong>CD8</strong> citotóxico</td><td><strong>CD4</strong> cooperador</td></tr></table></div>
<ul><li><strong>Th1</strong>: IFN‑γ, IL‑2 → activa macrófagos y CD8 (inmunidad celular).</li>
<li><strong>Th2</strong>: IL‑4, IL‑5, IL‑13 → ayudan al B a producir anticuerpos y cambiar de clase; activan eosinófilos.</li>
<li>Expansión de plasmocitos: <strong>IL‑6</strong> (clave en el mieloma).</li></ul>
<div class="callout fix"><p>El HLA‑I no tiene “subunidades α y β”: es una cadena α unida a <strong>β2‑microglobulina</strong> (la β2M sérica es marcador pronóstico del mieloma). Th1 no produce IL‑1/IL‑6; produce <strong>IFN‑γ e IL‑2</strong>. El “linfoma TANK” es el <strong>linfoma NK/T extranodal</strong>.</p></div>
`});

topic({id:"bh",b:"I",title:"Citometría hemática (biometría)",short:"Valores, índices, apellidos de la anemia y cuentas absolutas",html:`
<p class="lead">El estudio más solicitado y más subutilizado: bien leído orienta el diagnóstico en la gran mayoría de los casos.</p>
<h3>Serie roja</h3>
<div class="tbl"><table><tr><th>Parámetro</th><th>Referencia (adulto)</th><th>Nota</th></tr>
<tr><td>Hemoglobina</td><td class="mono">♀ 12‑16 · ♂ 13.5‑17.5 g/dL</td><td>Define anemia. Sube con la altitud (CDMX ~+0.5‑1)</td></tr>
<tr><td>Hematocrito</td><td class="mono">♀ 36‑46 · ♂ 41‑53 %</td><td>≈ Hb × 3</td></tr>
<tr><td>Eritrocitos</td><td class="mono">4.0‑5.9 ×10⁶/µL</td><td>No sirve por sí solo para definir anemia</td></tr>
<tr><td>VCM (VGM)</td><td class="mono">80‑100 fL</td><td>&lt;80 microcitosis · &gt;100 macrocitosis</td></tr>
<tr><td>HCM</td><td class="mono">27‑32 pg</td><td>Hb por célula: hipocromía si &lt;27</td></tr>
<tr><td>CMHC</td><td class="mono">32‑36 g/dL</td><td>Concentración. <strong>Elevada en esferocitosis</strong></td></tr>
<tr><td>ADE (RDW)</td><td class="mono">11.5‑14.5 %</td><td>Anisocitosis. ↑ en ferropenia, normal en talasemia menor</td></tr>
<tr><td>Reticulocitos</td><td class="mono">0.5‑1.5 %</td><td>Corregir si Hto bajo (ver Calculadoras)</td></tr></table></div>
<div class="callout fix"><p>Hb se reporta en <strong>g/dL</strong>, no en %. HCM en <strong>pg</strong> (picogramos). Tu VCM masculino de 82‑93 fL es demasiado estrecho: el estándar es 80‑100 fL. HCM y CMHC <strong>no</strong> son lo mismo, y la “hipercromía” sí existe en sentido de CMHC alta (esferocitos). ADE normal ≈ 11.5‑14.5%.</p></div>
<h3>Los tres “apellidos” de la anemia</h3>
<ul><li><strong>Tamaño</strong> (VCM): micro‑, normo‑ o macrocítica.</li>
<li><strong>Color</strong> (HCM): hipo‑ o normocrómica.</li>
<li><strong>Regeneración</strong> (reticulocitos corregidos / IPR): regenerativa (pérdida o hemólisis) o arregenerativa (problema de producción: carencias, aplasia, infiltración, inflamación, ERC).</li></ul>
<div class="callout pearl"><p>Microcítica hipocrómica: ferropenia, talasemia, enfermedad crónica (tardía), sideroblástica, intoxicación por plomo. Macrocítica: B12/folato (megaloblástica) o no megaloblástica (alcohol, hepatopatía, hipotiroidismo, SMD, reticulocitosis, fármacos como hidroxiurea o metotrexato).</p></div>
<p><strong>Anisocitosis</strong> = variación de tamaño (ADE). <strong>Poiquilocitosis</strong> = variación de forma (esferocitos, drepanocitos, esquistocitos, dacriocitos, dianocitos…).</p>
<h3>Serie blanca</h3>
<div class="tbl"><table><tr><th>Célula</th><th>%</th><th>Absoluto</th><th>Si está alta</th></tr>
<tr><td>Leucocitos</td><td>–</td><td class="mono">4,000‑10,500/µL</td><td>Infección, inflamación, esteroides, leucemia</td></tr>
<tr><td>Neutrófilos</td><td class="mono">40‑70%</td><td class="mono">1,800‑7,500</td><td>Bacterias, inflamación, esteroides</td></tr>
<tr><td>Bandas</td><td class="mono">0‑5%</td><td>–</td><td>Bandemia: infección bacteriana</td></tr>
<tr><td>Linfocitos</td><td class="mono">20‑40%</td><td class="mono">1,000‑4,000</td><td>Virus; &gt;5,000 B clonales = LLC</td></tr>
<tr><td>Monocitos</td><td class="mono">2‑10%</td><td class="mono">200‑1,000</td><td>TB, endocarditis, recuperación post‑QT, LMMC</td></tr>
<tr><td>Eosinófilos</td><td class="mono">0‑5%</td><td class="mono">&lt;500</td><td>Parásitos, alergia, fármacos, neoplasias</td></tr>
<tr><td>Basófilos</td><td class="mono">0‑1%</td><td class="mono">&lt;200</td><td>LMC, hipersensibilidad</td></tr></table></div>
<p>En el adulto siempre debe haber más neutrófilos que linfocitos (en el niño pequeño se invierte de forma fisiológica).</p>
<h3>Neutropenia (cuenta absoluta = leucocitos × (% neutrófilos + % bandas))</h3>
<div class="tbl"><table><tr><th>Grado</th><th>Neutrófilos/µL</th><th>Manejo</th></tr>
<tr><td>Leve</td><td class="mono">1,000‑1,500</td><td>Asintomática. Buscar causa (virus, fármacos, QT, falla medular). Medidas higiénicas</td></tr>
<tr><td>Moderada</td><td class="mono">500‑999</td><td>Mayor riesgo. Aislamiento en casa, cubrebocas; G‑CSF (filgrastim) según causa</td></tr>
<tr><td>Grave</td><td class="mono">&lt;500</td><td>Riesgo alto de infección grave</td></tr></table></div>
<div class="callout pearl"><p><strong>Neutropenia febril</strong> (T ≥ 38.3 °C una vez o ≥ 38 °C por 1 h + neutrófilos &lt;500, o &lt;1,000 con caída esperada) es una <strong>urgencia</strong>: hemocultivos y antibiótico IV de amplio espectro <strong>antipseudomonas</strong> dentro de la <strong>primera hora</strong> (cefepime, piperacilina‑tazobactam o meropenem). Nada de tacto rectal, enemas, supositorios ni sondas innecesarias.</p></div>
<div class="callout fix"><p>Tus notas indican “ciprofloxacino 250 mL c/12 h”. El tratamiento empírico de la neutropenia febril de alto riesgo es un <strong>β‑lactámico antipseudomonas IV</strong>. Las quinolonas orales se usan solo como profilaxis o en bajo riesgo (MASCC ≥ 21) junto con amoxicilina‑clavulanato. El G‑CSF es <strong>filgrastim</strong>.</p></div>
<p>Otras cifras: linfopenia &lt;1,000; eosinofilia &gt;500 (hipereosinofilia &gt;1,500, con riesgo de daño orgánico).</p>
<h3>Serie plaquetaria</h3>
<div class="tbl"><table><tr><th>Plaquetas/µL</th><th>Significado</th></tr>
<tr><td class="mono">150,000‑450,000</td><td>Normal</td></tr>
<tr><td class="mono">100,000‑150,000</td><td>Leve, asintomática</td></tr>
<tr><td class="mono">50,000‑100,000</td><td>Moderada; suele permitir cirugía menor</td></tr>
<tr><td class="mono">20,000‑50,000</td><td>Petequias y equimosis con trauma</td></tr>
<tr><td class="mono">&lt;10,000‑20,000</td><td>Sangrado espontáneo; riesgo de hemorragia en SNC</td></tr></table></div>
<ul>
<li>Petequias (puntiformes), púrpura, equimosis (moretones). Sangrado mucocutáneo = defecto plaquetario o de FvW; hemartrosis y hematomas profundos = defecto de factores (hemofilia).</li>
<li>Signos de alarma de sangrado en SNC: <strong>petequias en paladar (bulas hemorrágicas)</strong> y <strong>hemorragia en fondo de ojo</strong>.</li>
<li>Umbral profiláctico de transfusión: <strong>&lt;10,000</strong> en paciente estable (p. ej., leucemia en QT); &lt;50,000 para cirugía mayor o sangrado activo; &lt;100,000 para neurocirugía. En PTI y PTT se evita transfundir salvo sangrado grave.</li>
<li>Aféresis plaquetaria: un donador equivale a ~6‑8 unidades de plaquetas por concentrado.</li>
</ul>
<div class="callout fix"><p>Sí existen umbrales de transfusión (arriba). Las plaquetas transfundidas viven hasta ~3‑5 días; en estados de <strong>consumo o destrucción</strong> (PTI, CID, fiebre, esplenomegalia) sobreviven solo horas. Cada concentrado sube ~5,000‑10,000/µL por m².</p></div>
<h3>Volumen plaquetario medio (VPM 7‑11 fL)</h3>
<ul><li>Trombocitopenia + <strong>VPM alto</strong>: destrucción periférica con médula que responde (PTI) o <strong>Bernard‑Soulier</strong> (plaquetas gigantes).</li>
<li>Trombocitopenia + VPM bajo: falla de producción (aplasia), Wiskott‑Aldrich (plaquetas pequeñas).</li>
<li>Trombocitosis reactiva por <strong>ferropenia</strong> (sangrado crónico) es muy frecuente.</li></ul>
<div class="callout fix"><p>Bernard‑Soulier tiene <strong>VPM elevado</strong> (macroplaquetas), no bajo. Y la trombocitosis extrema (&gt; 1‑1.5 millones) sangra porque adsorbe multímeros grandes del FvW (<strong>enfermedad de von Willebrand adquirida</strong>), no por un defecto de GPIIb/IIIa.</p></div>
`});

topic({id:"hierro",b:"II",title:"Metabolismo del hierro y anemia ferropénica",short:"Absorción, hepcidina, cinética y reposición",html:`
<p class="lead">La causa más común de anemia en el mundo. La anemia es la <strong>última</strong> manifestación de la deficiencia de hierro: primero se vacían las reservas.</p>
<h3>Balance</h3>
<ul><li>Pérdida basal ~1 mg/día (♀ menstruante ~2 mg/día). Dieta ~10‑15 mg/día, se absorbe ~10%.</li>
<li>Requerimientos aumentados: lactancia/infancia, adolescencia, <strong>embarazo</strong> (~1,000 mg en total), menstruación abundante.</li>
<li>Reservas: ♂ ~1 g de depósito (hierro corporal total 3.5‑4 g); ♀ ~0.3‑0.5 g (total 2‑3 g).</li></ul>
<h3>Absorción (duodeno)</h3>
<div class="diagram" aria-label="Absorción de hierro">${ironSVG()}</div>
<ul>
<li><strong>Hierro hemo</strong> (carnes, Fe²⁺): entra por HCP1, se absorbe mejor (~25%).</li>
<li><strong>No hemo</strong> (vegetales, Fe³⁺): el ácido gástrico lo solubiliza y la <strong>citocromo b duodenal (DcytB)</strong> del borde en cepillo lo reduce a Fe²⁺; entra por <strong>DMT1</strong>.</li>
<li>Dentro del enterocito: se guarda como <strong>ferritina</strong> (se pierde al descamarse) o sale por la membrana basolateral a través de <strong>ferroportina</strong>; la <strong>hefestina</strong> lo oxida a Fe³⁺ para unirse a <strong>transferrina</strong>.</li>
<li>La transferrina lleva hasta <strong>2 átomos de Fe³⁺</strong>; saturación normal 20‑45% (~30%). Entrega el hierro a los eritroblastos por el <strong>receptor de transferrina 1</strong>, en la isla eritroblástica alrededor de un macrófago.</li>
<li>Regulador maestro: <strong>hepcidina</strong> (hígado). Degrada la ferroportina. ↑ con inflamación (IL‑6) y sobrecarga; ↓ con hipoxia, eritropoyesis activa y ferropenia. La hipoxia, vía <strong>HIF‑2α</strong>, aumenta DMT1 y DcytB.</li>
</ul>
<div class="callout fix"><p>El hierro sale del enterocito por <strong>ferroportina</strong>, no por el receptor de transferrina. La transferrina lleva <strong>2</strong> átomos (no 3). La reducción la hace la DcytB (ferrirreductasa).</p></div>
<h3>Clínica</h3>
<ul><li>Síndrome anémico: astenia, adinamia, cefalea, intolerancia al ejercicio, taquicardia, palidez, disnea.</li>
<li>Propios de la ferropenia: caída de cabello, uñas frágiles, <strong>coiloniquia</strong>, glositis con depapilación, <strong>queilitis angular</strong>, <strong>pica</strong> (geofagia, <strong>pagofagia</strong> = hielo, muy específica), síndrome de piernas inquietas.</li>
<li><strong>Síndrome de Plummer‑Vinson</strong> (Paterson‑Kelly): ferropenia + membranas esofágicas + disfagia. Es lesión premaligna (carcinoma epidermoide).</li>
<li>En el embarazo, la ferropenia materna se asocia con prematurez y bajo peso; en lactantes, con alteración del neurodesarrollo.</li></ul>
<h3>Laboratorio</h3>
<div class="tbl"><table><tr><th>Citometría</th><th>Cinética de hierro</th></tr>
<tr><td>Hb <span class="down">↓</span>, VCM <span class="down">↓</span>, HCM <span class="down">↓</span><br>ADE <span class="up">↑</span> (primer cambio)<br>Reticulocitos normales o bajos<br>Plaquetas normales o <span class="up">↑</span></td>
<td>Fe sérico <span class="down">↓</span><br>Transferrina / CTFH <span class="up">↑</span><br>Saturación de TF <span class="down">↓</span> (&lt;16‑20%)<br><strong>Ferritina <span class="down">↓</span> (&lt;30 ng/mL; &lt;15 confirma)</strong><br>Protoporfirina zinc eritrocitaria <span class="up">↑</span><br>Receptor soluble de TF <span class="up">↑</span></td></tr></table></div>
<p>Sin hierro, la ferroquelatasa inserta <strong>zinc</strong> en la protoporfirina: aparece la protoporfirina zinc. El estándar de oro histórico es la ausencia de hierro con <strong>tinción de Perls</strong> en el aspirado, pero casi nunca se necesita: la ferritina baja es diagnóstica.</p>
<div class="callout pearl"><p>Ferropenia en hombre o mujer posmenopáusica = <strong>sangrado digestivo hasta demostrar lo contrario</strong> (endoscopia y colonoscopia). Buscar también H. pylori, enfermedad celíaca y gastritis atrófica.</p></div>
<h3>Tratamiento</h3>
<ul>
<li><strong>Oral</strong>: sulfato ferroso 325 mg (65 mg de hierro elemental) o fumarato ferroso 200 mg (~65 mg elemental). Dosis de 60‑120 mg de hierro elemental <strong>diaria o en días alternos</strong> (días alternos mejora absorción y tolerancia por la hepcidina). Tomar con vitamina C, lejos de calcio, té y antiácidos.</li>
<li>Respuesta: reticulocitosis a los 5‑10 días; Hb sube ~1‑2 g/dL cada 2‑3 semanas. Continuar <strong>3 meses después de normalizar la Hb</strong> para llenar reservas.</li>
<li><strong>Intravenoso</strong> si hay intolerancia, malabsorción (bariátrica, EII, celíaca), pérdidas mayores a lo que se absorbe, ERC o 2.º‑3.er trimestre del embarazo: <strong>carboximaltosa férrica</strong> (hasta 1,000 mg por dosis), hierro sacarosa (200 mg por dosis), derisomaltosa férrica. El hierro dextrán de alto peso molecular tiene más riesgo de anafilaxia.</li>
</ul>
<p><strong>Fórmula de Ganzoni</strong>: déficit (mg) = peso (kg) × (Hb meta − Hb actual) × 2.4 + reservas (500 mg; en algunos apuntes 1,000 ♂ / 750 ♀). Calcúlala en la pestaña Calculadoras.</p>
<div class="callout fix"><p>Tus notas dicen “× 2.2” y que el tratamiento oral dura “más de 2 años”. Ganzoni usa <strong>2.4</strong> (Hb en g/dL). El tratamiento oral dura típicamente <strong>3‑6 meses</strong> en total. La carboximaltosa no viene solo en 500 mg: se puede dar 1,000 mg en una infusión.</p></div>
`});

topic({id:"b12",b:"II",title:"Cobalamina (B12), ácido fólico y anemia megaloblástica",short:"Absorción, asincronía, neurología y tratamiento",html:`
<p class="lead">Ambas vitaminas son necesarias para sintetizar timidina (ADN). Su déficit da <strong>asincronía de maduración</strong>: núcleo inmaduro con citoplasma maduro → megaloblastos y macrocitosis.</p>
<div class="tbl"><table><tr><th></th><th>B12 (cobalamina)</th><th>Ácido fólico</th></tr>
<tr><td>Fuente</td><td>Solo <strong>alimentos animales</strong> (carne, hígado, huevo, lácteos)</td><td>Hojas verdes, leguminosas, hígado; se destruye con la cocción</td></tr>
<tr><td>Requerimiento</td><td class="mono">~2.4 µg/día</td><td class="mono">~400 µg/día (600 en embarazo)</td></tr>
<tr><td>Reservas</td><td class="mono">2‑5 mg → 3‑5 años</td><td class="mono">5‑20 mg → ~3‑4 meses</td></tr>
<tr><td>Absorción</td><td><strong>Íleon terminal</strong>, requiere factor intrínseco</td><td>Duodeno y <strong>yeyuno proximal</strong>; poliglutamatos → monoglutamatos; transportador PCFT</td></tr>
<tr><td>Formas</td><td>Ciano‑, hidroxo‑, metil‑ y <strong>adenosil</strong>cobalamina</td><td>Ácido fólico (sintético), 5‑metil‑THF</td></tr></table></div>
<div class="callout fix"><p>Las leguminosas <strong>no</strong> tienen B12 (los vegetarianos estrictos se deficitan); las formas son adenosil‑ (no “acelit”) y las reservas duran 3‑5 años. El folato <strong>sí</strong> requiere transportadores (PCFT, RFC) y se absorbe en el yeyuno.</p></div>
<h3>Viaje de la B12</h3>
<div class="flow"><span>Boca/estómago: se une a <strong>haptocorrina</strong> (proteína R)</span><i>→</i><span>Células parietales secretan <strong>factor intrínseco (FI)</strong></span><i>→</i><span>Duodeno: proteasas pancreáticas degradan la haptocorrina; B12 se une al FI</span><i>→</i><span>Íleon terminal: complejo FI‑B12 entra por <strong>cubilina</strong> (cubam)</span><i>→</i><span>Plasma: <strong>transcobalamina II</strong> la lleva a tejidos</span></div>
<div class="callout fix"><p>En el íleon la B12 <strong>no</strong> se libera del FI antes de entrar: el complejo FI‑B12 completo es lo que reconoce la cubilina. Lo que degradan las enzimas pancreáticas (en el duodeno) es la haptocorrina.</p></div>
<h3>Causas de déficit</h3>
<ul>
<li><strong>Anemia perniciosa</strong> (la más frecuente en adultos): gastritis atrófica autoinmune con anticuerpos <strong>anti‑factor intrínseco</strong> (específicos) y <strong>anti‑células parietales</strong> (sensibles). Riesgo de carcinoma gástrico y tumores carcinoides.</li>
<li>Gastrectomía, bypass gástrico, uso crónico de <strong>IBP</strong> o <strong>metformina</strong>, anciano con gastritis atrófica.</li>
<li>Insuficiencia pancreática exocrina; <strong>sobrecrecimiento bacteriano</strong> (síndrome de asa ciega); <em>Diphyllobothrium latum</em>.</li>
<li>Ileítis o resección de íleon terminal (Crohn), dieta vegana, óxido nitroso.</li>
<li>Folato: alcoholismo, desnutrición, embarazo, hemólisis crónica, fármacos (metotrexato, trimetoprim, fenitoína).</li>
</ul>
<h3>Bioquímica</h3>
<ul><li>B12 es cofactor de la <strong>metionina sintasa</strong> (homocisteína + metil‑THF → metionina + THF) y de la <strong>metilmalonil‑CoA mutasa</strong>.</li>
<li>Déficit de B12: <strong>homocisteína ↑ y ácido metilmalónico ↑</strong>. Déficit de folato: solo homocisteína ↑. Esto los distingue.</li>
<li>La MTHFR produce el 5‑metil‑THF (no convierte directamente homocisteína en metionina).</li></ul>
<h3>Clínica y laboratorio</h3>
<ul>
<li>Hb ↓, <strong>VCM ↑ (a menudo &gt;110 fL)</strong>, reticulocitos ↓, ADE ↑, frecuentemente pancitopenia. Neutrófilos <strong>hipersegmentados</strong> y macroovalocitos.</li>
<li>Eritropoyesis ineficaz con hemólisis intramedular: <strong>DHL muy elevada</strong> (miles), bilirrubina indirecta ↑, haptoglobina ↓.</li>
<li>Glositis de Hunter (lengua lisa, roja y dolorosa), disgeusia, diarrea o estreñimiento.</li>
<li>Solo la B12: <strong>degeneración combinada subaguda</strong> de cordones posteriores (propiocepción, vibración, Romberg +, ataxia) y laterales (espasticidad), neuropatía periférica, demencia. Puede ocurrir sin anemia y ser irreversible.</li>
</ul>
<div class="mini-cells"><figure>${cellById("hiperseg").svg}<figcaption>Hipersegmentado</figcaption></figure></div>
<h3>Tratamiento</h3>
<ul>
<li><strong>Cianocobalamina 1,000 µg IM</strong> diaria o en días alternos la 1.ª semana, semanal 4‑8 semanas y luego mensual de por vida en perniciosa. La vía oral a dosis altas (1,000‑2,000 µg/día) también funciona por difusión pasiva.</li>
<li>Ácido fólico 1‑5 mg/día VO por 4 meses.</li>
<li>Vigilar <strong>hipopotasemia</strong> en los primeros días (el potasio entra a las células nuevas) y la reticulocitosis a los 5‑7 días.</li>
</ul>
<div class="callout pearl"><p><strong>Nunca</strong> des ácido fólico solo si no has descartado déficit de B12: corrige la anemia pero deja avanzar (y puede empeorar) el daño neurológico. Con deficiencia mixta empieza por la B12.</p></div>
<div class="callout fix"><p>“Bedoyecta” es una marca comercial (B1 + B6 + B12). En el examen escribe <strong>cianocobalamina o hidroxocobalamina IM</strong> con su esquema.</p></div>
`});

topic({id:"aec",b:"II",title:"Anemia de enfermedad crónica (inflamatoria)",short:"Hepcidina, secuestro de hierro y comparación con ferropenia",html:`
<p class="lead">Segunda anemia más frecuente y la más común en hospitalizados. Normocítica normocrómica (a veces leve microcitosis), arregenerativa y moderada (Hb 8‑11).</p>
<h3>Mecanismos</h3>
<ul>
<li><strong>Secuestro de hierro</strong>: la IL‑6 aumenta la <strong>hepcidina</strong>, que degrada la ferroportina. El hierro queda atrapado en macrófagos y enterocitos como ferritina: hay hierro, pero no llega al eritroblasto.</li>
<li><strong>Respuesta de EPO inadecuada</strong> e inhibición directa de progenitores por TNF‑α, IL‑1 e IFN‑γ.</li>
<li>Vida media eritrocitaria algo acortada (activación de macrófagos).</li>
<li>La <strong>lactoferrina</strong> de los neutrófilos también capta hierro en sitios inflamados (mecanismo menor).</li>
</ul>
<p>Causas: infecciones crónicas (TB, abscesos, endocarditis), autoinmunes (AR, LES, vasculitis), cáncer, ERC (en la ERC domina la falta de EPO), insuficiencia cardiaca, diabetes, obesidad, envejecimiento.</p>
<h3>Ferropenia vs. inflamación</h3>
<div class="tbl"><table><tr><th>Prueba</th><th>Ferropénica</th><th>Inflamatoria</th><th>Mixta</th></tr>
<tr><td>Fe sérico</td><td class="down">↓</td><td class="down">↓</td><td class="down">↓</td></tr>
<tr><td>Transferrina / CTFH</td><td class="up">↑</td><td><strong class="down">↓ o normal</strong></td><td>normal</td></tr>
<tr><td>Saturación TF</td><td class="down">↓↓</td><td class="down">↓</td><td class="down">↓</td></tr>
<tr><td>Ferritina</td><td class="down">↓ (&lt;30)</td><td class="up">↑ o normal (&gt;100)</td><td>30‑100</td></tr>
<tr><td>Receptor soluble de TF</td><td class="up">↑</td><td>normal</td><td class="up">↑</td></tr>
<tr><td>Índice RsTF/log ferritina</td><td class="up">&gt; 2</td><td class="down">&lt; 1</td><td class="up">&gt; 2</td></tr>
<tr><td>Hierro en médula (Perls)</td><td>ausente</td><td>presente en macrófagos</td><td>bajo</td></tr></table></div>
<div class="callout fix"><p>En tu tabla la transferrina y la capacidad total de fijación aparecen <strong>altas</strong> en la inflamatoria. Es al revés: en la anemia inflamatoria la transferrina es <strong>baja o normal</strong> (es reactante de fase aguda negativo). Esa es justamente la diferencia clave con la ferropenia, junto con la ferritina alta.</p></div>
<h3>Tratamiento</h3>
<ul><li>Tratar la enfermedad de base.</li>
<li>Hierro IV si hay deficiencia absoluta o funcional (ERC, IC).</li>
<li>Agentes estimulantes de la eritropoyesis: EPO alfa 50‑150 UI/kg 3 veces por semana, darbepoetina o <strong>EPO pegilada (CERA)</strong> mensual (vida media larga). En ERC, meta de Hb 10‑11.5 g/dL; no superar 13 (más trombosis, ictus y en cáncer, progresión tumoral).</li>
<li>Nuevos: inhibidores de HIF‑prolil hidroxilasa (roxadustat, daprodustat) en ERC.</li></ul>
`});

topic({id:"hemolisis",b:"II",title:"Anemias hemolíticas: generalidades",short:"Intra vs. extravascular, pruebas y clasificación",html:`
<p class="lead">Acortamiento de la vida media del eritrocito que la médula no logra compensar. La médula puede aumentar su producción 6‑8 veces: compensa supervivencias de hasta ~20‑40 días.</p>
<h3>Dos escenarios</h3>
<div class="tbl"><table><tr><th></th><th>Extravascular</th><th>Intravascular</th></tr>
<tr><td>Dónde</td><td>Macrófagos de bazo e hígado</td><td>Dentro del vaso</td></tr>
<tr><td>Ejemplos</td><td>Esferocitosis, AHAI caliente, déficit PK, talasemias</td><td>G6PD, PTT/SUH, válvulas, HPN, transfusión ABO incompatible, AHAI fría, malaria</td></tr>
<tr><td>Bilirrubina indirecta</td><td class="up">↑↑</td><td class="up">↑</td></tr>
<tr><td>Haptoglobina</td><td>↓ (leve)</td><td class="down">↓↓ (indetectable)</td></tr>
<tr><td>Hb libre / hemoglobinuria</td><td>No</td><td><strong>Sí</strong> (orina oscura); hemosiderinuria</td></tr>
<tr><td>Hierro</td><td>Se recicla</td><td>Se pierde por orina</td></tr>
<tr><td>Esplenomegalia</td><td>Frecuente</td><td>Rara</td></tr></table></div>
<h3>Pruebas de hemólisis</h3>
<ol><li>Reticulocitos ↑ (regenerativa)</li><li>Bilirrubina indirecta ↑</li><li>DHL ↑</li><li>Haptoglobina ↓</li></ol>
<p>Después, <strong>frotis</strong> (esferocitos, esquistocitos, células mordidas, drepanocitos) y <strong>Coombs directo</strong> para separar inmune de no inmune.</p>
<div class="callout fix"><p>No es obligatorio que estén las tres alteraciones: en una crisis aplásica o con déficit de folato los reticulocitos pueden estar bajos aunque haya hemólisis. La DHL alta también aparece en la anemia megaloblástica (hemólisis intramedular). La haptoglobina se une a la <strong>hemoglobina libre</strong> (no al hierro); al agotarse, la hemopexina capta el hemo.</p></div>
<div class="callout pearl"><p>Todo paciente con hemólisis crónica necesita <strong>ácido fólico</strong> (se consume con la eritropoyesis acelerada) y vigilancia de litiasis biliar pigmentaria. El parvovirus B19 provoca <strong>crisis aplásicas</strong>.</p></div>
<h3>Clasificación</h3>
<ul>
<li><strong>Intracorpusculares</strong> (defecto del eritrocito, casi todas hereditarias): membranopatías, enzimopatías, hemoglobinopatías. Excepción adquirida: <strong>HPN</strong>.</li>
<li><strong>Extracorpusculares</strong> (eritrocito sano, ambiente hostil): inmunes (AHAI, aloinmunes, fármacos), mecánicas (microangiopáticas, válvulas, hemoglobinuria de la marcha), infecciones (malaria, Clostridium), tóxicos, hiperesplenismo.</li>
</ul>
<p>Hemólisis por válvula protésica o estenosis aórtica grave: la turbulencia fragmenta eritrocitos (esquistocitos). Hemoglobinuria de la marcha: trauma repetido en las plantas (corredores, soldados).</p>
`});

topic({id:"intracorp",b:"II",title:"Hemólisis intracorpuscular",short:"Esferocitosis, G6PD, PK, drepanocitosis y talasemias",html:`
<h3>Membranopatías</h3>
<p><strong>Esferocitosis hereditaria</strong> (autosómica dominante en ~75%): defecto de proteínas verticales del citoesqueleto: <strong>ancirina</strong> (la más frecuente), banda 3, espectrina, proteína 4.2. La célula pierde membrana, se vuelve esfera rígida y el bazo la destruye (extravascular).</p>
<ul><li>Clínica: anemia, ictericia, <strong>esplenomegalia</strong>, litiasis biliar en jóvenes, crisis aplásicas por parvovirus.</li>
<li>Laboratorio: esferocitos, <strong>CMHC ↑</strong>, reticulocitosis, <strong>Coombs negativo</strong> (lo distingue de la AHAI).</li>
<li>Diagnóstico: <strong>unión a eosina‑5‑maleimida (EMA) por citometría</strong> (prueba de elección) o fragilidad osmótica aumentada (las células se lisan antes en soluciones hipotónicas). No hacerla en la crisis.</li>
<li>Tratamiento: ácido fólico; <strong>esplenectomía</strong> en formas moderadas‑graves, idealmente después de los 6 años y con vacunas (neumococo, meningococo, Hib) 2 semanas antes.</li></ul>
<p><strong>Eliptocitosis hereditaria</strong>: defecto horizontal (espectrina, proteína 4.1). Casi siempre asintomática.</p>
<div class="callout fix"><p>El tratamiento es esplen<strong>ectomía</strong> (extirpar), no esplenotomía (incisión). La osmolalidad plasmática normal es ~285‑295 mOsm/kg.</p></div>
<h3>Enzimopatías</h3>
<p><strong>Déficit de G6PD</strong> (ligado al <strong>X</strong>, varones; la más frecuente del mundo): sin NADPH no se regenera el glutatión y el estrés oxidativo precipita la Hb (<strong>cuerpos de Heinz</strong>) → <strong>células mordidas</strong>. Hemólisis principalmente <strong>intravascular</strong> y episódica.</p>
<ul><li>Desencadenantes: infecciones (el más común), <strong>habas</strong> (favismo), primaquina, dapsona, sulfonamidas, nitrofurantoína, rasburicasa, azul de metileno.</li>
<li>Tratamiento: suspender el desencadenante, hidratación, transfusión si es grave.</li>
<li>Diagnóstico: actividad enzimática <strong>2‑3 meses después</strong> de la crisis (los reticulocitos tienen más G6PD y dan falsos normales).</li></ul>
<div class="mini-cells"><figure>${cellById("mordida").svg}<figcaption>Mordida + Heinz</figcaption></figure></div>
<p><strong>Déficit de piruvato cinasa</strong> (autosómico recesivo): sin ATP, la célula se deshidrata y se vuelve rígida (equinocitos); hemólisis extravascular crónica. Nuevo: mitapivat (activador de PK).</p>
<div class="callout fix"><p>La vía de las pentosas produce <strong>NADPH</strong>, no NAD. El alimento son las <strong>habas</strong> (Vicia faba), no “caldo de aba”.</p></div>
<h3>Hemoglobinopatías estructurales: drepanocitosis</h3>
<ul>
<li>Mutación puntual (<strong>sustitución</strong>) en el codón 6 de la β‑globina: <strong>ácido glutámico → valina</strong> (HbS). Autosómica recesiva.</li>
<li>HbS desoxigenada polimeriza → drepanocito rígido. Desencadenantes: hipoxemia, deshidratación, acidosis, frío, infección.</li>
<li>Crisis <strong>vasooclusivas</strong> dolorosas (dactilitis en lactantes), <strong>síndrome torácico agudo</strong> (principal causa de muerte), secuestro esplénico, ictus, priapismo, necrosis avascular de cabeza femoral, <strong>autoesplenectomía</strong> (infecciones por encapsulados, osteomielitis por Salmonella).</li>
<li>Frecuente en poblaciones <strong>afrodescendientes</strong> de ambos sexos; el rasgo (AS) protege contra la malaria grave por <em>P. falciparum</em>.</li>
<li>Diagnóstico: <strong>electroforesis de hemoglobinas</strong> (HbS), tamiz neonatal.</li>
<li>Tratamiento: hidratación, oxígeno, analgesia (opioides en crisis), <strong>hidroxiurea</strong> (aumenta HbF; pilar), transfusión/recambio, penicilina profiláctica y vacunas en niños, Doppler transcraneal. Curativos: <strong>TCPH alogénico</strong> y terapia génica (exa‑cel, aprobada en 2023).</li>
</ul>
<div class="callout fix"><p>No es “pérdida de un nucleótido” sino <strong>sustitución</strong> (GAG→GTG). Y no es más común en mujeres: es autosómica, afecta igual a ambos sexos.</p></div>
<h3>Talasemias (defecto de cantidad)</h3>
<div class="tbl"><table><tr><th>α‑talasemia (cromosoma 16, 4 genes; casi siempre deleciones)</th><th>β‑talasemia (cromosoma 11, 2 genes; casi siempre mutaciones puntuales)</th></tr>
<tr><td>1 gen: portador silente<br>2 genes: rasgo (microcitosis leve)<br>3 genes: <strong>enfermedad por HbH</strong> (β4)<br>4 genes: <strong>Hb Bart (γ4) → hidrops fetal</strong></td>
<td>Menor (rasgo): microcitosis marcada con anemia leve, <strong>HbA2 &gt; 3.5%</strong><br>Intermedia<br>Mayor (anemia de <strong>Cooley</strong>): se manifiesta a los 6‑9 meses (cae la HbF), eritropoyesis ineficaz, facies de ardilla, cráneo en “cepillo”, hepatoesplenomegalia, sobrecarga de hierro</td></tr></table></div>
<ul><li>Pista: VCM muy bajo para el grado de anemia, eritrocitos normales o altos, ADE normal. <strong>Índice de Mentzer</strong> (VCM / eritrocitos en millones) &lt; 13 sugiere talasemia; &gt; 13, ferropenia.</li>
<li>Dianocitos, punteado basófilo. Ferritina normal (no dar hierro).</li>
<li>Tratamiento de la mayor: transfusiones crónicas + <strong>quelación</strong> (deferasirox, deferoxamina), luspatercept, TCPH, terapia génica.</li></ul>
<div class="callout fix"><p>La β‑talasemia se debe sobre todo a mutaciones puntuales, no a deleciones (las deleciones caracterizan a la α). El estudio es la <strong>electroforesis</strong> de hemoglobinas (no “hidroforesis”).</p></div>
`});

topic({id:"micro",b:"II",title:"Anemias hemolíticas microangiopáticas",short:"PTT, SUH, HELLP y CID",html:`
<p class="lead">El eritrocito es sano; se fragmenta al pasar por microvasos con trombos plaquetarios. Huella común: <strong>esquistocitos + trombocitopenia + DHL alta + Coombs negativo</strong>.</p>
<div class="mini-cells"><figure>${cellById("esquisto").svg}<figcaption>Esquistocito</figcaption></figure></div>
<h3>Púrpura trombocitopénica trombótica (PTT)</h3>
<ul>
<li>Deficiencia grave de <strong>ADAMTS13</strong> (&lt;10%), la proteasa que corta los multímeros ultragrandes de FvW liberados por el endotelio. Sin ella se forman microtrombos plaquetarios.</li>
<li>Adquirida (autoanticuerpo anti‑ADAMTS13, la mayoría) o congénita (síndrome de Upshaw‑Schulman).</li>
<li>Péntada clásica (completa en &lt;10%): anemia hemolítica microangiopática, trombocitopenia, alteración neurológica, falla renal (leve), fiebre. Puede haber troponina elevada.</li>
<li><strong>Score PLASMIC</strong> estima la probabilidad mientras llega ADAMTS13.</li>
<li>Tratamiento urgente: <strong>recambio plasmático con plasma fresco congelado</strong> (aporta ADAMTS13 y retira el anticuerpo) + esteroides + <strong>rituximab</strong> (anti‑CD20) + <strong>caplacizumab</strong> (anti‑FvW). Sin tratamiento la mortalidad es ~90%.</li>
<li><strong>Evitar transfundir plaquetas</strong> salvo sangrado que amenace la vida.</li>
</ul>
<div class="callout pearl"><p>El recambio se hace con <strong>plasma</strong>, no con albúmina: la albúmina no repone ADAMTS13. Con albúmina se tratan, por ejemplo, Guillain‑Barré o miastenia.</p></div>
<h3>Síndrome urémico hemolítico (SUH)</h3>
<ul><li><strong>Típico</strong> (niños): diarrea sanguinolenta por <em>E. coli</em> productora de toxina Shiga (O157:H7) → anemia hemolítica + trombocitopenia + <strong>lesión renal aguda</strong>. Tratamiento de <strong>soporte</strong>: hidratación, diálisis si se necesita. Evitar antibióticos y antiperistálticos.</li>
<li><strong>Atípico</strong> (desregulación del complemento: factor H, I, MCP): tratamiento con <strong>eculizumab o ravulizumab</strong> (anti‑C5).</li></ul>
<div class="callout fix"><p>En el SUH típico <strong>no</strong> se usan esteroides de rutina; el manejo es de soporte. El “anticuerpo” del SUH atípico es el <strong>anti‑C5 (eculizumab)</strong>.</p></div>
<h3>HELLP</h3>
<p>Hemólisis, enzimas hepáticas elevadas y plaquetas bajas en preeclampsia grave (3.er trimestre o puerperio). Tratamiento definitivo: <strong>interrupción del embarazo</strong>; sulfato de magnesio y control de la presión.</p>
<h3>Coagulación intravascular diseminada (CID)</h3>
<ul><li>Activación sistémica de la coagulación con consumo de factores y plaquetas: trombosis microvascular y <strong>sangrado</strong> a la vez.</li>
<li>Causas: sepsis, trauma, LMA M3, complicaciones obstétricas, cáncer.</li>
<li>Laboratorio: plaquetas ↓, <strong>TP y TTPa prolongados</strong>, <strong>fibrinógeno ↓</strong>, <strong>dímero D ↑↑</strong>, esquistocitos. Score ISTH.</li>
<li>Tratamiento: <strong>corregir la causa</strong>. Soporte con plaquetas, plasma y crioprecipitado si sangra. La heparina (HBPM) se reserva para CID con trombosis predominante.</li></ul>
<div class="tbl"><table><tr><th></th><th>PTT</th><th>SUH</th><th>CID</th></tr>
<tr><td>TP / TTPa</td><td>Normales</td><td>Normales</td><td>Prolongados</td></tr>
<tr><td>Fibrinógeno</td><td>Normal</td><td>Normal</td><td>Bajo</td></tr>
<tr><td>Órgano diana</td><td>SNC</td><td>Riñón</td><td>Multiorgánico</td></tr>
<tr><td>Clave</td><td>ADAMTS13 &lt;10%</td><td>Toxina Shiga / complemento</td><td>Causa subyacente</td></tr></table></div>
`});

topic({id:"ahai",b:"II",title:"Anemia hemolítica autoinmune",short:"Calientes vs. fríos, Coombs y tratamiento",html:`
<p class="lead">Autoanticuerpos contra el eritrocito. <strong>Primaria</strong> (idiopática) o <strong>secundaria</strong> (LLC y otros linfomas, LES, infecciones, fármacos, inmunodeficiencias).</p>
<div class="tbl"><table><tr><th></th><th>Calientes (70‑80%)</th><th>Fríos (aglutininas frías)</th><th>Donath‑Landsteiner</th></tr>
<tr><td>Anticuerpo</td><td><strong>IgG</strong> (IgG1 e IgG3)</td><td><strong>IgM</strong></td><td>IgG bifásica</td></tr>
<tr><td>Temperatura</td><td>37 °C</td><td>0‑4 °C (actúa en partes acras)</td><td>Se une en frío, lisa al recalentar</td></tr>
<tr><td>Antígeno</td><td>Panreactivo, a menudo sistema Rh</td><td><strong>I</strong> (Mycoplasma) o <strong>i</strong> (EBV)</td><td>P</td></tr>
<tr><td>Mecanismo</td><td>Fc‑R de macrófagos esplénicos → extravascular, <strong>esferocitos</strong></td><td>Fija complemento → hígado (C3b) e intravascular; acrocianosis</td><td>Intravascular; hemoglobinuria paroxística a frigore (niños post‑viral)</td></tr>
<tr><td>Coombs directo</td><td>IgG ± C3</td><td>Solo C3</td><td>C3</td></tr>
<tr><td>Tratamiento</td><td><strong>Prednisona 1 mg/kg/día</strong> → rituximab → esplenectomía</td><td>Evitar el frío; <strong>rituximab</strong>; sutimlimab (anti‑C1s). Esteroides poco útiles</td><td>Autolimitada; soporte</td></tr></table></div>
<h3>Prueba de Coombs (antiglobulina)</h3>
<ul><li><strong>Directa</strong>: ¿hay anticuerpos o complemento <em>pegados</em> al eritrocito del paciente? Se agrega suero antiglobulina humana (obtenido en conejo o caballo) y se busca aglutinación (graduada 1+ a 4+).</li>
<li><strong>Indirecta</strong>: ¿hay anticuerpos <em>libres</em> en el plasma del paciente? Se enfrenta su suero contra eritrocitos de panel. Se usa en pruebas cruzadas y en embarazo (aloinmunización anti‑D; anticuerpos contra Kell, Duffy, Kidd).</li>
<li>Hasta ~1 de cada 1,000‑10,000 personas sanas (y más en hospitalizados) tienen Coombs directo positivo sin hemólisis: siempre se interpreta con las pruebas de hemólisis.</li></ul>
<div class="callout pearl"><p>En AHAI grave las pruebas cruzadas salen todas incompatibles (el autoanticuerpo reacciona contra todo). <strong>No se niega la transfusión</strong> si hay riesgo vital: se transfunde la unidad <strong>“menos incompatible”</strong>, ABO/Rh compatible, lento y vigilando. No se usa O negativo “por default”.</p></div>
<h3>Puntos del caso de clase</h3>
<ul><li>Mujer joven con infección respiratoria (posible <em>Mycoplasma</em>) y hemólisis grave: Hb 5.6, reticulocitos altos, BI 10, DHL 4,500, hemoglobinuria.</li>
<li>Si fuera varón con desencadenante oxidante, descartar <strong>G6PD</strong>.</li>
<li>Al alta: prednisona por la mañana (ritmo circadiano), <strong>reducción gradual</strong> en meses, ácido fólico.</li>
<li>Complicaciones del seguimiento: <strong>crisis aplásica</strong> (déficit de folato o parvovirus B19), <strong>insuficiencia suprarrenal</strong> por suspensión brusca del esteroide, efectos crónicos (Cushing, diabetes, hipertensión, osteoporosis).</li></ul>
<div class="callout fix"><p>La dosis estándar de inicio es <strong>prednisona 1 mg/kg/día</strong> (o metilprednisolona en pulsos en casos graves). “Hidrocortisona 10 mg/kg/día” no es un esquema habitual. Los anticuerpos fríos son IgM contra el antígeno <strong>I</strong> (Mycoplasma); los calientes son IgG.</p></div>
`});

topic({id:"aplasica",b:"II",title:"Anemia aplásica y HPN",short:"Congénitas, adquirida, criterios de Camitta y tratamiento",html:`
<p class="lead">Pancitopenia con <strong>médula hipocelular sustituida por grasa</strong>, sin infiltración ni fibrosis. Síndrome de falla medular: <strong>anémico + purpúrico (hemorrágico) + febril (infeccioso)</strong>.</p>
<div class="callout pearl"><p>Si además hay <strong>síndrome infiltrativo</strong> (adenomegalias, hepatoesplenomegalia, dolor óseo), piensa en <strong>leucemia</strong>, no en aplasia.</p></div>
<h3>Formas hereditarias</h3>
<div class="tbl"><table><tr><th>Síndrome</th><th>Defecto</th><th>Pistas</th></tr>
<tr><td><strong>Anemia de Fanconi</strong> (la más frecuente; AR)</td><td>Reparación del ADN (genes FANCA‑FANCW)</td><td>Pancitopenia progresiva (~7 años), talla baja, <strong>anomalías de pulgar/radio</strong>, manchas café con leche, malformaciones renales. Riesgo de LMA y carcinomas. <strong>Prueba de fragilidad cromosómica con diepoxibutano o mitomicina C</strong></td></tr>
<tr><td><strong>Diamond‑Blackfan</strong></td><td>Proteínas ribosomales</td><td><strong>Aplasia pura de serie roja</strong> en el primer año, macrocitosis, HbF ↑, pulgar trifalángico. Responde a esteroides</td></tr>
<tr><td><strong>Shwachman‑Diamond</strong></td><td>SBDS</td><td><strong>Insuficiencia pancreática exocrina</strong> (esteatorrea) + neutropenia; displasia metafisaria</td></tr>
<tr><td>Disqueratosis congénita</td><td>Telómeros</td><td>Uñas distróficas, leucoplasia, pigmentación reticular</td></tr>
<tr><td><strong>Kostmann</strong> (neutropenia congénita grave)</td><td>ELANE, HAX1</td><td>Neutrófilos &lt;200 desde el nacimiento, infecciones graves. Tratamiento: <strong>G‑CSF</strong>; TCPH si no responde</td></tr>
<tr><td>Disgenesia reticular</td><td>AK2</td><td>Agranulocitosis + inmunodeficiencia combinada grave + sordera</td></tr></table></div>
<div class="callout fix"><p>“Estren‑Demeshek” es el síndrome de <strong>Shwachman‑Diamond</strong>. En Kostmann no se “transfunde”: se da <strong>filgrastim</strong> (los neutrófilos transfundidos casi no se usan). En Fanconi el TCPH se recomienda antes de que aparezca SMD/LMA, idealmente en la infancia.</p></div>
<h3>Adquirida</h3>
<ul>
<li>~70% <strong>idiopática, autoinmune</strong>: linfocitos T citotóxicos (IFN‑γ, TNF, vía Fas/FasL) destruyen a las CMH.</li>
<li>Secundaria: fármacos (cloranfenicol, carbamazepina, sulfas, sales de oro), benceno, radiación, hepatitis seronegativa, EBV, VIH, embarazo.</li>
<li>Aplasia pura de serie roja adquirida: <strong>timoma</strong>, parvovirus B19 crónico, LLC de linfocitos granulares, autoinmune.</li>
<li>Diagnóstico: <strong>biopsia de hueso</strong> (no solo aspirado) que muestre celularidad &lt;25%, grasa y aumento relativo de linfocitos, plasmocitos y mastocitos, sin fibrosis ni blastos.</li>
</ul>
<h3>Gravedad (criterios de Camitta)</h3>
<div class="tbl"><table><tr><th>Categoría</th><th>Definición</th></tr>
<tr><td>Grave</td><td>Celularidad &lt;25% + 2 de: neutrófilos <strong>&lt;500</strong>, plaquetas <strong>&lt;20,000</strong>, reticulocitos absolutos &lt;20,000/µL (o &lt;1% corregido)</td></tr>
<tr><td>Muy grave</td><td>Lo anterior con neutrófilos <strong>&lt;200</strong></td></tr>
<tr><td>No grave (moderada)</td><td>Hipocelular sin cumplir criterios de grave</td></tr></table></div>
<div class="callout fix"><p>El umbral de plaquetas para aplasia grave es <strong>&lt;20,000</strong>, no &lt;50,000.</p></div>
<h3>Tratamiento</h3>
<ul><li><strong>Grave o muy grave, &lt;40‑50 años con hermano HLA idéntico</strong>: TCPH alogénico (curativo).</li>
<li>Sin donador o mayor: <strong>globulina antitimocito (ATG de caballo) + ciclosporina + eltrombopag</strong> (respuesta ~80‑90%).</li>
<li>No grave: ciclosporina ± eltrombopag; observar.</li>
<li>Soporte: transfusiones leucorreducidas e irradiadas, <strong>nunca de familiares</strong> (sensibilizan contra el donador potencial); minimizar transfusiones por la sobrecarga de hierro; profilaxis antimicrobiana.</li></ul>
<h3>Hemoglobinuria paroxística nocturna (HPN)</h3>
<ul>
<li>Mutación adquirida de <strong>PIG‑A</strong> (cromosoma X) en una CMH: no se forma el anclaje GPI, faltan <strong>CD55 (DAF) y CD59 (MIRL)</strong> en la membrana y el complemento lisa a las células.</li>
<li>Tríada: <strong>hemólisis intravascular</strong> (orina oscura matutina), <strong>trombosis en sitios atípicos</strong> (Budd‑Chiari, venas mesentéricas, cerebrales) y <strong>falla medular</strong>.</li>
<li>Diagnóstico: <strong>citometría de flujo</strong> (ausencia de CD55/CD59, FLAER).</li>
<li>Tratamiento: <strong>eculizumab o ravulizumab</strong> (anti‑C5); iptacopan (inhibidor de factor B, oral); TCPH. Anticoagular si hay trombosis.</li>
<li>Clonas HPN aparecen en 20‑40% de las aplasias adquiridas.</li>
</ul>
<div class="callout fix"><p>CD55 y CD59 están <strong>ancladas</strong> a la membrana por GPI (no son solubles). En apoptosis, la caspasa 8 inicia la vía <strong>extrínseca</strong> (Fas), la caspasa 9 la <strong>intrínseca</strong> (mitocondrial, con citocromo c) y la caspasa 3 es la <strong>ejecutora</strong>. La fosfatidilserina expuesta es la señal de “cómeme”; se detecta con <strong>anexina V</strong>.</p></div>
`});

topic({id:"lla",b:"III",title:"Leucemias agudas y LLA",short:"Concepto, inmunofenotipo, citogenética y fases del tratamiento",html:`
<p class="lead">Expansión clonal de <strong>blastos</strong> que bloquea la médula. Aguda = predominan células inmaduras; crónica = células maduras, independientemente del tiempo de evolución.</p>
<ul>
<li>Diagnóstico: <strong>≥ 20% de blastos</strong> en sangre o médula (OMS). Algunas LMA con alteraciones genéticas definitorias (t(15;17), t(8;21), inv(16), NPM1…) se diagnostican con menos.</li>
<li>Linaje: <strong>inmunofenotipo por citometría de flujo</strong>. Pronóstico: cariotipo, FISH, PCR y secuenciación.</li>
<li>Clínica: falla medular (anemia, sangrado, fiebre/infecciones) + infiltración (adenomegalias, hepatoesplenomegalia, <strong>dolor óseo</strong>, SNC, testículo, encías).</li>
</ul>
<div class="callout fix"><p>El corte diagnóstico es <strong>≥ 20%</strong> de blastos (en tus notas: “más de 10%”). En la clasificación ICC 2022 el corte baja a ≥10% para algunas LMA con alteraciones recurrentes, y entre 10‑19% se habla de SMD/LMA.</p></div>
<h3>LLA</h3>
<ul><li>La neoplasia más frecuente de la infancia (pico 2‑5 años). México tiene de las incidencias más altas del mundo, con peor pronóstico en población hispana.</li>
<li>FAB histórico: L1 (pequeños homogéneos), L2 (grandes heterogéneos), L3 (tipo Burkitt, vacuolados). Hoy se clasifica por inmunofenotipo y genética (OMS 2022 / ICC).</li></ul>
<div class="tbl"><table><tr><th>Linaje</th><th>Frecuencia</th><th>Marcadores</th></tr>
<tr><td>Precursores B</td><td>~80‑85%</td><td>CD19, CD22, CD79a, CD10 (CALLA), TdT, CD34</td></tr>
<tr><td>T</td><td>~15‑20%</td><td><strong>CD3 citoplasmático</strong> (definitorio), CD7, CD5, CD2, CD1a, TdT. Masa mediastinal, adolescente varón, hiperleucocitosis</td></tr></table></div>
<h3>Factores pronósticos</h3>
<div class="tbl"><table><tr><th>Favorables</th><th>Desfavorables</th></tr>
<tr><td>Edad 1‑9 años<br>Leucocitos &lt;50,000<br><strong>Hiperdiploidía alta (51‑65 cromosomas)</strong><br><strong>t(12;21) ETV6‑RUNX1</strong> (TEL‑AML1)<br>Enfermedad mínima residual negativa al final de la inducción</td>
<td>&lt;1 año o ≥10 años; leucocitos ≥50,000<br><strong>Hipodiploidía</strong> (&lt;44)<br><strong>t(9;22) BCR‑ABL1</strong> (Filadelfia, p190): ~3% niños, ~25‑30% adultos<br><strong>KMT2A (MLL) 11q23</strong>, p. ej. t(4;11) en lactantes<br>Ph‑like, deleción de <strong>IKZF1</strong>, alteraciones de TP53<br>EMR positiva, infiltración a SNC</td></tr></table></div>
