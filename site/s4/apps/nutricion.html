<style>
/* Layout: etiqueta nutrimental como motivo; barra de pestañas fija, una columna de lectura (~720px) */
:root{
  --bg:#f5f7f2; --surface:#ffffff; --ink:#151a14; --muted:#5b6658; --rule:#151a14; --line:#d9dfd4;
  --accent:#2e6b3a; --accent-soft:#e1eedf; --mark:#ffe58a; --mark-ink:#4a3a00;
  --good:#2e7d32; --bad:#b3261e; --good-soft:#e3f2e4; --bad-soft:#fbe5e3;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101410; --surface:#181e18; --ink:#e8eee5; --muted:#9aa697; --rule:#e8eee5; --line:#2c352b;
  --accent:#7cc48a; --accent-soft:#1f3322; --mark:#5a4a12; --mark-ink:#ffe9a8;
  --good:#7cc48a; --bad:#f08b82; --good-soft:#1c3320; --bad-soft:#3a1e1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101410; --surface:#181e18; --ink:#e8eee5; --muted:#9aa697; --rule:#e8eee5; --line:#2c352b;
  --accent:#7cc48a; --accent-soft:#1f3322; --mark:#5a4a12; --mark-ink:#ffe9a8;
  --good:#7cc48a; --bad:#f08b82; --good-soft:#1c3320; --bad-soft:#3a1e1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
header.top{display:grid;gap:6px;padding-bottom:14px;border-bottom:10px solid var(--rule)}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:clamp(40px,9vw,64px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:14px}
.filters .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.legend{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
mark,.ex{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:3px;font-weight:700}
.ex{font-size:11px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

/* Resúmenes: tarjetas tipo etiqueta nutrimental */
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-bottom:18px}
.toc a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.toc a:hover{border-bottom-color:currentColor}
.label{background:var(--surface);border:2px solid var(--rule);padding:14px 16px 16px;margin-bottom:22px;scroll-margin-top:70px}
.label h2{font-family:var(--f-display);font-weight:900;font-stretch:75%;font-size:30px;line-height:1;margin:0 0 4px;text-wrap:balance}
.label .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);border-bottom:8px solid var(--rule);padding-bottom:6px;margin-bottom:4px;flex-wrap:wrap}
.label h3{font-family:var(--f-display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px;padding-top:6px;border-top:4px solid var(--rule)}
.label ul{list-style:none;margin:0;padding:0}
.label li{padding:6px 0;border-bottom:1px solid var(--line)}
.label li:last-child{border-bottom:0}
.label b{font-weight:700}
.note{font-size:13px;color:var(--muted);font-style:italic}
.tablewrap{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--rule)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Flashcards */
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1 1 160px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{perspective:1200px;cursor:pointer;margin-bottom:14px}
.card-inner{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:2px solid var(--rule);padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.face.back{transform:rotateY(180deg);border-color:var(--accent)}
.face .k{font-family:var(--f-display);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.face .q{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:clamp(20px,4.6vw,26px);line-height:1.2;text-wrap:balance}
.face .a{font-size:17px;line-height:1.5}
.face .hint{font-size:12px;color:var(--muted);margin-top:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase;border:2px solid var(--rule);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:6px;cursor:pointer;flex:1 1 auto}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.small{flex:0 0 auto;padding:6px 10px;font-size:12px}

/* Quiz */
.qbox{background:var(--surface);border:2px solid var(--rule);padding:18px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qtext{font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:clamp(19px,4.2vw,23px);line-height:1.25;margin:8px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 13px;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:var(--f-display);font-weight:800;color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:15px}
.score{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.missed li{margin-bottom:10px}

/* Calculadora */
.calc{background:var(--surface);border:2px solid var(--rule);padding:16px;display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.out{border-top:8px solid var(--rule);padding-top:8px}
.out .line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.out .line.big{font-family:var(--f-display);font-weight:900;font-size:22px;border-bottom:4px solid var(--rule)}
.out .line span:first-child{min-width:0}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);overflow-x:auto}
section[hidden]{display:none}
@media (prefers-reduced-motion: reduce){.card-inner,.progress>i{transition:none}}
</style>

{id:"etapas",b:1,t:"Requerimientos por etapa de la vida y cálculo energético",s:[
 ["Niñez y adolescencia",[
  "Toddlers 1–3 años; preescolares 3–5 años.",
  "<b>1–3 años</b>: +230 g y +1 cm por mes. Ración = 1 cucharada por año de edad. No forzar; evitar uvas y nueces (atragantamiento).",
  "<b>3–5 años</b>: +2 kg y +7 cm por año. Ya usan tenedor y cuchara. <b>Neofobia alimentaria</b> = miedo a platillos nuevos.",
  "<b>Escolar 5–10 años</b>: +3 a 3.5 kg y +6 cm por año. 50% de niños de 6–8 años tiene caries; grasas y proteínas protegen el esmalte. Nunca dar menos que su GEB. La fórmula de Schofield (pediatría) no entra al examen.",
  "Preadolescencia: 9–11 años niñas, 10–12 niños (escala de Tanner). Brote puberal con ↑ grasa en niñas.",
  "Pubertad y adolescencia: proteína <b>0.85 g/kg/día</b>; HCO 45–65%; lípidos 25–35%.",
  "Adulto sano: HCO 60%, proteína 15%, lípidos 25%. Kcal por gramo: HCO 4, proteína 4, lípidos 9."]],
 ["Gasto energético en el adulto",[
  "Adultez temprana 20–39; mediana edad 40–49; generación sándwich 50–59.",
  "<b>GET = GEB (TMB) + ETA + actividad física</b>. ETA = efecto termogénico de los alimentos ≈ <b>10%</b>.",
  "Actividad física = cualquier movimiento que sube el gasto en reposo; ejercicio = con tiempo, modo e intensidad; deporte = tiene reglas.",
  "Factores de actividad: sedentario 1.1 · ligero 1.2 · moderado 1.3 · activo 1.4 · muy activo 1.5.",
  "Recomendación: mínimo <b>150 min/semana</b> de actividad aeróbica moderada + fortalecimiento muscular 2 o más días.",
  "<b>Balance energético</b>: relación entre lo que se consume y lo que se gasta. Positivo = se consume más de lo que se gasta (superávit); negativo = se gasta más de lo que se consume.",
  "Dormir bien: la grelina baja y la leptina sube."]],
 ["Distribución de macros en el adulto",[
  "Proteína: 0.8–1.4 g/kg de peso actual (10–35%).",
  "HCO: mínimo <b>130 g/día</b> para el cerebro (45–60%).",
  "Lípidos: 20–35%."]]

{id:"embarazo",b:1,t:"Alimentación en el embarazo",s:[
 ["Periodos",[
  "Periconcepcional: semana −4 a 4. Embrión: semanas 0–8. Feto: semanas 8–40. Perinatal: semana 20–24 de gestación hasta 7–28 días después del nacimiento. Término: semana 40."]],
 ["Cambios fisiológicos",[
  "Consumo: ↑ apetito, ↑ sed, cambios en gusto y olfato.",
  "Gastrointestinales: tránsito más lento, acidez, estreñimiento, <b>náusea 70%</b> y <b>vómito 40%</b>.",
  "Renales: ↑ filtración glomerular 50–60%, retención de sodio (edema), ↑ eliminación urinaria de micronutrimentos, ↑ riesgo de IVU.",
  "↑ TMB en la segunda mitad del embarazo y ↑ temperatura. Después del parto solo se quedan la grasa y el útero."]],
 ["Requerimientos",[
  "Energía: <b>+150 kcal/día</b> en el 1.er trimestre; <b>+340 a 450 kcal/día</b> en el 2.º y 3.º.",
  "Proteína mínimo <b>71 g/día</b> (10–35%). HCO mínimo <b>175 g/día</b> por el cerebro fetal (45–65%). Lípidos 20–35%.",
  "Folato <b>600 µg/día</b>, de los cuales 400 µg son ácido fólico. EPA + DHA 300 mg/día. Fibra 28 g/día. 9 tazas de líquidos.",
  "Sal al gusto; sin alcohol; café limitado (≤4 tazas según tus notas). Todos los nutrimentos vienen de la dieta, con la posible excepción del <b>hierro</b>.",
  "Cuidado con suplementar <b>vitamina A</b>: es <b>teratogénica</b>."]]

{id:"macros",b:1,t:"Adulto mayor, alimentos y macronutrimentos",s:[
 ["Adulto mayor",[
  "Factores de riesgo de desnutrición: hambre, pobreza, ingesta inadecuada, discapacidad, aislamiento, vivir solo, depresión, demencia, dependencia, mala dentición, problemas para masticar o deglutir, enfermedades crónicas, polifarmacia y edad avanzada.",
  "No hay un requerimiento ni una distribución específica; a mayor edad, menor requerimiento de energía.",
  "La filtración glomerular disminuye <b>10% cada 10 años</b> a partir de los 30."]],
 ["Alimentos",[
  "Alimento: producto natural o transformado que aporta energía y estructuras químicas para los procesos biológicos, y que además debe apetecer.",
  "<b>Alimento sano</b>: sin sustancias tóxicas ni patógenos (inocuo). <b>Saludable</b>: sin sustancias que, consumidas con frecuencia, aumenten el riesgo de enfermedad crónica. <b>Para la salud</b>: contiene algo con acción preventiva (sin gluten, bajo en FODMAP, IG bajo).",
  "Propiedades nutrimentales y funcionales (organolépticas: color, olor, textura, sabor; tecnológicas; saludables = inocuidad).",
  "Macronutrimentos: se necesitan en grandes cantidades (HCO, proteínas, lípidos). Micronutrimentos: dosis generalmente &lt;1 g (vitaminas y minerales). 1 kcal = 1000 cal."]],
 ["Hidratos de carbono",[
  "Principal fuente de energía; mínimo 130 g/día; 4 kcal/g.",
  "Monosacáridos: glucosa, fructosa, galactosa.",
  "Disacáridos: <b>lactosa</b> = galactosa + glucosa · <b>sacarosa</b> = glucosa + fructosa · <b>maltosa</b> = glucosa + glucosa · <b>lactulosa</b> = galactosa + fructosa.",
  "Complejos (polisacáridos): almidón y fibra; absorción lenta. La fibra resiste la digestión, se fermenta en el colon y regula colesterol y glucemia."]],
 ["Proteínas",[
  "Función principal: <b>estructural</b>; también enzimas, hormonas, anticuerpos, coagulación y transporte. 4 kcal/g (en tus notas aparece 3; en los cálculos usaste 4).",
  "9 aminoácidos esenciales: fenilalanina, histidina, leucina, isoleucina, treonina, valina, lisina, metionina, triptófano. Mnemotecnia: “<i>Fer Hizo un Lío Tremendo y Valentina le Metió un Triptófano</i>”.",
  "Alto valor biológico: tienen todos los esenciales (leche, clara de huevo, carnes rojas). Bajo valor biológico: vegetales, excepto la <b>soya (0.99)</b>.",
  "Cereales son deficitarios en <b>lisina</b> y leguminosas en <b>metionina</b>: se combinan (más vitamina C para el hierro no hem)."]],
 ["Lípidos",[
  "Reserva de energía; 9 kcal/g; membranas, vitaminas liposolubles y hormonas.",
  "Saturadas: sólidas a temperatura ambiente; origen animal, palma y coco. Insaturadas: monoinsaturadas (oliva, frutos secos) y poliinsaturadas (omega 3 y 6, esenciales).",
  "Omega 3 (ALA, EPA, DHA): ↓ triglicéridos, ↓ ateroma, ↓ presión. Fuentes: salmón, atún, trucha, sardina; linaza, chía, nueces, canola.",
  "Omega 6: ácido linoleico (aceites vegetales) y araquidónico (origen animal). En exceso puede elevar triglicéridos.",
  "Colesterol: membranas, hormonas y vitamina D. La fibra disminuye su absorción y la lecitina la aumenta.",
  "Resumen: HCO = energía · proteína = estructura · lípidos = reserva."]]

{id:"micro",b:1,t:"Micronutrimentos",s:[
 ["Vitaminas (micronutrimentos orgánicos)",[
  "<b>Hidrosolubles</b> (complejo B y C): no se almacenan, el exceso se elimina por orina; deben consumirse con mayor frecuencia.",
  "<b>Vitamina C</b>: antioxidante, cicatrización, <b>absorción de hierro</b>, colágeno y vasos sanguíneos. Cítricos y verduras.",
  "<b>Liposolubles</b>: A, D, E, K.",
  "<b>Vitamina A</b> (ácido retinoico): visión nocturna, dientes, huesos y piel. Origen animal; en vegetales como betacaroteno (hojas verdes, amarillos y naranjas).",
  "<b>Vitamina E</b> (tocoferol): antioxidante, sistema inmune, glóbulos rojos, protección cardiovascular.",
  "<b>Vitamina D</b> (colecalciferol): absorción de calcio, sistema inmune; se sintetiza en la piel con el sol."]],
 ["Minerales (micronutrimentos inorgánicos)",[
  "No aportan energía; indispensables sobre todo en los primeros 1000 días de vida.",
  "<b>Calcio</b>: huesos, dientes, músculos, sistema nervioso; lácteos, espinaca, maíz nixtamalizado.",
  "<b>Hierro</b>: transporte de oxígeno. <b>Hem</b> = origen animal; <b>no hem</b> = origen vegetal.",
  "<b>Zinc</b>: función cerebral, respuesta al estrés, maduración sexual. <b>Yodo</b>: hormonas tiroideas y desarrollo cerebral (sal yodada, atún, bacalao).",
  "<b>Potasio</b>: hidratación, contracción muscular (plátano, jitomate, papa, kiwi). <b>Flúor</b>: huesos y esmalte. <b>Sodio</b>: hidratación, circulación, nervios.",
  "<b>Cobre</b>: formación de células sanguíneas y sistema nervioso. <b>Magnesio</b>: huesos, corazón, síntesis de proteínas, transmisión nerviosa."]]

 ["Nombre químico de la vitamina D","Colecalciferol."],

{id:"deficiencias",b:2,t:"Deficiencias, nutracéuticos, grupos de alimentos y SMAE",s:[
 ["Signos de deficiencia",[
  "<b>Hierro</b>: anemia, fatiga, mareo, cefalea, palpitaciones, palidez de conjuntiva, lengua y lecho ungueal.",
  "<b>Yodo</b>: bocio y cretinismo (sordomudez y retraso mental).",
  "<b>Vitamina A</b>: ceguera nocturna, xerosis conjuntival, <b>manchas de Bitot</b>, xerosis corneal, queratomalacia, xeroftalmia, hiperqueratosis folicular.",
  "<b>Tiamina (B1)</b>: <b>beriberi</b> (edema de piernas y cara, palpitaciones, dolor de pecho, disnea, ingurgitación yugular). Formas seca e infantil.",
  "<b>Niacina (B3)</b>: <b>pelagra</b>. <b>Vitamina D</b>: raquitismo en niños, osteomalacia en adultos. <b>Vitamina C</b>: escorbuto.",
  "<b>Riboflavina (B2)</b>: arriboflavinosis: estomatitis angular, queilosis, glositis, lengua magenta.",
  "<b>Zinc</b>: retraso del crecimiento, poco apetito, alteración del gusto. <b>Flúor</b> (exceso): fluorosis, dientes jaspeados.",
  "<b>Kwashiorkor</b>: desnutrición proteica (niño pálido, apático, con anemia leve y edema). <b>Marasmo</b>: déficit de energía total, con emaciación sin edema <span class='note'>(definición estándar; en tus notas quedó pendiente, revísala en el ABC de la nutrición)</span>."]],
 ["Nutracéuticos",[
  "Alimento o parte de él que da beneficios médicos, incluida la prevención o tratamiento de enfermedades (DM, ECV, HTA). Origen natural, bioactivos y con estudios reproducibles.",
  "Fitoesteroles → corazón · fibra soluble → intestino · flavonoides, antocianinas y resveratrol → envejecimiento y estrés oxidativo · carotenoides → vista · ácido fólico → cierre del tubo neural · omega 3 → cerebro y corazón · isoflavonas → síntomas de menopausia."]],

{id:"tiempos",b:2,t:"Tiempos de comida y dieta correcta",s:[
 ["Distribución ideal de calorías",[
  "Desayuno <b>25%</b> · colación <b>10%</b> · comida <b>30%</b> · colación <b>10%</b> · cena <b>25%</b>.",
  "Desayuno: comida principal; al menos 3 grupos de alimentos.",

  "Comida: el tiempo más completo; todos los grupos.",
  "Cena: sencilla, 2–3 horas antes de dormir."]],

{id:"compartimentos",b:2,t:"Compartimentos corporales e hidratación",s:[
 ["Composición corporal",[
  "Estado dinámico; cambia por estímulos internos (hormonas, enfermedad) y externos (alimentos, clima, actividad física, estrés).",
  "<b>MCT = masa grasa + masa libre de grasa</b>. En nutrición se divide en tejido adiposo, músculo esquelético, hueso y otros tejidos/vísceras.",
  "Los cambios se ven: <b>agua</b> al día, <b>grasa</b> a las 2 semanas, <b>músculo</b> al mes.",
  "El aparato digestivo mide aproximadamente 9 m, de boca a ano."]],
 ["Agua corporal",[
  "El agua corporal total está solo en la masa libre de grasa. En adultos de 17–35 años: <b>mujeres 55%</b> y <b>hombres 60%</b> del peso.",
  "Euhidratación = balance; deshidratación = pérdida; rehidratación = ganancia; hiperhidratación = exceso.",
  "La <b>hormona antidiurética</b> regula el agua eliminada y la sed.",
  "Requerimiento de líquidos: 0–30 años <b>40 ml/kg</b> · 31–55 <b>35 ml/kg</b> · 56–65 <b>30 ml/kg</b> · &gt;65 <b>25 ml/kg</b>. En renales: orina + 500 ml."]],
 ["Seed cycling",[
  "Los lignanos son fitoestrógenos: mejoran sensibilidad a la insulina, hirsutismo, testosterona y regularidad menstrual.",
  "Zinc: cofactor de hormonas reproductivas y gonadotropinas. Vitamina E: prepara el endometrio. Selenio: antioxidante y función tiroidea.",
  "Semillas crudas, bien masticadas; no se sustituyen por otras. Si hay sensibilidad a una, se duplica la compañera de esa fase."]]
],fc:[
 ["Masa corporal total =","Masa grasa + masa libre de grasa."],
 ["¿Cuándo se ven los cambios de agua, grasa y músculo?","Agua al día, grasa a las 2 semanas, músculo al mes."],
 ["% de agua corporal en mujer y hombre (17–35 años)","Mujer 55%, hombre 60%."],
 ["Requerimiento de líquidos de 31 a 55 años","35 ml/kg."],
 ["Requerimiento de líquidos en mayores de 65","25 ml/kg."],
 ["Hormona que regula el agua eliminada y la sed","Hormona antidiurética (ADH)."]
],qz:[
 ["El agua corporal total se encuentra en:",["La masa grasa","La masa libre de grasa","Solo en la sangre","Por igual en ambas"],1,"Por eso la fórmula solo aplica longitudinalmente en adultos."],
 ["Paciente de 45 años y 70 kg. ¿Requerimiento de líquidos?",["2,800 ml","2,450 ml","2,100 ml","1,750 ml"],1,"31–55 años = 35 ml/kg → 70 × 35 = 2,450 ml."],
 ["Los cambios en la masa muscular se observan en:",["Un día","Dos semanas","Un mes","Seis meses"],2,"Agua al día, grasa a las 2 semanas."]
]},

{id:"pan",b:2,t:"PAN, interacción fármaco-nutrimento y evaluación dietética",s:[
 ["Proceso de Atención Nutricional",[
  "NUBE = nutrición basada en la evidencia.",
  "PAN (definición de la AND): método sistemático de resolución de problemas, basado en el pensamiento crítico y la evidencia, para dar atención nutricional de calidad.",
  "Inicia con el <b>tamizaje</b> (identifica pacientes en riesgo) y termina con los resultados.",
  "4 pasos: <b>1. Valoración</b> nutricional → <b>2. Diagnóstico</b> nutricional (formato <b>PES</b>: Problema, Etiología, Signos y síntomas) → <b>3. Intervención</b> → <b>4. Monitoreo y seguimiento</b>.",
  "Valoración: recoger, verificar e interpretar sistemáticamente la información como base para diagnóstico e intervención."]],
 ["SOAP",[
  "<b>S</b> (subjetivo): lo que dice el paciente o cuidador: motivo de consulta, antecedentes heredofamiliares y personales, medicamentos, antecedentes sociales, síntomas.",
  "<b>O</b> (objetivo): ABCD del estado de nutrición. <b>A</b>ntropometría (edad, talla, peso, perímetro cefálico; indicadores IMC 25, índice cintura-cadera 0.90, circunferencia abdominal), <b>B</b>ioquímica (laboratorios), <b>C</b>línica (signos vitales, glucosa capilar, cirugías, transfusiones, alergias, intolerancias, medicamentos).",
  "Estado de nutrición: condición resultante de la ingestión de alimentos y su utilización biológica; refleja si se cubrieron las necesidades."]],
 ["Fármacos y evaluación dietética",[
  "<b>Interacción fármaco-nutrimento</b>: cuando un fármaco se ve afectado por un alimento o nutrimento. Depende de la fisiología, la dieta, el estado de nutrición y el principio activo y la forma farmacéutica.",
  "La <b>toronja</b> inhibe el metabolismo de fármacos. Farmacodinamia = efecto del fármaco sobre el cuerpo.",
  "<b>Evaluación dietética</b>: detecta riesgos de la alimentación; requiere un entrevistador entrenado y metodología estandarizada; no omitir guarniciones.",
  "<b>Recordatorio de 24 h</b>: preguntar todo lo que comió y bebió el día previo. Porcentaje de adecuación <b>&lt;90% = deficiente</b>."]]
],fc:[
 ["4 pasos del PAN","Valoración, diagnóstico, intervención y monitoreo/seguimiento."],
 ["¿Con qué inicia el PAN?","Con el tamizaje."],
 ["¿Qué significa PES?","Problema, Etiología, Signos y síntomas (formato del diagnóstico nutricional)."],
 ["¿Qué va en la S de SOAP?","Lo subjetivo: lo que refiere el paciente o cuidador (motivo de consulta, antecedentes, medicamentos, síntomas)."],
 ["ABCD de la evaluación del estado de nutrición","Antropometría, bioquímica, clínica y dietética."],
 ["¿Qué es el recordatorio de 24 h?","Preguntar todo lo que el paciente comió y bebió el día previo."],
 ["% de adecuación deficiente","Menos de 90%."],
 ["Fruta que inhibe el metabolismo de fármacos","Toronja."]
],qz:[
 ["El diagnóstico nutricional se redacta en formato:",["SOAP","PES","ABCD","NUBE"],1,"Problema, Etiología, Signos y síntomas."],
 ["El segundo paso del PAN es:",["Valoración","Diagnóstico","Intervención","Monitoreo"],1,"Valoración → diagnóstico → intervención → monitoreo."],
 ["Los antecedentes heredofamiliares van en la sección:",["S","O","A","P"],0,"Es información que proporciona el paciente."],
 ["Un porcentaje de adecuación del 80% en el R24 h se considera:",["Adecuado","Deficiente","Excesivo","No interpretable"],1,"Menos de 90% es deficiente."],
 ["La interacción fármaco-nutrimento ocurre cuando:",["El fármaco se ve afectado por un alimento o nutrimento","El paciente no toma su medicamento","El fármaco actúa sobre el cuerpo","Se suplementan vitaminas"],0,"El efecto del fármaco sobre el cuerpo es la farmacodinamia."]
]},

{id:"enfermedades",b:2,t:"Enfermedades relacionadas con la alimentación",s:[
 ["Enfermedad renal crónica",[
  "Acumulación de urea y nitrógeno. Diagnóstico con tasa de filtración glomerular y creatinina; se clasifica con la tabla <b>KDIGO</b>.",
  "Energía: prediálisis &lt;60 años 35 kcal/kg/día; &gt;60 años 30–35 kcal/kg/día. HCO 50–60%; lípidos ≤30%.",
  "Proteína: estadios 1–3 12–15% del VET; estadio 4 &lt;10%; prediálisis 0.6 g/kg/día (o menos con cetoanálogos).",
  "Líquidos: <b>orina + 500 ml</b>. Sodio ≤2.3 g/día; fósforo 1.7 g/día (E1–2); potasio &lt;4 g/día (E1–2); calcio &lt;2000 mg/día."]],
 ["Hígado",[
  "<b>Encefalopatía hepática</b>: por cortocircuito portosistémico; la desencadenan sangrado GI, electrolitos, insuficiencia renal, infecciones, diuréticos, sedantes. Suspender vía oral 24–48 h con glucosa IV; proteína desde 0.5 g/kg/día y subir a 1–1.5 g/kg/día con peso euvolémico.",
  "<b>Cirrosis</b>: hipercalórica (50–75% sobre el GET si hay malabsorción); proteína 1–1.5 g/kg/día (vegetal y de leche se toleran mejor); incluir omega 3; controlar HCO si hay hiperglucemia."]],
 ["Obesidad",[
  "Enfermedad crónica basada en adiposidad, multifactorial y recurrente.",
  "Hipocalórica: <b>−250 a −500 kcal</b> del R24 h. HCO 35–50%; lípidos 25–35%; proteína 25–35%; fibra 25–35 g; líquidos 30 ml/kg.",
  EX+" <b>1 kg de grasa = 7000 kcal</b>.",
  "Preferir bajo índice glucémico (velocidad con la que un alimento libera glucosa a la sangre) y baja densidad energética."]],
 ["Hipertensión arterial",[
  "PA ≥140/90 mmHg. Síntomas: cefalea, visión alterada, disnea, epistaxis, dolor torácico, mareo.",
  "<b>Dieta DASH</b>: sodio <b>&lt;1500 mg/día</b>, omega 3 adecuado, evitar empaquetados; 50% de la dieta con cereales integrales, frutas, verduras y leguminosas. El patrón mediterráneo también ayuda."]],
 ["Intestino",[
  "<b>Síndrome de intestino irritable</b>: trastorno funcional (15% de la población occidental) con alteración del eje intestino-cerebro. Dieta <b>baja en FODMAP</b> (oligo-, di-, monosacáridos y polioles fermentables) 1 mes con reintroducción a tolerancia. Líquidos 30–35 ml/kg.",
  "<b>Enfermedad celíaca</b>: reacción inmune al gluten con atrofia de vellosidades. Hipercalórica 30–45 kcal/kg/día; proteína 1–2 g/kg/día; fibra a tolerancia (cocer frutas y verduras); suplementar vitaminas y zinc, hierro, calcio y magnesio. Evitar trigo, avena, centeno y cebada; vigilar la lactosa."]],
 ["Dislipidemia y diabetes",[
  "<b>Dislipidemia</b>: 30 kcal/kg; proteína 15% (0.8–1.2 g/kg); HCO 55%; lípidos 30% (énfasis en mono, poliinsaturados y omega 3); saturadas y colesterol &lt;10%; fibra 25 g.",
  "<b>Diabetes tipo 2</b>: HCO 45–65%; fibra 25–30 g/día; proteína 15–20% (0.8 g/kg si hay nefropatía); lípidos 25–35%.",
  "<b>Equitatividad</b> = misma cantidad de HCO en cada comida (no más de 3 porciones por comida). <b>Consistencia</b> = mismos intervalos de tiempo entre comidas.",
  "Orden al comer: primero fibra, luego proteínas y grasas, y al final HCO simples."]]
],fc:[
 ["Líquidos en enfermedad renal crónica","Orina + 500 ml."],
 ["Proteína en prediálisis","0.6 g/kg/día (o menos con cetoanálogos)."],
 ["Tabla para clasificar la ERC","KDIGO."],
 ["Manejo inicial de la encefalopatía hepática","Suspender vía oral 24–48 h con glucosa IV; proteína 0.5 g/kg/día y subir a 1–1.5."],
 ["Déficit calórico en obesidad","−250 a −500 kcal del recordatorio de 24 h."],
 ["¿Cuántas kcal tiene 1 kg de grasa?","7000 kcal.",1],
 ["Sodio en la dieta DASH","Menos de 1500 mg/día."],
 ["¿Qué significa FODMAP?","Oligosacáridos, disacáridos, monosacáridos y polioles fermentables."],
 ["Energía en enfermedad celíaca","30–45 kcal/kg/día (hipercalórica)."],

{id:"hospital",b:2,t:"Dietas hospitalarias progresivas",s:[
 ["Progresión por consistencia",[
  "<b>Líquidos claros</b>: entre el ayuno y el inicio de la alimentación; solo <b>12–48 h</b>; <b>400–600 kcal</b>, casi todo HCO; 3–5 tomas. Indicada en pre y posoperatorio, colonoscopia, estudios que requieren poco material fecal, procesos GI agudos y diarrea aguda. Permitidos: té, agua, gelatina de agua, jugo de manzana o uva, nieve de limón, atole con agua, consomé desgrasado.",
  "<b>Líquidos generales</b>: intermedia entre claros y blanda; todo líquido; <b>1500–1800 kcal</b>. Para problemas de masticación, trauma de mandíbula o inflamación GI. Deficiente en <b>B3, B9 y hierro</b>: suplementar si dura más de 2 semanas. Usar deslactosados si hay intolerancia.",
  "<b>Semisólida</b>: papilla o puré; pacientes que no pueden masticar pero sí tragar (problemas esofágicos, niños pequeños, adultos mayores sin piezas dentales).",
  "<b>Suave</b>: sólidos de consistencia suave; cirugía de cabeza y cuello, problemas dentales, de masticación o deglución, <b>várices esofágicas</b>; 6 comidas pequeñas; cubre todas las necesidades.",
  "<b>Blanda</b>: poca grasa, especias y condimentos; para procesos inflamatorios GI (úlcera, gastritis, colitis). Preparaciones a la plancha, hervidas, estofadas, asadas o al horno; excluir chiles y pimienta.",
  "<b>Astringente</b>: diarrea, diverticulitis, secuelas de resección GI. Solo <b>24 h</b> (más tiempo causa estreñimiento intenso). Baja en fibra insoluble y grasa, sin lactosa, sin irritantes y sin crucíferas; 6 tiempos; HCO 60 / proteína 15 / lípidos 25.",
  "<b>Normal</b>: para pacientes sin restricción; cumple la dieta correcta."]]
],fc:[
 ["Duración y aporte de la dieta de líquidos claros","12–48 h; 400–600 kcal."],
 ["Alimentos permitidos en líquidos claros","Té, agua, gelatina de agua, jugo de manzana o uva, nieve de limón, atole con agua, consomé desgrasado."],
 ["Aporte de la dieta de líquidos generales","1500–1800 kcal."],
 ["¿En qué es deficiente la dieta de líquidos generales?","Vitamina B3, B9 (folato) y hierro; suplementar si pasa de 2 semanas."],
 ["¿Para quién es la dieta semisólida?","Pacientes que no pueden masticar pero sí tragar."],
 ["Dieta indicada en várices esofágicas","Dieta suave."],
 ["Dieta para gastritis, úlcera o colitis","Dieta blanda."],
 ["¿Cuánto dura la dieta astringente y por qué?","24 h; si se prolonga causa estreñimiento intenso."]
],qz:[
 ["Dieta indicada antes de una colonoscopia:",["Líquidos claros","Blanda","Astringente","Suave"],0,"Aporta líquidos y electrolitos con muy poco residuo."],
 ["La dieta de líquidos generales es deficiente en:",["Vitamina C y calcio","B3, B9 y hierro","Proteína y sodio","Vitamina A y zinc"],1,"Se suplementa si dura más de 2 semanas."],
 ["Paciente con diarrea. ¿Qué dieta y por cuánto tiempo?",["Blanda por 1 semana","Astringente por 24 h","Líquidos generales por 2 semanas","Suave por 48 h"],1,"Más de 24 h causa estreñimiento intenso."],
 ["¿Qué se excluye en la dieta astringente?",["Arroz","Crucíferas y lactosa","Manzana cocida","Pollo hervido"],1,"También fibra insoluble, grasa e irritantes."],
 ["Aporte calórico de la dieta de líquidos claros:",["400–600 kcal","1,000–1,200 kcal","1,500–1,800 kcal","2,000 kcal"],0,"Por eso solo se usa 12–48 h."]
]},

{id:"enteral",b:2,t:"Nutrición enteral",s:[
 ["Indicaciones",[
  "Pacientes que no alcanzan su requerimiento por vía oral o tienen imposibilitada la vía natural.",
  "Puede durar meses, excepto la <b>sonda nasogástrica: máximo 15 días</b>.",
  "Es nutrimentalmente completa: vía oral (fórmulas poliméricas estándar), artesanal, o por sonda al estómago, duodeno o yeyuno. Hay fórmulas poliméricas, semielementales y específicas por patología.",
  "Siempre que sea posible se prefiere la <b>enteral sobre la parenteral</b> porque es más fisiológica.",
  "Al iniciar se debe prevenir y vigilar el <b>síndrome de realimentación</b> (en bebés se inicia con calostro).",
  "Los suplementos orales no sustituyen la alimentación habitual sin una indicación clínica clara."]],
 ["Administración",[
  "Fórmula artesanal: HCO 55 / proteína 15 / lípidos 30; alimentos fáciles de licuar; <b>4 tomas cada 6–8 h</b>.",
  "<b>Intermitente</b>: alterna infusión y reposo; de elección en pacientes conscientes que deambulan, con tubo digestivo sano y vaciamiento gástrico normal.",

// ---------- estado ----------
let bloque="all", view="res";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=LS.get("nut-known",{});
const $=s=>document.querySelector(s);
const esc=s=>s;
function topics(){return T.filter(t=>bloque==="all"||bloque==="ex"||String(t.b)===bloque)}
function allCards(){const out=[];topics().forEach(t=>t.fc.forEach((c,i)=>{if(bloque==="ex"&&!c[2])return;out.push({id:t.id+"-"+i,q:c[0],a:c[1],ex:!!c[2],topic:t.t})}));return out}
function allQs(){const out=[];topics().forEach(t=>t.qz.forEach(q=>{if(bloque==="ex"&&!q[4])return;out.push({q:q[0],o:q[1],c:q[2],e:q[3],ex:!!q[4],topic:t.t})}));return out}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---------- resúmenes ----------
function renderRes(){
  const ts=topics(); const el=$("#v-res");
  let h='<div class="toc">'+ts.map(t=>`<a href="#t-${t.id}">${t.t}</a>`).join("")+'</div>';
  ts.forEach(t=>{
    let secs=t.s.map(([hd,pts])=>{
      const list=bloque==="ex"?pts.filter(p=>p.includes('class="ex"')):pts;
      if(!list.length)return"";
      return `<h3>${hd}</h3><ul>${list.map(p=>`<li>${p}</li>`).join("")}</ul>`}).join("");
    if(bloque==="ex"&&!secs)return;
    if(t.tbl&&bloque!=="ex")secs+=`<h3>${t.tbl.h}</h3>${t.tbl.html}`;
    h+=`<article class="label" id="t-${t.id}"><h2>${t.t}</h2><div class="meta"><span>Bloque ${t.b}</span><span>${t.fc.length} tarjetas · ${t.qz.length} preguntas</span></div>${secs}</article>`;
  });
  el.innerHTML=h;
}

// ---------- tarjetas ----------
let deck=[],di=0,onlyPending=false;
function buildDeck(){let c=allCards();if(onlyPending)c=c.filter(x=>!known[x.id]);deck=shuffle(c);di=0}
function renderFc(){
  const el=$("#v-fc"); const total=allCards(); const k=total.filter(x=>known[x.id]).length;
  if(!deck.length){
    el.innerHTML=`<div class="fc-bar"><span>${k} de ${total.length} dominadas</span><div class="progress"><i style="width:${total.length?k/total.length*100:0}%"></i></div></div>
    <div class="qbox"><div class="qtext">${onlyPending&&total.length?"¡Ya dominas todas las tarjetas de esta selección!":"No hay tarjetas en esta selección."}</div>
    <div class="row"><button class="btn primary" id="fc-all">Repasar todas otra vez</button><button class="btn" id="fc-reset">Reiniciar progreso</button></div></div>`;
    $("#fc-all").onclick=()=>{onlyPending=false;buildDeck();renderFc()};
    $("#fc-reset").onclick=()=>{total.forEach(x=>delete known[x.id]);LS.set("nut-known",known);buildDeck();renderFc()};
    return;
  }
  const c=deck[di];
  el.innerHTML=`<div class="fc-bar"><span>Tarjeta ${di+1} de ${deck.length} · ${k}/${total.length} dominadas</span><div class="progress"><i style="width:${total.length?k/total.length*100:0}%"></i></div></div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="Voltear tarjeta"><div class="card-inner">
   <div class="face front"><div class="k">${c.topic}${c.ex?' · <span class="ex">Pregunta de examen</span>':''}</div><div class="q">${c.q}</div><div class="hint">Toca o presiona espacio para ver la respuesta</div></div>
   <div class="face back"><div class="k">Respuesta</div><div class="a">${c.a}</div><div class="hint">¿La sabías?</div></div>
  </div></div>
  <div class="row"><button class="btn bad" id="fc-no">Repasar otra vez</button><button class="btn good" id="fc-yes">Ya la sé</button></div>
  <div class="row" style="margin-top:10px"><button class="btn small" id="fc-shuf">Barajar</button><button class="btn small" id="fc-pend" aria-pressed="${onlyPending}">${onlyPending?"Mostrando: pendientes":"Mostrando: todas"}</button></div>`;
  const card=$("#card"); const flip=()=>card.classList.toggle("flipped");
  card.onclick=flip; card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  $("#fc-yes").onclick=()=>{known[c.id]=1;LS.set("nut-known",known);next()};
  $("#fc-no").onclick=()=>{delete known[c.id];LS.set("nut-known",known);deck.push(c);next()};
  $("#fc-shuf").onclick=()=>{buildDeck();renderFc()};
  $("#fc-pend").onclick=()=>{onlyPending=!onlyPending;buildDeck();renderFc()};
  function next(){di++;if(di>=deck.length){deck=[];}renderFc()}
}

// ---------- quiz ----------
let qs=[],qi=0,correct=0,missed=[],answered=false,qlen=10;
function startQuiz(){const pool=allQs();qs=shuffle(pool).slice(0,Math.min(qlen,pool.length)).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,o:idx.map(i=>q.o[i]),c:idx.indexOf(q.c)}});qi=0;correct=0;missed=[];answered=false;renderQz()}
function renderQz(){
  const el=$("#v-qz");
  if(!qs.length){el.innerHTML=`<div class="qbox"><div class="qtext">No hay preguntas en esta selección.</div></div>`;return}
  if(qi>=qs.length){
    const pct=Math.round(correct/qs.length*100);
    el.innerHTML=`<div class="qbox"><div class="qnum"><span>Resultado</span><span>${qs.length} preguntas</span></div>
    <div class="score">${correct}/${qs.length}</div><p>${pct>=80?"Muy bien. Sigue así.":pct>=60?"Vas bien; repasa las que fallaste.":"Conviene volver al resumen de estos temas."}</p>
    ${missed.length?`<h3 style="font-family:var(--f-display);text-transform:uppercase;font-size:15px">Para repasar</h3><ol class="missed">${missed.map(m=>`<li><b>${m.q}</b><br>Respuesta: ${m.o[m.c]}<br><span class="note">${m.topic}</span></li>`).join("")}</ol>`:""}
    <div class="row"><button class="btn primary" id="qz-again">Nuevo quiz</button></div></div>`;
    $("#qz-again").onclick=startQuiz; return;
  }
  const q=qs[qi]; const L="ABCD";
  el.innerHTML=`<div class="filters" style="padding-top:0"><span class="lbl">Preguntas por ronda:</span>${[10,20,9999].map(n=>`<button class="chip qlen" data-n="${n}" aria-pressed="${qlen===n}">${n===9999?"Todas":n}</button>`).join("")}</div>
  <div class="qbox"><div class="qnum"><span>Pregunta ${qi+1} de ${qs.length}${q.ex?' · <span class="ex">Pregunta de examen</span>':''}</span><span>Aciertos: ${correct}</span></div>
  <div class="qtext">${q.q}</div>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${L[i]}</span><span>${o}</span></button>`).join("")}</div>
  <div id="qz-after"></div></div>`;
  document.querySelectorAll(".qlen").forEach(b=>b.onclick=()=>{qlen=+b.dataset.n;startQuiz()});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered)return; answered=true; const i=+b.dataset.i;
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.c)x.classList.add("right")});
    if(i===q.c)correct++;else{b.classList.add("wrong");missed.push(q)}
    $("#qz-after").innerHTML=`<div class="expl"><b>${i===q.c?"Correcto.":"Incorrecto."}</b> ${q.e}<br><span class="note">Tema: ${q.topic}</span></div><div class="row" style="margin-top:12px"><button class="btn primary" id="qz-next">${qi+1<qs.length?"Siguiente":"Ver resultado"}</button></div>`;
    $("#qz-next").onclick=()=>{qi++;answered=false;renderQz()}; $("#qz-next").focus();
  });
}

// ---------- calculadora ----------
function renderCalc(){
  $("#v-calc").innerHTML=`<p class="sub" style="margin-bottom:12px">Para practicar los ejercicios de clase. Usa los mismos pasos que en tus apuntes: Owen y Mifflin multiplican la TMB por el factor de actividad; Harris-Benedict suma el ETA (10%) y luego multiplica por el factor.</p>
  <div class="calc">
   <div class="grid">
    <label class="f">Sexo<select id="c-sex"><option value="h">Hombre</option><option value="m">Mujer</option></select></label>
    <label class="f">Peso (kg)<input id="c-p" type="number" inputmode="decimal" value="75"></label>
    <label class="f">Estatura (cm)<input id="c-t" type="number" inputmode="decimal" value="175"></label>
    <label class="f">Edad (años)<input id="c-e" type="number" inputmode="numeric" value="22"></label>
    <label class="f">Actividad<select id="c-fa"><option value="1.1">Sedentario 1.1</option><option value="1.2">Ligero 1.2</option><option value="1.3">Moderado 1.3</option><option value="1.4" selected>Activo 1.4</option><option value="1.5">Muy activo 1.5</option></select></label>
    <label class="f">Emergencia (kcal/kg)<input id="c-em" type="number" value="30"></label>
    <label class="f">Factor de lesión<input id="c-fl" type="number" step="0.05" value="1"></label>
   </div>
   <div class="out" id="c-out"></div>
   <div class="grid">
    <label class="f">% HCO<input id="c-h" type="number" value="60"></label>
    <label class="f">% Proteína<input id="c-pr" type="number" value="15"></label>
    <label class="f">% Lípidos<input id="c-l" type="number" value="25"></label>
    <label class="f">Repartir sobre<select id="c-base"><option value="owen">GET Owen</option><option value="mif">GET Mifflin</option><option value="hb">GET Harris-Benedict</option><option value="em">Emergencia</option></select></label>
   </div>
   <div class="out" id="c-mac"></div>
  </div>`;
  document.querySelectorAll("#v-calc input,#v-calc select").forEach(x=>x.oninput=calc);
  calc();
}
function calc(){
  const v=id=>parseFloat($(id).value)||0, sex=$("#c-sex").value, P=v("#c-p"),Tm=v("#c-t"),E=v("#c-e"),FA=v("#c-fa"),FL=v("#c-fl")||1;
  const owen=sex==="h"?879+10.2*P:795+7.18*P;
  const mif=10*P+6.25*Tm-5*E+(sex==="h"?5:-161);
  const hb=sex==="h"?66+13.7*P+5*Tm-6.8*E:655+9.6*P+1.8*Tm-4.7*E;
  const r=n=>Math.round(n).toLocaleString("es-MX");
  const get={owen:owen*FA*FL,mif:mif*FA*FL,hb:(hb*1.1)*FA*FL,em:P*v("#c-em")*FL};
  const fl=FL!==1?` × ${FL}`:"";
  $("#c-out").innerHTML=`
   <div class="line"><span>Owen · TMB ${r(owen)} × ${FA}${fl}</span><b>${r(get.owen)} kcal</b></div>
   <div class="line"><span>Mifflin · TMB ${r(mif)} × ${FA}${fl}</span><b>${r(get.mif)} kcal</b></div>
   <div class="line"><span>Harris-Benedict · GEB ${r(hb)} + ETA ${r(hb*.1)} = ${r(hb*1.1)} × ${FA}${fl}</span><b>${r(get.hb)} kcal</b></div>
   <div class="line"><span>Emergencia · ${P} kg × ${v("#c-em")} kcal/kg${fl} (sin FA)</span><b>${r(get.em)} kcal</b></div>
   <div class="formula">Owen ${sex==="h"?"879 + 10.2·P":"795 + 7.18·P"} · Mifflin 10·P + 6.25·T − 5·E ${sex==="h"?"+ 5":"− 161"} · HB ${sex==="h"?"66 + 13.7·P + 5·T − 6.8·E":"655 + 9.6·P + 1.8·T − 4.7·E"}</div>`;
  const tot=get[$("#c-base").value], h=v("#c-h"),p=v("#c-pr"),l=v("#c-l"), sum=h+p+l;
  $("#c-mac").innerHTML=`
   <div class="line big"><span>Cuadro dietosintético</span><span>${r(tot)} kcal</span></div>
   <div class="line"><span>HCO ${h}% · ${r(tot*h/100)} kcal ÷ 4</span><b>${r(tot*h/400)} g</b></div>
   <div class="line"><span>Proteína ${p}% · ${r(tot*p/100)} kcal ÷ 4</span><b>${r(tot*p/400)} g · ${(tot*p/400/(P||1)).toFixed(2)} g/kg</b></div>
   <div class="line"><span>Lípidos ${l}% · ${r(tot*l/100)} kcal ÷ 9</span><b>${r(tot*l/900)} g</b></div>
   ${sum!==100?`<div class="line" style="color:var(--bad)"><span>Los porcentajes suman ${sum}%; deben sumar 100%.</span><span></span></div>`:""}`;
}

// ---------- navegación ----------
function render(){
  $("#filters").hidden=view==="calc";
  if(view==="res")renderRes();
  if(view==="fc"){buildDeck();renderFc()}
  if(view==="qz")startQuiz();
  if(view==="calc"&&!$("#c-out"))renderCalc();
}
function setView(v){
  view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===v));
  ["res","fc","qz","calc"].forEach(x=>$("#v-"+x).hidden=x!==v);
  if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);
  render();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));
document.querySelectorAll("#filters .chip").forEach(c=>c.onclick=()=>{
  bloque=c.dataset.b;
  document.querySelectorAll("#filters .chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
  render();
});
const h0=(location.hash||"").slice(1);
setView(["res","fc","qz","calc"].includes(h0)?h0:"res");
