<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Repaso de Cirugía</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../fonts/g57b4f0aefa.css">
<style>
/* Layout: barra de temas fija; cada tema abre con portada (imagen + datos), luego secciones numeradas con figuras, perlas, tarjetas y quiz. Atlas global con quiz de imágenes. Paleta H&E: hematoxilina violeta, eosina rosa; cada tema tiene su propio tono. */
:root{
  --bg:#f6f4f8; --surface:#ffffff; --surface-2:#f0ecf4; --fg:#1d1824; --muted:#5d5469; --line:#e0d8e7;
  --hema:#4b2c7a; --eosin:#c2366b; --eosin-soft:#fbe8f0; --hema-soft:#ede6f7;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(40,20,60,.06),0 6px 20px rgba(40,20,60,.07);
  --t:#4b2c7a; --t-soft:#ede6f7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1d1825; --surface-2:#271f31; --fg:#ece6f2; --muted:#aa9fb8; --line:#372d43;
  --hema:#bba3e8; --eosin:#f283ab; --eosin-soft:#3a1d2b; --hema-soft:#2b2240;
  --ok:#6fd39e; --ok-soft:#163225; --bad:#f39a90; --bad-soft:#3a1d1a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1d1825; --surface-2:#271f31; --fg:#ece6f2; --muted:#aa9fb8; --line:#372d43;
  --hema:#bba3e8; --eosin:#f283ab; --eosin-soft:#3a1d2b; --hema-soft:#2b2240;
  --ok:#6fd39e; --ok-soft:#163225; --bad:#f39a90; --bad-soft:#3a1d1a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
/* Tono por tema */
[data-topic="hemorroides"]{--t:#7a3fb0;--t-soft:color-mix(in srgb,#7a3fb0 13%,var(--surface))}
[data-topic="fisura"]{--t:#c2366b;--t-soft:color-mix(in srgb,#c2366b 12%,var(--surface))}
[data-topic="fistula"]{--t:#b5562a;--t-soft:color-mix(in srgb,#b5562a 13%,var(--surface))}
[data-topic="stda"]{--t:#a3263a;--t-soft:color-mix(in srgb,#a3263a 12%,var(--surface))}
[data-topic="testiculo"]{--t:#2f6aa8;--t-soft:color-mix(in srgb,#2f6aa8 13%,var(--surface))}
[data-topic="pene"]{--t:#2e7d5b;--t-soft:color-mix(in srgb,#2e7d5b 13%,var(--surface))}
:root[data-theme="dark"] [data-topic="pene"]{--t:#7fd1a8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-topic="pene"]{--t:#7fd1a8}}
[data-topic="pilonidal"]{--t:#8a6a12;--t-soft:color-mix(in srgb,#8a6a12 13%,var(--surface))}
:root[data-theme="dark"] [data-topic="pilonidal"]{--t:#e3c46a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-topic="pilonidal"]{--t:#e3c46a}}
[data-topic="atlas"],[data-topic="repaso"],[data-topic="inicio"]{--t:var(--hema);--t-soft:var(--hema-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [data-topic="hemorroides"]{--t:#c49bf0}:root:not([data-theme="light"]) [data-topic="fisura"]{--t:#f283ab}:root:not([data-theme="light"]) [data-topic="fistula"]{--t:#f0a072}:root:not([data-theme="light"]) [data-topic="stda"]{--t:#f28a96}:root:not([data-theme="light"]) [data-topic="testiculo"]{--t:#86b6ec}}
:root[data-theme="dark"] [data-topic="hemorroides"]{--t:#c49bf0}:root[data-theme="dark"] [data-topic="fisura"]{--t:#f283ab}:root[data-theme="dark"] [data-topic="fistula"]{--t:#f0a072}:root[data-theme="dark"] [data-topic="stda"]{--t:#f28a96}:root[data-theme="dark"] [data-topic="testiculo"]{--t:#86b6ec}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.58 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 200deg,var(--hema),var(--eosin),var(--hema));flex:none}
.brand b{font:800 1.05rem/1 var(--display);color:var(--fg)}
.brand span{font-size:.85rem;color:var(--muted)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.tabs button i{width:9px;height:9px;border-radius:50%;background:var(--t);display:inline-block}
nav.tabs button[aria-selected="true"]{background:var(--t);border-color:var(--t);color:var(--surface)}
nav.tabs button[aria-selected="true"] i{background:var(--surface)}
button:focus-visible,summary:focus-visible,.fig:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}
main .wrap{padding-block:22px 72px;display:flex;flex-direction:column;gap:20px}
h1{font:800 clamp(1.8rem,5vw,2.7rem)/1.05 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0;max-width:62ch;font-size:1.05rem}
.kicker{font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--t)}
/* Portada de tema */
.cover{display:grid;grid-template-columns:1.15fr .85fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.cover .txt{padding:24px 24px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:6px solid var(--t)}
.cover .pic{position:relative;min-height:220px;background:var(--surface-2);cursor:zoom-in}
.cover .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--surface) 0,transparent 22%)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.stat{background:var(--t-soft);color:var(--fg);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.1;min-width:72px}
.stat b{font:800 1.2rem var(--display);color:var(--t);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{font:600 .88rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--t);border-color:var(--t);color:var(--surface)}
.btn:hover{border-color:var(--t)}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump button{font:500 .8rem var(--body);background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.jump button:hover{color:var(--t);border-color:var(--t)}
h2.sec{font:700 1.3rem var(--display);margin:10px 0 0;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--t)}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.secs{display:flex;flex-direction:column;gap:10px}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
details.card[open]{border-color:color-mix(in srgb,var(--t) 40%,var(--line))}
details.card summary{cursor:pointer;list-style:none;padding:13px 16px;font:700 1.04rem var(--display);display:flex;align-items:center;gap:12px}
details.card summary::-webkit-details-marker{display:none}
details.card summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--t-soft);color:var(--t);font:600 .8rem var(--mono);display:grid;place-items:center}
details.card summary .ti{flex:1;min-width:0}
details.card summary .cam{font:500 .72rem var(--mono);color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
details.card summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--t);border-bottom:2px solid var(--t);transform:rotate(45deg);transition:transform .2s;margin-right:4px;flex:none}
details.card[open] summary::after{transform:rotate(-135deg)}
details.card .body{padding:0 18px 16px 56px;min-width:0}
.body p{margin:.4em 0}
.body ul,.body ol{margin:.3em 0;padding-left:1.2em}
.body li{margin:.18em 0}
.body li::marker{color:var(--t)}
.tbl{overflow-x:auto;margin:.6em 0;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th+th,td+td{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--t-soft);font-weight:700}
.tag{display:inline-block;font:500 .72rem var(--mono);padding:1px 7px;border-radius:5px;background:var(--t-soft);color:var(--t);margin-right:4px}
mark{background:var(--eosin-soft);color:var(--fg);padding:0 3px;border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:.5em 0}
.mini{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.mini h4{margin:0 0 4px;font:700 .95rem var(--display);color:var(--t)}
.note{font-size:.85rem;color:var(--muted);font-style:italic}
/* Figuras */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.fig{margin:0;background:var(--surface-2);border-radius:10px;overflow:hidden;cursor:zoom-in;border:1px solid var(--line);display:flex;flex-direction:column;padding:0;text-align:left;color:var(--fg);font:inherit}
.fig .im{aspect-ratio:4/3;width:100%;background:#fff;display:block;overflow:hidden}
.fig img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .3s}
.fig:hover img{transform:scale(1.04)}
.fig figcaption,.fig .cap{font-size:.82rem;line-height:1.3;padding:7px 9px;color:var(--fg)}
.fig .cap b{display:block;font-weight:700}
.fig .cap small{color:var(--muted)}
.pearls{background:linear-gradient(135deg,var(--t-soft),var(--surface));border:1px solid color-mix(in srgb,var(--t) 30%,var(--line));border-radius:14px;padding:16px 18px}
.pearls h3{margin:0 0 6px;font:700 1.05rem var(--display);color:var(--t)}
.pearls ol{margin:0;padding-left:1.3em}
.pearls li{margin:.35em 0}
.pearls li::marker{font:600 .9rem var(--mono);color:var(--t)}
/* Tarjetas */
.fc-wrap{display:flex;flex-direction:column;gap:10px}
.fc{perspective:1200px;cursor:pointer}
.fc-inner{display:grid;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;min-height:200px;backface-visibility:hidden;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.fc-front{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--t)}
.fc-back{background:var(--t);color:var(--surface);transform:rotateY(180deg)}
.fc-face small{font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.fc-face p{margin:0;font-size:1.1rem}
.fc-front p{font:700 1.2rem/1.35 var(--display)}
.fc-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fc-count{font:500 .85rem var(--mono);color:var(--muted);margin-left:auto}
/* Quiz */
.qlist{display:flex;flex-direction:column;gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.q .stem{font-weight:700;font-size:1.02rem}
.q .qimg{border-radius:10px;overflow:hidden;background:#fff;max-width:420px;cursor:zoom-in;border:1px solid var(--line)}
.q .qimg img{display:block;width:100%;max-height:300px;object-fit:contain}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:7px}
.opt{text-align:left;font:400 .97rem var(--body);background:var(--surface-2);color:var(--fg);border:1.5px solid transparent;border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.opt .l{font:600 .78rem var(--mono);color:var(--t);background:var(--surface);border-radius:6px;padding:1px 6px;flex:none;margin-top:2px}
.opt:hover:not([disabled]){border-color:var(--t)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{font-size:.93rem;border-left:3px solid var(--t);padding-left:10px;color:var(--muted)}
.score{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.score .num{font:800 1.4rem var(--display);color:var(--t);font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:120px;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
/* Inicio */
.home-hero{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-radius:16px;overflow:hidden}
.mosaic img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.ov:hover{transform:translateY(-2px);border-color:var(--t)}
.ov .im{height:120px;background:var(--surface-2);border-bottom:4px solid var(--t)}
.ov .im img{width:100%;height:100%;object-fit:cover;display:block}
.ov .tx{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ov b{font:700 1.08rem var(--display)}
.ov span{font-size:.88rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;font:500 .95rem var(--body);color:var(--fg);background:var(--surface-2);border:1.5px solid transparent;border-radius:10px;padding:8px 36px 8px 36px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--hema);background:var(--surface)}
.search button{position:absolute;right:6px;width:26px;height:26px;border:0;border-radius:7px;background:var(--surface);color:var(--muted);font:600 1.1rem/1 var(--body);cursor:pointer}
.sgroup{display:flex;flex-direction:column;gap:10px;min-width:0}
.sres{min-width:0;display:flex;flex-direction:column;gap:8px}
.sr{text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.sr:hover{border-color:var(--t)}
.sr .sk{font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t)}
.sr b{font:700 1rem var(--display)}
.sr span:last-child{font-size:.9rem;color:var(--muted)}
.sr mark,.body mark.s{background:color-mix(in srgb,var(--eosin) 30%,transparent)}
.hit{outline:3px solid var(--t);outline-offset:3px;transition:outline-color 1s}
footer{font-size:.8rem;color:var(--muted)}
/* Visor */
.lb{position:fixed;inset:0;z-index:20;background:rgba(12,8,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px;background:#fff}
.lb .cap{color:#f1ecf6;max-width:640px;text-align:center;font-size:.98rem}
.lb .cap b{display:block;font:700 1.1rem var(--display)}
.lb .ctl{display:flex;gap:8px}
.lb .ctl button{font:600 .9rem var(--body);background:#2a2333;color:#f1ecf6;border:1px solid #4a405a;border-radius:9px;padding:8px 14px;cursor:pointer}
main .wrap>*,.figs>*,.opts>*,.overview>*,.grid2>*,.q,.fig{min-width:0}
.fig .im img{max-width:100%}
@media (max-width:640px){
  .cover,.home-hero{grid-template-columns:1fr}
  .cover .pic{min-height:190px;order:-1}
  .cover .pic::after{background:linear-gradient(0deg,var(--surface) 0,transparent 30%)}
  details.card .body{padding:0 14px 14px}
}
@media (prefers-reduced-motion: reduce){.fc-inner,.bar i,.fig img,.ov,details.card summary::after{transition:none}}

/* ===== Rediseño: barra lateral en escritorio, lectura más cómoda, bloques de práctica ===== */
body{font-size:16.5px}
.body{line-height:1.65}
.phead{display:flex;flex-direction:column;gap:8px}
.credit{display:none;font-size:.78rem;color:var(--muted);margin:0}
nav.tabs .grp,.toc .grp{display:none;font:500 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
nav.tabs .ll{display:none}
.toc{display:none}
details.card,h2.sec,.pearls,.score+*{scroll-margin-top:170px}
.score{position:static}
/* Portada */
.hero2{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.hero2 .htxt{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero2 h1{font-size:clamp(2rem,5.5vw,3.1rem)}
.hero2 .stat b{color:var(--hema)}
.hero2 .stat{background:var(--hema-soft)}
.mosaic{border-radius:14px}
.practice{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pc{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.pc:hover{border-color:var(--hema)}
.pc>b{font:800 1.5rem var(--display);color:var(--eosin);min-width:2.2ch;font-variant-numeric:tabular-nums}
.pc span{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);line-height:1.3}
.pc strong{color:var(--fg);font:700 .98rem var(--display)}
/* Casos clínicos */
.cases,.decs,.tnms{display:flex;flex-direction:column;gap:14px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.case>header{padding:14px 18px 0}

 ["Tratamiento quirúrgico y prevención",`<ul><li><b>Esfinterotomía lateral interna</b>: curación <mark>90–98 %</mark>.</li><li>Avance de colgajo cutáneo en lesiones complejas.</li></ul><p><b>Prevención:</b> dieta rica en fibra y líquidos, ejercicio regular, evitar el esfuerzo excesivo al evacuar, higiene anal suave.</p>`]

{id:"fistula", name:"Fístula anal", short:"Fístula",
 lede:"Comunicación anormal entre dos superficies epitelizadas, casi siempre secundaria a un absceso anal.",
 sections:[
 ["Definición",`<ul><li>Comunicación anormal entre <b>dos superficies epitelizadas</b>.</li><li>Componentes: <b>orificio interno</b>, <b>orificio externo</b> y <b>trayecto</b>.</li><li>Generalmente <mark>secundarias a un absceso anal</mark> (origen criptoglandular).</li></ul>`],
 ["Clasificación de Parks",`<div class="tbl"><table><tr><th></th><th>Tipo</th><th>Trayecto</th></tr>
 <tr><td>A</td><td><b>Superficial / subcutánea</b></td><td>Por debajo de ambos esfínteres</td></tr>
 <tr><td>B</td><td><b>Interesfinteriana</b></td><td>Entre ambos esfínteres</td></tr>
 <tr><td>C</td><td><b>Transesfinteriana</b> (bajas / altas)</td><td>Por el espacio interesfintérico hasta atravesar el esfínter externo</td></tr>
 <tr><td>D</td><td><b>Supraesfinteriana</b></td><td>Abandona el espacio interesfintérico por encima del puborrectal, atravesando el elevador del ano</td></tr>
 <tr><td>E</td><td><b>Extraesfinteriana</b></td><td>Penetra directamente desde el recto al elevador del ano, por encima del complejo esfinteriano</td></tr></table></div>`],
 ["Simples vs complejas (AGA)",`<div class="grid2"><div class="mini"><h4>Simples</h4><ul><li>Superficiales.</li><li>Interesfinterianas.</li><li>Transesfinterianas únicas/bajas: cruzan <b>menos del 30 %</b> del esfínter externo.</li></ul></div>
 <div class="mini"><h4>Complejas</h4><ul><li>Transesfinterianas altas.</li><li>Supraesfinterianas y extraesfinterianas.</li><li>Recurrentes, en herradura, trayectos múltiples.</li><li><b>Trayectos anteriores en mujeres.</b></li><li>Asociadas a EII, radiación, incontinencia previa o diarrea crónica.</li></ul></div></div>
 <p class="note">Si hay incontinencia sobreañadida o es multirrecidivada se considera compleja aunque su clasificación diga otra cosa. Lo mismo en mujer con trayecto anterior aunque englobe menos del 30 % del esfínter.</p>`],
 ["Cuadro clínico: evoluciones tras drenar un absceso",`<ol type="a"><li>Supura 4–5 días, el orificio se ocluye y parece curar; semanas, meses o años después el absceso reincide. Puede repetirse innumerables veces.</li><li>El orificio sigue supurando semanas o meses y luego se ocluye; tras un periodo asintomático prolongado, el absceso vuelve.</li><li>La fístula persiste supurando constante y escasamente por tiempo indefinido, sin nuevo absceso.</li><li>Supura constantemente; se cierra 2–3 días, se forma un absceso pequeño que se vacía a los 2–3 días, y así sucesivamente.</li></ol>`],
 ["Diagnóstico",`<p>Es <b>clínico</b> y se complementa con imagen:</p><div class="tbl"><table><tr><th>Endosonografía</th><th>Resonancia magnética</th></tr>
 <tr><td>Fácil acceso, económica, corta y sencilla. Se usa en consulta o quirófano. Mejora con inyección de <b>agua oxigenada</b> en el trayecto y con tecnología 3D. Confiable para evaluar el aparato esfinteriano.</td>
 <td>Más laboriosa y costosa. <b>Mejor resolución de contraste</b>, analiza toda la pelvis y <b>distingue tejido cicatricial de tejido en evolución</b>.</td></tr></table></div>`],
 ["Diagnóstico diferencial",`<ul><li>Fisura anal infectada; glándula almizclera infectada.</li><li>Supuración de la piel (forúnculo, glándula sebácea, quiste epidérmico); bartholinitis.</li><li>Cuerpo extraño (hueso de pollo, palillo).</li><li>Quiste vestigial retrorrectal fistulizado; enfermedad de Verneuil; seno pilonidal infectado.</li><li><b>Enfermedad de Crohn</b>.</li><li>Infecciones específicas: tuberculosis, actinomicosis, linfogranuloma venéreo (Nicolas-Favre), gonorrea.</li><li>Adenocarcinoma coloide de mucosas, granulomatosis séptica crónica, linfoma.</li><li>Otras: osteítis, absceso prostático.</li></ul>`],
 ["Técnicas quirúrgicas",`<div class="grid2">
 <div class="mini"><h4>Fistulectomía <span class="tag">en desuso</span></h4><p>Extirpa la fístula completa. Se introduce un estilete del orificio secundario al primario <b>sin forzarlo</b> (evita falsas vías), se incide la piel siguiendo el trayecto y se profundiza con electrobisturí hasta obtener la pieza con el estilete dentro.</p></div>
 <div class="mini"><h4>Fistulotomía</h4><p>Igual técnica, pero solo se profundiza <b>hasta el nivel del estilete</b> y se reseca únicamente el <b>techo</b> del trayecto, dejando la otra mitad.</p></div>
 <div class="mini"><h4>Colgajo de avance endorrectal</h4><p>Para fístulas <b>complejas</b>. Cierra el orificio primario <b>sin dividir el esfínter</b>. El más eficaz es el tallado <b>trapezoidal</b>. Espesor parcial: mucosa, submucosa y fibras circulares del esfínter interno. Espesor total: además las fibras longitudinales.</p></div>
 <div class="mini"><h4>Sedal y setones</h4><ul><li><b>Sedal:</b> cuerpo extraño en el trayecto para promover fibrosis; se retira en una 2.ª cirugía. Evita seccionar el esfínter.</li><li><b>Setón de corte:</b> mismo principio, de silastic; se ajusta cada semana o cada 15 días hasta seccionar el músculo.</li><li><b>Setón de drenaje:</b> solo evita nuevos abscesos.</li></ul></div></div>`],
 ["Manejo postquirúrgico",`<ul><li>Incontinencia postoperatoria: <mark>0–35 %</mark>.</li><li>Dieta líquida por la tarde y normal con abundante residuo desde la noche.</li><li>Reposo relativo.</li><li>Analgésico VO (ketorolaco o clonixinato de lisina) cada 6 h.</li><li>Sediluvios desde el día siguiente, 2–3 veces al día, 10 min, por 7 días.</li><li>Vigilar sangrado y diuresis espontánea.</li><li>Revisión semanal el primer mes y a los 3 y 6 meses.</li></ul>`]
 ],

/* ==================== QUISTE PILONIDAL ==================== */
{id:"pilonidal", name:"Quiste pilonidal", short:"Pilonidal",
 lede:"Enfermedad adquirida del surco interglúteo: el vello suelto penetra la piel de la línea media y provoca una reacción a cuerpo extraño.",
 sections:[
 ["Origen e historia",`<ul><li><b>1880, M. Hodges:</b> primera descripción del seno pilonidal como <b>"nido de pelo"</b>; sienta la base terminológica.</li><li>Debate inicial: origen <b>congénito</b> (falla embriológica) vs <b>adquirido</b> (penetración de vello).</li><li><b>1935, Gage:</b> propone un desarrollo embrionario anómalo del canal medular como causa primaria.</li><li><b>1946, Patey y Scarff:</b> refutan el origen congénito. El mecanismo central es la <mark>penetración activa de vello suelto</mark> a través de la piel del surco interglúteo, que desencadena una <b>reacción granulomatosa a cuerpo extraño</b>.</li></ul>
 <div class="mini"><h4>"Enfermedad del Jeep"</h4><ul><li>Segunda Guerra Mundial: <b>más de 80,000 bajas</b> en el ejército de EE. UU.</li><li><b>Hardaway</b> acuñó el término al relacionar las largas jornadas de conducción con la enfermedad.</li><li>Factores: <b>compresión continua</b> (vibración y presión repetida sobre el surco), <b>mala higiene</b> (condiciones de campaña) y <b>fricción constante</b> (el vello suelto penetra la piel vulnerable).</li></ul></div>`],
 ["Fisiopatología moderna",`<p><b>Karydakis (1992)</b> describe la <mark>tríada patogénica</mark>:</p><div class="tbl"><table><tr><th>Elemento</th><th>Qué ocurre</th></tr>
 <tr><td><b>Invasión de vello</b></td><td>El vello suelto entra al surco aprovechando la movilidad de la piel.</td></tr>
 <tr><td><b>Fuerza de fricción</b></td><td>El movimiento repetitivo al caminar empuja el vello hacia el tejido subcutáneo.</td></tr>
 <tr><td><b>Vulnerabilidad cutánea</b></td><td>La piel de la línea media tiene menor resistencia mecánica.</td></tr></table></div>`],
 ["Factores de riesgo y epidemiología",`<ul><li>Predominio masculino <b>2:1</b>; los <b>hombres jóvenes</b> son los más afectados.</li><li>Incidencia: <mark>26 por cada 100,000</mark>.</li></ul><div class="grid2"><div class="mini"><h4>Obesidad</h4><p>Surco más profundo y más humedad.</p></div><div class="mini"><h4>Hirsutismo</h4><p>Más vello disponible para penetrar.</p></div><div class="mini"><h4>Sedentarismo</h4><p>Presión sacrococcígea prolongada.</p></div><div class="mini"><h4>Surco profundo</h4><p>Retiene humedad y vello suelto.</p></div></div>`],
 ["Presentación clínica y diagnóstico",`<div class="grid2"><div class="mini"><h4>Absceso agudo</h4><ul><li>Inflamación intensa, <b>dolor pulsátil</b>, eritema y pus.</li><li>Aparición súbita que limita la movilidad del paciente.</li></ul></div><div class="mini"><h4>Seno pilonidal crónico</h4><ul><li>Cavidad con <b>uno o más orificios en la línea media</b>.</li><li>Drenaje seropurulento intermitente.</li></ul></div></div>
 <p><b>Diagnóstico clínico:</b> inspección directa de la región sacrococcígea. <mark>Los orificios en la línea media son patognomónicos</mark> y en los casos típicos <b>no se requieren estudios de imagen</b>.</p>`],
 ["Absceso y evolución del tratamiento",`<ul><li><mark>50 %</mark> se presenta como absceso: la mitad de los casos debuta como <b>urgencia quirúrgica</b>.</li><li><b>40–60 %</b> de recurrencia o cronicidad tras <b>drenaje simple</b> sin abordaje definitivo.</li><li>El drenaje simple <b>resuelve la urgencia, pero no la enfermedad</b>: sin tratamiento definitivo, la recurrencia y la cronicidad son la regla.</li></ul>
 <p><b>Secuencia:</b> fase aguda → control de la infección → <b>cirugía definitiva</b>, una vez resuelta la inflamación activa.</p>`],
 ["Técnicas tradicionales",`<div class="tbl"><table><tr><th></th><th>Curación de herida abierta</th><th>Cierre medial primario</th></tr>
 <tr><td><b>Recuperación</b></td><td>6–8 semanas</td><td>2–3 semanas</td></tr>
 <tr><td><b>Recurrencia</b></td><td>Muy baja</td><td>10–30 %</td></tr>
 <tr><td><b>Cuidado de heridas</b></td><td>Alta carga</td><td>Menor</td></tr></table></div>
 <p>Ninguna es ideal: la herida abierta recurre poco pero tarda y exige muchas curaciones; el cierre en la línea media sana rápido pero recurre más.</p>`],
 ["Colgajos",`<p>Indicados en enfermedad <b>crónica o recidivante</b>; son el <mark>estándar de oro en cirugía abierta</mark> por su menor recurrencia.</p><div class="tbl"><table><tr><th>Técnica</th><th>Cómo funciona</th></tr>
 <tr><td><b>Limberg</b></td><td>Colgajo romboidal de transposición que desplaza la cicatriz fuera de la línea media y reduce la tensión y la profundidad del surco.</td></tr>
 <tr><td><b>Karydakis</b></td><td>Desplaza la línea de cierre lateralmente y ataca directamente la causa biomecánica.</td></tr>
 <tr><td><b>Bascom (Cleft Lift)</b></td><td>Aplana el surco interglúteo profundo y elimina el microambiente que facilita la penetración del vello.</td></tr></table></div>
 <p>Recurrencia <b>menor al 5 %</b>, con reincorporación laboral temprana en <b>2–3 semanas</b>.</p>`],
 ["EPSiT",`<p><b>Endoscopic Pilonidal Sinus Treatment:</b> técnica videoasistida.</p><ul><li>Se introduce un endoscopio pequeño en el trayecto del seno: visión directa y <b>coagulación precisa</b>, sin incisiones amplias.</li><li>Morbilidad mínima y <b>sin heridas abiertas</b>.</li><li>Regreso a actividades en <mark>2–5 días</mark>; procedimiento <b>ambulatorio</b>.</li></ul>`],
 ["Conclusión",`<ul><li><b>Diagnóstico y tratamiento tempranos</b> evitan la enfermedad crónica compleja.</li><li>La tecnología (EPSiT y colgajos) permite curar sin grandes secuelas.</li><li>La prioridad es la <b>calidad de vida</b>: regreso rápido a la vida normal y prevenir la recurrencia.</li></ul>`]
 ],

/* ==================== STDA / STDB ==================== */
{id:"stda", name:"Sangrado de tubo digestivo alto y bajo", short:"STDA / STDB",
 lede:"Pérdida de sangre por el tubo digestivo. El ángulo de Treitz separa el sangrado alto del bajo.",
 sections:[
 ["Definición y clasificación",`<p>Expulsión de sangre por el conducto digestivo debido a una lesión que rompe la continuidad de la mucosa.</p>
 <div class="grid2"><div class="mini"><h4>Topográfica</h4><ul><li><b>STDA</b>: de esófago superior a duodeno (<b>ángulo de Treitz</b>).</li><li><b>STDB</b>: por debajo del ángulo de Treitz.</li><li><b>De origen oscuro</b>: sangre en heces no vista por el paciente, ± anemia ferropénica, con endoscopia alta y baja normales.</li></ul></div>
 <div class="mini"><h4>Magnitud (volumen circulante)</h4><ul><li>Leve: &lt; 10 %.</li><li>Moderada: 10–20 %.</li><li>Severa: &gt; 20 %.</li></ul><h4>Curso</h4><ul><li>Aguda / crónica.</li></ul></div></div>`],
 ["STDA: epidemiología",`<ul><li>Incidencia: <b>40–150 casos / 100 000 personas/año</b>.</li><li>Aumenta con la edad, sobre todo &gt; 60 años, y en hombres.</li><li>Mortalidad ligada a edad avanzada y comorbilidades: tumores, cirrosis, enfermedad respiratoria crónica.</li></ul>`],
 ["STDA: etiología",`<div class="grid2"><div class="mini"><h4>Úlcera péptica</h4><ul><li>Gástrica o duodenal; Zollinger-Ellison; ERGE.</li></ul></div><div class="mini"><h4>Traumatismos</h4><ul><li>Mallory-Weiss; cuerpo extraño.</li></ul></div><div class="mini"><h4>Vasculares</h4><ul><li>Várices, estómago en sandía, fístula aortoentérica, telangiectasias por radiación.</li></ul></div><div class="mini"><h4>Tumores</h4><ul><li>Benignos: lipoma, pólipos. Malignos: adenocarcinoma, linfoma, melanoma.</li></ul></div><div class="mini"><h4>Otras</h4><ul><li>Úlcera por estrés, infecciosas, fármacos.</li></ul></div></div>`],
 ["Úlcera péptica",`<ul><li>Lesiones crónicas, solitarias, por lo general <b>&lt; 4 cm</b>, en cualquier zona expuesta al jugo ácido-péptico.</li><li>Localización: <b>1.ª porción del duodeno</b>, antro gástrico, unión gastroesofágica; en Zollinger-Ellison también yeyuno.</li><li>Desequilibrio entre factores agresivos (hiperacidez, pepsina, sales biliares, isquemia, aspirina/AINE) y protectores. Sangra cuando la erosión rompe una arteria o vena subyacente.</li><li>Clínica: dolor urente o punzante en epigastrio, peor de noche, <b>1–3 h después de comer</b>, alivia con álcalis o alimentos. Náusea, vómito, melena; hematemesis en 15–20 %.</li></ul>`],
 ["Mallory-Weiss y várices esofágicas",`<div class="grid2"><div class="mini"><h4>Mallory-Weiss</h4><ul><li>Desgarros <b>longitudinales en la unión gastroesofágica</b>.</li><li>Por náusea y vómito intensos; frecuente en alcohólicos.</li><li><b>5–10 %</b> de los sangrados.</li><li>Hematemesis, melena; la mayoría cede sin cirugía.</li></ul></div>
 <div class="mini"><h4>Várices esofágicas</h4><ul><li>Venas dilatadas y tortuosas en la submucosa del esófago distal y estómago proximal.</li><li>Asociadas a cirrosis alcohólica e <b>hipertensión portal</b>.</li><li>Asintomáticas hasta romperse: <b>hematemesis masiva</b> de sangre oscura violácea y melena.</li></ul></div></div>`],
 ["Manifestaciones sistémicas y gravedad",`<div class="grid2"><div class="mini"><h4>Hemorragia aguda</h4><p>Palidez, taquicardia, diaforesis, hipotensión, inquietud, letargo, sed y oliguria.</p></div><div class="mini"><h4>Hemorragia crónica</h4><p>Palidez, astenia-adinamia, somnolencia, taquicardia, disnea. Anemia ferropénica (hipocrómica microcítica), sangre oculta en heces +.</p></div></div>
 <div class="tbl"><table><tr><th></th><th>Leve</th><th>Moderado</th><th>Severo</th></tr>
 <tr><td>Hb</td><td>Caída ≤ 1 g/dL; Hb &gt; 10, sin anemia o mínima</td><td>Caída &lt; 2 g/dL; Hb &lt; 10</td><td>—</td></tr>
 <tr><td>Hemodinamia</td><td>Estable</td><td>Taquicardia leve, hipotensión ortostática</td><td>Inestable</td></tr>
 <tr><td>Sangrado</td><td>Pozos de café; melena/hematoquecia ≤ 100 mL</td><td>Melena/hematoquecia &lt; 350 mL</td><td>Repetida o &gt; 350 mL</td></tr>
 <tr><td>Endoscopia</td><td><b>En 48 h</b></td><td><b>En 12 h</b></td><td><b>En 3 h</b> del ingreso</td></tr></table></div>`],
 ["Abordaje inicial del STDA",`<p><b>Objetivos:</b> estabilizar, localizar el sitio, detener la hemorragia y prevenir la recurrencia.</p>
 <ul><li>Reanimación ABC; prevenir o tratar el choque; evitar broncoaspiración por hematemesis; preparar para endoscopia urgente.</li><li>Formas agudas: hematemesis, melenemesis, <b>melena (≈ 100 mL de sangre)</b>, <b>hematoquecia (≈ 1000 mL)</b>.</li><li>Tacto rectal; buscar datos de hepatopatía (ictericia, telangiectasias, ascitis).</li><li><b>Sonda nasogástrica</b>: confirma origen alto y el lavado retira restos de alimento, sangre y coágulos para facilitar la endoscopia.</li></ul>`],
 ["Tratamiento médico, balones y cirugía",`<div class="tbl"><table><tr><th>Fármaco</th><th>Mecanismo</th><th>Dosis</th><th>Eficacia</th></tr>
 <tr><td><b>Somatostatina / octreótido</b></td><td>Reduce la presión venosa esplácnica</td><td>Bolo 100–200 µg, luego 25–50 µg/h IV</td><td>80 %</td></tr>
 <tr><td><b>Vasopresina</b></td><td>Vasoconstricción esplácnica</td><td>20 U en 200 mL de SG 5 % en 20 min, luego 0.1–0.4 U/min</td><td>50–85 %</td></tr></table></div>
 <ul><li><b>Sondas de balones:</b> Linton-Nachlas (un balón gástrico, dos vías de aspiración: gástrica y esofágica) y Sengstaken-Blakemore.</li><li><b>Terapia endoscópica:</b> p. ej. ligadura endoscópica de várices.</li><li><b>Indicaciones de cirugía:</b> escasez de sangre compatible, negativa a transfusión, &gt; 50 años, una o más enfermedades crónicas, tercer sangrado moderado.</li></ul>`],
 ["Factores predictores de muerte y resangrado (STDA)",`<div class="tbl"><table><tr><th>Muerte</th><th>Repetición del sangrado</th></tr>
 <tr><td>Edad &gt; 70 años, sepsis, estado posquirúrgico, transfusión ≥ 6 U, trombocitopenia, leucocitosis, tiempos de coagulación prolongados, corticoesteroides. Enfermedades pulmonares, hepáticas, renales (Cr &gt; 4, diálisis), neurológicas, cardiológicas. Várices esofágicas.</td>
 <td>FC &gt; 100 lpm, ortostatismo, TAS &lt; 100 mmHg, transfusión de 4 U, anticoagulantes. Endoscopia: sangrado arterial (70–90 %), vaso visible (50–70 %), coágulo adherido (10–35 %), úlcera &gt; 2 cm, úlcera en pared posterior del bulbo duodenal.</td></tr></table></div>`],
 ["STDB: epidemiología y causas",`<ul><li>20–27 / 100 000 hospitalizaciones (EUA); edad promedio 60–70 años; <b>20–30 %</b> de los sangrados digestivos.</li><li><mark>80 % cede espontáneamente</mark>; mortalidad 2–4 % en hospitalizados.</li></ul>
 <div class="tbl"><table><tr><th>Causa</th><th>%</th></tr><tr><td><b>Enfermedad diverticular complicada</b></td><td>35 (otra diapositiva: 40)</td></tr><tr><td>Angiodisplasias</td><td>17</td></tr><tr><td>Pólipos</td><td>12</td></tr><tr><td>Tumores</td><td>9</td></tr><tr><td>Hemorroides</td><td>5</td></tr><tr><td>EII</td><td>5</td></tr><tr><td>Colitis</td><td>2</td></tr><tr><td>Desconocido</td><td>15</td></tr></table></div>
 <ul><li>10–20 % puede venir del intestino delgado.</li><li><b>Jóvenes:</b> divertículo de Meckel, EII, pólipos. <b>&gt; 60 años:</b> diverticular, angiodisplasias, neoplasia.</li><li>Divertículos: protrusión de la mucosa colónica, predominan del <b>lado izquierdo</b>.</li><li>Angiodisplasia: malformación AV de la mucosa, sangrado intermitente, rara vez masivo.</li><li>Cáncer colorrectal: 1–13 % del STDB, 4.º cáncer más común, edad avanzada; anemia ferropénica y hematoquecia.</li><li>Anorrectales (4–10 %): hemorroides (prurito, dolor), fisura (dolor intenso posdefecación), Ca de ano (relaciones anales, VPH).</li><li>Intestino delgado (5–30 %): causa más frecuente <b>divertículo de Meckel</b>; tumores: adenocarcinoma, linfoma, sarcoma.</li></ul>`],
 ["STDB: presentación y diagnóstico",`<ul><li><b>Hematoquecia</b>: sangre roja rutilante por ano, forma más característica.</li><li><b>Melena</b>: poco común en STDB; con pérdidas &gt; 100 mL y tránsito lento.</li><li>Síndrome anémico (pérdida crónica) o descompensación hemodinámica (pérdida masiva).</li></ul>
 <p><b>Historia:</b> edad, comorbilidades, AINE, anticoagulantes, radiación, antecedente de cáncer, trauma anorrectal, hábitos sexuales. <b>Tacto rectal</b> siempre.</p>
 <div class="tbl"><table><tr><th>Estudio</th><th>Puntos clave</th></tr>
 <tr><td>Anoscopia</td><td>Lesiones del conducto anal: fisuras, úlceras, hemorroides internas.</td></tr>
 <tr><td>Sigmoidoscopia flexible</td><td>65 cm, hasta sigmoides; &lt; 50 años con hemorragia leve; maniobra de retrovisión.</td></tr>
 <tr><td><b>Colonoscopia</b></td><td><b>Estudio preferente</b> en hemorragia aguda; llega a ciego e íleon terminal.</td></tr>
 <tr><td>Angiografía</td><td>Detecta sangrado activo de <b>0.5 mL/min</b>; permite embolización selectiva. Riesgos: isquemia/infarto intestinal, hematoma, nefropatía por contraste.</td></tr>
 <tr><td>Gammagrafía (eritrocitos marcados)</td><td>Detecta <b>0.1 mL/min</b>; positiva solo en 50 %. Imágenes tempranas a la 1 y 4 h, tardías a las 24 h. Falsos negativos: sangrado intermitente. Falsos positivos: hiperperistaltismo.</td></tr>
 <tr><td>Exploración quirúrgica</td><td>STDB grave que no se estabiliza, o recurrente de sitio conocido.</td></tr></table></div>`],
 ["STDB: tratamiento y mal pronóstico",`<ul><li>Según el origen; 80 % cede solo. Reponer volemia, <b>PVC 6–12 mmHg</b>, transfundir hemoderivados.</li><li><b>Cirugía</b> (resección segmentaria de colon): hemorragia masiva o que persiste <b>72 h</b>.</li></ul><p><b>Factores de mal pronóstico:</b> sangrado activo &gt; 4 h, signos vitales inestables, síncope, anticoagulantes, ≥ 2 comorbilidades, abdomen no explorado.</p>`]
 ],
 pearls:["El <b>ángulo de Treitz</b> separa STDA de STDB.","Endoscopia: leve en 48 h, moderado en 12 h, severo en 3 h.","Melena ≈ 100 mL de sangre; hematoquecia ≈ 1000 mL (de origen alto).","Octreótido: bolo 100–200 µg + 25–50 µg/h, eficacia 80 %.","STDB: diverticular es la causa #1; en jóvenes, Meckel; 80 % cede solo.","Gammagrafía detecta 0.1 mL/min; angiografía 0.5 mL/min (y permite embolizar)."],

/* ==================== TESTÍCULO ==================== */
{id:"testiculo", name:"Cáncer de testículo", short:"Ca testículo",
 lede:"Neoplasia del hombre joven, 95 % de células germinales. Marcadores (AFP, hCG, DHL) guían diagnóstico, etapa y pronóstico.",
 sections:[
 ["Embriología y anatomía",`<ul><li>Células de Leydig: derivan del mesénquima, entre los cordones; producen testosterona desde la <b>8.ª SDG</b>. Túbulos paragenitales forman el epidídimo.</li><li>Testículo: 4–5 × 2.5 × 3 cm, ~30 cc, 10.5–14 g, blanco nacarado. <b>El izquierdo está más bajo.</b></li><li>Epidídimo: cabeza, cuerpo y cola.</li><li>Túnicas: vasculosa, <b>albugínea</b> (colágeno, forma el septo) y vaginal (visceral y parietal).</li></ul>
 <div class="tbl"><table><tr><th>Cordón espermático</th><th>Contenido</th></tr>
 <tr><td>3 fascias</td><td>Espermática externa (oblicuo externo), cremastérica (oblicuo interno), espermática interna (transversalis)</td></tr>
 <tr><td>3 arterias</td><td>Testicular (de la <b>aorta</b>), cremastérica (epigástrica inferior), deferente (vesical inferior)</td></tr>
 <tr><td>3 venas</td><td>Plexo pampiniforme / testicular, cremastérica, deferente</td></tr>
 <tr><td>3 nervios</td><td>Rama genital del genitofemoral, ilioinguinal, plexo testicular</td></tr></table></div>`],
 ["Epidemiología",`<ul><li>1–1.5 % de las neoplasias del hombre; 5 % de los cánceres urológicos; <b>1–2 % bilaterales</b>.</li><li>3–10 / 100 000 casos nuevos en Occidente; mayor incidencia en norte de Europa, EUA y Oceanía.</li><li>Picos: <b>3.ª década (no seminomas)</b> y <b>4.ª década (seminoma puro)</b>.</li><li><b>Mundial (GLOBOCAN 2012):</b> incidencia 0.7 % (55 256 casos), prevalencia 1.4 % (214 666), mortalidad 0.2 % (10 351 casos).</li><li>México (GLOBOCAN 2012): 14.º lugar; incidencia 1742 (2.7 %), mortalidad 443 (1.1 %), <b>prevalencia 5060 (3.7 %)</b>.</li></ul>`],
 ["Factores de riesgo",`<div class="tbl"><table><tr><th>Factor</th><th>Riesgo</th></tr>
 <tr><td><b>Historia de Ca testicular</b></td><td>RR 8</td></tr><tr><td><b>Criptorquidia</b></td><td>RR 3.7–7.5</td></tr><tr><td>Familiar de 1.er grado</td><td>RR 3.8</td></tr><tr><td>VIH</td><td>RR 3.4</td></tr><tr><td>Hipospadias</td><td>RR 2.13</td></tr><tr><td>Testículo contralateral</td><td>1.9 %/año</td></tr><tr><td>CIS o infertilidad</td><td>20 veces la población</td></tr><tr><td>Microlitiasis</td><td>Controversial</td></tr><tr><td>Klinefelter, exposición hormonal</td><td>Asociados</td></tr></table></div>
 <ul><li><b>Criptorquidia:</b> 7–10 % de los pacientes la tienen de antecedente. &gt; 90 % se resuelve al año; <b>orquidopexia antes de los 18 meses</b> (facilita vigilancia). Riesgo de cáncer contralateral metacrónico 3–14 veces. Asociada a infertilidad (<b>RR 2.9</b>); las anomalías ultraestructurales (espermatogonias y células de Sertoli) aparecen a los 3 años.</li><li><b>Incidencia de criptorquidia en la población:</b> 4.3 % en neonatos, 0.8 % en niños y 0.7 % en adultos &gt; 18 años.</li><li>Trauma: no es causa directa. Cáncer familiar: 1–3 %, a edad más temprana y más bilateral.</li></ul>`],
 ["Patología",`<ul><li><b>Células germinales 95 %</b>: seminoma 35–70 %, no seminoma 20 %, mixtos 15 %.</li><li>Gonadal 95 %, extragonadal 5 % (mediastino 60 %, retroperitoneo 35–40 %).</li><li>IHQ de seminoma: <b>PLAP, c-KIT</b>. Marcador genético: <b>isocromosoma 12p (i12p)</b>.</li></ul>
 <div class="tbl"><table><tr><th>Tipo</th><th>Rasgos clave</th></tr>
 <tr><td><b>Seminoma</b></td><td><b>30–40 % de los tumores puros.</b> Hipoecoico, lobulado; metástasis linfáticas (hígado, pulmón). Clásico 85 % (3.ª década, hCG ↑ en 20 %); espermatocítico 5–12 % (&gt; 50 años, solo testículo, diferenciar de linfoma); anaplásico 5–10 % (más agresivo).</td></tr>
 <tr><td><b>Carcinoma embrionario</b></td><td>Puro 2–10 %, mixto 80 %; ~30 años; crecimiento rápido con dolor; metástasis 40 %.</td></tr>
 <tr><td><b>Senos endodérmicos (saco vitelino)</b></td><td><b>Más común en niños</b> (6 meses a 4 años); en adultos aparece en tumores mixtos (44 %). 7 % asociado a trauma. <mark>AFP elevada en 90 %</mark>. Metástasis 10–20 %, hematógenas en 40 %.</td></tr>
 <tr><td><b>Coriocarcinoma</b></td><td>&lt; 1 % de los TCG y &lt; 8 % de los TCG mixtos; 20–25 años; metástasis hematógenas al diagnóstico (pulmón 100 %, hígado 86 %, tracto digestivo 71 %); disnea, alteraciones del SNC; hemoptisis; <b>hCG ↑</b>; ginecomastia 10 %.</td></tr>
 <tr><td><b>Teratoma</b></td><td>Tejido bien diferenciado. Puro 2.7–7 %, en mixtos 50 %. Niños 24–36 %: 65 % antes de los 2 años (media 20 meses). Eleva AFP y hCG. Metástasis 22–37 %.</td></tr>
 <tr><td><b>Mixto</b></td><td>32–54 %; raro en prepúberes; eleva AFP y hCG. Componentes: carcinoma embrionario + teratoma 47 %, senos endodérmicos 41 %, seminoma 59 %.</td></tr>
 <tr><td><b>Estroma (Leydig, Sertoli)</b></td><td>Adultos 4–6 %, niños 30 %; metástasis 10 %.</td></tr></table></div>`],
 ["Marcadores tumorales",`<div class="tbl"><table><tr><th>Tumor</th><th>hCG</th><th>AFP</th></tr>
 <tr><td>Seminoma</td><td>+ 30 %</td><td><b>Negativa</b></td></tr>
 <tr><td>Carcinoma embrionario</td><td>+ 80 %</td><td>+ 75 %</td></tr>
 <tr><td>Coriocarcinoma</td><td><b>+ 100 %</b></td><td>Negativa</td></tr>
 <tr><td>Teratoma</td><td>+ 25 %</td><td>+ 37 %</td></tr>
 <tr><td>Senos endodérmicos</td><td>—</td><td><b>+ 90 %</b></td></tr></table></div>
 <p class="note">Si la AFP está elevada, no es un seminoma puro.</p>`],
 ["Cuadro clínico",`<ul><li><b>Masa testicular no dolorosa</b>; el dolor (20–27 %) se asocia más a no seminomas. Hidrocele secundario.</li><li>Síntomas de metástasis al inicio en 10–20 %; 15 % de seminomas tienen metástasis al diagnóstico.</li><li>Adenopatía supraclavicular, ginecomastia 5–7 %, dolor en flanco 10 %.</li><li>Retroperitoneo: masa palpable, dolor abdominal o lumbar, edema de miembros inferiores.</li><li>Pulmón: disnea, dolor torácico, tos, hemoptisis.</li></ul>`],
 ["Diagnóstico por imagen",`<div class="tbl"><table><tr><th>Estudio</th><th>Uso</th></tr>
 <tr><td><b>USG testicular</b></td><td>Lesión hipoecoica intraparenquimatosa; seminoma homogéneo; Doppler con ↑ vascularidad. <b>Sensibilidad 98–100 %.</b></td></tr>
 <tr><td>RM</td><td>Si USG/TAC no concluyen o alergia al contraste. Seminoma isointenso en T1, hipointenso en T2. RM cerebral si múltiples metástasis pulmonares, hCG alta o no seminoma. <b>Sensibilidad 100 %, especificidad 95–100 %.</b></td></tr>
 <tr><td>TAC</td><td>Sospecha de enfermedad a distancia; ganglios paraórticos (retroperitoneales en 10–20 % de seminomas). Sensibilidad 70–80 %.</td></tr>
 <tr><td>PET-CT</td><td>Pos-QT para valorar masas residuales &gt; 3 cm, 8 semanas después.</td></tr></table></div>`],
 ["Estadificación TNM (AJCC 8.ª)",`<div class="grid2"><div class="mini"><h4>pT</h4><ul><li>pTis: neoplasia intratubular de células germinales.</li><li>pT1: limitado a testículo/epidídimo sin invasión vascular ni túnica vaginal (seminoma: T1a/T1b con corte de <b>3 cm</b>).</li><li>pT2: invasión vascular/linfática, túnica vaginal, epidídimo o hilio.</li><li>pT3: cordón espermático.</li><li>pT4: escroto.</li></ul></div>
 <div class="mini"><h4>N y M</h4><ul><li>N1: ganglios ≤ 2 cm.</li><li>N2: 2–5 cm (o &gt; 5 ganglios positivos, extranodal).</li><li>N3: cualquier ganglio &gt; 5 cm.</li><li>M1a: ganglios no regionales o pulmón.</li><li>M1b: otras vísceras.</li></ul></div></div>
 <div class="tbl"><table><tr><th>S</th><th>DHL</th><th>hCG (mUI/mL)</th><th>AFP (ng/mL)</th></tr>
 <tr><td>S1</td><td>&lt; 1.5 × N</td><td>&lt; 5000</td><td>&lt; 1000</td></tr>
 <tr><td>S2</td><td>1.5–10 × N</td><td>5000–50 000</td><td>1000–10 000</td></tr>
 <tr><td>S3</td><td>&gt; 10 × N</td><td>&gt; 50 000</td><td>&gt; 10 000</td></tr></table></div>
 <div class="tbl"><table><tr><th>Etapa</th><th>Definición</th></tr>
 <tr><td>I (IA, IB)</td><td>N0 M0, marcadores normales (S0). La tabla de la clase marca <b>75–80 %</b> junto a la etapa IA.</td></tr><tr><td>IS</td><td>N0 M0 con marcadores elevados (S1–3). La tabla marca <b>5 %</b> junto a IS.</td></tr>
 <tr><td>II (A, B, C)</td><td>N1, N2, N3 con M0 y S0–1</td></tr><tr><td>III</td><td>M1, o N+ con S2–S3</td></tr></table></div>`],
 ["Pronóstico (IGCCCG) y seguimiento",`<div class="tbl"><table><tr><th>Grupo</th><th>No seminoma</th><th>Seminoma</th></tr>
 <tr><td><b>Bueno</b></td><td>56 % de los casos; SLP a 5 años 89 %, SV a 5 años 92 %. Primario testicular/retroperitoneal, sin metástasis viscerales no pulmonares, AFP &lt; 1000, hCG &lt; 5000, DHL &lt; 1.5 × N.</td><td>90 % de los casos; SLP 82 %, SV 86 %. Cualquier primario, sin metástasis viscerales no pulmonares, AFP normal.</td></tr>
 <tr><td><b>Intermedio</b></td><td>28 % de los casos; SLP 75 %, SV 80 %. AFP 1000–10 000, hCG 5000–50 000 o DHL 1.5–10 × N.</td><td>10 % de los casos; SLP 67 %, SV 72 %. <b>Metástasis viscerales no pulmonares</b>, AFP normal.</td></tr>
 <tr><td><b>Malo</b></td><td>16 % de los casos; SLP 41 %, SV 48 %. <b>Primario mediastinal</b>, metástasis viscerales no pulmonares, AFP &gt; 10 000, hCG &gt; 50 000 o DHL &gt; 10 × N.</td><td><b>No existe grupo de mal pronóstico.</b></td></tr></table></div>
 <p><b>Riesgo de metástasis oculta en etapa I:</b> seminoma: tumor &gt; 4 cm, invasión de la rete testis. No seminoma: invasión linfovascular/perineural, índice de proliferación &gt; 70 %, carcinoma embrionario &gt; 50 %.</p>
 <p class="note">SLP = sobrevida libre de progresión; SV = sobrevida global. Ambas a 5 años.</p>
 <h4>Seguimiento del seminoma (NCCN 2.2017)</h4>
 <div class="tbl"><table><tr><th>Situación</th><th>Año 1</th><th>Año 2</th><th>Año 3</th><th>Años 4–5</th></tr>
 <tr><td><b>EC I, vigilancia tras orquiectomía</b><br>Historia y exploración<br>TAC abdominopélvica</td><td><br>Cada 3–6 meses<br>A los 3, 6 y 12 meses</td><td><br>Cada 6–12 meses<br>Cada 6–12 meses</td><td><br>Cada 6–12 meses<br>Cada 6–12 meses</td><td><br>Anual<br>Cada 12–24 meses</td></tr>
 <tr><td><b>EC I tras tratamiento adyuvante (QT o RT)</b><br>Historia y exploración<br>TAC abdominopélvica</td><td><br>Cada 6–12 meses<br>Anual</td><td><br>Cada 6–12 meses<br>Anual</td><td><br>Anual<br>Anual</td><td><br>Anual<br>No</td></tr>
 <tr><td><b>EC IIA y IIB no voluminoso, tras RT o QT</b><br>Historia y exploración<br>TAC abdominopélvica<br>Radiografía de tórax</td><td><br>Cada 3 meses<br>A los 3 meses y luego a los 6–12<br>Cada 6 meses</td><td><br>Cada 6 meses<br>Anual<br>Cada 6 meses</td><td><br>Cada 6 meses<br>Anual<br>No</td><td><br>Cada 6 meses<br>Según la clínica<br>No</td></tr>
 <tr><td><b>EC IIB voluminoso, IIC y III, tras QT sin masa residual o ≤ 3 cm y marcadores normales</b><br>Historia, exploración y marcadores<br>Radiografía de tórax</td><td><br>Cada 2 meses<br>Cada 2 meses</td><td><br>Cada 3 meses<br>Cada 3 meses</td><td><br>Cada 6 meses<br>Anual</td><td><br>Cada 6 meses (año 4), anual (año 5)<br>Anual</td></tr></table></div>
 <p>En EC I la radiografía de tórax es según la clínica (TAC de tórax con contraste si hay síntomas). En EC IIB voluminoso a III, TAC abdominopélvica con contraste a los 3–6 meses y PET-CT según la clínica.</p>
 <h4>Seguimiento mínimo tras tratamiento adyuvante o remisión completa (EAU 2017)</h4>
 <div class="tbl"><table><tr><th>Estudio</th><th>Año 1</th><th>Año 2</th><th>Año 3</th><th>Años 4 y 5</th></tr>
 <tr><td>Marcadores ± consulta</td><td>4 veces</td><td>4 veces</td><td>2 veces</td><td>2 veces</td></tr>
 <tr><td>Radiografía de tórax</td><td>1–2 veces</td><td>1 vez</td><td>1 vez</td><td>1 vez</td></tr>
 <tr><td>TAC o RM abdominopélvica</td><td>1–2 veces</td><td>A los 24 meses</td><td>A los 36 meses</td><td>A los 60 meses</td></tr></table></div>
 <p>TAC de tórax en los mismos tiempos si hubo metástasis pulmonares al diagnóstico. Después de 5 años, según el plan de supervivencia; con teratoma residual resecado, sigue con el urooncólogo. Excluye mal pronóstico y pacientes sin remisión.</p>
 <p class="note">La presentación no incluye una sección de tratamiento.</p>`]

/* ==================== PENE ==================== */
{id:"pene", name:"Cáncer de pene", short:"Ca pene",
 lede:"Carcinoma epidermoide asociado a VPH, fimosis e inflamación crónica. Las metástasis inguinales son el principal factor pronóstico.",
 sections:[
 ["Lesiones premalignas",`<ul><li>Tienen potencial de desarrollar <b>carcinoma escamoso</b>; el <mark>42 %</mark> de los pacientes tiene lesiones premalignas preexistentes.</li></ul>
 <div class="grid2"><div class="mini"><h4>Cuerno cutáneo</h4><ul><li>Raro; surge de nevos, verrugas o abrasiones traumáticas.</li><li>Epitelio cornificado, sólido y protuberante. Asociado a <b>VPH 16</b>.</li><li>Histología: hiperqueratosis y acantosis.</li><li>Tx: escisión quirúrgica y vigilancia.</li></ul></div>
 <div class="mini"><h4>Liquen escleroso (balanitis xerótica obliterante)</h4><ul><li>Placas blanquecinas múltiples en <b>patrón de mosaico</b>.</li><li>Fisuras y alta tasa de <b>estenosis</b>; en no circuncidados.</li><li>Dolor, prurito, obstrucción urinaria.</li><li>Tx: esteroides y escisión; dilataciones y meatoplastía si afecta la uretra.</li></ul></div></div>`],
 ["Lesiones relacionadas a virus",`<div class="grid2"><div class="mini"><h4>Condiloma acuminado</h4><ul><li><b>Lesión más asociada a Ca escamoso.</b></li><li>Crecimiento papilomatoso blando (verrugas genitales) en pene, prepucio y glande; uretra en 5 %. Raro antes de la pubertad.</li><li>VPH 6, 11, 42, 43, 44: bajo grado. <b>VPH 16, 18, 31, 33, 35, 39: alto grado</b>, más relacionados con malignidad.</li><li>Tx: <b>imiquimod crema 5 %</b> (inmunomodulador, puede eliminar el VPH); podofilina, ácido tricloroacético. Circuncisión para lesiones del prepucio; escisión o fulguración en lesiones grandes.</li></ul></div>
 <div class="mini"><h4>Papulosis bowenoide</h4><ul><li>Pápulas múltiples pigmentadas de <b>2–3 mm</b>.</li><li>Histológicamente parece CIS.</li><li>Tx: crioterapia, láser, escisión o 5-FU.</li></ul></div>
 <div class="mini"><h4>Sarcoma de Kaposi</h4><ul><li>Tumor del sistema retículo-endotelial.</li><li>Pápula neovascular elevada, dolorosa, sangrante o ulcerada, <b>color azulado</b>.</li><li><b>Herpes virus 8.</b></li></ul></div>
 <div class="mini"><h4>Tumor de Buschke-Löwenstein</h4><ul><li>Carcinoma verrucoso o condiloma gigante. <b>VPH 6 y 11.</b></li><li>Invade localmente y destruye la uretra; fístulas. A diferencia del condiloma (superficial), es invasor.</li><li><b>No muestra cambios malignos ni metastatiza.</b></li><li>Tx: escisión quirúrgica; recurrencia común; la terapia tópica no funciona. En recurrencias: interferón sistémico, láser Nd:YAG, crioterapia.</li></ul></div></div>`],
 ["Carcinoma in situ",`<div class="tbl"><table><tr><th></th><th>Eritroplasia de Queyrat</th><th>Enfermedad de Bowen</th></tr>
 <tr><td>Sitio</td><td><b>Glande y prepucio</b></td><td><b>Cuerpo del pene</b>, escroto y periné</td></tr>
 <tr><td>Aspecto</td><td>Lesión eritematosa aterciopelada de bordes definidos</td><td>Placas de eritema escamoso</td></tr>
 <tr><td>Progresión a invasor</td><td><mark>10–33 %</mark></td><td><mark>5 %</mark></td></tr></table></div>
 <ul><li>Metástasis sumamente raras.</li><li>Tx: escisión con <b>margen de 5 mm</b>, 5-FU tópico, láser Nd:YAG o CO₂; RT si no es candidato a cirugía y no responde a 5-FU.</li><li>La circuncisión <b>no parece proteger</b> contra CIS.</li></ul>`],
 ["Epidemiología, factores de riesgo y prevención",`<ul><li>0.4–0.6 % de los tumores malignos en EUA y Europa; hasta <b>10 %</b> en algunos países de Asia, África y Sudamérica.</li><li>Hombres en la <b>6.ª década</b> (promedio 68 años); 22 % &lt; 40 años, 7 % &lt; 30 años.</li><li>Sin diferencias raciales; poco frecuente en judíos.</li></ul>
 <div class="tbl"><table><tr><th>Factor de riesgo</th><th>Dato</th></tr>
 <tr><td>Conducta sexual</td><td>Múltiples parejas, inicio temprano</td></tr><tr><td><b>VPH</b></td><td>16, 18, 31 y 33</td></tr>
 <tr><td><b>Fimosis</b></td><td>8 veces más riesgo</td></tr><tr><td>Inflamación crónica</td><td>Balanopostitis; liquen escleroso (9–13 %)</td></tr>
 <tr><td>Tabaco</td><td>3–4.5 veces más riesgo</td></tr><tr><td>Otros</td><td>VIH, luz ultravioleta</td></tr></table></div>
 <p><b>Prevención:</b> la circuncisión neonatal es de las medidas más importantes, aunque es controversial (no sería necesaria con buena higiene). Evitar UV, tabaco y VPH. Vacunas: Cervarix (VPH 16/18) y Gardasil (VPH 16, 18, 6, 11).</p>`],
 ["Presentación e historia natural",`<div class="grid2"><div class="mini"><h4>Localización</h4><ul><li><b>Glande 48 %</b></li><li>Prepucio 21 %</li><li>Ambos 9 %</li><li>Surco coronal 6 %</li><li>Cuerpo 2 %</li></ul></div>
 <div class="mini"><h4>Forma de presentación</h4><ul><li>2/3 con enfermedad localizada.</li><li>Masa 47 %, úlcera 35 %, lesión inflamatoria 17 %, incidental 0.7 %.</li><li>La <b>fimosis puede ocultar</b> la lesión.</li><li>Dolor leve, no proporcional a la lesión. Avanzado: debilidad, pérdida de peso, fatiga.</li></ul></div>
 <div class="mini"><h4>Ganglios</h4><ul><li>Ganglios palpables en 50–60 %; de ellos 50–80 % son metástasis.</li><li>20–30 % de los ganglios no palpables tienen <b>micrometástasis oculta</b>.</li></ul></div></div>
 <ul><li>Inicia como lesión papilar o exofítica pequeña. Peor pronóstico: <b>planas, ulceradas, &gt; 5 cm</b> o que ocupan 75 % del eje.</li><li>La <b>fascia de Buck</b> es una barrera protectora.</li><li>Primer sitio de metástasis: <b>ganglios regionales femorales e ilíacos</b>. Afectación inguinal: necrosis, infección, sepsis, hemorragia por erosión de vasos femorales.</li><li>Metástasis a distancia raras (1–10 %): pulmón, hígado, hueso, cerebro.</li><li>Sin tratamiento causa la muerte en <b>≈ 2 años</b>.</li></ul>`],
 ["Diagnóstico",`<ul><li>15–50 % consulta con <b>retraso de 1 año</b>.</li><li><b>Biopsia</b>: confirma diagnóstico, profundidad, invasión vascular y perineural, y grado.</li><li>Histología: queratinización, <b>perlas epiteliales</b>, alta actividad mitótica, invasión por debajo de la membrana basal.</li><li>Laboratorio: normal, o anemia, leucocitosis, hipoalbuminemia, <b>hipercalcemia</b>, azoemia.</li></ul>
 <div class="tbl"><table><tr><th>Subtipo</th><th>%</th><th>Comportamiento</th></tr>
 <tr><td>Clásico</td><td>59</td><td>Pronóstico intermedio</td></tr><tr><td>Papilar</td><td>15</td><td></td></tr>
 <tr><td>Basaloide</td><td>10</td><td rowspan="1"><b>Agresivo</b>, relacionado a VPH</td></tr><tr><td>Condilomatoso</td><td>10</td><td></td></tr>
 <tr><td>Verrucoso</td><td>3</td><td><b>Más favorable</b></td></tr><tr><td>Sarcomatoide</td><td>3</td><td><b>Agresivo</b>, relacionado a VPH</td></tr></table></div>
 <div class="tbl"><table><tr><th>Estudio</th><th>VPP</th><th>Sensibilidad</th><th>Especificidad</th></tr>
 <tr><td>Clínica</td><td>100 %</td><td>86 %</td><td>100 %</td></tr><tr><td>USG</td><td>67 %</td><td>57 %</td><td>91 %</td></tr><tr><td>RM</td><td>75 %</td><td>100 %</td><td>91 %</td></tr></table></div>
 <ul><li>USG: lesión hipoecoica; no distingue T1 de T2 en glande y cuerpo esponjoso (no hay albugínea).</li><li><b>RM</b> para invasión de cuerpos cavernosos. La TAC no es buena para tejidos blandos.</li></ul>
 <div class="grid2"><div class="mini"><h4>Protocolo mínimo</h4><ul><li><b>T</b>: examen clínico y biopsia.</li><li><b>N</b>: examen clínico; TAC si hay ganglios palpables; disección superficial si alto grado, invasión vascular o patrón invasivo; BAAF en casos indicados.</li><li><b>M</b>: examen, Rx tórax, PFH, calcio, RM, gammagrama óseo.</li></ul></div>
 <div class="mini"><h4>Diagnóstico diferencial</h4><ul><li>Condiloma acuminado, Buschke-Löwenstein, balanitis xerótica obliterante.</li><li>Chancro, chancroide, herpes, linfogranuloma venéreo, granuloma inguinal, tuberculosis.</li></ul></div></div>`],
 ["Estadificación TNM, grado y riesgo",`<div class="grid2"><div class="mini"><h4>T (2010)</h4><ul><li>Tis: carcinoma in situ. Ta: verrucoso no invasivo.</li><li>T1a: tejido conectivo subepitelial, sin invasión linfovascular y no pobremente diferenciado.</li><li>T1b: tejido subepitelial con invasión linfovascular o pobremente diferenciado.</li><li><b>T2: cuerpo esponjoso o cavernoso.</b></li><li><b>T3: uretra.</b></li><li>T4: otras estructuras adyacentes.</li></ul></div>
 <div class="mini"><h4>N y M</h4><ul><li>N1: ganglio inguinal palpable, móvil, unilateral (pN1: un ganglio).</li><li>N2: móviles múltiples o bilaterales.</li><li>N3: masa inguinal fija o adenopatía pélvica (pN3: extensión extranodal o pélvica).</li><li>M1: metástasis a distancia.</li></ul></div></div>
 <div class="tbl"><table><tr><th>Etapa</th><th>Definición</th></tr><tr><td>0</td><td>Tis o Ta, N0 M0</td></tr><tr><td>I</td><td>T1a N0 M0</td></tr><tr><td>II</td><td>T1b, T2 o T3, N0 M0</td></tr><tr><td>IIIa / IIIb</td><td>T1–3 con N1 / N2</td></tr><tr><td>IV</td><td>T4, N3 o M1</td></tr></table></div>
 <div class="tbl"><table><tr><th>Grado (AJCC)</th><th>Mortalidad a 5 años: local</th><th>N+</th><th>M+</th></tr>
 <tr><td>G1 bien diferenciado</td><td>6.5 %</td><td>22.2 %</td><td>—</td></tr><tr><td>G2 moderadamente</td><td>19.4 %</td><td>54.6 %</td><td>—</td></tr><tr><td>G3–4 pobremente / indiferenciado</td><td>34.4 %</td><td>54.7 %</td><td>67.8 %</td></tr></table></div>
 <div class="tbl"><table><tr><th>Grupo de riesgo (EAU)</th><th>Características</th><th>Riesgo de N+</th></tr>
 <tr><td><b>Bajo</b></td><td>Tis, Ta G1–2, T1 G1</td><td>0 %</td></tr><tr><td><b>Intermedio</b></td><td>T1 G2</td><td>9–13 %</td></tr><tr><td><b>Alto</b></td><td>T2 o G3</td><td>35–81 %</td></tr></table></div>`],
 ["Manejo del tumor primario",`<ul><li><b>Amputación</b> (penectomía): estándar de oro para el control oncológico rápido, en <b>T2–T4</b>. Recidiva local 0–8 %.</li><li><b>Cirugía conservadora de órgano</b>: CIS, Ta, T1, G1 y G2. Busca preservar la sensibilidad del glande y la longitud del pene.</li><li>Otras opciones: 5-FU o imiquimod tópico en CIS, radioterapia, cirugía de Mohs, escisión limitada, ablación láser.</li></ul>
 <div class="grid2"><div class="mini"><h4>Microcirugía de Mohs</h4><ul><li>CIS y tumores pequeños invasivos superficiales.</li><li>Escisión capa por capa con examen microscópico de cada capa: margen negativo preciso y preserva el órgano.</li><li>Recidivas ligadas a tumor &gt; 3 cm, estadio avanzado o fracaso de terapia previa.</li></ul></div>
 <div class="mini"><h4>Ablación láser</h4><ul><li>CIS y T1 seleccionados.</li><li>CO₂, argón, Nd:YAG y KTP.</li><li>CO₂ en desuso: penetra 0.1 mm, recidivas 50 %.</li><li><b>Nd:YAG penetra 6 mm</b> (desnaturaliza proteínas).</li><li>Vigilancia estrecha.</li></ul></div></div>
 <p class="note">El tratamiento de cada lesión, los nombres de las cirugías y los algoritmos de manejo están en la sección 11, "Tratamiento por tipo y etapa".</p>`],
 ["Linfadenectomía y seguimiento",`<ul><li>La presencia y extensión de <b>metástasis inguinales</b> es el <mark>factor pronóstico más importante</mark> para la sobrevida.</li><li>&lt; 2 metástasis ganglionares: sobrevida a 5 años de 77 %.</li><li>Sobrevida global ≈ 80 % tras resección curativa si: enfermedad ganglionar mínima (&lt; 2 ganglios), unilateral, sin extensión extranodal y sin metástasis pélvicas.</li><li>La adenopatía palpable se asocia en 43 % a metástasis ganglionar.</li><li>Linfadenectomía inmediata vs diferida en ganglios no palpables: <b>controversial</b>.</li></ul>
 <div class="grid2"><div class="mini"><h4>Complicaciones</h4><ul><li>Flebitis, embolia pulmonar, infección de herida, necrosis del colgajo, linfedema de escroto y miembros inferiores.</li><li>En las series de la clase: necrosis del borde 8–62 %, linfedema 23–50 %, infección 10–17 %, seroma 6–16 %, muerte 0–1.8 %.</li></ul></div>
 <div class="mini"><h4>Vigilancia expectante de la ingle</h4><ul><li>CIS.</li><li>Ta (carcinoma verrucoso).</li><li>T1 G1 y G2 sin invasión vascular.</li></ul></div>
 <div class="mini"><h4>Estadificación inguinal sin ganglios palpables</h4><ul><li>BAAF, biopsia de ganglio, ganglio centinela (simple o extendido), mapeo linfático intraoperatorio, disección superficial o modificada, linfadenectomía laparoscópica.</li></ul></div></div>
 <div class="tbl"><table><tr><th>Año de seguimiento</th><th>Riesgo bajo</th><th>Riesgo alto</th></tr><tr><td>1–2</td><td>Cada 3 meses</td><td>Cada 2 meses</td></tr><tr><td>3</td><td>Cada 4 meses</td><td>Cada 3 meses</td></tr><tr><td>4</td><td>Cada 6 meses</td><td>Cada 6 meses</td></tr><tr><td>5 en adelante</td><td>Anual</td><td>Anual</td></tr></table></div>`],
 ["Tumores malignos no escamosos",`<div class="grid2"><div class="mini"><h4>Carcinoma basocelular</h4><ul><li>Raro, crecimiento lento, metástasis raras.</li><li>Escisión local curativa.</li></ul></div>
 <div class="mini"><h4>Melanoma</h4><ul><li>Lesión negro-azulada o pápula rojizo-marrón.</li><li>Dx por biopsia.</li><li>Metástasis hematógena y linfática a distancia en <b>60 %</b>.</li><li>Tx: cirugía, QT, RT.</li></ul></div>
 <div class="mini"><h4>Leiomiosarcoma</h4><ul><li>Tumor mesenquimal raro; metástasis regionales raras.</li><li>Lesiones en la base: peor pronóstico.</li><li>Tx quirúrgico; recidiva.</li></ul></div>
 <div class="mini"><h4>Enfermedad de Paget</h4><ul><li>Lesión eritematosa eczematoide; Dx por biopsia.</li><li>Asociada a Ca de próstata, vejiga y riñón.</li><li>Tx: resección de piel y dermis con <b>margen de 3 cm</b>.</li></ul></div></div>`],
 ["Tratamiento por tipo y etapa (resumen)",`<p>Todo lo que dice la presentación sobre el tratamiento, junto en una sola tabla. <span class="tag">Qx</span> marca los procedimientos quirúrgicos.</p>
 <div class="tbl"><table><tr><th>Lesión / etapa</th><th>Tratamiento</th></tr>
 <tr><td><b>Cuerno cutáneo</b></td><td><span class="tag">Qx</span> <b>Escisión quirúrgica</b> y vigilancia postoperatoria.</td></tr>
 <tr><td><b>Liquen escleroso</b> (balanitis xerótica obliterante)</td><td>Esteroides y <span class="tag">Qx</span> <b>escisión quirúrgica</b>. Si afecta la uretra: <b>dilataciones uretrales</b> y <b>meatoplastía</b>.</td></tr>
 <tr><td><b>Condiloma acuminado</b></td><td><b>Imiquimod crema 5 %</b>, podofilina, ácido tricloroacético. <span class="tag">Qx</span> <b>Circuncisión</b> (quita lesiones del prepucio y facilita el tratamiento tópico y la vigilancia). <span class="tag">Qx</span> <b>Escisión o fulguración</b> en lesiones grandes.</td></tr>
 <tr><td><b>Papulosis bowenoide</b></td><td><b>Crioterapia</b>, <b>fulguración con láser</b>, <span class="tag">Qx</span> <b>escisión</b> o <b>5-FU</b> tópico.</td></tr>
 <tr><td><b>Sarcoma de Kaposi</b></td><td class="note">La presentación no menciona tratamiento.</td></tr>
 <tr><td><b>Tumor de Buschke-Löwenstein</b></td><td><span class="tag">Qx</span> <b>Escisión quirúrgica</b> (la terapia tópica no funciona). Recurrencias: <b>interferón sistémico</b>, <b>láser Nd:YAG</b>, <b>crioterapia</b>.</td></tr>
 <tr><td><b>Carcinoma in situ</b> (Queyrat, Bowen)</td><td><span class="tag">Qx</span> <b>Escisión con margen de 5 mm</b>, <b>5-FU</b> o <b>imiquimod</b> tópico, <b>láser Nd:YAG o CO₂</b>, <span class="tag">Qx</span> <b>cirugía de Mohs</b>. <b>Radioterapia</b> si no es candidato a cirugía y no responde a 5-FU.</td></tr>
 <tr><td><b>Ta, T1 G1–G2</b> (bajo riesgo)</td><td><span class="tag">Qx</span> <b>Cirugía conservadora de órgano</b> (preserva sensibilidad del glande y longitud), <span class="tag">Qx</span> <b>microcirugía de Mohs</b> en tumores pequeños superficiales, <span class="tag">Qx</span> <b>escisión limitada</b>, <b>ablación láser</b> (Nd:YAG; CIS y T1), <b>radioterapia</b>. Ingle: <b>vigilancia</b> si no hay invasión vascular.</td></tr>
 <tr><td><b>T2–T4</b></td><td><span class="tag">Qx</span> <b>Amputación quirúrgica del pene</b> (penectomía): estándar de oro, recidiva local 0–8 %. Más manejo ganglionar según el algoritmo de alto riesgo.</td></tr>
 <tr><td><b>Ganglios inguinales</b></td><td><span class="tag">Qx</span> <b>Linfadenectomía inguinal</b> (superficial, profunda, modificada, laparoscópica), <b>ganglio centinela</b>, <span class="tag">Qx</span> <b>disección pélvica</b>; ver algoritmos abajo.</td></tr>
 <tr><td><b>Enfermedad avanzada</b></td><td><b>Quimioterapia</b> de inducción o neoadyuvante, luego <span class="tag">Qx</span> <b>resección quirúrgica agresiva</b> si responde; <b>QT paliativa</b> o <b>radioterapia</b> al sitio si progresa.</td></tr>
 <tr><td><b>Carcinoma basocelular</b></td><td><span class="tag">Qx</span> <b>Escisión local</b> (curativa).</td></tr>
 <tr><td><b>Melanoma</b></td><td><span class="tag">Qx</span> <b>Cirugía</b>, <b>quimioterapia</b> y <b>radioterapia</b>.</td></tr>
 <tr><td><b>Leiomiosarcoma</b></td><td><span class="tag">Qx</span> <b>Cirugía</b> (recidiva frecuente).</td></tr>
 <tr><td><b>Enfermedad de Paget</b></td><td><span class="tag">Qx</span> <b>Resección de piel y dermis con margen de 3 cm</b>.</td></tr></table></div>

 <div class="mini" style="border:1px dashed var(--line);background:transparent"><h4>Nombres de las cirugías del tumor primario <span class="tag">no viene en las diapositivas</span></h4>
 <p class="note" style="font-style:normal">La clase solo dice "amputación" y "cirugía conservadora de órgano". Estos son los nombres que se usan habitualmente en las guías (EAU), como complemento:</p>
 <ul><li><b>Circuncisión</b>: lesiones limitadas al prepucio.</li><li><b>Resurfacing del glande</b>: CIS del glande.</li><li><b>Escisión local amplia</b> o <b>glandectomía (glansectomía)</b>: Ta, T1 y algunos T2 limitados al glande.</li><li><b>Penectomía parcial</b>: T2 del cuerpo del pene, si queda muñón funcional.</li><li><b>Penectomía total con uretrostomía perineal</b>: T2–T3 proximales o cuando la parcial no deja longitud útil.</li><li><b>Emasculación</b>: casos muy avanzados (T4 con invasión de escroto).</li></ul></div>

 <h4 style="font:700 1.02rem var(--display);margin:14px 0 4px;color:var(--t)">Algoritmo ganglionar: riesgo bajo (Tis, Ta, T1 G1–2 sin invasión vascular)</h4>
 <div class="grid2"><div class="mini"><h4>Tis, Ta</h4><ul><li>Exploración ganglionar <b>negativa</b> → observar.</li><li><b>Positiva</b> → 4 semanas de antibiótico y revalorar → si persiste la adenopatía, <b>BAAF</b>.</li><li>BAAF positiva → disección. BAAF negativa → <b>biopsia excisional</b>: positiva → disección; negativa → observar.</li></ul></div>
 <div class="mini"><h4>T1 G1–2</h4><ul><li>Exploración <b>negativa</b> → observar.</li><li><b>Positiva</b> → <b>BAAF</b> directa: positiva → algoritmo positivo; negativa → 4 semanas de antibiótico → si persiste, biopsia excisional.</li></ul></div></div>
 <p>Cuando se confirma metástasis: <span class="tag">Qx</span> <b>disección inguinal ipsilateral (superficial + profunda) y pélvica</b> + <b>disección inguinal superficial contralateral</b> con estudio transoperatorio.</p>

 <h4 style="font:700 1.02rem var(--display);margin:14px 0 4px;color:var(--t)">Algoritmo ganglionar: riesgo alto (T2–T4, o cualquier T con invasión vascular, crecimiento nodular o G3)</h4>
 <div class="tbl"><table><tr><th>Exploración de ingles</th><th>Conducta</th></tr>
 <tr><td>Ambas negativas</td><td><span class="tag">Qx</span> <b>Disección inguinal superficial bilateral</b> (o disección modificada / <b>ganglio centinela dinámico</b> en centros con experiencia) con corte congelado. Negativa → observar. Positiva → <b>disección inguinal profunda y pélvica ipsilateral</b>.</td></tr>
 <tr><td>Unilateral positiva, móvil &lt; 4 cm</td><td><span class="tag">Qx</span> <b>Disección inguinal ipsilateral (superficial + profunda) y pélvica</b> + <b>superficial contralateral</b>. Contralateral positiva → disección profunda y pélvica de ese lado; negativa → observar.</td></tr>
 <tr><td>Bilateral positiva, móvil &lt; 4 cm</td><td>Considerar <b>BAAF</b>. Negativa → algoritmo "bilateral negativo". Positiva → <span class="tag">Qx</span> <b>disección ilioinguinal bilateral</b> + terapia adyuvante, <b>o</b> QT neoadyuvante seguida de disección ilioinguinal (ambas aceptables).</td></tr>
 <tr><td>Ganglios fijos, móviles ≥ 4 cm o pélvicos</td><td><b>QT de inducción</b> → respuesta o estable: <span class="tag">Qx</span> <b>resección quirúrgica agresiva</b>. Progresión: ensayo clínico, <b>QT paliativa</b>, <b>RT</b> al sitio → si sigue progresando, cuidados paliativos (hospicio).</td></tr></table></div>
 <p class="note">Terapia adyuvante si hay &gt; 2 ganglios positivos, metástasis bilaterales, extensión extranodal o ganglios pélvicos positivos.</p>

 <div class="grid2"><div class="mini"><h4>Radioterapia y braquiterapia (tumor primario)</h4><ul><li><b>RT externa</b> 40–60 Gy: control local a 5 años 44–70 %, preservación del pene 43–66 %.</li><li><b>Braquiterapia</b> 50–70 Gy: control local 70–87.5 %, sobrevida cáncer-específica 72–88 %, preservación 70–88 %.</li><li>Complicaciones: <b>necrosis</b> y <b>estenosis</b> (hasta 45 %).</li></ul></div>
 <div class="mini"><h4>Quimioterapia sin bleomicina</h4><ul><li>5-FU + cisplatino: respuesta 25 %, SV media 11.5 meses.</li><li><b>Paclitaxel + ifosfamida + cisplatino</b>: respuesta <b>55 %</b>, SV 11 meses.</li><li>Irinotecán + cisplatino: respuesta 30.8 %, SV 4.7 meses.</li></ul></div></div>`]

let lbList=[], lbI=0, lbEl=null;
function openLB(list,i){lbList=list;lbI=i;
  if(!lbEl){lbEl=document.createElement("div");lbEl.className="lb";lbEl.setAttribute("role","dialog");lbEl.setAttribute("aria-modal","true");
    lbEl.innerHTML=`<img alt=""><div class="cap"></div><div class="ctl"><button data-a="p">Anterior</button><button data-a="c">Cerrar</button><button data-a="n">Siguiente</button></div>`;
    lbEl.onclick=e=>{const a=e.target.dataset.a; if(e.target===lbEl||a==="c")closeLB(); if(a==="p")stepLB(-1); if(a==="n")stepLB(1)};
    document.body.appendChild(lbEl)}
  lbEl.hidden=false; drawLB(); lbEl.querySelector('[data-a="c"]').focus()}
function drawLB(){const [f,l,c]=lbList[lbI];const im=lbEl.querySelector("img");im.src=img(f);im.alt=l;lbEl.querySelector(".cap").innerHTML=`<b>${esc(l)}</b>${esc(c)}<br><small>${lbI+1} / ${lbList.length}</small>`}
function stepLB(d){lbI=(lbI+d+lbList.length)%lbList.length;drawLB()}
function closeLB(){if(lbEl)lbEl.hidden=true}
document.addEventListener("keydown",e=>{if(!lbEl||lbEl.hidden)return; if(e.key==="Escape")closeLB(); if(e.key==="ArrowRight")stepLB(1); if(e.key==="ArrowLeft")stepLB(-1)});

function go(id){

  toc.innerHTML=""; if(tocObs){tocObs.disconnect();tocObs=null}
  if(typeof MUSIC!=="undefined") MUSIC.stop();
  fab.hidden=!T.some(t=>t.id===id);
  view.dataset.topic=id;
  store.set("gastro-tab",id);
  try{history.replaceState(null,"","#"+id)}catch(e){}
  closeLB();
  if(id==="inicio") renderHome(); else if(id==="repaso") renderMixed(); else if(id==="atlas") renderAtlas(); else if(id==="casos") renderCases(); else if(id==="decisiones") renderDec(); else if(id==="tnm") renderTNMPage(); else if(id==="juego") renderGame(); else if(id==="extra") renderExtra(); else if(id==="extra2") renderExtra2(); else if(id==="extra3") renderExtra3(); else renderTopic(T.find(t=>t.id===id));

}
