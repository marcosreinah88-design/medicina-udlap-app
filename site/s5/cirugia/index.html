function flashcards(el, cards){
  let order=cards.map((_,i)=>i), i=0;
  el.className="fc-wrap";
  el.innerHTML=`<div class="fc" tabindex="0" role="button" aria-label="Voltear tarjeta"><div class="fc-inner"><div class="fc-face fc-front"><small>Pregunta</small><p></p></div><div class="fc-face fc-back"><small>Respuesta</small><p></p></div></div></div>
  <div class="fc-nav"><button class="btn" data-a="prev">Anterior</button><button class="btn primary" data-a="flip">Voltear</button><button class="btn" data-a="next">Siguiente</button><button class="btn" data-a="shuf">Barajar</button><span class="fc-count"></span></div>`;
  const card=el.querySelector(".fc"), f=el.querySelector(".fc-front p"), b=el.querySelector(".fc-back p"), c=el.querySelector(".fc-count");
  const show=()=>{const wasFlipped=card.classList.contains("flip");card.classList.remove("flip");const k=cards[order[i]];f.textContent=k[0];setTimeout(()=>b.textContent=k[1],wasFlipped?220:0);c.textContent=`${i+1} / ${cards.length}`};
  const flip=()=>card.classList.toggle("flip");
  card.onclick=flip; card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  el.querySelector(".fc-nav").onclick=e=>{const a=e.target.dataset.a;if(!a)return;
    if(a==="flip")return flip();
    if(a==="next")i=(i+1)%cards.length; if(a==="prev")i=(i-1+cards.length)%cards.length;
    if(a==="shuf"){order=shuffle(order);i=0}
    show()};
  show();
}

/* items: {q:[enunciado, opciones, correcta, explicación], t, im?} */
function quiz(el, items, key, again){
  let right=0, done=0;
  el.innerHTML=`<div class="score"><span class="num">0 / ${items.length}</span><div class="bar"><i></i></div><button class="btn" data-reset>Reiniciar</button></div>`+
   items.map(({q,t,im},n)=>`<div class="q" data-n="${n}"><div class="stem">${key==="mix"||key==="atlas"?`<span class="tag">${t.short}</span>`:""}${n+1}. ${esc(q[0])}</div>${im?`<div class="qimg" data-im="${n}"><img src="${img(im[0])}" alt="Imagen para identificar" loading="lazy"></div>`:""}<div class="opts">${q[1].map((o,j)=>`<button class="opt" data-j="${j}"><span class="l">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="why" hidden>${esc(q[3])}</div></div>`).join("");
  const num=el.querySelector(".num"), bar=el.querySelector(".bar i");
  el.querySelector("[data-reset]").onclick=()=>quiz(el, again?again():items, key, again);
  el.querySelectorAll(".qimg").forEach(d=>d.onclick=()=>{const it=items[d.dataset.im];openLB([[it.im[0],"Imagen del quiz","Responde primero y luego revisa el pie de foto en la galería."]],0)});
  el.querySelectorAll(".q").forEach(qe=>{
    const q=items[qe.dataset.n].q;
    qe.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
      const j=+btn.dataset.j;
      qe.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.j===q[2])o.classList.add("right")});
      if(j===q[2])right++; else btn.classList.add("wrong");
      qe.querySelector(".why").hidden=false; done++;
      num.textContent=`${right} / ${items.length}`; bar.style.width=(right/items.length*100)+"%";
      if(done===items.length){ if(T.some(t=>t.id===key)&&(best[key]==null||right>best[key])){best[key]=right;store.set("gastro-best",best)} num.textContent+=` · ${right===items.length?"¡Perfecto!":"Terminado"}` }
    });
  });
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function imageQuiz(pool){
  return shuffle(pool).slice(0,12).map(({f,t})=>{
    const same=ALLFIGS.filter(x=>x.f[1]!==f[1]&&x.t===t), other=ALLFIGS.filter(x=>x.f[1]!==f[1]&&x.t!==t);
    const wrong=shuffle(same).slice(0,2).concat(shuffle(other)).filter((x,i,a)=>a.findIndex(y=>y.f[1]===x.f[1])===i).slice(0,3).map(x=>x.f[1]);
    const opts=shuffle([f[1],...wrong]);
    return {q:["¿Qué muestra esta imagen?",opts,opts.indexOf(f[1]),`${f[1]}: ${f[2]}`],t,im:f};
  });
}

function caseBlock(el, list, showTopic){
  el.innerHTML = list.map(({c,t},k)=>`<article class="case" data-topic="${t.id}" data-k="${k}">
   <header><span class="kicker">${showTopic?t.short+" · ":""}Caso ${k+1}</span><h3>${esc(c.title)}</h3></header>
   <div class="vig">${c.img?`<button class="vimg" data-img="${c.img}"><img src="${img(c.img)}" alt="" loading="lazy"></button>`:""}<p>${esc(c.vig)}</p></div>
   <div class="steps"></div><div class="cdone" hidden></div></article>`).join("");
  el.querySelectorAll(".case").forEach(art=>{
    const {c,t}=list[+art.dataset.k]; let s=0, ok=0;
    const vb=art.querySelector(".vimg"); if(vb) vb.onclick=()=>{const f=ALLFIGS.find(x=>x.f[0]===c.img);openLB([f?f.f:[c.img,c.title,""]],0)};
    const next=()=>{
      if(s>=c.steps.length){const d=art.querySelector(".cdone");d.hidden=false;d.innerHTML=`<b>Caso terminado:</b> ${ok} de ${c.steps.length} pasos correctos. <button class="btn" data-r>Repetir</button>`;d.querySelector("[data-r]").onclick=()=>caseBlock(el,list,showTopic);return}
      const [q,o,r,w]=c.steps[s], n=s;
      const st=document.createElement("div"); st.className="step";
      st.innerHTML=`<div class="sn">Paso ${n+1} de ${c.steps.length}</div><div class="stem">${esc(q)}</div><div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}"><span class="l">${"ABCDE"[j]}</span><span>${esc(x)}</span></button>`).join("")}</div><div class="why" hidden>${esc(w)}</div>`;
      art.querySelector(".steps").appendChild(st);
      st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;st.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===r)x.classList.add("right")});if(j===r)ok++;else b.classList.add("wrong");st.querySelector(".why").hidden=false;s++;setTimeout(next,250)});
    };
    next();
  });
}

function tnmBlock(el, tid, showTopic){
  const cfg=TNM[tid], t=T.find(x=>x.id===tid);
  el.innerHTML=cfg.items.map((it,k)=>`<article class="tnm" data-topic="${tid}" data-k="${k}">
   <button class="tim" data-img="${it.img}"><img src="${img(it.img)}" alt="" loading="lazy"></button>
   <div class="tbody"><span class="kicker">${showTopic?t.short+" · ":""}Ejercicio ${k+1}</span><p>${esc(it.txt)}</p>
   <div class="tsel">${Object.entries(cfg.fields).map(([f,opts])=>`<label><span>${f}</span><select data-f="${f}"><option value="">—</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select></label>`).join("")}</div>
   <div class="toolbar"><button class="btn primary" data-chk>Revisar</button><button class="btn" data-show>Ver respuesta</button></div><div class="why" hidden></div></div></article>`).join("");
  el.querySelectorAll(".tnm").forEach(a=>{
    const it=cfg.items[+a.dataset.k];
    a.querySelector(".tim").onclick=()=>{const f=ALLFIGS.find(x=>x.f[0]===it.img);openLB([f?f.f:[it.img,"",""]],0)};
    const res=(reveal)=>{let good=0,tot=0;a.querySelectorAll("select").forEach(s=>{const f=s.dataset.f, want=it.a[f];tot++;if(reveal)s.value=want;const ok=s.value===want;if(ok)good++;s.parentNode.classList.toggle("ok",ok);s.parentNode.classList.toggle("bad",!ok)});
      const w=a.querySelector(".why");w.hidden=false;w.innerHTML=`<b>${reveal?"Respuesta":good===tot?"¡Correcto!":`${good} de ${tot} correctos`}:</b> ${Object.entries(it.a).map(([k,v])=>`${k} ${v}`).join(" · ")}. ${esc(it.why)}`};
    a.querySelector("[data-chk]").onclick=()=>res(false);
    a.querySelector("[data-show]").onclick=()=>res(true);
  });
}

function renderCases(){
  const all=T.flatMap(t=>(CASES[t.id]||[]).map(c=>({c,t})));
  view.innerHTML=`<div class="phead"><span class="kicker">Práctica</span><h1>Casos clínicos</h1><p class="lede">${all.length} casos de los ${T.length} temas. Lee el caso y responde paso a paso: cada respuesta abre el siguiente paso.</p></div>
  <div class="chips" id="cflt"><button class="chip" data-f="all" aria-pressed="true">Todos</button>${T.map(t=>`<button class="chip" data-f="${t.id}" aria-pressed="false">${t.short}</button>`).join("")}</div><div id="cl" class="cases"></div>`;
  const draw=f=>caseBlock(view.querySelector("#cl"),all.filter(x=>f==="all"||x.t.id===f),true);
  view.querySelector("#cflt").onclick=e=>{const f=e.target.dataset.f;if(!f)return;view.querySelectorAll("#cflt .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===f));draw(f)};
  draw("all");
}

function renderTNMPage(){
  view.innerHTML=`<div class="phead"><span class="kicker">Práctica</span><h1>Ejercicios TNM</h1><p class="lede">Mira la imagen de la clase, lee los datos y elige T, N, M${""} y la etapa. "Revisar" marca en verde y rojo cada campo.</p></div>
  ${Object.keys(TNM).map(id=>{const t=T.find(x=>x.id===id);return `<section data-topic="${id}" class="tgroup"><h2 class="sec">${t.name}</h2><p class="note" style="margin:-4px 0 6px">${id==="testiculo"?"AJCC 8.ª edición. Incluye la categoría S de marcadores tumorales.":"TNM 2010 de la presentación."}</p><div class="tnms" data-id="${id}"></div></section>`}).join("")}`;
  view.querySelectorAll(".tnms").forEach(d=>tnmBlock(d,d.dataset.id,false));
}

/* Sonido: clics, efectos del juego, música y alarma del pomodoro (Web Audio, sin archivos). */
const SND = (()=>{
  let ctx=null, master=null;
  let on = store.get("sonido")!==false;
  function ac(){
    if(!ctx){const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; ctx=new A(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);}
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function tone(f, dur, {type="sine", vol=.2, at=0, slide=0, dest}={}){
    const c=ac(); if(!c) return; const t=c.currentTime+at;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+.02);
  }
  return {
    get on(){return on},
    set on(v){on=v; store.set("sonido",v); if(!v) MUSIC.stop(); document.querySelectorAll("[data-sound]").forEach(b=>{b.setAttribute("aria-pressed",v);b.title=v?"Silenciar sonidos":"Activar sonidos";b.querySelector("span").textContent=v?"Sonido":"Silencio"})},
    ac, tone, get master(){ac(); return master},
    click(){ if(on) tone(1800,.045,{type:"triangle",vol:.08,slide:.6}) },
    ok(){ if(!on) return; tone(660,.12,{type:"triangle",vol:.18}); tone(990,.18,{type:"triangle",vol:.16,at:.08}) },
    bad(){ if(!on) return; tone(220,.25,{type:"sawtooth",vol:.08,slide:.7}) },
    chime(){ if(!on) return; [784,988,1175,1568].forEach((f,i)=>tone(f,.9,{vol:.16,at:i*.18})); [784,988,1175,1568].forEach((f,i)=>tone(f,.9,{vol:.12,at:1.2+i*.18})) },
    fanfare(){ if(!on) return; [523,659,784,1047].forEach((f,i)=>tone(f,.35,{type:"triangle",vol:.15,at:i*.11})) }
  };
})();

/* Música del juego: secuenciador simple en La menor (Am–F–C–G), 8 bits. */
const MUSIC = (()=>{
  let timer=null, step=0, next=0, bus=null, bpm=118;
  const prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const mel=[76,null,74,72,74,null,72,69, 72,null,69,67,69,null,72,74, 72,null,71,72,76,null,74,72, 74,null,72,71,67,null,null,null];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function noise(t){const c=SND.ac(),b=c.createBuffer(1,c.sampleRate*.05,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type="highpass";f.frequency.value=7000;g.gain.value=.12;s.buffer=b;s.connect(f);f.connect(g);g.connect(bus);s.start(t)}
  function note(f,t,dur,type,vol){const c=SND.ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02)}
  function sched(){
    const c=SND.ac(); const s16=60/bpm/4;
    while(next<c.currentTime+.12){
      const bar=Math.floor(step/16)%4, i=step%16, ch=prog[bar];
      if(i%4===0) note(hz(ch[0]-24),next,s16*3.5,"triangle",.32);
      if(i%4===2) note(hz(ch[0]-12),next,s16*1.5,"triangle",.18);
      note(hz(ch[i%3]+12),next,s16*.9,"square",.035);
      if(i%2===0) noise(next);
      const m=mel[step%32]; if(m) note(hz(m),next,s16*1.8,"square",.06);
      next+=s16; step++;
    }
  }
  return {
    get playing(){return !!timer},
    start(){ if(timer||!SND.on) return; const c=SND.ac(); if(!c) return; bus=c.createGain(); bus.gain.value=.55; bus.connect(SND.master); step=0; next=c.currentTime+.05; bpm=118; timer=setInterval(sched,25); sched() },
    stop(){ if(!timer) return; clearInterval(timer); timer=null; const b=bus, c=SND.ac(); b.gain.setTargetAtTime(0,c.currentTime,.05); setTimeout(()=>b.disconnect(),400) },
    tempo(v){ bpm=v }
  };
})();

/* Pomodoro: 25 min de estudio, 5 de descanso, 15 de descanso largo cada 4 pomodoros. Sobrevive a recargar la página. */
const POMO = (()=>{
  const MODES={foco:["Estudio",25],corto:["Descanso",5],largo:["Descanso largo",15]};
  let s=Object.assign({mode:"foco",left:25*60,end:null,count:0},store.get("pomodoro")||{});
  let tick=null;
  const save=()=>store.set("pomodoro",s);
  const fmt=x=>`${String(Math.floor(x/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;
  const remaining=()=>s.end?Math.max(0,Math.round((s.end-Date.now())/1000)):s.left;
  function setMode(m){ s.mode=m; s.left=MODES[m][1]*60; s.end=null; save(); stop(); paint() }
  function finish(){
    stop(); SND.chime();
    if(s.mode==="foco"){ s.count++; setMode(s.count%4===0?"largo":"corto") } else setMode("foco");
    flash(s.mode==="foco"?"¡A estudiar!":"¡Descanso!");
  }
  function flash(msg){ const d=document.getElementById("pomo"); d.classList.add("ring"); d.querySelector(".pmsg").textContent=msg; setTimeout(()=>d.classList.remove("ring"),4000);
    const old=document.title; let k=0; const iv=setInterval(()=>{document.title=k++%2?old:"⏰ "+msg; if(k>8){clearInterval(iv);document.title=old}},700) }
  function run(){ clearInterval(tick); tick=setInterval(()=>{ if(remaining()<=0) finish(); else paint() },500) }
  function stop(){ clearInterval(tick); tick=null }
  function toggle(){ if(s.end){ s.left=remaining(); s.end=null } else { s.end=Date.now()+remaining()*1000; run() } save(); paint() }
  function reset(){ setMode(s.mode) }
  function paint(){
    const d=document.getElementById("pomo"); if(!d) return;
    const r=remaining(), tot=MODES[s.mode][1]*60;
    d.dataset.mode=s.mode; d.dataset.run=!!s.end;
    d.querySelector(".ptime").textContent=fmt(r);
    d.querySelector(".plbl").textContent=MODES[s.mode][0];
    d.querySelectorAll("[data-pm]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pm===s.mode));
    d.querySelectorAll("[data-pt]").forEach(b=>b.textContent=s.end?"Pausa":(r<tot?"Seguir":"Iniciar"));
    d.querySelector(".pring").style.setProperty("--p",(1-r/tot)*360+"deg");
    d.querySelector(".pcount").textContent=`Pomodoros completados: ${s.count}`;
  }
  function mount(){
    const d=document.createElement("div"); d.id="pomo"; d.className="dock";
    d.innerHTML=`<div class="dbar"><button class="pchip" data-open aria-expanded="false" title="Temporizador pomodoro"><span class="pring"></span><span class="ptime">25:00</span></button><button class="pplay" data-pt aria-label="Iniciar o pausar">Iniciar</button><button class="snd" data-sound aria-pressed="true" aria-label="Sonido"><span>Sonido</span></button></div>
    <div class="ppanel" hidden><div class="phd"><b>Pomodoro</b><span class="plbl"></span></div>
    <div class="chips">${Object.entries(MODES).map(([k,v])=>`<button class="chip" data-pm="${k}">${v[0]} · ${v[1]}</button>`).join("")}</div>
    <div class="pbig ptime-big"></div>
    <div class="pact"><button class="btn primary" data-pt>Iniciar</button><button class="btn" data-preset>Reiniciar</button><button class="btn" data-pskip>Saltar</button></div>
    <p class="pcount"></p><p class="pmsg" aria-live="polite"></p></div>`;
    document.body.appendChild(d);
    const panel=d.querySelector(".ppanel"), op=d.querySelector("[data-open]");
    op.onclick=()=>{panel.hidden=!panel.hidden; op.setAttribute("aria-expanded",!panel.hidden)};
    d.querySelectorAll("[data-pt]").forEach(b=>b.onclick=toggle);
    d.querySelector("[data-preset]").onclick=reset;
    d.querySelector("[data-pskip]").onclick=finish;
    d.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>setMode(b.dataset.pm));
    d.querySelector("[data-sound]").onclick=()=>{SND.on=!SND.on};
    const big=d.querySelector(".ptime-big"); const pt=d.querySelector(".ptime");
    new MutationObserver(()=>big.textContent=pt.textContent).observe(pt,{childList:true});
    SND.on=SND.on;
    if(s.end){ if(remaining()<=0) finish(); else run() }
    paint(); big.textContent=pt.textContent;
  }
  return {mount};
})();

/* Juego: Contrarreloj quirúrgico. 60 s, preguntas de todos los temas; acierto +3 s, error −5 s; rachas multiplican puntos. */
function renderGame(){
  let pick=store.get("juego-temas")||T.map(t=>t.id);
  const best=()=>store.get("juego-record")||0;
  view.innerHTML=`<div class="phead"><span class="kicker">Práctica</span><h1>Contrarreloj quirúrgico</h1><p class="lede">Contesta todas las preguntas que puedas antes de que se acabe el tiempo. Cada acierto suma 3 segundos y cada error resta 5. Las rachas multiplican los puntos.</p></div>
  <section class="game" id="game"><div class="gstart">
   <div class="grec">Récord: <b>${best()}</b> puntos</div>
   <p class="gl">Temas</p><div class="chips" id="gtopics">${T.map(t=>`<button class="chip" data-id="${t.id}" aria-pressed="${pick.includes(t.id)}">${t.short}</button>`).join("")}</div>
   <label class="gmus"><input type="checkbox" id="gmusic" ${store.get("juego-musica")!==false?"checked":""}> Música de fondo</label>
   <button class="btn primary gbig" id="gplay">Jugar</button>
   <p class="note">La música y los efectos usan el botón de sonido de la esquina inferior izquierda.</p></div></section>`;
  view.querySelectorAll("#gtopics .chip").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);pick=[...view.querySelectorAll('#gtopics .chip[aria-pressed="true"]')].map(x=>x.dataset.id);store.set("juego-temas",pick)});
  view.querySelector("#gmusic").onchange=e=>store.set("juego-musica",e.target.checked);
  view.querySelector("#gplay").onclick=()=>{ if(!pick.length){pick=T.map(t=>t.id)} play() };

  function play(){
    const g=view.querySelector("#game");
    let pool=shuffle(T.filter(t=>pick.includes(t.id)).flatMap(t=>t.quiz.map(q=>({q,t})))), idx=0;
    let time=60, score=0, streak=0, bestStreak=0, hits=0, tries=0, misses=[], last=performance.now(), raf, over=false, lock=false;
    if(document.getElementById("gmusic").checked) MUSIC.start();
    g.innerHTML=`<div class="ghud"><div class="gtime"><i></i><span></span></div><div class="gstat"><span>Puntos <b class="gs">0</b></span><span>Racha <b class="gk">0</b></span><button class="btn" data-quit>Terminar</button></div></div><div class="gcard"></div><div class="gfx" aria-live="polite"></div>`;
    const tEl=g.querySelector(".gtime span"), tBar=g.querySelector(".gtime i"), sEl=g.querySelector(".gs"), kEl=g.querySelector(".gk"), card=g.querySelector(".gcard"), fx=g.querySelector(".gfx");
    g.querySelector("[data-quit]").onclick=end;
    function show(){
      if(idx>=pool.length){pool=shuffle(pool);idx=0}
      const {q,t}=pool[idx], order=shuffle(q[1].map((o,j)=>j));
      card.innerHTML=`<span class="tag">${t.short}</span><p class="gq">${esc(q[0])}</p><div class="gopts">${order.map((j,n)=>`<button class="opt" data-nosnd data-j="${j}"><span class="l">${"ABCD"[n]}</span><span>${esc(q[1][j])}</span></button>`).join("")}</div>`;
      card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
      card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q,t));
      lock=false;
    }
    function answer(b,q,t){
      if(lock||over) return; lock=true; tries++;
      const ok=+b.dataset.j===q[2];
      card.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.j===q[2])o.classList.add("right")});
      if(ok){ streak++; hits++; bestStreak=Math.max(bestStreak,streak); const mult=Math.min(5,1+Math.floor(streak/3)); const pts=100*mult; score+=pts; time+=3; SND.ok(); burst(`+${pts}${mult>1?` ×${mult}`:""} · +3 s`,"ok") }
      else { streak=0; time-=5; misses.push({q,t}); b.classList.add("wrong"); SND.bad(); burst("−5 s","bad") }
      sEl.textContent=score; kEl.textContent=streak;
      setTimeout(()=>{ if(!over){idx++;show()} }, ok?450:1300);
    }
    function burst(txt,cls){ const s=document.createElement("span"); s.className="gpop "+cls; s.textContent=txt; fx.appendChild(s); setTimeout(()=>s.remove(),1100) }
    function loop(now){
      if(over) return;
      time-= (now-last)/1000; last=now;
      if(!document.body.contains(g)){ over=true; MUSIC.stop(); return }
      if(time<=0){ time=0; paint(); end(); return }
      paint(); raf=requestAnimationFrame(loop);
    }
    function paint(){ tEl.textContent=Math.ceil(time)+" s"; tBar.style.width=Math.min(100,time/60*100)+"%"; g.classList.toggle("hurry",time<10); MUSIC.tempo(time<10?150:118) }
    function end(){
      if(over) return; over=true; cancelAnimationFrame(raf); MUSIC.stop();
      const rec=score>best(); if(rec) store.set("juego-record",score);
      SND.fanfare();
      g.innerHTML=`<div class="gend"><span class="kicker">${rec?"¡Nuevo récord!":"Fin del juego"}</span><div class="gfinal">${score}<small>puntos</small></div>
       <div class="gstats"><span><b>${hits}</b> aciertos</span><span><b>${tries?Math.round(hits/tries*100):0} %</b> precisión</span><span><b>${bestStreak}</b> mejor racha</span><span><b>${Math.max(score,best())}</b> récord</span></div>
       <div class="toolbar"><button class="btn primary" data-again>Jugar otra vez</button><button class="btn" data-menu>Cambiar temas</button></div>
       ${misses.length?`<h3>Para repasar (${misses.length})</h3><ol class="gmiss">${misses.map(({q,t})=>`<li><span class="tag">${t.short}</span> ${esc(q[0])}<br><b>Respuesta:</b> ${esc(q[1][q[2]])}. <span class="muted">${esc(q[3]||"")}</span></li>`).join("")}</ol>`:""}</div>`;
      g.querySelector("[data-again]").onclick=play;
      g.querySelector("[data-menu]").onclick=renderGame;
    }
    show(); raf=requestAnimationFrame(t=>{last=t;loop(t)});
  }
}

  const n=Object.values(B).flat().length;
  view.innerHTML=`<div class="phead"><span class="kicker">Práctica</span><h1>${TITLE}</h1><p class="lede">${n} ${LEDE}</p></div>
  <div class="chips" id="xtopics"><button class="chip" data-id="todos">Todos</button>${T.filter(t=>B[t.id]).map(t=>`<button class="chip" data-id="${t.id}">${t.short} · ${B[t.id].length}</button>`).join("")}</div>
  <div id="xq" class="qlist" style="margin-top:14px"></div>`;
  const draw=()=>{
    view.querySelectorAll("#xtopics .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===pick));
    const gen=()=>{const ts=T.filter(t=>B[t.id]&&(pick==="todos"||t.id===pick));const it=ts.flatMap(t=>B[t.id].map(q=>({q,t})));return pick==="todos"?shuffle(it):it};
    quiz(view.querySelector("#xq"), gen(), "mix", gen);
  };
  view.querySelectorAll("#xtopics .chip").forEach(b=>b.onclick=()=>{pick=b.dataset.id;store.set(KEY,pick);draw()});
  draw();
}

/* Búsqueda global: secciones, perlas, tarjetas, preguntas e imágenes. Ignora acentos y mayúsculas. */
const fold = s => s.split("").map(c=>c.normalize("NFD")[0].toLowerCase()).join("");
const plain = html => {const d=document.createElement("div");d.innerHTML=html.replace(/<\/(td|th|li|p|h4|div)>|<br>/g," · $&");return d.textContent.replace(/\s+/g," ").replace(/\s*·[\s·]*/g," · ").replace(/^ · | · $/g,"").trim()};
const INDEX = T.flatMap(t=>[
  ...t.sections.map((s,i)=>({t,kind:"Sección",title:s[0],text:plain(s[1]),go:{sec:i}})),
  ...t.pearls.map(p=>({t,kind:"Perla",title:"Perla de examen",text:plain(p),go:{pearl:1}})),
  ...t.cards.map(c=>({t,kind:"Tarjeta",title:c[0],text:c[1],go:{fc:1}})),
  ...t.quiz.map((q,n)=>({t,kind:"Pregunta",title:`Pregunta ${n+1}`,text:q[0]+" "+q[3],go:{q:n}})),
  ...Object.entries(FIGS[t.id]||{}).flatMap(([i,l])=>l.map(f=>({t,kind:"Imagen",title:f[1],text:f[2],go:{fig:f[0],sec:+i}})))
]).map(r=>({...r,key:fold(r.title+" "+r.text)}));
const qIn=document.getElementById("q"), qClr=document.getElementById("qclr");
let lastTab="inicio", qTerms=[];
const terms = q => fold(q).split(/\s+/).filter(w=>w.length>1);
function snippet(text, ts){
  const f=fold(text); let at=f.indexOf(ts[0]); if(at<0) at=0;
  const a=Math.max(0,at-70), b=Math.min(text.length,at+150);
  return (a>0?"…":"")+hl(text.slice(a,b),ts)+(b<text.length?"…":"");
}
function hl(s, ts){
  const f=fold(s), marks=new Array(s.length).fill(false);
  ts.forEach(w=>{let i=f.indexOf(w);while(i>=0){for(let k=i;k<i+w.length;k++)marks[k]=true;i=f.indexOf(w,i+w.length)}});
  let out="",open=false; for(let k=0;k<s.length;k++){if(marks[k]&&!open){out+="<mark>";open=true}if(!marks[k]&&open){out+="</mark>";open=false}out+=esc(s[k])} return out+(open?"</mark>":"");
}
function runSearch(){
  const raw=qIn.value.trim(); qClr.hidden=!raw;
  qTerms=terms(raw);
  if(!qTerms.length){ if(view.dataset.topic==="buscar") go(lastTab); return }
  if(view.dataset.topic!=="buscar"){ lastTab=view.dataset.topic||"inicio"; }
  view.dataset.topic="buscar"; [...tabs.children].forEach(b=>b.setAttribute("aria-selected","false"));
  const res=INDEX.filter(r=>qTerms.every(w=>r.key.includes(w)));
  const groups=T.map(t=>({t,items:res.filter(r=>r.t===t)})).filter(g=>g.items.length);
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:6px"><span class="kicker">Búsqueda</span><h1>${res.length} resultado${res.length===1?"":"s"} para “${esc(raw)}”</h1>
   <p class="lede">${res.length?"Toca un resultado para ir directo a él.":"Prueba con otra palabra o revisa la ortografía. La búsqueda ignora acentos."}</p></div>
   ${groups.map(g=>`<section class="sgroup" data-topic="${g.t.id}"><h2 class="sec">${g.t.name} <span class="tag">${g.items.length}</span></h2>
   <div class="sres">${g.items.map(r=>`<button class="sr" data-i="${INDEX.indexOf(r)}"><span class="sk">${r.kind}</span><b>${hl(r.title,qTerms)}</b><span>${snippet(r.text,qTerms)}</span></button>`).join("")}</div></section>`).join("")}`;
  view.querySelectorAll(".sr").forEach(b=>b.onclick=()=>openResult(INDEX[+b.dataset.i]));
}
function markIn(el, ts){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), nodes=[]; while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(!n.nodeValue.trim()||n.parentNode.closest("mark,button.opt,.fc"))return; const f=fold(n.nodeValue); if(!ts.some(t=>f.includes(t)))return;
    const span=document.createElement("span"); span.innerHTML=hl(n.nodeValue,ts); n.replaceWith(...span.childNodes)});
}
function openResult(r){
  const ts=qTerms.slice(); qIn.value=""; qClr.hidden=true; go(r.t.id);
  let el=null; const g=r.go;
  if(g.sec!=null){el=view.querySelector("#s"+g.sec); el.open=true;}
  else if(g.pearl) el=view.querySelector(".pearls");
  else if(g.fc) el=view.querySelector("#fc");
  else if(g.q!=null) el=view.querySelector(`#qz .q[data-n="${g.q}"]`);
  if(el){ markIn(el,ts); el.classList.add("hit"); setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60); setTimeout(()=>el.classList.remove("hit"),2600) }
  if(g.fig){const list=FIGS[r.t.id][g.sec]; setTimeout(()=>openLB(list,list.findIndex(f=>f[0]===g.fig)),400)}
}
qIn.addEventListener("input",()=>{clearTimeout(qIn._t);qIn._t=setTimeout(runSearch,120)});
qIn.addEventListener("keydown",e=>{if(e.key==="Escape"){qIn.value="";runSearch();qIn.blur()} if(e.key==="Enter"){const f=view.querySelector(".sr");if(f)f.click()}});
qClr.onclick=()=>{qIn.value="";runSearch();qIn.focus()};
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==qIn&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&(!lbEl||lbEl.hidden)){e.preventDefault();qIn.focus()}});
tabs.addEventListener("click",()=>{if(qIn.value){qIn.value="";qClr.hidden=true}},true);

const h=(location.hash||"").slice(1);
POMO.mount();
go(ids.includes(h)?h:(store.get("gastro-tab")||"inicio"));

</script>

</body></html>
