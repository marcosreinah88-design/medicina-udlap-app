<\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p><strong>Síndrome de Mirizzi:<\/strong> un lito impactado en el cístico o en el bacinete comprime el <strong>conducto hepático común<\/strong> desde afuera y da ictericia sin lito en el colédoco.<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Cuadro clínico y diagnóstico en la vesícula","h":"<h5>Colecistitis aguda<\/h5><div class=\"tbl\"><table><thead><tr><th>Prueba<\/th><th>Sensibilidad<\/th><th>Especificidad<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Signo de Murphy<\/th><td><strong>65 %<\/strong><\/td><td><strong>87 %<\/strong><\/td><\/tr><tr><th scope=\"row\">US abdominal<\/th><td><strong>82 %<\/strong><\/td><td><strong>81 %<\/strong><\/td><\/tr><tr><th scope=\"row\">TC<\/th><td><strong>94 %<\/strong><\/td><td><strong>59 %<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-compara\"><div class=\"callout-h\"><span class=\"callout-k\">Compara<\/span><span class=\"callout-t\">Cólico contra colecistitis<\/span><\/div><p><strong>Cólico:<\/strong> dolor de 20–30 min que cede. <strong>Colecistitis:<\/strong> dolor de <strong>horas<\/strong>, <strong>fiebre<\/strong> y <strong>Murphy<\/strong>. La gravedad de la colecistitis se gradúa con los criterios de Tokio (fuera de este artículo)†.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El estudio inicial ante sospecha de litiasis vesicular es el <strong>US abdominal<\/strong>, no la TC. La TC es más sensible para colecistitis (94 %) pero mucho menos específica (59 %).<\/p><\/aside>"},{"t":"Coledocolitiasis: diagnóstico y estratificación","h":"<h5>Imagen<\/h5><div class=\"tbl\"><table><thead><tr><th>Estudio<\/th><th>Qué hace bien<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>US abdominal<\/strong><\/th><td>Detecta la <strong>dilatación<\/strong> del colédoco (signo indirecto); ve el cálculo con <strong>menor<\/strong> sensibilidad<\/td><\/tr><tr><th scope=\"row\"><strong>TC<\/strong><\/th><td>Muy sensible para <strong>dilatación<\/strong>, no para el cálculo<\/td><\/tr><tr><th scope=\"row\"><strong>USE<\/strong><\/th><td><strong>S 95 %, E 97 %<\/strong>; <strong>mejor que la CPRM para cálculos &lt;5 mm<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>CPRM<\/strong><\/th><td><strong>S 93 %, E 96 %<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>CPRE<\/strong><\/th><td>Diagnóstica <strong>y terapéutica<\/strong>; se reserva para probabilidad alta<\/td><\/tr><\/tbody><\/table><\/div><figure class=\"fig\" data-fig=\"litiasis-coledoco\"><svg viewBox=\"0 0 400 356\" role=\"img\" aria-label=\"Estratificación del riesgo de coledocolitiasis\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah33\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"200\" y=\"158\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Primera línea, antes de la colecistectomía<\/tspan><\/text><text x=\"200\" y=\"254\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Segunda línea si falla<\/tspan><\/text><rect x=\"6\" y=\"6\" width=\"124\" height=\"36\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"24\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Baja (&lt;20 %)<\/tspan><\/text><path d=\"M68 42 L68 56\" class=\"fx-arr\" marker-end=\"url(#ah33)\"/><rect x=\"6\" y=\"56\" width=\"124\" height=\"88\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"80.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Dolor biliar con<\/tspan><tspan x=\"68\" dy=\"12.81\">PFH normales y<\/tspan><tspan x=\"68\" dy=\"12.81\">colédoco no<\/tspan><tspan x=\"68\" dy=\"12.81\">dilatado<\/tspan><\/text><rect x=\"6\" y=\"168\" width=\"124\" height=\"74\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"192.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Ningún estudio<\/tspan><tspan x=\"68\" dy=\"12.81\">extra:<\/tspan><tspan x=\"68\" dy=\"12.81\">colecistectomía<\/tspan><\/text><rect x=\"138\" y=\"6\" width=\"124\" height=\"36\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"16.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Intermedia (20–50<\/tspan><tspan x=\"200\" dy=\"14.03\">%)<\/tspan><\/text><path d=\"M200 42 L200 56\" class=\"fx-arr\" marker-end=\"url(#ah33)\"/><rect x=\"138\" y=\"56\" width=\"124\" height=\"88\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"80.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Pancreatitis, o<\/tspan><tspan x=\"200\" dy=\"12.81\">dolor biliar + PFH<\/tspan><tspan x=\"200\" dy=\"12.81\">alteradas y/o<\/tspan><tspan x=\"200\" dy=\"12.81\">colédoco dilatado<\/tspan><\/text><rect x=\"138\" y=\"168\" width=\"124\" height=\"74\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"192.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">USE o CPRM; si es<\/tspan><tspan x=\"200\" dy=\"12.81\">positiva: CPRE<\/tspan><tspan x=\"200\" dy=\"12.81\">(colangitis: CPRE)<\/tspan><\/text><path d=\"M200 242 L200 266\" class=\"fx-arr\" marker-end=\"url(#ah33)\"/><rect x=\"138\" y=\"266\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"282.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Colangiografía<\/tspan><tspan x=\"200\" dy=\"12.81\">transoperatoria; si<\/tspan><tspan x=\"200\" dy=\"12.81\">positiva:<\/tspan><tspan x=\"200\" dy=\"12.81\">extracción<\/tspan><tspan x=\"200\" dy=\"12.81\">quirúrgica o CPRE<\/tspan><\/text><rect x=\"270\" y=\"6\" width=\"124\" height=\"36\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"24\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Alta (&gt;50 %)<\/tspan><\/text><path d=\"M332 42 L332 56\" class=\"fx-arr\" marker-end=\"url(#ah33)\"/><rect x=\"270\" y=\"56\" width=\"124\" height=\"88\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"87.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Cálculo en colédoco<\/tspan><tspan x=\"332\" dy=\"12.81\">por US, ictericia o<\/tspan><tspan x=\"332\" dy=\"12.81\">colangitis<\/tspan><\/text><rect x=\"270\" y=\"168\" width=\"124\" height=\"74\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"205\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">CPRE<\/tspan><\/text><path d=\"M332 242 L332 266\" class=\"fx-arr\" marker-end=\"url(#ah33)\"/><rect x=\"270\" y=\"266\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"308\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Drenaje percutáneo<\/tspan><\/text><\/svg><figcaption>Figura 7 de la revisión. Predictores fuertes (<strong>especificidad ≥90 %, LR+ ≥10<\/strong>): <strong>colangitis, ictericia y cálculo visto por US<\/strong> → CPRE directa.<\/figcaption><\/figure><h5>Estratificación (Figura 7)<\/h5><div class=\"tbl\"><table><thead><tr><th>Probabilidad<\/th><th>Quién<\/th><th>Primera línea (antes de la colecistectomía)<\/th><th>Si falla<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Baja (&lt;20 %)<\/strong><\/th><td>Dolor biliar, PFH normales, colédoco no dilatado<\/td><td><strong>Ninguna<\/strong><\/td><td>—<\/td><\/tr><tr><th scope=\"row\"><strong>Intermedia (20–50 %)<\/strong><\/th><td><strong>Pancreatitis<\/strong>, o dolor biliar + <strong>PFH alteradas y/o colédoco dilatado<\/strong><\/td><td><strong>USE o CPRM<\/strong>; si es positiva → <strong>CPRE<\/strong> (con colangitis → CPRE)<\/td><td><strong>Colangiografía transoperatoria<\/strong>; si es positiva: extracción quirúrgica o CPRE transoperatoria<\/td><\/tr><tr><th scope=\"row\"><strong>Alta (&gt;50 %)<\/strong><\/th><td><strong>Cálculo en colédoco por US<\/strong>, <strong>ictericia<\/strong> o <strong>colangitis<\/strong><\/td><td><strong>CPRE<\/strong><\/td><td><strong>Drenaje percutáneo<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente con dolor biliar, <strong>colédoco dilatado y PFH alteradas<\/strong>, sin ictericia ni colangitis → probabilidad <strong>intermedia<\/strong> → <strong>CPRM o USE<\/strong>, no CPRE de entrada.<\/p><\/aside>"},{"t":"Prevención","h":"<h5>Grupos de alto riesgo<\/h5><div class=\"tbl\"><table><thead><tr><th>Situación<\/th><th>Medida<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Dieta de muy bajas calorías<\/strong><\/th><td><strong>7–10 g de grasa al día<\/strong> para mantener el vaciamiento vesicular<\/td><\/tr><tr><th scope=\"row\"><strong>Pérdida rápida de peso / bariátrica<\/strong><\/th><td><mark><strong>AUDC ≥500 mg/día<\/strong> hasta que el peso se estabilice<\/mark>; es <strong>costo-efectivo<\/strong>. Aceite de pescado (omega-3) podría ayudar<\/td><\/tr><tr><th scope=\"row\"><strong>Cirugía bariátrica<\/strong><\/th><td><strong>No<\/strong> colecistectomía profiláctica de rutina: <strong>&gt;90 %<\/strong> de los que forman cálculos siguen <strong>asintomáticos<\/strong>. Solo si hay cálculos <strong>sintomáticos<\/strong> o vesícula anormal<\/td><\/tr><tr><th scope=\"row\"><strong>Análogos de somatostatina a largo plazo<\/strong><\/th><td>Seguimiento estrecho; el <strong>AUDC<\/strong> podría ser útil<\/td><\/tr><tr><th scope=\"row\"><strong>NPT, embarazo, terapia hormonal<\/strong><\/th><td><strong>Sin recomendación<\/strong> preventiva, aunque tienen más riesgo de lodo y cálculos<\/td><\/tr><tr><th scope=\"row\"><strong>Tras esfinterotomía por coledocolitiasis<\/strong><\/th><td>Dieta y estilo de vida; <strong>sin fármacos<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>LPAC (ABCB4)<\/strong><\/th><td><strong>AUDC<\/strong>: el único caso de prevención secundaria con AUDC<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente que bajará de peso rápido tras cirugía bariátrica: <strong>AUDC ≥500 mg/día<\/strong> hasta estabilizar el peso. <strong>No<\/strong> colecistectomía profiláctica de rutina.<\/p><\/aside>"},{"t":"Tratamiento de la litiasis vesicular","h":"<figure class=\"fig\" data-fig=\"litiasis-tiempos\"><svg viewBox=\"0 0 400 322\" role=\"img\" aria-label=\"Cuándo operar la vesícula\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah34\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"6\" width=\"170\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"91\" y=\"28\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Litiasis asintomática<\/tspan><\/text><path d=\"M176 28 L198 28\" class=\"fx-arr\" marker-end=\"url(#ah34)\"/><rect x=\"200\" y=\"6\" width=\"194\" height=\"44\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"297\" y=\"21.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">No operar (excepto vesícula en<\/tspan><tspan x=\"297\" dy=\"13.42\">porcelana)<\/tspan><\/text><rect x=\"6\" y=\"58\" width=\"170\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"91\" y=\"80\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Cólico biliar<\/tspan><\/text><path d=\"M176 80 L198 80\" class=\"fx-arr\" marker-end=\"url(#ah34)\"/><rect x=\"200\" y=\"58\" width=\"194\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"297\" y=\"73.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">Colecistectomía temprana: ≤2<\/tspan><tspan x=\"297\" dy=\"13.42\">semanas<\/tspan><\/text><rect x=\"6\" y=\"110\" width=\"170\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"91\" y=\"132\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Colecistitis aguda<\/tspan><\/text><path d=\"M176 132 L198 132\" class=\"fx-arr\" marker-end=\"url(#ah34)\"/><rect x=\"200\" y=\"110\" width=\"194\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"297\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">Temprana: ≤24 h del ingreso<\/tspan><\/text><rect x=\"6\" y=\"162\" width=\"170\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"91\" y=\"184\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Pancreatitis biliar leve<\/tspan><\/text><path d=\"M176 184 L198 184\" class=\"fx-arr\" marker-end=\"url(#ah34)\"/><rect x=\"200\" y=\"162\" width=\"194\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"297\" y=\"177.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">Misma hospitalización (17 % →<\/tspan><tspan x=\"297\" dy=\"13.42\">5 %)<\/tspan><\/text><rect x=\"6\" y=\"214\" width=\"170\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"91\" y=\"228.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Tras CPRE con<\/tspan><tspan x=\"91\" dy=\"14.03\">esfinterotomía<\/tspan><\/text><path d=\"M176 236 L198 236\" class=\"fx-arr\" marker-end=\"url(#ah34)\"/><rect x=\"200\" y=\"214\" width=\"194\" height=\"44\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"297\" y=\"229.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">≤72 h (a 6–8 semanas: 36 % de<\/tspan><tspan x=\"297\" dy=\"13.42\">eventos)<\/tspan><\/text><rect x=\"6\" y=\"266\" width=\"170\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"91\" y=\"288\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Embarazo<\/tspan><\/text><path d=\"M176 288 L198 288\" class=\"fx-arr\" marker-end=\"url(#ah34)\"/><rect x=\"200\" y=\"266\" width=\"194\" height=\"44\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"297\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">Segundo trimestre<\/tspan><\/text><\/svg><figcaption>La colecistectomía <strong>laparoscópica temprana<\/strong> es mejor que la diferida en cólico, colecistitis y pancreatitis leve. Riesgos: mortalidad <strong>~0.3–0.5 %<\/strong>, lesión biliar <strong>~0.2–1.5 %<\/strong>.<\/figcaption><\/figure><h5>¿Cuándo? Temprana es mejor<\/h5><div class=\"tbl\"><table><thead><tr><th>Indicación<\/th><th>&quot;Temprana&quot; significa<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Cólico biliar<\/strong><\/th><td>En <strong>≤2 semanas<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Colecistitis aguda<\/strong><\/th><td>En <strong>≤24 h<\/strong> del ingreso<\/td><\/tr><tr><th scope=\"row\"><strong>Pancreatitis biliar leve<\/strong><\/th><td>En la <strong>misma hospitalización<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Tras esfinterotomía por coledocolitiasis<\/strong><\/th><td>En <strong>≤72 h<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Única indicación de colecistectomía en el <strong>asintomático<\/strong> que da el artículo: <strong>vesícula en porcelana<\/strong>.<\/p><\/aside>"},{"t":"Coledocolitiasis: tratamiento y complicaciones","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Pancreatitis biliar <strong>sin colangitis<\/strong>: <strong>no<\/strong> CPRE de rutina. <strong>Con colangitis<\/strong>: CPRE en <strong>≤24 h<\/strong>.<\/p><\/aside>"},{"t":"Hepatolitiasis, embarazo y calidad de vida","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Embarazada con litiasis sintomática que necesita cirugía: <strong>segundo trimestre<\/strong>.<\/p><\/aside>"}],"pearls":["El tratamiento depende de dónde está el cálculo, no de su composición.","Más de 90 % de los cálculos son de colesterol; el pigmento negro viene de hemólisis y el café de estasis + infección (E. coli).","Nativos americanos e hispanos con ancestría amerindia: el riesgo más alto del mundo (&gt;50 % a los 50 años).","ABCG8 p.D19H es la variante genética más frecuente; la genética explica ~25 % del riesgo.","LPAC (ABCB4): &lt;40 años, cálculos intrahepáticos y síntomas que regresan tras la colecistectomía. Tratamiento: AUDC.","Cólico biliar: ≥20–30 min en hipocondrio derecho o epigastrio, irradiado a espalda u hombro derecho.","US abdominal: estudio inicial, exactitud &gt;95 % para la vesícula.","PFH normales en las primeras 24 h del dolor hacen improbable la coledocolitiasis.","Predictores fuertes de coledocolitiasis (CPRE directa): colangitis, ictericia y cálculo visto por US.","USE es mejor que la CPRM para cálculos &lt;5 mm.","Asintomático: no operar, salvo vesícula en porcelana. 1–4 % por año da síntomas.","Pérdida rápida de peso: AUDC ≥500 mg/día hasta estabilizar el peso; no colecistectomía profiláctica en la bariátrica.","Tras CPRE por coledocolitiasis: colecistectomía en ≤72 h (diferirla 6–8 semanas: 36 % de eventos).","Pancreatitis biliar leve: colecistectomía en la misma hospitalización (17 % → 5 %). Sin colangitis, no CPRE.","Colangitis: antibiótico inmediato + descompresión en ≤6 h si hay sepsis grave, si no en ≤24 h; CPRE, nunca cirugía."],"comps":[{"title":"Colesterol contra pigmento negro contra pigmento café","cols":["Colesterol","Pigmento negro","Pigmento café"],"rows":[["Frecuencia","<strong>&gt;90 %<\/strong>","Parte del &lt;10 %","Parte del &lt;10 %"],["Sitio típico","Vesícula (secundarios en colédoco)","<strong>Vesícula<\/strong>","<strong>Conductos<\/strong>, sobre todo intrahepáticos"],["Composición","&gt;95 % colesterol (puro) o &gt;50 % (mixto)","Bilirrubinato de Ca <strong>polimerizado<\/strong> (con cobre)","Bilirrubinato de Ca <strong>monomérico<\/strong> + ácidos grasos, mucina, restos bacterianos"],["Aspecto","Amarillo claro, duro, liso o moriforme","Negro, blando, frágil, pequeño","Café, blando a duro, multifacetado"],["Bilis","Sobresaturada de colesterol","Estéril, exceso de bilirrubina no conjugada","<strong>Infectada<\/strong>, con estasis"],["Mecanismo clave","<strong>Hipersecreción de colesterol<\/strong>","Más bilirrubina sistémica o ciclo enterohepático","<strong>β-glucuronidasa<\/strong> bacteriana"],["Causas","Síndrome metabólico, mujer, embarazo, pérdida rápida de peso","<strong>Hemólisis<\/strong>, eritropoyesis ineficaz, cirrosis, íleon, fibrosis quística","<strong>Obstrucción + E. coli<\/strong>, parásitos, estenosis"],["Genes","ABCG8, ABCB4 (LPAC)","UGT1A1 (con hemólisis o fibrosis quística)","—"],["Primario o secundario en colédoco","Secundario (migra)","—","<strong>Primario<\/strong>"]],"key":"Pigmento <strong>negro<\/strong> = vesícula <strong>estéril<\/strong> con <strong>hemólisis<\/strong>; pigmento <strong>café<\/strong> = <strong>conducto obstruido e infectado<\/strong>. Todo lo demás, casi siempre, es <strong>colesterol<\/strong>."},{"title":"Cólico biliar contra colecistitis contra coledocolitiasis","cols":["Cólico biliar","Colecistitis aguda","Coledocolitiasis sintomática"],"rows":[["Mecanismo","Obstrucción transitoria del cístico","Inflamación aguda de la vesícula","Distensión aguda del colédoco obstruido"],["Dolor","≥20–30 min, cede con analgésicos","Intenso, <strong>varias horas<\/strong>","Hipocondrio derecho o epigastrio; cede si el cálculo pasa"],["Fiebre","No","<strong>Sí<\/strong>","Solo si hay colangitis"],["Signo clave","Irradiación a espalda u hombro derecho","<strong>Murphy<\/strong> (S 65 %, E 87 %)","<strong>Ictericia<\/strong>, colédoco dilatado"],["PFH","Normales (puede haber alza transitoria)","Normales o poco alteradas†","Aminotransferasas altas al inicio; luego FA y GGT"],["Estudio inicial","US (exactitud &gt;95 %)","US (S 82 %, E 81 %); TC si está grave","US; luego USE o CPRM según la probabilidad"],["Tratamiento","Colecistectomía laparoscópica","Colecistectomía laparoscópica","CPRE con esfinterotomía + colecistectomía"],["Momento","≤2 semanas","≤24 h del ingreso","Colecistectomía ≤72 h tras la CPRE"],["Complicación temida","Colecistitis, coledocolitiasis","Perforación, empiema, gangrena","Colangitis, pancreatitis biliar"]],"key":"<strong>Fiebre + Murphy<\/strong> = colecistitis. <strong>Ictericia o colédoco dilatado<\/strong> = piensa en el colédoco y estratifica (Figura 7). El cólico simple <strong>no<\/strong> da fiebre."}],"algos":[{"title":"Sospecha de coledocolitiasis","src":"Figura 7 del artículo","start":"a","nodes":{"a":{"q":"Paciente con litiasis vesicular sintomática. ¿Tiene algún <strong>predictor fuerte<\/strong>?","i":"Colangitis, ictericia preoperatoria o cálculo en el colédoco visto por US (especificidad ≥90 %, LR+ ≥10).","o":[["Sí","alta"],["No","b"]]},"alta":{"q":"Probabilidad <strong>alta (&gt;50 %)<\/strong>: CPRE con esfinterotomía y extracción. ¿Tuvo éxito?","i":"","o":[["Sí","altaok"],["No, falló la CPRE","perc"]]},"altaok":{"end":1,"tone":"ok","text":"<strong>Colecistectomía laparoscópica en ≤72 h.<\/strong> Diferirla 6–8 semanas da eventos biliares en 36 %."},"perc":{"end":1,"tone":"bad","text":"<strong>Drenaje percutáneo<\/strong> como segunda línea (o abordaje quirúrgico: transcístico, exploración del colédoco o CPRE transoperatoria)."},"b":{"q":"¿Hay <strong>pancreatitis<\/strong>, <strong>PFH alteradas<\/strong> o <strong>colédoco dilatado<\/strong>?","i":"","o":[["Sí","inter"],["No: dolor biliar con PFH normales y colédoco normal","baja"]]},"baja":{"end":1,"tone":"ok","text":"Probabilidad <strong>baja (&lt;20 %)<\/strong>: <strong>ningún estudio extra<\/strong>. Colecistectomía laparoscópica. Un aumento transitorio de PFH por compresión de la vesícula no obliga a más estudios."},"inter":{"q":"Probabilidad <strong>intermedia (20–50 %)<\/strong>. ¿Hay <strong>colangitis<\/strong> concomitante?","i":"","o":[["Sí","cpre"],["No","img"]]},"cpre":{"end":1,"tone":"warn","text":"<strong>CPRE<\/strong> (con colangitis: antibiótico y descompresión en ≤24 h, o ≤6 h si hay sepsis grave)."},"img":{"q":"Pide <strong>USE o CPRM<\/strong> (USE si sospechas cálculos &lt;5 mm). ¿Resultado?","i":"","o":[["Positiva","cpre2"],["Negativa","ok"]]},"cpre2":{"end":1,"tone":"warn","text":"<strong>CPRE con extracción<\/strong> y después <strong>colecistectomía en ≤72 h<\/strong>."},"ok":{"end":1,"tone":"ok","text":"<strong>Colecistectomía laparoscópica.<\/strong> Alternativa: colangiografía transoperatoria; si es positiva, extracción quirúrgica o CPRE transoperatoria."}}},{"title":"Cálculos en la vesícula: ¿operar o no?","src":"Secciones de diagnóstico y manejo del artículo","start":"a","nodes":{"a":{"q":"US con cálculos en la vesícula. ¿El paciente tiene <strong>síntomas<\/strong>?","i":"","o":[["No, hallazgo incidental","asin"],["Síntomas inespecíficos (dispepsia, intolerancia a grasas)","inesp"],["Cólico biliar típico","colico"],["Fiebre, dolor de horas y Murphy","cole"]]},"asin":{"q":"¿Hay <strong>vesícula en porcelana<\/strong> (calcificación de la pared)?","i":"","o":[["Sí","porc"],["No","obs"]]},"porc":{"end":1,"tone":"warn","text":"<strong>Colecistectomía<\/strong>: la vesícula en porcelana se asocia a cáncer de vesícula."},"obs":{"end":1,"tone":"ok","text":"<strong>Observación.<\/strong> Solo 1–4 % por año desarrolla síntomas; no hay evidencia para colecistectomía de rutina, AUDC ni litotricia."},"inesp":{"end":1,"tone":"warn","text":"<strong>Cuidado:<\/strong> la colecistectomía está <strong>contraindicada<\/strong> con síntomas inespecíficos; ~40 % sigue con síntomas tras la cirugía. Busca otra causa."},"colico":{"q":"¿Hay <strong>PFH alteradas, colédoco dilatado, ictericia o pancreatitis<\/strong>?","i":"","o":[["No","lc"],["Sí","cbd"]]},"lc":{"end":1,"tone":"ok","text":"<strong>Colecistectomía laparoscópica temprana (≤2 semanas).<\/strong> Sin antibiótico profiláctico, colangiografía ni drenaje de rutina; puede ser ambulatoria."},"cbd":{"end":1,"tone":"warn","text":"Estratifica la <strong>coledocolitiasis<\/strong> (Figura 7): intermedia → USE o CPRM; alta → CPRE. Usa el algoritmo de coledocolitiasis."},"cole":{"q":"Sospecha de <strong>colecistitis aguda<\/strong> (Murphy S 65 %, US S 82 %). ¿Paciente grave?","i":"","o":[["No","lcc"],["Sí, crítico","tc"]]},"lcc":{"end":1,"tone":"ok","text":"<strong>Colecistectomía laparoscópica temprana (≤24 h del ingreso)<\/strong>, aun en cirrosis."},"tc":{"end":1,"tone":"bad","text":"<strong>TC<\/strong> (S 94 %) para buscar <strong>perforación, empiema o gangrena<\/strong>. En alto riesgo quirúrgico la colecistostomía percutánea tiene papel incierto y mucha recurrencia."}}}],"cards":[["¿Por qué el cólico biliar aparece tras una comida grasa?","La grasa libera CCK, que contrae la vesícula contra un conducto cístico obstruido por un lito."],["Mecanismo del síndrome de Mirizzi","Un lito impactado en el cístico o en el bacinete de la vesícula comprime desde afuera el conducto hepático común y da ictericia."],["Definición de enfermedad litiásica","Cálculos biliares con síntomas o complicaciones; el portador asintomático no se considera enfermo."],["Proporción de cálculos de colesterol","Más de 90 %."],["Prevalencia más baja de litiasis","Poblaciones africanas; intermedia en asiáticas (5–20 %)."],["ABCG8 + UGT1A1 (Gilbert): riesgo atribuible","~15 % del riesgo poblacional; UGT1A1 pesa más en hombres."],["Mutaciones raras que alteran la bilis","ABCB4, ABCB11, CFTR y CYP7A1."],["Composición del pigmento café","Bilirrubinato de calcio monomérico + colesterol, ácidos grasos, mucina y restos bacterianos."],["Causas de cálculos de pigmento negro","Hemólisis crónica, eritropoyesis ineficaz, enfermedad o resección ileal y cirrosis."],["Causa primaria de los cálculos de colesterol","Hipersecreción hepática de colesterol (depende sobre todo de la genética)."],["Mecanismo de la hipomotilidad vesicular","El colesterol esterificado en la pared endurece el músculo liso y bloquea la señal del receptor CCK1."],["Efecto litogénico de progesterona y octreotida","Hipomotilidad vesicular."],["RR con la actividad física más alta","0.75."],["Definición de cólico biliar","Dolor intenso episódico en hipocondrio derecho o epigastrio ≥20–30 min, irradiado a espalda u hombro derecho, que cede con analgésicos."],["Sospecha alta con US negativo","USE o CPRM para buscar microlitiasis."],["TC para colecistitis aguda: S y E","94 % y 59 %; en el paciente grave y para complicaciones."],["USE para coledocolitiasis: S y E","95 % y 97 %."],["Probabilidad baja de coledocolitiasis","&lt;20 %: dolor biliar con PFH normales y colédoco normal; ningún estudio extra."],["Actividad física y cálculos sintomáticos","Reduce el riesgo ~30 %."],["¿Colecistectomía profiláctica en la cirugía bariátrica?","No de rutina: &gt;90 % de los que forman cálculos siguen asintomáticos."],["Síntomas persistentes tras la colecistectomía","~40 % (síntomas mal atribuidos, diarrea)."],["Mortalidad de la colecistectomía laparoscópica","~0.3–0.5 %."],["Coledocolitiasis asintomática","Solo ~10 %."],["Éxito de la extracción transcística","~75 %."],["ALT temprana que sugiere pancreatitis biliar","&gt;150 UI/L (VPP &gt;85 %), sin alcohol ni PFH previas alteradas."],["Hepatectomía parcial en hepatolitiasis","Enfermedad unilateral, sobre todo con estenosis o atrofia lobar."]],"mcq":[{"q":"Mujer de 46 años con episodios de dolor intenso en hipocondrio derecho de 40 minutos, irradiado al hombro derecho, que ceden con analgésicos. ¿Qué estudio pides primero?","o":["TC abdominal con contraste","US abdominal","CPRM","CPRE","Ultrasonido endoscópico"],"a":1,"e":"Es <strong>cólico biliar<\/strong>. El <strong>US abdominal<\/strong> es el estudio de elección, con <strong>exactitud &gt;95 %<\/strong> para cálculos vesiculares."},{"q":"¿Qué población tiene el riesgo de litiasis más alto del mundo según la revisión?","o":["Europeos del norte","Asiáticos orientales","Africanos","Nativos de Norte y Sudamérica","Europeos del sur"],"a":3,"e":"Las <strong>poblaciones nativas de Norte y Sudamérica<\/strong> tienen el mayor riesgo: cálculos antes de los 30 años y prevalencia <strong>&gt;50 % a los 50 años<\/strong> en ambos sexos."},{"q":"Mujer de 28 años con cálculos en la vesícula, colédoco e intrahepáticos, que vuelve a tener cólicos después de su colecistectomía. ¿Qué diagnóstico y tratamiento sugieres?","o":["Síndrome LPAC por ABCB4; AUDC","Colangitis esclerosante primaria; trasplante","Esferocitosis hereditaria; esplenectomía","Síndrome de Gilbert; observación","Fibrosis quística; enzimas pancreáticas"],"a":0,"e":"<strong>LPAC<\/strong>: inicio <strong>&lt;40 años<\/strong>, cálculos simultáneos en vesícula, conductos o intrahepáticos y <strong>recurrencia tras la colecistectomía<\/strong>. Causa: <strong>ABCB4<\/strong>. El AUDC está indicado en LPAC."},{"q":"¿Cuáles son las dos condiciones indispensables para formar cálculos de pigmento café?","o":["Hemólisis y cirrosis","Estasis biliar e infección","Obesidad y diabetes","Embarazo y estrógenos","Ayuno y NPT"],"a":1,"e":"El pigmento café requiere <strong>estasis por obstrucción<\/strong> e <strong>infección biliar<\/strong> (sobre todo <em>E. coli<\/em>, que produce β-glucuronidasa)."},{"q":"Según la revisión, ¿cuál es la causa primaria de los cálculos de colesterol?","o":["Hipomotilidad vesicular","Infección por E. coli","Hipersecreción hepática de colesterol","Exceso de absorción intestinal de colesterol","Hemólisis"],"a":2,"e":"La <strong>hipersecreción hepática de colesterol<\/strong> es la causa primaria y depende sobre todo de la genética; la hipomotilidad y la transición de fase rápida son consecuencias posteriores."},{"q":"¿Cuál de los siguientes mecanismos explica la hipomotilidad vesicular en la litogénesis?","o":["El colesterol esterificado en la pared endurece el músculo liso y altera la señal del receptor CCK1","La bilirrubina bloquea la acetilcolina","El estrógeno destruye las células de Cajal","La mucina obstruye el cístico","La infección necrosa la pared"],"a":0,"e":"El epitelio absorbe colesterol, lo <strong>esterifica<\/strong> y lo guarda en mucosa y lámina propia; eso endurece la membrana del músculo liso y desacopla la señal de <strong>CCK1<\/strong> y las proteínas G."},{"q":"¿Qué agente se relaciona sobre todo con la cristalización rápida de colesterol en la bilis litogénica?","o":["Mucina","Albúmina","IgA secretora","Bicarbonato","Urobilinógeno"],"a":0,"e":"La cristalización acelerada se atribuye principalmente a <strong>concentraciones altas de mucinas<\/strong> y otros agentes <strong>pronucleantes<\/strong>."},{"q":"¿Por qué no se hace colecistectomía profiláctica de rutina durante la cirugía bariátrica?","o":["Porque la mortalidad es de 20 %","Porque más de 90 % de los que forman cálculos siguen asintomáticos","Porque nunca se forman cálculos","Porque el AUDC disuelve todos","Porque está contraindicada en obesos"],"a":1,"e":"<strong>&gt;90 %<\/strong> de los pacientes bariátricos que forman cálculos permanecen <strong>asintomáticos<\/strong>. Se reserva para cálculos sintomáticos o vesícula anormal."},{"q":"Mujer de 62 años asintomática con US que muestra cálculos y calcificación en parches de la pared vesicular. ¿Qué recomiendas?","o":["Observación","AUDC","Colecistectomía","TC anual","Litotricia"],"a":2,"e":"La <strong>vesícula en porcelana<\/strong> se asocia a <strong>cáncer de vesícula<\/strong> y es la excepción en la que se indica cirugía aun sin síntomas."},{"q":"¿Cuál es el tratamiento eficaz para la litiasis vesicular sintomática?","o":["AUDC oral","Litotricia extracorpórea","Colecistectomía","Ezetimiba","Dieta baja en grasa sola"],"a":2,"e":"La <strong>colecistectomía<\/strong> es el único tratamiento eficaz; la disolución con AUDC y la litotricia ya no se usan por la alta recurrencia mientras exista la vesícula."},{"q":"¿Por qué se prefiere la colecistectomía laparoscópica sobre la abierta?","o":["Menor riesgo de lesión biliar comprobado","Estancia más corta y recuperación más rápida","Menor costo en todos los casos","No requiere anestesia general","Evita la colangiografía"],"a":1,"e":"La laparoscópica se prefiere por <strong>estancia más corta y recuperación más rápida<\/strong>, aun en colecistitis aguda y cirrosis. La abierta mínimamente invasiva da resultados equivalentes y quizá menor costo."},{"q":"¿Cuál es el riesgo aproximado de lesión de la vía biliar en la colecistectomía laparoscópica?","o":["~0.01 %","~0.2–1.5 %","~5–10 %","~15 %","~30 %"],"a":1,"e":"Lesión de vía biliar <strong>~0.2–1.5 %<\/strong>; mortalidad ~0.3–0.5 %; complicaciones mayores ~6–9 %."},{"q":"En cólico biliar, ¿qué plazo se considera colecistectomía &quot;temprana&quot;?","o":["≤24 h","≤72 h","≤2 semanas","6–8 semanas","6 meses"],"a":2,"e":"Para cólico biliar, temprana = <strong>en ≤2 semanas<\/strong>. En colecistitis, ≤24 h; en pancreatitis leve, misma hospitalización."},{"q":"Paciente en terapia intensiva con sospecha de colecistitis y posible perforación. ¿Qué estudio recomienda la revisión?","o":["Radiografía simple","TC","Gammagrafía con HIDA","CPRE","Endoscopia alta"],"a":1,"e":"La <strong>TC<\/strong> (S 94 %, E 59 %) está justificada en el paciente <strong>grave<\/strong> para identificar colecistitis y complicaciones como <strong>perforación, empiema o gangrena<\/strong>."},{"q":"Hombre de 40 años con dolor biliar hace 10 horas; PFH completamente normales y colédoco de calibre normal en el US. ¿Qué tan probable es la coledocolitiasis?","o":["Alta (&gt;50 %)","Intermedia (20–50 %)","Baja (&lt;20 %)","Segura","No se puede estimar"],"a":2,"e":"Dolor biliar con <strong>PFH normales y sin dilatación<\/strong>: probabilidad <strong>baja (&lt;20 %)<\/strong>; no justifica estudios extra. PFH normales en las primeras 24 h hacen improbable la coledocolitiasis."},{"q":"¿Cuál NO es un predictor fuerte de coledocolitiasis (especificidad ≥90 %, LR+ ≥10)?","o":["Colangitis","Ictericia preoperatoria","Cálculo en el colédoco visto por US","Pancreatitis aguda","Ninguno de los anteriores"],"a":3,"e":"Los predictores fuertes son <strong>colangitis, ictericia y cálculo visto por US<\/strong>. La <strong>pancreatitis<\/strong> coloca al paciente en probabilidad <strong>intermedia<\/strong>."},{"q":"Mujer de 45 años a la que se le extrajo un cálculo del colédoco por CPRE con esfinterotomía. Tiene además litiasis vesicular. ¿Cuál es el mejor momento para la colecistectomía?","o":["No es necesaria tras la esfinterotomía","A las 6–8 semanas","En las siguientes 72 h","A los 6 meses","Solo si recurre"],"a":2,"e":"La colecistectomía debe ofrecerse de rutina. Diferirla <strong>6–8 semanas<\/strong> dio eventos biliares en <strong>36 %<\/strong>; la laparoscópica <strong>en ≤72 h<\/strong> parece lo mejor."},{"q":"¿Cuál es la complicación más asociada a la dilatación papilar con balón frente a la esfinterotomía?","o":["Sangrado","Pancreatitis","Perforación","Colangiocarcinoma","Estenosis"],"a":1,"e":"El balón tiene <strong>menor riesgo de sangrado<\/strong> pero <strong>mayor de pancreatitis<\/strong>, con complicaciones globales similares."},{"q":"Hombre de 78 años con fiebre, ictericia y dolor en hipocondrio derecho; TA 80/50 mmHg pese a líquidos. US: colédoco de 12 mm con cálculo. Además de antibióticos, ¿cuándo debe descomprimirse la vía biliar?","o":["En ≤6 h","En ≤72 h","En 1 semana","Tras completar 14 días de antibiótico","No requiere descompresión"],"a":0,"e":"Con <strong>sepsis grave<\/strong>, la descompresión debe hacerse de preferencia <strong>en ≤6 h<\/strong>; si no, en ≤24 h. Hasta <strong>20 %<\/strong> progresa rápido sin intervención."},{"q":"Mujer de 40 años sin consumo de alcohol con pancreatitis aguda. ALT 320 UI/L al ingreso. ¿Qué sugiere?","o":["Origen alcohólico","Origen biliar (VPP &gt;85 %)","Hipertrigliceridemia","Pancreatitis autoinmune","Fármacos"],"a":1,"e":"Sin alcohol ni PFH previas alteradas, una <strong>ALT temprana &gt;150 UI/L<\/strong> indica origen <strong>biliar<\/strong> con <strong>VPP &gt;85 %<\/strong>."},{"q":"En pancreatitis biliar leve, ¿qué logró la colecistectomía en la misma hospitalización?","o":["Bajó las complicaciones recurrentes de 17 % a 5 %","No cambió nada","Aumentó la mortalidad","Bajó la recurrencia de 50 % a 40 %","Evitó la diabetes"],"a":0,"e":"La colecistectomía en la <strong>misma hospitalización<\/strong> redujo complicaciones recurrentes de <strong>17 % a 5 %<\/strong> (RR 0.28; P = 0.002)."},{"q":"¿Qué porcentaje de los pacientes con cálculos en el colédoco tuvo dolor biliar antes de su complicación (ictericia, colangitis o pancreatitis)?","o":["~10 %","~25 %","~50 %","~90 %","100 %"],"a":2,"e":"Solo <strong>50 %<\/strong> tuvo episodios previos de dolor biliar."},{"q":"¿Cuál es la complicación más común de la CPRE en el embarazo?","o":["Parto prematuro","Pancreatitis post-CPRE","Sangrado","Perforación","Malformaciones fetales"],"a":1,"e":"La <strong>pancreatitis post-CPRE<\/strong> es la más común; el parto prematuro ocurre en <strong>&lt;5 %<\/strong> cuando lo hacen expertos."},{"q":"¿Qué factor dietético aumenta el riesgo de litiasis según la revisión?","o":["Dieta rica en fibra","Consumo de nueces","Carga glucémica alta","Grasas monoinsaturadas","Desayunar a diario"],"a":2,"e":"Box 1: dieta <strong>hipercalórica<\/strong>, <strong>rica en carbohidratos<\/strong>, <strong>carga glucémica alta<\/strong>, poca fibra y mucho hierro hem. Fibra, nueces, grasas insaturadas y comer con horario regular protegen."}],"tf":[["La colecistitis aguda empieza casi siempre como una infección bacteriana primaria.",false,"Empieza por obstrucción e inflamación química; la infección es secundaria."],["La litiasis asintomática se clasifica como enfermedad litiásica.",false,"Solo los cálculos con síntomas o complicaciones definen la enfermedad."],["Los cálculos de pigmento café se forman en vesículas estériles por hemólisis.",false,"Esos son los de pigmento negro; el café requiere estasis e infección en los conductos."],["La genética explica alrededor de 25 % del riesgo de litiasis.",true,"Estudio de 43 141 pares de gemelos suecos."],["Los pacientes con cálculos absorben más colesterol intestinal que los controles.",false,"Absorben menos y sintetizan más."],["La pérdida de peso de más de 1.5 kg por semana puede formar cálculos en hasta 30 %.",true,"Dietas de muy bajas calorías o bariátrica."],["La TC es más específica que el US para colecistitis aguda.",false,"La TC es más sensible (94 %) pero menos específica (59 %)."],["La CPRM es superior a la USE para cálculos menores de 5 mm.",false,"La USE es superior para cálculos pequeños."],["La colecistectomía profiláctica es de rutina en la cirugía bariátrica.",false,"Más de 90 % de los que forman cálculos siguen asintomáticos."],["La antibioticoprofilaxis de rutina en colecistectomía laparoscópica tiene evidencia sólida.",false,"No hay evidencia para su uso de rutina."],["En la colangitis aguda la cirugía es una buena opción de descompresión.",false,"La cirugía no debe hacerse; CPRE es de elección."]]},{"id":"colangitis","n":9,"title":"Colangitis aguda: guías de Tokio 2018","short":"Colangitis aguda","color":"#EF7B1A","src":"Kiriyama S, Kozaka K, Takada T, et al. Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholangitis (with videos). J Hepatobiliary Pancreat Sci. 2018;25(1):17-30. · Miura F, Okamoto K, Takada T, et al. Tokyo Guidelines 2018: initial management of acute biliary infection and flowchart for acute cholangitis. J Hepatobiliary Pancreat Sci. 2018;25(1):31-40. · Kimura Y, Takada T, Strasberg SM, et al. TG13 current terminology, etiology, and epidemiology of acute cholangitis and cholecystitis. J Hepatobiliary Pancreat Sci. 2013;20(1):8-23. · Gomi H, Solomkin JS, Schlossberg D, et al. Tokyo Guidelines 2018: antimicrobial therapy for acute cholangitis and cholecystitis. J Hepatobiliary Pancreat Sci. 2018;25(1):3-16.","hook":"Bilis infectada a presión que se vacía a la sangre: la colangitis mata si no das antibiótico y descomprimes la vía biliar. Las guías de Tokio te dicen con tres letras (A, B, C) si la tiene y con tres grados cuándo drenar.","group":"Vía biliar","ses":24,"date":"2026-11-09","nums":[["~26 %","sensibilidad real de la triada de Charcot en series recientes (26.4 % y 21.2 %)"],["90.0 %","tasa diagnóstica con TG13/TG18 (contra 79.4 % con TG07)"],["&gt;38 °C","corte de fiebre del criterio A-1; ≥39 °C ya cuenta para grado II"],["≥2 de 5","factores para grado II (moderado): leucocitos, fiebre ≥39 °C, edad ≥75, BT ≥5, albúmina baja"],["1.7 % vs 3.4 %","mortalidad a 30 días en grado II con drenaje en &lt;24 h contra tardío o sin drenaje"],["24–48 h","drenaje temprano (el día siguiente al ingreso); urgente = el mismo día (&lt;24 h)"]],"esencial":"<ul><li><strong>Colangitis aguda (CA):<\/strong> estenosis u obstrucción biliar (sobre todo <strong>litos del colédoco<\/strong> o <strong>tumor<\/strong>) → <strong>colestasis + infección de la bilis<\/strong> → sube la presión y bacterias o endotoxinas pasan a la circulación → <strong>respuesta inflamatoria sistémica<\/strong>.<\/li><li>Sin <strong>antibiótico<\/strong> y sin <strong>descomprimir la vía biliar<\/strong> de inmediato, la mortalidad es alta.<\/li><li><strong>Triada de Charcot<\/strong> (fiebre, dolor abdominal, ictericia): muy <strong>específica<\/strong> pero poco <strong>sensible<\/strong> (50–70 % en series antiguas; <mark>26.4 % y 21.2 %<\/mark> en series multicéntricas recientes). No sirve como criterio diagnóstico.<\/li><li><strong>Criterios TG18 = TG13<\/strong> (no cambiaron): <strong>A<\/strong> inflamación sistémica, <strong>B<\/strong> colestasis, <strong>C<\/strong> imagen.<\/li><li><mark><strong>Sospecha:<\/strong> 1 de A + 1 de B o C. <strong>Definitivo:<\/strong> 1 de A + 1 de B + 1 de C.<\/mark> La inflamación sistémica (A) <strong>siempre<\/strong> es necesaria.<\/li><li>Cortes: <strong>fiebre &gt;38 °C<\/strong>; <strong>leucocitos &lt;4,000 o &gt;10,000/µL<\/strong>; <strong>PCR ≥1 mg/dL<\/strong>; <strong>BT ≥2 mg/dL<\/strong>; <strong>FA, GGT, AST, ALT &gt;1.5 × LSN<\/strong>.<\/li><li><strong>Grado III (grave):<\/strong> ≥1 disfunción orgánica (cardiovascular, neurológica, respiratoria, renal, hepática, hematológica).<\/li><li><strong>Grado II (moderado):<\/strong> ≥2 de: leucocitos <strong>&gt;12,000 o &lt;4,000<\/strong>, fiebre <strong>≥39 °C<\/strong>, edad <strong>≥75 años<\/strong>, <strong>BT ≥5 mg/dL<\/strong>, <strong>albúmina &lt;LIN × 0.7<\/strong>.<\/li><li><strong>Grado I (leve):<\/strong> no cumple II ni III <strong>al diagnóstico inicial<\/strong>.<\/li><li><strong>Manejo:<\/strong> antibiótico + soporte general en todos; <strong>grado I<\/strong> suele bastar el antibiótico (drenar si no responde en 24 h); <strong>grado II<\/strong> drenaje <strong>temprano<\/strong>; <strong>grado III<\/strong> soporte orgánico y drenaje <strong>urgente<\/strong> en cuanto se estabilice.<\/li><li>Drenaje <strong>endoscópico o percutáneo transhepático<\/strong>; la causa se trata cuando mejora el paciente. <strong>Novedad TG18:<\/strong> en grado II se puede hacer <strong>EST + extracción del lito en el mismo tiempo<\/strong> que el drenaje.<\/li><li><strong>Hemocultivo antes del antibiótico<\/strong> y <strong>cultivo de bilis<\/strong> siempre que se drene.<\/li><li>En el estudio Japón–Taiwán (6,063 pacientes), el drenaje temprano o urgente <strong>solo bajó la mortalidad a 30 días en el grado II<\/strong>.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Lo que más se pregunta son los <strong>cortes<\/strong>: fiebre <strong>&gt;38<\/strong> (diagnóstico) contra <strong>≥39<\/strong> (grado II); leucocitos <strong>&lt;4 o &gt;10 mil<\/strong> (diagnóstico) contra <strong>&gt;12 o &lt;4 mil<\/strong> (grado II); BT <strong>≥2<\/strong> (diagnóstico) contra <strong>≥5<\/strong> (grado II).<\/p><\/aside>","secs":[{"t":"Definición e historia de las guías","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Los dos pilares<\/span><\/div><p>El riesgo de muerte es alto si no se da <strong>antibiótico<\/strong> y no se <strong>reduce de inmediato la presión biliar<\/strong>. Por eso hay que diagnosticar y graduar rápido.<\/p><\/aside><h5>De Charcot a Tokio<\/h5><div class=\"tbl\"><table><thead><tr><th>Año<\/th><th>Hito<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1877<\/th><td>Charcot describe la &quot;fiebre hepática&quot; (fiebre, dolor, ictericia)<\/td><\/tr><tr><th scope=\"row\">2006<\/th><td>Reunión de consenso internacional en Tokio (1–2 de abril)<\/td><\/tr><tr><th scope=\"row\">2007<\/th><td><strong>TG07:<\/strong> primeros criterios diagnósticos y de gravedad<\/td><\/tr><tr><th scope=\"row\">2013<\/th><td><strong>TG13:<\/strong> criterios revisados (poca sensibilidad de TG07; grado moderado mal definido)<\/td><\/tr><tr><th scope=\"row\">2018<\/th><td><strong>TG18:<\/strong> se <strong>adoptan sin cambios<\/strong> los criterios TG13<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Los criterios diagnósticos y de gravedad de <strong>TG18 son los mismos de TG13<\/strong> (&quot;TG18/TG13&quot;). Lo que cambió en TG18 fue el <strong>diagrama de flujo del grado II<\/strong> (tratar la causa en el mismo tiempo que el drenaje).<\/p><\/aside>"},{"t":"Fisiopatología","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Se necesitan dos cosas<\/span><\/div><p>La colangitis aparece cuando hay <strong>obstrucción de la vía biliar<\/strong> y además <strong>bacterias en la bilis<\/strong>. Ninguna basta sola: bacterias sin obstrucción (bactibilia) suelen no dar síntomas, y una obstrucción sin infección da <strong>ictericia<\/strong>, pero no colangitis.<\/p><\/aside><figure class=\"fig\" data-fig=\"colangitis-pato\"><svg viewBox=\"0 0 400 394\" role=\"img\" aria-label=\"Cascada fisiopatológica de la colangitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahcol1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"6\" width=\"188\" height=\"58\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"100\" y=\"23.135\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Obstrucción biliar<\/tspan><tspan x=\"100\" dy=\"12.81\">litos del colédoco, estenosis,<\/tspan><tspan x=\"100\" dy=\"12.81\">tumor, stent ocluido<\/tspan><\/text><rect x=\"206\" y=\"6\" width=\"188\" height=\"58\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"300\" y=\"23.135\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Bacterias en la bilis<\/tspan><tspan x=\"300\" dy=\"12.81\">ascenso desde el duodeno<\/tspan><tspan x=\"300\" dy=\"12.81\">o por vía portal<\/tspan><\/text><path d=\"M100 64 V74 H170 V86\" class=\"fx-arr\" marker-end=\"url(#ahcol1)\"/><path d=\"M300 64 V74 H230 V86\" class=\"fx-arr\" marker-end=\"url(#ahcol1)\"/><rect x=\"50\" y=\"86\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"102.02\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Colestasis + bilis infectada:<\/tspan><tspan x=\"200\" dy=\"14.03\">↑ presión intrabiliar (&gt;20–25 cmH₂O)<\/tspan><\/text><path d=\"M200 130 L200 148\" class=\"fx-arr\" marker-end=\"url(#ahcol1)\"/><rect x=\"50\" y=\"148\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"164.02\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Se abren las uniones estrechas: reflujo<\/tspan><tspan x=\"200\" dy=\"14.03\">colangiovenoso y colangiolinfático<\/tspan><\/text><path d=\"M200 192 L200 210\" class=\"fx-arr\" marker-end=\"url(#ahcol1)\"/><rect x=\"50\" y=\"210\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"226.02\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Bacteriemia y endotoxemia (LPS) →<\/tspan><tspan x=\"200\" dy=\"14.03\">TNF-α, IL-1, IL-6<\/tspan><\/text><path d=\"M200 254 L200 272\" class=\"fx-arr\" marker-end=\"url(#ahcol1)\"/><rect x=\"50\" y=\"272\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"288.02\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Respuesta inflamatoria sistémica<\/tspan><tspan x=\"200\" dy=\"14.03\">(fiebre, leucocitosis, PCR alta = criterio A)<\/tspan><\/text><path d=\"M200 316 L200 334\" class=\"fx-arr\" marker-end=\"url(#ahcol1)\"/><rect x=\"50\" y=\"334\" width=\"300\" height=\"54\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"200\" y=\"348.005\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Sepsis → choque, confusión y falla<\/tspan><tspan x=\"200\" dy=\"14.03\">orgánica = grado III<\/tspan><tspan x=\"200\" dy=\"14.03\">(péntada de Reynolds)<\/tspan><\/text><\/svg><figcaption>La <strong>presión alta<\/strong> dentro de la vía biliar es la que empuja bacterias y endotoxinas a la sangre. Por eso el tratamiento tiene dos pilares: <strong>antibiótico<\/strong> y <strong>descomprimir<\/strong>.<\/figcaption><\/figure><h5>Por qué la bilis normal es estéril<\/h5><ul><li><strong>Esfínter de Oddi:<\/strong> barrera mecánica que impide que suba el contenido del duodeno.<\/li><li><strong>Flujo continuo de bilis:<\/strong> lava la vía biliar hacia el intestino.<\/li><li><strong>Sales biliares<\/strong> con efecto bacteriostático, <strong>IgA secretora<\/strong> y moco del epitelio.<\/li><li><strong>Uniones estrechas<\/strong> entre hepatocitos y colangiocitos, y <strong>células de Kupffer<\/strong> que limpian las bacterias que llegan por la vena porta.<\/li><\/ul><p>La obstrucción rompe todas estas defensas a la vez: la bilis se estanca, las bacterias se multiplican y la presión sube.<\/p><h5>Cómo llegan las bacterias<\/h5><div class=\"tbl\"><table><thead><tr><th>Vía<\/th><th>Cuándo pesa más<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Ascendente desde el duodeno<\/th><td><strong>La más común.<\/strong> Más aún si el esfínter ya no sirve: esfinterotomía, stent biliar, anastomosis bilioentérica.<\/td><\/tr><tr><th scope=\"row\">Portal (translocación intestinal)<\/th><td>Bacterias del intestino que pasan a la vena porta y llegan al hígado.<\/td><\/tr><tr><th scope=\"row\">Hematógena o linfática<\/th><td>Rara.<\/td><\/tr><\/tbody><\/table><\/div><h5>Causas de la obstrucción<\/h5><div class=\"tbl\"><table><thead><tr><th>Causa<\/th><th>Comentario<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Coledocolitiasis<\/strong><\/th><td>La causa más frecuente.<\/td><\/tr><tr><th scope=\"row\">Estenosis benigna<\/th><td>Posquirúrgica, colangitis esclerosante primaria, pancreatitis crónica.<\/td><\/tr><tr><th scope=\"row\">Tumores<\/th><td>Páncreas, colangiocarcinoma, ámpula. La obstrucción tumoral completa se infecta con menos frecuencia, salvo que se haya manipulado la vía biliar.<\/td><\/tr><tr><th scope=\"row\">Manipulación de la vía biliar<\/th><td>CPRE, <strong>stent ocluido<\/strong>, anastomosis bilioentérica.<\/td><\/tr><tr><th scope=\"row\">Otras<\/th><td>Parásitos (<em>Ascaris<\/em>, <em>Clonorchis<\/em>), síndrome de Mirizzi, divertículo periampular.<\/td><\/tr><\/tbody><\/table><\/div><h5>Gérmenes más frecuentes<\/h5><ul><li><strong>Gramnegativos entéricos:<\/strong> <em>E. coli<\/em> (el más común), <em>Klebsiella<\/em> y <em>Enterobacter<\/em>.<\/li><li><strong>Grampositivos:<\/strong> <em>Enterococcus<\/em> y <em>Streptococcus<\/em>.<\/li><li><strong>Anaerobios<\/strong> (<em>Bacteroides<\/em>, <em>Clostridium<\/em>): sobre todo con <strong>anastomosis bilioentérica<\/strong> y en adultos mayores.<\/li><li>Muchas veces la infección es <strong>polimicrobiana<\/strong>. Por eso hay que tomar <strong>hemocultivo<\/strong> y <strong>cultivo de bilis<\/strong>.<\/li><\/ul><h5>Del mecanismo al signo<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><th>En TG18<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Bacteriemia y endotoxinas → citocinas<\/th><td>Fiebre, escalofríos, leucocitosis o leucopenia, PCR alta<\/td><td><strong>Criterio A<\/strong> (inflamación sistémica)<\/td><\/tr><tr><th scope=\"row\">Bilis que no sale<\/th><td>Ictericia, BT ≥2 mg/dL, FA, GGT, AST y ALT altas<\/td><td><strong>Criterio B<\/strong> (colestasis)<\/td><\/tr><tr><th scope=\"row\">Presión retrógrada sobre el árbol biliar<\/th><td>Dilatación de la vía biliar; a veces se ve la causa (lito, estenosis, stent)<\/td><td><strong>Criterio C<\/strong> (imagen)<\/td><\/tr><tr><th scope=\"row\">Distensión de la vía biliar y de la cápsula de Glisson<\/th><td>Dolor en el cuadrante superior derecho o epigastrio<\/td><td>Parte de Charcot, <strong>no es criterio<\/strong><\/td><\/tr><tr><th scope=\"row\">Sepsis con mala perfusión<\/th><td>Hipotensión, confusión, falla renal, CID<\/td><td><strong>Grado III<\/strong> (péntada de Reynolds)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><span class=\"callout-t\">¿Por qué hay que drenar?<\/span><\/div><p>Con la vía biliar obstruida, el antibiótico <strong>casi no llega a la bilis<\/strong> (su excreción biliar cae) y la presión sigue empujando bacterias a la sangre. El antibiótico <strong>no sustituye<\/strong> la descompresión: el drenaje es el control de la fuente.<\/p><\/aside><aside class=\"callout c-perla\"><div class=\"callout-h\"><span class=\"callout-k\">Perla<\/span><span class=\"callout-t\">Transaminasas muy altas<\/span><\/div><p>Cuando un lito tapa el colédoco de golpe, AST y ALT pueden subir a <strong>cientos o más de 1,000 UI/L<\/strong> en las primeras horas y bajar en pocos días. No lo confundas con hepatitis: piensa en obstrucción aguda.<\/p><\/aside>"},{"t":"Triada de Charcot y péntada de Reynolds","h":"<h5>Triada de Charcot<\/h5><div class=\"tbl\"><table><thead><tr><th>Dato<\/th><th>Valor (artículo de Kiriyama)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Especificidad<\/th><td><strong>Muy alta<\/strong> (no se da cifra)<\/td><\/tr><tr><th scope=\"row\">Sensibilidad en series antiguas<\/th><td><strong>50–70 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Sensibilidad en series multicéntricas recientes<\/th><td><strong>26.4 %<\/strong> y <strong>21.2 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Ictericia en colangitis aguda<\/th><td>Solo <strong>60–70 %<\/strong> de los pacientes<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Recomendación (pregunta 1, nivel D)<\/span><\/div><p>La triada de Charcot <strong>sugiere fuertemente<\/strong> colangitis cuando está presente, pero por su <strong>baja sensibilidad no es aplicable como criterio diagnóstico<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;¿Por qué el dolor abdominal no está en los criterios de Tokio?&quot; Porque aumentaba los <strong>falsos positivos por colecistitis<\/strong> (38.8 % → 5.9 % al quitarlo).<\/p><\/aside>"},{"t":"Criterios diagnósticos TG18/TG13","h":"<figure class=\"fig\" data-fig=\"colangitis-dx\"><svg viewBox=\"0 0 400 330\" role=\"img\" aria-label=\"Criterios diagnósticos TG18 de colangitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah35\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"8\" width=\"124\" height=\"40\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"20.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">A. Inflamación<\/tspan><tspan x=\"68\" dy=\"14.03\">sistémica<\/tspan><\/text><rect x=\"6\" y=\"56\" width=\"124\" height=\"66\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"75.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">A-1. Fiebre y/o<\/tspan><tspan x=\"68\" dy=\"13.42\">escalofríos: T &gt;38<\/tspan><tspan x=\"68\" dy=\"13.42\">°C<\/tspan><\/text><text x=\"68\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">o<\/tspan><\/text><rect x=\"6\" y=\"142\" width=\"124\" height=\"70\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"156.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">A-2. Leucocitos<\/tspan><tspan x=\"68\" dy=\"13.42\">&lt;4,000 o<\/tspan><tspan x=\"68\" dy=\"13.42\">&gt;10,000/µL; PCR ≥1<\/tspan><tspan x=\"68\" dy=\"13.42\">mg/dL<\/tspan><\/text><rect x=\"138\" y=\"8\" width=\"124\" height=\"40\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"28\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">B. Colestasis<\/tspan><\/text><rect x=\"138\" y=\"56\" width=\"124\" height=\"66\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"82.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">B-1. Ictericia: BT<\/tspan><tspan x=\"200\" dy=\"13.42\">≥2 mg/dL<\/tspan><\/text><text x=\"200\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">o<\/tspan><\/text><rect x=\"138\" y=\"142\" width=\"124\" height=\"70\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"170.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">B-2. FA, GGT, AST<\/tspan><tspan x=\"200\" dy=\"13.42\">o ALT &gt;1.5 × LSN<\/tspan><\/text><rect x=\"270\" y=\"8\" width=\"124\" height=\"40\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"332\" y=\"28\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">C. Imagen<\/tspan><\/text><rect x=\"270\" y=\"56\" width=\"124\" height=\"66\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"332\" y=\"82.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">C-1. Dilatación de<\/tspan><tspan x=\"332\" dy=\"13.42\">la vía biliar<\/tspan><\/text><text x=\"332\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">o<\/tspan><\/text><rect x=\"270\" y=\"142\" width=\"124\" height=\"70\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"332\" y=\"163.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">C-2. Causa en<\/tspan><tspan x=\"332\" dy=\"13.42\">imagen: estenosis,<\/tspan><tspan x=\"332\" dy=\"13.42\">lito, stent<\/tspan><\/text><path d=\"M200 212 V230 H101 V248\" class=\"fx-arr\" marker-end=\"url(#ah35)\"/><path d=\"M200 212 V230 H299 V248\" class=\"fx-arr\" marker-end=\"url(#ah35)\"/><rect x=\"6\" y=\"248\" width=\"190\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"101\" y=\"262.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">SOSPECHA: 1 de A + 1 de B o<\/tspan><tspan x=\"101\" dy=\"14.03\">de C<\/tspan><\/text><rect x=\"204\" y=\"248\" width=\"190\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"299\" y=\"262.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">DEFINITIVO: 1 de A + 1 de B<\/tspan><tspan x=\"299\" dy=\"14.03\">+ 1 de C<\/tspan><\/text><text x=\"200\" y=\"312\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">A (inflamación sistémica) siempre es obligatoria<\/tspan><\/text><\/svg><figcaption>Tabla 2 de Kiriyama (TG18/TG13). El <strong>dolor abdominal<\/strong> y el antecedente biliar <strong>ayudan pero no son criterio<\/strong>. LSN = límite superior normal.<\/figcaption><\/figure><h5>Tabla 2 (Kiriyama) / Tabla 1 (Miura)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Criterio<\/th><th>Corte<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>A. Inflamación sistémica<\/strong><\/th><td>A-1. Fiebre y/o escalofríos<\/td><td><strong>Temperatura &gt;38 °C<\/strong><\/td><\/tr><tr><th scope=\"row\"><\/th><td>A-2. Laboratorio: respuesta inflamatoria<\/td><td><strong>Leucocitos &lt;4,000 o &gt;10,000/µL<\/strong>; <strong>PCR ≥1 mg/dL<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>B. Colestasis<\/strong><\/th><td>B-1. Ictericia<\/td><td><strong>Bilirrubina total ≥2 mg/dL<\/strong><\/td><\/tr><tr><th scope=\"row\"><\/th><td>B-2. PFH anormales<\/td><td><strong>FA, GGT, AST y ALT &gt;1.5 × LSN<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>C. Imagen<\/strong><\/th><td>C-1. Dilatación biliar<\/td><td>—<\/td><\/tr><tr><th scope=\"row\"><\/th><td>C-2. Evidencia de la causa<\/td><td>Estenosis, lito, stent, etc.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">La regla<\/span><\/div><ul><li><mark><strong>Sospecha:<\/strong> un criterio de A + uno de B <strong>o<\/strong> de C.<\/mark><\/li><li><mark><strong>Diagnóstico definitivo:<\/strong> uno de A + uno de B + uno de C.<\/mark><\/li><\/ul><\/aside><h5>Rendimiento (Tabla 1 de Kiriyama, 6,063 pacientes)<\/h5><div class=\"tbl\"><table><thead><tr><th>Estado<\/th><th>TG13<\/th><th>TG07<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Definitivo<\/th><td><strong>4,430 (73.1 %)<\/strong><\/td><td>3,977 (65.6 %)<\/td><\/tr><tr><th scope=\"row\">Sospecha<\/th><td>1,024 (16.9 %)<\/td><td>838 (13.8 %)<\/td><\/tr><tr><th scope=\"row\">Definitivo o sospecha<\/th><td><mark><strong>5,454 (90.0 %)<\/strong><\/mark><\/td><td>4,815 (79.4 %)<\/td><\/tr><tr><th scope=\"row\">No colangitis<\/th><td>609 (10.0 %)<\/td><td>1,248 (20.6 %)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Fiebre + ictericia <strong>sin<\/strong> imagen = <strong>sospecha<\/strong> (A + B). Fiebre + ictericia + colédoco dilatado = <strong>definitivo<\/strong> (A + B + C). Ictericia + dilatación <strong>sin<\/strong> fiebre ni leucocitos o PCR alterados = <strong>no<\/strong> cumple (falta A).<\/p><\/aside>"},{"t":"Imagen en la colangitis aguda","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Primer estudio de imagen ante sospecha de infección biliar: <strong>ultrasonido abdominal<\/strong>. Si no es concluyente: <strong>CPRM<\/strong>. La CPRE <strong>no<\/strong> es estudio diagnóstico de primera elección.<\/p><\/aside>"},{"t":"Gravedad TG18/TG13","h":"<figure class=\"fig\" data-fig=\"colangitis-grav\"><svg viewBox=\"0 0 400 336\" role=\"img\" aria-label=\"Gravedad TG18 de colangitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah36\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"6\" width=\"388\" height=\"136\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"31.910000000000004\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">GRADO III (grave): ≥1 disfunción orgánica<\/tspan><tspan x=\"200\" dy=\"14.03\">Cardiovascular: dopamina ≥5 µg/kg/min o cualquier dosis de<\/tspan><tspan x=\"200\" dy=\"14.03\">norepinefrina<\/tspan><tspan x=\"200\" dy=\"14.03\">Neurológica: alteración de la conciencia<\/tspan><tspan x=\"200\" dy=\"14.03\">Respiratoria: PaO2/FiO2 &lt;300 · Renal: oliguria o Cr &gt;2.0<\/tspan><tspan x=\"200\" dy=\"14.03\">mg/dL<\/tspan><tspan x=\"200\" dy=\"14.03\">Hepática: INR &gt;1.5 · Hematológica: plaquetas &lt;100,000/mm³<\/tspan><\/text><rect x=\"6\" y=\"152\" width=\"388\" height=\"110\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"185.955\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">GRADO II (moderado): ≥2 de 5<\/tspan><tspan x=\"200\" dy=\"14.03\">Leucocitos &gt;12,000 o &lt;4,000/mm³ · Fiebre ≥39 °C<\/tspan><tspan x=\"200\" dy=\"14.03\">Edad ≥75 años · Bilirrubina total ≥5 mg/dL<\/tspan><tspan x=\"200\" dy=\"14.03\">Albúmina &lt; límite inferior normal × 0.7<\/tspan><\/text><rect x=\"6\" y=\"272\" width=\"388\" height=\"56\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"200\" y=\"300\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">GRADO I (leve): no cumple II ni III al diagnóstico inicial<\/tspan><\/text><\/svg><figcaption>Tabla 4 de Kiriyama. Se evalúa de arriba abajo: <strong>una<\/strong> disfunción basta para grado III; para grado II hacen falta <strong>dos<\/strong> factores.<\/figcaption><\/figure><h5>Grado III (grave)<\/h5><div class=\"tbl\"><table><thead><tr><th>Sistema<\/th><th>Criterio<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Cardiovascular<\/th><td>Hipotensión que requiere <strong>dopamina ≥5 µg/kg/min<\/strong> o <strong>cualquier dosis de norepinefrina<\/strong><\/td><\/tr><tr><th scope=\"row\">Neurológico<\/th><td><strong>Alteración de la conciencia<\/strong><\/td><\/tr><tr><th scope=\"row\">Respiratorio<\/th><td><strong>PaO2/FiO2 &lt;300<\/strong><\/td><\/tr><tr><th scope=\"row\">Renal<\/th><td><strong>Oliguria<\/strong> o <strong>creatinina sérica &gt;2.0 mg/dL<\/strong><\/td><\/tr><tr><th scope=\"row\">Hepático<\/th><td><strong>INR &gt;1.5<\/strong><\/td><\/tr><tr><th scope=\"row\">Hematológico<\/th><td><strong>Plaquetas &lt;100,000/mm³<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente de 80 años con 39.2 °C y leucocitos de 9,000: edad + fiebre = <strong>2 criterios → grado II<\/strong>, aunque los leucocitos sean normales. Un solo criterio de disfunción orgánica (p. ej., <strong>INR 1.8<\/strong> o <strong>plaquetas 80,000<\/strong>) ya es <strong>grado III<\/strong>.<\/p><\/aside>"},{"t":"Gravedad, drenaje y mortalidad","h":"<h5>Distribución en el estudio Japón–Taiwán (6,063)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Pacientes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">III<\/th><td><strong>1,521 (25.1 %)<\/strong><\/td><\/tr><tr><th scope=\"row\">II<\/th><td><strong>2,019 (33.3 %)<\/strong><\/td><\/tr><tr><th scope=\"row\">I<\/th><td><strong>2,523 (41.6 %)<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Tabla 3: mortalidad a 30 días según el momento del drenaje<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>&lt;24 h<\/th><th>&gt;24 h o sin drenaje<\/th><th>P<\/th><th>&lt;48 h<\/th><th>&gt;48 h o sin drenaje<\/th><th>P<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">III<\/th><td>5.4 % (42/781)<\/td><td>4.9 % (36/740)<\/td><td>0.727<\/td><td>4.9 % (50/1,017)<\/td><td>5.6 % (28/504)<\/td><td>0.622<\/td><\/tr><tr><th scope=\"row\">II<\/th><td><mark><strong>1.7 % (16/939)<\/strong><\/mark><\/td><td><mark><strong>3.4 % (37/1,080)<\/strong><\/mark><\/td><td><strong>&lt;0.05<\/strong><\/td><td><strong>2.0 % (25/1,272)<\/strong><\/td><td><strong>3.7 % (28/747)<\/strong><\/td><td><strong>&lt;0.05<\/strong><\/td><\/tr><tr><th scope=\"row\">I<\/th><td>1.3 % (13/989)<\/td><td>1.2 % (18/1,534)<\/td><td>0.853<\/td><td>1.1 % (16/1,441)<\/td><td>1.4 % (15/1,082)<\/td><td>0.586<\/td><\/tr><tr><th scope=\"row\">Total<\/th><td>2.6 % (71/2,709)<\/td><td>2.7 % (91/3,354)<\/td><td>0.873<\/td><td>2.4 % (91/3,730)<\/td><td>3.0 % (71/2,333)<\/td><td>0.164<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Qué concluye TG18<\/span><\/div><ul><li>El drenaje temprano o urgente <strong>solo mejoró la mortalidad en el grado II<\/strong>.<\/li><li>En el <strong>grado III<\/strong> no hubo diferencia; quizá mejoraría con un drenaje <strong>aún más temprano<\/strong> (falta investigación).<\/li><li>Para la práctica, la gravedad es más valiosa como <strong>indicador de drenaje<\/strong> que como predictor pronóstico.<\/li><\/ul><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;¿En qué grado demostró el drenaje en &lt;24 h bajar la mortalidad a 30 días?&quot; → <strong>Grado II<\/strong> (1.7 % vs 3.4 %).<\/p><\/aside>"},{"t":"Abordaje inicial de la infección biliar aguda","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>En el paciente en <strong>choque<\/strong> no esperas el diagnóstico definitivo: <strong>primero reanimas<\/strong>. Y el analgésico <strong>no se retrasa<\/strong> &quot;para no enmascarar el cuadro&quot;.<\/p><\/aside>"},{"t":"Diagrama de flujo de manejo por grado","h":"<figure class=\"fig\" data-fig=\"colangitis-flujo\"><svg viewBox=\"0 0 400 420\" role=\"img\" aria-label=\"Diagrama de flujo de manejo de la colangitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah37\" viewBox respuesta en<\/tspan><tspan x=\"68\" dy=\"13.42\">24 h o lito en el<\/tspan><tspan x=\"68\" dy=\"13.42\">colédoco? →<\/tspan><tspan x=\"68\" dy=\"13.42\">drenaje<\/tspan><\/text><path d=\"M68 302 L68 314\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"6\" y=\"314\" width=\"124\" height=\"80\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"333.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">EST + extracción<\/tspan><tspan x=\"68\" dy=\"13.42\">del lito en el<\/tspan><tspan x=\"68\" dy=\"13.42\">mismo tiempo, si<\/tspan><tspan x=\"68\" dy=\"13.42\">se puede<\/tspan><\/text><rect x=\"138\" y=\"74\" width=\"124\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"82.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Grado II<\/tspan><tspan x=\"200\" dy=\"14.03\">(moderado)<\/tspan><\/text><path d=\"M200 106 L200 118\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"138\" y=\"118\" width=\"124\" height=\"80\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"137.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Drenaje biliar<\/tspan><tspan x=\"200\" dy=\"13.42\">TEMPRANO<\/tspan><tspan x=\"200\" dy=\"13.42\">(endoscópico o<\/tspan><tspan x=\"200\" dy=\"13.42\">percutáneo)<\/tspan><\/text><path d=\"M200 198 L200 210\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"138\" y=\"210\" width=\"124\" height=\"92\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"229.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Causa tras<\/tspan><tspan x=\"200\" dy=\"13.42\">mejorar, o EST +<\/tspan><tspan x=\"200\" dy=\"13.42\">litotomía en el<\/tspan><tspan x=\"200\" dy=\"13.42\">mismo tiempo<\/tspan><tspan x=\"200\" dy=\"13.42\">(TG18)<\/tspan><\/text><path d=\"M200 302 L200 314\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"138\" y=\"314\" width=\"124\" height=\"80\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"340.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Valorar estado<\/tspan><tspan x=\"200\" dy=\"13.42\">general: Charlson<\/tspan><tspan x=\"200\" dy=\"13.42\">y ASA-PS<\/tspan><\/text><rect x=\"270\" y=\"74\" width=\"124\" height=\"32\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"90\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Grado III (grave)<\/tspan><\/text><path d=\"M332 106 L332 118\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"270\" y=\"118\" width=\"124\" height=\"80\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"137.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Soporte orgánico:<\/tspan><tspan x=\"332\" dy=\"13.42\">intubación,<\/tspan><tspan x=\"332\" dy=\"13.42\">ventilación,<\/tspan><tspan x=\"332\" dy=\"13.42\">vasopresores<\/tspan><\/text><path d=\"M332 198 L332 210\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"270\" y=\"210\" width=\"124\" height=\"92\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"242.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Drenaje URGENTE en<\/tspan><tspan x=\"332\" dy=\"13.42\">cuanto se<\/tspan><tspan x=\"332\" dy=\"13.42\">estabilice<\/tspan><\/text><path d=\"M332 302 L332 314\" class=\"fx-arr\" marker-end=\"url(#ah37)\"/><rect x=\"270\" y=\"314\" width=\"124\" height=\"80\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"340.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Tratar la causa<\/tspan><tspan x=\"332\" dy=\"13.42\">cuando mejore el<\/tspan><tspan x=\"332\" dy=\"13.42\">estado general<\/tspan><\/text><text x=\"200\" y=\"408\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Cultivo de bilis en todo drenaje<\/tspan><\/text><\/svg><figcaption>Figura 2 y texto de Miura (TG18), simplificados. Drenaje <strong>urgente<\/strong> = día del ingreso (&lt;24 h); <strong>temprano<\/strong> = día siguiente (24–48 h). El grado I con lito en el colédoco se maneja como el moderado (Tabla 5).<\/figcaption><\/figure><aside class=\"callout c-compara\"><div class=\"callout-h\"><span class=\"callout-k\">Compara<\/span><span class=\"callout-t\">Momento del drenaje<\/span><\/div><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Drenaje<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">I<\/th><td>Solo si no responde (≈24 h) o hay coledocolitiasis<\/td><\/tr><tr><th scope=\"row\">II<\/th><td><strong>Temprano<\/strong><\/td><\/tr><tr><th scope=\"row\">III<\/th><td><strong>Urgente<\/strong>, tras estabilizar<\/td><\/tr><\/tbody><\/table><\/div><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Grado II por coledocolitiasis: ¿puedo hacer CPRE con esfinterotomía y extraer el lito en el mismo procedimiento del drenaje?&quot; En TG18, <strong>sí, si es posible<\/strong>. En el grado <strong>III<\/strong>, <strong>no<\/strong>: primero drenar y estabilizar.<\/p><\/aside>"},{"t":"Drenaje, causa, CID y traslado",
