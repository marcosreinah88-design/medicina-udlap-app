<style>/* Layout: barra fija arriba, columna de lectura de ~70ch; el tema abre con su "ficha" y debajo los bloques de repaso. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunk:#E7ECE6; --ink:#14201B; --mut:#55635C; --line:#D3DCD5;
  --accent:#1E6A4E; --accent-ink:#FFFFFF; --bili:#B97A00; --mark:#FBE7A8;
  --ok:#1F7A45; --ok-bg:#E2F3E8; --bad:#B3261E; --bad-bg:#FBE4E1; --warn:#9A6200; --warn-bg:#FDF0D5;

  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2823; --ink:#E4ECE7; --mut:#9DADA5; --line:#2B3832;
  --accent:#62C79D; --accent-ink:#0B1A14; --bili:#E9B544; --mark:#5A4712;
  --ok:#6BD39A; --ok-bg:#16301F; --bad:#F2988F; --bad-bg:#3A1C19; --warn:#EBC066; --warn-bg:#382A0E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2823; --ink:#E4ECE7; --mut:#9DADA5; --line:#2B3832;
  --accent:#62C79D; --accent-ink:#0B1A14; --bili:#E9B544; --mark:#5A4712;
  --ok:#6BD39A; --ok-bg:#16301F; --bad:#F2988F; --bad-bg:#3A1C19; --warn:#EBC066; --warn-bg:#382A0E; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:24px 40px;outline:none}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;line-height:1.15;margin:0}
mark{background:var(--mark);color:inherit;padding:0 .15em;border-radius:3px}
strong{font-weight:700}
:focus-visible{outline:3px solid var(--bili);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-disp);font-size:18px;margin-right:auto}
.brand b{font-weight:800}
.brand-mark{width:22px;height:22px;border-radius:50% 50% 50% 12%;background:conic-gradient(from 200deg,var(--accent),var(--bili),var(--accent));transform:rotate(-20deg)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--mut);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* inicio */
.hero{display:grid;gap:10px;margin-bottom:22px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--mut)}
.next{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:6px 0 4px}
.next .eyebrow{color:var(--bili)}
.next a{font-family:var(--f-disp);font-weight:700;font-size:18px;text-decoration:none}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.prog-bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:120px}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.group{margin-top:26px}
.group h2{font-size:15px;font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;gap:10px;align-items:center;margin-bottom:10px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--tc);transform:translateY(-1px)}
.tnum{grid-row:span 3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-mono);color:#fff;background:var(--tc)}
.tcard h3{font-size:18px;font-weight:700}
.tmeta{font:500 12px var(--f-mono);color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.done-pill{color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:1px 8px;font-weight:700}
.tcard p{margin:2px 0 0;font-size:14.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:28px}
.quick a{padding:14px;border-radius:var(--r);background:var(--sunk);text-decoration:none;color:var(--ink)}
.quick b{display:block;font-family:var(--f-disp);font-size:18px}
.quick span{font-size:14px;color:var(--mut)}

/* tema */
.thead{border-left:6px solid var(--tc);padding:4px 0 4px 16px;margin-bottom:18px;display:grid;gap:8px}
.thead h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.015em}
.hook{font-size:19px;line-height:1.45;margin:0;max-width:64ch}
.src{font-size:13.5px;color:var(--mut);margin:0}
.tnav{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;margin:0 0 18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:5;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}
.tnav a{white-space:nowrap;flex:none;font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--ink);text-decoration:none}
.tnav a:hover{background:var(--line)}
.block{margin:30px 0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 110px)}
.block>h2{font-size:24px;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.block>h2 small{font:500 13px var(--f-mono);color:var(--mut)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.num b{display:block;font:700 20px/1.2 var(--f-mono);color:var(--tc2);margin-bottom:2px;font-variant-numeric:tabular-nums}
.num span{font-size:14px;color:var(--mut)}
.prose ul,.prose ol{padding-left:1.3em;margin:.4em 0}
.prose li{margin:.3em 0}
.prose li::marker{color:var(--tc2)}
.prose p{margin:.5em 0}
.prose h4,.prose h5{font-size:16px;margin:16px 0 6px;color:var(--mut);font-family:var(--f-body);font-weight:700}
.essential{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 18px}
.tbl{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--sunk);font-weight:700;font-size:14px;position:sticky;top:0}
tbody th{font-weight:600}
tr:last-child>*{border-bottom:0}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--sunk);border-left:4px solid var(--mut)}
.callout-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:2px}
.callout-k{font:700 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.callout-t{font-weight:700}
.callout p:first-of-type{margin-top:2px}
.c-ojo{border-left-color:var(--bili);background:var(--warn-bg)} .c-ojo .callout-k{color:var(--warn)}
.c-alerta{border-left-color:var(--bad);background:var(--bad-bg)} .c-alerta .callout-k{color:var(--bad)}
.c-clave{border-left-color:var(--accent)} .c-clave .callout-k{color:var(--accent)}
.c-perla .callout-k,.c-mnemo .callout-k{color:var(--ok)} .c-perla,.c-mnemo{border-left-color:var(--ok);background:var(--ok-bg)}
details.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:8px 0}
details.sec>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:17px;list-style:none;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>.prose{padding:0 16px 12px;min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 11px;font-size:14px}
.pearls{counter-reset:p;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.pearls li{counter-increment:p;display:grid;grid-template-columns:2.2em 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pearls li::before{content:counter(p,decimal-leading-zero);font:700 14px var(--f-mono);color:var(--tc2);padding-top:2px}
.comp-key{margin-top:6px;font-size:15px}
.algo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.algo h3{font-size:18px;margin-bottom:2px}
.algo .src{margin-bottom:10px}
.algo-path{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--mut);margin-bottom:8px}
.algo-path span{background:var(--sunk);border-radius:99px;padding:1px 8px}
.algo-q{font-size:17px;margin:4px 0 8px}
.algo-i{font-size:14px;color:var(--mut);margin:-2px 0 8px}
.algo-o{display:flex;flex-wrap:wrap;gap:8px}
.end{border-radius:8px;padding:10px 12px;margin:6px 0 10px}
.tone-ok{background:var(--ok-bg)} .tone-warn{background:var(--warn-bg)} .tone-bad{background:var(--bad-bg)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}
.pager a{flex:1 1 200px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a small{display:block;color:var(--mut);font-size:13px}
.pager a:last-child{text-align:right}
.mark-done{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sunk);border-radius:var(--r);font-weight:600;cursor:pointer}
.mark-done input{width:20px;height:20px;accent-color:var(--accent)}

/* preguntas */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q-meta{display:flex;justify-content:space-between;gap:10px;font:500 13px var(--f-mono);color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
.q-stem{font-size:18px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:700 14px var(--f-mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .k{background:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{background:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default}
.expl{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:15.5px}
.expl b.v{display:block;margin-bottom:2px}
.q-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.score{display:grid;gap:8px;text-align:center;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.score .big{font:800 54px/1 var(--f-disp);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:#fff}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--tc);display:inline-block}
.chip[aria-pressed="true"] i{background:#fff}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.setup label{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.review{display:grid;gap:10px;margin-top:16px}
.review .item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 14px;font-size:15.5px}
.review .item p{margin:.3em 0}

/* tarjetas */
.flash{perspective:1200px;margin:8px 0}
.fc{position:relative;min-height:230px;width:100%;border:0;padding:0;background:none;text-align:left}
.fc-in{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--sunk)}
.fc-face .eyebrow{position:absolute;top:12px;left:16px}
.fc-face .txt{font-size:20px;line-height:1.4}
.fc-face.back .txt{font-size:18px}
.fc-hint{font-size:13px;color:var(--mut);text-align:center;margin-top:6px}
.tf-row{display:flex;gap:8px;margin-top:10px}
.tf-row .btn{flex:1}

/* cifras */
.search{width:100%;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.cif td:first-child{font:700 15px var(--f-mono);white-space:nowrap;color:var(--accent)}
.cif td:last-child{font-size:13px;color:var(--mut);white-space:nowrap}
.foot{font-size:13px;color:var(--mut);padding-block:10px 32px}
@media (max-width:560px){
  body{font-size:16px}
  .brand-txt{display:none}
  .bar-in{flex-wrap:nowrap;gap:6px}
  .tabs a{padding:7px 10px}
  .fc,.fc-in{min-height:280px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tp,.tcard,.chip{--tc2:color-mix(in srgb,var(--tc) 72%,var(--ink))}
.fig{margin:12px 0;background:var(--sunk);border-radius:10px;padding:12px 8px 8px}
.fig svg.fx{width:100%;height:auto;display:block;margin:0 auto}
.fp-nota{color:var(--mut);margin-top:10px}.fig figcaption{font-size:14px;color:var(--mut);margin-top:6px;padding:0 6px}
svg.fx text{font-family:var(--f-body)}
.fx-ink{fill:var(--ink)}.fx-mut{fill:var(--mut)}
.fx-arr{fill:none;stroke:var(--mut);stroke-width:1.6}
.fx-arrhead{fill:var(--mut)}
.fx-pill{fill:var(--surface);stroke:var(--line)}
.fx-dash{fill:none;stroke:var(--mut);stroke-width:1.2;stroke-dasharray:4 5;opacity:.6}
.fx-gut{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.fx-axis{fill:none;stroke:var(--mut);stroke-width:1.4}
.fx-grid{stroke:var(--line);stroke-width:1}
.fx-off{fill:var(--line);opacity:.55}
.fx-tissue{fill:color-mix(in srgb,#C9970A 10%,var(--surface));stroke:var(--line)}
.fx-crypt{fill:var(--surface);stroke:#C9970A;stroke-opacity:.6}
.fx-row{fill:var(--surface);stroke:var(--line)}
.fx-body{fill:var(--surface);stroke:var(--mut);stroke-width:2}
</style>

<script>window.RB={"topics":[{"id":"pruebas","n":1,"title":"Pruebas de función hepática alteradas","short":"Pruebas hepáticas","color":"#2F6FD6","src":"Kwo PY, Masuoka HC, Schaefer EA, Friedman LS. Evaluation of Abnormal Liver Biochemical Test Results. Gastroenterology. 2026;170(7):1457-72.","hook":"Las &quot;PFH&quot; casi nunca miden función: ALT y AST dicen que el hepatocito se rompe, la FA que la bilis no fluye, y solo la albúmina, el TP y la bilirrubina hablan de cuánto hígado queda trabajando.","group":"Hígado","ses":17,"date":"2026-10-14","nums":[["~8 %","de las personas a quienes se piden PFH las tiene alteradas (7.9 % en EUA)"],["R &gt; 5","patrón hepatocelular; R &lt; 2 colestásico; 2–5 mixto"],["AST/ALT &gt; 2","sugiere enfermedad hepática asociada al alcohol"],["33 / 25 U/L","LSN de ALT en hombres / mujeres usado en el algoritmo de la Figura 1"],["FIB-4 &lt; 1.3","excluye fibrosis avanzada en MASLD (VPN alto)"],["42.7 %","de las ALT o AST &gt;1000 U/L en hospitalizados son por hepatitis isquémica"]],"esencial":"<ul><li>Las PFH clásicas son <strong>ALT, AST, fosfatasa alcalina (FA), bilirrubina, tiempo de protrombina (TP) y albúmina<\/strong>. Solo <mark>bilirrubina, TP y albúmina miden función<\/mark>; ALT y AST reflejan <strong>lesión<\/strong>.<\/li><li><strong>ALT<\/strong> es citosólica y casi exclusiva del hígado (vida media ~47 h); <strong>AST<\/strong> es 80 % <strong>mitocondrial<\/strong>, está también en corazón, músculo, riñón y cerebro (vida media ~17 h): <strong>ALT es más específica<\/strong>.<\/li><li>Elevación de <strong>ALT/AST = lesión hepatocelular<\/strong>; elevación de <strong>FA = colestasis<\/strong>; la bilirrubina sube en ambas.<\/li><li><strong>Factor R<\/strong> = (ALT/LSN) ÷ (FA/LSN): <mark>R &gt; 5 hepatocelular, R &lt; 2 colestásico, 2–5 mixto<\/mark>.<\/li><li>Grados de elevación de aminotransferasas: limítrofe &lt;2×, leve 2–5×, moderada 5–15×, grave &gt;15× LSN y masiva &gt;10,000 U/L.<\/li><li><strong>AST/ALT &gt; 2 sugiere EHA<\/strong> (déficit de piridoxina); <strong>AST &gt; 400 U/L es improbable en EHA<\/strong>.<\/li><li>AST &gt; ALT con <strong>FA baja<\/strong> en un cuadro agudo: piensa en <strong>enfermedad de Wilson<\/strong>.<\/li><li>Una FA aislada se confirma como hepática con <strong>GGT o 5′-nucleotidasa<\/strong> elevadas; si son normales, piensa en <strong>hueso<\/strong> o <strong>placenta<\/strong>.<\/li><li><strong>Bilirrubina indirecta aislada ≤7 mg/dL = Gilbert<\/strong> (o hemólisis).<\/li><li>Antes de estudiar: <strong>repetir el panel<\/strong>, suspender alcohol y hepatotóxicos. Estudios iniciales: <strong>VHB, VHC, ferritina y saturación de transferrina<\/strong> y <strong>US<\/strong>.<\/li><li>Urgente si el <strong>INR está prolongado, la bilirrubina alta o hay encefalopatía<\/strong>: buscar falla hepática aguda.<\/li><li>Fibrosis sin biopsia: <strong>APRI<\/strong> y <strong>FIB-4<\/strong>; <mark>FIB-4 &lt; 1.3 descarta fibrosis avanzada en MASLD<\/mark>, &gt;2.67–3.25 la sugiere.<\/li><li>Pronóstico: <strong>MELD<\/strong> (bilirrubina, creatinina, INR; luego sodio, sexo y albúmina), <strong>Child-Turcotte-Pugh<\/strong>, <strong>Maddrey &gt; 32<\/strong> y <strong>Lille &gt; 0.45<\/strong> en hepatitis alcohólica.<\/li><li>En la UCI, <strong>AST &gt; 10× LSN<\/strong> es casi siempre <strong>hepatitis isquémica<\/strong> (mortalidad hospitalaria ~50 %).<\/li><li>En el embarazo la <strong>FA sube de forma fisiológica<\/strong> (hasta ~2× LSN en el tercer trimestre, origen placentario).<\/li><\/ul>","secs":[{"t":"Fisiología detrás de cada prueba","h":"<figure class=\"fig\" data-fig=\"pruebas-fisio\"><svg viewBox=\"0 0 400 384\" role=\"img\" aria-label=\"De dónde sale cada prueba hepática\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"100\" y=\"14\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Lesión (qué se rompe)<\/tspan><\/text><text x=\"300\" y=\"14\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Función (qué fabrica)<\/tspan><\/text><rect x=\"8\" y=\"28\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"101\" y=\"48.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">ALT: citosol, casi solo<\/tspan><tspan x=\"101\" dy=\"13.42\">hígado; vida media ~47 h<\/tspan><\/text><rect x=\"8\" y=\"90\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"101\" y=\"103.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">AST: 80 % mitocondrial;<\/tspan><tspan x=\"101\" dy=\"13.42\">corazón, músculo, riñón,<\/tspan><tspan x=\"101\" dy=\"13.42\">cerebro; ~17 h<\/tspan><\/text><rect x=\"8\" y=\"152\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"101\" y=\"165.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">FA: membrana canalicular;<\/tspan><tspan x=\"101\" dy=\"13.42\">también hueso, placenta,<\/tspan><tspan x=\"101\" dy=\"13.42\">intestino<\/tspan><\/text><rect x=\"8\" y=\"214\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"101\" y=\"227.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">GGT o 5′-nucleotidasa:<\/tspan><tspan x=\"101\" dy=\"13.42\">confirman que la FA es<\/tspan><tspan x=\"101\" dy=\"13.42\">hepática<\/tspan><\/text><rect x=\"206\" y=\"28\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"299\" y=\"48.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Albúmina: síntesis hepática;<\/tspan><tspan x=\"299\" dy=\"13.42\">vida media ~18 días<\/tspan><\/text><rect x=\"206\" y=\"90\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"299\" y=\"103.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">TP/INR: factores I, II, V,<\/tspan><tspan x=\"299\" dy=\"13.42\">VII y X; más sensible que la<\/tspan><tspan x=\"299\" dy=\"13.42\">albúmina<\/tspan><\/text><rect x=\"206\" y=\"152\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"299\" y=\"172.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Bilirrubina: conjugación y<\/tspan><tspan x=\"299\" dy=\"13.42\">excreción canalicular<\/tspan><\/text><rect x=\"206\" y=\"214\" width=\"186\" height=\"54\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"299\" y=\"227.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Fracción delta: BD unida a<\/tspan><tspan x=\"299\" dy=\"13.42\">albúmina; prolonga la<\/tspan><tspan x=\"299\" dy=\"13.42\">ictericia<\/tspan><\/text><text x=\"200\" y=\"290\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Ruta de la bilirrubina<\/tspan><\/text><rect x=\"4\" y=\"304\" width=\"90\" height=\"72\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"49\" y=\"333.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"49\" dy=\"0\">Hemoglobina<\/tspan><tspan x=\"49\" dy=\"12.81\">degradada<\/tspan><\/text><path d=\"M94 340 L103 340\" class=\"fx-arr\" marker-end=\"url(#ah1)\"/><rect x=\"103\" y=\"304\" width=\"90\" height=\"72\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"148\" y=\"320.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"148\" dy=\"0\">BI no<\/tspan><tspan x=\"148\" dy=\"12.81\">conjugada<\/tspan><tspan x=\"148\" dy=\"12.81\">unida a<\/tspan><tspan x=\"148\" dy=\"12.81\">albúmina<\/tspan><\/text><path d=\"M193 340 L202 340\" class=\"fx-arr\" marker-end=\"url(#ah1)\"/><rect x=\"202\" y=\"304\" width=\"90\" height=\"72\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"247\" y=\"327.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"247\" dy=\"0\">Hepatocito:<\/tspan><tspan x=\"247\" dy=\"12.81\">conjugación†<\/tspan><tspan x=\"247\" dy=\"12.81\">→ BD<\/tspan><\/text><path d=\"M292 340 L301 340\" class=\"fx-arr\" marker-end=\"url(#ah1)\"/><rect x=\"301\" y=\"304\" width=\"90\" height=\"72\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"346\" y=\"320.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"346\" dy=\"0\">Intestino:<\/tspan><tspan x=\"346\" dy=\"12.81\">urobilinógeno<\/tspan><tspan x=\"346\" dy=\"12.81\">→<\/tspan><tspan x=\"346\" dy=\"12.81\">estercobilina<\/tspan><\/text><\/svg><figcaption><strong>ALT<\/strong> es citosólica y específica; <strong>AST<\/strong> es sobre todo mitocondrial y está en músculo y corazón. Solo <strong>albúmina, TP y bilirrubina<\/strong> miden función. Sin estercobilina, las heces se aclaran (acolia).<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><span class=\"callout-t\">Lo que más se pregunta<\/span><\/div><p><strong>ALT = citosol y específica; AST = mitocondria y en músculo y corazón.<\/strong> El TP (factores I, II, V, VII, X) cambia en horas a días; la albúmina (vida media 18 días) tarda semanas.<\/p><\/aside>"},{"t":"Fisiopatología: los tres patrones de daño","h":"<div data-fp=\"pruebas\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Cada patrón tiene su mecanismo<\/span><\/div><p>Las PFH no miden \"función hepática\" en general: miden <strong>tres cosas distintas<\/strong> que se rompen por mecanismos diferentes: el hepatocito que se <strong>muere<\/strong> (fuga de enzimas), la bilis que <strong>no sale<\/strong> (colestasis) y el hígado que <strong>deja de fabricar<\/strong> (falla de síntesis).<\/p><\/aside><figure class=\"fig\" data-fig=\"pruebas-fp\"><svg viewBox=\"0 0 400 306.16\" role=\"img\" aria-label=\"Tres patrones de daño hepático\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-pruebas\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Agresión al hígado: virus, fármacos, alcohol,<\/tspan><tspan x=\"200\" dy=\"14.03\">isquemia, autoinmunidad, obstrucción<\/tspan><\/text><path d=\"M200 52.06 V63.06 H68 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><path d=\"M200 52.06 V63.06 H200 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><path d=\"M200 52.06 V63.06 H332 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><rect x=\"6\" y=\"74.06\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"68\" y=\"90.41\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Necrosis o<\/tspan><tspan x=\"68\" dy=\"12.81\">apoptosis del<\/tspan><tspan x=\"68\" dy=\"12.81\">hepatocito<\/tspan><\/text><rect x=\"138\" y=\"74.06\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"96.815\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">La bilis no fluye<\/tspan><tspan x=\"200\" dy=\"12.81\">(colestasis)<\/tspan><\/text><rect x=\"270\" y=\"74.06\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#8E5BC2;fill-opacity:0.13;stroke:#8E5BC2;stroke-width:1.5\"/><text x=\"332\" y=\"90.41\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Se pierde masa de<\/tspan><tspan x=\"332\" dy=\"12.81\">hepatocitos<\/tspan><tspan x=\"332\" dy=\"12.81\">funcionales<\/tspan><\/text><path d=\"M68 130.49 L68 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><path d=\"M200 130.49 L200 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><path d=\"M332 130.49 L332 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><rect x=\"6\" y=\"152.49\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"68\" y=\"175.245\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Se rompe la<\/tspan><tspan x=\"68\" dy=\"12.81\">membrana: ALT y AST<\/tspan><tspan x=\"68\" dy=\"12.81\">salen a la sangre<\/tspan><\/text><rect x=\"138\" y=\"152.49\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"168.84\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Ácidos biliares<\/tspan><tspan x=\"200\" dy=\"12.81\">retenidos inducen<\/tspan><tspan x=\"200\" dy=\"12.81\">más FA y GGT; la BD<\/tspan><tspan x=\"200\" dy=\"12.81\">regresa a la sangre<\/tspan><\/text><rect x=\"270\" y=\"152.49\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#8E5BC2;fill-opacity:0.13;stroke:#8E5BC2;stroke-width:1.5\"/><text x=\"332\" y=\"168.84\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Baja la síntesis: ↓<\/tspan><tspan x=\"332\" dy=\"12.81\">albúmina, ↑ INR; no<\/tspan><tspan x=\"332\" dy=\"12.81\">se conjuga ni<\/tspan><tspan x=\"332\" dy=\"12.81\">excreta bilirrubina<\/tspan><\/text><path d=\"M68 221.73 L68 243.73\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><path d=\"M200 221.73 L200 243.73\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><path d=\"M332 221.73 L332 243.73\" class=\"fx-arr\" marker-end=\"url(#ahfp-pruebas)\"/><rect x=\"6\" y=\"243.73\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"68\" y=\"260.08\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Patrón<\/tspan><tspan x=\"68\" dy=\"12.81\">hepatocelular<\/tspan><tspan x=\"68\" dy=\"12.81\">(R ≥5)<\/tspan><\/text><rect x=\"138\" y=\"243.73\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"266.485\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Patrón colestásico<\/tspan><tspan x=\"200\" dy=\"12.81\">(R ≤2)<\/tspan><\/text><rect x=\"270\" y=\"243.73\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#8E5BC2;fill-opacity:0.13;stroke:#8E5BC2;stroke-width:1.5\"/><text x=\"332\" y=\"272.89\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Falla de síntesis<\/tspan><\/text><\/svg><figcaption>Las transaminasas suben por <strong>fuga<\/strong>; la FA sube porque se <strong>fabrica más<\/strong> (tarda 1–2 días). Por eso en una obstrucción aguda por lito las transaminasas pueden subir primero.<\/figcaption><\/figure><h5>Por qué sube cada prueba<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Necrosis del hepatocito (virus, paracetamol, isquemia)<\/th><td>ALT y AST altas; &gt;1,000 UI/L en hepatitis viral aguda, tóxica o isquémica<\/td><\/tr><tr><th scope=\"row\">El alcohol daña la mitocondria y baja el piridoxal-5-fosfato que necesita la ALT<\/th><td>AST/ALT &gt;2 en hepatopatía por alcohol, con AST casi siempre &lt;300–400<\/td><\/tr><tr><th scope=\"row\">Colestasis: los ácidos biliares estimulan la síntesis de FA en la membrana canalicular<\/th><td>FA alta con GGT alta (si la GGT es normal, piensa en hueso)<\/td><\/tr><tr><th scope=\"row\">La bilirrubina conjugada no puede salir al intestino y regresa a la sangre<\/th><td>Ictericia, coluria, acolia y prurito<\/td><\/tr><tr><th scope=\"row\">Exceso de bilirrubina no conjugada (hemólisis) o poca conjugación (Gilbert: ↓ UGT1A1)<\/th><td>Hiperbilirrubinemia indirecta con transaminasas normales y sin coluria<\/td><\/tr><tr><th scope=\"row\">Pérdida de masa funcional: el factor VII dura ~6 h, la albúmina ~3 semanas<\/th><td>El INR se alarga en horas (marcador de falla aguda); la albúmina baja en semanas (crónica)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>\"¿Por qué la bilirrubina indirecta no da coluria?\" Porque viaja <strong>unida a albúmina<\/strong> y no es hidrosoluble: no se filtra en el riñón. La <strong>directa<\/strong> sí es hidrosoluble y pasa a la orina.<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Aminotransferasas: cuánto es normal y qué tanto subieron","h":"<figure class=\"fig\" data-fig=\"pruebas-grados\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Grados de elevación de aminotransferasas\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"75\" y=\"14\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"75\" dy=\"0\">Grado<\/tspan><\/text><text x=\"270\" y=\"14\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"270\" dy=\"0\">Qué pensar<\/tspan><\/text><rect x=\"8\" y=\"28\" width=\"134\" height=\"46\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"75\" y=\"43.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"75\" dy=\"0\">Limítrofe<\/tspan><tspan x=\"75\" dy=\"14.03\">&lt;2× LSN<\/tspan><\/text><rect x=\"150\" y=\"28\" width=\"242\" height=\"46\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"271\" y=\"44.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"271\" dy=\"0\">ANA, ASMA, ceruloplasmina y<\/tspan><tspan x=\"271\" dy=\"12.81\">α1-antitripsina pueden diferirse<\/tspan><\/text><rect x=\"8\" y=\"82\" width=\"134\" height=\"46\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"75\" y=\"97.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"75\" dy=\"0\">Leve<\/tspan><tspan x=\"75\" dy=\"14.03\">2–5× LSN<\/tspan><\/text><rect x=\"150\" y=\"82\" width=\"242\" height=\"46\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"271\" y=\"98.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"271\" dy=\"0\">Lo típico de EHA, MASLD y hepatitis<\/tspan><tspan x=\"271\" dy=\"12.81\">viral crónica (hasta 5×)<\/tspan><\/text><rect x=\"8\" y=\"136\" width=\"134\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"75\" y=\"151.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"75\" dy=\"0\">Moderada<\/tspan><tspan x=\"75\" dy=\"14.03\">5–15× LSN<\/tspan><\/text><rect x=\"150\" y=\"136\" width=\"242\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"271\" y=\"152.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"271\" dy=\"0\">Hepatitis aguda, p. ej. hepatitis A<\/tspan><tspan x=\"271\" dy=\"12.81\">sintomática (≥5–15×)<\/tspan><\/text><rect x=\"8\" y=\"190\" width=\"134\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"75\" y=\"205.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"75\" dy=\"0\">Grave<\/tspan><tspan x=\"75\" dy=\"14.03\">&gt;15× LSN<\/tspan><\/text><rect x=\"150\" y=\"190\" width=\"242\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"271\" y=\"206.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"271\" dy=\"0\">&gt;1000 U/L en hospital: isquemia 42.7 %,<\/tspan><tspan x=\"271\" dy=\"12.81\">pancreatobiliar 12.3 %, DILI 11.3 %<\/tspan><\/text><rect x=\"8\" y=\"244\" width=\"134\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"75\" y=\"259.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"75\" dy=\"0\">Masiva<\/tspan><tspan x=\"75\" dy=\"14.03\">&gt;10,000 U/L<\/tspan><\/text><rect x=\"150\" y=\"244\" width=\"242\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"271\" y=\"260.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"271\" dy=\"0\">Evaluación urgente: INR, bilirrubina,<\/tspan><tspan x=\"271\" dy=\"12.81\">estado mental (falla hepática aguda)<\/tspan><\/text><\/svg><figcaption>La urgencia depende del grado <strong>y del contexto<\/strong>: INR prolongado o bilirrubina alta obligan a evaluar de inmediato. LSN de ALT de la Figura 1: <strong>33 U/L hombres, 25 U/L mujeres<\/strong>.<\/figcaption><\/figure><h5>¿Cuál es la ALT normal?<\/h5><div class=\"tbl\"><table><thead><tr><th>Fuente<\/th><th>Hombres<\/th><th>Mujeres<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Guía (sin factores de riesgo)<\/th><td><strong>29–33 U/L<\/strong><\/td><td><strong>19–25 U/L<\/strong><\/td><\/tr><tr><th scope=\"row\">Análisis de &gt;400,000 personas sin enfermedad metabólica (percentil 95)<\/th><td><strong>36 U/L<\/strong><\/td><td><strong>28 U/L<\/strong> (32 en conjunto)<\/td><\/tr><tr><th scope=\"row\">Guía de hepatitis B<\/th><td><strong>35 U/L<\/strong><\/td><td><strong>25 U/L<\/strong><\/td><\/tr><tr><th scope=\"row\">Algoritmo de la Figura 1<\/th><td><strong>33 U/L<\/strong><\/td><td><strong>25 U/L<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Grados de elevación<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Veces el LSN<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Limítrofe<\/th><td><strong>&lt;2×<\/strong><\/td><\/tr><tr><th scope=\"row\">Leve<\/th><td><strong>2–5×<\/strong><\/td><\/tr><tr><th scope=\"row\">Moderada<\/th><td><strong>5–15×<\/strong><\/td><\/tr><tr><th scope=\"row\">Grave<\/th><td><strong>&gt;15×<\/strong><\/td><\/tr><tr><th scope=\"row\">Masiva<\/th><td><strong>&gt;10,000 U/L<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Un <strong>cociente AST/ALT &gt; 2 con AST &lt; 400<\/strong> en un bebedor = EHA. Un <strong>AST/ALT alto con FA baja<\/strong> en un joven con hemólisis o falla hepática = Wilson.<\/p><\/aside>"},{"t":"Fosfatasa alcalina, colestasis y factor R","h":"<figure class=\"fig\" data-fig=\"pruebas-patron\"><svg viewBox=\"0 0 400 286\" role=\"img\" aria-label=\"Factor R y patrones de lesión\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"30\" y=\"8\" width=\"340\" height=\"50\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"200\" y=\"33\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">R = (ALT / LSN de ALT) ÷ (FA / LSN de FA)<\/tspan><\/text><path d=\"M80 58 L70 80\" class=\"fx-arr\" marker-end=\"url(#ah3)\"/><path d=\"M200 58 L200 80\" class=\"fx-arr\" marker-end=\"url(#ah3)\"/><path d=\"M320 58 L330 80\" class=\"fx-arr\" marker-end=\"url(#ah3)\"/><rect x=\"8\" y=\"82\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"70\" y=\"97.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">R &lt; 2<\/tspan><tspan x=\"70\" dy=\"14.64\">Colestásico<\/tspan><\/text><rect x=\"8\" y=\"138\" width=\"124\" height=\"112\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"70\" y=\"167.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">Obstrucción<\/tspan><tspan x=\"70\" dy=\"13.42\">biliar, CBP, CEP,<\/tspan><tspan x=\"70\" dy=\"13.42\">amoxicilina-<\/tspan><tspan x=\"70\" dy=\"13.42\">clavulanato,<\/tspan><tspan x=\"70\" dy=\"13.42\">estrógenos, sepsis<\/tspan><\/text><rect x=\"138\" y=\"82\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"97.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">R 2–5<\/tspan><tspan x=\"200\" dy=\"14.64\">Mixto<\/tspan><\/text><rect x=\"138\" y=\"138\" width=\"124\" height=\"112\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"167.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">DILI, hepatitis<\/tspan><tspan x=\"200\" dy=\"13.42\">alcohólica,<\/tspan><tspan x=\"200\" dy=\"13.42\">obstrucción<\/tspan><tspan x=\"200\" dy=\"13.42\">extrahepática, CMV<\/tspan><tspan x=\"200\" dy=\"13.42\">o VEB<\/tspan><\/text><rect x=\"268\" y=\"82\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"97.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">R &gt; 5<\/tspan><tspan x=\"330\" dy=\"14.64\">Hepatocelular<\/tspan><\/text><rect x=\"268\" y=\"138\" width=\"124\" height=\"112\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"173.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">Virus, HAI,<\/tspan><tspan x=\"330\" dy=\"13.42\">isquemia,<\/tspan><tspan x=\"330\" dy=\"13.42\">paracetamol,<\/tspan><tspan x=\"330\" dy=\"13.42\">Wilson, MASLD, EHA<\/tspan><\/text><text x=\"200\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Usa múltiplos del LSN, no valores absolutos<\/tspan><\/text><\/svg><figcaption>El <strong>factor R<\/strong> nació para clasificar la <strong>DILI<\/strong>: &gt;5 hepatocelular, 2–5 mixto, &lt;2 colestásico. Ante colestasis, el primer estudio es el <strong>US<\/strong> para buscar dilatación biliar.<\/figcaption><\/figure><h5>Factor R<\/h5><div class=\"tbl\"><table><thead><tr><th>R<\/th><th>Patrón<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>&gt; 5<\/strong><\/th><td>Hepatocelular<\/td><\/tr><tr><th scope=\"row\"><strong>2–5<\/strong><\/th><td>Mixto<\/td><\/tr><tr><th scope=\"row\"><strong>&lt; 2<\/strong><\/th><td>Colestásico<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Calcula siempre con <strong>múltiplos del LSN<\/strong>, no con valores absolutos. ALT 300 (LSN 33) y FA 130 (LSN 120): R = 9.1 ÷ 1.1 ≈ 8.4 → <strong>hepatocelular<\/strong>.<\/p><\/aside>"},{"t":"Pruebas de función: albúmina, TP e INR, bilirrubina","h":"<aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">El INR en la cirrosis no protege ni predice sangrado<\/span><\/div><p>Un <strong>INR prolongado en la cirrosis no reduce el riesgo de trombosis<\/strong> y <strong>no predice complicaciones hemorrágicas<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Bilirrubina indirecta 2.5 mg/dL, resto de PFH y BH normales, se eleva con ayuno o estrés†&quot; = <strong>Gilbert<\/strong>. No necesita más estudios invasivos.<\/p><\/aside>"},{"t":"Abordaje del paciente con PFH alteradas","h":"<figure class=\"fig\" data-fig=\"pruebas-abordaje\"><svg viewBox=\"0 0 400 360\" role=\"img\" aria-label=\"Abordaje de las PFH alteradas\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"60\" y=\"6\" width=\"280\" height=\"40\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"200\" y=\"18.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">PFH alteradas: repetir, suspender alcohol y<\/tspan><tspan x=\"200\" dy=\"14.03\">hepatotóxicos<\/tspan><\/text><path d=\"M200 46 L200 62\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><rect x=\"60\" y=\"62\" width=\"280\" height=\"40\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"74.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">¿INR prolongado, bilirrubina alta o<\/tspan><tspan x=\"200\" dy=\"14.03\">encefalopatía?<\/tspan><\/text><path d=\"M290 102 V122 H204 V146\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><path d=\"M110 102 V122 H70 V146\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><g><rect x=\"77.6\" y=\"113\" width=\"24.8\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"90\" y=\"122.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"90\" dy=\"0\">Sí<\/tspan><\/text><\/g><path d=\"M290 102 V122 H330 V146\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><g><rect x=\"262.4\" y=\"113\" width=\"95.2\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"310\" y=\"122.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"310\" dy=\"0\">No: calcula R<\/tspan><\/text><\/g><rect x=\"8\" y=\"146\" width=\"124\" height=\"70\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"70\" y=\"167.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">Evaluar falla<\/tspan><tspan x=\"70\" dy=\"13.42\">hepática aguda de<\/tspan><tspan x=\"70\" dy=\"13.42\">inmediato<\/tspan><\/text><rect x=\"144\" y=\"146\" width=\"120\" height=\"70\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"204\" y=\"161.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"204\" dy=\"0\">R &gt; 5: VHB, VHC,<\/tspan><tspan x=\"204\" dy=\"12.81\">hierro, US; diferir<\/tspan><tspan x=\"204\" dy=\"12.81\">ANA, ASMA, α1AT si<\/tspan><tspan x=\"204\" dy=\"12.81\">&lt;2×<\/tspan><\/text><rect x=\"272\" y=\"146\" width=\"120\" height=\"70\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"332\" y=\"167.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">R &lt; 2: GGT; US:<\/tspan><tspan x=\"332\" dy=\"13.42\">¿vía biliar<\/tspan><tspan x=\"332\" dy=\"13.42\">dilatada?<\/tspan><\/text><path d=\"M204 216 L204 236\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><path d=\"M332 216 L332 236\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><rect x=\"144\" y=\"236\" width=\"120\" height=\"76\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"204\" y=\"248.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"204\" dy=\"0\">Sin causa: observar<\/tspan><tspan x=\"204\" dy=\"12.81\">hasta 3 meses o<\/tspan><tspan x=\"204\" dy=\"12.81\">ampliar (HAI,<\/tspan><tspan x=\"204\" dy=\"12.81\">Wilson, celíaca,<\/tspan><tspan x=\"204\" dy=\"12.81\">tiroides)<\/tspan><\/text><rect x=\"272\" y=\"236\" width=\"120\" height=\"76\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"332\" y=\"261.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Dilatada: CPRM o<\/tspan><tspan x=\"332\" dy=\"12.81\">CPRE. No: AMA, CPRM<\/tspan><tspan x=\"332\" dy=\"12.81\">(CEP), fármacos<\/tspan><\/text><rect x=\"144\" y=\"320\" width=\"248\" height=\"34\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"268\" y=\"337\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"268\" dy=\"0\">Persistente e inexplicada: biopsia<\/tspan><\/text><path d=\"M204 312 L204 320\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><path d=\"M332 312 L332 320\" class=\"fx-arr\" marker-end=\"url(#ah4)\"/><\/svg><figcaption>Síntesis de las Figuras 1 y 2 y del texto. Antes de una observación, <strong>asegura que no haya fibrosis avanzada<\/strong> (FIB-4, elastografía).<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El <strong>primer paso<\/strong> ante PFH alteradas en un asintomático no es la biopsia: <strong>repetir<\/strong>, suspender alcohol y fármacos, y pedir <strong>VHB, VHC, perfil de hierro y US<\/strong>.<\/p><\/aside>"},{"t":"Causas extrahepáticas","h":"<div class=\"tbl\"><table><thead><tr><th>Causa<\/th><th>Qué esperar<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Enfermedad celíaca<\/strong><\/th><td>En <strong>6–9 %<\/strong> de las elevaciones de aminotransferasas sin otra causa; <strong>15–55 %<\/strong> de los celíacos tienen PFH alteradas. Elevación leve, <strong>ALT &gt; AST<\/strong>; puede haber FA alta e, si es grave, INR alto y albúmina baja por malabsorción. Escrutinio: <strong>tTG-IgA + IgA total<\/strong> con gluten en la dieta; se normaliza en meses con dieta sin gluten<\/td><\/tr><tr><th scope=\"row\"><strong>Lesión muscular<\/strong> (rabdomiólisis)<\/th><td><strong>AST &gt; ALT al menos 2:1<\/strong> al inicio, <strong>CK muy elevada<\/strong>, dolor muscular<\/td><\/tr><tr><th scope=\"row\"><strong>Enfermedad ósea<\/strong><\/th><td>FA alta con <strong>GGT o 5′-nucleotidasa normales<\/strong> o isoenzima ósea alta: osteomalacia por déficit de vitamina D, osteoporosis, fractura u ortopedia reciente, <strong>Paget<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Embarazo<\/strong><\/th><td>FA alta <strong>placentaria<\/strong>, fisiológica<\/td><\/tr><tr><th scope=\"row\"><strong>Hipertiroidismo<\/strong><\/th><td>PFH alteradas en <strong>55–60 %<\/strong> (estrés oxidativo, colestasis, actividad osteoblástica)<\/td><\/tr><tr><th scope=\"row\"><strong>Hipotiroidismo<\/strong><\/th><td>Más elevación de aminotransferasas, en parte por más <strong>MASLD<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Hepatopatía congestiva<\/strong><\/th><td>Insuficiencia cardiaca derecha, insuficiencia tricuspídea, pericarditis constrictiva: aminotransferasas <strong>2–3× LSN<\/strong>, bilirrubina alta pero <strong>rara vez &gt;3 mg/dL<\/strong>, FA levemente alta e <strong>INR alto<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Isquemia hepática<\/strong><\/th><td>Choque cardiogénico o séptico, insuficiencia respiratoria: <strong>AST &gt;10× LSN<\/strong> en la UCI<\/td><\/tr><tr><th scope=\"row\"><strong>Sepsis<\/strong><\/th><td>Patrón <strong>colestásico<\/strong> (&quot;colestasis de la sepsis&quot;)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Transaminasas elevadas sin causa hepática: <strong>pide tTG-IgA con IgA total<\/strong>. AST &gt; ALT 2:1 en un corredor o tras convulsiones: <strong>CK<\/strong>.<\/p><\/aside>"},{"t":"Pruebas no invasivas de fibrosis","h":"<figure class=\"fig\" data-fig=\"pruebas-fib4\"><svg viewBox=\"0 0 400 330\" role=\"img\" aria-label=\"FIB-4 en MASLD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"60\" y=\"8\" width=\"280\" height=\"48\" rx=\"9\" style=\"fill:#2F6FD6;fill-opacity:0.13;stroke:#2F6FD6;stroke-width:1.5\"/><text x=\"200\" y=\"32\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">FIB-4 = edad, AST, ALT y plaquetas<\/tspan><\/text><path d=\"M110 56 V72 H69 V90\" class=\"fx-arr\" marker-end=\"url(#ah5)\"/><path d=\"M200 56 L200 90\" class=\"fx-arr\" marker-end=\"url(#ah5)\"/><path d=\"M290 56 V72 H331 V90\" class=\"fx-arr\" marker-end=\"url(#ah5)\"/><rect x=\"8\" y=\"92\" width=\"124\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"70\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">&lt; 1.3<\/tspan><\/text><rect x=\"8\" y=\"144\" width=\"124\" height=\"96\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"70\" y=\"171.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">Excluye fibrosis<\/tspan><tspan x=\"70\" dy=\"13.42\">avanzada (VPN<\/tspan><tspan x=\"70\" dy=\"13.42\">alto). &gt;65 años:<\/tspan><tspan x=\"70\" dy=\"13.42\">corte 2.0<\/tspan><\/text><rect x=\"138\" y=\"92\" width=\"124\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">1.3–2.67<\/tspan><\/text><rect x=\"138\" y=\"144\" width=\"124\" height=\"96\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"171.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Indeterminado:<\/tspan><tspan x=\"200\" dy=\"13.42\">ELF, elastografía<\/tspan><tspan x=\"200\" dy=\"13.42\">transitoria o por<\/tspan><tspan x=\"200\" dy=\"13.42\">RM<\/tspan><\/text><rect x=\"268\" y=\"92\" width=\"124\" height=\"44\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"99.36\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">&gt; 2.67<\/tspan><tspan x=\"330\" dy=\"14.64\">(&gt;3.25<\/tspan><tspan x=\"330\" dy=\"14.64\">validación)<\/tspan><\/text><rect x=\"268\" y=\"144\" width=\"124\" height=\"96\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"171.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">Fibrosis avanzada<\/tspan><tspan x=\"330\" dy=\"13.42\">probable<\/tspan><tspan x=\"330\" dy=\"13.42\">(especificidad 97<\/tspan><tspan x=\"330\" dy=\"13.42\">% con &gt;3.25)<\/tspan><\/text><rect x=\"8\" y=\"252\" width=\"384\" height=\"70\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"273.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Cautela: &lt;35 o &gt;65 años, delgados y obesidad clase III. FIB-4<\/tspan><tspan x=\"200\" dy=\"13.42\">descarta mejor de lo que confirma (VPN ~90 %, VPP ~65 %). F4 si<\/tspan><tspan x=\"200\" dy=\"13.42\">≥3.48.<\/tspan><\/text><\/svg><figcaption>Cortes de la Tabla 1 y del texto. Los indeterminados van a <strong>elastografía<\/strong> o biopsia, salvo cirrosis evidente en imagen. Fórmula†: (edad × AST) ÷ (plaquetas × √ALT).<\/figcaption><\/figure><h5>Tabla 1: cortes por estadio<\/h5><div class=\"tbl\"><table><thead><tr><th>Prueba<\/th><th>F0–F1<\/th><th>F2–F4<\/th><th>F3–F4<\/th><th>F4<\/th><th>S / E / VPP / VPN (%)<\/th><th>AUROC<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>APRI<\/strong><\/th><td>≤0.3<\/td><td>&gt;0.7<\/td><td>&gt;1.19<\/td><td>&gt;2<\/td><td>84 / 88 / 66 / 95<\/td><td>0.568–0.803<\/td><\/tr><tr><th scope=\"row\"><strong>FIB-4<\/strong><\/th><td>&lt;1.30<\/td><td>≥1.45<\/td><td>&gt;2.67 (prueba) o &gt;3.25 (validación)<\/td><td>≥3.48<\/td><td>71 / 85 / 50 / 93<\/td><td>0.802–0.896<\/td><\/tr><tr><th scope=\"row\"><strong>FibroTest<\/strong><\/th><td>&lt;0.48<\/td><td>≥0.48<\/td><td>≥0.58<\/td><td>&gt;0.74<\/td><td>92 / 97 / 60 / 89<\/td><td>0.75–0.86<\/td><\/tr><tr><th scope=\"row\"><strong>ELF<\/strong><\/th><td>&lt;7.7<\/td><td>≥7.7<\/td><td>≥9.8<\/td><td>&gt;11.3<\/td><td>65 / 86 / 75 / 79<\/td><td>0.75–0.85<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>FIB-4 <strong>descarta<\/strong> mejor de lo que confirma: VPN ~90 % contra VPP ~65 %. En MASLD el corte para descartar es <strong>1.3<\/strong>; en &gt;65 años, <strong>2.0<\/strong>.<\/p><\/aside>"},{"t":"Las PFH en el pronóstico","h":"<h5>Child-Turcotte-Pugh (CTP)<\/h5><div class=\"tbl\"><table><thead><tr><th>Clase<\/th><th>Puntos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>A<\/strong><\/th><td>5–6<\/td><\/tr><tr><th scope=\"row\"><strong>B<\/strong><\/th><td>7–9<\/td><\/tr><tr><th scope=\"row\"><strong>C<\/strong><\/th><td>10–15<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p><strong>MELD = bilirrubina + creatinina + INR<\/strong> (más sodio, sexo y albúmina en versiones nuevas). <strong>CTP = bilirrubina + albúmina + TP + ascitis + encefalopatía.<\/strong> Maddrey &gt; 32 y Lille &gt; 0.45 son los cortes clave.<\/p><\/aside>"},{"t":"Inmunoglobulinas en la hepatopatía","h":"<div class=\"tbl\"><table><thead><tr><th>Inmunoglobulina<\/th><th>Asociación clásica<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>IgA<\/strong><\/th><td>Enfermedad hepática asociada al <strong>alcohol<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>IgM<\/strong><\/th><td><strong>Colangitis biliar primaria<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>IgG<\/strong><\/th><td><strong>Hepatitis autoinmune<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p><strong>A-alcohol, M-CBP (&quot;M&quot; de mitocondria, AMA†), G-HAI.<\/strong><\/p><\/aside>"},{"t":"Lesión hepática inducida por fármacos (DILI)","h":"<h5>Tabla 2: patrones<\/h5><div class=\"tbl\"><table><thead><tr><th>Patrón<\/th><th>Tiempo<\/th><th>Rasgos<\/th><th>Fármacos típicos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Hepatocelular agudo grave<\/strong> (AST o ALT &gt;10× LSN)<\/th><td>Días<\/td><td>Elevación brusca; coagulopatía, falla hepática<\/td><td><strong>Paracetamol<\/strong> (directo); diclofenaco, isoniazida, pirazinamida<\/td><\/tr><tr><th scope=\"row\"><strong>Hepatocelular<\/strong><\/th><td>Días a semanas; meses a años<\/td><td>Puede simular <strong>HAI<\/strong> si es crónico<\/td><td>Paracetamol, amiodarona a dosis altas; carbamazepina, quimioterapia, diclofenaco, fluoroquinolonas, isoniazida, <strong>minociclina, nitrofurantoína<\/strong>, pirazinamida, estatinas, sulfonamidas<\/td><\/tr><tr><th scope=\"row\"><strong>Colestásico<\/strong><\/th><td>Semanas a meses<\/td><td>FA muy alta, ALT poco alta, <strong>prurito<\/strong><\/td><td><mark><strong>Amoxicilina-clavulanato<\/strong><\/mark>, esteroides anabólicos, cefazolina, <strong>estrógenos<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Mixto<\/strong><\/th><td>Días a meses<\/td><td>FA y ALT altas<\/td><td>Fluoroquinolonas, macrólidos, <strong>fenitoína<\/strong>, TMP-SMX<\/td><\/tr><tr><th scope=\"row\"><strong>Esteatosis<\/strong><\/th><td>Meses a años<\/td><td>Esteatosis en imagen ± aminotransferasas<\/td><td><strong>Amiodarona<\/strong>, didanosina, glucocorticoides, <strong>metotrexato<\/strong>, estavudina, tamoxifeno, <strong>ácido valproico<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Ictericia colestásica semanas después de <strong>amoxicilina-clavulanato<\/strong> = DILI colestásica idiosincrásica. Patrón tipo <strong>HAI<\/strong> con <strong>nitrofurantoína o minociclina<\/strong>.<\/p><\/aside>"},{"t":"Hospitalizados, UCI, oncología y embarazo","h":"<h5>Oncología<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado CTCAE v5.0<\/th><th>ALT o AST<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1<\/th><td>1–3× LSN<\/td><\/tr><tr><th scope=\"row\">2<\/th><td>3–5× LSN<\/td><\/tr><tr><th scope=\"row\">3<\/th><td>5–20× LSN<\/td><\/tr><tr><th scope=\"row\">4<\/th><td>&gt;20× LSN<\/td><\/tr><\/tbody><\/table><\/div><h5>Embarazo (Tabla 3)<\/h5><div class=\"tbl\"><table><thead><tr><th>Entidad<\/th><th>Cuándo<\/th><th>Rasgos<\/th><th>Manejo<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Hiperémesis gravídica<\/strong><\/th><td>Primer trimestre (sem 4–10)<\/td><td>1 % de embarazos; vómito persistente; &gt;50 % con elevación leve a moderada de ALT/AST<\/td><td>Soporte; piridoxina, doxilamina-piridoxina<\/td><\/tr><tr><th scope=\"row\"><strong>Colestasis intrahepática del embarazo<\/strong><\/th><td>Final del 2.º y 3.er trimestre<\/td><td>~1 %; <strong>prurito<\/strong>; ácidos biliares <strong>&gt;10 μmol/L<\/strong><\/td><td>Considerar <strong>parto temprano<\/strong> si ácidos biliares <strong>&gt;40 μmol/L<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>HELLP<\/strong><\/th><td>&gt;20 sem (más en 28–36)<\/td><td>ALT/AST <strong>&gt;70 U/L<\/strong>, DHL alta, plaquetas bajas; ± hipertensión y proteinuria<\/td><td>Corregir coagulopatía, <strong>parto pronto<\/strong>, <strong>magnesio<\/strong>; se normaliza en <strong>48–72 h<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Hígado graso agudo del embarazo<\/strong><\/th><td>Final del 3.er trimestre (~37 sem)<\/td><td><strong>1 en 10,000–20,000<\/strong>; de leve a falla hepática; <strong>criterios de Swansea<\/strong> (≥6 de 15)<\/td><td><strong>Parto pronto<\/strong>; vigilar hemorragia, CID e insuficiencia renal posparto; mejora lenta<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Después de las <strong>20 semanas<\/strong>, las causas más comunes son <strong>colestasis intrahepática del embarazo y HELLP<\/strong>. En HELLP las PFH se normalizan en 48–72 h tras el parto; en el hígado graso agudo la mejoría <strong>tarda días a semanas<\/strong>.<\/p><\/aside>"}],"pearls":["Solo bilirrubina, TP/INR y albúmina miden función; ALT y AST miden lesión.","ALT: citosol, casi solo hígado, vida media ~47 h. AST: 80 % mitocondrial, también en músculo y corazón, vida media ~17 h.","Factor R = (ALT/LSN) ÷ (FA/LSN): &gt;5 hepatocelular, 2–5 mixto, &lt;2 colestásico.","AST/ALT &gt;2 con AST &lt;400 U/L sugiere enfermedad hepática asociada al alcohol (déficit de piridoxina).","AST &gt; ALT con FA baja en un cuadro agudo: enfermedad de Wilson.","FA alta con GGT o 5′-nucleotidasa normales: hueso o placenta, no hígado.","Bilirrubina indirecta aislada ≤7 mg/dL con PFH normales: Gilbert (descarta hemólisis).","El INR prolongado en la cirrosis no protege de trombosis ni predice sangrado.","Antes de estudiar: repetir PFH, suspender alcohol y hepatotóxicos; PEth si se sospecha alcohol oculto (30 días).","Ferritina alta: piensa primero en MASLD o alcohol; &gt;10,000 μg/L, linfohistiocitosis hemofagocítica.","FIB-4 &lt;1.3 descarta fibrosis avanzada en MASLD; en &gt;65 años usa 2.0.","Maddrey &gt;32 = hepatitis alcohólica grave (mortalidad a 30 días &gt;50 %); Lille &gt;0.45 = no respuesta a esteroides.","Antimicrobianos: causa número uno de DILI idiosincrásica; amoxicilina-clavulanato da patrón colestásico.","AST &gt;10× LSN en la UCI = hepatitis isquémica (mortalidad ~50 %).","Celíaca: 6–9 % de las transaminasemias sin causa; pide tTG-IgA con IgA total."],"comps":[{"title":"ALT contra AST","cols":["ALT","AST"],"rows":[["Reacción","Alanina → <strong>piruvato<\/strong>","Aspartato → <strong>oxaloacetato<\/strong>"],["Ubicación celular","<strong>Citosol<\/strong>","<strong>80 % mitocondrial<\/strong>, 20 % citosol"],["Tejidos","Casi solo <strong>hígado<\/strong>","Hígado, <strong>corazón, músculo, riñón, cerebro<\/strong>"],["Vida media sérica","<strong>~47 h<\/strong>","<strong>~17 h<\/strong>"],["Especificidad hepática","<strong>Mayor<\/strong>","Menor"],["Alcohol","Deprimida por <strong>déficit de piridoxina<\/strong>","AST/ALT <strong>&gt;2<\/strong>; rara vez &gt;400 U/L"],["Celíaca","Suele ser <strong>mayor<\/strong> que la AST","Menor que la ALT"],["Lesión muscular","Sube menos","AST/ALT <strong>≥2:1<\/strong> con CK alta"],["Hepatitis isquémica","Cae más lento","Sube y <strong>cae más rápido<\/strong>"],["Artefacto","—","<strong>Macro-AST<\/strong> (complejo con inmunoglobulinas)"],["Wilson y cirrosis","Menor síntesis en cirrosis","AST &gt; ALT; en Wilson con <strong>FA baja<\/strong>"]],"key":"La ALT es el marcador <strong>específico<\/strong> de hígado; la AST, más <strong>mitocondrial<\/strong> y repartida en otros tejidos, domina en <strong>alcohol, músculo, isquemia, Wilson y cirrosis<\/strong>."},{"title":"Hepatopatías del embarazo","cols":["Hiperémesis gravídica","Colestasis intrahepática","HELLP","Hígado graso agudo"],"rows":[["Cuándo","1.er trimestre (sem 4–10)","Final del 2.º y 3.er trimestre","&gt;20 sem (más 28–36)","Final del 3.er trimestre (~37 sem)"],["Frecuencia","1 % de embarazos","~1 %","—","1 en 10,000–20,000"],["Síntoma eje","Náusea y vómito persistentes","<strong>Prurito<\/strong>","± hipertensión y proteinuria","De inespecífico a <strong>falla hepática<\/strong>"],["Laboratorio clave","ALT/AST leve a moderada (&gt;50 % de los casos)","<strong>Ácidos biliares &gt;10<\/strong>","ALT/AST <strong>&gt;70 U/L<\/strong>, DHL alta, <strong>plaquetas bajas<\/strong>","Criterios de <strong>Swansea<\/strong> (≥6 de 15)"],["Manejo","Soporte; piridoxina, doxilamina-piridoxina","Parto temprano si ácidos biliares <strong>&gt;40<\/strong>","Coagulopatía, <strong>magnesio<\/strong>, parto pronto","<strong>Parto pronto<\/strong>"],["Tras el parto","Mejora al ceder la hiperémesis","—","PFH y plaquetas normales en <strong>48–72 h<\/strong>","Mejoría lenta (días a semanas); riesgo de hemorragia, CID e insuficiencia renal"],["Riesgo destacado","Bajo","Mortalidad perinatal según ácidos biliares","Hemorragia por coagulopatía","Potencialmente <strong>fatal<\/strong>"],["Diferencial difícil","—","—","Con hígado graso agudo","Con <strong>HELLP<\/strong> en casos leves"]],"key":"Antes de las 20 semanas piensa en <strong>hiperémesis<\/strong>; después, en <strong>colestasis intrahepática<\/strong> (prurito, ácidos biliares) y <strong>HELLP<\/strong> (plaquetas bajas). El hígado graso agudo es raro, del final del embarazo y potencialmente fatal."}],"algos":[{"title":"PFH alteradas: del resultado al patrón","src":"Figuras 1 y 2 del artículo y texto","start":"a","nodes":{"a":{"q":"¿Ya <strong>repetiste<\/strong> el panel, suspendiste <strong>alcohol y hepatotóxicos<\/strong> y confirmaste la alteración?","i":"","o":[["Sí, persiste","b"],["No","a0"]]},"a0":{"end":1,"tone":"warn","text":"<strong>Primero repite<\/strong> el panel (o prueba confirmatoria, p. ej., GGT para FA aislada) y suspende alcohol y fármacos. PEth si sospechas alcohol oculto."},"b":{"q":"¿Hay <strong>INR prolongado, bilirrubina alta, asterixis o alteración mental<\/strong>?","i":"","o":[["Sí","fha"],["No","c"]]},"fha":{"end":1,"tone":"bad","text":"<strong>Evaluación urgente de falla hepática aguda<\/strong> y traslado a centro de trasplante si procede."},"c":{"q":"Calcula <strong>R = (ALT/LSN) ÷ (FA/LSN)<\/strong>. ¿Cuánto da?","i":"&gt;5 hepatocelular · 2–5 mixto · &lt;2 colestásico.","o":[["R &gt; 5","hep"],["R 2–5","mix"],["R &lt; 2","col"]]},"hep":{"q":"Patrón <strong>hepatocelular<\/strong>. ¿Qué tan alto?","i":"","o":[["Hasta 5× LSN","hep1"],["Más de 15× LSN o &gt;1000 U/L","hep2"]]},"hep1":{"end":1,"tone":"ok","text":"<strong>VHB, VHC (ARN si anti-VHC +), ferritina y saturación de transferrina, US ± elastografía.<\/strong> ANA, ASMA, ceruloplasmina y α1-antitripsina pueden diferirse si &lt;2× LSN. Piensa en EHA, MASLD, virus, celíaca, tiroides y músculo (CK). Sin causa: observar hasta 3 meses sin fibrosis avanzada."},"hep2":{"end":1,"tone":"bad","text":"<strong>Evaluación completa y búsqueda de falla hepática aguda.<\/strong> En hospitalizados: isquemia (42.7 %), pancreatobiliar (12.3 %) y DILI (11.3 %); virus agudos, paracetamol, Wilson, HAI."},"mix":{"end":1,"tone":"warn","text":"<strong>Patrón mixto:<\/strong> DILI, hepatitis alcohólica, obstrucción biliar extrahepática, hepatitis viral aguda (CMV, VEB) o superposición autoinmune. Estudia ambos brazos."},"col":{"q":"Patrón <strong>colestásico<\/strong>. ¿La <strong>GGT o 5′-nucleotidasa<\/strong> están altas?","i":"","o":[["Sí","us"],["No","hueso"]]},"hueso":{"end":1,"tone":"ok","text":"<strong>FA no hepática:<\/strong> hueso (vitamina D, osteoporosis, fractura, Paget) o placenta (embarazo). Confirma con isoenzima ósea."},"us":{"q":"<strong>US:<\/strong> ¿hay dilatación de la vía biliar?","i":"","o":[["Sí","cpre"],["No","intra"]]},"cpre":{"end":1,"tone":"warn","text":"<strong>Obstrucción extrahepática:<\/strong> CPRM o CPRE. Con dolor biliar y FA alta, evalúa de inmediato."},"intra":{"end":1,"tone":"warn","text":"<strong>Colestasis intrahepática:<\/strong> AMA (CBP; anti-SP100 y anti-GP210 muy específicos), CPRM para CEP, revisa fármacos (amoxicilina-clavulanato, anabólicos, estrógenos); en la UCI, sepsis y nutrición parenteral."}}},{"title":"FIB-4 para descartar fibrosis avanzada","src":"Tabla 1 y texto del artículo","start":"a","nodes":{"a":{"q":"¿Qué enfermedad de fondo tiene el paciente?","i":"","o":[["MASLD","m"],["Hepatitis B o C crónica","v"]]},"m":{"q":"¿Qué edad tiene?","i":"","o":[["35–65 años","m1"],["Más de 65 años","m65"],["Menos de 35 años","mj"]]},"m1":{"q":"¿Cuál es el FIB-4?","i":"","o":[["&lt; 1.3","ok"],["1.3–2.67","ind"],["&gt; 2.67","alto"]]},"m65":{"q":"En &gt;65 años el corte revisado es <strong>2.0<\/strong>. ¿El FIB-4 es menor de 2.0?","i":"","o":[["Sí","ok"],["No","ind"]]},"mj":{"end":1,"tone":"warn","text":"<strong>FIB-4 poco confiable en &lt;35 años.<\/strong> Usa elastografía u otra prueba (ELF) si hay sospecha de fibrosis."},"v":{"q":"¿Cuál es el FIB-4?","i":"","o":[["&lt; 1.45","okv"],["1.45–3.25","ind"],["&gt; 3.25","alto"]]},"okv":{"end":1,"tone":"ok","text":"<strong>&lt;1.45: VPN 90 %<\/strong> (sensibilidad 70 %) para excluir fibrosis avanzada."},"ok":{"end":1,"tone":"ok","text":"<strong>Fibrosis avanzada improbable<\/strong> (VPN alto). Ojo: menos útil en pacientes delgados u obesidad clase III."},"ind":{"end":1,"tone":"warn","text":"<strong>Indeterminado:<\/strong> ELF, elastografía transitoria o por RM, o biopsia, salvo cirrosis clara en imagen."},"alto":{"end":1,"tone":"bad","text":"<strong>Fibrosis avanzada probable<\/strong> (&gt;3.25: VPP 65 %, especificidad 97 %); ≥3.48 sugiere F4. Confirma con elastografía."}}}],"cards":[["¿Por qué suben las transaminasas en la hepatitis?","Por fuga: la necrosis o apoptosis del hepatocito rompe la membrana y ALT (citosólica) y AST salen a la sangre."],["¿Por qué sube la FA en la colestasis?","Porque se fabrica más: los ácidos biliares retenidos inducen su síntesis en la membrana canalicular (tarda 1–2 días). La GGT confirma que es hepática."],["¿Qué PFH miden realmente función hepática?","Bilirrubina, TP/INR y albúmina. ALT, AST y FA reflejan lesión."],["Vida media sérica de ALT y AST","ALT ~47 h; AST ~17 h (se depura más rápido)."],["LSN de ALT (percentil 95) en &gt;400,000 personas sin enfermedad metabólica","36 U/L hombres, 28 U/L mujeres (32 en conjunto); 40 U/L con sobrepeso y 36 con DM2."],["Elevación típica en EHA, MASLD y hepatitis viral crónica","Hasta 5× LSN."],["Cociente AST/ALT &gt;2","Sugiere enfermedad hepática asociada al alcohol."],["AST &gt; ALT con FA baja","Muy sugestivo de enfermedad de Wilson (aguda o cirrosis)."],["Isoenzimas de FA","Familia de 4; hígado, hueso, placenta, intestino y riñón."],["Patrón bioquímico de un cálculo coledociano agudo","Pico brusco de aminotransferasas, luego elevación gradual de FA y bilirrubina."],["¿Para qué se creó el factor R?","Para clasificar la DILI; alta especificidad y VPN para excluir DILI grave."],["Síndrome de Alagille","Mutación de la vía Notch; FA alta y escasez de conductos biliares."],["Causas no hepáticas de TP prolongado","Déficit de vitamina K, anticoagulantes, coagulopatías."],["Bilirrubina indirecta aislada ≤7 mg/dL","Síndrome de Gilbert (o hemólisis)."],["Frecuencia de PFH alteradas en quienes se estudian","~7.9 % en EUA; 8 % en países de ingresos bajos y medios."],["Estudios que pueden diferirse si ALT &lt;2× LSN","ANA, anti-músculo liso, ceruloplasmina y α1-antitripsina."],["Observación sin causa evidente","Hasta 3 meses si la elevación es mínima, asegurando que no haya fibrosis avanzada."],["Asterixis o alteración mental con PFH alteradas sin hepatopatía previa","Evaluar falla hepática aguda de inmediato; traslado a centro de trasplante."],["Hepatopatía congestiva: patrón","Aminotransferasas 2–3× LSN, bilirrubina rara vez &gt;3 mg/dL, FA levemente alta, INR alto."],["Componentes del FIB-4","Edad, AST, ALT y plaquetas."],["Componentes del FibroTest","Bilirrubina total, GGT, α2-macroglobulina, haptoglobina, apolipoproteína A1, edad y sexo."],["Variables del MELD original y sus versiones","Bilirrubina, creatinina e INR; MELD-Na suma sodio; MELD 3.0 suma sexo y albúmina."],["Lille &gt;0.45","No respuesta a glucocorticoides en hepatitis alcohólica (bilirrubina día 7 o día 4)."],["Tipos de DILI","Intrínseca (paracetamol), idiosincrásica e indirecta (inhibidores de puntos de control)."],["Top 3 causas de ALT o AST &gt;1000 U/L en hospitalizados","Hepatitis isquémica 42.7 %, pancreatobiliar 12.3 %, DILI 11.3 %."],["Grados CTCAE de hepatitis por inmunoterapia","1: 1–3×; 2: 3–5×; 3: 5–20×; 4: &gt;20× LSN."]],"mcq":[{"q":"¿Cuál de las siguientes pruebas refleja <strong>función<\/strong> hepática y no solo lesión?","o":["ALT","AST","Tiempo de protrombina","Fosfatasa alcalina","GGT"],"a":2,"e":"Solo <strong>bilirrubina, TP y albúmina<\/strong> evalúan función; las demás reflejan lesión."},{"q":"¿Qué proporción de la actividad de AST es mitocondrial?","o":["20 %","50 %","100 %","80 %"],"a":3,"e":"<strong>80 %<\/strong> de la AST es la isoenzima <strong>mitocondrial<\/strong>; 20 % es citosólica."},{"q":"Joven de 19 años con hemólisis, ictericia y encefalopatía. AST 380, ALT 120 U/L, FA muy baja. ¿Diagnóstico más probable?","o":["Hepatitis A aguda","Enfermedad de Wilson","Hepatitis alcohólica","Colangitis biliar primaria","Síndrome de Gilbert"],"a":1,"e":"AST &gt; ALT con <strong>FA baja<\/strong> en una presentación aguda es <strong>muy sugestivo de Wilson<\/strong>."},{"q":"Según la clasificación citada, una ALT de 10 veces el LSN es una elevación:","o":["Moderada","Limítrofe","Leve","Grave","Masiva"],"a":0,"e":"Limítrofe &lt;2×, leve 2–5×, <stro
