><tspan x=\"10\" dy=\"0\">FA elevada<\/tspan><\/text><circle cx=\"215\" cy=\"40\" r=\"6\" style=\"fill:#1C97A6\"/><circle cx=\"290\" cy=\"40\" r=\"6\" style=\"fill:#16834A\"/><circle cx=\"360\" cy=\"40\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"10\" y=\"60.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">GGT elevada<\/tspan><\/text><circle cx=\"215\" cy=\"60.5\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"290\" y=\"60.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"60.5\" r=\"6\" style=\"fill:#1C97A6\"/><rect x=\"4\" y=\"71\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"81\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">AST o ALT elevadas<\/tspan><\/text><circle cx=\"215\" cy=\"81\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"290\" y=\"81\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"81\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"10\" y=\"101.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">AMA (&gt;1:40)<\/tspan><\/text><circle cx=\"215\" cy=\"101.5\" r=\"6\" style=\"fill:#1C97A6\"/><circle cx=\"290\" cy=\"101.5\" r=\"6\" style=\"fill:#16834A\"/><text x=\"360\" y=\"101.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"360\" dy=\"0\">–<\/tspan><\/text><rect x=\"4\" y=\"112\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"122\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">IgM elevada<\/tspan><\/text><circle cx=\"215\" cy=\"122\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"290\" y=\"122\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><text x=\"360\" y=\"122\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"360\" dy=\"0\">–<\/tspan><\/text><text x=\"10\" y=\"142.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Anti-gp210<\/tspan><\/text><text x=\"215\" y=\"142.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><circle cx=\"290\" cy=\"142.5\" r=\"6\" style=\"fill:#16834A\"/><circle cx=\"360\" cy=\"142.5\" r=\"6\" style=\"fill:#1C97A6\"/><rect x=\"4\" y=\"153\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"163\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Anti-sp100<\/tspan><\/text><text x=\"215\" y=\"163\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><circle cx=\"290\" cy=\"163\" r=\"6\" style=\"fill:#16834A\"/><text x=\"360\" y=\"163\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"360\" dy=\"0\">–<\/tspan><\/text><text x=\"10\" y=\"183.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Anticentrómero<\/tspan><\/text><circle cx=\"215\" cy=\"183.5\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"290\" y=\"183.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"183.5\" r=\"6\" style=\"fill:#1C97A6\"/><rect x=\"4\" y=\"194\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"204\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Bilirrubina alta<\/tspan><\/text><text x=\"215\" y=\"204\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><text x=\"290\" y=\"204\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"204\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"10\" y=\"224.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Albúmina baja<\/tspan><\/text><text x=\"215\" y=\"224.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><text x=\"290\" y=\"224.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"224.5\" r=\"6\" style=\"fill:#1C97A6\"/><rect x=\"4\" y=\"235\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"245\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">INR alto<\/tspan><\/text><text x=\"215\" y=\"245\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><text x=\"290\" y=\"245\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"245\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"10\" y=\"265.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Plaquetas bajas<\/tspan><\/text><text x=\"215\" y=\"265.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><text x=\"290\" y=\"265.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"265.5\" r=\"6\" style=\"fill:#1C97A6\"/><rect x=\"4\" y=\"276\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"286\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Ultrasonido<\/tspan><\/text><text x=\"215\" y=\"286\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><text x=\"290\" y=\"286\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"286\" r=\"6\" style=\"fill:#1C97A6\"/><text x=\"10\" y=\"306.5\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Elastografía<\/tspan><\/text><text x=\"215\" y=\"306.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">–<\/tspan><\/text><text x=\"290\" y=\"306.5\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">–<\/tspan><\/text><circle cx=\"360\" cy=\"306.5\" r=\"6\" style=\"fill:#1C97A6\"/><rect x=\"4\" y=\"317\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"327\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Biopsia hepática<\/tspan><\/text><circle cx=\"215\" cy=\"327\" r=\"6\" style=\"fill:#1C97A6\"/><circle cx=\"290\" cy=\"327\" r=\"6\" style=\"fill:#16834A\"/><circle cx=\"360\" cy=\"327\" r=\"6\" style=\"fill:#1C97A6\"/><\/svg><figcaption>Tabla 1 del artículo. Diagnóstico = <strong>FA + AMA<\/strong> (o <strong>anti-gp210/anti-sp100<\/strong>); bilirrubina, albúmina, INR y plaquetas son de <strong>pronóstico<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>AMA positivos + FA alta = CBP <strong>sin biopsia<\/strong>. La biopsia se reserva para <strong>AMA negativos sin ANA específicos<\/strong>, sospecha de <strong>sobreposición con HAI<\/strong> o de <strong>otra lesión<\/strong> (p. ej. esteatosis).<\/p><\/aside>"},{"t":"Pruebas hepáticas en la CBP","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>ALT <strong>&gt;5× LSN<\/strong> en una CBP debe hacerte pensar en <strong>sobreposición con HAI<\/strong>: es uno de sus criterios.<\/p><\/aside>"},{"t":"Estadificación y respuesta al tratamiento","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La respuesta se evalúa <strong>al año<\/strong>. Insuficiente = <strong>FA &gt;1.5× LSN o bilirrubina &gt;LSN<\/strong> (Figura 2). Bilirrubina es el marcador pronóstico más pesado.<\/p><\/aside>"},{"t":"Tratamiento modificador de la enfermedad","h":"<figure class=\"fig\" data-fig=\"cbp-ruta\"><svg viewBox=\"0 0 400 414\" role=\"img\" aria-label=\"Ruta de diagnóstico y tratamiento de la CBP\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah18\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"42\" rx=\"9\" style=\"fill:#1C97A6;fill-opacity:0.13;stroke:#1C97A6;stroke-width:1.5\"/><text x=\"200\" y=\"19.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Colestasis (FA ↑) + AMA &gt;1:40 o ANA<\/tspan><tspan x=\"200\" dy=\"14.03\">específicos, sin otra causa<\/tspan><\/text><path d=\"M200 48 L200 62\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><rect x=\"50\" y=\"62\" width=\"300\" height=\"38\" rx=\"9\" style=\"fill:#1C97A6;fill-opacity:0.13;stroke:#1C97A6;stroke-width:1.5\"/><text x=\"200\" y=\"81\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">AUDC 13–15 mg/kg/d para todos, de por vida<\/tspan><\/text><path d=\"M200 100 L200 116\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><rect x=\"110\" y=\"116\" width=\"180\" height=\"32\" rx=\"9\" style=\"fill:#1C97A6;fill-opacity:0.13;stroke:#1C97A6;stroke-width:1.5\"/><text x=\"200\" y=\"132\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Evalúa la respuesta al año<\/tspan><\/text><path d=\"M150 148 V164 H68 V180\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><path d=\"M200 148 L200 180\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><path d=\"M250 148 V164 H332 V180\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><rect x=\"6\" y=\"180\" width=\"124\" height=\"74\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"190.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Suficiente: FA<\/tspan><tspan x=\"68\" dy=\"13.42\">&lt;1.5× LSN,<\/tspan><tspan x=\"68\" dy=\"13.42\">bilirrubina<\/tspan><tspan x=\"68\" dy=\"13.42\">normal, fibrosis<\/tspan><tspan x=\"68\" dy=\"13.42\">leve<\/tspan><\/text><path d=\"M68 254 L68 270\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><rect x=\"6\" y=\"270\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"291.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Seguimiento<\/tspan><tspan x=\"68\" dy=\"13.42\">individualizado;<\/tspan><tspan x=\"68\" dy=\"13.42\">elastografía<\/tspan><tspan x=\"68\" dy=\"13.42\">seriada<\/tspan><\/text><rect x=\"138\" y=\"180\" width=\"124\" height=\"74\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"196.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Insuficiente: FA<\/tspan><tspan x=\"200\" dy=\"13.42\">&gt;1.5× LSN o<\/tspan><tspan x=\"200\" dy=\"13.42\">bilirrubina &gt;LSN<\/tspan><tspan x=\"200\" dy=\"13.42\">(o intolerancia)<\/tspan><\/text><path d=\"M200 254 L200 270\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><rect x=\"138\" y=\"270\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"285.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Segunda línea:<\/tspan><tspan x=\"200\" dy=\"13.42\">ácido obeticólico<\/tspan><tspan x=\"200\" dy=\"13.42\">(aprobado) o<\/tspan><tspan x=\"200\" dy=\"13.42\">bezafibrato (fuera<\/tspan><tspan x=\"200\" dy=\"13.42\">de indicación)<\/tspan><\/text><rect x=\"270\" y=\"180\" width=\"124\" height=\"74\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"196.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Bilirrubina en<\/tspan><tspan x=\"332\" dy=\"13.42\">ascenso, albúmina<\/tspan><tspan x=\"332\" dy=\"13.42\">en descenso o<\/tspan><tspan x=\"332\" dy=\"13.42\">descompensación<\/tspan><\/text><path d=\"M332 254 L332 270\" class=\"fx-arr\" marker-end=\"url(#ah18)\"/><rect x=\"270\" y=\"270\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"285.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Valorar<\/tspan><tspan x=\"332\" dy=\"13.42\">trasplante;<\/tspan><tspan x=\"332\" dy=\"13.42\">vigilar CHC y<\/tspan><tspan x=\"332\" dy=\"13.42\">várices; centro<\/tspan><tspan x=\"332\" dy=\"13.42\">especializado<\/tspan><\/text><rect x=\"6\" y=\"366\" width=\"388\" height=\"42\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5;stroke-dasharray:5 4\"/><text x=\"200\" y=\"379.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">¿Rasgos de HAI (biopsia)? Considera prueba con<\/tspan><tspan x=\"200\" dy=\"14.03\">corticoesteroides<\/tspan><\/text><\/svg><figcaption>Figura 2 del artículo, simplificada. La respuesta al <strong>AUDC al año<\/strong> decide: seguir, escalar a <strong>segunda línea<\/strong> o pensar en <strong>trasplante<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>AUDC <strong>13–15 mg/kg/d<\/strong>. El AOC es agonista <strong>FXR<\/strong> y <strong>empeora el prurito<\/strong>; el bezafibrato es <strong>pan-PPAR<\/strong> y lo <strong>mejora<\/strong>, pero ojo con <strong>creatinina, mialgias y estatinas<\/strong>.<\/p><\/aside>"},{"t":"Manejo de síntomas: prurito, sicca y fatiga","h":"<h5>Prurito (Tabla 3)<\/h5><div class=\"tbl\"><table><thead><tr><th>Fármaco<\/th><th>Dosis<\/th><th>Mecanismo<\/th><th>Comentario<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Colestiramina<\/strong> (1.ª línea)<\/th><td><strong>4–12 g/d<\/strong><\/td><td>Secuestrador de ácidos biliares<\/td><td>Separar de otros fármacos; estreñimiento<\/td><\/tr><tr><th scope=\"row\"><strong>Rifampicina<\/strong> (2.ª línea)<\/th><td><strong>150–600 mg/d<\/strong><\/td><td>Agonista <strong>PXR<\/strong><\/td><td>Hepatotoxicidad; vigilar BH y PFH; vitamina K si hay ictericia; considerar tuberculosis local<\/td><\/tr><tr><th scope=\"row\">Gabapentina<\/th><td>Variable<\/td><td>Análogo de GABA<\/td><td>A algunos les sirve<\/td><\/tr><tr><th scope=\"row\">Bezafibrato<\/th><td>Hasta <strong>400 mg/d<\/strong><\/td><td>Pan-PPAR<\/td><td>Vigilar PFH y creatinina<\/td><\/tr><tr><th scope=\"row\">Naltrexona<\/th><td>Hasta <strong>50 mg/d<\/strong><\/td><td>Antagonista opioide parcial<\/td><td>Riesgo de síndrome de dolor paradójico<\/td><\/tr><tr><th scope=\"row\">Sertralina<\/th><td>Hasta <strong>100 mg/d<\/strong><\/td><td>ISRS<\/td><td>Boca seca; eficacia baja<\/td><\/tr><tr><th scope=\"row\">Inhibidores de SLC10A2<\/th><td>Solo ensayos<\/td><td>Inhiben la reabsorción de ácidos biliares<\/td><td>Datos iniciales positivos<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-mnemo\"><div class=\"callout-h\"><span class=\"callout-k\">Mnemotecnia<\/span><span class=\"callout-t\">TrACE<\/span><\/div><p><strong>Tr<\/strong>atar · <strong>A<\/strong>liviar · <strong>C<\/strong>ope (afrontar) · <strong>E<\/strong>mpatizar.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Escalera del prurito: <strong>colestiramina → rifampicina<\/strong> → naltrexona/sertralina/gabapentina. Rifampicina = vigilar <strong>hepatotoxicidad<\/strong>.<\/p><\/aside>"},{"t":"Sobreposición con hepatitis autoinmune","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Sobreposición = <strong>2 de 3<\/strong>: ALT &gt;5× LSN · IgG &gt;2× LSN o AML · interfase moderada o grave en la biopsia (obligatoria en la versión refinada).<\/p><\/aside>"},{"t":"Complicaciones, vigilancia y trasplante","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Bilirrubina <strong>&gt;3 mg/dL<\/strong>: cuidado; <strong>&gt;5 mg/dL<\/strong>: discute trasplante. Prurito intratable sí es indicación; fatiga <strong>no<\/strong>.<\/p><\/aside>"}],"pearls":["CBP = colangitis destructiva de conductos biliares PEQUEÑOS: el US es normal y sirve para descartar obstrucción.","FA alta + AMA &gt;1:40 sin otra causa = diagnóstico; no hace falta biopsia.","Más de 90 % tiene AMA; el autoantígeno es PDC-E2 (mitocondrial).","AMA negativos: anti-sp100 (puntos nucleares múltiples) y anti-gp210 (anillo perinuclear, peor pronóstico).","IgM elevada acompaña a los AMA, pero es inespecífica.","AUDC 13–15 mg/kg/d a todos, de por vida, incluso después del trasplante.","La respuesta se evalúa al año; buena respuesta = FA &lt;1.5× LSN con bilirrubina normal.","Mal pronóstico basal: &lt;45 años, hombre, ANA específicos, cirrosis o bilirrubina alta.","Ácido obeticólico: agonista FXR, 5 mg → 10 mg; en Child-Pugh B/C 5 mg por semana; empeora el prurito.","Bezafibrato 400 mg/d (pan-PPAR): mejora el prurito; cuidado con creatinina, mialgias y estatinas.","Prurito: colestiramina primero, rifampicina después (vigilar hepatotoxicidad).","La fatiga no es indicación de trasplante; el prurito intratable sí.","Sobreposición con HAI: 2 de 3 (ALT &gt;5× LSN, IgG &gt;2× LSN o AML, interfase moderada a grave); &lt;2 %.","CHC en CBP: enfermedad avanzada, no respondedores y hombres.","Hiperlipidemia de la CBP: HDL alto, no aterogénica; las estatinas son seguras."],"comps":[{"title":"AUDC contra ácido obeticólico contra bezafibrato","cols":["AUDC","Ácido obeticólico","Bezafibrato"],"rows":[["Lugar","Primera línea, a todos","Segunda línea aprobada","Segunda línea fuera de indicación"],["Mecanismo","Secretagogo postraduccional; colerético y antiinflamatorio","Agonista selectivo de FXR (induce FGF19)","Agonista pan-PPAR"],["Dosis","13–15 mg/kg/d","5 mg/d → 10 mg/d","400 mg/d"],["Naturaleza","Ácido biliar terciario natural","Ácido biliar semisintético (6α-etil-quenodesoxicólico)","Fibrato"],["Efecto sobre el prurito","No se describe como causa","Lo empeora","Lo mejora"],["Efectos adversos","Distensión, peso, cabello delgado","Prurito; suspensión &lt;10 %","Creatinina +5 %, mialgias 20 %, hepatotoxicidad"],["Cirrosis avanzada","Se mantiene; también postrasplante","Child-Pugh B/C: 5 mg por semana","Faltan datos en enfermedad avanzada"],["Disponibilidad","Universal","Aprobado FDA y EMA","No disponible en EUA"],["Evidencia","Establecida","Ensayo fase 3 de 12 meses: ~50 % responde","Ensayo aleatorizado de 24 meses"],["Interacción a vigilar","Separar de colestiramina †","Ajuste en cirrosis","Estatinas: rabdomiólisis"]],"key":"El AUDC es para todos; si al año falla, el AOC (FXR) es lo aprobado pero empeora el prurito, y el bezafibrato (pan-PPAR) lo mejora pero vigila creatinina y estatinas."},{"title":"CBP clásica contra sobreposición CBP-HAI","cols":["CBP clásica","Sobreposición CBP-HAI"],"rows":[["Frecuencia","La mayoría","&lt;2 %"],["ALT","Elevación leve; &gt;5× LSN es raro","&gt;5× LSN (criterio)"],["Inmunoglobulina","IgM elevada","IgG &gt;2× LSN (criterio)"],["Autoanticuerpos","AMA, anti-sp100, anti-gp210","AMA + antimúsculo liso (criterio)"],["Biopsia","Ya poco necesaria","Necesaria: hepatitis de interfase moderada o grave"],["Lesión dominante","Colangitis de conductos pequeños","Colangitis + hepatitis de interfase"],["Tratamiento","AUDC 13–15 mg/kg/d","AUDC + corticoesteroides o azatioprina"],["Pronóstico","Excelente si responde","La interfase es factor de progresión"]],"key":"ALT &gt;5× LSN, IgG &gt;2× LSN o AML y hepatitis de interfase en la biopsia (2 de 3) separan la sobreposición de la CBP clásica."}],"algos":[{"title":"Diagnóstico de la colangitis biliar primaria","src":"Texto \"Reaching a diagnosis\", Tabla 1 y Figura 2 del artículo","start":"a","nodes":{"a":{"q":"Paciente con colestasis bioquímica (FA elevada, con o sin GGT). ¿Qué muestra el US?","i":"El US no ve la CBP (conductos pequeños); sirve para descartar obstrucción.","o":[["Vía biliar dilatada u obstrucción","obs"],["Sin obstrucción","b"]]},"obs":{"end":1,"tone":"warn","text":"Estudia la <strong>obstrucción biliar<\/strong>: no es CBP hasta descartarla."},"b":{"q":"¿AMA por inmunofluorescencia?","i":"","o":[["Positivos (&gt;1:40) con ALT poco elevada","dx"],["Positivos, pero ALT &gt;5× LSN o IgG alta","hai"],["Negativos","c"]]},"dx":{"end":1,"tone":"ok","text":"<strong>CBP sin biopsia<\/strong>. Inicia <strong>AUDC 13–15 mg/kg/d<\/strong> de por vida y evalúa la respuesta al año."},"hai":{"end":1,"tone":"warn","text":"Sospecha <strong>sobreposición con HAI<\/strong>: biopsia (2 de 3 criterios: ALT &gt;5× LSN, IgG &gt;2× LSN o AML, interfase moderada o grave)."},"c":{"q":"¿ANA específicos (anti-sp100, anti-gp210; puntos nucleares múltiples o anillo perinuclear)?","i":"","o":[["Positivos","dx2"],["Negativos","bx"]]},"dx2":{"end":1,"tone":"ok","text":"<strong>CBP AMA negativa<\/strong>: el ANA específico basta con la colestasis. Anti-gp210 sugiere mayor gravedad."},"bx":{"end":1,"tone":"warn","text":"<strong>Biopsia hepática<\/strong>: indicada sin serología característica."}}},{"title":"Respuesta al AUDC y segunda línea","src":"Figura 2 y Tabla 2 del artículo","start":"a","nodes":{"a":{"q":"CBP tras 1 año de AUDC 13–15 mg/kg/d. ¿Cómo está?","i":"","o":[["FA &lt;1.5× LSN y bilirrubina normal","ok"],["FA &gt;1.5× LSN o bilirrubina &gt;LSN, o intolerancia al AUDC","b"],["Bilirrubina en ascenso, albúmina en descenso o descompensación","tx"]]},"ok":{"end":1,"tone":"ok","text":"<strong>Respuesta suficiente<\/strong>: seguir AUDC; seguimiento individualizado con elastografía seriada."},"b":{"q":"¿Qué función hepática tiene?","i":"","o":[["Sin cirrosis o Child-Pugh A","oca"],["Child-Pugh B","ocab"],["Child-Pugh C","tx"]]},"oca":{"end":1,"tone":"warn","text":"Agregar <strong>ácido obeticólico 5 mg/d<\/strong>, titular a <strong>10 mg/d<\/strong> a los 3 meses (FDA) o 6 (EMA). Alternativa fuera de indicación: <strong>bezafibrato 400 mg/d<\/strong> (cuidado con estatinas y creatinina)."},"ocab":{"end":1,"tone":"warn","text":"Si se usa AOC: <strong>5 mg por semana<\/strong>, máximo <strong>10 mg dos veces por semana<\/strong>; vigilancia estrecha y suspender si se descompensa."},"tx":{"end":1,"tone":"bad","text":"<strong>Valorar trasplante<\/strong> (cautela con bilirrubina &gt;3 mg/dL; documentar con &gt;5 mg/dL) y vigilar <strong>CHC y várices<\/strong>."}}}],"cards":[["¿Qué conductos destruye la colangitis biliar primaria?","Los conductos biliares interlobulares pequeños (ductopenia), por ataque inmune contra el PDC-E2 mitocondrial."],["¿Qué es la colangitis biliar primaria?","Enfermedad hepática autoinmune: colangitis linfocítica granulomatosa, crónica y destructiva de conductos biliares pequeños, con AMA positivos."],["Sexo predominante","Mujeres (rara en niños)."],["Prevalencia en Asia-Pacífico (revisión de 18 estudios)","118.75 por millón; alta en Japón y China (191.18) y baja en Corea del Sur y Australia (39.09)."],["Fatiga en el estudio japonés se asoció a…","Sexo femenino, diagnóstico &lt;50 años y albúmina baja."],["Citocinas que impulsan la colangitis","IL-12 e IFNγ."],["Vía destacada en GWAS europeos","IL-12/IL-23."],["Dónde se concentran los AMA en el colangiocito","Superficie apical; se asocian a apoptosis."],["MicroARN implicado y su cromosoma","hsa-mir-506, en el cromosoma X; reduce AE2 e ITPR3."],["Hallazgos cutáneos de la CBP avanzada","Xantelasmas y xantomas."],["Presentación más común hoy","Colestasis bioquímica asintomática con AMA positivos."],["Criterios diagnósticos","AMA &gt;1:40 o ANA específicos + bioquímica colestásica sin otra explicación."],["Utilidad del anti-sp100 según la Tabla 1","Diagnóstico (no pronóstico)."],["¿Por qué el US no muestra la CBP?","Porque el daño está en conductos biliares pequeños."],["¿Qué indica la GGT alta junto a la FA?","Origen biliar de la FA."],["¿Cuándo se evalúa la respuesta al AUDC?","Al año de iniciado."],["Inclusión del ensayo de ácido obeticólico","FA &gt;1.67× LSN o bilirrubina elevada &lt;2× LSN."],["¿AUDC después del trasplante?","Sí, tiene beneficio."],["Dosis del ácido obeticólico","5 mg/d; titular a 10 mg/d a los 3 meses (FDA) o 6 meses (EMA)."],["Mecanismo del bezafibrato","Agonista pan-PPAR."],["Interacción peligrosa del bezafibrato","Estatinas (rabdomiólisis)."],["Sertralina para prurito","Hasta 100 mg/d; boca seca; eficacia baja."],["Algoritmo TrACE para fatiga","Tratar lo tratable, aliviar lo aliviable, afrontar y empatizar."],["Tratamiento de la sobreposición","AUDC + considerar corticoesteroides o azatioprina."],["¿Estatinas en CBP?","Seguras si están indicadas."]],"mcq":[{"q":"Mujer de 54 años con prurito y fatiga. FA 3× LSN, GGT elevada, ALT 1.5× LSN. US sin dilatación de la vía biliar. ¿Qué estudio sigue?","o":["CPRE","Anticuerpos antimitocondriales","Biopsia hepática","Colangiorresonancia","Ceruloplasmina"],"a":1,"e":"Con colestasis y US sin obstrucción, los <strong>AMA<\/strong> confirman la CBP en <strong>&gt;90 %<\/strong> de los casos sin necesidad de biopsia."},{"q":"La misma paciente tiene AMA 1:160. ¿Qué haces?","o":["Biopsia para confirmar","Colangiorresonancia","Iniciar AUDC 13–15 mg/kg/d","Repetir AMA en 6 meses","Iniciar prednisona"],"a":2,"e":"AMA <strong>&gt;1:40<\/strong> + bioquímica colestásica sin otra explicación es <strong>suficiente<\/strong> para el diagnóstico; todos reciben <strong>AUDC 13–15 mg/kg/d<\/strong>."},{"q":"Mujer de 49 años con colestasis y AMA negativos. ¿Qué anticuerpo específico apoya el diagnóstico de CBP?","o":["Anti-LKM1","Anti-SLA","ANCA atípico","Anti-sp100","Antimúsculo liso"],"a":3,"e":"<strong>Anti-sp100<\/strong> y <strong>anti-gp210<\/strong> son específicos de CBP y sirven en pacientes AMA negativos."},{"q":"¿Qué autoanticuerpo se ha asociado a mayor gravedad de la CBP?","o":["Anti-sp100","IgM","AMA a título alto","Anti-dsDNA","Anti-gp210"],"a":4,"e":"En algunas series, <strong>anti-gp210<\/strong> se asocia a <strong>gravedad<\/strong>; la Tabla 1 lo marca útil para diagnóstico y pronóstico."},{"q":"¿Qué inmunoglobulina suele estar elevada en la CBP?","o":["IgM","IgA","IgE","IgG4","IgD"],"a":0,"e":"Los AMA suelen acompañarse de un aumento <strong>inespecífico de IgM<\/strong>. La IgG alta orienta a HAI."},{"q":"¿Cuál es la dosis de AUDC en la CBP?","o":["5–7 mg/kg/d","13–15 mg/kg/d","10 mg/kg/d","28–30 mg/kg/d","400 mg/d fijos"],"a":1,"e":"<strong>13–15 mg/kg/d<\/strong> VO, a todos y de por vida (guías EASL y AASLD)."},{"q":"¿Cuándo se evalúa la respuesta bioquímica al AUDC?","o":["A la semana","Al mes","Al año","A los 3 meses","A los 5 años"],"a":2,"e":"La respuesta se juzga <strong>1 año<\/strong> después de iniciar, con criterios dicotómicos o escalas continuas (GLOBE, UK-PBC)."},{"q":"¿Cuáles son las escalas continuas de respuesta al AUDC que menciona la revisión?","o":["MELD y Child-Pugh","Mayo y París","Rockall y Blatchford","GLOBE y UK-PBC","Ranson y APACHE"],"a":3,"e":"<strong>GLOBE<\/strong> y <strong>UK-PBC<\/strong> son puntajes continuos; los criterios dicotómicos son otra opción."},{"q":"Mujer de 46 años con CBP tras 12 meses de AUDC a dosis correcta: FA 2.4× LSN, bilirrubina normal. ¿Qué indica?","o":["Respuesta adecuada, seguir igual","Suspender el AUDC","Duplicar el AUDC a 30 mg/kg/d","Trasplante","Respuesta insuficiente: considerar ácido obeticólico"],"a":4,"e":"<strong>FA &gt;1.5× LSN<\/strong> es respuesta insuficiente; la segunda línea aprobada es el <strong>ácido obeticólico<\/strong> (o bezafibrato fuera de indicación)."},{"q":"¿Cómo se dosifica el ácido obeticólico sin cirrosis descompensada?","o":["5 mg/d y titular a 10 mg/d si se tolera","10 mg/d desde el inicio","25 mg/d","5 mg por semana","400 mg/d"],"a":0,"e":"Inicio <strong>5 mg/d<\/strong>, titulación a <strong>10 mg/d<\/strong> a los <strong>3 meses<\/strong> (FDA) o <strong>6 meses<\/strong> (EMA)."},{"q":"¿Cuál es el efecto adverso más característico del ácido obeticólico?","o":["Rabdomiólisis","Prurito","Hipotiroidismo","Neutropenia","Pancreatitis"],"a":1,"e":"El <strong>prurito<\/strong> es frecuente; suele mejorar con el tiempo y se maneja con colestiramina, rifampicina o ajuste de dosis."},{"q":"¿Cuál es el mecanismo del bezafibrato?","o":["Agonista FXR","Antagonista opioide","Agonista pan-PPAR","Secuestrador de ácidos biliares","Agonista PXR"],"a":2,"e":"Bezafibrato = <strong>pan-PPAR<\/strong>; fenofibrato = <strong>PPARα<\/strong>."},{"q":"¿Qué frecuencia de mialgias hubo con bezafibrato en el ensayo?","o":["5 %","20 %","10 %","40 %","60 %"],"a":1,"e":"<strong>20 % (10/50)<\/strong> con bezafibrato contra <strong>10 % (5/50)<\/strong> con placebo."},{"q":"¿Qué vigilancia exige la rifampicina para el prurito?","o":["Electrocardiograma","Glucosa","PFH y biometría por riesgo de hepatotoxicidad","Densitometría","Agudeza visual"],"a":2,"e":"Rifampicina 150–600 mg/d (agonista <strong>PXR<\/strong>): riesgo pequeño pero definido de <strong>hepatotoxicidad<\/strong>; vigilar BH y PFH, vitamina K si hay ictericia."},{"q":"¿Cuál es el mecanismo de los nuevos fármacos en ensayo para el prurito?","o":["Agonismo FXR","Bloqueo H1","Inhibición de calcineurina","Inhibición de SLC10A2 (reabsorción ileal de ácidos biliares)","Agonismo PPARα"],"a":3,"e":"Los <strong>inhibidores de SLC10A2<\/strong> bloquean la reabsorción de ácidos biliares; datos iniciales positivos."},{"q":"¿Qué significa el algoritmo TrACE?","o":["Trasplante, AUDC, colestiramina, ejercicio","Tiroides, anemia, colesterol, estrés","Transaminasas, ALP, creatinina, elastografía","Ninguno","Tratar lo tratable, aliviar lo aliviable, afrontar y empatizar"],"a":4,"e":"Es el abordaje práctico de la <strong>fatiga<\/strong>."},{"q":"¿Cuál es la frecuencia de sobreposición CBP-HAI con criterios estrictos?","o":["&lt;2 %","10 %","25 %","50 %","&gt;70 %"],"a":0,"e":"Con los criterios de 2 de 3 es <strong>poco común: &lt;2 %<\/strong>."},{"q":"En la versión refinada de los criterios de sobreposición, ¿qué es obligatorio?","o":["AMA positivos a título alto","La biopsia como uno de los criterios","IgM elevada","ALT &gt;10× LSN","Anti-LKM1"],"a":1,"e":"El refinamiento exige que los <strong>hallazgos de biopsia<\/strong> sean uno de los criterios cumplidos."},{"q":"¿Qué complicación portal puede ocurrir rara vez en la CBP sin cirrosis?","o":["Trombosis de la vena porta obligatoria","Síndrome de Budd-Chiari","Hipertensión portal no cirrótica","Hepatopatía congestiva","Ascitis quilosa"],"a":2,"e":"La revisión menciona un potencial raro de <strong>hipertensión portal no cirrótica<\/strong> (presinusoidal †)."},{"q":"¿Qué medidas óseas se recomiendan en la CBP?","o":["Ninguna","Bifosfonato a todos sin densitometría","Solo vitamina A","Calcio, vitamina D, densitometría y evaluar riesgo de fractura","Teriparatida a todos"],"a":3,"e":"Se recomiendan <strong>calcio y vitamina D<\/strong>, <strong>densitometría<\/strong> y evaluación general del riesgo de <strong>fractura<\/strong>."},{"q":"Paciente con CBP cuya bilirrubina subió de 2 a 5.4 mg/dL en un año. ¿Qué es lo más apropiado?","o":["Esperar a que llegue a 10 mg/dL","Suspender el AUDC","Iniciar rifampicina","Biopsia hepática","Documentar la discusión sobre trasplante y referir a centro especializado"],"a":4,"e":"Cautela con <strong>&gt;3 mg/dL<\/strong> y <strong>documentar la discusión<\/strong> de trasplante con <strong>&gt;5 mg/dL<\/strong>."},{"q":"¿Cuál es un factor de riesgo observacional para desarrollar CBP?","o":["Infecciones urinarias recurrentes","Consumo de café","Obesidad","Hepatitis A","Uso de anticonceptivos"],"a":0,"e":"Tabaquismo, <strong>colestasis del embarazo<\/strong> previa e <strong>IVU recurrentes<\/strong>."},{"q":"¿Cuál es la concordancia de CBP en gemelos idénticos?","o":["5 %","~60 %","20 %","100 %","0 %"],"a":1,"e":"<strong>~60 %<\/strong>: hay riesgo genético, pero también hace falta un detonante ambiental."},{"q":"¿Qué enfermedades autoinmunes asociadas destaca la revisión?","o":["Lupus y esclerodermia únicamente","Diabetes tipo 1 y vitíligo","Tiroidea y celíaca","Miastenia y psoriasis","Ninguna"],"a":2,"e":"Se debe considerar la <strong>alta tasa de enfermedad tiroidea y celíaca<\/strong>, aunque el escrutinio rutinario no esté basado en evidencia."}],"tf":[["La colangitis biliar primaria daña sobre todo los conductos biliares grandes extrahepáticos.",false,"Daña los pequeños interlobulares; los grandes son típicos de la colangitis esclerosante primaria."],["La CBP afecta conductos biliares grandes visibles en el US.",false,"Afecta conductos pequeños; el US sirve para descartar obstrucción."],["Con AMA positivos y FA elevada sin otra causa se requiere biopsia para el diagnóstico.",false,"La serología con bioquímica colestásica es suficiente."],["La IgM elevada es específica de CBP.",false,"Es un aumento inespecífico."],["El AUDC se da a 13–15 mg/kg/d de por vida.",true,"Para todos los pacientes."],["La respuesta al AUDC se juzga al año.",true,"Con criterios dicotómicos o GLOBE/UK-PBC."],["El bezafibrato puede combinarse sin precaución con estatinas.",false,"Hubo rabdomiólisis con estatina; se pide mucha cautela."],["La fatiga intensa es indicación de trasplante.",false,"No lo es; el prurito intratable sí puede serlo."],["Ser hombre aumenta el riesgo de CHC en CBP.",true,"Junto con enfermedad avanzada y no respuesta."],["Los inmunosupresores han demostrado beneficio claro en CBP sin sobreposición.",false,"Los tratamientos inmunológicos no han mostrado beneficio significativo."],["La CBP recurre con frecuencia tras el trasplante.",true,"Indica inmunidad innata y adaptativa."]]},{"id":"masld","n":5,"title":"Enfermedad hepática esteatósica asociada a disfunción metabólica (MASLD)","short":"MASLD","color":"#C9970A","src":"Targher G, Valenti L, Byrne CD. Metabolic Dysfunction–Associated Steatotic Liver Disease. N Engl J Med. 2025;393(7):683-98.","hook":"La hepatopatía crónica más común del planeta (hasta 38 % de los adultos) no mata sobre todo por el hígado: la primera causa de muerte es cardiovascular. El hígado graso es la cara hepática de la disfunción metabólica.","group":"Hígado","ses":20,"date":"2026-10-26","nums":[["38 %","de los adultos del mundo tiene MASLD"],["65 %","prevalencia de MASLD en diabetes tipo 2 (MASH 32 %)"],["1.30 / 2.67","cortes de FIB-4: bajo, indeterminado, alto riesgo"],["8.0 kPa","rigidez por VCTE que obliga a enviar al hepatólogo"],["5 · 7–10 · 10 %","pérdida de peso para esteatosis, inflamación y fibrosis"],["Marzo 2024","resmetirom: primer fármaco aprobado (FDA) para MASH"]],"esencial":"<h3>Lo esencial en 14 viñetas<\/h3><ul><li><strong>MASLD<\/strong> = <strong>esteatosis hepática + ≥1 de 5 rasgos del síndrome metabólico<\/strong>, sin consumo de alcohol clínicamente significativo ni otra causa secundaria de esteatosis.<\/li><li>Cronología de nombres: <strong>NASH (Ludwig, 1980)<\/strong> → <strong>MAFLD (2020)<\/strong> → <strong>MASLD y MASH (2023)<\/strong>. Las definiciones de NAFLD y MASLD son <strong>casi superponibles<\/strong> en la población general.<\/li><li>Es la <mark>hepatopatía crónica más común<\/mark>: hasta <strong>38 %<\/strong> de los adultos; <strong>65 %<\/strong> en diabetes tipo 2 (MASH <strong>32 %<\/strong>).<\/li><li>La <mark>primera causa de muerte en MASLD es la enfermedad cardiovascular<\/mark>, no la hepática.<\/li><li>Riesgos: <strong>DM2 2.2×<\/strong> (3.4× con enfermedad avanzada), <strong>enfermedad cardiovascular 1.5×<\/strong> (≈2.5× con fibrosis avanzada), insuficiencia cardiaca 1.5×, ERC ≥3 1.5×, cánceres extrahepáticos 1.5×, fibrilación auricular 1.2×, cirrosis o CHC 2–10×.<\/li><li>Cerca de <strong>30 %<\/strong> progresa a <strong>MASH<\/strong> (lipotoxicidad, daño hepatocelular, inflamación lobulillar).<\/li><li>La <strong>fibrosis<\/strong> es el mayor predictor pronóstico: <mark>F ≥2 (fibrosis clínicamente significativa)<\/mark> predice muerte por cualquier causa y complicaciones hepáticas.<\/li><li><strong>MASH en riesgo<\/strong> = MASH con fibrosis <strong>≥F2<\/strong>: es la indicación de tratamiento farmacológico.<\/li><li><strong>Heredabilidad ≈50 %<\/strong>; la variante clave es <strong>PNPLA3<\/strong> (también TM6SF2).<\/li><li>Estratificación: <mark>FIB-4 &lt;1.30 bajo, 1.30–2.67 indeterminado, &gt;2.67 alto<\/mark> (en &gt;65 años el corte bajo es <strong>2.0<\/strong>).<\/li><li>Indeterminado → <strong>VCTE<\/strong>: <mark>&lt;8.0 kPa<\/mark> reevaluar; <mark>≥8.0 kPa<\/mark> → <strong>hepatólogo<\/strong>.<\/li><li>Pilar del tratamiento: <strong>pérdida de peso<\/strong> ≥5 % (esteatosis), <strong>7–10 %<\/strong> (inflamación), <strong>≥10 %<\/strong> (fibrosis).<\/li><li><strong>Resmetirom<\/strong> (agonista THR-β, VO) fue el <mark>primer fármaco aprobado (FDA, marzo 2024)<\/mark> para <strong>MASH no cirrótica con fibrosis moderada a avanzada<\/strong>.<\/li><li><strong>Semaglutida 2.4 mg/semana<\/strong> (ESSENCE): resolución de MASH <strong>62.9 % vs 34.3 %<\/strong> y mejoría de fibrosis <strong>37.0 % vs 22.4 %<\/strong>.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Si te preguntan de qué muere un paciente con MASLD, la respuesta es <strong>enfermedad cardiovascular<\/strong>. Si te preguntan qué predice la mortalidad hepática, es el <strong>estadio de fibrosis<\/strong>.<\/p><\/aside>","secs":[{"t":"Nomenclatura y criterios diagnósticos","h":"<h5>De NASH a MASLD<\/h5><div class=\"tbl\"><table><thead><tr><th>Año<\/th><th>Término<\/th><th>Qué cambió<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1980<\/th><td><strong>NASH<\/strong> (Ludwig)<\/td><td>Describe la histología; la mayoría tenía <strong>obesidad o DM2<\/strong><\/td><\/tr><tr><th scope=\"row\">—<\/th><td><strong>NAFLD<\/strong><\/td><td>Espectro: grasa → NASH (inflamación + fibrosis) → cirrosis → CHC<\/td><\/tr><tr><th scope=\"row\">2020<\/th><td><strong>MAFLD<\/strong><\/td><td>Definición <strong>positiva<\/strong>: exige anormalidades metabólicas<\/td><\/tr><tr><th scope=\"row\">2023<\/th><td><strong>MASLD / MASH<\/strong><\/td><td>Consenso Delphi multisociedades; MASH sustituye a NASH<\/td><\/tr><\/tbody><\/table><\/div><figure class=\"fig\" data-fig=\"masld-dx\"><svg viewBox=\"0 0 400 330\" role=\"img\" aria-label=\"Criterios diagnósticos de MASLD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah19\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"80\" y=\"8\" width=\"240\" height=\"40\" rx=\"9\" style=\"fill:#C9970A;fill-opacity:0.13;stroke:#C9970A;stroke-width:1.5\"/><text x=\"200\" y=\"20.375\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Esteatosis hepática (imagen o<\/tspan><tspan x=\"200\" dy=\"15.25\">biopsia)<\/tspan><\/text><path d=\"M200 48 L200 66\" class=\"fx-arr\" marker-end=\"url(#ah19)\"/><rect x=\"70\" y=\"66\" width=\"260\" height=\"34\" rx=\"9\" style=\"fill:#C9970A;fill-opacity:0.13;stroke:#C9970A;stroke-width:1.5\"/><text x=\"200\" y=\"83\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">+ al menos 1 de estos 5 rasgos<\/tspan><\/text><rect x=\"20\" y=\"108\" width=\"360\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"117.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">1. IMC ≥25 (≥23 asiáticos) o cintura ≥94 cm H (≥90<\/tspan><tspan x=\"200\" dy=\"13.42\">asiáticos) / ≥80 cm M<\/tspan><\/text><rect x=\"20\" y=\"146\" width=\"360\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"155.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">2. Glucosa ≥5.6 mmol/L, HbA1c ≥39 mmol/mol, DM2 o<\/tspan><tspan x=\"200\" dy=\"13.42\">tratamiento<\/tspan><\/text><rect x=\"20\" y=\"184\" width=\"360\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"200\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">3. PA ≥130/85 mm Hg o antihipertensivo<\/tspan><\/text><rect x=\"20\" y=\"222\" width=\"360\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"238\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">4. Triglicéridos ≥1.70 mmol/L o tratamiento<\/tspan><\/text><rect x=\"20\" y=\"260\" width=\"360\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"276\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">5. HDL &lt;1.0 mmol/L (H) o &lt;1.3 mmol/L (M) o tratamiento<\/tspan><\/text><path d=\"M200 298 L200 300\" class=\"fx-arr\" marker-end=\"url(#ah19)\"/><rect x=\"40\" y=\"300\" width=\"320\" height=\"26\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"313\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Sin alcohol significativo ni otra causa secundaria<\/tspan><\/text><\/svg><figcaption>Figura 1 de la revisión. Basta <strong>un<\/strong> rasgo cardiometabólico; más rasgos implican <strong>más riesgo<\/strong> de desenlaces hepáticos mayores.<\/figcaption><\/figure><h5>Criterios de MASLD en adultos (Figura 1)<\/h5><div class=\"tbl\"><table><thead><tr><th>Rasgo<\/th><th>Corte del artículo<\/th><th>Equivalente aproximado<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Adiposidad<\/th><td><strong>IMC ≥25<\/strong> (≥23 en asiáticos) o cintura <strong>≥94 cm<\/strong> hombres (≥90 cm asiáticos), <strong>≥80 cm<\/strong> mujeres<\/td><td>—<\/td><\/tr><tr><th scope=\"row\">Glucosa<\/th><td>Glucosa en ayuno <strong>≥5.6 mmol/L<\/strong>, HbA1c <strong>≥39 mmol/mol<\/strong>, DM2 establecida o tratamiento<\/td><td>≈100 mg/dL; HbA1c ≈5.7 %†<\/td><\/tr><tr><th scope=\"row\">Presión arterial<\/th><td><strong>≥130/85 mm Hg<\/strong> o antihipertensivo<\/td><td>—<\/td><\/tr><tr><th scope=\"row\">Triglicéridos<\/th><td><strong>≥1.70 mmol/L<\/strong> o tratamiento hipolipemiante<\/td><td>≈150 mg/dL<\/td><\/tr><tr><th scope=\"row\">HDL<\/th><td><strong>&lt;1.0 mmol/L<\/strong> hombres, <strong>&lt;1.3 mmol/L<\/strong> mujeres, o tratamiento<\/td><td>≈39 y ≈50 mg/dL<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Diagnóstico positivo<\/span><\/div><p>Ya no es un diagnóstico de exclusión &quot;no alcohólico&quot;: se necesita <strong>demostrar disfunción metabólica<\/strong>. El fenotipo combina resistencia a la insulina, obesidad abdominal, dislipidemia aterogénica, hipertensión y disglucemia (prediabetes o DM2).<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Basta <strong>un solo<\/strong> rasgo cardiometabólico. Cuantos <strong>más rasgos<\/strong> tenga el paciente al diagnóstico, <strong>mayor el riesgo<\/strong> de eventos hepáticos mayores.<\/p><\/aside>"},{"t":"Epidemiología y carga global","h":"<h5>Cáncer hepatocelular<\/h5><div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Incidencia de CHC<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">MASLD en general<\/th><td><strong>1.25 por 1000 personas-año<\/strong><\/td><\/tr><tr><th scope=\"row\">Cirrosis por MASLD<\/th><td><strong>≈20 por 1000 personas-año<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>65 % es la prevalencia de MASLD <strong>en diabéticos<\/strong>, no en la población general (38 %).<\/p><\/aside>"},{"t":"Enfermedad multisistémica","h":"<h5>Más allá del hígado<\/h5><div class=\"tbl\"><table><thead><tr><th>Desenlace nuevo<\/th><th>Aumento aproximado de riesgo<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Diabetes tipo 2<\/strong> (si no la tenía)<\/th><td><strong>2.2×<\/strong> (3.4× con enfermedad hepática avanzada)<\/td><\/tr><tr><th scope=\"row\">Enfermedad cardiovascular fatal o no fatal<\/th><td><strong>1.5×<\/strong> (≈2.5× con enfermedad más grave/fibrosis alta)<\/td><\/tr><tr><th scope=\"row\">Insuficiencia cardiaca<\/th><td><strong>1.5×<\/strong><\/td><\/tr><tr><th scope=\"row\">Fibrilación auricular<\/th><td><strong>1.2×<\/strong><\/td><\/tr><tr><th scope=\"row\">ERC estadio ≥3<\/th><td><strong>1.5×<\/strong><\/td><\/tr><tr><th scope=\"row\">Cánceres extrahepáticos<\/th><td><strong>1.5×<\/strong><\/td><\/tr><tr><th scope=\"row\">Cirrosis o CHC<\/th><td><strong>2–10×<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-perla\"><div class=\"callout-h\"><span class=\"callout-k\">Perla clínica<\/span><span class=\"callout-t\">Para recordar los riesgos<\/span><\/div><p><strong>&quot;Dos punto dos para la diabetes; uno punto cinco para casi todo lo demás; uno punto dos para la fibrilación&quot;<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La pregunta clásica: &quot;¿Cuál es la principal causa de muerte en MASLD?&quot; → <strong>enfermedad cardiovascular<\/strong>.<\/p><\/aside>"},{"t":"Historia natural y fibrosis","h":"<figure class=\"fig\" data-fig=\"masld-hist\"><svg viewBox=\"0 0 400 380\" role=\"img\" aria-label=\"Historia natural de MASLD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah20\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"20\" y=\"10\" width=\"200\" height=\"40\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"120\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"120\" dy=\"0\">Hígado sano<\/tspan><\/text><path d=\"M120 50 L120 80\" class=\"fx-arr\" marker-end=\"url(#ah20)\"/><rect x=\"20\" y=\"80\" width=\"200\" height=\"40\" rx=\"9\" style=\"fill:#C9970A;fill-opacity:0.13;stroke:#C9970A;stroke-width:1.5\"/><text x=\"120\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"120\" dy=\"0\">Esteatosis aislada<\/tspan><\/text><path d=\"M120 120 L120 150\" class=\"fx-arr\" marker-end=\"url(#ah20)\"/><rect x=\"20\" y=\"150\" width=\"200\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"120\" y=\"170\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"120\" dy=\"0\">MASH (≈30 % de MASLD)<\/tspan><\/text><path d=\"M120 190 L120 220\" class=\"fx-arr\" marker-end=\"url(#ah20)\"/><rect x=\"20\" y=\"220\" width=\"200\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"120\" y=\"240\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"120\" dy=\"0\">Fibrosis avanzada (F3)<\/tspan><\/text><path d=\"M120 260 L120 290\" class=\"fx-arr\" marker-end=\"url(#ah20)\"/><rect x=\"20\" y=\"290\" width=\"200\" height=\"40\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"120\" y=\"310\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"120\" dy=\"0\">Cirrosis (F4)<\/tspan><\/text><rect x=\"250\" y=\"270\" width=\"140\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"320\" y=\"287\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"320\" dy=\"0\">CHC: 0.5–2.5 %/año<\/tspan><\/text><rect x=\"250\" y=\"316\" width=\"140\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"320\" y=\"326.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"320\" dy=\"0\">Descompensación: ≈10<\/tspan><tspan x=\"320\" dy=\"13.42\">%/año<\/tspan><\/text><path d=\"M220 292 L250 287\" class=\"fx-arr\" marker-end=\"url(#ah20)\"/><path d=\"M220 302 L250 333\" class=\"fx-arr\" marker-end=\"url(#ah20)\"/><text x=\"250\" y=\"30\" font-size=\"11\" text-anchor=\"start\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"250\" dy=\"0\">Tiempo a cirrosis o<\/tspan><\/text><text x=\"250\" y=\"45\" font-size=\"11\" text-anchor=\"start\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"250\" dy=\"0\">descompensación:<\/tspan><\/text><text x=\"250\" y=\"70\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"250\" dy=\"0\">F0–F1: 30–35 años<\/tspan><\/text><text x=\"250\" y=\"90\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"250\" dy=\"0\">F2: 19–20 años<\/tspan><\/text><text x=\"250\" y=\"110\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"250\" dy=\"0\">F3: 5–6 años<\/tspan><\/text><rect x=\"250\" y=\"140\" width=\"140\" height=\"92\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"320\" y=\"153.975\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"320\" dy=\"0\">Motores: grasa<\/tspan><tspan x=\"320\" dy=\"12.81\">visceral, resistencia<\/tspan><tspan x=\"320\" dy=\"12.81\">a la insulina, DM2,<\/tspan><tspan x=\"320\" dy=\"12.81\">genética (PNPLA3,<\/tspan><tspan x=\"320\" dy=\"12.81\">TM6SF2), fructosa,<\/tspan><tspan x=\"320\" dy=\"12.81\">alcohol<\/tspan><\/text><\/svg><figcaption>Figura 2 de la revisión, simplificada; cifras aproximadas. La <strong>fibrosis ≥F2<\/strong> es la que marca el pronóstico; la <strong>DM2<\/strong> es el principal acelerador metabólico.<\/figcaption><\/figure><h5>Estadios de fibrosis (escala de 5 etapas)<\/h5><div class=\"tbl\"><table><thead><tr><th>Estadio<\/th><th>Histología<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>F0<\/strong><\/th><td>Sin fibrosis<\/td><\/tr><tr><th scope=\"row\"><strong>F1<\/strong><\/th><td>Perisinusoidal <strong>o<\/strong> portal<\/td><\/tr><tr><th scope=\"row\"><strong>F2<\/strong><\/th><td>Perisinusoidal <strong>y<\/strong> portal o periportal<\/td><\/tr><tr><th scope=\"row\"><strong>F3<\/strong><\/th><td>Septal, <strong>en puentes<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>F4<\/strong><\/th><td><strong>Cirrosis<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">MASH en riesgo<\/span><\/div><p><strong>MASH con fibrosis ≥F2<\/strong> = indicación clave de tratamiento en ensayos clínicos.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Desenlaces aceptados para <strong>aprobación condicional<\/strong>: (1) <strong>resolución de MASH sin empeorar la fibrosis<\/strong> y (2) <strong>mejoría de fibrosis ≥1 estadio sin empeorar la MASH<\/strong>. Para la <strong>aprobación definitiva<\/strong> se exige beneficio en <strong>desenlaces hepáticos mayores<\/strong> a largo plazo.<\/p><\/aside>"},{"t":"Fisiopatología y genética","h":"<div data-fp=\"masld\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Hipótesis de \"impactos múltiples\"<\/span><\/div><p>No hay una sola causa. La <strong>resistencia a la insulina<\/strong> llena al hígado de grasa, y los <strong>lípidos tóxicos<\/strong> (no los triglicéridos en sí) lesionan al hepatocito. Sobre eso actúan la genética, la microbiota intestinal y el ambiente. Lo que define el pronóstico es la <strong>fibrosis<\/strong>.<\/p><\/aside><figure class=\"fig\" data-fig=\"masld-fp\"><svg viewBox=\"0 0 400 353.48\" role=\"img\" aria-label=\"De la resistencia a la insulina a la fibrosis\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-masld\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"32.03\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Obesidad visceral y resistencia a la insulina<\/tspan><\/text><path d=\"M200 38.03 V49.03 H68 V60.03\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><path d=\"M200 38.03 V49.03 H200 V60.03\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><path d=\"M200 38.03 V49.03 H332 V60.03\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><rect x=\"6\" y=\"60.03\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"68\" y=\"76.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Más lipólisis:<\/tspan><tspan x=\"68\" dy=\"12.81\">llegan muchos<\/tspan><tspan x=\"68\" dy=\"12.81\">ácidos grasos<\/tspan><tspan x=\"68\" dy=\"12.81\">libres al hígado<\/tspan><\/text><rect x=\"138\" y=\"60.03\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"76.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hiperinsulinemia y<\/tspan><tspan x=\"200\" dy=\"12.81\">fructosa:<\/tspan><tspan x=\"200\" dy=\"12.81\">lipogénesis de novo<\/tspan><tspan x=\"200\" dy=\"12.81\">(SREBP-1c)<\/tspan><\/text><rect x=\"270\" y=\"60.03\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"332\" y=\"76.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Poca salida de<\/tspan><tspan x=\"332\" dy=\"12.81\">grasa (VLDL) y<\/tspan><tspan x=\"332\" dy=\"12.81\">β-oxidación<\/tspan><tspan x=\"332\" dy=\"12.81\">saturada<\/tspan><\/text><path d=\"M68 129.27 V140.27 H200 V151.27\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><path d=\"M200 129.27 V140.27 H200 V151.27\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><path d=\"M332 129.27 V140.27 H200 V151.27\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><rect x=\"50\" y=\"151.27\" width=\"300\" height=\"32.03\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"168.32\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Se acumulan triglicéridos: esteatosis (MASLD)<\/tspan><\/text><path d=\"M200 183.3 L200 205.3\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><rect x=\"50\" y=\"205.3\" width=\"300\" height=\"60.09\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"200\" y=\"222.35\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Lipotoxicidad: estrés del retículo, daño<\/tspan><tspan x=\"200\" dy=\"14.03\">mitocondrial y radicales libres → balonización<\/tspan><tspan x=\"200\" dy=\"14.03\">y apoptosis<\/tspan><\/text><path d=\"M200 265.39 L200 287.39\" class=\"fx-arr\" marker-end=\"url(#ahfp-masld)\"/><rect x=\"50\" y=\"287.39\" width=\"300\" height=\"60.09\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"200\" y=\"304.44\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Kupffer e inflamación (MASH) → células<\/tspan><tspan x=\"200\" dy=\"14.03\">estelares activadas → fibrosis → cirrosis y<\/tspan><tspan x=\"200\" dy=\"14.03\">CHC<\/tspan><\/text><\/svg><figcaption>Los triglicéridos son en parte una forma \"segura\" de guardar grasa; el daño lo hacen ácidos grasos libres, ceramidas, diacilgliceroles y colesterol libre.<\/figcaption><\/figure><h5>Genes que cambian el riesgo<\/h5><div class=\"tbl\"><table><thead><tr><th>Gen<\/th><th>Qué hace la variante<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>PNPLA3<\/strong> I148M<\/th><td>La proteína se queda pegada a las gotas de grasa y no las moviliza: más esteatosis, MASH, fibrosis y CHC<\/td><\/tr><tr><th scope=\"row\"><strong>TM6SF2<\/strong> E167K<\/th><td>Exporta menos VLDL: más grasa en el hígado, pero lípidos en sangre más bajos<\/td><\/tr><tr><th scope=\"row\"><strong>MBOAT7<\/strong> y <strong>GCKR<\/strong><\/th><td>Alteran el remodelado de fosfolípidos y la lipogénesis<\/td><\/tr><tr><th scope=\"row\"><strong>HSD17B13<\/strong> (pérdida de función)<\/th><td><strong>Protege<\/strong> contra MASH y fibrosis<\/td><\/tr><\/tbody><\/table><\/div><h5>Por qué es una enfermedad de todo el cuerpo<\/h5><ul><li>El hígado con grasa también es <strong>resistente a la insulina<\/strong>: produce más glucosa y empeora la diabetes tipo 2 (la relación va en los dos sentidos).<\/li><li>Libera lípidos aterogénicos y mediadores inflamatorios: la <strong>enfermedad cardiovascular<\/strong> es la primera causa de muerte.<\/li><li>La microbiota y el intestino permeable mandan endotoxinas por la vena porta y alimentan la inflamación.<\/li><\/ul><aside class=\"callout c-perla\"><div class=\"callout-h\"><span class=\"callout-k\">Perla<\/span><span class=\"callout-t\">Los fármacos atacan pasos de la cascada<\/span><\/div><p><strong>Resmetirom<\/strong> (agonista del receptor tiroideo β) aumenta la β-oxidación; los <strong>agonistas GLP-1<\/strong> bajan peso; la <strong>pioglitazona<\/strong> mejora la sensibilidad a la insulina (PPAR-γ).<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Gen más asociado a hígado graso progresivo&quot; → <strong>PNPLA3<\/strong> (polimorfismo I148M).<\/p><\/aside>"},{"t":"Cómo encontrar la MASH en riesgo: FIB-4, VCTE y ELF","h":"<h5>Paso 1: FIB-4 (sangre)<\/h5><div class=\"tbl\"><table><thead><tr><th>FIB-4<\/th><th>Riesgo de fibrosis avanzada<\/th><th>% de evaluados<\/th><th>Conducta<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><mark>&lt;1.30<\/mark><\/th><td><strong>Bajo<\/strong><\/td><td>≈50–70 %<\/td><td>Primer nivel; <strong>repetir FIB-4 cada 1–3 años<\/strong><\/td><\/tr><tr><th scope=\"row\"><mark>1.30–2.67<\/mark><\/th><td><strong>Indeterminado<\/strong><\/td><td>≈20–40 %<\/td><td><strong>VCTE<\/strong> u otra prueba (ELF)<\/td><\/tr><tr><th scope=\"row\"><mark>&gt;2.67<\/mark><\/th><td><strong>Alto<\/strong><\/td><td>≈5–10 %<\/td><td><strong>Hepatólogo<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">Mayores de 65 años<\/span><\/div><p>En <strong>&gt;65 años<\/strong> el corte de bajo riesgo es <strong>2.0<\/strong> (la edad infla el FIB-4).<\/p><\/aside><figure class=\"fig\" data-fig=\"masld-fib4\"><svg viewBox=\"0 0 400 420\" role=\"img\" aria-label=\"Algoritmo de FIB-4 y VCTE en MASLD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah21\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"40\" y=\"6\" width=\"320\" height=\"44\" rx=\"9\" style=\"fill:#C9970A;fill-opacity:0.13;stroke:#C9970A;stroke-width:1.5\"/><text x=\"200\" y=\"20.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">DM2, obesidad + ≥1 factor cardiometabólico o MASLD<\/tspan><tspan x=\"200\" dy=\"14.03\">con enzimas elevadas<\/tspan><\/text><path d=\"M200 50 L200 66\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><rect x=\"130\" y=\"66\" width=\"140\" height=\"30\" rx=\"9\" style=\"fill:#C9970A;fill-opacity:0.13;stroke:#C9970A;stroke-width:1.5\"/><text x=\"200\" y=\"81\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Calcular FIB-4<\/tspan><\/text><path d=\"M150 96 V112 H68 V130\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><path d=\"M200 96 L200 130\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><path d=\"M250 96 V112 H332 V130\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><rect x=\"6\" y=\"130\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"145.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">&lt;1.30 bajo (≈50–70<\/tspan><tspan x=\"68\" dy=\"14.03\">%)<\/tspan><\/text><rect x=\"138\" y=\"130\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"139.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">1.30–2.67<\/tspan><tspan x=\"200\" dy=\"13.42\">indeterminado<\/tspan><tspan x=\"200\" dy=\"13.42\">(≈20–40 %)<\/tspan><\/text><rect x=\"270\" y=\"130\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"145.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">&gt;2.67 alto (≈5–10<\/tspan><tspan x=\"332\" dy=\"14.03\">%)<\/tspan><\/text><path d=\"M68 176 L68 196\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><path d=\"M200 176 L200 196\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><path d=\"M332 176 L332 318\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><rect x=\"6\" y=\"196\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"211.16\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Primer nivel:<\/tspan><tspan x=\"68\" dy=\"13.42\">estilo de vida y<\/tspan><tspan x=\"68\" dy=\"13.42\">comorbilidades;<\/tspan><tspan x=\"68\" dy=\"13.42\">FIB-4 cada 1–3<\/tspan><tspan x=\"68\" dy=\"13.42\">años<\/tspan><\/text><rect x=\"138\" y=\"196\" width=\"124\" height=\"84\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"205.975\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">VCTE (o ELF) +<\/tspan><tspan x=\"200\" dy=\"12.81\">manejo<\/tspan><tspan x=\"200\" dy=\"12.81\">cardiometabólico<\/tspan><tspan x=\"200\" dy=\"12.81\">intensivo, GLP-1,<\/tspan><tspan x=\"200\" dy=\"12.81\">cirugía bariátrica<\/tspan><tspan x=\"200\" dy=\"12.81\">si aplica<\/tspan><\/text><path d=\"M170 280 V300 H120 V318\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><g><rect x=\"124.8\" y=\"291\" width=\"50.400000000000006\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"150\" y=\"300.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"150\" dy=\"0\">&lt;8 kPa<\/tspan><\/text><\/g><path d=\"M240 280 V300 H300 V318\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><g><rect x=\"236.8\" y=\"291\" width=\"50.400000000000006\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"262\" y=\"300.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"262\" dy=\"0\">≥8 kPa<\/tspan><\/text><\/g><rect x=\"6\" y=\"318\" width=\"170\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"91\" y=\"341\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"91\" dy=\"0\">Reevaluar FIB-4 en ≤1 año<\/tspan><\/text><rect x=\"230\" y=\"318\" width=\"164\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"312\" y=\"341\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"312\" dy=\"0\">Hepatólogo<\/tspan><\/text><path d=\"M312 364 L312 376\" class=\"fx-arr\" marker-end=\"url(#ah21)\"/><rect x=\"150\" y=\"376\" width=\"244\" height=\"40\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"272\" y=\"389.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"272\" dy=\"0\">MASH ≥F2, VCTE ≥8, MRE ≥3.1 kPa, ELF<\/tspan><tspan x=\"272\" dy=\"12.81\">≥10.5 → resmetirom u otros<\/tspan><\/text><\/svg><figcaption>Figura 3 de la revisión, simplificada. En <strong>&gt;65 años<\/strong> el corte de bajo riesgo de FIB-4 es <strong>2.0<\/strong>. El 20–30 % de quienes se hacen VCTE tiene <strong>≥8.0 kPa<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>FIB-4 <strong>alto<\/strong> (&gt;2.67) <strong>no<\/strong> pasa por VCTE en el algoritmo: va <strong>directo al hepatólogo<\/strong>. El indeterminado es el que necesita VCTE o ELF.<\/p><\/aside>"},{"t":"Estilo de vida y pérdida de peso","h":"<figure class=\"fig\" data-fig=\"masld-peso\"><svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Escalera de pérdida de peso en MASLD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah22\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"20\" y=\"150\" width=\"115\" height=\"50\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"77\" y=\"172\" font-size=\"15\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"77\" dy=\"0\">≥5 %<\/tspan><\/text><text x=\"77\" y=\"196\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"77\" dy=\"0\">Esteatosis<\/tspan><\/text><rect x=\"145\" y=\"100\" width=\"115\" height=\"100\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"202\" y=\"122\" font-size=\"15\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"202\" dy=\"0\">7–10 %<\/tspan><\/text><text x=\"202\" y=\"146\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"202\" dy=\"0\">Inflamación<\/tspan><tspan x=\"202\" dy=\"14.03\">(MASH)<\/tspan><\/text><rect x=\"270\" y=\"50\" width=\"115\" height=\"150\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"327\" y=\"72\" font-size=\"15\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"327\" dy=\"0\">≥10 %<\/tspan><\/text><text x=\"327\" y=\"96\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"327\" dy=\"0\">Fibrosis<\/tspan><\/text><text x=\"20\" y=\"18\" font-size=\"12\" text-anchor=\"start\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"20\" dy=\"0\">Pérdida de peso sostenida y lo que mejora<\/tspan><\/text><\/svg><figcaption>Metas de pérdida de peso con dieta y terapia conductual: <strong>5 → 7–10 → 10 %<\/strong>.<\/figcaption><\/figure><h5>La piedra angular<\/h5><div class=\"tbl\"><table><thead><tr><th>Pérdida de peso sostenida<\/th><th>Qué mejora<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><mark>≥5 %<\/mark><\/th><td><strong>Esteatosis<\/strong><\/td><\/tr><tr><th scope=\"row\"><mark>7–10 %<\/mark><\/th><td><strong>Inflamación<\/strong> (MASH)<\/td><\/tr><tr><th scope=\"row\"><mark>≥10 %<\/mark><\/th><td><strong>Fibrosis<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Memoriza la escalera <strong>5 → 7–10 → 10<\/strong>: grasa, inflamación, fibrosis. Una pregunta típica: &quot;¿Qué porcentaje de pérdida de peso se necesita para mejorar la fibrosis?&quot; → <strong>≥10 %<\/strong>.<\/p><\/aside>"},{"t":"Resmetirom","h":"<h5>MAESTRO-NASH (fase 3)<\/h5><div class=\"tbl\"><table><thead><tr><th>Desenlace<\/th><th>80 mg<\/th><th>100 mg<\/th><th>Placebo<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Resolución de MASH sin empeorar fibrosis<\/th><td><strong>25.9 %<\/strong><\/td><td><strong>29.9 %<\/strong><\/td><td>9.7 %<\/td><\/tr><tr><th scope=\"row\">Mejoría de fibrosis ≥1 estadio<\/th><td><strong>24.2 %<\/strong><\/td><td><strong>25.9 %<\/strong><\/td><td>14.2 %<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Resmetirom <strong>no<\/strong> baja de peso y <strong>no<\/strong> está aprobado en <strong>cirrosis<\/strong>. Su &quot;huella&quot; de laboratorio es la <strong>T4 libre baja con TSH normal<\/strong>.<\/p><\/aside>"},{"t":"Incretinas: GLP-1 y poliagonistas","h":"<h5>Por qué funcionan<\/h5><div class=\"tbl\"><table><thead><tr><th>Fármaco (receptores)<\/th><th>Ensayo<\/th><th>Resultado hepático principal<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Semaglutida<\/strong> 0.4 mg/día (GLP-1), fase 2b, 72 sem<\/th><td>320 pacientes<\/td><td>Resolución de MASH <strong>59 % vs 17 %<\/strong>; <strong>no<\/strong> redujo el estadio de fibrosis (43 % vs 33 %, P = 0.48); peso −13 %<\/td><\/tr><tr><th scope=\"row\"><mark><strong>Semaglutida 2.4 mg/semana<\/strong><\/mark> (GLP-1), fase 3 <strong>ESSENCE<\/strong> parte 1, 72 sem<\/th><td>800, F2–F3<\/td><td>Resolución de MASH <strong>62.9 % vs 34.3 %<\/strong>; mejoría de fibrosis <strong>37.0 % vs 22.4 %<\/strong>; ambas a la vez <strong>32.7 % vs 16.1 %<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Tirzepatida<\/strong> 5/10/15 mg/sem (GLP-1 + GIP), fase 2b SYNERGY-NASH, 52 sem<\/th><td>190, F2–F3<\/td><td>Resolución de MASH <strong>44/56/62 % vs 10 %<\/strong>; fibrosis <strong>55/51/51 % vs 30 %<\/strong>; peso hasta ≈−15 %<\/td><\/tr><tr><th scope=\"row\"><strong>Survodutida<\/strong> 2.4/4.8/6.0 mg/sem (GLP-1 + glucagón), fase 2b, 48 sem<\/th><td>293, F1–F3<\/td><td>Mejoría de MASH <strong>47/62/43 % vs 14 %<\/strong>; fibrosis 6.0 mg <strong>32 % vs 18 %<\/strong>; peso −10 a −15 %; suspensión por efectos adversos <strong>20 % vs 3 %<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Retatrutida<\/strong> 1/4/8/12 mg/sem (GLP-1 + GIP + glucagón), fase 2a, 48 sem<\/th><td>98, PDFF ≥10 %<\/td><td>Grasa hepática <strong>−51/−59/−82/−86 %<\/strong> vs −5 %; &gt;85 % resolvió la esteatosis con dosis altas<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La única dosis de incretina destacada por los autores es <strong>semaglutida 2.4 mg por semana<\/strong>. La tirzepatida es <strong>GLP-1 + GIP<\/strong>; la survodutida <strong>GLP-1 + glucagón<\/strong>; la retatrutida es el <strong>triple<\/strong> agonista.<\/p><\/aside>"},{"t":"Pioglitazona, lanifibranor, FGF21 e iSGLT2","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Pioglitazona y lanifibranor <strong>suben de peso<\/strong>; GLP-1, tirzepatida y survodutida <strong>bajan de peso<\/strong>; resmetirom y FGF21 son <strong>neutrales<\/strong>.<\/p><\/aside>"},{"t":"Cirrosis, combinaciones y preguntas abiertas","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Paciente con cirrosis compensada por MASH: ¿resmetirom?&quot; → <strong>No<\/strong>; está aprobado solo para MASH <strong>no cirrótica<\/strong> con fibrosis moderada a avanzada.<\/p><\/aside>"}],"pearls":["MASLD = esteatosis + <strong>≥1 de 5 rasgos cardiometabólicos<\/strong>, sin alcohol significativo ni otra causa secundaria.","Hasta <strong>38 %<\/strong> de los adultos del mundo tiene MASLD: es la hepatopatía crónica más común.","En diabetes tipo 2, la prevalencia de MASLD es <strong>65 %<\/strong> y la de MASH <strong>32 %<\/strong>.","La <strong>primera causa de muerte<\/strong> en MASLD es la <strong>enfermedad cardiovascular<\/strong>.","MASLD aumenta <strong>2.2×<\/strong> el riesgo de DM2 nueva (3.4× con enfermedad avanzada) y <strong>1.5×<\/strong> el de enfermedad cardiovascular.","El <strong>estadio de fibrosis<\/strong> (≥F2) es el mejor predictor de mortalidad y eventos hepáticos.","<strong>MASH en riesgo<\/strong> = MASH + fibrosis ≥F2; es la indicación de tratamiento farmacológico.","FIB-4: <strong>&lt;1.30<\/strong> bajo, <strong>1.30–2.67<\/strong> indeterminado, <strong>&gt;2.67<\/strong> alto; en <strong>&gt;65 años<\/strong> el corte bajo es <strong>2.0<\/strong>.","VCTE <strong>≥8.0 kPa<\/strong>, MRE <strong>≥3.1 kPa<\/strong> o ELF <strong>≥10.5<\/strong> indican alto riesgo → hepatólogo.","Pérdida de peso: <strong>≥5 %<\/strong> esteatosis, <strong>7–10 %<\/strong> inflamación, <strong>≥10 %<\/strong> fibrosis.","<strong>Resmetirom<\/strong> (THR-β, oral): primer fármaco aprobado (FDA, marzo 2024) para MASH <strong>no cirrótica<\/strong> F2–F3; baja T4 libre sin cambiar TSH.","<strong>Semaglutida 2.4 mg/semana<\/strong> (ESSENCE): resolución de MASH 62.9 % vs 34.3 %; fibrosis 37.0 % vs 22.4 %.","<strong>PNPLA3<\/strong> es la principal variante genética; la heredabilidad de MASLD es ≈50 %.","Incidencia de CHC: <strong>1.25/1000 personas-año<\/strong> en MASLD, <strong>≈20/1000<\/strong> en cirrosis por MASLD.","Pioglitazona y lanifibranor <strong>suben de peso<\/strong>; GLP-1 y poliagonistas <strong>bajan de peso<\/strong>; resmetirom y FGF21 son <strong>neutrales<\/strong>."],"comps":[{"title":"Resmetirom contra semaglutida 2.4 mg en MASH","cols":["Resmetirom","Semaglutida 2.4 mg"],"rows":[["Mecanismo","Agonista <strong>THR-β<\/strong> dirigido al hígado","Agonista del receptor de <strong>GLP-1<\/strong>"],["Vía y frecuencia","<strong>Oral<\/strong>, diario","<strong>Subcutánea<\/strong>, semanal"],["Ensayo pivote","<strong>MAESTRO-NASH<\/strong> (966, F1–F3, 52 semanas)","<strong>ESSENCE<\/strong> parte 1 (800, F2–F3, 72 semanas)"],["Resolución de MASH","<strong>25.9–29.9 %<\/strong> vs 9.7 %","<strong>62.9 %<\/strong> vs 34.3 %"],["Mejoría de fibrosis ≥1 estadio","<strong>24.2–25.9 %<\/strong> vs 14.2 %","<strong>37.0 %<\/strong> vs 22.4 %"],["Peso","<strong>Neutral<\/strong>","<strong>Baja<\/strong>"],["Glucemia y HbA1c","Neutral","Baja"],["Lípidos","Baja LDL, triglicéridos y <strong>Lp(a)<\/strong>","Baja lípidos"],["Efecto característico","<strong>T4 libre −15–20 %<\/strong> con TSH normal","Beneficio <strong>cardiovascular y renal<\/strong>"],["Efectos adversos","Náusea, diarrea","Náusea, diarrea, estreñimiento, vómito"],["Estatus","Aprobado (FDA, marzo 2024) en MASH <strong>no cirrótica<\/strong> F2–F3","Prometedor; ESSENCE parte 2 a 240 semanas"]],"key":"Resmetirom actúa <strong>directo en el hígado<\/strong> y no baja de peso; la semaglutida trata <strong>toda la disfunción metabólica<\/strong> (peso, glucosa, corazón y riñón)."}],"algos":[{"title":"Estratificación de fibrosis en MASLD","src":"Figura 3 del artículo","start":"a","nodes":{"a":{"q":"¿El paciente está en riesgo (DM2, obesidad + ≥1 factor cardiometabólico, o MASLD con enzimas elevadas)?","i":"","o":[["Sí","b"],["No","z"]]},"z":{"end":1,"tone":"ok","text":"Fuera de la ruta de búsqueda activa; atiende sus factores de riesgo†."},"b":{"q":"Calcula <strong>FIB-4<\/strong> (edad, AST, ALT, plaquetas). ¿Edad del paciente?","i":"","o":[["≤65 años","c"],["&gt;65 años","c65"]]},"c":{"q":"¿Cuánto da el FIB-4?","i":"","o":[["&lt;1.30","low"],["1.30–2.67","ind"],["&gt;2.67","hep"]]},"c65":{"q":"En &gt;65 años el corte de bajo riesgo es <strong>2.0<\/strong>. ¿Cuánto da el FIB-4?","i":"","o":[["&lt;2.0","low"],["2.0–2.67","ind"],["&gt;2.67","hep"]]},"low":{"end":1,"tone":"ok","text":"<strong>Bajo riesgo.<\/strong> Primer nivel: estilo de vida, tratar comorbilidades y <strong>repetir FIB-4 cada 1–3 años<\/strong>."},"ind":{"q":"<strong>Indeterminado.<\/strong> Haz <strong>VCTE<\/strong> (o ELF) e intensifica el manejo cardiometabólico (estilo de vida, GLP-1, cirugía bariátrica en seleccionados). ¿Rigidez?","i":"","o":[["&lt;8.0 kPa","re"],["≥8.0 kPa","hep"]]},"re":{"q":"Reevalúa <strong>FIB-4 en ≤1 año<\/strong>. ¿Resultado?","i":"","o":[["&lt;1.3","low"],["≥1.3","ind"]]},"hep":{"q":"<strong>Envío a hepatólogo.<\/strong> ¿Hay datos de MASH en riesgo (MASH + F ≥2, VCTE ≥8.0 kPa, MRE ≥3.1 kPa o ELF ≥10.5)?","i":"Resmetirom solo en MASH <strong>no cirrótica<\/strong> con fibrosis moderada a avanzada.","o":[["Sí, sin cirrosis","tx"],["Cirrosis","cirr"]]},"tx":{"end":1,"tone":"warn","text":"<strong>C
