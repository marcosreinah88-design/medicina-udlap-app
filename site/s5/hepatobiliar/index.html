itados: <strong>carbamazepina<\/strong> y <strong>ácido valproico<\/strong>."},{"q":"¿Qué porcentaje de pancreatitis aguda se atribuye a fármacos?","o":["~1 %","~5 %","~15 %","~25 %","~33 %"],"a":1,"e":"Los fármacos explican <strong>~5 %<\/strong>. Haz conciliación de medicamentos y pregunta por <strong>herbolaria<\/strong>."},{"q":"Hombre de 66 años con pancreatitis 2 días después de cirugía de derivación cardiopulmonar. ¿Qué mecanismo se propone?","o":["Isquémico","Viral","Autoinmune","Por hipertrigliceridemia","Por litos"],"a":0,"e":"La pancreatitis tras <strong>bypass cardiaco<\/strong> se considera <strong>isquémica<\/strong> y casi siempre mejora al mejorar la función cardiaca."},{"q":"¿Cuál es el evento celular inicial de la pancreatitis aguda?","o":["Activación de la lipasa en el duodeno","Alteración de la señalización intracelular de calcio en células acinares y ductales","Obstrucción de arteria pancreática","Infección bacteriana primaria","Depósito de IgG4"],"a":1,"e":"El detonante altera la <strong>señalización de calcio<\/strong>, desacopla estímulo y secreción; luego cae el ATP, falla la autofagia, se activa el inflamasoma y hay necrosis."},{"q":"¿Qué familia bacteriana de translocación se asocia con mayor gravedad?","o":["Bacteroidaceae","Lactobacillaceae","Enterococcidae","Clostridiaceae","Streptococcaceae"],"a":2,"e":"La revisión señala a las <strong>Enterococcidae<\/strong> como las más asociadas a enfermedad grave."},{"q":"Paciente con pancreatitis y falla respiratoria que persiste al cuarto día. ¿Cómo se clasifica según Atlanta revisada?","o":["Leve","Moderadamente grave","Moderada","Grave","Intersticial"],"a":3,"e":"<strong>Falla orgánica persistente (&gt;48 h)<\/strong> = <strong>grave<\/strong> (~10 % de los pacientes)."},{"q":"En la clasificación basada en determinantes, ¿qué define la categoría crítica?","o":["Necrosis estéril","Falla orgánica transitoria","Necrosis infectada y falla orgánica persistente","Necrosis infectada o falla orgánica persistente","Colección líquida aguda"],"a":2,"e":"<strong>Crítica:<\/strong> necrosis <strong>infectada y<\/strong> falla <strong>persistente<\/strong>. Grave es necrosis infectada <strong>o<\/strong> falla persistente."},{"q":"¿Cuál de estas NO es variable de BISAP?†","o":["BUN &gt;25 mg/dL","Alteración del estado mental","Edad &gt;60 años","Lipasa &gt;3× LSN","Derrame pleural"],"a":3,"e":"BISAP†: <strong>B<\/strong>UN, <strong>I<\/strong>mpaired mental status, <strong>S<\/strong>IRS, <strong>A<\/strong>ge &gt;60, <strong>P<\/strong>leural effusion. La cifra de lipasa <strong>no<\/strong> predice gravedad†."},{"q":"Hombre de 78 años con pancreatitis sin litos, sin alcohol y triglicéridos normales. ¿Qué es lo más importante descartar?","o":["Nada: el 90 % de los ancianos son idiopáticos","Fibrosis quística","Parotiditis","Picadura de alacrán","Tumor de cabeza de páncreas, fármacos y pancreatitis autoinmune"],"a":4,"e":"En ancianos hay <strong>30–40 % idiopática<\/strong>, pero hay riesgo de <strong>neoplasia<\/strong> que obstruye la cabeza del páncreas, <strong>polifarmacia<\/strong> y <strong>autoinmune<\/strong> (pide <strong>IgG4<\/strong>)."},{"q":"En un niño con sospecha de pancreatitis, ¿qué estudio de imagen es el preferido?","o":["TC con contraste","RM con gadolinio","CPRE","US transabdominal","Radiografía simple"],"a":3,"e":"Se prefiere el <strong>US transabdominal<\/strong> para <strong>evitar el contraste<\/strong>. Los criterios diagnósticos son los mismos que en adultos."},{"q":"Hombre de 70 kg con pancreatitis aguda de 6 horas. ¿Qué ritmo de líquidos recomienda la revisión en las primeras 24 h?","o":["1–2 mL/kg/h","15–20 mL/kg/h","Solo bolos de 2 L cada hora","Restringir líquidos","5–10 mL/kg/h"],"a":4,"e":"La revisión recomienda <strong>5–10 mL/kg/h<\/strong> en las primeras 24 h con metas de <strong>FC &lt;120<\/strong> y <strong>uresis &gt;0.5 mL/kg/h<\/strong>, evitando la sobrecarga."},{"q":"¿Qué solución IV se prefiere en la fase inicial?","o":["Ringer lactato","Solución salina 0.9 %","Glucosa al 5 %","Albúmina al 20 %","Hidroxietilalmidón"],"a":0,"e":"Un ensayo de <strong>40 pacientes<\/strong> (confirmado por otro más pequeño) favoreció <strong>Ringer lactato<\/strong> sobre salina."},{"q":"Paciente con pancreatitis y lesión renal aguda que pide analgesia. ¿Qué es lo más adecuado?","o":["Ketorolaco IV","Opioide","Ibuprofeno a dosis altas","Ningún analgésico para no enmascarar","Diclofenaco IM"],"a":1,"e":"Los <strong>opioides<\/strong> son seguros y eficaces; los <strong>AINE<\/strong> son alternativa pero <strong>se evitan si hay daño renal<\/strong>."},{"q":"Sobre combinar nutrición enteral y parenteral:","o":["Puede considerarse si la nutrición es insuficiente, pero no ha demostrado ser superior","Es superior a la enteral sola","Está contraindicada siempre","Reduce la mortalidad en 50 %","Es la primera elección"],"a":0,"e":"Los ensayos y metaanálisis <strong>no muestran superioridad<\/strong> sobre la vía oral o enteral."},{"q":"Paciente con pancreatitis necrosante, fiebre y gas dentro de la colección en la TC. ¿Qué conducta es la correcta?","o":["Necrosectomía abierta inmediata como primera opción","Antibióticos y drenaje endoscópico o percutáneo, con escalamiento si no mejora","Solo observación","Pancreatectomía total","CPRE con esfinterotomía"],"a":1,"e":"<strong>Gas = infección:<\/strong> acelerar el <strong>drenaje<\/strong> con <strong>antibióticos<\/strong> y escalar (necrosectomía) según evolución: <strong>step-up<\/strong>."},{"q":"¿Qué concluyó el estudio de 2019 sobre drenaje temprano contra tardío en necrosis infectada?","o":["Siempre drenar en las primeras 24 h","Nunca drenar antes de 12 semanas","El momento debe individualizarse según el estado clínico","El drenaje está contraindicado","El drenaje tardío aumenta la mortalidad al doble"],"a":2,"e":"La revisión resume que el <strong>momento<\/strong> del drenaje debe <strong>individualizarse<\/strong>."},{"q":"Paciente con necrosis pancreática del 60 % y esteatorrea. ¿Qué dosis inicial de pancrelipasa recomienda la revisión?","o":["5 000 U por comida","50 000 U por comida y la mitad por colación","10 000 U al día","500 000 U por comida","No requiere enzimas"],"a":1,"e":"Con <strong>necrosis &gt;50 %<\/strong> se requieren enzimas: <strong>mínimo 50 000 U de lipasa por comida<\/strong> y <strong>la mitad con colación<\/strong>, ajustando por esteatorrea."},{"q":"¿Qué porcentaje de pacientes presenta recurrencia tras el primer ataque?","o":["~5 %","~50 %","~20 %","~70 %","~90 %"],"a":2,"e":"<strong>~20 %<\/strong> recurre y <strong>la mitad<\/strong> de ellos desarrolla <strong>pancreatitis crónica<\/strong>."},{"q":"Paciente con pancreatitis por hipertrigliceridemia. ¿Cuál es la meta de triglicéridos?","o":["&lt;150 mg/dL obligatoriamente","&lt;2000 mg/dL","&lt;200 mg/dL en 24 h","&lt;1000 mg/dL, idealmente &lt;500 mg/dL","No hay meta"],"a":3,"e":"Al menos <strong>&lt;1000 mg/dL<\/strong> (ideal <strong>&lt;500<\/strong>): estilo de vida y omega-3, luego <strong>fibratos ± estatinas<\/strong>; <strong>plasmaféresis<\/strong> si es resistente."}],"tf":[["En la primera semana de la pancreatitis, la muerte se debe sobre todo a la necrosis infectada.",false,"En la fase temprana manda la respuesta inflamatoria sistémica con falla orgánica; la necrosis infectada es tardía."],["Lipasa al doble del LSN cumple el criterio enzimático de pancreatitis.",false,"Se requiere ≥3 veces el LSN."],["Los litos son la causa más común de pancreatitis aguda.",true,"~50 % en Occidente."],["El consumo bajo de alcohol protege de todos los episodios de pancreatitis.",false,"Podría proteger a no fumadores solo del primer episodio."],["La obesidad predice mayor gravedad.",true,"Por lipólisis de adipocitos en el páncreas y la grasa."],["La pancreatitis grave es la de falla orgánica persistente por más de 48 h.",true,"Atlanta revisada."],["En ancianos la pancreatitis idiopática es rara.",false,"Es de 30–40 %."],["La meta de SpO2 en EPOC es 94–99 %.",false,"En EPOC u obesidad mórbida es 88–92 %."],["Se prefiere solución salina sobre Ringer lactato.",false,"Se prefiere Ringer lactato."],["La necrosectomía abierta es el primer paso ante necrosis infectada.",false,"Primero drenaje mínimamente invasivo (step-up)."],["La elastasa fecal normal es &gt;200 µg/g.",true,"Hasta entonces se mantienen las enzimas en las formas moderadamente grave y grave."]]},{"id":"onco","n":11,"title":"Detección y referencia oportuna del cáncer gastrointestinal (AMG)","short":"Cáncer GI","color":"#4C5A73","src":"Remes-Troche JM, Cano-Contreras AD, Noble-Lugo A, et al. Posicionamiento de la Asociación Mexicana de Gastroenterología sobre detección y referencia oportuna del cáncer gastrointestinal (esófago, estómago y colon) en la atención primaria. Rev Gastroenterol Mex. 2026;91:410-27.","hook":"El médico de primer contacto decide cuánto tarda el diagnóstico: reconocer un dato de alarma y referir en el nivel correcto (urgente &lt;24 h, prioritaria ≤2 semanas, electiva ≤4–6 semanas) es lo que separa un cáncer temprano de uno avanzado.","group":"Oncología digestiva","ses":26,"date":"2026-11-18","nums":[["~19 %","de todos los tumores malignos registrados en México son del tracto gastrointestinal"],["11.0 → 6.8","mortalidad por cáncer gástrico por 100,000 (2000 → 2023)"],["61 %","de los cánceres de esófago debutan con disfagia"],["&lt;24 h · ≤2 sem · ≤4–6 sem","referencia urgente, prioritaria y electiva"],["1 de 10","cánceres de esófago o estómago pasaron inadvertidos en una endoscopia previa"],["~3 %","menos riesgo de cáncer de intervalo por cada 1 % más de tasa de detección de adenomas"]],"esencial":"<h3>Lo esencial en 14 viñetas<\/h3><ul><li>Documento de <strong>posicionamiento de la AMG<\/strong> (2026): <strong>20 especialistas<\/strong>, <strong>13 enunciados<\/strong> y <strong>3 algoritmos<\/strong> (esófago, estómago y colon) para el <strong>primer nivel de atención<\/strong>.<\/li><li>Los cánceres del tracto gastrointestinal son <strong>~19 %<\/strong> de todos los tumores malignos en México.<\/li><li>La mortalidad por cáncer gástrico bajó de <strong>11.0 a 6.8/100,000<\/strong> (2000–2023), pero el cáncer gástrico distal <strong>aumenta 1.3 % anual en menores de 50 años<\/strong>.<\/li><li>Pérdida de peso significativa = <strong>&gt;10 % en 6 meses<\/strong> (no intencionada): dato de alarma en los tres cánceres.<\/li><li><strong>Esófago:<\/strong> el dato de alarma más frecuente es la <mark>disfagia (61 %)<\/mark>; la <strong>disfagia progresiva<\/strong> tiene el mayor VPP.<\/li><li><strong>Adenocarcinoma de esófago (ACE):<\/strong> ERGE crónico, Barrett, obesidad, tabaquismo, sexo masculino. <strong>Carcinoma escamoso (CEE):<\/strong> tabaco, alcohol, <strong>mala salud oral<\/strong>, bebidas muy calientes.<\/li><li><strong>Estómago:<\/strong> dispepsia aislada <strong>no basta<\/strong>; la sospecha se basa en <strong>edad + datos de alarma + factores de riesgo<\/strong>.<\/li><li><strong>Riesgo alto de cáncer gástrico:<\/strong> <strong>&gt;50 años<\/strong> + familiar de primer grado con cáncer gástrico <strong>&lt;50 años<\/strong>, OLGA/OLGIM <strong>III/IV<\/strong>, anemia perniciosa, Ménétrier, MALT, <strong>CDH1/Lynch<\/strong>.<\/li><li><strong>Colon:<\/strong> rectorragia/hematoquecia, anemia ferropénica sin causa, <strong>cambio del hábito intestinal<\/strong>, masa u obstrucción.<\/li><li>Estudio de elección: <mark>EDA con biopsias<\/mark> (esófago y estómago) y <mark>colonoscopia<\/mark> (colon). <strong>No<\/strong> bario, TC ni marcadores tumorales como estudio inicial.<\/li><li><strong>Referencia urgente (&lt;24 h):<\/strong> sangrado con <strong>inestabilidad hemodinámica<\/strong>, obstrucción o <strong>intolerancia a la vía oral<\/strong>, sospecha de perforación, <strong>Hb &lt;8 g/dl<\/strong>.<\/li><li><strong>Prioritaria (≤2 semanas):<\/strong> pérdida de peso &gt;10 %, anemia ferropénica, sangrado oculto persistente, vómito recurrente, disfagia progresiva, masa palpable, reporte endoscópico de malignidad.<\/li><li><strong>Electiva (≤4–6 semanas):<\/strong> factores de riesgo y <strong>&gt;50 años con al menos un factor de riesgo<\/strong>.<\/li><li>El documento trata la <strong>sospecha clínica<\/strong>, no el <strong>tamizaje poblacional<\/strong> (donde se usa <strong>FIT<\/strong> y la colonoscopia confirma).<\/li><\/ul><figure class=\"fig\" data-fig=\"onco-niveles\"><svg viewBox=\"0 0 400 352\" role=\"img\" aria-label=\"Tres niveles de referencia\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah43\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"90\" y=\"6\" width=\"220\" height=\"34\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"200\" y=\"15.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Sospecha de cáncer GI en primer<\/tspan><tspan x=\"200\" dy=\"14.64\">nivel<\/tspan><\/text><path d=\"M150 40 L68 66\" class=\"fx-arr\" marker-end=\"url(#ah43)\"/><path d=\"M200 40 L200 66\" class=\"fx-arr\" marker-end=\"url(#ah43)\"/><path d=\"M250 40 L332 66\" class=\"fx-arr\" marker-end=\"url(#ah43)\"/><rect x=\"6\" y=\"66\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:1;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"81.375\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Urgente<\/tspan><tspan x=\"68\" dy=\"15.25\">&lt;24 horas<\/tspan><\/text><rect x=\"6\" y=\"120\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"138.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">HTDA o HTDB con<\/tspan><tspan x=\"68\" dy=\"13.42\">inestabilidad<\/tspan><\/text><rect x=\"6\" y=\"178\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"189.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Disfagia con<\/tspan><tspan x=\"68\" dy=\"13.42\">intolerancia a la<\/tspan><tspan x=\"68\" dy=\"13.42\">vía oral<\/tspan><\/text><rect x=\"6\" y=\"236\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"247.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Obstrucción o<\/tspan><tspan x=\"68\" dy=\"13.42\">sospecha de<\/tspan><tspan x=\"68\" dy=\"13.42\">perforación<\/tspan><\/text><rect x=\"6\" y=\"294\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"68\" y=\"319\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Hb &lt;8 g/dl<\/tspan><\/text><rect x=\"138\" y=\"66\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:1;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"81.375\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Prioritaria<\/tspan><tspan x=\"200\" dy=\"15.25\">≤2 semanas<\/tspan><\/text><rect x=\"138\" y=\"120\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"138.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Pérdida de peso<\/tspan><tspan x=\"200\" dy=\"13.42\">&gt;10 %<\/tspan><\/text><rect x=\"138\" y=\"178\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"203\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Anemia ferropénica<\/tspan><\/text><rect x=\"138\" y=\"236\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"254.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Sangrado oculto<\/tspan><tspan x=\"200\" dy=\"13.42\">persistente<\/tspan><\/text><rect x=\"138\" y=\"294\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"305.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Disfagia<\/tspan><tspan x=\"200\" dy=\"13.42\">progresiva, masa,<\/tspan><tspan x=\"200\" dy=\"13.42\">vómito recurrente<\/tspan><\/text><rect x=\"270\" y=\"66\" width=\"124\" height=\"46\" rx=\"9\" style=\"fill:#16834A;fill-opacity:1;stroke:#16834A;stroke-width:1.5\"/><text x=\"332\" y=\"81.375\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Electiva<\/tspan><tspan x=\"332\" dy=\"15.25\">≤4–6 semanas<\/tspan><\/text><rect x=\"270\" y=\"120\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"332\" y=\"145\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Factores de riesgo<\/tspan><\/text><rect x=\"270\" y=\"178\" width=\"124\" height=\"50\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"332\" y=\"196.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">&gt;50 años con ≥1<\/tspan><tspan x=\"332\" dy=\"13.42\">factor de riesgo<\/tspan><\/text><\/svg><figcaption>Figuras 1, 3 y 5 del posicionamiento: <strong>los mismos tiempos<\/strong> para esófago, estómago y colon.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Los tiempos de referencia son <strong>iguales para los tres órganos<\/strong>: urgente <strong>&lt;24 h<\/strong>, prioritaria <strong>≤2 semanas<\/strong>, electiva <strong>≤4–6 semanas<\/strong>. Lo que cambia es qué dato cae en cada nivel.<\/p><\/aside>","secs":[{"t":"Epidemiología en México y método del consenso","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">La mayoría de los factores de riesgo son modificables<\/span><\/div><p>Tabaco, alcohol, obesidad, dieta inadecuada, infecciones virales y bacterianas, y sedentarismo. No modificables: <strong>edad, sexo y etnia<\/strong>. Por eso la atención primaria tiene un enorme potencial preventivo.<\/p><\/aside><h5>Cómo se hizo<\/h5><div class=\"tbl\"><table><thead><tr><th>Enunciado<\/th><th>Tema<\/th><th>Acuerdo<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1<\/th><td>Alarma en esófago<\/td><td>Total 92.9 %, parcial 7.1 %<\/td><\/tr><tr><th scope=\"row\">2<\/th><td>Población de riesgo de esófago<\/td><td>Total 92.9 %, parcial 7.1 %<\/td><\/tr><tr><th scope=\"row\">3<\/th><td>Alarma esofágica → EDA<\/td><td>Total 100 %<\/td><\/tr><tr><th scope=\"row\">4<\/th><td>EDA con biopsias, estándar de oro (esófago)<\/td><td>Total 100 %<\/td><\/tr><tr><th scope=\"row\">5<\/th><td>Referencia estratificada (esófago)<\/td><td>Total 100 %<\/td><\/tr><tr><th scope=\"row\">6<\/th><td>Alarma en estómago<\/td><td>Total 78.6 %, parcial 21.4 %<\/td><\/tr><tr><th scope=\"row\">7<\/th><td>Estratificación de riesgo gástrico<\/td><td>Total 78.6 %, parcial 21.4 %<\/td><\/tr><tr><th scope=\"row\">8<\/th><td>EDA con biopsias sistemáticas (estómago)<\/td><td>Total 92.9 %, parcial 7.1 %<\/td><\/tr><tr><th scope=\"row\">9<\/th><td>Referencia estratificada (estómago)<\/td><td>Total 100 %<\/td><\/tr><tr><th scope=\"row\">10<\/th><td>Alarma en colon<\/td><td>Total 100 %<\/td><\/tr><tr><th scope=\"row\">11<\/th><td>Estratificación de riesgo colorrectal<\/td><td>Total 78.6 %, parcial 21.4 %<\/td><\/tr><tr><th scope=\"row\">12<\/th><td>Colonoscopia, estándar de oro<\/td><td>Total 92.9 %, parcial 7.1 %<\/td><\/tr><tr><th scope=\"row\">13<\/th><td>Referencia estratificada (colon)<\/td><td>Total 78.6 %, parcial 21.4 %<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El documento no es una guía de <strong>tamizaje poblacional<\/strong>: orienta al médico de primer contacto ante la <strong>sospecha clínica<\/strong> (datos de alarma, riesgo y referencia).<\/p><\/aside>"},{"t":"Fisiopatología: cómo se forma el cáncer gastrointestinal","h":"<div data-fp=\"onco\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Un camino lento que se puede interrumpir<\/span><\/div><p>Los cánceres de esófago, estómago y colon casi siempre pasan por <strong>lesiones precursoras<\/strong> durante años: metaplasia, displasia o adenoma. Por eso sirve buscar a la población de riesgo y hacer endoscopia temprana: se puede quitar la lesión antes de que sea cáncer.<\/p><\/aside><figure class=\"fig\" data-fig=\"onco-fp\"><svg viewBox=\"0 0 400 290.91\" role=\"img\" aria-label=\"Lesiones precursoras del cáncer de esófago, estómago y colon\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-onco\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"6\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"68\" y=\"22.35\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Esófago: ERGE<\/tspan><tspan x=\"68\" dy=\"12.81\">crónica<\/tspan><\/text><rect x=\"138\" y=\"6\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"28.755\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Estómago: H. pylori<\/tspan><\/text><rect x=\"270\" y=\"6\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"332\" y=\"22.35\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Colon: mucosa<\/tspan><tspan x=\"332\" dy=\"12.81\">normal<\/tspan><\/text><path d=\"M68 49.62 L68 71.62\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><path d=\"M200 49.62 L200 71.62\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><path d=\"M332 49.62 L332 71.62\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><rect x=\"6\" y=\"71.62\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"68\" y=\"94.375\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Esófago de Barrett<\/tspan><tspan x=\"68\" dy=\"12.81\">(metaplasia<\/tspan><tspan x=\"68\" dy=\"12.81\">intestinal)<\/tspan><\/text><rect x=\"138\" y=\"71.62\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"87.97\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Gastritis crónica →<\/tspan><tspan x=\"200\" dy=\"12.81\">atrofia →<\/tspan><tspan x=\"200\" dy=\"12.81\">metaplasia<\/tspan><tspan x=\"200\" dy=\"12.81\">intestinal<\/tspan><\/text><rect x=\"270\" y=\"71.62\" width=\"124\" height=\"69.24\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"332\" y=\"100.78\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Adenoma (mutación<\/tspan><tspan x=\"332\" dy=\"12.81\">de APC)<\/tspan><\/text><path d=\"M68 140.86 L68 162.86\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><path d=\"M200 140.86 L200 162.86\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><path d=\"M332 140.86 L332 162.86\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><rect x=\"6\" y=\"162.86\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"68\" y=\"179.21\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Displasia de bajo y<\/tspan><tspan x=\"68\" dy=\"12.81\">alto grado<\/tspan><\/text><rect x=\"138\" y=\"162.86\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"185.615\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Displasia<\/tspan><\/text><rect x=\"270\" y=\"162.86\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"332\" y=\"179.21\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Adenoma avanzado<\/tspan><tspan x=\"332\" dy=\"12.81\">(KRAS)<\/tspan><\/text><path d=\"M68 206.48 L68 228.48\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><path d=\"M200 206.48 L200 228.48\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><path d=\"M332 206.48 L332 228.48\" class=\"fx-arr\" marker-end=\"url(#ahfp-onco)\"/><rect x=\"6\" y=\"228.48\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"68\" y=\"251.235\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Adenocarcinoma de<\/tspan><tspan x=\"68\" dy=\"12.81\">esófago<\/tspan><\/text><rect x=\"138\" y=\"228.48\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"200\" y=\"244.83\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Adenocarcinoma<\/tspan><tspan x=\"200\" dy=\"12.81\">gástrico tipo<\/tspan><tspan x=\"200\" dy=\"12.81\">intestinal<\/tspan><\/text><rect x=\"270\" y=\"228.48\" width=\"124\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"332\" y=\"251.235\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Carcinoma<\/tspan><tspan x=\"332\" dy=\"12.81\">colorrectal (TP53)<\/tspan><\/text><\/svg><figcaption>La columna del estómago es la <strong>cascada de Correa<\/strong>; la del colon, la <strong>secuencia adenoma-carcinoma<\/strong> (unos 10 años), que es la razón de la colonoscopia de tamizaje.<\/figcaption><\/figure><h5>Las otras vías<\/h5><ul><li><strong>Esófago escamoso:<\/strong> tabaco, alcohol, bebidas muy calientes, acalasia y cáusticos irritan el epitelio escamoso → displasia → carcinoma epidermoide (tercio medio y superior).<\/li><li><strong>Estómago difuso:<\/strong> pérdida de la <strong>E-cadherina<\/strong> (<em>CDH1<\/em>): las células se sueltan y crecen en \"anillo de sello\" sin formar glándulas; no sigue la cascada de Correa.<\/li><li><strong>Colon por inestabilidad de microsatélites:<\/strong> fallan los genes de reparación (MLH1, MSH2, MSH6, PMS2): síndrome de <strong>Lynch<\/strong>, o MLH1 apagado por metilación en casos esporádicos.<\/li><li><strong>Vía serrada:<\/strong> pólipos serrados con mutación de <strong>BRAF<\/strong> y metilación (CIMP), más en colon derecho.<\/li><\/ul><h5>Por qué aparecen los datos de alarma<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">El tumor estrecha la luz del esófago<\/th><td>Disfagia progresiva: primero a sólidos y luego a líquidos<\/td><\/tr><tr><th scope=\"row\">Sangrado crónico de la mucosa tumoral<\/th><td>Anemia por deficiencia de hierro, sangre oculta en heces<\/td><\/tr><tr><th scope=\"row\">Estrechamiento del colon<\/th><td>Cambio en el hábito intestinal, heces delgadas, obstrucción<\/td><\/tr><tr><th scope=\"row\">Citocinas tumorales (TNF-α, IL-6) y poca ingesta<\/th><td>Pérdida de peso y anorexia<\/td><\/tr><tr><th scope=\"row\">Tumor del antro o del píloro<\/th><td>Saciedad temprana y vómito<\/td><\/tr><\/tbody><\/table><\/div><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Esófago: datos de alarma (enunciado 1)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 1<\/span><\/div><p>Los datos clínicos de alarma más frecuentemente asociados con cáncer de esófago son la <strong>disfagia<\/strong>, <strong>pérdida de peso no intencionada (&gt;10 % en 6 meses)<\/strong>, <strong>hemorragia del tubo digestivo alto<\/strong> (hematemesis/melena) y <strong>vómitos persistentes<\/strong>. <em>Totalmente de acuerdo 92.9 %, parcialmente 7.1 %.<\/em><\/p><\/aside><h5>Fuerza de asociación (estudio multicéntrico, cáncer del tubo digestivo alto)<\/h5><div class=\"tbl\"><table><thead><tr><th>Síntoma<\/th><th>RM (IC 95 %)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Disfagia<\/th><td><strong>5<\/strong> (3.88–7.33)<\/td><\/tr><tr><th scope=\"row\">Vómito persistente<\/th><td><strong>6.27<\/strong> (2.96–13.28)<\/td><\/tr><tr><th scope=\"row\">Pérdida de peso no intencionada<\/th><td><strong>2.55<\/strong> (1.49–4.36)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El síntoma <strong>más frecuente<\/strong> es la disfagia; el de <strong>mayor RM<\/strong> en ese estudio fue el <strong>vómito persistente (6.27)<\/strong>; el de <strong>mayor VPP<\/strong> es la <strong>disfagia progresiva<\/strong>.<\/p><\/aside>"},{"t":"Esófago: población de riesgo (enunciado 2)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 2<\/span><\/div><p>La población en riesgo se determina según el subtipo. <strong>2.1 Adenocarcinoma:<\/strong> reflujo gastroesofágico crónico, <strong>esófago de Barrett<\/strong>, obesidad, tabaquismo y sexo masculino. <strong>2.2 Carcinoma escamoso:<\/strong> tabaquismo, alcohol, <strong>mala salud oral<\/strong> y exposición a agentes <strong>térmicos o químicos<\/strong>. <em>Totalmente de acuerdo 92.9 %, parcialmente 7.1 %.<\/em><\/p><\/aside><figure class=\"fig\" data-fig=\"onco-eso-sub\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Adenocarcinoma contra carcinoma escamoso de esófago\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah44\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"6\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:1;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"100\" y=\"26\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Adenocarcinoma (ACE)<\/tspan><\/text><rect x=\"206\" y=\"6\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:1;stroke:#D3335B;stroke-width:1.5\"/><text x=\"300\" y=\"26\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Carcinoma escamoso (CEE)<\/tspan><\/text><rect x=\"6\" y=\"56\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"100\" y=\"76\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">ERGE crónico (&gt;5 años)<\/tspan><\/text><rect x=\"6\" y=\"104\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"100\" y=\"124\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Esófago de Barrett<\/tspan><\/text><rect x=\"6\" y=\"152\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"100\" y=\"164.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Obesidad (IMC &gt;30),<\/tspan><tspan x=\"100\" dy=\"14.03\">adiposidad central<\/tspan><\/text><rect x=\"6\" y=\"200\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"100\" y=\"220\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Tabaquismo · sexo masculino<\/tspan><\/text><rect x=\"206\" y=\"56\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"300\" y=\"76\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Mala salud bucal: 37 %<\/tspan><\/text><rect x=\"206\" y=\"104\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"300\" y=\"116.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Tabaco 18 % · tabaco +<\/tspan><tspan x=\"300\" dy=\"14.03\">alcohol 18 %<\/tspan><\/text><rect x=\"206\" y=\"152\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"300\" y=\"172\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Bebidas muy calientes 16 %<\/tspan><\/text><rect x=\"206\" y=\"200\" width=\"188\" height=\"40\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"300\" y=\"212.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Acalasia (×50), tilosis,<\/tspan><tspan x=\"300\" dy=\"14.03\">cáusticos, VPH<\/tspan><\/text><rect x=\"6\" y=\"254\" width=\"388\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"266.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Ambos: disfagia progresiva → referencia prioritaria a EDA<\/tspan><tspan x=\"200\" dy=\"14.64\">con biopsias<\/tspan><\/text><\/svg><figcaption>Enunciado 2: la <strong>población de riesgo<\/strong> se define por subtipo. Porcentajes = fracción atribuible poblacional del CEE.<\/figcaption><\/figure><h5>Carcinoma escamoso (CEE)<\/h5><div class=\"tbl\"><table><thead><tr><th>Factor<\/th><th>Casos atribuibles<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Mala salud bucal<\/strong><\/th><td><strong>37 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Tabaquismo<\/th><td>18 %<\/td><\/tr><tr><th scope=\"row\">Tabaco + alcohol combinados<\/th><td>18 %<\/td><\/tr><tr><th scope=\"row\">Alimentos y bebidas muy calientes<\/th><td>16 %<\/td><\/tr><tr><th scope=\"row\">Alcohol<\/th><td>12 %<\/td><\/tr><tr><th scope=\"row\">Hidrocarburos aromáticos policíclicos<\/th><td>12 %<\/td><\/tr><tr><th scope=\"row\">Frutas y verduras<\/th><td><strong>−12 %<\/strong> (protector)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>En la fracción atribuible del CEE, el factor más grande <strong>no es el tabaco<\/strong>: es la <strong>mala salud bucal (37 %)<\/strong>.<\/p><\/aside>"},{"t":"Esófago: endoscopia y referencia (enunciados 3–5)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciados 3 y 4<\/span><\/div><p><strong>3.<\/strong> Ante datos de alarma por sospecha de cáncer esofágico, el médico de primer contacto debe <strong>remitir para endoscopia digestiva alta<\/strong>. <em>Total 100 %.<\/em> <strong>4.<\/strong> La <strong>EDA con toma de biopsias<\/strong> es el <strong>estándar de oro<\/strong> para detectar cáncer de esófago, sobre todo en población de alto riesgo. <em>Total 100 %.<\/em><\/p><\/aside><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 5: referencia estratificada (Figura 1)<\/span><\/div><p><em>Total 100 %.<\/em><\/p><ul><li><strong>Urgente (&lt;24 h):<\/strong> <strong>HTDA con inestabilidad hemodinámica<\/strong> o <strong>disfagia con intolerancia a la vía oral<\/strong>.<\/li><li><strong>Prioritaria (≤2 semanas):<\/strong> pérdida de peso &gt;10 %, anemia ferropénica, sangrado oculto persistente, vómito recurrente, <strong>disfagia progresiva<\/strong>.<\/li><li><strong>Electiva (≤4–6 semanas):<\/strong> pacientes con factores de riesgo y sujetos <strong>&gt;50 años con al menos un factor de riesgo<\/strong>.<\/li><\/ul><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Disfagia <strong>progresiva<\/strong> = prioritaria. Disfagia con <strong>intolerancia a la vía oral<\/strong> = <strong>urgente<\/strong>. No pidas esofagograma &quot;para ver primero&quot;: refiere a EDA.<\/p><\/aside>"},{"t":"Estómago: datos de alarma (enunciado 6)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 6<\/span><\/div><p>Datos de alarma más asociados con cáncer gástrico: <strong>pérdida de peso no intencionada (&gt;10 % en 6 meses)<\/strong>, <strong>HTDA<\/strong> (hematemesis/melena), <strong>anemia ferropénica de causa no identificable<\/strong>, <strong>vómitos persistentes<\/strong> y <strong>masa palpable en epigastrio<\/strong>. <em>Totalmente de acuerdo 78.6 %, parcialmente 21.4 %.<\/em><\/p><\/aside><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">La dispepsia sola no es alarma<\/span><\/div><p>La dispepsia es muy prevalente y poco específica; la mayoría es funcional o benigna. La sospecha se basa en la <strong>combinación de edad, síntomas de alarma y factores de riesgo<\/strong>, no en la dispepsia <em>per se<\/em>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Plaquetas <strong>&gt;450,000/µl<\/strong> sin explicación en un paciente dispéptico = evalúa cáncer gástrico o esofágico.<\/p><\/aside>"},{"t":"Estómago: estratificación de riesgo (enunciado 7)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 7: población en riesgo en México<\/span><\/div><p><em>Totalmente de acuerdo 78.6 %, parcialmente 21.4 %.<\/em> <strong>7.1 Riesgo alto:<\/strong> <mark>edad &gt;50 años con uno o más<\/mark> de: a) familiar de primer grado con cáncer gástrico <strong>&lt;50 años<\/strong>; b) lesiones premalignas (atrofia, displasia o metaplasia extensa, <strong>OLGA/OLGIM III/IV<\/strong>); c) <em>H. pylori<\/em> con alguna lesión de b); d) <strong>anemia perniciosa<\/strong>; e) <strong>enfermedad de Ménétrier<\/strong>; f) <strong>linfoma tipo MALT<\/strong>; g) síndromes hereditarios (<strong>CDH1/Lynch<\/strong>). <strong>7.2 Riesgo moderado:<\/strong> a) <em>H. pylori<\/em> <strong>sin<\/strong> lesiones premalignas; b) lesiones premalignas <strong>limitadas<\/strong>; c) tabaquismo; d) alcohol; e) dieta elevada en <strong>sal y nitritos<\/strong>; f) obesidad; g) familiar de primer grado con cáncer gástrico <strong>&gt;50 años<\/strong>.<\/p><\/aside><figure class=\"fig\" data-fig=\"onco-gas-riesgo\"><svg viewBox=\"0 0 400 388\" role=\"img\" aria-label=\"Estratificación de riesgo de cáncer gástrico\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah45\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"4\" y=\"6\" width=\"74\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"41\" y=\"19.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"41\" dy=\"0\">Gastritis<\/tspan><tspan x=\"41\" dy=\"12.81\">crónica<\/tspan><\/text><rect x=\"83\" y=\"6\" width=\"74\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"120\" y=\"26\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"120\" dy=\"0\">Atrofia<\/tspan><\/text><path d=\"M78 26 L83 26\" class=\"fx-arr\" marker-end=\"url(#ah45)\"/><rect x=\"162\" y=\"6\" width=\"74\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"199\" y=\"26\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"199\" dy=\"0\">Metaplasia<\/tspan><\/text><path d=\"M157 26 L162 26\" class=\"fx-arr\" marker-end=\"url(#ah45)\"/><rect x=\"241\" y=\"6\" width=\"74\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"278\" y=\"26\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"278\" dy=\"0\">Displasia<\/tspan><\/text><path d=\"M236 26 L241 26\" class=\"fx-arr\" marker-end=\"url(#ah45)\"/><rect x=\"320\" y=\"6\" width=\"74\" height=\"40\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"357\" y=\"26\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"357\" dy=\"0\">Cáncer<\/tspan><\/text><path d=\"M315 26 L320 26\" class=\"fx-arr\" marker-end=\"url(#ah45)\"/><text x=\"200\" y=\"60\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Cascada de Correa (H. pylori)<\/tspan><\/text><rect x=\"6\" y=\"76\" width=\"388\" height=\"30\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:1;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"91\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">RIESGO ALTO: &gt;50 años + uno o más de:<\/tspan><\/text><rect x=\"6\" y=\"112\" width=\"192\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"102\" y=\"122.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102\" dy=\"0\">Familiar 1.er grado con CG &lt;50<\/tspan><tspan x=\"102\" dy=\"13.42\">años<\/tspan><\/text><rect x=\"202\" y=\"112\" width=\"192\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"298\" y=\"129\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298\" dy=\"0\">OLGA/OLGIM III/IV<\/tspan><\/text><rect x=\"6\" y=\"152\" width=\"192\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"102\" y=\"169\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102\" dy=\"0\">H. pylori + lesiones III/IV<\/tspan><\/text><rect x=\"202\" y=\"152\" width=\"192\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"298\" y=\"169\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298\" dy=\"0\">Anemia perniciosa<\/tspan><\/text><rect x=\"6\" y=\"192\" width=\"192\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"102\" y=\"209\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102\" dy=\"0\">Ménétrier · linfoma MALT<\/tspan><\/text><rect x=\"202\" y=\"192\" width=\"192\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"298\" y=\"209\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298\" dy=\"0\">CDH1 / Lynch<\/tspan><\/text><rect x=\"6\" y=\"236\" width=\"388\" height=\"30\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:1;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"251\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">RIESGO MODERADO<\/tspan><\/text><rect x=\"6\" y=\"272\" width=\"192\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"102\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102\" dy=\"0\">H. pylori sin lesiones<\/tspan><\/text><rect x=\"202\" y=\"272\" width=\"192\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"298\" y=\"288\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298\" dy=\"0\">Lesiones limitadas<\/tspan><\/text><rect x=\"6\" y=\"310\" width=\"192\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"102\" y=\"326\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102\" dy=\"0\">Tabaco · alcohol<\/tspan><\/text><rect x=\"202\" y=\"310\" width=\"192\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"298\" y=\"326\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298\" dy=\"0\">Sal y nitritos · obesidad<\/tspan><\/text><rect x=\"6\" y=\"348\" width=\"192\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"102\" y=\"364\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102\" dy=\"0\">Familiar con CG &gt;50 años<\/tspan><\/text><rect x=\"202\" y=\"348\" width=\"192\" height=\"32\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"298\" y=\"357.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298\" dy=\"0\">Sídney: 2 antro + 2 cuerpo + 1<\/tspan><tspan x=\"298\" dy=\"13.42\">incisura<\/tspan><\/text><\/svg><figcaption>Enunciado 7 del posicionamiento AMG. El <strong>familiar &lt;50 años<\/strong> y <strong>OLGA/OLGIM III/IV<\/strong> separan alto de moderado.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El familiar con cáncer gástrico <strong>&lt;50 años<\/strong> es riesgo <strong>alto<\/strong>; si se diagnosticó <strong>&gt;50 años<\/strong>, es riesgo <strong>moderado<\/strong>. <em>H. pylori<\/em> <strong>solo<\/strong> = moderado; <em>H. pylori<\/em> <strong>con OLGA/OLGIM III/IV<\/strong> = alto.<\/p><\/aside>"},{"t":"Estómago: endoscopia y referencia (enunciados 8–9)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 8<\/span><\/div><p>La <strong>EDA con toma sistemática de biopsias<\/strong> es el estudio primario de elección para la detección temprana del cáncer gástrico, tanto en sintomáticos como en personas con riesgo elevado. <em>Total 92.9 %, parcial 7.1 %.<\/em><\/p><\/aside><h5>Lo que NO sustituye a la EDA<\/h5><div class=\"tbl\"><table><thead><tr><th>Estudio<\/th><th>Papel<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">TC y ultrasonido endoscópico<\/th><td><strong>Estadificación<\/strong>; menos sensibles para lesiones tempranas<\/td><\/tr><tr><th scope=\"row\">Pepsinógenos, anti-<em>H. pylori<\/em>, gastrina-17<\/th><td>Estratificación o triaje para decidir quién necesita EDA; bajo rendimiento para cáncer<\/td><\/tr><tr><th scope=\"row\"><strong>ACE y CA 19-9<\/strong><\/th><td><mark>No se recomiendan<\/mark>: sensibilidad <strong>&lt;50 %<\/strong><\/td><\/tr><tr><th scope=\"row\">PET-CT con 18F-FDG<\/th><td>Cambia la etapa en <strong>~10 %<\/strong>; baja sensibilidad para <strong>carcinomatosis peritoneal<\/strong> y tumores poco ávidos de glucosa (<strong>células en anillo de sello<\/strong>)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 9: referencia estratificada (Figura 3)<\/span><\/div><p><em>Total 100 %.<\/em><\/p><ul><li><strong>Urgente (&lt;24 h):<\/strong> <strong>HTDA con inestabilidad hemodinámica<\/strong>, <strong>obstrucción gástrica con vómitos persistentes<\/strong>, <strong>dolor abdominal intenso con sospecha de perforación<\/strong> y <strong>síndrome anémico severo (Hb &lt;8 g/dl)<\/strong>.<\/li><li><strong>Prioritaria (≤2 semanas):<\/strong> pérdida de peso &gt;10 %, anemia ferropénica, sangrado oculto persistente, vómito recurrente, <strong>masa palpable en epigastrio<\/strong>, <strong>reporte endoscópico de malignidad<\/strong>, <strong>gastritis atrófica extensa con metaplasia intestinal<\/strong>.<\/li><li><strong>Electiva (≤4–6 semanas):<\/strong> factores de riesgo y <strong>&gt;50 años con al menos un factor de riesgo<\/strong>.<\/li><\/ul><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>gastritis atrófica extensa con metaplasia intestinal<\/strong> no es urgencia, pero <strong>sí es referencia prioritaria (≤2 semanas)<\/strong> en el algoritmo gástrico.<\/p><\/aside>"},{"t":"Colon: datos de alarma (enunciado 10)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 10<\/span><\/div><p>Datos de alarma más asociados con cáncer colorrectal (CCR): <strong>hemorragia de tubo digestivo bajo<\/strong> (rectorragia y/o hematoquecia), <strong>pérdida de peso no intencionada (&gt;10 % en 6 meses)<\/strong>, <strong>anemia ferropénica de causa no identificable<\/strong>, <strong>cambio del hábito intestinal y/o dolor abdominal persistente con pérdida de peso<\/strong>, <strong>masa rectal-abdominal<\/strong> o <strong>datos de obstrucción<\/strong>. <em>Totalmente de acuerdo 100 %.<\/em><\/p><\/aside><aside class=\"callout c-perla\"><div class=\"callout-h\"><span class=\"callout-k\">Perla clínica<\/span><span class=\"callout-t\">El joven con rectorragia<\/span><\/div><p>Atribuir el sangrado a &quot;hemorroides&quot; sin estudiar es la oportunidad diagnóstica perdida típica del <strong>CCR de inicio temprano<\/strong>. La edad joven no descarta.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El síntoma más frecuente en el CCR de inicio temprano es la <strong>hematoquecia (45 %)<\/strong>, y es también el de mayor razón de momios.<\/p><\/aside>"},{"t":"Colon: estratificación de riesgo (enunciado 11)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 11: población en riesgo de CCR en México<\/span><\/div><p><em>Totalmente de acuerdo 78.6 %, parcialmente 21.4 %.<\/em> <strong>11.1 Riesgo alto:<\/strong> a) antecedente <strong>personal<\/strong> de CCR o lesiones premalignas del colon; b) <strong>familiares de primer grado con CCR<\/strong> y síndromes hereditarios (<strong>Lynch<\/strong>, <strong>poliposis adenomatosa familiar<\/strong>); c) <strong>enfermedad inflamatoria intestinal de larga evolución<\/strong>; d) antecedente de <strong>radiación pélvica<\/strong>. <strong>11.2 Riesgo moderado:<\/strong> <mark>edad &gt;50 años con al menos un factor:<\/mark> dieta rica en <strong>carnes rojas y procesadas<\/strong> y baja en fibra, frutas y verduras; <strong>sedentarismo<\/strong>; <strong>tabaquismo<\/strong>; <strong>alcohol<\/strong> excesivo; <strong>síndrome metabólico<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>En colon, el <strong>antecedente familiar de primer grado<\/strong> ya es <strong>riesgo alto<\/strong> (no depende de la edad del familiar, a diferencia del estómago).<\/p><\/aside>"},{"t":"Colon: colonoscopia, calidad y referencia (enunciados 12–13)","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 12<\/span><\/div><p>La <strong>colonoscopia<\/strong> es el estudio de referencia y <strong>estándar de oro<\/strong> para el diagnóstico de CCR: permite ver la mucosa, <strong>tomar biopsias<\/strong> y <strong>resecar la mayoría de los pólipos<\/strong> en el mismo procedimiento. <em>Total 92.9 %, parcial 7.1 %.<\/em><\/p><\/aside><figure class=\"fig\" data-fig=\"onco-ccr-calidad\"><svg viewBox=\"0 0 400 286\" role=\"img\" aria-label=\"Indicadores de calidad de la colonoscopia\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah46\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"80\" y=\"6\" width=\"240\" height=\"34\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:1;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"200\" y=\"23\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Colonoscopia de calidad<\/tspan><\/text><rect x=\"6\" y=\"52\" width=\"125\" height=\"64\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"68.5\" y=\"70.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68.5\" dy=\"0\">Boston &gt;2<\/tspan><tspan x=\"68.5\" dy=\"13.42\">en cada uno de 3<\/tspan><tspan x=\"68.5\" dy=\"13.42\">segmentos<\/tspan><\/text><rect x=\"137\" y=\"52\" width=\"125\" height=\"64\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"199.5\" y=\"77.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"199.5\" dy=\"0\">Intubación cecal<\/tspan><tspan x=\"199.5\" dy=\"13.42\">documentada<\/tspan><\/text><rect x=\"268\" y=\"52\" width=\"125\" height=\"64\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"330.5\" y=\"77.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330.5\" dy=\"0\">Retirada &gt;8 min<\/tspan><tspan x=\"330.5\" dy=\"13.42\">sin resección<\/tspan><\/text><rect x=\"6\" y=\"126\" width=\"125\" height=\"64\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"68.5\" y=\"151.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68.5\" dy=\"0\">TDA &gt;35 %<\/tspan><tspan x=\"68.5\" dy=\"13.42\">&gt;40 % en hombres<\/tspan><\/text><rect x=\"137\" y=\"126\" width=\"125\" height=\"64\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"199.5\" y=\"151.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"199.5\" dy=\"0\">Serradas &gt;6 %<\/tspan><tspan x=\"199.5\" dy=\"13.42\">tasa de detección<\/tspan><\/text><rect x=\"268\" y=\"126\" width=\"125\" height=\"64\" rx=\"9\" style=\"fill:#4C5A73;fill-opacity:0.13;stroke:#4C5A73;stroke-width:1.5\"/><text x=\"330.5\" y=\"144.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330.5\" dy=\"0\">Fotos y competencia<\/tspan><tspan x=\"330.5\" dy=\"13.42\">documentación<\/tspan><tspan x=\"330.5\" dy=\"13.42\">estándar<\/tspan><\/text><rect x=\"6\" y=\"206\" width=\"190\" height=\"74\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"101\" y=\"235.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">Cánceres de intervalo: 4–8 %<\/tspan><tspan x=\"101\" dy=\"14.03\">de todos los CCR<\/tspan><\/text><rect x=\"204\" y=\"206\" width=\"190\" height=\"74\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"299\" y=\"235.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">+1 % de TDA → ~3 % menos<\/tspan><tspan x=\"299\" dy=\"14.03\">cáncer de intervalo<\/tspan><\/text><\/svg><figcaption>Enunciado 12: una colonoscopia subóptima deja <strong>lesiones pasadas por alto<\/strong> y <strong>cánceres de intervalo<\/strong>.<\/figcaption><\/figure><h5>Otros estudios<\/h5><div class=\"tbl\"><table><thead><tr><th>Estudio<\/th><th>Lo que dice el posicionamiento<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Colon por enema<\/th><td>Sin utilidad en la evaluación inicial; sensibilidad <strong>&lt;83 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Colonografía por TC<\/th><td>Sensibilidad <strong>82–92 %<\/strong> para lesiones <strong>&gt;10 mm<\/strong>, especificidad <strong>85–90 %<\/strong>; todo hallazgo requiere colonoscopia; solo si la colonoscopia está contraindicada o incompleta<\/td><\/tr><tr><th scope=\"row\"><strong>BH y perfil férrico<\/strong><\/th><td>Los laboratorios <strong>más útiles<\/strong> para orientar la referencia (anemia ferropénica nueva o inexplicada: alto VPP)<\/td><\/tr><tr><th scope=\"row\"><strong>Antígeno carcinoembrionario<\/strong><\/th><td><strong>No<\/strong> para diagnóstico ni para decidir referencia; solo seguimiento y estadificación<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Enunciado 13: referencia estratificada (Figura 5)<\/span><\/div><p><em>Total 78.6 %, parcial 21.4 %.<\/em><\/p><ul><li><strong>Urgente (&lt;24 h):<\/strong> <strong>HTDB<\/strong> (rectorragia o hematoquecia) <strong>con inestabilidad hemodinámica<\/strong>, <strong>datos de obstrucción<\/strong>, <strong>dolor abdominal intenso con sospecha de perforación<\/strong> y <strong>síndrome anémico severo (Hb &lt;8 g/dl)<\/strong>.<\/li><li><strong>Prioritaria (≤2 semanas):<\/strong> pérdida de peso &gt;10 %, anemia ferropénica, sangrado oculto persistente, <strong>masa palpable abdominal o rectal<\/strong>, <strong>cambio súbito y persistente del hábito intestinal<\/strong>, reporte endoscópico de malignidad.<\/li><li><strong>Electiva (≤4–6 semanas):<\/strong> factores de riesgo y <strong>&gt;50 años con al menos un factor de riesgo<\/strong>.<\/li><\/ul><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El ACE (antígeno carcinoembrionario) <strong>no<\/strong> sirve para decidir a quién referir. Lo útil en primer nivel es la <strong>biometría hemática con perfil de hierro<\/strong>.<\/p><\/aside>"},{"t":"La nota de referencia (Tabla 1) y el sistema de referencia","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La nota debe <strong>justificar el nivel de prioridad<\/strong> y llevar el <strong>estado funcional (ECOG)<\/strong>: son los elementos que más se olvidan.<\/p><\/aside>"}],"pearls":["Tiempos de referencia en los tres órganos: urgente &lt;24 h, prioritaria ≤2 semanas, electiva ≤4–6 semanas.","Pérdida de peso de alarma = no intencionada, &gt;10 % en 6 meses.","Disfagia: el síntoma inicial más frecuente del cáncer de esófago (61 %); la disfagia progresiva tiene el mayor VPP.","Disfagia con intolerancia a la vía oral o HTDA con inestabilidad = referencia urgente (&lt;24 h).","Hombre &gt;50 años con ERGE &gt;5 años + obesidad, tabaco, raza caucásica o familiar con ACE/Barrett = población prioritaria para EDA.","En el carcinoma escamoso, la mala salud bucal explica 37 % de los casos; frutas y verduras protegen (−12 %).","Acalasia: riesgo 50 veces mayor de carcinoma escamoso, 20–25 años después de los síntomas.","La dispepsia aislada no es dato de alarma de cáncer gástrico.","Virchow o hermana María José = referencia inmediata; trombocitosis &gt;450,000/µl inexplicada = buscar cáncer.","Riesgo gástrico alto: &gt;50 años + (familiar &lt;50 años, OLGA/OLGIM III/IV, anemia perniciosa, Ménétrier, MALT, CDH1/Lynch).","Sídney modificado: 2 antro + 2 cuerpo + 1 incisura = 5 biopsias.","ACE y CA 19-9 no se piden para diagnosticar cáncer gástrico (sensibilidad &lt;50 %).","Colonoscopia de calidad: Boston &gt;2 por segmento, retirada &gt;8 min, TDA &gt;35 % (&gt;40 % hombres), serradas &gt;6 %.","Cada 1 % de TDA reduce ~3 % el cáncer de intervalo; los cánceres de intervalo son 4–8 % de los CCR.","En tamizaje poblacional de CCR se usa FIT y la colonoscopia confirma; ante sospecha clínica se va directo a colonoscopia."],"comps":[{"title":"Adenocarcinoma contra carcinoma escamoso de esófago","cols":["Adenocarcinoma (ACE)","Carcinoma escamoso (CEE)"],"rows":[["Lesión precursora","<strong>Esófago de Barrett<\/strong>","Sin precursora tipo Barrett†"],["Factor clave","<strong>ERGE crónico<\/strong>","<strong>Tabaco y alcohol<\/strong>"],["Mayor fracción atribuible","—","<strong>Mala salud bucal (37 %)<\/strong>"],["Obesidad","<strong>Sí<\/strong> (IMC &gt;30, adiposidad central)","No es factor listado"],["Sexo","<strong>Masculino<\/strong>","No se especifica"],["Exposiciones","Tabaquismo","Bebidas muy calientes (16 %), hidrocarburos (12 %), cáusticos, radioterapia"],["Acalasia","4 por 1,000","<strong>26 por 1,000<\/strong> (riesgo ×50)"],["Otros","Familiar con ACE o EB, raza caucásica","VPH, tilosis"],["Población prioritaria","Hombre &gt;50 años con ERGE &gt;5 años + factor","Definida por exposiciones regionales"],["Protector","—","Frutas y verduras (−12 %)"]],"key":"ACE = reflujo, Barrett y obesidad. CEE = tabaco, alcohol, boca descuidada y bebidas muy calientes."},{"title":"Referencia urgente, prioritaria y electiva","cols":["Urgente","Prioritaria","Electiva"],"rows":[["Tiempo","<strong>&lt;24 horas<\/strong>","<strong>≤2 semanas<\/strong>","<strong>≤4–6 semanas<\/strong>"],["Sangrado","HTDA/HTDB <strong>con inestabilidad hemodinámica<\/strong>","Sangrado oculto persistente","—"],["Disfagia","Con <strong>intolerancia a la vía oral<\/strong>","<strong>Progresiva<\/strong>","—"],["Vómito","Obstrucción gástrica con vómitos persistentes","Vómito recurrente","—"],["Anemia","Síndrome anémico severo (<strong>Hb &lt;8 g/dl<\/strong>)","Anemia ferropénica","—"],["Dolor","Intenso con <strong>sospecha de perforación<\/strong>","—","—"],["Peso","—","Pérdida <strong>&gt;10 %<\/strong>","—"],["Masa","—","Epigástrica, abdominal o rectal","—"],["Endoscopia previa","—","Reporte de malignidad; gastritis atrófica extensa con metaplasia","—"],["Riesgo sin síntomas","—","—","Factores de riesgo; <strong>&gt;50 años con ≥1 factor<\/strong>"]],"key":"La inestabilidad, la obstrucción, la perforación y la Hb &lt;8 hacen urgente; los datos de alarma estables son prioritarios; el riesgo sin síntomas es electivo."}],"algos":[{"title":"¿Referir o tamizar? Sospecha de cáncer GI en primer nivel","src":"Figuras 1, 3 y 5 del artículo (algoritmos de esófago, estómago y colon)","start":"a","nodes":{"a":{"q":"¿El paciente tiene <strong>algún criterio de urgencia<\/strong>?","i":"HTDA o HTDB con <strong>inestabilidad hemodinámica<\/strong> · disfagia con <strong>intolerancia a la vía oral<\/strong> · <strong>obstrucción<\/strong> (vómitos persistentes o datos de oclusión) · <strong>dolor intenso con sospecha de perforación<\/strong> · <strong>síndrome anémico severo (Hb &lt;8 g/dl)<\/strong>.","o":[["Sí","urg"],["No","b"]]},"urg":{"end":1,"tone":"bad","text":"<strong>Referencia urgente (&lt;24 horas)<\/strong> a segundo o tercer nivel, con nota estructurada (Tabla 1) que justifique la prioridad."},"b":{"q":"¿Qué síntomas o hallazgos predominan?","i":"","o":[["Disfagia, pirosis o síntomas esofágicos","eso"],["Dispepsia, saciedad, vómito, epigastrio","gas"],["Rectorragia, cambio del hábito, dolor abdominal bajo","col"],["Ninguno: viene asintomático","asint"]]},"eso":{"q":"¿Hay datos de alarma esofágica?","i":"<strong>Disfagia progresiva<\/strong> · pérdida de peso <strong>&gt;10 % en 6 meses<\/strong> · anemia ferropénica · sangrado oculto persistente · vómito recurrente.","o":[["Sí","prio-eda"],["No","eso-r"]]},"eso-r":{"q":"¿Tiene factores de riesgo de esófago?","i":"Barrett/ACE: hombre <strong>&gt;50 años<\/strong> con <strong>ERGE &gt;5 años<\/strong> + raza caucásica, IMC &gt;30 o adiposidad central, tabaquismo o familiar de 1.er grado con ACE/EB. CEE: tabaco, alcohol, mala salud bucal, bebidas muy calientes, acalasia, cáusticos.","o":[["Sí","elec-eda"],["No","nada"]]},"gas":{"q":"¿Hay datos de alarma gástrica?","i":"Pérdida de peso &gt;10 % · anemia ferropénica sin causa · sangrado oculto persistente · vómito recurrente · <strong>masa epigástrica<\/strong> · reporte endoscópico de malignidad · <strong>gastritis atrófica extensa con metaplasia intestinal<\/strong> · trombocitosis &gt;450,000/µl inexplicada.","o":[["Sí","prio-eda"],["Ganglio de Virchow o nódulo de la hermana María José","inm"],["No, solo dispepsia","gas-r"]]},"inm":{"end":1,"tone":"bad","text":"<strong>Referencia inmediata.<\/strong> Las adenopatías de Virchow o de la hermana María José sugieren enfermedad avanzada."},"gas-r":{"q":"¿Es <strong>mayor de 50 años<\/strong> con algún factor de riesgo gástrico?","i":"Alto: familiar 1.er grado con CG &lt;50 años, OLGA/OLGIM III/IV, anemia perniciosa, Ménétrier, MALT, CDH1/Lynch. Moderado: <em>H. pylori<\/em> sin lesiones, lesiones limitadas, tabaco, alcohol, sal y nitritos, obesidad, familiar con CG &gt;50 años.","o":[["Sí","elec-eda"],["No","disp"]]},"disp":{"end":1,"tone":"ok","text":"<strong>La dispepsia aislada no es dato de alarma.<\/strong> Manejo en primer nivel y vigilar la aparición de alarma. Si tiene <em>H. pylori<\/em>, la erradicación reduce el riesgo, sobre todo antes de la atrofia."},"col":{"q":"¿Hay datos de alarma colorrectal?","i":"Rectorragia o hematoquecia (incluida la &quot;hemorroidal&quot; que no cede) · anemia ferropénica sin causa · pérdida de peso &gt;10 % · <strong>cambio súbito y persistente del hábito<\/strong> · <strong>masa abdominal o rectal<\/strong> · sangrado oculto persistente · reporte de malignidad.","o":[["Sí","prio-col"],["No","col-r"]]},"col-r":{"q":"¿Tiene riesgo alto o moderado de CCR?","i":"Alto: CCR o lesiones premalignas previas, familiar de 1.er grado con CCR, Lynch/PAF, EII de larga evolución, radiación pélvica. Moderado: <strong>&gt;50 años<\/strong> + carnes rojas/procesadas y poca fibra, sedentarismo, tabaco, alcohol o síndrome metabólico.","o":[["Sí","elec-col"],["No","nada"]]},"asint":{"q":"Sin síntomas: ¿tiene factores de riesgo de alguno de los tres cánceres?","i":"","o":[["Esófago (ERGE &gt;5 años en hombre &gt;50 + factor)","elec-eda"],["Estómago (&gt;50 años + factor)","elec-eda"],["Colon (riesgo alto o &gt;50 + factor)","elec-col"],["Ninguno","tam"]]},"tam":{"end":1,"tone":"ok","text":"<strong>No es referencia por sospecha: es detección poblacional.<\/strong> Para CCR se usan pruebas no invasivas como la <strong>FIT<\/strong>, y la colonoscopia confirma si es positiva. El inicio del escrutinio se ha adelantado a los <strong>45–50 años<\/strong> en varias guías."},"prio-eda":{"end":1,"tone":"warn","text":"<strong>Referencia prioritaria (≤2 semanas) para EDA con biopsias.<\/strong> No pidas bario, TC, ACE ni CA 19-9 como estudio inicial."},"elec-eda":{"end":1,"tone":"ok","text":"<strong>Referencia electiva (≤4–6 semanas) para EDA<\/strong> (con biopsias sistemáticas por protocolo de Sídney si es por riesgo gástrico)."},"prio-col":{"end":1,"tone":"warn","text":"<strong>Referencia prioritaria (≤2 semanas) para colonoscopia.<\/strong> Adjunta BH y perfil férrico; el antígeno carcinoembrionario no decide la referencia."},"elec-col":{"end":1,"tone":"ok","text":"<strong>Referencia electiva (≤4–6 semanas) para colonoscopia<\/strong> de calidad."},"nada":{"end":1,"tone":"ok","text":"Sin alarma ni factores de riesgo: <strong>no hay criterio de referencia por sospecha de cáncer<\/strong>. Revalora si aparecen datos de alarma."}}},{"title":"Estratificación del riesgo de cáncer gástrico (AMG)","src":"Enunciado 7 y Figura 3 del artículo","start":"a","nodes":{"a":{"q":"¿Tiene un <strong>síndrome hereditario<\/strong> (CDH1 o Lynch), <strong>anemia perniciosa<\/strong>, <strong>Ménétrier<\/strong> o <strong>linfoma MALT<\/strong>?","i":"","o":[["Sí","edad"],["No","b"]]},"b":{"q":"¿Tiene biopsias con <strong>OLGA/OLGIM III o IV<\/strong> (atrofia o metaplasia extensa) o displasia?","i":"","o":[["Sí","edad"],["No","c"]]},"c":{"q":"¿Tiene un <strong>familiar de primer grado con cáncer gástrico<\/strong>?","i":"","o":[["Sí, diagnosticado antes de los 50 años","edad"],["Sí, diagnosticado después de los 50 años","mod"],["No","d"]]},"d":{"q":"¿Tiene alguno de estos?","i":"<em>H. pylori<\/em> sin lesiones premalignas · atrofia o metaplasia limitada · tabaquismo · alcohol · dieta alta en sal y nitritos · obesidad.","o":[["Sí","mod"],["No","bajo"]]},"edad":{"q":"¿Tiene <strong>más de 50 años<\/strong>?","i":"","o":[["Sí","alto"],["No","alto2"]]},"alto":{"end":1,"tone":"bad","text":"<strong>Riesgo alto (7.1).<\/strong> Referencia para EDA con biopsias sistemáticas; si hay gastritis atrófica extensa con metaplasia, <strong>prioritaria (≤2 semanas)<\/strong>."},"alto2":{"end":1,"tone":"warn","text":"La definición de riesgo alto exige <strong>&gt;50 años<\/strong>, pero el posicionamiento subraya que <strong>CDH1<\/strong> da riesgo a edades tempranas aun sin síntomas ni lesiones: requiere vigilancia intensiva o cirugía en casos seleccionados. Refiere a especialista."},"mod":{"end":1,"tone":"warn","text":"<strong>Riesgo moderado (7.2).<\/strong> Erradicar <em>H. pylori<\/em>, modificar estilo de vida y vigilancia endoscópica selectiva. Si es <strong>&gt;50 años con un factor<\/strong>, referencia <strong>electiva (≤4–6 semanas)<\/strong>."},"bajo":{"end":1,"tone":"ok","text":"Sin factores de la estratificación. Vigila datos de alarma; la dispepsia aislada no es indicación de referencia por sospecha de cánce
