/><text x=\"200\" y=\"91.11\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Vasodilatación esplácnica (NO, CO, glucagón) y<\/tspan><tspan x=\"200\" dy=\"14.03\">colaterales portosistémicas<\/tspan><\/text><path d=\"M200 120.12 L200 142.12\" class=\"fx-arr\" marker-end=\"url(#ahfp-baveno)\"/><rect x=\"50\" y=\"142.12\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"159.17\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Baja el volumen arterial efectivo; circulación<\/tspan><tspan x=\"200\" dy=\"14.03\">hiperdinámica<\/tspan><\/text><path d=\"M200 188.18 L200 210.18\" class=\"fx-arr\" marker-end=\"url(#ahfp-baveno)\"/><rect x=\"50\" y=\"210.18\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"227.23\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Se activan renina-angiotensina-aldosterona,<\/tspan><tspan x=\"200\" dy=\"14.03\">simpático y ADH<\/tspan><\/text><path d=\"M200 256.24 V267.24 H68 V278.24\" class=\"fx-arr\" marker-end=\"url(#ahfp-baveno)\"/><path d=\"M200 256.24 V267.24 H200 V278.24\" class=\"fx-arr\" marker-end=\"url(#ahfp-baveno)\"/><path d=\"M200 256.24 V267.24 H332 V278.24\" class=\"fx-arr\" marker-end=\"url(#ahfp-baveno)\"/><rect x=\"6\" y=\"278.24\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"68\" y=\"294.59\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Retención de Na →<\/tspan><tspan x=\"68\" dy=\"12.81\">ascitis<\/tspan><\/text><rect x=\"138\" y=\"278.24\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"200\" y=\"294.59\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Agua libre →<\/tspan><tspan x=\"200\" dy=\"12.81\">hiponatremia<\/tspan><\/text><rect x=\"270\" y=\"278.24\" width=\"124\" height=\"43.62\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"332\" y=\"294.59\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Vasoconstricción<\/tspan><tspan x=\"332\" dy=\"12.81\">renal → SHR-LRA<\/tspan><\/text><\/svg><figcaption>La translocación de bacterias del intestino y la inflamación sistémica empeoran la vasodilatación: por eso una infección puede descompensar a un paciente estable.<\/figcaption><\/figure><h5>Cada complicación, su mecanismo<\/h5><div class=\"tbl\"><table><thead><tr><th>Complicación<\/th><th>Mecanismo<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Várices y sangrado<\/strong><\/th><td>La sangre portal busca salida por colaterales (gastroesofágicas). Se forman con GPVH ≥10 y pueden sangrar con GPVH ≥12 mmHg<\/td><\/tr><tr><th scope=\"row\"><strong>Ascitis<\/strong><\/th><td>Retención renal de sodio + presión sinusoidal alta + albúmina baja<\/td><\/tr><tr><th scope=\"row\"><strong>Hidrotórax hepático<\/strong><\/th><td>La ascitis pasa al tórax por defectos del diafragma, empujada por la presión negativa del tórax (más a la derecha)<\/td><\/tr><tr><th scope=\"row\"><strong>Peritonitis bacteriana espontánea<\/strong><\/th><td>Translocación de bacterias del intestino + líquido de ascitis con pocas opsoninas (proteínas bajas)<\/td><\/tr><tr><th scope=\"row\"><strong>Encefalopatía hepática<\/strong><\/th><td>El amonio del intestino se salta al hígado por los cortocircuitos; en el astrocito forma glutamina, que lo hincha. Precipitan: sangrado, infección, estreñimiento, diuréticos<\/td><\/tr><tr><th scope=\"row\"><strong>SHR-LRA<\/strong><\/th><td>Vasoconstricción renal extrema por la vasodilatación sistémica; el riñón está estructuralmente sano<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Los <strong>betabloqueadores no selectivos<\/strong> bajan el gasto cardiaco (β1) y causan vasoconstricción esplácnica (β2): bajan el flujo portal. Por eso previenen la descompensación, no solo el sangrado.<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Diagnóstico no invasivo: regla de 5, plaquetas y bazo","h":"<figure class=\"fig\" data-fig=\"baveno-regla5\"><svg viewBox=\"0 0 400 340\" role=\"img\" aria-label=\"Regla de 5 de la elastografía y cortes de HPCS\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah27\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"200\" y=\"14\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Rigidez hepática (VCTE, en ayuno)<\/tspan><\/text><line x1=\"20\" y1=\"60\" x2=\"380\" y2=\"60\" style=\"stroke:#C1121F;stroke-width:3\"/><circle cx=\"30\" cy=\"60\" r=\"6\" style=\"fill:#C1121F\"/><text x=\"30\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"30\" dy=\"0\">5 kPa<\/tspan><\/text><circle cx=\"115\" cy=\"60\" r=\"6\" style=\"fill:#C1121F\"/><text x=\"115\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"115\" dy=\"0\">10 kPa<\/tspan><\/text><circle cx=\"200\" cy=\"60\" r=\"6\" style=\"fill:#C1121F\"/><text x=\"200\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">15 kPa<\/tspan><\/text><circle cx=\"285\" cy=\"60\" r=\"6\" style=\"fill:#C1121F\"/><text x=\"285\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"285\" dy=\"0\">20 kPa<\/tspan><\/text><circle cx=\"370\" cy=\"60\" r=\"6\" style=\"fill:#C1121F\"/><text x=\"370\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"370\" dy=\"0\">25 kPa<\/tspan><\/text><text x=\"200\" y=\"82\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Riesgo de descompensación y muerte hepática →<\/tspan><\/text><rect x=\"6\" y=\"96\" width=\"120\" height=\"62\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"66\" y=\"113.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"66\" dy=\"0\">&lt;10 kPa: descarta<\/tspan><tspan x=\"66\" dy=\"13.42\">cACLD (riesgo 3<\/tspan><tspan x=\"66\" dy=\"13.42\">años ≤1 %)<\/tspan><\/text><rect x=\"140\" y=\"96\" width=\"120\" height=\"62\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"113.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">10–15 sugiere y<\/tspan><tspan x=\"200\" dy=\"13.42\">&gt;15 sugiere mucho<\/tspan><tspan x=\"200\" dy=\"13.42\">cACLD<\/tspan><\/text><rect x=\"274\" y=\"96\" width=\"120\" height=\"62\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"334\" y=\"106.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"334\" dy=\"0\">≥25 kPa: HPCS<\/tspan><tspan x=\"334\" dy=\"13.42\">(virus, alcohol,<\/tspan><tspan x=\"334\" dy=\"13.42\">MASLD sin<\/tspan><tspan x=\"334\" dy=\"13.42\">obesidad)<\/tspan><\/text><rect x=\"6\" y=\"172\" width=\"186\" height=\"58\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"99\" y=\"194.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"99\" dy=\"0\">Descarta HPCS: LSM ≤15 kPa +<\/tspan><tspan x=\"99\" dy=\"13.42\">plaquetas ≥150 × 10⁹/L<\/tspan><\/text><rect x=\"208\" y=\"172\" width=\"186\" height=\"58\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"301\" y=\"194.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"301\" dy=\"0\">Confirma HPCS: ANTICIPATE o<\/tspan><tspan x=\"301\" dy=\"13.42\">NICER ≥75 % · SSM &gt;55 kPa<\/tspan><\/text><rect x=\"6\" y=\"244\" width=\"186\" height=\"44\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"99\" y=\"259.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"99\" dy=\"0\">Zona gris: repetir PNI en 12<\/tspan><tspan x=\"99\" dy=\"13.42\">meses o agregar SSM<\/tspan><\/text><rect x=\"208\" y=\"244\" width=\"186\" height=\"44\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"301\" y=\"259.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"301\" dy=\"0\">Iniciar BBNS, de preferencia<\/tspan><tspan x=\"301\" dy=\"13.42\">carvedilol<\/tspan><\/text><rect x=\"6\" y=\"296\" width=\"388\" height=\"38\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"308.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">LSM &lt;10 kPa con signos de hipertensión portal: piensa en<\/tspan><tspan x=\"200\" dy=\"13.42\">PSVD/NCPF<\/tspan><\/text><\/svg><figcaption>Figura 1 de Baveno VIII, simplificada. La <strong>regla de 5<\/strong> (10–15–20–25 kPa) marca riesgo creciente sin importar la etiología.<\/figcaption><\/figure><h5>Rigidez hepática (LSM) para cACLD<\/h5><div class=\"tbl\"><table><thead><tr><th>LSM<\/th><th>Significado<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>&lt;10 kPa<\/strong><\/th><td><strong>Descarta cACLD<\/strong> (si no hay otros signos clínicos o de imagen)<\/td><\/tr><tr><th scope=\"row\"><strong>10–15 kPa<\/strong><\/th><td><strong>Sugiere<\/strong> cACLD<\/td><\/tr><tr><th scope=\"row\"><strong>&gt;15 kPa<\/strong><\/th><td><strong>Sugiere mucho<\/strong> cACLD<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El corte de <strong>25 kPa<\/strong> para confirmar HPCS <strong>no aplica<\/strong> al paciente con MASLD y <strong>obesidad<\/strong> (IMC ≥30): en él usa <strong>ANTICIPATE-NASH<\/strong>. Y el de SSM para confirmar es <strong>&gt;55 kPa<\/strong>, no 40 (40 es para evitar endoscopia).<\/p><\/aside>"},{"t":"Modificadores: alcohol, MASLD y factores pronósticos","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Para seguir un cambio de LSM en MASLD o alcohol, el umbral es un cambio relativo <strong>confirmado de ≥30 %<\/strong> (≥20 % si es por resonancia).<\/p><\/aside>"},{"t":"Prevenir la primera descompensación: betabloqueadores","h":"<figure class=\"fig\" data-fig=\"baveno-bb\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Betabloqueador o endoscopia en la cACLD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah28\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"110\" y=\"6\" width=\"180\" height=\"36\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"200\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">cACLD con HPCS<\/tspan><\/text><path d=\"M160 42 V56 H90 V70\" class=\"fx-arr\" marker-end=\"url(#ah28)\"/><path d=\"M240 42 V56 H310 V70\" class=\"fx-arr\" marker-end=\"url(#ah28)\"/><rect x=\"10\" y=\"70\" width=\"160\" height=\"60\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"90\" y=\"92.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"90\" dy=\"0\">Puede tomar BBNS:<\/tspan><tspan x=\"90\" dy=\"14.03\">carvedilol (preferido)<\/tspan><\/text><rect x=\"230\" y=\"70\" width=\"160\" height=\"60\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"310\" y=\"92.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"310\" dy=\"0\">Contraindicación o<\/tspan><tspan x=\"310\" dy=\"14.03\">intolerancia a BBNS<\/tspan><\/text><path d=\"M90 130 L90 156\" class=\"fx-arr\" marker-end=\"url(#ah28)\"/><rect x=\"10\" y=\"156\" width=\"160\" height=\"60\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"90\" y=\"178.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"90\" dy=\"0\">Sin endoscopia de<\/tspan><tspan x=\"90\" dy=\"14.03\">escrutinio<\/tspan><\/text><path d=\"M310 130 L310 156\" class=\"fx-arr\" marker-end=\"url(#ah28)\"/><rect x=\"230\" y=\"156\" width=\"160\" height=\"60\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"310\" y=\"178.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"310\" dy=\"0\">¿LSM &lt;20 + plaquetas<\/tspan><tspan x=\"310\" dy=\"14.03\">≥150 o SSM &lt;40?<\/tspan><\/text><path d=\"M270 216 V228 H230 V240\" class=\"fx-arr\" marker-end=\"url(#ah28)\"/><g><rect x=\"237.6\" y=\"219\" width=\"24.8\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"250\" y=\"228.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"250\" dy=\"0\">Sí<\/tspan><\/text><\/g><path d=\"M350 216 L350 240\" class=\"fx-arr\" marker-end=\"url(#ah28)\"/><g><rect x=\"359.6\" y=\"219\" width=\"24.8\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"372\" y=\"228.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"372\" dy=\"0\">No<\/tspan><\/text><\/g><rect x=\"140\" y=\"240\" width=\"120\" height=\"54\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"200\" y=\"267\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Evita endoscopia<\/tspan><\/text><rect x=\"270\" y=\"240\" width=\"124\" height=\"54\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"253.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Endoscopia:<\/tspan><tspan x=\"332\" dy=\"13.42\">várices grandes →<\/tspan><tspan x=\"332\" dy=\"13.42\">LVE<\/tspan><\/text><\/svg><figcaption>Sin várices en la endoscopia: repetir en <strong>2 años<\/strong> (etiología activa) o <strong>3 años<\/strong> (etiología controlada).<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente con cACLD y HPCS que ya toma carvedilol: <strong>no<\/strong> le pidas endoscopia de escrutinio. Paciente con cACLD <strong>sin<\/strong> HPCS: <strong>no<\/strong> le des betabloqueador.<\/p><\/aside>"},{"t":"Descompensación adicional y su prevención","h":"<h5>Definición de descompensación adicional (FD)<\/h5><div class=\"tbl\"><table><thead><tr><th>Primer evento<\/th><th>Se considera FD si aparece…<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Ascitis<\/strong><\/th><td><strong>≥3 paracentesis de gran volumen en 1 año<\/strong>, <strong>PBE<\/strong>, <strong>SHR-LRA<\/strong> o un segundo evento (sangrado por HPCS, EH manifiesta o ictericia)<\/td><\/tr><tr><th scope=\"row\"><strong>Hemorragia variceal<\/strong><\/th><td><strong>Resangrado<\/strong> por HPCS o un segundo evento (ascitis, EH manifiesta o ictericia)<\/td><\/tr><tr><th scope=\"row\"><strong>EH manifiesta<\/strong><\/th><td><strong>EH recurrente<\/strong> o un segundo evento (ascitis, sangrado o ictericia)<\/td><\/tr><tr><th scope=\"row\"><strong>≥2 eventos<\/strong><\/th><td>Cualquier combinación de ascitis, sangrado, EH e ictericia<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente con ascitis que necesita <strong>3 paracentesis grandes en un año<\/strong>: eso ya es <strong>descompensación adicional<\/strong>, y lo que sigue es pensar en <strong>TIPS y trasplante<\/strong>.<\/p><\/aside>"},{"t":"Hemorragia variceal aguda: las primeras 12 horas","h":"<figure class=\"fig\" data-fig=\"baveno-hva\"><svg viewBox=\"0 0 400 430\" role=\"img\" aria-label=\"Algoritmo de hemorragia variceal aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah29\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"10\" y=\"6\" width=\"380\" height=\"78\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"200\" y=\"31.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Terapia intensiva o intermedia · Hb meta 7–8 g/dL · vasoactivo<\/tspan><tspan x=\"200\" dy=\"13.42\">YA (2–5 días) · cefalosporina de 3.ª · eritromicina 250 mg IV<\/tspan><tspan x=\"200\" dy=\"13.42\">· lactulosa · intubar si hay alteración del alerta<\/tspan><\/text><path d=\"M200 84 L200 102\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><rect x=\"90\" y=\"102\" width=\"220\" height=\"34\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"200\" y=\"119\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Endoscopia en ≤12 h<\/tspan><\/text><path d=\"M150 136 V148 H100 V160\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><path d=\"M250 136 V148 H300 V160\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><rect x=\"10\" y=\"160\" width=\"180\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"100\" y=\"172.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Várices esofágicas o GOV1:<\/tspan><tspan x=\"100\" dy=\"14.03\">ligadura<\/tspan><\/text><rect x=\"210\" y=\"160\" width=\"180\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"172.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">GOV2 o IGV1: tratamiento<\/tspan><tspan x=\"300\" dy=\"14.03\">bimodal<\/tspan><\/text><path d=\"M55 200 L55 222\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><path d=\"M145 200 L145 222\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><rect x=\"10\" y=\"222\" width=\"90\" height=\"112\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"55\" y=\"245.975\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"55\" dy=\"0\">Controlado +<\/tspan><tspan x=\"55\" dy=\"12.81\">C10–13, B &gt;7<\/tspan><tspan x=\"55\" dy=\"12.81\">con sangrado<\/tspan><tspan x=\"55\" dy=\"12.81\">activo o GPVH<\/tspan><tspan x=\"55\" dy=\"12.81\">≥20: p-TIPS<\/tspan><tspan x=\"55\" dy=\"12.81\">≤72 h<\/tspan><\/text><rect x=\"106\" y=\"222\" width=\"84\" height=\"112\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"148\" y=\"252.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"148\" dy=\"0\">Falla: stent<\/tspan><tspan x=\"148\" dy=\"12.81\">cubierto<\/tspan><tspan x=\"148\" dy=\"12.81\">como puente<\/tspan><tspan x=\"148\" dy=\"12.81\">→ TIPS de<\/tspan><tspan x=\"148\" dy=\"12.81\">rescate<\/tspan><\/text><path d=\"M300 200 L300 222\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><rect x=\"210\" y=\"222\" width=\"180\" height=\"54\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"242.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Aguda: cianoacrilato o coils<\/tspan><tspan x=\"300\" dy=\"13.42\">+ cianoacrilato por USE<\/tspan><\/text><path d=\"M300 276 L300 290\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><rect x=\"210\" y=\"290\" width=\"180\" height=\"44\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"300\" y=\"305.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Definitiva: TIPS ±<\/tspan><tspan x=\"300\" dy=\"13.42\">embolización<\/tspan><\/text><path d=\"M55 334 L55 352\" class=\"fx-arr\" marker-end=\"url(#ah29)\"/><rect x=\"10\" y=\"352\" width=\"180\" height=\"72\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"374.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Sin criterios de p-TIPS:<\/tspan><tspan x=\"100\" dy=\"13.42\">carvedilol + LVE cada 2–4<\/tspan><tspan x=\"100\" dy=\"13.42\">semanas hasta erradicar<\/tspan><\/text><rect x=\"210\" y=\"352\" width=\"180\" height=\"72\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"300\" y=\"374.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">A todos: TC o RM contrastada<\/tspan><tspan x=\"300\" dy=\"13.42\">(TVP, CHC) y hierro si Hb<\/tspan><tspan x=\"300\" dy=\"13.42\">&lt;10 g/dL<\/tspan><\/text><\/svg><figcaption>Figura 3 de Baveno VIII, simplificada. Criterios adicionales del p-TIPS en la figura: <strong>edad &lt;75 años, creatinina &lt;3 mg/dL y sin insuficiencia cardiaca<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Tres &quot;no&quot; de la HVA: <strong>no plasma<\/strong>, <strong>no ácido tranexámico<\/strong> y <strong>no transfusión liberal<\/strong> (meta 7–8 g/dL). Tres &quot;sí&quot;: <strong>vasoactivo<\/strong>, <strong>ceftriaxona<\/strong> (cefalosporina de 3.ª) y <strong>endoscopia ≤12 h<\/strong>.<\/p><\/aside>"},{"t":"TIPS preventivo, rescate, várices gástricas y otras lesiones","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>p-TIPS: <strong>C10–13<\/strong>, <strong>B8–9 con sangrado activo<\/strong> o <strong>GPVH ≥20<\/strong>. Fíjate en el <strong>13<\/strong>: con Child-Pugh <strong>C14–15<\/strong> ya no es candidato a TIPS preventivo.<\/p><\/aside>"},{"t":"Ascitis, hidrotórax y TIPS electivo","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La ascitis <strong>refractaria<\/strong> ya no tiene como única salida las paracentesis: la respuesta de Baveno VIII es <strong>TIPS<\/strong> (con trasplante en la conversación).<\/p><\/aside>"},{"t":"Encefalopatía, SHR-LRA, PBE e infecciones","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>SHR-LRA: terlipresina <strong>en infusión continua<\/strong> (2–3 mg/día) + albúmina. Alternativa: <strong>norepinefrina<\/strong>. Y antes del TIPS electivo: <strong>rifaximina<\/strong>.<\/p><\/aside>"},{"t":"Recompensación de la cirrosis","h":"<h5>Cura o control por etiología<\/h5><div class=\"tbl\"><table><thead><tr><th>Etiología<\/th><th>Cura o control<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Alcohol<\/th><td><strong>Abstinencia sostenida<\/strong><\/td><\/tr><tr><th scope=\"row\">VHB<\/th><td><strong>Supresión sostenida del ADN del VHB<\/strong><\/td><\/tr><tr><th scope=\"row\">VHC<\/th><td><strong>Respuesta virológica sostenida<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente con VHC curado y sin ascitis <strong>pero con espironolactona<\/strong>: <strong>no<\/strong> está recompensado. Y para quitar el carvedilol necesitas demostrar que <strong>la HPCS se fue<\/strong>, no solo que el paciente se ve bien.<\/p><\/aside>"},{"t":"Enfermedad vascular hepática y Budd-Chiari","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Budd-Chiari: <strong>anticoagulación primero y para siempre<\/strong>; luego angioplastia, TIPS y trasplante. En el SBC <strong>no<\/strong> uses LI-RADS para los nódulos.<\/p><\/aside>"},{"t":"Enfermedad vascular porto-sinusoidal (PSVD/NCPF)","h":"<figure class=\"fig\" data-fig=\"baveno-psvd\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Puntuación diagnóstica de PSVD/NCPF\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah30\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"10\" y=\"6\" width=\"300\" height=\"28\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"160\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"160\" dy=\"0\">Signo específico de hipertensión portal<\/tspan><\/text><rect x=\"320\" y=\"6\" width=\"70\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"355\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"355\" dy=\"0\">+3<\/tspan><\/text><rect x=\"10\" y=\"38\" width=\"300\" height=\"28\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"160\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"160\" dy=\"0\">Signo inespecífico de hipertensión portal<\/tspan><\/text><rect x=\"320\" y=\"38\" width=\"70\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"355\" y=\"52\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"355\" dy=\"0\">+2<\/tspan><\/text><rect x=\"10\" y=\"70\" width=\"300\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"160\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"160\" dy=\"0\">Lesión histológica mayor<\/tspan><\/text><rect x=\"320\" y=\"70\" width=\"70\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"355\" y=\"84\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"355\" dy=\"0\">+5<\/tspan><\/text><rect x=\"10\" y=\"102\" width=\"300\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"160\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"160\" dy=\"0\">Lesión histológica menor<\/tspan><\/text><rect x=\"320\" y=\"102\" width=\"70\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"355\" y=\"116\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"355\" dy=\"0\">+2<\/tspan><\/text><rect x=\"10\" y=\"134\" width=\"300\" height=\"28\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"160\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"160\" dy=\"0\">Condición asociada a PSVD/NCPF<\/tspan><\/text><rect x=\"320\" y=\"134\" width=\"70\" height=\"28\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"355\" y=\"148\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"355\" dy=\"0\">+1<\/tspan><\/text><rect x=\"10\" y=\"166\" width=\"300\" height=\"28\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"160\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"160\" dy=\"0\">Causa concomitante de hepatopatía crónica<\/tspan><\/text><rect x=\"320\" y=\"166\" width=\"70\" height=\"28\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"355\" y=\"180\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"355\" dy=\"0\">−1<\/tspan><\/text><rect x=\"10\" y=\"206\" width=\"120\" height=\"50\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"70\" y=\"231\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">0–2 puntos<\/tspan><\/text><rect x=\"140\" y=\"206\" width=\"120\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"223.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">3–4: posible<\/tspan><tspan x=\"200\" dy=\"14.64\">PSVD<\/tspan><\/text><rect x=\"270\" y=\"206\" width=\"120\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"231\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">≥5: definitiva<\/tspan><\/text><text x=\"200\" y=\"280\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Requiere biopsia adecuada que descarte cirrosis<\/tspan><\/text><\/svg><figcaption>Figura 4 de Baveno VIII. Las <strong>tres lesiones menores juntas<\/strong> cuentan como una mayor. Posible (3–4): nueva biopsia o LSM, referir a centro experto y vigilar.<\/figcaption><\/figure><h5>Lesiones histológicas<\/h5><div class=\"tbl\"><table><thead><tr><th>Mayores<\/th><th>Menores<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Hiperplasia nodular regenerativa<\/strong><\/th><td>Distribución anormal de estructuras vasculares<\/td><\/tr><tr><th scope=\"row\"><strong>Vénulas portales muscularizadas<\/strong><\/th><td>Estenosis de vénulas portales en <strong>25–49 %<\/strong> de los espacios porta<\/td><\/tr><tr><th scope=\"row\">Estenosis de vénulas portales en <strong>≥50 %<\/strong> de los espacios porta<\/th><td>Cambios regenerativos sin HNR clara<\/td><\/tr><\/tbody><\/table><\/div><h5>Puntuación diagnóstica (Figura 4)<\/h5><div class=\"tbl\"><table><thead><tr><th>Componente<\/th><th>Tipo<\/th><th>Puntos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Signos clínicos de hipertensión portal<\/th><td>Específico<\/td><td><strong>+3<\/strong><\/td><\/tr><tr><th scope=\"row\"><\/th><td>Inespecífico<\/td><td><strong>+2<\/strong><\/td><\/tr><tr><th scope=\"row\"><\/th><td>Ninguno<\/td><td>0<\/td><\/tr><tr><th scope=\"row\">Lesiones histológicas<\/th><td>Mayor<\/td><td><strong>+5<\/strong><\/td><\/tr><tr><th scope=\"row\"><\/th><td>Menor<\/td><td><strong>+2<\/strong><\/td><\/tr><tr><th scope=\"row\"><\/th><td>Normal<\/td><td>0<\/td><\/tr><tr><th scope=\"row\">Condición asociada a PSVD/NCPF<\/th><td>Presente<\/td><td><strong>+1<\/strong><\/td><\/tr><tr><th scope=\"row\">Causa concomitante de hepatopatía crónica<\/th><td>Presente<\/td><td><strong>−1<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Una sola <strong>lesión mayor<\/strong> (+5) basta para el diagnóstico definitivo aunque no haya hipertensión portal; un signo específico (+3) más una lesión menor (+2) <strong>también<\/strong> suman 5.<\/p><\/aside>"},{"t":"Trombosis de la vena porta","h":"<h5>Definiciones (VALDIG)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Luz remanente<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Mínima<\/th><td><strong>≥50 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Parcial<\/th><td><strong>&lt;50 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Completa<\/th><td><strong>0 %<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>TVP reciente sin cirrosis: <strong>anticoagular ya, al menos 6 meses<\/strong>. Con factor permanente <strong>mayor<\/strong> (p. ej., neoplasia mieloproliferativa): <strong>de por vida<\/strong>.<\/p><\/aside>"}],"pearls":["LSM &lt;10 kPa descarta cACLD; 10–15 la sugiere; &gt;15 la sugiere mucho. Siempre en ayuno y confirmada.","Regla de 5: 10–15–20–25 kPa = riesgo creciente de descompensación, sin importar la causa.","LSM ≤15 kPa + plaquetas ≥150 × 10⁹/L descarta HPCS (VPN &gt;90 %).","HPCS confirmada: ANTICIPATE/NICER ≥75 %, LSM ≥25 kPa (no en MASLD con obesidad) o SSM &gt;55 kPa.","cACLD con HPCS: carvedilol. Sin HPCS: nada de betabloqueador.","Con betabloqueador no hace falta endoscopia de escrutinio; sin él, se evita si LSM &lt;20 + plaquetas ≥150 o SSM &lt;40.","La EH grado I, la ascitis solo por imagen y el sangrado oculto por gastropatía no son descompensación.","HVA: vasoactivo 2–5 días, cefalosporina de 3.ª, Hb 7–8 g/dL, endoscopia ≤12 h, LVE.","p-TIPS ≤72 h: Child C10–13, Child B &gt;7 con sangrado activo o GPVH ≥20 mmHg.","No plasma, no ácido tranexámico, no factor VIIa en la HVA.","Bajar o suspender el betabloqueador si PAS &lt;90, PAM &lt;65 o SHR-LRA.","SHR-LRA: terlipresina en infusión continua (2–3 mg/24 h) + albúmina; alternativa norepinefrina.","Recompensación: causa controlada + sin ascitis ni EH sin fármacos + sin resangrado por &gt;6 meses + Child A5/A6.","LSM &lt;10 kPa con hipertensión portal: piensa en PSVD/NCPF; puntuación ≥5 = definitiva.","TVP reciente: anticoagular de inmediato y al menos 6 meses; de por vida si hay factor permanente mayor."],"comps":[{"title":"Várices esofágicas o GOV1 contra GOV2 o IGV1","cols":["Esofágicas o GOV1","GOV2 o IGV1 (cardiofúndicas)"],"rows":[["Clasificación","Esofágicas; <strong>GOV1<\/strong> se extienden por la curvatura menor (Sarin)","<strong>GOV2<\/strong> hacia el fondo; <strong>IGV1<\/strong> fúndicas aisladas (Sarin)"],["Profilaxis primaria (compensada)","BBNS (carvedilol); si no puede, <strong>LVE<\/strong> en várices grandes","BBNS (carvedilol); si no puede y son de alto riesgo, terapia local en centros expertos"],["Hemostasia aguda","<strong>Ligadura con bandas<\/strong>","<strong>Cianoacrilato<\/strong> endoscópico o terapia guiada por <strong>USE<\/strong>"],["Opción preferida en centros expertos","Ligadura","<strong>Coils + cianoacrilato por USE<\/strong>"],["Papel del TIPS","<strong>p-TIPS<\/strong> si C10–13, B &gt;7 con sangrado activo o GPVH ≥20","<strong>TIPS ± embolización<\/strong> como tratamiento definitivo"],["Momento del TIPS","≤72 h (ideal &lt;24 h)","Lo antes posible; fases en paralelo o con intervalo mínimo"],["Si el TIPS está contraindicado","Carvedilol + LVE","Obliteración transvenosa, endoscopia o cirugía"],["Profilaxis secundaria sin TIPS","Carvedilol + LVE cada 2–4 semanas","Según la estrategia definitiva elegida"],["Riesgo","Alto si Child C o sangrado activo","<strong>Evento de alto riesgo<\/strong> por definición"]],"key":"Las <strong>GOV1<\/strong> se manejan como esofágicas (<strong>ligadura y p-TIPS<\/strong>); las <strong>GOV2/IGV1<\/strong> necesitan <strong>cianoacrilato<\/strong> para la hemostasia y <strong>TIPS ± embolización<\/strong> como tratamiento definitivo."},{"title":"Budd-Chiari contra PSVD/NCPF contra TVP","cols":["Budd-Chiari","PSVD/NCPF","TVP sin cirrosis"],"rows":[["Sitio de la lesión","Salida venosa: venas hepáticas a cava–aurícula","Vénulas portales intrahepáticas y sinusoides","Tronco portal o ramas"],["Diagnóstico","Imagen; biopsia solo si son venas pequeñas","<strong>Puntuación<\/strong> con biopsia ≥15 mm (≥5 definitiva)","Doppler y TC multifásica"],["Clave diagnóstica","Obstrucción o colaterales sin venas permeables","Hipertensión portal con <strong>LSM &lt;10 kPa<\/strong>; sin cirrosis","Trombo; reciente &lt;6 meses, crónica &gt;6 meses"],["Anticoagulación","<strong>Siempre<\/strong>, de inmediato y de por vida","Si hay TVP u otra indicación","Inmediata, <strong>≥6 meses<\/strong>; de por vida si hay factor mayor"],["Siguiente paso","Recanalización, TIPS, trasplante","Profilaxis de várices como en cirrosis","Endovascular si hay isquemia que persiste 24–48 h"],["Evitar endoscopia","No especificado","<strong>SSM &lt;40 + bilirrubina &lt;1 mg/dL<\/strong>","<strong>SSM &lt;40 kPa<\/strong>"],["Nódulos","Frecuentes, casi siempre benignos; AFP &gt;15 sospechosa","Menos frecuentes que en Budd-Chiari","No aplica"],["Vigilancia","Imagen y AFP cada 6 meses","Doppler cada 6 meses (buscar TVP)","Endoscopia a 12 meses y luego cada 2 años"]],"key":"Budd-Chiari = <strong>salida<\/strong> venosa (anticoagulación de por vida y escalonar); PSVD = <strong>hipertensión portal sin cirrosis<\/strong> con LSM baja (puntuación); TVP = <strong>entrada<\/strong> portal (anticoagular de inmediato)."}],"algos":[{"title":"cACLD: de la elastografía al carvedilol","src":"Figura 1 y enunciados 1.3–1.20 y 3.15–3.19 de Baveno VIII","start":"a","nodes":{"a":{"q":"Paciente con hepatopatía crónica. Haz <strong>LSM (VCTE) en ayuno<\/strong>. ¿Resultado?","i":"","o":[["&lt;10 kPa","b"],["≥10 kPa","c"]]},"b":{"q":"¿Hay signos clínicos o de imagen de <strong>hipertensión portal<\/strong> (várices, colaterales, esplenomegalia, plaquetas bajas)?","i":"","o":[["No","b1"],["Sí","b2"]]},"b1":{"end":1,"tone":"ok","text":"<strong>Se descarta cACLD.<\/strong> Riesgo a 3 años <strong>≤1 %<\/strong>. Repite según la etiología."},"b2":{"end":1,"tone":"warn","text":"<strong>Sospecha enfermedad vascular hepática (PSVD/NCPF).<\/strong> Biopsia adecuada (≥15 mm), SSM y referencia a centro experto."},"c":{"q":"<strong>Repite la LSM<\/strong> (o agrega otra PNI de fibrosis avanzada). ¿Se confirma ≥10 kPa?","i":"","o":[["Sí: cACLD","d"],["No","b1"]]},"d":{"q":"Refiere al especialista y estima <strong>HPCS<\/strong>. ¿Qué muestran las PNI?","i":"Descarta: LSM ≤15 kPa + plaquetas ≥150 × 10⁹/L. Confirma: ANTICIPATE/ANTICIPATE-NASH o NICER ≥75 %, LSM ≥25 kPa (virus, alcohol, MASLD con IMC &lt;30) o SSM &gt;55 kPa.","o":[["Criterio de descarte","e"],["Criterio de confirmación","f"],["Ninguno (zona gris)","g"]]},"e":{"end":1,"tone":"ok","text":"<strong>HPCS descartada (VPN &gt;90 %).<\/strong> <strong>No<\/strong> des BBNS. Trata la causa y repite las PNI cada <strong>12 meses<\/strong>."},"g":{"end":1,"tone":"warn","text":"<strong>Zona indeterminada:<\/strong> reevaluar a los <strong>12 meses<\/strong> o agregar <strong>SSM<\/strong>. Si no se puede excluir HPCS y no puede tomar BBNS, endoscopia salvo LSM &lt;20 + plaquetas ≥150 o SSM &lt;40."},"f":{"q":"<strong>HPCS confirmada.<\/strong> ¿Puede tomar betabloqueador?","i":"","o":[["Sí","h"],["No (contraindicación o intolerancia)","i"]]},"h":{"end":1,"tone":"ok","text":"<strong>Carvedilol (preferido) o BBNS<\/strong> para prevenir la descompensación. <strong>Sin endoscopia de escrutinio.<\/strong> Trata la causa."},"i":{"q":"¿LSM &lt;20 kPa con plaquetas ≥150 × 10⁹/L, o SSM &lt;40 kPa?","i":"","o":[["Sí","j"],["No","k"]]},"j":{"end":1,"tone":"ok","text":"<strong>Se puede evitar la endoscopia.<\/strong> Reevalúa las PNI cada 12 meses."},"k":{"q":"<strong>Endoscopia.<\/strong> ¿Qué encuentras?","i":"","o":[["Várices grandes (esofágicas o GOV1)","l"],["Sin várices","m"]]},"l":{"end":1,"tone":"warn","text":"<strong>Ligadura con bandas<\/strong> para prevenir el primer sangrado. No previene las descompensaciones no hemorrágicas."},"m":{"end":1,"tone":"ok","text":"Repetir endoscopia en <strong>2 años<\/strong> (etiología activa) o <strong>3 años<\/strong> (etiología eliminada o suprimida), salvo que cumpla criterios para evitarla."}}},{"title":"Hemorragia variceal aguda en cirrosis","src":"Figura 3 y enunciados 5.3–5.41 de Baveno VIII","start":"a","nodes":{"a":{"q":"Paciente con cirrosis y sospecha de <strong>hemorragia variceal<\/strong>. Inicia el manejo general.","i":"Terapia intensiva o intermedia · transfusión restrictiva (Hb 7–8 g/dL) · vasoactivo lo antes posible (2–5 días) · cefalosporina de 3.ª generación · lactulosa · sin plasma, plaquetas, factor VIIa ni ácido tranexámico de rutina.","o":[["Continuar","b"]]},"b":{"q":"¿Tiene <strong>alteración del estado de alerta<\/strong> o <strong>hematemesis activa<\/strong>?","i":"","o":[["Sí","b1"],["No","c"]]},"b1":{"q":"<strong>Intubación orotraqueal<\/strong> antes de la endoscopia; extubar lo antes posible.","i":"","o":[["Continuar","c"]]},"c":{"q":"Eritromicina <strong>250 mg IV<\/strong> 30–90 min antes (si no hay QT largo) y <strong>endoscopia ≤12 h<\/strong>. ¿Origen?","i":"","o":[["Várices esofágicas o GOV1","d"],["GOV2 o IGV1","g"]]},"d":{"q":"<strong>Ligadura con bandas.<\/strong> ¿Se controló el sangrado?","i":"","o":[["Sí","e"],["No","f"]]},"f":{"end":1,"tone":"bad","text":"<strong>Falla en el control:<\/strong> stent esofágico metálico cubierto como puente (mejor que el balón) y <strong>TIPS de rescate<\/strong>; evalúa trasplante."},"e":{"q":"¿Cumple criterios de <strong>p-TIPS<\/strong>?","i":"Child-Pugh C 10–13, Child-Pugh B &gt;7 con sangrado activo en la endoscopia o GPVH ≥20 mmHg (figura: edad &lt;75 años, creatinina &lt;3 mg/dL, sin insuficiencia cardiaca).","o":[["Sí","e1"],["No","e2"]]},"e1":{"end":1,"tone":"warn","text":"<strong>TIPS preventivo<\/strong> con stent cubierto de PTFE en <strong>≤72 h<\/strong> (idealmente &lt;24 h). La EH, la ACLF o la bilirrubina alta no son contraindicaciones absolutas."},"e2":{"end":1,"tone":"ok","text":"<strong>Profilaxis secundaria:<\/strong> carvedilol (preferido) + ligadura cada 2–4 semanas hasta erradicar. Si resangra: <strong>TIPS<\/strong>."},"g":{"end":1,"tone":"bad","text":"<strong>Tratamiento bimodal:<\/strong> hemostasia aguda con <strong>cianoacrilato<\/strong> o <strong>coils + cianoacrilato guiados por USE<\/strong> (centros expertos) y fase definitiva con <strong>TIPS ± embolización<\/strong> lo antes posible; si el TIPS está contraindicado, obliteración transvenosa, endoscopia o cirugía."}}}],"cards":[["Hipótesis que explica la ascitis en la cirrosis","Vasodilatación arterial periférica: el NO dilata las arterias esplácnicas, baja el volumen arterial efectivo y se activan RAA, simpático y ADH, que retienen sodio y agua."],["¿Por qué el amonio causa encefalopatía hepática?","Pasa del intestino a la circulación sistémica por los cortocircuitos portosistémicos y el hígado no lo depura; en el astrocito forma glutamina, que lo hincha."],["¿Qué es Baveno VIII?","El 8.º consenso de hipertensión portal (Baveno, Italia, marzo de 2026): 9 paneles y 272 enunciados con consenso fuerte."],["¿Cuántos temas tiene la agenda de investigación?","153."],["Condición obligatoria para medir LSM","Ayuno."],["¿Qué valor de LSM guía la decisión?","El más reciente."],["Probabilidad que confirma HPCS","≥75 % por ANTICIPATE, ANTICIPATE-NASH o NICER."],["SSM que permite evitar la endoscopia (cACLD)","&lt;40 kPa."],["Causas principales de hipertensión portal en niños","Obstrucción extrahepática de la vena porta y ACLD por atresia de vías biliares."],["Cambio relevante de ELF","0.5 unidades."],["Las dos etapas de la cirrosis compensada","Sin HPCS y con HPCS."],["¿Endoscopia de escrutinio en quien toma BBNS?","No: no cambia el manejo."],["Definición de FD con ascitis como primer evento","≥3 paracentesis grandes en 1 año, PBE, SHR-LRA o un segundo evento."],["Profilaxis secundaria de hemorragia variceal","BBNS (carvedilol preferido) + LVE."],["Factores de mortalidad a 6 semanas","Child-Pugh C, MELD (y variantes) y falla para controlar el sangrado."],["Antibiótico preventivo en HVA","Cefalosporina de 3.ª generación; curso corto o ninguno en Child-Pugh A."],["¿Plasma fresco en la HVA?","No de rutina: no corrige la coagulopatía y aumenta la presión portal."],["Ventana del p-TIPS","≤72 h (idealmente &lt;24 h); stent cubierto de PTFE."],["Hemostasia aguda en GOV2/IGV1","Cianoacrilato endoscópico o terapia guiada por USE (coils + cianoacrilato en centros expertos)."],["No candidato a TIPS con ascitis refractaria","Albúmina a largo plazo o drenaje domiciliario (catéter tunelizado, bomba de bajo flujo)."],["Dosis de terlipresina en el SHR-LRA","Infusión IV continua, inicio 2–3 mg/24 h."],["Función hepática para recompensación","Child-Pugh A5/A6."],["Definición de Budd-Chiari","Obstrucción del flujo venoso de salida, de venas hepáticas pequeñas a la entrada de la cava a la aurícula."],["Contraindicaciones de ACOD en enfermedad vascular","SAF doble o triple positivo, embarazo, Child-Pugh C o TFG &lt;30 mL/min."],["Puntuación PSVD definitiva","≥5 puntos."],["Grados de oclusión VALDIG","Mínima LR ≥50 %, parcial LR &lt;50 %, completa LR 0 %."]],"mcq":[{"q":"Hombre de 55 años con hepatopatía por alcohol. Elastografía en ayuno: 8.5 kPa. No hay ascitis, esplenomegalia ni colaterales. ¿Cómo lo interpretas?","o":["cACLD probable","Descarta cACLD; su riesgo a 3 años de descompensación es ≤1 %","HPCS confirmada","Requiere endoscopia de escrutinio","Requiere carvedilol"],"a":1,"e":"LSM <strong>&lt;10 kPa<\/strong> sin signos clínicos o de imagen <strong>descarta cACLD<\/strong>, con riesgo a 3 años <strong>≤1 %<\/strong> (NE 1)."},{"q":"Paciente con LSM índice de 12 kPa. ¿Qué recomienda Baveno VIII para confirmar cACLD?","o":["Biopsia hepática obligatoria","Medir GPVH","Repetir la LSM o complementar con otra PNI de fibrosis avanzada","No hacer nada más","Endoscopia"],"a":2,"e":"Con LSM índice <strong>≥10 kPa<\/strong>, <strong>repetir<\/strong> la LSM (NE 2; fuerte) o complementar con <strong>otra PNI<\/strong> (NE 3; débil)."},{"q":"Hombre de 60 años con cirrosis por alcohol, IMC 26. LSM 28 kPa, plaquetas 98 × 10⁹/L. ¿Qué indica?","o":["HPCS confirmada: iniciar BBNS, de preferencia carvedilol","Zona gris: repetir en 12 meses","Endoscopia antes de decidir","Medir GPVH antes de tratar","Solo abstinencia"],"a":0,"e":"En cACLD por <strong>alcohol o virus<\/strong> (y MASLD sin obesidad), <strong>LSM ≥25 kPa<\/strong> confirma HPCS → <strong>carvedilol<\/strong>. La decisión no depende de poder medir el GPVH."},{"q":"¿Qué valor de rigidez esplénica (SSM, 100 Hz) confirma HPCS en cACLD?","o":["&gt;25 kPa","&gt;40 kPa","&gt;45 kPa","&gt;55 kPa","&gt;75 kPa"],"a":3,"e":"<strong>SSM &gt;55 kPa<\/strong> (NE 2; fuerte). SSM &lt;40 kPa sirve para <strong>evitar<\/strong> la endoscopia."},{"q":"Mujer de 42 años con várices esofágicas medianas y esplenomegalia. LSM 6.8 kPa, PFH casi normales. ¿Qué sospechas?","o":["Cirrosis compensada","Enfermedad vascular hepática (p. ej., PSVD)","Hepatitis autoinmune","Esteatosis simple","Error de elastografía: repetir"],"a":1,"e":"<strong>LSM &lt;10 kPa<\/strong> con signos clínicos o de imagen de hipertensión portal debe hacer sospechar <strong>enfermedad vascular hepática<\/strong> (NE 3; nuevo)."},{"q":"Paciente con cACLD y asma grave (contraindicación para BBNS). LSM 17 kPa, plaquetas 160 × 10⁹/L. ¿Qué haces?","o":["Endoscopia obligatoria","Puede evitarse la endoscopia (LSM &lt;20 + plaquetas ≥150)","Carvedilol a dosis baja","TIPS","Repetir LSM en 1 mes"],"a":1,"e":"Sin BBNS, la endoscopia se evita si <strong>LSM &lt;20 kPa y plaquetas ≥150<\/strong> (criterios de Baveno VI) o <strong>SSM &lt;40 kPa<\/strong>."},{"q":"Paciente con cACLD SIN HPCS (LSM 13 kPa, plaquetas 190). ¿Le das betabloqueador para prevenir la descompensación?","o":["Sí, carvedilol","Sí, propranolol","No: sin HPCS no se usa BBNS","Solo si tiene hipertensión arterial","Solo si es por alcohol"],"a":2,"e":"En cACLD <strong>sin HPCS<\/strong>, los BBNS <strong>no deben usarse<\/strong> para prevenir descompensación o muerte (NE 2; fuerte)."},{"q":"Hombre con ascitis y várices medianas, en carvedilol. Su presión arterial es 86/54 mmHg de forma persistente. ¿Qué haces?","o":["Aumentar la dosis","Reducir la dosis o suspender el carvedilol","Agregar propranolol","Mantener igual","Colocar TIPS urgente"],"a":1,"e":"Reducir o suspender con <strong>PAS &lt;90 mmHg<\/strong> o <strong>PAM &lt;65 mmHg<\/strong> persistentes, o <strong>SHR-LRA<\/strong>; reiniciar al recuperarse."},{"q":"Tras una primera hemorragia por várices esofágicas, ¿cuál es la profilaxis secundaria de primera línea?","o":["LVE sola","Carvedilol solo","BBNS (carvedilol preferido) + LVE","TIPS para todos","Escleroterapia"],"a":2,"e":"<strong>BBNS + LVE<\/strong>, con <strong>carvedilol preferido<\/strong>, independientemente de la profilaxis primaria previa (NE 1; fuerte)."},{"q":"Hombre de 50 años con cirrosis llega con hematemesis. TA 92/60, Hb 6.8 g/dL. ¿Cuál es la meta de transfusión?","o":["Hb 10 g/dL","Hb 9–10 g/dL","Hb 7–8 g/dL","Hb 12 g/dL","No transfundir"],"a":2,"e":"Transfusión <strong>restrictiva<\/strong> con meta <strong>7–8 g/dL<\/strong>, individualizando (NE 2; fuerte)."},{"q":"¿Qué antibiótico se prefiere como profilaxis en la HVA?","o":["Norfloxacino oral","Cefalosporina de 3.ª generación","Rifaximina","Metronidazol","Vancomicina"],"a":1,"e":"<strong>Cefalosporinas de 3.ª generación<\/strong>, considerando resistencias locales; en Child-Pugh A puede acortarse u omitirse."},{"q":"Sobre la eritromicina en la HVA, ¿qué es correcto?","o":["500 mg VO después de la endoscopia","250 mg IV, 30–90 min antes de la endoscopia, si no hay QT largo","Contraindicada","Se da por 5 días","Solo en várices gástricas"],"a":1,"e":"Dosis única de <strong>250 mg IV<\/strong>, <strong>30–90 min antes<\/strong>: mejora la visión y reduce transfusiones (NE 2; débil; nuevo)."},{"q":"Hombre con cirrosis Child-Pugh C 11 que sangró de várices esofágicas; se controló con LVE. ¿Qué agregas?","o":["Solo BBNS + LVE","TIPS preventivo con stent cubierto en ≤72 h","Balón de taponamiento","Cianoacrilato","Nada"],"a":1,"e":"<strong>Child-Pugh C 10–13<\/strong> es criterio de <strong>p-TIPS<\/strong> en ≤72 h (ideal &lt;24 h) (NE 1; fuerte)."},{"q":"Paciente que cumple criterios de p-TIPS tiene bilirrubina de 6 mg/dL y EH manifiesta. ¿Qué dice Baveno VIII?","o":["Contraindican el TIPS de forma absoluta","No son contraindicaciones absolutas","Solo la EH lo contraindica","Solo la bilirrubina lo contraindica","Debe esperar 6 meses"],"a":1,"e":"<strong>ACLF, EH manifiesta, hiperbilirrubinemia, MELD o hepatitis alcohólica grave<\/strong> no son contraindicaciones <strong>absolutas<\/strong> (nuevo)."},{"q":"¿Qué clasificación recomienda Baveno VIII para las várices gástricas?","o":["Paquet","Forrest","Sarin","Child","Los Ángeles"],"a":2,"e":"<strong>Sarin<\/strong>: GOV1/2 e IGV1/2 (NE 3; nuevo)."},{"q":"Mujer con cirrosis y GAVE que requiere transfusiones seriadas. ¿Qué recomienda Baveno VIII?","o":["Argón plasma","Ligadura con bandas","TIPS","Carvedilol","Gastrectomía"],"a":1,"e":"<strong>LVE sobre argón plasma<\/strong>: más erradicación, menos sesiones y menos resangrado (NE 1)."},{"q":"Hombre con cirrosis, ascitis y creatinina de 2.4 mg/dL (basal 1.0) sin respuesta a albúmina, sin choque ni nefrotóxicos. ¿Tratamiento?","o":["Furosemida IV","Terlipresina + albúmina","Dopamina","Hemodiálisis inmediata","Solo suspender el BBNS"],"a":1,"e":"<strong>SHR-LRA<\/strong>: <strong>terlipresina + albúmina<\/strong> (NE 1; fuerte; nuevo). Además, suspender o bajar el BBNS."},{"q":"Si la terlipresina no está disponible en el SHR-LRA, ¿qué alternativa recomienda Baveno VIII?","o":["Midodrina sola","Norepinefrina","Dopamina","Vasopresina","Octreotida sola"],"a":1,"e":"<strong>Norepinefrina<\/strong> si no hay terlipresina, está contraindicada o no se tolera (NE 1; fuerte)."},{"q":"¿Cuánto tiempo deben cumplirse los criterios para definir cirrosis recompensada?","o":["&gt;1 mes","&gt;3 meses","&gt;6 meses consecutivos","&gt;12 meses","&gt;24 meses"],"a":2,"e":"Criterios de causa, ascitis/EH y resangrado por <strong>más de 6 meses consecutivos<\/strong> (NE 4; nuevo)."},{"q":"En un paciente recompensado, ¿qué combinación de PNI puede descartar HPCS?","o":["LSM &lt;20 kPa + plaquetas ≥150","LSM &lt;15 kPa + SSM &lt;25 kPa","LSM &lt;25 kPa","SSM &lt;55 kPa","FIB-4 &lt;1.3"],"a":1,"e":"En recompensados: <strong>LSM &lt;10 kPa<\/strong> o <strong>LSM &lt;15 kPa + SSM &lt;25 kPa<\/strong> pueden descartar HPCS; <strong>LSM &gt;25<\/strong> la confirma."},{"q":"Paciente con Budd-Chiari crónico y un nódulo hepático nuevo. AFP 22 ng/mL. ¿Qué es correcto?","o":["Aplicar LI-RADS y tratar si es LR-5","AFP &gt;15 ng/mL sugiere CHC; RM con contraste hepatobiliar y, si se sospecha CHC, histología","Los nódulos siempre son malignos","No requiere estudio","Solo repetir AFP en 1 año"],"a":1,"e":"En SBC <strong>LI-RADS no aplica<\/strong>; <strong>AFP &gt;15 ng/mL<\/strong> sugiere CHC; RM hepatobiliar y <strong>confirmación histológica<\/strong>."},{"q":"Mujer con várices gástricas (+3) y biopsia con estenosis de vénulas portales en el 30 % de los espacios porta (+2), sin otras condiciones. ¿Resultado?","o":["0 puntos: descartada","3 puntos: posible","5 puntos: PSVD/NCPF definitiva","4 puntos: posible","No se puede calcular"],"a":2,"e":"Signo específico (+3) + lesión menor (+2) = <strong>5 puntos: definitiva<\/strong>."},{"q":"¿Qué longitud mínima de biopsia exige Baveno VIII para diagnosticar PSVD/NCPF?","o":["≥5 mm","≥10 mm total","≥15 mm con al menos un fragmento ≥10 mm","≥25 mm","No necesita biopsia"],"a":2,"e":"<strong>≥15 mm<\/strong> con al menos un fragmento <strong>≥10 mm<\/strong> (o adecuada para patólogo experto)."},{"q":"Paciente con TVP sin cirrosis y neoplasia mieloproliferativa JAK2+. ¿Duración de la anticoagulación?","o":["3 meses","6 meses","12 meses","De por vida a dosis terapéutica","No requiere"],"a":3,"e":"Con <strong>factor permanente mayor<\/strong> (trombofilia, neoplasia mieloproliferativa): anticoagulación <strong>a largo plazo a dosis plena<\/strong> (NE 3; fuerte)."}],"tf":[["En el síndrome hepatorrenal el riñón tiene daño estructural grave.",false,"Es funcional: vasoconstricción renal extrema con riñón estructuralmente sano."],["&quot;Cirrosis compensada&quot; y &quot;cACLD&quot; son sinónimos exactos.",false,"No son intercambiables; si el diagnóstico es por PNI se prefiere cACLD."],["Una LSM &lt;10 kPa descarta enfermedad vascular hepática.",false,"Con signos de hipertensión portal, LSM &lt;10 kPa debe hacer sospecharla."],["Una SSM &gt;55 kPa confirma HPCS.",true,"Con equipo de 100 Hz (NE 2; fuerte)."],["Los BBNS están indicados en cACLD sin HPCS para prevenir la descompensación.",false,"No deben usarse (NE 2; fuerte)."],["La enfermedad periodontal se asocia a más descompensación.",true,"NE 4; nuevo en Baveno VIII."],["El ácido tranexámico se recomienda en la HVA.",false,"No se recomienda, igual que el factor VIIa."],["El p-TIPS se indica en Child-Pugh C 10–13 en ≤72 h.",true,"Idealmente en &lt;24 h."],["El balón de taponamiento se prefiere sobre el stent esofágico cubierto como puente.",false,"Se prefiere el stent metálico autoexpandible cubierto."],["El recompensado sigue en vigilancia de CHC.",true,"El riesgo es menor, pero persiste."],["En el Budd-Chiari confirmado por imagen la biopsia es obligatoria.",false,"No es necesaria; solo si se sospecha afección de venas pequeñas."]]},{"id":"litiasis","n":8,"title":"Litiasis biliar","short":"Litiasis biliar","color":"#2E9E5B","src":"Lammert F, Gurusamy K, Ko CW, Miquel JF, Méndez-Sánchez N, Portincasa P, van Erpecum KJ, van Laarhoven CJ, Wang DQ-H. Gallstones. Nat Rev Dis Primers. 2016;2:16024.","hook":"Uno de cada cinco adultos tiene cálculos, pero solo los que dan síntomas son enfermedad. El tratamiento no lo decide de qué está hecho el cálculo, sino dónde está.","group":"Vía biliar","ses":23,"date":"2026-11-04","nums":[["10–20 %","de los adultos del mundo tiene cálculos biliares (Europa ~20 %)"],["&gt;90 %","de los cálculos son de colesterol"],["&gt;50 %","prevalencia a los 50 años en poblaciones amerindias (hombres y mujeres)"],["1–4 %","por año de los asintomáticos desarrolla síntomas"],["&gt;95 %","exactitud del US abdominal para cálculos en la vesícula"],["0.2–1.5 %","riesgo de lesión de la vía biliar en la colecistectomía laparoscópica"]],"esencial":"<ul><li><strong>Litiasis biliar:<\/strong> masas en la vesícula o la vía biliar por exceso de <strong>colesterol<\/strong> o de <strong>bilirrubina<\/strong> en la bilis.<\/li><li><strong>Enfermedad litiásica<\/strong> = cálculos <strong>con síntomas o complicaciones<\/strong>. El portador asintomático, en general, <strong>no<\/strong> se clasifica como enfermo.<\/li><li><mark>~10–20 % de los adultos<\/mark> tiene cálculos y <strong>más de 20 %<\/strong> de ellos tendrá síntomas en la vida.<\/li><li><strong>&gt;90 %<\/strong> son de <strong>colesterol<\/strong>; &lt;10 % son de <strong>pigmento negro<\/strong> (hemólisis, cirrosis) o <strong>café<\/strong> (vía biliar obstruida e <strong>infectada<\/strong>).<\/li><li>Las poblaciones <strong>amerindias<\/strong> e <strong>hispanas con ancestría nativa americana<\/strong> tienen el riesgo más alto del mundo (<strong>&gt;50 %<\/strong> a los 50 años).<\/li><li>Factores de riesgo: <strong>mujer, edad, embarazo, inactividad, obesidad y sobrealimentación<\/strong>; todo lo del <strong>síndrome metabólico<\/strong>.<\/li><li>La genética explica <strong>~25 %<\/strong> del riesgo; la variante más frecuente es <strong>ABCG8 p.D19H<\/strong>.<\/li><li><strong>Cólico biliar:<\/strong> dolor intenso en hipocondrio derecho o epigastrio de <strong>al menos 20–30 min<\/strong>, irradiado a espalda u hombro derecho, que cede con analgésicos.<\/li><li><strong>US abdominal<\/strong> = estudio de elección (<strong>exactitud &gt;95 %<\/strong>). Para el colédoco, <strong>USE<\/strong> (S 95 %, E 97 %) y <strong>CPRM<\/strong> (S 93 %, E 96 %).<\/li><li><strong>Asintomático:<\/strong> <strong>no<\/strong> colecistectomía de rutina, excepto <strong>vesícula en porcelana<\/strong>.<\/li><li><strong>Sintomático:<\/strong> <strong>colecistectomía laparoscópica<\/strong>, de preferencia <strong>temprana<\/strong>. El AUDC y la litotricia ya no se usan para la vesícula.<\/li><li><strong>Coledocolitiasis:<\/strong> CPRE con esfinterotomía y extracción, y después <strong>colecistectomía en ≤72 h<\/strong>.<\/li><li><strong>Pancreatitis biliar leve:<\/strong> colecistectomía <strong>en la misma hospitalización<\/strong> (recurrencia 17 % → 5 %).<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El manejo <strong>no depende de la composición<\/strong> del cálculo, sino de su <strong>localización<\/strong> (vesícula contra conductos biliares).<\/p><\/aside>","secs":[{"t":"Definición, tipos y epidemiología","h":"<figure class=\"fig\" data-fig=\"litiasis-tipos\"><svg viewBox=\"0 0 400 304\" role=\"img\" aria-label=\"Tipos de cálculos según su localización\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah31\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"62\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"62\" dy=\"0\">Dónde<\/tspan><\/text><text x=\"260\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"260\" dy=\"0\">Tipo y composición (Tabla 1)<\/tspan><\/text><rect x=\"6\" y=\"30\" width=\"112\" height=\"74\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"62\" y=\"67\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"62\" dy=\"0\">Vesícula<\/tspan><\/text><rect x=\"126\" y=\"30\" width=\"132\" height=\"74\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"192\" y=\"53.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"192\" dy=\"0\">Colesterol puro: &gt;95<\/tspan><tspan x=\"192\" dy=\"13.42\">% colesterol,<\/tspan><tspan x=\"192\" dy=\"13.42\">amarillo y duro<\/tspan><\/text><rect x=\"264\" y=\"30\" width=\"130\" height=\"74\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"329\" y=\"53.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"329\" dy=\"0\">Pigmento negro:<\/tspan><tspan x=\"329\" dy=\"13.42\">bilirrubinato de Ca<\/tspan><tspan x=\"329\" dy=\"13.42\">polimerizado<\/tspan><\/text><rect x=\"6\" y=\"114\" width=\"112\" height=\"64\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"62\" y=\"138.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"62\" dy=\"0\">Vía biliar<\/tspan><tspan x=\"62\" dy=\"14.64\">extrahepática<\/tspan><\/text><rect x=\"126\" y=\"114\" width=\"268\" height=\"64\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"260\" y=\"132.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"260\" dy=\"0\">Secundarios: colesterol mixto (&gt;50 %<\/tspan><tspan x=\"260\" dy=\"13.42\">colesterol + bilirrubinato de Ca).<\/tspan><tspan x=\"260\" dy=\"13.42\">Primarios: pigmento café<\/tspan><\/text><rect x=\"6\" y=\"188\" width=\"112\" height=\"64\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"62\" y=\"212.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"62\" dy=\"0\">Vía biliar<\/tspan><tspan x=\"62\" dy=\"14.64\">intrahepática<\/tspan><\/text><rect x=\"126\" y=\"188\" width=\"268\" height=\"64\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"260\" y=\"206.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"260\" dy=\"0\">Pigmento café: bilirrubinato de Ca<\/tspan><tspan x=\"260\" dy=\"13.42\">monomérico, multifacetado. Estasis +<\/tspan><tspan x=\"260\" dy=\"13.42\">infección (E. coli)<\/tspan><\/text><rect x=\"6\" y=\"262\" width=\"388\" height=\"36\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"200\" y=\"280\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">El manejo depende de la localización, no de la composición<\/tspan><\/text><\/svg><figcaption>Tabla 1 y Figura 1 de la revisión. <strong>&gt;90 %<\/strong> de los cálculos son de <strong>colesterol<\/strong>; el pigmento negro se asocia a <strong>hemólisis<\/strong> y el café a <strong>estasis con infección<\/strong>.<\/figcaption><\/figure><h5>Composición y localización (Tabla 1)<\/h5><div class=\"tbl\"><table><thead><tr><th>Localización<\/th><th>Tipo<\/th><th>Composición<\/th><th>Morfología<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Vesícula<\/th><td><strong>Colesterol puro<\/strong><\/td><td><strong>&gt;95 %<\/strong> colesterol (en peso)<\/td><td>Amarillo claro, duro, esférico, superficie lisa o moriforme<\/td><\/tr><tr><th scope=\"row\">Vesícula<\/th><td><strong>Pigmento negro<\/strong><\/td><td>Bilirrubinato de calcio <strong>polimerizado<\/strong><\/td><td>Negro, blando y frágil, pequeño y liso<\/td><\/tr><tr><th scope=\"row\">Colédoco<\/th><td><strong>Colesterol mixto<\/strong><\/td><td><strong>&gt;50 %<\/strong> colesterol + bilirrubinato de calcio<\/td><td>Amarillo claro a café, duro, liso<\/td><\/tr><tr><th scope=\"row\">Vía intrahepática<\/th><td><strong>Pigmento café<\/strong><\/td><td>Bilirrubinato de calcio <strong>monomérico<\/strong><\/td><td>Café, blando a duro, <strong>multifacetado<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Colecistectomías por año (por 100 000 habitantes)<\/h5><div class=\"tbl\"><table><thead><tr><th>País<\/th><th>Tasa<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Noruega / Dinamarca<\/th><td>62 / 68<\/td><\/tr><tr><th scope=\"row\">Bélgica / Alemania<\/th><td>189 / 246<\/td><\/tr><tr><th scope=\"row\">EUA<\/th><td><strong>214<\/strong> (<strong>700 000<\/strong> cirugías al año)<\/td><\/tr><tr><th scope=\"row\"><strong>Chile<\/strong> (prevalencia altísima)<\/th><td><strong>224<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Población con la prevalencia más alta de litiasis&quot;: <strong>nativos americanos<\/strong> (Norte y Sudamérica). &quot;Más baja&quot;: <strong>africanos<\/strong>.<\/p><\/aside>"},{"t":"Factores de riesgo y genética","h":"<h5>Factores exógenos (Box 1)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Factores<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Síndrome metabólico<\/strong><\/th><td>Obesidad (sobre todo <strong>central<\/strong>), inactividad física, resistencia a la insulina y diabetes, hígado graso<\/td><\/tr><tr><th scope=\"row\"><strong>Dieta<\/strong><\/th><td>Alta en calorías y carbohidratos, <strong>carga glucémica alta<\/strong>, <strong>poca fibra<\/strong>, mucho hierro hem<\/td><\/tr><tr><th scope=\"row\"><strong>Hipomotilidad vesicular<\/strong><\/th><td><strong>Ayuno prolongado<\/strong>, <strong>pérdida rápida de peso o cirugía bariátrica<\/strong>, ciclos de peso, <strong>NPT prolongada<\/strong>, lesión medular, gastrectomía<\/td><\/tr><tr><th scope=\"row\"><strong>Más ciclo enterohepático de bilirrubina<\/strong><\/th><td><strong>Cirrosis<\/strong>, <strong>Crohn<\/strong>, <strong>resección ileal<\/strong> (cálculos de pigmento negro)<\/td><\/tr><tr><th scope=\"row\"><strong>Fármacos<\/strong><\/th><td><strong>Terapia hormonal de reemplazo<\/strong>, <strong>octreotida<\/strong>, <strong>fibratos<\/strong>, <strong>inhibidores de calcineurina<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-mnemo\"><div class=\"callout-h\"><span class=\"callout-k\">Mnemotecnia<\/span><span class=\"callout-t\">Las &quot;F&quot; clásicas†<\/span><\/div><p><em>Female, Forty, Fertile, Fat<\/em> (mujer, edad, embarazo, obesidad). El artículo lo dice así: <strong>sexo femenino, edad, embarazo, inactividad física, obesidad y sobrealimentación<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Joven &lt;40 años con cálculos intrahepáticos y síntomas que <strong>regresan tras la colecistectomía<\/strong> → <strong>LPAC (ABCB4)<\/strong> → AUDC.<\/p><\/aside>"},{"t":"Fisiopatología: cálculos de colesterol","h":"<figure class=\"fig\" data-fig=\"litiasis-pato\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Los cinco defectos de la litogénesis de colesterol\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah32\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"70\" y=\"6\" width=\"260\" height=\"40\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"18.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Genes litogénicos (ABCG8 p.D19H, UGT1A1,<\/tspan><tspan x=\"200\" dy=\"14.03\">ABCB4)<\/tspan><\/text><path d=\"M200 46 L200 62\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><rect x=\"70\" y=\"62\" width=\"260\" height=\"48\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"200\" y=\"78.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hipersecreción hepática de colesterol:<\/tspan><tspan x=\"200\" dy=\"14.03\">bilis sobresaturada (causa primaria)<\/tspan><\/text><path d=\"M150 110 V123 H68 V136\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><path d=\"M200 110 L200 136\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><path d=\"M250 110 V123 H332 V136\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><rect x=\"6\" y=\"136\" width=\"124\" height=\"88\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"68\" y=\"160.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Transición de fase<\/tspan><tspan x=\"68\" dy=\"12.81\">rápida: la mucina<\/tspan><tspan x=\"68\" dy=\"12.81\">acelera la<\/tspan><tspan x=\"68\" dy=\"12.81\">cristalización<\/tspan><\/text><rect x=\"138\" y=\"136\" width=\"124\" height=\"88\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"160.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hipomotilidad: el<\/tspan><tspan x=\"200\" dy=\"12.81\">colesterol endurece<\/tspan><tspan x=\"200\" dy=\"12.81\">el músculo y<\/tspan><tspan x=\"200\" dy=\"12.81\">bloquea CCK1<\/tspan><\/text><rect x=\"270\" y=\"136\" width=\"124\" height=\"88\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"332\" y=\"154.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Intestino: más<\/tspan><tspan x=\"332\" dy=\"12.81\">desoxicolato y<\/tspan><tspan x=\"332\" dy=\"12.81\">menos sales<\/tspan><tspan x=\"332\" dy=\"12.81\">biliares (Crohn,<\/tspan><tspan x=\"332\" dy=\"12.81\">resección ileal)<\/tspan><\/text><path d=\"M68 224 V238 H150 V252\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><path d=\"M200 224 L200 252\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><path d=\"M332 224 V238 H250 V252\" class=\"fx-arr\" marker-end=\"url(#ah32)\"/><rect x=\"70\" y=\"252\" width=\"260\" height=\"42\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"200\" y=\"265.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Cristales → microlitiasis → cálculo de<\/tspan><tspan x=\"200\" dy=\"14.64\">colesterol<\/tspan><\/text><\/svg><figcaption>Figura 4a de la revisión. La <strong>hipersecreción de colesterol<\/strong> es la causa primaria; la <strong>hipomotilidad<\/strong> y la <strong>transición de fase rápida<\/strong> son consecuencias posteriores.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Causa primaria de los cálculos de colesterol&quot;: <strong>hipersecreción hepática de colesterol<\/strong>, que depende sobre todo de la <strong>predisposición genética<\/strong>.<\/p><\/aside>"},{"t":"Cálculos de pigmento","h":"<h5>Genética<\/h5><div class=\"tbl\"><table><thead><tr><th><\/th><th>Pigmento negro<\/th><th>Pigmento café<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Dónde<\/th><td><strong>Vesícula<\/strong><\/td><td><strong>Conductos biliares<\/strong> (intrahepáticos)<\/td><\/tr><tr><th scope=\"row\">Bilis<\/th><td>Estéril<\/td><td><strong>Infectada<\/strong> (<em>E. coli<\/em>)<\/td><\/tr><tr><th scope=\"row\">Causa<\/th><td><strong>Hemólisis<\/strong>, cirrosis, íleon<\/td><td><strong>Estasis + infección<\/strong><\/td><\/tr><tr><th scope=\"row\">Textura<\/th><td>Blando, frágil, pequeño<\/td><td>Blando a duro, multifacetado<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Paciente con <strong>esferocitosis<\/strong> o <strong>drepanocitosis<\/strong> con cálculos → <strong>pigmento negro<\/strong>. Cálculo <strong>primario del colédoco<\/strong> con colangitis → <strong>pigmento café<\/strong>.<\/p><\/aside>"},{"t":"Fisiopatología de las complicaciones: dónde se atora el lito","h":"<div data-fp=\"litiasis\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">El lugar decide el cuadro<\/span><\/div><p>Un cálculo en la vesícula casi nunca da síntomas (más del 80 % siguen asintomáticos). El problema empieza cuando <strong>se mueve y obstruye<\/strong>: el sitio donde se atora define la complicación.<\/p><\/aside><figure class=\"fig\" data-fig=\"litiasis-fp\"><svg viewBox=\"0 0 400 214.92\" role=\"img\" aria-label=\"Complicaciones según el sitio de obstrucción\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-litiasis\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Cálculo en la vesícula (asintomático en la<\/tspan><tspan x=\"200\" dy=\"14.03\">mayoría)<\/tspan><\/text><path d=\"M200 52.06 V63.06 H51.5 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><path d=\"M200 52.06 V63.06 H150.5 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><path d=\"M200 52.06 V63.06 H249.5 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><path d=\"M200 52.06 V63.06 H348.5 V74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><rect x=\"6\" y=\"74.06\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"51.5\" y=\"90.41\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"51.5\" dy=\"0\">Conducto<\/tspan><tspan x=\"51.5\" dy=\"12.81\">cístico, por<\/tspan><tspan x=\"51.5\" dy=\"12.81\">horas<\/tspan><\/text><rect x=\"105\" y=\"74.06\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"150.5\" y=\"90.41\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"150.5\" dy=\"0\">Conducto<\/tspan><tspan x=\"150.5\" dy=\"12.81\">cístico,<\/tspan><tspan x=\"150.5\" dy=\"12.81\">persistente<\/tspan><\/text><rect x=\"204\" y=\"74.06\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"249.5\" y=\"103.22\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"249.5\" dy=\"0\">Colédoco<\/tspan><\/text><rect x=\"303\" y=\"74.06\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#8E5BC2;fill-opacity:0.13;stroke:#8E5BC2;stroke-width:1.5\"/><text x=\"348.5\" y=\"96.815\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"348.5\" dy=\"0\">Ámpula de<\/tspan><tspan x=\"348.5\" dy=\"12.81\">Vater<\/tspan><\/text><path d=\"M51.5 130.49 L51.5 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><path d=\"M150.5 130.49 L150.5 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><path d=\"M249.5 130.49 L249.5 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><path d=\"M348.5 130.49 L348.5 152.49\" class=\"fx-arr\" marker-end=\"url(#ahfp-litiasis)\"/><rect x=\"6\" y=\"152.49\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"51.5\" y=\"181.65\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"51.5\" dy=\"0\">Cólico biliar<\/tspan><\/text><rect x=\"105\" y=\"152.49\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"150.5\" y=\"175.245\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"150.5\" dy=\"0\">Colecistitis<\/tspan><tspan x=\"150.5\" dy=\"12.81\">aguda<\/tspan><\/text><rect x=\"204\" y=\"152.49\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"249.5\" y=\"168.84\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"249.5\" dy=\"0\">Ictericia; si<\/tspan><tspan x=\"249.5\" dy=\"12.81\">se infecta,<\/tspan><tspan x=\"249.5\" dy=\"12.81\">colangitis<\/tspan><\/text><rect x=\"303\" y=\"152.49\" width=\"91\" height=\"56.43\" rx=\"9\" style=\"fill:#8E5BC2;fill-opacity:0.13;stroke:#8E5BC2;stroke-width:1.5\"/><text x=\"348.5\" y=\"175.245\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"348.5\" dy=\"0\">Pancreatitis<\/tspan><tspan x=\"348.5\" dy=\"12.81\">biliar<\/tspan><\/text><\/svg><figcaption>Cólico biliar: la vesícula se contrae (CCK tras comida grasa) contra un cístico tapado. Si la obstrucción sigue, la lisolecitina inflama la pared y luego se infecta: colecistitis.<\/figcaption><\/figure><h5>Del mecanismo a la clínica<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Contracción de la vesícula contra el cístico obstruido<\/th><td>Cólico biliar: dolor en CSD o epigastrio de 30 min a horas, tras comida grasa; sin fiebre ni leucocitosis<\/td><\/tr><tr><th scope=\"row\">Obstrucción persistente → irritación química (lisolecitina) → isquemia e infección secundaria<\/th><td>Colecistitis: dolor &gt;6 h, Murphy, fiebre, leucocitosis<\/td><\/tr><tr><th scope=\"row\">Lito en el colédoco: la bilis no sale<\/th><td>Ictericia, coluria, acolia, FA y GGT altas<\/td><\/tr><tr><th scope=\"row\">Bilis estancada + bacterias<\/th><td>Colangitis (Charcot)<\/td><\/tr><tr><th scope=\"row\">Lito en el ámpula: reflujo y presión en el conducto pancreático<\/th><td>Pancreatitis aguda biliar<\/td><\/tr><tr><th scope=\"row\">Lito grande que erosiona hacia el intestino (fístula colecistoentérica)<\/th><td>Íleo biliar (obstrucción en el íleon terminal)<\/td><\/tr>
