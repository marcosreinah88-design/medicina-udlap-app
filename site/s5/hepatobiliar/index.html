"h":"<h5>Criterios de traslado (Tabla 5)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Conducta<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">III<\/th><td><strong>Traslado inmediato<\/strong> a un hospital con drenaje biliar de urgencia y cuidados intensivos<\/td><\/tr><tr><th scope=\"row\">II<\/th><td>Tratar donde haya drenaje biliar y manejo sistémico; si no, <strong>trasladar<\/strong><\/td><\/tr><tr><th scope=\"row\">I<\/th><td>Si hay <strong>lito en el colédoco<\/strong> o <strong>no responde en 24 h<\/strong>, actuar como en la moderada<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La rTM mejoró la <strong>resolución de la CID<\/strong>, <strong>no la mortalidad<\/strong>. Y la litotomía en un tiempo tiene <strong>más complicaciones post-CPRE<\/strong> (17.1 % vs 0 %).<\/p><\/aside>"},{"t":"Colangitis contra colecistitis (Tokio 2018)","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>En <strong>colangitis<\/strong> el grado II pide <strong>dos<\/strong> factores; en <strong>colecistitis<\/strong> basta <strong>uno<\/strong>. El grado III es igual en ambas. Los leucocitos del grado II: <strong>&gt;12,000<\/strong> (colangitis) vs <strong>&gt;18,000<\/strong> (colecistitis).<\/p><\/aside>"}],"pearls":["Charcot es muy específica pero poco sensible (26.4 % y 21.2 % en series recientes): no es criterio diagnóstico.","Criterios TG18 = TG13: A inflamación sistémica (obligatoria), B colestasis, C imagen.","Sospecha: A + (B o C). Definitivo: A + B + C.","Cortes diagnósticos: fiebre &gt;38 °C; leucocitos &lt;4,000 o &gt;10,000; PCR ≥1 mg/dL; BT ≥2 mg/dL; FA, GGT, AST, ALT &gt;1.5 × LSN.","Se quitó el dolor abdominal de los criterios porque daba falsos positivos por colecistitis (38.8 % → 5.9 %).","Grado III: una sola disfunción orgánica (dopamina ≥5 o cualquier norepinefrina, conciencia, PaO2/FiO2 &lt;300, Cr &gt;2.0 u oliguria, INR &gt;1.5, plaquetas &lt;100,000).","Grado II: dos o más de leucocitos &gt;12,000 o &lt;4,000, fiebre ≥39 °C, edad ≥75, BT ≥5 mg/dL, albúmina &lt;LIN × 0.7.","Grado I: no cumple II ni III al diagnóstico inicial.","Grado I: antibiótico; drenar si no responde en 24 h o hay lito en el colédoco.","Grado II: drenaje temprano; en TG18 se puede hacer EST + extracción del lito en el mismo tiempo.","Grado III: soporte orgánico y drenaje urgente en cuanto se estabilice; la causa, después.","Solo en el grado II el drenaje en &lt;24 h bajó la mortalidad a 30 días (1.7 % vs 3.4 %).","Hemocultivo antes del antibiótico; cultivo de bilis en todo drenaje.","Primer estudio de imagen: US abdominal; si no es concluyente, CPRM. La CPRE es terapéutica.","Opioides contraen el esfínter de Oddi: úsalos con precaución, pero no retrases la analgesia."],"comps":[{"title":"Colangitis aguda contra colecistitis aguda (TG18)","cols":["Colangitis aguda","Colecistitis aguda"],"rows":[["Proceso","Obstrucción de la <strong>vía biliar<\/strong> con bilis infectada a presión","Inflamación de la <strong>vesícula<\/strong>"],["Criterio A","<strong>Inflamación sistémica<\/strong> (fiebre, leucocitos, PCR)","<strong>Signos locales<\/strong>: Murphy, masa o dolor en CSD"],["Criterio B","<strong>Colestasis<\/strong> (BT ≥2, PFH &gt;1.5 × LSN)","<strong>Signos sistémicos<\/strong>: fiebre, PCR, leucocitos"],["Criterio C","Dilatación biliar o causa en imagen","Imagen característica de colecistitis"],["Sospecha","A + (B o C)","A + B"],["Definitivo","A + B + C","A + B + C"],["Grado III","≥1 de seis disfunciones orgánicas","Las <strong>mismas<\/strong> seis disfunciones"],["Grado II","<strong>≥2<\/strong>: leucocitos &gt;12,000 o &lt;4,000, fiebre ≥39 °C, edad ≥75, BT ≥5, albúmina baja","<strong>≥1<\/strong>: leucocitos &gt;18,000, masa dolorosa, &gt;72 h, inflamación local marcada"],["Tratamiento clave","Antibiótico + <strong>drenaje biliar<\/strong>","Antibiótico + colecistectomía o drenaje vesicular†"],["Signo de Murphy","Ayuda a pensar en otra cosa","<strong>Específico<\/strong>"]],"key":"En la colangitis el problema es la <strong>vía biliar obstruida<\/strong> (colestasis + dilatación) y la inflamación sistémica es obligatoria; en la colecistitis manda el <strong>signo local<\/strong> (Murphy). Grado III igual; grado II: dos factores en colangitis, uno en colecistitis."},{"title":"Grado I contra II contra III","cols":["Grado I","Grado II","Grado III"],"rows":[["Definición","No cumple II ni III al diagnóstico","≥2 factores de riesgo, sin falla orgánica","≥1 disfunción orgánica por sepsis"],["Frecuencia (Japón–Taiwán)","41.6 %","33.3 %","25.1 %"],["Mortalidad a 30 días (calculada de la Tabla 3)","≈1.2 %","≈2.6 %","≈5.1 %"],["¿El drenaje en &lt;24 h bajó la mortalidad?","No (1.3 % vs 1.2 %)","<strong>Sí (1.7 % vs 3.4 %)<\/strong>","No (5.4 % vs 4.9 %)"],["Antibiótico","Sí; suele bastar","Sí","Sí"],["Drenaje biliar","Si no responde en 24 h o hay lito en el colédoco","<strong>Temprano<\/strong>","<strong>Urgente<\/strong>, tras estabilizar"],["Soporte orgánico","No","No","Intubación, ventilación, vasopresores"],["Tratamiento de la causa","Puede ir con el drenaje","Al mejorar o en el mismo tiempo (TG18)","Solo después de mejorar"],["Traslado (Tabla 5)","Como moderada si hay lito o no responde","Si no hay drenaje en el hospital","Inmediato a un centro con drenaje y UCI"]],"key":"La línea que decide es la <strong>falla orgánica<\/strong> (grado III: reanimar y drenar urgente) y, sin ella, <strong>dos factores de riesgo<\/strong> (grado II: drenar temprano). El grado II es donde el drenaje oportuno cambia la mortalidad."}],"algos":[{"title":"Colangitis aguda: diagnóstico, gravedad y manejo (TG18)","src":"Tablas 2 y 4 de Kiriyama; Figuras 1 y 2 y Tabla 5 de Miura","start":"v","nodes":{"v":{"q":"Sospecha de infección biliar (fiebre, escalofríos, dolor abdominal, ictericia, náusea, vómito o alteración de la conciencia). ¿Los <strong>signos vitales<\/strong> indican urgencia (choque, alteración de la conciencia, insuficiencia respiratoria)?","i":"","o":[["Sí, es urgente","urg"],["No","a"]]},"urg":{"q":"Inicia <strong>de inmediato<\/strong> líquidos, antibiótico y manejo respiratorio y circulatorio <strong>sin esperar el diagnóstico definitivo<\/strong>. Luego continúa con los criterios.","i":"","o":[["Continuar","a"]]},"a":{"q":"<strong>Criterio A (inflamación sistémica):<\/strong> ¿tiene <strong>fiebre &gt;38 °C y/o escalofríos<\/strong>, o <strong>leucocitos &lt;4,000 o &gt;10,000/µL<\/strong>, o <strong>PCR ≥1 mg/dL<\/strong>?","i":"Sin A no se puede diagnosticar colangitis aguda con TG18, aunque haya ictericia y dilatación.","o":[["Sí","b"],["No","noA"]]},"noA":{"end":1,"tone":"warn","text":"<strong>No cumple criterios de colangitis aguda<\/strong> (falta inflamación sistémica). Si hay colestasis u obstrucción, estudia la causa (US, CPRM) y <strong>reevalúa<\/strong>: los casos leves pueden no tener fiebre al inicio. Considera hepatitis aguda (serología viral)."},"b":{"q":"<strong>Criterio B (colestasis):<\/strong> ¿<strong>BT ≥2 mg/dL<\/strong> o <strong>FA, GGT, AST o ALT &gt;1.5 × LSN<\/strong>?","i":"","o":[["Sí","cB"],["No","cNoB"]]},"cB":{"q":"<strong>Criterio C (imagen, US primero):<\/strong> ¿hay <strong>dilatación biliar<\/strong> o <strong>causa visible<\/strong> (estenosis, lito, stent)?","i":"","o":[["Sí","def"],["No o aún sin imagen","sosp"]]},"cNoB":{"q":"<strong>Criterio C (imagen):<\/strong> ¿hay <strong>dilatación biliar<\/strong> o <strong>causa visible<\/strong>?","i":"","o":[["Sí","sosp"],["No","noDx"]]},"noDx":{"end":1,"tone":"warn","text":"Solo hay inflamación sistémica: <strong>no cumple<\/strong> criterios de colangitis. Busca otro foco; considera colecistitis (signo de Murphy, imagen vesicular)."},"sosp":{"q":"<strong>Sospecha de colangitis aguda<\/strong> (A + B o C). Completa la imagen (US, TC o CPRM) y trátala como colangitis mientras tanto. Ahora gradúa: ¿tiene <strong>alguna disfunción orgánica<\/strong>?","i":"Dopamina ≥5 µg/kg/min o cualquier norepinefrina · alteración de la conciencia · PaO2/FiO2 &lt;300 · oliguria o Cr &gt;2.0 mg/dL · INR &gt;1.5 · plaquetas &lt;100,000/mm³","o":[["Sí, al menos una","g3"],["Ninguna","g2q"]]},"def":{"q":"<strong>Colangitis aguda definitiva<\/strong> (A + B + C). Gradúa: ¿tiene <strong>alguna disfunción orgánica<\/strong>?","i":"Dopamina ≥5 µg/kg/min o cualquier norepinefrina · alteración de la conciencia · PaO2/FiO2 &lt;300 · oliguria o Cr &gt;2.0 mg/dL · INR &gt;1.5 · plaquetas &lt;100,000/mm³","o":[["Sí, al menos una","g3"],["Ninguna","g2q"]]},"g2q":{"q":"¿Cuántos factores de <strong>grado II<\/strong> tiene?","i":"Leucocitos &gt;12,000 o &lt;4,000/mm³ · fiebre ≥39 °C · edad ≥75 años · BT ≥5 mg/dL · albúmina &lt; límite inferior × 0.7","o":[["Dos o más","g2"],["Uno o ninguno","g1"]]},"g3":{"end":1,"tone":"bad","text":"<strong>Grado III (grave).<\/strong> Hemocultivo, antibiótico y <strong>soporte respiratorio y circulatorio<\/strong> (intubación, ventilación, vasopresores). <strong>Drenaje biliar urgente<\/strong> endoscópico o percutáneo en cuanto se estabilice, con <strong>cultivo de bilis<\/strong>. La causa se trata <strong>después<\/strong> de que mejore el estado general. Con CID puede considerarse <strong>rTM<\/strong>. Si el hospital no puede, <strong>traslado inmediato<\/strong>."},"g2":{"end":1,"tone":"warn","text":"<strong>Grado II (moderado).<\/strong> Hemocultivo, antibiótico y soporte general. <strong>Drenaje biliar temprano<\/strong> (endoscópico o percutáneo) con cultivo de bilis. La causa se trata al mejorar o, <strong>si es posible, en el mismo tiempo<\/strong> (EST + coledocolitotomía; cambio de TG18). Valora Charlson y ASA-PS. Si no se puede drenar en tu hospital, <strong>traslada<\/strong>."},"g1":{"q":"<strong>Grado I (leve).<\/strong> Antibiótico y soporte general. ¿Hay <strong>lito en el colédoco<\/strong> o <strong>no responde<\/strong> en 24 h?","i":"","o":[["No: responde y no hay lito","g1ok"],["Sí","g1dr"]]},"g1ok":{"end":1,"tone":"ok","text":"<strong>Continúa el tratamiento médico.<\/strong> La mayoría de los grado I no requiere drenaje. Reevalúa la gravedad con frecuencia. Trata la causa si es necesario (endoscópica, percutánea o quirúrgica)."},"g1dr":{"end":1,"tone":"warn","text":"<strong>Manejo como moderada: drenaje biliar<\/strong> con cultivo de bilis. La <strong>EST y la extracción del lito<\/strong> pueden hacerse en el mismo tiempo que el drenaje."}}},{"title":"Calculadora de gravedad TG18 paso a paso","src":"Tabla 4 de Kiriyama (TG18/TG13)","start":"cv","nodes":{"cv":{"q":"¿Hipotensión que requiere <strong>dopamina ≥5 µg/kg/min<\/strong> o <strong>cualquier dosis de norepinefrina<\/strong>?","i":"","o":[["Sí","g3"],["No","neu"]]},"neu":{"q":"¿<strong>Alteración de la conciencia<\/strong>?","i":"","o":[["Sí","g3"],["No","resp"]]},"resp":{"q":"¿<strong>PaO2/FiO2 &lt;300<\/strong>?","i":"","o":[["Sí","g3"],["No","ren"]]},"ren":{"q":"¿<strong>Oliguria<\/strong> o <strong>creatinina &gt;2.0 mg/dL<\/strong>?","i":"","o":[["Sí","g3"],["No","hep"]]},"hep":{"q":"¿<strong>INR &gt;1.5<\/strong>?","i":"","o":[["Sí","g3"],["No","hem"]]},"hem":{"q":"¿<strong>Plaquetas &lt;100,000/mm³<\/strong>?","i":"","o":[["Sí","g3"],["No","f"]]},"f":{"q":"Sin disfunción orgánica. Cuenta los factores de grado II: <strong>leucocitos &gt;12,000 o &lt;4,000<\/strong>, <strong>fiebre ≥39 °C<\/strong>, <strong>edad ≥75<\/strong>, <strong>BT ≥5 mg/dL<\/strong>, <strong>albúmina &lt;LIN × 0.7<\/strong>. ¿Cuántos tiene?","i":"","o":[["0","g1"],["1","g1"],["2 o más","g2"]]},"g3":{"end":1,"tone":"bad","text":"<strong>Grado III.<\/strong> Una sola disfunción basta. Soporte orgánico y drenaje urgente al estabilizar."},"g2":{"end":1,"tone":"warn","text":"<strong>Grado II.<\/strong> Drenaje biliar temprano. En el estudio Japón–Taiwán, drenar en &lt;24 h bajó la mortalidad a 30 días de 3.4 % a 1.7 %."},"g1":{"end":1,"tone":"ok","text":"<strong>Grado I.<\/strong> Antibiótico; drenar si no responde en 24 h o hay lito en el colédoco."}}}],"cards":[["Definición de colangitis aguda","Estenosis biliar (litos o tumor) que produce colestasis e infección de la bilis; la presión alta lleva bacterias o endotoxinas a la circulación y causa respuesta inflamatoria sistémica."],["Dos condiciones para que haya colangitis","Obstrucción de la vía biliar + bacterias en la bilis. La presión alta (&gt;20–25 cmH₂O) abre las uniones estrechas y causa reflujo colangiovenoso: bacteriemia y endotoxemia."],["Vía de entrada más común de las bacterias a la vía biliar","Ascendente desde el duodeno (más si hay esfinterotomía, stent o anastomosis bilioentérica); también portal por translocación."],["Germen más frecuente en la colangitis aguda","<em>E. coli<\/em>; luego <em>Klebsiella<\/em>, <em>Enterobacter<\/em> y <em>Enterococcus<\/em>. Anaerobios con anastomosis bilioentérica. A menudo polimicrobiana."],["Por qué el antibiótico solo no basta en la colangitis","Con la vía obstruida el antibiótico casi no llega a la bilis y la presión sigue mandando bacterias a la sangre: hay que descomprimir (control de la fuente)."],["Componentes de la triada de Charcot","Fiebre (con o sin escalofríos), dolor abdominal e ictericia."],["Especificidad de Charcot","Muy alta (sin cifra en TG18)."],["TG07 reclasificado con las tres manifestaciones de Charcot","Sensibilidad 95.1 %, especificidad 66.3 % (38.8 % de falsos positivos por colecistitis)."],["Criterio B de Tokio","Colestasis: B-1 ictericia; B-2 PFH anormales."],["Corte de fiebre en A-1","Temperatura &gt;38 °C (el texto la define ≥38 °C)."],["Corte de bilirrubina en B-1","Bilirrubina total ≥2 mg/dL."],["Hepatitis aguda en el diferencial","Rara vez da respuesta inflamatoria sistémica marcada; pedir pruebas virológicas y serológicas si hay duda."],["¿Por qué no se diagnosticaron 609 pacientes con TG13?","511 (83.9 %) no tenían inflamación sistémica."],["Aprobación de los criterios de gravedad","93.7 %."],["US para litos del colédoco (Abboud)","Sensibilidad 38 %, especificidad 100 %."],["CPRM en ictericia obstructiva","Identificó enfermedad benigna y maligna en 98 % y 98 %."],["¿La CPRE es estudio diagnóstico de primera elección?","No: se usa para tratar (drenar)."],["Grado III: criterio cardiovascular","Hipotensión que requiere dopamina ≥5 µg/kg/min o cualquier dosis de norepinefrina."],["Grado III: criterio hepático","INR &gt;1.5."],["Factores de grado II","Leucocitos &gt;12,000 o &lt;4,000; fiebre ≥39 °C; edad ≥75; BT ≥5 mg/dL; albúmina &lt;LIN × 0.7."],["Excepción a &quot;más grado, más mortalidad&quot;","La colangitis por tumores malignos."],["Mortalidad a 30 días en grado II: drenaje &lt;24 h vs tardío o sin drenaje","1.7 % vs 3.4 % (P &lt;0.05)."],["Biomarcador sugerido para la gravedad (nivel D)","Procalcitonina."],["Signo de Murphy","Detención de la inspiración por dolor al comprimir el CSD; específico de colecistitis."],["¿Por qué ayuno?","Para poder hacer drenaje de urgencia."],["Manejo del grado I","Antibiótico; drenaje si no responde (24 h) o hay lito en el colédoco."],["Complicaciones post-CPRE: un tiempo vs dos tiempos (ECA)","17.1 % vs 0 % (P = 0.025)."],["Traslado en grado III","Inmediato a un hospital con drenaje de urgencia y cuidados intensivos."]],"mcq":[{"q":"Hombre de 68 años con fiebre de 38.6 °C y escalofríos. Leucocitos 14,500/µL, BT 3.1 mg/dL, FA 3 veces el LSN. El US muestra colédoco de 11 mm con un lito distal. Según TG18, ¿cómo clasificas el diagnóstico?","o":["Sospecha de colangitis aguda","Diagnóstico definitivo de colangitis aguda","No cumple criterios: falta el dolor abdominal","No cumple criterios: falta la triada de Charcot","Colecistitis aguda definitiva"],"a":1,"e":"Tiene <strong>A<\/strong> (fiebre &gt;38 °C, leucocitos &gt;10,000), <strong>B<\/strong> (BT ≥2, FA &gt;1.5 × LSN) y <strong>C<\/strong> (dilatación y lito): <strong>A + B + C = definitivo<\/strong>. El dolor no es criterio."},{"q":"Mujer de 55 años con BT 4.0 mg/dL, GGT 5 × LSN y colédoco dilatado por un lito en la TC. Afebril, leucocitos 7,800/µL y PCR 0.4 mg/dL. Según TG18:","o":["No cumple criterios de colangitis: falta inflamación sistémica","Sospecha de colangitis","Colangitis definitiva grado I","Colangitis definitiva grado II","Colangitis grado III"],"a":0,"e":"Tiene B y C, pero <strong>no tiene A<\/strong>. La inflamación sistémica es <strong>obligatoria<\/strong>: sin A no hay diagnóstico de colangitis (es coledocolitiasis con colestasis)."},{"q":"¿Cuál es el corte de leucocitos del criterio diagnóstico A-2?","o":["&gt;12,000 o &lt;4,000/µL","&gt;18,000/µL","&gt;10,000 o &lt;4,000/µL","&gt;15,000/µL","&gt;11,000 o &lt;3,000/µL"],"a":2,"e":"Diagnóstico: <strong>&lt;4 o &gt;10 (× 1,000/µL)<\/strong>. El corte <strong>&gt;12,000 o &lt;4,000<\/strong> es del <strong>grado II<\/strong>; <strong>&gt;18,000<\/strong> es del grado II de <strong>colecistitis<\/strong>."},{"q":"En el criterio B-2, ¿a partir de qué valor se consideran anormales FA, GGT, AST y ALT?","o":["&gt;1.5 × LSN","&gt;2 × LSN","&gt;3 × LSN","&gt;5 × LSN","&gt;10 × LSN"],"a":0,"e":"B-2: FA, GGT, AST y ALT <strong>&gt;1.5 × LSN<\/strong> (STD = límite superior normal)."},{"q":"¿Qué sensibilidad tuvo la triada de Charcot en las series multicéntricas recientes citadas por TG18?","o":["90–95 %","50–70 %","Alrededor de 26 % (26.4 % y 21.2 %)","10 %","100 %"],"a":2,"e":"Series antiguas: 50–70 %; series multicéntricas recientes: <strong>26.4 % y 21.2 %<\/strong>. Por eso no es criterio diagnóstico."},{"q":"¿Cuál fue la tasa diagnóstica de los criterios TG13 en el estudio Japón–Taiwán de 6,063 pacientes?","o":["73.1 %","79.4 %","83.6 %","90.0 %","98.6 %"],"a":3,"e":"TG13 (definitivo o sospecha): <strong>90.0 %<\/strong> contra <strong>79.4 %<\/strong> con TG07. 73.1 % fue solo definitivo; 83.6 % en grado I; 98.6 % fue la aprobación en la audiencia."},{"q":"Hombre de 70 años con dolor en CSD, fiebre e ictericia. ¿Cuál es el primer estudio de imagen recomendado?","o":["CPRE diagnóstica","Radiografía simple de abdomen","Ultrasonido abdominal","Colangiorresonancia","Gammagrafía HIDA"],"a":2,"e":"El <strong>US abdominal<\/strong> va primero: poco invasivo, accesible, práctico y barato (recomendación 1, nivel D). La radiografía no sirve y la CPRE es terapéutica."},{"q":"¿Por qué la sensibilidad de la TC para litos del colédoco es variable (25–90 %)?","o":["Por el gas intestinal","Porque depende del contenido de calcio (fosfato o carbonato) del lito","Por la obesidad","Porque requiere contraste oral","Porque solo ve litos de colesterol puro"],"a":1,"e":"La atenuación del lito depende de su <strong>fosfato o carbonato de calcio<\/strong>. La TC no se afecta por gas, a diferencia del US."},{"q":"¿Qué es el THAD en la TC dinámica?","o":["Un lito calcificado","Diferencias transitorias de atenuación hepática en fase arterial temprana","Gas en la vía biliar","Engrosamiento de la pared vesicular","Trombosis de la vena porta"],"a":1,"e":"<strong>THAD<\/strong>: realce heterogéneo transitorio en fase arterial (más flujo arterial por la inflamación). En <strong>67.9–85 %<\/strong> de las colangitis y <strong>1.78–5 %<\/strong> de los sanos; poco específico."},{"q":"Hombre de 78 años con colangitis definitiva: 39.4 °C, leucocitos 9,000/µL, BT 3.2 mg/dL, albúmina normal, sin disfunción orgánica. ¿Grado?","o":["Grado I","Grado II","Grado III","Sospecha, no se gradúa","Grado II solo si BT ≥5"],"a":1,"e":"<strong>Edad ≥75<\/strong> + <strong>fiebre ≥39 °C<\/strong> = <strong>2 factores → grado II<\/strong>. Los leucocitos y la BT no llegan al corte, pero no hacen falta."},{"q":"¿Cuál es el criterio respiratorio de grado III?","o":["SpO2 &lt;90 %","FR &gt;22","PaO2/FiO2 &lt;300","PaO2/FiO2 &lt;200","Necesidad de oxígeno suplementario"],"a":2,"e":"Disfunción respiratoria: <strong>PaO2/FiO2 &lt;300<\/strong>."},{"q":"¿Cuál es el criterio renal de grado III?","o":["Creatinina &gt;1.2 mg/dL","Creatinina &gt;2.0 mg/dL u oliguria","BUN &gt;40","Creatinina &gt;4.0 mg/dL","Necesidad de diálisis"],"a":1,"e":"Renal: <strong>oliguria o creatinina &gt;2.0 mg/dL<\/strong>."},{"q":"Paciente con colangitis y alteración del estado de conciencia, sin otras alteraciones. ¿Grado?","o":["Grado I","Grado II","Grado III","Depende de la edad","Depende de la bilirrubina"],"a":2,"e":"Disfunción neurológica (<strong>alteración de la conciencia<\/strong>) = <strong>grado III<\/strong>. En análisis univariado fue el predictor de riesgo más importante."},{"q":"En el estudio Japón–Taiwán, ¿en qué grado el drenaje biliar en &lt;24 h redujo significativamente la mortalidad a 30 días?","o":["Grado I","Grado II","Grado III","En todos","En ninguno"],"a":1,"e":"Grado II: <strong>1.7 % vs 3.4 %<\/strong> (P &lt;0.05). En grados I y III no hubo diferencia."},{"q":"¿Cuál fue la distribución de gravedad en los 6,063 pacientes del estudio Japón–Taiwán?","o":["I 41.6 %, II 33.3 %, III 25.1 %","I 70 %, II 20 %, III 10 %","I 25.1 %, II 33.3 %, III 41.6 %","I 50 %, II 40 %, III 10 %","I 33 %, II 33 %, III 33 %"],"a":0,"e":"Grado I <strong>2,523 (41.6 %)<\/strong>, II <strong>2,019 (33.3 %)<\/strong>, III <strong>1,521 (25.1 %)<\/strong>."},{"q":"Mujer de 50 años con colangitis grado I por coledocolitiasis. Tras 24 h de antibiótico sigue con fiebre y dolor. ¿Qué indicas?","o":["Cambiar de antibiótico y esperar 72 h","Drenaje biliar (y, si es posible, EST con extracción del lito)","Colecistectomía urgente","Alta con antibiótico oral","Colangiorresonancia y seguir observando"],"a":1,"e":"En el grado I, si <strong>no responde al tratamiento inicial (en 24 h)<\/strong> o hay <strong>lito en el colédoco<\/strong>, se maneja como la moderada: <strong>drenaje<\/strong>; la EST y la litotomía pueden hacerse al mismo tiempo."},{"q":"Mujer de 70 años con colangitis, TA 75/40 mmHg con norepinefrina, PaO2/FiO2 250 y plaquetas 70,000. ¿Cuál es la secuencia correcta?","o":["CPRE con extracción completa de litos de inmediato, antes de reanimar","Soporte respiratorio y circulatorio + antibiótico y drenaje biliar urgente en cuanto se estabilice; la causa después","Solo antibiótico 72 h y reevaluar","Colecistectomía abierta urgente","Drenaje electivo en 1 semana"],"a":1,"e":"Grado III: <strong>soporte orgánico<\/strong> (intubación, ventilación, vasopresores), <strong>drenaje urgente<\/strong> endoscópico o percutáneo tras estabilizar, y la <strong>causa cuando mejore<\/strong> el estado general."},{"q":"¿Qué muestra debe enviarse a cultivo siempre que se hace drenaje biliar?","o":["Orina","Bilis","Heces","Exudado faríngeo","Líquido de ascitis"],"a":1,"e":"Si se drena, <strong>siempre<\/strong> cultivo de <strong>bilis<\/strong>. El <strong>hemocultivo<\/strong> se toma antes del antibiótico."},{"q":"Paciente con fiebre, ictericia, TA 70/40 y somnolencia en urgencias. Aún no hay estudios. ¿Qué hace TG18?","o":["Esperar la US para confirmar antes de tratar","Iniciar tratamiento médico inicial con manejo respiratorio y circulatorio sin esperar el diagnóstico definitivo","Pedir CPRM urgente antes de cualquier tratamiento","Dar analgesia y observar","Trasladar sin tratar"],"a":1,"e":"Si es <strong>urgente<\/strong>, el tratamiento inicial empieza <strong>de inmediato<\/strong>, <strong>sin esperar<\/strong> el diagnóstico definitivo."},{"q":"En el ECA citado por TG18, la litotomía endoscópica en un tiempo (vs dos tiempos) en colangitis leve o moderada por coledocolitiasis se asoció a:","o":["Menor mortalidad","Más complicaciones post-CPRE (17.1 % vs 0 %)","Menos complicaciones","Igual estancia sin complicaciones en ambos","Más litos residuales"],"a":1,"e":"Fue segura y factible, pero con <strong>más complicaciones post-CPRE: 17.1 % (6/35) vs 0 % (0/33)<\/strong>, P = 0.025. Precaución."},{"q":"Hospital de segundo nivel sin endoscopia ni radiología intervencionista recibe una colangitis grado II estable. Según la Tabla 5, ¿qué hace?","o":["Tratar solo con antibiótico ahí","Trasladar a un hospital que pueda hacer drenaje biliar y manejo sistémico","Operar con cirugía abierta","Dar de alta","Esperar a que se vuelva grado III"],"a":1,"e":"Grado II: tratar donde haya <strong>drenaje biliar y manejo sistémico<\/strong>; si no, <strong>trasladar<\/strong>, aunque todavía no requiera el drenaje."},{"q":"Paciente operado de derivación biliar que presenta colangitis leve posoperatoria. ¿Qué suele bastar?","o":["Drenaje percutáneo urgente","Reoperación","Antibiótico solo","CPRE urgente","Trasplante"],"a":2,"e":"La <strong>colangitis posoperatoria<\/strong> suele mejorar <strong>solo con antibiótico<\/strong>; el drenaje no suele ser necesario."},{"q":"Sobre la procalcitonina en la colangitis aguda, TG18 concluye que:","o":["Es criterio diagnóstico obligatorio","Se sugiere útil para valorar la gravedad, con poca evidencia","No tiene relación con la gravedad","Sustituye al hemocultivo","Define el grado III"],"a":1,"e":"Tres series pequeñas mostraron más procalcitonina a mayor gravedad: <strong>útil para la gravedad (nivel D)<\/strong>; falta evidencia."},{"q":"En el estudio de 130 vs 82 pacientes con colangitis leve o moderada, el drenaje en &lt;24 h:","o":["Redujo la mortalidad a cero","Acortó la estancia (6.8 vs 9.2 días) sin diferencia en mortalidad","Aumentó las complicaciones","No cambió nada","Aumentó la estancia"],"a":1,"e":"Mortalidad <strong>cero en ambos<\/strong>; estancia <strong>6.8 vs 9.2 días<\/strong> (P &lt;0.01)."},{"q":"En la fisiopatología de la colangitis aguda, ¿qué mecanismo explica directamente la bacteriemia y la sepsis?","o":["Necrosis isquémica de la pared de la vesícula","Autodigestión por activación de tripsina","Reflujo colangiovenoso por aumento de la presión intrabiliar","Hemólisis con exceso de bilirrubina no conjugada","Inflamación granulomatosa de los conductos biliares"],"a":2,"e":"La obstrucción con bilis infectada sube la presión, se abren las uniones estrechas y bacterias y endotoxinas pasan a la sangre (<strong>reflujo colangiovenoso<\/strong>). Por eso hay que <strong>descomprimir<\/strong>."}],"tf":[["La triada de Charcot es muy específica pero poco sensible para colangitis aguda.",true,"Sensibilidad 50–70 % (antigua) y 26.4 % y 21.2 % (reciente)."],["La sola presencia de bacterias en la bilis, sin obstrucción, basta para causar colangitis aguda.",false,"Hace falta también obstrucción con presión alta; la bactibilia sola suele ser asintomática."],["El aumento de la presión intrabiliar causa reflujo colangiovenoso de bacterias y endotoxinas.",true,"Por arriba de ~20–25 cmH₂O se abren las uniones estrechas y pasan a la sangre."],["Sin inflamación sistémica (criterio A) no se puede diagnosticar colangitis con TG18.",true,"A es obligatorio en sospecha y en definitivo."],["El corte de leucocitos para el diagnóstico es &lt;4,000 o &gt;10,000/µL.",true,"El de grado II es &gt;12,000 o &lt;4,000."],["Los criterios TG18 son distintos de los TG13.",false,"TG18 adoptó los TG13 sin cambios."],["Cualquier dosis de norepinefrina define disfunción cardiovascular.",true,"También la dopamina ≥5 µg/kg/min."],["El drenaje en &lt;24 h redujo la mortalidad en el grado III.",false,"Solo en el grado II (1.7 % vs 3.4 %)."],["En el grado III se recomienda extraer los litos en el mismo procedimiento del drenaje.",false,"La causa se trata después de que mejore el estado general."],["Hay que cultivar la bilis cada vez que se drena.",true,"Lo exige el diagrama de flujo."],["La TC detecta todos los litos del colédoco.",false,"Su sensibilidad es 25–90 %."],["La rTM redujo significativamente la mortalidad en la CID por colangitis.",false,"Mejoró la resolución de la CID, no la mortalidad."]]},{"id":"pancreas","n":10,"title":"Pancreatitis aguda","short":"Pancreatitis aguda","color":"#B5487E","src":"Mittal N, Oza VM, Muniraj T, Kothari TH. Diagnosis and Management of Acute Pancreatitis. Diagnostics (Basel). 2025;15(3):258.","hook":"Dos de tres: dolor que va a la espalda, lipasa o amilasa al triple, o una imagen que lo muestre. Lo que decide el pronóstico no es la enzima, sino la falla orgánica y cuánto dura: menos o más de 48 horas.","group":"Páncreas","ses":25,"date":"2026-11-11","nums":[["2 de 3","criterios para diagnosticar pancreatitis aguda"],["≥3×","el límite superior normal de lipasa o amilasa"],["~50 %","de los casos en Occidente son por litos (causa n.º 1)"],["48 h","separan la falla orgánica transitoria de la persistente"],["5–10 mL/kg/h","ritmo de líquidos IV recomendado por la revisión en las primeras 24 h"],["~20 %","recurre tras el primer episodio; la mitad de ellos llega a pancreatitis crónica"]],"esencial":"<ul><li><strong>Definición:<\/strong> inflamación del <strong>páncreas exocrino<\/strong> con dolor abdominal intenso, elevación de amilasa y lipasa y/o disfunción orgánica.<\/li><li><strong>Diagnóstico = 2 de 3:<\/strong> dolor abdominal <strong>irradiado a la espalda<\/strong>, <strong>lipasa o amilasa ≥3 veces el LSN<\/strong>, hallazgos de pancreatitis en <strong>TC o RM<\/strong>.<\/li><li>Los dos primeros criterios solos pueden <strong>no identificar a 1 de cada 4<\/strong> pacientes.<\/li><li><strong>Causa n.º 1: litos biliares<\/strong> (~50 % en Occidente; 66 % de las biliares son mujeres). <strong>N.º 2: alcohol<\/strong> (~33 %). <strong>N.º 3: hipertrigliceridemia<\/strong> (9 %).<\/li><li><strong>Triglicéridos &gt;1000 mg/dL<\/strong> = hipertrigliceridemia grave; cada 100 mg/dL arriba de 1000 sube ~4 % la incidencia de pancreatitis.<\/li><li><strong>Fármacos ~5 %<\/strong>; <strong>post-CPRE ~9 %<\/strong> de las CPRE (hasta 14 % en alto riesgo).<\/li><li><strong>Atlanta revisada:<\/strong> <strong>leve<\/strong> (sin complicaciones locales ni falla orgánica, 65–70 %), <strong>moderadamente grave<\/strong> (falla orgánica <strong>transitoria &lt;48 h<\/strong> o complicaciones locales, 20–25 %), <strong>grave<\/strong> (falla orgánica <strong>persistente &gt;48 h<\/strong>, ~10 %).<\/li><li><strong>Estudios iniciales:<\/strong> amilasa, lipasa, <strong>perfil de lípidos con triglicéridos<\/strong>, inmunoglobulinas, BH, electrolitos, QS completa, HbA1c y <strong>US transabdominal<\/strong>.<\/li><li><strong>Oxígeno:<\/strong> SpO2 meta <strong>94–99 %<\/strong> (88–92 % en EPOC u obesidad mórbida).<\/li><li><strong>Líquidos IV<\/strong> en las primeras 24 h a <strong>5–10 mL/kg/h<\/strong>, de preferencia <strong>Ringer lactato<\/strong>; metas: <strong>FC &lt;120 lpm<\/strong> y <strong>uresis &gt;0.5 mL/kg/h<\/strong>; evita la sobrecarga.<\/li><li><strong>Dolor:<\/strong> <strong>opioides<\/strong> seguros al inicio; AINE como alternativa, <strong>no<\/strong> si hay daño renal.<\/li><li><strong>Nutrición:<\/strong> <strong>vía oral temprana<\/strong> si se tolera; si no, suplementos o <strong>sonda enteral en las primeras 48 h<\/strong>.<\/li><li><strong>Necrosis infectada:<\/strong> drenaje endoscópico o percutáneo y abordaje <strong>escalonado (step-up)<\/strong> antes de la cirugía abierta.<\/li><li><strong>Secuelas:<\/strong> intolerancia a la glucosa (~60 % a 5 años), insuficiencia exocrina (&gt;50 % al inicio); enzimas si la necrosis es &gt;50 %.<\/li><li><strong>Prevención:<\/strong> <strong>colecistectomía<\/strong> (biliar), <strong>abstinencia<\/strong> de alcohol y tabaco, triglicéridos <strong>&lt;1000 mg/dL<\/strong> (ideal &lt;500).<\/li><\/ul>","secs":[{"t":"Definición y epidemiología","h":"<h5>Cifras<\/h5><div class=\"tbl\"><table><thead><tr><th>Dato<\/th><th>Valor<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Incidencia global<\/th><td><strong>30–40 casos por 100 000 personas por año<\/strong><\/td><\/tr><tr><th scope=\"row\">Incidencia en niños<\/th><td><strong>10–15 por 100 000<\/strong> niños<\/td><\/tr><tr><th scope=\"row\">Mortalidad<\/th><td><strong>1–5 %<\/strong> (por necrosis con falla orgánica múltiple)<\/td><\/tr><tr><th scope=\"row\">Costo promedio por episodio<\/th><td>~<strong>10 000 dólares<\/strong> (EUA)<\/td><\/tr><tr><th scope=\"row\">Embarazo<\/th><td>~<strong>1 de cada 5000<\/strong> embarazos<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>No hay tratamiento farmacológico específico. Si una opción ofrece &quot;el fármaco que detiene la autodigestión&quot;, es distractor: el tratamiento es <strong>oxígeno, líquidos, analgesia y nutrición<\/strong>.<\/p><\/aside>"},{"t":"Diagnóstico","h":"<figure class=\"fig\" data-fig=\"pancreas-dx\"><svg viewBox=\"0 0 400 340\" role=\"img\" aria-label=\"Diagnóstico de pancreatitis aguda: 2 de 3 criterios\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah38\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"8\" y=\"8\" width=\"120\" height=\"70\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"68\" y=\"29.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Dolor abdominal<\/tspan><tspan x=\"68\" dy=\"13.42\">irradiado a la<\/tspan><tspan x=\"68\" dy=\"13.42\">espalda<\/tspan><\/text><rect x=\"140\" y=\"8\" width=\"120\" height=\"70\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"200\" y=\"36.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Lipasa o amilasa<\/tspan><tspan x=\"200\" dy=\"13.42\">≥3 veces el LSN<\/tspan><\/text><rect x=\"272\" y=\"8\" width=\"120\" height=\"70\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"332\" y=\"29.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Hallazgos de<\/tspan><tspan x=\"332\" dy=\"13.42\">pancreatitis en TC<\/tspan><tspan x=\"332\" dy=\"13.42\">o RM<\/tspan><\/text><path d=\"M68 78 L120 110\" class=\"fx-arr\" marker-end=\"url(#ah38)\"/><path d=\"M200 78 L200 110\" class=\"fx-arr\" marker-end=\"url(#ah38)\"/><path d=\"M332 78 L280 110\" class=\"fx-arr\" marker-end=\"url(#ah38)\"/><rect x=\"80\" y=\"110\" width=\"240\" height=\"42\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"200\" y=\"123.07\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">2 de 3 criterios = pancreatitis<\/tspan><tspan x=\"200\" dy=\"15.86\">aguda<\/tspan><\/text><text x=\"200\" y=\"168\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Dolor + enzimas solos no detectan a ~1 de cada 4 pacientes<\/tspan><\/text><path d=\"M200 178 L200 196\" class=\"fx-arr\" marker-end=\"url(#ah38)\"/><rect x=\"20\" y=\"196\" width=\"360\" height=\"72\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"218.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Estudios iniciales: amilasa y lipasa, perfil de lípidos con<\/tspan><tspan x=\"200\" dy=\"13.42\">triglicéridos, inmunoglobulinas, BH, electrolitos, QS<\/tspan><tspan x=\"200\" dy=\"13.42\">completa, HbA1c y US transabdominal<\/tspan><\/text><path d=\"M200 268 L200 288\" class=\"fx-arr\" marker-end=\"url(#ah38)\"/><rect x=\"20\" y=\"288\" width=\"360\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"302.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">US de cuadrante superior derecho: ¿litos? ¿dilatación<\/tspan><tspan x=\"200\" dy=\"14.03\">biliar (colangitis → CPRE)?<\/tspan><\/text><\/svg><figcaption>Criterios del artículo (Atlanta revisada): <strong>2 de 3<\/strong>. La imagen del criterio es <strong>TC o RM<\/strong>; el <strong>US<\/strong> busca la <strong>causa<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">Cuidado con los criterios<\/span><\/div><p>Los <strong>dos primeros criterios solos<\/strong> (dolor + enzimas) pueden <strong>dejar sin identificar a una cuarta parte<\/strong> de los pacientes con pancreatitis aguda. Ahí la imagen confirma.<\/p><\/aside><h5>Cuadro clínico<\/h5><div class=\"tbl\"><table><thead><tr><th>Síntoma o signo<\/th><th>Frecuencia<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Dolor <strong>epigástrico o difuso<\/strong><\/th><td><strong>80–90 %<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Náusea y vómito<\/strong><\/th><td><strong>50–80 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Distensión abdominal, fiebre, <strong>taquicardia<\/strong>, taquipnea<\/th><td>Variables<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El criterio es <strong>≥3 veces<\/strong> el LSN, no &quot;elevada&quot;. Y la imagen del criterio 3 es <strong>TC o RM<\/strong>; el US sirve para buscar la <strong>causa<\/strong> (litos), no como criterio.<\/p><\/aside>"},{"t":"Etiologías","h":"<figure class=\"fig\" data-fig=\"pancreas-etio\"><svg viewBox=\"0 0 400 230\" role=\"img\" aria-label=\"Principales causas de pancreatitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah39\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"8\" y=\"14\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">% de los episodios de pancreatitis aguda<\/tspan><\/text><text x=\"8\" y=\"51\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">Litos biliares<\/tspan><\/text><rect x=\"140\" y=\"40\" width=\"200\" height=\"22\" rx=\"4\" style=\"fill:#B5487E;fill-opacity:0.85\"/><text x=\"346\" y=\"51\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"346\" dy=\"0\">~50 %<\/tspan><\/text><text x=\"8\" y=\"89\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">Alcohol<\/tspan><\/text><rect x=\"140\" y=\"78\" width=\"132\" height=\"22\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:0.45\"/><text x=\"278\" y=\"89\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"278\" dy=\"0\">~33 %<\/tspan><\/text><text x=\"8\" y=\"127\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">Hipertrigliceridemia<\/tspan><\/text><rect x=\"140\" y=\"116\" width=\"36\" height=\"22\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:0.45\"/><text x=\"182\" y=\"127\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"182\" dy=\"0\">9 %<\/tspan><\/text><text x=\"8\" y=\"165\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">Fármacos<\/tspan><\/text><rect x=\"140\" y=\"154\" width=\"20\" height=\"22\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:0.45\"/><text x=\"166\" y=\"165\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"166\" dy=\"0\">~5 %<\/tspan><\/text><text x=\"8\" y=\"203\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">CPRE<\/tspan><\/text><rect x=\"140\" y=\"192\" width=\"8\" height=\"22\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:0.45\"/><text x=\"154\" y=\"203\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"154\" dy=\"0\">1–2 %<\/tspan><\/text><\/svg><figcaption>Cifras del artículo de <strong>series distintas<\/strong>: litos ~50 % (Occidente), alcohol ~33 % (Norteamérica y Europa), hipertrigliceridemia 9 % (revisión global), fármacos ~5 %, CPRE 1–2 %. En el <strong>anciano<\/strong>, 30–40 % es <strong>idiopática<\/strong>.<\/figcaption><\/figure><h5>Hipertrigliceridemia: n.º 3<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Triglicéridos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Leve<\/th><td><strong>150–500 mg/dL<\/strong><\/td><\/tr><tr><th scope=\"row\">Moderada<\/th><td><strong>500–1000 mg/dL<\/strong><\/td><\/tr><tr><th scope=\"row\">Grave<\/th><td><strong>&gt;1000 mg/dL<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Fármacos: ~5 %<\/h5><div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Fármacos clase I<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Antibióticos<\/th><td><strong>Tetraciclinas<\/strong>, <strong>TMP-SMX<\/strong><\/td><\/tr><tr><th scope=\"row\">Esteroides<\/th><td>Prednisona, dexametasona, <strong>estradiol<\/strong><\/td><\/tr><tr><th scope=\"row\">Antiepilépticos<\/th><td>Carbamazepina, <strong>ácido valproico<\/strong><\/td><\/tr><tr><th scope=\"row\">Antihipertensivos<\/th><td><strong>Lisinopril<\/strong>, losartán, <strong>furosemida<\/strong><\/td><\/tr><tr><th scope=\"row\">Opioides<\/th><td>Codeína<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Causa más común&quot; = <strong>litos<\/strong>. &quot;Segunda&quot; = <strong>alcohol<\/strong>. &quot;Tercera&quot; = <strong>hipertrigliceridemia<\/strong> (piensa en <strong>&gt;1000 mg/dL<\/strong>). En el <strong>anciano<\/strong> también: biliar, pero con mucho <strong>idiopático<\/strong> (30–40 %) y hay que descartar <strong>tumor<\/strong>.<\/p><\/aside>"},{"t":"Fisiopatología","h":"<div data-fp=\"pancreas\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Autodigestión<\/span><\/div><p>La pancreatitis empieza cuando el <strong>tripsinógeno se activa dentro de la célula acinar<\/strong>, en vez de en el duodeno. La tripsina activa a las demás enzimas y el páncreas se digiere a sí mismo. Después, la inflamación se vuelve <strong>sistémica<\/strong> y es la que mata en la primera semana.<\/p><\/aside><figure class=\"fig\" data-fig=\"pancreas-fp\"><svg viewBox=\"0 0 400 396.53\" role=\"img\" aria-label=\"Cascada de la pancreatitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-pancreas\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Lito en el ámpula, alcohol, triglicéridos<\/tspan><tspan x=\"200\" dy=\"14.03\">&gt;1,000 mg/dL, CPRE, hipercalcemia, fármacos<\/tspan><\/text><path d=\"M200 52.06 L200 74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><rect x=\"50\" y=\"74.06\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"91.11\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Calcio intracelular alto; el zimógeno se junta<\/tspan><tspan x=\"200\" dy=\"14.03\">con la catepsina B en la célula acinar<\/tspan><\/text><path d=\"M200 120.12 L200 142.12\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><rect x=\"50\" y=\"142.12\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"159.17\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Tripsinógeno → tripsina dentro del acino:<\/tspan><tspan x=\"200\" dy=\"14.03\">activa elastasa, fosfolipasa A2 y lipasa<\/tspan><\/text><path d=\"M200 188.18 L200 210.18\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><rect x=\"50\" y=\"210.18\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"227.23\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Autodigestión, necrosis acinar y de la grasa<\/tspan><tspan x=\"200\" dy=\"14.03\">peripancreática<\/tspan><\/text><path d=\"M200 256.24 V267.24 H101 V278.24\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><path d=\"M200 256.24 V267.24 H299 V278.24\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><rect x=\"6\" y=\"278.24\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"101\" y=\"301.65\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">Citocinas (IL-1, IL-6,<\/tspan><tspan x=\"101\" dy=\"13.42\">TNF-α): SIRS y fuga capilar<\/tspan><\/text><rect x=\"204\" y=\"278.24\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"299\" y=\"294.94\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Necrosis que se infecta por<\/tspan><tspan x=\"299\" dy=\"13.42\">translocación intestinal (2–4<\/tspan><tspan x=\"299\" dy=\"13.42\">semanas)<\/tspan><\/text><path d=\"M101 336.5 V347.5 H200 V358.5\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><path d=\"M299 336.5 V347.5 H200 V358.5\" class=\"fx-arr\" marker-end=\"url(#ahfp-pancreas)\"/><rect x=\"50\" y=\"358.5\" width=\"300\" height=\"32.03\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"200\" y=\"375.55\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Falla orgánica: pulmón, riñón, circulación<\/tspan><\/text><\/svg><figcaption>Fase temprana (1ª semana): manda la respuesta inflamatoria y la falla orgánica. Fase tardía: mandan las complicaciones locales (necrosis, colecciones, infección).<\/figcaption><\/figure><h5>Del mecanismo a la clínica<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Enzimas que se escapan del acino dañado<\/th><td>Lipasa y amilasa &gt;3 veces el LSN<\/td><\/tr><tr><th scope=\"row\">Inflamación retroperitoneal y del plexo celíaco<\/th><td>Dolor epigástrico en cinturón que se irradia a la espalda<\/td><\/tr><tr><th scope=\"row\">Fuga capilar: líquido al tercer espacio<\/th><td>Hemoconcentración (hematocrito alto), BUN que sube, hipotensión<\/td><\/tr><tr><th scope=\"row\">La lipasa rompe la grasa y los ácidos grasos atrapan calcio (saponificación)<\/th><td>Hipocalcemia<\/td><\/tr><tr><th scope=\"row\">Daño a islotes y hormonas de estrés<\/th><td>Hiperglucemia<\/td><\/tr><tr><th scope=\"row\">Sangrado retroperitoneal en pancreatitis necrosante<\/th><td>Signos de Cullen (periumbilical) y Grey Turner (flancos)<\/td><\/tr><\/tbody><\/table><\/div><h5>Cómo actúa cada causa<\/h5><ul><li><strong>Biliar:<\/strong> el lito en el ámpula obstruye el conducto pancreático y sube la presión ductal.<\/li><li><strong>Alcohol:<\/strong> sensibiliza al acino, forma tapones de proteína en los conductos y aumenta su permeabilidad.<\/li><li><strong>Hipertrigliceridemia:<\/strong> la lipasa rompe los triglicéridos en ácidos grasos libres, que son tóxicos para el acino y los capilares.<\/li><li><strong>Genética:<\/strong> mutaciones de <strong>PRSS1<\/strong> (tripsina que no se inactiva), <strong>SPINK1<\/strong> (falta el inhibidor de tripsina) y <strong>CFTR<\/strong>.<\/li><\/ul><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Obesidad<\/span><\/div><p>La <strong>obesidad<\/strong> predice gravedad: la <strong>lipólisis de adipocitos<\/strong> en el páncreas y en el tejido adiposo empeora el daño.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La nutrición oral o enteral <strong>previene la translocación bacteriana<\/strong> y reduce la respuesta inflamatoria: por eso se prefiere al ayuno prolongado y a la vía parenteral.<\/p><\/aside>"},{"t":"Gravedad: Atlanta revisada y colecciones","h":"<figure class=\"fig\" data-fig=\"pancreas-atlanta\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Clasificación de gravedad: Atlanta revisada y basada en determinantes\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah40\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"8\" y=\"14\" font-size=\"12.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">Atlanta revisada<\/tspan><\/text><rect x=\"6\" y=\"28\" width=\"124\" height=\"124\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"49.74\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">LEVE<\/tspan><tspan x=\"68\" dy=\"13.42\">Sin inflamación<\/tspan><tspan x=\"68\" dy=\"13.42\">local ni falla<\/tspan><tspan x=\"68\" dy=\"13.42\">orgánica<\/tspan><tspan x=\"68\" dy=\"13.42\">65–70 %<\/tspan><tspan x=\"68\" dy=\"13.42\">Resuelve en pocos<\/tspan><tspan x=\"68\" dy=\"13.42\">días<\/tspan><\/text><rect x=\"138\" y=\"28\" width=\"124\" height=\"124\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"43.03\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">MODERADAMENTE<\/tspan><tspan x=\"200\" dy=\"13.42\">GRAVE<\/tspan><tspan x=\"200\" dy=\"13.42\">Falla orgánica<\/tspan><tspan x=\"200\" dy=\"13.42\">transitoria (&lt;48<\/tspan><tspan x=\"200\" dy=\"13.42\">h) o<\/tspan><tspan x=\"200\" dy=\"13.42\">complicaciones<\/tspan><tspan x=\"200\" dy=\"13.42\">locales<\/tspan><tspan x=\"200\" dy=\"13.42\">20–25 %<\/tspan><\/text><rect x=\"270\" y=\"28\" width=\"124\" height=\"124\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"49.74\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">GRAVE<\/tspan><tspan x=\"332\" dy=\"13.42\">Falla orgánica<\/tspan><tspan x=\"332\" dy=\"13.42\">persistente (&gt;48<\/tspan><tspan x=\"332\" dy=\"13.42\">h)<\/tspan><tspan x=\"332\" dy=\"13.42\">~10 %<\/tspan><tspan x=\"332\" dy=\"13.42\">Estancia &gt;4<\/tspan><tspan x=\"332\" dy=\"13.42\">semanas<\/tspan><\/text><text x=\"8\" y=\"172\" font-size=\"12.5\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"8\" dy=\"0\">Basada en determinantes (DBC)<\/tspan><\/text><rect x=\"6\" y=\"186\" width=\"92\" height=\"106\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"52\" y=\"219.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"52\" dy=\"0\">LEVE<\/tspan><tspan x=\"52\" dy=\"12.81\">Sin necrosis<\/tspan><tspan x=\"52\" dy=\"12.81\">ni falla<\/tspan><tspan x=\"52\" dy=\"12.81\">orgánica<\/tspan><\/text><rect x=\"104\" y=\"186\" width=\"92\" height=\"106\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"150\" y=\"206.975\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"150\" dy=\"0\">MODERADA<\/tspan><tspan x=\"150\" dy=\"12.81\">Necrosis<\/tspan><tspan x=\"150\" dy=\"12.81\">estéril o<\/tspan><tspan x=\"150\" dy=\"12.81\">falla<\/tspan><tspan x=\"150\" dy=\"12.81\">transitoria<\/tspan><tspan x=\"150\" dy=\"12.81\">(&lt;48 h)<\/tspan><\/text><rect x=\"202\" y=\"186\" width=\"92\" height=\"106\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"248\" y=\"206.975\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"248\" dy=\"0\">GRAVE<\/tspan><tspan x=\"248\" dy=\"12.81\">Necrosis<\/tspan><tspan x=\"248\" dy=\"12.81\">infectada o<\/tspan><tspan x=\"248\" dy=\"12.81\">falla<\/tspan><tspan x=\"248\" dy=\"12.81\">persistente<\/tspan><tspan x=\"248\" dy=\"12.81\">(&gt;48 h)<\/tspan><\/text><rect x=\"300\" y=\"186\" width=\"92\" height=\"106\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"346\" y=\"213.38\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"346\" dy=\"0\">CRÍTICA<\/tspan><tspan x=\"346\" dy=\"12.81\">Necrosis<\/tspan><tspan x=\"346\" dy=\"12.81\">infectada y<\/tspan><tspan x=\"346\" dy=\"12.81\">falla<\/tspan><tspan x=\"346\" dy=\"12.81\">persistente<\/tspan><\/text><\/svg><figcaption>El corte que decide es <strong>48 h<\/strong> de falla orgánica. En la DBC, la <strong>necrosis infectada<\/strong> sube la categoría; la evidencia reciente sugiere que pesa <strong>menos<\/strong> en la mortalidad.<\/figcaption><\/figure><h5>Clasificación de Atlanta revisada (la más aceptada)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grado<\/th><th>Definición<\/th><th>Frecuencia<\/th><th>Curso<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Leve<\/strong><\/th><td><strong>Sin<\/strong> inflamación local <strong>ni<\/strong> falla orgánica<\/td><td><strong>65–70 %<\/strong><\/td><td>Síntomas resuelven en pocos días<\/td><\/tr><tr><th scope=\"row\"><strong>Moderadamente grave<\/strong><\/th><td>Falla orgánica <strong>transitoria (&lt;48 h)<\/strong> o <strong>complicaciones locales<\/strong><\/td><td><strong>20–25 %<\/strong><\/td><td>Colecciones o necrosis; hospitalización prolongada<\/td><\/tr><tr><th scope=\"row\"><strong>Grave<\/strong><\/th><td>Falla orgánica <strong>persistente (&gt;48 h)<\/strong><\/td><td><strong>~10 %<\/strong><\/td><td>Dolor intenso, déficit nutricional, estancia <strong>&gt;4 semanas<\/strong>, cuidados intensivos<\/td><\/tr><\/tbody><\/table><\/div><h5>Clasificación basada en determinantes (DBC)<\/h5><div class=\"tbl\"><table><thead><tr><th>Categoría<\/th><th>Definición<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Leve<\/th><td>Sin necrosis ni falla orgánica<\/td><\/tr><tr><th scope=\"row\">Moderada<\/th><td><strong>Necrosis estéril<\/strong> o falla orgánica <strong>transitoria (&lt;48 h)<\/strong><\/td><\/tr><tr><th scope=\"row\">Grave<\/th><td><strong>Necrosis infectada<\/strong> o falla orgánica <strong>persistente (&gt;48 h)<\/strong><\/td><\/tr><tr><th scope=\"row\">Crítica<\/th><td><strong>Necrosis infectada y<\/strong> falla orgánica persistente<\/td><\/tr><\/tbody><\/table><\/div><h5>Colecciones (Atlanta revisada)†<\/h5><div class=\"tbl\"><table><thead><tr><th><\/th><th>Menos de 4 semanas<\/th><th>Más de 4 semanas (pared definida)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Pancreatitis <strong>intersticial<\/strong> (sin necrosis)<\/th><td>Colección líquida peripancreática aguda (APFC)†<\/td><td><strong>Pseudoquiste<\/strong>†<\/td><\/tr><tr><th scope=\"row\">Pancreatitis <strong>necrosante<\/strong><\/th><td>Colección necrótica aguda (ANC)†<\/td><td><strong>Necrosis encapsulada (WON)<\/strong>†<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Lo que separa <strong>moderadamente grave<\/strong> de <strong>grave<\/strong> es la <strong>duración de la falla orgánica<\/strong>: <strong>&lt;48 h<\/strong> transitoria (moderadamente grave) contra <strong>&gt;48 h<\/strong> persistente (grave). Una colección sin falla orgánica es <strong>moderadamente grave<\/strong>, no grave.<\/p><\/aside>"},{"t":"Poblaciones especiales","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Anciano con &quot;primer episodio idiopático&quot;: no te quedes ahí. Busca <strong>tumor de cabeza de páncreas<\/strong>, <strong>fármacos<\/strong> y <strong>IgG4<\/strong> (autoinmune).<\/p><\/aside>"},{"t":"Manejo hospitalario","h":"<figure class=\"fig\" data-fig=\"pancreas-manejo\"><svg viewBox=\"0 0 400 250\" role=\"img\" aria-label=\"Pilares del manejo inicial de la pancreatitis aguda\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah41\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"8\" width=\"191\" height=\"30\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:1;stroke:#B5487E;stroke-width:1.5\"/><text x=\"101.5\" y=\"23\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"101.5\" dy=\"0\">Oxígeno<\/tspan><\/text><rect x=\"6\" y=\"42\" width=\"191\" height=\"62\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"101.5\" y=\"66.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101.5\" dy=\"0\">SpO2 94–99 % (88–92 % en EPOC<\/tspan><tspan x=\"101.5\" dy=\"13.42\">u obesidad mórbida)<\/tspan><\/text><rect x=\"203\" y=\"8\" width=\"191\" height=\"30\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:1;stroke:#B5487E;stroke-width:1.5\"/><text x=\"298.5\" y=\"23\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"298.5\" dy=\"0\">Líquidos IV<\/tspan><\/text><rect x=\"203\" y=\"42\" width=\"191\" height=\"62\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"298.5\" y=\"59.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298.5\" dy=\"0\">5–10 mL/kg/h en 24 h, Ringer<\/tspan><tspan x=\"298.5\" dy=\"13.42\">lactato; FC &lt;120 y uresis &gt;0.5<\/tspan><tspan x=\"298.5\" dy=\"13.42\">mL/kg/h<\/tspan><\/text><rect x=\"6\" y=\"112\" width=\"191\" height=\"30\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:1;stroke:#B5487E;stroke-width:1.5\"/><text x=\"101.5\" y=\"127\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"101.5\" dy=\"0\">Analgesia<\/tspan><\/text><rect x=\"6\" y=\"146\" width=\"191\" height=\"62\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"101.5\" y=\"170.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101.5\" dy=\"0\">Opioides; AINE solo sin daño<\/tspan><tspan x=\"101.5\" dy=\"13.42\">renal<\/tspan><\/text><rect x=\"203\" y=\"112\" width=\"191\" height=\"30\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:1;stroke:#B5487E;stroke-width:1.5\"/><text x=\"298.5\" y=\"127\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"298.5\" dy=\"0\">Nutrición<\/tspan><\/text><rect x=\"203\" y=\"146\" width=\"191\" height=\"62\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"298.5\" y=\"170.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"298.5\" dy=\"0\">Vía oral temprana; si no,<\/tspan><tspan x=\"298.5\" dy=\"13.42\">enteral en las primeras 48 h<\/tspan><\/text><rect x=\"6\" y=\"216\" width=\"388\" height=\"28\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"230\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Evita la sobrecarga de volumen: aumenta la mortalidad<\/tspan><\/text><\/svg><figcaption>Los cuatro pilares del artículo. No hay un fármaco específico: el tratamiento es <strong>de soporte<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">WATERFALL (complemento)†<\/span><\/div><p>El ensayo <strong>WATERFALL<\/strong> (NEJM 2022) comparó reanimación <strong>agresiva<\/strong> (bolo de 20 mL/kg + 3 mL/kg/h) contra <strong>moderada<\/strong> (1.5 mL/kg/h, bolo de 10 mL/kg solo si hay hipovolemia) con Ringer lactato: la agresiva <strong>no mejoró<\/strong> la evolución y causó <strong>más sobrecarga<\/strong> de volumen†. Por eso hoy se prefiere un <strong>ritmo moderado<\/strong> y guiado por metas†. El artículo no lo menciona, pero sí advierte contra la sobrecarga.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Pancreatitis = <strong>no ayuno prolongado<\/strong>. La respuesta correcta suele ser <strong>vía oral temprana<\/strong> o <strong>enteral<\/strong>, no nutrición parenteral total. Y los líquidos van con <strong>metas<\/strong> (FC, uresis), sin sobrecargar.<\/p><\/aside>"},{"t":"Necrosis, infección y abordaje escalonado","h":"<figure class=\"fig\" data-fig=\"pancreas-stepup\"><svg viewBox=\"0 0 400 364\" role=\"img\" aria-label=\"Abordaje escalonado de la necrosis pancreática\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah42\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"28\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Dolor abdominal intenso por más de 3 días<\/tspan><\/text><path d=\"M200 50 L200 66\" class=\"fx-arr\" marker-end=\"url(#ah42)\"/><rect x=\"50\" y=\"66\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#B5487E;fill-opacity:0.13;stroke:#B5487E;stroke-width:1.5\"/><text x=\"200\" y=\"88\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">PCR y VSG + TC: ¿necrosis o colección?<\/tspan><\/text><path d=\"M200 110 L200 126\" class=\"fx-arr\" marker-end=\"url(#ah42)\"/><rect x=\"50\" y=\"126\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"200\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Drenaje endoscópico o percutáneo primero<\/tspan><\/text><path d=\"M200 170 L200 186\" class=\"fx-arr\" marker-end=\"url(#ah42)\"/><rect x=\"50\" y=\"186\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"208\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">¿Gas en la TC o datos de infección?<\/tspan><\/text><path d=\"M200 230 L200 246\" class=\"fx-arr\" marker-end=\"url(#ah42)\"/><rect x=\"50\" y=\"246\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"260.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Antibióticos + acelerar drenaje o<\/tspan><tspan x=\"200\" dy=\"14.64\">necrosectomía mínimamente invasiva<\/tspan><\/text><path d=\"M200 290 L200 306\" class=\"fx-arr\" marker-end=\"url(#ah42)\"/><rect x=\"50\" y=\"306\" width=\"300\" height=\"44\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"328\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Cirugía abierta solo si falla lo anterior<\/tspan><\/text><\/svg><figcaption><strong>Step-up<\/strong> (van Santvoort): mínimamente invasivo primero; <strong>menos morbilidad y mortalidad<\/strong> y menor estancia. El momento del drenaje se <strong>individualiza<\/strong> (estudio de 2019).<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Necrosis infectada → <strong>drenaje (endoscópico o percutáneo) primero<\/strong> y escala solo si no mejora. La <strong>necrosectomía abierta temprana<\/strong> es la respuesta incorrecta.<\/p><\/aside>"},{"t":"Secuelas: diabetes e insuficiencia exocrina","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Elastasa fecal <strong>&gt;200 µg/g<\/strong> = normal. Dosis de inicio: <strong>50 000 U por comida, 25 000 U por colación<\/strong>.<\/p><\/aside>"},{"t":"Prevención de recurrencias","h":"<div class=\"tbl\"><table><thead><tr><th>Causa<\/th><th>Cómo prevenir la recurrencia<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Alcohol y tabaco<\/strong><\/th><td><strong>Abstinencia<\/strong>. Estudio islandés: recurrió <strong>1/3 de los que siguieron bebiendo<\/strong> y <strong>ninguno de los abstemios<\/strong> en 5 años<\/td><\/tr><tr><th scope=\"row\"><strong>Biliar<\/strong><\/th><td><strong>Colecistectomía<\/strong> (lo más eficaz)<\/td><\/tr><tr><th scope=\"row\"><strong>Hipertrigliceridemia<\/strong><\/th><td>Triglicéridos <strong>&lt;1000 mg/dL<\/strong> (ideal <strong>&lt;500<\/strong>): 1.º estilo de vida (ejercicio, dieta, <strong>omega-3<\/strong>); 2.º <strong>fibratos ± estatinas<\/strong>; resistente: <strong>plasmaféresis<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Fármacos<\/strong><\/th><td><strong>Suspender de inmediato<\/strong>; reiniciar solo si no hay alternativas<\/td><\/tr><tr><th scope=\"row\"><strong>Autoinmune<\/strong><\/th><td><strong>Prednisolona 2 mg/kg (máx. 60 mg/día)<\/strong>, reducir <strong>5–10 mg por semana<\/strong>, mantenimiento <strong>5 mg/día por 6 meses<\/strong>; si resiste o recae: <strong>rituximab<\/strong> o <strong>azatioprina<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Fibrosis quística<\/strong> con suficiencia pancreática<\/th><td>Moduladores de <strong>CFTR<\/strong> (ivacaftor, tezacaftor)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Del agudo al crónico<\/span><\/div><p>La Figura 7 del artículo esquematiza la progresión <strong>aguda → recurrente → crónica<\/strong>. Cada episodio deja cicatriz: por eso se busca la causa de <strong>todos<\/strong> los pacientes.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Pancreatitis por <strong>hipertrigliceridemia<\/strong>: la meta es <strong>&lt;1000 mg/dL<\/strong> y lo ideal <strong>&lt;500 mg/dL<\/strong>; fibratos son el fármaco de primera línea tras el estilo de vida.<\/p><\/aside>"}],"pearls":["Diagnóstico: 2 de 3 (dolor irradiado a la espalda, lipasa o amilasa ≥3× LSN, TC o RM compatible).","Dolor + enzimas solos pueden no detectar a 1 de cada 4 pacientes.","Litos ~50 % (Occidente), alcohol ~33 %, hipertrigliceridemia 9 % (tercera causa).","Triglicéridos &gt;1000 mg/dL = hipertrigliceridemia grave; cada 100 mg/dL arriba de 1000, ~4 % más incidencia.","Atlanta revisada: leve (65–70 %), moderadamente grave (20–25 %), grave (~10 %).","Falla orgánica &lt;48 h = transitoria (moderadamente grave); &gt;48 h = persistente (grave).","Pide perfil de lípidos, inmunoglobulinas y US de cuadrante superior derecho al ingreso.","Líquidos IV en las primeras 24 h (5–10 mL/kg/h en la revisión), Ringer lactato, metas FC &lt;120 y uresis &gt;0.5 mL/kg/h; evita la sobrecarga.","Opioides de entrada; AINE solo si no hay daño renal.","Vía oral temprana; si no se tolera, enteral en las primeras 48 h.","Dolor intenso &gt;3 días: PCR, VSG y TC para buscar complicaciones locales.","Necrosis infectada: drenaje endoscópico o percutáneo y step-up; la necrosectomía abierta queda al final.","Intolerancia a la glucosa ~60 % a 5 años; necrosis &gt;50 % obliga a enzimas.","Pancrelipasa: 50 000 U con cada comida y 25 000 U con colación; elastasa fecal normal &gt;200 µg/g.","Recurrencia ~20 %; la mitad de ellos progresa a pancreatitis crónica."],"comps":[{"title":"Atlanta revisada contra clasificación basada en determinantes","cols":["Atlanta revisada","Basada en determinantes"],"rows":[["Número de categorías","<strong>3<\/strong>: leve, moderadamente grave, grave","<strong>4<\/strong>: leve, moderada, grave, crítica"],["Determinantes","Falla orgánica y complicaciones locales","<strong>Necrosis<\/strong> (estéril o infectada) y falla orgánica"],["Leve","Sin inflamación local ni falla orgánica","Sin necrosis ni falla orgánica"],["Categoría intermedia","Falla <strong>transitoria (&lt;48 h)<\/strong> o complicaciones locales","<strong>Necrosis estéril<\/strong> o falla transitoria (&lt;48 h)"],["Grave","Falla <strong>persistente (&gt;48 h)<\/strong>","<strong>Necrosis infectada o<\/strong> falla persistente"],["Crítica","No existe","<strong>Necrosis infectada y<\/strong> falla persistente"],["Corte de tiempo","48 h","48 h"],["Frecuencias que da el artículo","65–70 % / 20–25 % / ~10 %","No las da"],["Aceptación","La <strong>más aceptada<\/strong>","Alternativa"],["Limitación común","A veces hay que esperar &gt;24 h para clasificar","A veces hay que esperar &gt;24 h para clasificar"]],"key":"Ambas usan 48 h para separar falla transitoria de persistente; la DBC añade la necrosis infectada y la categoría crítica."},{"title":"Biliar contra alcohol contra hipertrigliceridemia","cols":["Biliar","Alcohol","Hipertrigliceridemia"],"rows":[["Lugar","<strong>1.ª<\/strong> causa","<strong>2.ª<\/strong> causa","<strong>3.ª<\/strong> causa"],["Frecuencia","~50 % (Occidente)","~33 % (Norteamérica y Europa)","9 % (global); 33 % en un centro de China"],["Perfil","Mujeres (66 %), aumenta con la edad; la más común en ancianos","Hombres, atracones, años de consumo; fumadores","Diabetes descontrolada, obesidad, estrógenos†"],["Dato clave","Litos y dilatación biliar en el US","≥5 bebidas por sesión (70 g H, 56 g M)","Triglicéridos &gt;1000 mg/dL"],["Estudio al ingreso","US de cuadrante superior derecho","Historia de consumo","Perfil de lípidos"],["Riesgo especial","Colangitis → CPRE","Recurrencia y pancreatitis crónica","Peor pronóstico como causa primaria"],["Prevención de recurrencia","<strong>Colecistectomía<\/strong>","<strong>Abstinencia<\/strong> de alcohol y tabaco","TG &lt;1000 (ideal &lt;500): estilo de vida, omega-3, fibratos ± estatinas"],["Si es resistente","—","—","Plasmaféresis"],["En el embarazo","Más litos por cambios hormonales","—","Asociada a estrógenos de fertilidad"]],"key":"Biliar se previene con colecistectomía; alcohol con abstinencia; hipertrigliceridemia con meta &lt;1000 mg/dL."}],"algos":[{"title":"Gravedad de la pancreatitis (Atlanta revisada)","src":"Sección 3.2 del artículo (Atlanta revisada)","start":"a","nodes":{"a":{"q":"¿El paciente tiene <strong>falla orgánica<\/strong>?","i":"Respiratoria, renal o cardiovascular (Marshall modificado ≥2†).","o":[["No","b"],["Sí","c"]]},"b":{"q":"¿Hay <strong>complicaciones locales<\/strong> (colección, necrosis)?","i":"","o":[["No","leve"],["Sí","mod"]]},"c":{"q":"¿La falla orgánica dura <strong>más de 48 h<\/strong>?","i":"","o":[["No, se resuelve en &lt;48 h (transitoria)","mod"],["Sí, persiste &gt;48 h","grave"]]},"leve":{"end":1,"tone":"ok","text":"<strong>Pancreatitis leve<\/strong> (65–70 %): sin inflamación local ni falla orgánica; los síntomas se resuelven en pocos días."},"mod":{"end":1,"tone":"warn","text":"<strong>Moderadamente grave<\/strong> (20–25 %): falla orgánica transitoria (&lt;48 h) o complicaciones locales; hospitalización prolongada."},"grave":{"end":1,"tone":"bad","text":"<strong>Pancreatitis grave<\/strong> (~10 %): falla orgánica persistente (&gt;48 h); cuidados intensivos y estancia &gt;4 semanas."}}},{"title":"Abordaje inicial de la pancreatitis aguda","src":"Secciones 2 y 4–6 del artículo","start":"a","nodes":{"a":{"q":"¿Cumple <strong>2 de 3<\/strong> criterios (dolor irradiado a la espalda, lipasa o amilasa ≥3× LSN, TC o RM compatible)?","i":"","o":[["Sí","b"],["Solo uno (p. ej., dolor con lipasa &lt;3×)","img"]]},"img":{"q":"Pide <strong>TC o RM<\/strong>: dolor y enzimas solos fallan en ~1/4. ¿Muestra pancreatitis?","i":"","o":[["Sí","b"],["No","no"]]},"no":{"end":1,"tone":"warn","text":"<strong>No cumple criterios.<\/strong> Busca otro diagnóstico del dolor abdominal."},"b":{"q":"Inicia <strong>oxígeno<\/strong> (SpO2 94–99 %), <strong>Ringer lactato<\/strong> con metas (FC &lt;120, uresis &gt;0.5 mL/kg/h), <strong>opioides<\/strong> y <strong>vía oral temprana<\/strong>. Pide lípidos, inmunoglobulinas, BH, QS, HbA1c y <strong>US<\/strong>. ¿El US muestra <strong>dilatación biliar<\/strong> con datos de <strong>colangitis<\/strong>?","i":"","o":[["Sí","cpre"],["No","c"]]},"cpre":{"end":1,"tone":"bad","text":"<strong>CPRE<\/strong> por colangitis, además del soporte. Después, <strong>colecistectomía<\/strong>."},"c":{"q":"¿Cuál es la causa?","i":"","o":[["Litos","bil"],["Alcohol","alc"],["Triglicéridos &gt;1000 mg/dL","tg"],["Fármaco clase I","farm"],["Ninguna clara en un anciano","anc"]]},"bil":{"end":1,"tone":"ok","text":"<strong>Colecistectomía<\/strong>: lo más eficaz para prevenir la recurrencia (en la misma hospitalización si fue leve†)."},"alc":{"end":1,"tone":"ok","text":"<strong>Abstinencia de alcohol y tabaco<\/strong>: en 5 años recurrió 1/3 de los que siguieron bebiendo y ninguno de los abstemios."},"tg":{"end":1,"tone":"ok","text":"Meta <strong>&lt;1000 mg/dL<\/strong> (ideal &lt;500): estilo de vida y omega-3; luego <strong>fibratos ± estatinas<\/strong>; <strong>plasmaféresis<\/strong> si es resistente."},"farm":{"end":1,"tone":"ok","text":"<strong>Suspende el fármaco de inmediato<\/strong>; reinícialo solo si no hay alternativas."},"anc":{"end":1,"tone":"warn","text":"30–40 % es idiopática, pero descarta <strong>tumor de cabeza de páncreas<\/strong>, <strong>polifarmacia<\/strong> e <strong>IgG4<\/strong> (autoinmune)."}}}],"cards":[["Paso inicial de la pancreatitis aguda","La activación del tripsinógeno a tripsina dentro de la célula acinar, que activa las demás enzimas y causa autodigestión."],["¿Por qué hay hipocalcemia en la pancreatitis?","Por saponificación: los ácidos grasos que libera la lipasa en la grasa necrosada atrapan calcio."],["Definición de pancreatitis aguda","Inflamación del páncreas exocrino con dolor abdominal intenso, elevación de amilasa y lipasa y/o disfunción orgánica."],["Incidencia global de pancreatitis aguda","30–40 casos por 100 000 personas por año."],["Frecuencia del dolor epigástrico o difuso","80–90 %."],["Imagen preferida en niños","US transabdominal (evita contraste)."],["Proporción de mujeres en la pancreatitis biliar","66 %."],["¿Por qué hay picos en temporada de fiestas?","Por el consumo de alcohol en atracón."],["Hipertrigliceridemia leve (Endocrine Society)","150–500 mg/dL."],["Pronóstico si la hipertrigliceridemia es la causa primaria","Peor."],["Antibióticos clase I","Tetraciclinas y TMP-SMX."],["Esteroides clase I","Prednisona, dexametasona y estradiol."],["Virus que causan pancreatitis","Coxsackie B, CMV, parotiditis y SARS-CoV-2."],["Citocinas clave","TNF-α e interleucinas 1α, 1β, 6 y 18."],["Pancreatitis leve (Atlanta revisada)","Sin inflamación local ni falla orgánica; 65–70 %."],["Clasificación basada en determinantes: crítica","Necrosis infectada y falla orgánica persistente."],["APFC vs ANC†","Colecciones de &lt;4 semanas: APFC en pancreatitis intersticial, ANC en necrosante."],["Pancreatitis en el embarazo","~1 de cada 5000 embarazos; más litos por cambios hormonales."],["Ritmo de líquidos que recomienda la revisión","5–10 mL/kg/h en las primeras 24 h."],["Riesgo de la sobrecarga de volumen","Mayor mortalidad por efecto sobre todos los órganos."],["¿Cuándo evitar AINE?","Si hay daño renal."],["Dolor intenso por más de 3 días","Medir PCR y VSG; TC."],["Estudio 2019 de drenaje temprano vs tardío","El momento debe individualizarse según el estado clínico."],["Insuficiencia exocrina tras un episodio","&gt;50 %, disminuye en los meses siguientes."],["Lipasa que secreta un páncreas normal","1–2 millones de unidades al día."],["Meta de triglicéridos","&lt;1000 mg/dL, idealmente &lt;500 mg/dL."]],"mcq":[{"q":"Hombre de 42 años con dolor epigástrico de 8 horas que se irradia a la espalda. Lipasa 2.1 veces el LSN. ¿Qué afirmación es correcta?","o":["Ya cumple criterios: dolor típico + lipasa elevada","Se descarta pancreatitis","Necesita TC o RM compatible para cumplir 2 de 3 criterios","Basta un US normal para descartarla","Hay que repetir la lipasa hasta que sea 10 veces el LSN"],"a":2,"e":"El criterio enzimático exige <strong>≥3 veces el LSN<\/strong>; con 2.1× solo cumple el dolor. Para 2 de 3 necesita <strong>TC o RM<\/strong> compatible. Los dos primeros criterios solos pueden fallar en <strong>1 de cada 4<\/strong> pacientes."},{"q":"¿Cuál es la causa más común de pancreatitis aguda en el mundo?","o":["Alcohol","Hipertrigliceridemia","Fármacos","Litos biliares","Post-CPRE"],"a":3,"e":"Los <strong>litos<\/strong> son la causa principal (<strong>~50 %<\/strong> en Occidente); el alcohol es la segunda (~33 %)."},{"q":"Hombre de 35 años con pancreatitis tras una semana de fiestas de fin de año. ¿Cómo define la revisión el consumo en atracón?","o":["≥3 bebidas por sesión","Más de 1 litro de cerveza al día","Cualquier consumo diario","≥10 bebidas por semana","≥5 bebidas por sesión (70 g en hombres, 56 g en mujeres)"],"a":4,"e":"<strong>Binge drinking:<\/strong> <strong>≥5 bebidas por sesión<\/strong>, <strong>70 g<\/strong> en hombres y <strong>56 g<\/strong> en mujeres; explica el pico de casos en temporada de fiestas."},{"q":"Mujer de 38 años con diabetes descontrolada, suero lechoso y pancreatitis. Triglicéridos 2400 mg/dL. ¿Cómo se clasifica su hipertrigliceridemia (Endocrine Society)?","o":["Grave","Leve","Moderada","Muy leve","No se clasifica por encima de 2000"],"a":0,"e":"<strong>Grave: &gt;1000 mg/dL.<\/strong> Leve 150–500; moderada 500–1000."},{"q":"¿Por qué es importante el perfil de lípidos al ingreso?","o":["Para decidir la dosis de opioides","Porque sustituye a la lipasa en el diagnóstico","Porque predice la necesidad de CPRE","No se recomienda","Porque si la hipertrigliceridemia es la causa primaria el pronóstico es peor"],"a":4,"e":"Identifica si la hipertrigliceridemia es la causa única o parte de una causa multifactorial; <strong>cuando es la causa primaria, el pronóstico es peor<\/strong>."},{"q":"Adolescente con epilepsia que inicia un fármaco y a las semanas presenta pancreatitis. ¿Cuál de estos es un fármaco clase I según la revisión?","o":["Ácido valproico","Levetiracetam","Lamotrigina","Fenobarbital","Topiramato"],"a":0,"e":"Antiepilépticos clase I c
