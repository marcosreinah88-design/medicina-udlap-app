onsidera resmetirom<\/strong> u otro tratamiento dirigido al hígado, además de estilo de vida (≥10 % de peso) e incretinas como semaglutida 2.4 mg/semana."},"cirr":{"end":1,"tone":"bad","text":"<strong>Cirrosis por MASLD:<\/strong> no hay fármacos dirigidos al hígado aprobados; control metabólico, cuidar la sarcopenia y seguimiento por hepatología."}}},{"title":"¿Es MASLD?","src":"Figura 1 del artículo","start":"a","nodes":{"a":{"q":"¿Hay <strong>esteatosis hepática<\/strong> (imagen o biopsia)?","i":"","o":[["Sí","b"],["No","no"]]},"no":{"end":1,"tone":"ok","text":"Sin esteatosis no es MASLD."},"b":{"q":"¿Tiene <strong>al menos 1<\/strong> de los 5 rasgos cardiometabólicos?","i":"IMC ≥25 (≥23 asiáticos) o cintura ≥94/≥80 cm · glucosa ≥5.6 mmol/L, HbA1c ≥39 mmol/mol o DM2 · PA ≥130/85 · TG ≥1.70 mmol/L · HDL &lt;1.0 (H) o &lt;1.3 (M) mmol/L, o tratamiento de cualquiera.","o":[["Sí","c"],["No","otra"]]},"otra":{"end":1,"tone":"warn","text":"<strong>No es MASLD<\/strong>: busca otra causa de esteatosis†."},"c":{"q":"¿Hay <strong>consumo de alcohol clínicamente significativo<\/strong> u otra causa secundaria de esteatosis?","i":"","o":[["No","ok"],["Alcohol mayor","metald"],["Otra causa secundaria","otra"]]},"ok":{"end":1,"tone":"ok","text":"<strong>MASLD.<\/strong> Ahora estratifica la fibrosis con <strong>FIB-4<\/strong>."},"metald":{"end":1,"tone":"warn","text":"<strong>MetALD†<\/strong>: MASLD con consumo de alcohol mayor (categoría intermedia entre MASLD y enfermedad por alcohol†)."}}}],"cards":[["¿Qué causa el daño del hepatocito en la MASH?","La lipotoxicidad: ácidos grasos libres, ceramidas, diacilgliceroles y colesterol libre causan estrés del retículo, daño mitocondrial y radicales libres. Los triglicéridos en sí no son el principal tóxico."],["Variante genética que protege contra MASH y fibrosis","Pérdida de función de HSD17B13."],["¿Qué es MASLD?","Esteatosis hepática + ≥1 rasgo del síndrome metabólico, sin alcohol clínicamente significativo ni otra causa secundaria de esteatosis."],["¿En qué año se propuso MAFLD?","2020: definición positiva que exige anormalidades metabólicas."],["Corte de cintura en criterios de MASLD","≥94 cm hombres (≥90 cm hombres asiáticos) y ≥80 cm mujeres."],["Corte de triglicéridos (MASLD)","≥1.70 mmol/L (≈150 mg/dL) o tratamiento."],["¿Más rasgos metabólicos implica…?","Mayor riesgo de desenlaces hepáticos mayores."],["¿Dónde aumentó más la prevalencia de MASLD 2010–2021?","China e India."],["Riesgo de DM2 nueva por MASLD","2.2× (3.4× con enfermedad hepática avanzada)."],["Riesgo de fibrilación auricular en MASLD","≈1.2×."],["Factor metabólico predominante para MASLD avanzada","Diabetes tipo 2, seguida de obesidad e hipertensión."],["Factores dietéticos dañinos","Fructosa, grasas saturadas y trans, alcohol."],["F1","Fibrosis perisinusoidal o portal."],["Fibrosis clínicamente significativa","≥F2: predice muerte por cualquier causa y complicaciones hepáticas."],["Tiempo a cirrosis/descompensación desde F3","≈5–6 años."],["Desenlaces para aprobación condicional de un fármaco para MASH","Resolución de MASH sin empeorar fibrosis, o mejoría de fibrosis ≥1 estadio sin empeorar MASH."],["Tres fuentes de ácidos grasos hepáticos","Flujo de AGL del tejido adiposo resistente a insulina, lipogénesis de novo y quilomicrones de la dieta."],["Otra variante común además de PNPLA3","TM6SF2 (variante rara: APOB)."],["FIB-4 bajo riesgo","&lt;1.30 (≈50–70 % de los evaluados); repetir cada 1–3 años."],["Corte de VCTE para enviar al hepatólogo","≥8.0 kPa."],["Corte de ELF de alto riesgo","≥10.5."],["Pérdida de peso para reducir inflamación","7–10 %."],["MAESTRO-NASH: resolución de MASH","25.9 % (80 mg), 29.9 % (100 mg) vs 9.7 % placebo."],["ESSENCE: dosis y duración","Semaglutida 2.4 mg/semana SC por 72 semanas (800 pacientes, F2–F3)."],["Tirzepatida: receptores","GLP-1 + GIP (agonista dual)."],["Lanifibranor","Agonista pan-PPAR; mejora MASH y fibrosis; sube ≈2.5 kg y causa edema."]],"mcq":[{"q":"Mujer de 48 años con esteatosis en US, IMC 27, sin diabetes, PA 118/76, triglicéridos y HDL normales, consumo de alcohol mínimo. ¿Cumple criterios de MASLD?","o":["Sí, el IMC ≥25 basta como rasgo cardiometabólico","No, necesita al menos dos rasgos","No, necesita biopsia","Solo si tiene transaminasas elevadas","No, necesita diabetes"],"a":0,"e":"Basta <strong>1 de 5<\/strong> rasgos; el <strong>IMC ≥25<\/strong> (≥23 en asiáticos) es uno de ellos (Figura 1)."},{"q":"¿Qué prevalencia de MASLD reporta la revisión en la población adulta mundial?","o":["10 %","65 %","Hasta 80 %","5 %","Hasta 38 %"],"a":4,"e":"MASLD afecta <strong>hasta 38 %<\/strong> de los adultos del mundo; 65 % es la cifra en DM2."},{"q":"¿Cuál es el corte de cintura en una mujer para el criterio de adiposidad de MASLD?","o":["≥88 cm","≥90 cm","≥80 cm","≥94 cm","≥102 cm"],"a":2,"e":"Cintura <strong>≥80 cm en mujeres<\/strong>, ≥94 cm en hombres (≥90 cm en hombres asiáticos)."},{"q":"¿Cuál de los siguientes NO es uno de los cinco rasgos para el diagnóstico de MASLD?","o":["Presión ≥130/85 mm Hg","HDL &lt;1.0 mmol/L en hombres","Glucosa en ayuno ≥5.6 mmol/L","ALT elevada","IMC ≥25"],"a":3,"e":"Los 5 rasgos son adiposidad, glucosa, presión, triglicéridos y HDL. La <strong>ALT<\/strong> no es criterio."},{"q":"¿En qué año se renombró la enfermedad como MASLD y MASH?","o":["1980","2023","2000","2020","2025"],"a":1,"e":"<strong>2023<\/strong> (MASLD/MASH). En 2020 se propuso MAFLD; en 1980 Ludwig describió la NASH."},{"q":"Paciente con MASLD y FIB-4 de 3.1. ¿Qué indica el algoritmo?","o":["Envío a hepatólogo","VCTE y, si &lt;8 kPa, reevaluar","Repetir FIB-4 en 1–3 años","Solo cambios de estilo de vida","Ultrasonido cada 6 meses"],"a":0,"e":"FIB-4 <strong>&gt;2.67<\/strong> = alto riesgo → <strong>hepatólogo<\/strong> directamente."},{"q":"Un paciente con FIB-4 indeterminado tiene VCTE de 9.4 kPa. ¿Qué sigue?","o":["Reevaluar FIB-4 en ≤1 año","Repetir VCTE en 3 años","Alta definitiva","Suspender metformina","Enviar al hepatólogo"],"a":4,"e":"Rigidez <strong>≥8.0 kPa<\/strong> → <strong>hepatólogo<\/strong> (Figura 3)."},{"q":"¿Qué variables usa el FIB-4?","o":["Edad, albúmina, bilirrubina e INR","AST, plaquetas e IMC","Edad, AST, ALT y plaquetas","ALT, GGT y triglicéridos","Edad, IMC, glucosa y AST"],"a":2,"e":"FIB-4 se calcula con <strong>edad, AST, ALT y plaquetas<\/strong>."},{"q":"¿Qué corte de elastografía por resonancia (MRE) indica alto riesgo?","o":["≥2.0 kPa","≥5.0 kPa","≥8.0 kPa","≥3.1 kPa"],"a":3,"e":"<strong>MRE ≥3.1 kPa<\/strong> (VCTE ≥8.0 kPa)."},{"q":"¿Qué porcentaje de pérdida de peso sostenida se necesita para reducir la fibrosis?","o":["≥3 %","≥10 %","≥5 %","7 %","≥20 %"],"a":1,"e":"≥5 % esteatosis; 7–10 % inflamación; <strong>≥10 % fibrosis<\/strong>."},{"q":"¿Cuál es el mecanismo de acción del resmetirom?","o":["Agonista selectivo del receptor β de hormona tiroidea","Agonista del receptor de GLP-1","Agonista pan-PPAR","Inhibidor de SGLT2","Análogo de FGF21"],"a":0,"e":"Resmetirom es un agonista <strong>THR-β<\/strong> oral dirigido al hígado."},{"q":"Paciente en tratamiento con resmetirom tiene T4 libre algo baja y TSH normal. ¿Cómo lo interpretas?","o":["Efecto esperado: T4 libre baja ≈15–20 % sin cambio de TSH ni T3 libre","Hipotiroidismo central: suspender","Hipertiroidismo subclínico","Interacción con levotiroxina que obliga a suspender"],"a":0,"e":"Resmetirom reduce la <strong>T4 libre ≈15–20 %<\/strong> sin cambiar TSH ni T3 libre, independientemente de la levotiroxina."},{"q":"¿Cuáles fueron los efectos adversos más comunes del resmetirom?","o":["Náusea y diarrea","Edema y ganancia de peso","Hipoglucemia","Taquiarritmias","Fracturas"],"a":0,"e":"<strong>Náusea y diarrea<\/strong>, transitorias y leves a moderadas."},{"q":"En ESSENCE, ¿qué porcentaje logró resolución de MASH sin empeorar la fibrosis con semaglutida?","o":["62.9 %","32.7 %","37.0 %","59 %"],"a":0,"e":"<strong>62.9 % vs 34.3 %<\/strong> con placebo. Mejoría de fibrosis: 37.0 % vs 22.4 %; ambos desenlaces juntos: 32.7 % vs 16.1 %."},{"q":"Hombre con cirrosis compensada por MASH. ¿Qué mostró la semaglutida 2.4 mg semanal por 48 semanas?","o":["Revirtió la cirrosis","Aumentó la descompensación","Bajó la grasa hepática, sin mejorar fibrosis ni resolver MASH","Resolvió la MASH en 60 %"],"a":2,"e":"En 71 pacientes con cirrosis compensada, <strong>redujo la grasa<\/strong> pero <strong>no la fibrosis<\/strong> ni resolvió la MASH."},{"q":"¿Qué fármaco es un triple agonista GIP, GLP-1 y glucagón?","o":["Survodutida","Tirzepatida","Cotadutida","Retatrutida","Semaglutida"],"a":3,"e":"<strong>Retatrutida<\/strong>: redujo la grasa hepática hasta −86 % con 12 mg/semana."},{"q":"¿Qué efecto adverso particular se asoció con survodutida además de los gastrointestinales?","o":["Hipotiroidismo","Mayor frecuencia cardiaca","Edema periférico","Pérdida ósea"],"a":1,"e":"Survodutida se asoció a <strong>mayor frecuencia cardiaca<\/strong>; la suspensión por efectos adversos fue 20 % vs 3 %."},{"q":"¿Qué dosis de pioglitazona se usó en los ensayos de MASH citados?","o":["30–45 mg/día","5–10 mg/día","15 mg/día","60 mg/día"],"a":0,"e":"Pioglitazona <strong>30–45 mg/día<\/strong> hasta 24 meses: menos fibrosis y resolución de MASH, con o sin DM2."},{"q":"En el ensayo SYMMETRY, ¿qué logró la efruxifermina en cirrosis compensada por MASH?","o":["Reversión de cirrosis 29 % vs 11 %","Resolución de MASH 62.9 %","Pérdida de peso 15 %","Ningún efecto"],"a":0,"e":"Efruxifermina <strong>50 mg/semana × 96 semanas<\/strong>: reversión de cirrosis <strong>29 % vs 11 %<\/strong>."},{"q":"Dapagliflozina 10 mg/día por 48 semanas en MASH logró resolución de MASH en:","o":["8 %","45 %","23 %","62 %"],"a":2,"e":"<strong>23 % vs 8 %<\/strong>; mejoría de fibrosis 45 % vs 20 %."},{"q":"¿Qué gen es el principal determinante genético común de MASLD progresiva?","o":["HFE","ATP7B","SERPINA1","PNPLA3","ABCB4"],"a":3,"e":"<strong>PNPLA3<\/strong>, junto con TM6SF2; variantes raras como APOB."},{"q":"¿Qué factor hormonal es protector frente a MASLD?","o":["Hipotiroidismo primario","Estrógenos","Cortisol","Hiperinsulinemia"],"a":1,"e":"Los <strong>estrógenos<\/strong> (sexo femenino) son protectores; el hipotiroidismo primario aumenta el riesgo."},{"q":"¿Cuál es la incidencia aproximada de CHC en cirrosis por MASLD?","o":["≈20 por 1000 personas-año","1.25 por 1000 personas-año","100 por 1000 personas-año","0.1 por 1000 personas-año"],"a":0,"e":"≈<strong>20/1000<\/strong> en cirrosis frente a 1.25/1000 en MASLD en general."},{"q":"¿Qué desenlace es aceptado para aprobación condicional de un fármaco para MASH?","o":["Mejoría de fibrosis ≥1 estadio sin empeorar MASH","Reducción de ALT 50 %","Pérdida de peso ≥10 %","Normalización de FIB-4"],"a":0,"e":"Los dos desenlaces aceptados: <strong>resolución de MASH sin empeorar fibrosis<\/strong> y <strong>mejoría de fibrosis ≥1 estadio sin empeorar MASH<\/strong>."}],"tf":[["En la MASLD, lo que mejor predice la mortalidad es el grado de fibrosis.",true,"La fibrosis define el pronóstico hepático y global."],["MASLD requiere al menos dos rasgos del síndrome metabólico.",false,"Basta con uno de cinco."],["La prevalencia mundial de MASLD en adultos llega a 38 %.",true,"Hasta 38 %; en DM2, 65 %."],["Un FIB-4 &gt;2.67 debe enviarse al hepatólogo.",true,"Alto riesgo de fibrosis avanzada."],["ELF ≥10.5 indica alto riesgo de desenlaces hepáticos.",true,"Figura 3."],["Resmetirom está aprobado para cirrosis por MASH.",false,"Solo para MASH no cirrótica con fibrosis moderada a avanzada."],["Semaglutida 2.4 mg/semana mejoró la fibrosis en ESSENCE.",true,"37.0 % vs 22.4 %."],["Tirzepatida es un agonista dual de GLP-1 y glucagón.",false,"Es GLP-1 + GIP; la survodutida es GLP-1 + glucagón."],["Los estrógenos protegen contra MASLD.",true,"El sexo femenino y los estrógenos son protectores."],["La secreción de VLDL está aumentada en la progresión de MASLD.",false,"La remodelación alterada de gotas lipídicas reduce la secreción de VLDL."],["Existen fármacos dirigidos al hígado aprobados para la cirrosis por MASLD.",false,"Aún no hay ninguno."]]},{"id":"cirrosis","n":6,"title":"Cirrosis: prevenir la descompensación y la muerte","short":"Cirrosis compensada","color":"#9A5B2E","src":"Villanueva C, Tripathi D, Bosch J. Preventing the progression of cirrhosis to decompensation and death. Nat Rev Gastroenterol Hepatol. 2025;22(4):265-80.","hook":"La cirrosis compensada mata poco (~1.5 % al año); la descompensada mata mucho. El partido se juega en un número: un gradiente de presión venosa hepática de 10 mmHg. Si lo detectas y das carvedilol, la descompensación cae a la mitad.","group":"Hígado","ses":21,"date":"2026-10-28","nums":[["~1.5 %","mortalidad anual en la cirrosis compensada (mediana de duración ~10 años)"],["≥10 mmHg","GPVH que define la hipertensión portal clínicamente significativa (HPCS)"],["~5 %/año","paso de compensada a descompensada con HPCS sin tratar"],["25 % a 5 años","incidencia acumulada de ascitis, la descompensación más frecuente"],["SHR 0.51","PREDESCI: los BBNS reducen a la mitad la descompensación o muerte"],["≤12.5 mg/día","dosis de carvedilol que baja la presión portal casi sin hipotensión"]],"esencial":"<ul><li><strong>EHCA<\/strong> (enfermedad hepática crónica avanzada) describe al paciente que <strong>probablemente ya tiene cirrosis<\/strong> si se le hiciera biopsia; se usa en la era de las pruebas no invasivas. Tiene dos etapas: <strong>compensada (EHCAc)<\/strong> y <strong>descompensada (EHCAd)<\/strong>.<\/li><li><strong>EHCAc:<\/strong> etapa larga (<strong>mediana ~10 años<\/strong>), casi asintomática, <strong>mortalidad ~1.5 % al año<\/strong> (similar a la población sana de la misma edad).<\/li><li><mark><strong>HPCS = GPVH ≥10 mmHg<\/strong><\/mark>: aparecen colaterales y várices, empieza la <strong>circulación hiperdinámica<\/strong> y el riesgo de descompensar se dispara. <strong>GPVH ≥16 mmHg<\/strong> = mayor riesgo de muerte.<\/li><li>Sin tratamiento, con HPCS se descompensa <strong>~5 % al año<\/strong>; al descompensar, la mortalidad aumenta <strong>hasta 80 % a 2 años<\/strong> según el evento.<\/li><li><strong>Descompensación<\/strong> = <strong>ascitis manifiesta<\/strong>, <strong>hemorragia variceal<\/strong> o <strong>encefalopatía hepática manifiesta (West Haven ≥II)<\/strong>. La <strong>ascitis<\/strong> es la más frecuente (<strong>25 % a 5 años<\/strong>); hemorragia <strong>5 %<\/strong> y encefalopatía <strong>3 %<\/strong>.<\/li><li>El motor de la hipertensión portal es la <strong>↑ resistencia intrahepática<\/strong> (estructural + dinámica, con <strong>↓ óxido nítrico<\/strong>); después la <strong>vasodilatación esplácnica<\/strong> aumenta el flujo portal y la agrava.<\/li><li>Pruebas no invasivas: <strong>RH ≤15 kPa y plaquetas ≥150 × 10⁹/L descartan HPCS<\/strong>; <strong>RH ≥25 kPa confirma<\/strong> (Baveno VII, &quot;regla de los cinco&quot;). La <strong>rigidez esplénica &gt;40 kPa<\/strong> reduce la zona gris.<\/li><li><strong>TESLA<\/strong>: tratar la etiología, estilo de vida seguro y evitar riesgos. La cirrosis <strong>ya no se considera irreversible<\/strong>: con tratamiento etiológico la regresión histológica ocurre en <strong>30–50 % a 3–5 años<\/strong> (VHC, VHB).<\/li><li><strong>Abstinencia total de alcohol<\/strong> sea cual sea la causa; vacunar contra <strong>VHA, VHB, neumococo e influenza<\/strong>; <strong>paracetamol hasta 2 g/día<\/strong>.<\/li><li><mark><strong>BBNS en todo paciente con EHCAc y HPCS<\/strong> sin contraindicación<\/mark>: PREDESCI redujo descompensación o muerte a la mitad (<strong>SHR 0.51<\/strong>), sobre todo por <strong>~60 % menos ascitis<\/strong> (SHR 0.42).<\/li><li><strong>Carvedilol es el BBNS preferido<\/strong>: más potente (<strong>~70 %<\/strong> alcanza la meta de GPVH), mejor tolerado y el único que demostró <strong>↓ mortalidad ~60 %<\/strong> (SHR 0.417) en metaanálisis de datos individuales.<\/li><li>Dosis de carvedilol: <strong>hasta 12.5 mg/día<\/strong>; más de eso causa hipotensión. Solo en EHCAc con <strong>hipertensión arterial<\/strong> se sube a <strong>25 mg/día<\/strong>.<\/li><li>En várices de alto riesgo compensadas, <strong>BBNS mejor que ligadura<\/strong>: con ligadura hubo <strong>más ascitis<\/strong> (SHR 2.66) y <strong>peor supervivencia<\/strong> (SHR 1.76).<\/li><li><strong>Estatinas<\/strong>: prometedoras; Baveno VII las anima si hay <strong>indicación cardiovascular<\/strong>; cuidado en <strong>Child-Pugh C<\/strong> (rabdomiólisis).<\/li><li><strong>Anticoagulación<\/strong>: indicada en <strong>TVP sintomática<\/strong>; considerar si es <strong>reciente (&lt;6 meses) y oclusiva (&gt;50 % de la luz)<\/strong>. No desalentarla si hay indicación aprobada.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La cifra que más se pregunta: <strong>GPVH normal &lt;5 mmHg; HP leve 5 a &lt;10; HPCS ≥10<\/strong>. Y la droga: <strong>carvedilol<\/strong> para prevenir la <strong>primera descompensación<\/strong> en compensados con HPCS.<\/p><\/aside>","secs":[{"t":"Historia natural y estadios","h":"<figure class=\"fig\" data-fig=\"cirrosis-estadios\"><svg viewBox=\"0 0 400 340\" role=\"img\" aria-label=\"Estadios de la enfermedad hepática crónica avanzada\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah23\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"10\" y=\"8\" width=\"380\" height=\"40\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"200\" y=\"28\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">EHCA compensada · mediana ~10 años · ~1.5 %/año<\/tspan><\/text><rect x=\"10\" y=\"60\" width=\"185\" height=\"78\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"102.5\" y=\"78.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"102.5\" dy=\"0\">GPVH &lt;10 mmHg<\/tspan><tspan x=\"102.5\" dy=\"13.42\">Sin HP (&lt;5) o HP leve (5 a<\/tspan><tspan x=\"102.5\" dy=\"13.42\">&lt;10)<\/tspan><tspan x=\"102.5\" dy=\"13.42\">~1 %/año<\/tspan><\/text><rect x=\"205\" y=\"60\" width=\"185\" height=\"78\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"297.5\" y=\"85.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"297.5\" dy=\"0\">HPCS: GPVH ≥10 mmHg<\/tspan><tspan x=\"297.5\" dy=\"13.42\">Várices, colaterales,<\/tspan><tspan x=\"297.5\" dy=\"13.42\">circulación hiperdinámica<\/tspan><\/text><path d=\"M102 138 L102 150\" class=\"fx-arr\" marker-end=\"url(#ah23)\"/><path d=\"M102 150 L205 150\" class=\"fx-arr\" marker-end=\"url(#ah23)\"/><path d=\"M297 138 L297 176\" class=\"fx-arr\" marker-end=\"url(#ah23)\"/><g><rect x=\"230.2\" y=\"148\" width=\"133.60000000000002\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"297\" y=\"157.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"297\" dy=\"0\">~5 %/año sin tratar<\/tspan><\/text><\/g><rect x=\"10\" y=\"178\" width=\"380\" height=\"62\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"201.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">EHCA descompensada: ascitis, hemorragia variceal,<\/tspan><tspan x=\"200\" dy=\"14.03\">EH manifiesta · 30–60 % de mortalidad a 1 año<\/tspan><\/text><path d=\"M200 240 L200 262\" class=\"fx-arr\" marker-end=\"url(#ah23)\"/><rect x=\"10\" y=\"262\" width=\"380\" height=\"58\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:1;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"283.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Descompensación adicional / ACLF<\/tspan><tspan x=\"200\" dy=\"14.03\">Meses · 80 % de mortalidad sin trasplante<\/tspan><\/text><\/svg><figcaption>La <strong>HPCS (GPVH ≥10 mmHg)<\/strong> marca el punto desde el que puede ocurrir la descompensación. Con HPCS sin tratar, <strong>~5 % al año<\/strong> se descompensa (Figura 1 del artículo).<\/figcaption><\/figure><h5>Subestadios por GPVH (fisiopatología)<\/h5><div class=\"tbl\"><table><thead><tr><th>Subestadio<\/th><th>GPVH<\/th><th>Qué significa<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Sin hipertensión portal<\/th><td><strong>&lt;5 mmHg<\/strong><\/td><td>Normal<\/td><\/tr><tr><th scope=\"row\">HP leve<\/th><td><strong>5 a &lt;10 mmHg<\/strong><\/td><td>Pronóstico muy bueno (mortalidad <strong>~1 %/año<\/strong>)<\/td><\/tr><tr><th scope=\"row\"><strong>HPCS<\/strong><\/th><td><strong>≥10 mmHg<\/strong><\/td><td>Colaterales, várices, circulación hiperdinámica, alto riesgo de descompensar<\/td><\/tr><tr><th scope=\"row\">HP de alto riesgo<\/th><td><strong>≥16 mmHg<\/strong><\/td><td>Mayor riesgo de <strong>muerte<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Entre los pacientes con HPCS, los que tienen <strong>várices<\/strong> tienen <strong>más riesgo<\/strong> de descompensar y circulación hiperdinámica más acentuada.<\/p><\/aside>"},{"t":"Fisiopatología: de la lesión crónica a la cirrosis","h":"<div data-fp=\"cirrosis\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Cicatriz + nódulos<\/span><\/div><p>La cirrosis es la etapa final de cualquier lesión hepática crónica: la <strong>fibrosis<\/strong> rodea <strong>nódulos de regeneración<\/strong> y cambia la arquitectura del hígado. Eso causa dos problemas: <strong>falla de función<\/strong> (hay menos hepatocitos bien irrigados) e <strong>hipertensión portal<\/strong> (la sangre no puede pasar).<\/p><\/aside><figure class=\"fig\" data-fig=\"cirrosis-fp\"><svg viewBox=\"0 0 400 356.53\" role=\"img\" aria-label=\"De la lesión crónica a la cirrosis\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-cirrosis\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Lesión crónica: alcohol, virus B o C, MASLD,<\/tspan><tspan x=\"200\" dy=\"14.03\">autoinmunidad, colestasis<\/tspan><\/text><path d=\"M200 52.06 L200 74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-cirrosis)\"/><rect x=\"50\" y=\"74.06\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"91.11\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hepatocitos dañados y Kupffer liberan TGF-β,<\/tspan><tspan x=\"200\" dy=\"14.03\">PDGF y radicales libres<\/tspan><\/text><path d=\"M200 120.12 L200 142.12\" class=\"fx-arr\" marker-end=\"url(#ahfp-cirrosis)\"/><rect x=\"50\" y=\"142.12\" width=\"300\" height=\"60.09\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"159.17\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Las células estelares (de Ito) se activan:<\/tspan><tspan x=\"200\" dy=\"14.03\">pierden la vitamina A y se vuelven<\/tspan><tspan x=\"200\" dy=\"14.03\">miofibroblastos<\/tspan><\/text><path d=\"M200 202.21 L200 224.21\" class=\"fx-arr\" marker-end=\"url(#ahfp-cirrosis)\"/><rect x=\"50\" y=\"224.21\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"241.26\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Colágeno I y III en el espacio de Disse; el<\/tspan><tspan x=\"200\" dy=\"14.03\">sinusoide se \"capilariza\" (pierde sus poros)<\/tspan><\/text><path d=\"M200 270.27 V281.27 H101 V292.27\" class=\"fx-arr\" marker-end=\"url(#ahfp-cirrosis)\"/><path d=\"M200 270.27 V281.27 H299 V292.27\" class=\"fx-arr\" marker-end=\"url(#ahfp-cirrosis)\"/><rect x=\"6\" y=\"292.27\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"101\" y=\"308.97\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">Menos intercambio sangre-<\/tspan><tspan x=\"101\" dy=\"13.42\">hepatocito: falla de síntesis<\/tspan><tspan x=\"101\" dy=\"13.42\">y detoxificación<\/tspan><\/text><rect x=\"204\" y=\"292.27\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"299\" y=\"308.97\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Más resistencia al flujo +<\/tspan><tspan x=\"299\" dy=\"13.42\">vasoconstricción:<\/tspan><tspan x=\"299\" dy=\"13.42\">hipertensión portal<\/tspan><\/text><\/svg><figcaption>Si la causa se quita a tiempo (antivirales, abstinencia de alcohol), las células estelares pueden desactivarse y la fibrosis puede retroceder en parte.<\/figcaption><\/figure><h5>Del mecanismo a la clínica<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Menos síntesis de proteínas<\/th><td>Albúmina baja, INR alargado<\/td><\/tr><tr><th scope=\"row\">Menos conjugación y excreción de bilirrubina<\/th><td>Ictericia<\/td><\/tr><tr><th scope=\"row\">Menos depuración de amonio y toxinas<\/th><td>Encefalopatía hepática<\/td><\/tr><tr><th scope=\"row\">Menos degradación de estrógenos<\/th><td>Telangiectasias (arañas vasculares), eritema palmar, ginecomastia, atrofia testicular<\/td><\/tr><tr><th scope=\"row\">Hiperesplenismo por hipertensión portal<\/th><td>Plaquetas bajas (y menos trombopoyetina hepática)<\/td><\/tr><tr><th scope=\"row\">Hipertensión portal y vasodilatación esplácnica<\/th><td>Várices, ascitis, esplenomegalia, red venosa colateral<\/td><\/tr><\/tbody><\/table><\/div><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Descompensación: definición y pronóstico","h":"<h5>Mortalidad según la primera descompensación<\/h5><div class=\"tbl\"><table><thead><tr><th>Primera descompensación<\/th><th>Mortalidad a 1 año<\/th><th>Mortalidad a 5 años<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Solo <strong>hemorragia<\/strong><\/th><td>10–16 %<\/td><td>20–30 %<\/td><\/tr><tr><th scope=\"row\"><strong>No hemorrágica<\/strong> (ascitis, EH)<\/th><td>9–19 %<\/td><td>30–40 %<\/td><\/tr><tr><th scope=\"row\"><strong>Más de un evento<\/strong><\/th><td><strong>30 %<\/strong><\/td><td><strong>70–88 %<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>ascitis<\/strong> es la descompensación <strong>más frecuente<\/strong> en compensados (<strong>25 % a 5 años<\/strong>), por encima de la hemorragia (<strong>5 %<\/strong>) y la encefalopatía (<strong>3 %<\/strong>). Por eso el beneficio de los BBNS viene, sobre todo, de <strong>prevenir ascitis<\/strong>.<\/p><\/aside>"},{"t":"Fisiopatología de la hipertensión portal","h":"<figure class=\"fig\" data-fig=\"cirrosis-fisio\"><svg viewBox=\"0 0 400 390\" role=\"img\" aria-label=\"Fisiopatología de la hipertensión portal\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah24\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"100\" y=\"6\" width=\"200\" height=\"32\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Daño hepático crónico<\/tspan><\/text><path d=\"M200 38 L200 56\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><rect x=\"10\" y=\"56\" width=\"380\" height=\"56\" rx=\"9\" style=\"fill:#9A5B2E;fill-opacity:0.13;stroke:#9A5B2E;stroke-width:1.5\"/><text x=\"200\" y=\"70.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">↑ Resistencia intrahepática (factor primario)<\/tspan><tspan x=\"200\" dy=\"13.42\">Estructural: fibrosis, oclusión vascular<\/tspan><tspan x=\"200\" dy=\"13.42\">Dinámica: ↑ tono vascular, ↓ NO sinusoidal<\/tspan><\/text><path d=\"M200 112 L200 130\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><rect x=\"60\" y=\"130\" width=\"280\" height=\"36\" rx=\"9\" style=\"fill:#9A5B2E;fill-opacity:1;stroke:#9A5B2E;stroke-width:1.5\"/><text x=\"200\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hipertensión portal: GPVH ≥10 = HPCS<\/tspan><\/text><path d=\"M140 166 L105 190\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><path d=\"M260 166 L295 190\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><rect x=\"10\" y=\"190\" width=\"190\" height=\"56\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"105\" y=\"210.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"105\" dy=\"0\">Colaterales y várices<\/tspan><tspan x=\"105\" dy=\"14.03\">(angiogénesis por VEGF)<\/tspan><\/text><rect x=\"210\" y=\"190\" width=\"180\" height=\"56\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"211.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Vasodilatación esplácnica<\/tspan><tspan x=\"300\" dy=\"13.42\">(NO, VEGF, CO, glucagón)<\/tspan><\/text><path d=\"M105 246 L105 270\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><path d=\"M300 246 L300 270\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><rect x=\"10\" y=\"270\" width=\"190\" height=\"48\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"105\" y=\"286.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"105\" dy=\"0\">Ruptura variceal:<\/tspan><tspan x=\"105\" dy=\"14.03\">hemorragia<\/tspan><\/text><rect x=\"210\" y=\"270\" width=\"180\" height=\"48\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"287.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Hipovolemia efectiva →<\/tspan><tspan x=\"300\" dy=\"13.42\">retención de Na → ascitis<\/tspan><\/text><path d=\"M300 318 L300 340\" class=\"fx-arr\" marker-end=\"url(#ah24)\"/><rect x=\"10\" y=\"340\" width=\"380\" height=\"42\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"354.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Translocación bacteriana e inflamación sistémica →<\/tspan><tspan x=\"200\" dy=\"13.42\">descompensación adicional<\/tspan><\/text><\/svg><figcaption>El <strong>↑ de resistencia intrahepática<\/strong> inicia la hipertensión portal; la <strong>vasodilatación esplácnica<\/strong> aumenta el flujo portal y la perpetúa. Los <strong>BBNS<\/strong> bajan el flujo; el <strong>carvedilol<\/strong> además baja la resistencia (Figura 2 del artículo).<\/figcaption><\/figure><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Dos frentes terapéuticos<\/span><\/div><p>Bajar la <strong>resistencia intrahepática<\/strong> (etiología, estatinas, carvedilol por su efecto anti-α1 y pro-NO) y bajar el <strong>flujo portal<\/strong> (BBNS: β1 ↓ gasto cardiaco; β2 vasoconstricción esplácnica).<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El <strong>primer<\/strong> evento es el aumento de <strong>resistencia intrahepática<\/strong>; la vasodilatación esplácnica y el hiperflujo son <strong>posteriores<\/strong> y la <strong>perpetúan<\/strong>. En la vasodilatación esplácnica el NO está <strong>aumentado<\/strong>; dentro del hígado está <strong>disminuido<\/strong>.<\/p><\/aside>"},{"t":"GPVH: el estándar invasivo","h":"<h5>Estudios que fijaron los cortes<\/h5><div class=\"tbl\"><table><thead><tr><th>Situación<\/th><th>Meta de respuesta hemodinámica<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">EHCAc (prevenir 1.ª descompensación)<\/th><td>↓ <strong>&gt;10 %<\/strong> del basal o a <strong>&lt;10 mmHg<\/strong><\/td><\/tr><tr><th scope=\"row\">EHCAd (sobre todo alcohol)<\/th><td>↓ <strong>&gt;20 %<\/strong> del basal o a <strong>&lt;12 mmHg<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Por qué importa<\/span><\/div><p>Cualquier terapia que <strong>impida que el GPVH suba de 10 mmHg<\/strong>, o que lo baje a <strong>&lt;10 mmHg<\/strong>, reduce de forma dramática el riesgo de descompensar; también si lo baja <strong>&gt;10 %<\/strong> del basal.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Respuesta en <strong>compensados: &gt;10 %<\/strong>; en <strong>descompensados: &gt;20 % o &lt;12 mmHg<\/strong>. No las confundas.<\/p><\/aside>"},{"t":"Pruebas no invasivas y estratificación","h":"<figure class=\"fig\" data-fig=\"cirrosis-nit\"><svg viewBox=\"0 0 400 290\" role=\"img\" aria-label=\"Criterios no invasivos de HPCS de Baveno VII\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah25\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"200\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Elastografía transitoria (RH) + plaquetas (× 10⁹/L)<\/tspan><\/text><rect x=\"8\" y=\"30\" width=\"124\" height=\"34\" rx=\"9\" style=\"fill:#16834A;fill-opacity:1;stroke:#16834A;stroke-width:1.5\"/><text x=\"70\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">Descarta HPCS<\/tspan><\/text><rect x=\"138\" y=\"30\" width=\"124\" height=\"34\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:1;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Probable (~60 %)<\/tspan><\/text><rect x=\"268\" y=\"30\" width=\"124\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:1;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">Confirma (&gt;90 %)<\/tspan><\/text><rect x=\"8\" y=\"72\" width=\"124\" height=\"130\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"70\" y=\"103.45\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"70\" dy=\"0\">RH ≤15 kPa y<\/tspan><tspan x=\"70\" dy=\"13.42\">plaquetas ≥150<\/tspan><tspan x=\"70\" dy=\"13.42\"><\/tspan><tspan x=\"70\" dy=\"13.42\">RE ≤40 kPa<\/tspan><tspan x=\"70\" dy=\"13.42\"><\/tspan><tspan x=\"70\" dy=\"13.42\">GPVH &lt;10 mmHg<\/tspan><\/text><rect x=\"138\" y=\"72\" width=\"124\" height=\"130\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"130.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">RH 15–20 kPa y<\/tspan><tspan x=\"200\" dy=\"13.42\">plaquetas &lt;110<\/tspan><\/text><rect x=\"268\" y=\"72\" width=\"124\" height=\"130\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"330\" y=\"103.45\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">RH ≥25 kPa<\/tspan><tspan x=\"330\" dy=\"13.42\"><\/tspan><tspan x=\"330\" dy=\"13.42\">RH 20–25 kPa y<\/tspan><tspan x=\"330\" dy=\"13.42\">plaquetas &lt;150<\/tspan><tspan x=\"330\" dy=\"13.42\"><\/tspan><tspan x=\"330\" dy=\"13.42\">RE &gt;40 kPa<\/tspan><\/text><path d=\"M200 202 L200 222\" class=\"fx-arr\" marker-end=\"url(#ah25)\"/><rect x=\"8\" y=\"222\" width=\"384\" height=\"56\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"242.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Zona gris (37–47 % en PREDESCI): agregar rigidez esplénica o<\/tspan><tspan x=\"200\" dy=\"14.03\">endoscopia para buscar várices<\/tspan><\/text><\/svg><figcaption><strong>Regla de los cinco<\/strong>: RH <strong>≤15 kPa + plaquetas ≥150<\/strong> descarta; <strong>≥25 kPa<\/strong> confirma. Válida en enfermedad viral, alcohol o MASLD con <strong>IMC &lt;30<\/strong> (Figura 3 del artículo).<\/figcaption><\/figure><h5>Criterios de HPCS de Baveno VII (con apoyo de la AASLD)<\/h5><div class=\"tbl\"><table><thead><tr><th>Categoría<\/th><th>Criterio<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Descarta HPCS<\/strong><\/th><td>RH <strong>≤15 kPa<\/strong> y plaquetas <strong>≥150 × 10⁹/L<\/strong>; o rigidez esplénica (RE) <strong>≤40 kPa<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>HPCS probable (~60 %)<\/strong><\/th><td>RH <strong>15–20 kPa<\/strong> y plaquetas <strong>&lt;110 × 10⁹/L<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Confirma HPCS (&gt;90 %)<\/strong><\/th><td>RH <strong>≥25 kPa<\/strong>; o RH <strong>20–25 kPa<\/strong> y plaquetas <strong>&lt;150 × 10⁹/L<\/strong>; o RE <strong>&gt;40 kPa<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Predictores de descompensación (Figura 3b)<\/h5><div class=\"tbl\"><table><thead><tr><th>Prueba<\/th><th>Umbral<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">GPVH basal<\/th><td><strong>≥10 mmHg<\/strong><\/td><\/tr><tr><th scope=\"row\">Δ GPVH<\/th><td>No lograr reducción <strong>&gt;10 %<\/strong><\/td><\/tr><tr><th scope=\"row\">ET: RH basal<\/th><td><strong>&gt;15 kPa<\/strong>; Δ <strong>20 %<\/strong> de aumento<\/td><\/tr><tr><th scope=\"row\">Elastografía por RM<\/th><td><strong>&gt;4.2 kPa<\/strong>; Δ <strong>19 %<\/strong> de aumento<\/td><\/tr><tr><th scope=\"row\">RE<\/th><td><strong>&gt;40 kPa<\/strong> (complemento)<\/td><\/tr><tr><th scope=\"row\">FIB-4<\/th><td><strong>&gt;2<\/strong><\/td><\/tr><tr><th scope=\"row\">ELF<\/th><td><strong>&gt;11<\/strong><\/td><\/tr><tr><th scope=\"row\">VITRO (FvW antígeno/plaquetas)<\/th><td><strong>≥2.5<\/strong><\/td><\/tr><tr><th scope=\"row\">Clínicos<\/th><td>Etiología activa, <strong>obesidad<\/strong>, <strong>hipoalbuminemia<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Riesgo según etiología (a 3 años)<\/h5><div class=\"tbl\"><table><thead><tr><th>Etiología<\/th><th>Descompensación a 3 años<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Alcohol<\/strong><\/th><td>hasta <strong>35.5 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Viral <strong>sin tratar<\/strong><\/th><td>~15 %<\/td><\/tr><tr><th scope=\"row\">MASLD<\/th><td>~12 %<\/td><\/tr><tr><th scope=\"row\">Etiología <strong>controlada o curada<\/strong><\/th><td><strong>3–10 %<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;<strong>Regla de los cinco<\/strong>&quot;: <strong>≤15 kPa + plaquetas ≥150<\/strong> descarta; <strong>≥25 kPa<\/strong> confirma. Si cae en medio, <strong>rigidez esplénica o endoscopia<\/strong>. Las calculadoras completas de Baveno están en el tema 7.<\/p><\/aside>"},{"t":"Tratamiento etiológico y TESLA","h":"<h5>Cofactores (Tabla 1)<\/h5><div class=\"tbl\"><table><thead><tr><th>Factor<\/th><th>Dato<\/th><th>Qué hacer<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Alcohol<\/strong><\/th><td>↑ presión portal; predictor de descompensación y muerte<\/td><td><strong>Abstinencia completa<\/strong> sea cual sea la etiología<\/td><\/tr><tr><th scope=\"row\"><strong>Sobrepeso/obesidad<\/strong><\/th><td><strong>~30 %<\/strong> sobrepeso y <strong>~30 %<\/strong> obesidad en EHCAc<\/td><td>Dieta <strong>hipocalórica normoproteica<\/strong> + ejercicio aeróbico: baja el GPVH <strong>≥10 % en 42 %<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Diabetes tipo 2<\/strong><\/th><td><strong>~56 %<\/strong> en MASLD; <strong>~30 %<\/strong> en alcohol o VHC<\/td><td>Control glucémico estricto; cuidado con hipoglucemia; metformina, iSGLT2, aGLP-1<\/td><\/tr><tr><th scope=\"row\"><strong>Sarcopenia<\/strong><\/th><td>Datos escasos en EHCAc<\/td><td>Evaluación nutricional, dieta y ejercicio<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Mantén el BBNS <strong>al menos hasta<\/strong> que el tratamiento etiológico baje la presión portal <strong>por debajo de la HPCS<\/strong>. Curar el VHC no elimina de inmediato la HPCS.<\/p><\/aside>"},{"t":"Precipitantes de descompensación","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Para la TVP: <strong>sintomática = anticoagular<\/strong>. <strong>Reciente y oclusiva &gt;50 %<\/strong> = considerar. La cirugía extrahepática se vuelve peligrosa con <strong>GPVH &gt;16 mmHg<\/strong>.<\/p><\/aside>"},{"t":"Betabloqueadores no selectivos (BBNS)","h":"<h5>BBNS contra ligadura (LBE) en várices de alto riesgo compensadas<\/h5><div class=\"tbl\"><table><thead><tr><th>Desenlace<\/th><th>LBE frente a BBNS<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Hemorragia<\/th><td>Igual (SHR <strong>0.94<\/strong>, IC 0.47–1.87)<\/td><\/tr><tr><th scope=\"row\"><strong>Ascitis<\/strong><\/th><td><strong>Mayor con LBE<\/strong> (SHR <strong>2.66<\/strong>, IC 1.36–5.19)<\/td><\/tr><tr><th scope=\"row\"><strong>Supervivencia<\/strong><\/th><td><strong>Peor con LBE<\/strong> (SHR <strong>1.76<\/strong>, IC 1.11–2.77)<\/td><\/tr><tr><th scope=\"row\">Agregar LBE a BBNS<\/th><td>No mejoró resultados<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Los BBNS en compensados con HPCS <strong>no solo previenen la hemorragia<\/strong>: previenen <strong>toda<\/strong> la descompensación, <strong>sobre todo la ascitis<\/strong>.<\/p><\/aside>"},{"t":"Carvedilol: el BBNS preferido","h":"<h5>Dosis<\/h5><div class=\"tbl\"><table><thead><tr><th>Situación<\/th><th>Dosis<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">EHCAc (dosis efectiva)<\/th><td><strong>Hasta 12.5 mg/día<\/strong>: baja la presión portal, rara vez hipotensión sintomática, ↓ moderada del gasto cardiaco<\/td><\/tr><tr><th scope=\"row\"><strong>&gt;12.5 mg/día<\/strong><\/th><td>Puede causar <strong>hipotensión<\/strong><\/td><\/tr><tr><th scope=\"row\">EHCAc <strong>con hipertensión arterial<\/strong><\/th><td>Se puede subir a <strong>25 mg/día<\/strong> (solo en compensados)<\/td><\/tr><tr><th scope=\"row\">EHCAd<\/th><td><strong>Precaución<\/strong>: puede empeorar la ascitis<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Por qué es el preferido (Baveno VII, AASLD, NICE)<\/span><\/div><ol><li>Más eficaz para bajar la presión portal.<\/li><li>Mejor tolerado y más fácil de usar.<\/li><li>Previene la descompensación.<\/li><li><strong>Mejora la supervivencia.<\/strong><\/li><\/ol><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Carvedilol a dosis bajas&quot; = <strong>12.5 mg/día<\/strong>. Solo se sube a <strong>25 mg/día<\/strong> si el paciente compensado tiene <strong>hipertensión arterial<\/strong>.<\/p><\/aside>"},{"t":"Estatinas, anticoagulantes y otras estrategias","h":"<h5>Nuevos blancos (Recuadro 3)<\/h5><div class=\"tbl\"><table><thead><tr><th>Blanco<\/th><th>Ejemplos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">↓ actividad de NO sintasa endotelial<\/th><td><strong>Estatinas<\/strong><\/td><\/tr><tr><th scope=\"row\">Donadores de NO<\/th><td>Mononitrato de isosorbida<\/td><\/tr><tr><th scope=\"row\">↑ tono adrenérgico<\/th><td><strong>Carvedilol<\/strong>, prazosina, clonidina<\/td><\/tr><tr><th scope=\"row\">↑ angiotensina II<\/th><td>Antagonistas del receptor de angiotensina II<\/td><\/tr><tr><th scope=\"row\">Fibrosis y remodelado vascular<\/th><td>Estatinas, <strong>resmetirom<\/strong>, agonistas FXR y PPAR, aGLP-1, iSGLT2<\/td><\/tr><tr><th scope=\"row\">Oclusión vascular<\/th><td><strong>Enoxaparina, rivaroxabán<\/strong><\/td><\/tr><tr><th scope=\"row\">Antiangiogénicos<\/th><td>Sorafenib, inhibidores de mTOR<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Estatina en cirrosis: sí, si hay <strong>indicación cardiovascular<\/strong>; <strong>cuidado en Child-Pugh C<\/strong>. Anticoagulación: <strong>no la niegues<\/strong> por tener cirrosis si hay indicación aprobada.<\/p><\/aside>"}],"pearls":["HPCS = GPVH ≥10 mmHg: el umbral a partir del cual aparecen várices y descompensación.","GPVH normal &lt;5 mmHg; HP leve 5 a &lt;10; ≥16 mmHg marca mayor riesgo de muerte.","Cirrosis compensada: mediana ~10 años y mortalidad ~1.5 %/año. Descompensada: 30–60 % a 1 año.","Descompensación = ascitis manifiesta, hemorragia variceal o encefalopatía manifiesta (West Haven ≥II).","La ascitis es la primera descompensación más frecuente (25 % a 5 años); hemorragia 5 % y encefalopatía 3 %.","Hasta la mitad de los compensados sin várices ya tiene HPCS; con várices de cualquier tamaño, siempre hay HPCS.","Primero sube la resistencia intrahepática (↓ NO); luego la vasodilatación esplácnica (↑ NO) aumenta el flujo portal.","RH ≤15 kPa con plaquetas ≥150 × 10⁹/L descarta HPCS; RH ≥25 kPa la confirma; RE &gt;40 kPa ayuda en la zona gris.","PREDESCI: BBNS reducen descompensación o muerte a la mitad (SHR 0.51), sobre todo por menos ascitis.","Carvedilol es el BBNS preferido: ~70 % alcanza la meta de GPVH y reduce la mortalidad ~60 % (SHR 0.417).","Carvedilol hasta 12.5 mg/día; 25 mg/día solo en compensados con hipertensión arterial.","En compensados con várices de alto riesgo, BBNS mejor que ligadura: la ligadura da más ascitis y peor supervivencia.","Respuesta hemodinámica: compensados ↓ &gt;10 % o &lt;10 mmHg; descompensados ↓ &gt;20 % o &lt;12 mmHg.","TESLA: tratar la etiología, estilo de vida seguro, evitar riesgos; abstinencia total, vacunas VHA/VHB, paracetamol ≤2 g/día.","Estatinas con indicación cardiovascular (cuidado en Child-Pugh C); anticoagular la TVP sintomática."],"comps":[{"title":"Carvedilol contra BBNS clásicos (propranolol)","cols":["Carvedilol","Propranolol / nadolol"],"rows":[["Receptores","β1, β2 <strong>y α1<\/strong>","β1 y β2"],["Efecto intrahepático","<strong>↓ resistencia<\/strong> (anti-α1, ↑ NO)","No baja la resistencia intrahepática"],["Efecto sobre el flujo portal","↓ (β1 y β2)","↓ (β1 y β2)"],["Alcanzan la meta de GPVH","<strong>~70 %<\/strong>, incluso no respondedores a propranolol","Menor proporción"],["Dosis en EHCAc","<strong>Hasta 12.5 mg/día<\/strong>; 25 mg/día con HTA","† Titulación por FC y presión arterial"],["Hipotensión","Rara a ≤12.5 mg/día","Frecuente causa de intolerancia †"],["Evidencia en EHCAc con HPCS","IPD de 4 ECA: descompensación SHR 0.506; <strong>mortalidad SHR 0.417<\/strong>","PREDESCI (en respondedores): descompensación o muerte SHR 0.51 junto con carvedilol"],["En descompensados","Precaución: puede empeorar la ascitis","Efecto hemodinámico atenuado"],["Lugar actual","<strong>BBNS preferido<\/strong> (Baveno VII, AASLD, NICE)","Alternativa"],["Uso histórico","Más reciente","Pilar durante 4 décadas"]],"key":"El carvedilol también baja la <strong>resistencia intrahepática<\/strong> (anti-α1) y es el único con reducción de <strong>mortalidad<\/strong> demostrada en compensados."},{"title":"Cirrosis compensada contra descompensada","cols":["Compensada (EHCAc)","Descompensada (EHCAd)"],"rows":[["Definición","Sin ascitis, hemorragia variceal ni EH manifiesta","Al menos un evento: ascitis, hemorragia variceal o EH ≥II"],["Duración","Larga: mediana <strong>~10 años<\/strong>","Corta"],["Mortalidad","<strong>~1.5 %/año<\/strong>","<strong>30–60 % a 1 año<\/strong>"],["Síntomas","Casi asintomática","Complicaciones clínicas"],["Subestadios","Por GPVH (&lt;10 / ≥10) o endoscopia (sin, pequeñas, grandes várices)","Primera hemorrágica, primera no hemorrágica, más de un evento; aguda o no aguda"],["Respuesta a BBNS","Buena con HPCS (circulación hiperdinámica)","Efecto hemodinámico atenuado"],["Meta de GPVH con BBNS","↓ &gt;10 % o &lt;10 mmHg","↓ &gt;20 % o &lt;12 mmHg"],["Regresión de fibrosis","Más factible","Limitada por colágeno entrecruzado"],["Inflamación sistémica","Menor","Mucho más pronunciada"],["Trasplante","No por sí misma","Considerar a todos"]],"key":"La frontera es el primer evento descompensante; el objetivo en la compensada es <strong>que nunca ocurra<\/strong>."}],"algos":[{"title":"EHCA compensada: ¿tiene HPCS y necesita BBNS?","src":"Figura 3 y Recuadro 1 del artículo","start":"a","nodes":{"a":{"q":"Paciente con <strong>EHCA compensada<\/strong> (sin ascitis, hemorragia ni EH manifiesta). ¿Cuál es su <strong>rigidez hepática (ET)<\/strong> y su cuenta de <strong>plaquetas<\/strong>?","i":"Criterios válidos en enfermedad viral, alcohol o MASLD con IMC &lt;30 kg/m².","o":[["RH ≤15 kPa y plaquetas ≥150 × 10⁹/L","fuera"],["RH ≥25 kPa, o 20–25 kPa con plaquetas &lt;150","dentro"],["RH 15–20 kPa con plaquetas &lt;110","prob"],["Otro valor intermedio (zona gris)","gris"]]},"fuera":{"end":1,"tone":"ok","text":"<strong>HPCS descartada.<\/strong> TESLA: tratar la etiología, abstinencia, control de peso y diabetes, vacunas (VHA, VHB, neumococo, influenza), paracetamol ≤2 g/día. Reevaluar con pruebas no invasivas."},"dentro":{"q":"<strong>HPCS confirmada (&gt;90 %).<\/strong> ¿Tiene contraindicación o intolerancia a BBNS?","i":"","o":[["No","carv"],["Sí","lbe"]]},"prob":{"q":"<strong>HPCS probable (~60 %).<\/strong> ¿Qué muestra la <strong>rigidez esplénica<\/strong> o la <strong>endoscopia<\/strong>?","i":"","o":[["RE &gt;40 kPa o várices","dentro"],["RE ≤40 kPa y sin várices","fuera"]]},"gris":{"q":"<strong>Zona gris<\/strong> (37–47 % de los pacientes). Agrega <strong>rigidez esplénica<\/strong> o <strong>endoscopia<\/strong>. ¿Resultado?","i":"","o":[["RE &gt;40 kPa o várices presentes","dentro"],["RE ≤40 kPa y sin várices","fuera"]]},"carv":{"end":1,"tone":"warn","text":"<strong>Carvedilol hasta 12.5 mg/día<\/strong> (25 mg/día solo si hay hipertensión arterial) + TESLA. Reduce la descompensación a la mitad y la mortalidad ~60 %. Mantener al menos hasta que la presión portal baje de la HPCS."},"lbe":{"end":1,"tone":"bad","text":"Si tiene <strong>várices de alto riesgo<\/strong>, <strong>ligadura endoscópica<\/strong> (la LBE se reserva para contraindicación o intolerancia a BBNS). Siempre TESLA."}}},{"title":"¿Este evento es descompensación?","src":"Recuadro 2 del artículo","start":"a","nodes":{"a":{"q":"Paciente con cirrosis compensada que presenta un evento nuevo. ¿Cuál?","i":"","o":[["Ascitis","asc"],["Alteración neurológica","eh"],["Sangrado digestivo","hd"],["Ictericia","ict"]]},"asc":{"q":"¿La ascitis es <strong>manifiesta<\/strong> o solo se ve en imagen?","i":"","o":[["Manifiesta (o hidrotórax con GASA &gt;1.1 g/dL)","si"],["Mínima, solo en US/TC (grado I)","dud"]]},"eh":{"q":"¿Qué grado de encefalopatía (West Haven)?","i":"","o":[["Grado ≥II (manifiesta)","si"],["Mínima o grado I","dud"]]},"hd":{"q":"¿Cuál es el origen del sangrado?","i":"","o":[["Várices","si"],["Sangrado oculto por gastroenteropatía hipertensiva portal","dud"]]},"ict":{"q":"¿La etiología de la cirrosis es colestásica?","i":"","o":[["No: ictericia aislada en cirrosis no colestásica","dud"],["Sí o hay otros datos","otro"]]},"si":{"end":1,"tone":"bad","text":"<strong>Es descompensación<\/strong> (paso a EHCAd): la mortalidad sube de forma marcada (30–60 % a 1 año). Considerar <strong>trasplante hepático<\/strong> y manejo de cirrosis descompensada (tema 7)."},"dud":{"end":1,"tone":"warn","text":"<strong>Datos insuficientes<\/strong> para considerarlo descompensación según el Recuadro 2. Vigilar de cerca y optimizar TESLA y BBNS si hay HPCS."},"otro":{"end":1,"tone":"warn","text":"Busca <strong>daño hepático sobreagregado<\/strong>, ACLF o CHC, que pueden precipitar la descompensación."}}}],"cards":[["Célula responsable de la fibrosis hepática","La célula estelar (de Ito): se activa por TGF-β y PDGF, se vuelve miofibroblasto y deposita colágeno I y III en el espacio de Disse."],["¿Por qué hay trombocitopenia en la cirrosis?","Por hiperesplenismo (secuestro en el bazo por hipertensión portal) y menos trombopoyetina hecha por el hígado."],["¿Qué es la EHCA?","Enfermedad hepática crónica avanzada: paciente con EHC que probablemente tiene cirrosis si se le hiciera biopsia; concepto de la era de pruebas no invasivas."],["Duración mediana de la EHCA compensada","~10 años, casi asintomática."],["GPVH normal","&lt;5 mmHg."],["Significado de GPVH ≥16 mmHg","Mayor riesgo de muerte (y de cirugía extrahepática mayor)."],["¿Qué proporción de EHCAc sin várices tiene HPCS?","Cerca de la mitad."],["Eventos con datos insuficientes para llamarlos descompensación","Ascitis grado I solo por imagen, encefalopatía mínima o grado I, sangrado oculto por gastroenteropatía portal, ictericia aislada no colestásica."],["Mortalidad con primera descompensación solo hemorrágica","10–16 % a 1 año; 20–30 % a 5 años."],["Mortalidad de la descompensación adicional","80 % sin trasplante; etapa de meses."],["Precipitantes de ACLF","Hepatitis alcohólica, infecciones, sangrado digestivo, DILI, sobreinfección o reactivación viral, reacciones autoinmunes."],["Factor primario de la hipertensión portal","Aumento de la resistencia intrahepática (estructural + dinámica)."],["¿Qué promueve las colaterales a ~10 mmHg?","Presión portal elevada + angiogénesis mediada por VEGF."],["Origen de la inflamación sistémica","Translocación bacteriana por ↓ barrera intestinal (HP + ↑ tono adrenérgico)."],["¿Funcionó el timolol para prevenir várices?","No: incluyó pacientes sin várices y 40 % sin HPCS."],["Respuesta hemodinámica en descompensados","↓ GPVH &gt;20 % del basal o a &lt;12 mmHg."],["Rigidez esplénica en la zona gris","&gt;40 kPa sugiere HPCS; ≤40 kPa ayuda a descartarla."],["Modelo no invasivo para MASLD con obesidad","ANTICIPATE-NASH: RH, IMC y plaquetas."],["Descompensación a 3 años por alcohol","Hasta 35.5 % (viral sin tratar ~15 %, MASLD ~12 %, etiología controlada 3–10 %)."],["Riesgo residual de descompensación tras AAD en VHC con HPCS","7.5 % a 3 años, concentrado en quien mantiene HPCS."],["Dosis máxima segura de paracetamol en cirrosis","2 g/día; es el analgésico preferido."],["GPVH de riesgo para cirugía extrahepática mayor","&gt;16 mmHg (sobre todo ≥20 mmHg)."],["Mecanismo de los BBNS","β1: ↓ gasto cardiaco; β2: vasoconstricción esplácnica → ↓ flujo portal-colateral."],["BBNS contra LBE (14 ECA, 1,400 pacientes)","Igual hemorragia; más ascitis (SHR 2.66) y peor supervivencia (SHR 1.76) con LBE."],["Dosis de carvedilol en EHCAc","Hasta 12.5 mg/día; 25 mg/día solo con hipertensión arterial."],["Estatinas en cirrosis: precaución","Child-Pugh C, por rabdomiólisis."]],"mcq":[{"q":"¿Qué valor de GPVH define la hipertensión portal clínicamente significativa?","o":["≥5 mmHg","≥10 mmHg","≥12 mmHg","≥16 mmHg","≥20 mmHg"],"a":1,"e":"La <strong>HPCS<\/strong> es un <strong>GPVH ≥10 mmHg<\/strong>: a partir de ahí se forman várices y puede ocurrir la descompensación. 12 mmHg es la meta en descompensados; ≥16 mmHg indica mayor riesgo de muerte."},{"q":"¿Cuál es la mortalidad anual aproximada de la EHCA compensada?","o":["~0.1 %","~10 %","~1.5 %","~30 %","~60 %"],"a":2,"e":"La EHCAc tiene mortalidad <strong>~1.5 % al año<\/strong>, parecida a la de personas sanas de la misma edad."},{"q":"¿Cuál de los siguientes NO es suficiente, según el artículo, para considerar descompensada la cirrosis?","o":["Ascitis manifiesta a la exploración","Hemorragia por várices esofágicas","Encefalopatía West Haven grado II","Ascitis mínima vista solo en ultrasonido","Hidrotórax con GASA &gt;1.1 g/dL"],"a":3,"e":"La ascitis <strong>grado I solo en imagen<\/strong> tiene datos <strong>insuficientes<\/strong>. Cuentan la ascitis manifiesta (o derrame pleural con GASA &gt;1.1 g/dL), la EH <strong>≥II<\/strong> y la hemorragia variceal."},{"q":"¿Qué proporción de pacientes con EHCAc sin várices tiene ya HPCS?","o":["Ninguno","~10 %","~25 %","Todos","~50 %"],"a":4,"e":"La HPCS puede estar presente en <strong>cerca de la mitad<\/strong> de los pacientes sin várices; con várices de cualquier tamaño, <strong>casi siempre<\/strong>."},{"q":"En el sinusoide hepático cirrótico, ¿qué cambio del óxido nítrico ocurre?","o":["Disminuye y contribuye a ↑ tono vascular hepático","Aumenta y causa vasodilatación intrahepática","No cambia","Aumenta solo en la circulación pulmonar","Disminuye en la circulación esplácnica"],"a":0,"e":"La <strong>disfunción endotelial sinusoidal<\/strong> reduce el <strong>NO<\/strong> y aumenta vasoconstrictores; en cambio, en la circulación <strong>esplácnica<\/strong> el NO está <strong>aumentado<\/strong>."},{"q":"¿Qué es la &quot;capilarización&quot; del sinusoide?","o":["Formación de nuevos capilares portales","Depósito de matriz extracelular con pérdida de fenestraciones endoteliales","Trombosis de capilares sinusoidales","Dilatación sinusoidal por congestión","Proliferación de colangiolos"],"a":1,"e":"Es el depósito de <strong>matriz extracelular<\/strong> sobre las células endoteliales sinusoidales, que <strong>pierden sus fenestraciones<\/strong>; empeora la función hepática."},{"q":"¿Qué estudio estableció el corte de 10 mmHg para la HPCS?","o":["PREDESCI","CANONIC","Ensayo de timolol de Groszmann","PREDICT","LIVERHOPE"],"a":2,"e":"El <strong>ensayo de timolol<\/strong> (NEJM 2005) en compensados sin várices: el timolol no previno várices, pero <strong>GPVH ≥10 mmHg<\/strong> basal predijo su aparición."},{"q":"Paciente compensado con HPCS que inicia BBNS. ¿Qué cambio en el GPVH a 1 año lo define como respondedor según PREDESCI?","o":["Reducción &gt;5 %","Reducción &gt;20 % o a &lt;12 mmHg","Reducción a &lt;5 mmHg","Reducción &gt;10 % o a &lt;10 mmHg","Cualquier reducción"],"a":3,"e":"En compensados: <strong>&gt;10 %<\/strong> del basal o <strong>&lt;10 mmHg<\/strong>. Las metas <strong>&gt;20 % o &lt;12 mmHg<\/strong> son de descompensados."},{"q":"Hombre de 60 años con cirrosis alcohólica, abstinente. ET: RH 27 kPa; plaquetas 160 × 10⁹/L. ¿Qué concluyes?","o":["HPCS descartada","Zona gris","HPCS confirmada","Requiere biopsia","Requiere RM"],"a":2,"e":"<strong>RH ≥25 kPa confirma HPCS<\/strong> sin importar las plaquetas (&gt;90 % de probabilidad)."},{"q":"¿En qué pacientes NO son plenamente válidos los criterios no invasivos de HPCS de Baveno VII?","o":["VHC","VHB","Alcohol","MASLD con IMC ≥30 kg/m²","MASLD con IMC 25 kg/m²"],"a":3,"e":"Se validaron en enfermedad viral, alcohol y <strong>MASLD sin obesidad (IMC &lt;30)<\/strong>. En obesidad se propuso <strong>ANTICIPATE-NASH<\/strong> (RH, IMC, plaquetas)."},{"q":"¿Qué umbral de rigidez hepática por ET predijo descompensación con precisión similar al GPVH y se redondeó a 20 kPa?","o":["10 kPa","15 kPa","25 kPa","40 kPa","21.1 kPa"],"a":4,"e":"<strong>21.1 kPa<\/strong> (sensibilidad 100 %, especificidad 41 %); se redondeó a <strong>20 kPa<\/strong> en Baveno VI y VII."},{"q":"¿Qué significa TESLA en el manejo de la cirrosis compensada?","o":["Tratar la etiología, estilo de vida seguro y evitar riesgos","Tratamiento endoscópico, estatinas, ligadura y albúmina","Trasplante, estatinas, ligadura, anticoagulación","Terlipresina, endoscopia, sonda, ligadura y antibióticos","Trombosis, estatinas, ligadura y anticoagulación"],"a":0,"e":"<strong>TESLA<\/strong>: <em>treating the aetiology, safe lifestyle and avoiding risks<\/em>."},{"q":"Paciente con cirrosis por VHC y HPCS que logra RVS con antivirales de acción directa. ¿Cuál es su riesgo residual de descompensación a 3 años?","o":["0 %","~7.5 %","~25 %","~50 %","Igual que sin tratar"],"a":1,"e":"<strong>7.5 % a 3 años<\/strong>, concentrado en quienes <strong>mantienen HPCS<\/strong> (hasta 70 % a 6 meses de la RVS, 43 % a 2 años)."},{"q":"Hombre de 52 años con cirrosis por MASLD y obesidad. ¿Qué intervención de estilo de vida bajó el GPVH ≥10 % en 42 % de los pacientes?","o":["Dieta cetogénica","Ayuno intermitente estricto","Dieta hipocalórica normoproteica con ejercicio aeróbico","Dieta hiperproteica sin ejercicio","Suplementos de vitamina E"],"a":2,"e":"Dieta <strong>hipocalórica normoproteica + ejercicio aeróbico<\/strong>: ↓ GPVH ≥10 % en <strong>42 %<\/strong>; las reducciones &gt;20 % ocurrieron sobre todo con <strong>&gt;10 % de pérdida de peso<\/strong>."},{"q":"¿Qué vacunas recomienda el artículo en EHCAc?","o":["Solo influenza","BCG y fiebre amarilla","Solo VHB","VHA, VHB, neumococo e influenza","Ninguna"],"a":3,"e":"Probar y vacunar contra <strong>VHA y VHB<\/strong>; además <strong>neumococo<\/strong>, <em>Haemophilus<\/em> e <strong>influenza<\/strong>."},{"q":"Paciente compensado con GPVH 18 mmHg que necesita colectomía electiva. ¿Qué implica?","o":["Riesgo igual a la población general","Contraindicación absoluta de cirugía","Requiere TIPS obligatorio","Solo importa el Child-Pugh","Mayor riesgo de descompensación y muerte; decidir caso por caso en equipo multidisciplinario"],"a":4,"e":"La <strong>cirugía extrahepática mayor<\/strong> con <strong>GPVH &gt;16 mmHg<\/strong> (sobre todo ≥20) aumenta el riesgo; se discute <strong>caso por caso<\/strong> en equipo multidisciplinario."},{"q":"¿Cómo reducen la presión portal los BBNS clásicos?","o":["Bajan la resistencia intrahepática por NO","Diuresis","Inhiben la angiotensina","β1 ↓ gasto cardiaco y β2 vasoconstricción esplácnica → ↓ flujo portal","Bloquean α1"],"a":3,"e":"<strong>β1<\/strong>: ↓ frecuencia y gasto cardiaco; <strong>β2<\/strong>: vasoconstricción esplácnica por tono α sin oposición → ↓ flujo portal-colateral."},{"q":"¿Qué componente de la descompensación explicó principalmente el beneficio de los BBNS en PREDESCI?","o":["Hemorragia variceal","Encefalopatía","Ictericia","Peritonitis bacteriana espontánea","Ascitis"],"a":4,"e":"Reducción de casi <strong>60 %<\/strong> en el riesgo de <strong>ascitis<\/strong> (SHR 0.42; P = 0.030)."},{"q":"¿Qué propiedad adicional explica que el carvedilol baje más la presión portal que el propranolol?","o":["Actividad anti-α1 y aumento del NO intrahepático","Bloqueo de calcio","Efecto diurético","Inhibición de la ECA","Agonismo β2"],"a":0,"e":"El carvedilol <strong>↓ resistencia intrahepática<\/strong> por su actividad <strong>anti-α1<\/strong> y por <strong>↑ liberación intrahepática de NO<\/strong>."},{"q":"Hombre de 58 años con cirrosis compensada, HPCS por elastografía y presión arterial normal. ¿Qué dosis de carvedilol buscas?","o":["3.125 mg/día","Hasta 12.5 mg/día","25 mg/día","50 mg/día","100 mg/día"],"a":1,"e":"<strong>Hasta 12.5 mg/día<\/strong> baja la presión portal y rara vez causa hipotensión; dosis mayores pueden causarla."},{"q":"En el metaanálisis de datos individuales de carvedilol (4 ECA, 352 pacientes), ¿qué efecto tuvo sobre la mortalidad?","o":["Ninguno","Aumentó la mortalidad","Redujo ~60 % (SHR 0.417)","Redujo 10 %","Solo redujo la hemorragia"],"a":2,"e":"Mortalidad <strong>SHR 0.417<\/strong> (IC 0.194–0.896); descompensación <strong>SHR 0.506<\/strong>; ascitis <strong>SHR 0.491<\/strong>."},{"q":"¿Hasta cuándo debe mantenerse el BBNS en un paciente con EHCAc y HPCS?","o":["3 meses","Hasta que desaparezcan las várices pequeñas","Hasta normalizar las transaminasas","Al menos hasta que el tratamiento etiológico baje la presión portal por debajo de la HPCS","Solo hasta la RVS"],"a":3,"e":"El artículo indica mantenerlo <strong>al menos hasta<\/strong> que el tratamiento etiológico logre una presión portal <strong>por debajo de la HPCS<\/strong>."},{"q":"¿Qué recomienda Baveno VII sobre las estatinas en cirrosis?","o":["Están contraindicadas","Darlas a todos para prevenir descompensación","Solo en descompensados","Solo con ligadura","Fomentarlas si hay indicación cardiovascular aprobada"],"a":4,"e":"Baveno VII anima a usar estatinas en cirrosis con <strong>indicación cardiovascular<\/strong>; ensayos en curso definirán su papel para prevenir descompensación."},{"q":"¿Qué observó el ECA de enoxaparina en cirrosis avanzada?","o":["Previno la TVP, redujo la descompensación y mejoró la supervivencia","Ningún beneficio","Aumentó la hemorragia variceal","Empeoró la función renal","Solo recanalizó trombos"],"a":0,"e":"ECA <strong>no cegado<\/strong>: previno TVP, ↓ descompensación adicional y mejoró la supervivencia."}],"tf":[["La fibrosis hepática nunca retrocede, aunque se quite la causa.",false,"Al eliminar la causa las células estelares se desactivan y la fibrosis puede retroceder en parte."],["La HPCS se define por un GPVH ≥10 mmHg.",true,"Es el umbral a partir del cual aparecen várices y descompensación."],["La hemorragia variceal es la primera descompensación más frecuente.",false,"Es la ascitis (25 % a 5 años); la hemorragia es 5 %."],["Las várices pequeñas siempre se acompañan de HPCS.",true,"Várices de cualquier tamaño indican HPCS casi siempre."],["La vasodilatación esplácnica es el factor primario de la hipertensión portal.",false,"El factor primario es la ↑ resistencia intrahepática; la vasodilatación es adaptativa y posterior."],["Los BBNS son igual de eficaces con o sin HPCS.",false,"Son mucho menos eficaces sin HPCS; por eso falló el ensayo de timolol."],["Agregar ligadura a los BBNS mejora los resultados en compensados.",false,"No los mejoró en el metaanálisis."],["Dosis de carvedilol mayores de 12.5 mg/día pueden causar hipotensión.",true,"Por eso se usa hasta 12.5 mg/día, salvo HTA en compensados."],["La cirrosis es siempre irreversible.",false,"Puede regresar si se controla la causa antes del punto de no retorno."],["Las estatinas deben usarse con precaución en Child-Pugh C.",true,"Por riesgo de rabdomiólisis."],["Los IBP disminuyen el riesgo de infección en cirrosis.",false,"Pueden aumentarlo."]]},{"id":"baveno","n":7,"title":"Hipertensión portal y cirrosis descompensada: Baveno VIII","short":"Baveno VIII","color":"#C1121F","src":"Baveno VIII Faculty (Berzigotti A, Mandorfer M, Pons M, Abraldes JG, et al.). Baveno VIII – Advancing Consensus in Portal Hypertension. J Hepatol. 2026 (journal pre-proof, publicado en línea el 7 de agosto de 2026). doi:10.1016/j.jhep.2026.07.030.","hook":"La hipertensión portal ya no se diagnostica con un catéter sino con un elastógrafo y una biometría hemática: si la rigidez y las plaquetas dicen que hay hipertensión portal clínicamente significativa, el carvedilol empieza antes de que el paciente se descompense.","group":"Hígado","ses":22,"date":"2026-11-02","nums":[["272","enunciados con consenso fuerte (≥80 % del panel), en 9 paneles"],["&lt;10 kPa","de rigidez hepática descarta cACLD (riesgo a 3 años ≤1 %)"],["≤15 kPa + ≥150","LSM y plaquetas (×10⁹/L) que descartan HPCS (VPN &gt;90 %)"],["≥75 %","probabilidad de HPCS por ANTICIPATE o NICER que la confirma"],["≤12 h","para la endoscopia en la hemorragia variceal aguda"],["72 h","ventana del TIPS preventivo (idealmente &lt;24 h)"]],"esencial":"<h3>Baveno VIII en 15 viñetas<\/h3><ul><li>Consenso de <strong>marzo de 2026<\/strong> en Baveno, Italia: <strong>9 paneles<\/strong>, <strong>272 enunciados<\/strong> con consenso fuerte (≥80 %), graduados con el nivel de evidencia de <strong>Oxford (NE 1–5)<\/strong> y fuerza de recomendación (<strong>fuerte o débil<\/strong>). Por primera vez incluye <strong>pediatría<\/strong>.<\/li><li><strong>cACLD<\/strong> (enfermedad hepática crónica avanzada compensada) se define con <strong>elastografía (LSM)<\/strong>: <strong>&lt;10 kPa descarta<\/strong>, <strong>10–15 kPa sugiere<\/strong>, <strong>&gt;15 kPa sugiere mucho<\/strong>. La LSM se hace <strong>siempre en ayuno<\/strong>.<\/li><li><strong>Regla de 5:<\/strong> 10–15–20–25 kPa = riesgo progresivamente mayor de descompensación y muerte, <strong>sin importar la etiología<\/strong>.<\/li><li><mark>LSM ≤15 kPa + plaquetas ≥150 × 10⁹/L descarta HPCS<\/mark> (VPN &gt;90 %).<\/li><li><strong>Confirman HPCS:<\/strong> ANTICIPATE (o ANTICIPATE-NASH) o NICER <strong>≥75 %<\/strong>; <strong>LSM ≥25 kPa<\/strong> (virus, alcohol, MASLD sin obesidad); <strong>rigidez esplénica (SSM, 100 Hz) &gt;55 kPa<\/strong>.<\/li><li>Zona gris: <strong>repetir pruebas no invasivas a los 12 meses<\/strong>.<\/li><li><strong>Carvedilol<\/strong> (o BBNS) en cACLD <strong>con HPCS<\/strong> para prevenir la descompensación; <strong>sin HPCS no se usa<\/strong>. Quien toma BBNS <strong>no necesita endoscopia de escrutinio<\/strong>.<\/li><li>Sin BBNS posible: endoscopia <strong>salvo LSM &lt;20 kPa + plaquetas ≥150<\/strong> o <strong>SSM &lt;40 kPa<\/strong>; repetir cada <strong>2 años<\/strong> (etiología activa) o <strong>3 años<\/strong> (etiología controlada).<\/li><li><strong>Primera descompensación:<\/strong> ascitis clínica, hemorragia variceal o <strong>EH manifiesta grado ≥II<\/strong>. La ascitis solo por imagen, la EH encubierta y el sangrado oculto <strong>no cuentan<\/strong>.<\/li><li><strong>Hemorragia variceal aguda (HVA):<\/strong> vasoactivo lo antes posible por <strong>2–5 días<\/strong>, <strong>cefalosporina de 3.ª generación<\/strong>, transfusión con meta de <strong>Hb 7–8 g/dL<\/strong>, <strong>endoscopia ≤12 h<\/strong>, ligadura con bandas, <strong>lactulosa<\/strong>, eritromicina <strong>250 mg IV<\/strong> 30–90 min antes.<\/li><li><strong>TIPS preventivo en ≤72 h<\/strong> (ideal &lt;24 h): <strong>Child-Pugh C 10–13<\/strong>, <strong>Child-Pugh B &gt;7 con sangrado activo<\/strong> o <strong>GPVH ≥20 mmHg<\/strong>.<\/li><li><strong>Descompensación adicional<\/strong> (FD): mayor mortalidad; todos deben evaluarse para <strong>trasplante<\/strong>. Ascitis recurrente o refractaria → <strong>TIPS<\/strong>.<\/li><li><strong>SHR-LRA:<\/strong> <strong>terlipresina + albúmina<\/strong>; terlipresina en <strong>infusión continua 2–3 mg/24 h<\/strong>; <strong>norepinefrina<\/strong> si no hay terlipresina.<\/li><li><strong>Recompensación:<\/strong> curar o controlar la causa + sin ascitis sin diuréticos + sin EH sin fármacos + sin resangrado, por <strong>&gt;6 meses<\/strong>, con Child-Pugh <strong>A5/A6<\/strong>.<\/li><li><strong>Enfermedad vascular hepática:<\/strong> LSM &lt;10 kPa con signos de hipertensión portal → piensa en <strong>PSVD/NCPF<\/strong>; se diagnostica con una <strong>puntuación<\/strong> (≥5 = definitiva). TVP reciente → <strong>anticoagular de inmediato, al menos 6 meses<\/strong>.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Los tres cortes que más se preguntan: <strong>10 kPa<\/strong> (cACLD), <strong>15 kPa + 150 plaquetas<\/strong> (descarta HPCS) y <strong>25 kPa<\/strong> (confirma HPCS). Y la diferencia clave: <strong>cACLD con HPCS → carvedilol; sin HPCS → no<\/strong>.<\/p><\/aside>","secs":[{"t":"Conceptos, etapas y el papel del GPVH","h":"<figure class=\"fig\" data-fig=\"baveno-etapas\"><svg viewBox=\"0 0 400 360\" role=\"img\" aria-label=\"Etapas de la enfermedad hepática crónica avanzada\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah26\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"10\" y=\"8\" width=\"180\" height=\"74\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"37.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">cACLD sin HPCS: LSM ≥10<\/tspan><tspan x=\"100\" dy=\"14.03\">kPa, sin descompensación<\/tspan><\/text><rect x=\"210\" y=\"8\" width=\"180\" height=\"74\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"31.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">cACLD con HPCS: LSM ≥25,<\/tspan><tspan x=\"300\" dy=\"13.42\">ANTICIPATE/NICER ≥75 %, SSM<\/tspan><tspan x=\"300\" dy=\"13.42\">≥55, várices, GPVH ≥10<\/tspan><\/text><path d=\"M190 45 L208 45\" class=\"fx-arr\" marker-end=\"url(#ah26)\"/><path d=\"M300 82 L300 104\" class=\"fx-arr\" marker-end=\"url(#ah26)\"/><rect x=\"210\" y=\"104\" width=\"180\" height=\"86\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"133.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Primera descompensación:<\/tspan><tspan x=\"300\" dy=\"13.42\">ascitis clínica, hemorragia<\/tspan><tspan x=\"300\" dy=\"13.42\">variceal o EH manifiesta<\/tspan><\/text><path d=\"M210 147 L192 147\" class=\"fx-arr\" marker-end=\"url(#ah26)\"/><rect x=\"10\" y=\"104\" width=\"180\" height=\"86\" rx=\"9\" style=\"fill:#C1121F;fill-opacity:0.13;stroke:#C1121F;stroke-width:1.5\"/><text x=\"100\" y=\"126.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Descompensación adicional:<\/tspan><tspan x=\"100\" dy=\"13.42\">ascitis recurrente, SHR-LRA<\/tspan><tspan x=\"100\" dy=\"13.42\">o PBE, EH recurrente,<\/tspan><tspan x=\"100\" dy=\"13.42\">resangrado, ictericia<\/tspan><\/text><path d=\"M300 190 L300 222\" class=\"fx-arr\" marker-end=\"url(#ah26)\"/><g><rect x=\"236.4\" y=\"197\" width=\"127.2\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"300\" y=\"206.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">terapia etiológica<\/tspan><\/text><\/g><rect x=\"170\" y=\"222\" width=\"220\" height=\"98\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"280\" y=\"250.87\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"280\" dy=\"0\">Recompensada: causa controlada, sin<\/tspan><tspan x=\"280\" dy=\"13.42\">ascitis ni EH sin fármacos, sin<\/tspan><tspan x=\"280\" dy=\"13.42\">resangrado (&gt;6 meses), Child-Pugh<\/tspan><tspan x=\"280\" dy=\"13.42\">A5/A6<\/tspan><\/text><rect x=\"10\" y=\"222\" width=\"146\" height=\"98\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"83\" y=\"257.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"83\" dy=\"0\">HPCS resuelta: GPVH<\/tspan><tspan x=\"83\" dy=\"13.42\">&lt;10 mmHg, LSM &lt;10, o<\/tspan><tspan x=\"83\" dy=\"13.42\">LSM &lt;15 + SSM &lt;25<\/tspan><\/text><path d=\"M170 271 L158 271\" class=\"fx-arr\" marker-end=\"url(#ah26)\"/><text x=\"200\" y=\"344\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-mut\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Las várices pueden persistir aunque se resuelva la HPCS<\/tspan><\/text><\/svg><figcaption>Figura 2 de Baveno VIII, simplificada: de la cACLD a la descompensación adicional, y el camino de vuelta (recompensación).<\/figcaption><\/figure><h5>¿Qué cuenta como primera descompensación?<\/h5><div class=\"tbl\"><table><thead><tr><th>Sí cuenta<\/th><th>No cuenta<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Ascitis clínicamente evidente<\/strong> (o hidrotórax hepático) por hipertensión portal<\/th><td>Ascitis <strong>mínima<\/strong> o solo por imagen (aunque puede asociarse a menor supervivencia)<\/td><\/tr><tr><th scope=\"row\"><strong>Hemorragia variceal<\/strong><\/th><td><strong>Sangrado oculto<\/strong> por gastroenteropatía hipertensiva portal<\/td><\/tr><tr><th scope=\"row\"><strong>EH manifiesta<\/strong> (West Haven <strong>grado ≥II<\/strong>)<\/th><td><strong>EH encubierta<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>EH grado I<\/strong>, la <strong>ascitis solo por ultrasonido<\/strong> y la <strong>anemia por gastropatía<\/strong> <strong>no<\/strong> definen descompensación. Solo cuentan ascitis clínica, hemorragia variceal y <strong>EH ≥II<\/strong>.<\/p><\/aside>"},{"t":"Fisiopatología de la descompensación","h":"<div data-fp=\"baveno\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Vasodilatación arterial periférica<\/span><\/div><p>En la cirrosis con hipertensión portal, el <strong>óxido nítrico<\/strong> dilata las arterias esplácnicas. El riñón \"cree\" que falta volumen y activa todos los sistemas que retienen sodio y agua. De ahí salen la ascitis, la hiponatremia y el síndrome hepatorrenal.<\/p><\/aside><figure class=\"fig\" data-fig=\"baveno-fp\"><svg viewBox=\"0 0 400 327.86\" role=\"img\" aria-label=\"Vasodilatación arterial y descompensación\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-baveno\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hipertensión portal clínicamente significativa<\/tspan><tspan x=\"200\" dy=\"14.03\">(GPVH ≥10 mmHg)<\/tspan><\/text><path d=\"M200 52.06 L200 74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-baveno)\"/><rect x=\"50\" y=\"74.06\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"
