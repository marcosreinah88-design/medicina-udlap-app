    '<p>Once temas destilados de los 12 artículos troncales: lo esencial, las cifras que se preguntan, criterios y escalas, perlas y algoritmos. Al final de cada tema hay preguntas tipo examen, y arriba un simulacro de 20 reactivos como el parcial.</p>' +
    (next ? '<div class="next"><span class="eyebrow">Próxima clase · S' + next.ses + ' · ' + fmtDate(next.date) + '</span><a href="#' + next.id + '">' + next.short + ' →</a></div>' : '') +
    '<div class="prog"><span>' + nDone + ' de ' + T.length + ' temas repasados</span><div class="prog-bar"><i style="width:' + (100 * nDone / T.length) + '%"></i></div>' +
    (S.best ? '<span>Mejor simulacro: <b>' + S.best + '%</b></span>' : '') + '</div>');
  app.appendChild(hero);
  var groups = [];
  T.forEach(function (t) { if (groups.indexOf(t.group) < 0) groups.push(t.group); });
  groups.forEach(function (g) {
    var sec = h('section', { class: 'group' }, '<h2>' + g + '</h2>');
    var list = h('div', { class: 'tlist' });
    T.filter(function (t) { return t.group === g; }).forEach(function (t) {
      list.appendChild(h('a', { class: 'tcard', href: '#' + t.id, style: '--tc:' + t.color },
        '<span class="tnum">' + t.n + '</span><h3>' + t.short + '</h3>' +
        '<span class="tmeta">S' + t.ses + ' · ' + fmtDate(t.date) + (S.done[t.id] ? ' <span class="done-pill">✓ repasado</span>' : '') + '</span>' +
        '<p>' + strip(t.hook) + '</p>'));
    });
    sec.appendChild(list); app.appendChild(sec);
  });
  app.appendChild(h('section', { class: 'quick' },
    '<a href="#simulacro"><b>Simulacro de 20</b><span>Mezcla de temas, con explicación de cada respuesta.</span></a>' +
    '<a href="#tarjetas"><b>Tarjetas</b><span>Pregunta al frente, respuesta atrás; las que fallas vuelven.</span></a>' +
    '<a href="#cifras"><b>Cifras y cortes</b><span>Los 66 números clave de todo el bloque en una tabla.</span></a>'));
}

/* ---------- tema ---------- */
function topic(t) {
  var i = T.indexOf(t), prev = T[i - 1], next = T[i + 1];
  var w = h('article', { class: 'tp', style: '--tc:' + t.color });
  w.appendChild(h('header', { class: 'thead' },
    '<span class="eyebrow">Tema ' + t.n + ' · ' + t.group + ' · Sesión ' + t.ses + ', ' + fmtDate(t.date) + '</span>' +
    '<h1>' + t.title + '</h1><p class="hook">' + t.hook + '</p><p class="src">Fuente: ' + t.src + '</p>'));
  var nav = [['esencial', 'Lo esencial'], ['cifras', 'Cifras'], ['secciones', 'Criterios y tablas'], ['perlas', 'Perlas']];
  if (t.comps.length) nav.push(['comparar', 'Comparar']);
  if (t.algos.length) nav.push(['algoritmos', 'Algoritmos']);
  nav.push(['practica', 'Practica']);
  w.appendChild(h('nav', { class: 'tnav', 'aria-label': 'En este tema' }, nav.map(function (n) { return '<a href="#' + t.id + '" data-to="' + n[0] + '">' + n[1] + '</a>'; }).join('')));

  w.appendChild(block('esencial', 'Lo esencial', '', '<div class="essential prose">' + t.esencial + '</div>'));
  w.appendChild(block('cifras', 'Cifras que se preguntan', '', '<div class="nums">' + t.nums.map(function (n) { return '<div class="num"><b>' + n[0] + '</b><span>' + n[1] + '</span></div>'; }).join('') + '</div>'));

  var secB = block('secciones', 'Criterios, tablas y trampas', t.secs.length + ' secciones', '');
  var tools = h('div', { class: 'tools' }, '<button class="btn sm" data-a="open">Abrir todas</button><button class="btn sm" data-a="close">Cerrar todas</button>');
  secB.appendChild(tools);
  t.secs.forEach(function (s, k) {
    var d = h('details', { class: 'sec' }, '<summary>' + s.t + '</summary><div class="prose">' + s.h + '</div>');
    if (k === 0) d.open = true;
    secB.appendChild(d);
  });
  tools.addEventListener('click', function (e) {
    var a = e.target.getAttribute('data-a'); if (!a) return;
    secB.querySelectorAll('details').forEach(function (d) { d.open = a === 'open'; });
  });
  w.appendChild(secB);

  w.appendChild(block('perlas', 'Perlas para el examen', t.pearls.length, '<ol class="pearls">' + t.pearls.map(function (p) { return '<li><span>' + p + '</span></li>'; }).join('') + '</ol>'));

  if (t.comps.length) {
    w.appendChild(block('comparar', 'Comparar', '', t.comps.map(function (c) {
      return '<h3 style="font-size:18px;margin:14px 0 4px">' + c.title + '</h3><div class="tbl"><table><thead><tr><th></th>' + c.cols.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' +
        c.rows.map(function (r) { return '<tr><th scope="row">' + r[0] + '</th>' + r.slice(1).map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>' + (c.key ? '<p class="comp-key"><b>La diferencia que decide:</b> ' + c.key + '</p>' : '');
    }).join('')));
  }
  if (t.algos.length) {
    var ab = block('algoritmos', 'Algoritmos', 'elige y avanza', '');
    t.algos.forEach(function (a) { ab.appendChild(algo(a)); });
    w.appendChild(ab);
  }
  var pb = block('practica', 'Practica', '', '');
  pb.appendChild(practice(t));
  w.appendChild(pb);

  var md = h('label', { class: 'mark-done' }, '<input type="checkbox" id="done-' + t.id + '"' + (S.done[t.id] ? ' checked' : '') + '> Ya repasé este tema');
  md.querySelector('input').addEventListener('change', function (e) { S.done[t.id] = e.target.checked; save(); });
  w.appendChild(md);
  w.appendChild(h('nav', { class: 'pager', 'aria-label': 'Otros temas' },
    (prev ? '<a href="#' + prev.id + '"><small>← Tema ' + prev.n + '</small>' + prev.short + '</a>' : '<a href="#inicio"><small>←</small>Todos los temas</a>') +
    (next ? '<a href="#' + next.id + '"><small>Tema ' + next.n + ' →</small>' + next.short + '</a>' : '<a href="#simulacro"><small>→</small>Simulacro</a>')));
  w.querySelector('.tnav').addEventListener('click', function (e) {
    var to = e.target.getAttribute('data-to'); if (!to) return;
    e.preventDefault();
    var el = document.getElementById('b-' + to); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  app.appendChild(w);
}
function block(id, title, small, html) {
  return h('section', { class: 'block', id: 'b-' + id }, '<h2>' + title + (small !== '' ? ' <small>' + small + '</small>' : '') + '</h2>' + html);
}

/* algoritmo interactivo */
function algo(a) {
  var box = h('div', { class: 'algo' }), path = [];
  function draw(k) {
    var n = a.nodes[k], html = '<h3>' + a.title + '</h3><p class="src">' + a.src + '</p>';
    if (path.length) html += '<div class="algo-path">' + path.map(function (p) { return '<span>' + strip(p) + '</span>'; }).join('') + '</div>';
    if (n.end) html += '<div class="end tone-' + n.tone + '">' + n.text + '</div><button class="btn sm" data-r="1">Empezar de nuevo</button>';
    else html += '<p class="algo-q">' + n.q + '</p>' + (n.i ? '<p class="algo-i">' + n.i + '</p>' : '') + '<div class="algo-o">' + n.o.map(function (o, j) { return '<button class="btn" data-j="' + j + '">' + o[0] + '</button>'; }).join('') + '</div>';
    box.innerHTML = html;
    box.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.getAttribute('data-r')) { path = []; draw(a.start); return; }
      var o = n.o[+b.getAttribute('data-j')]; path.push(o[0]); draw(o[1]);
    };
  }
  draw(a.start);
  return box;
}

/* práctica del tema: MCQ y V/F */
function practice(t) {
  var wrap = h('div'), mode = 'mcq';
  var bar = h('div', { class: 'tools' }, '<button class="btn sm primary" data-m="mcq">Opción múltiple (' + t.mcq.length + ')</button><button class="btn sm" data-m="tf">Verdadero o falso (' + t.tf.length + ')</button><button class="btn sm" data-m="cards">Tarjetas (' + t.cards.length + ')</button>');
  var body = h('div');
  bar.addEventListener('click', function (e) {
    var m = e.target.getAttribute('data-m'); if (!m) return;
    bar.querySelectorAll('button').forEach(function (b) { b.classList.toggle('primary', b === e.target); });
    mode = m; run();
  });
  function run() {
    body.innerHTML = '';
    if (mode === 'mcq') quiz(body, shuffle(t.mcq).map(function (q) { q.t = t; return q; }), null);
    else if (mode === 'tf') tfQuiz(body, shuffle(t.tf));
    else cardDeck(body, t.cards.map(function (c) { return { f: c[0], b: c[1], t: t }; }));
  }
  wrap.appendChild(bar); wrap.appendChild(body); run();
  return wrap;
}

/* motor de opción múltiple (tema o simulacro) */
function quiz(root, qs, onEnd) {
  var i = 0, ok = 0, wrong = [];
  function show() {
    if (i >= qs.length) return finish();
    var q = qs[i], order = shuffle(q.o.map(function (_, j) { return j; }));
    var c = h('div', { class: 'q' },
      '<div class="q-meta"><span>Pregunta ' + (i + 1) + ' de ' + qs.length + '</span><span>' + (q.t ? 'Tema ' + q.t.n + ' · ' + q.t.short : '') + ' · ' + ok + ' correctas</span></div>' +
      '<p class="q-stem">' + q.q + '</p><div class="opts">' + order.map(function (j, k) { return '<button class="opt" data-j="' + j + '"><span class="k">' + L[k] + '</span><span>' + q.o[j] + '</span></button>'; }).join('') + '</div>');
    root.innerHTML = ''; root.appendChild(c);
    c.querySelector('.opts').addEventListener('click', function (e) {
      var b = e.target.closest('.opt'); if (!b || b.disabled) return;
      var j = +b.getAttribute('data-j'), right = j === q.a;
      if (right) ok++; else wrong.push({ q: q, pick: j });
      c.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; if (+x.getAttribute('data-j') === q.a) x.classList.add('right'); });
      if (!right) b.classList.add('wrong');
      c.appendChild(h('div', { class: 'expl' }, '<b class="v" style="color:var(' + (right ? '--ok' : '--bad') + ')">' + (right ? 'Correcto' : 'Incorrecto') + '</b>' + q.e));
      var f = h('div', { class: 'q-foot' }, '<button class="btn primary">' + (i + 1 < qs.length ? 'Siguiente' : 'Ver resultado') + '</button>');
      f.querySelector('button').addEventListener('click', function () { i++; show(); });
      c.appendChild(f); f.querySelector('button').focus();
    });
  }
  function finish() {
    var pct = Math.round(100 * ok / qs.length);
    var s = h('div', { class: 'score' }, '<span class="eyebrow">Resultado</span><span class="big">' + pct + '%</span><span>' + ok + ' de ' + qs.length + ' correctas' + (qs.length === 20 ? ' · en el parcial serían ' + ok + '/20' : '') + '</span><div class="row" style="justify-content:center"><button class="btn primary" data-x="again">Otra ronda</button></div>');
    root.innerHTML = ''; root.appendChild(s);
    if (wrong.length) {
      var rv = h('div', { class: 'review' }, '<h3 style="font-size:19px">Repasa lo que fallaste</h3>');
      wrong.forEach(function (w) {
        rv.appendChild(h('div', { class: 'item' }, '<p><b>' + (w.q.t ? 'Tema ' + w.q.t.n + ': ' : '') + '</b>' + w.q.q + '</p><p>Respondiste: <s>' + w.q.o[w.pick] + '</s></p><p>Correcta: <b>' + w.q.o[w.q.a] + '</b></p><p style="color:var(--mut)">' + w.q.e + '</p>'));
      });
      root.appendChild(rv);
    }
    if (onEnd) onEnd(pct);
    s.querySelector('[data-x="again"]').addEventListener('click', function () { if (onEnd) route(); else { i = 0; ok = 0; wrong = []; qs = shuffle(qs); show(); } });
  }
  show();
}

function tfQuiz(root, items) {
  var i = 0, ok = 0;
  function show() {
    if (i >= items.length) {
      root.innerHTML = '<div class="score"><span class="eyebrow">Resultado</span><span class="big">' + ok + '/' + items.length + '</span><div class="row" style="justify-content:center"><button class="btn primary">Otra vez</button></div></div>';
      root.querySelector('button').onclick = function () { i = 0; ok = 0; items = shuffle(items); show(); };
      return;
    }
    var it = items[i], c = h('div', { class: 'q' }, '<div class="q-meta"><span>' + (i + 1) + ' de ' + items.length + '</span><span>' + ok + ' correctas</span></div><p class="q-stem">' + it[0] + '</p><div class="tf-row"><button class="btn" data-v="1">Verdadero</button><button class="btn" data-v="0">Falso</button></div>');
    root.innerHTML = ''; root.appendChild(c);
    c.querySelector('.tf-row').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || c.dataset.done) return; c.dataset.done = 1;
      var right = (b.getAttribute('data-v') === '1') === it[1]; if (right) ok++;
      c.appendChild(h('div', { class: 'expl' }, '<b class="v" style="color:var(' + (right ? '--ok' : '--bad') + ')">' + (right ? 'Correcto' : 'Incorrecto') + ': es ' + (it[1] ? 'verdadero' : 'falso') + '</b>' + it[2]));
      var f = h('div', { class: 'q-foot' }, '<button class="btn primary">Siguiente</button>');
      f.querySelector('button').onclick = function () { i++; show(); };
      c.appendChild(f); f.querySelector('button').focus();
    });
  }
  show();
}

/* tarjetas: las que no sabes regresan al final del mazo */
function cardDeck(root, cards) {
  var deck = shuffle(cards), seen = 0, total = cards.length;
  function show() {
    if (!deck.length) {
      root.innerHTML = '<div class="score"><span class="eyebrow">Mazo terminado</span><span class="big">' + total + '</span><span>tarjetas dominadas en ' + seen + ' vueltas</span><div class="row" style="justify-content:center"><button class="btn primary">Barajar de nuevo</button></div></div>';
      root.querySelector('button').onclick = function () { deck = shuffle(cards); seen = 0; show(); };
      return;
    }
    var c = deck[0];
    root.innerHTML = '';
    var meta = h('div', { class: 'q-meta' }, '<span>Quedan ' + deck.length + ' de ' + total + '</span><span>' + (c.t ? 'Tema ' + c.t.n + ' · ' + c.t.short : '') + '</span>');
    var fc = h('button', { class: 'fc', 'aria-label': 'Voltear tarjeta' }, '<div class="fc-in"><div class="fc-face"><span class="eyebrow">Pregunta</span><div class="txt">' + c.f + '</div></div><div class="fc-face back"><span class="eyebrow">Respuesta</span><div class="txt">' + c.b + '</div></div></div>');
    var wrap = h('div', { class: 'flash' }); wrap.appendChild(fc);
    var hint = h('p', { class: 'fc-hint' }, 'Toca la tarjeta para voltearla');
    var row = h('div', { class: 'tf-row' }, '<button class="btn" data-k="0">Repasar otra vez</button><button class="btn primary" data-k="1">Me la sé</button>');
    row.hidden = true;
    fc.addEventListener('click', function () { fc.classList.toggle('flip'); row.hidden = false; hint.hidden = true; });
    row.addEventListener('click', function (e) {
      var k = e.target.getAttribute('data-k'); if (k == null) return;
      seen++; var x = deck.shift(); if (k === '0') deck.push(x); show();
    });
    root.appendChild(meta); root.appendChild(wrap); root.appendChild(hint); root.appendChild(row);
  }
  show();
}

/* ---------- selección de temas (simulacro y tarjetas) ---------- */
function picker(sel) {
  var box = h('div', { class: 'chips', role: 'group', 'aria-label': 'Temas' });
  T.forEach(function (t) {
    var b = h('button', { class: 'chip', style: '--tc:' + t.color, 'aria-pressed': sel[t.id] ? 'true' : 'false' }, '<i></i>' + t.n + '. ' + t.short);
    b.onclick = function () { sel[t.id] = !sel[t.id]; b.setAttribute('aria-pressed', sel[t.id] ? 'true' : 'false'); };
    box.appendChild(b);
  });
  return box;
}

function sim() {
  var sel = {}; T.forEach(function (t) { sel[t.id] = true; });
  var w = h('section');
  w.appendChild(h('div', { class: 'hero' }, '<span class="eyebrow">Formato del parcial</span><h1>Simulacro</h1><p>Preguntas de opción múltiple repartidas entre los temas que elijas. Cada respuesta trae su explicación con el dato del artículo; al final ves solo lo que fallaste.</p>'));
  var st = h('div', { class: 'setup' }, '<label>Temas</label>');
  st.appendChild(picker(sel));
  var row = h('div', { class: 'row' }, '<label for="simn">Preguntas</label><select id="simn"><option>10</option><option selected>20</option><option>40</option><option>60</option></select><button class="btn primary" id="simgo">Empezar</button>');
  st.appendChild(row); w.appendChild(st);
  var area = h('div', { style: 'margin-top:16px' }); w.appendChild(area);
  app.appendChild(w);
  row.querySelector('#simgo').onclick = function () {
    var ids = T.filter(function (t) { return sel[t.id]; }); if (!ids.length) { area.innerHTML = '<p>Elige al menos un tema.</p>'; return; }
    var n = +row.querySelector('#simn').value, pools = ids.map(function (t) { return shuffle(t.mcq).map(function (q) { q.t = t; return q; }); }), qs = [];
    for (var k = 0; qs.length < n && k < 200; k++) { var p = pools[k % pools.length]; if (p.length) qs.push(p.shift()); }
    st.hidden = true;
    quiz(area, shuffle(qs), function (pct) { if (n >= 20 && (!S.best || pct > S.best)) { S.best = pct; save(); } });
  };
}

function flash() {
  var sel = {}; T.forEach(function (t) { sel[t.id] = true; });
  var w = h('section');
  w.appendChild(h('div', { class: 'hero' }, '<span class="eyebrow">Repaso activo</span><h1>Tarjetas</h1><p>Intenta responder antes de voltear. Lo que marques como “repasar otra vez” vuelve al final del mazo hasta que te lo sepas.</p>'));
  var st = h('div', { class: 'setup' }, '<label>Temas</label>');
  st.appendChild(picker(sel));
  var row = h('div', { class: 'row' }, '<button class="btn primary" id="fcgo">Barajar</button>');
  st.appendChild(row); w.appendChild(st);
  var area = h('div', { style: 'margin-top:16px' }); w.appendChild(area);
  app.appendChild(w);
  row.querySelector('#fcgo').onclick = function () {
    var cards = [];
    T.forEach(function (t) { if (sel[t.id]) t.cards.forEach(function (c) { cards.push({ f: c[0], b: c[1], t: t }); }); });
    if (!cards.length) { area.innerHTML = '<p>Elige al menos un tema.</p>'; return; }
    cardDeck(area, cards);
  };
}

function cifras() {
  var w = h('section');
  w.appendChild(h('div', { class: 'hero' }, '<span class="eyebrow">Para la última noche</span><h1>Cifras y cortes</h1><p>Los números clave de cada tema en una sola tabla. Escribe para filtrar (por ejemplo, “MELD”, “bilirrubina” o “%”).</p>'));
  var inp = h('input', { class: 'search', id: 'cifq', type: 'search', placeholder: 'Filtrar cifras…', 'aria-label': 'Filtrar cifras' });
  w.appendChild(inp);
  var rows = [];
  T.forEach(function (t) { t.nums.forEach(function (n) { rows.push({ t: t, v: n[0], d: n[1], s: (strip(n[0]) + ' ' + strip(n[1]) + ' ' + t.short).toLowerCase() }); }); });
  var tb = h('div', { class: 'tbl cif' });
  function draw() {
    var q = inp.value.trim().toLowerCase();
    var r = rows.filter(function (x) { return !q || x.s.indexOf(q) >= 0; });
    tb.innerHTML = '<table><thead><tr><th>Cifra</th><th>Qué significa</th><th>Tema</th></tr></thead><tbody>' +
      (r.length ? r.map(function (x) { return '<tr><td>' + x.v + '</td><td>' + x.d + '</td><td><a href="#' + x.t.id + '">' + x.t.short + '</a></td></tr>'; }).join('') : '<tr><td colspan="3">Nada coincide con “' + inp.value.replace(/</g, '&lt;') + '”.</td></tr>') + '</tbody></table>';
  }
  inp.addEventListener('input', draw); draw();
  w.appendChild(tb); app.appendChild(w);
}

route();
})();
</script>
