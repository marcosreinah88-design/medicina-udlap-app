uración de creatinina 40 mL/min, que planea embarazo. ¿Qué fármaco es especialmente problemático?","o":["Velpatasvir","Ribavirina","Glecaprevir","Pibrentasvir","Ledipasvir"],"a":1,"e":"<strong>Ribavirina<\/strong>: anemia hemolítica (más con enfermedad renal), evitar con <strong>depuración &lt;50 mL/min<\/strong> y es <strong>teratogénica<\/strong>."},{"q":"Receptor VHC negativo que recibe un hígado de donador virémico y se vuelve ARN +. ¿Qué se hace?","o":["Retrasplante","AAD por al menos 12 semanas, con RVS de hasta 100 %","PEG-IFN 48 semanas","Nada, la infección se elimina sola","Ribavirina sola"],"a":1,"e":"Se dan <strong>AAD al menos 12 semanas<\/strong> (usualmente dentro de 3 meses), con <strong>RVS de hasta 100 %<\/strong>."},{"q":"Paciente con hepatitis B aguda e infección simultánea por VHD. ¿Qué evolución es la más probable?","o":["Cronicidad en 90 %","Enfermedad leve autolimitada con resolución de ambas infecciones","Cirrosis en 1 año","Falla hepática en todos","Cronicidad solo del VHD"],"a":1,"e":"La <strong>coinfección<\/strong> suele dar enfermedad <strong>leve y autolimitada<\/strong> (o, menos, aguda grave) con <strong>resolución espontánea de ambas<\/strong>."},{"q":"¿Cuál es el mecanismo del lonafarnib en la hepatitis D?","o":["Inhibe la entrada por NTCP","Inhibe la prenilación","Inhibe la secreción de viriones","Inhibe la NS5A","Bloquea PD-1"],"a":1,"e":"<strong>Lonafarnib<\/strong> inhibe la <strong>prenilación<\/strong>; bulevirtida bloquea la entrada (NTCP) y REP 2139 la secreción."},{"q":"Receptor de trasplante renal con ALT 180 U/L persistente por 8 meses. ARN-VHE positivo, genotipo 3. ¿Primer paso terapéutico?","o":["PEG-IFN de inmediato","Reducir la inmunosupresión y, si no basta, ribavirina por 3 meses","Sofosbuvir/velpatasvir","Tenofovir","Trasplante hepático"],"a":1,"e":"En VHE crónico de inmunosuprimidos: <strong>reducir inmunosupresión<\/strong> + <strong>ribavirina 3 meses<\/strong>, y confirmar eliminación. PEG-IFN aumenta el riesgo de <strong>rechazo<\/strong>."},{"q":"¿Qué eficacia reportó la vacuna recombinante contra VHE (China) a los 4.5 años?","o":["100 %","86.8 %","56 %","25 %","No se ha estudiado"],"a":1,"e":"En 112 604 adultos: <strong>100 %<\/strong> al año; otro ensayo, <strong>86.8 % a los 4.5 años<\/strong>. Solo está registrada en <strong>China (2011)<\/strong>."},{"q":"¿Cuál de los virus de las hepatitis es de ADN?","o":["VHA","VHB","VHC","VHD","VHE"],"a":1,"e":"El <strong>VHB<\/strong> es <strong>ADN de doble cadena<\/strong> (Hepadnaviridae); los demás son ARN."}],"tf":[["El VHB puede causar carcinoma hepatocelular sin cirrosis.",true,"Su ADN se integra al genoma del hepatocito y la proteína HBx es oncogénica."],["La hepatitis A puede volverse crónica.",false,"No se cronifica; puede recaer (10–15 %) o dar colestasis prolongada."],["Para diagnosticar hepatitis A se necesita biopsia hepática.",false,"No se requieren biopsia ni imagen."],["La presentación más común de la hepatitis B aguda es la ictérica.",false,"La más común es la subclínica."],["Una persona vacunada contra VHB tiene anti-HBc positivo.",false,"Solo tiene anti-HBs."],["La lamivudina es de primera línea para el VHB.",false,"La primera línea es entecavir, TDF o TAF por su alta barrera genética."],["El genotipo 1 es el genotipo de VHC más común en el mundo.",true,"Representa cerca de la mitad de las infecciones."],["La RVS se mide 12 semanas después de terminar el tratamiento.",true,"Es la ausencia de virus en sangre a las 12 semanas."],["La ribavirina es teratogénica.",true,"Además causa anemia hemolítica."],["La sobreinfección por VHD en un portador crónico de VHB suele tener un curso prolongado.",true,"A diferencia de la coinfección, que suele resolverse."],["Los genotipos 1 y 2 del VHE infectan a animales.",false,"Solo a humanos; los zoonóticos son 3 y 4."]]},{"id":"hai","n":3,"title":"Hepatitis autoinmune","short":"Hepatitis autoinmune","color":"#6F4BC8","src":"Muratori L, Lohse AW, Lenzi M. Diagnosis and management of autoimmune hepatitis. BMJ. 2023;380:e070201.","hook":"Una hepatitis que el propio sistema inmune enciende y no apaga: autoanticuerpos, IgG alta y hepatitis de interfase. Responde casi siempre a esteroides, pero sin tratamiento lleva a falla hepática y muerte en cinco años.","group":"Hígado","ses":19,"date":"2026-10-21","nums":[["17.44","por 100 000: prevalencia mundial (incidencia anual 1.37 por 100 000)"],["3 de 4","pacientes son mujeres"],["≥6 / ≥7","puntos del score simplificado: HAI probable / definitiva"],["0.5 mg/kg","dosis inicial de prednisolona (igual de eficaz que 1 mg/kg, con menos efectos adversos)"],["&gt;50 %","descenso de ALT en 4 semanas: si no se logra, es falta de respuesta (IAIHG)"],["10–20 %","de los pacientes logra suspender toda la inmunosupresión sin recaer"]],"esencial":"<ul><li><strong>Qué es:<\/strong> enfermedad hepática <strong>inflamatoria, inmunomediada, de causa desconocida<\/strong>: autoanticuerpos circulantes, <strong>IgG elevada<\/strong> e histología característica (<strong>hepatitis de interfase<\/strong>).<\/li><li><strong>A quién:<\/strong> cualquier edad, sexo y raza; <strong>3 de cada 4 son mujeres<\/strong>; picos en la <strong>2.ª<\/strong> y <strong>5.ª–6.ª décadas<\/strong>.<\/li><li><strong>Presentación:<\/strong> <mark>la aguda es hoy la más frecuente<\/mark> (transaminasas <strong>≥5–10× LSN<\/strong>, a veces ictericia e INR prolongado); también insidiosa o asintomática.<\/li><li><strong>Diagnóstico:<\/strong> excluye otras causas (virus, Wilson, fármacos) + <strong>IgG<\/strong> + <strong>autoanticuerpos<\/strong> (ANA, SMA, anti-LKM1, anti-LC1, anti-SLA/LP) + <strong>biopsia hepática, que es obligatoria<\/strong>.<\/li><li><strong>Score simplificado del IAIHG (4 variables):<\/strong> autoanticuerpos (máx. 2), IgG (máx. 2), histología (máx. 2), ausencia de hepatitis viral (2). <mark>≥6 = probable; ≥7 = definitiva.<\/mark><\/li><li><strong>Histología típica:<\/strong> 2 de 3: <strong>hepatitis de interfase<\/strong>, <strong>emperipolesis<\/strong>, <strong>rosetas<\/strong> hepatocelulares.<\/li><li><strong>Anti-SLA/LP:<\/strong> muy específico (<strong>0.99<\/strong>) pero poco sensible (<strong>0.19<\/strong>); positivo en <strong>15–20 %<\/strong>; más recaídas.<\/li><li><strong>Inducción:<\/strong> <mark>prednisolona 0.5 mg/kg/día<\/mark> (1 mg/kg o 100 mg IV solo en la forma grave) y <strong>azatioprina<\/strong> a las <strong>2 semanas<\/strong>, iniciando con <strong>50 mg/día<\/strong> y subiendo a <strong>1–2 mg/kg<\/strong>.<\/li><li><strong>Meta:<\/strong> <strong>respuesta bioquímica completa = ALT e IgG normales<\/strong> (habitualmente a los <strong>6 meses<\/strong>).<\/li><li><strong>Mantenimiento:<\/strong> <strong>azatioprina 1–2 mg/kg/día<\/strong>, sola o con esteroide a dosis baja; casi siempre <strong>de por vida<\/strong>.<\/li><li><strong>Segunda línea:<\/strong> intolerancia a AZA → <strong>6-mercaptopurina<\/strong> → <strong>micofenolato de mofetilo 2 g/día<\/strong>.<\/li><li><strong>Suspender:<\/strong> solo <strong>10–20 %<\/strong> lo logra; candidato si lleva <strong>&gt;2 años<\/strong> en respuesta completa con monoterapia, ALT en rango bajo normal e <strong>IgG &lt;12 g/L<\/strong>.<\/li><li><strong>Embarazo:<\/strong> no suspender la azatioprina; <mark>el micofenolato es teratógeno<\/mark>.<\/li><li><strong>Pronóstico:<\/strong> sin tratamiento, falla hepática y muerte en <strong>5 años<\/strong> en la mayoría; tratada, sobrevida excelente.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>falta de respuesta a esteroides<\/strong> casi siempre significa <strong>diagnóstico equivocado o mala adherencia<\/strong>: la respuesta a esteroides en HAI es prácticamente universal.<\/p><\/aside>","secs":[{"t":"Definición y epidemiología","h":"<h5>Cifras (metaanálisis mundial)<\/h5><div class=\"tbl\"><table><thead><tr><th><\/th><th>Incidencia anual (por 100 000)<\/th><th>Prevalencia (por 100 000)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Mundial<\/strong><\/th><td><strong>1.37<\/strong><\/td><td><strong>17.44<\/strong><\/td><\/tr><tr><th scope=\"row\">Asia<\/th><td>1.31<\/td><td>12.99<\/td><\/tr><tr><th scope=\"row\">Europa<\/th><td>1.37<\/td><td>19.44<\/td><\/tr><tr><th scope=\"row\">América<\/th><td>1.00<\/td><td>22.80<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Hepatitis autoinmune = mujer joven&quot; es un mito histórico. <strong>No la pases por alto en adultos mayores, hombres ni en pacientes con otras enfermedades<\/strong>: en ellos el diagnóstico suele retrasarse.<\/p><\/aside>"},{"t":"Fisiopatología (patogenia)","h":"<figure class=\"fig\" data-fig=\"hai-pato\"><svg viewBox=\"0 0 400 330\" role=\"img\" aria-label=\"Mecanismos de la hepatitis autoinmune\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah11\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"6\" y=\"6\" width=\"124\" height=\"96\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"68\" y=\"40.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Genética:<\/tspan><tspan x=\"68\" dy=\"13.42\">HLA-DR3/DR4,<\/tspan><tspan x=\"68\" dy=\"13.42\">SH2B3, epigenética<\/tspan><\/text><rect x=\"138\" y=\"6\" width=\"124\" height=\"96\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"33.870000000000005\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Ambiente: virus,<\/tspan><tspan x=\"200\" dy=\"13.42\">fármacos, vacunas,<\/tspan><tspan x=\"200\" dy=\"13.42\">tóxicos,<\/tspan><tspan x=\"200\" dy=\"13.42\">microbioma<\/tspan><\/text><rect x=\"270\" y=\"6\" width=\"124\" height=\"96\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"332\" y=\"40.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Individuo: sexo<\/tspan><tspan x=\"332\" dy=\"13.42\">femenino, edad,<\/tspan><tspan x=\"332\" dy=\"13.42\">embarazo, etnia<\/tspan><\/text><path d=\"M68 102 V116 H160 V130\" class=\"fx-arr\" marker-end=\"url(#ah11)\"/><path d=\"M200 102 L200 130\" class=\"fx-arr\" marker-end=\"url(#ah11)\"/><path d=\"M332 102 V116 H240 V130\" class=\"fx-arr\" marker-end=\"url(#ah11)\"/><rect x=\"70\" y=\"130\" width=\"260\" height=\"46\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"200\" y=\"145.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Mimetismo molecular: pérdida de<\/tspan><tspan x=\"200\" dy=\"14.64\">tolerancia a los hepatocitos<\/tspan><\/text><path d=\"M200 176 L200 196\" class=\"fx-arr\" marker-end=\"url(#ah11)\"/><rect x=\"6\" y=\"196\" width=\"186\" height=\"56\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"99\" y=\"216.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"99\" dy=\"0\">Treg reducidos y<\/tspan><tspan x=\"99\" dy=\"14.03\">disfuncionales<\/tspan><\/text><rect x=\"208\" y=\"196\" width=\"186\" height=\"56\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"301\" y=\"216.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"301\" dy=\"0\">Th1, Th17/Th22, macrófagos,<\/tspan><tspan x=\"301\" dy=\"14.03\">NK y complemento activos<\/tspan><\/text><path d=\"M99 252 V264 H170 V276\" class=\"fx-arr\" marker-end=\"url(#ah11)\"/><path d=\"M301 252 V264 H230 V276\" class=\"fx-arr\" marker-end=\"url(#ah11)\"/><rect x=\"40\" y=\"276\" width=\"320\" height=\"48\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"200\" y=\"292.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Inflamación hepática persistente: hepatitis de<\/tspan><tspan x=\"200\" dy=\"14.64\">interfase → fibrosis → cirrosis<\/tspan><\/text><\/svg><figcaption>Figura 1 de la revisión, simplificada. Confirmados: <strong>HLA-D<\/strong>, <strong>SH2B3<\/strong>, sexo femenino, edad, embarazo y varios <strong>fármacos<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>De todos los factores de la Figura 1, los <strong>confirmados<\/strong> son: alelos <strong>HLA-D<\/strong>, variantes de <strong>SH2B3<\/strong>, <strong>sexo femenino<\/strong>, <strong>edad<\/strong>, <strong>embarazo<\/strong> y la exposición a varios <strong>fármacos<\/strong>. AIRE, FAS/FASL, CTLA4 y GATA2 son especulativos fuera de síndromes específicos.<\/p><\/aside><div data-fp=\"hai\" hidden><\/div><h5>Del mecanismo a la clínica<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Linfocitos y <strong>células plasmáticas<\/strong> atacan la placa limitante del lobulillo (hepatitis de interfase)<\/th><td>ALT y AST altas, a veces con cuadro de hepatitis aguda<\/td><\/tr><tr><th scope=\"row\">Las células plasmáticas producen inmunoglobulinas en exceso<\/th><td><strong>IgG alta<\/strong> (hipergammaglobulinemia)<\/td><\/tr><tr><th scope=\"row\">Pérdida de tolerancia a proteínas propias<\/th><td>Autoanticuerpos: ANA y antimúsculo liso (tipo 1); anti-LKM1 y anti-LC1 (tipo 2)<\/td><\/tr><tr><th scope=\"row\">Inflamación crónica activa a las células estelares<\/th><td>Fibrosis y, sin tratamiento, cirrosis<\/td><\/tr><tr><th scope=\"row\">El daño es inmunomediado<\/th><td>Responde a <strong>esteroides<\/strong> e inmunosupresores; la buena respuesta apoya el diagnóstico<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>En la histología, la <strong>hepatitis de interfase<\/strong>, las <strong>células plasmáticas<\/strong>, las <strong>rosetas<\/strong> y la <strong>emperipolesis<\/strong> son la huella de este ataque inmune.<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Cuadro clínico y poblaciones especiales","h":"<h5>Tres patrones de presentación<\/h5><div class=\"tbl\"><table><thead><tr><th>Patrón<\/th><th>Rasgos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Aguda<\/strong> (la más frecuente hoy, también en niños y adolescentes)<\/th><td>Transaminasas <strong>≥5–10× LSN<\/strong>, a menudo <strong>ictericia<\/strong>, a veces <strong>INR prolongado<\/strong>. Una minoría: forma <strong>grave o subfulminante<\/strong> que puede llegar a <strong>falla hepática aguda<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Insidiosa<\/strong><\/th><td>Síntomas inespecíficos: <strong>fatiga, artralgias, malestar, amenorrea<\/strong>; pocos llegan con datos de <strong>cirrosis<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Asintomática<\/strong><\/th><td>PFH alteradas por casualidad o al estudiar otras enfermedades autoinmunes (<strong>tiroides, celíaca, reumatológicas<\/strong>)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">Forma aguda grave<\/span><\/div><p>El paciente con HAI <strong>aguda grave o subfulminante<\/strong> debe <strong>referirse rápido a un centro de trasplante hepático<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Mujer con HAI en remisión con azatioprina que desea embarazarse: <strong>continúa la azatioprina<\/strong>. Si toma micofenolato: <strong>suspéndelo<\/strong> (teratógeno).<\/p><\/aside>"},{"t":"Diagnóstico: abordaje y autoanticuerpos","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Las comorbilidades no retrasan el tratamiento<\/span><\/div><p>EHNA + HAI es cada vez más común; HAI + VHB no es rara en zonas de alta prevalencia de VHB; y casi todos los adultos mayores toman algún fármaco hepatotóxico. <strong>Una causa concomitante no debe retrasar el diagnóstico ni el tratamiento de la HAI.<\/strong><\/p><\/aside><figure class=\"fig\" data-fig=\"hai-dx\"><svg viewBox=\"0 0 400 372\" role=\"img\" aria-label=\"Algoritmo serológico de la hepatitis autoinmune\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah12\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"80\" y=\"6\" width=\"240\" height=\"34\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Hepatopatía de origen desconocido<\/tspan><\/text><path d=\"M200 40 L200 58\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><rect x=\"40\" y=\"58\" width=\"320\" height=\"44\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"200\" y=\"80\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">IFI en cortes de roedor + SLA/LP (ELISA o blot)<\/tspan><\/text><path d=\"M120 102 V116 H100 V132\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><path d=\"M280 102 V116 H300 V132\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><rect x=\"6\" y=\"132\" width=\"188\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"146.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">ANA+, SMA+, LKM1/LC1+ o<\/tspan><tspan x=\"100\" dy=\"14.03\">SLA/LP+<\/tspan><\/text><rect x=\"206\" y=\"132\" width=\"188\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"146.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Prueba negativa y persiste<\/tspan><tspan x=\"300\" dy=\"14.03\">la sospecha<\/tspan><\/text><path d=\"M100 176 L100 196\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><rect x=\"6\" y=\"196\" width=\"188\" height=\"34\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"213\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Considera HAI<\/tspan><\/text><path d=\"M100 230 L100 250\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><rect x=\"6\" y=\"250\" width=\"188\" height=\"34\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"100\" y=\"267\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Biopsia hepática<\/tspan><\/text><path d=\"M300 176 L300 190\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><rect x=\"206\" y=\"190\" width=\"188\" height=\"90\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"215.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Repetir en laboratorio<\/tspan><tspan x=\"300\" dy=\"12.81\">especializado: pANCA, LKM1,<\/tspan><tspan x=\"300\" dy=\"12.81\">LKM3, LC1, SLA/LP, actina F,<\/tspan><tspan x=\"300\" dy=\"12.81\">Ro52, gp210, sp100<\/tspan><\/text><path d=\"M250 280 L250 300\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><path d=\"M350 280 L350 300\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><rect x=\"206\" y=\"300\" width=\"90\" height=\"66\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"251\" y=\"326.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"251\" dy=\"0\">Positivo:<\/tspan><tspan x=\"251\" dy=\"12.81\">considera HAI<\/tspan><\/text><rect x=\"304\" y=\"300\" width=\"90\" height=\"66\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"349\" y=\"320.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"349\" dy=\"0\">Negativo:<\/tspan><tspan x=\"349\" dy=\"12.81\">otro dx o HAI<\/tspan><tspan x=\"349\" dy=\"12.81\">seronegativa<\/tspan><\/text><path d=\"M206 333 V333 H100 V284\" class=\"fx-arr\" marker-end=\"url(#ah12)\"/><\/svg><figcaption>Figura 2 de la revisión (adaptada de EASL 2015). Con cualquier autoanticuerpo positivo, el siguiente paso es la <strong>biopsia<\/strong>.<\/figcaption><\/figure><h5>Autoanticuerpos<\/h5><div class=\"tbl\"><table><thead><tr><th>Anticuerpo<\/th><th>Lo que debes saber<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>ANA<\/strong> y <strong>SMA (antiactina F)<\/strong><\/th><td>Marcadores de la <strong>HAI tipo 1<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Anti-LKM1<\/strong> y <strong>anti-LC1<\/strong><\/th><td>Marcadores de la <strong>HAI tipo 2<\/strong>, casi exclusiva de <strong>niños<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Anti-SLA/LP<\/strong><\/th><td><strong>15–20 %<\/strong> de los pacientes; especificidad <strong>0.99<\/strong>, sensibilidad <strong>0.19<\/strong>. Se detecta por <strong>ELISA o inmunoblot, no por IFI<\/strong>. Suele acompañar a otros; más <strong>recaídas<\/strong> y necesidad de inmunosupresión permanente<\/td><\/tr><tr><th scope=\"row\"><strong>AMA<\/strong><\/th><td>Marcador de CBP, pero puede aparecer en HAI típica <strong>sin colestasis<\/strong>; esos pacientes <strong>no<\/strong> desarrollan CBP<\/td><\/tr><tr><th scope=\"row\"><strong>pANCA, anti-LKM3, Ro52, gp210, sp100<\/strong><\/th><td>Se buscan en laboratorio especializado cuando la sospecha persiste con pruebas negativas<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La división en <strong>tipo 1 y tipo 2<\/strong> tiene <strong>poco valor clínico<\/strong>: la expresión clínica, el tratamiento, la respuesta y el desenlace son <strong>prácticamente los mismos<\/strong> en adultos y niños.<\/p><\/aside>"},{"t":"Criterios simplificados del IAIHG","h":"<figure class=\"fig\" data-fig=\"hai-score\"><svg viewBox=\"0 0 400 346\" role=\"img\" aria-label=\"Criterios simplificados de hepatitis autoinmune\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah13\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"65\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"65\" dy=\"0\">Variable<\/tspan><\/text><text x=\"195\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"195\" dy=\"0\">1 punto<\/tspan><\/text><text x=\"330\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">2 puntos<\/tspan><\/text><rect x=\"6\" y=\"28\" width=\"118\" height=\"58\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"65\" y=\"49.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"65\" dy=\"0\">Autoanticuerpos<\/tspan><tspan x=\"65\" dy=\"14.03\">(máx. 2)<\/tspan><\/text><rect x=\"132\" y=\"28\" width=\"126\" height=\"58\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"195\" y=\"57\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"195\" dy=\"0\">ANA o SMA ≥1:40<\/tspan><\/text><rect x=\"266\" y=\"28\" width=\"128\" height=\"58\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"330\" y=\"44.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">ANA o SMA ≥1:80, o<\/tspan><tspan x=\"330\" dy=\"12.81\">LKM1 ≥1:40, o SLA<\/tspan><tspan x=\"330\" dy=\"12.81\">positivo<\/tspan><\/text><rect x=\"6\" y=\"94\" width=\"118\" height=\"58\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"65\" y=\"123\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"65\" dy=\"0\">IgG<\/tspan><\/text><rect x=\"132\" y=\"94\" width=\"126\" height=\"58\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"195\" y=\"123\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"195\" dy=\"0\">&gt;LSN<\/tspan><\/text><rect x=\"266\" y=\"94\" width=\"128\" height=\"58\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"330\" y=\"123\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">&gt;1.1× LSN<\/tspan><\/text><rect x=\"6\" y=\"160\" width=\"118\" height=\"58\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"65\" y=\"189\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"65\" dy=\"0\">Histología<\/tspan><\/text><rect x=\"132\" y=\"160\" width=\"126\" height=\"58\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"195\" y=\"189\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"195\" dy=\"0\">Compatible con HAI<\/tspan><\/text><rect x=\"266\" y=\"160\" width=\"128\" height=\"58\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"330\" y=\"169.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">Típica: 2 de 3<\/tspan><tspan x=\"330\" dy=\"12.81\">(interfase,<\/tspan><tspan x=\"330\" dy=\"12.81\">emperipolesis,<\/tspan><tspan x=\"330\" dy=\"12.81\">rosetas)<\/tspan><\/text><rect x=\"6\" y=\"226\" width=\"118\" height=\"58\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"65\" y=\"247.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"65\" dy=\"0\">Sin hepatitis<\/tspan><tspan x=\"65\" dy=\"14.03\">viral<\/tspan><\/text><rect x=\"132\" y=\"226\" width=\"126\" height=\"58\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5;stroke-dasharray:5 4\"/><text x=\"195\" y=\"255\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"195\" dy=\"0\">—<\/tspan><\/text><rect x=\"266\" y=\"226\" width=\"128\" height=\"58\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"330\" y=\"255\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"330\" dy=\"0\">Sí<\/tspan><\/text><rect x=\"6\" y=\"296\" width=\"190\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"101\" y=\"318\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">≥6 puntos: HAI probable<\/tspan><\/text><rect x=\"204\" y=\"296\" width=\"190\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"299\" y=\"318\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">≥7 puntos: HAI definitiva<\/tspan><\/text><\/svg><figcaption>Tabla 1 de la revisión (actualización serológica). Máximo <strong>8 puntos<\/strong>. ANA positivo en HEp-2: <strong>≥1:80 o 1:160<\/strong>; en ELISA, cortes locales.<\/figcaption><\/figure><h5>Tabla 1: criterios simplificados (actualización serológica)<\/h5><div class=\"tbl\"><table><thead><tr><th>Variable<\/th><th>Corte<\/th><th>Puntos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">ANA o SMA/actina F<\/th><td>Positivo (IFI ≥1:40 en tejido)<\/td><td><strong>1<\/strong><\/td><\/tr><tr><th scope=\"row\">ANA o SMA/actina F<\/th><td>Fuertemente positivo (IFI ≥1:80)<\/td><td><strong>2<\/strong><\/td><\/tr><tr><th scope=\"row\">o anti-LKM1<\/th><td>≥1:40<\/td><td><strong>2<\/strong><\/td><\/tr><tr><th scope=\"row\">o anti-SLA<\/th><td>Positivo<\/td><td><strong>2<\/strong><\/td><\/tr><tr><th scope=\"row\">IgG<\/th><td>&gt;LSN<\/td><td><strong>1<\/strong><\/td><\/tr><tr><th scope=\"row\">IgG<\/th><td><strong>&gt;1.1× LSN<\/strong><\/td><td><strong>2<\/strong><\/td><\/tr><tr><th scope=\"row\">Histología (con hepatitis)<\/th><td>Compatible con HAI<\/td><td><strong>1<\/strong><\/td><\/tr><tr><th scope=\"row\">Histología (con hepatitis)<\/th><td><strong>Típica<\/strong> de HAI<\/td><td><strong>2<\/strong><\/td><\/tr><tr><th scope=\"row\">Ausencia de hepatitis viral<\/th><td>Sí<\/td><td><strong>2<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h5>Desempeño (revisado 1999 contra simplificado)<\/h5><div class=\"tbl\"><table><thead><tr><th><\/th><th>Revisado<\/th><th>Simplificado<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Sensibilidad<\/th><td><strong>100 %<\/strong><\/td><td>95 %<\/td><\/tr><tr><th scope=\"row\">Especificidad<\/th><td>73 %<\/td><td><strong>90 %<\/strong><\/td><\/tr><tr><th scope=\"row\">Exactitud<\/th><td>82 %<\/td><td><strong>92 %<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Puntaje máximo posible: <strong>8<\/strong> (2 + 2 + 2 + 2). Un paciente con ANA 1:160, IgG 1.5× LSN, histología típica y virus negativos tiene <strong>8 puntos: HAI definitiva<\/strong>.<\/p><\/aside>"},{"t":"Histología e imagen","h":"<h5>Consenso reciente<\/h5><div class=\"tbl\"><table><thead><tr><th>Categoría<\/th><th>Criterio<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Probable HAI<\/strong><\/th><td>Infiltrado <strong>linfoplasmocitario portal<\/strong> + al menos uno: hepatitis de interfase <strong>más que leve<\/strong> o hepatitis lobulillar <strong>más que leve<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Posible HAI<\/strong><\/th><td>Faltan los dos rasgos sin datos de otra enfermedad, <strong>o<\/strong> uno o ambos rasgos presentes junto con datos de otra hepatopatía<\/td><\/tr><tr><th scope=\"row\"><strong>Improbable HAI<\/strong><\/th><td>Datos de otra hepatopatía <strong>y<\/strong> ausencia de rasgos de HAI<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La lesión <strong>centrolobulillar<\/strong> en una biopsia tomada en las primeras semanas de una hepatitis aguda <strong>no descarta HAI<\/strong>: puede ser su manifestación histológica temprana.<\/p><\/aside>"},{"t":"Diagnóstico diferencial y síndromes variantes","h":"<figure class=\"fig\" data-fig=\"hai-overlap\"><svg viewBox=\"0 0 400 278\" role=\"img\" aria-label=\"Síndromes variantes de la hepatitis autoinmune\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah14\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"110\" y=\"6\" width=\"180\" height=\"34\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"200\" y=\"23\" font-size=\"12.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">HAI con colestasis<\/tspan><\/text><path d=\"M150 40 V51 H100 V62\" class=\"fx-arr\" marker-end=\"url(#ah14)\"/><path d=\"M250 40 V51 H300 V62\" class=\"fx-arr\" marker-end=\"url(#ah14)\"/><rect x=\"6\" y=\"62\" width=\"188\" height=\"34\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"100\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">HAI-CBP (París): 2 de 3<\/tspan><\/text><rect x=\"206\" y=\"62\" width=\"188\" height=\"34\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"79\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">HAI-CEP: todos<\/tspan><\/text><rect x=\"6\" y=\"104\" width=\"188\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"100\" y=\"129\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">FA ≥2× LSN o GGT ≥5× LSN<\/tspan><\/text><rect x=\"6\" y=\"162\" width=\"188\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"100\" y=\"187\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">AMA positivos<\/tspan><\/text><rect x=\"6\" y=\"220\" width=\"188\" height=\"50\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"100\" y=\"238.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Lesiones floridas de<\/tspan><tspan x=\"100\" dy=\"13.42\">conductos biliares<\/tspan><\/text><rect x=\"206\" y=\"104\" width=\"188\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"129\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Rasgos típicos de HAI<\/tspan><\/text><rect x=\"206\" y=\"162\" width=\"188\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"187\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">AMA negativos<\/tspan><\/text><rect x=\"206\" y=\"220\" width=\"188\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"231.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">CEP de conductos grandes<\/tspan><tspan x=\"300\" dy=\"13.42\">(colangiografía) o pequeños<\/tspan><tspan x=\"300\" dy=\"13.42\">(histología)<\/tspan><\/text><\/svg><figcaption>Busca HAI-CEP en HAI con <strong>CUCI<\/strong>, colestasis inexplicada o falta de respuesta. En niños se llama <strong>colangitis esclerosante autoinmune<\/strong>.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p><strong>AMA positivo no basta<\/strong> para diagnosticar HAI-CBP: puede verse en HAI típica sin colestasis. Se necesitan <strong>2 de 3<\/strong> criterios de París.<\/p><\/aside>"},{"t":"Tratamiento de inducción","h":"<figure class=\"fig\" data-fig=\"hai-tx\"><svg viewBox=\"0 0 400 452\" role=\"img\" aria-label=\"Algoritmo de tratamiento de la hepatitis autoinmune\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah15\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"80\" y=\"6\" width=\"240\" height=\"44\" rx=\"9\" style=\"fill:#6F4BC8;fill-opacity:0.13;stroke:#6F4BC8;stroke-width:1.5\"/><text x=\"200\" y=\"20.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Prednisolona 0.5 mg/kg +<\/tspan><tspan x=\"200\" dy=\"14.64\">azatioprina (a los 7–14 días)<\/tspan><\/text><path d=\"M120 50 V60 H68 V70\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><path d=\"M200 50 L200 70\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><path d=\"M280 50 V60 H332 V70\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"6\" y=\"70\" width=\"124\" height=\"30\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"85\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Respuesta<\/tspan><\/text><rect x=\"138\" y=\"70\" width=\"124\" height=\"30\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"85\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Insuficiente<\/tspan><\/text><rect x=\"270\" y=\"70\" width=\"124\" height=\"30\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"85\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Intolerancia<\/tspan><\/text><path d=\"M68 100 L68 116\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><path d=\"M200 100 L200 116\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><path d=\"M332 100 L332 116\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"6\" y=\"116\" width=\"124\" height=\"118\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"68\" y=\"142.975\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"68\" dy=\"0\">Mantenimiento: AZA<\/tspan><tspan x=\"68\" dy=\"12.81\">1–2 mg/kg ±<\/tspan><tspan x=\"68\" dy=\"12.81\">esteroide a dosis<\/tspan><tspan x=\"68\" dy=\"12.81\">baja; retirar<\/tspan><tspan x=\"68\" dy=\"12.81\">esteroide si se<\/tspan><tspan x=\"68\" dy=\"12.81\">puede<\/tspan><\/text><rect x=\"138\" y=\"116\" width=\"124\" height=\"44\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"131.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Metabolitos de AZA<\/tspan><tspan x=\"200\" dy=\"12.81\">(6-TGN)<\/tspan><\/text><path d=\"M200 160 L200 174\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"138\" y=\"174\" width=\"124\" height=\"92\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"200.785\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">6-TGN &lt;220: revisar<\/tspan><tspan x=\"200\" dy=\"12.81\">adherencia, subir<\/tspan><tspan x=\"200\" dy=\"12.81\">dosis o alopurinol<\/tspan><tspan x=\"200\" dy=\"12.81\">+ AZA baja<\/tspan><\/text><path d=\"M200 266 L200 280\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"138\" y=\"280\" width=\"124\" height=\"66\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"200\" y=\"300.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">6-TGN &gt;220: volver<\/tspan><tspan x=\"200\" dy=\"12.81\">a excluir otro<\/tspan><tspan x=\"200\" dy=\"12.81\">diagnóstico<\/tspan><\/text><rect x=\"270\" y=\"116\" width=\"124\" height=\"44\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"138\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">6-mercaptopurina<\/tspan><\/text><path d=\"M332 160 L332 174\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"270\" y=\"174\" width=\"124\" height=\"66\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"194.19\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Si no la tolera:<\/tspan><tspan x=\"332\" dy=\"12.81\">micofenolato 2<\/tspan><tspan x=\"332\" dy=\"12.81\">g/día<\/tspan><\/text><path d=\"M332 240 L332 254\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"270\" y=\"254\" width=\"124\" height=\"54\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"332\" y=\"274.595\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"332\" dy=\"0\">Si tampoco:<\/tspan><tspan x=\"332\" dy=\"12.81\">esteroide solo<\/tspan><\/text><path d=\"M200 346 L200 384\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><path d=\"M332 308 V360 H280 V384\" class=\"fx-arr\" marker-end=\"url(#ah15)\"/><rect x=\"60\" y=\"384\" width=\"280\" height=\"62\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"401.58\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Respuesta insuficiente persistente: tercera<\/tspan><tspan x=\"200\" dy=\"13.42\">línea en centro experto (ensayo clínico si es<\/tspan><tspan x=\"200\" dy=\"13.42\">posible)<\/tspan><\/text><\/svg><figcaption>Figura 3 de la revisión, simplificada. Respuesta insuficiente = ALT o IgG altas tras <strong>&gt;6 meses<\/strong>. El micofenolato sirve ante <strong>intolerancia<\/strong>, no ante respuesta insuficiente.<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p><strong>No responder a esteroides<\/strong> pone en duda el <strong>diagnóstico<\/strong> o la <strong>adherencia<\/strong>: la respuesta a esteroides en HAI es casi universal.<\/p><\/aside>"},{"t":"Mantenimiento, segunda línea y suspensión","h":"<h5>Metabolitos de azatioprina (profármaco)<\/h5><div class=\"tbl\"><table><thead><tr><th>6-TGN (activo)<\/th><th>6-MMP (inactivo, tóxico)<\/th><th>Interpretación y conducta<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Bajo<\/th><td>Bajo<\/td><td><strong>Ajustar (subir) dosis<\/strong><\/td><\/tr><tr><th scope=\"row\">Muy bajo<\/th><td>Muy bajo<\/td><td><strong>Falta de adherencia<\/strong>: corregir, idealmente con apoyo psicológico<\/td><\/tr><tr><th scope=\"row\">Bajo<\/th><td><strong>Alto<\/strong><\/td><td>Metabolismo desviado: <strong>agregar alopurinol y bajar la dosis de azatioprina<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Intolerancia a AZA → <strong>6-MP<\/strong> primero, luego <strong>micofenolato<\/strong>. Respuesta insuficiente a AZA → <strong>mide 6-TGN y optimiza<\/strong> (dosis o alopurinol); el micofenolato <strong>no<\/strong> suele funcionar aquí.<\/p><\/aside>"},{"t":"Pronóstico, trasplante y cáncer","h":"<h5>Trasplante hepático<\/h5><div class=\"tbl\"><table><thead><tr><th>Población<\/th><th>Paciente 1 año<\/th><th>Injerto 1 año<\/th><th>Paciente 5 años<\/th><th>Injerto 5 años<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Adultos europeos 2000–2009<\/th><td>88 %<\/td><td>84 %<\/td><td>80 %<\/td><td>72 %<\/td><\/tr><tr><th scope=\"row\">Niños en EUA 2002–2012<\/th><td>95 %<\/td><td>91 %<\/td><td>91 %<\/td><td>84 %<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>cirrosis al diagnóstico<\/strong> es el factor que más multiplica el riesgo de CHC en HAI (de 3.06 a <strong>10.07 por 1000 pacientes-año<\/strong>).<\/p><\/aside>"},{"t":"Guías, terapias emergentes y viaje del paciente","h":"<h5>El viaje del paciente (Tabla 2)<\/h5><div class=\"tbl\"><table><thead><tr><th>Etapa<\/th><th>Claves médicas<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Diagnóstico<\/strong><\/th><td>Excluir virus, Wilson y fármacos; <strong>IgG total<\/strong> como escrutinio; autoanticuerpos; <strong>biopsia<\/strong> para confirmar. Diagnóstico tardío en <strong>hombres, ancianos<\/strong> y pacientes complejos<\/td><\/tr><tr><th scope=\"row\"><strong>Inducción<\/strong><\/th><td>Prednisolona <strong>≈0.5 mg/kg<\/strong> (más en aguda, menos en leve); glucosa las primeras 2 semanas; <strong>AZA a las 2 semanas<\/strong> (más tarde con ictericia marcada)<\/td><\/tr><tr><th scope=\"row\"><strong>Mantenimiento<\/strong><\/th><td>Meta: transaminasas e IgG normales; laboratorio <strong>cada 3 meses<\/strong>; medir <strong>6-TGN<\/strong>; cambiar a segunda línea solo con <strong>intolerancia definitiva<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Segunda y tercera línea<\/strong><\/th><td>Intolerancia: probar <strong>6-MP<\/strong>, luego <strong>MMF<\/strong>; respuesta insuficiente: cuestionar <strong>diagnóstico y adherencia<\/strong>; tercera línea solo en centros expertos<\/td><\/tr><tr><th scope=\"row\"><strong>Querer suspender<\/strong><\/th><td>Solo <strong>10–20 %<\/strong> lo logra; mejor tras <strong>&gt;2 años<\/strong> de remisión completa con mantenimiento a dosis baja; decisión compartida<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>&quot;Todo aumento de enzimas hepáticas <strong>podría<\/strong> ser HAI&quot; (Tabla 2): la forma de presentación va de asintomática a fulminante.<\/p><\/aside>"}],"pearls":["La presentación aguda (transaminasas ≥5–10× LSN) es hoy la más frecuente, también en niños.","Biopsia hepática obligatoria: hepatitis de interfase con infiltrado rico en células plasmáticas (hasta 98 %).","Histología típica = 2 de 3: hepatitis de interfase, emperipolesis y rosetas.","Score simplificado: autoanticuerpos máx. 2, IgG máx. 2, histología máx. 2, sin virus 2. ≥6 probable; ≥7 definitiva.","IgG &gt;1.1× LSN = 2 puntos; ANA/SMA ≥1:80 o LKM1 ≥1:40 o SLA positivo = 2 puntos.","Anti-SLA/LP: especificidad 0.99, sensibilidad 0.19; se mide por ELISA, no por inmunofluorescencia.","Tipo 1 (ANA, SMA) y tipo 2 (anti-LKM1, anti-LC1; niños) se tratan igual: la subclasificación tiene poco valor clínico.","Inducción: prednisolona 0.5 mg/kg/día; azatioprina a las 2 semanas, 50 mg/día y luego 1–2 mg/kg.","Falta de respuesta (IAIHG): descenso de ALT ≤50 % a las 4 semanas. Sin respuesta a esteroide: revisa diagnóstico y adherencia.","Remisión = transaminasas e IgG normales; ALT hasta 2× LSN ya no se acepta.","Intolerancia a AZA → 6-mercaptopurina (la toleran hasta 50 %) → micofenolato 2 g/día.","Suspender solo tras &gt;2 años de respuesta completa con monoterapia, ALT baja-normal e IgG &lt;12 g/L; lo logra 10–20 %.","Embarazo: continúa azatioprina; el micofenolato es teratógeno.","HAI-CBP (París): 2 de 3 entre FA ≥2× LSN o GGT ≥5× LSN, AMA positivo y lesión florida de conductos.","La DILI con rasgos autoinmunes no recae al retirar el esteroide; la HAI sí."],"comps":[{"title":"HAI contra DILI con rasgos autoinmunes","cols":["HAI clásica","DILI con rasgos autoinmunes"],"rows":[["Fenotipo clínico, bioquímico y serológico","Transaminasas altas, IgG alta, autoanticuerpos","<strong>El mismo<\/strong>: puede ser indistinguible"],["Desencadenante","Desconocido (posible mimetismo molecular)","Fármaco identificable (nitrofurantoína, minociclina, anti-TNF…)"],["Al suspender el fármaco","No aplica: no hay mejoría espontánea","<strong>Mejoría espontánea y pronta<\/strong>"],["Esteroides","Siempre: fármaco de inducción","Solo si es <strong>sintomática o grave<\/strong>"],["Al retirar el esteroide","<strong>Recae<\/strong> con frecuencia","<strong>No recae<\/strong>"],["Fibrosis significativa en la biopsia","<strong>Frecuente<\/strong>","Improbable"],["Histología patognomónica","No existe","No existe"],["Duración del tratamiento","Casi siempre <strong>de por vida<\/strong>","Corta"],["Grupo donde es más difícil distinguirlas","Adultos mayores (polifarmacia)","Adultos mayores (polifarmacia)"],["Ejemplo especial","Forma aguda, hoy la más frecuente","Hepatitis tras vacuna contra SARS-CoV-2 (12 sin recaída al retirar esteroide)"]],"key":"La <strong>ausencia de recaída al retirar el esteroide<\/strong> distingue la DILI de la HAI clásica."},{"title":"Prednisolona contra budesonida","cols":["Prednisolona","Budesonida"],"rows":[["Dosis inicial","<strong>0.5 mg/kg/día<\/strong> (1 mg/kg o 100 mg IV solo en formas graves)","<strong>9 mg/día<\/strong> fija"],["Reducción","5 mg por semana hasta 10 mg/día; dosis flexible","Más difícil: rango de dosis comercial poco flexible"],["Velocidad de respuesta","Rápida (ALT baja en la primera semana)","<strong>Más lenta<\/strong>"],["Tasa global de respuesta","Mayor","<strong>Menor<\/strong> (estudio español: 105 contra 276)"],["Acné y cara de luna llena","Más","<strong>Menos<\/strong> (ensayo de 100 contra 103)"],["Diabetes en el ensayo","<strong>0<\/strong> pacientes","<strong>4<\/strong> pacientes"],["Metabolismo","Esteroide sistémico","Primer paso hepático por CYP3A4, suprimido &gt;95 % por la inflamación"],["Forma fulminante o cirrosis†","Sí (IV en falla hepática)","No en la forma fulminante"],["Guías","Primera línea en todas","Primera línea en EUA y Europa; alternativa en Asia-Pacífico"],["Postura de los autores","<strong>Fármaco de elección<\/strong>","No es su fármaco de elección"]],"key":"En HAI activa la inflamación suprime el CYP3A4: la budesonida se comporta como esteroide sistémico pero con dosis menos flexible y respuesta más lenta."}],"algos":[{"title":"¿Es hepatitis autoinmune?","src":"Figura 2, Tabla 1 y Recuadro 1 de la revisión","start":"a","nodes":{"a":{"q":"Paciente con <strong>transaminasas elevadas<\/strong> o <strong>cirrosis de origen desconocido<\/strong>. ¿Ya excluiste otras causas?","i":"Recuadro 1: VHA, VHB, VHC, VHE, EBV, CMV, fármacos (incluidos de venta libre), herbolaria, Wilson, hemocromatosis, EHNA.","o":[["Sí, sin otra causa (o con una concomitante que no lo explica todo)","b"],["Hay un fármaco sospechoso","dili"],["Todavía no","exc"]]},"exc":{"end":1,"tone":"warn","text":"<strong>Primero excluye<\/strong> hepatitis virales, Wilson, hemocromatosis, EHNA, fármacos y herbolaria. Pide <strong>IgG total<\/strong> como escrutinio."},"dili":{"q":"Suspende el fármaco. ¿Mejora de forma espontánea y pronta?","i":"","o":[["Sí","dilib"],["No, o es grave","b"]]},"dilib":{"end":1,"tone":"ok","text":"Probable <strong>DILI<\/strong>. Esteroide solo si es sintomática o grave; la <strong>ausencia de recaída al retirarlo<\/strong> confirma DILI sobre HAI."},"b":{"q":"Pide <strong>IgG<\/strong> y <strong>autoanticuerpos<\/strong> (IFI en cortes de roedor + SLA/LP por ELISA). ¿Resultado?","i":"","o":[["ANA, SMA, LKM1/LC1 o SLA/LP positivo","bx"],["Todos negativos","neg"]]},"neg":{"q":"¿Persiste la sospecha clínica?","i":"","o":[["Sí: repetir en laboratorio especializado (pANCA, LKM3, actina F, Ro52, gp210, sp100…)","esp"],["No","alt"]]},"esp":{"q" \/strong> valorar <strong>trasplante hepático urgente<\/strong>."},"ind":{"q":"Prednisolona <strong>0.5 mg/kg/día<\/strong>; a los <strong>7–14 días<\/strong> azatioprina <strong>50 mg/día<\/strong> → <strong>1–2 mg/kg<\/strong>; reducir esteroide <strong>5 mg/semana<\/strong> hasta 10 mg/día. A las 4 semanas, ¿la ALT bajó más de 50 %?","i":"","o":[["Sí","seis"],["No","nr"],["Hay efectos adversos que obligan a suspender la AZA","int"]]},"nr":{"end":1,"tone":"bad","text":"<strong>Falta de respuesta (IAIHG).<\/strong> Cuestiona <strong>diagnóstico<\/strong> y <strong>adherencia<\/strong>: la respuesta a esteroides es casi universal."},"seis":{"q":"A los <strong>6 meses<\/strong>, ¿ALT e IgG normales?","i":"","o":[["Sí: respuesta completa","mant"],["No: respuesta insuficiente","ins"]]},"mant":{"q":"Mantenimiento con <strong>AZA 1–2 mg/kg<\/strong> a la mínima dosis eficaz y retiro del esteroide. ¿Lleva <strong>&gt;2 años<\/strong> en respuesta completa con monoterapia, ALT baja-normal e <strong>IgG &lt;12 g/L<\/strong>?","i":"","o":[["Sí","sus"],["No","vida"]]},"sus":{"end":1,"tone":"ok","text":"Intenta <strong>retiro escalonado<\/strong> con vigilancia estrecha (recaídas sobre todo en los primeros 6 meses) y <strong>de por vida<\/strong>. Solo 10–20 % lo logra."},"vida":{"end":1,"tone":"ok","text":"Mantén la terapia con laboratorio <strong>cada 3 meses<\/strong>; casi siempre es <strong>de por vida<\/strong>."},"ins":{"q":"Mide <strong>6-TGN y 6-MMP<\/strong>. ¿Qué encuentras?","i":"","o":[["6-TGN y 6-MMP muy bajos","adh"],["6-TGN bajo y 6-MMP alto","alo"],["6-TGN bajo y 6-MMP bajo","dosis"],["6-TGN &gt;220","reex"]]},"adh":{"end":1,"tone":"warn","text":"<strong>Falta de adherencia.<\/strong> Corrígela, idealmente con apoyo psicológico."},"alo":{"end":1,"tone":"warn","text":"Agrega <strong>alopurinol<\/strong> y <strong>baja la dosis de azatioprina<\/strong>."},"dosis":{"end":1,"tone":"warn","text":"<strong>Sube la dosis<\/strong> de azatioprina."},"reex":{"end":1,"tone":"bad","text":"<strong>Vuelve a excluir otro diagnóstico<\/strong> (nueva biopsia: EHNA, toxicidad, otra hepatopatía). Si persiste: <strong>tercera línea<\/strong> en centro experto (no micofenolato, que suele fallar aquí)."},"int":{"q":"Reexpón con <strong>6-mercaptopurina<\/strong> a dosis baja. ¿La tolera?","i":"","o":[["Sí","ind6"],["No","mmf"]]},"ind6":{"end":1,"tone":"ok","text":"Continúa con <strong>6-MP<\/strong> (la tolera hasta 50 % de los intolerantes a AZA)."},"mmf":{"end":1,"tone":"warn","text":"<strong>Micofenolato de mofetilo 2 g/día<\/strong> (segunda línea). Si tampoco: esteroide solo o tercera línea con expertos. <strong>Contraindicado en el embarazo.<\/strong>"}}}],"cards":[["¿Por qué la IgG está alta en la hepatitis autoinmune?","Porque el infiltrado tiene muchas células plasmáticas que producen inmunoglobulinas en exceso (hipergammaglobulinemia)."],["Definición de hepatitis autoinmune","Enfermedad hepática inflamatoria inmunomediada de causa desconocida con autoanticuerpos, IgG elevada e histología característica."],["Prevalencia en América (metaanálisis)","22.80 por 100 000 (Europa 19.44; Asia 12.99)."],["Proporción de mujeres","Tres cuartas partes."],["Transaminasas en la HAI aguda","Al menos 5–10 veces el LSN, a menudo con ictericia y a veces INR prolongado."],["HAI en el adulto mayor","Curso más benigno, más respuesta completa, mejor pronóstico; difícil excluir DILI."],["Alteración de linfocitos T reguladores","Número reducido y función alterada; Th17 sin control."],["Inmunomoduladores que pueden inducir HAI","Bloqueo de CTLA-4, PD-1/PD-L1 e interferones."],["¿Una causa concomitante retrasa el tratamiento de HAI?","No: no debe retrasar diagnóstico ni tratamiento."],["Valor clínico de la subclasificación 1 y 2","Poco: misma clínica, tratamiento, respuesta y desenlace."],["Importancia pronóstica del anti-SLA/LP","Más riesgo de recaída e inmunosupresión permanente."],["Las 4 variables del score simplificado","Autoanticuerpos, IgG, histología y ausencia de hepatitis viral."],["Puntos por histología","Compatible: 1; típica: 2."],["Revisado contra simplificado: sensibilidad","100 % contra 95 %."],["Hepatitis de interfase","Infiltrado portal denso rico en células plasmáticas que rebasa la placa limitante; hasta 98 %."],["Elastografía en los primeros 3 meses de tratamiento","Correlaciona más con el grado (inflamación) que con el estadio."],["HAI contra DILI: la clave","La DILI no recae al retirar el esteroide; la HAI sí."],["Criterios de HAI-CEP","Todos: rasgos de HAI, AMA negativos y CEP de conductos grandes (colangiografía) o pequeños (histología)."],["¿Qué proporción logra respuesta bioquímica completa?","Cerca de dos tercios."],["Sin mejoría en HAI aguda grave a los 7–14 días","Mal pronóstico: considerar trasplante urgente."],["¿Por qué la budesonida pierde ventaja en HAI activa?","La inflamación suprime el CYP3A4 &gt;95 %: se vuelve esteroide sistémico."],["Metabolito activo de la azatioprina","6-tioguanina (6-TGN)."],["Primer paso ante intolerancia a azatioprina","Reexponer con 6-mercaptopurina (la toleran hasta 50 %)."],["Recaída tras suspender","Frecuente, sobre todo en los primeros 6 meses; puede ser décadas después."],["Sobrevida de paciente tras trasplante (adultos europeos)","88 % a 1 año y 80 % a 5 años."]],"mcq":[{"q":"Mujer de 34 años con 10 días de ictericia y astenia. ALT 1250 U/L, bilirrubina 6 mg/dL, INR 1.3. VHA, VHB, VHC y VHE negativos; sin fármacos. ¿Qué estudio de escrutinio para HAI recomienda la Tabla 2?","o":["Ceruloplasmina únicamente","IgG total y después autoanticuerpos","Anti-SLA/LP como prueba inicial","Colangiorresonancia","Ferritina"],"a":1,"e":"La Tabla 2 señala como mejor escrutinio la <strong>IgG total<\/strong> (e IgA, IgM o gammaglobulinas) y después los <strong>autoanticuerpos<\/strong>."},{"q":"Paciente con ANA 1:80 por IFI en tejido, IgG 1.3× LSN, histología típica y virus negativos. ¿Cuántos puntos tiene en el score simplificado?","o":["5","6","7","8","4"],"a":3,"e":"ANA ≥1:80 = <strong>2<\/strong>; IgG &gt;1.1× LSN = <strong>2<\/strong>; histología típica = <strong>2<\/strong>; sin hepatitis viral = <strong>2<\/strong>: total <strong>8<\/strong>, HAI definitiva."},{"q":"¿Cuál es el corte del score simplificado para HAI definitiva?","o":["≥5 puntos","≥6 puntos","≥7 puntos","≥10 puntos","≥15 puntos"],"a":2,"e":"≥6 = probable; <strong>≥7 = definitiva<\/strong>."},{"q":"¿Qué hallazgo NO forma parte de los tres rasgos de histología típica del score simplificado?","o":["Hepatitis de interfase linfocítica","Emperipolesis","Rosetas hepatocelulares","Lesión florida de conductos biliares"],"a":3,"e":"Histología típica = 2 de 3: <strong>interfase, emperipolesis y rosetas<\/strong>. La lesión florida de conductos es criterio de <strong>CBP<\/strong> (París)."},{"q":"Sobre el anti-SLA/LP, ¿cuál es correcta?","o":["Se detecta por inmunofluorescencia indirecta","Es poco específico","Tiene especificidad de 0.99 y sensibilidad de 0.19","Está en 80 % de los pacientes","Indica HAI tipo 2 exclusivamente"],"a":2,"e":"Positivo en <strong>15–20 %<\/strong>, especificidad <strong>0.99<\/strong>, sensibilidad <strong>0.19<\/strong>; se detecta por <strong>ELISA o inmunoensayo, no por IFI<\/strong>."},{"q":"¿Por qué la subclasificación en HAI tipo 1 y 2 tiene poco valor clínico?","o":["Porque los anticuerpos no se pueden medir","Porque clínica, tratamiento, respuesta y desenlace son esencialmente los mismos","Porque el tipo 2 no existe","Porque solo afecta a ancianos","Porque el tipo 1 no responde a esteroides"],"a":1,"e":"Aunque hay diferencias epidemiológicas y genéticas, la <strong>expresión clínica, el esquema, la respuesta y el desenlace<\/strong> son prácticamente iguales."},{"q":"¿Cuál es el sello histológico de la HAI?","o":["Granulomas epitelioides","Esteatosis macrovesicular","Hepatitis de interfase con infiltrado rico en células plasmáticas","Cuerpos de Mallory","Colangitis destructiva no supurativa"],"a":2,"e":"La <strong>hepatitis de interfase<\/strong> (infiltrado portal denso de células plasmáticas que rebasa la placa limitante) está en <strong>hasta 98 %<\/strong>."},{"q":"¿Qué afirmación sobre la biopsia hepática en HAI es correcta?","o":["Es opcional si el score es ≥7","Es obligatoria para el diagnóstico","Solo se hace si hay cirrosis","Se sustituye siempre por elastografía","Solo sirve para estadificar"],"a":1,"e":"La <strong>histología es obligatoria<\/strong>: confirma, valora actividad y fibrosis y excluye otras causas."},{"q":"¿Qué hallazgo histológico favorece HAI sobre DILI?","o":["Eosinófilos","Fibrosis significativa","Colestasis","Necrosis centrolobulillar","Ninguno"],"a":1,"e":"La histología ayuda poco, pero la <strong>fibrosis significativa<\/strong> es más frecuente en HAI e improbable en DILI."},{"q":"Paciente con HAI y CUCI con FA elevada sin explicación. ¿Qué estudio buscas?","o":["AMA","Colangiorresonancia para buscar CEP","Endoscopia alta","Ceruloplasmina","Ferritina"],"a":1,"e":"HAI con <strong>EII (sobre todo CUCI)<\/strong> o colestasis inexplicada obliga a buscar <strong>HAI-CEP<\/strong> con colangiografía (endoscópica o por resonancia)."},{"q":"Mujer de 40 años (70 kg) con HAI moderada recién diagnosticada. ¿Qué dosis inicial de prednisolona sugiere la revisión?","o":["10 mg/día","35 mg/día (0.5 mg/kg)","70 mg/día como regla","100 mg IV","Sin esteroide; solo azatioprina"],"a":1,"e":"En 451 pacientes, <strong>0.5 mg/kg<\/strong> fue tan eficaz como 1 mg/kg con menos efectos adversos. Dosis mayores solo en enfermedad aguda muy grave."},{"q":"Según el Delphi del IAIHG, ¿cómo se define la falta de respuesta al tratamiento?","o":["ALT normal a los 6 meses","No lograr un descenso &gt;50 % de la ALT en 4 semanas","IgG &gt;12 g/L","Bilirrubina &gt;2× LSN a la semana","Aparición de diabetes"],"a":1,"e":"Falta de respuesta: <strong>no reducir la ALT más de 50 % en 4 semanas<\/strong> (habitualmente se logra en 1 semana)."},{"q":"¿Cómo se reduce la prednisolona una vez que hay respuesta?","o":["Suspensión brusca","5 mg cada semana hasta 10 mg/día","10 mg cada día","Se mantiene la dosis inicial 1 año","1 mg al mes desde el inicio"],"a":1,"e":"Reducción escalonada de <strong>5 mg por semana<\/strong> hasta <strong>10 mg/día<\/strong>, hasta lograr la respuesta completa."},{"q":"¿Qué proporción de pacientes logra realmente la respuesta bioquímica completa?","o":["Casi 100 %","Cerca de dos tercios","Un tercio","10 %","50 % a la semana"],"a":1,"e":"Solo <strong>cerca de dos tercios<\/strong> logra la remisión bioquímica completa; 20–30 % no la alcanza."},{"q":"¿Por qué la budesonida probablemente pierde su ventaja en HAI activa?","o":["Porque no se absorbe","Porque la inflamación suprime el CYP3A4 &gt;95 % y se comporta como esteroide sistémico","Porque es inmunogénica","Porque se elimina por riñón","Porque requiere vía IV"],"a":1,"e":"Su primer paso depende del <strong>CYP3A4<\/strong>, que las citocinas inflamatorias suprimen <strong>&gt;95 %<\/strong>."},{"q":"Paciente con HAI aguda y bilirrubina 20× LSN. ¿Qué precaución hay con la azatioprina?","o":["Ninguna","Su metabolismo se altera: dosificar con mucha cautela hasta que la bilirrubina baje a ≈5× LSN","Dar dosis doble","Sustituir por micofenolato de inmediato","Darla IV"],"a":1,"e":"En la <strong>ictericia intensa<\/strong> el metabolismo de la AZA se altera; ser cauto hasta bilirrubina <strong>≈5× LSN<\/strong>."},{"q":"¿Cómo se define la respuesta insuficiente?","o":["ALT y/o IgG elevadas tras más de 6 meses de terapia estándar","ALT elevada a la semana","Recaída tras suspender","IgG normal con ALT normal","Intolerancia a AZA"],"a":0,"e":"<strong>ALT y/o IgG elevadas después de &gt;6 meses<\/strong> de tratamiento estándar; se asocia a fibrosis progresiva."},{"q":"Paciente intolerante a azatioprina y a 6-mercaptopurina. ¿Fármaco de segunda línea de elección?","o":["Ciclosporina","Micofenolato de mofetilo 2 g/día","Infliximab","Budesonida","Metotrexato"],"a":1,"e":"El <strong>micofenolato de mofetilo<\/strong> (dosis usual <strong>2 g/día<\/strong>) es la segunda línea de elección ante intolerancia."},{"q":"¿Qué caracteriza a las terapias de tercera línea en HAI?","o":["Tienen ensayos controlados comparativos","Son experimentales y deben manejarse en centros de referencia","Son de primera elección en niños","Se usan en todos los pacientes al inicio","Son el micofenolato y la 6-MP"],"a":1,"e":"Ninguna se ha probado en ensayos controlados ni comparado entre sí: es <strong>experimental<\/strong>, a cargo de <strong>expertos<\/strong>."},{"q":"¿Qué porcentaje de pacientes logra suspender toda la inmunosupresión sin recaer?","o":["70–80 %","50 %","10–20 %","&lt;1 %","100 %"],"a":2,"e":"Solo <strong>10–20 %<\/strong>; la mayoría requiere tratamiento de por vida."},{"q":"Paciente con HAI tratada con micofenolato que se embaraza. ¿Qué haces?","o":["Continuar micofenolato","Suspender micofenolato (teratógeno) y usar monoterapia con esteroide","Agregar tacrolimus al micofenolato","Interrumpir el embarazo","Duplicar el micofenolato"],"a":1,"e":"El <strong>micofenolato es teratógeno<\/strong> en humanos; se sustituye por <strong>monoterapia con esteroide<\/strong>; ciclosporina o tacrolimus como última opción."},{"q":"¿Cuál NO es un factor de mal pronóstico en el Recuadro 2?","o":["Cirrosis al inicio","Edad joven al inicio","Recaídas repetidas al retirar fármacos","Edad avanzada al diagnóstico","Deficiencia de vitamina D"],"a":3,"e":"La <strong>edad joven<\/strong> es factor negativo; en el adulto mayor el curso es <strong>más benigno<\/strong> y con mejor respuesta."},{"q":"¿Con qué frecuencia recurre la HAI tras el trasplante hepático a 5 años?","o":["1–2 %","8–12 %","36–68 %","90 %","Nunca recurre"],"a":2,"e":"Recurrencia <strong>8–12 %<\/strong> el primer año y <strong>36–68 %<\/strong> a 5 años."},{"q":"Tres pacientes con hepatitis leve tras la primera dosis de una vacuna contra SARS-CoV-2 recibieron la segunda dosis. ¿Qué pasó?","o":["Ninguno tuvo problemas","Desarrollaron hepatitis grave","Desarrollaron CBP","Se curaron","Requirieron trasplante los tres"],"a":1,"e":"Los <strong>3<\/strong> desarrollaron <strong>hepatitis grave<\/strong> con la 2.ª dosis: hay que tener gran precaución al reexponer."}],"tf":[["En la hepatitis autoinmune el daño principal ocurre en la interfase entre el espacio porta y el lobulillo.",true,"Es la hepatitis de interfase, con linfocitos y células plasmáticas."],["La hepatitis autoinmune solo afecta a mujeres jóvenes.",false,"Afecta ambos sexos, todas las edades y razas, aunque 3 de 4 son mujeres."],["La biopsia hepática es obligatoria para el diagnóstico.",true,"Confirma, gradúa actividad y fibrosis y excluye otras causas."],["Un score simplificado ≥7 indica HAI definitiva.",true,"≥6 probable; ≥7 definitiva."],["La emperipolesis es específica de la HAI.",false,"Refleja actividad y regeneración, no la etiología."],["El AMA positivo en HAI siempre indica sobreposición con CBP.",false,"Se requieren 2 de 3 criterios de París."],["Mantener ALT hasta 2× LSN es una meta aceptable.",false,"La fibrosis puede progresar; la meta es normalizar transaminasas e IgG."],["La azatioprina debe iniciarse a dosis plena desde el primer día.",false,"Se inicia a los 7–14 días con 50 mg/día y se sube a 1–2 mg/kg."],["La mayoría de los pacientes puede suspender el tratamiento.",false,"Solo 10–20 %; la mayoría lo necesita de por vida."],["El micofenolato es teratógeno en humanos.",true,"Se cambia a monoterapia con esteroide."],["La HAI puede recurrir después del trasplante hepático.",true,"8–12 % al año y 36–68 % a 5 años."]]},{"id":"cbp","n":4,"title":"Colangitis biliar primaria","short":"CBP","color":"#1C97A6","src":"Lleo A, Wang GQ, Gershwin ME, Hirschfield GM. Primary biliary cholangitis. Lancet. 2020;396(10266):1915-26.","hook":"Mujer de mediana edad con fosfatasa alcalina alta y anticuerpos antimitocondriales: con eso basta para el diagnóstico. El ácido ursodesoxicólico es para todos y de por vida; lo que define el pronóstico es cómo responde al año.","group":"Hígado","ses":19,"date":"2026-10-21","nums":[["&gt;90 %","de los pacientes tiene anticuerpos antimitocondriales (AMA)"],["1 de cada 1000","mujeres mayores de 40 años tiene CBP"],["13–15 mg/kg/d","dosis de ácido ursodesoxicólico (AUDC), de por vida"],["FA &lt;1.5× LSN","con bilirrubina normal: definición común de buena respuesta"],["&lt;2 %","de los pacientes con CBP tiene sobreposición con HAI"],["~60 %","concordancia en gemelos idénticos"]],"esencial":"<h3>Lo esencial<\/h3><ul><li><strong>Definición:<\/strong> enfermedad hepática <strong>autoinmune<\/strong> que afecta sobre todo a <strong>mujeres<\/strong>: colangitis linfocítica <strong>granulomatosa, crónica y destructiva de los conductos biliares pequeños<\/strong>, con <strong>AMA<\/strong> positivos. Antes se llamaba <em>cirrosis biliar primaria<\/em>.<\/li><li>Es la <strong>enfermedad hepática autoinmune más común<\/strong>. Al menos <strong>100 000<\/strong> diagnósticos nuevos al año en el mundo y <strong>1 de cada 1000 mujeres &gt;40 años<\/strong>.<\/li><li><strong>Autoantígeno:<\/strong> <mark>componente E2 del complejo piruvato deshidrogenasa (PDC-E2)<\/mark>, enzima de la fosforilación oxidativa; pérdida de tolerancia asociada a <strong>HLA-DR<\/strong>, con inmunidad <strong>IL-12/IFNγ<\/strong>.<\/li><li><strong>Presentación actual:<\/strong> casi siempre <strong>temprana<\/strong>, solo con <strong>colestasis bioquímica + AMA<\/strong>. Síntomas: <strong>prurito, fatiga, síndrome seco (sicca)<\/strong>, molestia abdominal y dolor óseo; en fases tardías <strong>xantelasmas y xantomas<\/strong>.<\/li><li><strong>Diagnóstico:<\/strong> <mark>FA elevada (patrón colestásico) + AMA &gt;1:40 (o ANA específicos), sin otra explicación<\/mark> es suficiente. <strong>La biopsia ya es poco frecuente<\/strong>.<\/li><li><strong>AMA negativos:<\/strong> buscar ANA específicos: <strong>anti-sp100<\/strong> y <strong>anti-gp210<\/strong> (este último ligado a mayor gravedad); patrones de <strong>puntos nucleares múltiples, anillo perinuclear<\/strong> y <strong>centrómero<\/strong>.<\/li><li><strong>US basal:<\/strong> para <strong>descartar obstrucción<\/strong> biliar (no ve la enfermedad, que es de conductos pequeños) y buscar cirrosis o esplenomegalia.<\/li><li><strong>Tratamiento de primera línea:<\/strong> <mark>AUDC 13–15 mg/kg/d, a todos, de por vida<\/mark> (incluso después del trasplante).<\/li><li><strong>Respuesta:<\/strong> se juzga <strong>al año<\/strong>; definición común: <mark>FA &lt;1.5× LSN y bilirrubina normal<\/mark>. Escalas continuas: <strong>GLOBE<\/strong> y <strong>UK-PBC<\/strong>.<\/li><li><strong>Factores de mal pronóstico basales:<\/strong> edad <strong>&lt;45 años<\/strong>, <strong>sexo masculino<\/strong>, ANA específicos y <strong>etapa avanzada<\/strong> (cirrosis, bilirrubina alta).<\/li><li><strong>Segunda línea:<\/strong> <strong>ácido obeticólico<\/strong> (agonista FXR, aprobado; 5 → 10 mg/d; empeora el prurito) o <strong>bezafibrato<\/strong> 400 mg/d (pan-PPAR, fuera de indicación).<\/li><li><strong>Prurito:<\/strong> primero <strong>colestiramina<\/strong>, luego <strong>rifampicina<\/strong>; después naltrexona, sertralina, gabapentina. <strong>Fatiga:<\/strong> no es indicación de trasplante.<\/li><li><strong>Sobreposición con HAI:<\/strong> 2 de 3 criterios (ALT &gt;5× LSN; IgG &gt;2× LSN o AML; hepatitis de interfase moderada o grave); <strong>&lt;2 %<\/strong>.<\/li><li><strong>Trasplante:<\/strong> ictericia persistente, descompensación o prurito intratable; cautela con bilirrubina <strong>&gt;3 mg/dL<\/strong> y documentar la discusión con <strong>&gt;5 mg/dL<\/strong>.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Mujer de 50 años, prurito y fatiga, <strong>FA alta con GGT alta<\/strong>, transaminasas poco elevadas, US sin dilatación de la vía biliar: el siguiente paso es <strong>AMA<\/strong>. Si son positivos, <strong>no necesitas biopsia<\/strong>.<\/p><\/aside>","secs":[{"t":"Epidemiología y factores de riesgo","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Los tres factores de riesgo que más se preguntan: <strong>tabaquismo, colestasis del embarazo previa e IVU recurrentes<\/strong>.<\/p><\/aside>"},{"t":"Fisiopatología (patogenia)","h":"<figure class=\"fig\" data-fig=\"cbp-pato\"><svg viewBox=\"0 0 400 372\" role=\"img\" aria-label=\"Patogenia de la colangitis biliar primaria\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah16\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"10\" y=\"6\" width=\"380\" height=\"46\" rx=\"9\" style=\"fill:#1C97A6;fill-opacity:0.13;stroke:#1C97A6;stroke-width:1.5\"/><text x=\"200\" y=\"21.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Susceptibilidad genética (HLA-DR, CTLA-4, IL-12/IL-23) +<\/tspan><tspan x=\"200\" dy=\"14.03\">detonante ambiental por mimetismo molecular<\/tspan><\/text><path d=\"M200 52 L200 67\" class=\"fx-arr\" marker-end=\"url(#ah16)\"/><rect x=\"10\" y=\"67\" width=\"380\" height=\"46\" rx=\"9\" style=\"fill:#1C97A6;fill-opacity:0.13;stroke:#1C97A6;stroke-width:1.5\"/><text x=\"200\" y=\"90\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Pérdida de tolerancia al PDC-E2 mitocondrial → AMA<\/tspan><\/text><path d=\"M200 113 L200 128\" class=\"fx-arr\" marker-end=\"url(#ah16)\"/><rect x=\"10\" y=\"128\" width=\"380\" height=\"46\" rx=\"9\" style=\"fill:#1C97A6;fill-opacity:0.13;stroke:#1C97A6;stroke-width:1.5\"/><text x=\"200\" y=\"143.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Colangitis linfocítica IL-12/IFNγ: CD4+ (Th1, Th17) &gt; CD8+;<\/tspan><tspan x=\"200\" dy=\"14.03\">MHC I y II en el colangiocito<\/tspan><\/text><path d=\"M200 174 L200 189\" class=\"fx-arr\" marker-end=\"url(#ah16)\"/><rect x=\"10\" y=\"189\" width=\"380\" height=\"46\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5;stroke-dasharray:5 4\"/><text x=\"200\" y=\"204.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Menos AE2 (hsa-mir-506): sin paraguas de bicarbonato, los<\/tspan><tspan x=\"200\" dy=\"14.03\">ácidos biliares hidrofóbicos dañan al colangiocito<\/tspan><\/text><path d=\"M200 235 L200 250\" class=\"fx-arr\" marker-end=\"url(#ah16)\"/><rect x=\"10\" y=\"250\" width=\"380\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"273\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Apoptosis y senescencia del colangiocito; CCL20 atrae Th17<\/tspan><\/text><path d=\"M200 296 L200 311\" class=\"fx-arr\" marker-end=\"url(#ah16)\"/><rect x=\"10\" y=\"311\" width=\"380\" height=\"46\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"200\" y=\"334\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Ductopenia → colestasis → fibrosis biliar → cirrosis<\/tspan><\/text><\/svg><figcaption>Inmunidad contra <strong>PDC-E2<\/strong> + falla del <strong>paraguas de bicarbonato (AE2)<\/strong>: daño inmune, colestasis y fibrosis se retroalimentan (Figura 1 del artículo, simplificada).<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>Autoantígeno = <strong>PDC-E2<\/strong> (mitocondrial). Transportador que falla = <strong>AE2<\/strong> (paraguas de bicarbonato). Los tratamientos inmunológicos <strong>no<\/strong> han demostrado beneficio; los que funcionan son <strong>anticolestásicos<\/strong>.<\/p><\/aside><div data-fp=\"cbp\" hidden><\/div><h5>Del mecanismo a la clínica<\/h5><div class=\"tbl\"><table><thead><tr><th>Mecanismo<\/th><th>Lo que ves<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Destrucción de los <strong>conductos biliares interlobulares pequeños<\/strong> (ductopenia)<\/th><td>Colestasis: <strong>FA y GGT altas<\/strong>; la bilirrubina sube hasta etapas avanzadas<\/td><\/tr><tr><th scope=\"row\">Ácidos biliares y autotaxina (ácido lisofosfatídico) retenidos<\/th><td><strong>Prurito<\/strong><\/td><\/tr><tr><th scope=\"row\">Llega menos bilis al intestino<\/th><td>Mala absorción de grasas y vitaminas A, D, E y K; osteoporosis<\/td><\/tr><tr><th scope=\"row\">Lípidos retenidos (lipoproteína X)<\/th><td>Hipercolesterolemia y xantelasmas<\/td><\/tr><tr><th scope=\"row\">Autoinmunidad contra PDC-E2<\/th><td><strong>AMA<\/strong> positivos (&gt;90 %) e <strong>IgM<\/strong> alta<\/td><\/tr><tr><th scope=\"row\">Colestasis crónica → fibrosis biliar<\/th><td>Cirrosis e hipertensión portal en etapas tardías<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Por qué funcionan los fármacos<\/span><\/div><p>El <strong>ácido ursodesoxicólico<\/strong> cambia la bilis por ácidos biliares hidrofílicos y menos tóxicos y ayuda a reconstruir el \"paraguas de bicarbonato\". El <strong>ácido obeticólico<\/strong> (agonista FXR) y los <strong>agonistas PPAR<\/strong> (fibratos, elafibranor, seladelpar) bajan la síntesis de ácidos biliares.<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Cuadro clínico","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>fatiga<\/strong> y el <strong>prurito<\/strong> no se correlacionan con la etapa: una paciente en etapa temprana puede tener prurito incapacitante.<\/p><\/aside>"},{"t":"Diagnóstico","h":"<aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">Diagnóstico sin biopsia<\/span><\/div><p><mark>AMA positivos (título &gt;1:40 por inmunofluorescencia) o ANA muy específicos de CBP<\/mark> + <strong>bioquímica colestásica<\/strong> (FA elevada) + <strong>sin otra explicación<\/strong> = diagnóstico de CBP. Interpretar siempre en el contexto clínico.<\/p><\/aside><figure class=\"fig\" data-fig=\"cbp-sero\"><svg viewBox=\"0 0 400 352\" role=\"img\" aria-label=\"Utilidad de las pruebas en CBP\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah17\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"10\" y=\"14\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"10\" dy=\"0\">Prueba<\/tspan><\/text><text x=\"215\" y=\"14\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"215\" dy=\"0\">Sospecha<\/tspan><\/text><text x=\"290\" y=\"14\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"290\" dy=\"0\">Diagnóstico<\/tspan><\/text><text x=\"360\" y=\"14\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"360\" dy=\"0\">Pronóstico<\/tspan><\/text><rect x=\"4\" y=\"30\" width=\"392\" height=\"20\" rx=\"4\" style=\"fill:#7A849A;fill-opacity:.08\"/><text x=\"10\" y=\"40\" font-size=\"11.5\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"
