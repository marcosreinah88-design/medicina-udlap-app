ng>moderada 5–15×<\/strong>, grave &gt;15× y masiva &gt;10,000 U/L."},{"q":"Paciente con ALT 70 U/L (LSN 35) y FA 480 U/L (LSN 120). El factor R es:","o":["0.5: colestásico","2.5: mixto","6: hepatocelular","12: hepatocelular"],"a":0,"e":"R = (70/35) ÷ (480/120) = 2 ÷ 4 = <strong>0.5<\/strong> → <strong>colestásico<\/strong> (&lt;2)."},{"q":"¿Cuál de estas NO es causa típica de patrón mixto según la revisión?","o":["DILI","Hepatitis alcohólica","Síndrome de Gilbert","Obstrucción biliar extrahepática","Hepatitis por CMV o VEB"],"a":2,"e":"Gilbert solo eleva la <strong>bilirrubina indirecta<\/strong>. El patrón mixto se ve en DILI, hepatitis alcohólica, obstrucción extrahepática, hepatitis viral aguda y superposición autoinmune."},{"q":"¿Dónde se localiza la FA hepática?","o":["Citosol del hepatocito","Membrana canalicular","Mitocondria","Células de Kupffer","Retículo endoplásmico liso"],"a":1,"e":"La FA está en la <strong>membrana canalicular<\/strong>; en la colestasis aumenta su síntesis y se libera al suero."},{"q":"Paciente con cirrosis e INR 1.9 que pregunta si está &quot;protegido&quot; de trombosis. ¿Qué es correcto?","o":["Sí, el INR alto anticoagula","El INR predice con precisión el sangrado","Debe recibir plasma antes de cualquier procedimiento","El INR prolongado no reduce el riesgo de trombosis ni predice sangrado","El INR mide solo el factor VIII"],"a":3,"e":"En la cirrosis, un INR prolongado <strong>no reduce el riesgo de trombosis<\/strong> ni <strong>predice hemorragia<\/strong>."},{"q":"La vida media de la albúmina es de alrededor de:","o":["47 horas","7 días","18 días","30 días","120 días"],"a":2,"e":"Albúmina ~<strong>18 días<\/strong>; cualquier enfermedad aguda puede acortarla."},{"q":"Mujer de 40 años con ALT 2× LSN en un chequeo. ¿Cuál es el primer paso recomendado?","o":["Biopsia hepática","CPRE","Tomografía de abdomen","Repetir el panel y suspender alcohol y hepatotóxicos","Iniciar ácido ursodesoxicólico"],"a":3,"e":"Antes de evaluar: <strong>repetir<\/strong> el panel (o prueba confirmatoria) y <strong>suspender<\/strong> hepatotóxicos y todo el alcohol."},{"q":"En la evaluación inicial de una transaminasemia leve, ¿qué estudios deben pedirse?","o":["Serología de VHB y VHC, ferritina y saturación de transferrina, y US","Solo ANA","Biopsia y CPRM","Ceruloplasmina y cobre urinario únicamente","PET-CT"],"a":0,"e":"Iniciales: <strong>VHB, VHC<\/strong> (ARN si anti-VHC +), <strong>perfil de hierro<\/strong> e imagen. ANA, ASMA, ceruloplasmina y α1-antitripsina pueden diferirse si la elevación es &lt;2× LSN."},{"q":"Mujer de 50 años con PFH alteradas sin hepatopatía previa que presenta asterixis y confusión. ¿Qué haces?","o":["Observación por 3 meses","Elastografía ambulatoria","Repetir PFH en 6 semanas","Iniciar estatina","Evaluar de inmediato falla hepática aguda y valorar traslado a centro de trasplante"],"a":4,"e":"Asterixis o alteración mental sin hepatopatía previa obligan a <strong>evaluar falla hepática aguda<\/strong> de inmediato y trasladar si procede (Figura 3)."},{"q":"Corredor de maratón con AST 310 y ALT 120 U/L un día después de la carrera, con dolor muscular. ¿Qué estudio aclara el cuadro?","o":["CK","Anti-VHC","US hepático","Ceruloplasmina","AMA"],"a":0,"e":"En lesión muscular, <strong>AST &gt; ALT al menos 2:1<\/strong> al inicio, con <strong>CK muy elevada<\/strong>."},{"q":"¿En qué porcentaje de pacientes con hipertiroidismo se alteran las PFH?","o":["55–60 %","5–10 %","15–25 %","90 %"],"a":0,"e":"El hipertiroidismo altera las PFH en <strong>55–60 %<\/strong>."},{"q":"Paciente de 72 años con MASLD y FIB-4 de 1.7. ¿Qué dato de la revisión aplica?","o":["FIB-4 es más preciso en ancianos","Debe usarse el corte 3.25","En &gt;65 años un corte de 2.0 mejora la exclusión de fibrosis avanzada","El FIB-4 no incluye la edad","Requiere biopsia obligatoria"],"a":2,"e":"FIB-4 es menos confiable en <strong>&lt;35 y &gt;65 años<\/strong>; en mayores de 65, el corte <strong>2.0<\/strong> mejora la exclusión."},{"q":"¿Cuál es la especificidad del APRI &gt;2 para cirrosis en hepatitis C?","o":["57 %","72 %","85 %","93 %","100 %"],"a":3,"e":"APRI <strong>&gt;2<\/strong>: sensibilidad <strong>57 %<\/strong>, especificidad <strong>93 %<\/strong> para cirrosis."},{"q":"¿Qué variables tiene el MELD original?","o":["Bilirrubina, albúmina y TP","Bilirrubina, creatinina e INR","Sodio, albúmina y sexo","Ascitis y encefalopatía","Edad, AST y plaquetas"],"a":1,"e":"MELD original: <strong>bilirrubina, creatinina e INR<\/strong>; MELD-Na añade sodio y MELD 3.0 sexo y albúmina."},{"q":"¿Cuál es una limitación del Child-Turcotte-Pugh señalada por la revisión?","o":["Efecto techo: bilirrubina de 4 y de 25 mg/dL reciben los mismos puntos","No incluye bilirrubina","Solo sirve en hepatitis C","Es completamente objetivo","Incluye creatinina"],"a":0,"e":"El CTP tiene <strong>efecto techo y piso<\/strong>, parámetros <strong>subjetivos<\/strong> (ascitis, encefalopatía) y mala correlación con la mortalidad."},{"q":"¿Qué inmunoglobulina se eleva clásicamente en la colangitis biliar primaria?","o":["IgM","IgA","IgG","IgE","IgG4"],"a":0,"e":"<strong>IgA<\/strong>–alcohol, <strong>IgM<\/strong>–CBP, <strong>IgG<\/strong>–HAI."},{"q":"¿Cuál es la causa más común de DILI idiosincrásica?","o":["Antimicrobianos","Estatinas","Suplementos herbolarios","Paracetamol","Anticonceptivos"],"a":0,"e":"Los <strong>antimicrobianos<\/strong> son la primera causa (siempre idiosincrásicos); los suplementos, la segunda."},{"q":"¿Qué ejemplo corresponde a DILI <strong>intrínseca<\/strong>?","o":["Amoxicilina-clavulanato","Paracetamol","Nitrofurantoína","Hepatitis por pembrolizumab","Fenitoína"],"a":1,"e":"La DILI intrínseca es <strong>dependiente de la dosis<\/strong>; el ejemplo clásico es el <strong>paracetamol<\/strong>."},{"q":"Paciente en UCI tras choque séptico: AST 4,500 U/L al día 1 que baja a 900 al día 3, DHL alta y creatinina en ascenso. ¿Diagnóstico?","o":["Hepatitis viral aguda","Colestasis de la sepsis","DILI colestásica","Hepatitis isquémica","Hepatopatía congestiva crónica"],"a":3,"e":"<strong>Hepatitis isquémica:<\/strong> ascenso y descenso rápidos de AST (&gt;ALT), DHL alta, bilirrubina tardía y lesión renal; mortalidad hospitalaria ~<strong>50 %<\/strong>."},{"q":"Paciente con melanoma en pembrolizumab: ALT 7× LSN en la semana 8. ¿Qué grado CTCAE tiene?","o":["Grado 1","Grado 2","Grado 3","Grado 4"],"a":2,"e":"CTCAE v5.0: G1 1–3×, G2 3–5×, <strong>G3 5–20×<\/strong>, G4 &gt;20× LSN. Los grados altos suelen requerir glucocorticoides."},{"q":"Embarazada de 30 semanas con hipertensión, ALT 210 U/L, DHL alta y plaquetas 62,000/μL. ¿Diagnóstico y manejo?","o":["Hígado graso agudo; observación","Colestasis del embarazo; ácido ursodesoxicólico","Hiperémesis; antieméticos","HELLP; corregir coagulopatía, magnesio y parto pronto","Hepatitis viral; aislamiento"],"a":3,"e":"<strong>HELLP<\/strong>: &gt;20 semanas (más 28–36), ALT/AST &gt;70, DHL alta, plaquetas bajas. Manejo: coagulopatía, <strong>magnesio<\/strong> y <strong>parto<\/strong>; PFH normales en 48–72 h."}],"tf":[["El INR se altera antes que la albúmina en la falla hepática aguda.",true,"El factor VII tiene vida media de ~6 h; la albúmina, de ~3 semanas."],["ALT, AST y FA son pruebas de función hepática en sentido estricto.",false,"Reflejan lesión; solo bilirrubina, TP y albúmina reflejan función."],["La mayor parte de la AST es citosólica.",false,"80 % es mitocondrial."],["Un cociente AST/ALT &gt;2 sugiere enfermedad hepática asociada al alcohol.",true,"Por déficit de piridoxina, que deprime más a la ALT."],["Un factor R de 1.5 indica lesión hepatocelular.",false,"R &lt;2 es colestásico."],["Un INR prolongado en la cirrosis protege contra la trombosis.",false,"No reduce el riesgo de trombosis ni predice sangrado."],["El PEth refleja consumo de alcohol en los últimos 30 días.",true,"Útil si se sospecha consumo oculto."],["En la enfermedad celíaca la AST suele superar a la ALT.",false,"Suele ser ALT &gt; AST."],["El FIB-4 es igual de confiable a cualquier edad.",false,"Es menos confiable en &lt;35 y &gt;65 años; en &gt;65 se usa 2.0."],["Una Maddrey &gt;32 identifica hepatitis alcohólica grave.",true,"Mortalidad a 30 días &gt;50 %."],["La hepatitis isquémica en la UCI tiene buen pronóstico.",false,"Mortalidad hospitalaria estimada de 50 %."]]},{"id":"virales","n":2,"title":"Hepatitis virales de la A a la E","short":"Hepatitis virales","color":"#D3335B","src":"Castaneda D, Gonzalez AJ, Alomari M, Tandon K, Zervos XB. From hepatitis A to E: a critical review of viral hepatitis. World J Gastroenterol. 2021;27(16):1691-1715.","hook":"Cinco virus, dos rutas: la A y la E entran por la boca y casi siempre se curan solas; la B, la C y la D entran por la sangre y pueden quedarse años hasta llevar a cirrosis y cáncer. Saber leer la serología del VHB es la mitad del examen.","group":"Hígado","ses":18,"date":"2026-10-19","nums":[["257 millones","con infección crónica por VHB en el mundo (2015)"],["&gt;71 millones","de personas infectadas por VHC"],["50–85 %","de las infecciones por VHC se vuelven crónicas"],["6 meses","ALT o HBsAg más allá de este plazo = VHB crónico; ARN-VHC ≥6 meses = VHC crónico"],["12 semanas","sin virus en sangre tras terminar el tratamiento = respuesta viral sostenida (RVS) del VHC"],["10.58 %","de los portadores de HBsAg tienen coinfección por VHD"]],"esencial":"<h3>Las cinco en 14 viñetas<\/h3><ul><li><strong>VHA y VHE<\/strong>: transmisión <strong>fecal-oral<\/strong>, cuadro agudo <strong>autolimitado<\/strong>, tratamiento <strong>de sostén<\/strong>. La A <strong>no se cronifica<\/strong>; la E solo en <strong>inmunosuprimidos<\/strong> (genotipos <strong>3 y 4<\/strong>).<\/li><li><strong>VHB, VHC y VHD<\/strong>: transmisión <strong>parenteral<\/strong> (sangre, sexo, trasplante, perinatal). Pueden cronificarse y llevar a <strong>cirrosis<\/strong> y <strong>carcinoma hepatocelular (CHC)<\/strong>.<\/li><li><strong>VHA<\/strong>: incubación <strong>2–4 semanas<\/strong>; diagnóstico con <strong>IgM anti-VHA<\/strong> (positiva hasta ~4 meses). Falla hepática aguda en <strong>&lt;1 %<\/strong>. Recaída en <strong>10–15 %<\/strong> dentro de 6 meses.<\/li><li><strong>VHB<\/strong>: virus <strong>ADN de doble cadena<\/strong> (Hepadnaviridae); el <strong>cccDNA<\/strong> persiste en el núcleo y explica la <strong>reactivación<\/strong>.<\/li><li><strong>VHB agudo<\/strong> = <strong>HBsAg + anti-HBc IgM<\/strong>. Si la ALT sigue alta <strong>más de 6 meses<\/strong>, ya es <strong>crónico<\/strong>.<\/li><li><strong>Periodo de ventana<\/strong>: el único marcador positivo es <strong>anti-HBc IgM<\/strong>.<\/li><li><strong>Curado<\/strong>: anti-HBc IgG + anti-HBs. <strong>Vacunado<\/strong>: solo <strong>anti-HBs<\/strong>. <strong>Crónico<\/strong>: HBsAg persiste sin anti-HBs.<\/li><li><strong>Fases crónicas del VHB<\/strong>: inmunotolerante → inmunoeliminación (ALT ≥5× LSN) → control inmune (HBeAg − / anti-HBe +) ⇄ inmune activa (reactivación).<\/li><li><strong>Primera línea VHB<\/strong>: <strong>entecavir, tenofovir disoproxil (fumarato) o tenofovir alafenamida<\/strong> por su <strong>alta barrera genética<\/strong>.<\/li><li><strong>VHC<\/strong>: ARN, Flaviviridae; <strong>genotipo 1<\/strong> es el más común (la mitad). Crónico en <strong>50–85 %<\/strong>; cirrosis en <strong>16 % a 20 años<\/strong>.<\/li><li><strong>Diagnóstico de VHC<\/strong>: anti-VHC (EIA) → <strong>ARN-VHC<\/strong> confirma. <mark>Anticuerpo + ARN + no distingue agudo de crónico.<\/mark><\/li><li><strong>Tratamiento VHC<\/strong>: AAD; <strong>pangenotípicos: sofosbuvir/velpatasvir y glecaprevir/pibrentasvir<\/strong>. Meta: <strong>RVS a 12 semanas<\/strong>.<\/li><li><strong>VHD<\/strong>: virus <strong>defectuoso<\/strong> que necesita al VHB. <strong>Coinfección<\/strong> → casi siempre autolimitada; <strong>sobreinfección<\/strong> de un portador crónico → curso <strong>prolongado<\/strong>. Solo el <strong>interferón<\/strong> tiene beneficio probado.<\/li><li><strong>VHE<\/strong>: causa más común de hepatitis viral aguda y de falla hepática aguda (<strong>hasta 44 %<\/strong>) en India y Bangladesh; la falla hepática es más probable en <strong>embarazadas<\/strong>, desnutridos o con hepatopatía previa.<\/li><\/ul><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La pregunta favorita es <strong>leer un panel de serología del VHB<\/strong>. Memoriza los cinco patrones (aguda, ventana, resuelta, crónica, vacunado) y que <strong>HBeAg, DNA y ALT<\/strong> definen la fase de la crónica.<\/p><\/aside>","secs":[{"t":"Las cinco de un vistazo","h":"<figure class=\"fig\" data-fig=\"virales-panorama\"><svg viewBox=\"0 0 400 290\" role=\"img\" aria-label=\"Hepatitis virales por vía de transmisión\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"8\" y=\"8\" width=\"180\" height=\"34\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"98\" y=\"25\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"98\" dy=\"0\">Fecal-oral<\/tspan><\/text><rect x=\"212\" y=\"8\" width=\"180\" height=\"34\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"302\" y=\"17.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"302\" dy=\"0\">Parenteral, sexual,<\/tspan><tspan x=\"302\" dy=\"14.64\">perinatal<\/tspan><\/text><rect x=\"8\" y=\"52\" width=\"180\" height=\"74\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"98\" y=\"74.97\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"98\" dy=\"0\">VHA · ARN · incubación 2–4<\/tspan><tspan x=\"98\" dy=\"14.03\">sem · no se cronifica · IgM<\/tspan><tspan x=\"98\" dy=\"14.03\">anti-VHA<\/tspan><\/text><rect x=\"8\" y=\"134\" width=\"180\" height=\"92\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"98\" y=\"158.955\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"98\" dy=\"0\">VHE · ARN · incubación 2–10<\/tspan><tspan x=\"98\" dy=\"14.03\">sem · crónica solo en<\/tspan><tspan x=\"98\" dy=\"14.03\">inmunosuprimidos (G3, G4) ·<\/tspan><tspan x=\"98\" dy=\"14.03\">grave en embarazo<\/tspan><\/text><rect x=\"212\" y=\"52\" width=\"180\" height=\"56\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"302\" y=\"72.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"302\" dy=\"0\">VHB · ADN · cccDNA · HBsAg<\/tspan><tspan x=\"302\" dy=\"14.03\">y anti-HBc<\/tspan><\/text><rect x=\"212\" y=\"114\" width=\"180\" height=\"56\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"302\" y=\"134.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"302\" dy=\"0\">VHC · ARN · crónico 50–85 %<\/tspan><tspan x=\"302\" dy=\"14.03\">· ARN-VHC<\/tspan><\/text><rect x=\"212\" y=\"176\" width=\"180\" height=\"50\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"302\" y=\"193.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"302\" dy=\"0\">VHD · defectuoso · necesita<\/tspan><tspan x=\"302\" dy=\"14.03\">VHB<\/tspan><\/text><rect x=\"8\" y=\"236\" width=\"180\" height=\"44\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"98\" y=\"251.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"98\" dy=\"0\">Tratamiento de sostén; agua<\/tspan><tspan x=\"98\" dy=\"13.42\">e higiene<\/tspan><\/text><rect x=\"212\" y=\"236\" width=\"180\" height=\"44\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"302\" y=\"258\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"302\" dy=\"0\">Riesgo de cirrosis y CHC<\/tspan><\/text><\/svg><figcaption>Las <strong>vocales<\/strong> (A y E) entran por la boca y se autolimitan; las <strong>consonantes<\/strong> (B, C, D) van por la sangre y se cronifican.<\/figcaption><\/figure><div class=\"tbl\"><table><thead><tr><th><\/th><th>VHA<\/th><th>VHB<\/th><th>VHC<\/th><th>VHD<\/th><th>VHE<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Genoma<\/th><td>ARN (picornavirus)<\/td><td><strong>ADN doble cadena<\/strong> (Hepadnaviridae)<\/td><td>ARN monocatenario positivo (Flaviviridae, <em>Hepacivirus<\/em>)<\/td><td>ARN monocatenario, <strong>defectuoso<\/strong><\/td><td>ARN monocatenario (Hepeviridae, <em>Hepevirus<\/em>)<\/td><\/tr><tr><th scope=\"row\">Descubrimiento<\/th><td>1973 (Feinstone, partícula de 27 nm)<\/td><td>1963 (antígeno Australia)<\/td><td>1989<\/td><td>1977 (Rizzetto, Italia)<\/td><td>Primera epidemia: 1955, Nueva Delhi<\/td><\/tr><tr><th scope=\"row\">Transmisión<\/th><td>Fecal-oral<\/td><td>Parenteral, sexual, vertical, trasplante<\/td><td>Percutánea y no percutánea<\/td><td>Parenteral (inóculo mínimo)<\/td><td>Fecal-oral (G3 y G4 zoonóticos)<\/td><\/tr><tr><th scope=\"row\">Incubación<\/th><td><strong>2–4 semanas<\/strong><\/td><td>1–6 meses†<\/td><td>Síntomas <strong>2–26 semanas<\/strong> tras la exposición<\/td><td>Similar a VHB†<\/td><td><strong>2–10 semanas<\/strong><\/td><\/tr><tr><th scope=\"row\">Cronicidad<\/th><td><strong>No<\/strong> (recaída 10–15 %)<\/td><td>Sí; más si se adquiere de pequeño<\/td><td><strong>50–85 %<\/strong><\/td><td>Sí, sobre todo en sobreinfección<\/td><td>Solo en <strong>inmunosuprimidos<\/strong> (G3 y G4)<\/td><\/tr><tr><th scope=\"row\">Diagnóstico<\/th><td><strong>IgM anti-VHA<\/strong><\/td><td>HBsAg + anti-HBc IgM (agudo)<\/td><td>Anti-VHC → <strong>ARN-VHC<\/strong><\/td><td>Anti-VHD total → <strong>ARN-VHD<\/strong><\/td><td><strong>IgM anti-VHE<\/strong> → ARN-VHE<\/td><\/tr><tr><th scope=\"row\">Tratamiento<\/th><td>Sostén<\/td><td>ETV, TDF o TAF; PEG-IFN<\/td><td><strong>AAD<\/strong> (RVS 12 semanas)<\/td><td><strong>PEG-IFN<\/strong> (RVS ≤25 %)<\/td><td>Sostén; <strong>ribavirina<\/strong> en crónica<\/td><\/tr><tr><th scope=\"row\">Vacuna<\/th><td>Inactivada (2–3 dosis)<\/td><td>Recombinante (3 dosis) o con adyuvante (2 dosis)<\/td><td><strong>No hay<\/strong><\/td><td>La del <strong>VHB<\/strong><\/td><td>Recombinante solo en <strong>China<\/strong> (2011)<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-mnemo\"><div class=\"callout-h\"><span class=\"callout-k\">Mnemotecnia<\/span><span class=\"callout-t\">Las vocales van por la boca<\/span><\/div><p><strong>A<\/strong> y <strong>E<\/strong> (vocales) entran por la boca (fecal-oral) y se curan solas. <strong>B, C y D<\/strong> (consonantes) van por la sangre y se cronifican.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La <strong>D<\/strong> no existe sin la <strong>B<\/strong>: vacunar contra el VHB es la medida más <strong>costo-efectiva<\/strong> para prevenir la D.<\/p><\/aside>"},{"t":"Fisiopatología: cómo dañan el hígado los virus","h":"<div data-fp=\"virales\" hidden><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">El daño lo hace tu sistema inmune<\/span><\/div><p>Los virus de la hepatitis A, B y C casi <strong>no matan al hepatocito por sí mismos<\/strong> (no son citopáticos). El daño lo causan los <strong>linfocitos T CD8+<\/strong> y las células NK que atacan a los hepatocitos infectados. Por eso la fuerza de la respuesta inmune decide si la infección se cura, se vuelve crónica o se vuelve fulminante.<\/p><\/aside><figure class=\"fig\" data-fig=\"virales-fp\"><svg viewBox=\"0 0 400 354.7\" role=\"img\" aria-label=\"Del virus a la hepatitis aguda o crónica\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ahfp-virales\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"50\" y=\"6\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"23.05\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">El virus entra al hepatocito y se replica<\/tspan><tspan x=\"200\" dy=\"14.03\">(poco o nada citopático)<\/tspan><\/text><path d=\"M200 52.06 L200 74.06\" class=\"fx-arr\" marker-end=\"url(#ahfp-virales)\"/><rect x=\"50\" y=\"74.06\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#3B7DD8;fill-opacity:0.13;stroke:#3B7DD8;stroke-width:1.5\"/><text x=\"200\" y=\"91.11\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">El hepatocito presenta péptidos virales en<\/tspan><tspan x=\"200\" dy=\"14.03\">MHC I<\/tspan><\/text><path d=\"M200 120.12 L200 142.12\" class=\"fx-arr\" marker-end=\"url(#ahfp-virales)\"/><rect x=\"50\" y=\"142.12\" width=\"300\" height=\"46.06\" rx=\"9\" style=\"fill:#EF7B1A;fill-opacity:0.13;stroke:#EF7B1A;stroke-width:1.5\"/><text x=\"200\" y=\"159.17\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">CD8+ y NK lo destruyen: apoptosis y necrosis →<\/tspan><tspan x=\"200\" dy=\"14.03\">↑ ALT<\/tspan><\/text><path d=\"M200 188.18 V199.18 H101 V210.18\" class=\"fx-arr\" marker-end=\"url(#ahfp-virales)\"/><path d=\"M200 188.18 V199.18 H299 V210.18\" class=\"fx-arr\" marker-end=\"url(#ahfp-virales)\"/><rect x=\"6\" y=\"210.18\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"101\" y=\"226.88\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">Respuesta fuerte y amplia:<\/tspan><tspan x=\"101\" dy=\"13.42\">elimina el virus (hepatitis<\/tspan><tspan x=\"101\" dy=\"13.42\">aguda que se cura)<\/tspan><\/text><rect x=\"204\" y=\"210.18\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"299\" y=\"226.88\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Respuesta débil o tolerante:<\/tspan><tspan x=\"299\" dy=\"13.42\">el virus persiste (infección<\/tspan><tspan x=\"299\" dy=\"13.42\">crónica)<\/tspan><\/text><path d=\"M101 268.44 L101 290.44\" class=\"fx-arr\" marker-end=\"url(#ahfp-virales)\"/><path d=\"M299 268.44 L299 290.44\" class=\"fx-arr\" marker-end=\"url(#ahfp-virales)\"/><rect x=\"6\" y=\"290.44\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#2E9E5B;fill-opacity:0.13;stroke:#2E9E5B;stroke-width:1.5\"/><text x=\"101\" y=\"313.85\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"101\" dy=\"0\">Si es excesiva: necrosis<\/tspan><tspan x=\"101\" dy=\"13.42\">masiva = hepatitis fulminante<\/tspan><\/text><rect x=\"204\" y=\"290.44\" width=\"190\" height=\"58.26\" rx=\"9\" style=\"fill:#C0392B;fill-opacity:0.13;stroke:#C0392B;stroke-width:1.5\"/><text x=\"299\" y=\"307.14\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"299\" dy=\"0\">Inflamación persistente →<\/tspan><tspan x=\"299\" dy=\"13.42\">fibrosis → cirrosis →<\/tspan><tspan x=\"299\" dy=\"13.42\">carcinoma hepatocelular<\/tspan><\/text><\/svg><figcaption>La edad al contagio pesa mucho en la hepatitis B: el sistema inmune del recién nacido es tolerante, por eso ~90 % se vuelven crónicos, contra &lt;5 % de los adultos.<\/figcaption><\/figure><h5>Cada virus, su truco<\/h5><div class=\"tbl\"><table><thead><tr><th>Virus<\/th><th>Mecanismo clave<\/th><th>¿Se cronifica?<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>A<\/strong> (ARN)<\/th><td>Entra por vía fecal-oral, se replica en el hepatocito y sale a la bilis y las heces. Daño inmune (CD8+, NK).<\/td><td>No<\/td><\/tr><tr><th scope=\"row\"><strong>B<\/strong> (ADN)<\/th><td>Su ADN forma <strong>cccDNA<\/strong> en el núcleo y además se <strong>integra<\/strong> al genoma; la proteína HBx favorece el cáncer.<\/td><td>Sí: ~90 % neonatos, 20–50 % niños pequeños, &lt;5 % adultos<\/td><\/tr><tr><th scope=\"row\"><strong>C<\/strong> (ARN)<\/th><td>Muta muy rápido (<strong>cuasiespecies<\/strong>) y escapa a los anticuerpos; altera el metabolismo de lípidos y glucosa (esteatosis, resistencia a la insulina).<\/td><td>Sí: la mayoría (~75–85 %)<\/td><\/tr><tr><th scope=\"row\"><strong>D<\/strong> (ARN defectuoso)<\/th><td>Necesita el <strong>HBsAg<\/strong> del VHB para armarse; agrava la hepatitis B.<\/td><td>Coinfección: rara. Sobreinfección: casi siempre<\/td><\/tr><tr><th scope=\"row\"><strong>E<\/strong> (ARN)<\/th><td>Fecal-oral; más grave en el <strong>embarazo<\/strong> (3er trimestre).<\/td><td>Solo en inmunosuprimidos (genotipo 3)<\/td><\/tr><\/tbody><\/table><\/div><h5>Por qué el VHB da cáncer aun sin cirrosis<\/h5><p>La integración del ADN viral y la proteína <strong>HBx<\/strong> alteran genes que controlan el ciclo celular. El VHC, en cambio, casi siempre necesita llegar a <strong>cirrosis<\/strong> antes del carcinoma.<\/p><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>La hepatitis fulminante no se debe a \"más virus\", sino a una <strong>respuesta inmune demasiado intensa<\/strong>: muchas veces la carga viral ya es baja cuando el paciente está más grave.<\/p><\/aside><p class=\"fp-nota\"><small>† Fisiopatología agregada como complemento al artículo de la clase.<\/small><\/p>"},{"t":"Hepatitis A: epidemiología y patogenia","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El daño hepático del VHA es <strong>inmunomediado<\/strong> (CD8+ y NK). El virus se elimina por <strong>heces<\/strong> gracias al ciclo enterohepático.<\/p><\/aside>"},{"t":"Hepatitis A: clínica, diagnóstico y prevención","h":"<aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">Falla hepática aguda por VHA<\/span><\/div><ul><li>Factores de riesgo: <strong>edad avanzada<\/strong>, <strong>hepatopatía previa<\/strong> y <strong>hepatitis viral crónica<\/strong>.<\/li><li>Predictores de mortalidad: <strong>creatinina &gt;2 mg/dL (el más fuerte)<\/strong>, <strong>bilirrubina total &gt;9.6 mg/dL<\/strong> y <strong>albúmina &lt;2.5<\/strong> (el artículo la reporta en g/L).<\/li><li>Ocurre en <strong>&lt;1 %<\/strong>; de ellos, solo <strong>31 %<\/strong> requiere <strong>trasplante urgente<\/strong>, el resto se recupera con manejo de sostén.<\/li><\/ul><\/aside><h5>Tabla 1. A quién vacunar contra VHA (CDC)<\/h5><div class=\"tbl\"><table><thead><tr><th>Grupo<\/th><th>Quiénes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Niños<\/th><td><strong>12–23 meses<\/strong>; 2–18 años no vacunados (puesta al día)<\/td><\/tr><tr><th scope=\"row\">Alto riesgo de infección<\/th><td>Viajeros internacionales, <strong>HSH<\/strong>, usuarios de drogas, riesgo ocupacional, contacto cercano con un niño adoptado del extranjero, personas en <strong>situación de calle<\/strong><\/td><\/tr><tr><th scope=\"row\">Alto riesgo de hepatitis A grave<\/th><td><strong>Hepatopatía crónica<\/strong>, <strong>VIH<\/strong><\/td><\/tr><tr><th scope=\"row\">Otros<\/th><td>Embarazadas en riesgo, cualquiera que la solicite<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li>Profilaxis posexposición: <strong>vacuna<\/strong> de <strong>12 meses a 40 años<\/strong>; <strong>inmunoglobulina<\/strong> en <strong>&lt;12 meses<\/strong>.<\/li><li>Creatinina <strong>&gt;2 mg/dL<\/strong> es el <strong>predictor más fuerte<\/strong> de muerte en la falla hepática por VHA.<\/li><\/ul><\/aside>"},{"t":"Hepatitis B: epidemiología y patogenia","h":"<h5>Las proteínas que se miden<\/h5><div class=\"tbl\"><table><thead><tr><th>Proteína<\/th><th>Qué es<\/th><th>Utilidad<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>HBsAg<\/strong><\/th><td>Antígeno de superficie<\/td><td>Marca infección (aguda o crónica)<\/td><\/tr><tr><th scope=\"row\"><strong>HBcAg<\/strong><\/th><td>Antígeno del core (cápside)<\/td><td>No circula†; se mide su anticuerpo (anti-HBc)<\/td><\/tr><tr><th scope=\"row\"><strong>HBeAg<\/strong><\/th><td>Antígeno e (proteína de cápside)<\/td><td>Replicación activa; define la fase<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-clave\"><div class=\"callout-h\"><span class=\"callout-k\">Concepto clave<\/span><span class=\"callout-t\">cccDNA = por qué el VHB no se &quot;cura&quot;<\/span><\/div><p>El cccDNA persiste en el núcleo del hepatocito: por eso un paciente con enfermedad <strong>inactiva<\/strong> puede <strong>reactivarse<\/strong> con inmunosupresión.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>El VHB es el <strong>único virus ADN<\/strong> de las hepatitis A–E y usa <strong>transcriptasa inversa<\/strong> (blanco de los análogos de nucleós(t)idos).<\/p><\/aside>"},{"t":"Hepatitis B: aguda y fases de la crónica","h":"<figure class=\"fig\" data-fig=\"virales-fases\"><svg viewBox=\"0 0 400 304\" role=\"img\" aria-label=\"Fases de la hepatitis B crónica\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"10\" y=\"8\" width=\"380\" height=\"60\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"20\" y=\"38\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"20\" dy=\"0\">1. Inmunotolerante<\/tspan><\/text><text x=\"150\" y=\"31.29\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"150\" dy=\"0\">HBeAg + · DNA muy alto · ALT normal ·<\/tspan><tspan x=\"150\" dy=\"13.42\">sin inflamación<\/tspan><\/text><rect x=\"10\" y=\"84\" width=\"380\" height=\"60\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"20\" y=\"106.68\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"20\" dy=\"0\">2.<\/tspan><tspan x=\"20\" dy=\"14.64\">Inmunoeliminación<\/tspan><\/text><text x=\"150\" y=\"107.29\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"150\" dy=\"0\">HBeAg + · ALT ≥5× LSN · DNA baja ·<\/tspan><tspan x=\"150\" dy=\"13.42\">inflamación, síntomas<\/tspan><\/text><rect x=\"10\" y=\"160\" width=\"380\" height=\"60\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"20\" y=\"190\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"20\" dy=\"0\">3. Control inmune<\/tspan><\/text><text x=\"150\" y=\"183.29\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"150\" dy=\"0\">HBeAg − / anti-HBe + · DNA indetectable<\/tspan><tspan x=\"150\" dy=\"13.42\">o bajo<\/tspan><\/text><rect x=\"10\" y=\"236\" width=\"380\" height=\"60\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"20\" y=\"266\" font-size=\"12\" text-anchor=\"start\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"20\" dy=\"0\">4. Inmune activa<\/tspan><\/text><text x=\"150\" y=\"259.29\" font-size=\"11\" text-anchor=\"start\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"150\" dy=\"0\">ALT y DNA suben (VHD, inmunosupresión)<\/tspan><tspan x=\"150\" dy=\"13.42\">· riesgo de falla hepática<\/tspan><\/text><path d=\"M70 68 L70 84\" class=\"fx-arr\" marker-end=\"url(#ah7)\"/><path d=\"M70 144 L70 160\" class=\"fx-arr\" marker-end=\"url(#ah7)\"/><path d=\"M60 220 L60 236\" class=\"fx-arr\" marker-end=\"url(#ah7)\"/><path d=\"M80 236 L80 220\" class=\"fx-arr\" marker-end=\"url(#ah7)\"/><\/svg><figcaption>Fases según el artículo. La <strong>seroconversión HBeAg → anti-HBe<\/strong> marca el paso a control inmune; la enfermedad puede <strong>fluctuar entre 3 y 4<\/strong>.<\/figcaption><\/figure><h5>Las 4 fases de la infección crónica (según el artículo)<\/h5><div class=\"tbl\"><table><thead><tr><th>Fase<\/th><th>HBeAg<\/th><th>DNA-VHB<\/th><th>ALT<\/th><th>Hígado y síntomas<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1. <strong>Inmunotolerante<\/strong><\/th><td><strong>+<\/strong><\/td><td><strong>Muy alto<\/strong><\/td><td><strong>Normal<\/strong><\/td><td>Sin inflamación; asintomático<\/td><\/tr><tr><th scope=\"row\">2. <strong>Inmunoeliminación<\/strong><\/th><td>+<\/td><td><strong>Disminuye<\/strong><\/td><td><strong>≥5× LSN<\/strong><\/td><td>Inflamación histológica; fatiga, ictericia, dolor en HCD<\/td><\/tr><tr><th scope=\"row\">3. <strong>Control inmune<\/strong><\/th><td><strong>−<\/strong> (anti-HBe +)<\/td><td><strong>Indetectable o bajo<\/strong><\/td><td>Normal†<\/td><td>Inactivo<\/td><\/tr><tr><th scope=\"row\">4. <strong>Inmune activa<\/strong> (reactivación)<\/th><td>−<\/td><td><strong>Sube<\/strong><\/td><td><strong>Sube<\/strong><\/td><td>Por <strong>sobreinfección por VHD<\/strong> o <strong>inmunosupresión<\/strong>; riesgo de <strong>falla hepática aguda<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li><strong>Inmunotolerante<\/strong>: DNA altísimo, HBeAg +, <strong>ALT normal<\/strong>.<\/li><li><strong>Seroconversión HBeAg → anti-HBe<\/strong> marca el paso a <strong>control inmune<\/strong>.<\/li><li>El VHB puede causar <strong>CHC sin cirrosis<\/strong>.<\/li><\/ul><\/aside>"},{"t":"Serología del VHB: cómo leerla","h":"<figure class=\"fig\" data-fig=\"virales-sero\"><svg viewBox=\"0 0 400 300\" role=\"img\" aria-label=\"Patrones serológicos del VHB\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><text x=\"158\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"158\" dy=\"0\">HBsAg<\/tspan><\/text><text x=\"218\" y=\"13.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"218\" dy=\"0\">anti-HBc<\/tspan><tspan x=\"218\" dy=\"13.42\">IgM<\/tspan><\/text><text x=\"278\" y=\"13.29\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"278\" dy=\"0\">anti-HBc<\/tspan><tspan x=\"278\" dy=\"13.42\">IgG<\/tspan><\/text><text x=\"338\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"338\" dy=\"0\">anti-HBs<\/tspan><\/text><rect x=\"6\" y=\"44\" width=\"110\" height=\"36\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"61\" y=\"62\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"61\" dy=\"0\">Aguda<\/tspan><\/text><rect x=\"134\" y=\"46\" width=\"48\" height=\"32\" rx=\"9\" style=\"fill:#16834A;fill-opacity:1;stroke:#16834A;stroke-width:1.5\"/><text x=\"158\" y=\"62\" font-size=\"16\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"158\" dy=\"0\">+<\/tspan><\/text><rect x=\"194\" y=\"46\" width=\"48\" height=\"32\" rx=\"9\" style=\"fill:#16834A;fill-opacity:1;stroke:#16834A;stroke-width:1.5\"/><text x=\"218\" y=\"62\" font-size=\"16\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" style=\"fill:#fff\" dominant-baseline=\"middle\"><tspan x=\"218\" dy=\"0\">+<\/tspan><\/text><rect x=\"254\" y=\"46\" width=\"48\" height=\"32\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"278\" y=\"62\" font-size=\"16\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"278\" dy=\"0\">±<\/tspan><\/text><rect x=\"314\" y=\"46\" width=\"48\" height=\"32\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"338\" y=\"62\" font-size=\"16\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"338\" dy=\"0\">−<\/tspan><\/text><rect x=\"6\" y=\"88\" width=\"110\" height=\"36\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"61\" y=\"106\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"61\" dy=\"0\">Ventana<\/tspan><\/text><rect x=\"134\" y=\"90\" w dy=\"0\">+<\/tspan><\/text><rect x=\"6\" y=\"268\" width=\"388\" height=\"26\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"281\" font-size=\"11\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">HBeAg, DNA-VHB y ALT definen la fase de la crónica<\/tspan><\/text><\/svg><figcaption><strong>Ventana<\/strong>: solo IgM anti-HBc. <strong>Vacunado<\/strong>: solo anti-HBs. <strong>Crónica<\/strong>: HBsAg más de 6 meses sin anti-HBs. ± = puede estar presente; IgM negativa en la crónica estable†.<\/figcaption><\/figure><h5>Los cinco patrones (el artículo)<\/h5><div class=\"tbl\"><table><thead><tr><th>Escenario<\/th><th>HBsAg<\/th><th>Anti-HBc IgM<\/th><th>Anti-HBc IgG<\/th><th>Anti-HBs<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Aguda<\/strong><\/th><td><strong>+<\/strong><\/td><td><strong>+<\/strong><\/td><td>±<\/td><td>−<\/td><\/tr><tr><th scope=\"row\"><strong>Periodo de ventana<\/strong><\/th><td>−<\/td><td><strong>+ (único marcador)<\/strong><\/td><td>±<\/td><td>−<\/td><\/tr><tr><th scope=\"row\"><strong>Infección resuelta<\/strong><\/th><td>−<\/td><td>−<\/td><td><strong>+<\/strong><\/td><td><strong>+<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Infección crónica<\/strong><\/th><td><strong>+ (persiste)<\/strong><\/td><td>−†<\/td><td><strong>+<\/strong><\/td><td><strong>−<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Vacunado<\/strong> sin exposición<\/th><td>−<\/td><td>−<\/td><td>−<\/td><td><strong>+ (único marcador)<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-mnemo\"><div class=\"callout-h\"><span class=\"callout-k\">Mnemotecnia<\/span><span class=\"callout-t\">Lee el panel en este orden<\/span><\/div><ol><li><strong>HBsAg<\/strong>: ¿hay infección ahora?<\/li><li><strong>Anti-HBc<\/strong>: ¿alguna vez tuvo contacto con el virus? (IgM = reciente)<\/li><li><strong>Anti-HBs<\/strong>: ¿está protegido? (sin anti-HBc = <strong>vacuna<\/strong>)<\/li><\/ol><\/aside><aside class=\"callout c-perla\"><div class=\"callout-h\"><span class=\"callout-k\">Perla clínica<\/span><span class=\"callout-t\">La vacuna solo deja anti-HBs<\/span><\/div><p>La vacuna contiene <strong>HBsAg recombinante<\/strong>: genera anti-HBs, <strong>nunca anti-HBc<\/strong>. Un anti-HBc positivo siempre significa <strong>contacto con el virus<\/strong>.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li><strong>HBsAg −, anti-HBs −, IgM anti-HBc +<\/strong> = <strong>ventana<\/strong>, no &quot;negativo&quot;.<\/li><li><strong>HBsAg +, anti-HBc IgG +, anti-HBs −<\/strong> por más de 6 meses = <strong>crónica<\/strong>.<\/li><li><strong>Anti-HBs aislado<\/strong> = <strong>vacunado<\/strong>.<\/li><\/ul><\/aside>"},{"t":"Hepatitis B: tratamiento, trasplante y vacunas","h":"<h5>Tabla 2. Criterios en la fase inmune activa<\/h5><div class=\"tbl\"><table><thead><tr><th>Criterio<\/th><th>AASLD<\/th><th>EASL<\/th><th>APASL<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">ALT<\/th><td><strong>≥2× LSN<\/strong> (LSN: hombres <strong>35<\/strong>, mujeres <strong>25<\/strong> U/L)<\/td><td><strong>&gt;1× LSN<\/strong> (40 U/L)<\/td><td><strong>&gt;2× LSN<\/strong> (40 U/L)<\/td><\/tr><tr><th scope=\"row\">DNA-VHB<\/th><td><strong>&gt;2000 UI/mL<\/strong> si HBeAg −; <strong>&gt;20 000 UI/mL<\/strong> si HBeAg +<\/td><td><strong>&gt;2000 UI/mL<\/strong> sin importar el HBeAg<\/td><td>&gt;2000 UI/mL si HBeAg −; &gt;20 000 UI/mL si HBeAg +<\/td><\/tr><tr><th scope=\"row\">Fibrosis o inflamación<\/th><td>Biopsia con inflamación moderada a grave o fibrosis avanzada (<strong>F3–F4<\/strong>); elastografía o marcadores séricos con F3–F4<\/td><td>Biopsia, elastografía o pruebas no invasivas con fibrosis moderada a grave (<strong>F3–F4<\/strong>)<\/td><td>Biopsia con inflamación moderada a grave o F3–F4; FibroScan o marcadores séricos con F3–F4<\/td><\/tr><\/tbody><\/table><\/div><h5>Lo que viene (cura funcional)<\/h5><div class=\"tbl\"><table><thead><tr><th>Blanco<\/th><th>Ejemplos y resultados<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Entrada (receptor <strong>NTCP<\/strong>)<\/th><td><strong>Bulevirtida<\/strong>: segura hasta 20 mg (fase 1, 36 sanos); fase 2b en 60 pacientes VHB/VHD: más descenso o pérdida de HBsAg con la combinación con PEG-IFN. SCY450 y SCY995 (derivados de ciclosporina)<\/td><\/tr><tr><th scope=\"row\">Ciclofilinas<\/th><td>Alisporivir, CRV431<\/td><\/tr><tr><th scope=\"row\">Ensamblaje de cápside<\/th><td>JNJ-6379, RO7049389 y GLS4 ya en fase 2–3<\/td><\/tr><tr><th scope=\"row\">ARN de interferencia<\/th><td>GSK3389404 (66 pacientes); <strong>JNJ-3989<\/strong>: descenso sostenido del HBsAg en <strong>56 %<\/strong> de 39<\/td><\/tr><tr><th scope=\"row\">Liberación de HBsAg<\/th><td><strong>REP 2139<\/strong> (+ PEG-IFN) en VHD; con REP 2165, tenofovir y PEG-IFN: cura funcional hasta <strong>40 %<\/strong> en HBeAg −<\/td><\/tr><tr><th scope=\"row\">Nuevos análogos<\/th><td><strong>Besifovir<\/strong> = tenofovir (supresión <strong>80.9 %<\/strong> contra <strong>84.9 %<\/strong>, 197 pacientes, 48 semanas)<\/td><\/tr><tr><th scope=\"row\">Inmunomodulación<\/th><td><strong>Nivolumab<\/strong> (anti-PD-1): baja el DNA pero solo 1 de 24 seroconvirtió el HBsAg; agonistas TLR-7 y TLR-8 sin efecto a corto plazo<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li>Primera línea: <strong>entecavir o tenofovir<\/strong> (alta barrera genética). La <strong>lamivudina<\/strong> ya no.<\/li><li><strong>Embarazo<\/strong> y <strong>profilaxis antes de inmunosupresión<\/strong> son indicaciones de tratamiento aun sin cumplir criterios de ALT.<\/li><\/ul><\/aside>"},{"t":"Hepatitis C: epidemiología, genotipos y patogenia","h":"<aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li>Genotipo más común en el mundo: <strong>1<\/strong>; el segundo: <strong>3<\/strong>.<\/li><li>El VHC <strong>no es citopático<\/strong>: el daño es inmune y metabólico (esteatosis y resistencia a la insulina).<\/li><\/ul><\/aside>"},{"t":"Hepatitis C: clínica e historia natural","h":"<h5>Manifestaciones extrahepáticas (hasta 38 %)<\/h5><div class=\"tbl\"><table><thead><tr><th>Sistema<\/th><th>Manifestación<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Hematológico<\/th><td><strong>Crioglobulinemia mixta esencial<\/strong>, <strong>linfoma<\/strong><\/td><\/tr><tr><th scope=\"row\">Renal<\/th><td><strong>Glomerulonefritis membranoproliferativa<\/strong>, crioglobulinemia<\/td><\/tr><tr><th scope=\"row\">Piel<\/th><td><strong>Porfiria cutánea tarda<\/strong>, <strong>liquen plano<\/strong><\/td><\/tr><tr><th scope=\"row\">Reumatológico<\/th><td>Artralgias, mialgias<\/td><\/tr><tr><th scope=\"row\">Neurológico<\/th><td>Neuropatía sensitiva o motora<\/td><\/tr><tr><th scope=\"row\">Autoinmune<\/th><td>Tiroiditis<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li>Lesión renal típica: <strong>GN membranoproliferativa<\/strong> (crioglobulinemia).<\/li><li>Lesión cutánea típica: <strong>porfiria cutánea tarda<\/strong>.<\/li><li>La carga viral <strong>no predice<\/strong> progresión de fibrosis.<\/li><\/ul><\/aside>"},{"t":"Hepatitis C: diagnóstico","h":"<h5>Las pruebas<\/h5><div class=\"tbl\"><table><thead><tr><th>Prueba<\/th><th>Qué detecta<\/th><th>Puntos clave<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>EIA de tercera generación<\/strong> (anti-VHC)<\/th><td>Anticuerpos contra core, NS3, NS4 y NS5<\/td><td>Desde <strong>8 semanas<\/strong>; S y E <strong>99 %<\/strong> a los <strong>2–6 meses<\/strong>; falsos negativos en <strong>hemodiálisis<\/strong> e <strong>inmunocomprometidos<\/strong>. Es <strong>indirecta<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>ARN-VHC cuantitativo<\/strong> (PCR)<\/th><td>Viremia<\/td><td>Detecta desde <strong>10–15 UI/mL<\/strong>; <strong>directa<\/strong><\/td><\/tr><tr><th scope=\"row\"><strong>Antígeno core del VHC<\/strong><\/th><td>Viremia<\/td><td>Alternativa al ARN, pero <strong>no sirve para vigilar<\/strong> la respuesta al tratamiento<\/td><\/tr><\/tbody><\/table><\/div><figure class=\"fig\" data-fig=\"virales-vhc-exp\"><svg viewBox=\"0 0 400 330\" role=\"img\" aria-label=\"Seguimiento tras exposición al VHC\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah9\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"60\" y=\"6\" width=\"280\" height=\"40\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"200\" y=\"18.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">En 48 h: ARN-VHC, anti-VHC y<\/tspan><tspan x=\"200\" dy=\"14.64\">aminotransferasas<\/tspan><\/text><path d=\"M200 46 L200 62\" class=\"fx-arr\" marker-end=\"url(#ah9)\"/><rect x=\"140\" y=\"62\" width=\"120\" height=\"30\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"200\" y=\"77\" font-size=\"13\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">¿ARN +?<\/tspan><\/text><path d=\"M150 92 V104 H100 V118\" class=\"fx-arr\" marker-end=\"url(#ah9)\"/><path d=\"M250 92 V104 H300 V118\" class=\"fx-arr\" marker-end=\"url(#ah9)\"/><text x=\"108\" y=\"112\" font-size=\"11\" text-anchor=\"start\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"108\" dy=\"0\">Sí<\/tspan><\/text><text x=\"292\" y=\"112\" font-size=\"11\" text-anchor=\"end\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"292\" dy=\"0\">No<\/tspan><\/text><rect x=\"8\" y=\"120\" width=\"184\" height=\"84\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"100\" y=\"140.955\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Infección confirmada.<\/tspan><tspan x=\"100\" dy=\"14.03\">Anti-VHC + = crónica<\/tspan><tspan x=\"100\" dy=\"14.03\">(previa); anti-VHC − =<\/tspan><tspan x=\"100\" dy=\"14.03\">aguda<\/tspan><\/text><rect x=\"208\" y=\"120\" width=\"184\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"140\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Repetir ARN a las 4 semanas<\/tspan><\/text><path d=\"M300 160 L300 180\" class=\"fx-arr\" marker-end=\"url(#ah9)\"/><g><rect x=\"311.6\" y=\"161\" width=\"24.8\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"324\" y=\"170.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"324\" dy=\"0\">− <\/tspan><\/text><\/g><rect x=\"208\" y=\"180\" width=\"184\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"200\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Repetir a las 12–16 semanas<\/tspan><\/text><path d=\"M300 220 L300 240\" class=\"fx-arr\" marker-end=\"url(#ah9)\"/><g><rect x=\"311.6\" y=\"221\" width=\"24.8\" height=\"18\" rx=\"9\" class=\"fx-pill\"/><text x=\"324\" y=\"230.5\" font-size=\"10.5\" text-anchor=\"middle\" class=\"fx-mut\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"324\" dy=\"0\">− <\/tspan><\/text><\/g><rect x=\"208\" y=\"240\" width=\"184\" height=\"40\" rx=\"9\" style=\"fill:#D99A00;fill-opacity:0.13;stroke:#D99A00;stroke-width:1.5\"/><text x=\"300\" y=\"252.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Última revisión a los 6<\/tspan><tspan x=\"300\" dy=\"14.03\">meses<\/tspan><\/text><rect x=\"8\" y=\"222\" width=\"184\" height=\"58\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"100\" y=\"243.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">ARN + en cualquier control<\/tspan><tspan x=\"100\" dy=\"14.03\">= hepatitis C aguda<\/tspan><\/text><rect x=\"8\" y=\"290\" width=\"384\" height=\"34\" rx=\"9\" style=\"fill:#7A849A;fill-opacity:0.13;stroke:#7A849A;stroke-width:1.5\"/><text x=\"200\" y=\"307\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Crónica = ARN-VHC + por al menos 6 meses<\/tspan><\/text><\/svg><figcaption>Protocolo de la revisión tras una <strong>exposición sospechada<\/strong> (por ejemplo, pinchazo).<\/figcaption><\/figure><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><p>En el <strong>paciente en hemodiálisis o inmunocomprometido<\/strong>, el anti-VHC puede ser <strong>falso negativo<\/strong>: pide <strong>ARN<\/strong>.<\/p><\/aside>"},{"t":"Hepatitis C: tratamiento, trasplante y tamizaje","h":"<h5>Antivirales de acción directa (AAD)<\/h5><div class=\"tbl\"><table><thead><tr><th>Blanco<\/th><th>Sufijo<\/th><th>Ejemplos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Proteasa <strong>NS3/NS4<\/strong><\/th><td><strong>-previr<\/strong><\/td><td>Boceprevir, telaprevir, simeprevir, paritaprevir, <strong>grazoprevir<\/strong>, <strong>glecaprevir<\/strong>, <strong>voxilaprevir<\/strong><\/td><\/tr><tr><th scope=\"row\">Proteína <strong>NS5A<\/strong><\/th><td><strong>-asvir<\/strong><\/td><td>Daclatasvir, <strong>ledipasvir<\/strong>, ombitasvir, <strong>elbasvir<\/strong>, <strong>velpatasvir<\/strong>, <strong>pibrentasvir<\/strong><\/td><\/tr><tr><th scope=\"row\">Polimerasa <strong>NS5B<\/strong><\/th><td><strong>-buvir<\/strong><\/td><td>Nucleótido: <strong>sofosbuvir<\/strong>; no nucleósido: dasabuvir<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">Dos contraindicaciones que se preguntan<\/span><\/div><ul><li><strong>Inhibidores de proteasa (-previr)<\/strong>: excreción <strong>hepática<\/strong> → <strong>contraindicados en Child-Pugh B y C<\/strong>.<\/li><li><strong>Sofosbuvir<\/strong>: excreción <strong>renal<\/strong> → evitar con <strong>TFGe &lt;30 mL/min/1.73 m²<\/strong>.<\/li><\/ul><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li>RVS = <strong>ARN indetectable 12 semanas después<\/strong> del fin del tratamiento.<\/li><li>Ribavirina: <strong>anemia hemolítica<\/strong> y <strong>teratogenia<\/strong>.<\/li><li>Cirrosis <strong>Child-Pugh B o C<\/strong>: <strong>no<\/strong> inhibidores de proteasa → sofosbuvir/velpatasvir.<\/li><\/ul><\/aside>"},{"t":"Hepatitis D (delta)","h":"<figure class=\"fig\" data-fig=\"virales-vhd\"><svg viewBox=\"0 0 400 270\" role=\"img\" aria-label=\"Coinfección contra sobreinfección por VHD\" class=\"fx\" style=\"max-width:580px\"><defs><marker id=\"ah10\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"fx-arrhead\"/><\/marker><\/defs><rect x=\"8\" y=\"8\" width=\"184\" height=\"50\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"25.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Coinfección: VHB agudo +<\/tspan><tspan x=\"100\" dy=\"14.64\">VHD al mismo tiempo<\/tspan><\/text><rect x=\"208\" y=\"8\" width=\"184\" height=\"50\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"25.68\" font-size=\"12\" text-anchor=\"middle\" class=\"fx-ink\" font-weight=\"700\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Sobreinfección: VHD en<\/tspan><tspan x=\"300\" dy=\"14.64\">portador crónico de VHB<\/tspan><\/text><path d=\"M100 58 L100 78\" class=\"fx-arr\" marker-end=\"url(#ah10)\"/><path d=\"M300 58 L300 78\" class=\"fx-arr\" marker-end=\"url(#ah10)\"/><rect x=\"8\" y=\"78\" width=\"184\" height=\"56\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"98.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Leve y autolimitada (menos<\/tspan><tspan x=\"100\" dy=\"14.03\">veces, aguda grave)<\/tspan><\/text><rect x=\"208\" y=\"78\" width=\"184\" height=\"56\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"91.97\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Curso prolongado; puede<\/tspan><tspan x=\"300\" dy=\"14.03\">disparar la fase inmune<\/tspan><tspan x=\"300\" dy=\"14.03\">activa<\/tspan><\/text><path d=\"M100 134 L100 154\" class=\"fx-arr\" marker-end=\"url(#ah10)\"/><path d=\"M300 134 L300 154\" class=\"fx-arr\" marker-end=\"url(#ah10)\"/><rect x=\"8\" y=\"154\" width=\"184\" height=\"44\" rx=\"9\" style=\"fill:#16834A;fill-opacity:0.13;stroke:#16834A;stroke-width:1.5\"/><text x=\"100\" y=\"168.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"100\" dy=\"0\">Resolución espontánea de<\/tspan><tspan x=\"100\" dy=\"14.03\">ambas<\/tspan><\/text><rect x=\"208\" y=\"154\" width=\"184\" height=\"44\" rx=\"9\" style=\"fill:#C8323B;fill-opacity:0.13;stroke:#C8323B;stroke-width:1.5\"/><text x=\"300\" y=\"168.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"300\" dy=\"0\">Cronicidad, cirrosis, falla<\/tspan><tspan x=\"300\" dy=\"14.03\">hepática<\/tspan><\/text><rect x=\"8\" y=\"212\" width=\"384\" height=\"50\" rx=\"9\" style=\"fill:#D3335B;fill-opacity:0.13;stroke:#D3335B;stroke-width:1.5\"/><text x=\"200\" y=\"229.985\" font-size=\"11.5\" text-anchor=\"middle\" class=\"fx-ink\" dominant-baseline=\"middle\"><tspan x=\"200\" dy=\"0\">Tamiza anti-VHD total en todo HBsAg +, confirma con ARN-VHD.<\/tspan><tspan x=\"200\" dy=\"14.03\">Prevención: vacuna contra VHB<\/tspan><\/text><\/svg><figcaption>El VHD es <strong>defectuoso<\/strong>: sin VHB no hay VHD. Más grave con <strong>genotipos 1 y 3<\/strong>, usuarios de drogas IV y mayores.<\/figcaption><\/figure><h5>Coinfección contra sobreinfección<\/h5><div class=\"tbl\"><table><thead><tr><th><\/th><th>Coinfección<\/th><th>Sobreinfección<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Qué es<\/th><td>VHB y VHD <strong>al mismo tiempo<\/strong><\/td><td>VHD en un <strong>portador crónico de VHB<\/strong><\/td><\/tr><tr><th scope=\"row\">Curso<\/th><td><strong>Leve y autolimitado<\/strong> (menos veces, hepatitis aguda grave)<\/td><td><strong>Prolongado<\/strong><\/td><\/tr><tr><th scope=\"row\">Desenlace<\/th><td><strong>Resolución espontánea de ambas<\/strong> infecciones<\/td><td>Cronicidad; puede detonar la <strong>fase inmune activa<\/strong> del VHB<\/td><\/tr><\/tbody><\/table><\/div><h5>Nuevos fármacos<\/h5><div class=\"tbl\"><table><thead><tr><th>Fármaco<\/th><th>Mecanismo<\/th><th>Lo importante<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>Lonafarnib<\/strong><\/th><td>Inhibe la <strong>prenilación<\/strong><\/td><td>Solo o con ritonavir o PEG-IFN; efectos adversos limitantes: náusea, diarrea, distensión, pérdida de peso<\/td><\/tr><tr><th scope=\"row\"><strong>Bulevirtida<\/strong><\/th><td>Inhibe la <strong>entrada<\/strong> (NTCP)<\/td><td>La mayoría bajó <strong>&gt;1 log10<\/strong> el ARN-VHD a 24 semanas; mejor combinada<\/td><\/tr><tr><th scope=\"row\"><strong>REP 2139<\/strong><\/th><td>Inhibe la <strong>secreción<\/strong> de viriones<\/td><td>Suprime carga viral, pero con <strong>elevaciones marcadas de ALT<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li><strong>Coinfección<\/strong> → casi siempre se <strong>resuelve<\/strong>. <strong>Sobreinfección<\/strong> → se <strong>cronifica<\/strong>.<\/li><li>Todo <strong>HBsAg +<\/strong> con hepatopatía que empeora: pide <strong>anti-VHD<\/strong>.<\/li><\/ul><\/aside>"},{"t":"Hepatitis E","h":"<h5>El virus<\/h5><div class=\"tbl\"><table><thead><tr><th>Genotipos<\/th><th>Huésped<\/th><th>Rasgos<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><strong>1 y 2<\/strong><\/th><td>Solo <strong>humanos<\/strong><\/td><td>Hepatitis aguda autolimitada; brotes por agua (fecal-oral)†<\/td><\/tr><tr><th scope=\"row\"><strong>3 y 4<\/strong><\/th><td><strong>Humanos y animales<\/strong> (zoonóticos)<\/td><td>Fecal-oral; pueden causar <strong>hepatitis crónica casi exclusivamente en inmunocomprometidos<\/strong><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout c-alerta\"><div class=\"callout-h\"><span class=\"callout-k\">Alerta<\/span><span class=\"callout-t\">Embarazo<\/span><\/div><p>La falla hepática por VHE es más probable en <strong>embarazadas<\/strong>; la mortalidad descrita llega a ~20–25 % en el tercer trimestre con genotipos 1 y 2†.<\/p><\/aside><aside class=\"callout c-ojo\"><div class=\"callout-h\"><span class=\"callout-k\">Ojo en el examen<\/span><\/div><ul><li><strong>Genotipos 3 y 4<\/strong> (zoonóticos, cerdo†) → <strong>cronicidad en trasplantados<\/strong>; tratamiento con <strong>ribavirina<\/strong>.<\/li><li><strong>Embarazada<\/strong> con hepatitis aguda tras viajar a India: piensa en <strong>VHE<\/strong>.<\/li><\/ul><\/aside>"}],"pearls":["A y E entran por la boca y no se cronifican en el inmunocompetente; B, C y D van por la sangre y sí se cronifican.","VHB agudo: HBsAg + y anti-HBc IgM +. Periodo de ventana: solo anti-HBc IgM.","Anti-HBs aislado = vacunado; anti-HBs + anti-HBc IgG = infección resuelta.","HBsAg sin anti-HBs por más de 6 meses = VHB crónico; HBeAg, DNA y ALT definen la fase.","Inmunotolerante: HBeAg +, DNA altísimo, ALT normal. Inmunoeliminación: ALT ≥5× LSN.","Primera línea del VHB: entecavir, tenofovir fumarato o tenofovir alafenamida (alta barrera genética).","El VHB causa CHC aun sin cirrosis; el genotipo C da más riesgo.","VHC: genotipo 1 es el más común; crónico en 50–85 %; cirrosis en 16 % a 20 años.","Anti-VHC + y ARN + confirma, pero no distingue aguda de crónica; crónica = ARN ≥6 meses.","RVS = sin virus 12 semanas tras terminar; pangenotípicos: sofosbuvir/velpatasvir y glecaprevir/pibrentasvir.","Inhibidores de proteasa contraindicados en Child-Pugh B y C; sofosbuvir se evita con TFGe &lt;30.","VHC extrahepático: crioglobulinemia, GN membranoproliferativa, porfiria cutánea tarda, liquen plano.","VHD: coinfección se resuelve, sobreinfección se cronifica; solo el interferón tiene beneficio probado.","VHE: hasta 44 % de la falla hepática aguda en India; más grave en embarazadas; crónica (G3, G4) en inmunosuprimidos → ribavirina.","VHA: IgM anti-VHA confirma; creatinina &gt;2 mg/dL es el peor predictor en falla hepática; profilaxis con vacuna de 12 meses a 40 años."],"comps":[{"title":"Hepatitis A contra hepatitis E","cols":["Hepatitis A","Hepatitis E"],"rows":[["Virus","Picornavirus, ARN (1973, partícula de 27 nm)","Hepeviridae, género <em>Hepevirus<\/em>, ARN monocatenario"],["Transmisión","Fecal-oral y <strong>persona a persona<\/strong>; brotes por alimentos (almejas, fresas congeladas)","Fecal-oral; G1 y G2 solo humanos, <strong>G3 y G4 zoonóticos<\/strong>"],["Incubación","<strong>2–4 semanas<\/strong>","<strong>2–10 semanas<\/strong>"],["Carga mundial","1.4 millones de casos al año","20 millones de infecciones al año, 3.3 millones sintomáticas"],["Cronicidad","<strong>Nunca<\/strong> (recaída 10–15 % en 6 meses)","Solo en <strong>inmunocomprometidos<\/strong> (G3 y G4)"],["Falla hepática aguda","<strong>&lt;1 %<\/strong>; peor en mayores y con hepatopatía","<strong>&lt;5 %<\/strong>; más en <strong>embarazadas<\/strong>, desnutridos o hepatopatía previa"],["Dónde pesa más","Brotes en usuarios de drogas, situación de calle y HSH","India y Bangladesh: <strong>hasta 44 %<\/strong> de la falla hepática aguda"],["Diagnóstico","<strong>IgM anti-VHA<\/strong>","<strong>IgM anti-VHE<\/strong> → ARN-VHE"],["Tratamiento","Sostén","Sostén; <strong>ribavirina 3 meses<\/strong> en crónica"],["Vacuna","Inactivada, <strong>2–3 dosis<\/strong>; universal a los 12–23 meses","Recombinante solo en <strong>China<\/strong> (2011)"],["Profilaxis posexposición","Vacuna (12 meses a 40 años); inmunoglobulina en &lt;12 meses","Inmunoglobulina experimental"]],"key":"Ambas son fecal-orales y autolimitadas. La <strong>E<\/strong> se diferencia por el <strong>embarazo<\/strong> (falla hepática), los <strong>genotipos zoonóticos 3 y 4<\/strong> que se cronifican en <strong>trasplantados<\/strong>, y su peso en <strong>India<\/strong>."},{"title":"Hepatitis B contra hepatitis C","cols":["Hepatitis B","Hepatitis C"],"rows":[["Virus","<strong>ADN<\/strong> doble cadena, Hepadnaviridae; <strong>cccDNA<\/strong>","<strong>ARN<\/strong> monocatenario positivo, Flaviviridae"],["Prevalencia","<strong>257 millones<\/strong> con infección crónica","<strong>&gt;71 millones<\/strong> infectados"],["Genotipos","10 (A–J); <strong>C<\/strong> con más riesgo de CHC","7; <strong>1<\/strong> el más común; <strong>1b<\/strong> más agresivo"],["Agudo","Subclínico lo más común; ALT 1000–2000; fulminante &lt;1 %","&gt;2/3 asintomático; ALT 10–20× LSN fluctuante; falla hepática extremadamente rara"],["Cronicidad","Mayor si se adquiere a <strong>menor edad<\/strong>","<strong>50–85 %<\/strong>"],["Definición de crónica","HBsAg o ALT elevada &gt;6 meses","ARN-VHC + ≥6 meses"],["Diagnóstico","HBsAg, anti-HBc, anti-HBs; HBeAg y DNA para la fase","Anti-VHC (EIA) → <strong>ARN-VHC<\/strong>"],["CHC","Puede aparecer <strong>sin cirrosis<\/strong>","Sobre todo con cirrosis: <strong>1.4–4.9 %/año<\/strong>"],["Tratamiento","<strong>Entecavir, TDF o TAF<\/strong> (supresión, rara vez cura); PEG-IFN","<strong>AAD<\/strong> curativos (RVS 12 semanas)"],["Meta","Suprimir DNA; seroconversión del HBsAg (cura funcional)","<strong>Erradicar<\/strong> el virus (RVS)"],["Vacuna","<strong>Sí<\/strong> (3 dosis o 2 con adyuvante)","<strong>No<\/strong>"],["Extrahepáticas","Indicación de tratamiento","Hasta <strong>38 %<\/strong>: crioglobulinemia, GN membranoproliferativa, porfiria cutánea tarda"]],"key":"La <strong>B<\/strong> tiene vacuna pero no cura fácil (cccDNA): se <strong>suprime<\/strong> con entecavir o tenofovir. La <strong>C<\/strong> no tiene vacuna pero se <strong>cura<\/strong> con AAD. La B puede dar <strong>CHC sin cirrosis<\/strong>."}],"algos":[{"title":"Interpretar la serología del VHB","src":"Secciones de diagnóstico y fases del VHB del artículo","start":"a","nodes":{"a":{"q":"¿El <strong>HBsAg<\/strong> es positivo?","i":"Empieza siempre por HBsAg: dice si hay infección <strong>ahora<\/strong>.","o":[["Positivo","b"],["Negativo","c"]]},"b":{"q":"¿La <strong>IgM anti-HBc<\/strong> es positiva?","i":"","o":[["Sí","aguda"],["No; anti-HBc IgG + y anti-HBs −","tiempo"]]},"aguda":{"end":1,"tone":"warn","text":"<strong>Hepatitis B aguda<\/strong> (HBsAg + e IgM anti-HBc +). ALT típica 1000–2000 UI/L; fulminante en <strong>&lt;1 %<\/strong>. Vigila: si la ALT o el HBsAg persisten <strong>más de 6 meses<\/strong>, es crónica."},"tiempo":{"q":"¿El HBsAg (o la ALT elevada) lleva <strong>más de 6 meses<\/strong>?","i":"","o":[["Sí","fase"],["No lo sé o menos de 6 meses","repite"]]},"repite":{"end":1,"tone":"warn","text":"<strong>Infección por VHB en curso<\/strong>: repite el HBsAg para confirmar persistencia a los <strong>6 meses<\/strong>."},"fase":{"q":"<strong>Hepatitis B crónica.<\/strong> Define la fase con <strong>HBeAg, DNA-VHB y ALT<\/strong>. ¿Qué patrón tiene?","i":"","o":[["HBeAg +, DNA muy alto, ALT normal","f1"],["HBeAg +, ALT ≥5× LSN, DNA en descenso","f2"],["HBeAg −, anti-HBe +, DNA indetectable o bajo","f3"],["HBeAg −, ALT y DNA en ascenso (VHD, inmunosupresión)","f4"]]},"f1":{"end":1,"tone":"ok","text":"<strong>Fase inmunotolerante<\/strong>: sin inflamación; asintomático. Trata si hay otra indicación (embarazo, familiar con CHC, cirrosis, profilaxis de inmunosupresión, coinfección)."},"f2":{"end":1,"tone":"bad","text":"<strong>Fase de inmunoeliminación<\/strong>: inflamación activa. Revisa los criterios de la <strong>Tabla 2<\/strong> (ALT, DNA &gt;20 000 UI/mL si HBeAg +, fibrosis F3–F4). Primera línea: <strong>entecavir, TDF o TAF<\/strong>."},"f3":{"end":1,"tone":"ok","text":"<strong>Fase de control inmune<\/strong>: seroconversión a anti-HBe. Vigilancia; puede reactivarse (fase 4) con inmunosupresión o VHD."},"f4":{"end":1,"tone":"bad","text":"<strong>Fase inmune activa (reactivación)<\/strong>: busca <strong>VHD<\/strong> (anti-VHD total) e inmunosupresión. Riesgo de falla hepática aguda. Trata si cumple Tabla 2 (DNA &gt;2000 UI/mL si HBeAg −)."},"c":{"q":"HBsAg negativo. ¿Qué muestran <strong>anti-HBc<\/strong> y <strong>anti-HBs<\/strong>?","i":"","o":[["IgM anti-HBc + y anti-HBs −","ventana"],["Anti-HBc IgG + y anti-HBs +","resuelta"],["Solo anti-HBs +","vacuna"],["Todo negativo","susc"]]},"ventana":{"end":1,"tone":"warn","text":"<strong>Periodo de ventana<\/strong>: el HBsAg ya se eliminó y aún no aparece anti-HBs. La IgM anti-HBc es el <strong>único marcador<\/strong>."},"resuelta":{"end":1,"tone":"ok","text":"<strong>Infección resuelta<\/strong> con inmunidad natural. El cccDNA puede persistir: riesgo de <strong>reactivación<\/strong> con inmunosupresión†."},"vacuna":{"end":1,"tone":"ok","text":"<strong>Vacunado<\/strong> sin exposición: solo anti-HBs (la vacuna es HBsAg recombinante)."},"susc":{"end":1,"tone":"warn","text":"<strong>Susceptible<\/strong>: nunca infectado ni vacunado. Ofrece <strong>vacuna<\/strong> (recombinante de 3 dosis o con adyuvante de 2 dosis)."}}},{"title":"Diagnóstico de hepatitis C","src":"Sección de diagnóstico del VHC del artículo","start":"a","nodes":{"a":{"q":"¿Cuál es el escenario?","i":"","o":[["Tamizaje o sospecha de VHC crónico","eia"],["Sospecha de hepatitis C aguda","agudo"],["Exposición reciente (pinchazo)","exp"]]},"eia":{"q":"<strong>Anti-VHC por EIA de tercera generación.<\/strong> ¿Resultado?","i":"S y E de 99 % a los 2–6 meses de la exposición. Falsos negativos en hemodiálisis e inmunocomprometidos.","o":[["Negativo, baja probabilidad previa","desc"],["Negativo, pero en hemodiálisis o inmunocomprometido","arn"],["Positivo","arn"]]},"desc":{"end":1,"tone":"ok","text":"<strong>VHC descartado<\/strong>: con baja probabilidad previa, un EIA negativo excluye la infección."},"arn":{"q":"Pide <strong>ARN-VHC cuantitativo<\/strong> (detecta desde 10–15 UI/mL). ¿Resultado?","i":"","o":[["Positivo","inf"],["Negativo","neg"]]},"inf":{"end":1,"tone":"bad","text":"<strong>Infección activa por VHC.<\/strong> Anticuerpo + y ARN + no distingue aguda de crónica; <strong>crónica = ARN + por ≥6 meses<\/strong>. Considera tratar con AAD (meta: RVS a 12 semanas)."},"neg":{"end":1,"tone":"ok","text":"<strong>Sin viremia<\/strong>: anticuerpo positivo por infección <strong>eliminada<\/strong> (15–45 % la eliminan espontáneamente) o tratada."},"agudo":{"end":1,"tone":"warn","text":"Pide <strong>anti-VHC y ARN-VHC<\/strong>: los anticuerpos tardan <strong>2–6 meses<\/strong>. Aguda si hubo prueba negativa en los 6 meses previos o si ARN y anticuerpo se negativizan en 6 meses."},"exp":{"q":"En <strong>48 h<\/strong>: ARN-VHC, anti-VHC y aminotransferasas. ¿El ARN basal es positivo?","i":"","o":[["Sí, con anti-VHC +","cronprev"],["Sí, con anti-VHC −","agudaexp"],["No","rep"]]},"cronprev":{"end":1,"tone":"bad","text":"<strong>Infección crónica previa<\/strong> a la exposición."},"agudaexp":{"end":1,"tone":"bad","text":"<strong>Hepatitis C aguda.<\/strong>"},"rep":{"q":"Repite el ARN a las <strong>4 semanas<\/strong>. ¿Resultado?","i":"","o":[["Positivo","agudaexp"],["Negativo","rep2"]]},"rep2":{"end":1,"tone":"ok","text":"Repite a las <strong>12–16 semanas<\/strong>; si sigue negativo, revisa <strong>una vez más a los 6 meses<\/strong>."}}}],"cards":[["¿Quién causa el daño hepático en las hepatitis A, B y C?","El sistema inmune: linfocitos T CD8+ y NK destruyen a los hepatocitos infectados. Los virus casi no son citopáticos."],["¿Por qué la hepatitis B neonatal se cronifica en ~90 %?","Porque el sistema inmune del recién nacido es tolerante al virus y no lo elimina; en adultos se cronifica &lt;5 %."],["VHA: familia y genoma","Picornavirus; virus ARN."],["Grupo afectado en los brotes de VHA en Europa (2016)","Hombres que tienen sexo con hombres."],["Incubación de la hepatitis A","2–4 semanas."],["Predictores de muerte en la falla hepática por VHA","Creatinina &gt;2 mg/dL (el más fuerte), bilirrubina &gt;9.6 mg/dL y albúmina &lt;2.5."],["Biopsia en hepatitis A","No se necesita. Si se hace: inflamación portal marcada, menos necrosis, Kupffer, cuerpos acidófilos."],["Duración de la inmunidad con 2 dosis de vacuna de VHA","Hasta 40 años en &gt;90 %."],["Genotipos del VHB","10 (A–J) y 35 subgenotipos."],["Enzima clave en la replicación del VHB","Transcriptasa inversa."],["Serología de la hepatitis B aguda","HBsAg + y anti-HBc IgM +."],["Serología de VHB crónico","HBsAg + persistente, anti-HBc IgG +, anti-HBs −."],["Fase inmune activa del VHB","ALT y DNA suben por VHD o inmunosupresión; riesgo de falla hepática."],["EASL: ALT y DNA para tratar VHB","ALT &gt;1× LSN (40 U/L) y DNA &gt;2000 UI/mL sin importar el HBeAg."],["Ventaja y desventaja del PEG-IFN en VHB","Más seroconversión del HBsAg; mala tolerancia."],["Prevalencia mundial del VHC","&gt;71 millones."],["VHC: familia y género","Flaviviridae, género Hepacivirus; ARN monocatenario positivo con envoltura."],["Hepatitis C aguda: tiempos","Síntomas 2–26 semanas tras exposición; duran 2–12 semanas."],["¿Predice la carga viral del VHC la cirrosis?","No."],["Límite de detección del ARN-VHC","10–15 UI/mL."],["¿Cuándo no tratar VHC?","Cirrosis descompensada en lista con MELD alto, embarazo, esperanza de vida &lt;12 meses."],["Inhibidores de proteasa del VHC en cirrosis","Contraindicados en Child-Pugh B y C (excreción hepática)."],["¿Por qué el VHD es defectuoso?","Necesita al VHB para expresarse y replicarse."],["¿A quién tamizar para VHD?","A todo HBsAg +, sobre todo si su hepatopatía empeora."],["Recurrencia de VHD postrasplante","13.4 %."],["Incubación del VHE","2–10 semanas."]],"mcq":[{"q":"Hombre de 26 años con fiebre, malestar e ictericia 3 semanas después de comer mariscos crudos. ALT 2400 U/L, AST 1600 U/L, bilirrubina 6 mg/dL, FA 210 U/L. ¿Qué prueba confirma el diagnóstico más probable?","o":["Anticuerpos totales anti-VHA","IgM anti-VHA","HBsAg","ARN-VHC","Ultrasonido hepático"],"a":1,"e":"Cuadro de <strong>hepatitis A<\/strong> (incubación 2–4 semanas, ALT &gt; AST, bilirrubina ≤10). El diagnóstico se confirma con <strong>IgM anti-VHA<\/strong>; los anticuerpos totales miden inmunidad."},{"q":"En la falla hepática aguda por VHA, ¿cuál es el predictor más fuerte de mortalidad?","o":["Bilirrubina &gt;9.6 mg/dL","Albúmina baja","ALT &gt;5000 U/L","Creatinina &gt;2 mg/dL","Edad &lt;40 años"],"a":3,"e":"<strong>Creatinina &gt;2 mg/dL<\/strong> es el predictor más fuerte; también bilirrubina &gt;9.6 mg/dL y albúmina &lt;2.5."},{"q":"Paciente con hepatitis A que mejora y, 3 meses después, vuelve a tener ictericia y elevación de ALT, más leve. ¿Cómo se explica?","o":["Infección crónica por VHA","Coinfección por VHD","Hepatitis A recurrente (recaída), que ocurre en 10–15 %","Fracaso de vacuna","Sobreinfección por VHE"],"a":2,"e":"El <strong>10–15 %<\/strong> presenta un curso <strong>recurrente<\/strong> dentro de 6 meses, con síntomas menos graves. El VHA <strong>no se cronifica<\/strong>."},{"q":"¿Qué patrón de laboratorio es típico de la hepatitis A aguda?","o":["ALT &lt;300, FA &gt;1000","Aminotransferasas &gt;1000, bilirrubina ≤10 mg/dL y FA &lt;400 U/L, con ALT &gt; AST","AST &gt; ALT 2:1","Bilirrubina indirecta aislada","ALT normal con DNA alto"],"a":1,"e":"Aminotransferasas <strong>&gt;1000<\/strong>, bilirrubina <strong>≤10 mg/dL<\/strong>, FA <strong>&lt;400 U/L<\/strong>; usualmente <strong>ALT &gt; AST<\/strong>."},{"q":"Paciente con hepatitis reciente: HBsAg −, anti-HBs −, anti-HBc IgM +. ¿Cómo lo interpretas?","o":["Falso positivo; no hay infección","Infección crónica","Vacunado","Periodo de ventana de una hepatitis B aguda","Infección resuelta hace años"],"a":3,"e":"En el <strong>periodo de ventana<\/strong> el HBsAg ya se eliminó y aún no hay anti-HBs; el <strong>único marcador<\/strong> positivo es la <strong>IgM anti-HBc<\/strong>."},{"q":"Mujer de 45 años con HBsAg + desde hace 2 años, anti-HBc IgG +, anti-HBs −. ¿Qué marcadores definen la fase y el tratamiento?","o":["Anti-HBs y anti-HBc IgM","HBeAg, DNA-VHB y aminotransferasas","Anti-VHA total","Alfafetoproteína sola","IgM anti-HBc y bilirrubina"],"a":1,"e":"En la crónica, <strong>HBeAg, DNA-VHB y aminotransferasas<\/strong> determinan la fase y orientan el tratamiento."},{"q":"Paciente con VHB en fase de control inmune (HBeAg −, anti-HBe +, DNA bajo) que recibe rituximab y presenta ALT 900 y DNA en ascenso. ¿Qué fase es?","o":["Inmunotolerante","Inmune activa (reactivación)","Periodo de ventana","Hepatitis B aguda nueva","Infección resuelta"],"a":1,"e":"La <strong>fase inmune activa<\/strong> se dispara por <strong>inmunosupresión<\/strong> o <strong>sobreinfección por VHD<\/strong>, con riesgo de falla hepática aguda. El cccDNA explica la reactivación."},{"q":"¿Cuál es el tratamiento de primera línea de la hepatitis B crónica según la revisión?","o":["Lamivudina","Adefovir","Telbivudina","Entecavir, tenofovir fumarato o tenofovir alafenamida en monoterapia","Ribavirina"],"a":3,"e":"Primera línea: <strong>entecavir, TDF o TAF<\/strong> por su <strong>alta barrera genética<\/strong>; los otros, solo si no hay acceso."},{"q":"¿Cuál de las siguientes es indicación de tratamiento antiviral del VHB independientemente de la fase?","o":["Anti-HBs positivo","Antecedente familiar de CHC","Vacunación incompleta","Anti-HBc IgG aislado sin datos","Edad mayor de 30 años sin más datos"],"a":1,"e":"Indicaciones: manifestaciones extrahepáticas, <strong>embarazo<\/strong>, <strong>familiar con CHC<\/strong>, coinfección VHC/VHD, <strong>profilaxis de inmunosupresión<\/strong> y <strong>cirrosis<\/strong>."},{"q":"Trabajadora de salud que no respondió a 3 dosis de vacuna recombinante (anti-HBs &lt;10 UI/mL). ¿Qué opción menciona la revisión?","o":["Vacuna con adyuvante (Heplisav) de 2 dosis","Entecavir profiláctico","Inmunoglobulina mensual","Vacuna terapéutica HBsAg-HBcAg","No hay alternativa"],"a":0,"e":"Heplisav (HBsAg + adyuvante) fue igual de eficaz con <strong>2 dosis<\/strong>; se considera en <strong>poco apegados<\/strong> o con <strong>anti-HBs &lt;10 UI/mL<\/strong>."},{"q":"¿Cuál es el genotipo del VHC más prevalente en el mundo?","o":["Genotipo 3","Genotipo 2","Genotipo 4","Genotipo 1","Genotipo 6"],"a":3,"e":"El <strong>genotipo 1<\/strong> representa ~<strong>la mitad<\/strong>; el 3, ~un tercio; el 2 y el 4, 9–13 %."},{"q":"Paciente con VHC agudo y polimorfismo IL-28B C/C. ¿Qué probabilidad de eliminación espontánea reporta el artículo?","o":["5 %","15 %","50 %","85 %","100 %"],"a":2,"e":"<strong>C/C ≈ 50 %<\/strong> de eliminación espontánea frente a <strong>15 %<\/strong> con <strong>T/T<\/strong>."},{"q":"Sobre la historia natural del VHC crónico, ¿qué afirmación es correcta?","o":["La carga viral alta predice cirrosis","16 % desarrolla cirrosis a 20 años y la carga viral no se correlaciona con la progresión","Todos hacen cirrosis en 5 años","La ALT se correlaciona fielmente con la histología","La descompensación más común es la encefalopatía"],"a":1,"e":"<strong>16 % a 20 años<\/strong>; la <strong>carga viral no<\/strong> se correlaciona con la progresión. La descompensación más común es la <strong>ascitis<\/strong> (3.9 %/año)."},{"q":"Paciente con cirrosis por VHC. ¿Qué incidencia anual de CHC reporta la revisión?","o":["0.1 %","1.4–4.9 %","10–15 %","25 %","44 %"],"a":1,"e":"Con cirrosis, el CHC aparece en <strong>1.4–4.9 % al año<\/strong>; el VHC causa <strong>25 %<\/strong> de los CHC del mundo."},{"q":"Paciente con anti-VHC + y ARN-VHC +. ¿Qué puedes concluir?","o":["Es una infección aguda","Es una infección crónica","Hay infección, pero esto no distingue aguda de crónica","Es un falso positivo","Infección resuelta"],"a":2,"e":"Anticuerpo + y ARN + <strong>confirma<\/strong> la infección pero <strong>no distingue<\/strong> aguda de crónica. Crónica = ARN + por <strong>≥6 meses<\/strong>."},{"q":"¿Cómo se define la respuesta viral sostenida en el VHC?","o":["ARN indetectable al final del tratamiento","Ausencia de virus en sangre 12 semanas después de terminar el tratamiento","Anti-VHC negativo","ALT normal a 4 semanas","ARN &lt;2000 UI/mL"],"a":1,"e":"<strong>RVS<\/strong> = sin virus en sangre <strong>12 semanas<\/strong> después de completar el tratamiento."},{"q":"Paciente con cirrosis Child-Pugh B por VHC. ¿Qué grupo de AAD está contraindicado?","o":["Inhibidores de NS5A (-asvir)","Inhibidores de NS5B (-buvir)","Inhibidores de proteasa NS3/4A (-previr)","Todos los AAD","Ninguno"],"a":2,"e":"Los <strong>inhibidores de proteasa<\/strong> se excretan por vía <strong>hepática<\/strong>: contraindicados en <strong>Child-Pugh B y C<\/strong>."},{"q":"Mujer con VHC, dep
