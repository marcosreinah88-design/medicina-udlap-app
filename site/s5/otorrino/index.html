<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Otorrino de bolsillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../../fonts/g6d50fe91c1.css">
<style>
/* Layout: barra superior fija · portada tipo atlas con 3 regiones anatómicas · vista de tema con índice lateral y pestañas.
   Cada región tiene su color (cavidad oral = mucosa, laringe = verde quirúrgico, nariz = índigo) que tiñe todo el tema. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8edef; --line:#d6dee2; --line-2:#c3ced3;
  --fg:#14232a; --muted:#566870; --faint:#8396a0;
  --oral:#b8335a; --oral-soft:#fbe7ee;
  --lar:#16747a; --lar-soft:#dcf0ef;
  --nar:#4652b0; --nar-soft:#e4e7fa;
  --ok:#24784a; --ok-soft:#dcf1e4; --bad:#b3261e; --bad-soft:#fbe3e1; --warn:#9a6200; --warn-soft:#fbefd6;
  --shadow:0 1px 2px rgba(20,35,42,.06), 0 6px 20px rgba(20,35,42,.06);
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --rc:var(--oral); --rc-soft:var(--oral-soft);
  /* colores de ilustración: representan tejido, se mantienen en ambos temas */
  --tis:#f1b6b0; --tis-2:#e7908a; --tis-hot:#d9564f; --cav:#5e1b26; --lip:#c96a6a; --pus:#f3d06a; --mem:#ece8dc;
  --cord:#fbf6ee; --ary:#e9a5a0; --air:#2a1418; --xr:#0c1013; --xr-soft:#5d6870; --xr-air:#05070a; --bone:#d9dee2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171b; --surface:#152229; --sunk:#1b2b32; --line:#263a43; --line-2:#33505b;
  --fg:#e4edf0; --muted:#9fb2ba; --faint:#6f8792;
  --oral:#f27fa2; --oral-soft:#3a1d29;
  --lar:#5fc9c9; --lar-soft:#123437;
  --nar:#9aa6f5; --nar-soft:#1f2550;
  --ok:#80d6a1; --ok-soft:#16362a; --bad:#ff9b93; --bad-soft:#3d1c1a; --warn:#f0c46b; --warn-soft:#3a2d12;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171b; --surface:#152229; --sunk:#1b2b32; --line:#263a43; --line-2:#33505b;
  --fg:#e4edf0; --muted:#9fb2ba; --faint:#6f8792;
  --oral:#f27fa2; --oral-soft:#3a1d29;
  --lar:#5fc9c9; --lar-soft:#123437;
  --nar:#9aa6f5; --nar-soft:#1f2550;
  --ok:#80d6a1; --ok-soft:#16362a; --bad:#ff9b93; --bad-soft:#3d1c1a; --warn:#f0c46b; --warn-soft:#3a2d12;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}
[data-r="oral"]{--rc:var(--oral);--rc-soft:var(--oral-soft)}
[data-r="lar"]{--rc:var(--lar);--rc-soft:var(--lar-soft)}
[data-r="nar"]{--rc:var(--nar);--rc-soft:var(--nar-soft)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.inner{max-width:1200px;margin:0 auto}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .inner{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.logo svg{flex:none}
.logo b{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.spacer{flex:1}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;font:inherit;font-size:.95rem;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--rc);background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--sunk)}
.btn.back{border-color:var(--rc);color:var(--rc);font-weight:700}
.btn.back:hover{background:var(--rc-soft)}
.home-link{display:inline-flex;align-items:center;gap:6px;margin-top:22px}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.btn.solid:hover{opacity:.9;background:var(--fg)}

/* portada */
.hero{padding-block:44px 28px}
.hero .inner{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:end}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1.02;letter-spacing:-.02em;margin:10px 0 14px;text-wrap:balance}
.hero h1 em{font-style:italic;font-weight:500;color:var(--oral)}
.hero p{color:var(--muted);max-width:56ch;margin:0;font-size:1.05rem}
.kicker{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.stat.prog{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:40px;height:40px;border-radius:50%;background:var(--surface)}
.stat.prog b{font-size:1.25rem}

.regions{padding-block:8px 48px}
.regions .inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.region{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.region-head{background:var(--rc-soft);padding:18px 20px 16px;display:flex;gap:14px;align-items:center}
.region-head svg{flex:none;color:var(--rc)}
.region-head h2{font-family:var(--f-display);font-size:1.3rem;margin:0;line-height:1.15;text-wrap:balance}
.region-head .mono{color:var(--rc)}
.region ol{list-style:none;margin:0;padding:6px 8px 10px;display:flex;flex-direction:column}
.trow{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
.trow:hover{background:var(--sunk)}
.trow .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:.75rem;color:transparent}
.trow.is-done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.trow .tt{font-weight:700;line-height:1.3}
.trow .meta{display:block;font-size:.8rem;color:var(--muted);font-weight:400;margin-top:2px}
.trow .wk{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.trow.is-empty .tt{color:var(--faint);font-weight:400}

/* vista de tema */
.topic-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start;padding-block:24px 56px}
.toc{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 80px);display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:12px}
.toc h3{margin:0 0 4px;display:flex;align-items:center;gap:7px}
.toc h3 i{width:8px;height:8px;border-radius:50%;background:var(--rc);display:inline-block}
.toc ul{list-style:none;margin:0;padding:0}
.toc button{width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.92rem;color:var(--muted);display:flex;gap:6px;justify-content:space-between}
.toc button:hover{background:var(--sunk);color:var(--fg)}
.toc button[aria-current="true"]{background:var(--rc-soft);color:var(--fg);font-weight:700}
.toc .ok{color:var(--ok)}
.toc-mobile{display:none}

.thead{background:var(--rc-soft);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;margin-bottom:22px;position:relative;overflow:hidden}
.thead::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:28px solid var(--rc);opacity:.08}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--rc);flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px}
.thead h1{font-family:var(--f-display);font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em;max-width:24ch}
.thead p{margin:0;color:var(--muted);max-width:66ch}
.thead-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.done-btn{border:1px solid var(--rc);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem;display:inline-flex;gap:8px;align-items:center}
.done-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:700}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px;margin-bottom:22px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.93rem}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.seg .n{font-family:var(--f-mono);font-size:.68rem;margin-left:5px;opacity:.7}

.masonry{columns:2 340px;column-gap:18px}
.sec{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;display:inline-block;width:100%}
.sec h3{font-family:var(--f-display);font-size:1.12rem;margin:0 0 10px;line-height:1.25;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
.sec h3 .no{font-family:var(--f-mono);font-size:.7rem;color:var(--rc);font-weight:500}
.sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.sec li{position:relative;padding-left:16px;max-width:68ch}
.sec li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--rc);opacity:.7}
.widebox{margin-bottom:18px}
.widebox .sec{display:block}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);font-weight:500;background:var(--rc-soft)}
thead th:first-child{border-top-left-radius:8px}
thead th:last-child{border-top-right-radius:8px}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
mark{background:var(--warn-soft);color:var(--fg);padding:0 2px;border-radius:3px}

.pgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.pgroup h3{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:.95rem}
.pgroup h3 .dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.pg-examen .dot{background:var(--rc-soft);color:var(--rc)}
.pg-alerta .dot{background:var(--bad-soft);color:var(--bad)}
.pg-clinica .dot{background:var(--ok-soft);color:var(--ok)}
.pearl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;line-height:1.45}
.pg-alerta .pearl{border-color:var(--bad);border-style:dashed}

/* tarjetas */
.fc{display:flex;flex-direction:column;align-items:center;gap:16px}
.fc-top{width:min(100%,640px);display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}
.pbar{width:min(100%,640px);height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--rc);transition:width .25s}
.card{width:min(100%,640px);perspective:1400px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.card-inner{position:relative;min-height:260px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flip .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:24px 28px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--rc-soft);border-color:var(--rc)}
.face .q{font-family:var(--f-display);font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.35;text-wrap:balance}
.face .a{font-size:1.1rem;line-height:1.5}
.face .lab{color:var(--rc)}
.face .hint{color:var(--faint);font-size:.85rem}
.fc-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.know{border-color:var(--ok);color:var(--ok)}
.btn.again{border-color:var(--warn);color:var(--warn)}
.kbd{font-family:var(--f-mono);font-size:.68rem;color:var(--faint)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px;max-width:780px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qhead .score{font-family:var(--f-display);font-size:1.1rem}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.qitem .qq{font-weight:700;margin:0 0 12px;display:flex;gap:10px}
.qitem .qq span{font-family:var(--f-mono);font-size:.75rem;color:var(--rc);padding-top:3px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);padding:9px 12px;border-radius:10px;cursor:pointer}
.opt .L{width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem}
.opt:hover:not(:disabled){border-color:var(--rc)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.why{margin:12px 0 0;font-size:.92rem;color:var(--muted);padding-left:12px;border-left:2px solid var(--line-2)}
.final{background:var(--rc-soft);border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.final b{font-family:var(--f-display);font-size:1.4rem}

.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.figs.one{grid-template-columns:1fr}
.fig{display:flex;flex-direction:column;gap:6px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:zoom-in;text-align:left}
.fig img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.figs.one .fig img{aspect-ratio:auto;max-height:420px}
.fig span{font-size:.8rem;color:var(--muted);padding:0 10px 8px;line-height:1.3}
.fig:hover{border-color:var(--rc)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.gallery .fig span{font-size:.88rem;color:var(--fg);padding:2px 12px 12px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,14,17,.88);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));cursor:zoom-out}
.lb[hidden],[hidden]{display:none!important}
.lb figure{margin:0;max-width:min(1000px,100%);display:flex;flex-direction:column;gap:10px;align-items:center}
.lb img{max-width:100%;max-height:80vh;border-radius:10px;background:#fff;cursor:default}
.lb figcaption{color:#e8eef0;font-size:.95rem;text-align:center}
.lb-x{position:absolute;top:calc(env(safe-area-inset-top, 0px) + 14px);right:calc(env(safe-area-inset-right, 0px) + 14px);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:1.1rem;cursor:pointer}
.diag{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 12px 8px;margin-top:14px;cursor:zoom-in;text-align:left}
.diag:hover{border-color:var(--rc)}
.diag>span{display:block;font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.3}
.dg{display:block;width:100%;height:auto;font-family:var(--f-body)}
.dg text{fill:var(--fg);font-size:13px}
.dg text.b{font-weight:700;font-size:14px}
.dg text.m{fill:var(--muted);font-size:12px}
.dg text.s{font-size:13px}
.dg text.num{font-family:var(--f-mono);font-size:15px;fill:var(--rc);font-weight:500}
.dg text.xr-t{fill:#cfd6db;font-size:11px}
.dg-cap{font:12px/1.3 var(--f-body);color:var(--muted);text-align:center}
.f-lip{fill:var(--lip)} .f-cav{fill:var(--cav)} .f-tis{fill:var(--tis)} .f-ton{fill:var(--tis-2)} .f-ton.red,.f-ton.hot{fill:var(--tis-hot)}
.f-pus{fill:var(--pus)} .f-pet{fill:#8a0f1c} .f-mem{fill:var(--mem);opacity:.92}
.f-arrow,.a-air{stroke:var(--rc);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.x-mark{stroke:var(--bad);stroke-width:4;stroke-linecap:round}
.f-pillar{stroke:var(--tis);stroke-width:5} .f-mid{stroke:var(--mem);stroke-width:1.5;stroke-dasharray:4 4}
.f-bg{fill:var(--sunk)} .f-wall{fill:var(--tis-2)}
.lx-ring{fill:var(--tis);stroke:var(--tis-2);stroke-width:3} .lx-air{fill:var(--air)} .lx-ary{fill:var(--ary)}
.vc{stroke:var(--cord);stroke-width:9;stroke-linecap:round} .vc.fat{stroke-width:17}

{id:"anato", region:"Cavidad oral y faringe", week:"Sem 1", title:"Anatomía de cavidad oral, glándulas y faringe",

 sections:[
  {h:"Cavidad oral: límites", li:["Anterior: fisura oral (labios: orbicular de los labios).","Posterior: istmo de las fauces, unión paladar duro–blando.","Incluye pilares amigdalinos anteriores, trígonos retromolares, mucosa oral y piso de boca.","Frenillo lingual corto en niños: problemas de fonación, se corta un poco."]},

  {h:"Suprahioideos importantes", li:["Milohioideo, digástrico y genihioideo."]},
  {h:"Glándulas salivales", li:["Parótida: la más grande y serosa. 80% superficial, 20% profunda.","Separación superficial/profunda: nervio facial (quirúrgico) y vena retromandibular (radiológico).","Dolor parotídeo puede referirse como otalgia ambigua: pensar en ATM.","Submandibular: 2ª en tamaño, mixta (serosa y mucosa), puede dar litos o infección. Drena por conducto de Wharton.","Ordeño bimanual del Wharton para sacar pus o lito.","Sublingual: drena en la carúncula sublingual.","Resonancia para estadificar tumores de glándulas salivales."]},
  {h:"Ganglios cervicales", li:["Reactivos: dolorosos, blandos, móviles, bien delimitados → USG.","Malignos: parecidos pero pétreos.","Ganglio en cadena posterior al ECM: maligno hasta demostrar lo contrario."]},
  {h:"Faringe", li:["De la base del cráneo a C5–C6, dividida en 3: naso, oro e hipofaringe. Conecta con oído, nariz y laringe.","Nasofaringe: velo del paladar, coanas, tensor y elevador del velo.","Orofaringe: del paladar a borde superior de epiglotis; sensibilidad y gusto por glosofaríngeo.","Hipofaringe: senos piriformes, región postcricoidea y pared posterior.","Trompa de Eustaquio: 1/3 ósea, 2/3 cartilaginosa (el conducto auditivo es al revés). Tumores nasales o paladar alterado dan otalgia irradiada."]},
  {h:"Musculatura y deglución", li:["Constrictores superior, medio e inferior: plexo faríngeo (IX y X).","Constrictor inferior débil: divertículos.","Cierre de nasofaringe: tensor y elevador del velo + constrictor superior.","Elevación: suprahioideos, elevadores de faringe y constrictores.","Disfagia con paso de alimento a vía aérea: pensar en laringe e hipofaringe."]},
  {h:"Anillo de Waldeyer (MALT)", li:["Tubáricas (Gerlach), faríngea (adenoides), palatinas (las más importantes), lingual y laterales.","Palatinas tienen cápsula; adenoides no.","Adenoides involucionan después de los 12 años. En niños: Rx lateral de rinofaringe; si obstruye más del 50% se operan.","Arteria amigdalina (rama de la facial, cuadrante posteroinferior): la más importante en cirugía.","Amígdala lingual: cuidar venas de retorno (relación con el glosofaríngeo)."]},

  ["alerta","Angina de Ludwig: cuello de sapo, fiebre, lengua elevada. Referir a ORL para traqueostomía y drenaje."],

{id:"faringitis", region:"Cavidad oral y faringe", week:"Sem 2", title:"Infecciones de faringe",
 lede:"Faringitis viral vs. estreptocócica, mononucleosis, epiglotitis, absceso periamigdalino, otras etiologías e hipertrofia amigdalina.",
 sections:[
  {h:"Viral vs. bacteriana", table:[["","Viral (40–60%)","Estreptocócica (GAS)"],["Inicio","Gradual","Súbito, con cefalea"],["Síntomas","Tos, rinorrea, conjuntivitis, aftas, diarrea","Sin tos ni rinorrea; otalgia orienta a bacteriana"],["Fiebre","Ausente o baja","Alta"],["Exploración","Faringe hiperémica","Exudado amigdalar, petequias en paladar, adenopatía cervical dolorosa"],["Tratamiento","Sintomático, sin antibióticos","Antibiótico (previene fiebre reumática)"]]},
  {h:"Virus y su pista", li:["Rinovirus y coronavirus: rinorrea y tos.","Adenovirus: conjuntivitis (fiebre faringoconjuntival).","Herpes: vesículas en pilar anterior; herpangina en pilar posterior y úvula.","Bacterias: S. pyogenes, S. pneumoniae; H. influenzae y Moraxella pueden sobreinfectar un cuadro viral."]},
  {h:"Estreptococo grupo A", li:["10% de las faringitis en adultos, 30% en niños. Causa principal de amigdalectomía en niños.","Proteína M y cápsula evitan fagocitosis; estreptolisinas O y S, DNasa, hialuronidasa; exotoxinas A, B y C.","Diagnóstico: clínico, Centor modificado, prueba rápida de antígeno, ASO; cultivo faríngeo es el estándar.","Contagioso hasta una semana. Recordar el biofilm (resistencia)."]},
  {h:"Tratamiento de GAS (clase)", li:["Sintomático: reposo, lidocaína o benzocaína en spray, hidratación, humidificación.","Amoxicilina/clavulanato 875/125 mg VO c/12 h.","Clindamicina 300 mg VO c/8 h x 10 días.","Alergia o resistencia: claritromicina 500 mg VO o azitromicina 500 mg VO."]},
  {h:"Complicaciones de GAS", li:["Supurativas: absceso periamigdalino (la más común), parafaríngeo, retrofaríngeo, Lemierre (trombosis de yugular interna), mediastinitis, sepsis.","Pilar abombado: TC con contraste y química sanguínea.","No supurativas: fiebre reumática y glomerulonefritis (si no se trata en 10 días), PANDAS."]},
  {h:"Mononucleosis infecciosa", li:["EBV 90%, CMV 10%. Contagio por saliva; infecta linfocitos B (CD21).","Exudado más uniforme, como una cáscara. Petequias palatinas, adenopatías en triángulo posterior, hepatoesplenomegalia (30%).","BH: 80–90% mononucleares, 10% linfocitos atípicos.","Anticuerpos heterófilos (Monospot): S 85%, E ~100%; 40% falsos negativos en las primeras 2–3 semanas. IgM reciente, IgG tardía.","Tratamiento de soporte; evitar deportes de contacto (ruptura esplénica). Amoxicilina da rash.","Resuelve en 2–3 semanas. Complicaciones: obstrucción de vía aérea, meningitis, anemia hemolítica, ruptura esplénica."]},
  {h:"Epiglotitis", li:["Hib, S. pneumoniae, S. pyogenes. Edema supraglótico rápido.","Fiebre alta, odinofagia intensa, babeo, voz apagada, estridor, posición en trípode.","No explorar agresivamente; Rx lateral de cuello con signo del pulgar.","Primero asegurar vía aérea; antibiótico IV (cefalosporina de 3ª) y esteroide."]},
  {h:"Absceso periamigdalino", li:["Odinofagia unilateral severa, trismus, voz de papa caliente, desviación de úvula, abombamiento palatino.","TC con contraste si hay duda. Drenaje + antibiótico IV + vigilancia de vía aérea."]},
  {h:"Otras etiologías", li:["Difteria: pseudomembrana gris, cuello de toro; antitoxina IV + penicilina o macrólido.","Arcanobacterium haemolyticum: rash que respeta palmas y plantas; macrólidos.","Sífilis: úlceras no dolorosas (primaria); secundaria con fiebre, rash, masa cervical.","Gonorrea: factor de riesgo felación; ceftriaxona + doxiciclina.","Mycoplasma: 15–19 años, con neumonía.","Francisella tularensis: garrapatas, gente de campo; macrólidos o fluoroquinolonas (resistente a betalactámicos).","Herpangina (Coxsackie A16): niños, verano–otoño, úlceras de 1–2 mm en paladar blando, úvula y pared posterior. Úlceras más grandes: pensar en sífilis o gonorrea."]},
  {h:"Hipertrofia amigdalina y adenoidea", li:["Criterios de infección recurrente con pus: 7 episodios en 1 año, 5 por año en 2 años, o 3 por año en 3 años.","Absolutas: SAOS, absceso periamigdalino más de 2 veces, amígdalas de superficie irregular, difteria. Relativa: enfermarse seguido.","Adenoides: operar si obstruyen 60–70% y hay síntomas, u otitis media serosa recurrente.","Sin síntomas ni apnea: montelukast y observación (puede bajar hasta 50%).","Estudios: Rx lateral (barata y rápida) o nasofibrolaringoscopía si el niño coopera.","Contraindicaciones: insuficiencia velopalatina (voz hipernasal), enfermedad hematológica."]}
 ],
 pearls:[

  ["examen","Otalgia en faringitis: pensar en bacteriana. Diarrea: pensar en viral."],
  ["examen","Triada de GAS: amígdalas purulentas, adenopatías cervicales y fiebre alta."],
  ["alerta","Niño con babeo, ahogamiento y posición en trípode: epiglotitis, puede ser fulminante."],

  ["¿Qué porcentaje de faringitis agudas son virales?","40–60%."],

  ["Hallazgo que orienta a faringitis viral:",["Petequias en paladar","Fiebre alta súbita","Diarrea y rinorrea","Exudado purulento"],2,"Rinorrea, tos y diarrea orientan a viral."],

{id:"saos", region:"Cavidad oral y faringe", week:"Sem 2", title:"SAOS",
 lede:"Síndrome de apnea obstructiva del sueño. Prevalencia 1.5–4%, principal indicación de amigdalectomía en niños.",
 sections:[
  {h:"Etiología", li:["Anatómica: obstrucción (adenoides y amígdalas), colapso de vía aérea, falta de respuesta de dilatadores.","Neurogénica: sensibilidad de quimiorreceptores, menor estímulo central, receptores ventilatorios defectuosos.","El constrictor superior de la faringe es el principal causante al relajarse; la velofaringe también colapsa seguido."]},
  {h:"Factores de riesgo", li:["Sur asiático, antecedentes familiares, edad, obesidad, anatomía, Marfan, hombres y mujeres posmenopáusicas.","Obstrucción nasal es coadyuvante.","El esfuerzo respiratorio es el estímulo más importante para despertar, más que la hipoxia o la hipercapnia."]},
  {h:"Clínica", li:["Principales: somnolencia diurna, ronquido, apneas presenciadas.","Otros: movimientos involuntarios, insomnio, actividad motora nocturna, enuresis en niños.","Niños: más bien hiperactivos; tras la cirugía hasta cambia su personalidad.","Adultos: cefalea característica. Cuello de más de 50 cm.","Retrognatia o micrognatia aumentan el riesgo en niños."]},
  {h:"Diagnóstico", li:["Escala de somnolencia: se duerme viendo TV, en el coche, sentado en lugar público.","Mallampati y Friedman.","Polisomnografía: estándar de oro (oximetría, EEG, movimientos). Medir índice de apnea-hipopnea y desaturación; menos de 80% es alarma."]},
  {h:"Tratamiento", li:["Niños: cirugía definitiva (adenoamigdalectomía).","Adultos: CPAP; la cirugía solo ayuda.","Si no usa el CPAP al menos 50%: recalibrar; muchas veces es la nariz (septum desviado, cornetes grandes).","Si no funciona el CPAP: BiPAP. Apnea central: CPAP.","Niño con SAOS 40–50% en PSG: CPAP 1–2 semanas antes y después de la cirugía. Descartar problemas cardiopulmonares con cardio y neumo."]},
  {h:"Complicaciones", li:["Mortalidad: accidentes de auto, muerte súbita nocturna, insuficiencia cardiaca.","3 veces más riesgo de HTA y de hipertensión pulmonar.","EVC, resistencia a insulina, arritmias, cardiopatía isquémica.","75–100% tienen ERGE o reflujo faringolaríngeo (aumento de presión intratorácica)."]}
 ],
 pearls:[
  ["examen","Polisomnografía = estándar de oro para SAOS."],
  ["examen","Niños: tratamiento quirúrgico definitivo. Adultos: CPAP."],
  ["alerta","Niño con SAOS y problemas cardiopulmonares: CPAP obligatorio; operarlo sin el algoritmo puede dar arritmias, espasmos y complicaciones graves."],
  ["clinica","Mala adherencia al CPAP: revisar la nariz antes de cambiar de tratamiento."]
 ],
 cards:[
  ["¿Principal músculo implicado en el colapso del SAOS?","Constrictor superior de la faringe."],
  ["¿Estímulo más importante para despertar en SAOS?","El esfuerzo respiratorio (más que hipoxia o hipercapnia)."],
  ["¿Cómo se presenta el SAOS en niños?","Hiperactividad más que somnolencia; enuresis, ronquido."],
  ["¿Desaturación de alarma en la polisomnografía?","Por debajo de 80%."],
  ["¿Qué porcentaje de pacientes con SAOS tiene ERGE o RFL?","75–100%."],
  ["¿Alternativa si el CPAP no funciona?","BiPAP."]
 ],

/* ───────────── LARINGE ───────────── */
{id:"laringe", region:"Laringe", week:"Sem 3", title:"Laringe y patología benigna",
 lede:"Anatomía funcional de examen, reflujo faringolaríngeo y lesiones benignas de cuerdas vocales.",
 sections:[
  {h:"Anatomía de examen", li:["Casi todos los músculos laríngeos los inerva el vago (laríngeo recurrente).","Cricotiroideo: laríngeo superior; tensa las cuerdas (tono de voz).","Cricoaritenoideo posterior: el único que ABRE las cuerdas.","Cierran: cricoaritenoideo lateral, interaritenoideo y tiroaritenoideo (vocal).","Aritenoides dan movilidad. Laríngeo recurrente con trayecto distinto izquierdo y derecho.","Cricotiroidotomía percutánea de emergencia."]},
  {h:"Reflujo faringolaríngeo", li:["Inflamación de mucosa laríngea por ácido y/o álcali. NO es lo mismo que ERGE.","Disfonía peor en la mañana (92%), aclaramiento (50%), tos (44%), globus (33%), disfagia (27%), pirosis en menos de 50%.","Laringoespasmo: patognomónico.","Reflux Finding Score de Belafsky.","Tratamiento: no ayunos prolongados, elevar cabecera, IBP (pantoprazol 40 mg u omeprazol 20 mg c/12 h). Quirúrgico: funduplicatura.","La laringe tarda en promedio 3 meses en desinflamarse; sin mejoría a 3 meses, referir a gastro."]},
  {h:"Edema de Reinke", li:["Espacio de Reinke: capa superficial de la lámina propia, tejido laxo que acumula líquido.","Factores: RFL, tabaquismo, abuso de voz, aclaramiento y tos crónica, hipotiroidismo.","Voz grave, hasta hipermasculina. No se asocia a cáncer."]},
  {h:"Nódulos vocales", li:["Abuso de voz y mala técnica; más en mujeres y niños.","Bilaterales, en la unión del 1/3 anterior con el 1/3 medio (zona de mayor contacto).","Amanecen bien y se van poniendo roncos durante el día. Cantantes: inicio fonatorio retardado en notas altas suaves.","Dx: nasofibrolaringoscopía o laringoscopía de 70°.","Pequeños: terapia de voz. De 2–3 mm o si ya no puede hablar: microlaringoscopía."]},
  {h:"Pólipos cordales", li:["Ruptura capilar en el espacio de Reinke; marrón o negro si es hemorrágico.","Aspirina, anticoagulantes, intubación, abuso de voz.","Base ancha o pedunculados.","Microlaringoscopía con láser: KTP para lesiones vasculares, láser azul para todo."]},
  {h:"Otras lesiones", li:["Quistes: cambios súbitos de voz, base más ancha, peor resultado posquirúrgico.","Sulcus vocalis: pérdida de la capa superficial; surco en la cuerda. Terapia de voz; la cirugía puede empeorar.","Ectasias vasculares: mujeres, profesores, posradioterapia; disfonía episódica. Si hay hemoptisis, operar.","Granulomas: porción medial del aritenoides, hombres, posintubación; resección fría + reposo de voz 3–4 días.","Laringocele y quiste sacular: marsupialización o escisión completa si es externo.","Presbilaringe: voz en fuga; gap de 1–2 mm es normal, mayor es patológico."]}
 ],
 pearls:[
  ["examen","El cricoaritenoideo posterior es el único abductor (abre las cuerdas)."],
  ["examen","Laringoespasmo es patognomónico de reflujo faringolaríngeo."],
  ["examen","Nódulos: bilaterales en unión de 1/3 anterior y 1/3 medio."],
  ["clinica","Ronquera de más de 2 semanas a 1 mes: descartar nódulos primero."],
  ["clinica","Ronquera: antirreflujo + spray nasal + esteroide de depósito (Diprospan)."],
  ["clinica","Edema de Reinke no aumenta el riesgo de cáncer laríngeo."]
 ],
 cards:[
  ["¿Único músculo que abre las cuerdas vocales?","Cricoaritenoideo posterior."],
  ["¿Qué nervio inerva el cricotiroideo?","Laríngeo superior."],
  ["¿Síntoma más frecuente del RFL?","Disfonía peor en las mañanas (92%)."],
  ["¿Cuánto tarda en desinflamarse la laringe con tratamiento antirreflujo?","Unos 3 meses en promedio (hasta 6 para todos los síntomas)."],
  ["¿Patrón de disfonía en nódulos vocales?","Bien al despertar, empeora a lo largo del día."],
  ["¿Láser para lesiones vasculares de cuerda?","KTP."],
  ["¿Dónde aparecen los granulomas laríngeos?","Porción medial del aritenoides; típicamente posintubación."]
 ],
 quiz:[
  ["Músculo responsable de la abducción de las cuerdas vocales:",["Cricoaritenoideo lateral","Cricotiroideo","Cricoaritenoideo posterior","Interaritenoideo"],2,"Los demás aductores cierran; el cricotiroideo tensa."],
  ["Profesora con disfonía que empeora al final del día y lesiones bilaterales en la unión del tercio anterior y medio:",["Pólipo","Nódulos vocales","Edema de Reinke","Papilomatosis"],1,"Lesión por abuso de voz en la zona de mayor contacto."],
  ["Respecto al reflujo faringolaríngeo, es correcto:",["Es lo mismo que ERGE","La pirosis está en más del 90%","El laringoespasmo es patognomónico","Se resuelve en 1 semana"],2,"La pirosis aparece en menos del 50%."],
  ["Lesión laríngea que NO se asocia a cáncer y da voz hipermasculina:",["Leucoplaquia","Edema de Reinke","Papiloma","Eritroplaquia"],1,"Se asocia a tabaco y RFL, pero no a malignidad."]
 ]},

{id:"croup", region:"Laringe", week:"Sem 3", title:"CROUP y diferenciales",
 lede:"Estridor en niños: CROUP viral, epiglotitis, traqueítis bacteriana y laringitis estridulosa.",
 sections:[
  {h:"Comparativo", wide:true, table:[["","CROUP viral","Epiglotitis","Traqueítis bacteriana","Laringitis estridulosa"],["Agente","Parainfluenza 1, influenza A/B, rinovirus, adenovirus, VSR","Hib, S. pneumoniae, S. pyogenes","S. aureus, Moraxella","Alergia o ERGE"],["Inicio","Insidioso, con IVAS previa","Rápido, fulminante","Tras CROUP viral","Inmediato, sin antecedentes"],["Clave","Tos perruna, estridor inspiratorio","Babeo, trípode, voz apagada","Estridor mixto, disnea, fiebre","Tos perruna nocturna, sin fiebre"],["Imagen","Signo del lápiz (de la aguja)","Signo del pulgar","—","—"],["Duración","4 días a 1 semana","—","Días a semanas","1–2 noches"],["Manejo","Soporte, ambiente tranquilo; epinefrina racémica si es grave","Intubación, O₂, ceftriaxona/cefotaxima + clindamicina","Hospitalizar, O₂, intubación; dicloxacilina o clinda IV (vanco si MRSA)","Humidificar, O₂, esteroide; epinefrina solo si es grave"]]},
  {h:"CROUP: datos", li:["3 meses a 5 años; más en hombres e invierno.","Causa del 80% de los estridores en niños.","CROUP score de 7–10: intubación y ventilación.","Epinefrina racémica: 0.5 ml de ampolleta al 2.25% + 4 ml. Es lo mejor; los esteroides se usan en cuadros leves."]},
  {h:"Epiglotitis", li:["Más severa en adultos que en niños.","Infección de epiglotis, supraglotis e hipofaringe.","Abscesos de cuello: ceftriaxona + clindamicina de primera instancia."]}
 ],
 pearls:[
  ["examen","Tos perruna + estridor = CROUP. Signo del lápiz en Rx."],
  ["examen","Signo del pulgar en Rx lateral de cuello = epiglotitis."],
  ["alerta","Estridor inspiratorio es urgencia."],
  ["alerta","Niño con babeo, ahogamiento y trípode: epiglotitis, asegurar vía aérea."],
  ["clinica","Traqueítis dura días a semanas; el CROUP no pasa de 1 semana."]
 ],
 cards:[

  ["¿Antibiótico en epiglotitis?","Cefalosporina de 3ª (ceftriaxona o cefotaxima) + clindamicina."],
  ["¿Agente de la traqueítis bacteriana?","S. aureus (y Moraxella)."],

  ["Niño febril, con babeo, voz apagada y en posición de trípode. Primer paso:",["Explorar faringe con abatelenguas","Asegurar vía aérea","Rx de tórax","Nebulizar salbutamol"],1,"Epiglotitis: no explorar agresivamente."],

{id:"pediatrico", region:"Laringe", week:"Sem 1", title:"Laringomalacia y estridor congénito",
 lede:"Abordaje del estridor en niños y anomalías laríngeas congénitas.",
 sections:[
  {h:"Estridor", li:["Ruido áspero vibratorio por obstrucción de vía aérea.","Inspiratorio: supraglotis/laringe. Espiratorio: tráquea y bronquios. Bifásico: avanzado (glotis/subglotis).","Ley de Poiseuille: si el radio baja a la mitad, la resistencia aumenta 16 veces."]},
  {h:"Historia y exploración", li:["Historia prenatal, UCI, intubación prolongada, aspiración, ronquera, reflujo, comorbilidad neurológica.","Cambios posturales, cianosis, apneas.","Sialorrea: epiglotitis o cuerpo extraño.","Endoscopía (laringotraqueobroncoscopía): estándar para evaluar estridor, asegurando vía aérea primero."]},
  {h:"Laringomalacia", li:["Causa más común de estridor congénito (65–70%) y anomalía laríngea congénita más frecuente.","Flacidez supraglótica: epiglotis en omega, aritenoides redundantes que colapsan, pliegues aritenoepiglóticos cortos.","Estridor inspiratorio intermitente desde la 1ª–2ª semana de vida.","Mejora sentado y en prono; empeora en supino.","ERGE asociado en 30–80%.","Manejo: vigilancia (se resuelve hacia el año), tratar el reflujo. Supraglotoplastia solo si es grave o persiste tras el año."]},
  {h:"Estenosis subglótica", li:["Obstrucción 2–3 mm debajo de las cuerdas; membranosa o cartilaginosa (más difícil).","RN a término con diámetro menor de 4 mm; pretérmino menor de 3 mm.","Falla de recanalización a las 10 SDG; preguntar por intubación prolongada. Asociada a ERGE, esofagitis eosinofílica y CHARGE.","Dx: Rx lateral de cuello y tórax; definitivo por endoscopía y TC."]},
  {h:"Escala de Cotton–Myer", table:[["Grado","Obstrucción"],["I","0–50%"],["II","51–70%"],["III","71–99% (muy sintomático)"],["IV","100%"]]},
  {h:"Parálisis de cuerdas vocales", li:["10% de anomalías; 2ª más común.","Estiramiento del laríngeo en el parto, SNC (Arnold-Chiari, mielomeningocele), infecciones, iatrogenia.","Bilateral: estridor inspiratorio agudo, llanto anormal; puede requerir traqueostomía, lateralización o aritenoidectomía.","Unilateral: voz débil y aspiración; laringoplastia por inyección.","Suele resolver a los 18 meses. RM con contraste para descartar compresión."]},
  {h:"Otras", li:["CROUP viral: 80% de los estridores infecciosos.","Papilomatosis recurrente: cuerdas vocales; buena respuesta a KTP.","Hemangioma subglótico: 1.5% de anomalías; crece hasta el año y luego involuciona. Buscar hemangiomas cutáneos y PHACES."]},
  {h:"Mnemotecnias", li:["CHARGE: Coloboma, Heart, Atresia de coanas, Retraso del crecimiento, Genitourinario, Ear (oído y pérdida auditiva).","PHACES: fosa Posterior, Hemangioma, Arterial, Cardiaco, Eye (ojo), Sternum (esternón)."]}
 ],
 pearls:[
  ["examen","Laringomalacia = causa #1 de estridor congénito (65–70%)."],
  ["examen","Parálisis de cuerdas vocales = 2ª anomalía laríngea congénita."],
  ["examen","Poiseuille: reducir el radio a la mitad multiplica la resistencia por 16."],
  ["clinica","Laringomalacia mejora en prono y sentado; empeora en supino."]
 ],
 cards:[
  ["¿Forma de la epiglotis en laringomalacia?","En omega."],
  ["¿Estridor espiratorio sugiere obstrucción en…?","Tráquea y bronquios."],
  ["Grado III de Cotton–Myer","Obstrucción de 71–99%."],
  ["¿Diámetro subglótico que define estenosis en RN a término?","Menor de 4 mm."],
  ["¿A qué edad suele resolver la parálisis cordal congénita?","18 meses."],
  ["¿Qué significa CHARGE?","Coloboma, Heart, Atresia de coanas, Retraso, Genitourinario, Ear."]
 ],

  ["Manejo inicial de laringomalacia leve:",["Supraglotoplastia inmediata","Vigilancia y tratamiento de reflujo","Traqueostomía","Esteroide sistémico"],1,"La mayoría resuelve hacia el año."],
  ["Estenosis subglótica con 80% de obstrucción corresponde a Cotton–Myer:",["I","II","III","IV"],2,"Grado III: 71–99%."]

{id:"papilomatosis", region:"Laringe", week:"Sem 4", title:"Papilomatosis, laringitis y cáncer de laringe",
 lede:"Papilomatosis respiratoria, laringitis fúngica y tuberculosa, y cáncer de laringe.",
 sections:[
  {h:"Papilomatosis respiratoria", li:["Crecimiento benigno más común de laringe en niños; 2ª causa de disfonía infantil.","VPH 6 y 11 (90%). Malignización rara, más con 16 y 18 en adultos.","2/3 antes de los 15 años; suelen mejorar en la pubertad. Muy agresiva si la madre tenía papiloma en el parto.","Juvenil: menores de 12 años, múltiples sitios (aritenoides, cuerdas, bandas). Adultos: úvula, pilares, laringe; factor de riesgo sexo oral.","Lesiones verrugosas exofíticas en la unión del epitelio escamoso y ciliado.","Primer síntoma: disfonía progresiva."]},
  {h:"Tratamiento de papilomatosis", li:["Escisión endoscópica (fría, microdebridador o láser; ideal el láser).","Evitar traqueostomía: siembra en vía aérea inferior.","Adyuvante controversial: cidofovir o interferón. Dar IBP en lesiones benignas.","Obstrucción glótica del 50% o dificultad respiratoria: operar."]},
  {h:"Laringitis fúngica y tuberculosa", li:["Fúngica: inmunosupresión, radiación, antibióticos. Candida, Aspergillus, Blastomyces, Histoplasma, Coccidioides.","Odinofagia, disfonía, tos, disnea. Endoscopía y biopsia (descartar cáncer). Antimicóticos y asegurar vía aérea.","Tuberculosa: región interaritenoidea o superficie de epiglotis; secundaria a TB pulmonar."]},
  {h:"Cáncer de laringe: sospecha", li:["Hombre de más de 70 años, disfónico, con alcohol y tabaco: laringoscopía y TC.","En México el glótico es el más común.","Glótico: disfonía, disnea, estridor. Supra y subglótico dan síntomas más escandalosos; subglótico da disfonía y dificultad respiratoria y metastatiza rápido.","Faringodinia, odinofagia o disfagia: pedir laringoscopía.","Leucoplaquia y eritroplaquia: premalignas, biopsiar (eritroplaquia más sugestiva).","Polvo de madera: carcinógeno, más asociado a cáncer de nariz.","Ante cualquier tumoración, buscar en pulmón."]},
  {h:"Estudio", li:["TC o RM de cabeza y cuello con contraste.","Laboratorios generales y estado nutricional.","Biopsia (incisional o excisional): estándar de oro.","Displasia leve → moderada → severa → carcinoma in situ → epidermoide (bien, moderada o pobremente diferenciado).","Metástasis: subglótico a pulmón; mediastino es el sitio ganglionar a distancia más común."]},
  {h:"Tratamiento", li:["Tis–T2 glótico: cirugía o radioterapia. Láser preferible; control local 80–94%.","Glótico con RT: control T1 80–90%, T2 64–87%.","T3–T4: quimio y radioterapia; cirugía solo para debulking. T4 mejor solo con quimio.","Supraglótico: laringectomía supraglótica con disección ganglionar + QT/RT. Contraindicada si hay invasión de glotis o cartílagos. Avanzado: laringectomía con QT y RT concomitante.","Cuello supraglótico: N0–N1 disección selectiva bilateral II–IV; N2–N3 disección bilateral.","Recurrencia: TC y PET a las 10–12 semanas. Pronóstico malo desde N2 y T3."]}
 ],
 pearls:[
  ["examen","Papilomatosis: VPH 6 y 11; evitar traqueostomía."],
  ["examen","En México el cáncer glótico es el más común."],
  ["alerta","NUNCA dar esteroides en infecciones por hongos."],
  ["clinica","Disfonía de más de 1 mes en paciente de 40–50 años: laringoscopía."],
  ["clinica","Cáncer = TC y biopsia, igual ante cualquier aumento de volumen."]
 ],
 cards:[
  ["¿Tipos de VPH en papilomatosis laríngea?","6 y 11 (90%). Malignizan más 16 y 18."],
  ["¿Por qué evitar traqueostomía en papilomatosis?","Puede sembrar papilomas en la vía aérea inferior."],
  ["¿Indicación de cirugía en papilomatosis?","Dificultad respiratoria u obstrucción glótica del 50%."],
  ["¿Sitio de metástasis del cáncer subglótico?","Pulmón."],
  ["¿Estándar de oro diagnóstico en cáncer de laringe?","Biopsia."],
  ["¿Cuándo se hace PET/TC para buscar recurrencia?","A las 10–12 semanas del tratamiento."],
  ["¿Qué lesión premalignas se biopsian?","Leucoplaquia y eritroplaquia."]
 ],
 quiz:[
  ["Hombre de 72 años, fumador y bebedor, con disfonía de 2 meses. Siguiente paso:",["IBP y control en 3 meses","Laringoscopía y TC","Terapia de voz","Antibiótico"],1,"Sospecha de cáncer de laringe."],
  ["Tratamiento de un carcinoma glótico T1:",["Laringectomía total","Radioterapia o cirugía con láser","Quimioterapia sola","Observación"],1,"Excelente control local en T1 con RT o láser."],
  ["Paciente inmunosuprimido con laringitis fúngica. Es incorrecto:",["Antimicóticos","Biopsia","Esteroides para el edema","Asegurar vía aérea"],2,"Nunca esteroides en hongos."],
  ["Subtipo más común de cáncer de laringe en México:",["Supraglótico","Glótico","Subglótico","Transglótico"],1,"Tal como lo anotaste en clase."]
 ]},

/* ───────────── NARIZ Y SENOS ───────────── */
{id:"cuerpos", region:"Nariz y senos paranasales", week:"Sem 3", title:"Cuerpos extraños nasales y rinosinusitis",
 lede:"Cuerpos extraños nasosinusales (con la pila de botón como urgencia) y bases de rinosinusitis.",
 sections:[
  {h:"Cuerpos extraños de alto riesgo", li:["Pila de botón: doble halo en la Rx. Verdadera urgencia.","Álcali: necrosis por licuefacción. Daño tisular a la media hora, necrosis en 2 horas; necrosis en 59% si no se trata.","Deformidad en silla de montar si perfora el septum.","Lesión orbitaria, celulitis, pérdida de visión."]},
  {h:"Cuerpos orgánicos", li:["Semillas, alimentos, material vegetal.","Rinorrea unilateral purulenta y fétida; puede sobreinfectarse."]},
  {h:"Diagnóstico y manejo", li:["Rinoscopia anterior: la más eficaz, fácil y de primera línea.","TC no indicada; generalmente se ve el objeto.","Extracción con pinza de cocodrilo, gancho en ángulo recto o cureta.","Si fallas 2 veces (mejor solo 1) o no lo ves: referir a ORL (cirugía endoscópica si hace falta)."]},
  {h:"Rinosinusitis", li:["Generalmente de origen viral; inflamación de mucosa nasal y senos.","Predisponen: infección viral, rinitis, tabaco, inmunodeficiencia.","Bacterias: S. pneumoniae, Moraxella, H. influenzae.","Congestión, rinorrea purulenta, dolor/presión facial, cefalea, hiposmia, dolor dental, halitosis.","Respuesta Th2 (IL-4, IL-5, IL-13) activa mastocitos y eosinófilos; por eso se confunde con alergia.","Fibrosis quística: principal causa de pólipos en niños.","Calcificaciones dentro del seno (parece hueso): aspergilosis."]}
 ],
 pearls:[
  ["alerta","Pila de botón en nariz = urgencia. Daño a los 30 minutos, necrosis en 2 horas."],
  ["examen","Rinorrea unilateral fétida en niño = cuerpo extraño."],
  ["examen","Pila de botón en Rx: signo del doble halo."],
  ["clinica","Pólipos nasales en un niño: pensar en fibrosis quística."]
 ],
 cards:[
  ["¿Estudio de primera línea para cuerpo extraño nasal?","Rinoscopia anterior."],

{id:"fungica", region:"Nariz y senos paranasales", week:"Sem 4", title:"Rinosinusitis fúngica, sistémicas y complicaciones",
 lede:"Formas fúngicas, enfermedades sistémicas nasosinusales, rinitis infecciosas y complicaciones orbitarias e intracraneales.",

  {h:"Formas fúngicas", wide:true, table:[["","Bola de hongos","Fúngica alérgica","Invasiva aguda"],["Huésped","Inmunocompetente","Atópico","Inmunosuprimido, diabético"],["Agente","Aspergillus","Aspergillus, Alternaria, Bipolaris, Fusarium, Curvularia","Rhizopus (mucormicosis), Aspergillus"],["Sitio","Maxilar → etmoides → esfenoides → frontal","Etmoides","—"],["Clave","No invasiva; calcificaciones en TC; proptosis o hipoestesia (nervio infraorbitario, V2)","Pólipos, mucina verde-amarilla con cristales de Charcot-Leyden, eosinofilia","Mucosa negra en nariz, paladar u ojo"],["Dx","TC; biopsia y cultivo","TC (densidad de tejido blando, remodelación)","TC/RM, biopsia y cultivo urgentes"],["Tx","Resección; antifúngico si recidiva","Desbridamiento, esteroide tópico y oral, inmunoterapia","Hospitalizar, desbridamiento urgente, anfotericina B liposomal IV, corregir inmunosupresión"]]},
  {h:"Histopatología", li:["Bola de hongos: hifas septadas a 45° (en Y), agar Sabouraud, sin invasión.","Alérgica: hifas sin invasión, mucina alérgica con Charcot-Leyden.","Tinción de plata y tinta china útiles.","El cultivo tarda 7–10 días: predomina la clínica.","Aspergillus: voriconazol. Anfotericina B liposomal de elección; caspofungina alternativa."]},
  {h:"Enfermedades sistémicas", li:["EREA (tríada de Samter): asma, pólipos nasales, intolerancia a aspirina.","Churg-Strauss: fase prodrómica (rinitis alérgica y asma), infiltrativa eosinofílica (Löffler), sistémica. Parece rinitis alérgica.","Síndrome sinobronquial: rinosinusitis crónica + asma + bronquiectasias + bronquitis crónica + neumonía recurrente.","Fibrosis quística: autosómica recesiva, F508del en CFTR (cromosoma 7). Moco espeso; Pseudomonas, Burkholderia cepacia, S. aureus. Dx: test de cloro, genética, tamiz neonatal.","Granulomatosis con poliangeítis: granulomas necrosantes, vasculitis, glomerulonefritis, nariz en silla de montar. C-ANCA. Lavados, prednisona, ciclofosfamida."]},
  {h:"Rinitis infecciosas y otras", li:["Rinitis atrófica: secundaria a cirugía de cornetes o trauma; Klebsiella. Síndrome de nariz vacía: obstrucción paradójica, mal olor, epistaxis.","Rinoescleroma: endémico de LATAM, Klebsiella rhinoscleromatis. Fases catarral, granulomatosa, fibrótica. Células de Mikulicz y cuerpos de Russell. Tetraciclina y ciprofloxacino. Siempre laringoscopía.","Rinosporidiosis: lesión color cereza indolora; endémica de África (agua contaminada). Antifúngico y resección.","Influenza A y B: oseltamivir c/12 h x 5 días, útil en las primeras 48 h (mejor 24 h). Prueba rápida: E más de 90%, S 50–70%."]},
  {h:"Complicaciones orbitarias (de menos a más grave)", wide:true, table:[["Cuadro","Datos","Manejo"],["Celulitis preseptal","Anterior al septum orbitario; fiebre, dolor","Antibiótico"],["Celulitis orbitaria","Posterior al septum; edema, eritema, proptosis, quemosis. SIN restricción de movimientos ni cambio visual","Antibiótico parenteral; quirófano si no mejora en 24 h"],["Absceso subperióstico","Lo anterior + restricción de movimientos oculares","Abordaje combinado con oftalmología"],["Absceso orbitario","Lo anterior + cambio de visión","Antibiótico parenteral + cirugía"],["Trombosis del seno cavernoso","Fiebre en picos, papiledema, cambios visuales; S. aureus","Parenteral + cirugía"]]},
  {h:"Complicaciones intracraneales y óseas", li:["Tumor de Pott (Pott's puffy tumor): osteomielitis frontal por venas diploicas; antibiótico parenteral, trepanación, desbridamiento.","Meningitis: Hib, neumococo, estreptococo; Kernig y Brudzinski. Punción lumbar, hospitalizar, carbapenémico.","Absceso epidural: imagen biconvexa (lente); riesgo con sinusitis frontal. Antibiótico y drenaje.","Empiema subdural: deterioro neurológico (convulsiones, hemiplejía, coma); media luna. Antibiótico y craneotomía.","Absceso cerebral: fiebre, cefalea, rigidez de nuca; TC/RM con contraste, imagen con reborde (posible pregunta de examen)."]},
  {h:"Perlas de casos y biológicos", li:["Rinosinusitis crónica: TC simple con ventana ósea en 3 planos; revisar cavidad oral (antecedente de extracción dental).","Niveles hidroaéreos: sugieren infección bacteriana.","Con pólipos: macrólido o doxiciclina. Sin pólipos (neutrofílica): macrólido 3 semanas.","Dupilumab (IL-4 e IL-13): el más eficaz para pólipos y olfato. Omalizumab (IgE). Mepolizumab (IL-5)."]}

{id:"trauma", region:"Nariz y senos paranasales", week:"Sem 5", title:"Trauma nasal y epistaxis",
 lede:"Fracturas nasales (clasificación, reducción, manejo) y epistaxis anterior y posterior.",
 sections:[
  {h:"Fractura nasal: epidemiología", li:["Fractura más común de los huesos faciales; hombres de 15–30 años.","Ocurre bajo la línea intercantal, donde el hueso es más delgado.","Golpe lateral: más común. Frontal: más destructivo, puede dar fractura naso-etmoidal.","Niños: fracturas en tallo verde; riesgo de hematoma.","Área keystone: si se fractura, se hunde la nariz."]},
  {h:"Fuerza y patrón", li:["Lateral moderada: fractura de un lado, septum íntegro.","Frontal moderada: septum fracturado, hundimiento de huesos nasales.","Lateral fuerte: septum fracturado, lado contralateral desplazado.","Frontal fuerte: conminuta (nariz estrellada, como bolsa de canicas); puede requerir injertos.","Tipos: uni/bilateral, libro abierto, impactada, tallo verde, conminuta."]},
  {h:"Clínica y diagnóstico", li:["Dolor 54%, desviación 58%, hundimiento 56%, crepitación 2%, epistaxis, edema, equimosis.","Sin epistaxis es poco probable que haya fractura.","Siempre descartar hematoma septal y rinolicuorrea (goteo hialino). Telecanto: naso-etmoidal.","Imagen: TC de nariz; perfilograma y Waters (vienen en la GPC)."]},
  {h:"Grados y tratamiento", table:[["Grado","Fractura","Manejo"],["1","Sin desplazamiento","Solo férula"],["2","Desplazada","Reducción cerrada"],["3","Desviación de 50% con compromiso septal mayor (conminuta)","Reducción abierta"]]},
  {h:"Tiempos de reducción", li:["Reducción cerrada en las primeras 3 horas o a los 3–10 días, antes de consolidar.","Entre 6 horas y 2–3 días no se recomienda por el edema; dar esteroide para desinflamar.","Fractura abierta: antibiótico IV en las primeras 3 horas (reduce infección 59%). Cubrir S. aureus, estreptococo y gramnegativos; checar tétanos.","Bloqueo: infratroclear, supratroclear, etmoidal anterior (rama externa) e infraorbitario."]},
  {h:"Posreducción", li:["Taponamiento (soporte interno) y férula nasal.","Retirar taponamiento a los 4–5 días; antihistamínico, AINE, cefalosporina de 1ª generación.","Compresas frías 24–48 h; humedecer el tapón antes de retirarlo.","Descongestionante local (oximetazolina) máximo 5 días.","Diprospan: esteroide de depósito, dura hasta 21 días.","Complicaciones: deformidad, obstrucción, hematoma o perforación septal, fractura de lámina cribiforme."]},
  {h:"Epistaxis: anatomía", li:["Anterior: plexo de Kiesselbach (palatina mayor, labial superior, esfenopalatina, etmoidal anterior).","Posterior: plexo de Woodruff (esfenopalatina, faríngea ascendente, septal posterior).","Afecta hasta 60% de la población. Picos: menores de 10 años y mayores de 40. Más en invierno y primavera.","Causa más frecuente: trauma digital. También tópicos y cocaína. Refractaria: HTA, aspirina, alcohol.","Tumores: angiofibroma, feocromocitoma."]},
  {h:"Epistaxis: manejo escalonado", li:["1. Lubricación (nasogel o aceite de bebé 1–2 gotas, 2–3 semanas; la guía dice 6).","2. Presión directa + vasoconstrictor (oximetazolina).","3. Cauterio con nitrato de plata (12–15 s) o eléctrico; nunca ambos lados a la vez.","4. Taponamiento anterior 1–5 días; Gelfoam o selladores de fibrina (Surgicel, Quixil).","5. Quirúrgico: ligadura endoscópica de esfenopalatina 93%, carótida externa 93%, maxilar interna 91%, embolización 88%, cauterio endoscópico 83%.","Pedir TP, TTP, fibrinógeno, plaquetas. Von Willebrand no diagnosticado en niños."]}

{id:"anomalias", region:"Nariz y senos paranasales", week:"Sem 6", title:"Desviación septal y tumores nasales",
 lede:"Desviación septal y su manejo, y tumores nasosinusales: papiloma invertido, angiofibroma, hemangioma, osteoma y schwannoma.",
 sections:[
  {h:"Desviación septal", li:["Cartílago septal, lámina perpendicular del etmoides, huesos nasales, vómer.","Causas: trauma, parto distócico, deportes.","Obstrucción bilateral de predominio unilateral, costras, epistaxis, cefalea, rinosinusitis recurrente, SAOS.","Más anterior = más síntomas. Más alta = menos obstrucción pero menos olfato.","En C (anterior y posterior), en S (trauma), espolón (cresta basal, premaxila).","Exploración: rinoscopia anterior y endoscopía. No Rx; TC apoya y protege médico-legalmente."]},
  {h:"Septumplastia", li:["Septumplastia, cornetes, válvulas o rinoseptumplastia funcional.","Evitar cambios bruscos de presión, estornudar con boca abierta, no fumar.","Control a 5–10 días y al mes; rinoseptumplastia a 3, 6 y 12 meses.","Incapacidad: 14 días no complicada, 21 complicada."]},
  {h:"Papiloma nasal invertido", li:["Benigno de epitelio columnar pseudoestratificado; 5% de tumores nasales, más en hombres.","Maligniza a epidermoide en 5–15% (10% en promedio).","Exofítico: VPH 6 y 11, EBV; del septum. Oncocítico: el que más maligniza (mutación KRAS), del seno maxilar o pared lateral.","Obstrucción unilateral con rinorrea, aspecto de racimo de uvas, hiposmia.","TC: hiperostosis en sitio de inserción. RM: patrón cerebriforme.","TC contrastada ANTES de biopsiar. Biopsia = dx definitivo; mandar muestras grandes.","Resección endoscópica y fresado de la inserción: menos de 3% de recidiva. Tipo I antrostomía, II maxilectomía medial, III Denker."]},
  {h:"Angiofibroma nasofaríngeo juvenil", li:["Adolescentes hombres; tumor vascular más frecuente de nariz.","Obstrucción nasal y epistaxis; puede invadir cráneo.","TC: masa que capta en foramen esfenopalatino; signo de Holman-Miller (pared posterior del maxilar desplazada).","RM y angio-RM. NO biopsiar.","Cirugía endoscópica (estándar de oro) con embolización 1–2 días antes. Recurrencia 35%."]},
  {h:"Clasificación de Chandler", table:[["Estadio","Extensión"],["I","Confinado a nasofaringe"],["II","Cavidad nasal y/o esfenoides"],["III","Antro maxilar, etmoides, fosa pterigomaxilar, infratemporal"],["IV","Intracraneal (generalmente no se opera)"]]},
  {h:"Otros tumores", li:["Hemangioma capilar: mujeres, plexo de Kiesselbach, masa roja o morada; puede perforar el septum. T1 hipo, T2 hiper, realza con gadolinio.","Osteoma: tumor benigno más común de senos; 80% frontal. Incidental, crecimiento lento; se quita si obstruye el drenaje frontal.","Diferenciales: fibroma osificante (halo en cáscara de huevo) y displasia fibrosa (vidrio despulido, McCune-Albright).","Schwannoma: células de Schwann (V1, V2, vidiano); Antoni A y B. Resección quirúrgica total. Caso clínico seguro en examen."]}

/* 1. Faringe: viral, estreptococo, mononucleosis, absceso */
function mouth(cx, v){
  const L=cx-52, R=cx+52;
  let tonL=`<ellipse cx="${L}" cy="118" rx="20" ry="30" class="f-ton"/>`, tonR=`<ellipse cx="${R}" cy="118" rx="20" ry="30" class="f-ton"/>`;
  let uv=`<ellipse cx="${cx}" cy="74" rx="9" ry="20" class="f-tis"/>`, extra="";
  if(v==="viral"){ tonL=tonL.replace('f-ton','f-ton red'); tonR=tonR.replace('f-ton','f-ton red'); }

function renderHome(){
  setR("oral");
  const n=REAL.filter(t=>done[t.id]).length, pct=Math.round(n/REAL.length*100);
  const cards=REAL.reduce((a,t)=>a+t.cards.length,0), qs=REAL.reduce((a,t)=>a+t.quiz.length,0);
  $("#view").innerHTML = `
  <section class="hero gutter"><div class="inner">
    <div>
      <div class="mono kicker">Otorrinolaringología · Dr. Fernando Valdez Arellano · CN-201</div>
      <h1>Tus apuntes de otorrino, <em>listos para repasar</em></h1>
      <p>Semanas 1 a 6 en el orden del curso: cavidad oral, faringe, laringe, nariz y senos. Cada tema trae resumen, perlas de examen, tarjetas y quiz.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${REAL.length}</b><span>temas con apuntes</span></div>
      <div class="stat"><b>${cards}</b><span>tarjetas de memoria</span></div>
      <div class="stat"><b>${qs}</b><span>preguntas de quiz</span></div>
      <div class="stat"><b>${REAL.reduce((a,t)=>a+t.pearls.length,0)}</b><span>perlas de examen</span></div>
      <div class="stat prog"><div class="ring" style="--p:${pct}"></div><div><b>${n} de ${REAL.length} repasados</b><span>${n?"Sigue así.":"Marca cada tema cuando lo termines."}</span></div></div>
    </div>
  </div></section>
  <section class="regions gutter"><div class="inner">${REGIONS.map(R=>{
    const list=T.filter(t=>t.region===R.name);
    return `<article class="region" data-r="${R.r}">
      <div class="region-head">${R.icon}<div><div class="mono">${list.filter(t=>!t.empty).length} temas · ${list.filter(t=>done[t.id]).length} repasados</div><h2>${R.name}</h2></div></div>
      <ol>${list.map(t=>`<li><button class="trow${done[t.id]?" is-done":""}${t.empty?" is-empty":""}" data-id="${t.id}"><span class="chk">✓</span><span><span class="tt">${esc(t.title)}</span><span class="meta">${t.empty?"Sin apuntes en Notion":`${t.cards.length} tarjetas · ${t.quiz.length} preguntas${(imgsOf(t.id).length+diagOf(t.id).length)?` · ${imgsOf(t.id).length+diagOf(t.id).length} imágenes`:""}`}</span></span><span class="wk">${t.week}</span></button></li>`).join("")}</ol>
    </article>`;}).join("")}</div></section>`;
  document.querySelectorAll(".trow").forEach(b=>b.onclick=()=>go({name:"topic",id:b.dataset.id,tab:"resumen"}));
}

/* ───── piezas de tema ───── */
function tocHTML(cur){
  return REGIONS.map(R=>`<div data-r="${R.r}"><h3 class="mono"><i></i>${R.name}</h3><ul>${T.filter(t=>t.region===R.name).map(t=>`<li><button data-id="${t.id}" aria-current="${t.id===cur}"><span>${esc(t.title)}</span>${done[t.id]?'<span class="ok">✓</span>':""}</button></li>`).join("")}</ul></div>`).join("");
}
function selectHTML(cur){
  return `<label class="mono" for="tsel" style="display:block;margin-bottom:6px;color:var(--muted)">Cambiar de tema</label><select id="tsel">${REGIONS.map(R=>`<optgroup label="${R.name}">${T.filter(t=>t.region===R.name).map(t=>`<option value="${t.id}"${t.id===cur?" selected":""}>${done[t.id]?"✓ ":""}${esc(t.title)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
function secHTML(s,i){
  let b="";
  if(s.li) b+=`<ul>${s.li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(s.table){const [h,...rows]=s.table; b+=`<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
  if(s.note) b+=`<p class="note">${esc(s.note)}</p>`;
  const dgs=(DIAG[curTopic]||{})[s.h];
  if(dgs) b+=dgs.map(([g,c])=>`<button class="diag" data-cap="${esc(c)}">${g}<span>${esc(c)}</span></button>`).join("");
  const ims=(IMGS[curTopic]||{})[s.h];
  if(ims) b+=`<div class="figs${ims.length===1?" one":""}">${ims.map(([f,c])=>`<button class="fig" data-src="img/${f}.webp" data-cap="${esc(c)}"><img src="img/${f}.webp" alt="${esc(c)}" loading="lazy"><span>${esc(c)}</span></button>`).join("")}</div>`;
  return `<section class="sec"><h3><span class="no">${String(i+1).padStart(2,"0")}</span>${esc(s.h)}</h3>${b}</section>`;
}
const isWide = s=>s.wide||(s.table&&s.table[0].length>3);

/* tarjetas */
let deck=[], ci=0, known=new Set();
function fcHTML(){ return `<div class="fc">
  <div class="fc-top"><span id="ccount"></span><span id="cknown"></span></div>
  <div class="pbar"><i id="cbar"></i></div>
  <button class="card" id="card" aria-label="Voltear tarjeta"><div class="card-inner">
    <div class="face front"><span class="mono lab" id="clab"></span><div class="q" id="cq"></div><span class="hint">Toca o presiona espacio para ver la respuesta</span></div>
    <div class="face back"><span class="mono lab">Respuesta</span><div class="a" id="ca"></div><span class="hint">¿La sabías?</span></div>
  </div></button>
  <div class="fc-ctrl"><button class="btn" id="prev">← Anterior</button><button class="btn again" id="again">Repasar de nuevo</button><button class="btn know" id="know">La sé ✓</button><button class="btn" id="shuf">Barajar</button></div>
  <span class="kbd">Teclado: ← → para moverte · espacio para voltear</span></div>`; }
function showCard(){
  if(!deck.length) return; const c=deck[ci];
  $("#card").classList.remove("flip");
  $("#cq").textContent=c[0]; $("#ca").textContent=c[1]; $("#clab").textContent=c[2]||"Pregunta";
  $("#ccount").textContent=`Tarjeta ${ci+1} de ${deck.length}`;
  $("#cknown").textContent=`${known.size} marcadas como sabidas`;
  $("#cbar").style.width=((ci+1)/deck.length*100)+"%";
}
function bindCards(list){
  deck=list.slice(); ci=0; known=new Set();
  const next=()=>{ci=(ci+1)%deck.length;showCard();};
  $("#card").onclick=()=>$("#card").classList.toggle("flip");
  $("#prev").onclick=()=>{ci=(ci-1+deck.length)%deck.length;showCard();};
  $("#know").onclick=()=>{known.add(deck[ci][0]);next();};
  $("#again").onclick=()=>{known.delete(deck[ci][0]);deck.push(deck[ci]);next();};
  $("#shuf").onclick=()=>{deck=shuffle(deck);ci=0;showCard();};
  showCard();
}

/* quiz */
function quizHTML(list){
  return `<div class="quiz"><div class="qhead"><span class="score" id="score">${list.length} preguntas</span><button class="btn" id="reset">Reiniciar</button></div>
  <div class="pbar" style="width:100%"><i id="qbar" style="width:0"></i></div>
  ${list.map((q,i)=>`<div class="qitem" data-i="${i}"><p class="qq"><span>${String(i+1).padStart(2,"0")}</span>${esc(q[0])}</p><div class="opts">${q[1].map((o,j)=>`<button class="opt" data-j="${j}"><span class="L">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div><p class="why" hidden>${esc(q[3])}</p></div>`).join("")}
  <div id="final"></div></div>`;
}
function bindQuiz(list, again){
  let ok=0, ans=0;
  document.querySelectorAll(".qitem").forEach(el=>{
    const q=list[+el.dataset.i];
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      el.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.j===q[2]) x.classList.add("right");});
      if(+b.dataset.j!==q[2]) b.classList.add("wrong"); else ok++;
      ans++; el.querySelector(".why").hidden=false;
      $("#score").textContent=`${ok} correctas de ${ans}`;
      $("#qbar").style.width=(ans/list.length*100)+"%";
      if(ans===list.length){ const p=Math.round(ok/list.length*100);
        $("#final").innerHTML=`<div class="final"><div><span class="mono">Resultado</span><br><b>${ok} de ${list.length} · ${p}%</b></div><span>${p>=80?"Dominas este tema.":p>=60?"Vas bien, repasa las que fallaste.":"Vuelve al resumen y a las tarjetas."}</span></div>`; }
    });
  });
  $("#reset").onclick=again;
}

/* ───── vista de tema ───── */
function renderTopic(){
  const t=T.find(x=>x.id===view.id), r=RCODE[t.region]; setR(r);
  const tab=view.tab||"resumen"; curTopic=t.id;
  let body="";
  if(t.empty){ body=`<div class="empty-note">Esta página está vacía en tu Notion. Cuando agregues tus apuntes, se puede sumar aquí.</div>`; }
  else if(tab==="resumen"){
    const wide=t.sections.map((s,i)=>[s,i]).filter(([s])=>isWide(s)), rest=t.sections.map((s,i)=>[s,i]).filter(([s])=>!isWide(s));
    body=`${wide.map(([s,i])=>`<div class="widebox">${secHTML(s,i)}</div>`).join("")}<div class="masonry">${rest.map(([s,i])=>secHTML(s,i)).join("")}</div>`;
  } else if(tab==="perlas"){
    body=`<div class="pgroups">${["examen","alerta","clinica"].map(k=>{const ps=t.pearls.filter(p=>p[0]===k); return ps.length?`<div class="pgroup pg-${k}"><h3><span class="dot">${KINFO[k][1]}</span>${KINFO[k][0]}</h3>${ps.map(p=>`<div class="pearl">${esc(p[1])}</div>`).join("")}</div>`:"";}).join("")}</div>`;
  } else if(tab==="imagenes"){
    body=`${diagOf(t.id).length?`<h3 class="gal-h">Diagramas explicativos</h3><div class="gallery wide">${diagOf(t.id).map(([g,c])=>`<button class="diag" data-cap="${esc(c)}">${g}<span>${esc(c)}</span></button>`).join("")}</div>`:""}${imgsOf(t.id).length?`<h3 class="gal-h">De tus apuntes</h3>`:""}<div class="gallery">${imgsOf(t.id).map(([f,c])=>`<button class="fig" data-src="img/${f}.webp" data-cap="${esc(c)}"><img src="img/${f}.webp" alt="${esc(c)}" loading="lazy"><span>${esc(c)}</span></button>`).join("")}</div>`;
  } else if(tab==="tarjetas") body=fcHTML();
  else body=quizHTML(t.quiz);

  const tabs=t.empty?"":`<div class="seg" role="tablist">${[["resumen","Resumen",t.sections.length],["perlas","Perlas",t.pearls.length],["tarjetas","Tarjetas",t.cards.length],["quiz","Quiz",t.quiz.length]].concat((imgsOf(t.id).length+diagOf(t.id).length)?[["imagenes","Imágenes",imgsOf(t.id).length+diagOf(t.id).length]]:[]).map(([k,l,n])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}<span class="n">${n}</span></button>`).join("")}</div>`;
  $("#view").innerHTML=`<div class="gutter"><div class="inner topic-layout">
    <nav class="toc" aria-label="Temas">${tocHTML(t.id)}</nav>
    <main style="min-width:0">
      <div class="toc-mobile">${selectHTML(t.id)}</div>
      <div class="thead">
        <div class="crumbs mono"><button id="crumb-home">Inicio</button><span>/</span><span>${t.region}</span></div>
        <h1>${esc(t.title)}</h1>
        ${t.lede?`<p>${esc(t.lede)}</p>`:""}
        <div class="thead-row"><div class="chips"><span class="chip">${t.week}</span>${t.empty?"":`<span class="chip">${t.sections.length} secciones</span><span class="chip">${t.cards.length} tarjetas</span><span class="chip">${t.quiz.length} preguntas</span>${(imgsOf(t.id).length+diagOf(t.id).length)?`<span class="chip">${imgsOf(t.id).length+diagOf(t.id).length} imágenes</span>`:""}`}</div>
        ${t.empty?"":`<button class="done-btn" id="done" aria-pressed="${!!done[t.id]}">${done[t.id]?"✓ Repasado":"Marcar como repasado"}</button>`}</div>
      </div>
      ${tabs}${body}
      <button class="btn back home-link" id="back2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Volver al menú principal</button>
    </main></div></div>`;
  $("#crumb-home").onclick=()=>go({name:"home"});
  $("#back2").onclick=()=>go({name:"home"});
  document.querySelectorAll(".toc button").forEach(b=>b.onclick=()=>go({name:"topic",id:b.dataset.id,tab:"resumen"}));
  $("#tsel").onchange=e=>go({name:"topic",id:e.target.value,tab:"resumen"});
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;save();renderTopic();});
  if($("#done")) $("#done").onclick=()=>{done[t.id]=!done[t.id];save();renderTopic();};
  if(!t.empty && tab==="tarjetas") bindCards(t.cards);
  if(!t.empty && tab==="quiz") bindQuiz(t.quiz, renderTopic);
}

/* ───── repaso mezclado ───── */
function renderMix(){
  setR("lar");
  const tab=view.tab||"tarjetas";
  const cards=shuffle(REAL.flatMap(t=>t.cards.map(c=>[c[0],c[1],t.title])));
  const quiz=shuffle(REAL.flatMap(t=>t.quiz)).slice(0,15);
  $("#view").innerHTML=`<div class="gutter"><div class="inner" style="padding-block:24px 56px;max-width:900px">
    <div class="thead"><div class="crumbs mono"><button id="crumb-home">Inicio</button><span>/</span><span>Todos los temas</span></div>
    <h1>Repaso mezclado</h1><p>${cards.length} tarjetas de todos los temas en orden aleatorio, o un quiz de 15 preguntas al azar.</p></div>
    <div class="seg" role="tablist"><button data-tab="tarjetas" aria-selected="${tab==="tarjetas"}">Tarjetas<span class="n">${cards.length}</span></button><button data-tab="quiz" aria-selected="${tab==="quiz"}">Quiz<span class="n">15</span></button></div>
    ${tab==="quiz"?quizHTML(quiz):fcHTML()}</div></div>`;
  $("#crumb-home").onclick=()=>go({name:"home"});
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;renderMix();});
  if(tab==="quiz") bindQuiz(quiz, renderMix); else bindCards(cards);
}

/* ───── búsqueda ───── */
function renderSearch(q){
  setR("nar");
  const n=norm(q), hits=[];
  REAL.forEach(t=>{
    t.sections.forEach(s=>{[...(s.li||[]),...(s.table?s.table.slice(1).map(r=>r.join(" · ")):[])].forEach(l=>{if(norm(l).includes(n)||norm(s.h).includes(n)) hits.push({t,where:s.h,text:l,tab:"resumen"});});});
    t.pearls.forEach(p=>{if(norm(p[1]).includes(n)) hits.push({t,where:"Perla",text:p[1],tab:"perlas"});});
    t.cards.forEach(c=>{if(norm(c[0]+" "+c[1]).includes(n)) hits.push({t,where:"Tarjeta",text:c[0]+" "+c[1],tab:"tarjetas"});});
  });
  const hl=s=>{const i=norm(s).indexOf(n); return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));};
  $("#view").innerHTML=`<div class="gutter"><div class="inner"><div class="results">
    <span class="mono" style="color:var(--muted)">Búsqueda</span><h1>${hits.length} resultado${hits.length===1?"":"s"} para “${esc(q)}”</h1>
    ${hits.slice(0,80).map((h,i)=>`<button class="hit" data-i="${i}" data-r="${RCODE[h.t.region]}"><i></i><span><small>${esc(h.t.title)} · ${esc(h.where)}</small>${hl(h.text)}</span></button>`).join("")||'<div class="empty-note">Sin coincidencias. Prueba con otra palabra, por ejemplo "amígdala" o "KTP".</div>'}
  </div></div></div>`;
  document.querySelectorAll(".hit").forEach(b=>b.onclick=()=>{const h=hits[+b.dataset.i];$("#q").value="";go({name:"topic",id:h.t.id,tab:h.tab});});
}

function render(){
  $("#back").hidden = view.name==="home" && !$("#q").value.trim();
  if(view.name==="topic") renderTopic();
  else if(view.name==="mix") renderMix();
  else renderHome();
}

document.addEventListener("click",e=>{const g=e.target.closest(".diag"); if(g){ $("#lb-img").hidden=true; $("#lb-svg").hidden=false; $("#lb-svg").innerHTML=g.querySelector("svg").outerHTML; $("#lb-cap").textContent=g.dataset.cap; $("#lb").hidden=false; return; }
  const f=e.target.closest(".fig"); if(!f) return; $("#lb-img").hidden=false; $("#lb-svg").hidden=true; $("#lb-img").src=f.dataset.src; $("#lb-img").alt=f.dataset.cap; $("#lb-cap").textContent=f.dataset.cap; $("#lb").hidden=false;});
$("#lb").onclick=e=>{ if(e.target.id!=="lb-img" && !e.target.closest("#lb-svg")) $("#lb").hidden=true; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#lb").hidden=true; });
$("#back").onclick=()=>{$("#q").value="";go({name:"home"});};
$("#home").onclick=()=>{$("#q").value="";go({name:"home"});};
$("#mix").onclick=()=>{$("#q").value="";go({name:"mix",tab:"tarjetas"});};
$("#q").addEventListener("input",e=>{const v=e.target.value.trim(); if(v.length>=2){ $("#back").hidden=false; renderSearch(v);} else render();});
document.addEventListener("keydown",e=>{ if(!$("#card")||/INPUT|SELECT/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"){$("#know")&&($("#card").classList.remove("flip"), ci=(ci+1)%deck.length, showCard());}
  if(e.key==="ArrowLeft"){ci=(ci-1+deck.length)%deck.length;showCard();}
  if(e.key===" "){e.preventDefault();$("#card").classList.toggle("flip");} });

render();
</script>

</body></html>
