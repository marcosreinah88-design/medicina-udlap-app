<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>6to semestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../fonts/g973afc81ad.css">
<style>
/* Layout: un anaquel de expedientes. Encabezado sobrio, filtros por materia, rejilla de tarjetas-carpeta; al abrir una, el artefacto ocupa toda la pantalla. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e3e8ee; --ink:#152233; --muted:#5a6878; --line:#cfd7e0;
  --accent:#1d5c8f; --accent-soft:#dde9f4;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --surface:#161f2a; --surface-2:#1e2936; --ink:#e4eaf1; --muted:#9aa8b8; --line:#2b3746;
  --accent:#8cc0ea; --accent-soft:#1c2d40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#161f2a; --surface-2:#1e2936; --ink:#e4eaf1; --muted:#9aa8b8; --line:#2b3746;
  --accent:#8cc0ea; --accent-soft:#1c2d40; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.hero{padding-block:48px 28px;border-bottom:1px solid var(--line)}
.kicker{font:500 .78rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.1rem,5vw,3.3rem);line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:12px 0 0;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;font-size:.9rem;color:var(--muted)}
.stats b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-size:1.05rem;margin-right:6px;font-variant-numeric:tabular-nums}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:22px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 .88rem var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.find{margin-left:auto;flex:1 1 220px;max-width:300px}
.find input{width:100%;font:inherit;font-size:.95rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-block:18px 72px}
.folder{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0;transition:transform .15s ease,border-color .15s ease}
.folder:hover{transform:translateY(-2px);border-color:var(--sw)}
.folder::before{content:"";position:absolute;top:-9px;left:-1px;width:42%;height:10px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:6px 10px 0 0}
.folder:hover::before{border-color:var(--sw)}
.swatch{height:92px;border-radius:3px 13px 0 0;background:var(--sw);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px 16px}
.swatch .code{font:500 .78rem var(--font-mono);letter-spacing:.08em;color:#fff;opacity:.92}
.swatch .mono{position:absolute;right:12px;top:-14px;font-family:var(--font-display);font-weight:700;font-size:6.5rem;line-height:1;color:#fff;opacity:.16}
.fbody{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}
.subject{font:700 .72rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.folder h2{font-family:var(--font-display);font-size:1.45rem;line-height:1.15;margin:0;text-wrap:balance}
.folder p{margin:0;color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px}
.tags span{font-size:.75rem;background:var(--surface-2);color:var(--ink);padding:2px 8px;border-radius:5px}
.open{font:600 .9rem var(--font-body);color:var(--accent);margin-top:6px}
.empty{grid-column:1/-1;color:var(--muted);font-style:italic}
.slot{border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--muted);font-size:.92rem;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){.folder{transition:none}.folder:hover{transform:none}}

/* Visor */
#viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line);background:var(--surface);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.vbar .dot{width:12px;height:12px;border-radius:3px;background:var(--vsw);flex:0 0 auto}
.vbar .vt{font-family:var(--font-display);font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.vbtn{font:600 .88rem var(--font-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.vbtn:hover{border-color:var(--accent)}
#frame{flex:1;width:100%;border:0;background:var(--bg)}
.vload{position:absolute;inset:60px 0 auto;text-align:center;color:var(--muted)}
@media (max-width:520px){.vbtn.solo{display:none}}
</style>

<header class="hero">
  <div class="wrap">
    <p class="kicker">Medicina · Repositorio de artefactos</p>
    <h1>6to semestre</h1>
    <p class="lede">Todos mis resúmenes interactivos en un solo lugar. Cada carpeta abre el artefacto completo, con sus flashcards, exámenes y buscadores funcionando igual que en el original.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por materia"></div>
    <div class="find"><input id="find" type="search" placeholder="Buscar tema, agente, enfermedad…" aria-label="Buscar en el anaquel"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="viewer" hidden>
  <div class="vbar">
    <button class="vbtn" id="back" type="button">← Anaquel</button>
    <span class="dot"></span>
    <span class="vt" id="vtitle"></span>
    <a class="vbtn solo" id="solo" href="#" target="_blank" rel="noopener">Abrir solo ↗</a>
  </div>
  <p class="vload" id="vload">Cargando…</p>
  <iframe id="frame" title="Artefacto"></iframe>
</div>

<script>
/* Para añadir un artefacto: agregar un objeto aquí y su HTML en artefactos/<id>.html */
const ARTEFACTOS = [

  /*anki:items*/
  {id:"casos-clinicos-ii",titulo:"Casos Clínicos II",materia:"Casos Clínicos II",codigo:"CA2",color:"#7a2e5c",descripcion:"Casos clínicos del 6º semestre: tus tarjetas de Anki, revisadas y corregidas.",temas:["Parcial 1"],modos:["Repasar","Ver todas"]},
  /*/anki:items*/


  {
    id: "infectologia",
    titulo: "Repaso de Infectología",
    materia: "Infectología",
    codigo: "INF",
    color: "#5a3ea6",
    descripcion: "Clases del Dr. Mario Jiménez complementadas con el Manual CTO: agentes, LCR, tratamientos con dosis y perlas ENARM/MIR.",
    temas: ["SNC","Infecciones urinarias","Cardiovascular","Diarreas bacterianas","Diarreas virales","Hepatitis virales","Protozoos y hongos","Helmintos","Artritis séptica"],
    modos: ["Estudiar","Flashcards","Examen"]
  },
  {
    id: "salud-publica",
    titulo: "Repaso de Salud Pública",
    materia: "Salud Pública",
    codigo: "SP",
    color: "#1E5A86",
    descripcion: "Primavera I 2026, módulos 1, 2 y 4: salud pública, bioestadística, epidemiología, políticas, APS y promoción de la salud, con tarjetas, quiz y examen mixto.",
    temas: ["Salud pública y FESP","Salud y enfermedad","Determinantes sociales","Sistema de salud mexicano","Etnografía y economía","Muestreo y escalas","Tendencia central y dispersión","Probabilidad y distribuciones","Pruebas estadísticas","Epidemiología, RR y OR","Salud ambiental y Una Salud","Políticas públicas","APS","Carta de Ottawa"],
    modos: ["Resumen","Tarjetas","Quiz"]
  }
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filtro = "Todas";

function stats(){
  const materias = new Set(ARTEFACTOS.map(a => a.materia));
  const temas = ARTEFACTOS.reduce((n,a) => n + a.temas.length, 0);
  $("#stats").innerHTML =
    `<span><b>${ARTEFACTOS.length}</b>${ARTEFACTOS.length===1?"artefacto":"artefactos"}</span>` +
    `<span><b>${materias.size}</b>${materias.size===1?"materia":"materias"}</span>` +
    `<span><b>${temas}</b>temas</span>`;
}
function chips(){
  const mats = ["Todas", ...new Set(ARTEFACTOS.map(a => a.materia))];
  $("#chips").innerHTML = mats.map(m => `<button type="button" aria-pressed="${m===filtro}" data-m="${esc(m)}">${esc(m)}</button>`).join("");
}
function render(){
  const q = $("#find").value.trim().toLowerCase();
  const list = ARTEFACTOS.filter(a =>
    (filtro==="Todas" || a.materia===filtro) &&
    (!q || [a.titulo,a.materia,a.descripcion,...a.temas].join(" ").toLowerCase().includes(q)));
  let html = list.map(a => `
    <button class="folder" type="button" data-id="${a.id}" style="--sw:${a.color}">
      <div class="swatch"><span class="code">${esc(a.codigo)} · ${a.temas.length} temas</span><span class="mono">${esc(a.materia[0])}</span></div>
      <div class="fbody">
        <span class="subject">${esc(a.materia)}</span>
        <h2>${esc(a.titulo)}</h2>
        <p>${esc(a.descripcion)}</p>
        <div class="tags">${a.modos.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
        <span class="open">Abrir →</span>
      </div>
    </button>`).join("");
  if (!list.length) html = `<p class="empty">Nada coincide con “${esc(q)}”.</p>`;
  else if (!q && filtro==="Todas") html += `<div class="slot">Aquí van los siguientes artefactos del semestre.</div>`;
  $("#grid").innerHTML = html;
}

const cache = {};
async function abrir(id){
  const a = ARTEFACTOS.find(x => x.id===id);
  if (!a) return cerrar(false);
  $("#vtitle").textContent = a.titulo;
  $("#viewer").style.setProperty("--vsw", a.color);
  $("#solo").href = `artefactos/${a.id}.html`;
  $("#viewer").hidden = false;
  document.body.style.overflow = "hidden";
  $("#vload").hidden = false;
  const fr = $("#frame");
  fr.srcdoc = "";
  try{
    if (!cache[id]){
      const r = await fetch(`artefactos/${a.id}.html`);
      if (!r.ok) throw new Error(r.status);
      cache[id] = await r.text();
    }
    fr.srcdoc = cache[id];
  }catch(e){
    fr.removeAttribute("srcdoc");
    fr.src = `artefactos/${a.id}.html`;
  }
  fr.onload = () => { $("#vload").hidden = true; };
}
function cerrar(push=true){
  $("#viewer").hidden = true;
  document.body.style.overflow = "";
  $("#frame").srcdoc = "";
  if (push && location.hash) history.replaceState(null, "", location.pathname + location.search);
}
function ruta(){
  const id = location.hash.slice(1);
  if (id && ARTEFACTOS.some(a => a.id===id)) abrir(id); else cerrar(false);
}

$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.m; chips(); render();
});
$("#find").addEventListener("input", render);
$("#grid").addEventListener("click", e => {
  const f = e.target.closest(".folder"); if (!f) return;
  location.hash = f.dataset.id;
});
$("#back").addEventListener("click", () => cerrar());
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#viewer").hidden) cerrar(); });
window.addEventListener("hashchange", ruta);

stats(); chips(); render(); ruta();
</script>

</body></html>
