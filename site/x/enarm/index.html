<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENARM · Tarjetas</title>
<style>
:root{--c:#f26b21;--o:#f26b21;--bg:#f7f5ef;--card:#fff;--ink:#1d2a24;--mute:#5d6b64;--line:#e0e3dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#19211d;--ink:#e7ece8;--mute:#a3b0a9;--line:#2c3832}}
:root[data-theme="dark"]{--bg:#101512;--card:#19211d;--ink:#e7ece8;--mute:#a3b0a9;--line:#2c3832}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.hero{position:relative;overflow:hidden;background:var(--c);color:#fff;padding:34px 16px 30px}
.hero .w{max-width:760px;margin:0 auto;position:relative;z-index:1}
.hero small{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;font-weight:600;letter-spacing:.03em}
.hero h1{font:700 clamp(26px,5vw,38px)/1.1 Georgia,"Times New Roman",serif;margin:12px 0 6px}
.hero p{margin:0;opacity:.92;max-width:520px}
.stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}.stats b{display:block;font-size:24px;line-height:1.1}.stats span{font-size:13px;opacity:.85}
.deck{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:230px;height:170px;opacity:.95}
.deck i{position:absolute;inset:0;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.deck i:nth-child(1){transform:rotate(-12deg) translate(-30px,6px);opacity:.35}.deck i:nth-child(2){transform:rotate(-5deg) translate(-12px,2px);opacity:.6}
.deck i:nth-child(3){display:flex;align-items:center;justify-content:center;color:var(--c);font:700 40px Georgia,serif;transform:rotate(4deg)}
@media (max-width:640px){.deck{display:none}}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.temas{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.temas h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--o)}
.temas ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.temas li{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
#ak-root{background:var(--card);border:1px solid var(--line);border-radius:16px}
#ak-root .ak{--ak-g:var(--c)}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<header class="hero"><div class="w">
  <small>Material extra · ENA</small>
  <h1>ENARM</h1>
  <p>Preguntas tipo examen, pediatría y vocabulario médico en inglés. Tus tarjetas de Anki, revisadas y corregidas, para repasar aquí mismo.</p>
  <div class="stats"><div><b>528</b><span>tarjetas</span></div><div><b>3</b><span>temas</span></div></div>
</div><div class="deck" aria-hidden="true"><i></i><i></i><i>ENA</i></div></header>
<main>
  <section class="temas"><h2>Temas</h2><ul><li>Vocabulario médico en inglés</li><li>General</li><li>Pediatría</li></ul></section>
  <div id="ak-root"></div>
  <footer>Repositorio de Marcos David Reinah Guzmán</footer>
</main>
<script src="../../anki/anki.js" data-m="enarm" data-n="529" defer></script><!--anki-->
</body>
</html>
