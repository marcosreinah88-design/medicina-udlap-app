<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="470" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Antimicóticos: dianas en la célula del hongo</text><ellipse cx="360" cy="280" rx="230" ry="160" fill="#eef6ea" stroke="#5a7a3a" stroke-width="12"/><ellipse cx="360" cy="280" rx="214" ry="144" fill="#fffaf0" stroke="#d6a84a" stroke-width="4"/><text x="360.0" y="110.0" font-size="11" fill="#5a7a3a" text-anchor="middle" font-weight="bold">pared: β-1,3-glucano y quitina</text><text x="360.0" y="168.0" font-size="11" fill="#b58a2a" text-anchor="middle" font-weight="bold">membrana con ERGOSTEROL</text><ellipse cx="450" cy="320" rx="70" ry="50" fill="#e6effa" stroke="#2b6cb0" stroke-width="2"/><text x="450.0" y="324.0" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="bold">núcleo (ADN/ARN)</text><rect x="190.0" y="190.0" width="110.0" height="30.0" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="245.0" y="209.2" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Escualeno</text><line x1="245.0" y1="222.0" x2="245.0" y2="248.4" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M245.0,254.0 L241.9,246.6 L248.1,246.6Z" fill="#555"/><rect x="190.0" y="256.0" width="110.0" height="30.0" rx="8" fill="#fff" stroke="#c98a00" stroke-width="2"/><text x="245.0" y="275.2" font-size="12" fill="#c98a00" text-anchor="middle" font-weight="bold">Lanosterol</text><line x1="245.0" y1="288.0" x2="245.0" y2="314.4" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M245.0,320.0 L241.9,312.6 L248.1,312.6Z" fill="#555"/><rect x="190.0" y="322.0" width="110.0" height="30.0" rx="8" fill="#fff" stroke="#f26b21" stroke-width="2"/><text x="245.0" y="341.2" font-size="12" fill="#f26b21" text-anchor="middle" font-weight="bold">Ergosterol</text><text x="238.0" y="242.0" fo