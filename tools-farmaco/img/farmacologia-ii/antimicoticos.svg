.0" y1="232.0" x2="254.0" y2="304.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="255.7" y1="312.8" x2="252.3" y2="295.2" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="590.0" y="278.5" width="259.9" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="720.0" y="294.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Polienos (anfotericina B, nistatina)</text><text x="720.0" y="312.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">se unen al ergosterol → poros</text><line x1="620.0" y1="292.0" x2="572.0" y2="270.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="568.3" y1="278.2" x2="575.7" y2="261.8" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="674.0" y="338.5" width="91.9" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="720.0" y="354.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Flucitosina</text><text x="720.0" y="372.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">→ 5-FU dentro del hongo: ADN/ARN</text><line x1="684.0" y1="352.0" x2="510.0" y2="326.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="508.7" y1="334.9" x2="511.3" y2="317.1" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="667.3" y="398.5" width="105.4" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="720.0" y="414.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Griseofulvina</text><text x="720.0" y="432.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">microtúbulos: frena la mitosis</text><line x1="678.0" y1="412.0" x2="420.0" y2="380.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="418.9" y1="388.9" x2="421.1" y2="371.1" stroke="#b3261e" 