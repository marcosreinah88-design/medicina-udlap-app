<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="430" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Antiparasitarios: según dónde está el parásito</text><text x="240.0" y="74.0" font-size="15" fill="#1c6b66" text-anchor="middle" font-weight="bold">Amebiasis (E. histolytica)</text><rect x="30.0" y="92.0" width="200.0" height="110.0" rx="10" fill="#fff6d6" stroke="#c98a00" stroke-width="2"/><text x="130.0" y="143.4" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">LUZ INTESTINAL</text><text x="130.0" y="159.7" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">quistes y trofozoítos</text><rect x="250.0" y="92.0" width="200.0" height="110.0" rx="10" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="350.0" y="135.3" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">PARED Y TEJIDOS</text><text x="350.0" y="151.6" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">colitis, absceso</text><text x="350.0" y="167.8" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">hepático</text><text x="130.0" y="226.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Amebicidas LUMINALES:</text><text x="130.0" y="243.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">diloxanida, yodoquinol,</text><text x="130.0" y="260.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">paromomicina</text><text x="130.0" y="277.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">(portador asintomático)</text><text x="350.0" y="226.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Amebicidas TISULARES:</text><text x="350.0" y="243.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">metronidazol, tinidazol,</text><text x="350.0" y="260.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">emetina; cloroquina</text><text x="350.0" y="277.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">(hígado)</text><rect x="30.0" y="310.0" width="420.0" height="64.0" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="240.0" y="334.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Colitis o absceso: metronidazol y DESPUÉS un luminal</text><text x="240.0" y="352.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">para erradicar los quistes que quedan en la luz.</text><text x="720.0" y="74.0" font-size="15" fill="#7b3fa0" text-anchor="middle" font-weight="bold">Paludismo (Plasmodium)</text><rect x="500.0" y="92.0" width="140.0" height="60.0" rx="10" fill="#f2f2f2" stroke="#555" stroke-width="2"/><text x="570.0" y="118.4" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Mosquito</text><text x="570.0" y="134.7" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Anopheles</text><rect x="660.0" y="92.0" width="140.0" height="60.0" rx="10" fill="#fdeee4" stroke="#f26b21" stroke-width="2"/><text x="730.0" y="111.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Fase hepática</text><text x="730.0" y="126.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">(hipnozoítos: vivax,</text><text x="730.0" y="141.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">ovale)</text><rect x="820.0" y="92.0" width="120.0" height="60.0" rx="10" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="880.0" y="111.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Fase</text><text x="880.0" y="126.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">eritrocítica</text><text x="880.0" y="141.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">(fiebre)</text><line x1="642.0" y1="122.0" x2="652.4" y2="122.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M658.0,122.0 L650.6,125.1 L650.6,118.9Z" fill="#555"/><line x1="802.0" y1="122.0" x2="812.4" y2="122.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M818.0,122.0 L810.6,125.1 L810.6,118.9Z" fill="#555"/><path d="M880,154 C880,200 570,200 570,156" fill="none" stroke="#555" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="572.0" y1="166.0" x2="570.9" y2="159.5" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M570.0,154.0 L574.3,160.8 L568.1,161.8Z" fill="#555"/><text x="560.0" y="212.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">gametocitos → mosquito</text><rect x="687.4" y="238.5" width="85.2" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="730.0" y="254.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Primaquina</text><text x="730.0" y="276.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">hepática y gametocitos</text><text x="730.0" y="289.8" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(evita recaídas; ver G6PD)</text><rect x="837.4" y="238.5" width="85.2" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="880.0" y="254.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Cloroquina</text><text x="880.0" y="276.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">de elección</text><text x="880.0" y="289.8" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">eritrocítica</text><rect x="657.2" y="318.5" width="145.7" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="730.0" y="334.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Quinina / quinidina</text><rect x="830.7" y="318.5" width="98.6" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="880.0" y="334.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Artemisinina</text><text x="880.0" y="356.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">grave o</text><text x="880.0" y="369.8" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">multirresistente</text><line x1="730.0" y1="236.0" x2="730.0" y2="154.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="721.0" y1="154.0" x2="739.0" y2="154.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><line x1="880.0" y1="236.0" x2="880.0" y2="154.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="871.0" y1="154.0" x2="889.0" y2="154.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><text x="480.0" y="414.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Helmintos: nematodos → mebendazol, albendazol, pirantel, ivermectina; trematodos → prazicuantel; cestodos → niclosamida, prazicuantel, albendazol.</text></svg>