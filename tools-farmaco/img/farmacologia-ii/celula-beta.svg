<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="450" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Célula β: cómo se libera la insulina y dónde actúan los secretagogos</text><rect x="200" y="90" width="460" height="300" rx="40" fill="#f2f8f4" stroke="#00573c" stroke-width="3"/><text x="430.0" y="114.0" font-size="13" fill="#00573c" text-anchor="middle" font-weight="bold">Célula β del páncreas</text><text x="110.0" y="170.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Glucosa</text><line x1="150.0" y1="166.0" x2="219.0" y2="166.0" stroke="#555" stroke-width="2.5" stroke-linecap="round"/><path d="M226.0,166.0 L216.8,169.9 L216.8,162.1Z" fill="#555"/><rect x="214.0" y="152.0" width="24.0" height="30.0" rx="5" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="226.0" y="206.0" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="bold">GLUT2</text><text x="320.0" y="170.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">glucosa → metabolismo</text><line x1="320.0" y1="180.0" x2="320.0" y2="209.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M320.0,216.0 L316.1,206.8 L323.9,206.8Z" fill="#555"/><text x="320.0" y="234.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">↑ ATP / ADP</text><line x1="370.0" y1="232.0" x2="621.0" y2="232.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M628.0,232.0 L618.8,235.9 L618.8,228.1Z" fill="#555"/><rect x="632.0" y="214.0" width="36.0" height="40.0" rx="6" fill="#fff" stroke="#f26b21" stroke-width="2"/><text x="694.0" y="226.0" font-size="11" fill="#f26b21" text-anchor="start" font-weight="bold">canal K⁺-ATP</text><text x="694.0" y="242.0" font-size="11" fill="#f26b21" text-anchor="start" font-weight="normal">(SUR1) se CIERRA</text><text x="560.0" y="280.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">despolarización</text><line x1="560.0" y1="288.0" x2="560.0" y2="309.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M560.0,316.0 L556.1,306.8 L563.9,306.8Z" fill="#555"/><rect x="632.0" y="300.0" width="36.0" height="40.0" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="694.0" y="318.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="bold">canal de Ca²⁺</text><text x="694.0" y="334.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">se ABRE → entra Ca²⁺</text><text x="470.0" y="336.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Ca²⁺ ↑ → exocitosis</text><circle cx="300.0" cy="350.0" r="16" fill="#fff" stroke="#00573c" stroke-width="2"/><text x="300.0" y="354.0" font-size="9" fill="#00573c" text-anchor="middle" font-weight="bold">Ins</text><circle cx="350.0" cy="350.0" r="16" fill="#fff" stroke="#00573c" stroke-width="2"/><text x="350.0" y="354.0" font-size="9" fill="#00573c" text-anchor="middle" font-weight="bold">Ins</text><circle cx="400.0" cy="350.0" r="16" fill="#fff" stroke="#00573c" stroke-width="2"/><text x="400.0" y="354.0" font-size="9" fill="#00573c" text-anchor="middle" font-weight="bold">Ins</text><line x1="300.0" y1="368.0" x2="300.0" y2="413.0" stroke="#00573c" stroke-width="3" stroke-linecap="round"/><path d="M300.0,420.0 L296.1,410.8 L303.9,410.8Z" fill="#00573c"/><text x="312.0" y="416.0" font-size="12" fill="#00573c" text-anchor="start" font-weight="bold">insulina a la sangre</text><rect x="733.7" y="98.5" width="172.6" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="820.0" y="114.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Sulfonilureas, glinidas</text><text x="820.0" y="132.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">cierran el K⁺-ATP aunque</text><text x="820.0" y="146.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">no haya glucosa → hipoglucemia</text><line x1="760.0" y1="156.0" x2="672.0" y2="216.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="677.1" y1="223.4" x2="666.9" y2="208.6" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="720.3" y="368.5" width="199.4" height="23.0" rx="11.5" fill="#00573c" stroke="#00573c" stroke-width="1"/><text x="820.0" y="384.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">GLP-1 e iDPP-4 (incretinas)</text><text x="820.0" y="402.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">↑ AMPc: potencian la secreción</text><text x="820.0" y="416.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">solo si hay glucosa (poca hipoglucemia)</text><line x1="730.0" y1="374.0" x2="425.6" y2="344.5" stroke="#00573c" stroke-width="2" stroke-linecap="round"/><path d="M420.0,344.0 L427.6,341.6 L427.0,347.8Z" fill="#00573c"/><text x="30.0" y="440.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">El diazóxido hace lo contrario: abre el K⁺-ATP y frena la secreción.</text></svg>