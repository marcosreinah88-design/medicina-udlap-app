<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="450" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Ciclo del VIH y dónde actúa cada familia de antirretrovirales</text><rect x="20.0" y="74.0" width="140.0" height="112.0" rx="12" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><circle cx="40.0" cy="94.0" r="13" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="40.0" y="99.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="96.0" y="126.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Unión</text><text x="96.0" y="144.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">gp120 a CD4</text><text x="96.0" y="162.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">y CCR5/CXCR4</text><line x1="161.0" y1="130.0" x2="171.1" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M176.0,130.0 L169.6,132.7 L169.6,127.3Z" fill="#555"/><rect x="177.0" y="74.0" width="140.0" height="112.0" rx="12" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><circle cx="197.0" cy="94.0" r="13" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="197.0" y="99.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="253.0" y="126.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Fusión</text><text x="253.0" y="144.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">gp41: entra</text><text x="253.0" y="162.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">la cápside</text><line x1="318.0" y1="130.0" x2="328.1" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M333.0,130.0 L326.6,132.7 L326.6,127.3Z" fill="#555"/><rect x="334.0" y="74.0" width="140.0" height="112.0" rx="12" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><circle cx="354.0" cy="94.0" r="13" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="354.0" y="99.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="410.0" y="126.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Transcripción</text><text x="410.0" y="144.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">inversa: ARN</text><text x="410.0" y="162.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">viral → ADN</text><line x1="475.0" y1="130.0" x2="485.1" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M490.0,130.0 L483.6,132.7 L483.6,127.3Z" fill="#555"/><rect x="491.0" y="74.0" width="140.0" height="112.0" rx="12" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><circle cx="511.0" cy="94.0" r="13" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="511.0" y="99.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="567.0" y="126.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Integración</text><text x="567.0" y="144.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">el ADN viral</text><text x="567.0" y="162.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">entra al genoma</text><line x1="632.0" y1="130.0" x2="642.1" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M647.0,130.0 L640.6,132.7 L640.6,127.3Z" fill="#555"/><rect x="648.0" y="74.0" width="140.0" height="112.0" rx="12" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><circle cx="668.0" cy="94.0" r="13" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="668.0" y="99.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="724.0" y="126.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Transcripción</text><text x="724.0" y="144.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">y traducción:</text><text x="724.0" y="162.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">poliproteínas</text><line x1="789.0" y1="130.0" x2="799.1" y2="130.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M804.0,130.0 L797.6,132.7 L797.6,127.3Z" fill="#555"/><rect x="805.0" y="74.0" width="140.0" height="112.0" rx="12" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><circle cx="825.0" cy="94.0" r="13" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="825.0" y="99.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="881.0" y="126.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Ensamblaje,</text><text x="881.0" y="144.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">gemación y</text><text x="881.0" y="162.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">maduración</text><text x="480.0" y="60.0" font-size="12" fill="#7b3fa0" text-anchor="middle" font-weight="normal">(todo ocurre dentro del linfocito T CD4+)</text><line x1="90.0" y1="252.0" x2="90.0" y2="190.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="81.0" y1="190.0" x2="99.0" y2="190.0" stroke="#b3261e" stroke-width="3.5" stroke-linecap="round"/><rect x="18.0" y="254.0" width="144.0" height="40.0" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="90.0" y="278.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Maraviroc</text><text x="90.0" y="310.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">antagonista de CCR5</text><line x1="247.0" y1="252.0" x2="247.0" y2="190.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="238.0" y1="190.0" x2="256.0" y2="190.0" stroke="#b3261e" stroke-width="3.5" stroke-linecap="round"/><rect x="175.0" y="254.0" width="144.0" height="40.0" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="247.0" y="278.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Enfuvirtida</text><text x="247.0" y="310.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">se une a gp41</text><line x1="404.0" y1="252.0" x2="404.0" y2="190.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="395.0" y1="190.0" x2="413.0" y2="190.0" stroke="#b3261e" stroke-width="3.5" stroke-linecap="round"/><rect x="332.0" y="254.0" width="144.0" height="94.0" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="404.0" y="278.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">ITIAN: zidovudina,</text><text x="404.0" y="296.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">tenofovir, emtricitabina</text><text x="404.0" y="314.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">ITINN: efavirenz,</text><text x="404.0" y="332.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">nevirapina</text><text x="404.0" y="364.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">TI = transcriptasa inversa</text><line x1="561.0" y1="252.0" x2="561.0" y2="190.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="552.0" y1="190.0" x2="570.0" y2="190.0" stroke="#b3261e" stroke-width="3.5" stroke-linecap="round"/><rect x="489.0" y="254.0" width="144.0" height="58.0" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="561.0" y="278.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Raltegravir,</text><text x="561.0" y="296.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">dolutegravir</text><text x="561.0" y="328.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">inhibidores de integrasa</text><line x1="875.0" y1="252.0" x2="875.0" y2="190.0" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="866.0" y1="190.0" x2="884.0" y2="190.0" stroke="#b3261e" stroke-width="3.5" stroke-linecap="round"/><rect x="803.0" y="254.0" width="144.0" height="58.0" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="875.0" y="278.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Saquinavir, ritonavir</text><text x="875.0" y="296.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">(«-navir»)</text><text x="875.0" y="328.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">inhibidores de proteasa</text><text x="718.0" y="272.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(aquí no actúa</text><text x="718.0" y="288.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">la clase vista)</text><rect x="20.0" y="390.0" width="920.0" height="48.0" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="480.0" y="410.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">TAR: al menos 3 fármacos (p. ej. 2 ITIAN + 1 inhibidor de integrasa) para evitar resistencia.</text><text x="480.0" y="427.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">El ritonavir a dosis bajas «potencia» a otros inhibidores de proteasa porque inhibe CYP3A4.</text></svg>