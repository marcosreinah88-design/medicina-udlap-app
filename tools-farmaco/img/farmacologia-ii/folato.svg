<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="940" height="330" fill="#fff"/><text x="470.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Antagonistas del folato: bloqueo secuencial</text><rect x="20.0" y="90.0" width="190.0" height="56.0" rx="10" fill="#f2f2f2" stroke="#555" stroke-width="2"/><text x="115.0" y="122.5" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">PABA + pteridina</text><rect x="260.0" y="90.0" width="190.0" height="56.0" rx="10" fill="#fff6d6" stroke="#c98a00" stroke-width="2"/><text x="355.0" y="114.4" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Ácido dihidrofólico</text><text x="355.0" y="130.7" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">DHF)</text><rect x="500.0" y="90.0" width="190.0" height="56.0" rx="10" fill="#e8f5ee" stroke="#00573c" stroke-width="2"/><text x="595.0" y="114.4" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Ácido tetrahidrofólico</text><text x="595.0" y="130.7" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">THF)</text><rect x="740.0" y="90.0" width="190.0" height="56.0" rx="10" fill="#e6effa" stroke="#2b6cb0" stroke-width="2"/><text x="835.0" y="122.5" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Purinas y timidina → ADN</text><line x1="212.0" y1="118.0" x2="251.0" y2="118.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M258.0,118.0 L248.8,121.9 L248.8,114.1Z" fill="#555"/><line x1="452.0" y1="118.0" x2="491.0" y2="118.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M498.0,118.0 L488.8,121.9 L488.8,114.1Z" fill="#555"/><line x1="692.0" y1="118.0" x2="731.0" y2="118.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M738.0,118.0 L728.8,121.9 L728.8,114.1Z" fill="#555"/><text x="226.0" y="176.0" font-size="12" fill="#222" text-anchor="end" font-weight="normal">Dihidropteroato</text><text x="226.0" y="192.0" font-size="12" fill="#222" text-anchor="end" font-weight="normal">sintasa</text><rect x="182.3" y="214.0" width="105.4" height="24.0" rx="12.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="235.0" y="230.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Sulfonamidas</text><line x1="235.0" y1="212.0" x2="235.0" y2="128.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="226.0" y1="128.0" x2="244.0" y2="128.0" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="466.0" y="176.0" font-size="12" fill="#222" text-anchor="end" font-weight="normal">Dihidrofolato</text><text x="466.0" y="192.0" font-size="12" fill="#222" text-anchor="end" font-weight="normal">reductasa (DHFR)</text><rect x="426.0" y="214.0" width="98.1" height="24.0" rx="12.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="475.0" y="230.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Trimetoprim</text><line x1="475.0" y1="212.0" x2="475.0" y2="128.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="466.0" y1="128.0" x2="484.0" y2="128.0" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="475.0" y="256.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(en humanos la DHFR la bloquea el metotrexato)</text><rect x="20.0" y="276.0" width="900.0" height="42.0" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="470.0" y="302.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Cada uno solo es bacteriostático; juntos (cotrimoxazol, 1:5) son sinérgicos y bactericidas. El humano no sintetiza folato: lo toma de la dieta.</text></svg>