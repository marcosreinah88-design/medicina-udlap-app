<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="440" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Hipoglucemiantes: el órgano en el que actúa cada familia</text><circle cx="480.0" cy="280.0" r="56" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="480.0" y="276.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">Glucemia</text><text x="480.0" y="298.0" font-size="18" fill="#b3261e" text-anchor="middle" font-weight="bold">↓</text><rect x="340.0" y="60.0" width="280.0" height="96.0" rx="10" fill="#fff" stroke="#f26b21" stroke-width="2"/><text x="480.0" y="84.0" font-size="14" fill="#f26b21" text-anchor="middle" font-weight="bold">Páncreas</text><text x="480.0" y="106.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Sulfonilureas, glinidas: ↑ secreción</text><text x="480.0" y="122.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">GLP-1 / iDPP-4: ↑ insulina con glucosa</text><text x="480.0" y="138.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">y ↓ glucagón</text><line x1="480.0" y1="156.0" x2="480.0" y2="220.0" stroke="#f26b21" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="20.0" y="150.0" width="280.0" height="96.0" rx="10" fill="#fff" stroke="#7a4b2a" stroke-width="2"/><text x="160.0" y="174.0" font-size="14" fill="#7a4b2a" text-anchor="middle" font-weight="bold">Hígado</text><text x="160.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Metformina: ↓ gluconeogénesis</text><text x="160.0" y="212.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">(no da hipoglucemia; RAM: GI,</text><text x="160.0" y="228.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">acidosis láctica, ↓ B12)</text><line x1="300.0" y1="198.0" x2="425.4" y2="255.1" stroke="#7a4b2a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="660.0" y="150.0" width="280.0" height="96.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="800.0" y="174.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">Músculo y grasa</text><text x="800.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Glitazonas (pioglitazona):</text><text x="800.0" y="212.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">↑ sensibilidad (PPAR-γ)</text><text x="800.0" y="228.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">RAM: edema, ↑ peso, IC</text><line x1="660.0" y1="198.0" x2="534.6" y2="255.1" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="20.0" y="300.0" width="280.0" height="96.0" rx="10" fill="#fff" stroke="#c98a00" stroke-width="2"/><text x="160.0" y="324.0" font-size="14" fill="#c98a00" text-anchor="middle" font-weight="bold">Intestino</text><text x="160.0" y="346.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Acarbosa, miglitol:</text><text x="160.0" y="362.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">retrasan la absorción de</text><text x="160.0" y="378.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">carbohidratos (flatulencia)</text><line x1="300.0" y1="348.0" x2="423.9" y2="301.2" stroke="#c98a00" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="660.0" y="300.0" width="280.0" height="96.0" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="800.0" y="324.0" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Riñón</text><text x="800.0" y="346.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">iSGLT2 (gliflozinas):</text><text x="800.0" y="362.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">glucosuria; protegen corazón</text><text x="800.0" y="378.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">y riñón; RAM: infecc. genitales</text><line x1="660.0" y1="348.0" x2="536.1" y2="301.2" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/></svg>