<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="520" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Dónde actúa cada familia de antibióticos</text><rect x="250" y="90" width="460" height="330" rx="160" fill="#f6efe2" stroke="#8a6a3a" stroke-width="10"/><rect x="262" y="102" width="436" height="306" rx="150" fill="#fffaf0" stroke="#d6a84a" stroke-width="4"/><text x="480.0" y="124.0" font-size="11" fill="#8a6a3a" text-anchor="middle" font-weight="normal">pared (peptidoglucano)</text><text x="480.0" y="140.0" font-size="11" fill="#b58a2a" text-anchor="middle" font-weight="normal">membrana</text><path d="M360,250 C390,200 430,300 460,250 S520,200 540,250 S600,300 620,250" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="490.0" y="292.0" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">ADN</text><ellipse cx="370" cy="338" rx="30" ry="16" fill="#d9c7ec" stroke="#7b3fa0" stroke-width="2"/><text x="370.0" y="342.0" font-size="11" fill="#7b3fa0" text-anchor="middle" font-weight="bold">50S</text><ellipse cx="370" cy="364" rx="22" ry="11" fill="#efe3f8" stroke="#7b3fa0" stroke-width="2"/><text x="370.0" y="368.0" font-size="10" fill="#7b3fa0" text-anchor="middle" font-weight="bold">30S</text><ellipse cx="560" cy="338" rx="30" ry="16" fill="#d9c7ec" stroke="#7b3fa0" stroke-width="2"/><text x="560.0" y="342.0" font-size="11" fill="#7b3fa0" text-anchor="middle" font-weight="bold">50S</text><ellipse cx="560" cy="364" rx="22" ry="11" fill="#efe3f8" stroke="#7b3fa0" stroke-width="2"/><text x="560.0" y="368.0" font-size="10" fill="#7b3fa0" text-anchor="middle" font-weight="bold">30S</text><text x="465.0" y="398.0" font-size="11" fill="#7b3fa0" text-anchor="middle" font-weight="normal">ribosoma 70S</text><rect x="420.0" y="166.0" width="120.0" height="32.0" rx="8" fill="#e8f5ee" stroke="#00573c" stroke-width="2"/><text x="480.0" y="186.2" font-size="12" fill="#00573c" text-anchor="middle" font-weight="bold">vía del folato</text><text x="20.0" y="96.0" font-size="13" fill="#8a6a3a" text-anchor="start" font-weight="bold">PARED CELULAR</text><text x="20.0" y="115.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">β-lactámicos (penicilinas, cefalosporinas,</text><text x="20.0" y="132.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">carbapenems, aztreonam): PBP</text><text x="20.0" y="149.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Vancomicina (D-Ala-D-Ala), bacitracina</text><line x1="245.0" y1="92.0" x2="252.0" y2="140.0" stroke="#8a6a3a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="252.0" cy="140.0" r="4" fill="#8a6a3a" stroke="none" stroke-width="2"/><text x="20.0" y="236.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">ADN / ARN</text><text x="20.0" y="255.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Fluoroquinolonas: ADN girasa y topo IV</text><text x="20.0" y="272.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Rifampicina: ARN polimerasa</text><text x="20.0" y="289.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Metronidazol, nitrofurantoína: dañan ADN</text><line x1="245.0" y1="232.0" x2="360.0" y2="250.0" stroke="#2b6cb0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="360.0" cy="250.0" r="4" fill="#2b6cb0" stroke="none" stroke-width="2"/><text x="20.0" y="376.0" font-size="13" fill="#7b3fa0" text-anchor="start" font-weight="bold">RIBOSOMA 30S</text><text x="20.0" y="395.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Aminoglucósidos (bactericidas)</text><text x="20.0" y="412.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Tetraciclinas</text><line x1="245.0" y1="372.0" x2="348.0" y2="364.0" stroke="#7b3fa0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="348.0" cy="364.0" r="4" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="730.0" y="96.0" font-size="13" fill="#b58a2a" text-anchor="start" font-weight="bold">MEMBRANA</text><text x="730.0" y="115.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Polimixinas (colistina)</text><text x="730.0" y="132.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Daptomicina</text><line x1="724.0" y1="92.0" x2="706.0" y2="170.0" stroke="#b58a2a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="706.0" cy="170.0" r="4" fill="#b58a2a" stroke="none" stroke-width="2"/><text x="730.0" y="206.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">FOLATO</text><text x="730.0" y="225.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Sulfonamidas</text><text x="730.0" y="242.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Trimetoprim</text><text x="730.0" y="259.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">(juntos: cotrimoxazol)</text><line x1="724.0" y1="202.0" x2="540.0" y2="182.0" stroke="#00573c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="540.0" cy="182.0" r="4" fill="#00573c" stroke="none" stroke-width="2"/><text x="730.0" y="326.0" font-size="13" fill="#7b3fa0" text-anchor="start" font-weight="bold">RIBOSOMA 50S</text><text x="730.0" y="345.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Macrólidos (eritro-, azitro-,</text><text x="730.0" y="362.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">claritromicina), clindamicina,</text><text x="730.0" y="379.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">cloranfenicol, linezolid</text><line x1="724.0" y1="322.0" x2="590.0" y2="338.0" stroke="#7b3fa0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="590.0" cy="338.0" r="4" fill="#7b3fa0" stroke="none" stroke-width="2"/><text x="480.0" y="470.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Regla: 30S → «A» y «T» (aminoglucósidos, tetraciclinas); 50S → macrólidos, clindamicina, cloranfenicol, linezolid.</text><text x="480.0" y="492.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Bactericidas: β-lactámicos, vancomicina, aminoglucósidos, quinolonas. Bacteriostáticos: tetraciclinas, macrólidos, clindamicina, sulfas.</text></svg>