<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="470" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Síntesis de hormonas tiroideas y dónde actúan los antitiroideos</text><rect x="40.0" y="110.0" width="170.0" height="260.0" rx="12" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="125.0" y="134.0" font-size="13" fill="#b3261e" text-anchor="middle" font-weight="bold">Capilar</text><rect x="230.0" y="90.0" width="420.0" height="300.0" rx="20" fill="#fff7ec" stroke="#f26b21" stroke-width="2.5"/><text x="440.0" y="114.0" font-size="13" fill="#f26b21" text-anchor="middle" font-weight="bold">Célula folicular</text><rect x="670.0" y="110.0" width="250.0" height="260.0" rx="40" fill="#fff3c4" stroke="#c98a00" stroke-width="2"/><text x="795.0" y="134.0" font-size="13" fill="#8a6a00" text-anchor="middle" font-weight="bold">Coloide (tiroglobulina)</text><text x="125.0" y="180.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">I⁻ (yoduro)</text><line x1="166.0" y1="176.0" x2="251.0" y2="176.0" stroke="#7b3fa0" stroke-width="2.5" stroke-linecap="round"/><path d="M258.0,176.0 L248.8,179.9 L248.8,172.1Z" fill="#7b3fa0"/><rect x="242.0" y="164.0" width="22.0" height="24.0" rx="5" fill="#fff" stroke="#7b3fa0" stroke-width="2"/><text x="272.0" y="160.0" font-size="11" fill="#7b3fa0" text-anchor="start" font-weight="bold">NIS</text><line x1="300.0" y1="180.0" x2="653.0" y2="180.0" stroke="#7b3fa0" stroke-width="2" stroke-linecap="round"/><path d="M660.0,180.0 L650.8,183.9 L650.8,176.1Z" fill="#7b3fa0"/><text x="470.0" y="170.0" font-size="11" fill="#7b3fa0" text-anchor="middle" font-weight="normal">I⁻ va al coloide</text><rect x="700.0" y="160.0" width="190.0" height="64.0" rx="10" fill="#fff" stroke="#f26b21" stroke-width="2"/><text x="795.0" y="181.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">TPO: oxida I⁻, lo une</text><text x="795.0" y="196.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">a tirosinas (MIT, DIT)</text><text x="795.0" y="211.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">y las acopla → T4, T3</text><line x1="780.0" y1="226.0" x2="780.0" y2="273.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M780.0,280.0 L776.1,270.8 L783.9,270.8Z" fill="#555"/><rect x="700.0" y="282.0" width="190.0" height="40.0" rx="8" fill="#fff" stroke="#c98a00" stroke-width="2"/><text x="795.0" y="306.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Tiroglobulina con T4/T3</text><line x1="698.0" y1="302.0" x2="427.0" y2="302.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M420.0,302.0 L429.2,298.1 L429.2,305.9Z" fill="#555"/><text x="560.0" y="294.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">endocitosis y proteólisis</text><line x1="300.0" y1="302.0" x2="177.0" y2="302.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M170.0,302.0 L179.2,298.1 L179.2,305.9Z" fill="#555"/><text x="125.0" y="300.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">T4 (90 %)</text><text x="125.0" y="318.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">T3 (10 %)</text><text x="125.0" y="350.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">periferia: T4 → T3</text><text x="125.0" y="364.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">(desyodasa)</text><rect x="253.2" y="221.0" width="153.5" height="22.0" rx="11.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="330.0" y="236.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Perclorato, tiocianato</text><line x1="330.0" y1="218.0" x2="256.0" y2="190.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="252.8" y1="198.4" x2="259.2" y2="181.6" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="504.0" y="238.5" width="112.1" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="560.0" y="254.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Metimazol, PTU</text><line x1="620.0" y1="248.0" x2="700.0" y2="200.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="695.4" y1="192.3" x2="704.6" y2="207.7" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="363.2" y="339.0" width="153.5" height="22.0" rx="11.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="440.0" y="354.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Yodo en exceso (Lugol)</text><text x="440.0" y="372.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">frena la liberación (Wolff-Chaikoff)</text><line x1="440.0" y1="336.0" x2="440.0" y2="306.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="431.0" y1="306.0" x2="449.0" y2="306.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><rect x="66.7" y="399.0" width="116.6" height="22.0" rx="11.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="125.0" y="414.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">PTU, propranolol</text><text x="125.0" y="432.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">↓ conversión T4 → T3</text><line x1="125.0" y1="396.0" x2="125.0" y2="370.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="116.0" y1="370.0" x2="134.0" y2="370.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><text x="560.0" y="418.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Yodo-131: destruye tejido. Levotiroxina (T4) = reemplazo en hipotiroidismo.</text><text x="560.0" y="438.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">PTU en el 1er trimestre del embarazo; metimazol en el resto (el PTU es más hepatotóxico).</text></svg>