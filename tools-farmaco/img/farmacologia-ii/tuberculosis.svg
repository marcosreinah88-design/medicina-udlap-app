<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="470" fill="#fff"/><text x="480.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Tuberculosis: esquema de 6 meses y dónde actúa cada fármaco</text><rect x="40.0" y="76.0" width="280.0" height="54.0" rx="8" fill="#00573c" stroke="#00573c" stroke-width="2"/><text x="180.0" y="100.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Fase intensiva · 2 meses</text><text x="180.0" y="120.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal">I + R + P (+ E o S si hay resistencia)</text><rect x="324.0" y="76.0" width="556.0" height="54.0" rx="8" fill="#1c6b66" stroke="#1c6b66" stroke-width="2"/><text x="600.0" y="100.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Fase de continuación · 4 meses</text><text x="600.0" y="120.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal">I + R</text><line x1="40.0" y1="134.0" x2="40.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="40.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 0</text><line x1="180.0" y1="134.0" x2="180.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="180.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 1</text><line x1="320.0" y1="134.0" x2="320.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="320.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 2</text><line x1="460.0" y1="134.0" x2="460.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="460.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 3</text><line x1="600.0" y1="134.0" x2="600.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="600.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 4</text><line x1="740.0" y1="134.0" x2="740.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="740.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 5</text><line x1="880.0" y1="134.0" x2="880.0" y2="142.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="880.0" y="158.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">mes 6</text><rect x="300" y="220" width="340" height="160" rx="80" fill="#fff3d6" stroke="#8a6a3a" stroke-width="12"/><rect x="312" y="232" width="316" height="136" rx="68" fill="#fffaf0" stroke="#c9a54a" stroke-width="3"/><text x="470.0" y="208.0" font-size="11" fill="#8a6a3a" text-anchor="middle" font-weight="normal">pared rica en ácidos micólicos y arabinogalactano</text><path d="M380,300 C410,270 440,330 470,300 S530,270 560,300" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="470.0" y="330.0" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">ADN → ARN</text><rect x="40.0" y="184.5" width="112.1" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="96.0" y="200.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Isoniacida (I)</text><text x="40.0" y="222.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Inhibe la síntesis de ácidos</text><text x="40.0" y="238.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">micólicos (activada por KatG)</text><text x="40.0" y="254.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">RAM: hepatitis, neuropatía</text><text x="40.0" y="270.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">(dar piridoxina)</text><line x1="230.0" y1="196.0" x2="330.0" y2="226.0" stroke="#b3261e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="330.0" cy="226.0" r="4" fill="#b3261e" stroke="none" stroke-width="2"/><rect x="40.0" y="328.5" width="105.4" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="92.7" y="344.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Etambutol (E)</text><text x="40.0" y="366.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Inhibe arabinosil transferasa</text><text x="40.0" y="382.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">(arabinogalactano)</text><text x="40.0" y="398.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">RAM: neuritis óptica</text><text x="40.0" y="414.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">(no en niños)</text><line x1="230.0" y1="340.0" x2="310.0" y2="340.0" stroke="#b3261e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="310.0" cy="340.0" r="4" fill="#b3261e" stroke="none" stroke-width="2"/><rect x="720.0" y="184.5" width="118.8" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="779.4" y="200.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Rifampicina (R)</text><text x="720.0" y="222.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Inhibe ARN polimerasa</text><text x="720.0" y="238.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">RAM: orina/lágrimas naranjas,</text><text x="720.0" y="254.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">hepatitis, inductor de CYP</text><line x1="714.0" y1="196.0" x2="510.0" y2="296.0" stroke="#b3261e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="510.0" cy="296.0" r="4" fill="#b3261e" stroke="none" stroke-width="2"/><rect x="720.0" y="328.5" width="125.5" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="782.8" y="344.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Pirazinamida (P)</text><text x="720.0" y="366.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Activa en pH ácido (pirazinamidasa)</text><text x="720.0" y="382.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">RAM: hiperuricemia (gota),</text><text x="720.0" y="398.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">hepatotoxicidad</text><line x1="714.0" y1="340.0" x2="620.0" y2="330.0" stroke="#b3261e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="620.0" cy="330.0" r="4" fill="#b3261e" stroke="none" stroke-width="2"/><text x="480.0" y="452.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Siempre combinado (evita resistencia). Dosis: INH 5 mg/kg · RIF 10 mg/kg · PZA 30 mg/kg. Estreptomicina: no en embarazo.</text></svg>