<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica,Arial,sans-serif"><rect width="940" height="470" fill="#fff"/><text x="470.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Cascada del ácido araquidónico y dónde actúan los fármacos</text><rect x="340.0" y="66.0" width="260.0" height="44.0" rx="10" fill="#fff6d6" stroke="#c98a00" stroke-width="2"/><text x="470.0" y="92.9" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Fosfolípidos de membrana</text><line x1="470.0" y1="112.0" x2="470.0" y2="153.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M470.0,160.0 L466.1,150.8 L473.9,150.8Z" fill="#555"/><text x="482.0" y="140.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Fosfolipasa A₂</text><rect x="262.8" y="126.0" width="134.5" height="24.0" rx="12.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="330.0" y="142.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Glucocorticoides</text><line x1="398.0" y1="138.0" x2="462.0" y2="138.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="462.0" y1="129.0" x2="462.0" y2="147.0" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><rect x="360.0" y="162.0" width="220.0" height="44.0" rx="10" fill="#fdeee4" stroke="#f26b21" stroke-width="2"/><text x="470.0" y="189.2" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Ácido araquidónico</text><line x1="420.0" y1="208.0" x2="256.7" y2="259.9" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M250.0,262.0 L257.6,255.5 L260.0,262.9Z" fill="#555"/><line x1="520.0" y1="208.0" x2="683.3" y2="259.9" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M690.0,262.0 L680.0,262.9 L682.4,255.5Z" fill="#555"/><text x="345.0" y="252.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">COX-1 / COX-2</text><text x="600.0" y="252.0" font-size="13" fill="#222" text-anchor="end" font-weight="bold">5-lipooxigenasa</text><rect x="53.6" y="200.0" width="192.7" height="24.0" rx="12.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="150.0" y="216.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">AINE · paracetamol (SNC)</text><line x1="205.0" y1="226.0" x2="318.0" y2="236.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="318.8" y1="227.0" x2="317.2" y2="245.0" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><rect x="771.9" y="200.0" width="76.2" height="24.0" rx="12.0" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="810.0" y="216.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Zileutón</text><line x1="780.0" y1="226.0" x2="622.0" y2="236.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="622.6" y1="245.0" x2="621.4" y2="227.0" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><rect x="150.0" y="264.0" width="200.0" height="40.0" rx="10" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="250.0" y="288.9" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">PGG₂ → PGH₂</text><rect x="600.0" y="264.0" width="200.0" height="40.0" rx="10" fill="#e6effa" stroke="#2b6cb0" stroke-width="2"/><text x="700.0" y="288.9" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Leucotrienos</text><text x="70.0" y="330.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">PGE₂</text><text x="132.0" y="330.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">fiebre, dolor, protege mucosa y riñón</text><text x="70.0" y="355.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">PGI₂</text><text x="132.0" y="355.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">antiagregante, vasodilata (endotelio)</text><text x="70.0" y="380.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">TXA₂</text><text x="132.0" y="380.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">agrega plaquetas, vasoconstriñe</text><text x="70.0" y="405.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">PGF₂α</text><text x="132.0" y="405.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">útero, cérvix</text><text x="70.0" y="430.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">PGD₂</text><text x="132.0" y="430.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">quimiotáctico</text><text x="560.0" y="330.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">LTB₄</text><text x="672.0" y="330.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">quimiotaxis de neutrófilos</text><text x="560.0" y="355.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">LTC₄, D₄, E₄</text><text x="672.0" y="355.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">broncoconstricción, permeabilidad</text><text x="560.0" y="380.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">Lipoxinas</text><text x="672.0" y="380.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">frenan la inflamación</text><rect x="600.0" y="398.5" width="91.9" height="23.0" rx="11.5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="646.0" y="414.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Montelukast</text><text x="704.0" y="414.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">bloquea el receptor de LTD₄</text><text x="470.0" y="458.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Por eso los AINE pueden dar broncoespasmo en asmáticos sensibles: la vía se desvía hacia leucotrienos.</text></svg>