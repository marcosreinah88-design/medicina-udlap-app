<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Helvetica,Arial,sans-serif"><rect width="920" height="400" fill="#fff"/><text x="460.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Atrapamiento iónico: ácido débil (naproxeno, pKa 5)</text><text x="460.0" y="52.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">pH = pKa + log [A⁻]/[HA]   ·   solo la forma NO ionizada (HA) cruza la membrana</text><rect x="30.0" y="80.0" width="360.0" height="250.0" rx="14" fill="#fff6d6" stroke="#c98a00" stroke-width="2"/><text x="210.0" y="108.0" font-size="16" fill="#8a5a00" text-anchor="middle" font-weight="bold">Jugo gástrico · pH 2</text><rect x="530.0" y="80.0" width="360.0" height="250.0" rx="14" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="710.0" y="108.0" font-size="16" fill="#b3261e" text-anchor="middle" font-weight="bold">Plasma · pH 7.4</text><rect x="430.0" y="70.0" width="60.0" height="270.0" rx="4" fill="#fff7df" stroke="#c9a54a" stroke-width="2"/><text x="460.0" y="360.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">membrana</text><line x1="250.0" y1="300.0" x2="663.0" y2="300.0" stroke="#00573c" stroke-width="3" stroke-linecap="round"/><path d="M670.0,300.0 L660.8,303.9 L660.8,296.1Z" fill="#00573c"/><line x1="670.0" y1="316.0" x2="257.0" y2="316.0" stroke="#00573c" stroke-width="3" stroke-linecap="round"/><path d="M250.0,316.0 L259.2,312.1 L259.2,319.9Z" fill="#00573c"/><text x="460.0" y="292.0" font-size="14" fill="#00573c" text-anchor="middle" font-weight="bold">HA cruza</text><rect x="80.0" y="140.0" width="110.0" height="46.0" rx="10" fill="#fff" stroke="#00573c" stroke-width="2"/><text x="135.0" y="168.2" font-size="15" fill="#00573c" text-anchor="middle" font-weight="bold">HA = 1</text><rect x="210.0" y="140.0" width="130.0" height="46.0" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="275.0" y="168.2" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">A⁻ = 0.001</text><text x="210.0" y="228.0" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Total = 1.001</text><text x="210.0" y="252.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Casi todo no ionizado</text><rect x="580.0" y="140.0" width="110.0" height="46.0" rx="10" fill="#fff" stroke="#00573c" stroke-width="2"/><text x="635.0" y="168.2" font-size="15" fill="#00573c" text-anchor="middle" font-weight="bold">HA = 1</text><rect x="710.0" y="140.0" width="130.0" height="46.0" rx="10" fill="#fff" stroke="#555" stroke-width="2"/><text x="775.0" y="168.2" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">A⁻ = 251</text><text x="710.0" y="228.0" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Total = 252</text><text x="710.0" y="252.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Casi todo ionizado → atrapado</text><text x="460.0" y="388.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">El ácido débil se acumula del lado alcalino (plasma); una base débil se acumula del lado ácido.</text></svg>