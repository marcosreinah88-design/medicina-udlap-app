<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="330" fill="#fff"/><text x="450.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Concentraciones: lo que significa cada expresión</text><rect x="30.0" y="76.0" width="200.0" height="130.0" rx="12" fill="#fff" stroke="#00573c" stroke-width="2.5"/><text x="130.0" y="110.0" font-size="20" fill="#00573c" text-anchor="middle" font-weight="bold">5 %  (p/v)</text><text x="130.0" y="146.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">= 5 g en 100 mL</text><text x="130.0" y="176.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">= 50 mg/mL</text><rect x="248.0" y="76.0" width="200.0" height="130.0" rx="12" fill="#fff" stroke="#2b6cb0" stroke-width="2.5"/><text x="348.0" y="110.0" font-size="20" fill="#2b6cb0" text-anchor="middle" font-weight="bold">0.9 %  (p/v)</text><text x="348.0" y="146.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">= 0.9 g en 100 mL</text><text x="348.0" y="176.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">= 9 mg/mL (sol. salina)</text><rect x="466.0" y="76.0" width="200.0" height="130.0" rx="12" fill="#fff" stroke="#f26b21" stroke-width="2.5"/><text x="566.0" y="110.0" font-size="20" fill="#f26b21" text-anchor="middle" font-weight="bold">1 : 1000</text><text x="566.0" y="146.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">= 1 g en 1000 mL</text><text x="566.0" y="176.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">= 1 mg/mL (adrenalina)</text><rect x="684.0" y="76.0" width="200.0" height="130.0" rx="12" fill="#fff" stroke="#7b3fa0" stroke-width="2.5"/><text x="784.0" y="110.0" font-size="20" fill="#7b3fa0" text-anchor="middle" font-weight="bold">1 : 10 000</text><text x="784.0" y="146.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">= 1 g en 10 000 mL</text><text x="784.0" y="176.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">= 0.1 mg/mL</text><rect x="30.0" y="228.0" width="840.0" height="80.0" rx="12" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="450.0" y="256.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">1 g = 1000 mg = 1 000 000 µg      ·      1 L = 1000 mL      ·      1 mL ≈ 20 gotas (macrogotero)</text><text x="450.0" y="278.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Truco: % p/v × 10 = mg/mL      ·      regla de tres: dosis indicada × volumen / concentración</text></svg>