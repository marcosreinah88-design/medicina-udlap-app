<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="330" fill="#fff"/><text x="450.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">COX-1 vs COX-2: por qué los AINE dan efectos adversos</text><rect x="40.0" y="70.0" width="370.0" height="50.0" rx="10" fill="#e8f5ee" stroke="#00573c" stroke-width="2"/><text x="225.0" y="100.2" font-size="15" fill="#00573c" text-anchor="middle" font-weight="bold">COX-1 · constitutiva («de mantenimiento»)</text><rect x="490.0" y="70.0" width="370.0" height="50.0" rx="10" fill="#fbe6e4" stroke="#b3261e" stroke-width="2"/><text x="675.0" y="100.2" font-size="15" fill="#b3261e" text-anchor="middle" font-weight="bold">COX-2 · inducible (inflamación)</text><text x="60.0" y="150.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Protege la mucosa gástrica (moco, ↓ ácido)</text><text x="60.0" y="172.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Mantiene el flujo renal</text><text x="60.0" y="194.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• TXA₂ en plaquetas → agregación</text><text x="510.0" y="150.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Dolor, fiebre e inflamación</text><text x="510.0" y="172.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• También es constitutiva en riñón, endotelio</text><text x="510.0" y="194.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">  (PGI₂) y SNC</text><rect x="40.0" y="232.0" width="820.0" height="80.0" rx="12" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="60.0" y="258.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Bloquear COX-1 → gastritis/úlcera, sangrado, daño renal.   Bloquear COX-2 → analgesia, antipirexia, antiinflamatorio.</text><text x="60.0" y="280.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Coxibs (celecoxib, selectivos COX-2): menos daño gástrico, pero ↓ PGI₂ con TXA₂ intacto → más riesgo trombótico.</text></svg>