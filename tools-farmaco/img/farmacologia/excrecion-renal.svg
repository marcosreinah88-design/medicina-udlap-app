<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" font-family="Helvetica,Arial,sans-serif"><rect width="920" height="410" fill="#fff"/><text x="460.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Excreción renal: filtración, secreción y reabsorción</text><circle cx="150.0" cy="170.0" r="52" fill="#fbe6e4" stroke="#b3261e" stroke-width="2.5"/><text x="150.0" y="166.0" font-size="13" fill="#b3261e" text-anchor="middle" font-weight="bold">Glomérulo</text><text x="150.0" y="184.0" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="normal">filtración</text><path d="M200,170 H330 C380,170 380,250 430,250 H560 C620,250 620,170 680,170 H840" fill="none" stroke="#2b6cb0" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M200,170 H330 C380,170 380,250 430,250 H560 C620,250 620,170 680,170 H840" fill="none" stroke="#e6effa" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><text x="850.0" y="175.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">orina</text><text x="150.0" y="250.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Pasa solo el fármaco</text><text x="150.0" y="266.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">LIBRE (no unido a</text><text x="150.0" y="282.0" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">proteínas), PM pequeño</text><line x1="290.0" y1="96.0" x2="290.0" y2="153.0" stroke="#f26b21" stroke-width="3" stroke-linecap="round"/><path d="M290.0,160.0 L286.1,150.8 L293.9,150.8Z" fill="#f26b21"/><text x="290.0" y="86.0" font-size="13" fill="#f26b21" text-anchor="middle" font-weight="bold">Secreción tubular activa (proximal)</text><text x="300.0" y="112.0" font-size="11" fill="#f26b21" text-anchor="start" font-weight="normal">transportadores de ácidos y bases</text><text x="300.0" y="130.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">(penicilina; el probenecid la bloquea)</text><line x1="500.0" y1="236.0" x2="500.0" y2="187.0" stroke="#00573c" stroke-width="3" stroke-linecap="round"/><path d="M500.0,180.0 L503.9,189.2 L496.1,189.2Z" fill="#00573c"/><text x="500.0" y="168.0" font-size="13" fill="#00573c" text-anchor="middle" font-weight="bold">Reabsorción pasiva (distal)</text><text x="510.0" y="290.0" font-size="12" fill="#00573c" text-anchor="middle" font-weight="normal">Solo regresa la forma NO ionizada y liposoluble</text><rect x="40.0" y="320.0" width="840.0" height="74.0" rx="12" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="460.0" y="346.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Orina ALCALINA → ioniza ácidos débiles (salicilatos, barbitúricos, metotrexato) → no se reabsorben → se eliminan más.</text><text x="460.0" y="366.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Orina ÁCIDA → favorece la eliminación de bases débiles (anfetaminas, morfina).  PM &lt; 300 → riñón; PM &gt; 500 → bilis.</text></svg>