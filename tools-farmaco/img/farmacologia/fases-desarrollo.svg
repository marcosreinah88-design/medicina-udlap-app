<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="940" height="330" fill="#fff"/><text x="470.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Del laboratorio a la farmacia: fases del desarrollo</text><path d="M20,80 h125 l20,45 l-20,45 h-125 l20,-45z" fill="#555"/><text x="100.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Preclínico</text><text x="100.0" y="200.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">animales y</text><text x="100.0" y="215.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">laboratorio</text><text x="100.0" y="230.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">2–6 años</text><path d="M173,80 h125 l20,45 l-20,45 h-125 l20,-45z" fill="#2b6cb0"/><text x="253.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Fase I</text><text x="253.0" y="200.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">15–30 sanos</text><text x="253.0" y="215.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">seguridad, FC,</text><text x="253.0" y="230.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">dosis máxima</text><path d="M326,80 h125 l20,45 l-20,45 h-125 l20,-45z" fill="#1c6b66"/><text x="406.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Fase II</text><text x="406.0" y="200.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">200–500</text><text x="406.0" y="215.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">pacientes · dosis</text><text x="406.0" y="230.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">y posible eficacia</text><path d="M479,80 h125 l20,45 l-20,45 h-125 l20,-45z" fill="#00573c"/><text x="559.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Fase III</text><text x="559.0" y="200.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">2 000–5 000</text><text x="559.0" y="215.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">multicéntrico:</text><text x="559.0" y="230.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">establece eficacia</text><path d="M632,80 h125 l20,45 l-20,45 h-125 l20,-45z" fill="#f26b21"/><text x="712.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Registro</text><text x="712.0" y="200.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">aprobación</text><text x="712.0" y="215.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">(COFEPRIS,</text><text x="712.0" y="230.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">FDA)</text><path d="M785,80 h125 l20,45 l-20,45 h-125 l20,-45z" fill="#7b3fa0"/><text x="865.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Fase IV</text><text x="865.0" y="200.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">poscomercia-</text><text x="865.0" y="215.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">lización:</text><text x="865.0" y="230.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">farmacovigilancia</text><text x="470.0" y="300.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Doble ciego, grupo control y consentimiento informado desde fase II; solo ~1 de cada 10 que entran a fase I llega a la farmacia.</text></svg>