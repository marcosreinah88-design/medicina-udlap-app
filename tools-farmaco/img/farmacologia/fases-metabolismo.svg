<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="920" height="330" fill="#fff"/><text x="460.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Biotransformación hepática: fase I y fase II</text><rect x="20.0" y="100.0" width="150.0" height="80.0" rx="10" fill="#fff6d6" stroke="#c98a00" stroke-width="2"/><text x="95.0" y="135.9" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Fármaco</text><text x="95.0" y="154.6" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">lipófilo</text><line x1="172.0" y1="140.0" x2="243.0" y2="140.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M250.0,140.0 L240.8,143.9 L240.8,136.1Z" fill="#555"/><rect x="252.0" y="80.0" width="210.0" height="120.0" rx="10" fill="#fdeee4" stroke="#f26b21" stroke-width="2"/><text x="357.0" y="112.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">FASE I</text><text x="357.0" y="128.3" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">(no sintética)</text><text x="357.0" y="144.6" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Oxidación · reducción</text><text x="357.0" y="160.8" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">· hidrólisis</text><text x="357.0" y="177.1" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">CYP450 (monooxigenasas)</text><line x1="464.0" y1="140.0" x2="533.0" y2="140.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M540.0,140.0 L530.8,143.9 L530.8,136.1Z" fill="#555"/><rect x="542.0" y="80.0" width="210.0" height="120.0" rx="10" fill="#f1e8f7" stroke="#7b3fa0" stroke-width="2"/><text x="647.0" y="112.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">FASE II</text><text x="647.0" y="128.3" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">(sintética, conjugación)</text><text x="647.0" y="144.6" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Glucurónico · sulfato ·</text><text x="647.0" y="160.8" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">acetilación · glutatión</text><text x="647.0" y="177.1" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">· glicina</text><line x1="754.0" y1="140.0" x2="793.0" y2="140.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M800.0,140.0 L790.8,143.9 L790.8,136.1Z" fill="#555"/><rect x="802.0" y="100.0" width="100.0" height="80.0" rx="10" fill="#e6effa" stroke="#2b6cb0" stroke-width="2"/><text x="852.0" y="120.2" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Hidro-</text><text x="852.0" y="136.4" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">soluble</text><text x="852.0" y="152.7" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">→ orina</text><text x="852.0" y="168.9" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">o bilis</text><path d="M360,202 C360,260 640,260 650,204" fill="none" stroke="#555" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="645.0" y1="214.0" x2="647.9" y2="208.3" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M651.0,202.0 L650.4,212.0 L643.4,208.5Z" fill="#555"/><text x="505.0" y="262.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">algunos van directo a fase II</text><text x="360.0" y="290.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">La fase I puede ACTIVAR (profármaco → fármaco) o INACTIVAR.</text><text x="360.0" y="308.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Inductores (rifampicina, tabaco en 1A2) ↑ CYP → ↓ niveles; inhibidores (cimetidina, fluconazol, verapamilo) ↓ CYP → ↑ niveles.</text></svg>