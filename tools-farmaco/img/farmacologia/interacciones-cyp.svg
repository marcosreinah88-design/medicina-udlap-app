<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="360" fill="#fff"/><text x="450.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Interacciones por citocromo P450: inductores e inhibidores</text><rect x="30.0" y="70.0" width="400.0" height="44.0" rx="10" fill="#b3261e" stroke="#b3261e" stroke-width="2"/><text x="230.0" y="98.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">INHIBIDOR</text><text x="230.0" y="140.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">↓ actividad del CYP</text><line x1="230.0" y1="150.0" x2="230.0" y2="169.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M230.0,176.0 L226.1,166.8 L233.9,166.8Z" fill="#555"/><text x="230.0" y="196.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">↑ niveles del otro fármaco → TOXICIDAD</text><text x="230.0" y="232.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Fluconazol, ketoconazol</text><text x="230.0" y="252.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Claritromicina, eritromicina</text><text x="230.0" y="272.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Cimetidina, verapamilo</text><text x="230.0" y="292.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Fluoroquinolonas, jugo de toronja</text><rect x="470.0" y="70.0" width="400.0" height="44.0" rx="10" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="2"/><text x="670.0" y="98.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">INDUCTOR</text><text x="670.0" y="140.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">↑ síntesis del CYP (días)</text><line x1="670.0" y1="150.0" x2="670.0" y2="169.0" stroke="#555" stroke-width="2" stroke-linecap="round"/><path d="M670.0,176.0 L666.1,166.8 L673.9,166.8Z" fill="#555"/><text x="670.0" y="196.0" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">↓ niveles del otro fármaco → FALLA</text><text x="670.0" y="232.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Rifampicina</text><text x="670.0" y="252.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Carbamazepina, fenitoína</text><text x="670.0" y="272.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Fenobarbital</text><text x="670.0" y="292.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Tabaco (1A2), alcohol crónico</text><text x="450.0" y="345.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Peligrosas sobre todo con margen terapéutico estrecho: warfarina, fenitoína, teofilina, ciclosporina, digoxina.</text></svg>