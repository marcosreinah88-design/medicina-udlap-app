<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="Helvetica,Arial,sans-serif"><rect width="920" height="330" fill="#fff"/><text x="460.0" y="30.0" font-size="19" fill="#00573c" text-anchor="middle" font-weight="bold">Periodos de susceptibilidad a teratógenos</text><rect x="40.0" y="90.0" width="107.0" height="60.0" rx="6" fill="#555" stroke="#555" stroke-width="1"/><text x="95.0" y="126.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Todo o nada</text><text x="95.0" y="178.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Muere el embrión o</text><text x="95.0" y="193.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">se repara sin defecto</text><rect x="150.0" y="90.0" width="327.0" height="60.0" rx="6" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="315.0" y="126.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Periodo embrionario (organogénesis)</text><text x="315.0" y="178.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">MÁXIMA susceptibilidad:</text><text x="315.0" y="193.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">malformaciones mayores</text><rect x="480.0" y="90.0" width="397.0" height="60.0" rx="6" fill="#c98a00" stroke="#c98a00" stroke-width="1"/><text x="680.0" y="126.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Periodo fetal</text><text x="680.0" y="178.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Defectos funcionales y menores,</text><text x="680.0" y="193.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">retraso del crecimiento, SNC</text><line x1="40.0" y1="152.0" x2="40.0" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="40.0" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0</text><line x1="150.0" y1="152.0" x2="150.0" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="150.0" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">2</text><line x1="480.0" y1="152.0" x2="480.0" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="480.0" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">8</text><line x1="533.3" y1="152.0" x2="533.3" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="533.3" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">12</text><line x1="640.0" y1="152.0" x2="640.0" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="640.0" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">20</text><line x1="746.7" y1="152.0" x2="746.7" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="746.7" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">28</text><line x1="880.0" y1="152.0" x2="880.0" y2="160.0" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><text x="880.0" y="74.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">38</text><text x="460.0" y="56.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">semanas desde la concepción (escala no proporcional)</text><rect x="40.0" y="240.0" width="840.0" height="66.0" rx="12" fill="#f2f2f2" stroke="#ccc" stroke-width="1"/><text x="460.0" y="266.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Ejemplos: talidomida (focomelia), isotretinoína, warfarina, valproato y fenitoína, IECA (2º–3º trimestre),</text><text x="460.0" y="285.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">tetraciclinas (dientes), metotrexato. Categoría FDA X = contraindicado; D = riesgo demostrado.</text></svg>