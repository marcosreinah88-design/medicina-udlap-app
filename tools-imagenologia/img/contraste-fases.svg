<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 270' width='900' height='270' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='270' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Fases de la TC con contraste yodado IV</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Tiempos aproximados desde la inyección</text><rect x='24' y='84' width='204' height='12' rx='6' fill='#8c8c8c'/><text x='24' y='124' font-size='16' text-anchor='start' fill='#8c8c8c' font-weight='700' >Simple</text><text x='24' y='146' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >sin contraste</text><text x='24' y='170' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >Calcio, sangre aguda, litos</text><rect x='240' y='84' width='204' height='12' rx='6' fill='#c0392b'/><text x='240' y='124' font-size='16' text-anchor='start' fill='#c0392b' font-weight='700' >Arterial</text><text x='240' y='146' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >~25–35 s</text><text x='240' y='170' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >Aorta y arterias brillantes</text><text x='240' y='187' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >lesiones hipervasculares</text><rect x='456' y='84' width='204' height='12' rx='6' fill='#2f6b8e'/><text x='456' y='124' font-size='16' text-anchor='start' fill='#2f6b8e' font-weight='700' >Portal / venosa</text><text x='456' y='146' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >~60–70 s</text><text x='456' y='170' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >Parénquima hepático y venas</text><text x='456' y='187' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >la más usada en abdomen</text><rect x='672' y='84' width='204' height='12' rx='6' fill='#a5621a'/><text x='672' y='124' font-size='16' text-anchor='start' fill='#a5621a' font-weight='700' >Tardía / excretora</text><text x='672' y='146' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >3–10 min</text><text x='672' y='170' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >Contraste en vías urinarias</text><text x='672' y='187' font-size='12' text-anchor='start' fill='#56656f' font-weight='400' >lavado de lesiones</text><text x='24' y='250' font-size='13' text-anchor='start' fill='#111a21' font-weight='400' >Yodados: RX y TC (eliminación renal, pedir creatinina).  Gadolinio: solo RM.  Bario: tubo digestivo (no si hay perforación).</text></svg>