<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 430' width='900' height='430' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='430' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Doppler: dirección del flujo</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Los eritrocitos reflejan el sonido y cambian su frecuencia</text><defs><marker id='r' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0L10,5L0,10z' fill='#c0392b'/></marker><marker id='bl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0L10,5L0,10z' fill='#1f5fbf'/></marker></defs><rect x='180' y='84' width='100' height='34' rx='6' fill='#2f6b8e'/><text x='230' y='106' font-size='13' text-anchor='middle' fill='#fff' font-weight='600' >Transductor</text><path d='M200,118 L110,300 L350,300 L260,118z' fill='#f0b03c' opacity='.15'/><rect x='40' y='210' width='380' height='46' rx='23' fill='#c0392b' opacity='.85'/><line x1='370' y1='196' x2='90' y2='236' stroke='#c0392b' stroke-width='3' marker-end='url(#r)' opacity='0'/><line x1='170' y1='262' x2='290' y2='160' stroke='#c0392b' stroke-width='5' marker-end='url(#r)'/><text x='230' y='330' font-size='17' text-anchor='middle' fill='#c0392b' font-weight='700' >ROJO: se acerca</text><text x='230' y='352' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >al transductor (frecuencia sube)</text><rect x='620' y='84' width='100' height='34' rx='6' fill='#2f6b8e'/><text x='670' y='106' font-size='13' text-anchor='middle' fill='#fff' font-weight='600' >Transductor</text><path d='M640,118 L550,300 L790,300 L700,118z' fill='#f0b03c' opacity='.15'/><rect x='480' y='210' width='380' height='46' rx='23' fill='#1f5fbf' opacity='.85'/><line x1='530' y1='196' x2='810' y2='236' stroke='#1f5fbf' stroke-width='3' marker-end='url(#bl)' opacity='0'/><line x1='610' y1='160' x2='730' y2='262' stroke='#1f5fbf' stroke-width='5' marker-end='url(#bl)'/><text x='670' y='330' font-size='17' text-anchor='middle' fill='#1f5fbf' font-weight='700' >AZUL: se aleja</text><text x='670' y='352' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >del transductor (frecuencia baja)</text><text x='450' y='392' font-size='13' text-anchor='middle' fill='#111a21' font-weight='400' >Color: rojo se acerca, azul se aleja; más brillante = más velocidad.  Power: más sensible, sin dirección ni aliasing.</text><text x='450' y='414' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >Espectral: curva de velocidad contra tiempo (sístole y diástole).</text></svg>