<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 390' width='900' height='390' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='390' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Transductores y su frecuencia</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Más frecuencia = más resolución pero menos penetración</text><g transform='translate(20,0)'><path d='M60,150 h120 v120 h-120z' fill='#f0b03c' opacity='.28'/><path d='M60,120 h120 v30 h-120z' fill='#2f6b8e'/><text x='120' y='330' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Lineal</text><text x='120' y='352' font-size='13' text-anchor='middle' fill='#9a5a00' font-weight='700' >5–10 MHz · ~9 cm</text><text x='120' y='372' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Superficial, vasos, mama</text></g><g transform='translate(240,0)'><path d='M60,150 q60,-40 120,0 L230,290 L10,290z' fill='#f0b03c' opacity='.28'/><path d='M60,150 q60,-40 120,0 v-30 h-120z' fill='#2f6b8e'/><text x='120' y='330' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Convexo</text><text x='120' y='352' font-size='13' text-anchor='middle' fill='#9a5a00' font-weight='700' >2–5 MHz · ~30 cm</text><text x='120' y='372' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Abdomen, obstetricia</text></g><g transform='translate(460,0)'><path d='M120,150 L210,300 L30,300z' fill='#f0b03c' opacity='.28'/><path d='M100,120 h40 v30 h-40z' fill='#2f6b8e'/><text x='120' y='330' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Sectorial</text><text x='120' y='352' font-size='13' text-anchor='middle' fill='#9a5a00' font-weight='700' >1–5 MHz · ~35 cm</text><text x='120' y='372' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Corazón (entre costillas)</text></g><g transform='translate(680,0)'><path d='M120,150 q-60,10 -50,70 L120,240 L170,220 q10,-60 -50,-70z' fill='#f0b03c' opacity='.28'/><path d='M110,90 h20 v60 h-20z' fill='#2f6b8e'/><text x='120' y='330' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Intracavitario</text><text x='120' y='352' font-size='13' text-anchor='middle' fill='#9a5a00' font-weight='700' >5–8 MHz · ~13 cm</text><text x='120' y='372' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Útero y ovarios</text></g></svg>