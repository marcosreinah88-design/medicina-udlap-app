<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 470' width='900' height='470' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='470' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Edema cerebral en TC: citotóxico vs vasogénico</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Esquemas axiales (gris = corteza, gris claro = sustancia blanca, oscuro = edema)</text><g transform='translate(40,90)'><ellipse cx='150' cy='150' rx='140' ry='150' fill='#202020'/><ellipse cx='150' cy='150' rx='130' ry='140' fill='#6e6e6e'/><ellipse cx='150' cy='150' rx='100' ry='110' fill='#9a9a9a'/><path d='M150,40 v220' stroke='#202020' stroke-width='4'/><path d='M150,60 A100,110 0 0,0 52,170 L150,170z' fill='#4a4a4a'/><path d='M150,40 A130,140 0 0,0 20,150 L52,170 A100,110 0 0,1 150,60z' fill='#4a4a4a'/></g><g transform='translate(480,90)'><ellipse cx='150' cy='150' rx='140' ry='150' fill='#202020'/><ellipse cx='150' cy='150' rx='130' ry='140' fill='#6e6e6e'/><ellipse cx='150' cy='150' rx='100' ry='110' fill='#9a9a9a'/><path d='M150,40 v220' stroke='#202020' stroke-width='4'/><circle cx='95' cy='130' r='16' fill='#dcdcdc' stroke='#fff' stroke-width='3'/><path d='M95,130 q-10,-40 -5,-55' stroke='#4a4a4a' stroke-width='16' fill='none' stroke-linecap='round'/><path d='M95,130 q-35,-5 -45,10' stroke='#4a4a4a' stroke-width='16' fill='none' stroke-linecap='round'/><path d='M95,130 q-30,25 -35,45' stroke='#4a4a4a' stroke-width='16' fill='none' stroke-linecap='round'/><path d='M95,130 q15,40 5,60' stroke='#4a4a4a' stroke-width='16' fill='none' stroke-linecap='round'/><path d='M95,130 q35,10 30,35' stroke='#4a4a4a' stroke-width='16' fill='none' stroke-linecap='round'/><circle cx='95' cy='130' r='16' fill='#dcdcdc' stroke='#fff' stroke-width='3'/></g><text x='190' y='410' font-size='16' text-anchor='middle' fill='#2f6b8e' font-weight='700' >Citotóxico (isquemia)</text><text x='190' y='432' font-size='13' text-anchor='middle' fill='#111a21' font-weight='400' >Se pierde la diferenciación gris-blanca</text><text x='190' y='452' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >Afecta corteza y sustancia blanca · DWI restringe</text><text x='630' y='410' font-size='16' text-anchor='middle' fill='#ad3f5c' font-weight='700' >Vasogénico (tumor, absceso)</text><text x='630' y='432' font-size='13' text-anchor='middle' fill='#111a21' font-weight='400' >Dedos en sustancia blanca, respeta la corteza</text><text x='630' y='452' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >Se conserva gris-blanca · DWI no restringe</text></svg>