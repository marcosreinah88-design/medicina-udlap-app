<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 450' width='900' height='450' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='450' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Hemorragia subaracnoidea en TC simple</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Esquema: sangre hiperdensa en cisternas basales (polígono de Willis)</text><g transform='translate(40,80)'><ellipse cx='160' cy='170' rx='150' ry='165' fill='#1a1a1a'/><ellipse cx='160' cy='170' rx='138' ry='153' fill='#7d7d7d'/><path d='M160,120 L178,160 L225,150 L190,182 L215,230 L160,205 L105,230 L130,182 L95,150 L142,160z' fill='#f2f2f2'/><path d='M190,182 Q240,170 268,150' stroke='#f2f2f2' stroke-width='7' fill='none'/><path d='M130,182 Q80,170 52,150' stroke='#f2f2f2' stroke-width='7' fill='none'/><ellipse cx='160' cy='250' rx='26' ry='20' fill='#5e5e5e'/><path d='M120,290 q40,30 80,0' stroke='#5e5e5e' stroke-width='8' fill='none'/><text x='160' y='360' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Estrella hiperdensa + cisuras de Silvio</text></g><text x='400' y='110' font-size='16' text-anchor='start' fill='#111a21' font-weight='700' >Escala de Fisher (tomográfica)</text><rect x='400' y='130' width='42' height='38' rx='8' fill='#ad3f5c'/><text x='421' y='156' font-size='18' text-anchor='middle' fill='#fff' font-weight='700' >1</text><text x='456' y='155' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Sin sangre visible</text><rect x='400' y='182' width='42' height='38' rx='8' fill='#ad3f5c'/><text x='421' y='208' font-size='18' text-anchor='middle' fill='#fff' font-weight='700' >2</text><text x='456' y='207' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Capa difusa &lt; 1 mm</text><rect x='400' y='234' width='42' height='38' rx='8' fill='#ad3f5c'/><text x='421' y='260' font-size='18' text-anchor='middle' fill='#fff' font-weight='700' >3</text><text x='456' y='259' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Coágulo cisternal &gt; 1 mm</text><rect x='400' y='286' width='42' height='38' rx='8' fill='#ad3f5c'/><text x='421' y='312' font-size='18' text-anchor='middle' fill='#fff' font-weight='700' >4</text><text x='456' y='311' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Hematoma parenquimatoso o hemorragia intraventricular</text><text x='400' y='360' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Causa espontánea más común: aneurisma sacular roto (85%).</text><text x='400' y='380' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >La sensibilidad de la TC baja con el tiempo y con poca sangre.</text></svg>