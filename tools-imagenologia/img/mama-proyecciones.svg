<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 450' width='900' height='450' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='450' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Proyecciones de mastografía</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Se colocan en espejo (derecha e izquierda)</text><g transform='translate(60,80)'><path d='M40,40 h220 v40 q-110,170 -220,0z' fill='#d9d9d9' stroke='#9aa7b0'/><path d='M60,70 q90,120 180,0' fill='#9e9e9e' opacity='.6'/><circle cx='150' cy='200' r='7' fill='#555'/><text x='150' y='300' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Craneocaudal (CC)</text><text x='150' y='322' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >Compresión de arriba abajo</text></g><g transform='translate(480,80)'><path d='M40,30 L120,30 Q260,140 200,240 Q120,300 40,240z' fill='#d9d9d9' stroke='#9aa7b0'/><path d='M40,30 L120,30 L40,150z' fill='#7a7a7a'/><path d='M70,120 q90,60 90,110' stroke='#9e9e9e' stroke-width='40' fill='none' opacity='.6'/><text x='52' y='60' font-size='12' text-anchor='start' fill='#fff' font-weight='600' >Pectoral</text><text x='150' y='300' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Mediolateral oblicua (MLO)</text><text x='150' y='322' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >Incluye el pectoral y la axila</text></g><text x='450' y='430' font-size='13' text-anchor='middle' fill='#111a21' font-weight='400' >Blanco = tejido glandular · oscuro = grasa · líneas = tejido conectivo · ganglios con centro graso</text></svg>