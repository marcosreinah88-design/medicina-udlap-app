<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 426' width='900' height='426' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='426' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Cómo se ve cada tejido en T1 y T2</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >T1 = anatomía · T2 = patología (el agua brilla)</text><text x='330' y='100' font-size='18' text-anchor='middle' fill='#111a21' font-weight='700' >T1</text><text x='470' y='100' font-size='18' text-anchor='middle' fill='#111a21' font-weight='700' >T2</text><text x='560' y='100' font-size='15' text-anchor='start' fill='#111a21' font-weight='700' >Regla</text><text x='24' y='142' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >Agua / LCR / edema</text><rect x='280' y='116' width='100' height='36' rx='6' fill='#1a1a1a' stroke='#9aa7b0'/><rect x='420' y='116' width='100' height='36' rx='6' fill='#f4f4f4' stroke='#9aa7b0'/><text x='560' y='140' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Oscuro en T1, brillante en T2</text><text x='24' y='188' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >Grasa</text><rect x='280' y='162' width='100' height='36' rx='6' fill='#f4f4f4' stroke='#9aa7b0'/><rect x='420' y='162' width='100' height='36' rx='6' fill='#d0d0d0' stroke='#9aa7b0'/><text x='560' y='186' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Brillante en ambas (STIR la anula)</text><text x='24' y='234' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >Sustancia blanca</text><rect x='280' y='208' width='100' height='36' rx='6' fill='#d8d8d8' stroke='#9aa7b0'/><rect x='420' y='208' width='100' height='36' rx='6' fill='#5a5a5a' stroke='#9aa7b0'/><text x='560' y='232' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Más clara que la gris en T1</text><text x='24' y='280' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >Sustancia gris</text><rect x='280' y='254' width='100' height='36' rx='6' fill='#8a8a8a' stroke='#9aa7b0'/><rect x='420' y='254' width='100' height='36' rx='6' fill='#9a9a9a' stroke='#9aa7b0'/><text x='560' y='278' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Más oscura que la blanca en T1</text><text x='24' y='326' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >Hueso cortical / aire</text><rect x='280' y='300' width='100' height='36' rx='6' fill='#050505' stroke='#9aa7b0'/><rect x='420' y='300' width='100' height='36' rx='6' fill='#050505' stroke='#9aa7b0'/><text x='560' y='324' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Sin señal: negro en ambas</text><text x='24' y='372' font-size='14' text-anchor='start' fill='#111a21' font-weight='600' >Gadolinio (T1 + C)</text><rect x='280' y='346' width='100' height='36' rx='6' fill='#ffffff' stroke='#9aa7b0'/><text x='470' y='370' font-size='16' text-anchor='middle' fill='#111a21' font-weight='400' >—</text><text x='560' y='370' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Realce = hiperintenso en T1</text><text x='24' y='410' font-size='13' text-anchor='start' fill='#111a21' font-weight='400' >FLAIR = T2 que anula el LCR (el edema sigue brillante).  DWI: la restricción a la difusión brilla (isquemia aguda).</text></svg>