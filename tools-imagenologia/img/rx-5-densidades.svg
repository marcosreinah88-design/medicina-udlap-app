<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 330' width='900' height='330' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='330' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Las 5 densidades radiológicas</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >De más negro (deja pasar los rayos X) a más blanco (los absorbe)</text><rect x='24' y='86' width='160' height='120' rx='10' fill='#0b0b0b' stroke='#9aa7b0'/><text x='104' y='236' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Aire</text><text x='104' y='258' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Pulmón, gas intestinal</text><text x='104' y='152' font-size='15' text-anchor='middle' fill='#f0b03c' font-weight='700' >Radiolúcido</text><rect x='196' y='86' width='160' height='120' rx='10' fill='#4a4a4a' stroke='#9aa7b0'/><text x='276' y='236' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Grasa</text><text x='276' y='258' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Tejido adiposo, planos grasos</text><rect x='368' y='86' width='160' height='120' rx='10' fill='#8c8c8c' stroke='#9aa7b0'/><text x='448' y='236' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Agua / tejido blando</text><text x='448' y='258' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Músculo, sangre, vísceras</text><rect x='540' y='86' width='160' height='120' rx='10' fill='#d6d6d6' stroke='#9aa7b0'/><text x='620' y='236' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Calcio / hueso</text><text x='620' y='258' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Huesos, calcificaciones</text><rect x='712' y='86' width='160' height='120' rx='10' fill='#ffffff' stroke='#9aa7b0'/><text x='792' y='236' font-size='16' text-anchor='middle' fill='#111a21' font-weight='700' >Metal</text><text x='792' y='258' font-size='12' text-anchor='middle' fill='#56656f' font-weight='400' >Prótesis, contraste, proyectiles</text><text x='792' y='152' font-size='15' text-anchor='middle' fill='#9a5a00' font-weight='700' >Radiopaco</text><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0L10,5L0,10z' fill='#56656f'/></marker></defs><line x1='40' y1='290' x2='860' y2='290' stroke='#56656f' stroke-width='2' marker-end='url(#a)'/><text x='450' y='314' font-size='14' text-anchor='middle' fill='#56656f' font-weight='400' >Mayor número atómico y densidad = más atenuación = más blanco</text></svg>