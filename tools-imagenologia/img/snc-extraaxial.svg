<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 460' width='900' height='460' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='460' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >¿Intraaxial o extraaxial?</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Signos que dicen que la lesión está fuera del cerebro</text><g transform='translate(40,80)'><path d='M0,40 Q200,-10 400,40' stroke='#a5621a' stroke-width='14' fill='none'/><path d='M0,58 Q200,8 400,58' stroke='#7a4ea3' stroke-width='4' fill='none'/><path d='M0,64 Q200,14 400,64 L400,330 L0,330z' fill='#bdbdbd'/><path d='M0,64 Q200,14 400,64 L400,100 Q200,50 0,100z' fill='#8a8a8a'/><path d='M120,40 Q200,20 280,40 Q290,120 200,150 Q110,120 120,40z' fill='#f0b03c' stroke='#9a5a00' stroke-width='2'/><path d='M118,46 Q200,150 282,46' stroke='#111' stroke-width='5' fill='none' stroke-dasharray='2 6' opacity='0'/><path d='M112,60 Q200,175 288,60' stroke='#1a1a1a' stroke-width='6' fill='none'/><path d='M95,52 Q60,48 30,54' stroke='#7a4ea3' stroke-width='9' fill='none'/><path d='M305,52 Q340,48 370,54' stroke='#7a4ea3' stroke-width='9' fill='none'/><path d='M115,72 Q200,190 285,72' stroke='#8a8a8a' stroke-width='10' fill='none'/></g><circle cx='500' cy='115' r='5' fill='#7a4ea3'/><text x='514' y='120' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Base dural amplia y cola dural</text><circle cx='500' cy='145' r='5' fill='#7a4ea3'/><text x='514' y='150' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Hendidura de LCR entre masa y cerebro</text><circle cx='500' cy='175' r='5' fill='#7a4ea3'/><text x='514' y='180' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Sustancia gris entre la masa y la blanca</text><circle cx='500' cy='205' r='5' fill='#7a4ea3'/><text x='514' y='210' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Vasos subaracnoideos desplazados</text><circle cx='500' cy='235' r='5' fill='#7a4ea3'/><text x='514' y='240' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Espacio subaracnoideo ensanchado</text><circle cx='500' cy='265' r='5' fill='#7a4ea3'/><text x='514' y='270' font-size='14' text-anchor='start' fill='#111a21' font-weight='400' >Reacción del hueso (hiperostosis)</text><text x='500' y='320' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Ejemplo típico: meningioma (después de los 40).</text><text x='500' y='340' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Intraaxial en adulto: metástasis y gliomas.</text><text x='240' y='440' font-size='13' text-anchor='middle' fill='#56656f' font-weight='400' >Esquema: masa extraaxial (naranja) empujando la corteza</text></svg>