<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 412' width='900' height='412' font-family='IBM Plex Sans,Helvetica,Arial,sans-serif'><rect width='900' height='412' fill='#ffffff'/><text x='24' y='38' font-size='22' text-anchor='start' fill='#111a21' font-weight='700' >Escala de unidades Hounsfield (TC)</text><text x='24' y='62' font-size='14' text-anchor='start' fill='#56656f' font-weight='400' >Cada vóxel recibe un número según cuánto atenúa respecto al agua</text><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#000'/><stop offset='0.5' stop-color='#fff'/><stop offset='1' stop-color='#fff'/></linearGradient></defs><rect x='60' y='90' width='780' height='46' fill='url(#g)' stroke='#9aa7b0'/><line x1='60.0' y1='84' x2='60.0' y2='150' stroke='#9a5a00' stroke-width='2'/><line x1='60.0' y1='150' x2='60.0' y2='154' stroke='#c9d1d7'/><text x='60.0' y='168' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Aire −1000</text><line x1='157.5' y1='84' x2='157.5' y2='150' stroke='#9a5a00' stroke-width='2'/><line x1='157.5' y1='150' x2='157.5' y2='172' stroke='#c9d1d7'/><text x='157.5' y='186' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Pulmón −400 a −600</text><line x1='240.375' y1='84' x2='240.375' y2='150' stroke='#9a5a00' stroke-width='2'/><line x1='240.375' y1='150' x2='240.375' y2='190' stroke='#c9d1d7'/><text x='240.375' y='204' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Grasa −50 a −100</text><line x1='255.0' y1='84' x2='255.0' y2='150' stroke='#9a5a00' stroke-width='2'/><line x1='255.0' y1='150' x2='255.0' y2='208' stroke='#c9d1d7'/><text x='255.0' y='222' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Agua 0</text><line x1='450.0' y1='84' x2='450.0' y2='150' stroke='#9a5a00' stroke-width='2'/><line x1='450.0' y1='150' x2='450.0' y2='154' stroke='#c9d1d7'/><text x='450.0' y='168' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Hueso +1000</text><line x1='840.0' y1='84' x2='840.0' y2='150' stroke='#9a5a00' stroke-width='2'/><text x='840.0' y='168' font-size='13' text-anchor='middle' fill='#111a21' font-weight='600' >Metal hasta +3000</text><text x='24' y='256' font-size='16' text-anchor='start' fill='#111a21' font-weight='700' >Ventanas (centro y amplitud que se ven en gris)</text><rect x='60.0' y='272' width='68.25' height='22' rx='4' fill='#2f6b8e' opacity='.85'/><text x='136.25' y='288' font-size='13' text-anchor='start' fill='#2f6b8e' font-weight='700' >Pulmón: -1400 a -650</text><rect x='223.79999999999998' y='306' width='78.00000000000003' height='22' rx='4' fill='#16796f' opacity='.85'/><text x='309.8' y='322' font-size='13' text-anchor='start' fill='#16796f' font-weight='700' >Tejidos blandos: -160 a 240</text><rect x='138.0' y='340' width='390.0' height='22' rx='4' fill='#a5621a' opacity='.85'/><text x='536.0' y='356' font-size='13' text-anchor='start' fill='#a5621a' font-weight='700' >Hueso: -600 a 1400</text><text x='24' y='396' font-size='13' text-anchor='start' fill='#56656f' font-weight='400' >Fuera de la ventana todo se ve negro (por debajo) o blanco (por arriba). Hiperdenso / isodenso / hipodenso.</text></svg>