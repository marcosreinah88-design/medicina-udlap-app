ext><text x="480.0" y="268.8" font-size="15" fill="#f26b21" text-anchor="middle" font-weight="bold">posterior</text><text x="600.0" y="70.0" font-size="15" fill="#222" text-anchor="start" font-weight="bold">Subdivisiones y contenido</text><text x="600.0" y="105.0" font-size="14" fill="#2b6cb0" text-anchor="start" font-weight="bold">Submandibular (digástrico)</text><text x="600.0" y="125.0" font-size="13" fill="#444" text-anchor="start" font-weight="normal">glándula submandibular, arteria facial</text><text x="600.0" y="167.0" font-size="14" fill="#2b6cb0" text-anchor="start" font-weight="bold">Submentoniano</text><text x="600.0" y="187.0" font-size="13" fill="#444" text-anchor="start" font-weight="normal">ganglios submentonianos</text><text x="600.0" y="229.0" font-size="14" fill="#2b6cb0" text-anchor="start" font-weight="bold">Carotídeo</text><text x="600.0" y="249.0" font-size="13" fill="#444" text-anchor="start" font-weight="normal">bifurcación carotídea, yugular interna, X y XII</text><text x="600.0" y="291.0" font-size="14" fill="#2b6cb0" text-anchor="start" font-weight="bold">Muscular</text><text x="600.0" y="311.0" font-size="13" fill="#444" text-anchor="start" font-weight="normal">infrahioideos, tiroides</text><text x="600.0" y="353.0" font-size="14" fill="#f26b21" text-anchor="start" font-weight="bold">Posterior: occipital y supraclavicular</text><text x="600.0" y="373.0" font-size="13" fill="#444" text-anchor="start" font-weight="normal">nervio accesorio (XI), plexo cervical, subclavia</text><text x="600.0" y="430.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">El anterior queda entre la línea media, la mandíbula y el ECM;</text><text x="600.0" y="445.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">el posterior entre el ECM, el trapecio y la clavícula.</text></svg>