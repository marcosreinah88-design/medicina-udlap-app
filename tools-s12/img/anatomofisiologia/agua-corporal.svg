<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" width="900" height="365" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="365" fill="#fff"/><text x="450.0" y="26.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Agua corporal total (adulto de 70 kg): regla 60-40-20</text><rect x="40" y="60" width="820" height="60" fill="#e9e3d6" stroke="#bbb"/><text x="450.0" y="96.0" font-size="15" fill="#555" text-anchor="middle" font-weight="bold">Peso corporal 100 %</text><rect x="40" y="130" width="492" height="60" fill="#9fd3f2" stroke="#2b6cb0"/><text x="286.0" y="166.0" font-size="15" fill="#0d4f80" text-anchor="middle" font-weight="bold">Agua corporal total 60 % (≈ 42 L)</text><rect x="532" y="130" width="328" height="60" fill="#f2f2f2" stroke="#bbb"/><text x="696.0" y="166.0" font-size="14" fill="#777" text-anchor="middle" font-weight="normal">Sólidos 40 %</text><rect x="40" y="200" width="328" height="80" fill="#5aa9e6"/><text x="204.0" y="232.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Intracelular</text><text x="204.0" y="249.5" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2/3 del agua = 40 % del peso (≈ 28 L)</text><text x="204.0" y="267.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">K⁺ es el catión principal</text><rect x="368" y="200" width="123" height="80" fill="#f7b267"/><text x="429.0" y="226.0" font-size="13" fill="#5a3200" text-anchor="middle" font-weight="bold">Intersticial</text><text x="429.0" y="242.2" font-size="13" fill="#5a3200" text-anchor="middle" font-weight="bold">3/4 del EC</text><text x="429.0" y="258.5" font-size="13" fill="#5a3200" text-anchor="middle" font-weight="bold">≈ 10.5 L</text><rect x="491" y="200" width="41" height="80" fill="#e56b6f"/><text x="511.0" y="236.0" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Plasma</text><path d="M368,292 V302 H532 V292" fill="none" stroke="#333" stroke-width="2"/><text x="450.0" y="322.0" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Extracelular 1/3 = 20 % del peso (≈ 14 L) · Na⁺ es el catión principal</text><text x="450.0" y="350.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">El plasma es 1/4 del extracelular (≈ 3.5 L). Por eso de 1 L de salina 0.9 % solo ≈ 250 mL se quedan en el vaso.</text></svg>