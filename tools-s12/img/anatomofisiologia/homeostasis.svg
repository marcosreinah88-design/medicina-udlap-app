<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="430" fill="#fff"/><text x="480.0" y="28.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Homeostasis: retroalimentación negativa y positiva</text><text x="250.0" y="64.0" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Negativa: corrige el cambio (termorregulación)</text><rect x="155.0" y="80.0" width="190.0" height="60.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="250.0" y="106.7" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">Estímulo</text><text x="250.0" y="121.7" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">↑ temperatura corporal</text><rect x="300.0" y="170.0" width="190.0" height="60.0" rx="10" fill="#fff" stroke="#7b3fa0" stroke-width="2"/><text x="395.0" y="196.7" font-size="12" fill="#7b3fa0" text-anchor="middle" font-weight="bold">Receptor</text><text x="395.0" y="211.7" font-size="12" fill="#7b3fa0" text-anchor="middle" font-weight="bold">termorreceptores de la piel</text><rect x="155.0" y="260.0" width="190.0" height="60.0" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="250.0" y="286.7" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Centro integrador</text><text x="250.0" y="301.7" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">hipotálamo</text><rect x="10.0" y="170.0" width="190.0" height="60.0" rx="10" fill="#fff" stroke="#00573c" stroke-width="2"/><text x="105.0" y="196.7" font-size="12" fill="#00573c" text-anchor="middle" font-weight="bold">Efector</text><text x="105.0" y="211.7" font-size="12" fill="#00573c" text-anchor="middle" font-weight="bold">sudor y vasodilatación</text><line x1="346.0" y1="124.0" x2="375.6" y2="160.6" stroke="#555" stroke-width="2.4" stroke-linecap="round"/><path d="M380.0,166.0 L371.2,161.3 L377.2,156.4Z" fill="#555"/><line x1="380.0" y1="234.0" x2="350.4" y2="270.6" stroke="#555" stroke-width="2.4" stroke-linecap="round"/><path d="M346.0,276.0 L348.8,266.4 L354.8,271.3Z" fill="#555"/><line x1="154.0" y1="276.0" x2="124.4" y2="239.4" stroke="#555" stroke-width="2.4" stroke-linecap="round"/><path d="M120.0,234.0 L128.8,238.7 L122.8,243.6Z" fill="#555"/><path d="M105,168 C105,125 120,110 150,110" fill="none" stroke="#2f9e44" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="140.0" y1="110.0" x2="145.0" y2="110.0" stroke="#2f9e44" stroke-width="2.6" stroke-linecap="round"/><path d="M152.0,110.0 L142.8,113.9 L142.8,106.1Z" fill="#2f9e44"/><text x="128.0" y="150.0" font-size="26" fill="#2f9e44" text-anchor="middle" font-weight="bold">−</text><text x="250.0" y="350.0" font-size="12.5" fill="#333" text-anchor="middle" font-weight="normal">La respuesta se OPONE al cambio y regresa</text><text x="250.0" y="365.6" font-size="12.5" fill="#333" text-anchor="middle" font-weight="normal">al punto de ajuste (glucemia, presión, temperatura).</text><line x1="500.0" y1="60.0" x2="500.0" y2="410.0" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5 5"/><text x="730.0" y="64.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">Positiva: amplifica hasta un desenlace (parto)</text><rect x="610.0" y="82.0" width="240.0" height="56.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="730.0" y="106.6" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="bold">La cabeza del bebé</text><text x="730.0" y="122.2" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="bold">estira el cuello uterino</text><rect x="610.0" y="162.0" width="240.0" height="56.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="730.0" y="186.6" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="bold">Nervios → hipotálamo</text><text x="730.0" y="202.2" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="bold">→ neurohipófisis</text><rect x="610.0" y="242.0" width="240.0" height="56.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="730.0" y="266.6" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="bold">Oxitocina</text><text x="730.0" y="282.2" font-size="12.5" fill="#b3261e" text-anchor="middle" font-weight="bold">contracciones más fuertes</text><line x1="730.0" y1="138.0" x2="730.0" y2="153.0" stroke="#555" stroke-width="2.4" stroke-linecap="round"/><path d="M730.0,160.0 L726.1,150.8 L733.9,150.8Z" fill="#555"/><line x1="730.0" y1="218.0" x2="730.0" y2="233.0" stroke="#555" stroke-width="2.4" stroke-linecap="round"/><path d="M730.0,240.0 L726.1,230.8 L733.9,230.8Z" fill="#555"/><path d="M850,270 C905,270 905,110 850,110" fill="none" stroke="#c92a2a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="870.0" y1="110.0" x2="859.0" y2="110.0" stroke="#c92a2a" stroke-width="2.6" stroke-linecap="round"/><path d="M852.0,110.0 L861.2,106.1 L861.2,113.9Z" fill="#c92a2a"/><text x="915.0" y="194.0" font-size="26" fill="#b3261e" text-anchor="middle" font-weight="bold">+</text><text x="730.0" y="350.0" font-size="12.5" fill="#333" text-anchor="middle" font-weight="normal">El ciclo se refuerza hasta que nace el bebé.</text><text x="730.0" y="365.6" font-size="12.5" fill="#333" text-anchor="middle" font-weight="normal">Otros: coagulación, pico de LH.</text></svg>