<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Helvetica,Arial,sans-serif"><rect width="880" height="420" fill="#fff"/><text x="440.0" y="28.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Glándula suprarrenal por capas: sal, azúcar y sexo</text><circle cx="250.0" cy="240.0" r="170" fill="#ffe066" stroke="#fff" stroke-width="3"/><circle cx="250.0" cy="240.0" r="130" fill="#ffa94d" stroke="#fff" stroke-width="3"/><circle cx="250.0" cy="240.0" r="92" fill="#ff8787" stroke="#fff" stroke-width="3"/><circle cx="250.0" cy="240.0" r="56" fill="#b197fc" stroke="#fff" stroke-width="3"/><text x="250.0" y="245.0" font-size="13" fill="#3b2a7a" text-anchor="middle" font-weight="bold">Médula</text><line x1="258.0" y1="106.0" x2="470.0" y2="108.0" stroke="#8a5a2b" stroke-width="1.6" stroke-dasharray="4 3"/><text x="480.0" y="112.0" font-size="14" fill="#8a5a2b" text-anchor="start" font-weight="bold">Zona glomerular</text><text x="640.0" y="112.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Aldosterona</text><text x="480.0" y="130.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">«SAL»</text><line x1="258.0" y1="145.0" x2="470.0" y2="140.0" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="4 3"/><text x="480.0" y="144.0" font-size="14" fill="#d9480f" text-anchor="start" font-weight="bold">Zona fasciculada</text><text x="640.0" y="144.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Cortisol</text><text x="480.0" y="162.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">«AZÚCAR»</text><line x1="258.0" y1="182.0" x2="470.0" y2="180.0" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="4 3"/><text x="480.0" y="184.0" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="bold">Zona reticular</text><text x="640.0" y="184.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Andrógenos</text><text x="480.0" y="202.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">«SEXO»</text><line x1="258.0" y1="236.0" x2="470.0" y2="230.0" stroke="#5f3dc4" stroke-width="1.6" stroke-dasharray="4 3"/><text x="480.0" y="234.0" font-size="14" fill="#5f3dc4" text-anchor="start" font-weight="bold">Médula</text><text x="640.0" y="234.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Adrenalina y noradrenalina</text><text x="480.0" y="252.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">«simpático»</text><text x="250.0" y="62.0" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal">cápsula</text><text x="480.0" y="330.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">De afuera hacia adentro: G-F-R</text><text x="480.0" y="345.6" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">«cuanto más profundo, más dulce».</text><text x="480.0" y="361.2" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">La aldosterona la regula sobre todo la</text><text x="480.0" y="376.9" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">angiotensina II (no la ACTH).</text></svg>