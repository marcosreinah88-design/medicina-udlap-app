<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="388" fill="#fff"/><text x="450.0" y="30.0" font-size="20" fill="#00573c" text-anchor="middle" font-weight="bold">Inflamación aguda vs crónica</text><rect x="20" y="60" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="87.0" font-size="14" fill="#fff" text-anchor="start" font-weight="bold"></text><rect x="220" y="60" width="330" height="44" fill="#00573c" stroke="#ccc"/><text x="385.0" y="87.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Aguda</text><rect x="550" y="60" width="330" height="44" fill="#00573c" stroke="#ccc"/><text x="715.0" y="87.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Crónica</text><rect x="20" y="104" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="131.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">Inicio y duración</text><rect x="220" y="104" width="330" height="44" fill="#fff" stroke="#ccc"/><text x="385.0" y="131.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Minutos a días</text><rect x="550" y="104" width="330" height="44" fill="#fff" stroke="#ccc"/><text x="715.0" y="131.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Semanas a años</text><rect x="20" y="148" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="175.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">Célula principal</text><rect x="220" y="148" width="330" height="44" fill="#fafafa" stroke="#ccc"/><text x="385.0" y="175.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Neutrófilo (primeras 6–24 h)</text><rect x="550" y="148" width="330" height="44" fill="#fafafa" stroke="#ccc"/><text x="715.0" y="175.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Macrófago, linfocito, célula plasmática</text><rect x="20" y="192" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="219.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">Lo que domina</text><rect x="220" y="192" width="330" height="44" fill="#fff" stroke="#ccc"/><text x="385.0" y="219.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Exudado, edema, vasodilatación</text><rect x="550" y="192" width="330" height="44" fill="#fff" stroke="#ccc"/><text x="715.0" y="219.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Destrucción + reparación a la vez</text><rect x="20" y="236" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="263.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">Resultado</text><rect x="220" y="236" width="330" height="44" fill="#fafafa" stroke="#ccc"/><text x="385.0" y="263.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Resolución, absceso o cronificación</text><rect x="550" y="236" width="330" height="44" fill="#fafafa" stroke="#ccc"/><text x="715.0" y="263.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Fibrosis, angiogénesis, granuloma</text><rect x="20" y="280" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="307.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">Ejemplos</text><rect x="220" y="280" width="330" height="44" fill="#fff" stroke="#ccc"/><text x="385.0" y="307.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Apendicitis, neumonía bacteriana</text><rect x="550" y="280" width="330" height="44" fill="#fff" stroke="#ccc"/><text x="715.0" y="307.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">TB, artritis reumatoide, hepatitis C crónica</text><rect x="20" y="324" width="200" height="44" fill="#eef5f1" stroke="#ccc"/><text x="32.0" y="351.0" font-size="13" fill="#00573c" text-anchor="start" font-weight="bold">Laboratorio</text><rect x="220" y="324" width="330" height="44" fill="#fafafa" stroke="#ccc"/><text x="385.0" y="351.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Leucocitosis con neutrofilia, PCR alta</text><rect x="550" y="324" width="330" height="44" fill="#fafafa" stroke="#ccc"/><text x="715.0" y="351.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Anemia de enfermedad crónica, VSG alta</text></svg>