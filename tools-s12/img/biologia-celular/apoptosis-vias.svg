<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="595" fill="#fff"/><text x="450.0" y="30.0" font-size="20" fill="#00573c" text-anchor="middle" font-weight="bold">Vías de la apoptosis</text><text x="450.0" y="52.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Las dos vías terminan en las caspasas efectoras 3 y 7</text><text x="220.0" y="88.0" font-size="16" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Vía intrínseca (mitocondrial)</text><rect x="60" y="104" width="320" height="52" rx="10" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="2"/><text x="220.0" y="126.4" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Daño del ADN (p53), falta de factores</text><text x="220.0" y="142.7" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">de crecimiento, estrés, radiación</text><line x1="220.0" y1="156.0" x2="220.0" y2="175.0" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/><path d="M220.0,182.0 L216.1,172.8 L223.9,172.8Z" fill="#2b6cb0"/><rect x="60" y="184" width="320" height="52" rx="10" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="2"/><text x="220.0" y="206.4" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Bax y Bak (proapoptóticos)</text><text x="220.0" y="222.7" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">vencen a Bcl-2 / Bcl-xL</text><line x1="220.0" y1="236.0" x2="220.0" y2="255.0" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/><path d="M220.0,262.0 L216.1,252.8 L223.9,252.8Z" fill="#2b6cb0"/><ellipse cx="220.0" cy="300.0" rx="110.0" ry="34.0" fill="#f8c99b" stroke="#b8641e" stroke-width="2" transform="rotate(0 220.0 300.0)"/><path d="M130,300 q15,-22 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#b8641e" stroke-width="2"/><circle cx="330.0" cy="286.0" r="5.0" fill="#b3261e" stroke="none" stroke-width="1.5"/><circle cx="344.0" cy="300.0" r="5.0" fill="#b3261e" stroke="none" stroke-width="1.5"/><circle cx="358.0" cy="286.0" r="5.0" fill="#b3261e" stroke="none" stroke-width="1.5"/><circle cx="372.0" cy="300.0" r="5.0" fill="#b3261e" stroke="none" stroke-width="1.5"/><circle cx="386.0" cy="286.0" r="5.0" fill="#b3261e" stroke="none" stroke-width="1.5"/><text x="395.0" y="330.0" font-size="12" fill="#b3261e" text-anchor="start" font-weight="normal">citocromo c sale</text><line x1="220.0" y1="334.0" x2="220.0" y2="355.0" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/><path d="M220.0,362.0 L216.1,352.8 L223.9,352.8Z" fill="#2b6cb0"/><rect x="60" y="364" width="320" height="52" rx="10" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="2"/><text x="220.0" y="386.4" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Apoptosoma (citocromo c + Apaf-1)</text><text x="220.0" y="402.7" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">→ caspasa 9 (iniciadora)</text><text x="680.0" y="88.0" font-size="16" fill="#7b3fa0" text-anchor="middle" font-weight="bold">Vía extrínseca (receptores de muerte)</text><rect x="520" y="104" width="320" height="52" rx="10" fill="#f2ebf8" stroke="#7b3fa0" stroke-width="2"/><text x="680.0" y="126.4" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">FasL (linfocito T) o TNF</text><text x="680.0" y="142.7" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">se une a su receptor (Fas, TNFR1)</text><line x1="520" y1="214" x2="790" y2="214" stroke="#c06080" stroke-width="6"/><text x="798.0" y="218.0" font-size="11" fill="#555" text-anchor="start" font-weight="normal">membrana</text><rect x="635" y="188" width="10" height="48" rx="4" fill="#7b3fa0"/><circle cx="640.0" cy="180.0" r="10.0" fill="#d8c4ee" stroke="#7b3fa0" stroke-width="1.5"/><rect x="675" y="188" width="10" height="48" rx="4" fill="#7b3fa0"/><circle cx="680.0" cy="180.0" r="10.0" fill="#d8c4ee" stroke="#7b3fa0" stroke-width="1.5"/><rect x="715" y="188" width="10" height="48" rx="4" fill="#7b3fa0"/><circle cx="720.0" cy="180.0" r="10.0" fill="#d8c4ee" stroke="#7b3fa0" stroke-width="1.5"/><line x1="680.0" y1="156.0" x2="680.0" y2="164.4" stroke="#7b3fa0" stroke-width="2" stroke-linecap="round"/><path d="M680.0,170.0 L676.9,162.6 L683.1,162.6Z" fill="#7b3fa0"/><line x1="680.0" y1="240.0" x2="680.0" y2="255.0" stroke="#7b3fa0" stroke-width="2.5" stroke-linecap="round"/><path d="M680.0,262.0 L676.1,252.8 L683.9,252.8Z" fill="#7b3fa0"/><rect x="520" y="264" width="320" height="52" rx="10" fill="#f2ebf8" stroke="#7b3fa0" stroke-width="2"/><text x="680.0" y="286.4" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Dominio de muerte (FADD)</text><text x="680.0" y="302.7" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">→ caspasa 8 (iniciadora)</text><rect x="600" y="350" width="280" height="66" rx="10" fill="#f7f7f2" stroke="#999" stroke-width="2"/><text x="740.0" y="372.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Linfocito T citotóxico: perforina</text><text x="740.0" y="387.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">abre poros y la granzima B</text><text x="740.0" y="402.2" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">activa caspasas directamente</text><line x1="700.0" y1="416.0" x2="594.9" y2="475.3" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4"/><path d="M590.0,478.0 L594.9,471.7 L597.9,477.1Z" fill="#999"/><line x1="220.0" y1="416.0" x2="373.4" y2="467.8" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/><path d="M380.0,470.0 L370.0,470.7 L372.5,463.4Z" fill="#2b6cb0"/><line x1="545.0" y1="316.0" x2="545.0" y2="463.0" stroke="#7b3fa0" stroke-width="2.5" stroke-linecap="round"/><path d="M545.0,470.0 L541.1,460.8 L548.9,460.8Z" fill="#7b3fa0"/><rect x="300" y="472" width="300" height="56" rx="10" fill="#fde8dc" stroke="#f26b21" stroke-width="2"/><text x="450.0" y="505.6" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Caspasas efectoras 3 y 7</text><line x1="450.0" y1="528.0" x2="450.0" y2="545.0" stroke="#f26b21" stroke-width="2.5" stroke-linecap="round"/><path d="M450.0,552.0 L446.1,542.8 L453.9,542.8Z" fill="#f26b21"/><text x="450.0" y="572.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Rompen el citoesqueleto y el ADN → cuerpos apoptóticos → fagocitosis sin inflamación</text><text x="40.0" y="450.0" font-size="12" fill="#b3261e" text-anchor="start" font-weight="normal">Bcl-2 la frena (t(14;18) = linfoma folicular)</text></svg>