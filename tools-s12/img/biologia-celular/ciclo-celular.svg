<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="560" fill="#fff"/><text x="450.0" y="30.0" font-size="20" fill="#00573c" text-anchor="middle" font-weight="bold">Ciclo celular y sus puntos de control</text><text x="450.0" y="52.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Las ciclinas y sus CDK lo empujan; p53, Rb y p21 lo frenan</text><path d="M333.0,140.0 A170,170 0 0 1 417.6,455.7 L378.9,391.4 A95,95 0 0 0 331.7,215.0Z" fill="#9fd3b4" stroke="#fff" stroke-width="3"/><text x="457.5" y="277.8" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">G1</text><text x="457.5" y="295.8" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">Crecimiento</text><path d="M412.4,458.7 A170,170 0 0 1 171.3,370.9 L241.3,344.0 A95,95 0 0 0 376.1,393.1Z" fill="#9cc1e8" stroke="#fff" stroke-width="3"/><text x="284.9" y="436.0" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">S</text><text x="284.9" y="454.0" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">Replica el ADN</text><path d="M169.3,365.3 A170,170 0 0 1 218.5,181.7 L267.7,238.3 A95,95 0 0 0 240.2,340.9Z" fill="#f1dc8f" stroke="#fff" stroke-width="3"/><text x="202.5" y="277.8" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">G2</text><text x="202.5" y="295.8" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">Prepara la mitosis</text><path d="M223.0,177.9 A170,170 0 0 1 327.0,140.0 L328.3,215.0 A95,95 0 0 0 270.2,236.2Z" fill="#f4b4a8" stroke="#fff" stroke-width="3"/><text x="284.9" y="188.0" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">M</text><text x="284.9" y="206.0" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">Mitosis</text><text x="330.0" y="304.0" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">Interfase</text><text x="330.0" y="322.8" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">G1 + S + G2</text><rect x="410.0" y="455.2" width="18" height="18" fill="#b3261e" transform="rotate(45 419.0 464.2)"/><rect x="206.6" y="164.6" width="18" height="18" fill="#b3261e" transform="rotate(45 215.6 173.6)"/><rect x="274.9" y="129.1" width="18" height="18" fill="#b3261e" transform="rotate(45 283.9 138.1)"/><line x1="419.0" y1="464.2" x2="560.0" y2="430.0" stroke="#777" stroke-width="1.2"/><circle cx="419.0" cy="464.2" r="2.6" fill="#333" stroke="none" stroke-width="1.5"/><text x="564.0" y="434.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">Punto G1/S: el más importante (Rb, p53)</text><line x1="215.6" y1="173.6" x2="40.0" y2="150.0" stroke="#777" stroke-width="1.2"/><circle cx="215.6" cy="173.6" r="2.6" fill="#333" stroke="none" stroke-width="1.5"/><text x="44.0" y="154.0" font-size="13" fill="#b3261e" text-anchor="start" font-weight="bold">Punto G2/M (daño del ADN)</text><line x1="283.9" y1="138.1" x2="180.0" y2="90.0" stroke="#777" stroke-width="1.2"/><circle cx="283.9" cy="138.1" r="2.6" fill="#333" stroke="none" stroke-width="1.5"/><text x="180.0" y="94.0" font-size="13" fill="#b3261e" text-anchor="middle" font-weight="bold">Punto del huso</text><circle cx="580.0" cy="160.0" r="34.0" fill="#eee" stroke="#999" stroke-width="2"/><text x="580.0" y="165.0" font-size="18" fill="#555" text-anchor="middle" font-weight="bold">G0</text><path d="M420,180 Q510,110 548,152" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="595.0" y="210.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Reposo (estables)</text><rect x="560" y="250" width="320" height="140" rx="12" fill="#f7f7f2" stroke="#bbb" stroke-width="1.5"/><text x="720.0" y="275.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Motores y frenos</text><text x="575.0" y="300.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">Ciclina D–CDK4/6: fosforila Rb → libera E2F</text><text x="575.0" y="315.6" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">Ciclina E–CDK2: entrada a S</text><text x="575.0" y="331.2" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">Ciclina B–CDK1: entrada a M</text><text x="575.0" y="346.9" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">Frenos: p53 → p21; p27; p16 (inhiben CDK)</text><text x="450.0" y="540.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Lábiles: siempre en ciclo · Estables: en G0, regresan · Permanentes: no se dividen</text></svg>