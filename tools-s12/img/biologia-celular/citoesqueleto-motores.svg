ína</text><text x="250.0" y="560.0" font-size="12" fill="#7b3fa0" text-anchor="middle" font-weight="normal">Retrógrado: rabia, herpes, toxina tetánica</text><text x="450.0" y="590.0" font-size="12.5" fill="#333" text-anchor="middle" font-weight="normal">La dineína también mueve cilios y flagelos (falla en el síndrome de Kartagener).</text></svg>