xt-anchor="middle" font-weight="normal">Macrófago los fagocita</text><text x="830.0" y="559.0" font-size="11" fill="#00573c" text-anchor="middle" font-weight="bold">SIN inflamación</text><rect x="40" y="330" width="420" height="190" rx="10" fill="#f7f7f2" stroke="#bbb" stroke-width="2"/><text x="250.0" y="372.7" font-size="13" fill="#222" text-anchor="middle" font-weight="normal"></text><text x="250.0" y="388.9" font-size="13" fill="#222" text-anchor="middle" font-weight="normal"></text><text x="250.0" y="405.2" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Necrosis: patológica, grupos de células,</text><text x="250.0" y="421.4" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">célula se hincha, membrana rota, inflamación.</text><text x="250.0" y="437.7" font-size="13" fill="#222" text-anchor="middle" font-weight="normal"></text><text x="250.0" y="453.9" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Apoptosis: programada (fisiológica o patológica),</text><text x="250.0" y="470.2" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">células sueltas, se encoge, necesita ATP,</text><text x="250.0" y="486.4" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">sin inflamación (caspasas).</text><text x="250.0" y="372.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Necrosis vs apoptosis</text></svg>