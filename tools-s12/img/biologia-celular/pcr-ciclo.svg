<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="470" fill="#fff"/><text x="450.0" y="30.0" font-size="20" fill="#00573c" text-anchor="middle" font-weight="bold">Un ciclo de PCR</text><text x="450.0" y="52.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Cada ciclo duplica el fragmento: tras 30 ciclos hay ~10⁹ copias</text><rect x="20" y="80" width="260" height="250" rx="14" fill="#f4c2c2" stroke="#b3261e" stroke-width="2"/><text x="150.0" y="108.0" font-size="16" fill="#b3261e" text-anchor="middle" font-weight="bold">1. Desnaturalización</text><text x="150.0" y="132.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">~95 °C</text><path d="M50,175 L250,175" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M50,245 L250,245" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="150.0" y1="190.0" x2="150.0" y2="165.6" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><path d="M150.0,160.0 L153.1,167.4 L146.9,167.4Z" fill="#b3261e"/><line x1="150.0" y1="230.0" x2="150.0" y2="254.4" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><path d="M150.0,260.0 L146.9,252.6 L153.1,252.6Z" fill="#b3261e"/><text x="150.0" y="300.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Se separan las hebras</text><rect x="320" y="80" width="260" height="250" rx="14" fill="#cfe2f5" stroke="#2b6cb0" stroke-width="2"/><text x="450.0" y="108.0" font-size="16" fill="#2b6cb0" text-anchor="middle" font-weight="bold">2. Alineamiento</text><text x="450.0" y="132.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">~55 °C</text><path d="M350,175 L550,175" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,245 L550,245" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M490,188 L545,188" fill="none" stroke="#b3261e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M355,232 L410,232" fill="none" stroke="#b3261e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="450.0" y="212.0" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">cebadores</text><text x="450.0" y="300.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Los cebadores se unen</text><rect x="620" y="80" width="260" height="250" rx="14" fill="#d9ecd2" stroke="#00573c" stroke-width="2"/><text x="750.0" y="108.0" font-size="16" fill="#00573c" text-anchor="middle" font-weight="bold">3. Extensión</text><text x="750.0" y="132.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">~72 °C</text><path d="M650,175 L850,175" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M650,245 L850,245" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M845,188 L690,188" fill="none" stroke="#b3261e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M655,232 L810,232" fill="none" stroke="#b3261e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M790,188 L690,188" fill="none" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M710,232 L810,232" fill="none" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="684.0" cy="188.0" r="9.0" fill="#9fd3b4" stroke="#00573c" stroke-width="1.5"/><circle cx="816.0" cy="232.0" r="9.0" fill="#9fd3b4" stroke="#00573c" stroke-width="1.5"/><text x="750.0" y="300.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">La Taq polimerasa sintetiza</text><line x1="288.0" y1="205.0" x2="305.0" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M312.0,205.0 L302.8,208.9 L302.8,201.1Z" fill="#555"/><line x1="588.0" y1="205.0" x2="605.0" y2="205.0" stroke="#555" stroke-width="3" stroke-linecap="round"/><path d="M612.0,205.0 L602.8,208.9 L602.8,201.1Z" fill="#555"/><path d="M750,340 Q450,420 150,340" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,5"/><path d="M150,340 l14,2 l-6,10z" fill="#999"/><text x="450.0" y="402.0" font-size="13" fill="#555" text-anchor="middle" font-weight="bold">Se repite 25–35 veces en el termociclador</text><text x="450.0" y="446.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">RT-PCR: primero la transcriptasa inversa pasa el ARN a ADNc (carga viral de VIH, COVID-19).</text></svg>