<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="540" fill="#fff"/><text x="450.0" y="30.0" font-size="20" fill="#00573c" text-anchor="middle" font-weight="bold">Traducción: sitios E, P y A del ribosoma</text><text x="450.0" y="52.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">El ARNt entra al sitio A, el péptido pasa al P y el ARNt vacío sale por el E</text><ellipse cx="370.0" cy="270.0" rx="215.0" ry="125.0" fill="#e7dcf5" stroke="#5b3b8c" stroke-width="2" transform="rotate(0 370.0 270.0)"/><text x="370.0" y="136.0" font-size="13" fill="#5b3b8c" text-anchor="middle" font-weight="bold">Subunidad grande (60S)</text><ellipse cx="370.0" cy="416.0" rx="190.0" ry="32.0" fill="#cbbfe6" stroke="#5b3b8c" stroke-width="2" transform="rotate(0 370.0 416.0)"/><text x="370.0" y="466.0" font-size="13" fill="#5b3b8c" text-anchor="middle" font-weight="bold">Subunidad pequeña (40S)</text><rect x="214" y="180" width="92" height="192" rx="10" fill="#fff" stroke="#b8a6dd" stroke-width="1.5"/><text x="260.0" y="204.0" font-size="22" fill="#5b3b8c" text-anchor="middle" font-weight="bold">E</text><text x="260.0" y="222.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">salida</text><rect x="324" y="180" width="92" height="192" rx="10" fill="#fff" stroke="#b8a6dd" stroke-width="1.5"/><text x="370.0" y="204.0" font-size="22" fill="#5b3b8c" text-anchor="middle" font-weight="bold">P</text><text x="370.0" y="222.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">peptidil</text><rect x="434" y="180" width="92" height="192" rx="10" fill="#fff" stroke="#b8a6dd" stroke-width="1.5"/><text x="480.0" y="204.0" font-size="22" fill="#5b3b8c" text-anchor="middle" font-weight="bold">A</text><text x="480.0" y="222.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">aminoacil</text><path d="M249,376 L249,324 M271,376 L271,324" fill="none" stroke="#cfcfcf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260.0" cy="316.0" r="13.0" fill="#cfcfcf" stroke="none" stroke-width="1.5"/><path d="M359,376 L359,324 M381,376 L381,324" fill="none" stroke="#f3a35c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370.0" cy="316.0" r="13.0" fill="#f3a35c" stroke="none" stroke-width="1.5"/><circle cx="370.0" cy="288.0" r="11.0" fill="#cfe2f5" stroke="#555" stroke-width="1.5"/><text x="370.0" y="292.0" font-size="9.5" fill="#222" text-anchor="middle" font-weight="bold">Phe</text><circle cx="370.0" cy="264.0" r="11.0" fill="#9fd3b4" stroke="#555" stroke-width="1.5"/><text x="370.0" y="268.0" font-size="9.5" fill="#222" text-anchor="middle" font-weight="bold">Ala</text><circle cx="370.0" cy="240.0" r="11.0" fill="#fde3c4" stroke="#555" stroke-width="1.5"/><text x="370.0" y="244.0" font-size="9.5" fill="#222" text-anchor="middle" font-weight="bold">Met</text><path d="M469,376 L469,324 M491,376 L491,324" fill="none" stroke="#7fb2e5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480.0" cy="316.0" r="13.0" fill="#7fb2e5" stroke="none" stroke-width="1.5"/><circle cx="480.0" cy="288.0" r="11.0" fill="#f6cfdc" stroke="#555" stroke-width="1.5"/><text x="480.0" y="292.0" font-size="9.5" fill="#222" text-anchor="middle" font-weight="bold">Lys</text><path d="M60,380 L840,380" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="150.0" y="404.0" font-size="15" fill="#b3261e" text-anchor="middle" font-weight="bold">AUG</text><text x="260.0" y="404.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">GCU</text><text x="370.0" y="404.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">UUC</text><text x="480.0" y="404.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">AAA</text><text x="590.0" y="404.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">GGC</text><text x="700.0" y="404.0" font-size="15" fill="#b3261e" text-anchor="middle" font-weight="bold">UAA</text><text x="60.0" y="404.0" font-size="14" fill="#333" text-anchor="start" font-weight="bold">5′</text><text x="840.0" y="404.0" font-size="14" fill="#333" text-anchor="end" font-weight="bold">3′</text><line x1="640.0" y1="170.0" x2="510.6" y2="265.8" stroke="#2b6cb0" stroke-width="2.5" stroke-linecap="round"/><path d="M505.0,270.0 L510.1,261.4 L514.7,267.6Z" fill="#2b6cb0"/><text x="630.0" y="144.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">Entra el aminoacil-ARNt</text><text x="630.0" y="161.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">(lo cargó la aminoacil-ARNt sintetasa)</text><line x1="240.0" y1="290.0" x2="155.2" y2="214.7" stroke="#999" stroke-width="2.5" stroke-linecap="round"/><path d="M150.0,210.0 L159.5,213.2 L154.3,219.0Z" fill="#999"/><text x="40.0" y="198.0" font-size="13" fill="#555" text-anchor="start" font-weight="bold">Sale el ARNt vacío</text><line x1="425.0" y1="276.0" x2="620.0" y2="270.0" stroke="#777" stroke-width="1.2"/><circle cx="425.0" cy="276.0" r="2.6" fill="#333" stroke="none" stroke-width="1.5"/><text x="624.0" y="274.0" font-size="12.5" fill="#333" text-anchor="start" font-weight="bold">Peptidil transferasa:</text><text x="624.0" y="290.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">el ARNr (ribozima) une el péptido</text><text x="624.0" y="306.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">al aminoácido del sitio A</text><line x1="560.0" y1="440.0" x2="674.4" y2="440.0" stroke="#333" stroke-width="2" stroke-linecap="round"/><path d="M680.0,440.0 L672.6,443.1 L672.6,436.9Z" fill="#333"/><text x="690.0" y="445.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">avanza 5′→3′</text><text x="450.0" y="510.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">AUG = inicio (metionina) · UAA, UAG, UGA = terminación</text></svg>