<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="420" fill="#fff"/><text x="450.0" y="26.0" font-size="17" fill="#00573c" text-anchor="middle" font-weight="bold">Cadena respiratoria y ATP sintasa (membrana mitocondrial interna)</text><rect x="20" y="170" width="860" height="70" fill="#ffe7a3"/><text x="30.0" y="110.0" font-size="13" fill="#555" text-anchor="start" font-weight="normal">Espacio intermembrana (muchos H⁺)</text><text x="30.0" y="300.0" font-size="13" fill="#555" text-anchor="start" font-weight="normal">Matriz</text><rect x="90" y="150" width="80" height="110" rx="14" fill="#5aa9e6"/><text x="130.0" y="211.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">I</text><line x1="130.0" y1="150.0" x2="130.0" y2="101.3" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/><path d="M130.0,95.0 L133.5,103.3 L126.5,103.3Z" fill="#b3261e"/><text x="130.0" y="85.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">H⁺</text><rect x="230" y="185" width="80" height="60" rx="14" fill="#9fd3f2"/><text x="270.0" y="221.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">II</text><rect x="390" y="150" width="80" height="110" rx="14" fill="#7b3fa0"/><text x="430.0" y="211.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">III</text><line x1="430.0" y1="150.0" x2="430.0" y2="101.3" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/><path d="M430.0,95.0 L433.5,103.3 L426.5,103.3Z" fill="#b3261e"/><text x="430.0" y="85.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">H⁺</text><rect x="560" y="150" width="80" height="110" rx="14" fill="#b3261e"/><text x="600.0" y="211.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">IV</text><line x1="600.0" y1="150.0" x2="600.0" y2="101.3" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/><path d="M600.0,95.0 L603.5,103.3 L596.5,103.3Z" fill="#b3261e"/><text x="600.0" y="85.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">H⁺</text><circle cx="320" cy="205" r="16" fill="#f26b21"/><text x="320.0" y="210.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Q</text><circle cx="490" cy="150" r="14" fill="#c2185b"/><text x="490.0" y="154.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">c</text><text x="130.0" y="300.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">NADH → NAD⁺</text><text x="270.0" y="300.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">FADH₂ → FAD</text><text x="600.0" y="300.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">½ O₂ + 2H⁺ → H₂O</text><rect x="720" y="150" width="70" height="110" rx="12" fill="#00573c"/><text x="755.0" y="210.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">ATP</text><circle cx="755" cy="285" r="26" fill="#00573c"/><line x1="755.0" y1="95.0" x2="755.0" y2="141.7" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/><path d="M755.0,148.0 L751.5,139.7 L758.5,139.7Z" fill="#b3261e"/><text x="755.0" y="85.0" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">H⁺</text><text x="755.0" y="330.0" font-size="13" fill="#00573c" text-anchor="middle" font-weight="bold">ADP + Pi → ATP</text><text x="755.0" y="350.0" font-size="12" fill="#00573c" text-anchor="middle" font-weight="normal">ATP sintasa (V)</text><text x="450.0" y="385.0" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Inhibidores: I = rotenona · III = antimicina A · IV = cianuro, CO, azida · V = oligomicina</text><text x="450.0" y="401.2" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Desacopladores (2,4-dinitrofenol, termogenina): dejan pasar H⁺ sin hacer ATP → calor</text></svg>