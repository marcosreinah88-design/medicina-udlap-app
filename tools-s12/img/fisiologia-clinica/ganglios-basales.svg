Z" fill="#00573c"/><line x1="660.0" y1="165.0" x2="569.0" y2="165.0" stroke="#8a5a00" stroke-width="3" stroke-linecap="round"/><path d="M562.0,165.0 L571.2,161.1 L571.2,168.9Z" fill="#8a5a00"/><text x="610.0" y="155.0" font-size="12" fill="#8a5a00" text-anchor="middle" font-weight="bold">dopamina</text><line x1="400.0" y1="187.0" x2="304.1" y2="320.3" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><path d="M300.0,326.0 L302.2,316.2 L308.5,320.8Z" fill="#b3261e"/><text x="320.0" y="250.0" font-size="12" fill="#b3261e" text-anchor="end" font-weight="bold">directa (D1)</text><line x1="500.0" y1="187.0" x2="593.7" y2="232.9" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><path d="M600.0,236.0 L590.0,235.4 L593.4,228.5Z" fill="#b3261e"/><text x="575.0" y="205.0" font-size="12" fill="#b3261e" text-anchor="start" font-weight="bold">indirecta (D2)</text><line x1="620.0" y1="282.0" x2="620.0" y2="319.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><path d="M620.0,326.0 L616.1,316.8 L623.9,316.8Z" fill="#b3261e"/><line x1="510.0" y1="350.0" x2="399.0" y2="350.0" stroke="#00573c" stroke-width="3" stroke-linecap="round"/><path d="M392.0,350.0 L401.2,346.1 L401.2,353.9Z" fill="#00573c"/><line x1="300.0" y1="372.0" x2="393.6" y2="415.1" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><path d="M400.0,418.0 L390.0,417.7 L393.3,410.6Z" fill="#b3261e"/><path d="M560,440 H890 V70 H562" fill="none" stroke="#00573c" stroke-width="3"/><line x1="600.0" y1="70.0" x2="569.0" y2="70.0" stroke="#00573c" stroke-width="3" stroke-linecap="round"/><path d="M562.0,70.0 L571.2,66.1 L571.2,73.9Z" fill="#00573c"/><text x="20.0" y="480.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">Verde = excita · Rojo = inhibe. Sin dopamina (Parkinson): menos vía directa y más indirecta → el globo pálido interno frena de más al tálamo → bradicinesia.</text></svg>