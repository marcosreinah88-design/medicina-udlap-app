<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="400" fill="#fff"/><text x="450.0" y="28.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Glomérulo: síndrome nefrítico vs nefrótico</text><rect x="30" y="50" width="400" height="330" rx="14" fill="#fff" stroke="#b3261e" stroke-width="2.5"/><text x="230.0" y="80.0" font-size="18" fill="#b3261e" text-anchor="middle" font-weight="bold">Nefrítico</text><circle cx="140" cy="190" r="62" fill="#fbe3e3" stroke="#d26" stroke-width="3"/><path d="M78,230 q-40,0 -70,30" stroke="#999" stroke-width="10" fill="none"/><circle cx="120" cy="270" r="6" fill="#b3261e"/><circle cx="129" cy="278" r="6" fill="#b3261e"/><circle cx="138" cy="270" r="6" fill="#b3261e"/><circle cx="147" cy="278" r="6" fill="#b3261e"/><circle cx="156" cy="270" r="6" fill="#b3261e"/><circle cx="165" cy="278" r="6" fill="#b3261e"/><text x="140.0" y="308.0" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="normal">eritrocitos</text><circle cx="110" cy="180" r="5" fill="#f4b400"/><circle cx="125" cy="187" r="5" fill="#f4b400"/><circle cx="140" cy="194" r="5" fill="#f4b400"/><circle cx="155" cy="186" r="5" fill="#f4b400"/><circle cx="170" cy="193" r="5" fill="#f4b400"/><text x="140.0" y="160.0" font-size="11" fill="#a07000" text-anchor="middle" font-weight="normal">leucocitos</text><text x="220.0" y="125.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Inflamación: el capilar</text><text x="220.0" y="144.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">se rompe</text><text x="220.0" y="163.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Hematuria (cilindros</text><text x="220.0" y="182.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">  eritrocitarios)</text><text x="220.0" y="201.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Proteinuria &lt; 3.5 g/día</text><text x="220.0" y="220.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Oliguria, edema, HTA</text><text x="220.0" y="239.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Ej.: posestreptocócica,</text><text x="220.0" y="258.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">nefropatía por IgA</text><rect x="470" y="50" width="400" height="330" rx="14" fill="#fff" stroke="#2b6cb0" stroke-width="2.5"/><text x="670.0" y="80.0" font-size="18" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Nefrótico</text><circle cx="580" cy="190" r="62" fill="#fbe3e3" stroke="#d26" stroke-width="3"/><path d="M518,230 q-40,0 -70,30" stroke="#999" stroke-width="10" fill="none"/><circle cx="545" cy="268" r="4.5" fill="#2b6cb0"/><circle cx="559" cy="268" r="4.5" fill="#2b6cb0"/><circle cx="573" cy="268" r="4.5" fill="#2b6cb0"/><circle cx="587" cy="268" r="4.5" fill="#2b6cb0"/><circle cx="601" cy="268" r="4.5" fill="#2b6cb0"/><circle cx="615" cy="268" r="4.5" fill="#2b6cb0"/><circle cx="545" cy="280" r="4.5" fill="#2b6cb0"/><circle cx="559" cy="280" r="4.5" fill="#2b6cb0"/><circle cx="573" cy="280" r="4.5" fill="#2b6cb0"/><circle cx="587" cy="280" r="4.5" fill="#2b6cb0"/><circle cx="601" cy="280" r="4.5" fill="#2b6cb0"/><circle cx="615" cy="280" r="4.5" fill="#2b6cb0"/><text x="580.0" y="308.0" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="normal">albúmina</text><text x="660.0" y="125.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Daño a podocitos: la</text><text x="660.0" y="144.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">barrera deja pasar proteína</text><text x="660.0" y="163.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Proteinuria &gt; 3.5 g/día</text><text x="660.0" y="182.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Hipoalbuminemia, edema</text><text x="660.0" y="201.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Hiperlipidemia, lipiduria</text><text x="660.0" y="220.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Ej.: cambios mínimos,</text><text x="660.0" y="239.0" font-size="13" fill="#222" text-anchor="start" font-weight="normal">membranosa, GEFS</text></svg>