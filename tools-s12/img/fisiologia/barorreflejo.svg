<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="420" fill="#fff"/><text x="450.0" y="28.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Reflejo barorreceptor: control de la presión latido a latido</text><rect x="300.0" y="58.0" width="300.0" height="64.0" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="450.0" y="86.3" font-size="13.5" fill="#b3261e" text-anchor="middle" font-weight="bold">↓ Presión arterial</text><text x="450.0" y="103.2" font-size="13.5" fill="#b3261e" text-anchor="middle" font-weight="bold">(p. ej., al ponerse de pie)</text><rect x="590.0" y="178.0" width="300.0" height="64.0" rx="10" fill="#fff" stroke="#7b3fa0" stroke-width="2"/><text x="740.0" y="206.3" font-size="13.5" fill="#7b3fa0" text-anchor="middle" font-weight="bold">↓ Estiramiento de barorreceptores</text><text x="740.0" y="223.2" font-size="13.5" fill="#7b3fa0" text-anchor="middle" font-weight="bold">seno carotídeo (IX) · arco aórtico (X)</text><rect x="300.0" y="298.0" width="300.0" height="64.0" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="450.0" y="326.3" font-size="13.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Bulbo (centro cardiovascular)</text><text x="450.0" y="343.2" font-size="13.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">↑ simpático · ↓ vago</text><rect x="10.0" y="178.0" width="300.0" height="64.0" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="2"/><text x="160.0" y="206.3" font-size="13.5" fill="#8a5a2b" text-anchor="middle" font-weight="bold">Taquicardia, ↑ contractilidad</text><text x="160.0" y="223.2" font-size="13.5" fill="#8a5a2b" text-anchor="middle" font-weight="bold">y vasoconstricción</text><line x1="600.0" y1="104.0" x2="694.2" y2="166.1" stroke="#555" stroke-width="2.6" stroke-linecap="round"/><path d="M700.0,170.0 L690.2,168.2 L694.5,161.7Z" fill="#555"/><line x1="700.0" y1="252.0" x2="605.9" y2="312.2" stroke="#555" stroke-width="2.6" stroke-linecap="round"/><path d="M600.0,316.0 L605.7,307.8 L609.9,314.3Z" fill="#555"/><line x1="300.0" y1="316.0" x2="205.9" y2="255.8" stroke="#555" stroke-width="2.6" stroke-linecap="round"/><path d="M200.0,252.0 L209.9,253.7 L205.7,260.2Z" fill="#555"/><line x1="312.0" y1="210.0" x2="345.0" y2="210.0" stroke="#555" stroke-width="2.6" stroke-linecap="round"/><path d="M352.0,210.0 L342.8,213.9 L342.8,206.1Z" fill="#555"/><text x="456.0" y="214.0" font-size="15" fill="#00573c" text-anchor="middle" font-weight="bold">La presión se recupera</text><text x="450.0" y="236.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">(si el reflejo falla: hipotensión ortostática)</text><text x="450.0" y="405.0" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">Masaje del seno carotídeo = el reflejo al revés: ↑ vago → puede terminar una taquicardia supraventricular</text></svg>