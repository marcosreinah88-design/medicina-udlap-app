.0" y="269.0" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">① Túbulo proximal</text><text x="50.0" y="288.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">~65 % del Na⁺ y del agua</text><text x="50.0" y="304.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">toda la glucosa (SGLT2)</text><text x="50.0" y="320.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">aminoácidos y HCO₃⁻</text><rect x="118.8" y="338.0" width="163.2" height="18.0" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/><text x="200.4" y="351.0" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="bold">acetazolamida · iSGLT2</text><line x1="410.0" y1="185.0" x2="290.0" y2="290.0" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="40.0" y="380.0" width="250.0" height="96.0" rx="8" fill="#fff" stroke="#1971c2" stroke-width="2.2"/><text x="50.0" y="399.0" font-size="13" fill="#1971c2" text-anchor="start" font-weight="bold">② Asa descendente</text><text x="50.0" y="418.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">permeable al AGUA, no a solutos:</text><text x="50.0" y="434.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">el líquido se concentra al bajar</text><line x1="492.0" y1="440.0" x2="290.0" y2="428.0" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="40.0" y="494.0" width="250.0" height="112.0" rx="8" fill="#fff" stroke="#2b8a3e" stroke-width="2.2"/><text x="50.0" y="513.0" font-size="13" fill="#2b8a3e" text-anchor="start" font-weight="bold">③ Rama ascendente gruesa</text><text x="50.0" y="532.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">NKCC2: Na⁺, K⁺, 2Cl⁻</text><text x="50.0" y="548.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">IMPERMEABLE al agua</text><text x="50.0" y="564.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">→ diluye el líquido</text><rect x="198.0" y="582.0" width="84.0" height="18.0" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/><text x="240.0" y="595.0" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="bold">furosemida</text><line x1="561.0" y1="340.0" x2="290.0" y2="540.0" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="760.0" y="70.0" width="225.0" height="112.0" rx="8" fill="#fff" stroke="#9c36b5" stroke-width="2.2"/><text x="770.0" y="89.0" font-size="13" fill="#9c36b5" text-anchor="start" font-weight="bold">④ Túbulo distal</text><text x="770.0" y="108.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">NCC: Na⁺ y Cl⁻</text><text x="770.0" y="124.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">reabsorbe Ca²⁺ (PTH)</text><text x="770.0" y="140.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">casi no reabsorbe agua</text><rect x="906.2" y="158.0" width="70.8" height="18.0" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/><text x="941.6" y="171.0" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="bold">tiazidas</text><line x1="650.0" y1="222.0" x2="760.0" y2="150.0" stroke="#9c36b5" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="760.0" y="300.0" width="225.0" height="150.0" rx="8" fill="#fff" stroke="#e67700" stroke-width="2.2"/><text x="770.0" y="319.0" font-size="13" fill="#e67700" text-anchor="start" font-weight="bold">⑤ Túbulo colector</text><text x="770.0" y="338.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">Principal: ENaC (entra Na⁺,</text><text x="770.0" y="354.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">sale K⁺) ↑ aldosterona</text><text x="770.0" y="370.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">ADH → acuaporina 2 (agua)</text><text x="770.0" y="386.0" font-size="11.5" fill="#222" text-anchor="start" font-weight="normal">Intercalada α: secreta H⁺</text><rect x="780.8" y="426.0" width="196.2" height="18.0" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/><text x="878.9" y="439.0" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="bold">espironolactona · amilorida</text><line x1="726.0" y1="380.0" x2="760.0" y2="380.0" stroke="#e67700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>