<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="300" fill="#fff"/><text x="180.0" y="32.0" font-size="19" fill="#6b3fa0" text-anchor="middle" font-weight="bold">Grampositiva</text><text x="620.0" y="32.0" font-size="19" fill="#c2185b" text-anchor="middle" font-weight="bold">Gramnegativa</text><text x="180.0" y="56.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">retiene el cristal violeta → morada</text><text x="620.0" y="56.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">se decolora y toma safranina → rosa</text><rect x="30" y="80" width="170" height="22" rx="4" fill="#e7e1f1" stroke="none" stroke-width="0"/><text x="212.0" y="96.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Ácidos teicoicos</text><line x1="42" y1="102" x2="42" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="60" y1="102" x2="60" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="78" y1="102" x2="78" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="96" y1="102" x2="96" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="114" y1="102" x2="114" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="132" y1="102" x2="132" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="150" y1="102" x2="150" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="168" y1="102" x2="168" y2="78" stroke="#7b3fa0" stroke-width="3"/><line x1="186" y1="102" x2="186" y2="78" stroke="#7b3fa0" stroke-width="3"/><rect x="30" y="102" width="170" height="110" rx="4" fill="#c9b3e6" stroke="none" stroke-width="0"/><text x="212.0" y="162.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Peptidoglucano grueso</text><line x1="30" y1="112" x2="200" y2="112" stroke="#9a7cc9" stroke-width="2"/><line x1="30" y1="130" x2="200" y2="130" stroke="#9a7cc9" stroke-width="2"/><line x1="30" y1="148" x2="200" y2="148" stroke="#9a7cc9" stroke