<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="425" fill="#fff"/><text x="400.0" y="26.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Anion gap: cationes = aniones</text><rect x="60" y="52.0" width="150" height="308.0" fill="#2b6cb0" stroke="#fff" stroke-width="2"/><text x="135.0" y="211.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Na⁺ 140</text><rect x="230" y="131.2" width="150" height="228.8" fill="#00573c" stroke="#fff" stroke-width="2"/><text x="305.0" y="250.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Cl⁻ 104</text><rect x="230" y="78.4" width="150" height="52.8" fill="#5aa9e6" stroke="#fff" stroke-width="2"/><text x="305.0" y="109.8" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">HCO₃⁻ 24</text><rect x="230" y="52.0" width="150" height="26.4" fill="#ffe08a" stroke="#fff" stroke-width="2"/><text x="305.0" y="70.2" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">AG 12</text><text x="135.0" y="384.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Cationes</text><text x="305.0" y="384.0" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Aniones medidos</text><rect x="480" y="131.2" width="150" height="228.8" fill="#00573c" stroke="#fff" stroke-width="2"/><text x="555.0" y="250.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Cl⁻ 104</text><rect x="480" y="109.2" width="150" height="22.0" fill="#5aa9e6" stroke="#fff" stroke-width="2"/><text x="555.0" y="125.2" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">HCO₃⁻ 10</text><rect x="480" y="52.0" width="150" height="57.2" fill="#f26b21" stroke="#fff" stroke-width="2"/><text x="555.0" y="85.6" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">AG 26</text><text x="555.0" y="384.0" font-size="14" fill="#f26b21" text-anchor="middle" font-weight="bold">AG elevado</text><text x="770.0" y="150.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Se acumula un ácido</text><text x="770.0" y="166.2" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">no medido: lactato,</text><text x="770.0" y="182.5" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">cetonas, urea, tóxicos</text><text x="770.0" y="198.8" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">(metanol, etilenglicol,</text><text x="770.0" y="215.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">salicilatos)</text><text x="400.0" y="412.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Si el AG es normal, el HCO₃⁻ perdido se reemplaza por Cl⁻ (hiperclorémica: diarrea, ATR, salina en exceso).</text></svg>