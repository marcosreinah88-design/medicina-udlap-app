<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="370" fill="#fff"/><text x="450.0" y="26.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Catéteres periféricos: calibre, color y flujo</text><rect x="40" y="60" width="90" height="34" rx="6" fill="#f26b21"/><text x="85.0" y="83.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">14 G</text><rect x="130" y="64.0" width="300" height="26.0" fill="#d9e4ec" stroke="#8aa"/><text x="450.0" y="83.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">≈ 270–300 mL/min</text><rect x="40" y="108" width="90" height="34" rx="6" fill="#9e9e9e"/><text x="85.0" y="131.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">16 G</text><rect x="130" y="113.8" width="300" height="22.4" fill="#d9e4ec" stroke="#8aa"/><text x="450.0" y="131.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">≈ 180–220 mL/min</text><rect x="40" y="156" width="90" height="34" rx="6" fill="#2e9d4a"/><text x="85.0" y="179.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">18 G</text><rect x="130" y="163.6" width="300" height="18.8" fill="#d9e4ec" stroke="#8aa"/><text x="450.0" y="179.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">≈ 90–100 mL/min</text><rect x="40" y="204" width="90" height="34" rx="6" fill="#ec6fa2"/><text x="85.0" y="227.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">20 G</text><rect x="130" y="213.4" width="300" height="15.2" fill="#d9e4ec" stroke="#8aa"/><text x="450.0" y="227.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">≈ 55–60 mL/min</text><rect x="40" y="252" width="90" height="34" rx="6" fill="#2b6cb0"/><text x="85.0" y="275.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">22 G</text><rect x="130" y="263.2" width="300" height="11.6" fill="#d9e4ec" stroke="#8aa"/><text x="450.0" y="275.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">≈ 30–35 mL/min</text><rect x="40" y="300" width="90" height="34" rx="6" fill="#f4c430"/><text x="85.0" y="323.0" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">24 G</text><rect x="130" y="313.0" width="300" height="8.0" fill="#d9e4ec" stroke="#8aa"/><text x="450.0" y="323.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">≈ 18–20 mL/min</text><text x="700.0" y="90.0" font-size="15" fill="#00573c" text-anchor="middle" font-weight="bold">Ley de Poiseuille</text><text x="700.0" y="120.0" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Flujo ∝ r⁴ / longitud</text><text x="700.0" y="152.0" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Doble el radio → 16 veces el flujo.</text><text x="700.0" y="168.2" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Más corto y más grueso = más rápido.</text><text x="700.0" y="184.5" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">En trauma y choque: 14–16 G.</text><text x="700.0" y="200.8" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">Transfusión: ≥ 18–20 G.</text><text x="450.0" y="355.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Los flujos son aproximados y cambian con la marca; el color sí es estándar (ISO 10555).</text></svg>