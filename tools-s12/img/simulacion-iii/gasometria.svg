<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" width="900" height="385" font-family="Helvetica,Arial,sans-serif"><rect width="900" height="385" fill="#fff"/><text x="450.0" y="26.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Gasometría arterial paso a paso</text><rect x="330" y="46" width="240" height="44" rx="10" fill="#e8f5ee" stroke="#00573c" stroke-width="2"/><text x="450.0" y="73.2" font-size="15" fill="#00573c" text-anchor="middle" font-weight="bold">1. pH (7.35–7.45)</text><line x1="400.0" y1="90.0" x2="236.8" y2="128.4" stroke="#333" stroke-width="2.5" stroke-linecap="round"/><path d="M230.0,130.0 L238.1,124.1 L239.9,131.7Z" fill="#333"/><line x1="500.0" y1="90.0" x2="663.2" y2="128.4" stroke="#333" stroke-width="2.5" stroke-linecap="round"/><path d="M670.0,130.0 L660.1,131.7 L661.9,124.1Z" fill="#333"/><rect x="100" y="132" width="260" height="44" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="2"/><text x="230.0" y="159.2" font-size="15" fill="#b3261e" text-anchor="middle" font-weight="bold">pH &lt; 7.35: ACIDEMIA</text><rect x="540" y="132" width="260" height="44" rx="10" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/><text x="670.0" y="159.2" font-size="15" fill="#2b6cb0" text-anchor="middle" font-weight="bold">pH &gt; 7.45: ALCALEMIA</text><rect x="20" y="224" width="200" height="58" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="120.0" y="249.2" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">PaCO₂ &gt; 45</text><text x="120.0" y="266.6" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">Acidosis respiratoria</text><rect x="240" y="224" width="200" height="58" rx="10" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="340.0" y="249.2" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">HCO₃⁻ &lt; 22</text><text x="340.0" y="266.6" font-size="14" fill="#b3261e" text-anchor="middle" font-weight="bold">Acidosis metabólica</text><rect x="460" y="224" width="200" height="58" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="560.0" y="249.2" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">PaCO₂ &lt; 35</text><text x="560.0" y="266.6" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Alcalosis respiratoria</text><rect x="680" y="224" width="200" height="58" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2"/><text x="780.0" y="249.2" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">HCO₃⁻ &gt; 26</text><text x="780.0" y="266.6" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Alcalosis metabólica</text><line x1="230.0" y1="176.0" x2="126.5" y2="219.3" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><path d="M120.0,222.0 L127.0,214.9 L130.0,222.0Z" fill="#b3261e"/><line x1="230.0" y1="176.0" x2="333.5" y2="219.3" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><path d="M340.0,222.0 L330.0,222.0 L333.0,214.9Z" fill="#b3261e"/><line x1="670.0" y1="176.0" x2="566.5" y2="219.3" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round"/><path d="M560.0,222.0 L567.0,214.9 L570.0,222.0Z" fill="#2b6cb0"/><line x1="670.0" y1="176.0" x2="773.5" y2="219.3" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round"/><path d="M780.0,222.0 L770.0,222.0 L773.0,214.9Z" fill="#2b6cb0"/><text x="450.0" y="314.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">2. ¿Qué lo explica? PaCO₂ (35–45) y HCO₃⁻ (22–26)</text><text x="450.0" y="340.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">3. ¿Compensa? Metabólica: Winter → PaCO₂ esperada = 1.5 × HCO₃⁻ + 8 ± 2</text><text x="450.0" y="366.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">4. Si es acidosis metabólica: anion gap = Na⁺ − (Cl⁻ + HCO₃⁻); normal 8–12</text></svg>