<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Helvetica,Arial,sans-serif"><rect width="960" height="360" fill="#fff"/><text x="450.0" y="26.0" font-size="18" fill="#00573c" text-anchor="middle" font-weight="bold">Lesiones por presión: estadios</text><rect x="20" y="60" width="200" height="22" fill="#f6d2b8"/><rect x="20" y="82" width="200" height="50" fill="#f2b5a0"/><rect x="20" y="132" width="200" height="48" fill="#fde7a7"/><rect x="20" y="180" width="200" height="40" fill="#d9776a"/><rect x="20" y="220" width="200" height="30" fill="#e9e3d6"/><ellipse cx="120.0" cy="70" rx="45" ry="9" fill="#d0453a" opacity=".55"/><text x="120.0" y="280.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Estadio 1</text><text x="120.0" y="296.2" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Eritema que no blanquea;</text><text x="120.0" y="312.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">piel íntegra</text><text x="120" y="280" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle" dy="-1"></text><rect x="240" y="60" width="200" height="22" fill="#f6d2b8"/><rect x="240" y="82" width="200" height="50" fill="#f2b5a0"/><rect x="240" y="132" width="200" height="48" fill="#fde7a7"/><rect x="240" y="180" width="200" height="40" fill="#d9776a"/><rect x="240" y="220" width="200" height="30" fill="#e9e3d6"/><path d="M300.0,60 Q340.0,100 380.0,60Z" fill="#e37a7a"/><text x="340.0" y="280.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Estadio 2</text><text x="340.0" y="296.2" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Pérdida parcial: epidermis</text><text x="340.0" y="312.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">y/o dermis, flictena</text><text x="340" y="280" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle" dy="-1"></text><rect x="460" y="60" width="200" height="22" fill="#f6d2b8"/><rect x="460" y="82" width="200" height="50" fill="#f2b5a0"/><rect x="460" y="132" width="200" height="48" fill="#fde7a7"/><rect x="460" y="180" width="200" height="40" fill="#d9776a"/><rect x="460" y="220" width="200" height="30" fill="#e9e3d6"/><path d="M510.0,60 Q515.0,160 560.0,165 Q605.0,160 610.0,60Z" fill="#c74b4b"/><path d="M530.0,150 Q560.0,170 590.0,150" stroke="#f5d06f" stroke-width="6" fill="none"/><text x="560.0" y="280.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Estadio 3</text><text x="560.0" y="296.2" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Pérdida total de piel;</text><text x="560.0" y="312.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">grasa visible, sin músculo</text><text x="560" y="280" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle" dy="-1"></text><rect x="680" y="60" width="200" height="22" fill="#f6d2b8"/><rect x="680" y="82" width="200" height="50" fill="#f2b5a0"/><rect x="680" y="132" width="200" height="48" fill="#fde7a7"/><rect x="680" y="180" width="200" height="40" fill="#d9776a"/><rect x="680" y="220" width="200" height="30" fill="#e9e3d6"/><path d="M725.0,60 Q730.0,240 780.0,245 Q830.0,240 835.0,60Z" fill="#a83232"/><rect x="760.0" y="222" width="40" height="22" fill="#f4f1ea" stroke="#888"/><text x="780.0" y="280.0" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Estadio 4</text><text x="780.0" y="296.2" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">Exposición de músculo,</text><text x="780.0" y="312.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">tendón o hueso</text><text x="780" y="280" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle" dy="-1"></text><text x="890.0" y="75.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Epidermis</text><text x="890.0" y="111.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Dermis</text><text x="890.0" y="160.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Grasa</text><text x="890.0" y="204.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Músculo</text><text x="890.0" y="239.0" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Hueso</text><text x="450.0" y="345.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">También existen: no estadificable (lecho cubierto por esfacelo/escara) y lesión de tejidos profundos (morada).</text></svg>