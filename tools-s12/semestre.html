<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../fonts/g973afc81ad.css">
<style>
/* __LAYOUT__ */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#e9e5dc; --ink:#17201c; --muted:#5c6660; --line:#d9d3c6;
  --accent:#00573c; --orange:#f26b21; --glass:#eef5f4;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#171f1c; --surface-2:#202a26; --ink:#e6ede9; --muted:#9caba4; --line:#2d3a35;
  --accent:#7fd3a8; --glass:#1a2724; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#171f1c; --surface-2:#202a26; --ink:#e6ede9; --muted:#9caba4; --line:#2d3a35;
  --accent:#7fd3a8; --glass:#1a2724; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

header.hero{padding-block:calc(44px + env(safe-area-inset-top,0px)) 28px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,var(--accent) 0 70%,var(--orange) 70%)}
.kicker{font:500 .78rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.1rem,5vw,3.3rem);line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:12px 0 0;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;font-size:.9rem;color:var(--muted)}
.stats b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-size:1.05rem;margin-right:6px;font-variant-numeric:tabular-nums}
.deco{position:absolute;right:max(16px,calc(50% - 560px));top:calc(30px + env(safe-area-inset-top,0px));width:190px;height:150px;opacity:.9;pointer-events:none}
@media (max-width:760px){.deco{display:none}}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:22px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 .88rem var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.find{margin-left:auto;flex:1 1 220px;max-width:300px}
.find input{width:100%;font:inherit;font-size:.95rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding-block:22px 40px}
.item{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;min-width:0;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.item:hover{transform:translateY(-2px);border-color:var(--sw);box-shadow:0 14px 30px -20px rgba(0,0,0,.45)}
.fbody{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}
.subject{font:700 .72rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xtra{font:700 .66rem var(--font-mono);letter-spacing:.06em;background:var(--orange);color:#fff;border-radius:5px;padding:1px 6px}
.item h2{font-family:var(--font-display);font-size:1.45rem;line-height:1.15;margin:0;text-wrap:balance}
.item p{margin:0;color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px}
.tags span{font-size:.75rem;background:var(--surface-2);color:var(--ink);padding:2px 8px;border-radius:5px}
.open{font:600 .9rem var(--font-body);color:var(--accent);margin-top:6px}
.empty{grid-column:1/-1;color:var(--muted);font-style:italic}

/* 1er semestre: portaobjetos (laminilla de microscopio) */
body.slides .item{border-radius:10px;overflow:hidden}
body.slides .top{height:96px;display:grid;grid-template-columns:34% 1fr;background:var(--glass);border-bottom:1px solid var(--line)}
body.slides .label{background:var(--sw);color:#fff;padding:12px 12px;display:flex;flex-direction:column;justify-content:space-between;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px)}
body.slides .label .code{font:600 .8rem var(--font-mono);letter-spacing:.08em}
body.slides .label .n{font:500 .7rem var(--font-mono);opacity:.85}
body.slides .spec{position:relative;display:grid;place-items:center}
body.slides .spec i{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--sw) 30%,transparent),color-mix(in srgb,var(--sw) 70%,transparent));border:2px solid color-mix(in srgb,var(--sw) 55%,transparent);box-shadow:inset 0 0 0 7px color-mix(in srgb,var(--sw) 12%,transparent)}
body.slides .spec b{position:absolute;right:10px;bottom:6px;font:700 2.6rem/1 var(--font-display);color:var(--sw);opacity:.18}
/* 2do semestre: libreta de laboratorio con espiral */
body.notebook .item{border-radius:6px 14px 14px 6px;padding-left:0;background-image:linear-gradient(90deg,transparent 22px,color-mix(in srgb,var(--orange) 35%,transparent) 22px 23.5px,transparent 23.5px)}
body.notebook .top{height:92px;background:var(--sw);border-radius:5px 13px 0 0;position:relative;display:flex;align-items:flex-end;padding:12px 16px 12px 34px;overflow:hidden}
body.notebook .top::before{content:"";position:absolute;left:8px;top:10px;bottom:-200px;width:12px;background:radial-gradient(circle,var(--bg) 0 4px,transparent 4.5px) 0 0/12px 16px repeat-y}
body.notebook .top .code{font:500 .78rem var(--font-mono);letter-spacing:.08em;color:#fff;opacity:.92}
body.notebook .top b{position:absolute;right:12px;top:-14px;font:700 6.5rem/1 var(--font-display);color:#fff;opacity:.16}
body.notebook .fbody{padding-left:36px;background-image:repeating-linear-gradient(180deg,transparent 0 27px,color-mix(in srgb,var(--line) 70%,transparent) 27px 28px)}

.others{border-top:1px dashed var(--line);padding-block:22px 72px}
.others h3{font:700 .78rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.others p{color:var(--muted);font-size:.92rem;margin:0 0 12px;max-width:70ch}
.others ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.others li{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:.9rem}
.others li small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.item{transition:none}.item:hover{transform:none}}

/* Visor */
#viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line);background:var(--surface);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.vbar .dot{width:12px;height:12px;border-radius:3px;background:var(--vsw);flex:0 0 auto}
.vbar .vt{font-family:var(--font-display);font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.vbtn{font:600 .88rem var(--font-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.vbtn:hover{border-color:var(--accent)}
#frame{flex:1;width:100%;border:0;background:var(--bg)}
.vload{position:absolute;inset:60px 0 auto;text-align:center;color:var(--muted)}
@media (max-width:520px){.vbtn.solo{display:none}}
</style></head><body class="__BODYCLASS__">

<header class="hero">
  <div class="wrap">
    __DECO__
    <p class="kicker">Medicina UDLAP · Plan 2014 · __KICKER__</p>
    <h1>__TITLE__</h1>
    <p class="lede">__LEDE__</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por materia"></div>
    <div class="find"><input id="find" type="search" placeholder="Buscar tema, estructura, concepto…" aria-label="Buscar en el semestre"></div>
  </div>
  <div class="grid" id="grid"></div>
  <section class="others" aria-label="Otras materias del semestre">
    <h3>Otras materias del semestre</h3>
    <p>Materias de formación general del plan: no tienen guía de estudio médica.</p>
    <ul id="others"></ul>
  </section>
</main>

<div id="viewer" hidden>
  <div class="vbar">
    <button class="vbtn" id="back" type="button">← __BACK__</button>
    <span class="dot"></span>
    <span class="vt" id="vtitle"></span>
    <a class="vbtn solo" id="solo" href="#" target="_blank" rel="noopener">Abrir solo ↗</a>
  </div>
  <p class="vload" id="vload">Cargando…</p>
  <iframe id="frame" title="Guía"></iframe>
</div>

<script>
/* Para añadir una guía: agregar su archivo en tools-s12/guias/ y correr tools-s12/build.py */
const ARTEFACTOS = __ARTEFACTOS__;
const OTRAS = __OTRAS__;
const SKIN = "__BODYCLASS__";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filtro = "Todas";

function stats(){
  const materias = new Set(ARTEFACTOS.map(a => a.materia));
  const n = k => ARTEFACTOS.reduce((s,a) => s + a[k], 0);
  $("#stats").innerHTML =
    `<span><b>${ARTEFACTOS.length}</b>guías</span>` +
    `<span><b>${materias.size}</b>materias</span>` +
    `<span><b>${n("ntemas")}</b>temas</span>` +
    `<span><b>${n("ntarjetas")}</b>tarjetas</span>` +
    `<span><b>${n("npreguntas")}</b>preguntas</span>`;
  $("#others").innerHTML = OTRAS.map(o => `<li>${esc(o[0])}${o[1]?` <small>· ${esc(o[1])}</small>`:""}</li>`).join("");
}
function chips(){
  const mats = ["Todas", ...new Set(ARTEFACTOS.map(a => a.materia))];
  $("#chips").innerHTML = mats.map(m => `<button type="button" aria-pressed="${m===filtro}" data-m="${esc(m)}">${esc(m)}</button>`).join("");
}
function topOf(a){
  return SKIN==="slides"
    ? `<div class="top"><div class="label"><span class="code">${esc(a.codigo)}</span><span class="n">${a.ntemas} temas</span></div><div class="spec"><i></i><b>${esc(a.materia[0])}</b></div></div>`
    : `<div class="top"><span class="code">${esc(a.codigo)} · ${a.ntemas} temas</span><b>${esc(a.materia[0])}</b></div>`;
}
function render(){
  const q = $("#find").value.trim().toLowerCase();
  const list = ARTEFACTOS.filter(a =>
    (filtro==="Todas" || a.materia===filtro) &&
    (!q || [a.titulo,a.materia,a.descripcion,...a.temas].join(" ").toLowerCase().includes(q)));
  let html = list.map(a => `
    <button class="item" type="button" data-id="${a.id}" style="--sw:${a.color}">
      ${topOf(a)}
      <div class="fbody">
        <span class="subject">${esc(a.materia)}${a.extra?`<span class="xtra">Extra · no cuenta en promedio</span>`:""}</span>
        <h2>${esc(a.titulo)}</h2>
        <p>${esc(a.descripcion)}</p>
        <div class="tags">${a.modos.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
        <span class="open">Abrir →</span>
      </div>
    </button>`).join("");
  if (!list.length) html = `<p class="empty">Nada coincide con “${esc(q)}”.</p>`;
  $("#grid").innerHTML = html;
}

const cache = {};
async function abrir(id){
  const a = ARTEFACTOS.find(x => x.id===id);
  if (!a) return cerrar(false);
  $("#vtitle").textContent = a.titulo;
  $("#viewer").style.setProperty("--vsw", a.color);
  $("#solo").href = `guias/${a.id}.html`;
  $("#viewer").hidden = false;
  document.body.style.overflow = "hidden";
  $("#vload").hidden = false;
  const fr = $("#frame");
  fr.onload = () => { $("#vload").hidden = true; };
  fr.src = `guias/${a.id}.html`;
}
function cerrar(push=true){
  $("#viewer").hidden = true;
  document.body.style.overflow = "";
  $("#frame").removeAttribute("src");
  if (push && location.hash) history.replaceState(null, "", location.pathname + location.search);
}
function ruta(){
  const id = location.hash.slice(1);
  if (id && ARTEFACTOS.some(a => a.id===id)) abrir(id); else cerrar(false);
}

$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.m; chips(); render();
});
$("#find").addEventListener("input", render);
$("#grid").addEventListener("click", e => {
  const f = e.target.closest(".item"); if (!f) return;
  location.hash = f.dataset.id;
});
$("#back").addEventListener("click", () => cerrar());
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#viewer").hidden) cerrar(); });
window.addEventListener("hashchange", ruta);

stats(); chips(); render(); ruta();
</script>
</body></html>
